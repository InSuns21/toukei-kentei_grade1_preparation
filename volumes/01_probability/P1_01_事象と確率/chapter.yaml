id: "P1-01"
title: "事象と確率"
volume: "probability"
status: reviewed
prerequisites:
  - F0-01
official_scope:
  - 確率の計算
  - 包除原理
learning_objectives:
  - 標本空間・事象・補集合・和・積・差を正確に表現できる
  - 確率公理から基本公式を導ける
  - 包除原理を重複の意味とともに使える
  - 単調性と確率の連続性を極限問題に使える
  - 数え上げと確率モデルを分離して立式できる
  - 事象を分割して20〜30分の論述答案を構成できる
definitions:
  - { id: P1-DEF-01, name: 標本空間と事象 }
  - { id: P1-DEF-02, name: 確率測度 }
  - { id: P1-DEF-03, name: 排反と分割 }
  - { id: P1-DEF-03A, name: 有限等確率モデルと一様無作為抽出 }
  - { id: P1-DEF-04, name: limsup事象とliminf事象 }
theorems:
  - { id: P1-THM-01, name: 補集合・差・単調性 }
  - { id: P1-THM-02, name: 加法公式と包除原理 }
  - { id: P1-THM-03, name: 下からの連続性 }
  - { id: P1-THM-04, name: 上からの連続性 }
canonical_examples:
  - 三事象の包除原理
  - 重複分類の確率
  - 少なくとも一度起こる事象
  - limsup事象の読み替え
problem_patterns: [SET-1, IE-1, COUNT-1, LIMIT-1, ANSWER-1]
past_exam_alignment:
  - { id: MATH-2022-Q1, current_skills: [事象演算, 確率の上下界, 実現可能性], later_skills: [独立性, 検定のサイズ] }
  - { id: MATH-2022-Q2, current_skills: [領域事象, 確率計算], later_skills: [条件付き密度, 相関] }
integrated_exam_problems: [P1-DRILL-01]
exercise_counts: { level_a: 3, level_b: 3, level_c: 3, level_d: 1 }
level_distribution_note: "確率公理を初導入する基礎章のためA/Bを厚くし、別枠の30分ドリルをLevel C相当の必須問題としてC01--C03と合わせて評価する。"
estimated_hours: { reading: 4, exercises: 8, review: 3 }
completion_criteria:
  level_b_score_at_least: 0.85
  level_c_score_at_least: 0.70
  exam_problem_minutes_at_most: 30
