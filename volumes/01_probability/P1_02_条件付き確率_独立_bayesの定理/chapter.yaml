id: "P1-02"
title: "条件付き確率・独立・Bayesの定理"
volume: "probability"
status: reviewed
prerequisites:
  - P1-01
official_scope:
  - 条件付き確率
  - 統計的独立
  - ベイズの定理
learning_objectives:
  - 条件付き確率の分母となる条件事象と標本空間の縮約を説明できる
  - 乗法公式と全確率公式を事象の分割から導ける
  - 独立と排反、対独立と相互独立を区別できる
  - Bayesの定理で事前確率・尤度・周辺確率・事後確率を識別できる
  - Level Cを20〜30分で本番答案にまとめられる
definitions:
  - { id: P1-DEF-05, name: 条件付き確率 }
  - { id: P1-DEF-06, name: 事象の独立 }
  - { id: P1-DEF-07, name: 相互独立と対独立 }
  - { id: P1-DEF-08, name: 事象の分割 }
theorems:
  - { id: P1-THM-05, name: 乗法公式 }
  - { id: P1-THM-06, name: 全確率公式 }
  - { id: P1-THM-06A, name: 条件付き全確率公式 }
  - { id: P1-THM-07, name: Bayesの定理 }
  - { id: P1-THM-08, name: 独立性と補事象 }
canonical_examples:
  - 有病率と検査精度から陽性的中率を求める
  - 非復元抽出を乗法公式で計算する
  - 対独立だが相互独立でない三事象
problem_patterns: [COND-1, MULT-1, INDEP-1, TOTAL-1, BAYES-1, ANSWER-1]
exercise_counts: { level_a: 3, level_b: 3, level_c: 5, level_d: 1 }
estimated_hours: { reading: 5, exercises: 10, review: 3 }
completion_criteria:
  level_b_score_at_least: 0.85
  level_c_score_at_least: 0.70
  exam_problem_minutes_at_most: 30
