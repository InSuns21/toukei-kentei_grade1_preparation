id: "P3-01"
title: "主要な離散分布"
volume: "distributions"
status: reviewed
prerequisites: [P2-02]
official_scope: [ベルヌーイ分布, 二項分布, 超幾何分布, 幾何分布, ポアソン分布, 負の二項分布, 多項分布]
learning_objectives:
  - 試行構造から適切な離散分布を選べる
  - 各分布の台・パラメータ・PMF・平均分散を再現できる
  - 復元・非復元、固定試行数・固定成功数を区別できる
  - PGFと独立和から再生性を導ける
  - 多項分布の共分散構造を説明できる
definitions:
  - { id: P3-DEF-01, name: Bernoulli分布と二項分布 }
  - { id: P3-DEF-02, name: 超幾何分布 }
  - { id: P3-DEF-03, name: 幾何分布と負の二項分布 }
  - { id: P3-DEF-04, name: Poisson分布 }
  - { id: P3-DEF-05, name: 多項分布 }
theorems:
  - { id: P3-THM-01, name: 離散分布の母関数とモーメント }
  - { id: P3-THM-02, name: 二項・Poisson分布の再生性 }
  - { id: P3-THM-03, name: 超幾何分布の有限母集団補正 }
  - { id: P3-THM-04, name: 多項分布の共分散 }
canonical_examples: [復元抽出と非復元抽出, 待ち時間, 稀な件数, 多カテゴリ度数]
problem_patterns: [MODEL-1, BINOM-1, HYPER-1, WAIT-1, POIS-1, MULTI-1, PGF-1, ANSWER-1]
exercise_counts: { level_a: 4, level_b: 3, level_c: 5, level_d: 1 }
estimated_hours: { reading: 6, exercises: 11, review: 3 }
completion_criteria:
  level_b_score_at_least: 0.85
  level_c_score_at_least: 0.70
  exam_problem_minutes_at_most: 30
