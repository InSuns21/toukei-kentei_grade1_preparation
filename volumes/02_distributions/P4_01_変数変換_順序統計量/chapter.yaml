id: "P4-01"
title: "変数変換・順序統計量"
volume: "distributions"
status: reviewed
prerequisites: [P3-03]
official_scope: [1変数変換, 多変数変換, Jacobian, 和, 差, 積, 比, 最大値, 最小値, 順序統計量]
learning_objectives:
  - 単調・非単調な一変数変換で全逆像を数えられる
  - 多変数変換で像の領域と絶対Jacobianを正しく書ける
  - 和・差・積・比の密度公式を導ける
  - 最大・最小・第k順序統計量の分布を再現できる
  - 二つの順序統計量の同時密度を組合せから導ける
definitions:
  - { id: P4-DEF-01, name: 一変数変換と逆像 }
  - { id: P4-DEF-02, name: 多変数変換とJacobian }
  - { id: P4-DEF-03, name: 順序統計量 }
theorems:
  - { id: P4-THM-01, name: 一変数密度変換公式 }
  - { id: P4-THM-02, name: 多変数密度変換公式 }
  - { id: P4-THM-03, name: 和差積比の密度 }
  - { id: P4-THM-04, name: 最大最小と第k順序統計量 }
  - { id: P4-THM-05, name: 順序統計量の同時密度 }
  - { id: P4-THM-06, name: 確率積分変換とBeta分布 }
