  - { id: P3C-THM-02, name: Gamma積分とGamma分布のモーメント }
  - { id: P3C-THM-03, name: Beta積分とBeta分布のモーメント }
  - { id: P3C-THM-04, name: 指数・Weibull変換とハザード }
  - { id: P3C-THM-05, name: 対数変換で得られる分布 }
canonical_examples: [区間上の一様性, 正規標準化, 待ち時間, 割合, 重い裾, 寿命ハザード, 対数尺度]
