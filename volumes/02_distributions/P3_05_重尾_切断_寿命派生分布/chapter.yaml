learning_objectives:
  - Pareto・Laplace・Rayleighの密度、分布関数、モーメントを導出できる
  - 切断・打切りで観測密度と尤度がどう変わるかを説明できる
  - 生存関数、ハザード、累積ハザード、平均残存寿命を相互に計算できる
  - 寿命データから尺度・形状母数を推定し、故障率の増減を解釈できる
