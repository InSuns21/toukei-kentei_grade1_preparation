schema_version: 2
checked_at: "2026-09-05"
policy:
  official_problem_source: "統計検定公式公開問題または日本統計学会公式認定問題集"
  third_party_role: "年度別テーマ索引と別解確認のみ"
  reproduction: "問題文・図表は転載せず、年度・科目・大問番号で参照する"
  evidence_rule: "テーマ確認に第三者索引だけを用いたentryはofficial_problemと表示しない"
sources:
  official_exam: "https://www.toukei-kentei.jp/grade/grade1/"
  official_past: "https://www.toukei-kentei.jp/preparation/kakomon/"
  official_books: "https://www.toukei-kentei.jp/preparation/books/"
  official_archive_note: "公式過去問題ページは掲載年度が更新される。2024年問題は現在の公式問題集［2022〜2024年］を正本として参照する"
  starpentagon: "https://starpentagon.net/analytics/stat_certificate_past_problems/"
  satolog: "https://satolog.org/toukeikentei-grade1-kaitouitiran/"
  academ_aid: "https://academ-aid.com/statistics/jssc-toc"
retired_sources:
  official_2024_math:
    url: "https://www.toukei-kentei.jp/hubfs/files/past/pbt/202411grade1suri.pdf"
    status: unavailable_as_of_2026-08-11
    replacement: official_books
evidence_profiles:
  math_topic: &math_topic
    source_type: third_party_topic_index
    confirmed_by: [academ_aid]
    confidence: medium
    problem_source: official_books
  math_crosschecked: &math_crosschecked
    source_type: third_party_topic_index
    confirmed_by: [academ_aid, satolog]
    confidence: high
    problem_source: official_books
  science_topic: &science_topic
    source_type: third_party_topic_index
    confirmed_by: [starpentagon]
    confidence: medium
    problem_source: official_books
  science_official_2025: &science_official_2025
    source_type: official_problem
    confirmed_by: [official_past]
    confidence: high
    problem_source: official_past
