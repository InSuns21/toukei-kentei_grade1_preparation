items:
  - id: engqc-xbar-r-chart-limits
    note: 旧pilotの既知sigmaによる3sigma Xbar管理限界を吸収し、既知sigma型とRbar推定型を同じ標本平均の標準誤差原理から扱う正本へ強化する。
    sections:
      問題: |
        $\overline X$ 管理図について次の2場合の管理限界を求めよ。

        1. 工程平均 $\mu=10$、工程標準偏差 $\sigma=2$ が既知、群サイズ $n=4$ とする。3標準偏差管理限界を求めよ。
        2. Phase I データから $\overline{\overline X}=20$、$\overline R=4$ を得た。群サイズ5に対する管理図定数が $A_2=0.577$ のとき、$\overline X$ 管理図の管理限界を求めよ。
      使用公式・定理: |
        工程が管理状態にあり各観測の標準偏差が $\sigma$ なら、群平均の標準偏差は
        $$
        \operatorname{SD}(\overline X)=\frac{\sigma}{\sqrt n}.
        $$
        $\mu,\sigma$ が既知なら3標準偏差限界は
        $$
        UCL=\mu+3\frac{\sigma}{\sqrt n},\qquad
        CL=\mu,\qquad
        LCL=\mu-3\frac{\sigma}{\sqrt n}.
        $$

        $\sigma$ を群内範囲から推定する通常の $\overline X$--$R$ 管理図では、群サイズごとの定数 $A_2$ を使って
        $$
        UCL=\overline{\overline X}+A_2\overline R,\qquad
        CL=\overline{\overline X},\qquad
        LCL=\overline{\overline X}-A_2\overline R
        $$
        と書く。$A_2\overline R$ は「推定した群平均の3標準誤差幅」に対応する。
      一手／方針: |
        どちらも本質は **中心線 $\pm$ 群平均の3標準誤差** である。$\sigma$ が既知なら $3\sigma/\sqrt n$ を直接使い、未知で $\overline R$ から推定するときはその換算を含む $A_2\overline R$ を使う。
      答え: |
        1. 既知 $\sigma$ の場合は
        $$
        UCL=13,\qquad CL=10,\qquad LCL=7.
        $$
        2. $\overline R$ から推定する場合は
        $$
        UCL=22.308,\qquad CL=20,\qquad LCL=17.692.
        $$
      計算例: |
        ### 1. $\sigma$ が既知

        まず群平均の標準偏差は
        $$
        \frac{\sigma}{\sqrt n}
        =\frac{2}{\sqrt4}
        =1.
        $$
        したがって3標準偏差幅は
        $$
        3\frac{\sigma}{\sqrt n}=3.
        $$
        よって
        $$
        UCL=10+3=13,
        $$
        $$
        LCL=10-3=7.
        $$

        ### 2. $\sigma$ を $\overline R$ から推定

        管理限界の半幅は
        $$
        A_2\overline R
        =0.577\times4
        =2.308.
        $$
        したがって
        $$
        UCL=20+2.308=22.308,
        $$
        $$
        LCL=20-2.308=17.692.
        $$
        例えば群平均17.5は $17.5<17.692$ なので下方管理限界外である。
      注意: |
        個々の観測値の標準偏差 $\sigma$ と、群平均の標準偏差 $\sigma/\sqrt n$ を混同しない。また $\overline X$--$R$ 管理図では、平均側を解釈する前にR管理図で群内ばらつきが安定しているか確認する。
  - id: design-interaction-plot
    note: 旧pilotの2因子セル平均による差の差計算を吸収し、交互作用プロットの認識と数値計算を一枚へ統合する。
    sections:
      問題: |
        2因子実験で、横軸を因子A、線を因子Bの各水準とする交互作用プロットを考える。

        1. 線が平行・非平行・交差する場合をどう解釈するか。
        2. セル平均を $(\mu_{11},\mu_{12},\mu_{21},\mu_{22})=(10,14,12,20)$ とする。第1添字を因子A、第2添字を因子Bの水準とするとき、交互作用を表す「差の差」を求めよ。
      使用公式・定理: |
        2水準×2水準の場合、Aの単純効果がB水準でどれだけ変わるかは
        $$
        \Delta_{AB}
        =(\mu_{22}-\mu_{12})-(\mu_{21}-\mu_{11})
        $$
        で測れる。これは「A効果の差」であり、同値に「B効果の差」として計算しても符号規約を揃えれば同じ交互作用を表す。

        加法モデル
        $$
        \mu_{ij}=\mu+\alpha_i+\beta_j
        $$
        なら母集団で $\Delta_{AB}=0$ になる。
      一手／方針: |
        交互作用は「Aの効果がBの水準によって変わるか」を見る。図なら線の傾きが同じか、数値なら **単純効果を2本計算してから差を取る**。
      答え: |
        平行なら交互作用なし、非平行なら交互作用が示唆され、交差は効果の向きまで逆転する強い非加法性を示す。

        数値例の差の差は
        $$
        \Delta_{AB}=4.
        $$
      計算例: |
        Bが水準1のときのA効果は
        $$
        \mu_{21}-\mu_{11}
        =12-10
        =2.
        $$
        Bが水準2のときのA効果は
        $$
        \mu_{22}-\mu_{12}
        =20-14
        =6.
        $$
        したがって差の差は
        $$
        \begin{aligned}
        \Delta_{AB}
        &=6-2\\
        &=4.
        \end{aligned}
        $$
        Aの効果がBの水準によって2から6へ変わっているので、セル平均は加法的ではない。
      注意: |
        標本セル平均から得た差の差が0でないだけで、母集団の交互作用が統計的に有意とは断定できない。反復データがあるなら交互作用平方和・F検定や区間推定で標本変動も評価する。
