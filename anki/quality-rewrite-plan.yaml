items:
  - id: mv-factor-model-covariance
    note: engineering側の1因子モデルの行列計算例を吸収し、共分散分解と共通性を一枚で追えるようにする。
    metadata:
      title: 因子分析の共分散分解と共通性を計算する
      topic: factor-analysis-covariance-communality
      hashtags: [因子分析, 因子負荷量, 分散共分散行列, 共通性, 独自性]
    sections:
      計算例: |
        まず1因子モデルで
        $$
        \boldsymbol\lambda=
        \begin{pmatrix}0.8\\0.6\end{pmatrix},
        \qquad
        \boldsymbol\Psi=
        \begin{pmatrix}0.36&0\\0&0.64\end{pmatrix}
        $$
        とする。負荷量ベクトルの外積は
        $$
        \begin{aligned}
        \boldsymbol\lambda\boldsymbol\lambda^{\mathsf T}
        &=
        \begin{pmatrix}0.8\\0.6\end{pmatrix}
        \begin{pmatrix}0.8&0.6\end{pmatrix}\\
        &=
        \begin{pmatrix}
        0.64&0.48\\
        0.48&0.36
        \end{pmatrix}.
        \end{aligned}
        $$
        したがって
        $$
        \begin{aligned}
        \boldsymbol\Sigma
        &=\boldsymbol\lambda\boldsymbol\lambda^{\mathsf T}+\boldsymbol\Psi\\
        &=
        \begin{pmatrix}
        0.64&0.48\\
        0.48&0.36
        \end{pmatrix}
        +
        \begin{pmatrix}
        0.36&0\\
        0&0.64
        \end{pmatrix}\\
        &=
        \begin{pmatrix}
        1&0.48\\
        0.48&1
        \end{pmatrix}.
        \end{aligned}
        $$
        対角が1なのは、各標準化変数について
        $$
        \lambda_i^2+\psi_i=1
        $$
        となっているためである。

        次に2因子への負荷量が $(0.6,0.5)$ の標準化変数を考えると
        $$
        \begin{aligned}
        h_i^2
        &=0.6^2+0.5^2\\
        &=0.36+0.25\\
        &=0.61,
        \end{aligned}
        $$
        $$
        \psi_i=1-0.61=0.39.
        $$
        つまり分散の61%を共通因子部分、39%を独自部分が担う。
      注意: |
        PCAは観測分散を直交方向へ分解する方法で、因子分析のような確率的潜在因子＋独自誤差モデルとは異なる。共分散分解 $\Lambda\Lambda^{\mathsf T}+\Psi$ には共通因子と独自誤差の無相関が必要である。

        直交因子なら共通性は負荷量平方和で読める。斜交回転では因子同士が相関するため、単純な負荷量平方和の解釈には注意する。
