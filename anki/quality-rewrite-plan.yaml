items:
  - id: prob-cdf-from-density
    note: 累積分布関数を中心に、離散の累積・連続の積分・微分による密度復元・跳びによる点確率復元を一枚へ統合する。
    sections:
      使用公式・定理: |
        累積分布関数は常に
        $$
        F_X(x)=P(X\le x)
        $$
        である。

        離散型では確率質量を足して
        $$
        F_X(x)=\sum_{u\le x}p_X(u),
        $$
        絶対連続型では確率密度関数を積分して
        $$
        F_X(x)=\int_{-\infty}^x f_X(u)\,du
        $$
        と得る。

        逆向きには、絶対連続な部分で累積分布関数が微分可能なら
        $$
        f_X(x)=F_X'(x).
        $$
        一方、点 $a$ の確率質量は微分ではなく跳び幅
        $$
        P(X=a)=F_X(a)-F_X(a-)
        $$
        で回収する。
      答え: |
        $f_X(x)=2x$（$0<x<1$）なら
        $$
        F_X(x)=\begin{cases}
        0,&x<0,\\
        x^2,&0\le x<1,\\
        1,&x\ge1.
        \end{cases}
        $$
      計算例: |
        連続型では $0\le x<1$ で
        $$
        F_X(x)=\int_0^x2u\,du=x^2.
        $$
        台の外も補って上の区分表示を得る。

        離散型の例として
        $$P(X=0)=\frac14,\qquad P(X=1)=\frac34$$
        なら
        $$
        F_X(x)=\begin{cases}
        0,&x<0,\\
        1/4,&0\le x<1,\\
        1,&x\ge1.
        \end{cases}
        $$

        逆向きに
        $$
        F_X(x)=\begin{cases}
        0,&x\le0,\\
        x^2,&0<x<1,\\
        1,&x\ge1
        \end{cases}
        $$
        なら、$0<x<1$ で
        $$f_X(x)=F_X'(x)=2x.$$

        また
        $$F_X(1-)=0.2,\qquad F_X(1)=0.5$$
        なら
        $$
        P(X=1)=0.5-0.2=0.3.
        $$
      一手: |
        累積分布関数を中心に考える。確率質量・確率密度関数からは左側の確率を集め、逆向きでは連続部分は微分、点質量は跳び幅を見る。
      注意: |
        混合分布では微分だけでは点質量を回収できない。累積分布関数は台の外も含めて0から1まで書き、右連続性を忘れない。
  - id: prob-joint-density-normalization
    note: 確率質量関数・確率密度関数・同時分布の正規化を「台全体で総確率1」という一つの原理へ統合する。
    sections:
      使用公式・定理: |
        正規化の原理は次元や離散・連続によらず
        $$
        \text{台全体の確率}=1
        $$
        である。

        離散型では
        $$
        \sum_{x\in\mathcal S}p_X(x)=1,
        $$
        連続型では
        $$
        \int_{\mathcal S}f_X(x)\,dx=1.
        $$
        2変量なら、それぞれ二重和・二重積分に置き換わる。
        先に台 $\mathcal S$ を確定し、その台だけを総和または積分する。
      答え: |
        $f_{X,Y}(x,y)=c$（$0<y<x<2$）では
        $$c=\frac12.$$
      計算例: |
        離散1変量で
        $$p_X(x)=c(x+1),\qquad x=0,1,2$$
        なら
        $$
        1=c+2c+3c=6c,
        $$
        よって
        $$c=\frac16.$$

        連続1変量で
        $$f_X(x)=cx,\qquad0<x<2$$
        なら
        $$
        1=\int_0^2cx\,dx=2c,
        $$
        したがって
        $$c=\frac12.$$

        同時密度では台が三角形なので
        $$
        \begin{aligned}
        1
        &=\int_0^2\int_0^x c\,dy\,dx\\
        &=\int_0^2cx\,dx\\
        &=2c,
        \end{aligned}
        $$
        よってやはり
        $$c=\frac12.$$
      一手: |
        未知定数を見たら、まず台を列挙または図示し、その台全体で総確率を1にする。離散なら足し、連続なら積分する。
      注意: |
        確率密度関数は各点で1以下である必要はない。必要なのは非負性と、台全体の積分が1になることである。
  - id: prob-marginal-density
    note: 周辺化を離散の総和と連続の積分の共通操作として一枚へ統合する。
    sections:
      使用公式・定理: |
        同時分布から一方の変数を消す操作が周辺化である。離散型では
        $$
        p_X(x)=\sum_y p_{X,Y}(x,y),
        $$
        連続型では
        $$
        f_X(x)=\int_{-\infty}^{\infty}f_{X,Y}(x,y)\,dy.
        $$
        実際の総和範囲・積分範囲は同時分布の台から決める。
      答え: |
        $f_{X,Y}(x,y)=2$（$0<y<x<1$）では
        $$
        f_X(x)=2x,\qquad0<x<1.
        $$
      計算例: |
        連続型では $0<x<1$ を固定すると $0<y<x$ なので
        $$
        \begin{aligned}
        f_X(x)
        &=\int_0^x2\,dy\\
        &=2x.
        \end{aligned}
        $$
        検算すると
        $$\int_0^12x\,dx=1.$$

        離散型で
        $$
        p(0,0)=0.1,\quad p(0,1)=0.2,\quad
        p(1,0)=0.3,\quad p(1,1)=0.4
        $$
        なら、$Y$ を足し消して
        $$
        p_X(0)=0.1+0.2=0.3,
        $$
        $$
        p_X(1)=0.3+0.4=0.7.
        $$
      一手: |
        残したい変数を固定し、消したい変数について全て足すか積分する。範囲は式ではなく台から読む。
      注意: |
        三角形など変数依存の台を長方形として積分しない。離散表では行と列のどちらがどの変数かを先に確認する。
  - id: prob-conditional-density
    note: 条件付き分布を離散の確率質量関数と連続の確率密度関数で同じ「同時分布÷条件側の周辺分布」として統合する。
    sections:
      使用公式・定理: |
        条件側の周辺分布が正なら、離散型では
        $$
        p_{Y\mid X}(y\mid x)
        =\frac{p_{X,Y}(x,y)}{p_X(x)},
        $$
        連続型では
        $$
        f_{Y\mid X}(y\mid x)
        =\frac{f_{X,Y}(x,y)}{f_X(x)}.
        $$
        どちらも「条件 $X=x$ に対応する行・断面だけを取り出し、その中で総確率1になるよう正規化する」操作である。
      答え: |
        $f_{X,Y}(x,y)=2$（$0<y<x<1$）では
        $$
        f_{Y\mid X}(y\mid x)=\frac1x,
        \qquad0<y<x.
        $$
      計算例: |
        連続型では、まず
        $$f_X(x)=\int_0^x2\,dy=2x.$$
        したがって
        $$
        f_{Y\mid X}(y\mid x)
        =\frac{2}{2x}
        =\frac1x,
        \qquad0<y<x.
        $$
        確認すると
        $$
        \int_0^x\frac1x\,dy=1.
        $$

        離散型で
        $$
        p(0,0)=0.1,\quad p(0,1)=0.2,\quad
        p(1,0)=0.3,\quad p(1,1)=0.4
        $$
        とする。周辺確率は
        $$p_X(1)=0.3+0.4=0.7.$$
        よって
        $$
        P(Y=0\mid X=1)=\frac{0.3}{0.7}=\frac37,
        $$
        $$
        P(Y=1\mid X=1)=\frac{0.4}{0.7}=\frac47.
        $$
        2値の条件付き分布の和は1になる。
      一手: |
        条件付き分布では、まず条件側の周辺分布を求め、その値で同時分布の対応部分を割る。割った後も条件付きの台を保つ。
      注意: |
        分母は全確率1ではなく条件側の周辺確率・周辺密度である。連続型の $X=x$ は点確率でなく密度の比として扱う。
