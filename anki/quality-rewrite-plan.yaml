items:
  - id: prob-conditional-definition-direct
    note: 条件付き確率の定義と、その式を共通部分について解いた乗法公式を1枚で往復できるようにする。
    sections:
      使用公式・定理: |
        $P(B)>0$ のとき条件付き確率は
        $$
        P(A\mid B)=\frac{P(A\cap B)}{P(B)}.
        $$
        同じ式を $P(A\cap B)$ について解けば
        $$
        P(A\cap B)=P(A\mid B)P(B).
        $$
        したがって「条件付き確率を求める」と「共通部分へ戻す」は別公式ではなく同じ定義の往復である。
      答え: |
        $$
        P(A\mid B)=\frac{0.18}{0.30}=0.60.
        $$
      計算例: |
        まず定義をそのまま使う例では
        $$
        \begin{aligned}
        P(A\mid B)
        &=\frac{P(A\cap B)}{P(B)}\\
        &=\frac{0.18}{0.30}\\
        &=0.60.
        \end{aligned}
        $$
        逆向きに、$P(B)=0.4$, $P(A\mid B)=0.75$ が与えられたなら、同じ式の両辺へ $P(B)$ を掛けて
        $$
        \begin{aligned}
        P(A\cap B)
        &=P(A\mid B)P(B)\\
        &=0.75\cdot0.4\\
        &=0.30.
        \end{aligned}
        $$
        となる。
      一手: |
        条件記号の右側 $B$ が分母である。共通部分が欲しいなら分母を払って掛け算へ戻す。
      注意: |
        $P(A\mid B)$ と $P(B\mid A)$ は一般に異なる。ベイズの定理は、この向きの違う条件付き確率を周辺確率と尤度で結び直す。
  - id: prob-independent-events
    note: 独立性の積条件に加え、排反との違いを同じ数値で判定できるようにして認識カードを吸収する。
    sections:
      使用公式・定理: |
        2事象 $A,B$ の独立条件は
        $$
        P(A\cap B)=P(A)P(B).
        $$
        一方、排反は
        $$
        P(A\cap B)=0
        $$
        をいう。したがって $P(A)>0$, $P(B)>0$ の排反事象では
        $$
        P(A)P(B)>0=P(A\cap B)
        $$
        となり、独立ではない。
      答え: |
        2回の硬貨投げで「1回目が表」と「2回目が表」は独立である。独立性は共通部分と周辺確率の積を比較して判定する。
      計算例: |
        4結果
        $$
        (H,H),(H,T),(T,H),(T,T)
        $$
        が各 $1/4$ なので
        $$
        P(A)=\frac12,
        \qquad
        P(B)=\frac12,
        \qquad
        P(A\cap B)=\frac14.
        $$
        一方
        $$
        P(A)P(B)=\frac12\cdot\frac12=\frac14
        $$
        だから
        $$
        P(A\cap B)=P(A)P(B),
        $$
        よって独立である。

        対照的に、$P(C)=0.4$, $P(D)=0.5$, $P(C\cap D)=0$ なら $C,D$ は排反だが
        $$
        P(C)P(D)=0.4\cdot0.5=0.2\ne0=P(C\cap D),
        $$
        なので独立ではない。
      一手: |
        「同時に起きない」は排反、「一方の発生が他方の確率を変えない」は独立。言葉の印象でなく $P(A\cap B)$ と $P(A)P(B)$ を比較する。
      注意: |
        排反と独立を混同しない。3事象以上の相互独立では、ペアごとの積条件だけでなく3重以上の共通部分についても積条件が必要である。
  - id: prob-inclusion-exclusion-three
    note: 2事象版と3事象版を同一カードへ統合し、重なりを足し引きする原理を式と数値で追えるようにする。
    sections:
      使用公式・定理: |
        2事象では
        $$
        P(A\cup B)=P(A)+P(B)-P(A\cap B).
        $$
        3事象では
        $$
        \begin{aligned}
        P(A\cup B\cup C)
        &=P(A)+P(B)+P(C)\\
        &\quad-P(A\cap B)-P(A\cap C)-P(B\cap C)\\
        &\quad+P(A\cap B\cap C).
        \end{aligned}
        $$
        単独事象を足し、2重に数えたペア共通部分を引き、そこで引き過ぎた3重共通部分を再び足す。
      答え: |
        包除原理は「足す・ペアを引く・3重を戻す」の順で使う。2事象版は3事象版の $C=\varnothing$ とみなした特殊形である。
      計算例: |
        例えば
        $$
        P(A)=0.50,\quad P(B)=0.40,\quad P(C)=0.30,
        $$
        $$
        P(A\cap B)=0.20,\quad
        P(A\cap C)=0.10,\quad
        P(B\cap C)=0.08,
        $$
        $$
        P(A\cap B\cap C)=0.05
        $$
        とする。公式へ順に代入すると
        $$
        \begin{aligned}
        P(A\cup B\cup C)
        &=0.50+0.40+0.30\\
        &\quad-0.20-0.10-0.08+0.05\\
        &=1.20-0.38+0.05\\
        &=0.87.
        \end{aligned}
        $$
        2事象だけなら、例えば $P(A)=0.6$, $P(B)=0.5$, $P(A\cap B)=0.2$ から
        $$
        P(A\cup B)=0.6+0.5-0.2=0.9.
        $$
      一手: |
        まず単独確率を足す。次に二重計上されたペアの共通部分を引く。3事象なら最後に3重共通部分を1回戻す。
      注意: |
        単純に $P(A)+P(B)+P(C)$ とすると重複を多重計上する。3重共通部分の符号はプラスである。
  - id: prob-counting-sample-space
    note: 等確率な有限標本空間の原理と、順序あり・順序なしの数え上げを1枚で扱えるようにして初歩カードを圧縮する。
    sections:
      使用公式・定理: |
        有限標本空間の各基本結果が等確率なら
        $$
        P(A)=\frac{|A|}{|\Omega|}.
        $$
        重要なのは、分子と分母を**同じ数え方**で数えることである。順序を区別するなら両方で区別し、順序を無視するなら両方で組合せを使う。
      答え: |
        公平な硬貨を3回投げて表がちょうど2回出る確率は
        $$
        \frac{\binom32}{2^3}=\frac38.
        $$
      計算例: |
        硬貨3回では各列
        $$
        HHH,HHT,HTH,HTT,THH,THT,TTH,TTT
        $$
        が等確率なので
        $$
        |\Omega|=2^3=8.
        $$
        表が2回の列は
        $$
        HHT,HTH,THH
        $$
        の3通り、すなわち
        $$
        |A|=\binom32=3.
        $$
        よって
        $$
        P(A)=\frac38.
        $$

        順序を無視する例として、赤5個・青3個から同時に2個取り、赤1個・青1個となる確率は
        $$
        \begin{aligned}
        P(E)
        &=\frac{\binom51\binom31}{\binom82}\\
        &=\frac{15}{28}.
        \end{aligned}
        $$
        ここでは分子・分母とも組合せで数えている。
      一手: |
        先に「何を1つの基本結果と数えるか」を決め、その結果が等確率か確認する。その後で有利な結果数を全結果数で割る。
      注意: |
        結果が等確率でないときは個数の比を使えない。非復元で同時抽出する問題の分母を $8^2$ のような復元・順序ありの数にしない。
