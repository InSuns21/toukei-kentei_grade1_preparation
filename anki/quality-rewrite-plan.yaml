items:
  - id: bayes-density-formula
    note: 旧prob-bayes-diagnosticを吸収するため、一般のBayes公式に診断検査の逆確率計算を追加する。
    sections:
      問題: |
        母数 $\theta$ の事前密度 $\pi(\theta)$ と観測 $x$ の尤度 $f(x\mid\theta)$ から事後密度を書け。周辺尤度は $0<m(x)<\infty$ とする。

        さらに、罹患率が $P(D)=0.01$、感度が $P(+\mid D)=0.9$、偽陽性率が $P(+\mid D^c)=0.05$ の検査で、陽性者が罹患している確率 $P(D\mid +)$ を求めよ。
      使用公式・定理: |
        連続母数では
        $$
        \pi(\theta\mid x)
        =\frac{f(x\mid\theta)\pi(\theta)}{m(x)},
        \qquad
        m(x)=\int f(x\mid u)\pi(u)\,du.
        $$
        離散仮説 $H_k$ では積分が和になり
        $$
        P(x)=\sum_k P(x\mid H_k)P(H_k),
        $$
        $$
        P(H_j\mid x)
        =\frac{P(x\mid H_j)P(H_j)}{P(x)}.
        $$
        診断検査では陽性の全確率を
        $$
        P(+)=P(+\mid D)P(D)+P(+\mid D^c)P(D^c)
        $$
        と分解する。

        $\propto_{\theta}$ で核だけを見る段階では $\theta$ に依存しない正の因子を落としてよいが、周辺尤度やベイズファクターの計算では勝手に落とさない。
      一手: |
        ベイズ更新ではまず
        $$
        \text{事後分布}\propto_{\theta}\text{尤度}\times\text{事前分布}
        $$
        と書く。逆確率を数値計算するときは、分母を「観測された事象が起こる全経路の確率」として全確率の公式で作る。

        診断検査なら陽性は「罹患者からの真陽性」と「非罹患者からの偽陽性」の2経路から生じるため、その両方を分母へ入れる。
      答え: |
        一般に
        $$
        \pi(\theta\mid x)
        =\frac{f(x\mid\theta)\pi(\theta)}
        {\int f(x\mid u)\pi(u)\,du}.
        $$
        分布族の同定だけなら
        $$
        \pi(\theta\mid x)\propto_{\theta}f(x\mid\theta)\pi(\theta)
        $$
        として母数に依存しない因子を省ける。

        診断検査では
        $$
        \begin{aligned}
        P(+)
        &=0.9\cdot0.01+0.05\cdot0.99\\
        &=0.009+0.0495\\
        &=0.0585,
        \end{aligned}
        $$
        したがって
        $$
        P(D\mid +)
        =\frac{0.9\cdot0.01}{0.0585}
        =\frac{0.009}{0.0585}
        =\frac2{13}
        \approx\boxed{0.154}.
        $$
      計算例: |
        離散仮説 $H_1,H_0$ について
        $$
        P(H_1)=0.3,\qquad P(H_0)=0.7,
        $$
        $$
        P(x\mid H_1)=0.8,\qquad P(x\mid H_0)=0.2
        $$
        とする。周辺確率は
        $$
        P(x)=0.8\cdot0.3+0.2\cdot0.7=0.38,
        $$
        よって
        $$
        P(H_1\mid x)=\frac{0.8\cdot0.3}{0.38}
        =\frac{12}{19}\approx0.632.
        $$

        診断検査の例では、真陽性経路の確率は $0.009$、偽陽性経路は $0.0495$ である。偽陽性経路の方が大きいため、感度が0.9でも陽性後の罹患確率は0.9にはならない。
      注意: |
        感度 $P(+\mid D)$ と、陽性後確率 $P(D\mid +)$ は条件の向きが逆である。感度をそのまま事後確率として答えない。

        「尤度に比例する」段階と「正規化済みの事後分布」を区別する。二項尤度の組合せ係数のように母数へ依存しない因子は事後分布の核を求めるときには落とせるが、モデル間の周辺尤度を比較するベイズファクターではモデルごとの定数を保存する。

  - id: neyman-factorization
    note: 旧est-factorizationを吸収するため、定理の一般形に加えて一様分布U(0,theta)の端点依存の台を含む完全な因子分解を追加する。
    sections:
      問題: |
        1. ネイマンの分解定理を述べよ。
        2. $X_1,\ldots,X_n$ は独立同分布で、一様分布 $U(0,\theta)$ に従うとする。$\theta>0$ とする。ネイマンの分解定理を用いて $\theta$ の十分統計量を求めよ。
      答え: |
        1. 統計量 $T$ が $\theta$ の十分統計量であることと、同時密度・確率関数が
        $$
        f(x;\theta)=g_\theta(T(x))h(x)
        $$
        と分解できることは同値である。ここで $h(x)$ は $\theta$ に依存しない。

        2. 一様分布では
        $$
        T=X_{(n)}=\max_iX_i
        $$
        が $\theta$ の十分統計量である。
      使用公式・定理: |
        ネイマンの分解定理は、十分性の判定を条件付き分布の直接計算ではなく
        $$
        f(x;\theta)=g_\theta(T(x))h(x)
        $$
        という因子分解へ帰着させる。

        重要なのは、$h(x)$ が $\theta$ に依存してはいけないことである。台が母数に依存する場合、その指示関数も母数依存部分として $g_\theta(T(x))$ 側へ残す必要がある。
      計算例: |
        ベルヌーイ標本では
        $$
        L(p;x)=p^{\sum_i x_i}(1-p)^{n-\sum_i x_i}
        $$
        と書けるので、$T=\sum_iX_i$ が十分統計量である。

        一方、一様分布 $U(0,\theta)$ の密度は
        $$
        f_\theta(x)=\frac1\theta\boldsymbol1_{\{0\le x\le\theta\}}.
        $$
        独立標本の尤度は
        $$
        \begin{aligned}
        L(\theta;x)
        &=\prod_{i=1}^n\frac1\theta
          \boldsymbol1_{\{0\le x_i\le\theta\}}\\
        &=\theta^{-n}
          \boldsymbol1_{\{x_{(n)}\le\theta\}}
          \boldsymbol1_{\{x_{(1)}\ge0\}}.
        \end{aligned}
        $$
        したがって
        $$
        g_\theta(T)=\theta^{-n}\boldsymbol1_{\{T\le\theta\}},
        \qquad
        h(x)=\boldsymbol1_{\{x_{(1)}\ge0\}}
        $$
        と分解できる。よって
        $$
        \boxed{T=X_{(n)}}
        $$
        は十分統計量である。
      一手: |
        まず標本の同時密度・確率関数を書き、母数に依存する部分が標本をどの要約量を通じて見ているかを探す。

        台が母数に依存するときは特に指示関数を見る。一様分布 $U(0,\theta)$ の
        $$
        \boldsymbol1_{\{X_{(n)}\le\theta\}}
        $$
        は $\theta$ に依存するため $h(x)$ 側へ移せない。この指示関数自体が最大値 $X_{(n)}$ を十分統計量として抽出する。

  - id: np-sign-median-ci
    note: 旧test-sign-testを吸収するため、中央値の符号検定を二項分布へ帰着する基本問題と、その検定反転による信頼区間を一つの正本に統合する。
    metadata:
      title: 符号検定を二項分布へ帰着し中央値の信頼区間まで解く
      topic: sign-test-median-canonical
      type: strategy
      difficulty: 3
      priority: A
      hashtags: [符号検定, 中央値, 二項分布, 信頼区間]
    sections:
      問題: |
        連続な共通分布からの独立同分布標本 $X_1,\ldots,X_n$ を考える。

        1. 帰無仮説 $H_0:\operatorname{median}(X)=m_0$ の下で、$m_0$ より大きい観測数
        $$
        S=\sum_{i=1}^n\boldsymbol1_{\{X_i>m_0\}}
        $$
        の帰無分布を求めよ。$n=10$ で $S=10$ となる確率も求めよ。
        2. 順序統計量 $X_{(1)}\le\cdots\le X_{(n)}$ を用いて、符号検定を反転した中央値の分布によらない $100(1-\alpha)$% 信頼区間を書け。
      使用公式・定理: |
        連続分布で $m_0$ が中央値なら
        $$
        P(X_i>m_0)=P(X_i<m_0)=\frac12.
        $$
        独立標本では各符号が独立なベルヌーイ試行となるため
        $$
        S\sim\operatorname{Binomial}(n,1/2).
        $$

        同値 $X_i=m_0$ が起こり得る場合は通常その観測を除き、有効標本数 $n_{\mathrm{eff}}$ で二項分布を作る。

        信頼区間はこの二項帰無分布を反転する。$B\sim\operatorname{Binomial}(n,1/2)$ とし
        $$
        P(B\le k-1)\le\frac\alpha2
        $$
        を満たす最大の $k$ を選べば
        $$
        [X_{(k)},X_{(n-k+1)}]
        $$
        は被覆確率が少なくとも $1-\alpha$ の中央値信頼区間となる。
      答え: |
        1.
        $$
        \boxed{S\sim\operatorname{Binomial}(n,1/2)}.
        $$
        $n=10$ では
        $$
        P(S=10)=\left(\frac12\right)^{10}=\boxed{2^{-10}}.
        $$

        2. $B\sim\operatorname{Binomial}(n,1/2)$ に対して
        $$
        P(B\le k-1)\le\alpha/2
        $$
        を満たす最大の $k$ を選ぶと
        $$
        \boxed{[X_{(k)},X_{(n-k+1)}]}
        $$
        が分布によらない中央値の信頼区間となる。
      計算例: |
        符号検定では観測値の大きさ自体を使わず、$m_0$ の上か下かだけを数える。したがって外れ値の大きさに直接は影響されない一方、順位や距離の情報は捨てる。

        信頼区間では $k$ を大きくするほど区間は狭くなるが、二項尾確率が増えて被覆確率は下がる。離散性のため名目被覆率より保守的になることがある。
      注意: |
        $X_i=m_0$ の同値をそのまま成功・失敗へ割り当てない。通常は除外して有効標本数を数え直す。

        符号検定が仮定するのは中央値の位置であり、ウィルコクソン符号付き順位和検定が使う0対称性とは別である。

  - id: test-ump-binomial-one-sided
    note: 旧test-np-bernoulliの単純対立における尤度比単調性を、二項分布の片側一様最強力検定の正本へ明示的に統合する。
    sections:
      使用公式・定理: |
        二項分布は成功回数 $X$ に関して単調尤度比をもつ。実際、$0<p_0<p_1<1$ に対して
        $$
        R(x)=\frac{L(p_1;x)}{L(p_0;x)}
        =\left(\frac{p_1}{p_0}\right)^x
         \left(\frac{1-p_1}{1-p_0}\right)^{n-x}
        $$
        とおくと
        $$
        \frac{R(x+1)}{R(x)}
        =\frac{p_1(1-p_0)}{p_0(1-p_1)}>1.
        $$
        よって単純仮説 $H_0:p=p_0$ 対 $H_1:p=p_1>p_0$ のNeyman--Pearson検定は $X$ が大きいほど棄却する。

        同じ棄却方向が全ての $p_1>p_0$ で一致するため、Karlin--Rubin型の定理により
        $$
        H_0:p\le p_0\quad\text{対}\quad H_1:p>p_0
        $$
        でも右側の検定が一様最強力となる。離散分布でサイズを厳密に $\alpha$ とするには、整数 $c$ と $0\le\gamma\le1$ を
        $$
        P_{p_0}(X>c)+\gamma P_{p_0}(X=c)=\alpha
        $$
        となるよう選ぶ。
      計算例: |
        まず単純対立 $p_1>p_0$ なら
        $$
        \frac{R(x+1)}{R(x)}>1
        $$
        なので、成功回数 $X$ が大きいほど $p_1$ を支持する。この「棄却方向が全ての $p_1>p_0$ で同じ」という事実が片側一様最強力検定へつながる。

        $X\sim\operatorname{Binomial}(20,p)$、$H_0:p\le0.3$ 対 $H_1:p>0.3$、$\alpha=0.05$ では
        $$
        P_{0.3}(X\ge10)\approx0.04796\le0.05,
        $$
        $$
        P_{0.3}(X\ge9)\approx0.11333>0.05.
        $$
        したがって $X\ge10$ なら必ず棄却し、$X=9$ なら確率
        $$
        \gamma
        =\frac{0.05-P_{0.3}(X\ge10)}{P_{0.3}(X=9)}
        \approx0.03118
        $$
        で棄却すればサイズが厳密に0.05となる。非無作為化検定に限定すれば棄却域は $\{X\ge10\}$ である。
