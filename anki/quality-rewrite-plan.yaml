schema_version: 1
batch_id: 2026-08-29-time-series-traceability-04
items:
  - id: ts-pacf-lag2-calculation
    note: PACFの公式代入を答え欄から計算例へ移し、分子・分母を別々に計算して追えるようにする。
    sections:
      答え: |
        ラグ2偏自己相関は
        $$
        \alpha_{22}=-0.25.
        $$
      計算例: |
        まず分子を計算する。
        $$
        \begin{aligned}
        \rho_2-\rho_1^2
        &=0.2-0.6^2\\
        &=0.2-0.36\\
        &=-0.16.
        \end{aligned}
        $$
        次に分母は
        $$
        \begin{aligned}
        1-\rho_1^2
        &=1-0.6^2\\
        &=1-0.36\\
        &=0.64.
        \end{aligned}
        $$
        よってDurbin--Levinson公式へ代入して
        $$
        \begin{aligned}
        \alpha_{22}
        &=\frac{\rho_2-\rho_1^2}{1-\rho_1^2}\\
        &=\frac{-0.16}{0.64}\\
        &=-0.25.
        \end{aligned}
        $$
        なおAR$(1)$ では理論自己相関が $\rho_2=\rho_1^2$ を満たすので、この分子が0となりラグ2偏自己相関も0になる。
  - id: ts-ar-causality-check
    note: 二次方程式の解を一行で飛ばさず、係数整理→解の公式→数値→絶対値比較へ分ける。
    sections:
      答え: |
        AR多項式の2根は約
        $$
        z_1=1.31,
        \qquad
        z_2=-3.81
        $$
        で、ともに絶対値が1より大きい。したがってこのAR$(2)$モデルは因果的である。
      計算例: |
        AR多項式は
        $$
        \phi(z)=1-0.5z-0.2z^2.
        $$
        根を求めるため
        $$
        1-0.5z-0.2z^2=0
        $$
        を
        $$
        0.2z^2+0.5z-1=0
        $$
        と書き直す。解の公式より
        $$
        \begin{aligned}
        z
        &=\frac{-0.5\pm\sqrt{0.5^2-4(0.2)(-1)}}{2(0.2)}\\
        &=\frac{-0.5\pm\sqrt{0.25+0.8}}{0.4}\\
        &=\frac{-0.5\pm\sqrt{1.05}}{0.4}.
        \end{aligned}
        $$
        $\sqrt{1.05}\approx1.0247$ なので
        $$
        z_1\approx\frac{0.5247}{0.4}\approx1.31,
        $$
        $$
        z_2\approx\frac{-1.5247}{0.4}\approx-3.81.
        $$
        最後に
        $$
        |z_1|\approx1.31>1,
        \qquad
        |z_2|\approx3.81>1
        $$
        を確認する。すべての根が単位円の外側なので因果的である。
  - id: ts-linear-detrend
    note: 最小二乗の傾き・切片・残差系列を計算例へ移し、公式のどこへ数値を入れたか追えるようにする。
    sections:
      答え: |
        推定トレンドは
        $$
        \widehat X_t=1+2t
        $$
        であり、トレンド除去後の系列は
        $$
        (0,0,0)
        $$
        である。
      計算例: |
        時点は $(1,2,3)$、観測は $(3,5,7)$ なので
        $$
        \bar t=\frac{1+2+3}{3}=2,
        \qquad
        \bar X=\frac{3+5+7}{3}=5.
        $$
        傾きの分子は
        $$
        \begin{aligned}
        \sum_t(t-\bar t)(X_t-\bar X)
        &=(-1)(-2)+0\cdot0+1\cdot2\\
        &=4,
        \end{aligned}
        $$
        分母は
        $$
        \begin{aligned}
        \sum_t(t-\bar t)^2
        &=(-1)^2+0^2+1^2\\
        &=2.
        \end{aligned}
        $$
        したがって
        $$
        \widehat b=\frac42=2,
        $$
        $$
        \widehat a=\bar X-\widehat b\bar t=5-2\cdot2=1.
        $$
        推定トレンド値は
        $$
        (1+2\cdot1,\ 1+2\cdot2,\ 1+2\cdot3)=(3,5,7)
        $$
        なので、元の観測から引けば
        $$
        (3,5,7)-(3,5,7)=(0,0,0).
        $$
  - id: ts-sample-acf
    note: 平均→偏差→ラグ1積和→偏差平方和→比の順に計算例へ移す。
    sections:
      答え: |
        ラグ1標本自己相関は
        $$
        \widehat\rho_1=0.
        $$
      計算例: |
        まず標本平均は
        $$
        \bar x=\frac{1+2+3+2}{4}=2.
        $$
        したがって偏差列は
        $$
        (x_t-\bar x)=(-1,0,1,0).
        $$
        ラグ1の分子は、1時点ずらした偏差の積を足して
        $$
        \begin{aligned}
        \sum_{t=2}^4(x_t-\bar x)(x_{t-1}-\bar x)
        &=0(-1)+1(0)+0(1)\\
        &=0.
        \end{aligned}
        $$
        分母は
        $$
        \begin{aligned}
        \sum_{t=1}^4(x_t-\bar x)^2
        &=(-1)^2+0^2+1^2+0^2\\
        &=2.
        \end{aligned}
        $$
        よって
        $$
        \widehat\rho_1=\frac02=0.
        $$
  - id: ts-spectral-density-ar1
    note: フィルタ表示→複素絶対値の二乗→余弦への整理→スペクトル密度という導出を計算例で追える形にする。
    sections:
      答え: |
        AR$(1)$ のスペクトル密度は
        $$
        f_X(\lambda)
        =\frac{\sigma^2}
        {2\pi\{1+\phi^2-2\phi\cos\lambda\}}.
        $$
      計算例: |
        AR$(1)$ を
        $$
        (1-\phi B)X_t=\varepsilon_t
        $$
        と書けば
        $$
        X_t=(1-\phi B)^{-1}\varepsilon_t
        $$
        なので、線形フィルタは
        $$
        \psi(z)=\frac1{1-\phi z}.
        $$
        よって
        $$
        \left|\psi(e^{-i\lambda})\right|^2
        =\frac1{|1-\phi e^{-i\lambda}|^2}.
        $$
        分母を計算すると
        $$
        \begin{aligned}
        |1-\phi e^{-i\lambda}|^2
        &=(1-\phi e^{-i\lambda})(1-\phi e^{i\lambda})\\
        &=1-\phi(e^{i\lambda}+e^{-i\lambda})+\phi^2\\
        &=1-2\phi\cos\lambda+\phi^2.
        \end{aligned}
        $$
        したがって線形フィルタ公式から
        $$
        f_X(\lambda)
        =\frac{\sigma^2}
        {2\pi\{1+\phi^2-2\phi\cos\lambda\}}.
        $$
        例えば $\phi=0.5$, $\sigma^2=1$, $\lambda=0$ なら
        $$
        \begin{aligned}
        f_X(0)
        &=\frac1{2\pi(1+0.25-1)}\\
        &=\frac1{2\pi(0.25)}\\
        &=\frac2\pi.
        \end{aligned}
        $$
