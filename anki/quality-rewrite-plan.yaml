schema_version: 1
batch_id: 2026-08-29-sample-size-merge-prep-21
items:
  - id: ci-sample-size-for-width
    note: 目標半幅から必要標本サイズを決める共通原理を、母平均と母比率の両方へ統合する。
    sections:
      使用公式・定理: |
        信頼区間の標本サイズ設計は、まず半幅を $d$ 以下にする不等式を立て、それを $n$ について解いて最後に切り上げる。

        母標準偏差 $\sigma$ が既知の母平均では、両側信頼係数 $1-\alpha$ の正規区間の半幅が
        $$
        z_{\alpha/2}\frac{\sigma}{\sqrt n}
        $$
        なので
        $$
        z_{\alpha/2}\frac{\sigma}{\sqrt n}\le d
        $$
        から
        $$
        n\ge\left(\frac{z_{\alpha/2}\sigma}{d}\right)^2.
        $$
        よって必要標本サイズは
        $$
        n=\left\lceil\left(\frac{z_{\alpha/2}\sigma}{d}\right)^2\right\rceil.
        $$

        母比率 $p$ ではWald型区間の近似半幅が
        $$
        z_{\alpha/2}\sqrt{\frac{p(1-p)}{n}}
        $$
        なので、設計用の予備値 $p_0$ があれば
        $$
        n\ge\frac{z_{\alpha/2}^2p_0(1-p_0)}{d^2}.
        $$
        $p$ の事前情報がなければ
        $$
        p(1-p)\le\frac14
        $$
        を使い、最悪ケース $p=1/2$ として
        $$
        n\ge\frac{z_{\alpha/2}^2}{4d^2}
        $$
        とすれば安全側になる。
      答え: |
        母平均では
        $$
        n=\left\lceil\left(\frac{z_{\alpha/2}\sigma}{d}\right)^2\right\rceil.
        $$
        母比率では予備値 $p_0$ があれば
        $$
        n=\left\lceil\frac{z_{\alpha/2}^2p_0(1-p_0)}{d^2}\right\rceil,
        $$
        事前情報がなければ $p_0=1/2$ を使う。
      計算例: |
        母平均で $\sigma=10$, $d=2$, 95%信頼区間なら
        $$
        n\ge\left(\frac{1.96\cdot10}{2}\right)^2=96.04,
        $$
        よって
        $$n=97.$$

        母比率で $d=0.03$, 95%信頼区間、事前情報なしなら
        $$
        n\ge\frac{1.96^2}{4(0.03)^2}\approx1067.11,
        $$
        よって
        $$n=1068.$$

        同じ幅を保つなら、信頼係数を上げて $z_{\alpha/2}$ が大きくなるほど必要標本数は増える。また許容誤差 $d$ を半分にすると必要標本数はおよそ4倍になる。
      一手: |
        「区間の半幅 $\le d$」を書き、$n$ について解いて切り上げる。比率で $p$ が未知なら $p(1-p)$ を最大にする $p=1/2$ を使う。
      注意: |
        これらは正規近似に基づく設計式である。母平均で $\sigma$ 未知なら事前研究などで分散を見積もる必要がある。母比率で小標本や極端な $p$ が想定される場合はWald近似の精度にも注意する。
