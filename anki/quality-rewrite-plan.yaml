schema_version: 1
batch_id: 2026-08-31-vif-canonicalization-244
items:
  - id: reg-multicollinearity-vif
    note: 工学側 enginf-vif-numeric は R_j^2=0.80 から VIF=5 を計算する同一操作。工学側にだけあった「係数分散が5倍なら標準誤差は sqrt(5) 倍」という解釈を common 正本へ吸収する。
    sections:
      計算例: |
        $R_j^2=0.80$ なら
        $$
        \operatorname{VIF}_j
        =\frac1{1-0.80}
        =5.
        $$
        したがって、他の条件を同じとみなした基準と比べて $\widehat\beta_j$ の分散は5倍に拡大する。

        標準誤差は分散の平方根なので、対応する増幅率は
        $$
        \sqrt{\operatorname{VIF}_j}
        =\sqrt5
        \approx2.24
        $$
        倍である。
