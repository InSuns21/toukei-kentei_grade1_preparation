items:
  - id: prob-cdf-from-density
    note: 旧prob-mixed-cdfを吸収するため、累積分布関数の正本を離散・連続・混合の3形態と逆向きの密度・点質量回収まで一続きに拡張する。
    metadata:
      title: 確率質量・密度・混合分布から累積分布関数を作る
      topic: cdf-canonical
      type: strategy
      priority: S
      hashtags: [累積分布関数, 確率密度関数, 点質量, 混合分布]
    sections:
      問題: |
        累積分布関数について次を解け。

        1. $X$ の確率密度関数が $f_X(x)=2x$（$0<x<1$）、それ以外で0である。累積分布関数 $F_X(x)$ を求めよ。
        2. $P(Y=0)=1/2$ で、残りの確率 $1/2$ は区間 $(0,1)$ 上に一定の密度で分布する。$F_Y(y)$ を求めよ。
        3. 一般に、累積分布関数から連続部分の密度と点 $a$ の確率質量をどう回収するか述べよ。
      答え: |
        1. $0\le x<1$ では
        $$
        F_X(x)=\int_0^x2u\,du=x^2
        $$
        なので
        $$
        F_X(x)=
        \begin{cases}
        0,&x<0,\\
        x^2,&0\le x<1,\\
        1,&x\ge1.
        \end{cases}
        $$

        2. 連続部分の密度は $(0,1)$ で $1/2$ だから
        $$
        F_Y(y)=
        \begin{cases}
        0,&y<0,\\
        1/2,&y=0,\\
        1/2+y/2,&0<y<1,\\
        1,&y\ge1.
        \end{cases}
        $$
        $y=0$ で大きさ $1/2$ の跳びを持つ。

        3. 絶対連続な部分では、微分可能な点で
        $$
        f_X(x)=F_X'(x).
        $$
        点 $a$ の確率質量は
        $$
        P(X=a)=F_X(a)-F_X(a-)
        $$
        である。
      使用公式・定理: |
        累積分布関数の定義は常に
        $$
        F_X(x)=P(X\le x).
        $$

        離散型では、$x$ 以下の確率質量を足して
        $$
        F_X(x)=\sum_{u\le x}p_X(u).
        $$
        絶対連続型では、$x$ まで密度を積分して
        $$
        F_X(x)=\int_{-\infty}^{x}f_X(u)\,du.
        $$

        点質量と連続部分が共存する混合分布では、両方を足して
        $$
        F_X(x)
        =\sum_{u\le x}P(X=u)
        +\int_{-\infty}^{x}f_{\mathrm{cont}}(u)\,du
        $$
        と考える。したがって累積分布関数は、点質量の位置では跳び、連続密度がある区間では連続的に増加する。

        逆向きには、絶対連続な部分で累積分布関数が微分可能なら
        $$
        f_X(x)=F_X'(x),
        $$
        点 $a$ の確率質量は左極限との差
        $$
        P(X=a)=F_X(a)-F_X(a-)
        $$
        で回収する。
      計算例: |
        離散型で
        $$
        P(X=0)=\frac14,\qquad P(X=1)=\frac34
        $$
        なら
        $$
        F_X(x)=
        \begin{cases}
        0,&x<0,\\
        1/4,&0\le x<1,\\
        1,&x\ge1.
        \end{cases}
        $$

        連続型で $f_X(x)=2x$（$0<x<1$）なら
        $$
        F_X(x)=\int_0^x2u\,du=x^2,
        \qquad0\le x<1.
        $$

        混合分布では、$P(Y=0)=1/2$ により $F_Y$ は0で $1/2$ だけ跳び、その後 $(0,1)$ 上で傾き $1/2$ で増える。したがって $0<y<1$ では
        $$
        F_Y(y)=\frac12+\frac y2.
        $$

        逆向きに
        $$
        F_X(1-)=0.2,\qquad F_X(1)=0.5
        $$
        なら
        $$
        P(X=1)=0.5-0.2=0.3.
        $$
      一手: |
        **累積分布関数は「左側にある確率を全部集めた量」と考える。** 離散なら質量を足し、連続なら密度を積分し、混合なら跳びと積分を両方足す。逆向きでは連続部分を微分し、跳びは左極限との差で読む。
      注意: |
        混合分布で累積分布関数を微分しただけでは点質量を回収できない。密度が存在する部分と跳びを分けて扱う。

        累積分布関数は台の外も含めて0から1まで書く。常に右連続であり、点質量は右連続な関数の跳びとして現れる。

  - id: dist-weak-law-chebyshev
    note: 旧dist-weak-law-sample-meanを吸収するため、Chebyshevによる導出正本に確率収束の定義・弱法則の読み方・誤解しやすい点を統合する。
    metadata:
      title: 大数の弱法則を確率収束として読みChebyshevから導く
      topic: weak-law-canonical
      type: strategy
      priority: S
      hashtags: [大数の弱法則, チェビシェフの不等式, 確率収束, 標本平均]
    sections:
      問題: |
        $X_1,X_2,\ldots$ は独立同分布で
        $$
        E[X_i]=\mu,\qquad \operatorname{Var}(X_i)=\sigma^2<\infty
        $$
        とする。

        1. $\overline X_n\xrightarrow{p}\mu$ の意味を、任意の $\varepsilon>0$ を使って書け。
        2. チェビシェフの不等式から $\overline X_n\xrightarrow{p}\mu$ を示せ。
      答え: |
        1. 確率収束の定義より
        $$
        \overline X_n\xrightarrow{p}\mu
        \quad\Longleftrightarrow\quad
        P(|\overline X_n-\mu|\ge\varepsilon)\to0
        $$
        が任意の $\varepsilon>0$ で成り立つことである。

        2. 独立同分布性より
        $$
        E[\overline X_n]=\mu,
        \qquad
        \operatorname{Var}(\overline X_n)=\frac{\sigma^2}{n}.
        $$
        チェビシェフの不等式を適用すると
        $$
        P(|\overline X_n-\mu|\ge\varepsilon)
        \le
        \frac{\sigma^2}{n\varepsilon^2}
        \to0.
        $$
        よって
        $$
        \boxed{\overline X_n\xrightarrow{p}\mu}.
        $$
      使用公式・定理: |
        確率変数列 $Y_n$ が $Y$ に確率収束するとは、任意の $\varepsilon>0$ に対して
        $$
        P(|Y_n-Y|\ge\varepsilon)\longrightarrow0
        $$
        が成り立つことである。

        有限分散の確率変数 $Y$ に対するチェビシェフの不等式は
        $$
        P(|Y-E[Y]|\ge\varepsilon)
        \le
        \frac{\operatorname{Var}(Y)}{\varepsilon^2},
        \qquad \varepsilon>0.
        $$

        独立同分布標本では
        $$
        E[\overline X_n]=\mu,
        \qquad
        \operatorname{Var}(\overline X_n)=\frac{\sigma^2}{n}.
        $$
        したがって標本平均のばらつきが $1/n$ の速さで縮むことが、Chebyshevによる弱法則の直接の理由である。
      計算例: |
        例えば $\mu=5$、$\sigma^2=4$ とする。$\varepsilon=0.2$ なら
        $$
        P(|\overline X_n-5|\ge0.2)
        \le
        \frac{4}{n(0.2)^2}
        =\frac{100}{n}.
        $$
        この上界自体は小さい $n$ では1を超え得るが、$n\to\infty$ では0へ収束する。したがって任意に固定した幅から外れる確率は最終的に0へ近づく。
      一手: |
        **弱法則は「標本平均の分散が0へ縮む」ことから読む。** まず $E[\overline X_n]=\mu$ と $\operatorname{Var}(\overline X_n)=\sigma^2/n$ を出し、Chebyshevの右辺を0へ送る。
      注意: |
        $\overline X_n\xrightarrow{p}\mu$ は「十分大きい $n$ なら標本平均が必ず $\mu$ と等しくなる」という意味ではない。固定した $\varepsilon>0$ について、$\mu$ から $\varepsilon$ 以上離れる確率が0へ近づくという意味である。

        このカードの証明は独立同分布と有限分散を使う標準形である。より一般の大数の法則には別の仮定もあるので、「有限分散がなければ大数則は絶対に成り立たない」とは結論しない。
