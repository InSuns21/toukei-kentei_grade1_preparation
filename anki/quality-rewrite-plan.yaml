batch_id: 2026-08-29-cdf-survival-merge-prep-09
items:
  - id: prob-cdf-endpoint-choice
    note: 区間確率の一般式と左極限の使い分けを1枚にまとめ、連続分布の単純なF(b)-F(a)も特殊形として吸収する。
    sections:
      使用公式・定理: |
        累積分布関数を
        $$
        F_X(x)=P(X\le x),
        \qquad
        F_X(x-)=P(X<x)
        $$
        とする。すると
        $$
        P(a<X\le b)=F_X(b)-F_X(a),
        $$
        $$
        P(a\le X\le b)=F_X(b)-F_X(a-).
        $$
        右端を含まない場合も同様に $F_X(b-)$ を使う。連続分布では $F_X(x-)=F_X(x)$ なので端点の違いは消える。
      答え: |
        $F_X(1-)=0.2$, $F_X(1)=0.5$, $F_X(3)=0.9$ なら
        $$
        P(1\le X\le3)=F_X(3)-F_X(1-)=0.7.
        $$
      計算例: |
        左端 $1$ を含むので、引くのは $P(X<1)=F_X(1-)$ である。したがって
        $$
        \begin{aligned}
        P(1\le X\le3)
        &=P(X\le3)-P(X<1)\\
        &=F_X(3)-F_X(1-)\\
        &=0.9-0.2\\
        &=0.7.
        \end{aligned}
        $$
        点 $1$ の確率は
        $$
        P(X=1)=F_X(1)-F_X(1-)=0.5-0.2=0.3
        $$
        で、この $0.3$ も区間確率 $0.7$ に含まれる。

        一方、連続分布で $F(x)=x^2$（$0\le x\le1$）なら左極限と関数値は一致するので
        $$
        \begin{aligned}
        P\left(\frac14<X\le\frac34\right)
        &=F\left(\frac34\right)-F\left(\frac14\right)\\
        &=\frac9{16}-\frac1{16}\\
        &=\frac12.
        \end{aligned}
        $$
      一手: |
        区間確率は「右端までの累積」から「左端より前の累積」を引く。左端を含むなら $F(a-)$、含まないなら $F(a)$ を引く。
      注意: |
        離散・混合分布では $F(a-)$ と $F(a)$ が異なり得る。連続分布だけを見て端点記号を無視する癖を付けない。
  - id: prob-cumulative-hazard
    note: 累積分布関数・生存関数・累積危険率・危険率の相互変換を1枚に統合し、順方向と逆方向を両方計算する。
    sections:
      使用公式・定理: |
        非負で絶対連続な寿命変数について
        $$
        S(t)=1-F(t),
        $$
        $$
        H(t)=-\log S(t),
        \qquad
        h(t)=H'(t)=\frac{f(t)}{S(t)}.
        $$
        逆向きには
        $$
        H(t)=\int_0^t h(u)\,du,
        \qquad
        S(t)=e^{-H(t)},
        \qquad
        F(t)=1-S(t).
        $$
        したがって $F,S,H,h$ は、必要な滑らかさの下で相互に変換できる。
      答え: |
        $S(t)=e^{-t^2}$ なら
        $$
        H(t)=t^2,
        \qquad
        h(t)=2t.
        $$
      計算例: |
        まず累積分布関数から始める例として
        $$
        F(t)=1-e^{-t^2}\qquad(t\ge0)
        $$
        とする。生存関数は
        $$
        \begin{aligned}
        S(t)
        &=1-F(t)\\
        &=1-(1-e^{-t^2})\\
        &=e^{-t^2}.
        \end{aligned}
        $$
        したがって
        $$
        \begin{aligned}
        H(t)
        &=-\log S(t)\\
        &=-\log(e^{-t^2})\\
        &=t^2,
        \end{aligned}
        $$
        さらに
        $$
        h(t)=H'(t)=2t.
        $$

        逆向きに、危険率が
        $$
        h(t)=3t^2
        $$
        と与えられたなら
        $$
        \begin{aligned}
        H(t)
        &=\int_0^t3u^2\,du\\
        &=[u^3]_0^t\\
        &=t^3,
        \end{aligned}
        $$
        よって
        $$
        S(t)=e^{-t^3},
        \qquad
        F(t)=1-e^{-t^3}.
        $$
        「危険率をそのまま指数へ入れる」のではなく、必ず一度積分して累積危険率を作る。
      一手: |
        順方向は
        $$
        F\to S=1-F\to H=-\log S\to h=H',
        $$
        逆方向は
        $$
        h\to H=\int h\to S=e^{-H}\to F=1-S.
        $$
        この鎖を覚えると個別公式を暗記する必要がない。
      注意: |
        危険率 $h(t)$ は確率そのものではなく、時点 $t$ まで生存した条件の下での瞬間的な発生率である。累積危険率 $H(t)$ と混同しない。
  - id: prob-joint-cdf-from-density
    note: 同時密度を積分して同時累積分布関数を作り、その同じ累積分布関数から長方形確率まで計算する一連の技能へ統合する。
    sections:
      使用公式・定理: |
        同時累積分布関数は
        $$
        F_{X,Y}(x,y)
        =P(X\le x,Y\le y)
        =\int_{-\infty}^x\int_{-\infty}^y
        f_{X,Y}(u,v)\,dv\,du.
        $$
        そこから長方形確率は包除原理により
        $$
        \begin{aligned}
        P(a<X\le b,c<Y\le d)
        ={}&F(b,d)-F(a,d)\\
        &-F(b,c)+F(a,c)
        \end{aligned}
        $$
        と求める。
      答え: |
        $f_{X,Y}(x,y)=1$（$0<x<1$, $0<y<1$）なら、$0\le x,y\le1$ で
        $$
        F_{X,Y}(x,y)=xy.
        $$
      計算例: |
        まず点 $(x,y)$ の左下にある確率を積分する。
        $$
        \begin{aligned}
        F_{X,Y}(x,y)
        &=\int_0^x\int_0^y1\,dv\,du\\
        &=\int_0^x y\,du\\
        &=xy.
        \end{aligned}
        $$
        次に同じ累積分布関数を使って
        $$
        P(0.2<X\le0.8,0.3<Y\le0.7)
        $$
        を求める。4隅を $+,-,-,+$ で組み合わせると
        $$
        \begin{aligned}
        P
        &=F(0.8,0.7)-F(0.2,0.7)\\
        &\quad-F(0.8,0.3)+F(0.2,0.3)\\
        &=0.8\cdot0.7-0.2\cdot0.7\\
        &\quad-0.8\cdot0.3+0.2\cdot0.3\\
        &=0.56-0.14-0.24+0.06\\
        &=0.24.
        \end{aligned}
        $$
      一手: |
        同時密度からは左下領域を積分して累積分布関数を作る。長方形確率へ戻すときは4隅を $+,-,-,+$ で包除する。
      注意: |
        $F_{X,Y}(x,y)$ は点 $(x,y)$ での密度値ではなく、その点までの累積確率である。長方形確率では最後の左下項を足し戻す。
