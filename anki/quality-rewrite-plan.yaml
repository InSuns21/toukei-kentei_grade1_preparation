schema_version: 1
batch_id: 2026-08-29-distribution-transform-traceability-02
items:
  - id: samp-chisq-definition
    note: 自由度3という言い換えだけの例をやめ、一般密度を実際に特殊化して平均・分散まで確認する。
    sections:
      計算例: |
        $\nu=3$ とする。一般密度へ代入すると
        $$
        f_X(x)
        =\frac{1}{2^{3/2}\Gamma(3/2)}x^{1/2}e^{-x/2},
        \qquad x>0.
        $$
        ここで
        $$
        \Gamma\!\left(\frac32\right)
        =\frac12\Gamma\!\left(\frac12\right)
        =\frac{\sqrt\pi}{2}
        $$
        だから
        $$
        \begin{aligned}
        2^{3/2}\Gamma(3/2)
        &=2^{3/2}\frac{\sqrt\pi}{2}\\
        &=\sqrt{2\pi}.
        \end{aligned}
        $$
        よって
        $$
        f_X(x)=\frac{1}{\sqrt{2\pi}}x^{1/2}e^{-x/2},
        \qquad x>0.
        $$
        また $\chi^2_\nu$ の平均・分散は $\nu,2\nu$ なので、$\chi^2_3$ では
        $$
        E[X]=3,
        \qquad
        \operatorname{Var}(X)=6.
        $$
  - id: samp-t-distribution-definition
    note: ν=1はコーシー分布という知識の再掲ではなく、t密度へν=1を代入して標準コーシー密度になることを追える形にする。
    sections:
      計算例: |
        $\nu=1$ を t 分布の密度へ代入する。まず係数は
        $$
        \frac{\Gamma\{(1+1)/2\}}
        {\sqrt{\pi}\,\Gamma(1/2)}
        =\frac{\Gamma(1)}{\sqrt\pi\,\sqrt\pi}
        =\frac1\pi.
        $$
        また指数は
        $$
        -\frac{\nu+1}{2}=-1
        $$
        だから
        $$
        \begin{aligned}
        f_T(t)
        &=\frac1\pi\left(1+t^2\right)^{-1}\\
        &=\frac{1}{\pi(1+t^2)}.
        \end{aligned}
        $$
        これは標準コーシー分布の密度である。したがって
        $$
        t_1=\text{標準コーシー分布}
        $$
        が密度から直接確認でき、平均・分散が存在しないことも対応する。
  - id: prob-transform-jacobian-2d
    note: Jacobianだけでなく、元の正方形のsupportを(u,v)の菱形へ変換する不等式を省略しない。
    sections:
      計算例: |
        逆変換は
        $$
        x=\frac{u+v}{2},
        \qquad
        y=\frac{u-v}{2}.
        $$
        したがって
        $$
        \frac{\partial(x,y)}{\partial(u,v)}
        =\begin{pmatrix}
        1/2&1/2\\
        1/2&-1/2
        \end{pmatrix},
        $$
        $$
        \left|\det\frac{\partial(x,y)}{\partial(u,v)}\right|
        =\left|-\frac12\right|
        =\frac12.
        $$
        次に元の support $0<x<1$, $0<y<1$ を変換する。
        $$
        0<\frac{u+v}{2}<1
        \Longleftrightarrow
        -u<v<2-u,
        $$
        $$
        0<\frac{u-v}{2}<1
        \Longleftrightarrow
        u-2<v<u.
        $$
        この2条件の共通部分を整理すると
        $$
        -1<v<1,
        \qquad
        |v|<u<2-|v|.
        $$
        元の同時密度は正方形内で1だから、変数変換公式より
        $$
        f_{U,V}(u,v)
        =1\cdot\frac12
        =\frac12
        $$
        （$-1<v<1$, $|v|<u<2-|v|$）、それ以外では0である。
  - id: prob-transform-sum-density
    note: support決定と被積分関数の簡約と積分を1本の長い等式に詰めず、一操作一行へ分ける。
    sections:
      計算例: |
        $f_X(x)$ が正なのは $x>0$、$f_Y(z-x)$ が正なのは
        $$
        z-x>0
        \Longleftrightarrow
        x<z
        $$
        である。したがって $z>0$ のとき積分範囲は
        $$
        0<x<z.
        $$
        この範囲では
        $$
        \begin{aligned}
        f_Z(z)
        &=\int_0^z e^{-x}e^{-(z-x)}\,dx\\
        &=\int_0^z e^{-z}\,dx\\
        &=e^{-z}\int_0^z1\,dx\\
        &=ze^{-z}.
        \end{aligned}
        $$
        よって
        $$
        f_Z(z)=
        \begin{cases}
        ze^{-z},&z>0,\\
        0,&z\le0.
        \end{cases}
        $$
        これは $\operatorname{Gamma}(2,1)$ の密度である。
  - id: prob-transform-ratio
    note: z<=1とz>1で領域がどう変わるかを文章と積分の各行で追える形にする。
    sections:
      計算例: |
        独立性より、単位正方形 $0<x<1$, $0<y<1$ 上で $f_{X,Y}(x,y)=1$ である。

        $0<z\le1$ のときは $zy\le1$ が全ての $0<y<1$ で成り立つので、領域は $0<x<zy$。したがって
        $$
        \begin{aligned}
        F_Z(z)
        &=\int_0^1\int_0^{zy}1\,dx\,dy\\
        &=\int_0^1zy\,dy\\
        &=\frac z2.
        \end{aligned}
        $$

        $z>1$ では、$zy=1$ となる $y=1/z$ で領域の形が変わる。$0<y<1/z$ では $0<x<zy$、$1/z\le y<1$ では $0<x<1$ だから
        $$
        \begin{aligned}
        F_Z(z)
        &=\int_0^{1/z}\int_0^{zy}1\,dx\,dy
          +\int_{1/z}^1\int_0^11\,dx\,dy\\
        &=\int_0^{1/z}zy\,dy
          +\int_{1/z}^11\,dy\\
        &=\frac{1}{2z}+1-\frac1z\\
        &=1-\frac{1}{2z}.
        \end{aligned}
        $$
        よって
        $$
        F_Z(z)=
        \begin{cases}
        0,&z\le0,\\
        z/2,&0<z\le1,\\
        1-1/(2z),&z>1.
        \end{cases}
        $$
