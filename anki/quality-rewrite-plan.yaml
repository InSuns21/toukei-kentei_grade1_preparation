batch_id: 2026-08-30-data-analysis-merge-prep-31
items:
  - id: mv-pca-variance-max
    note: PCAの固有値数値問題と切り捨て再構成誤差を分散最大化canonicalへ吸収する。
    sections:
      一手: |
        主成分分析では「固有ベクトルを使う」と暗記せず、単位ベクトル $\boldsymbol a$ への射影分散
        $$
        \operatorname{Var}(\boldsymbol a^{\mathsf T}\boldsymbol X)
        =\boldsymbol a^{\mathsf T}\boldsymbol\Sigma\boldsymbol a
        $$
        を最大化する問題から始める。Lagrange未定乗数法で固有方程式を出し、最大固有値の方向を第1主成分に選ぶ。
      使用公式・定理: |
        制約 $\boldsymbol a^{\mathsf T}\boldsymbol a=1$ の下で
        $$
        \boldsymbol a^{\mathsf T}\boldsymbol\Sigma\boldsymbol a
        $$
        を最大化する。Lagrange関数
        $$
        L(\boldsymbol a,\lambda)
        =\boldsymbol a^{\mathsf T}\boldsymbol\Sigma\boldsymbol a
        -\lambda(\boldsymbol a^{\mathsf T}\boldsymbol a-1)
        $$
        を微分すると
        $$
        \boldsymbol\Sigma\boldsymbol a=\lambda\boldsymbol a.
        $$
        したがって第1主成分方向は最大固有値の単位固有ベクトルである。

        固有値を $\lambda_1\ge\cdots\ge\lambda_p$ とすると、上位 $m$ 主成分で再構成したときの平均二乗再構成誤差の総和は
        $$
        \sum_{j=m+1}^{p}\lambda_j
        $$
        である。
      答え: |
        第1主成分は分散共分散行列の最大固有値に対応する単位固有ベクトル方向である。第2主成分以降は、それ以前の主成分に直交する範囲で同じ分散最大化を繰り返す。
      計算例: |
        $$
        \boldsymbol S=
        \begin{pmatrix}2&1\\1&2\end{pmatrix}
        $$
        とする。固有値は
        $$
        \begin{aligned}
        0
        &=\det(\boldsymbol S-\lambda\boldsymbol I)\\
        &=\det\begin{pmatrix}2-\lambda&1\\1&2-\lambda\end{pmatrix}\\
        &=(2-\lambda)^2-1\\
        &=(\lambda-3)(\lambda-1),
        \end{aligned}
        $$
        より
        $$
        \lambda_1=3,\qquad \lambda_2=1.
        $$
        $\lambda_1=3$ に対して
        $$
        \begin{pmatrix}-1&1\\1&-1\end{pmatrix}
        \begin{pmatrix}a_1\\a_2\end{pmatrix}
        =\boldsymbol0
        $$
        なので $a_1=a_2$。単位長へ正規化すると
        $$
        \boldsymbol a_1=\frac1{\sqrt2}(1,1)^{\mathsf T}.
        $$
        第1主成分だけを残すなら捨てる固有値は1なので、平均二乗再構成誤差の総和は
        $$
        \lambda_2=1.
        $$
      注意: |
        データは中心化しておく。固有ベクトル全体の符号は任意であり、$\boldsymbol a$ と $-\boldsymbol a$ は同じ主成分軸を表す。標準化PCAでは分散共分散行列ではなく相関行列に対して同じ固有値問題を解く。

  - id: reg-dffits-numeric
    note: DFBETAを同じleave-one-out影響診断の派生としてDFFITS canonicalへ吸収する。
    sections:
      使用公式・定理: |
        DFFITSは観測 $i$ を除いたときの $i$ 自身の当てはめ値変化を尺度化し、外的スチューデント化残差 $t_i$ を用いて
        $$
        \operatorname{DFFITS}_i
        =t_i\sqrt{\frac{h_{ii}}{1-h_{ii}}}
        $$
        と書ける。

        一方、係数 $j$ への影響は
        $$
        \operatorname{DFBETA}_{ij}
        =\widehat\beta_j-\widehat\beta_{j(i)}
        $$
        で測る。標準誤差で尺度化したものをDFBETASと呼ぶ。
      答え: |
        与えられた $t_i=2,h_{ii}=0.2$ では
        $$
        \operatorname{DFFITS}_i=1.
        $$
        DFFITSは予測値への影響、DFBETAは特定の回帰係数への影響を測る。
      計算例: |
        まず
        $$
        \frac{h_{ii}}{1-h_{ii}}
        =\frac{0.2}{0.8}=\frac14,
        $$
        したがって
        $$
        \sqrt{\frac{h_{ii}}{1-h_{ii}}}=\frac12.
        $$
        よって
        $$
        \operatorname{DFFITS}_i
        =2\times\frac12=1.
        $$

        同じ観測について、ある係数が
        $$
        \widehat\beta_j=1.2,
        \qquad
        \widehat\beta_{j(i)}=0.8
        $$
        なら
        $$
        \operatorname{DFBETA}_{ij}=1.2-0.8=0.4.
        $$
        正の値は、その観測を含めることで係数 $j$ が正方向へ0.4動いたことを表す。
      注意: |
        DFFITS・DFBETAはいずれも「削除前後の変化」を見る影響診断である。大残差や高レバレッジの観測は大きな影響を持ち得るが、閾値超過だけで機械的にデータを削除しない。

  - id: ms-ridge-lasso-orthogonal-numeric
    note: LassoのKKT零条件とElastic Netを正則化canonicalへ吸収し、回帰側の派生カードを削減する。
    sections:
      使用公式・定理: |
        Ridgeは
        $$
        \widehat{\boldsymbol\beta}_{\mathrm{ridge}}
        =(\boldsymbol X^{\mathsf T}\boldsymbol X+\lambda\boldsymbol I)^{-1}
        \boldsymbol X^{\mathsf T}\boldsymbol y.
        $$
        Lassoの目的関数を
        $$
        \frac12\|\boldsymbol y-\boldsymbol X\boldsymbol\beta\|^2
        +\lambda\sum_j|\beta_j|
        $$
        とすると、直交設計では
        $$
        \widehat\beta_j=S(z_j,\lambda),
        \qquad
        S(z,\lambda)=\operatorname{sign}(z)(|z|-\lambda)_+.
        $$
        一般の設計でもKKT条件より、係数 $j$ が0であるための条件は部分残差 $\boldsymbol r_{-j}$ を用いて
        $$
        |\boldsymbol x_j^{\mathsf T}\boldsymbol r_{-j}|\le\lambda
        $$
        である。

        Elastic NetはL1とL2を同時に使う拡張で
        $$
        \frac12\|\boldsymbol y-\boldsymbol X\boldsymbol\beta\|^2
        +\lambda\left\{
        \alpha\sum_j|\beta_j|
        +\frac{1-\alpha}{2}\sum_j\beta_j^2
        \right\},
        $$
        $\alpha=1$ でLasso、$\alpha=0$ でRidge型になる。
      計算例: |
        Ridgeでは
        $$
        \left(\frac8{4+1},\frac2{1+1}\right)
        =(1.6,1.0).
        $$
        Lassoでは
        $$
        S(3,1)=2,\qquad
        S(0.5,1)=0,\qquad
        S(-2,1)=-1.
        $$
        中央の係数が0になる理由はKKT条件でも確認できる。直交設計ではその部分残差との内積が $0.5$ なので
        $$
        |0.5|\le1=\lambda,
        $$
        よって0が最適条件を満たす。
      一手: |
        Ridgeは係数を連続的に縮め、Lassoはsoft-thresholdingにより小さい係数をちょうど0へ落とす。Elastic NetはこのL1の疎性とL2の安定化を同じ目的関数へ入れたものと捉える。
      注意: |
        Lassoの閾値やKKT条件の定数は、二乗誤差項に $1/2$ を付けるかなど目的関数の規約で変わる。通常は説明変数を標準化し、切片は罰しない。
