items:
  - id: engdesign-confounder-randomization
    note: ブロック化の正本へ、局外因子をブロックとして割付に使う場合と、処置前の連続量を共変量として解析に残す場合の選択まで統合する。block-vs-covariate単独カードを不要にする。
    metadata:
      title: 局外因子をブロック化・無作為化・共変量調整から選んで処置効果を守る
      topic: blocking-randomization-covariate-canonical
      type: strategy
      difficulty: 3
      priority: A
      hashtags: [実験計画法, ブロック化, 無作為化, 局外因子, 共変量, 共分散分析, 交絡]
    sections:
      問題: |
        処置効果を局外因子から守る設計について次を答えよ。

        1. 4処置を比較したいが、実験日は日ごとの環境差が大きい。「日」をどう扱い、処置をどう割り付けるべきか。
        2. 2処置A、BについてAを午前だけ、Bを午後だけ実施すると何が問題か。改善策を述べよ。
        3. 応答へ影響する初期重量が実験前に連続量として測定できる。初期重量を軽・中・重に分けてブロック化する方法と、実測値を共変量として共分散分析で調整する方法を比較せよ。
        4. 処置後に変化した変数を安易に共変量として調整してはいけない理由を述べよ。
      記号・用語: |
        **局外因子**は主目的ではないが応答変動へ影響する因子である。**ブロック**は局外因子の水準が近い実験単位をまとめた群で、ブロック内で処置を比較することで局外変動を処置比較から分離する。

        **交絡**は処置割付と局外因子が対応してしまい、両者の効果をデータから分離できない状態をいう。**共変量**は通常、処置前に測定された連続説明変数を指す。
      使用公式・定理: |
        乱塊法の加法モデルは
        $$
        Y_{ij}=\mu+\tau_i+\beta_j+\varepsilon_{ij},
        $$
        ここで $\tau_i$ は処置効果、$\beta_j$ はブロック効果である。同一ブロック内の処置差を取れば加法的な $\beta_j$ は消える。

        連続共変量 $X$ を用いる共分散分析の基本形は
        $$
        Y_{ij}=\mu+\tau_i+\gamma(X_{ij}-\overline X)+\varepsilon_{ij}.
        $$
        共通傾きモデルでは、処置間で回帰傾き $\gamma$ が共通であることを仮定する。
      一手／方針: |
        **「割付前に分かる局外変動を設計でそろえられるか」を最初に考える。**

        カテゴリとして自然に群分けできる局外因子ならブロック化し、そのブロック内で処置を無作為化する。連続量を粗く区切ると情報損失が大きい場合は、実測値を共変量として解析に残す選択肢がある。両者は排他的とは限らず、設計上ブロック化したうえで有用な処置前共変量を解析に使うこともできる。
      答え: |
        1. 「日」をブロックとし、各日の中で4処置を無作為に割り付ける。これにより日効果をブロック効果として分離し、処置比較を同じ日の中で行える。

        2. A=午前、B=午後に固定すると処置効果と時間帯効果が完全に対応し、差が処置によるのか時間帯によるのか判別できない。各時間帯内でA、Bを無作為化する、または時間帯をブロックとして両処置を含める設計にする。

        3. 軽・中・重へブロック化すれば、同じ区分内で処置を比較できモデル依存は比較的小さいが、区分内の重量差を捨てるため連続情報を失う。共分散分析なら
        $$
        Y=\mu+\tau_i+\gamma(X-\overline X)+\varepsilon
        $$
        と実測重量を連続的に利用でき、線形関係が適切なら効率が高い。一方で線形性や共通傾きなどのモデル仮定を要する。

        4. 処置後変数は処置そのものの影響を受けている可能性がある。その変数で調整すると、推定したい処置効果の一部まで取り除いたり新たなバイアスを生じさせたりし得る。
      計算例: |
        2処置A、Bを3日で比較し、各日でAとBを1回ずつ無作為な順序で実施する。日 $j$ の差を
        $$
        D_j=Y_{Bj}-Y_{Aj}
        $$
        とすると、加法モデルでは日効果 $\beta_j$ が差から消える。

        初期重量が40〜100の広い範囲に分布するなら、3区分だけへ丸めるより実測重量を共変量として残す方が情報を使いやすい。ただし処置と重量の関係に強い非線形性や傾きの違いがあればモデルを見直す。
      注意: |
        乱塊法の単純な加法モデルでは処置×ブロック交互作用を独立には推定しない。ブロック化は割付前に分かる局外因子を利用する設計上の操作であり、処置後に観測した変数を都合よく調整することとは異なる。

        無作為化は「平均的に交絡を避ける」仕組みであり、実現した1回の割付で全ての背景変数が完全に一致することを保証するものではない。

  - id: engdesign-incomplete-block-connectivity
    note: 不完備ブロック計画の正本へ、接続性による対比の推定可能性と、釣合い型不完備ブロック計画の基本関係・処置差分散まで統合する。BIBDの数値代入カードを不要にする。
    metadata:
      title: 不完備ブロック計画を接続性からBIBDの比較精度まで解く
      topic: incomplete-block-bibd-canonical
      type: strategy
      difficulty: 4
      priority: A
      hashtags: [実験計画法, 不完備ブロック計画, BIBD, 接続性, 推定可能性, ブロック化]
    sections:
      問題: |
        不完備ブロック計画について次を解け。

        1. ブロック1=$(A,B)$、2=$(B,C)$、3=$(D,E)$ だけからなる計画で、処置対比 $A-C$ と $A-D$ が推定可能か判定せよ。
        2. 1の計画へブロック $(C,D)$ を1つ追加すると何が変わるか。
        3. 釣合い型不完備ブロック計画で処置数 $v=4$、各ブロックの処置数 $k=3$、各処置の反復数 $r=3$、任意の処置対の共出現数 $\lambda=2$ とする。ブロック数 $b$ を求め、BIBDの2つの基本関係を確認せよ。
        4. 3でブロック内誤差分散が $\sigma^2=6$ のとき、任意の2処置の調整平均差の分散と標準誤差を求めよ。
      記号・用語: |
        不完備ブロック計画では、各ブロックに全処置を入れず一部の処置だけを配置する。

        処置を頂点、同じブロックに現れる処置対を辺とする**接続グラフ**を考える。同じ連結成分内にある処置間の対比はブロックを介して比較できる。

        **釣合い型不完備ブロック計画（BIBD）**では、$v$ 処置、$b$ ブロック、ブロックサイズ $k$、各処置の反復数 $r$、任意の処置対の共出現数 $\lambda$ が一定である。
      使用公式・定理: |
        接続グラフで同じ連結成分に属する処置対比は推定可能だが、異なる連結成分間の対比はブロック効果と分離できない。

        BIBDでは出現回数を数えることで
        $$
        bk=vr
        $$
        が成り立つ。また1つの処置と共に現れる他処置を数えると
        $$
        \lambda(v-1)=r(k-1)
        $$
        が成り立つ。

        釣合いと接続性のもとで任意の2処置の調整効果差は同じ精度をもち、ブロック内誤差分散を $\sigma^2$ とすると
        $$
        \operatorname{Var}(\widehat\tau_i-\widehat\tau_j)
        =\frac{2k\sigma^2}{\lambda v}.
        $$
      一手／方針: |
        **まず接続グラフで「そもそも比較できるか」を確認し、その後に釣合い条件と比較精度を計算する。**

        各処置の出現回数が同じというだけでは不十分で、処置群が別々の連結成分へ分断されていないことが必要である。BIBDなら任意の処置対が同じ回数共出現するため、対比較の精度もそろう。
      答え: |
        1. $A-B-C$ と道があるので $A-C$ は推定可能である。一方 $D,E$ は別の連結成分なので $A-D$ は推定不能である。

        2. $(C,D)$ を追加すると
        $$
        A-B-C-D-E
        $$
        と全処置が1つの連結成分になる。したがって $A-D$ を含む全ての処置対比が接続性の点では推定可能になる。

        3.
        $$
        b=\frac{vr}{k}=\frac{4\cdot3}{3}=\boxed{4}.
        $$
        実際
        $$
        bk=4\cdot3=12=4\cdot3=vr,
        $$
        また
        $$
        \lambda(v-1)=2(4-1)=6,
        $$
        $$
        r(k-1)=3(3-1)=6
        $$
        で、両基本関係を満たす。

        4.
        $$
        \operatorname{Var}(\widehat\tau_i-\widehat\tau_j)
        =\frac{2\cdot3\cdot6}{2\cdot4}
        =\boxed{4.5}.
        $$
        よって標準誤差は
        $$
        \boxed{\sqrt{4.5}\approx2.121}.
        $$
      計算例: |
        ブロック $(A,B),(B,C),(C,D)$ のようにAとDが直接同じブロックへ入らなくても、A-B-C-Dと道があれば $A-D$ の対比は推定可能である。直接共出現だけを見るのではなくグラフ全体の接続性を見る。
      注意: |
        「各処置が同じ回数現れる」ことだけでは接続性は保証されない。BIBDの分散公式は、等ブロックサイズ・釣合い・接続性を持つ設計に対するものである。

        不完備ブロック計画では、未調整の単純平均差ではなくブロック効果を調整した処置比較を考える必要がある。
