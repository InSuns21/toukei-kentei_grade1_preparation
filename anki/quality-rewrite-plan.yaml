batch_id: 2026-08-31-probability-canonicalization-212
items:
  - id: prob-basic-sample-space
    note: prob-counting-sample-spaceを吸収するため、有限一様標本空間の基本に場合の数・組合せで数える例を統合する。
    sections:
      問題: |
        有限一様標本空間について次を解け。

        1. 公平なサイコロ1回の標本空間を $\Omega$、事象全体を $\mathcal F$ とする。$A=\{1,3,5\}$ の確率を、確率空間の公理を確認して求めよ。
        2. 公平な硬貨を3回投げるとき、表がちょうど2回出る確率を場合の数から求めよ。
      使用公式・定理: |
        確率空間は $(\Omega,\mathcal F,P)$ で表す。確率測度 $P$ は
        $$
        P(\Omega)=1,\qquad P(E)\ge0
        $$
        および互いに排反な事象列 $(E_n)$ に対する可算加法性
        $$
        P\left(\bigcup_{n=1}^{\infty}E_n\right)
        =\sum_{n=1}^{\infty}P(E_n)
        $$
        を満たす。

        有限標本空間で全ての基本結果が等確率なら
        $$
        P(E)=\frac{|E|}{|\Omega|}.
        $$
        場合の数で計算するときは、分子と分母を同じ数え方で数える。順序を区別するなら両方で区別し、順序を無視するなら両方で組合せを使う。
      答え: |
        1.
        $$
        \Omega=\{1,2,3,4,5,6\},\qquad \mathcal F=2^\Omega.
        $$
        公平なので6個の基本結果は等確率であり
        $$
        P(A)=\frac{|A|}{|\Omega|}=\frac36=\boxed{\frac12}.
        $$

        2. 3回の硬貨投げでは順序付きの結果が $2^3=8$ 通りあり、表が2回の列は
        $$
        \binom32=3
        $$
        通りである。したがって
        $$
        P(\text{表が2回})=\frac{\binom32}{2^3}=\boxed{\frac38}.
        $$
      計算例: |
        サイコロでは $A^c=\{2,4,6\}$ なので
        $$
        P(A)+P(A^c)=\frac12+\frac12=1
        $$
        となる。

        組合せを使う別例として、赤5個・青3個から同時に2個を非復元抽出し、赤1個・青1個となる確率は
        $$
        \frac{\binom51\binom31}{\binom82}
        =\frac{15}{28}.
        $$
        分子も分母も「順序を無視した2個の組合せ」で数えている。
      一手: |
        まず「何を1つの基本結果と数えるか」を決め、それらが等確率かを確認する。等確率なら有利な結果数を全結果数で割る。

        場合の数が必要なら、分子と分母で順序あり・なし、復元・非復元の条件をそろえる。
      注意: |
        基本結果が等確率でない場合は $|E|/|\Omega|$ を使わず、各基本結果の確率を足す。

        非復元で同時に2個選ぶ問題の分母を、復元・順序ありの $8^2$ のように数えない。

  - id: prob-marginal-density
    note: prob-mixture-marginalを吸収するため、連続変数の積分による周辺化に加えて離散潜在クラスを和で消す混合分布と逆向きのBayes更新を統合する。
    metadata:
      title: 同時分布・潜在クラスを周辺化して周辺分布を求める
      topic: marginalization-canonical
      type: strategy
    sections:
      問題: |
        周辺化について次を解け。

        1. $(X,Y)$ の同時確率密度関数が $f_{X,Y}(x,y)=2$（$0<y<x<1$）、それ以外で0である。$X$ の周辺密度 $f_X(x)$ を求めよ。
        2. 潜在クラス $Z$ が $P(Z=1)=0.3$, $P(Z=2)=0.7$ を満たし、$P(X=1\mid Z=1)=0.8$, $P(X=1\mid Z=2)=0.2$ とする。$P(X=1)$ を求めよ。さらに観測 $X=1$ の後の $P(Z=1\mid X=1)$ を求めよ。
      使用公式・定理: |
        同時分布から不要な変数を消す操作が周辺化である。離散型では
        $$
        p_X(x)=\sum_y p_{X,Y}(x,y),
        $$
        連続型では
        $$
        f_X(x)=\int_{-\infty}^{\infty}f_{X,Y}(x,y)\,dy.
        $$
        実際の和・積分の範囲は同時分布の台から決める。

        離散潜在クラス $Z$ を消す場合も同じ原理で
        $$
        p_X(x)=\sum_z p_{X\mid Z}(x\mid z)P(Z=z).
        $$
        連続観測なら
        $$
        f_X(x)=\sum_z f_{X\mid Z}(x\mid z)P(Z=z).
        $$
        これは全確率の公式を分布に適用した形である。

        観測後に潜在クラスへ逆向きに戻るときは
        $$
        P(Z=k\mid X=x)
        =\frac{P(Z=k)p_{X\mid Z}(x\mid k)}{p_X(x)}
        $$
        を使う。連続観測では確率質量を密度へ読み替える。
      答え: |
        1. $0<x<1$ を固定すると $0<y<x$ なので
        $$
        \begin{aligned}
        f_X(x)
        &=\int_0^x2\,dy\\
        &=\boxed{2x},\qquad0<x<1.
        \end{aligned}
        $$

        2. 潜在クラスを和で消すと
        $$
        \begin{aligned}
        P(X=1)
        &=0.8\cdot0.3+0.2\cdot0.7\\
        &=0.24+0.14\\
        &=\boxed{0.38}.
        \end{aligned}
        $$
        したがってベイズの定理より
        $$
        P(Z=1\mid X=1)
        =\frac{0.3\cdot0.8}{0.38}
        =\frac{12}{19}
        \approx\boxed{0.632}.
        $$
      計算例: |
        離散型の同時表で
        $$
        p(0,0)=0.1,\quad p(0,1)=0.2,\quad
        p(1,0)=0.3,\quad p(1,1)=0.4
        $$
        なら、$Y$ を足し消して
        $$
        p_X(0)=0.3,\qquad p_X(1)=0.7.
        $$

        連続観測の混合例として
        $$
        P(Z=1)=P(Z=2)=\frac12,
        $$
        $$
        f_{X\mid Z}(x\mid1)=0.6,\qquad
        f_{X\mid Z}(x\mid2)=0.2
        $$
        なら
        $$
        f_X(x)=0.5\cdot0.6+0.5\cdot0.2=0.4,
        $$
        さらに
        $$
        P(Z=1\mid X=x)=\frac{0.5\cdot0.6}{0.4}=0.75.
        $$
      一手: |
        **残したい変数を固定し、消したい変数を全部足すか積分する。** 連続変数なら台を読んで積分し、離散潜在クラスなら各クラスの「条件付き分布×混合比」を足す。

        観測後にクラスへ戻る場合は、同じ各項を作り、その総和で割って正規化する。
      注意: |
        三角形など変数依存の台を長方形として積分しない。離散表では行と列のどちらがどの変数かを確認する。

        連続観測では一般に $P(X=x)=0$ なので点確率の比ではなく、条件付き密度と周辺密度を使ってベイズ更新する。
