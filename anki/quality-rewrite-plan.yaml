schema_version: 1
batch_id: 2026-08-31-probability-canonicalization-214
items:
  - id: prob-variance-independent-sum
    note: 旧dist-variance-momentを吸収するため、分散の正本へ二次モーメントからの基本恒等式を追加し、線形結合・独立和まで一続きにする。
    metadata:
      title: 二次モーメント・共分散から分散と線形結合の分散を求める
      topic: variance-canonical
      type: strategy
    sections:
      問題: |
        分散について次を解け。

        1. $E[X]=2$, $E[X^2]=6$ から $\operatorname{Var}(X)$ を求めよ。
        2. 独立な $X,Y$ について $\operatorname{Var}(X)=4$, $\operatorname{Var}(Y)=9$ とする。$\operatorname{Var}(X+Y)$ と $\operatorname{Var}(X-Y)$ を求めよ。
        3. $E[X]=10$, $\operatorname{Var}(X)=25$ のとき $Z=(X-10)/5$ の期待値と分散を求めよ。
      使用公式・定理: |
        分散は定義から
        $$
        \operatorname{Var}(X)=E[(X-E[X])^2]
        =E[X^2]-E[X]^2.
        $$
        したがって二次モーメント $E[X^2]$ は分散そのものではなく、平均の二乗を引いて初めて分散になる。

        分散が有限な $X,Y$ と定数 $a,b,c$ について
        $$
        \operatorname{Var}(aX+bY+c)
        =a^2\operatorname{Var}(X)+b^2\operatorname{Var}(Y)
        +2ab\operatorname{Cov}(X,Y).
        $$
        特に独立なら $\operatorname{Cov}(X,Y)=0$ なので
        $$
        \operatorname{Var}(aX+bY)
        =a^2\operatorname{Var}(X)+b^2\operatorname{Var}(Y).
        $$
        また
        $$
        \operatorname{Var}(aX+c)=a^2\operatorname{Var}(X).
        $$
      答え: |
        1.
        $$
        \operatorname{Var}(X)=6-2^2=\boxed{2}.
        $$

        2. 独立性から共分散は0なので
        $$
        \operatorname{Var}(X+Y)=4+9=\boxed{13},
        $$
        $$
        \operatorname{Var}(X-Y)=4+(-1)^2\,9=\boxed{13}.
        $$

        3. 期待値の線形性と分散のスケール則より
        $$
        E[Z]=\frac{10-10}{5}=\boxed0,
        $$
        $$
        \operatorname{Var}(Z)=\frac1{25}\operatorname{Var}(X)
        =\boxed1.
        $$
      計算例: |
        $E[X]=3,E[X^2]=14$ なら
        $$
        \operatorname{Var}(X)=14-3^2=5.
        $$
        さらに
        $$
        \operatorname{Var}(3X-2)=3^2\operatorname{Var}(X)=45.
        $$
        定数シフト $-2$ は分散へ影響しない。

        独立でない場合に $\operatorname{Var}(X)=4$, $\operatorname{Var}(Y)=9$, $\operatorname{Cov}(X,Y)=2$ なら
        $$
        \operatorname{Var}(X-Y)=4+9-2\cdot2=9.
        $$
      一手: |
        **分散を求める入口を見分ける。** 二次モーメントが与えられたら $E[X^2]-E[X]^2$、線形結合ならまず共分散項まで含む一般式を書く。独立性が与えられたときだけ共分散を0にする。
      注意: |
        $E[X^2]$ と $E[X]^2$ は異なる。$E[X^2]$ をそのまま分散としない。

        引き算でも係数は二乗されるため、独立なら $\operatorname{Var}(X-Y)=\operatorname{Var}(X)+\operatorname{Var}(Y)$ である。独立でない場合は共分散項を落とさない。標準化では分散ではなく標準偏差で割る。

  - id: prob-transform-nonmonotonic
    note: 旧dist-jacobian-scaleを吸収するため、変数変換正本へ1対1の単調変換を特殊ケースとして追加し、多対1変換との使い分けを一本化する。
    metadata:
      title: 1変数変換を単調・多対1で使い分けて密度を求める
      topic: one-dimensional-transform-canonical
      type: strategy
    sections:
      問題: |
        1変数の変数変換について次を解け。

        1. $X$ の確率密度関数が $f_X(x)=e^{-x}$（$x>0$）、それ以外で0である。$Y=2X$ の確率密度関数を求めよ。
        2. $X$ が一様分布 $U(-1,1)$ に従い、$Y=X^2$ とする。$Y$ の確率密度関数を求めよ。
      使用公式・定理: |
        $Y=g(X)$ が1対1で単調で、逆変換 $x=g^{-1}(y)$ が微分可能なら
        $$
        f_Y(y)=f_X(g^{-1}(y))
        \left|\frac{d}{dy}g^{-1}(y)\right|.
        $$
        **逆変換→変換後の台→Jacobianの絶対値**の順に処理する。

        一方、$g$ が1対1でなく、ある $y$ に対する逆像が
        $$
        x_1(y),\ldots,x_m(y)
        $$
        で各枝が局所的に単調なら
        $$
        f_Y(y)=\sum_{j=1}^m
        f_X(x_j(y))\left|\frac{dx_j}{dy}\right|.
        $$
        同じ $y$ を生む全ての枝を足す。

        多対1変換では累積分布関数
        $$
        F_Y(y)=P\{g(X)\le y\}
        $$
        を領域確率として求めてから微分する方法も安全である。
      答え: |
        1. $Y=2X$ では逆変換は
        $$
        x=\frac y2,
        \qquad
        \left|\frac{dx}{dy}\right|=\frac12.
        $$
        $X>0$ から $Y>0$ なので
        $$
        f_Y(y)=e^{-y/2}\frac12
        =\boxed{\frac12e^{-y/2}},\qquad y>0.
        $$

        2. $0<y<1$ では逆像が $\pm\sqrt y$ の2本ある。累積分布関数を使うと
        $$
        \begin{aligned}
        F_Y(y)
        &=P(-\sqrt y\le X\le\sqrt y)\\
        &=\int_{-\sqrt y}^{\sqrt y}\frac12\,dx\\
        &=\sqrt y.
        \end{aligned}
        $$
        よって
        $$
        f_Y(y)=F_Y'(y)
        =\boxed{\frac1{2\sqrt y}},\qquad0<y<1.
        $$
      計算例: |
        単調変換の例では
        $$
        \int_0^\infty\frac12e^{-y/2}\,dy=1
        $$
        となり、Jacobianを掛けることで正規化が保たれる。

        多対1変換で標準正規分布に従う $X$ と $Y=X^2$ を考えると、逆像は $\pm\sqrt y$ なので
        $$
        \begin{aligned}
        f_Y(y)
        &=\phi(\sqrt y)\frac1{2\sqrt y}
        +\phi(-\sqrt y)\frac1{2\sqrt y}\\
        &=\frac{e^{-y/2}}{\sqrt{2\pi y}},\qquad y>0.
        \end{aligned}
        $$
        これは自由度1のカイ二乗分布の密度である。
      一手: |
        **最初に「この $y$ を生む元の $x$ は何個あるか」を数える。** 1個なら逆変換とJacobian、複数なら各逆像枝の寄与を足す。多対1で迷ったら累積分布関数法へ戻る。
      注意: |
        変換後の台を書き忘れない。Jacobianは絶対値を取る。

        二乗・絶対値のような多対1変換で1本の逆関数だけを使うと確率質量を落とす。単調変換の公式は多対1変換の各枝へ適用して足し合わせる特殊ケースだと捉える。
