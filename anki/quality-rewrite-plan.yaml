items:
  - id: ts-acf-pacf-identification
    note: ACF・PACF正本へ標本PACFの近似95%限界による有意ラグ判定を数値例付きで統合し、engineering側のPACF出力単独カードを吸収する。
    metadata:
      title: ACF・PACFの有意性からAR/MA候補を絞りYule–Walkerで係数まで求める
      topic: acf-pacf-yule-walker-canonical
      type: strategy
      difficulty: 3
      priority: A
      hashtags: [時系列解析, ACF, PACF, ARモデル, MAモデル, Yule-Walker方程式, モデル同定]
    sections:
      問題: |
        ACF・PACFとYule--Walker方程式について次を解け。

        1. AR$(p)$、MA$(q)$、ARMA$(p,q)$ の理論ACF・PACFの典型的な形を述べよ。
        2. 観測数 $n=100$ の標本PACFがラグ1で0.55、ラグ2で$-0.24$、ラグ3で0.12であった。点ごとの近似95%限界 $\pm1.96/\sqrt n$ を用いて有意なラグを判定せよ。
        3. 標本ACFが $(0.70,0.49,0.34,\ldots)$ と減衰し、標本PACFが $(0.70,0.02,-0.01,\ldots)$ なら第一候補を答えよ。
        4. 標本ACFが $(0.45,0.01,-0.02,\ldots)$ とラグ1でほぼ打ち切られ、PACFが徐々に減衰するなら第一候補を答えよ。
        5. $\rho_1=0.6,\rho_2=0.2$ のときラグ2偏自己相関 $\alpha_{22}$ を求めよ。
        6. AR$(2)$で $\rho(1)=0.6,\rho(2)=0.4$ とする。Yule--Walker方程式から $\phi_1,\phi_2$ を求めよ。
      記号・用語: |
        ACFは自己相関関数、PACFは偏自己相関関数である。ラグ $k$ のPACFは、$X_t$ を $X_{t-1},\ldots,X_{t-k}$ で最良線形予測したときの最遠ラグ $X_{t-k}$ の係数とみなせる。

        Yule--Walker方程式は、ARモデルの係数と理論自己共分散・自己相関を結ぶ。標本自己相関を代入すればAR係数のモーメント型推定にも使える。
      使用公式・定理: |
        理論的な目安は次である。

        - AR$(p)$：ACFは減衰し、PACFはラグ $p$ で打ち切り。
        - MA$(q)$：ACFはラグ $q$ で打ち切り、PACFは減衰。
        - ARMA$(p,q)$：ACF・PACFとも一般に減衰。

        大標本の白色雑音を基準にした標本ACF・PACFの点ごとの近似95%限界は
        $$
        \pm\frac{1.96}{\sqrt n}
        $$
        が目安になる。

        ラグ2偏自己相関は
        $$
        \alpha_{22}=\frac{\rho_2-\rho_1^2}{1-\rho_1^2}.
        $$

        AR$(2)$のYule--Walker方程式は
        $$
        \rho(1)=\phi_1+\phi_2\rho(1),
        $$
        $$
        \rho(2)=\phi_1\rho(1)+\phi_2.
        $$
      一手／方針: |
        **モデル同定では「ACFとPACFのどちらが打ち切られるか」を先に見る。** 有限標本では厳密な0にならないので、近似限界を使って「標本変動で説明できる小ささか」を判断する。

        次数候補を得たら、Yule--Walkerなどで係数を求め、最後に情報量規準・係数推定・残差診断で候補を確認する。
      答え: |
        1. AR$(p)$ はACFが減衰しPACFがラグ $p$ で打ち切られる。MA$(q)$ はACFがラグ $q$ で打ち切られPACFが減衰する。ARMA$(p,q)$ は両方とも一般に減衰する。

        2.
        $$
        \frac{1.96}{\sqrt{100}}=0.196.
        $$
        したがって
        $$
        |0.55|>0.196,\qquad |-0.24|>0.196,\qquad |0.12|<0.196
        $$
        より、ラグ1と2が有意、ラグ3は有意でない。この見え方はAR$(2)$候補と整合的である。

        3. PACFがラグ1だけ大きくACFが減衰しているので
        $$
        \boxed{\operatorname{AR}(1)}
        $$
        が第一候補である。

        4. ACFがラグ1で打ち切られPACFが減衰するので
        $$
        \boxed{\operatorname{MA}(1)}
        $$
        が第一候補である。

        5.
        $$
        \alpha_{22}
        =\frac{0.2-0.6^2}{1-0.6^2}
        =\frac{-0.16}{0.64}
        =\boxed{-0.25}.
        $$

        6.
        $$
        0.6=\phi_1+0.6\phi_2,
        $$
        $$
        0.4=0.6\phi_1+\phi_2.
        $$
        第1式から $\phi_1=0.6-0.6\phi_2$。第2式へ代入すると
        $$
        0.4=0.36+0.64\phi_2
        $$
        なので
        $$
        \boxed{\phi_2=0.0625},\qquad
        \boxed{\phi_1=0.5625}.
        $$
      計算例: |
        AR$(1)$では理論的に $\rho_2=\rho_1^2$ なので
        $$
        \alpha_{22}=\frac{\rho_1^2-\rho_1^2}{1-\rho_1^2}=0.
        $$
        したがってAR$(1)$の理論PACFがラグ1で打ち切られることを、ラグ2について直接確認できる。
      注意: |
        $\pm1.96/\sqrt n$ は各ラグを個別に見る近似的な目安であり、多数ラグを同時に検定する厳密な同時信頼帯ではない。ACF・PACFだけで次数を確定せず、情報量規準と残差診断を併用する。

        PACFは単なる $\rho_k$ ではなく、中間ラグの線形効果を調整した量である。

  - id: engproc-arima110-difference-forecast
    note: ARIMA予測正本へソフトウェアが返すforecastとprediction standard errorから予測区間を復元する数値例を統合し、ARIMA予測出力単独カードを吸収する。
    metadata:
      title: ARIMA予測を差分から水準へ戻し点予測・予測区間まで作る
      topic: arima-difference-forecast-canonical
      type: strategy
      difficulty: 3
      priority: A
      hashtags: [時系列解析, ARIMA過程, 差分, 予測, 予測区間, ドリフト]
    sections:
      問題: |
        水準系列 $X_t$ の1階差分を
        $$
        Y_t=\Delta X_t=X_t-X_{t-1}
        $$
        とする。

        1. 将来の差分予測 $\widehat Y_{t+j\mid t}$ から、$h$期先の水準予測 $\widehat X_{t+h\mid t}$ を作る一般式を導け。
        2. ARIMA$(1,1,0)$ として
        $$
        Y_t=0.5Y_{t-1}+\varepsilon_t,
        $$
        $X_t=50,Y_t=4$ のとき、$X_{t+2}$ の点予測を求めよ。
        3. ドリフト付きARIMA$(0,1,0)$
        $$
        \Delta X_t=1.5+\varepsilon_t,
        $$
        $X_t=100$ のとき3期先の点予測を求めよ。
        4. 推定済みARIMAモデルの出力が1期先について `forecast = 80.0`, `prediction standard error = 2.5` であった。正規近似による95%予測区間を求めよ。
      記号・用語: |
        $\Delta X_t$ は1期の増分、$Y_t$ は差分系列である。ARIMAモデルでは非定常な水準系列を差分して定常なARMA型系列として扱い、その予測を最後に累積して水準へ戻す。

        予測誤差標準偏差は、将来観測 $X_{t+h}-\widehat X_{t+h\mid t}$ の不確実性を表す。係数推定値の標準誤差とは別物である。
      使用公式・定理: |
        恒等式
        $$
        X_{t+h}=X_t+\sum_{j=1}^{h}\Delta X_{t+j}
        $$
        の条件付き期待値を取れば
        $$
        \widehat X_{t+h\mid t}
        =X_t+\sum_{j=1}^{h}\widehat Y_{t+j\mid t}.
        $$

        ARIMA$(1,1,0)$で
        $$
        Y_t=\phi Y_{t-1}+\varepsilon_t
        $$
        なら
        $$
        \widehat Y_{t+j\mid t}=\phi^jY_t.
        $$

        ドリフト付きARIMA$(0,1,0)$では
        $$
        \widehat X_{t+h\mid t}=X_t+hd.
        $$

        正規革新を仮定し、予測誤差標準偏差を $s_h$ とすれば近似95%予測区間は
        $$
        \widehat X_{t+h\mid t}\pm1.96s_h.
        $$
      一手／方針: |
        **まず差分系列を予測し、それを現在の水準へ累積する。点予測を作った後、予測誤差標準偏差が与えられたらその周りへ予測区間を付ける。**

        差分系列の予測値1個だけを $X_t$ に足すのではなく、$h$期先なら途中の将来差分を全て足す。
      答え: |
        1.
        $$
        \boxed{\widehat X_{t+h\mid t}
        =X_t+\sum_{j=1}^{h}\widehat Y_{t+j\mid t}}.
        $$

        2. $\phi=0.5,Y_t=4$ なので
        $$
        \widehat Y_{t+1\mid t}=2,
        $$
        $$
        \widehat Y_{t+2\mid t}=1.
        $$
        よって
        $$
        \widehat X_{t+2\mid t}=50+2+1=\boxed{53}.
        $$

        3. 将来の各差分の予測値は1.5なので
        $$
        \widehat X_{t+3\mid t}=100+3(1.5)=\boxed{104.5}.
        $$

        4.
        $$
        80.0\pm1.96(2.5)=80.0\pm4.9
        $$
        なので
        $$
        \boxed{(75.1,84.9)}.
        $$
      計算例: |
        ドリフトなしARIMA$(0,1,0)$、すなわちランダムウォーク
        $$
        \Delta X_t=\varepsilon_t
        $$
        では将来差分の条件付き期待値は全て0なので
        $$
        \widehat X_{t+h\mid t}=X_t
        $$
        である。

        予測値80.0、予測誤差標準偏差2.5に対し実現値85.3なら、95%予測区間の上側84.9を超えるためモデル再点検の材料になる。
      注意: |
        予測区間に使うのは予測誤差の標準偏差であり、AR係数やMA係数の推定標準誤差ではない。多期先では将来革新が累積するため、一般に予測誤差分散も期先とともに変化する。

        ドリフト $d$ は差分系列の平均であり、水準系列の固定切片とは異なる。
