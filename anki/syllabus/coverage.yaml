schema_version: 3
scope: 統計数理・統計応用（理工学）
meaning:
  complete: 全公式用語を操作するカードがある
  partial: 既存カードはあるが公式用語の全件対応は未完成
  planned: 対象範囲内で今後カードを追加する
  term_card: 公式用語を実際に操作するカードがある
  term_planned: 対象範囲内だが対応カードは未完成
