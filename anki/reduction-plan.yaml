    note: 重回帰の正本へモデル式から1観測分の計画行列行を作る手順を統合済み。E[Y]=beta0+beta1 x+beta2 D+beta3 xD について行 (1,x,D,xD) を作り、観測 (2,0),(3,1) から [[1,2,0,0],[1,3,1,3]] を構成する同一数値例まで含むため独立カード不要。
  - id: enginf-interaction-slope-test
    bucket: duplicates
