schema_version: 1
batch_id: 2026-08-31-probability-sampling-reduction-224
items:
  - id: prob-mixed-cdf
    bucket: duplicates
    reason: duplicate
    canonical_card: prob-cdf-from-density
    coverage_card: prob-cdf-from-density
    note: 累積分布関数の正本へ、離散の確率質量の総和・連続密度の積分・点質量と連続部分が共存する混合分布を統合済み。旧カードのP(Y=0)=1/2と(0,1)上の連続部分の例も同じ正本で明示しているため独立カードは不要。

  - id: dist-weak-law-sample-mean
    bucket: duplicates
    reason: duplicate
    canonical_card: dist-weak-law-chebyshev
    coverage_card: dist-weak-law-chebyshev
    note: 弱法則の正本へ確率収束の定義 P(|Xbar_n-mu|>=epsilon)->0 を明示し、さらにVar(Xbar_n)=sigma^2/nとChebyshevの不等式から同じ結論を導出する流れまで統合済み。結論だけを問う旧カードは不要。

  - id: prob-linear-combination-moments
    bucket: duplicates
    reason: duplicate
    canonical_card: prob-variance-independent-sum
    coverage_card: prob-variance-independent-sum
    note: 正本がE[aX+bY+c]とVar(aX+bY+c)=a^2Var(X)+b^2Var(Y)+2abCov(X,Y)を扱い、独立時の特殊化と標準化まで包含している。旧カードの線形結合の平均・分散は完全な部分集合。

  - id: prob-transform-log
    bucket: duplicates
    reason: duplicate
    canonical_card: dist-lognormal-transformation
    coverage_card: dist-lognormal-transformation
    note: 対数正規分布の正本は一般のY~N(mu,sigma^2), X=e^Yから逆変換とJacobianを用いて密度を導出しており、旧カードの標準正規Y~N(0,1)はその特殊ケース。一般形を残せば技能を失わない。

  - id: dist-clt-statement
    bucket: duplicates
    reason: duplicate
    canonical_card: dist-clt-sample-mean
    coverage_card: dist-clt-sample-mean
    note: 中心極限定理の正本がsqrt(n)(Xbar-mu)/sigma=>N(0,1)を明示したうえで、標本平均と和の近似分布・標準化・数値計算まで扱う。定理文だけを独立カードにする必要がない。

  - id: dist-clt-sum-variance
    bucket: duplicates
    reason: duplicate
    canonical_card: dist-clt-sample-mean
    coverage_card: dist-clt-sample-mean
    note: 正本にS_n=sum XiについてE[S_n]=nmu, Var(S_n)=n sigma^2, SD(S_n)=sigma sqrt(n)が明示され、その値を使った標準化まで含まれる。和の標準偏差だけを問う旧カードは完全重複。

  - id: dist-clt-standard-error
    bucket: duplicates
    reason: duplicate
    canonical_card: dist-clt-sample-mean
    coverage_card: dist-clt-sample-mean
    note: 正本にVar(Xbar)=sigma^2/nとSE(Xbar)=sigma/sqrt(n)が明示され、実際の確率計算で使用している。標準誤差だけを問う旧カードは正本の一ステップに含まれる。

  - id: samp-z-statistic-known-variance
    bucket: duplicates
    reason: duplicate
    canonical_card: samp-xbar-normal-distribution
    coverage_card: samp-xbar-normal-distribution
    note: 正規母集団の標本平均正本がXbar~N(mu,sigma^2/n)を厳密に示し、標準誤差sigma/sqrt(n)まで扱うため、Z=(Xbar-mu)/(sigma/sqrt(n))~N(0,1)は直接の標準化にすぎない。独立カードは不要。

  - id: samp-t-statistic-mean-test
    bucket: duplicates
    reason: duplicate
    canonical_card: samp-t-distribution-definition
    coverage_card: samp-t-distribution-definition
    note: t分布正本にT=Z/sqrt(V/nu)の定義だけでなく、正規標本について(Xbar-mu)/(S/sqrt(n))~t_{n-1}を、標本平均・標本分散のカイ二乗分布・独立性から導出する計算例まで既に含む。旧カードは同じ導出の重複。
