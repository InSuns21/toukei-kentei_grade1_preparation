    canonical_card: prob-mgf-affine-transform
    note: 強化済みcanonicalへ独立和の積則、同分布なら累乗、一般線形結合Y=b+sum a_i X_iまで統合し、3個のiid和の数値例も吸収済み。
  - id: prob-mgf-exponential-domain
    bucket: duplicates
    reason: duplicate
    canonical_card: prob-mgf-gamma
    note: ガンマ分布canonicalでshape=1, rate=lambdaを代入して指数分布M_X(t)=lambda/(lambda-t), t<lambdaを導出し、収束条件まで扱うため分布別カードは重複。
  - id: prob-mgf-identify-normal
    bucket: duplicates
    reason: duplicate
    canonical_card: prob-mgf-uniqueness-domain
    note: 一意性canonicalへ正規分布のMGFとexp(3t+2t^2)からN(3,4)を同定する完全例を吸収済み。形の照合だけのカードは独立保持しない。
