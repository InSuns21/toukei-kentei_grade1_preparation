items:
  - id: asym-mle-exponential-rate-numeric
    bucket: duplicates
    reason: duplicate
    canonical_card: asym-exponential-rate-mle
    note: どちらも指数rate lambda の MLE=1/Xbar と ASE=lambda/sqrt(n) を得る。同じ結論をFisher情報量で再計算するカードを残さず、CLT→g(x)=1/x→Delta法で導出するcanonicalへ統合する。
  - id: asym-poisson-mle-numeric
    bucket: duplicates
    reason: duplicate
    canonical_card: asym-mle-poisson-tail-probability
    note: Poisson MLE=Xbar、I_1(lambda)=1/lambda、Avar=lambda/n まで完全に重複。canonical側はさらに標準化して尾確率を求めるため、1枚で同じmoveを最後まで動かせる。
  - id: asym-delta-bernoulli-odds
    bucket: too_specific
    reason: too_specific
    canonical_card: asym-logit-proportion-delta
    note: Bernoulli比率へ1次元Delta法を適用する同型例。オッズ p/(1-p) 単独より、logit=log{p/(1-p)} の方が統計推測で標準的で、同じ「微分の二乗×元分散」を練習できる。
  - id: asym-delta-two-sample-log-risk-ratio
    bucket: too_specific
    reason: too_specific
    canonical_card: asym-ratio-two-means-delta
    note: 独立2標本に多変量Delta法を使い、対角共分散行列と勾配から分散を作る同一move。平均比のcanonicalを代表例にし、log risk ratio固有の式はformula/reference側で参照可能とする。
