    canonical_card: prob-conditional-definition-direct
    note: どちらも P(A|B)=P(A∩B)/P(B) へ数値を代入する同一操作。後者は過去問根拠があり、分母は条件記号右側という一手も明示する。
  - id: prob-basic-total-probability
    bucket: duplicates
    reason: duplicate
    canonical_card: prob-total-probability
    note: 分割ごとに P(D|A_j)P(A_j) を足す全確率の同一計算。既存解法カードへ統合する。
  - id: prob-basic-bayes
    bucket: duplicates
    reason: duplicate
    canonical_card: prob-bayes-diagnostic
    note: 事後確率を全確率で割る同一move。canonical側は過去問根拠があり、与えられた条件付き確率と求める向きが逆という理由まで扱う。
  - id: prob-basic-inclusion-exclusion
    bucket: duplicates
    reason: duplicate
    canonical_card: prob-inclusion-exclusion
    note: 2事象の和集合で共通部分を1回引く完全重複。3事象版は別カードとして残す。
  - id: prob-basic-chain-rule
    bucket: duplicates
    reason: duplicate
    canonical_card: prob-chain-rule-three
    note: 3事象の共通部分を P(A)P(B|A)P(C|A∩B) に分解する同一操作。より一般的な既存chain-ruleカードへ統合する。
