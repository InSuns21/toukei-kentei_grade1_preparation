    note: 条件付き確率・条件付き独立の正本へ旧カードと同じP(A∩B)=0.18,P(B)=0.30からP(A|B)=0.60を求める問題と、逆向きのP(A∩B)=P(A|B)P(B)を統合済み。さらに同じ定義を使ってC条件下の確率をそろえ、P(A∩B|C)=P(A|C)P(B|C)で条件付き独立を判定する流れまで一本化したため旧単発カードは不要。
