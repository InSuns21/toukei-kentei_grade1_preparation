    note: 漸近正規性の一般式、スコア方程式の真値周りTaylor展開、スコアのCLTと観測曲率の情報量収束から sqrt(n)(hat(theta)-theta_0) -> N(0,I_1(theta_0)^(-1)) を得る技能は asym-mle-asymptotic-normality がより詳細に正本化済み。旧カードのPoisson例で使う I_1(lambda)=1/lambda と近似分散 lambda/n は asym-mle-poisson-tail-probability が情報量導出から数値確率近似まで保持しているため、旧カード固有の技能は残らない。
