    canonical_card: dist-gamma-moments-by-definition
    coverage_card: dist-gamma-moments-by-definition
    note: 正本にGamma(1,lambda)=Exponential(lambda)を明示し、一般ガンマ分布の導出式へalpha=1,beta=lambdaを代入してE[X]=1/lambda、E[X^2]=2/lambda^2、Var(X)=1/lambda^2まで求めている。指数分布だけの旧モーメントカードは一般導出の特殊ケース。
