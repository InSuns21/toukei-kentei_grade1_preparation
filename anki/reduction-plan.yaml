    canonical_card: reg-dummy-variable
    coverage_card: reg-dummy-variable
    note: ダミー変数正本に3群A・B・Cの基準カテゴリ変更を統合済み。A基準の切片10、B係数2、C係数-1から群平均(10,12,9)を復元し、C基準で切片9、A係数1、B係数3へ再符号化する同一例を含むため完全重複。
