  - id: prob-counting-sample-space
    bucket: duplicates
    reason: duplicate
    canonical_card: prob-basic-sample-space
    coverage_card: prob-basic-sample-space
    note: 有限一様標本空間の正本へ、硬貨3回で表ちょうど2回を binom(3,2)/2^3=3/8 と数える同一問題を統合済み。さらに赤5・青3から非復元で2個選ぶ組合せ例も保持し、分子分母で順序・復元条件をそろえる注意まで吸収した。
  - id: prob-mixture-marginal
    bucket: duplicates
    reason: duplicate
    canonical_card: prob-marginal-density
    coverage_card: prob-marginal-density
    note: 周辺化正本を、連続変数の積分だけでなく離散潜在クラスの総和 p_X(x)=sum_z p(x|z)P(z) まで拡張済み。旧カードと同じ0.3/0.7、0.8/0.2の例でP(X=1)=0.38、さらにBayes逆更新P(Z=1|X=1)=12/19≈0.632と連続混合密度例まで統合したため独立カード不要。
