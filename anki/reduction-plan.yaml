items:
  - id: test-chi-square-fit
    bucket: duplicates
    reason: duplicate
    canonical_card: samp-multinomial-cell-counts
    coverage_card: samp-multinomial-cell-counts
    note: 多項標本の正本にPearson適合度統計量、既知確率なら自由度k-1、同じデータから帰無モデルの内部母数をr個推定した場合はk-1-r、旧カードと同じk=5,r=1ならdf=3の数値例まで統合済み。旧単発カードは不要。

  - id: dist-bivariate-normal-definition
    bucket: duplicates
    reason: duplicate
    canonical_card: dist-multivariate-normal-density
    coverage_card: dist-multivariate-normal-density
    note: 一般p次元多変量正規密度の正本に、二変量の分散共分散行列、sigma1・sigma2・rho表示、行列式、逆行列、展開した密度、|rho|<1の非退化条件、|rho|=1の退化まで統合済み。二変量だけの旧定義カードは完全な特殊ケース。

  - id: dist-normal-sum
    bucket: duplicates
    reason: duplicate
    canonical_card: prob-linear-combination-normal
    coverage_card: prob-linear-combination-normal
    note: 多変量正規分布の一般線形結合a^T XがN(a^T mu,a^T Sigma a)に従う正本が、独立正規変数の和を共分散0の特殊ケースとして完全包含している。旧カードのsum a_i X_iの平均・分散公式は正本から直接得られる。
