schema_version: 1
batch_id: 2026-08-31-linear-contrast-reduction-251
items:
  - id: enginf-linear-combination-normal
    bucket: duplicates
    reason: duplicate
    canonical_card: mv-covariance-linear-transform
    coverage_card: mv-covariance-linear-transform
    note: 正規ベクトルの線形結合 a^T beta_hat の平均・分散・正規分布は mv-covariance-linear-transform へ有限標本の exact な結論として吸収済み。分散 a^T C a と係数差での共分散項も保持し、漸近正規性との違いも正本で明示したため工学側カード固有の技能は残らない。
  - id: enginf-contrast-estimate-se
    bucket: duplicates
    reason: duplicate
    canonical_card: reg-general-linear-hypothesis
    coverage_card: anova-contrast-definition
    note: 一般の線形制約 c^T beta=L0 に対する推定値 c^T beta_hat と標準誤差 sqrt(c^T V_hat c)、共分散を含む数値例を reg-general-linear-hypothesis へ吸収済み。工学側にあった「一般の回帰係数対比でも係数和0」という過剰条件は正本化時に修正し、係数和0は群平均の対比で用いる条件として anova-contrast-definition と役割分担した。
  - id: enginf-contrast-t-test
    bucket: duplicates
    reason: duplicate
    canonical_card: reg-general-linear-hypothesis
    coverage_card: reg-general-linear-hypothesis
    note: 1本の一般線形制約に対する t=(c^T beta_hat-L0)/SE、自由度、両側判定、95%信頼区間、q=1 で F=t^2 となる関係まで reg-general-linear-hypothesis へ統合済み。工学側の -2/0.781=-2.56 の数値例も正本に保持されている。
