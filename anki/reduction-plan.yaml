    canonical_card: reg-interaction-dummy-continuous
    coverage_card: reg-interaction-dummy-continuous
    note: 交互作用正本にD=0の傾きbeta1、D=1の傾きbeta1+beta3、beta3が傾き差であることを統合済み。さらに betahat1=1.2, betahat3=-0.5, SE=0.2 の同一例を有限標本ではt=-2.5で検定し、大標本Wald正規近似でも同じ判定になることまで整理したため吸収可能。
  - id: enginf-dummy-reference-contrast
