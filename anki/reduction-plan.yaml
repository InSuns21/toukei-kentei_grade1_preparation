schema_version: 1
batch_id: 2026-08-30-engineering-multivariate-reduction-38
items:
  - id: engmv-normal-density-numeric
    bucket: duplicates
    reason: duplicate
    canonical_card: dist-multivariate-normal-density
    note: 2変量正規密度の行列式・逆行列・二次形式・数値代入を一般canonicalへ吸収済み。

  - id: engmv-normal-marginal-numeric
    bucket: duplicates
    reason: duplicate
    canonical_card: dist-bivariate-normal-marginal
    note: 任意の部分ベクトルの周辺化へ一般化し、3変量から第1・第3成分を抜く同じ数値例をcanonicalへ吸収済み。

  - id: engmv-conditional-normal-numeric
    bucket: duplicates
    reason: duplicate
    canonical_card: dist-multivariate-normal-conditional
    note: 平均(1,2)、共分散[[4,3],[3,9]]、Y=5からX|Y=5~N(2,3)を求める数値例がcanonicalと同一。

  - id: engmv-linear-combination-normal
    bucket: duplicates
    reason: duplicate
    canonical_card: prob-linear-combination-normal
    note: 多変量正規ベクトルの一般線形結合へcanonicalを拡張し、相関ありのN(-3,36)数値例も吸収済み。

  - id: engmv-pca-rayleigh-process-variance
    bucket: duplicates
    reason: duplicate
    canonical_card: mv-pca-variance-max
    note: Rayleigh商最大化から最大固有値・固有ベクトルを求める操作はPCA canonicalでLagrange法と2x2数値例まで扱う。

  - id: engmv-standardized-pca-2x2
    bucket: duplicates
    reason: duplicate
    canonical_card: mv-pca-covariance-vs-correlation
    note: 相関行列[[1,.8],[.8,1]]の固有値1.8,.2、PC1、寄与率0.9をcanonicalへ吸収済み。

  - id: engmv-lda-one-dimensional-boundary
    bucket: duplicates
    reason: duplicate
    canonical_card: mv-lda-classification-rule
    note: 共通分散・等事前確率の1変量LDAで境界が2平均の中点になる数値例をcanonicalへ吸収済み。

  - id: engmv-fisher-discriminant-direction
    bucket: duplicates
    reason: duplicate
    canonical_card: mv-lda-direction
    note: Fisher方向Sigma^{-1}(mu1-mu0)は共通canonicalの中心操作。分類境界の役割はLDA分類canonical側で保持している。

  - id: engmv-lda-prior-probability
    bucket: duplicates
    reason: duplicate
    canonical_card: mv-lda-classification-rule
    note: 事前確率0.8/0.2を含む判別得点の数値比較をcanonicalへ吸収済み。

  - id: engmv-lda-pooled-covariance
    bucket: duplicates
    reason: duplicate
    canonical_card: mv-lda-classification-rule
    note: 自由度加重のプール分散共分散行列とdiag(25/8,23/8)の数値計算をcanonicalへ吸収済み。

  - id: engmv-single-linkage-update
    bucket: duplicates
    reason: duplicate
    canonical_card: mv-hierarchical-linkage
    note: 単連結法のクラスタ間距離=minという同一操作を共通canonicalが扱う。

  - id: engmv-complete-linkage-update
    bucket: duplicates
    reason: duplicate
    canonical_card: mv-hierarchical-linkage
    note: 完全連結法のクラスタ間距離=maxという同一操作を共通canonicalが扱う。

  - id: engmv-ward-merge-increase
    bucket: duplicates
    reason: duplicate
    canonical_card: mv-ward-increase
    note: Ward法の併合平方和増加を計算し最小の対を選ぶ操作は共通canonicalの同じ公式に基づく。
