schema_version: 1
batch_id: 2026-08-29-reg-ts-dedupe-01
items:
  # Regression: 数理側の一般カードに同じ行列計算・t区間・F表計算が既にある。
  - id: enginf-linear-model-dimensions
    bucket: duplicates
    reason: duplicate
    canonical_card: reg-multiple-model-matrix
    note: Y=X beta+epsilon の行列表記と各次元を確認する同一論点。数理側の重回帰行列表記を正本にする。
  - id: enginf-ols-matrix-numeric
    bucket: duplicates
    reason: duplicate
    canonical_card: reg-matrix-ols-derivation
    note: (X^T X)^{-1}X^T Y を2次行列で計算するだけ。数理側の導出カードにも同型の2x2数値例がある。
  - id: enginf-coefficient-confidence-interval
    bucket: duplicates
    reason: duplicate
    canonical_card: reg-slope-confidence-interval
    note: 推定係数±t臨界値×SEという同じ区間構成。一般の係数でも傾きでも解法moveは同一。
  - id: enginf-regression-anova-output
    bucket: duplicates
    reason: duplicate
    canonical_card: reg-overall-f-test
    note: SSR・SSEからMSR・MSE・Fを作る操作は重回帰の全体F検定と同一。R2計算はreg-r-squared側で保持する。

  # Time series / stochastic processes: 名前空間や工学設定だけを変えた同一操作を統合する。
  - id: engproc-ar2-root-stability
    bucket: duplicates
    reason: duplicate
    canonical_card: ts-ar-causality-check
    note: AR(2)多項式の根を解き、全て単位円外か判定する同一操作。因果性と定常因果解の条件はこの設定では同じ根条件を使う。
  - id: engproc-random-walk-difference-data
    bucket: duplicates
    reason: duplicate
    canonical_card: ts-difference-random-walk
    note: 累積系列を1階差分してランダムウォークの増分へ戻す同じ操作。common側はARIMA(0,1,0)まで接続するため情報量が多い。
  - id: engproc-random-walk-drift-calibration
    bucket: duplicates
    reason: duplicate
    canonical_card: stoch-random-walk-mean-variance
    note: 独立増分の和について平均をn倍・分散をn倍する同一move。工学側には吸収確率・平均吸収時間など別論点を残す。
