    note: Cpmの定義、目標値ずれを含む数値例、mu=TならCpへ戻る関係まで工程能力canonical cardへ統合済み。
  - id: engqc-capability-defect-rate
    bucket: duplicates
    reason: duplicate
    canonical_card: engqc-cpk-offcenter
    coverage_card: engqc-cpk-offcenter
    note: 正規工程の両側規格外率、標準化、2700ppmの数値例、Cp=Cpk=1との対応、非正規時の注意まで工程能力canonical cardへ統合済み。
  - id: engqc-arl1-mean-shift
    bucket: duplicates
    reason: duplicate
    canonical_card: engqc-three-sigma-false-alarm
    coverage_card: engqc-three-sigma-false-alarm
    note: 平均シフト後の1点検出確率とARL1、標準誤差単位のシフト量を管理図検出性能canonical cardへ統合済み。
  - id: engqc-control-chart-sample-size
    bucket: duplicates
    reason: duplicate
    canonical_card: engqc-three-sigma-false-alarm
    coverage_card: engqc-three-sigma-false-alarm
    note: 群サイズで標準誤差が縮む機構、Delta=delta sqrt(n)/sigma、delta=1.5sigmaでn=4となる数値例、平均位置だけの設計は高検出確率を保証しない注意まで統合済み。
  - id: engqc-process-adjustment-overcontrol
