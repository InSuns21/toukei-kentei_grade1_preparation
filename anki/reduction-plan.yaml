schema_version: 1
batch_id: 2026-08-29-cdf-survival-consolidation-09
items:
  - id: prob-interval-from-cdf
    bucket: duplicates
    reason: duplicate
    canonical_card: prob-cdf-endpoint-choice
    note: 端点処理canonicalへ一般式P(a<X<=b)=F(b)-F(a)、P(a<=X<=b)=F(b)-F(a-)と連続分布の数値例を吸収したため、連続分布専用の区間確率カードは重複。
  - id: prob-survival-from-cdf
    bucket: duplicates
    reason: duplicate
    canonical_card: prob-cumulative-hazard
    note: 補強済みcanonicalでF→S=1-F→H=-log S→h=H'を一続きに計算するため、生存関数だけを求めるカードは同一変換鎖の一部分。
  - id: prob-survival-from-hazard
    bucket: duplicates
    reason: duplicate
    canonical_card: prob-cumulative-hazard
    note: 補強済みcanonicalでh→H=∫h→S=e^{-H}→F=1-Sの逆変換まで数値で扱うため、危険率から生存関数への片方向カードは重複。
  - id: prob-survival-hazard
    bucket: duplicates
    reason: duplicate
    canonical_card: prob-cumulative-hazard
    note: 生存関数と危険率の関係h=f/Sもcanonicalへ明記し、順方向・逆方向の両方を計算するため、指数分布の生存関数と危険率だけのカードを独立保持しない。
  - id: prob-rectangle-from-joint-cdf
    bucket: duplicates
    reason: duplicate
    canonical_card: prob-joint-cdf-from-density
    note: 同時密度→同時累積分布関数→4隅の包除で長方形確率、という一連の計算をcanonicalへ統合済み。CDFから長方形確率だけを切り出したカードは重複。
