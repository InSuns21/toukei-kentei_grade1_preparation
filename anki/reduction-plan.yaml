  - id: dist-variance-moment
    bucket: duplicates
    reason: duplicate
    canonical_card: prob-variance-independent-sum
    coverage_card: prob-variance-independent-sum
    note: 分散正本へ旧カードと同じE[X]=2,E[X^2]=6からVar(X)=6-4=2を求める問題を統合済み。さらにVar(X)=E[X^2]-E[X]^2を起点に、線形結合の一般式、独立和、標準化まで一続きに扱うため旧単発カードは不要。
  - id: dist-jacobian-scale
    bucket: duplicates
    reason: duplicate
    canonical_card: prob-transform-nonmonotonic
    coverage_card: prob-transform-nonmonotonic
    note: 1変数変換正本へ旧カードと同じf_X(x)=e^{-x}, Y=2Xの例を統合済み。逆変換x=y/2、|dx/dy|=1/2、変換後の台y>0からf_Y(y)=1/2 e^{-y/2}を導き、さらに多対1変換を各逆像枝の和として統一しているため旧カードは不要。
