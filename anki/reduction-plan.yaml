items:
  - id: dist-mgf-poisson
    bucket: duplicates
    reason: duplicate
    canonical_card: prob-mgf-mean-variance
    note: ポアソン分布の既知MGFを1回微分して平均を出す操作は、MGFの微分から平均・分散を求める一般canonicalの特殊例。Poisson固有公式は参照知識として独立カード化しない。
  - id: est-moments-exponential
    bucket: duplicates
    reason: duplicate
    canonical_card: est-method-of-moments
    note: 指数分布で母平均と標本平均を等置するだけの1母数モーメント法は一般手順の直接例であり、分布別カードを残さない。
  - id: est-fisher-bernoulli
    bucket: duplicates
    reason: duplicate
    canonical_card: est-fisher-bernoulli-example
    note: Bernoulli 1観測の対数尤度を2回微分して I_1(p)=1/[p(1-p)] を得る同一計算。後発canonicalの方を残す。
  - id: est-cramer-rao-bernoulli
    bucket: duplicates
    reason: duplicate
    canonical_card: est-crlb-bernoulli-square
    note: g(p)=p に対するCRLBは、母数関数 g(p) の一般形を扱うcanonicalで g'(p)=1 と置いた特殊例。Bernoulli Fisher情報量の再導出も重複する。
  - id: est-aic-choice
    bucket: duplicates
    reason: duplicate
    canonical_card: ms-aic-numeric-comparison
    note: 最大対数尤度と母数数からAICを計算して小さいモデルを選ぶ同一操作。モデル選択canonicalへ統合する。
