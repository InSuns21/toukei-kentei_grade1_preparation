    coverage_card: engqc-phase1-phase2
    note: 安定工程への過剰調整をPhase I・II運用canonical cardへ統合し、偏差epsilon_(t+1)-epsilon_tと分散2sigma^2の導出、sigma=2の数値例まで追加済み。
