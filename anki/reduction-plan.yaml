batch_id: 2026-08-31-ols-theory-reduction-248
items:
  - id: enginf-ols-unbiased-condition
    bucket: duplicates
    reason: duplicate
    canonical_card: reg-multiple-model-matrix
    coverage_card: reg-multiple-model-matrix
    note: 固定された列フルランク計画の下で OLS を y=Xbeta+epsilon へ代入し、平均0誤差から E(beta_hat)=beta を導く議論は reg-multiple-model-matrix が正規方程式から不偏性・共分散・BLUE性まで一続きで導出済み。工学側の条件付き期待値表現は固定Xの同じ内容で、等分散性が不偏性には不要という区別も正本の議論から保持される。
  - id: enginf-ols-covariance-matrix
    bucket: duplicates
    reason: duplicate
    canonical_card: reg-multiple-model-matrix
    coverage_card: reg-multiple-model-matrix
    note: Var(beta_hat)=sigma^2(X^T X)^(-1) の導出は reg-multiple-model-matrix が beta_hat=(X^T X)^(-1)X^T y と線形変換の分散公式から明示的に導出している。工学側は同じ導出を独立カード化しただけで、独自技能は残らない。
  - id: enginf-gauss-markov-comparison
    bucket: duplicates
    reason: duplicate
    canonical_card: reg-gauss-markov-theorem
    coverage_card: reg-multiple-model-matrix
    note: Gauss--Markov定理の条件、BLUEの意味、任意の線形不偏推定量との差の共分散行列が半正定値になることは reg-gauss-markov-theorem が専用正本として扱い、reg-multiple-model-matrix では D=C-B を用いた証明まで導出している。工学側の比較カードは同結論の要約である。
