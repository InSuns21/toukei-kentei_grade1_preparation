    note: F分布正本へ、独立な正規2標本について (n_i-1)S_i^2/sigma_i^2 ~ chi-square_{n_i-1} から各自由度で割って比を取り、(S_1^2/sigma_1^2)/(S_2^2/sigma_2^2) ~ F_{n_1-1,n_2-1} を導く流れを統合済み。n_1=6,n_2=9 で F_{5,8}、等分散帰無仮説下で S_1^2/S_2^2 ~ F_{5,8} となる旧カードと同じ数値例まで含むため、独立カードとしての技能は残らない。
