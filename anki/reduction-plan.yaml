schema_version: 1
batch_id: 2026-08-29-bayesian-consolidation-05
items:
  - id: bayes-normal-normal-numeric
    bucket: duplicates
    reason: duplicate
    canonical_card: bayes-normal-normal-update
    note: 正規–正規canonical側を平方完成の途中式と同じ数値例まで補強したため、数値代入だけの別カードは同一moveの反復となる。
  - id: bayes-normal-precision-update
    bucket: duplicates
    reason: duplicate
    canonical_card: bayes-normal-normal-update
    note: 事後精度=事前精度+データ精度は補強済みcanonicalの注意と導出に吸収した。分散表記と精度表記を別カードにしない。
  - id: bayes-factor-definition
    bucket: duplicates
    reason: duplicate
    canonical_card: bayes-factor-discrete-numeric
    note: 周辺尤度の積分定義、BFの比、事後オッズへの更新を数値canonicalへ吸収済み。定義だけを独立カードにしない。
  - id: bayes-factor-prior-sensitivity
    bucket: duplicates
    reason: duplicate
    canonical_card: bayes-factor-discrete-numeric
    note: ベイズファクターの事前尺度感度はcanonicalの注意へ吸収済み。独立した認識カードとして増殖させない。
  - id: bayes-factor-improper-prior
    bucket: too_specific
    reason: too_specific
    canonical_card: bayes-factor-discrete-numeric
    note: improper事前で任意定数が周辺尤度比に残る注意はcanonicalへ吸収済み。600枚枠では独立カードにしない。
  - id: bayes-posterior-odds
    bucket: duplicates
    reason: duplicate
    canonical_card: bayes-factor-discrete-numeric
    note: 事後オッズ=BF×事前オッズは数値canonicalで式から事後確率まで実際に計算するため重複。
  - id: bayes-factor-beta-binomial
    bucket: too_specific
    reason: too_specific
    canonical_card: bayes-factor-discrete-numeric
    note: 点帰無対Beta事前の周辺尤度積分はBayes factor一般moveの分布固有派生。600枚デッキでは周辺尤度を積分する原理と数値比較を優先する。
