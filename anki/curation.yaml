schema_version: 1
active_card_limit: 950
hard_max_cards: 999
priority_order: [S, A, B, C, D]
preserve_official_term_coverage: true
preserve_subcategory_coverage: true
always_include_ids: []
selection_notes:
  - 公式シラバスの各用語について、対応候補のうち最も優先度が高いカードを最低1枚残す。
  - 各サブカテゴリーから最低1枚を残す。
  - 残り枠は優先度 S > A > B > C > D、過去問根拠、独自問題根拠、出典確認数、教科書根拠、難度、ID の順で決める。
  - cards/**/*.md は正本として保持し、通常デッキだけを950枚に絞る。
