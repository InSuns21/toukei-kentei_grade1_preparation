    trigger: first-standard-math-core-chapter-is-written
    note: >-
      現行 dream-theater.md に残る廃止済み F0-01 への導線は、実章を生やす段階で
      標準数学コアへの入口へ差し替える。今回は本文章を作らないため変更しない。
  - id: docsify-mermaid-rendering
    status: deferred
    trigger: site-rendering-work
    note: >-
      Mermaidソースと依存DAGの正本化は本バッチに含むが、Docsify上のMermaid描画
      プラグイン導入・確認は別タスクとする。
