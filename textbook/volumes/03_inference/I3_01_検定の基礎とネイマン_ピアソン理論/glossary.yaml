chapter_id: I3-01
terms:
  - term: 帰無仮説
    definition: 検定で第一種過誤を制御する側として置く仮説。通常 H_0 と書く。
  - term: 対立仮説
    definition: 帰無仮説に対して検出したい母数領域を表す仮説。通常 H_1 と書く。
  - term: 単純仮説
    definition: 母数を1つの値に特定する仮説。
  - term: 複合仮説
    definition: 複数の母数値を含む仮説。
  - term: 検定関数
    definition: 観測値 x に対し帰無仮説を棄却する確率 φ(x) を返す関数。非ランダム検定では0または1を取る。
  - term: 棄却域
    definition: 非ランダム検定で帰無仮説を棄却する標本点の集合。
  - term: 第一種の過誤
    definition: 帰無仮説が真なのに帰無仮説を棄却する誤り。
  - term: 第二種の過誤
    definition: 対立仮説が真なのに帰無仮説を棄却しない誤り。
  - term: 有意水準
    definition: 帰無仮説領域全体で第一種過誤確率をこれ以下に抑えると事前に定める上限 α。
  - term: サイズ
    definition: 帰無仮説領域における棄却確率の上限 sup_{θ∈Θ0} E_θ[φ(X)]。
  - term: 検出力関数
    definition: 真の母数が θ のとき帰無仮説を棄却する確率 β_φ(θ)=E_θ[φ(X)]。
  - term: P値
    definition: 観測データを棄却域に含める最小の有意水準。帰無仮説が真である事後確率ではない。
  - term: 最強力検定
    definition: 固定した1つの対立点において、水準 α の全ての検定の中で検出力を最大にする検定。
  - term: 一様最強力検定
    definition: 複合対立仮説に含まれる全ての母数値で、同じ1つの検定が水準 α の検定の中で検出力を最大にする検定。
  - term: ネイマン・ピアソン補題
    definition: 単純仮説対単純仮説で、対立仮説と帰無仮説の尤度比が大きい標本点から棄却する検定が最強力になることを述べる補題。
  - term: ランダム化検定
    definition: 一部の標本点で0と1の間の確率で棄却する検定。離散分布でサイズを所定の有意水準へ合わせるために用いられる。
  - term: 検定と信頼集合の双対性
    definition: 各点帰無仮説で棄却されない母数値の集合を集めると対応する信頼集合になる関係。
  - term: 一様最強力不偏検定
    definition: 不偏検定という制約を課したクラスの中で、対立仮説の全ての母数値に対して一様に最強な検定。
