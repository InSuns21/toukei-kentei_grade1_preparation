id: "I3-01"
title: "検定の基礎とネイマン・ピアソン理論"
volume: "inference"
status: reviewed
prerequisites:
  - I1-01
  - I2-02
official_scope:
  - P値
  - 有意水準
  - 棄却域
  - 第一種の過誤
  - 第二種の過誤
  - 検出力
  - ネイマン・ピアソンの基本定理
learning_objectives:
  - 帰無仮説と対立仮説、単純仮説と複合仮説を区別できる
  - 検定関数と棄却域を相互に読み替えられる
  - 第一種の過誤と第二種の過誤を真の母数値ごとの確率として記述できる
  - 複合帰無仮説に対する水準を帰無領域上の棄却確率の上限として説明できる
  - 検出力関数を導出し第二種過誤確率との関係を説明できる
  - P値を入れ子の棄却域に対する最小有意水準として定義し誤読を避けられる
  - ネイマン・ピアソン補題を尤度比から適用し最強力検定を構成できる
  - ネイマン・ピアソン補題を符号不等式の積分から証明できる
  - 正規母平均の片側問題で最強力検定から一様最強力検定へ拡張できる
  - 正規母平均の両側問題で一様最強力検定が通常存在しない理由を説明できる
  - 離散分布でランダム化によりサイズを所定値へ合わせられる
  - 検定の反転から信頼集合を構成し区間推定との双対性を説明できる
  - 検出力条件から必要標本サイズを逆算できる
