terms:
  - term: 事前分布
    definition: データを観測する前の母数に関する不確実性を表す確率分布。
  - term: 事後分布
    definition: 観測データを条件として、事前分布を尤度で更新した母数の条件付き分布。
  - term: 周辺尤度
    definition: 尤度を事前分布で平均して得られる観測データの周辺確率または周辺密度。事後分布の正規化定数になる。
  - term: 共役事前分布
    definition: ある尤度族に対して、事後分布が事前分布と同じ分布族に属するような事前分布族。
  - term: ベイズ推定量
    definition: 観測データのもとで事後期待損失を最小にする決定値。
  - term: 事後期待損失
    definition: 真の母数に関する損失を事後分布で平均した量。
  - term: 二乗損失
    definition: 推定値aと母数thetaの差の二乗(a-theta)^2で定義される損失。
  - term: 絶対損失
    definition: 推定値aと母数thetaの絶対差|a-theta|で定義される損失。
  - term: 事後最頻値
    definition: 事後確率質量または事後密度を最大にする母数値。連続母数では再母数化に依存しうる。
  - term: 事後予測分布
    definition: 未来の観測の条件付き分布を、母数の事後分布で平均して得る分布。
  - term: 事前予測分布
    definition: データ観測前に、標本分布を事前分布で平均して得る観測データの分布。
  - term: 信用区間
    definition: 事後分布の確率を所定の値だけ含む母数区間。頻度論的信頼区間とは確率解釈が異なる。
