terms:
  - term: 実験研究
    definition: 研究者が処置や条件を割り付け、その結果の差を比較する研究。無作為割付は処置群間の交絡を平均的に均衡させるために用いる。
  - term: 観察研究
    definition: 研究者が処置を割り付けず、自然に生じた曝露・属性・結果の関係を観察する研究。
  - term: 調査
    definition: 定義した母集団から標本を抽出し、質問・測定などによって母集団の特徴を推定する研究。
  - term: 目標母集団
    definition: 推論の対象としたい有限または概念上の個体集合。
  - term: 抽出台帳
    definition: 実際の標本抽出に使う個体・世帯・事業所などの一覧。目標母集団とのずれはカバレッジ誤差の原因になる。
  - term: 単純無作為抽出
    definition: 大きさNの有限母集団から大きさnの標本を非復元で選び、すべてのn要素部分集合が同じ確率で選ばれる抽出法。
  - term: 完全無作為抽出
    definition: 公式出題範囲で用いられる無作為抽出の表現。本章の数式では、有限母集団から偏りなく選ぶ基本モデルとして単純無作為抽出を用いて具体化する。
  - term: 抽出率
    definition: 有限母集団サイズNに対する標本サイズnの比 f=n/N。
  - term: 有限母集団補正
    definition: 非復元抽出によって標本平均の分散が独立抽出より小さくなる効果を表す因子。単純無作為抽出では分散に1-fが掛かる。
  - term: 層化抽出
    definition: 母集団を重ならない層に分け、各層から独立に標本を抽出する方法。
  - term: 比例配分
    definition: 層hの標本サイズを母集団層サイズに比例させ n_h=nN_h/N とする配分。
  - term: Neyman配分
    definition: 層ごとの調査費用が等しいとき、固定した総標本サイズの下で層化推定量の分散を小さくする n_h proportional to N_h S_h という配分。
  - term: 二段階抽出
    definition: 第1段階で地域や事業所などの一次抽出単位を選び、その後、選ばれた一次抽出単位の中から個体を選ぶ多段抽出法。
  - term: 包含確率
    definition: 母集団要素iが最終標本に含まれる確率 pi_i。2要素i,jがともに含まれる確率を二次包含確率 pi_ij と呼ぶ。
  - term: Horvitz--Thompson推定量
    definition: 各観測値を包含確率の逆数で重み付けし、母集団総量を sum_{i in s} y_i/pi_i で推定する不偏推定量。
  - term: 比推定量
    definition: 総量が既知の補助変数xを利用し、標本内のyとxの比を既知の母集団x総量へ掛けてy総量を推定する方法。一般には有限標本で厳密不偏ではない。
  - term: 標本誤差
    definition: 同じ標本設計で抽出を繰り返すと推定値が変動することによる誤差。
  - term: カバレッジ誤差
    definition: 抽出台帳が目標母集団を欠落・重複しているために生じる誤差。
  - term: 無回答バイアス
    definition: 回答する確率が調査対象の特性と関係し、回答者だけの集計が母集団を代表しなくなることで生じる偏り。
  - term: 設計効果
    definition: 実際の標本設計による推定量の分散を、同じ標本サイズの単純無作為抽出による分散で割った比 DEFF。
  - term: 有効標本サイズ
    definition: 複雑標本設計の精度を単純無作為抽出の標本サイズへ換算した量。近似的に n_eff=n/DEFF と置く。
