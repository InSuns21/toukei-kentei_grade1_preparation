id: "S1-03"
title: "標本抽出・研究設計"
volume: "inference"
status: reviewed
prerequisites:
  - P3-01
  - P4-02
  - P2-02
official_scope:
  - 実験研究
  - 観察研究
  - 調査
  - 完全無作為抽出
  - 単純無作為抽出
  - 層化抽出
  - 二段階抽出
  - サンプルサイズの設計
  - Horvitz--Thompson推定量
  - 有限母集団補正
  - 比推定量
  - 標本設計
learning_objectives:
  - 実験研究・観察研究・調査を区別し、無作為割付と無作為抽出の役割の違いを説明できる
  - 目標母集団・抽出台帳・標本・抽出確率を区別できる
  - 単純無作為抽出で標本平均が有限母集団平均の不偏推定量になることを示せる
  - 抽出指示変数を使って有限母集団補正を含む標本平均の分散を導出できる
  - 層化抽出の推定量と分散を計算し、比例配分とNeyman配分を使い分けられる
  - 二段階抽出の抽出確率と母集団総量推定量を構成できる
  - 一般の不等確率抽出でHorvitz--Thompson推定量の不偏性を示せる
  - 既知の補助変数総量を利用する比推定量を計算し、有限標本では一般に不偏でないことを説明できる
  - 許容誤差から平均・比率の必要標本サイズを有限母集団補正込みで設計できる
  - 標本誤差とカバレッジ誤差・無回答バイアスを区別し、標本数を増やすだけでは後者を除けないことを説明できる
  - 設計効果と有効標本サイズを使って複雑標本設計の精度を比較できる
