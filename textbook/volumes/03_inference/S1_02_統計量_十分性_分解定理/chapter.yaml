id: "S1-02"
title: "統計量・十分性・分解定理"
volume: "inference"
status: reviewed
prerequisites:
  - S1-01
  - P4-01
  - P2-02
official_scope:
  - 十分統計量
  - ネイマンの分解定理
learning_objectives:
  - 統計量を「未知母数を含まない標本の関数」として定義し、推定量・標本そのものとの違いを説明できる
  - 十分統計量を「統計量を条件づけた後の標本分布が母数に依存しない」という定義から説明できる
  - ネイマンの分解定理を使って十分性を判定できる
  - ベルヌーイ分布・ポアソン分布・指数分布で和が十分統計量になることを示せる
  - 一様分布 U(0,theta) で標本最大値が十分統計量になることを支持領域込みで示せる
  - 正規分布で既知分散なら標本和、平均・分散とも未知なら標本和と平方和が十分になることを導ける
  - 同値な一対一変換をした統計量も同じ情報を保持することを説明できる
  - 尤度比による最小十分性の判定法を基本例で使える
  - 指数型分布族の形から十分統計量を読み取り、次章の尤度・最尤推定へ接続できる
  - 十分統計量であることと不偏性・一致性・効率性は別概念であることを説明できる
