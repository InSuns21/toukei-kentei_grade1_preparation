terms:
  - term: 統計量
    definition: 標本から計算される関数で、式の中に未知母数を含まないもの。標本平均、標本分散、最大値、成功回数などが典型例。
  - term: 十分統計量
    definition: 統計量の値を与えた後では、元の標本の条件付き分布が未知母数に依存しなくなる統計量。母数に関する標本情報を失わず圧縮していると解釈できる。
  - term: ネイマンの分解定理
    definition: 同時確率関数または同時密度が f_theta(x)=g_theta(T(x))h(x) と分解できることと、Tがthetaの十分統計量であることを結び付ける定理。
  - term: 分解定理
    definition: 本章ではネイマンの分解定理を指す。theta依存部分を統計量Tだけに集約できるかで十分性を判定する。
  - term: 最小十分統計量
    definition: 他の任意の十分統計量から関数として復元できる、十分統計量の中で最も粗い情報表現。通常は同値な一対一変換まで同一視する。
  - term: 尤度比判定
    definition: 2標本点x,yについて f_theta(x)/f_theta(y) がthetaに依存しないことと T(x)=T(y) が同値かを調べ、最小十分性を判定する方法。
  - term: 指数型分布族
    definition: 密度または確率関数が h(x)exp{eta(theta)^T T(x)-A(theta)} の形に書ける分布族。独立標本ではTの標本和が十分統計量として現れやすい。
  - term: 支持領域
    definition: 確率質量関数または確率密度関数が正となり得る値の集合。U(0,theta)のように支持領域がthetaに依存する分布では、指示関数も尤度のtheta依存部分として扱う必要がある。
  - term: 一対一変換
    definition: 元の統計量を逆に復元できる変換。十分統計量Tの一対一変換U=g(T)も同じ情報を保持するので十分である。
  - term: 付随統計量
    definition: 分布が未知母数に依存しない統計量。十分統計量とは別概念であり、本章では対比のためにだけ触れる。
