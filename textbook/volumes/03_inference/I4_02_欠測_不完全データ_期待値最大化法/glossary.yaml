chapter_id: I4-02
terms:
  - term: 欠測
    definition: 観測対象は標本に含まれているが、変数の一部または全部の値が観測されていない状態。
  - term: 欠測指示変数
    definition: 各値が観測されたか欠測したかを表す確率変数。本文では観測なら1、欠測なら0とする。
  - term: 完全無作為欠測
    definition: 欠測確率が観測値にも欠測値にも依存しない欠測機構。
  - term: 無作為欠測
    definition: 観測済みの値を条件とすれば、欠測確率が未観測値には依存しない欠測機構。
  - term: 非無作為欠測
    definition: 観測済み情報で条件付けても、欠測確率が未観測値そのものに依存する欠測機構。
  - term: 完全データ
    definition: 潜在変数や欠測値も含め、モデル上必要な変数がすべて見えていると仮定したデータ。
  - term: 観測データ
    definition: 実際に観測できた変数だけからなるデータ。
  - term: 観測データ尤度
    definition: 潜在変数・欠測値を和または積分で消去して得る、観測されたデータの尤度。
  - term: 期待値最大化法
    definition: 潜在変数を含む完全データ対数尤度の条件付き期待値を計算し、それを最大化する操作を反復する最尤推定法。
  - term: E-step
    definition: 現在の母数の下で、完全データ対数尤度の潜在変数に関する条件付き期待値を計算する段階。
  - term: M-step
    definition: E-stepで得た期待完全データ対数尤度を母数について最大化する段階。
  - term: 責任度
    definition: 混合モデルで、観測値がある成分から生成された条件付き確率。E-stepで計算する。
  - term: カルバック・ライブラー情報量
    definition: 2つの確率分布のずれを表す非負量。本章では期待値最大化法の下界と観測データ尤度の差を表し、尤度単調性の説明に用いる。
  - term: 打ち切り
    definition: 観測値そのものは分からないが、ある境界より大きい・小さいなど部分的な情報が得られている状態。
  - term: 切断
    definition: 値がある条件を満たす観測単位だけが標本へ入るため、条件を満たさない単位の存在自体が観測されない標本選択。
  - term: 単一代入
    definition: 1つの補完値で欠測値を置き換える方法。補完値の不確実性を無視すると分散を過小評価しやすい。
  - term: ラベル交換
    definition: 混合モデルで成分番号を入れ替えても同じ分布を表すため、尤度に対称な解が生じる性質。
