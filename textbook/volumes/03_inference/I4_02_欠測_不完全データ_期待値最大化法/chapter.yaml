id: "I4-02"
title: "欠測・不完全データ・期待値最大化法"
volume: "inference"
status: drafting
prerequisites:
  - I1-01
  - P1-02
  - P3-04
  - P3-03
official_scope:
  - 欠測
  - 不完全データ
  - 観測データ尤度
  - 期待値最大化法
  - 打ち切り
  - 切断
learning_objectives:
  - 欠測・打ち切り・切断の情報構造の違いを説明できる
  - 欠測指示変数を用いて完全無作為欠測・無作為欠測・非無作為欠測を区別できる
  - 潜在変数を周辺化して観測データ尤度を構成できる
  - 混合分布で観測データ対数尤度に対数の中の和が現れる理由を説明できる
  - 完全データ対数尤度から期待値最大化法のE-stepとM-stepを導出できる
  - 2成分正規混合モデルの所属確率と母数更新式を導出できる
  - 2成分正規混合モデルで期待値最大化法を1反復手計算できる
  - 期待値最大化法が観測データ尤度を減少させない理由をKLダイバージェンスを用いて説明できる
  - 局所最大・初期値依存・ラベル交換・標準誤差が直接得られない点を説明できる
  - 単一代入が欠測値の不確実性を無視する危険を説明できる
