learning_objectives:
  - 標準正規変数の平方和からカイ二乗分布を導ける
  - 正規標本を平均方向と残差方向へ直交分解し、残差の自由度がn-1になる理由を説明できる
  - 正規標本で標本平均と不偏標本分散の独立性を導ける
  - t分布とF分布を正規変数・カイ二乗変数の比として構成できる
  - 自由度と分位点を区別し、標本分散・平均の確率を計算できる
