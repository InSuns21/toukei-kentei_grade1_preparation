terms:
  - term: t検定
    definition: 正規母平均の検定で母分散未知のとき、標本標準偏差で標準化したt統計量を用いる検定。
  - term: カイ二乗検定
    definition: カイ二乗分布を帰無分布または漸近帰無分布として用いる検定の総称。本章では正規母分散、適合度、分割表を扱う。
  - term: F検定
    definition: 独立な二つの正規母集団の分散比などについてF分布を利用する検定。
  - term: 適合度検定
    definition: 観測されたカテゴリ度数が帰無仮説で指定された確率分布と整合するかを調べる検定。
  - term: ピアソンの適合度統計量
    definition: 観測度数 O_j と期待度数 E_j の差を E_j で標準化し、その二乗和を取った統計量。
  - term: 分割表
    definition: 複数のカテゴリ変数の組合せごとの度数を行列状に整理した表。
  - term: 独立性検定
    definition: 分割表で行変数と列変数が独立であるという帰無仮説を検定する方法。
  - term: ノンパラメトリック検定
    definition: 特定の有限次元母数族を完全には仮定せず、符号や順位などを利用する検定。無仮定という意味ではない。
  - term: 符号検定
    definition: 仮説中央値との差の正負だけを使い、帰無仮説下の二項分布を利用する検定。
  - term: ウィルコクソン符号付き順位和検定
    definition: 対応差の絶対値順位に符号を付け、対称な連続分布の位置に関する仮説を検定する順位検定。
  - term: ウィルコクソン順位和検定
    definition: 独立二標本を併合して順位を付け、一方の標本の順位和を用いて二群の分布差を検定する方法。
  - term: マン・ホイットニーU統計量
    definition: 異なる二群から選んだ観測値の大小比較の個数として表せ、ウィルコクソン順位和統計量と線形変換で結ばれる統計量。
  - term: 連続修正
    definition: 離散統計量を連続分布で近似するとき、境界を通常1/2だけ補正して近似誤差を減らす操作。
