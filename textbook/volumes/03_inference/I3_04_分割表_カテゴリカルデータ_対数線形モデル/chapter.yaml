id: "I3-04"
title: "分割表・カテゴリカルデータ・対数線形モデル"
volume: "inference"
status: drafting
prerequisites:
  - P3-01
  - I3-01
  - I1-01
  - L2-01
official_scope:
  - 分割表の解析
  - カイ二乗検定
  - フィッシャー検定
  - マクネマー検定
  - イェーツの補正
  - オッズ比
  - 対数線形モデル
learning_objectives:
  - 二元分割表の行周辺度数・列周辺度数・総度数から独立モデルの期待度数を導出できる
  - ピアソンのカイ二乗統計量を計算し自由度を説明できる
  - 尤度比統計量とピアソンのカイ二乗統計量の役割を区別できる
  - 2×2分割表のオッズ比を計算し独立性との関係を説明できる
  - 周辺度数を固定したフィッシャーの正確確率検定を超幾何分布から導出できる
  - イェーツの連続性補正を適用し小標本での位置付けを説明できる
  - 対応のある2値データではマクネマー検定を用い不一致ペアだけが情報を持つことを説明できる
  - ポアソン型の対数線形モデルを構成し独立モデルを交互作用なしとして表現できる
  - 2×2表の対数オッズ比を対数線形モデルの交互作用コントラストとして説明できる
  - 独立モデルと飽和モデルの逸脱度が尤度比統計量に一致することを説明できる
