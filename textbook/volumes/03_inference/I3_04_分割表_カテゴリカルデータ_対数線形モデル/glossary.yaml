chapter_id: I3-04
terms:
  - term: 分割表
    definition: 複数のカテゴリ変数の組合せごとに観測度数を並べた表。
  - term: 周辺度数
    definition: 分割表の行または列について他方のカテゴリを合計した度数。
  - term: 期待度数
    definition: 帰無仮説や統計モデルの下で各セルに期待される度数。独立モデルでは行周辺度数と列周辺度数の積を総度数で割って推定する。
  - term: ピアソンのカイ二乗統計量
    definition: 観測度数と期待度数の差を期待度数で標準化して二乗和した統計量。
  - term: 尤度比統計量
    definition: 帰無モデルとより自由なモデルの最大尤度の比から構成する統計量。分割表では逸脱度として用いられる。
  - term: オッズ比
    definition: 2×2分割表で2群のオッズの比を表す量。独立なら母集団オッズ比は1となる。
  - term: フィッシャーの正確確率検定
    definition: 2×2分割表で周辺度数を固定した条件付き分布が超幾何分布になることを利用する正確検定。
  - term: イェーツの連続性補正
    definition: 2×2分割表のカイ二乗近似で離散度数を連続分布へ近似する際に差の絶対値から0.5を引く補正。
  - term: マクネマー検定
    definition: 同一対象の前後比較など対応のある2値データで、2種類の不一致ペアの確率が等しいかを検定する方法。
  - term: 対数線形モデル
    definition: 分割表の期待度数の対数をカテゴリ主効果や交互作用の和として表すモデル。
  - term: 独立モデル
    definition: 二元分割表で行変数と列変数の交互作用を含まない対数線形モデル。
  - term: 飽和モデル
    definition: 観測された分割表を完全に再現できるだけの主効果・交互作用を含むモデル。
  - term: 逸脱度
    definition: 当てはめたモデルの尤度を飽和モデルの尤度と比較する尤度比型の不適合度。分割表では2倍の対数尤度差で表す。
  - term: 交互作用
    definition: 一方のカテゴリ変数の効果が他方のカテゴリによって変わることを表す項。2×2表では対数オッズ比と直接結び付く。
