chapter_id: I1-02
terms:
  - term: モーメント法
    definition: 母集団モーメントを母数の式で表し、それを対応する標本モーメントに等置して母数を解く推定法。
  - term: 標本モーメント
    definition: 標本から計算したべき平均。第k標本原点モーメントは n^{-1}ΣX_i^k で表す。
  - term: 最小二乗法
    definition: 観測値とモデル値の差である残差の平方和を最小にするよう母数を選ぶ推定法。
  - term: バイアス
    definition: 推定量Tの期待値と推定対象g(θ)との差 Eθ[T]-g(θ)。
  - term: 不偏推定量
    definition: すべての母数値で期待値が推定対象に一致する推定量。
  - term: 平均二乗誤差
    definition: 推定誤差の二乗の期待値 E[(T-g(θ))^2]。分散とバイアスの二乗の和に分解できる。
  - term: 一致推定量
    definition: 標本サイズを増やすと推定対象へ確率収束する推定量。
  - term: 線形推定量
    definition: 観測ベクトルの線形結合として表される推定量。
  - term: BLUE
    definition: 線形不偏推定量の中で共分散行列が最小となる最良線形不偏推定量。
  - term: Fisher情報量
    definition: スコアの二乗平均で表される、観測が母数について持つ局所的な情報量。正則条件下では対数尤度の二階微分の負の期待値にも等しい。
  - term: Cramér--Rao下限
    definition: 正則条件下で不偏推定量の分散が下回れない Fisher 情報量に基づく下限。
  - term: 有効推定量
    definition: 対象とする不偏推定量のクラスで分散下限を達成する推定量。本章では主にCramér--Rao下限を達成する推定量を指す。
  - term: 相対効率
    definition: 同じ量を推定する二つの推定量の精度を分散や漸近分散の比で比較した量。
  - term: 正則条件
    definition: 支持が母数に依存しないことや微分と積分を交換できることなど、スコアやFisher情報量の標準公式を正当化する条件。
  - term: 非正則モデル
    definition: 支持の母数依存などにより標準的なスコア恒等式やCramér--Rao理論をそのまま適用できないモデル。
