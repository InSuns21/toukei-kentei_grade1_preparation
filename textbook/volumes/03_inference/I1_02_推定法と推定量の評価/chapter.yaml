id: "I1-02"
title: "推定法と推定量の評価"
volume: "inference"
status: reviewed
prerequisites:
  - I1-01
  - P4-02
  - L1-02
official_scope:
  - モーメント法
  - 最小二乗法
  - BLUE
  - 不偏性
  - 一致性
  - 有効性
  - フィッシャー情報量
  - クラーメル・ラオの不等式
  - 推定量の相対効率
  - その他の手法
learning_objectives:
  - 母集団モーメントと標本モーメントを対応させてモーメント推定量を構成できる
  - 最小二乗法を残差平方和の最小化として導出し最尤法との違いを説明できる
  - 推定量のバイアス・分散・平均二乗誤差を計算しMSE分解を使える
  - 不偏性と一致性を区別しバイアスがあっても一致的な推定量を判定できる
  - 線形不偏推定量の中で分散を最小にする重みを求められる
  - Gauss--Markovの定理をBLUEの意味とともに説明し行列表現で証明できる
  - スコアからFisher情報量を計算し独立標本での加法性を使える
  - 正則条件の下でFisher情報量を対数尤度の二階微分から計算できる
  - Cramér--Rao不等式をスコアとの共分散とCauchy--Schwarz不等式から導出できる
  - Cramér--Rao下限を達成する推定量の有効性を判定できる
  - 支持が母数に依存する非正則モデルではCramér--Rao不等式を機械的に使わないと判断できる
  - パレート分布の下端最尤推定量についてバイアス・不偏補正・一致性を順序統計量から評価できる
