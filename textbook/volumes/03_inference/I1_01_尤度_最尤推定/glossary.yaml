chapter_id: I1-01
terms:
  - term: 尤度
    definition: 観測データを固定し、確率モデルの同時確率質量または同時密度を母数の関数として見たもの。
  - term: 尤度関数
    definition: 観測値 x に対して L(θ;x)=f_θ(x) と置いた母数 θ の関数。独立標本では各観測の確率関数または密度の積になる。
  - term: 対数尤度
    definition: 尤度の自然対数。対数が単調増加なので尤度と同じ母数で最大となり、独立標本の積を和へ変換できる。
  - term: スコア関数
    definition: 対数尤度を母数で微分した関数。母数を少し動かしたとき対数尤度が増える方向を表す。
  - term: スコアベクトル
    definition: 多母数モデルで対数尤度を各母数について偏微分して並べた勾配ベクトル。
  - term: スコア方程式
    definition: 内点の最尤解候補を求めるため U(θ)=0 と置いた方程式。境界解や非正則モデルではこれだけで最尤推定量を決められない。
  - term: 最尤推定量
    definition: 母数空間上で尤度を最大化する母数値をデータの関数として表した推定量。
  - term: 母数空間
    definition: モデルで許される母数値全体の集合。境界を含むかどうかが最尤推定量の存在や境界解に影響する。
  - term: 再パラメータ化不変性
    definition: 母数を1対1変換したとき、変換後母数の最尤推定量が元の最尤推定量へ同じ変換を施して得られる最尤法の性質。
  - term: 局外母数
    definition: 推測したい関心母数ではないが、尤度に含まれ同時に扱う必要がある母数。
  - term: プロファイル尤度
    definition: 関心母数を固定するたびに局外母数を最大化し、その最大値を関心母数の関数として得る尤度。
  - term: 有効スコア
    definition: 関心母数のスコアから局外母数のスコアで線形に説明できる成分を差し引いたスコア。通常ルートでは関心母数と局外母数が各1個のスカラーの場合を扱い、多次元の情報行列による一般形は発展とする。
  - term: 正則モデル
    definition: 支持が母数に依存しない、微分と積分を交換できるなど、尤度微分に関する標準公式を正当化する条件を満たすモデル。
  - term: 支持
    definition: 確率質量関数または密度が正になり得る観測値の範囲。支持が母数に依存すると尤度の指示関数を省略できない。
