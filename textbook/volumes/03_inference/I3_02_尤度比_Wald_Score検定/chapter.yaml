id: "I3-02"
title: "尤度比・Wald・Score検定"
volume: "inference"
status: reviewed
prerequisites:
  - I2-01
  - I3-01
official_scope:
  - 尤度比検定
  - ワルド型検定
  - スコア型検定
learning_objectives:
  - 制約なし最尤推定量と帰無仮説下の制約付き最尤推定量を区別できる
  - 1母数モデルで尤度比統計量を最大対数尤度の差として構成できる
  - 1母数のワルド型統計量を推定量と標準誤差から構成できる
  - 1母数のスコア型統計量を帰無仮説点のスコアと情報量から構成できる
  - 1母数問題で尤度比・ワルド型・スコア型の漸近同値性を対数尤度の二次近似から説明できる
  - ベルヌーイ分布とポアソン分布で3統計量を導出し有限標本差を比較できる
  - 尤度比統計量の再母数化不変性とワルド型統計量の有限標本非不変性を区別できる
  - 境界・非正則問題で通常のカイ二乗近似を機械的に使えないと判断できる
advanced_objectives:
  - 多母数モデルの滑らかな制約に対するワルド型統計量を書ける
  - 迷惑母数がある場合の有効情報量を情報行列のSchur補で表せる
  - Wilksの定理を局所二次近似・局所漸近正規性の観点から説明できる
  - 局所対立仮説下で非心カイ二乗極限が現れることを説明できる
definitions:
  - { id: I302-DEF-01, name: 尤度比と尤度比統計量 }
  - { id: I302-DEF-02, name: 1母数のワルド型統計量 }
  - { id: I302-DEF-04, name: 1母数のスコア型統計量 }
advanced_definitions:
  - { id: I302-DEF-03, name: 一般制約のワルド型統計量 }
  - { id: I302-DEF-05, name: 迷惑母数を除いた有効情報量 }
theorems:
  - { id: I302-THM-01, name: Wilksの定理 }
  - { id: I302-THM-02, name: 尤度比・ワルド型・スコア型検定の漸近同値性 }
  - { id: I302-PROP-01, name: 尤度比統計量の再母数化不変性 }
advanced_theorems:
  - { id: I302-THM-03, name: 1母数局所対立仮説下の極限 }
canonical_examples: [既知分散正規母平均の3検定一致, ベルヌーイ母比率の3検定比較, ポアソン平均の3検定比較, 未知分散正規母平均の尤度比, 2状態Markov連鎖の尤度比]
problem_patterns: [LR-RESTRICTED-MLE-1, WILKS-DF-1, WALD-ONEPARAM-1, SCORE-ONEPARAM-1, LR-WALD-SCORE-EQUIV-1, LR-REPARAM-INVARIANCE-1]
advanced_problem_patterns: [WALD-CONSTRAINT-1, NUISANCE-EFFICIENT-INFO-1, LOCAL-NONCENTRAL-1]
