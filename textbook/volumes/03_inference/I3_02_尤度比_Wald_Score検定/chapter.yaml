  - { id: MATH-2024-Q1, theme: 回帰係数の推定・検定・検出力, skills: [係数推定, 標準誤差, 検定統計量], source_type: third_party_topic_index }
integrated_exam_problems: [I3-02-C01, I3-02-C04]
advanced_exam_problems: [I3-02-C02, I3-02-C03, I3-02-D01]
exercise_counts: { level_a: 4, level_b: 4, level_c: 4, level_d: 1 }
estimated_hours: { reading: 7, exercises: 10, review: 3 }
completion_criteria:
