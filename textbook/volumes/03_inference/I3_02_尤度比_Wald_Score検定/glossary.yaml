terms:
  - term: 制約なし最尤推定量
    notation: "\\hat\\theta"
    meaning: 母数空間全体で尤度を最大化する最尤推定量
  - term: 制約付き最尤推定量
    notation: "\\tilde\\theta"
    meaning: 帰無仮説が課す制約の下で尤度を最大化する推定量
  - term: 尤度比
    notation: "\\Lambda"
    meaning: 帰無仮説下の最大尤度を制約なし最大尤度で割った比
  - term: 尤度比統計量
    notation: "G^2=-2\\log\\Lambda"
    meaning: 最大対数尤度の差を2倍した非負の検定統計量
  - term: Wilksの定理
    meaning: 正則条件下で尤度比統計量が独立制約数を自由度とするカイ二乗分布へ漸近する定理。通常ルートでは結論と自由度の読み方を重視する
  - term: ワルド型統計量
    notation: "W"
    meaning: 1母数では推定値と帰無値の差を推定分散で標準化して二乗した統計量。多母数の一般二次形式は発展扱い
  - term: スコア型統計量
    notation: "S"
    meaning: 1母数では帰無仮説点のスコアを1次元フィッシャー情報量で標準化して二乗した統計量
  - term: 観測情報量
    notation: "J_n(\\theta)=-\\ell_n''(\\theta)"
    meaning: 1母数モデルで観測された対数尤度の負の二階微分。局所的な山の尖り具合を表す
  - term: 有効情報量
    notation: "I_{\\psi\\cdot\\lambda}"
    meaning: 【発展】迷惑母数方向の影響をSchur補行列で除いた検定対象母数の情報量。情報行列を用いる一般論であり通常ルートでは必須としない
  - term: 迷惑母数
    meaning: 検定対象ではないが尤度に含まれ、帰無仮説下でも通常は推定が必要な母数。この考え方自体は尤度比検定で重要
  - term: 再母数化不変性
    meaning: 1対1の母数変換をしても尤度比統計量の値が変わらない性質
  - term: 局所対立仮説
    notation: "\\theta_n=\\theta_0+h/\\sqrt n"
    meaning: 【発展】帰無値からroot-nの尺度で近づく対立仮説列
  - term: 非心カイ二乗分布
    notation: "\\chi_r^2(\\delta)"
    meaning: 【発展】局所対立仮説下の二次形式に現れる非心度付きカイ二乗分布
