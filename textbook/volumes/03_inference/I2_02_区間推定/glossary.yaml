chapter_id: I2-02
terms:
  - term: 信頼区間
    definition: 標本から計算される下端L(X)と上端U(X)からなるランダムな区間で、母数を所定の確率で被覆するように構成された区間。
  - term: 被覆確率
    definition: 母数θがランダム区間[L(X),U(X)]に含まれる確率Pθ(L(X)≤θ≤U(X))。
  - term: 信頼係数
    definition: 信頼区間が保証する被覆水準。通常1-αで表し、全ての母数値で被覆確率が少なくとも1-αとなるように定める。
  - term: ピボット量
    definition: 標本Xと母数θの関数Q(X,θ)で、その標本分布がθなど未知母数に依存しない量。
  - term: 厳密信頼区間
    definition: 有限標本で被覆確率が指定水準以上になることが理論的に保証される信頼区間。
  - term: 漸近信頼区間
    definition: 標本サイズを無限大にしたとき被覆確率が目標水準へ収束する区間。有限標本での被覆確率が厳密に一致するとは限らない。
  - term: 片側信頼区間
    definition: 母数の下限または上限だけを与える区間。下側信頼限界または上側信頼限界を用いて表す。
  - term: 両側信頼区間
    definition: 母数の下限と上限の両方を与える信頼区間。
  - term: ワルド型信頼区間
    definition: 漸近正規な推定量と推定標準誤差を用いて推定値±標準正規分位点×標準誤差の形で作る漸近信頼区間。
  - term: 標準誤差
    definition: 推定量の標準偏差。未知母数を含む場合は通常その推定値を代入して推定標準誤差を用いる。
  - term: 信頼限界
    definition: 信頼区間の下端または上端。下端を下側信頼限界、上端を上側信頼限界という。
  - term: 区間の反転
    definition: ピボット量について成立する確率不等式を母数について解き直し、母数の取り得る区間へ変換する操作。
