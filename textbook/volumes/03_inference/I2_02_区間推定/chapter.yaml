id: "I2-02"
title: "区間推定"
volume: "inference"
status: reviewed
prerequisites:
  - S1-01
  - I2-01
official_scope:
  - 信頼係数
  - 信頼区間の構成
  - 被覆確率
learning_objectives:
  - 信頼区間を標本から作られるランダムな区間として定義し実現後の区間と区別できる
  - 被覆確率と信頼係数を区別し頻度論的な信頼区間の意味を説明できる
  - ピボット量の確率式を母数について解くことで信頼区間を構成できる
  - 正規母集団の平均について母分散既知の正規区間と母分散未知のt区間を導出できる
  - 正規母集団の分散についてカイ二乗ピボットから厳密な信頼区間を導出できる
  - 片側信頼区間と両側信頼区間の違いを説明し分位点を正しく選べる
  - 漸近正規な推定量からワルド型信頼区間を構成し有限標本の厳密区間と区別できる
  - 単調変換による区間変換とデルタ法による近似区間の違いを説明できる
  - 二項比率のワルド型区間が境界付近で不安定になる理由を説明できる
  - 一様分布の最大値を用いて非正則モデルでもピボット量から厳密区間を構成できる
definitions:
  - { id: I202-DEF-01, name: 信頼区間 }
