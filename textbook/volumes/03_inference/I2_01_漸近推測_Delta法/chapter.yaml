id: "I2-01"
title: "漸近推測・デルタ法"
volume: "inference"
status: reviewed
prerequisites:
  - I1-02
  - P4-02
official_scope:
  - 最尤推定量の漸近正規性
  - デルタ法
  - 漸近分散
learning_objectives:
  - 推定量の漸近分布と漸近正規性を有限標本分布と区別して説明できる
  - root-n漸近正規性における漸近分散と有限標本での近似分散の関係を説明できる
  - 正則な独立同分布モデルでスコア方程式のTaylor展開から最尤推定量の漸近正規性を導出できる
  - スコアの中心極限定理と対数尤度二階微分の大数の法則をSlutskyの定理で結合できる
  - 期待フィッシャー情報量と観測情報量を区別し最尤推定量の標準誤差近似へつなげられる
  - 1変量デルタ法をTaylor展開から導出し変換後推定量の漸近分散を計算できる
  - 多変量デルタ法を勾配またはヤコビ行列で適用できる
  - 一次導関数が0のとき一次デルタ法が退化し二次展開が必要になることを判定できる
  - 再母数化した最尤推定量の漸近分散とフィッシャー情報量の変換則が整合することを示せる
  - 支持が母数に依存する非正則モデルではroot-n正規近似が破れる場合を説明できる
