chapter_id: I2-01
terms:
  - term: 漸近分布
    definition: 標本サイズを増やしたとき、適切に中心化・尺度調整した統計量が分布収束する極限分布。
  - term: 漸近正規性
    definition: 推定量を真値のまわりで適切に中心化・尺度調整すると、標本サイズの増大に伴って正規分布へ分布収束する性質。
  - term: root-n収束率
    definition: 推定誤差が典型的に1/√nの大きさで減少し、√n倍した誤差が非退化な極限分布をもつこと。
  - term: 漸近分散
    definition: √n(T_n-θ)がN(0,V(θ))へ分布収束するときのV(θ)。有限標本でのVar(T_n)そのものではなく、大標本ではVar(T_n)≈V(θ)/nと読む。
  - term: 期待Fisher情報量
    definition: スコアの分散、または正則条件下で対数尤度二階微分の負の期待値として定義される情報量。
  - term: 観測情報量
    definition: 実データで評価した対数尤度の負の二階微分 j_n(θ)=-ℓ_n''(θ)。期待値を取る前の曲率。
  - term: Delta法
    definition: 漸近正規な推定量に滑らかな関数を作用させたとき、Taylor展開を用いて変換後の漸近分布・漸近分散を求める方法。
  - term: 多変量Delta法
    definition: 多変量漸近正規な推定量に対し、勾配またはJacobianで線形化して変換後の共分散行列をJΣJ^Tで求めるDelta法。
  - term: Slutskyの定理
    definition: 分布収束する確率変数と定数へ確率収束する確率変数を和・積・商などで組み合わせたときの極限分布を与える定理。
  - term: 漸近有効性
    definition: 正則モデルで推定量の漸近分散がFisher情報量逆数で与えられる効率限界を達成する性質。本章では主に正則MLEについて扱う。
  - term: 再母数化
    definition: 母数η=g(θ)のように同じモデルを別の母数で表し直すこと。推定量と情報量の変換則を伴う。
  - term: 二次Delta法
    definition: 変換関数の一次導関数が0で一次近似が退化するとき、二階Taylor項まで用いて非退化な極限分布を求める方法。
  - term: 非正則モデル
    definition: 支持の母数依存や境界などにより通常のFisher情報量理論・root-n正規近似の正則条件を満たさないモデル。
