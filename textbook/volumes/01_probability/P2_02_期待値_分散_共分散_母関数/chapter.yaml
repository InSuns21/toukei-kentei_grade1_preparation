prerequisites: [P2-01]
official_scope: [期待値, 分散, 共分散, 条件付き期待値, 条件付き分散, 条件付き共分散, 確率母関数, モーメント母関数]
learning_objectives:
  - 絶対可積分性を確認して期待値を計算できる
  - 元の分布を用いる期待値計算公式と線形性を離散・連続分布へ使える
  - 分散・共分散・相関係数を存在条件付きで計算できる
  - 条件付き期待値を確率変数として扱いタワープロパティを使える
  - 条件付き分散から全分散公式を導き有限分割と一般の条件付けへ適用できる
  - 条件付き共分散から全共分散公式を導き群内・群間共分散へ分解できる
  - 確率母関数・モーメント母関数を定義から導き、モーメントと存在範囲を確認できる
