terms:
  - { term: 期待値, symbol: "E[X]", definition: "絶対可積分な確率変数の分布加重平均" }
  - { term: 分散, symbol: "\\operatorname{Var}(X)", definition: "平均からの二乗偏差の期待値" }
  - { term: 共分散, symbol: "\\operatorname{Cov}(X,Y)", definition: "中心化した二変量の積の期待値" }
  - { term: 相関係数, symbol: "\\rho(X,Y)", definition: "共分散を標準偏差の積で標準化した量" }
  - { term: 条件付き期待値, symbol: "E[X\\mid Z]", definition: "Zが与えられたときのXの条件付き平均をZの関数として表す確率変数" }
  - { term: タワープロパティ, symbol: "E\\{E[X\\mid Z]\\}=E[X]", definition: "条件付き期待値を条件変数について再び平均すると元の期待値へ戻る性質" }
  - { term: 条件付き分散, symbol: "\\operatorname{Var}(X\\mid Z)", definition: "Zを固定した条件付き分布におけるXの分散" }
  - { term: 全分散公式, definition: "周辺分散を条件付き分散の平均と条件付き平均の分散の和へ分解する公式" }
  - { term: 条件付き共分散, symbol: "\\operatorname{Cov}(X,Y\\mid Z)", definition: "Zを固定した条件付き分布におけるXとYの共分散" }
  - { term: 全共分散公式, definition: "周辺共分散を条件付き共分散の平均と条件付き平均どうしの共分散へ分解する公式" }
  - { term: 確率母関数, symbol: "G_X(s)", definition: "非負整数値変数のE[s^X]" }
  - { term: モーメント母関数, symbol: "M_X(t)", definition: "E[e^{tX}]" }
  - { term: 階乗モーメント, definition: "E[X(X-1)…(X-r+1)]" }
