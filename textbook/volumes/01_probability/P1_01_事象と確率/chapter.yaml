id: "P1-01"
title: "事象と確率"
volume: "probability"
status: reviewed
prerequisites:
  - F0-00
official_scope:
  - 確率の計算
  - 包除原理
learning_objectives:
  - 標本空間・事象・補集合・和・積・差を正確に表現できる
  - 有限等確率モデルで数え上げと確率計算を分離できる
  - 確率公理から基本公式を導ける
  - 包除原理を重複の意味とともに使える
  - 単調性と確率の連続性を極限問題に使える
  - 上極限事象・下極限事象を集合定義と日本語の両方で説明できる
  - 事象を排反領域へ分割して20〜30分の論述答案を構成できる
definitions:
  - { id: P1-DEF-01, name: 標本空間と事象 }
  - { id: P1-DEF-02, name: 確率測度 }
  - { id: P1-DEF-03, name: 排反 }
  - { id: P1-DEF-03A, name: 有限等確率モデルと一様無作為抽出 }
  - { id: P1-DEF-04, name: 上極限事象と下極限事象 }
theorems:
  - { id: P1-THM-01, name: 補集合・差・単調性 }
  - { id: P1-THM-02, name: 加法公式と包除原理 }
  - { id: P1-THM-03, name: 下からの連続性 }
  - { id: P1-THM-04, name: 上からの連続性 }
canonical_examples:
  - 三事象の包除原理
  - 余事象による数え上げ
  - 増加事象列
  - 三事象の8領域分割
problem_patterns: [SET-1, IE-1, COUNT-1, LIMIT-1, ANSWER-1]
past_exam_alignment:
  - { id: MATH-2022-Q1, current_skills: [事象演算, 確率の上下界, 実現可能性], later_skills: [独立性, 条件付き確率] }
  - { id: MATH-2022-Q2, current_skills: [領域事象, 確率計算], later_skills: [条件付き密度, 相関] }
