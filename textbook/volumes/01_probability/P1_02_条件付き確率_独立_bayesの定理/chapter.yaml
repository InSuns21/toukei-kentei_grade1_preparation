id: "P1-02"
title: "条件付き確率・独立・ベイズの定理"
volume: "probability"
status: reviewed
prerequisites:
  - P1-01
official_scope:
  - 条件付き確率
  - 統計的独立
  - ベイズの定理
learning_objectives:
  - 条件付き確率の条件事象と正確率条件を説明できる
  - 乗法公式と全確率公式を事象の分割から導ける
  - 独立と排反、対独立と相互独立を区別できる
  - ベイズの定理で事前確率・観測確率・周辺確率・事後確率を識別できる
  - 観測後の事後確率を次の予測の混合比として使える
  - Level Cを20〜30分で本番答案にまとめられる
