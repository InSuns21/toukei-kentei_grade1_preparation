id: "P3-04"
title: "混合分布と潜在変数"
volume: "distributions"
status: reviewed
prerequisites:
  - P1-02
  - P3-01
  - P3-02
official_scope:
  - 有限混合分布
  - ポアソン分布とガンマ分布の混合
  - 正規混合分布
  - 潜在変数
  - 観測後の成分確率
  - 混合分布による推定
learning_objectives:
  - 潜在指標を導入して有限混合分布の確率質量関数・確率密度関数を導出できる
  - ポアソン分布とガンマ分布の混合を積分し、平均・分散を確認できる
  - 正規混合の平均・分散と観測後の成分確率を計算できる
  - 混合比や成分母数の推定量を構成し、識別可能性の注意点を説明できる
definitions:
  - { id: P3L-DEF-01, name: 潜在指標と有限混合分布 }
