  - { id: P3L-DEF-03, name: 観測後の成分確率（責務） }
  - { id: P3L-DEF-04, name: ポアソン–ガンマ階層モデル }
  - { id: P3L-DEF-05, name: 識別可能性とラベル交換 }
theorems:
  - { id: P3L-THM-01, name: 全確率・全期待値・全分散 }
  - { id: P3L-THM-02, name: ポアソン–ガンマ混合の周辺分布 }
  - { id: P3L-THM-03, name: 正規混合の平均・分散 }
  - { id: P3L-THM-04, name: 観測後成分確率のベイズ公式 }
  - { id: P3L-THM-05, name: 潜在指標を用いた尤度 }
