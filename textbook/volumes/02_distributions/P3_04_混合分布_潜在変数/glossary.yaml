terms:
  - { term: 潜在指標, definition: 観測されない成分を表す確率変数 }
  - { term: 観測後の成分確率, definition: 観測値が与えられた後に各成分へ属する確率。混合モデルでは責務とも呼ぶ }
  - { term: 責務, definition: 観測後の成分確率。潜在的な成分指示変数の条件付き期待値としても表せる }
  - { term: 混合分布, definition: 成分分布を混合比で重み付けして得られる周辺分布 }
  - { term: ラベル交換, definition: 成分名を入れ替えても同じ混合分布になる性質 }
  - { term: 過分散, definition: ポアソン分布を基準にしたとき、分散が平均より大きくなる状態 }
