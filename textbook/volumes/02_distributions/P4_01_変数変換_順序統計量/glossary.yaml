chapter: "P4-01"
terms:
  - { term: ヤコビアン, meaning: 多変数変換で確率密度関数を直すときに使う面積の倍率を表す行列式 }
  - { term: 畳込み, meaning: 独立な確率変数の和の確率密度関数を求める積分。3個以上の和でも1個ずつ足して繰り返し使える }
  - { term: 順序統計量, meaning: 標本を小さい順に並べた各順位の値 }
  - { term: 標本範囲, meaning: 最大値と最小値の差 }
  - { term: 累積分布関数による一様化, meaning: 連続分布の累積分布関数を確率変数へ適用して0から1の一様分布へ直すこと }
