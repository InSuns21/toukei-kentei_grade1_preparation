id: "P4-01"
title: "変数変換・順序統計量"
volume: "distributions"
status: reviewed
prerequisites: [P3-03]
official_scope: [1変数変換, 多変数変換, ヤコビアン, 和, 差, 積, 比, 最大値, 最小値, 順序統計量]
learning_objectives:
  - 単調・非単調な一変数変換で g(x)=y を満たす元の値を全て数えられる
  - 多変数変換で変換後の範囲とヤコビアンの絶対値を正しく書ける
  - 和・差・積・比の密度公式を導ける
  - 最大・最小・第k順序統計量の分布を再現できる
  - 二つの順序統計量の同時密度を標本配置から導ける
definitions:
  - { id: P4-DEF-01, name: 一変数の密度変換 }
  - { id: P4-DEF-02, name: 多変数変換とヤコビアン }
  - { id: P4-DEF-03, name: 順序統計量 }
theorems:
