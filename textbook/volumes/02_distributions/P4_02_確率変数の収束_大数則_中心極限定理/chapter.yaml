learning_objectives:
  - 確率収束・概収束・分布収束を量化記号を含めて定義し関係を説明できる
  - 大数の法則と中心極限定理を仮定付きで適用できる
  - Chebyshev不等式から有限分散の場合の弱大数則を再現できる
  - 二項・ポアソン標本の正規近似・ポアソン近似と連続補正を計算できる
  - Slutsky型の定理と一次Taylor展開から基本的な漸近変換を説明できる
