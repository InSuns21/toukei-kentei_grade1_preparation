chapter: "P4-02"
terms:
  - {term: 確率収束, meaning: 任意の正の誤差幅を超える確率が0へ収束すること}
  - {term: 概収束, meaning: 確率1で標本点ごとに極限が一致すること}
  - {term: 分布収束, meaning: 極限分布の累積分布関数の連続点で累積分布関数が収束すること}
  - {term: 確率Cauchy列, meaning: 二つの十分後ろの項の差が任意の誤差幅を超える確率が0へ近づく列}
  - {term: 大数の法則, meaning: 標本平均が母平均へ収束することを保証する定理}
  - {term: 中心極限定理, meaning: 適切に中心化・標準化した標本和が標準正規分布へ分布収束する定理}
  - {term: Slutsky型の定理, meaning: 分布収束する量と定数へ確率収束する量を組み合わせたときの極限分布を与える定理}
  - {term: 連続補正, meaning: 離散分布を連続分布で近似するとき整数境界を半整数へずらす補正}
