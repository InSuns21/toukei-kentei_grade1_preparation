id: "P3-02"
title: "主要な連続分布"
volume: "distributions"
status: reviewed
prerequisites: [P2-02]
official_scope: [一様分布, 正規分布, 指数分布, ガンマ分布, ベータ分布, コーシー分布, 対数正規分布, ワイブル分布, ロジスティック分布]
learning_objectives:
  - 生成機構・台・ハザードから主要連続分布を選べる
  - 確率密度関数の正規化と平均・分散を積分または変数変換で再現できる
  - ガンマ分布・ベータ分布・指数分布・ワイブル分布の関係を説明できる
  - コーシー分布と対数正規分布でモーメント母関数が使えない場合を説明できる
  - 標準化・分位点・生存関数を本番答案へ落とし込める
