theorems:
  - { id: P3C-THM-01, name: 正規分布の標準化とモーメント母関数 }
  - { id: P3C-THM-02, name: ガンマ積分とガンマ分布のモーメント }
  - { id: P3C-THM-03, name: ベータ積分とベータ分布のモーメント }
  - { id: P3C-THM-04, name: 指数分布・ワイブル分布の変換とハザード }
  - { id: P3C-THM-05, name: 対数変換で得られる分布 }
