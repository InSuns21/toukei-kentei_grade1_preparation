chapter: "P3-02"
terms:
  - { term: 率パラメータ, meaning: Gamma・指数密度の指数部に掛かる正の係数 }
  - { term: 尺度パラメータ, meaning: 確率変数と同じ単位を持つ広がりの係数 }
  - { term: 生存関数, meaning: S(x)=P(X>x) }
  - { term: ハザード, meaning: h(x)=f(x)/S(x)で表す瞬間故障率 }
  - { term: 重い裾, meaning: 正規分布より尾確率が遅く減少する性質 }
  - { term: 対数正規分布, meaning: 対数を取ると正規分布になる正値分布 }
  - { term: 主値, meaning: 左右対称な打切りで定める値で通常の期待値とは異なる }
