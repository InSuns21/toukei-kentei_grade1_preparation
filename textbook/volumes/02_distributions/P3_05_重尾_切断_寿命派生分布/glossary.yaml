terms:
  - { term: 重尾, definition: 尾確率の減衰が遅く、高次モーメントが存在しないこともある分布の性質 }
  - { term: 生存関数, definition: 寿命が時刻xを超える確率 S(x)=P(X>x) }
  - { term: ハザード関数, definition: 時刻xまで生存した個体がその直後に故障する条件付きの率 }
  - { term: 累積ハザード, definition: ハザードを0からxまで積分した量で、S(0)=1なら H(x)=-log S(x) }
  - { term: 平均残存寿命, definition: 時刻xまで生存した個体について、その後の残存寿命 X-x の条件付き平均 }
  - { term: 右切断, definition: Xが指定された上限以下の個体だけを標本へ入れる観測方式 }
  - { term: 右打切り, definition: 観測終了時刻まで故障しなかった個体について Xがその時刻を超えたことだけを記録する方式 }
