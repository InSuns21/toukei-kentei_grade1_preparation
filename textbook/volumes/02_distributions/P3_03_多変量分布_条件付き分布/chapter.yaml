id: "P3-03"
title: "多変量分布・条件付き分布"
volume: "distributions"
status: reviewed
prerequisites: [P3-01, P3-02, F0-01]
official_scope: [平均ベクトル, 分散共分散行列, 相関行列, 多変量正規分布, 線形変換, 周辺分布, 条件付き分布, 独立性, 相関係数, 偏相関係数, 二次形式]
learning_objectives:
  - 2変量の平均ベクトルと分散共分散行列を各成分の意味と結び付けて読める
  - 線形結合と多変量正規分布の周辺分布を計算できる
  - 二変量正規分布の条件付き平均・条件付き分散を共分散から計算できる
  - 無相関と独立を区別し、同時正規のときの性質を使える
  - 偏相関を残差の相関として計算できる
  - マハラノビス二次形式を尺度と相関を調整した距離として計算できる
