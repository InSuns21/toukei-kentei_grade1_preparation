id: "P3-03"
title: "多変量分布・条件付き分布"
volume: "distributions"
status: reviewed
prerequisites: [P3-01, P3-02, F0-01]
official_scope: [平均ベクトル, 分散共分散行列, 相関行列, 多変量正規分布, 線形変換, 周辺分布, 条件付き分布, 独立性, 相関係数, 偏相関係数, 二次形式]
learning_objectives:
  - 確率ベクトルの平均・共分散と線形変換を次元付きで計算できる
  - 多変量正規分布の周辺・条件付き分布をブロック行列から導ける
  - 無相関と独立を区別し、正規分布での同値条件を使える
  - 偏相関を残差・共分散行列・精度行列から計算できる
  - Mahalanobis二次形式を標準化して解釈できる
