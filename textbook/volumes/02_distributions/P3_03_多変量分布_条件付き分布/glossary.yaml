chapter: "P3-03"
terms:
  - { term: 分散共分散行列, meaning: 対角に各変数の分散、非対角に変数間の共分散を並べた行列 }
  - { term: 相関行列, meaning: 各変数を標準化したときの相関係数を並べた行列 }
  - { term: 条件付き分布, meaning: ある変数の値が分かった後に残りの変数がどのように分布するかを表す分布 }
  - { term: 偏相関, meaning: 他の変数で説明できる線形な部分を取り除いた残差どうしの相関 }
  - { term: 二次形式, meaning: ベクトルと行列から作る x^T A x 型の量 }
  - { term: Mahalanobis距離, meaning: 各変数の尺度と変数間の相関を調整した距離 }
