id: "PDE10"
title: "標準偏微分方程式 X：多次元 Laplace・Poisson 方程式とポテンシャル論"
volume: "foundations"
status: supplementary
prerequisites:
  - PDE6
  - VC4
  - VC6
official_scope: []
learning_objectives:
  - 放射対称関数の n 次元 Laplacian を使って基本解の形を導ける
  - n 次元負 Laplacian の基本解の調和性と単位流束を証明できる
  - Newton ポテンシャルが Poisson 方程式を解く機構を小球除外の積分計算から説明できる
  - 多次元調和関数の平均値性質を発散定理から証明できる
  - Kelvin 変換を定義し調和性保存の計算を追える
  - 半空間の Dirichlet Green 関数と Poisson 核を鏡像法から構成できる
