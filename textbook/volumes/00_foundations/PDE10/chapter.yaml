  - { id: PDE10-THM-01, name: "Newton ポテンシャルと Poisson 方程式" }
  - { id: PDE10-THM-02, name: "多次元調和関数の平均値性質" }
  - { id: PDE10-PROP-02, name: "Kelvin 変換は調和性を保つ" }
  - { id: PDE10-PROP-03, name: "半空間の Dirichlet Green 関数" }
canonical_examples:
