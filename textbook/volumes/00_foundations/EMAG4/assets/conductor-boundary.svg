<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-labelledby="title desc" data-layout-lint="strict">
  <title id="title">静電平衡にある導体表面の電場</title>
  <desc id="desc">左側の導体内部では電場がゼロで、正の表面電荷を持つ境界の右側では電場が表面に垂直な外向き法線方向へ伸びている。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
  </defs>

  <rect x="60" y="40" width="250" height="280" fill="#eeeeee" stroke="#666" stroke-width="2"/>
  <line x1="310" y1="40" x2="310" y2="320" stroke="#222" stroke-width="4"/>

  <circle cx="310" cy="90" r="6" fill="#222"/>
  <circle cx="310" cy="140" r="6" fill="#222"/>
  <circle cx="310" cy="190" r="6" fill="#222"/>
  <circle cx="310" cy="240" r="6" fill="#222"/>
  <circle cx="310" cy="290" r="6" fill="#222"/>

  <line x1="338" y1="95" x2="500" y2="95" stroke="#2f6f9f" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="338" y1="180" x2="500" y2="180" stroke="#2f6f9f" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="338" y1="265" x2="500" y2="265" stroke="#2f6f9f" stroke-width="3" marker-end="url(#arrow)"/>

  <line x1="338" y1="315" x2="430" y2="315" stroke="#222" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="120" y="92" font-size="24" font-family="sans-serif">導体</text>
  <text x="118" y="145" font-size="24" font-family="sans-serif">E = 0</text>
  <text x="340" y="55" font-size="22" font-family="sans-serif">σ &gt; 0</text>
  <text x="520" y="188" font-size="24" font-family="sans-serif">E</text>
  <text x="445" y="323" font-size="22" font-family="sans-serif">n</text>
</svg>
