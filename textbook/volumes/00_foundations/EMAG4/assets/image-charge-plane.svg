<svg xmlns="http://www.w3.org/2000/svg" width="700" height="400" viewBox="0 0 700 400" role="img" aria-labelledby="title desc" data-layout-lint="strict">
  <title id="title">接地導体平面に対する鏡像法</title>
  <desc id="desc">水平な接地導体平面の上方に実電荷qがあり、平面に対して対称な下方位置に破線輪郭の仮想鏡像電荷マイナスqが置かれている。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
  </defs>

  <rect x="70" y="205" width="500" height="145" fill="#eeeeee" stroke="none"/>
  <line x1="70" y1="200" x2="570" y2="200" stroke="#222" stroke-width="4"/>

  <line x1="330" y1="112" x2="330" y2="176" stroke="#777" stroke-width="2" stroke-dasharray="7 7"/>
  <line x1="330" y1="224" x2="330" y2="288" stroke="#777" stroke-width="2" stroke-dasharray="7 7"/>

  <circle cx="330" cy="85" r="16" fill="#2f6f9f" stroke="#222" stroke-width="2"/>
  <circle cx="330" cy="315" r="16" fill="none" stroke="#2f6f9f" stroke-width="3" stroke-dasharray="6 5"/>

  <line x1="620" y1="330" x2="620" y2="55" stroke="#222" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="366" y="92" font-size="24" font-family="sans-serif">q</text>
  <text x="366" y="322" font-size="24" font-family="sans-serif">−q</text>
  <text x="84" y="166" font-size="22" font-family="sans-serif">z = 0</text>
  <text x="640" y="62" font-size="22" font-family="sans-serif">z</text>
</svg>
