id: "EMAG4"
title: "導体・境界値問題・静電エネルギー"
volume: "foundations"
status: supplementary
prerequisites:
  - EMAG3
  - VC4
official_scope: []
learning_objectives:
  - 理想導体の静電平衡で E=0 となる物理的理由を説明し、等電位・内部体積電荷密度0を導ける
  - 静電場の閉曲線積分と Gauss の法則から、導体表面で接線電場0・法線電場 sigma/epsilon_0 を導ける
  - 導体を含む静電問題を Laplace / Poisson 方程式の Dirichlet 境界値問題として定式化できる
  - 同じ電荷密度と同じ Dirichlet 境界値を持つ静電位の一意性を、差のエネルギー積分から説明できる
  - 接地無限平面に対する鏡像法を構成し、誘導表面電荷密度と全誘導電荷を計算できる
  - 静電容量 C=Q/V を定義し、平行平板コンデンサーと孤立導体球の静電容量を導ける
  - コンデンサーの充電仕事から U=Q^2/(2C)=QV/2=CV^2/2 を導ける
  - Poisson 方程式と発散定理から真空中の静電場エネルギー密度 epsilon_0|E|^2/2 を導ける
  - 電荷のない導体空洞で電場が0になることを境界値問題の一意性から説明できる
definitions:
  - { id: EMAG4-DEF-01, name: "静電容量" }
theorems:
  - { id: EMAG4-PROP-01, name: "導体の静電平衡" }
  - { id: EMAG4-PROP-02, name: "導体表面の静電境界条件" }
  - { id: EMAG4-PROP-03, name: "平行平板コンデンサーの静電容量" }
  - { id: EMAG4-PROP-04, name: "孤立導体球の自己静電容量" }
  - { id: EMAG4-PROP-05, name: "コンデンサーに蓄えられる静電エネルギー" }
  - { id: EMAG4-PROP-06, name: "静電場のエネルギー" }
canonical_examples:
  - "正の表面電荷を持つ導体表面で、内部 E=0 と外部法線電場 sigma/epsilon_0 を照合する例"
  - "接地無限導体平面と点電荷を鏡像電荷で解き、誘導表面電荷密度を求める例"
  - "平行平板コンデンサーで C=epsilon_0*A/d を導き、電位差と電荷を対応させる例"
  - "孤立導体球で C=4*pi*epsilon_0*R を導く例"
  - "平行平板コンデンサーの U=CV^2/2 から場のエネルギー密度 epsilon_0*E^2/2 を得る例"
  - "電荷のない導体空洞で定数電位が一意な解となり、E=0 を得る例"
