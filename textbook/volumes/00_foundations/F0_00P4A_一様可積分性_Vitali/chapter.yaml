id: "F0-00P4A"
title: "一様可積分性・Vitali"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00P4
  - F0-00D2B
official_scope: []
learning_objectives:
  - 確率収束だけでは期待値収束しない反例を説明できる
  - 一様可積分性を尾部期待値の一様制御として量化まで含めて定義できる
  - 積分の一様絶対連続性を定義できる
  - 一様可積分性から一様L1有界性と積分の一様絶対連続性を証明できる
  - $L^p$有界性から一様可積分性を示せる
  - 可積分な支配関数から一様可積分性を示せる
  - Vitali型収束定理を確率収束部分列と Fatou の補題から証明できる
  - L1収束から確率収束とUIを逆向きに証明できる
definitions:
  - { id: F0P4A-DEF-01, name: 一様可積分性 }
  - { id: F0P4A-DEF-02, name: 積分の一様絶対連続性 }
theorems:
  - { id: F0P4A-LEM-01, name: 一様可積分性の一様L1有界性と積分の一様絶対連続性 }
  - { id: F0P4A-THM-01, name: 高次モーメントの一様有界性から一様可積分性 }
  - { id: F0P4A-THM-02, name: 可積分な支配関数から一様可積分性 }
  - { id: F0P4A-THM-03, name: Vitali型収束定理 }
canonical_examples:
  - まれな巨大値
