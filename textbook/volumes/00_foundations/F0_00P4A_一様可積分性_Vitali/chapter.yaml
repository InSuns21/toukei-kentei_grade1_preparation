id: "F0-00P4A"
title: "一様可積分性・Vitali"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00P4
  - F0-00D2B
official_scope: []
learning_objectives:
  - 確率収束だけでは期待値収束しない反例を説明できる
  - 一様可積分性をtail expectationの一様制御として量化まで含めて定義できる
  - 積分の一様絶対連続性を定義できる
  - UIから一様L1有界性と積分の一様絶対連続性を証明できる
  - Lp有界性からUIを示せる
  - 可積分な支配関数からUIを示せる
  - Vitali型収束定理を確率収束部分列とFatouから証明できる
  - L1収束から確率収束とUIを逆向きに証明できる
definitions:
  - { id: F0P4A-DEF-01, name: 一様可積分性 }
  - { id: F0P4A-DEF-02, name: 積分の一様絶対連続性 }
theorems:
  - { id: F0P4A-LEM-01, name: UIの一様L1有界性と積分の一様絶対連続性 }
  - { id: F0P4A-THM-01, name: Lp有界性から一様可積分性 }
  - { id: F0P4A-THM-02, name: 可積分な支配関数から一様可積分性 }
  - { id: F0P4A-THM-03, name: Vitali型収束定理 }
canonical_examples:
  - rare large values
  - uniformly bounded family
  - L1 bounded but not uniformly integrable
  - unbounded but uniformly integrable family
  - Lp bounded family
