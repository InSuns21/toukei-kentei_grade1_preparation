official_scope: []
learning_objectives:
  - Brown運動・確率空間・filtrationも解の一部として選ぶweak solutionを定義し、strong solutionとの量化順序の違いを説明できる
  - 同値な確率測度とRadon--Nikodym密度を定義し、density processが条件付き期待値によるmartingaleになることを導ける
  - stochastic exponentialが正のlocal martingaleに留まる場合と真のmartingaleになる場合を区別し、bounded-energy条件とNovikov条件の役割を説明できる
  - Girsanov theoremをcontinuous local martingaleの変換とLevy characterizationから証明し、測度変換後のBrown運動を同定できる
  - SDEのdriftがdiffusionの像に入る場合にGirsanovでdriftを除去し、符号を誤らず変換式を書ける
  - 定数driftのBrown運動でdensity processと変換後のBrown運動を直接計算できる
  - bounded Borel driftと単位diffusionを持つSDEについてBrown運動から測度を作りweak existenceを構成できる
  - uniqueness in lawを定義し、pathwise uniqueness・strong existence・weak existenceとの違いを整理できる
  - Yamada--Watanabe theoremの位置付けと、完全証明を本章で黒箱化する理由を説明できる
