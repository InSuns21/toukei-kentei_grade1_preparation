id: "STO10"
title: "Encore IV 確率解析 X：弱解・Girsanov"
volume: "foundations"
status: supplementary
prerequisites:
  - STO5
  - STO6
  - STO7
  - STO9
  - F0-00P2
  - F0-00P3A
  - F0-00P4A
official_scope: []
learning_objectives:
  - ブラウン運動・確率空間・フィルトレーションも解の一部として選ぶ弱解を定義し、強解との量化順序の違いを説明できる
  - 同値な確率測度とRadon--Nikodym密度を定義し、密度過程が条件付き期待値によるマルチンゲールになることを導ける
  - 確率指数関数が正のlocal マルチンゲールに留まる場合と真のマルチンゲールになる場合を区別し、bounded-energy条件とNovikov条件の役割を説明できる
  - Girsanov theoremをcontinuous local マルチンゲールの変換とLevy characterizationから証明し、測度変換後のブラウン運動を同定できる
  - SDEのドリフトが拡散の像に入る場合にGirsanovでドリフトを除去し、符号を誤らず変換式を書ける
  - 定数ドリフトのブラウン運動で密度過程と変換後のブラウン運動を直接計算できる
  - bounded Borel ドリフトと単位拡散を持つSDEについてブラウン運動から測度を作り弱解の存在を構成できる
  - 法則の一意性を定義し、経路ごとの一意性・strong 存在・弱解の存在との違いを整理できる
  - Yamada--Watanabe theoremの位置付けと、完全証明を本章で黒箱化する理由を説明できる
