chapter: FOU2
scope: dream-theater
coverage: complete
prerequisites:
  - FOU1
forward_references: []

# FOU2 は FOU1 の有限次数 Fourier 理論だけを前提に、無限段階の収束論を Riemann 積分の範囲で閉じる。
# 旧 F0-00FA1・Lebesgue 積分・Hilbert 空間の一般論を concept dependency / proof dependency にしない。

concepts:
  - id: fourier.fou2-pointwise-convergence
    name: 各点収束
    kind: definition
    aliases: [各点収束, pointwise convergence]
    introduction: formal
    requires:
      - fourier.fou1-finite-sum

  - id: fourier.fou2-uniform-convergence
    name: 一様収束
    kind: definition
    aliases: [一様収束, uniform convergence]
    introduction: formal
    requires:
      - fourier.fou1-finite-sum

  - id: fourier.fou2-mean-square-convergence-definition
    name: 二乗平均収束
    kind: definition
    aliases: [二乗平均収束, mean-square convergence]
    introduction: formal
    requires:
      - fourier.fou1-finite-sum

  - id: fourier.fou2-dirichlet-kernel
    name: Dirichlet核
    kind: definition
    aliases: [Dirichlet kernel]
    introduction: formal
    requires:
      - fourier.fou1-finite-sum

  - id: fourier.fou2-dirichlet-integral
    name: Dirichlet核の閉形式とFourier有限和の積分表示
    kind: theorem
    aliases: [Dirichlet kernel closed form and convolution formula]
    introduction: formal
    requires:
      - fourier.fou2-dirichlet-kernel
      - fourier.fou1-real-coefficient

  - id: fourier.fou2-riemann-lebesgue
    name: 高周波振動積分の消去補題
    kind: theorem
    aliases: [高周波振動積分の消去補題, Riemann--Lebesgue型補題, Riemann--Lebesgue, oscillatory integral cancellation lemma]
    introduction: formal
    requires:
      - fourier.fou2-dirichlet-integral

  - id: fourier.fou2-dirichlet-convergence
    name: Dirichletの各点収束定理
    kind: theorem
    aliases: [Dirichlet pointwise convergence theorem]
    introduction: formal
    requires:
      - fourier.fou2-riemann-lebesgue
      - fourier.fou2-dirichlet-integral

  - id: fourier.fou2-gibbs
    name: Gibbs現象
    kind: proposition
    aliases: [Gibbs phenomenon]
    introduction: formal
    requires:
      - fourier.fou2-dirichlet-convergence

  - id: fourier.fou2-fejer-mean
    name: Fejér平均
    kind: definition
    aliases: [Fejér 平均, Fejer mean, Cesaro mean of Fourier sums]
    introduction: formal
    requires:
      - fourier.fou1-finite-sum

  - id: fourier.fou2-fejer-kernel
    name: Fejér核
    kind: definition
    aliases: [Fejer kernel]
    introduction: formal
    requires:
      - fourier.fou2-fejer-mean
      - fourier.fou2-dirichlet-kernel

  - id: fourier.fou2-fejer-kernel-properties
    name: Fejér核の基本性質
    kind: theorem
    aliases: [basic properties of the Fejer kernel]
    introduction: formal
    requires:
      - fourier.fou2-fejer-kernel

  - id: fourier.fou2-fejer-uniform
    name: Fejérの一様収束定理
    kind: theorem
    aliases: [Fejer uniform convergence theorem]
    introduction: formal
    requires:
      - fourier.fou2-fejer-kernel-properties

  - id: fourier.fou2-trig-density
    name: 連続周期関数に対する三角多項式の一様稠密性
    kind: theorem
    aliases: [uniform density of trigonometric polynomials]
    introduction: formal
    requires:
      - fourier.fou2-fejer-uniform

  - id: fourier.fou2-mean-square-convergence
    name: Fourier有限和の二乗平均収束
    kind: theorem
    aliases: [mean-square convergence of Fourier finite sums]
    introduction: formal
    requires:
      - fourier.fou2-trig-density
      - fourier.fou1-least-squares

  - id: fourier.fou2-parseval
    name: Fourier係数のエネルギー等式と三角系の完全性
    kind: theorem
    aliases: [係数エネルギー等式, Parseval 等式, 三角系の完全性, energy identity for Fourier coefficients, completeness of the trigonometric system]
    introduction: formal
    requires:
      - fourier.fou2-mean-square-convergence
      - fourier.fou1-finite-energy-bound
