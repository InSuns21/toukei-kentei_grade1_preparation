  - { id: FOU2-DEF-01, name: 各点収束・一様収束・二乗平均収束 }
  - { id: FOU2-DEF-02, name: Dirichlet核 }
  - { id: FOU2-DEF-03, name: Fejér平均 }
  - { id: FOU2-DEF-04, name: Fejér核 }
theorems:
  - { id: FOU2-THM-01, name: Dirichlet核の閉形式とFourier有限和の積分表示 }
  - { id: FOU2-THM-02, name: 高周波振動積分の消去補題 }
  - { id: FOU2-THM-03, name: Dirichletの各点収束定理 }
  - { id: FOU2-THM-04, name: Fejér核の基本性質 }
  - { id: FOU2-THM-05, name: Fejérの一様収束定理 }
  - { id: FOU2-THM-06, name: 連続周期関数に対する三角多項式の一様稠密性 }
  - { id: FOU2-THM-07, name: Fourier有限和の二乗平均収束 }
  - { id: FOU2-THM-08, name: Fourier係数のエネルギー等式と三角系の完全性 }
canonical_examples: [矩形波の跳躍点収束とGibbs現象, Fejér平均による矩形波の振動抑制, 周期鋸歯状波xの端点平均, 係数エネルギー等式による逆二乗和]
