id: "FOU2"
title: "標準Fourier解析 II：Fourier級数の収束・Fejér・Parseval"
volume: "foundations"
status: supplementary
prerequisites:
  - FOU1
# FOU2 は FOU1 のみを直接前提とし、旧 Fourier 章は互換導線に限定する。
official_scope: []
learning_objectives:
  - 各点収束・一様収束・二乗平均収束の定義と強弱を区別し、Fourier級数で混同してはいけない理由を説明できる
  - Dirichlet核の有限和公式とFourier有限和の積分表示を導出できる
  - 高周波振動積分の消去補題をRiemann積分の階段関数近似から証明し、区分的C1関数のDirichlet収束定理へ適用できる
  - 跳躍点では左右極限の平均へ収束することを証明し、矩形波でGibbs現象の持続する超過量を説明できる
  - Fejér核の非負性・正規化・原点への集中を証明し、連続周期関数に対するFejér平均の一様収束を導ける
  - Fejér平均から連続周期関数に対する三角多項式の一様稠密性を導ける
  - 区分的連続周期関数を二乗平均で三角多項式近似し、FOU1の固定次数最小二乗性からFourier有限和の二乗平均収束を証明できる
  - 二乗平均収束から係数エネルギー等式（Parseval等式）と三角系の完全性を導き、具体的な級数和を計算できる
