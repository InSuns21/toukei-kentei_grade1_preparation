id: "VC4"
title: "標準ベクトル解析 IV：Green の定理・Gauss--Ostrogradsky の発散定理と保存則"
volume: "foundations"
status: supplementary
prerequisites:
  - VC2
  - VC3
  - RA7
official_scope: []
learning_objectives:
  - Green の定理の循環形を単純領域で微積分学の基本定理から証明し、有限分割へ拡張できる
  - Green の定理の流束形を外向き法線と正向き境界の関係から導ける
  - 三次元直方体で発散定理を直接証明し、グラフ領域へ拡張できる
  - 有限分割で内部境界流束が反対向き法線により相殺することを説明できる
  - Gauss--Ostrogradsky の発散定理を仮定込みで述べて適用できる
  - 特異場ではC1仮定が壊れることを確認し、穴あき領域で内側境界流束を追える
  - 局所保存則から積分保存則を導き、任意の小領域での積分形から局所式へ戻る条件を説明できる
  - PDE6 の Green 第一恒等式がVC1の積の微分則とVC4の発散定理から導かれることを説明できる
