id: "VC4"
title: "標準ベクトル解析 IV：Green・Gauss--Ostrogradsky と保存則"
volume: "foundations"
status: supplementary
prerequisites:
  - VC2
  - VC3
  - RA7
official_scope: []
learning_objectives:
  - Green theoremのcirculation formをsimple regionでFTCから証明し、有限分割へ拡張できる
  - Green theoremのflux formを外向き法線と正向き境界の関係から導ける
  - 三次元boxでdivergence theoremを直接証明し、graph domainへ拡張できる
  - finite decompositionで内部境界fluxが反対向き法線により相殺することを説明できる
  - Gauss--Ostrogradsky divergence theoremを仮定込みで述べて適用できる
  - 特異場ではC1仮定が壊れることを確認し、punctured domainで内側境界fluxを追える
  - 局所保存則から積分保存則を導き、任意の小領域での積分形から局所式へ戻る条件を説明できる
  - PDE6のGreen第一恒等式がVC1のproduct ruleとVC4のdivergence theoremから導かれることを説明できる
definitions:
  - { id: VC4-DEF-01, name: 局所保存則 }
theorems:
  - { id: VC4-THM-01, name: Green theorem circulation form }
  - { id: VC4-COR-01, name: Green theorem flux form }
  - { id: VC4-THM-02, name: Gauss--Ostrogradsky divergence theorem }
  - { id: VC4-THM-03, name: 局所保存則から積分保存則 }
  - { id: VC4-PROP-01, name: 任意の小領域での積分保存則から局所式 }
canonical_examples:
  - 単位円板の回転場とGreen theorem
  - radial field x の球面flux
  - inverse-square fieldのpunctured-domain flux
  - 固定領域のcontinuity equation
problem_patterns:
