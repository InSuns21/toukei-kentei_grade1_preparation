chapter: "VC4"
terms:
  - term: Greenの定理
    english: Green theorem
    meaning: 平面領域で境界の循環またはfluxを内部のscalar curlまたはdivergenceの面積分へ移す積分定理。
  - term: Gauss--Ostrogradskyの発散定理
    english: Gauss--Ostrogradsky divergence theorem
    meaning: 三次元領域の境界を通るtotal outward fluxと内部divergenceの体積積分を等置する定理。
  - term: 外向き法線
    english: outward unit normal
    meaning: 閉曲面・閉曲線境界で領域の外側を向く単位法線。
  - term: 局所保存則
    english: local conservation law
    meaning: 密度の時間変化、fluxのdivergence、source termを点ごとに結ぶ微分方程式。
  - term: 積分保存則
    english: integral conservation law
    meaning: 固定領域内のtotal amountの時間変化を境界fluxと内部sourceの総和で表す形。
