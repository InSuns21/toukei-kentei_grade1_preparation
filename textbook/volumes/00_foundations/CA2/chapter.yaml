id: "CA2"
title: "標準複素解析 II：複素線積分・原始関数・Cauchy–Goursat"
volume: "foundations"
status: supplementary
prerequisites:
  - CA1
  - RA4
  - TOP3
  - TOP5
official_scope: []
learning_objectives:
  - 区分的C1曲線と複素線積分を定義し、逆向き・連結・再パラメータ化の基本則を証明できる
  - 複素積分の絶対値評価からML評価を導ける
  - 原始関数があれば線積分が端点差で決まることを実変数FTCへ還元して証明できる
  - 原始関数・経路独立性・全閉曲線積分0の同値を基点積分の構成まで含めて証明できる
  - 三角形版Cauchy–Goursatを4分割反復と正則性の一次近似から証明できる
  - 星型領域で基点からの線分積分を原始関数にする機構を説明できる
  - 1/zの単位円積分が穿孔平面の穴を検出することを説明できる
  - 端点固定homotopyの像を有限個の局所原始関数領域で覆い、格子辺の相殺から線積分のhomotopy不変性を証明できる
  - 単連結領域でCauchyの定理と原始関数の存在を導ける
  - 単連結な零点を含まない領域で1/zの原始関数から正則対数の枝を構成できる
