id: "CA2"
title: "標準複素解析 II：複素線積分・原始関数・Cauchy–Goursat"
volume: "foundations"
status: supplementary
prerequisites:
  - CA1
  - RA4
  - TOP3
  - TOP5
official_scope: []
learning_objectives:
  - 区分的C1曲線の向き・連結・逆向き・再パラメータ化を区別して複素線積分を定義できる
  - 実積分の置換と三角不等式から再パラメータ化不変性とML評価を証明できる
  - 原始関数から複素線積分の基本定理を導き、閉曲線積分が0になる機構を説明できる
  - 経路独立性・全閉曲線積分0・原始関数の存在の同値を基点積分から証明できる
  - 三角形の4分割反復と一点での複素一次近似だけからCauchy–Goursatを証明できる
  - 星型性が三角形を領域内に保つ箇所を明示して原始関数を構成できる
  - 局所原始関数を使って曲線を積分値を保ったまま多角形化できる
  - 連続ホモトピーをコンパクト性で有限の区分線形三角形分割へ落とし、正則線積分のホモトピー不変性を証明できる
  - 単連結性から閉曲線積分0と大域原始関数の存在を導ける
  - 1/zの積分から穴による障害を説明し、単連結な零点回避領域で正則対数の枝を構成できる
