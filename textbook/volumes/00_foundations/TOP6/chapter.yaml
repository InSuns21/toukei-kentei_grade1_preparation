id: "TOP6"
title: "標準位相 VI：全有界性・Baire・net/filter"
volume: "foundations"
status: supplementary
prerequisites:
  - TOP5
  - F0-00D
official_scope: []
learning_objectives:
  - 全有界性を既存正本から再利用し、任意の点列がCauchy部分列を持つこととの同値を両方向に証明できる
  - 距離空間でコンパクト性と「完備かつ全有界」が同値であることを、全有界性と完備性の役割を分離して証明できる
  - 疎集合・meagre集合・Baire空間の定義を量化込みで説明できる
  - Baireのカテゴリー定理を縮小閉球列から証明し、稠密性・開性・完備性・閉性が働く箇所を説明できる
  - 点列では閉包を検出できない一般位相空間の例を、非可算積の有限台点を用いて説明できる
  - 有向集合・net・filterを定義し、閉包と連続性をnetで特徴付けられる
  - netの最終filterとfilterから構成したnetの対応を、filter公理と有向性を使って証明できる
