  - { id: TOP6-THM-02, name: コンパクト距離空間と完備かつ全有界の同値 }
  - { id: TOP6-THM-03, name: Baireのカテゴリー定理 }
  - { id: TOP6-COR-01, name: 非空完備距離空間は自身の中でmeagreでない }
  - { id: TOP6-THM-04, name: 閉包のnetによる特徴付け }
  - { id: TOP6-THM-05, name: 連続性のnetによる特徴付け }
  - { id: TOP6-THM-06, name: netとfilterの収束対応 }
