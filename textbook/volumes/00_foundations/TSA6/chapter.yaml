id: "TSA6"
title: "Encore IV 時系列解析 VI：状態空間・Kalman フィルタ・イノベーション"
volume: "foundations"
status: supplementary
prerequisites:
  - TSA1
  - P3-03
  - LA3B
  - F0-00P7
official_scope: []
learning_objectives:
  - 線形正規状態空間モデルの状態方程式・観測方程式・雑音仮定を次元とともに定式化できる
  - 同時正規ベクトルの条件付け公式を残差の独立性から証明し、Kalman gain の由来を説明できる
  - 予測平均・予測共分散・イノベーション・Kalman gain・フィルタ平均・フィルタ共分散の再帰を導出できる
  - Kalman 共分散更新を Riccati 再帰として書き、Joseph 形と観測による共分散減少を証明できる
  - 観測イノベーションが過去と直交し、線形正規モデルでは時点間で独立になることを証明できる
  - 観測列とイノベーション列が同じ情報を生成することを帰納的に示せる
  - イノベーション分解から線形正規状態空間モデルの対数尤度を導出できる
  - ARMA(1,1) を有限次元状態空間モデルへ埋め込み、TSA1 の予測幾何と TSA4 の ARMA 表現との接続を説明できる
