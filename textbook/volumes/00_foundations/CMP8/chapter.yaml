id: "CMP8"
title: "λ計算・再帰関数・計算可能性の同値像"
volume: "foundations"
status: supplementary
prerequisites:
  - CMP7
official_scope: []
learning_objectives:
  - λ項の構文・自由変数・α変換と捕獲回避代入を具体例から再現できる
  - β簡約の順序で停止の振る舞いが変わることをΩの例で検証できる
  - Church数と後者・加算のλ項を展開し自然数の演算を再構成できる
  - 零・後者・射影・合成・原始再帰から加算・乗算・べき乗を構成できる
  - 最小化による部分関数の定義域と先行未定義値の扱いを区別できる
  - 原始再帰とTuring計算の両方向の対応を有限計算履歴の符号化を含め説明できる
  - λ計算の自然数計算と部分再帰の対応を固定点・分岐・最小化の項から追える
  - 計算モデルの数学的同値定理とChurch–Turingの提唱を区別できる
  - 三モデルの同値性が決定不能性を消さないことを停止と非停止で確かめられる
