id: "MT5"
title: "標準測度論 VI：Radon測度・Riesz–Markov"
volume: "foundations"
status: supplementary
prerequisites:
  - TOP5
  - MT3
official_scope: []
learning_objectives:
  - Radon測度をcompact-finite・open-inner regular・Borel-outer regularとして量化付きで定義できる
  - 局所コンパクトHausdorff空間上のcompact-open cutoffを使って正線形汎関数からopen contentを構成できる
  - compact supportの有限化だけからopen contentの可算劣加法性と互いに素なopen set上の有限加法性を証明できる
  - open contentからouter measureを作りopen setのCaratheodory可測性を証明できる
  - 構成したBorel測度のcompact-finiteness・内正則性・外正則性を証明できる
  - 高さ方向の有限単関数近似と局所order boundからL(f)=int f dmuを証明できる
  - cutoffとRadon正則性から表現測度の一意性を証明できる
  - C_c上の正汎関数版とC_0双対・符号付き測度版の証明境界を区別できる
