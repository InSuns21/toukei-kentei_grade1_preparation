learning_objectives:
  - Sturm--Liouville型境界値問題を定義できる
  - 重み付きL2内積を使って固有関数の直交性を導ける
  - 境界条件が自己共役性に果たす役割を説明できる
  - 異なる固有値に属する固有関数の直交性を積分 by parts から示せる
  - Fourier正弦・余弦級数をSturm--Liouville展開の特殊例として説明できる
  - PDEの変数分離がSturm--Liouville固有値問題を生む理由を説明できる
  - 有限次元スペクトル定理と微分作用素のスペクトル展開の対応を説明できる
