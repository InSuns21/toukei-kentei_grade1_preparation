id: "STO11"
title: "Encore IV Stochastic Analysis XI：Markov process・semigroup・generator・martingale problem"
volume: "foundations"
status: supplementary
prerequisites:
  - STO4
  - STO5
  - STO7
  - STO9
official_scope: []
learning_objectives:
  - transition kernelとtime-homogeneous Markov propertyを定義し、Brown運動やdiffusionで条件付き期待値をkernelへ書き換えられる
  - Markov semigroupを定義し、Chapman--Kolmogorov identityからsemigroup lawを導ける
  - infinitesimal generatorを定義し、Brown運動とItô diffusionのgeneratorをItô formulaから計算できる
  - Dynkin formulaをmartingale decompositionから証明し、停止時刻版で仮定を確認して使える
  - backward Kolmogorov equationをsemigroupの微分として導き、diffusion PDEとして書ける
  - forward equationをmeasureの弱形式として導き、滑らかな密度がある場合にFokker--Planck equationを得られる
  - Feynman--Kac verification formulaを時間依存Itô formulaから証明し、potentialとrunning termを含む終端値問題へ適用できる
  - martingale problemを定義し、SDE solutionがgeneratorのmartingale problemを解くことを証明できる
  - nondegenerate diffusionではmartingale problemからdriftとquadratic covariationを復元し、Lévy characterizationでweak SDEへ戻せる
  - well-posed martingale problemがMarkov性・strong Markov性を生む機構とFeller processへの接続を説明できる
