id: "STO11"
title: "Encore IV 確率解析 XI：Markov process・semigroup・生成作用素・マルチンゲール問題"
volume: "foundations"
status: supplementary
prerequisites:
  - STO4
  - STO5
  - STO7
  - STO9
  - F0-00P3A
official_scope: []
learning_objectives:
  - 遷移核とtime-homogeneous Markov propertyを定義し、ブラウン運動や拡散で条件付き期待値をkernelへ書き換えられる
  - マルコフ半群を定義し、Chapman--Kolmogorov identityからsemigroup 法則を導ける
  - infinitesimal 生成作用素を定義し、ブラウン運動とItô 拡散の生成作用素をItô formulaから計算できる
  - Dynkin formulaをマルチンゲール decompositionから証明し、停止時刻版で仮定を確認して使える
  - backward Kolmogorov equationをsemigroupの微分として導き、拡散 PDEとして書ける
  - 前進方程式をmeasureの弱形式として導き、滑らかな密度がある場合にFokker--Planck equationを得られる
  - Feynman--Kac 検証公式を時間依存Itô formulaから証明し、potentialとrunning termを含む終端値問題へ適用できる
  - マルチンゲール問題を定義し、SDE solutionが生成作用素のマルチンゲール問題を解くことを証明できる
  - nondegenerate 拡散ではマルチンゲール問題からドリフトとquadratic covariationを復元し、Lévy characterizationでweak SDEへ戻せる
  - well-posed マルチンゲール問題がMarkov性・strong Markov性を生む機構とFeller processへの接続を説明できる
