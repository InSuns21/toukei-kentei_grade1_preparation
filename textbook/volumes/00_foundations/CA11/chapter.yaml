id: "CA11"
title: "標準複素解析 XI：Gamma 関数・反射公式・Stirling 公式"
volume: "foundations"
status: supplementary
prerequisites:
  - CA10
  - CA7
official_scope: []
learning_objectives:
  - Euler 積分の局所一様収束から Gamma 関数が右半平面で正則であることを示し、関数等式と階乗との対応を導ける
  - 関数等式を用いて Gamma 関数を全平面へ有理型解析接続し、非正整数での単純極と留数を計算できる
  - Euler の極限公式から 1/Gamma の Weierstrass 積を導き、Gamma 関数が零点を持たないことを説明できる
  - CA10 の sin(pi z) の Euler 積と 1/Gamma の積を比較して Euler の反射公式を証明できる
  - Stirling 公式の定数 sqrt(2pi) を Wallis 積で決定し、正の実軸上の漸近公式を再構成できる
  - Stirling 公式と関数等式から Legendre の倍角公式を証明し、Beta 関数との関係を追える
definitions:
  - { id: CA11-DEF-01, name: Gamma 関数 }
  - { id: CA11-DEF-02, name: Euler--Mascheroni 定数 }
  - { id: CA11-DEF-03, name: Beta 関数 }
theorems:
