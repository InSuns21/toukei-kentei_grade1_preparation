  - { id: FA5-THM-03, name: spectrumのcompact性とノルム円板評価 }
  - { id: FA5-THM-04, name: 複素Banach空間上のspectrum非空性 }
  - { id: FA5-THM-05, name: 多項式spectral mapping theorem }
  - { id: FA5-THM-06, name: spectral radius formula }
canonical_examples: [有限次元行列ではspectrumと固有値集合が一致, unilateral shiftのspectrumは閉単位円板で固有値を持たない, C([0,1])上の座標乗算作用素のspectrumは[0,1]]
