id: "FA5"
title: "標準関数解析 V：スペクトル・レゾルベント"
volume: "foundations"
status: supplementary
prerequisites:
  - FA0
  - FA2
  - LA6
  - CA3
  - HB
official_scope: []
learning_objectives:
  - 複素Banach空間上の有界作用素についてresolvent集合・spectrum・resolvent作用素を定義し、有限次元の固有値集合との違いを説明できる
  - Neumann級数を作用素ノルムで構成し、可逆作用素全体の開性と逆写像の局所級数表示を証明できる
  - resolvent恒等式と局所級数表示からresolvent集合の開性・resolventの正則性を導ける
  - spectrumが空でないcompact集合であり、sigma(T)が閉円板{|lambda|<=||T||}に含まれることを証明できる
  - Liouvilleの定理を使うspectrum非空性の証明で、Hahn–Banachによるscalarizationが必要な箇所を特定できる
  - 多項式spectral mapping theoremを因数分解と可換な作用素因子の可逆性から証明できる
  - spectral radius formula r(T)=lim ||T^n||^(1/n)をresolventのCauchy積分評価から証明できる
  - unilateral shiftや乗算作用素を通じ、無限次元ではspectrumの点が固有値とは限らないことを判定できる
definitions:
