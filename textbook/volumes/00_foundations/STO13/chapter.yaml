id: "STO13"
title: "Encore IV 確率解析 XIII：ポアソン過程・連続時間マルコフ連鎖・ランダム測度"
volume: "foundations"
status: supplementary
prerequisites:
  - STO2
  - F0-00D2C
official_scope: []
learning_objectives:
  - ポアソン過程を独立定常増分とポアソン分布で定義し、到着時刻と指数待ち時間の関係を導ける
  - 補償ポアソン過程 N_t-lambda t がマルチンゲールであることを条件付き期待値から証明できる
  - 計数過程の補償過程の意味を説明し、ポアソン過程では lambda t が補償過程になることを確認できる
  - 有限状態連続時間マルコフ連鎖の Q-行列、跳躍連鎖、滞在時間を相互に変換できる
  - 有限状態 CTMC を跳躍連鎖と指数滞在時間から構成し、非爆発性を証明できる
  - CTMC の生成作用素 Qf と短時間遷移確率を結び、Kolmogorov 後退・前進方程式を導ける
  - 有限状態 CTMC の f(X_t)-f(X_0)-int_0^t Qf(X_s)ds がマルチンゲールになることを証明できる
  - ポアソンランダム測度と強度測度を定義し、有限強度集合上の計数過程をポアソン過程として読み出せる
  - 補償ポアソンランダム測度に対する決定論的単関数型積分のマルチンゲール性と L2 等長性を証明できる
  - 可算状態 Q-行列では爆発が起こり得ることを純粋出生過程の例で説明できる
