id: "STO13"
title: "Encore IV 確率解析 XIII：ポアソン過程・連続時間マルコフ連鎖・ランダム測度"
volume: "foundations"
status: supplementary
prerequisites:
  - STO2
  - F0-00D2C
official_scope: []
learning_objectives:
  - ポアソン過程を独立定常増分とポアソン分布で定義し、到着時刻と待ち時間の関係を導ける
  - 補償ポアソン過程 N_t-lambda t がマルチンゲールであることを条件付き期待値から証明できる
  - 計数過程の補償過程の意味を説明し、ポアソン過程では lambda t が補償過程になることを確認できる
  - 有限状態連続時間マルコフ連鎖の Q-matrix、jump chain、holding time を相互に変換できる
  - 有限状態 CTMC を jump chain と exponential holding time から構成し、非爆発性を確認できる
  - CTMC の生成作用素 Qf と短時間遷移確率を結び、Kolmogorov backward / forward equations を導ける
  - ポアソンランダム測度と強度測度を定義し、有限強度集合上の計数過程をポアソン過程として読み出せる
  - 補償ポアソンランダム測度に対する deterministic simple integral のマルチンゲール性と L2 isometry を証明できる
  - compound Poisson process をポアソンランダム測度で表し、その特性関数と補償マルチンゲールを導ける
  - countable-state Q-matrix では explosion が起こり得ることを pure-birth 例で説明できる
