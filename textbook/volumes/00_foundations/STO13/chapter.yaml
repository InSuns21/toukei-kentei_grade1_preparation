  - { id: STO13-DEF-04, name: "ポアソンランダム測度" }
  - { id: STO13-DEF-05, name: "補償ポアソンランダム測度" }
theorems:
  - { id: STO13-THM-01, name: "ポアソン過程の待ち時間は独立同分布 exponential" }
  - { id: STO13-PROP-01, name: "補償ポアソン過程はマルチンゲール" }
  - { id: STO13-THM-02, name: "有限状態 CTMC の jump-chain / holding-time 構成" }
  - { id: STO13-THM-03, name: "有限状態 CTMC の Kolmogorov backward / forward equations" }
  - { id: STO13-THM-04, name: "補償ポアソンランダム測度の simple L2 isometry" }
  - { id: STO13-PROP-02, name: "compound Poisson process の特性関数と補償" }
