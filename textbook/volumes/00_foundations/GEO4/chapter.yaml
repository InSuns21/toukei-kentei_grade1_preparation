id: "GEO4"
title: "幾何学 IV：1 の分割・局所化・埋め込み"
volume: "foundations"
status: supplementary
prerequisites:
  - GEO3
  - TOP5A
official_scope: []
learning_objectives:
  - 局所有限族と開被覆の細分を定義し、具体的な集合族について局所有限性を判定できる
  - 滑らかな多様体が局所コンパクト Hausdorff であることを座標近傍から証明できる
  - 第二可算性から閉包がコンパクトな可算開被覆とコンパクト exhaustion を構成できる
  - コンパクト exhaustion を使って任意の開被覆の局所有限な開細分を構成し、多様体のパラコンパクト性を証明できる
  - Euclid 空間の平坦関数から滑らかな隆起関数を構成し、多様体上のコンパクト集合を開集合内へ滑らかに局所化できる
  - 任意の開被覆に従属する滑らかな 1 の分割を構成し、局所有限性が滑らかな無限和を正当化する理由を説明できる
  - 1 の分割を使って局所的な滑らかな関数を大域的な滑らかな関数へ貼り合わせられる
  - コンパクト滑らかな多様体を有限次元 Euclid 空間へ滑らかに埋め込む写像を構成し、単射性・はめ込み性・位相的埋め込み性を証明できる
