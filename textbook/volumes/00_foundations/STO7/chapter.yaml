  - STO6
  - RA3
official_scope: []
learning_objectives:
  - d次元Brown運動をfiltrationに対する独立Gaussian増分と連続性で定義し、成分間covariationがKronecker deltaで決まることを証明できる
  - continuous semimartingaleに対する積分をlocal martingale partとfinite-variation partへ分解して定義し、分解一意性によりwell-definedであることを説明できる
  - weighted covariation sumの収束を使い、continuous semimartingaleに対する多次元Itô公式を二次Taylor展開から証明できる
  - 多次元Itô公式からproduct ruleとintegration by partsを導き、quadratic covariationが通常の積の微分則を補正する理由を説明できる
  - Itô processをdriftとBrownian stochastic integralの和として定義し、generator型のdrift補正を含む時間依存Itô公式を計算できる
  - continuous local martingaleのstochastic exponentialをItô公式から導き、Brownian exponential martingaleが真のmartingaleになることを独立増分から証明できる
  - Stratonovich integralを対称Riemann和から構成し、Itô integralとの差がcovariationの半分になることを証明できる
  - Euclidean Stratonovich の連鎖律をcovariation 連鎖律とItô公式から導き、通常の連鎖律が回復する機構を説明できる
  - Itô--Stratonovich conversionをItô processの分散共分散行列で明示し、後続SDEで現れるdrift correctionを計算できる
  - manifold上の確率解析を本章へ逆輸入せず、Euclidean calculusがその入口になる位置付けを説明できる
