id: "STO7"
title: "Encore IV 確率解析 VII：multidimensional Itô calculus・Stratonovich"
volume: "foundations"
status: supplementary
prerequisites:
  - VC1
  - STO5
  - STO6
  - RA3
official_scope: []
learning_objectives:
  - d次元ブラウン運動をfiltrationに対する独立Gaussian増分と連続性で定義し、成分間共変分がKronecker deltaで決まることを証明できる
  - 連続セミマルチンゲールに対する積分を局所マルチンゲール partとfinite-variation partへ分解して定義し、分解一意性によりwell-definedであることを説明できる
  - weighted 共変分 sumの収束を使い、連続セミマルチンゲールに対する多次元Itô公式を二次Taylor展開から証明できる
  - 多次元Itô公式から積の公式と部分積分公式を導き、quadratic 共変分が通常の積の微分則を補正する理由を説明できる
  - Itô 過程をドリフトとブラウン確率積分の和として定義し、生成作用素型のドリフト補正を含む時間依存Itô公式を計算できる
  - 連続局所マルチンゲールの確率指数関数をItô公式から導き、ブラウン exponential マルチンゲールが真のマルチンゲールになることを独立増分から証明できる
  - Stratonovich 積分を対称Riemann和から構成し、Itô integralとの差が共変分の半分になることを証明できる
  - Euclidean Stratonovich の連鎖律を共変分連鎖律とItô公式から導き、通常の連鎖律が回復する機構を説明できる
  - Itô--Stratonovich 変換をItô 過程の分散共分散行列で明示し、後続SDEで現れるドリフト補正を計算できる
  - manifold上の確率解析を本章へ逆輸入せず、Euclidean calculusがその入口になる位置付けを説明できる
