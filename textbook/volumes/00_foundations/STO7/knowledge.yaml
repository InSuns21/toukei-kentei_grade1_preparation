chapter: STO7
scope: dream-theater
coverage: complete
prerequisites:
  - VC1
  - STO5
  - STO6
  - RA3

forward_references:
  - stochastic.markov-generator
  - stochastic.brownian-sde

concepts:
  - id: stochastic.vector-brownian-motion
    name: d次元Brown運動
    kind: definition
    aliases: ["vector Brownian motion", "multidimensional Brownian motion"]
    introduction: formal
    introduction_aliases: ["定義（d 次元ブラウン運動）"]
    requires:
      - stochastic.brownian-motion
      - stochastic.filtration

  - id: stochastic.vector-brownian-covariation
    name: vector Brownian motionのcovariation
    kind: proposition
    aliases: ["Brownian cross variation", "[B^i,B^j]=delta_ij t"]
    introduction: formal
    introduction_aliases: ["命題（多次元ブラウン運動の共変分）"]
    requires:
      - stochastic.vector-brownian-motion
      - stochastic.covariation
      - stochastic.brownian-quadratic-variation

  - id: stochastic.semimartingale-integral
    name: continuous semimartingaleに対する積分
    kind: definition
    aliases: ["continuous semimartingale integral", "semimartingale stochastic integral"]
    introduction: formal
    introduction_aliases: ["定義（連続セミマルチンゲールに対する積分）"]
    requires:
      - stochastic.continuous-semimartingale
      - stochastic.local-stochastic-integral
      - stochastic.semimartingale-decomposition-uniqueness

  - id: stochastic.weighted-covariation-sum
    name: weighted covariation sum
    kind: lemma
    aliases: ["weighted quadratic covariation sum"]
    introduction: formal
    introduction_aliases: ["補題（重み付き共変分和）"]
    requires:
      - stochastic.covariation
      - stochastic.semimartingale-integral

  - id: stochastic.multidimensional-ito-formula
    name: multidimensional Itô formula
    kind: theorem
    aliases: ["multidimensional Ito formula", "Itô formula in R^d", "Itô 公式", "多次元 Itô 公式"]
    introduction: formal
    introduction_aliases: ["定理（多次元 Itô 公式）"]
    requires:
      - stochastic.weighted-covariation-sum
      - stochastic.semimartingale-integral
      - analysis.taylor-theorem

  - id: stochastic.ito-product-rule
    name: product rule / integration by parts
    kind: corollary
    aliases: ["Itô product rule", "stochastic integration by parts"]
    introduction: formal
    introduction_aliases: ["系（積の公式 / 部分積分公式）"]
    requires:
      - stochastic.multidimensional-ito-formula
      - stochastic.covariation

  - id: stochastic.ito-process
    name: Itô process
    kind: definition
    aliases: ["Ito process", "Brownian Itô process"]
    introduction: formal
    introduction_aliases: ["定義（Itô 過程）"]
    requires:
      - stochastic.vector-brownian-motion
      - stochastic.local-stochastic-integral

  - id: stochastic.vector-brownian-integral-covariation
    name: vector Brownian stochastic integralsのcovariation
    kind: lemma
    aliases: ["covariation of vector Brownian integrals", "Brownian stochastic integral cross variation", "確率積分 covariation 公式", "STO7 の確率積分 covariation 公式", "確率積分の covariation 公式", "確率積分の共変分公式"]
    introduction: formal
    introduction_aliases: ["補題（多次元ブラウン確率積分の共変分）"]
    requires:
      - stochastic.vector-brownian-covariation
      - stochastic.local-stochastic-integral
      - stochastic.stochastic-integral-bracket

  - id: stochastic.ito-process-formula
    name: Itô process版の時間依存Itô formula
    kind: theorem
    aliases: ["time-dependent Ito formula", "Itô formula for Itô processes", "時間依存 Itô 公式"]
    introduction: formal
    introduction_aliases: ["定理（Itô 過程版の時間依存 Itô 公式）"]
    requires:
      - stochastic.multidimensional-ito-formula
      - stochastic.ito-process
      - stochastic.vector-brownian-covariation

  - id: stochastic.stochastic-exponential
    name: stochastic exponential
    kind: definition
    aliases: ["Doleans exponential", "stochastic exponential of a continuous local martingale", "確率指数関数"]
    introduction: formal
    introduction_aliases: ["定義（確率指数関数）"]
    requires:
      - stochastic.continuous-local-martingale
      - stochastic.continuous-local-martingale-qv

  - id: stochastic.stochastic-exponential-equation
    name: stochastic exponential の基本恒等式
    kind: proposition
    aliases: ["stochastic exponential equation", "stochastic exponential solves dZ=Z dM"]
    introduction: formal
    introduction_aliases: ["命題（確率指数関数の基本恒等式）"]
    requires:
      - stochastic.stochastic-exponential
      - stochastic.multidimensional-ito-formula

  - id: stochastic.brownian-exponential-martingale
    name: Brownian exponential martingale
    kind: proposition
    aliases: ["exponential martingale", "Brownian exponential"]
    introduction: formal
    introduction_aliases: ["命題（ブラウン指数マルチンゲール）"]
    requires:
      - stochastic.stochastic-exponential-equation
      - stochastic.vector-brownian-motion

  - id: stochastic.stratonovich-integral
    name: Stratonovich integral
    kind: definition
    aliases: ["Stratonovich integral", "symmetric stochastic integral"]
    introduction: formal
    introduction_aliases: ["定義（Stratonovich integral）"]
    requires:
      - stochastic.semimartingale-integral
      - stochastic.covariation

  - id: stochastic.ito-stratonovich-basic-conversion
    name: Stratonovich integralとItô integralの変換
    kind: theorem
    aliases: ["Itô-Stratonovich conversion", "Ito Stratonovich conversion"]
    introduction: formal
    introduction_aliases: ["定理（Stratonovich integral と Itô integral の変換）"]
    requires:
      - stochastic.stratonovich-integral
      - stochastic.covariation

  - id: stochastic.covariation-chain-rule
    name: covariation の連鎖律
    kind: lemma
    aliases: ["chain rule for covariation"]
    introduction: formal
    introduction_aliases: ["補題（共変分の連鎖律）"]
    requires:
      - stochastic.multidimensional-ito-formula
      - stochastic.covariation

  - id: stochastic.stratonovich-chain-rule
    name: Euclidean Stratonovich の連鎖律
    kind: theorem
    aliases: ["Stratonovich chain rule", "ordinary chain rule for Stratonovich calculus"]
    introduction: formal
    introduction_aliases: ["定理（ユークリッド空間の Stratonovich の連鎖律）"]
    requires:
      - stochastic.ito-stratonovich-basic-conversion
      - stochastic.covariation-chain-rule
      - stochastic.multidimensional-ito-formula

  - id: stochastic.ito-process-stratonovich-conversion
    name: Itô processに対するItô--Stratonovich conversion
    kind: corollary
    aliases: ["Euclidean Ito-Stratonovich correction", "Stratonovich drift correction"]
    introduction: formal
    introduction_aliases: ["系（Itô 過程に対する Itô--Stratonovich 変換）"]
    requires:
      - stochastic.stratonovich-chain-rule
      - stochastic.ito-process-formula
