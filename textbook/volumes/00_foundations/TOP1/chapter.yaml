  - { id: TOP1-THM-03, name: initial topology の最粗性と連続性判定 }
  - { id: TOP1-PROP-01, name: 部分空間位相の連続性判定 }
  - { id: TOP1-THM-04, name: 積位相の基底 }
  - { id: TOP1-THM-05, name: 積位相の普遍性 }
  - { id: TOP1-THM-06, name: final topology は位相であり、最細である }
  - { id: TOP1-THM-07, name: 商写像の普遍性 }
  - { id: TOP1-PROP-02, name: 開な飽和集合の像は商位相で開 }
