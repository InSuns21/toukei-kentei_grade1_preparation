<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="title desc" data-layout-lint="strict">
  <title id="title">真空中の平面電磁波の直交する三方向</title>
  <desc id="desc">同じ地点から紙面の右へ波数ベクトル k、上へ電場 E が伸びる。磁場 B は同じ地点にある丸と点で紙面手前向きを表す。k と E の外積は B の向きで、三者が互いに直交する。線種と記号によりモノクロでも判読できる。</desc>
  <defs>
    <marker id="e-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#D55E00"/></marker>
    <marker id="k-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#6B7280"/></marker>
  </defs>
  <line x1="210" y1="205" x2="210" y2="80" stroke="#D55E00" stroke-width="4" marker-end="url(#e-arrow)" data-series-group="emag8-directions" data-series-label="E"/>
  <line x1="210" y1="205" x2="450" y2="205" stroke="#6B7280" stroke-width="3" stroke-dasharray="11 6" marker-end="url(#k-arrow)" data-series-group="emag8-directions" data-series-label="k"/>
  <circle cx="210" cy="205" r="14" fill="white" stroke="#0072B2" stroke-width="3"/>
  <circle cx="210" cy="205" r="4" fill="#0072B2"/>
  <text x="232" y="106" font-size="24" font-family="sans-serif" fill="#D55E00">E</text>
  <text x="477" y="214" font-size="24" font-family="sans-serif" fill="#1F2937">k</text>
  <text x="172" y="251" font-size="24" font-family="sans-serif" fill="#0072B2">B</text>
</svg>