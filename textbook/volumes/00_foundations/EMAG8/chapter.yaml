id: "EMAG8"
title: "電磁波とエネルギー"
volume: "foundations"
status: supplementary
prerequisites:
  - EMAG7
  - VC9
official_scope: []
learning_objectives:
  - 真空の無源 Maxwell 方程式から電場・磁場の波動方程式を導ける
  - 真空波速 c と光速の対応、および波動方程式と Maxwell 方程式の違いを説明できる
  - 同位相平面波の直交関係・分散関係・位相関係を導ける
  - 平面波の波長・振動数と直線偏光・円偏光を具体的に計算できる
  - 電磁エネルギー密度と Poynting ベクトルを定義し局所・積分形のエネルギー収支を証明できる
  - 調和平面波の平均強度、定在波の平均流束を計算できる
  - 電磁場の運動量密度と古典モデルの限界を区別できる
definitions:
  - { id: EMAG8-DEF-01, name: "真空中の電磁波の速度" }
  - { id: EMAG8-DEF-02, name: "同位相の平面電磁波" }
  - { id: EMAG8-DEF-03, name: "電磁エネルギー密度と Poynting ベクトル" }
propositions:
