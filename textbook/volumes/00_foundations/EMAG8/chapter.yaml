canonical_examples:
  - "波動方程式を満たす形の直接代入"
  - "真空中の直線偏光平面波の四つの Maxwell 方程式の検算"
  - "同じ地点の E、B、k の方向関係を示す SVG"
  - "Poynting ベクトルと平均強度"
  - "対向波による定在波と円偏光する波の比較"
