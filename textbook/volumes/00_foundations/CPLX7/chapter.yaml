id: "CPLX7"
title: "Cook–Levinの定理"
volume: "foundations"
status: supplementary
prerequisites:
  - CPLX6
official_scope: []
learning_objectives:
  - 一テープ非決定性Turing機械の計算表を入力長と共通時間上界から有限幅に切り取り停止後の延長を説明できる
  - 計算表の文字・ヘッド状態・遷移選択をBoolean変数で符号化し一意性節を直接検算できる
  - セル・初期配置・合法遷移・受理の四種類の制約を実際の節へ展開できる
  - 遷移選択の適合性・書換え・移動・非ヘッド位置の保存が全て必要な理由を反例で説明できる
  - 受理枝から真の割当てを構成し逆に割当てから合法な受理枝を時刻帰納法で復元できる
  - 式の変数数・節数・符号長と構成時間が入力長の多項式になることを具体的に評価できる
  - 任意のNP言語の固定機械からSATへの多項式時間many-one帰着を構成してCook–Levinの定理を証明できる
  - SATのNP完全性とP=NPの同値に接続し3-SAT完全性は後続で証明することを区別できる
definitions:
  - { id: CPLX7-DEF-01, name: "計算表 tableau" }
