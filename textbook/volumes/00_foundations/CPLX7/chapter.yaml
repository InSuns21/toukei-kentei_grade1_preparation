  - "Boolean変数三つのちょうど一つの節と違反割当て"
  - "ヘッドがいない位置を改変すると保存節に違反する例"
  - "固定時間2次からの変数数4次・節数6次の評価"
  - "入力0と1で受理と拒否が分かれる一歩機械の式の充足性"
