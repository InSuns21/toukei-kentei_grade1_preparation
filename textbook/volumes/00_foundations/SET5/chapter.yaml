learning_objectives:
  - 累積階層 V_alpha を超限再帰で定義できる
  - V_alpha の単調性と推移性を超限帰納法で証明できる
  - 推移閉包を自然数上の再帰から構成できる
  - 正則性公理と整礎関係の接続を説明できる
  - rank を整礎再帰で定義し、有限例で計算できる
  - 任意の集合がどこかの V_alpha に現れることを rank から証明できる
