canonical_examples:
  - 二段二次 Runge–Kutta 法としての陽的中点法と Heun 法
  - 古典4段4次 Runge–Kutta 法
  - y'=lambda y に対する Euler 法・RK4・後退 Euler 法・台形法
  - y_1'=-y_1, y_2'=-1000y_2 による硬さの具体例
  - theta 法による陽的 Euler・台形法・後退 Euler の統一
