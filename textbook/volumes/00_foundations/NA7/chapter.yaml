id: "NA7"
title: "数値解析 VII：ODE 数値解法 II—高次一段法と減衰安定性"
volume: "foundations"
status: supplementary
prerequisites:
  - NA6
official_scope: []
learning_objectives:
  - Runge–Kutta 法の段階値と Butcher 表を定義し、陽的方法と陰的方法を区別できる
  - 二次 Runge–Kutta 法の次数条件を Taylor 展開から導き、中点法と Heun 法で検証できる
  - 古典4段4次 Runge–Kutta 法が自律スカラー方程式で4次となる核心計算を追える
  - 線形テスト方程式から安定関数と絶対安定領域を導き、Euler 法・二次 Runge–Kutta 法・RK4 の減衰再現を判定できる
  - 陽的 Runge–Kutta 法が A 安定になれない理由を安定多項式の成長から証明できる
  - 後退 Euler 法と台形法の安定関数を導き、A 安定性と L 安定性の違いを説明できる
  - 速い減衰モードと遅いモードが共存する硬い問題で、陽的方法に精度ではなく安定性由来の刻み幅制約が生じることを説明できる
  - theta 法が A 安定となる条件 theta >= 1/2 を複素数の絶対値評価から証明し、L 安定となる場合を特定できる
