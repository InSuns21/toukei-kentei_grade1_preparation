chapter: "F0-00E"
terms:
  - { term: ベクトル空間, english: vector space, meaning: ベクトルの加法とスカラー倍について閉じた線形構造。 }
  - { term: 線形包, english: span, meaning: 与えたベクトルの有限線形結合全体。 }
  - { term: 一次独立, english: linear independence, meaning: 自明でない線形結合で0を作れない性質。 }
  - { term: 基底, english: basis, meaning: 空間を張る一次独立なベクトル族。 }
