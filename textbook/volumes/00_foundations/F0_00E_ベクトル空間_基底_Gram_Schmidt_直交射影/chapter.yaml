id: "F0-00E"
title: "ベクトル空間・基底・Gram--Schmidt・直交射影"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00
  - F0-00A
  - F0-00B
official_scope: []
learning_objectives:
  - ベクトル空間・部分空間・線形包・一次独立・基底・次元を相互に結び付けて説明できる
  - 基底に対する座標表示と基底変換の意味を説明できる
  - 内積・直交・正規直交系・直交補空間を定義できる
  - Gram--Schmidt直交化法を導出し、具体的なベクトルから正規直交基底を構成できる
  - 正規直交基底を用いた直交射影を導き、QQ^T と X(X^T X)^{-1}X^T の関係を説明できる
  - 最小二乗法の正規方程式を残差の直交性から導ける
  - QR分解をGram--Schmidtと結び付けて説明できる
