id: "F0-00E"
title: "ベクトル空間・基底"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00
  - F0-00A
  - F0-00A3
official_scope: []
learning_objectives:
  - ベクトル空間と線形部分空間を定義から説明できる
  - 任意の部分集合に対する有限線形結合・線形包・一次独立・基底を定義できる
  - Steinitzの交換補題から有限次元で基底の本数が一定であることを説明できる
  - 有限次元の基底延長定理を説明しrank-nullity theoremの準備ができる
  - Zornの補題を一次独立集合へ適用し、任意のベクトル空間にHamel基底が存在することを証明できる
  - 部分空間の和・直和と次元公式を説明できる
  - 有限次元で基底に対する座標写像が線形同型であることを説明できる
