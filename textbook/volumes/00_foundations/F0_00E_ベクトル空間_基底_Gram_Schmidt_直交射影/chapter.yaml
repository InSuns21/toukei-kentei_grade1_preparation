canonical_examples:
  - R3の2本のベクトルからGram--Schmidtで正規直交基底を構成
  - 正規直交基底からQQ^Tで部分空間へ射影
  - 一般基底Xから射影行列を導出
  - QR分解から最小二乗解を計算
