learning_objectives:
  - ベクトル空間と線形部分空間を定義から説明できる
  - 線形包・一次独立・基底を相互に結び付けて説明できる
  - Steinitzの交換補題から有限次元で基底の本数が一定であることを説明できる
  - 基底延長定理を説明しrank-nullity theoremの準備ができる
  - 部分空間の和・直和と次元公式を説明できる
  - 基底に対する座標写像が線形同型であることを説明できる
