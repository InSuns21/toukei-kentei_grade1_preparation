chapter: F0-00E
scope: dream-theater
coverage: complete
prerequisites:
  - F0-00
  - F0-00A
  - F0-00A3

forward_references:
  - linear.inner-product
  - linear.orthogonality
  - linear.gram-schmidt
  - linear.orthogonal-projection
  - linear.linear-map
  - linear.rank-nullity-theorem
  - linear.representation-matrix
  - linear.similarity
  - linear.eigenvalue
  - linear.eigenspace
  - linear.matrix-determinant
  - functional.orthogonal-decomposition

concepts:
  - id: linear.vector-space
    name: ベクトル空間
    kind: definition
    introduction_aliases: [実ベクトル空間]
    aliases: [ベクトル空間, 実ベクトル空間]
    requires:
      - set.set

  - id: linear.linear-subspace
    name: 線形部分空間
    kind: definition
    aliases: [線形部分空間]
    requires:
      - linear.vector-space

  - id: linear.subspace-test
    name: 部分空間判定法
    kind: proposition
    aliases: [部分空間判定法]
    requires:
      - linear.linear-subspace

  - id: linear.linear-combination-span
    name: 線形結合と線形包
    kind: definition
    aliases: [線形結合とspan, 線形結合と線形包]
    requires:
      - linear.linear-subspace

  - id: linear.span-minimality
    name: 線形包の最小性
    kind: proposition
    aliases: [線形包の最小性]
    requires:
      - linear.linear-combination-span
      - linear.linear-subspace

  - id: linear.linear-independence
    name: 一次独立・一次従属
    kind: definition
    aliases: [一次独立・一次従属, 一次独立, 一次従属]
    requires:
      - linear.linear-combination-span

  - id: linear.basis
    name: 線形代数の基底
    kind: definition
    introduction_aliases: [基底]
    aliases: [線形代数の基底, Hamel基底, Hamel 基底, linear basis]
    requires:
      - linear.linear-combination-span
      - linear.linear-independence

  - id: linear.coordinate-vector
    name: 座標ベクトル
    kind: definition
    aliases: [座標ベクトル]
    requires:
      - linear.basis

  - id: linear.basis-expansion-uniqueness
    name: 基底展開の存在と一意性
    kind: proposition
    aliases: [基底展開の存在と一意性]
    requires:
      - linear.basis
      - linear.linear-independence

  - id: linear.steinitz-exchange-lemma
    name: Steinitzの交換補題
    kind: lemma
    aliases: [Steinitzの交換補題]
    requires:
      - linear.linear-combination-span
      - linear.linear-independence

  - id: linear.finite-spanning-basis
    name: 有限生成空間から基底を取り出せる
    kind: proposition
    aliases: [有限生成空間から基底を取り出せる]
    requires:
      - linear.linear-combination-span
      - linear.linear-independence

  - id: linear.basis-cardinality-invariance
    name: 有限次元で基底の本数は一定
    kind: theorem
    aliases: [有限次元で基底の本数は一定]
    requires:
      - linear.basis
      - linear.steinitz-exchange-lemma

  - id: linear.dimension
    name: 線形空間の次元
    kind: definition
    aliases: [線形空間の次元, ベクトル空間の次元, vector space dimension]
    introduction_aliases: [定義（次元）]
    requires:
      - linear.finite-spanning-basis
      - linear.basis-cardinality-invariance

  - id: linear.subspace-finite-dimensional
    name: 有限次元空間の部分空間も有限次元
    kind: proposition
    aliases: [有限次元空間の部分空間も有限次元]
    requires:
      - linear.dimension
      - linear.linear-subspace
      - linear.steinitz-exchange-lemma

  - id: linear.basis-extension-theorem
    name: 基底延長定理
    kind: theorem
    aliases: [基底延長定理]
    requires:
      - linear.dimension
      - linear.linear-independence

  - id: linear.hamel-basis-existence
    name: Hamel基底の存在
    kind: theorem
    aliases: [Hamel基底の存在, Hamel 基底の存在]
    requires:
      - linear.basis
      - linear.linear-independence
      - set.zorn-lemma

  - id: linear.sum-direct-sum
    name: 線形部分空間の和・直和
    kind: definition
    introduction_aliases: [部分空間の和・直和]
    aliases: [線形部分空間の和・直和, linear direct sum]
    requires:
      - linear.linear-subspace

  - id: linear.dimension-sum-theorem
    name: 部分空間の和の次元公式
    kind: theorem
    aliases: [部分空間の和の次元公式]
    requires:
      - linear.sum-direct-sum
      - linear.dimension
      - linear.basis-extension-theorem
      - linear.subspace-finite-dimensional

  - id: linear.coordinate-isomorphism
    name: 座標写像は線形同型
    kind: theorem
    aliases: [座標写像は線形同型]
    requires:
      - linear.coordinate-vector
      - linear.basis-expansion-uniqueness
