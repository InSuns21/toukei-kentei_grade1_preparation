id: "STO12"
title: "Encore IV 確率解析 XII：ブラウンマルチンゲール表現"
volume: "foundations"
status: supplementary
prerequisites:
  - STO4
  - STO6
  - STO7
  - STO9
  - F0-00D2C
  - F0-00P3A
  - F0-00P3C
  - F0-00P6
official_scope: []
learning_objectives:
  - ブラウン natural フィルトレーション上の二乗可積分マルチンゲールとブラウン確率積分の関係を説明できる
  - ブラウン square-integrable 被積分過程 spaceを定義し、Itô isometryからterminal 確率積分の値域がclosedであることを証明できる
  - 予測可能表現性を定義し、ブラウン運動のフィルトレーションに限定する理由を直接例と反例で説明できる
  - deterministic 被積分過程からexponential マルチンゲールを構成し、そのL2評価と確率積分表現を導ける
  - 一次元Gaussian exponentialのtotalityを特性関数の一意性から証明し、独立Gaussian積へ拡張できる
  - dyadic ブラウン informationとLévy上昇定理を用いてexponential マルチンゲール族がL2(F_T^B)でtotalであることを証明できる
  - ブラウン運動のマルチンゲール表現定理をclosed rangeとGaussian exponentialのtotalityから証明できる
  - 終端確率変数の表現から条件付き期待値過程と二乗可積分マルチンゲールの予測可能表現を導ける
  - strong SDEの終端ペイオフへ表現 theoremを適用し、stochastic control・数理ファイナンスへの橋を説明できる
definitions:
  - { id: STO12-DEF-01, name: "ブラウン square-integrable 被積分過程 space" }
  - { id: STO12-DEF-02, name: "予測可能表現性" }
theorems:
  - { id: STO12-LEM-01, name: "ブラウン terminal 確率積分の値域はclosed" }
  - { id: STO12-LEM-02, name: "deterministic 被積分過程のexponential マルチンゲール" }
  - { id: STO12-LEM-03, name: "Gaussian exponential vectorsのtotality" }
  - { id: STO12-THM-01, name: "ブラウン運動のマルチンゲール表現定理" }
  - { id: STO12-COR-01, name: "条件付き期待値過程の表現" }
  - { id: STO12-COR-02, name: "ブラウン運動のフィルトレーションの予測可能表現性" }
