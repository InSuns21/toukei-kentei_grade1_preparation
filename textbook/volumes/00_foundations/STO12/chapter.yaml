official_scope: []
learning_objectives:
  - Brownian natural filtration上のsquare-integrable martingaleとBrownian stochastic integralの関係を説明できる
  - Brownian square-integrable integrand spaceを定義し、Itô isometryからterminal stochastic integralの値域がclosedであることを証明できる
  - predictable representation propertyを定義し、Brownian filtrationに限定する理由を直接例と反例で説明できる
  - deterministic integrandからexponential martingaleを構成し、そのL2評価とstochastic integral representationを導ける
  - 一次元Gaussian exponentialのtotalityを特性関数の一意性から証明し、独立Gaussian積へ拡張できる
  - dyadic Brownian informationとLévy上昇定理を用いてexponential martingale族がL2(F_T^B)でtotalであることを証明できる
  - Brownian martingale representation theoremをclosed rangeとGaussian exponentialのtotalityから証明できる
  - terminal variable representationからconditional expectation processとsquare-integrable martingaleのpredictable representationを導ける
  - strong SDEのterminal payoffへrepresentation theoremを適用し、stochastic control・mathematical financeへの橋を説明できる
