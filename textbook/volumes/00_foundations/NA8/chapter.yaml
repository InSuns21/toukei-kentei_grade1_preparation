id: "NA8"
title: "数値解析 VIII：数値線形代数 I—直接法"
volume: "foundations"
status: supplementary
prerequisites:
  - NA1
  - F0-00E1
  - F0-00F1
official_scope: []
learning_objectives:
  - 下三角・上三角連立方程式を前進代入・後退代入で一意に解き、計算量が二次であることを説明できる
  - Gauss 消去法を消去行列の積として読み、非零ピボットの下で単位下三角行列 L と上三角行列 U による LU 分解を導ける
  - 可逆行列に対して行交換なしの Gauss 消去が非零ピボットで完走できる条件を首座主小行列式で判定し、そのときの LU 分解の一意性を証明できる
  - 部分ピボット選択付き Gauss 消去法から PA=LU を構成し、消去乗数の絶対値が1以下になる理由を説明できる
  - 要素成長率を定義し、部分ピボット選択でも大きな要素成長が起こり得ることを具体例で説明できる
  - 実対称正定値行列に対する Cholesky 分解 A=LL^T の存在一意性を Schur 補行列の正定値性から証明できる
  - Householder 反射が直交変換であり、ベクトルを座標軸へ写すことを証明して QR 分解の数値構成へ接続できる
  - LU・Cholesky・QR の使い分けを、行列構造・計算量・条件数・残差と後方誤差の観点から説明できる
definitions:
  - { id: NA8-DEF-01, name: LU 分解 }
