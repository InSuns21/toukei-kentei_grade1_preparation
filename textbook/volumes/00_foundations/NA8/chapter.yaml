  - { id: NA8-THM-01, name: Gauss 消去法と LU 分解 }
  - { id: NA8-THM-02, name: 可逆行列に対するピボット選択なし消去の判定と LU 一意性 }
  - { id: NA8-THM-03, name: 部分ピボット選択付き LU 分解 }
  - { id: NA8-THM-04, name: Cholesky 分解の存在一意性 }
  - { id: NA8-PROP-02, name: Householder 反射の直交性と軸への写像 }
  - { id: NA8-PROP-03, name: 正規方程式は2-ノルム条件数を二乗する }
canonical_examples:
  - 3次連立方程式の Gauss 消去と LU 分解
  - 先頭ピボットが0となる可逆行列に対する行交換
  - 部分ピボット選択でも要素成長率が4となる3次行列
  - 2次実対称正定値行列の Cholesky 分解
  - Householder 反射による2次正方行列の QR 分解
  - 悪条件対角行列で小さい残差と大きい前方誤差が共存する例
