  - { id: PDE3-COR-01, name: 初期境界値問題の一意性 }
  - { id: PDE3-COR-02, name: 比較原理 }
  - { id: PDE3-PROP-01, name: Dirichlet熱方程式のエネルギー散逸恒等式 }
  - { id: PDE3-PROP-02, name: 有限Fourier正弦モード解 }
  - { id: PDE3-THM-02, name: 滑らかな初期値に対するFourier正弦級数解 }
  - { id: PDE3-THM-03, name: 実数全体上の熱核表示 }
  - { id: PDE3-PROP-03, name: 熱核解の質量保存・正値性・無限伝播 }
canonical_examples: [単一正弦モード, 二モードの温度減衰, 最大値原理, エネルギー散逸, Fourier正弦級数解, Gaussian熱核, 非零境界値の定常化]
