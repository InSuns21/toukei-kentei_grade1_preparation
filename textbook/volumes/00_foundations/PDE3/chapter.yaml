id: "PDE3"
title: "標準偏微分方程式 III：熱方程式"
volume: "foundations"
status: supplementary
prerequisites:
  - PDE2
  - ODE7
  - FOU2
  - FOU3
official_scope: []
learning_objectives:
  - 熱方程式を放物型PDEとして位置付け、初期境界値問題のデータ配置を説明できる
  - 古典解と放物型境界を定義し、具体的な単一モード解を直接検証できる
  - 最大値原理を証明し、比較原理・一意性・正値性を導ける
  - 斉次Dirichlet境界条件の下でエネルギー散逸恒等式を導ける
  - 変数分離から空間固有値問題と時間減衰ODEを導き、有限モード解を構成できる
  - 十分滑らかな初期値に対するFourier正弦級数解を構成し、項別微分の正当化を説明できる
  - 実数全体上でFourier変換から熱核を導き、畳み込み解が熱方程式を満たすことを示せる
  - 熱核から質量保存・平滑化・正値性・無限伝播を説明できる
definitions:
  - { id: PDE3-DEF-01, name: 熱方程式 }
  - { id: PDE3-DEF-02, name: 放物型境界 }
  - { id: PDE3-DEF-03, name: 熱方程式の古典解 }
  - { id: PDE3-DEF-04, name: 熱核 }
theorems:
