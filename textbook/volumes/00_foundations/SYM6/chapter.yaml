  - { id: SYM6-PROP-01, name: シンプレクティック微分同相によるLagrange性の保存 }
canonical_examples:
  - 四次元の等方平面と余等方超平面
  - 半次元だが等方でない平面
  - 余接束の零切断と完全1形式のグラフ
