official_scope: []
learning_objectives:
  - 等方・余等方・Lagrange部分空間の包含条件を座標例で判定できる
  - 直交補の次元公式と二重直交補の等式を証明し極大等方性と半次元条件の同値性を示せる
  - Lagrange部分多様体を埋め込み・接空間・2形式の制限から定義し正則値の条件と区別できる
  - 余接束の1形式グラフの埋め込み性を証明し閉1形式の必要十分条件を導ける
  - 局所的な原始関数と大域的な完全性を区別し余法束の局所方程式とLagrange性を証明できる
  - シンプレクティック微分同相によるLagrange性の保存を示し平行移動の例で確認できる
