  - { id: F000D-DEF-03, name: ノルム }
  - { id: F000D-DEF-04, name: Banach空間 }
  - { id: F000D-DEF-05, name: 同値なノルム }
  - { id: F000D-DEF-06, name: l2空間 }
theorems:
  - { id: F000D-THM-01, name: 収束列はCauchy列 }
  - { id: F000D-THM-02, name: 完備空間の閉部分集合は完備 }
  - { id: F000D-THM-03, name: 完備な部分空間は閉集合 }
  - { id: F000D-THM-04, name: 有限次元ノルム空間では全てのノルムが同値 }
  - { id: F000D-THM-05, name: 有限次元ノルム空間の完備性 }
  - { id: F000D-THM-06, name: コンパクト距離空間は完備 }
canonical_examples: [有理数の非完備性, l2標準基底による非コンパクト性, 有限次元ノルムの比較]
problem_patterns: [非完備性の反例, compactとcompleteの判定, 閉部分集合の完備性, ノルム比較, 無限次元非コンパクト性]
