id: "F0-00D"
title: "補講：Cauchy列・完備性・無限次元で何が壊れるか"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00C
official_scope: []
learning_objectives:
  - Cauchy列を定義し、収束列との関係を証明できる
  - 完備距離空間とBanach空間を定義できる
  - 実数と有理数を完備性の観点から比較できる
  - 完備空間の閉部分集合が完備であることを証明できる
  - 有限次元で全てのノルムが同値であることを証明できる
  - 有限次元ノルム空間の完備性を証明できる
  - コンパクト距離空間が完備であることを証明できる
  - 無限次元で閉有界集合がコンパクトとは限らない例を説明できる
definitions:
