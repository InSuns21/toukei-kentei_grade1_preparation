learning_objectives:
  - L1関数のFourier変換を定義できる
  - 平行移動・変調・尺度変換のFourier変換を計算できる
  - L1の平行移動連続性からRiemann--Lebesgueの補題を証明できる
  - 畳み込みを定義し畳み込み定理をFubiniから証明できる
  - Cc1/Cc2という明示条件の下で微分則を証明できる
  - GaussianのFourier変換を導ける
  - Gaussian approximate identityからFourier反転定理を証明できる
