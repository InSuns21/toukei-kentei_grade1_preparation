id: "F0-00FA2"
title: "Encore II：Fourier変換・畳み込み・反転"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00FA1
  - F0-00D2
official_scope: []
learning_objectives:
  - L1関数のFourier変換を定義できる
  - 平行移動・変調・尺度変換のFourier変換を計算できる
  - 畳み込みを定義し、Fourier変換が畳み込みを積へ変えることを説明できる
  - 十分滑らかで減衰する関数について微分が周波数側の掛け算になることを導ける
  - Fourier反転公式の意味と成立条件の役割を説明できる
  - GaussianがFourier変換でGaussianへ移ることを説明できる
  - 特性関数が確率測度のFourier変換であることを理解できる
