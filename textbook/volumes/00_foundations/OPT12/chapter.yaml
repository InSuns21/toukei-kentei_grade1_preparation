id: "OPT12"
title: "二次計画・錐計画入門"
volume: "foundations"
status: supplementary
prerequisites:
  - OPT5
  - OPT6A
  - OPT11
official_scope: []
learning_objectives:
  - 二次目的関数の凸性がQの半正定値性と同値であり、狭義凸性が正定値性と同値であることを証明できる
  - 正定値性が凸実行可能集合上の最小点の一意性を与える一方、制約付き問題では必要条件ではないことを説明できる
  - 等式制約付き凸二次計画のKKT条件をブロック線形系として導出し、具体的に解ける
  - Qがker A上で正定値ならKKT行列が正則になることを証明し、制約が零曲率方向を除く機構を説明できる
  - 不等式制約付き凸二次計画でKKT条件を適用し、Slater条件の役割と相補性を説明できる
  - 活性集合を固定したKKT線形系から候補解を作り、乗数の符号と残りの制約を検査できる
  - 二次錐を定義し、閉凸性と自己双対性をCauchy--Schwarzの不等式から証明できる
  - ノルム制約を二次錐制約へ変換し、二次錐計画として定式化できる
  - hard-margin SVMが半正定値な凸二次計画になる理由を説明し、小規模例をKKT条件で解ける
definitions:
  - { id: OPT12-DEF-01, name: 二次計画問題・凸二次計画問題 }
  - { id: OPT12-DEF-02, name: 二次錐 }
