  - { id: OPT12-COR-01, name: 正定値二次目的関数の最小点の一意性 }
  - { id: OPT12-THM-02, name: 等式制約付き凸二次計画のKKT線形系 }
  - { id: OPT12-THM-03, name: 零空間上の正定値性とKKT行列の正則性 }
  - { id: OPT12-THM-04, name: 凸二次計画のKKT条件 }
  - { id: OPT12-THM-05, name: 二次錐の閉凸性と自己双対性 }
canonical_examples:
  - 正定値二次目的関数を半空間で制約する二変数凸二次計画
  - x1+x2=1の等式制約付き最小ノルム問題
  - x1+x2>=2に対する一活性制約のKKT計算
  - 特異なQでもker A上の正定値性により一意解を持つ例
  - 3-4-5ベクトルによる二次錐境界点の検算
  - 点から直線までの距離を二次錐計画へ直す例
  - 二点のhard-margin SVMを半正定値QPとして解く例
