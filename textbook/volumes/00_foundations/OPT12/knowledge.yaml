chapter: OPT12
scope: dream-theater
coverage: complete
prerequisites:
  - OPT5
  - OPT6A
  - OPT11

forward_references: []

concepts:
  - id: optimization.quadratic-program
    name: 二次計画問題
    kind: definition
    aliases:
      - quadratic program
      - quadratic programming
      - QP
    introduction: formal
    introduction_aliases: ["定義（二次計画問題・凸二次計画問題）"]
    requires:
      - linear.positive-semidefinite-matrix

  - id: optimization.convex-quadratic-program
    name: 凸二次計画問題
