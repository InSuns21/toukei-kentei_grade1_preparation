  - { id: GPDE9-LEM-02, name: "difference quotientの部分積分" }
  - { id: GPDE9-LEM-03, name: "difference quotient criterion" }
  - { id: GPDE9-PROP-01, name: "Poisson方程式のCaccioppoli型estimate" }
  - { id: GPDE9-THM-01, name: "Poisson方程式のinterior H^2 regularity" }
  - { id: GPDE9-PROP-02, name: "一般係数のCaccioppoli型estimate" }
  - { id: GPDE9-THM-02, name: "局所Lipschitz係数のinterior H^2 regularity" }
canonical_examples:
  - "多項式x^2,x^3のdifference quotient"
  - "Poisson方程式の局所H^2 regularity"
  - "jump coefficient a=1/2 によるH^2 failure"
  - "reentrant cornerのharmonic singularity"
