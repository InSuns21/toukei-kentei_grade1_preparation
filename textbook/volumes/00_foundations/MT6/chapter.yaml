id: "MT6"
title: "標準測度論 VII：C0版Riesz–Markov・有限符号付きRadon測度"
volume: "foundations"
status: supplementary
prerequisites:
  - MT5
official_scope: []
learning_objectives:
  - C0(X)を無限遠で0になる連続関数として定義し、一様ノルムに関するBanach lattice性を直接証明できる
  - 局所コンパクトHausdorff空間のcutoffを使ってC_c(X)のC_0(X)における一様稠密性を証明できる
  - 正の有界線形汎関数をMT5へ制限し、cutoffとRadon正則性から表現測度の有限性とノルム等式を証明できる
  - 非負関数集合上の正部分envelopeをmin分解で加法化し、正線形汎関数へ線形拡張してT=T^+-T^-を構成できる
  - 有限Radon測度によるdominationからJordan部分のRadon性を導き、有限符号付きRadon測度の差を正当化できる
  - Hahn分解・互いに素なcompact集合・cutoffを使って汎関数ノルムと全変動質量の等式を証明できる
  - ノルム等式から実数値C0版Riesz–Markovの一意性を導ける
definitions:
  - { id: MT6-DEF-01, name: C0空間 }
  - { id: MT6-DEF-02, name: 正部分envelope }
