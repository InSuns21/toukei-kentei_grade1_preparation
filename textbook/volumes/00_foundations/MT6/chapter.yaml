  - { id: MT6-LEM-01, name: 正部分envelopeの加法性 }
  - { id: MT6-LEM-02, name: 非負関数集合上の加法写像の線形拡張 }
  - { id: MT6-THM-04, name: 有界汎関数の正負分解 }
  - { id: MT6-LEM-03, name: 有限Radon測度のdominationによる正則性 }
  - { id: MT6-LEM-04, name: 有限Radon測度の差は有限符号付きRadon }
  - { id: MT6-THM-05, name: 任意の有界汎関数の有限符号付きRadon表示 }
  - { id: MT6-THM-06, name: 有限符号付きRadon測度のノルム等式 }
  - { id: MT6-THM-07, name: Riesz-Markov実数値C0版 }
