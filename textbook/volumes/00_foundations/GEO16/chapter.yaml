  - { id: GEO16-PROP-02, name: 一点正規座標と計量の二階微分 }
  - { id: GEO16-THM-02, name: 第二 Bianchi 恒等式 }
  - { id: GEO16-PROP-03, name: 断面曲率の基底不変性 }
  - { id: GEO16-THM-03, name: 断面曲率による Riemann 曲率テンソルの決定 }
  - { id: GEO16-PROP-04, name: Ricci 曲率の対称性 }
  - { id: GEO16-PROP-05, name: 定断面曲率の曲率テンソル }
  - { id: GEO16-COR-01, name: 定断面曲率空間の Ricci 曲率とスカラー曲率 }
  - { id: GEO16-PROP-06, name: Gauss 方程式の内在表示 }
  - { id: GEO16-COR-02, name: 二次元の Gauss 曲率と断面曲率の一致 }
