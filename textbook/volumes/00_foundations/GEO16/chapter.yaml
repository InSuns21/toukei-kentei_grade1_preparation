id: "GEO16"
title: "幾何学 XVI：Riemann 曲率"
volume: "foundations"
status: supplementary
prerequisites:
  - GEO13
  - GEO11
official_scope: []
learning_objectives:
  - Levi-Civita 接続の共変微分の交換子から曲率作用素を定義し、C∞ 線形性を確認してテンソルであることを証明できる
  - 曲率作用素の座標表示を導き、GEO11 で現れた係数 R^l_{kij} と同じ内在的対象であることを説明できる
  - Riemann 曲率テンソルの反対称性・対交換対称性・第一 Bianchi 恒等式を証明し、各対称性を計算で使える
  - 第二 Bianchi 恒等式を一点正規座標で証明し、曲率が任意の4階テンソルではないことを説明できる
  - 2次元部分空間の断面曲率を定義し、基底の取り方に依存しないことを示せる
  - 断面曲率が全て分かれば Riemann 曲率テンソル全体が復元できることを偏極と第一 Bianchi 恒等式から証明できる
  - Ricci 曲率とスカラー曲率を曲率テンソルの縮約として定義し、定曲率空間で Ric=(n-1)Kg と Scal=n(n-1)K を導ける
  - GEO11 の Gauss 方程式を抽象 Riemann 曲率テンソルの式として読み直し、2次元では Gauss 曲率と断面曲率が一致することを示せる
  - Euclid 空間・半径 a の球面・上半平面模型の曲率を計算し、それぞれ 0・1/a^2・-1/a^2 になることを確認できる
