id: "VC7"
title: "標準ベクトル解析 VII：添字記法・直交基底・成分変換"
volume: "foundations"
status: supplementary
prerequisites:
  - VC4
  - F0-00E1
official_scope: []
learning_objectives:
  - Einstein の総和規約を用い、自由添字とダミー添字を混同せず成分式を展開・縮約できる
  - Kronecker のデルタと Levi--Civita 記号を使い、外積と epsilon--epsilon 縮約公式を再構成し、軸性ベクトルの鏡映時の変換を説明できる
  - 直交デカルト基底変換の下でのスカラー・ベクトル・二階デカルトテンソルの変換則を説明できる
  - 二項積・縮約・跡・二重縮約・対称部分・反対称部分を計算し、基底不変量を識別できる
  - ベクトル場の勾配を二階テンソルとして扱い、発散・回転・回転の回転恒等式を添字記法で導ける
  - 二階テンソル場の発散を定義し、Gauss--Ostrogradsky の発散定理を成分ごとに適用してテンソル版発散定理を導ける
  - 応力テンソル・表面力・慣性テンソルを計算し、慣性テンソルの半正定値性を説明できる
  - すべての直交変換で不変な二階テンソルがスカラー倍の単位テンソルに限ることを証明できる
  - デカルト基底が一定であることと、曲線座標で基底微分が必要になることの境界を説明できる
