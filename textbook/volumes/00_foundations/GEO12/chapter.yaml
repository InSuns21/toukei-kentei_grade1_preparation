id: "GEO12"
title: "幾何学 XII：Riemann 計量・長さ・距離・体積"
volume: "foundations"
status: supplementary
prerequisites:
  - GEO4
  - GEO7
  - GEO8
  - LA5
  - VC1
official_scope: []
learning_objectives:
  - Riemann 計量を接空間ごとの滑らかな正定値内積として定義し、座標表示と変換則を説明できる
  - 1 の分割を用いて任意の滑らかな多様体に Riemann 計量が存在することを核心証明できる
  - Riemann 計量が定める flat・sharp 同型と Riemannian 勾配を構成し、座標公式を導出できる
  - 曲線の長さとエネルギーを定義し、再パラメータ不変性と長さ・エネルギー不等式を証明できる
  - 曲線長の下限として Riemann 距離を定義し、距離の公理を証明できる
  - Riemann 距離が元の多様体位相を誘導することを局所比較評価から証明できる
  - Riemann 等長写像が曲線長・距離を保存することを示せる
  - Riemann 体積形式の座標表示を導き、座標変換に対する不変性を証明できる
  - 体積形式から Riemannian 発散と Laplace--Beltrami 作用素を定義し、座標公式と Euclid の公式を回収できる
