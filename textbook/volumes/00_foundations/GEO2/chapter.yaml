id: "GEO2"
title: "幾何学 II：接空間・余接空間・微分・接束"
volume: "foundations"
status: supplementary
prerequisites:
  - GEO1
  - LA3A
official_scope: []
learning_objectives:
  - 滑らかな関数の芽を使って点における接ベクトルを Leibniz 則を満たす微分作用素として定義できる
  - 局所一次分解から接ベクトルの座標表示を導き、接空間の次元が多様体の次元に一致することを証明できる
  - 曲線の一次同値が座標に依存しないことを示し、曲線表示と微分作用素表示の同値性を証明できる
  - 座標変換に対する接ベクトル成分の変換則を計算できる
  - 滑らかな写像の微分を座標に依存せず定義し、座標表示と連鎖律を証明できる
  - 余接空間・実数値関数の微分・余ベクトルの引き戻しを定義し、双対基底で計算できる
  - 接束と余接束の局所自明化を構成し、自然なベクトル束構造を説明できる
  - 積多様体の接空間を直和として同定し、球面の接空間を具体計算できる
