canonical_examples:
  - "一定力の仕事を変位との内積として計算する例"
  - "Hooke のばね力から V(x)=kx^2/2 を構成する例"
  - "地表近くの重力で位置と速さをエネルギー保存から直接結ぶ例"
  - "調和ポテンシャルの許容領域・転回点・力の向きを同じ図で読む例"
  - "線形抵抗で dE/dt=-c|v|^2<=0 を導く例"
  - "臨界エネルギーで V(x)=E でも通常の転回点とは限らない例"
