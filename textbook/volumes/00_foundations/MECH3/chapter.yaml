id: "MECH3"
title: "仕事・エネルギー・ポテンシャル"
volume: "foundations"
status: supplementary
prerequisites:
  - MECH2
  - RA6
official_scope: []
learning_objectives:
  - 仕事を力と速度の内積の時間積分として定義し、符号と SI 単位を説明できる
  - 運動エネルギーを定義し、Newton の第2法則から仕事―エネルギー定理を導ける
  - 保存力とポテンシャルエネルギーを F=-∇V の関係で結び、ポテンシャルの定数不定性を説明できる
  - 保存力の仕事が始点と終点のポテンシャル差だけで決まることを連鎖律から導ける
  - 時間に依らない保存力の下で力学的エネルギー K+V が保存する条件を説明できる
  - 非保存力がある場合に dE/dt=R dot v を導き、線形抵抗で力学的エネルギーが減少することを示せる
  - 一自由度で V(x)<=E から許容領域と転回点候補を読み、V'(x*)=0 の臨界点との違いを説明できる
  - エネルギー一定条件を位置―速度平面上の曲線として読める
  - 古典的な p=m v から p^2/(2m)+V(q) の意味を説明できる
