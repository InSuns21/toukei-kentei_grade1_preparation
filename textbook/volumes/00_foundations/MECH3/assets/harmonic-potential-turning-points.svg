<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" data-layout-lint="strict" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">調和ポテンシャルの許容領域・転回点・力の向き</title>
  <desc id="desc">上に開くポテンシャル V(x) と水平な全エネルギー E の二交点 x_minus と x_plus を示す。その間が V(x) 以下 E の許容領域で、左右の転回点では速度が 0 になる。力 F=-V' は左右から原点へ向く。</desc>
  <rect width="800" height="520" fill="white"/>
  <defs>
    <marker id="arrow-neutral" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#009E73"/>
    </marker>
  </defs>

  <line x1="90" y1="390" x2="720" y2="390" stroke="#374151" stroke-width="3" marker-end="url(#arrow-neutral)"/>
  <line x1="100" y1="410" x2="100" y2="55" stroke="#374151" stroke-width="3" marker-end="url(#arrow-neutral)"/>

  <path data-series-group="energy-curves" data-series-label="potential"
        d="M150 100 Q400 680 650 100"
        fill="none" stroke="#0072B2" stroke-width="5"/>
  <line data-series-group="energy-curves" data-series-label="total-energy"
        x1="140" y1="210" x2="660" y2="210"
        stroke="#D55E00" stroke-width="4" stroke-dasharray="12 7"/>

  <line x1="203" y1="210" x2="203" y2="390" stroke="#6B7280" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="597" y1="210" x2="597" y2="390" stroke="#6B7280" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="203" cy="210" r="7" fill="#1F2937"/>
  <circle cx="597" cy="210" r="7" fill="#1F2937"/>

  <line x1="203" y1="350" x2="597" y2="350" stroke="#9CA3AF" stroke-width="10" stroke-linecap="round"/>
  <line x1="215" y1="462" x2="330" y2="462" stroke="#009E73" stroke-width="5" marker-end="url(#arrow-green)"/>
  <line x1="585" y1="462" x2="470" y2="462" stroke="#009E73" stroke-width="5" marker-end="url(#arrow-green)"/>

  <g font-family="Noto Sans CJK JP, sans-serif" font-size="22" fill="#1F2937">
    <text x="735" y="408">x</text>
    <text x="68" y="48">V</text>
    <text x="676" y="205" fill="#D55E00" font-weight="700">E</text>
    <text x="675" y="100" fill="#0072B2" font-weight="700">V(x)</text>
    <text x="174" y="430">x−</text>
    <text x="578" y="430">x+</text>
    <text x="391" y="430">0</text>
    <text x="348" y="330">V(x) ≤ E</text>
    <text x="250" y="505" fill="#009E73" font-weight="700">F &gt; 0</text>
    <text x="500" y="505" fill="#009E73" font-weight="700">F &lt; 0</text>
  </g>
</svg>
