<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-labelledby="title desc">
  <title id="title">一次元調和ポテンシャルの許容領域と転回点</title>
  <desc id="desc">上に開く V(x) と水平な全エネルギー E の交点 x_minus と x_plus が転回点で、その間が V(x) 以下 E の許容領域。力 F=-V' は左右から原点へ向く。</desc>
  <rect width="760" height="500" fill="white"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#111"/>
    </marker>
  </defs>
  <g stroke="#111" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <line x1="90" y1="405" x2="690" y2="405"/>
    <line x1="90" y1="405" x2="90" y2="55"/>
  </g>
  <path d="M110 95 Q350 565 590 95" fill="none" stroke="#111" stroke-width="4"/>
  <line x1="120" y1="205" x2="620" y2="205" stroke="#111" stroke-width="3" stroke-dasharray="10 7"/>
  <g stroke="#555" stroke-width="2" stroke-dasharray="6 6">
    <line x1="173" y1="205" x2="173" y2="405"/>
    <line x1="527" y1="205" x2="527" y2="405"/>
  </g>
  <line x1="173" y1="365" x2="527" y2="365" stroke="#777" stroke-width="12" stroke-linecap="round"/>
  <g stroke="#111" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <line x1="205" y1="445" x2="305" y2="445"/>
    <line x1="495" y1="445" x2="395" y2="445"/>
  </g>
  <circle cx="173" cy="205" r="6" fill="#111"/>
  <circle cx="527" cy="205" r="6" fill="#111"/>
  <g font-family="sans-serif" font-size="22" fill="#111">
    <text x="700" y="421">x</text>
    <text x="58" y="55">V</text>
    <text x="628" y="198">E</text>
    <text x="600" y="92">V(x)</text>
    <text x="145" y="435">x₋</text>
    <text x="510" y="435">x₊</text>
    <text x="293" y="355">許容領域 V(x) ≤ E</text>
    <text x="215" y="475">F &gt; 0</text>
    <text x="435" y="475">F &lt; 0</text>
    <text x="318" y="433">0</text>
  </g>
</svg>
