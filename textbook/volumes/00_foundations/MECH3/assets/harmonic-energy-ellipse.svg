<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" data-layout-lint="strict" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">調和振動子の位置―速度平面における等エネルギー曲線</title>
  <desc id="desc">横軸を位置 x、縦軸を速度 v とした平面で、一定エネルギーの曲線は楕円になる。左右端 x=±A では v=0 で転回し、上下端 x=0, v=±omega A では速さが最大になる。</desc>
  <rect width="800" height="520" fill="white"/>
  <defs>
    <marker id="arrow-neutral" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>

  <line x1="85" y1="260" x2="720" y2="260" stroke="#374151" stroke-width="3" marker-end="url(#arrow-neutral)"/>
  <line x1="400" y1="445" x2="400" y2="55" stroke="#374151" stroke-width="3" marker-end="url(#arrow-neutral)"/>

  <path data-series-group="energy-level" data-series-label="E"
        d="M620 260 C620 183 522 120 400 120 C278 120 180 183 180 260 C180 337 278 400 400 400 C522 400 620 337 620 260 Z"
        fill="none" stroke="#0072B2" stroke-width="5"/>

  <circle cx="180" cy="260" r="7" fill="#1F2937"/>
  <circle cx="620" cy="260" r="7" fill="#1F2937"/>
  <circle cx="400" cy="120" r="7" fill="#1F2937"/>
  <circle cx="400" cy="400" r="7" fill="#1F2937"/>

  <g font-family="Noto Sans CJK JP, sans-serif" font-size="22" fill="#1F2937">
    <text x="735" y="278">x</text>
    <text x="378" y="48">v</text>
    <text x="650" y="145" fill="#0072B2" font-weight="700">E</text>
    <text x="125" y="320">−A</text>
    <text x="650" y="320">A</text>
    <text x="445" y="92">ωA</text>
    <text x="418" y="430">−ωA</text>
    <text x="350" y="300">0</text>
  </g>
</svg>
