id: "STO5"
title: "Encore IV 確率解析 V：連続局所マルチンゲール・二次変分・セミマルチンゲール"
volume: "foundations"
status: supplementary
prerequisites:
  - STO2
  - STO4
  - RA3
official_scope: []
learning_objectives:
  - continuous-time マルチンゲールと連続局所マルチンゲールを定義し、localizing sequenceが何を有限化するかを説明できる
  - ブラウン運動がcontinuous マルチンゲールであることをindependent incrementsから証明し、離散時間optional samplingのdyadic近似からbounded stopping theoremを導いて局所化を構成できる
  - ucp convergenceを定義し、二次変分をpartition-independentなucp limitとして読める
  - continuous finite-variation pathの二次変分が0になることをtotal variationから証明できる
  - ブラウン運動の二次変分が[B]_t=tになることを一般のdeterministic partitionでL2計算できる
  - 連続局所マルチンゲールの二次変分 theoremの主張・技術的入力・characterization M^2-[M]を区別して説明できる
  - 共変分をpolarizationで構成し、MN-[M,N]が局所マルチンゲールになることを導ける
  - 連続セミマルチンゲール X=M+Aの二次変分が局所マルチンゲール partだけを見ることを証明できる
  - 連続局所マルチンゲールかつ有限変動なら定数であることからセミマルチンゲール分解の一意性を証明できる
  - Levy characterizationをquadratic Taylor expansionとconditional characteristic functionから再構成できる
  - ブラウン二次変分が通常のchain ruleで二階項を捨てられない理由を説明できる
