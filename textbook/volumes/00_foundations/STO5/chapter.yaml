id: "STO5"
title: "Encore IV Stochastic Analysis V：continuous local martingale・quadratic variation・semimartingale"
volume: "foundations"
status: supplementary
prerequisites:
  - STO2
  - STO4
official_scope: []
learning_objectives:
  - continuous-time martingaleとcontinuous local martingaleを定義し、localizing sequenceが何を有限化するかを説明できる
  - Brown運動がcontinuous martingaleであることをindependent incrementsから証明し、離散時間optional samplingのdyadic近似からbounded stopping theoremを導いてlocalizationを構成できる
  - ucp convergenceを定義し、quadratic variationをpartition-independentなucp limitとして読める
  - continuous finite-variation pathのquadratic variationが0になることをtotal variationから証明できる
  - Brown運動のquadratic variationが[B]_t=tになることを一般のdeterministic partitionでL2計算できる
  - continuous local martingaleのquadratic variation theoremの主張・技術的入力・characterization M^2-[M]を区別して説明できる
  - covariationをpolarizationで構成し、MN-[M,N]がlocal martingaleになることを導ける
  - continuous semimartingale X=M+Aのquadratic variationがlocal martingale partだけを見ることを証明できる
  - continuous local martingaleかつfinite variationなら定数であることからsemimartingale分解の一意性を証明できる
  - Levy characterizationをquadratic Taylor expansionとconditional characteristic functionから再構成できる
  - Brownian quadratic variationが通常のchain ruleで二階項を捨てられない理由を説明できる
