id: "QM6"
title: "非有界自己共役作用素のスペクトル定理"
volume: "foundations"
status: supplementary
prerequisites:
  - QM5
  - QM3
  - FOU4
official_scope: []
learning_objectives:
  - PVM と状態に付随するスカラー測度から、二次モーメント条件を持つ非有界スペクトル積分を定義できる
  - 非有界スペクトル積分の定義域・ノルム恒等式・稠密性を証明し、得られる作用素が自己共役であることを示せる
  - 稠密定義対称作用素が自己共役であるための値域判定 Ran(A+iI)=Ran(A-iI)=H を証明できる
  - 自己共役作用素の Cayley 変換がユニタリであることを示し、D(A)=Ran(I-U) と A=i(I+U)(I-U)^(-1) を導ける
  - ユニタリ作用素のスペクトル定理を橋として、非有界自己共役作用素のスペクトル定理を定義域込みで導ける
  - 位置作用素と運動量作用素のスペクトル PVM を具体的に書き、スペクトル積分の定義域が QM5 の定義域を回収することを確認できる
  - 必要最小限の Borel 関数計算を定義し、exp(-itA) が全空間上のユニタリ作用素になることを示せる
  - 自由粒子 Hamiltonian を Fourier 空間の実乗算作用素として構成し、その PVM と定義域を記述できる
