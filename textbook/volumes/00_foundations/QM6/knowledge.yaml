  - id: quantum.spectral-phase-unitary
    name: スペクトル位相作用素のユニタリ性
    kind: proposition
    aliases: ["unitarity of spectral phase operators"]
    introduction_aliases: ["命題（スペクトル位相作用素はユニタリ）"]
