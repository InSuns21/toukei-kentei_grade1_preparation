learning_objectives:
  - 区間のLebesgue外測度が通常の長さに一致することを説明できる
  - 開集合・Borel集合がLebesgue可測である理由を説明できる
  - Borel sigma代数とLebesgue sigma代数、完備化を区別できる
  - algebra・premeasure・Carathéodory拡張定理を説明できる
  - sigma有限性が測度拡張や積分定理で果たす役割を説明できる
  - 確率測度の構成と測度拡張の共通構造を説明できる
