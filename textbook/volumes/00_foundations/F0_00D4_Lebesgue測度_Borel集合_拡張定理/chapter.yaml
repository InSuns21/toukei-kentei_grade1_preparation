  - { id: F000D4-THM-02, name: 半直線・開区間のCarathéodory可測性 }
  - { id: F000D4-THM-03, name: 実数上の開集合の可算開区間分解 }
  - { id: F000D4-COR-01, name: Lebesgue測度の平行移動不変性 }
  - { id: F000D4-THM-04, name: Carathéodory拡張定理 }
  - { id: F000D4-THM-05, name: σ有限拡張の一意性 }
  - { id: F000D4-THM-06, name: Hopf型の前測度判定 }
canonical_examples:
  - 閉区間の外測度をコンパクト性から評価する例
  - Borel σ代数とLebesgue σ代数の真包含
  - 半開区間集合代数上の長さ前測度
  - 積測度をCarathéodory拡張で構成する例
