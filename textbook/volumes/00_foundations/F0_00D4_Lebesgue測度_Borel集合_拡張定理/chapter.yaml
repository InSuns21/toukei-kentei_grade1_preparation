id: "F0-00D4"
title: "補講：Lebesgue測度・Borel集合・Carathéodory拡張定理"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00D3
  - F0-00D3A
  - F0-00C
official_scope: []
learning_objectives:
  - 区間のLebesgue外測度が通常の長さに一致することを有限被覆補題とコンパクト性から証明できる
  - 半直線・開区間がCarathéodory可測であることを証明できる
  - Lebesgue可測性とLebesgue測度が平行移動で保たれることを外測度の平行移動不変性から証明できる
  - 実数上の開集合が高々可算個の互いに素な開区間へ分解されることを証明できる
  - Borel σ代数とLebesgue σ代数、完備化を区別できる
  - 有限加法性と空集合への連続性から前測度性を導くHopf型判定を証明できる
  - 前測度から外測度を構成し元の集合代数上で値が一致することを証明できる
  - Carathéodory拡張定理がHopf / Hahn--Kolmogorov型としても現れることを説明し、その存在を証明できる
  - σ有限性の下で拡張の一意性を証明できる
  - 積測度の存在一意性を拡張定理の応用として説明できる
definitions:
  - { id: F000D4-DEF-01, name: Borel σ代数 }
  - { id: F000D4-DEF-02, name: 完備化 }
  - { id: F000D4-DEF-03, name: 集合代数 }
  - { id: F000D4-DEF-04, name: 前測度 }
