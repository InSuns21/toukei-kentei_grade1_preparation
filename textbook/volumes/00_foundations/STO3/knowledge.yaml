chapter: STO3
scope: dream-theater
coverage: complete
prerequisites:
  - STO1
  - F0-00D4
  - F0-00P4

forward_references:
  - stochastic.brownian-reflection-principle
  - stochastic.brownian-markov-property
  - stochastic.brownian-strong-markov-property

concepts:
  - id: stochastic.finite-dimensional-distribution-consistency
    name: 有限次元分布と整合性
    kind: definition
    aliases: ["finite-dimensional distribution", "finite-dimensional distributions", "有限次元分布", "有限次元分布の整合性", "整合的有限次元分布"]
    introduction: formal
    introduction_aliases: ["定義（有限次元分布と整合性）"]
    requires:
      - stochastic.stochastic-process

  - id: stochastic.canonical-trajectory-space
    name: canonical path spaceとcylinder set
    kind: definition
    aliases: ["canonical path space", "coordinate process", "cylinder set", "canonical process"]
    introduction: formal
    introduction_aliases: ["定義（標準経路空間と円筒集合）"]
    requires:
      - stochastic.finite-dimensional-distribution-consistency

  - id: stochastic.finite-borel-compact-approximation
    name: 有限Borel測度のcompact内部近似
    kind: lemma
    aliases: ["finite Borel measure compact approximation"]
    introduction: formal
    introduction_aliases: ["補題（有限 Borel 測度の compact 内部近似）"]
    requires:
      - measure.continuity-from-below

  - id: stochastic.kolmogorov-extension
    name: Kolmogorov拡張定理
    kind: theorem
    aliases: ["Kolmogorov extension theorem"]
    introduction: formal
    introduction_aliases: ["定理（Kolmogorov 拡張定理：実数値版）"]
    requires:
      - stochastic.finite-dimensional-distribution-consistency
      - stochastic.canonical-trajectory-space
      - stochastic.finite-borel-compact-approximation
      - measure.caratheodory-extension-theorem

  - id: stochastic.holder-continuity
    name: Hölder continuity
    kind: definition
    aliases: ["Hölder continuity", "Hölder continuous", "Hölder連続", "Hölder 指数"]
    introduction: formal
    introduction_aliases: ["定義（Hölder 連続性）"]
    requires: []

  - id: stochastic.kolmogorov-chentsov-continuity
    name: Kolmogorov--Chentsov continuity theorem
    kind: theorem
    aliases: ["Kolmogorov--Chentsov continuity theorem", "Kolmogorov-Chentsov continuity theorem", "Kolmogorov continuity theorem"]
    introduction: formal
    introduction_aliases: ["定理（Kolmogorov--Chentsov 連続定理：1 パラメータ版）"]
    requires:
      - stochastic.stochastic-process
      - stochastic.modification-indistinguishability
      - stochastic.holder-continuity
      - prob.markov-inequality
      - prob.borel-cantelli-1

  - id: stochastic.continuous-modifications-indistinguishable
    name: 連続なmodificationsのindistinguishability
    kind: proposition
    aliases: ["連続な modifications は indistinguishable", "continuous modifications are indistinguishable"]
    introduction: formal
    introduction_aliases: ["命題（連続な modifications は識別不能）"]
    requires:
      - stochastic.modification-indistinguishability
