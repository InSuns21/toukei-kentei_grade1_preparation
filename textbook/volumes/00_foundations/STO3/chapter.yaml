id: "STO3"
title: "Encore IV 確率解析 III：確率過程の構成・Kolmogorov continuity"
volume: "foundations"
status: supplementary
prerequisites:
  - STO1
  - F0-00D4
  - F0-00P4
official_scope: []
learning_objectives:
  - 有限次元分布を有限座標集合上の確率測度として定義し、座標射影による整合性を直接確認できる
  - 標準経路空間と座標過程を構成し、cylinder setが有限個の時刻だけを見る事象であることを説明できる
  - Kolmogorov extension theoremの証明を円筒集合代数・前測度・コンパクト近似・Carathéodory 拡張の順で再構成できる
  - extension theoremが過程の存在のみを与え標本路の正則性を保証しないことを説明できる
  - Hölder 連続性を定義し、モーメント評価からKolmogorov--Chentsov continuity theoremの指数beta/alphaを計算できる
  - 二進格子・Markov inequality・union bound・Borel--Cantelli・chainingからcontinuous 修正を構成できる
  - continuous modificationsが可算稠密集合と連続性によりindistinguishableになることを証明できる
  - consistent 有限次元分布とincrement moment boundを組み合わせてcontinuous process realizationを構成できる
definitions:
  - { id: STO3-DEF-01, name: "有限次元分布と整合性" }
