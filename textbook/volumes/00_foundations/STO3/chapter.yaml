id: "STO3"
title: "Encore IV Stochastic Analysis III：確率過程の構成・Kolmogorov continuity"
volume: "foundations"
status: supplementary
prerequisites:
  - STO1
  - F0-00D4
  - F0-00P4
official_scope: []
learning_objectives:
  - finite-dimensional distributionを有限座標集合上の確率測度として定義し、座標射影によるconsistencyを直接確認できる
  - canonical path spaceとcoordinate processを構成し、cylinder setが有限個の時刻だけを見る事象であることを説明できる
  - Kolmogorov extension theoremの証明をcylinder algebra・premeasure・compact approximation・Carathéodory extensionの順で再構成できる
  - extension theoremが過程の存在のみを与えpath regularityを保証しないことを説明できる
  - Hölder continuityを定義し、moment estimateからKolmogorov--Chentsov continuity theoremの指数beta/alphaを計算できる
  - dyadic grid・Markov inequality・union bound・Borel--Cantelli・chainingからcontinuous modificationを構成できる
  - continuous modificationsが可算稠密集合と連続性によりindistinguishableになることを証明できる
  - consistent finite-dimensional lawsとincrement moment boundを組み合わせてcontinuous process realizationを構成できる
