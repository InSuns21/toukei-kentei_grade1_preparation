chapter: "F0-00B"
terms:
  - term: 距離空間
    english: metric space
    meaning: 距離関数が定義された集合。
  - term: 開球
    english: open ball
    meaning: 中心から距離が半径未満の点全体。
  - term: 離散距離
    english: discrete metric
    meaning: 異なる二点の距離を1、同じ点同士の距離を0とする距離。
  - term: 開集合
    english: open set
    meaning: 各点の周囲に、その集合内に完全に含まれる小さな開球を置ける集合。
  - term: 閉集合
    english: closed set
    meaning: 補集合が開である集合。距離空間では集合内の収束列の極限をすべて含むことと同値。
  - term: 点列の収束
    english: convergence of a sequence
    meaning: 任意の正のepsilonに対して、十分後ろの項が極限点から距離epsilon未満に入ること。
  - term: 有界集合
    english: bounded set
    meaning: ある中心と有限の半径を選べば、その開球の中に全体を含められる集合。
  - term: interior
    english: interior
    meaning: 集合の内点全体。
  - term: closure
    english: closure
    meaning: 集合を含む最小の閉集合。
  - term: boundary
    english: boundary
    meaning: 閉包から内部を除いた集合。
