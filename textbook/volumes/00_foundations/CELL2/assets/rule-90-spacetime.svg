<title id="title">Rule 90 — 単一1からの時空間図</title>
<desc id="desc">無限線上、初期位置0のみ1。他はすべて0。位置マイナス13から13、時刻0から12。塗りつぶしは状態1、空白のマスは0。上から下へ行を順に表示する。</desc>
