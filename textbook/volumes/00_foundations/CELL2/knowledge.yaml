    kind: definition
    introduction: formal
    introduction_aliases: ["定義（Elementary CA）"]
    requires: [cellular-automata.local-rule, cellular-automata.iteration]

  - id: cellular-automata.rule-number
    name: 規則番号
    kind: definition
    introduction: formal
    introduction_aliases: ["定義（規則番号）"]
