  - "単一1初期配置から時刻12までの時空間図"
  - "Rule 30の時刻0から3までの1位置集合"
  - "半径1の時刻5の後方光円錐"
  - "左シフト・右シフトと定数規則による伝播の鋭さ・非鋭さ"
