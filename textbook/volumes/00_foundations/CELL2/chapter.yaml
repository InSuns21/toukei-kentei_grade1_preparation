id: "CELL2"
title: "Elementary CAと時空間図"
volume: "foundations"
status: supplementary
prerequisites:
  - CELL1
official_scope: []
learning_objectives:
  - 二状態半径1の256個の局所規則とWolfram規則番号の一対一対応を証明し規則表を復号できる
  - Rule 30・90・110の8入力表を復元して無限線上の短い時空間図を手計算できる
  - 時空間図と有限観測窓を定義し有限表示と周期境界・無限配置を区別できる
  - 半径rの時刻tの有限伝播定理を全位置についての帰納法で完全証明できる
  - 有限の観測窓と初期差異集合への有限光円錐の帰結を証明できる
  - 上界と実際の影響が異なる例を構成し規則の有限観測からの誤った一般化を反証できる
  - 目的セルに必要な初期区間と縮小する計算窓を自力設計できる
definitions:
  - { id: CELL2-DEF-01, name: "Elementary CA" }
  - { id: CELL2-DEF-02, name: "規則番号" }
  - { id: CELL2-DEF-03, name: "時空間図と観測窓" }
  - { id: CELL2-DEF-04, name: "有限光円錐" }
propositions:
