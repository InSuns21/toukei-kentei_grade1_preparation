id: "MECH8"
title: "剛体の回転"
volume: "foundations"
status: supplementary
prerequisites:
  - MECH7
  - F0-00F1
official_scope: []
learning_objectives:
  - 質点間距離が一定という剛体モデルを説明し、重心の並進と重心まわりの回転を分離できる
  - 固定軸回転で角速度ベクトル omega と位置 rho から v=omega cross rho を導ける
  - 固定軸まわりの慣性モーメント I=sum_i m_i d_i^2 または I=int d_perp^2 dm を計算できる
  - 平行軸の定理 I=I_C+Md^2 を重心条件から導ける
  - 慣性テンソル J=sum_i m_i(|rho_i|^2 I_3-rho_i rho_i^T) を構成し、L=J omega と K_rot=(1/2) omega^T J omega を導ける
  - 慣性テンソルが実対称半正定値であることを示し、スペクトル定理から主軸と主慣性モーメントを得られる
  - 主軸回転では角運動量と角速度が平行になる一方、一般の回転では平行とは限らないことを判定できる
  - 重心の並進と重心まわりの回転に運動エネルギーを分解できる
  - 回転座標系の微分公式から主軸座標での Euler 方程式を導き、対称剛体の無トルク運動を読める
