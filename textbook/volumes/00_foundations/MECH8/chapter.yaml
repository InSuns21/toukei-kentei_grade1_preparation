canonical_examples:
  - "固定 z 軸まわりの回転で v=omega cross rho を座標計算から確認する例"
  - "一様細棒の中心軸と端軸まわりの慣性モーメントを積分と平行軸の定理で比較する例"
  - "二つの点質量から慣性テンソルを直接構成する例"
  - "対角慣性テンソルで角速度と角運動量が平行にならない例"
  - "主軸基底で慣性テンソルが対角化されることを確認する例"
  - "重心速度と回転速度の交差項が重心条件で消える例"
  - "軸対称剛体の無トルク Euler 方程式で omega_3 と omega_1^2+omega_2^2 が保存する例"
