id: "CA3"
title: "標準複素解析 III：Cauchy積分公式・Taylor展開・Liouville・最大値原理"
volume: "foundations"
status: supplementary
prerequisites:
  - CA2
official_scope: []
learning_objectives:
  - 穿孔円板の外周・内周の境界積分をホモトピーと向きの相殺で比較し、小円極限からCauchy積分公式を証明できる
  - Cauchy積分核の差商を曲線上で一様評価し、微分と線積分の交換から高階導関数公式を導ける
  - Cauchy核の有限幾何級数展開と剰余評価からTaylor展開を導き、正則性から解析性が従う機構を説明できる
  - 高階導関数公式とML評価からCauchy評価を導き、Liouvilleの定理と代数学の基本定理へ接続できる
  - Taylor展開の最初の非零係数から零点の局所因数分解・孤立性・恒等定理を証明できる
  - Cauchy平均値公式の等号条件を追って最大値原理を証明し、境界最大値評価へ落とせる
  - 最大値原理を逆数へ適用し、非定数正則関数が開集合を開集合へ写すことを証明できる
  - Laurent展開・留数・偏角原理を先取りせず、CA2のCauchy理論だけから本章の結論を閉じられる
