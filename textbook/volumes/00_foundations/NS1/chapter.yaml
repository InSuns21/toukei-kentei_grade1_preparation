id: "NS1"
title: "発散零空間・Leray 射影・Stokes 作用素"
volume: "foundations"
status: supplementary
prerequisites:
  - VC9
  - FOU4
  - GPDE3
official_scope: []
learning_objectives:
  - 三次元トーラス上のベクトル場を Fourier モードで表し、発散零条件が k・u_hat(k)=0 に対応することを導ける
  - 平均零の発散零 L2 空間を Fourier 条件と滑らかな発散零三角多項式の L2 閉包の両方から特徴付けられる
  - Leray 射影の Fourier multiplier を導き、発散零成分を残し勾配成分を消すことを各モードで確認できる
  - 周期 Helmholtz 分解 u=Pu+grad phi を構成し、直交性と一意性を証明できる
  - Stokes 作用素 A=-P Delta を定義し、発散零空間上で -Delta と一致すること、正値性を示せる
  - Navier--Stokes 方程式へ Leray 射影を適用して圧力を消去した発展方程式を導ける
  - 射影後にも圧力情報は失われず、Poisson 方程式から平均零圧力を回収できることを説明できる
