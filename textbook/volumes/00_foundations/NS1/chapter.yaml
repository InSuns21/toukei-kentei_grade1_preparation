  - { id: NS1-PROP-03, name: "Stokes 作用素の Fourier 表示と正値性" }
  - { id: NS1-PROP-04, name: "Leray 射影後の Navier--Stokes 方程式" }
  - { id: NS1-PROP-05, name: "圧力の Poisson 方程式による回収" }
canonical_examples:
