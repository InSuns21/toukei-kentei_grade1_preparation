id: "ODE6"
title: "標準常微分方程式 VI：級数解・正則特異点"
volume: "foundations"
status: supplementary
prerequisites:
  - ODE2
  - RA5
official_scope: []
learning_objectives:
  - 収束冪級数表示をもつ係数と常点を定義し、冪級数をODEへ代入するときの項別微分と係数比較を正当化できる
  - 常点で二階線形ODEの冪級数係数漸化式を導き、任意の初期値から一意な局所冪級数解を構成できる
  - 常点・正則特異点・非正則特異点を、正規化後の係数の極の強さから判定できる
  - Frobenius形 y=x^r sum a_n x^n を代入し、最低次数から指標方程式、その後の係数漸化式を導ける
  - 正則特異点で非共鳴なFrobenius漸化式から得られる級数の収束をmajorant評価で証明できる
  - 指標根が非整数差・重根・正整数差を持つ場合を区別し、純Frobenius級数が二本得られる場合と対数項が必要になり得る場合を説明できる
  - Bessel方程式でJ_0型級数と整数差共鳴を計算し、Legendre方程式で係数漸化式と多項式解の打ち切りを導ける
definitions:
  - { id: ODE6-DEF-01, name: 収束冪級数表示 }
  - { id: ODE6-DEF-02, name: 常点・特異点・正則特異点 }
  - { id: ODE6-DEF-03, name: Frobenius級数 }
  - { id: ODE6-DEF-04, name: 指標方程式 }
theorems:
  - { id: ODE6-THM-01, name: 冪級数の項別微分の局所正当化 }
  - { id: ODE6-THM-02, name: 常点における冪級数解の存在・係数漸化式 }
  - { id: ODE6-THM-03, name: 正則特異点におけるFrobenius係数漸化式 }
  - { id: ODE6-THM-04, name: 非共鳴Frobenius級数の収束 }
  - { id: ODE6-THM-05, name: 指標根の差とFrobenius解の分岐 }
canonical_examples: [y''+xy'+y=0, 正則特異点と非正則特異点の判定, Bessel方程式J0級数, Bessel方程式の整数差共鳴, Legendre方程式とLegendre多項式]
