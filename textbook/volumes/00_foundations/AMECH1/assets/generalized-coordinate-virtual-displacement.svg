<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" data-layout-lint="strict" viewBox="0 0 920 560" role="img" aria-labelledby="title desc">
  <title id="title">円拘束上の一般化座標と仮想変位</title>
  <desc id="desc">支点 O を中心とする半径 l の円拘束上に質点 P があり、鉛直下向きからの角度 theta が一般化座標である。P では円の接線方向に仮想変位 delta r、半径方向に拘束面の法線方向を示す。</desc>
  <rect width="920" height="560" fill="white"/>
  <defs>
    <marker id="arrow-solid" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0072B2"/>
    </marker>
    <marker id="arrow-dashed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#D55E00"/>
    </marker>
  </defs>

  <line x1="460" y1="80" x2="460" y2="500" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="8 8"/>
  <path d="M140 110 A320 320 0 0 0 780 110" fill="none" stroke="#D1D5DB" stroke-width="3"/>
  <circle cx="460" cy="110" r="8" fill="#1F2937"/>
  <text x="482" y="105" font-family="Noto Sans CJK JP, sans-serif" font-size="22" fill="#1F2937">O</text>

  <line x1="460" y1="110" x2="610" y2="393" stroke="#374151" stroke-width="5"/>
  <circle cx="610" cy="393" r="13" fill="#374151"/>
  <text x="580" y="435" font-family="Noto Sans CJK JP, sans-serif" font-size="22" fill="#1F2937">P</text>
  <text x="495" y="260" font-family="Noto Sans CJK JP, sans-serif" font-size="22" fill="#1F2937">l</text>

  <path d="M460 185 A75 75 0 0 1 496 176" fill="none" stroke="#374151" stroke-width="3"/>
  <text x="530" y="176" font-family="Noto Sans CJK JP, sans-serif" font-size="22" fill="#1F2937">θ</text>

  <line data-series-group="allowed-directions" data-series-label="virtual-displacement"
        x1="610" y1="393" x2="700" y2="345"
        stroke="#0072B2" stroke-width="5" marker-end="url(#arrow-solid)"/>
  <text x="716" y="343" font-family="Noto Sans CJK JP, sans-serif" font-size="22" fill="#0072B2">δr</text>

  <line data-series-group="allowed-directions" data-series-label="constraint-normal"
        x1="610" y1="393" x2="655" y2="478"
        stroke="#D55E00" stroke-width="5" stroke-dasharray="10 7" marker-end="url(#arrow-dashed)"/>
  <text x="675" y="493" font-family="Noto Sans CJK JP, sans-serif" font-size="22" fill="#D55E00">∇f</text>

</svg>
