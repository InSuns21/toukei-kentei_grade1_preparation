id: "GAME-D2"
title: "マッチング市場の構造・提案側最適性・大学入試"
volume: "foundations"
status: supplementary
prerequisites:
  - GAME-D1
official_scope: []
learning_objectives:
  - 安定相手と提案側最適安定マッチングを定義し、小規模市場で複数の安定マッチングと端点を直接比較できる
  - 安定相手による最初の拒否を仮定すると別の安定マッチングにブロッキングペアが生じることを示し、提案側受入保留の提案側最適性を完全証明できる
  - 提案側最適安定マッチングが受け手側最悪でもあることをブロッキングペアによる背理法で証明できる
  - 提案処理順序が出力を変えないことと、提案側最適・受け手側最適が一致することによる安定マッチング一意性判定を説明できる
  - マッチング規則の提案側に対する耐戦略性を定義し、割当相手の最上位化不変性から提案側受入保留の耐戦略性を完全証明できる
  - 提案側受入保留が受け手側には一般に耐戦略的でないことを、3対3の虚偽申告例を逐次実行して確認できる
  - 定員付き多対一マッチングと、そのブロッキングペア・安定性を大学入試型市場の意味とともに定式化できる
  - 学生提案型受入保留アルゴリズムを定員付き市場で手計算し、拒否後の保留順位が悪化しないことから有限停止と安定性を完全証明できる
  - 大学側の応答的な優先順位と定員が一対一の受入保留を多対一へ拡張できる理由を説明できる
definitions:
  - { id: GAME-D2-DEF-01, name: 安定相手・提案側最適安定マッチング }
  - { id: GAME-D2-DEF-02, name: 提案側に対する耐戦略性 }
  - { id: GAME-D2-DEF-03, name: 定員付き多対一マッチング }
  - { id: GAME-D2-DEF-04, name: 定員付き市場のブロッキングペア・安定性 }
  - { id: GAME-D2-DEF-05, name: 学生提案型受入保留アルゴリズム }
theorems:
