  - { id: GAME-D2-COR-01, name: 提案側最適安定マッチングの受け手側最悪性 }
  - { id: GAME-D2-COR-02, name: 安定マッチング一意性の端点判定 }
  - { id: GAME-D2-LEM-01, name: 割当相手の最上位化に対する不変性 }
  - { id: GAME-D2-THM-02, name: 提案側受入保留の耐戦略性 }
  - { id: GAME-D2-THM-03, name: 学生提案型受入保留の安定性 }
canonical_examples:
  - "2対2市場で提案側最適と受け手側最適の二つの安定マッチングが存在し、提案する側を入れ替えると端点が入れ替わる例"
  - "3対3市場で受け手 y が順位を b>c>a から b>a>c と虚偽申告すると、相手が c から真により好む b へ変わる例"
  - "定員 (2,1,1) の3大学市場で、大学が上位 q_c 人を保留しながら拒否連鎖を起こし、最終的に安定な多対一マッチングへ到達する例"
