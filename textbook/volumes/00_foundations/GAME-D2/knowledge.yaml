      - game.many-to-one-matching
      - game.blocking-pair

  - id: game.many-to-one-stable-matching
    name: 定員付き市場の安定マッチング
    kind: definition
    aliases:
      - stable many-to-one matching
    introduction: formal
    introduction_aliases: ["定義（定員付き市場のブロッキングペア・安定性）"]
    requires:
