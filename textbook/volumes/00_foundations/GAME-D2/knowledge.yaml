  - id: game.student-proposing-deferred-acceptance
    name: 学生提案型受入保留アルゴリズム
    kind: definition
    aliases:
      - student-proposing deferred acceptance
    introduction: formal
    introduction_aliases: ["定義（学生提案型受入保留アルゴリズム）"]
    requires:
      - game.many-to-one-matching
      - game.deferred-acceptance-algorithm

  - id: game.many-to-one-da-stability
    name: 学生提案型受入保留の安定性
    kind: theorem
    aliases: []
    introduction: formal
    introduction_aliases: ["定理（学生提案型受入保留の安定性）"]
    requires:
      - game.student-proposing-deferred-acceptance
      - game.many-to-one-stable-matching
