chapter: SET2
scope: dream-theater
coverage: complete
prerequisites:
  - SET1
  - F0-00A1D

concepts:
  - id: set.transitive-set
    name: 推移的集合
    kind: definition
    aliases: [推移的集合, transitive set]
    requires: []

  - id: set.ordinal
    name: 順序数
    kind: definition
    aliases: [順序数, von Neumann 順序数, ordinal]
    requires:
      - set.transitive-set
      - order.well-order

  - id: set.successor-ordinal
    name: 後続順序数
    kind: definition
    aliases: [後続順序数, successor ordinal]
    requires:
      - set.ordinal

  - id: set.omega
    name: 最小の帰納的集合 omega
    kind: theorem
    aliases: [最小の帰納的集合, omega]
    requires:
      - set.ordinal
      - set.separation-schema

  - id: set.limit-ordinal
    name: 極限順序数
    kind: definition
    aliases: [極限順序数, limit ordinal]
    requires:
      - set.ordinal
      - set.successor-ordinal

  - id: set.ordinal-trichotomy
    name: 順序数の三分律
    kind: theorem
    aliases: [順序数の三分律, ordinal trichotomy]
    requires:
      - set.ordinal
