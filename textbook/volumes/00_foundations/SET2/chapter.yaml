id: "SET2"
title: "順序数：整列の位置を集合で表す"
volume: "foundations"
status: supplementary
prerequisites:
  - SET1
  - F0-00A1D
official_scope: []
learning_objectives:
  - 推移的集合を定義し、有限例で条件を検証できる
  - von Neumann 順序数を定義し、0,1,2,3を集合として書ける
  - 順序数の元が順序数であることを証明できる
  - 後続順序数と極限順序数を区別できる
  - 無限公理から最小帰納的集合 omega を構成する流れを追える
  - 順序数の三分律を推移的初期部分の補題から証明できる
