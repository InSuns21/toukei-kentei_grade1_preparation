id: "RA4"
title: "標準実解析 IV：Riemann/Darboux積分・FTC"
volume: "foundations"
status: supplementary
prerequisites:
  - RA2
  - RA3
official_scope: []
learning_objectives:
  - Darboux上和・下和からRiemann可積分性を定義できる
  - 連続関数がRiemann可積分であることを一様連続性から証明できる
  - Riemann積分の線形性・単調性・区間加法性をDarboux定義から証明できる
  - FTCがFundamental Theorem of Calculus（微積分学の基本定理）の略であることを説明し、I・IIの役割の違いを区別できる
  - 有限閉区間上のRiemann積分と、RA4Aで扱う広義積分の極限操作を区別できる
definitions:
  - { id: RA4-DEF-01, name: Darboux上和・下和 }
  - { id: RA4-DEF-02, name: Riemann可積分 }
theorems:
  - { id: RA4-THM-01, name: Darboux可積分性判定 }
  - { id: RA4-THM-02, name: 連続関数のRiemann可積分性 }
  - { id: RA4-THM-06, name: Riemann積分の基本性質（線形性・単調性・区間加法性） }
  - { id: RA4-THM-03, name: 微積分学の基本定理I }
  - { id: RA4-THM-04, name: 微積分学の基本定理II }
  - { id: RA4-THM-05, name: 置換積分定理 }
canonical_examples: [連続関数の積分, Dirichlet関数の非可積分性, FTCによる積分計算]
problem_patterns: [RA-RIEMANN-1, RA-FTC-1]
