official_scope: []
learning_objectives:
  - 押し出し測度の定義から積分公式を証明できる
  - 指示関数から単関数・非負可測関数・可積分関数へ拡張できる
  - Doob--Dynkin の補題を単関数近似からBorel可測な因子を構成して証明できる
  - E[X|Y]=m(Y) の版の自由度とP_Y-a.e.一意性の対応を説明できる
  - 離散型の比の公式と連続型一般の条件付き期待値を区別できる
  - 同時確率密度関数がある場合の条件付き密度表示を追加仮定から導ける
