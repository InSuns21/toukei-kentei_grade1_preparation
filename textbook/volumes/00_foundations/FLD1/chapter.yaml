id: "FLD1"
title: "抽象代数 XI：体拡大・代数的元・最小多項式"
volume: "foundations"
status: supplementary
prerequisites:
  - RNG4
  - LA1
official_scope: []
learning_objectives:
  - 体拡大 K/F を定義し、K を F-ベクトル空間として見た拡大次数 [K:F] を具体例で計算できる
  - 中間体 F⊂K⊂L に対する塔の公式 [L:F]=[L:K][K:F] を基底の積から証明できる
  - 有限拡大の任意の元が代数的であることを、1,α,...,α^n の線形従属から証明できる
  - 代数的元と超越的元を区別し、評価準同型の核から最小多項式を構成できる
  - 最小多項式が既約であり、α を零点にもつ任意の多項式を割ることを証明できる
  - 単純拡大 F(α) を定義し、α が代数的なら F[α]=F(α) となることを説明できる
  - 代数的元 α に対して F(α)≅F[x]/(m_α) を導き、[F(α):F]=deg m_α を計算できる
  - 既約多項式 p∈F[x] から F[x]/(p) を用いて p の根を含む有限拡大を構成できる
definitions:
  - { id: FLD1-DEF-01, name: 体拡大・中間体・拡大次数 }
  - { id: FLD1-DEF-02, name: 代数的元・超越的元 }
  - { id: FLD1-DEF-03, name: 代数的元の最小多項式 }
  - { id: FLD1-DEF-04, name: 単純拡大 }
theorems:
  - { id: FLD1-THM-01, name: 拡大次数の塔の公式 }
  - { id: FLD1-PROP-01, name: 有限拡大の元は代数的 }
  - { id: FLD1-THM-02, name: 代数的元の最小多項式の存在・一意性と既約性 }
  - { id: FLD1-THM-03, name: 単純代数拡大の商多項式環表示 }
  - { id: FLD1-COR-01, name: 単純代数拡大の次数公式 }
  - { id: FLD1-PROP-02, name: 既約多項式による単純拡大の構成 }
canonical_examples:
