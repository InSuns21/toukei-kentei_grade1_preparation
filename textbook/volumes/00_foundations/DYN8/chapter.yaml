id: "DYN8"
title: "正の極限集合・再帰・軌道閉包"
volume: "foundations"
status: supplementary
prerequisites:
  - DYN7
official_scope: []
learning_objectives:
  - 軌道閉包と正の極限集合を定義し収縮軌道で違いを計算できる
  - 正の極限集合の列による判定を証明できる
  - コンパクト性から正の極限集合の非空性を証明できる
  - 連続性とコンパクト性から正の極限集合の等号不変性を証明できる
  - 軌道閉包の前方不変性と真包含の反例を説明できる
  - 再帰性を定義し収束軌道・周期軌道・無理回転で判定できる
  - コンパクト性と連続性を落とした反例で証明の破綻箇所を指摘できる
  - 円周回転と収縮の積系の極限集合を求められる
