id: "PDE12"
title: "標準偏微分方程式 XII：一般一階 PDE・Hamilton--Jacobi 方程式"
volume: "foundations"
status: supplementary
prerequisites:
  - PDE1
  - ODE8
  - RA6A
official_scope: []
learning_objectives:
  - 一般一階非線形 PDE を F(x,u,grad u)=0 の形で定義し具体例を分類できる
  - Charpit の特性系を PDE の微分と連鎖律から導出できる
  - Hamilton--Jacobi 方程式から Hamilton の正準方程式を導ける
  - 特性写像の Jacobian が非零なら逆関数定理から局所古典解を再構成できる
  - 特性 caustic を Jacobian 消失として説明し古典解破綻と結び付けられる
  - Hamilton--Jacobi の勾配が Burgers 方程式を満たすことを証明できる
