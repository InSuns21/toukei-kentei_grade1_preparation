  - { id: PDE7-PROP-03, name: 有限モードGreen kernel }
  - { id: PDE7-PROP-04, name: Neumann零モードと可解条件 }
canonical_examples: [Dirichlet正弦モード, 熱モードの指数減衰, 波動モードの調和振動, Poissonモードの固有値除算, Neumann零モード, 有限モードGreen kernel]
