id: "PDE7"
title: "標準偏微分方程式 VII：固有関数展開・Green表現・三類型の統合"
volume: "foundations"
status: supplementary
prerequisites:
  - PDE6
official_scope: []
learning_objectives:
  - 空間作用素の固有関数展開がPDEをモードごとのODEへ変える機構を、有限モードで直接導ける
  - 熱方程式では各固有モードが指数減衰し、高固有値ほど速く減衰することを説明できる
  - 波動方程式では各固有モードが調和振動し、固有値が固有角振動数を決めることを説明できる
  - Poisson型の定常問題では固有値で割る操作が逆作用素となり、零固有値が可解条件を生むことを説明できる
  - 有界領域の離散固有モードと全空間Fourier変換の連続周波数を同じ対角化の二つの姿として比較できる
  - 有限モードGreen kernelを構成し、Green表現の係数1/lambda_nが固有モードごとの逆作用を表すことを検証できる
  - PDE3からPDE6の熱・波動・Laplace/Poisson・Green表現を、型・データ・一意性機構・モード応答の観点から統合できる
  - 弱解・Sobolev空間・一般スペクトル定理を使わずに古典解で閉じる範囲と、Encore IIIへ進む停止線を説明できる
definitions: []
theorems:
