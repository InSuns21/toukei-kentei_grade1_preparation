chapter: F0-00D2D
scope: dream-theater
coverage: complete
prerequisites:
  - F0-00D2A

forward_references:
  - functional.hilbert-space
  - functional.l2-inner-product
  - functional.l2-completeness

concepts:
  - id: measure.ae-equivalence
    name: a.e.同値関係
    kind: definition
    aliases: [a.e.同値関係, a.e.同値類]
    requires:
      - measure.almost-everywhere
      - measure.measurable-function

  - id: measure.lp-space
    name: L^p空間
    kind: definition
    # 「空間、」は旧reader-source監査がインライン数式を空白化した後にも残る安定部分。
    # raw formal監査では正本名 L^p空間 を使って実見出しを照合する。
    aliases: [L^p空間, "空間、"]
    requires:
      - measure.ae-equivalence
      - measure.measurable-function
      - measure.lebesgue-integral

  - id: measure.essential-supremum
    name: 本質的上限
    kind: definition
    aliases: [本質的上限, essential supremum]
    requires:
      - measure.ae-equivalence

  - id: measure.young-inequality
    name: Youngの不等式
    kind: lemma
    aliases: [Youngの不等式]
    requires: []

  - id: measure.holder-inequality
    name: Hölderの不等式
    kind: theorem
    aliases: [Hölderの不等式, Hölder]
    requires:
      - measure.young-inequality
      - measure.lebesgue-integral

  - id: measure.cauchy-schwarz-l2
    name: Cauchy--Schwarz
    kind: corollary
    aliases: [Cauchy--Schwarz, Cauchy-Schwarz]
    requires:
      - measure.holder-inequality

  - id: measure.minkowski-inequality
    name: Minkowskiの不等式
    kind: theorem
    aliases: [Minkowskiの不等式, Minkowski]
    requires:
      - measure.holder-inequality
      - measure.lebesgue-integral

  - id: measure.lp-norm
    name: L^pノルム
    kind: theorem
    # 「ノルム）」は旧reader-source監査で数式部分を空白化しても残る安定部分。
    aliases: [L^pノルム, "ノルム）"]
    requires:
      - measure.lp-space
      - measure.minkowski-inequality

  - id: measure.lp-finite-measure-inclusion
    name: 有限測度空間上の包含
    kind: proposition
    aliases: [有限測度空間上の包含]
    requires:
      - measure.lp-space
      - measure.holder-inequality
