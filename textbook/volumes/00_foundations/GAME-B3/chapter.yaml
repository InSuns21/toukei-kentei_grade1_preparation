canonical_examples:
  - 単独価値0・二人提携価値が2,1,1・大提携価値3の3人ゲームで Shapley 値 (7/6,7/6,2/3) を計算する例
  - 3人多数決型ゲームで対称性と効率性から Shapley 値が (1/3,1/3,1/3) となる一方、コアが空であることを比較する例
  - T={1,3} の全会一致ゲームでプレイヤー2が零プレイヤーとなり、Shapley 値が (1/2,0,1/2) になる例
  - コアが非空でも Shapley 値がコア外となる3人ゲーム v12=v13=v123=4, v23=0 の例
