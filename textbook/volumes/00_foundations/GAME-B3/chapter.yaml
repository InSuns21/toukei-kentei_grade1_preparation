id: "GAME-B3"
title: "Shapley 値・限界貢献・公理化"
volume: "foundations"
status: supplementary
prerequisites:
  - GAME-B1
official_scope: []
learning_objectives:
  - 有限 TU ゲームで、提携 S にプレイヤー i が加わる限界貢献 v(S∪{i})-v(S) を計算し、その意味を説明できる
  - Shapley 値の部分集合表示を使い、3人程度の有限ゲームで各プレイヤーの値を具体計算できる
  - Shapley 係数 |S|!(n-|S|-1)!/n! が、一様ランダムな到着順で i より前にいるプレイヤー集合が S となる確率であることを数え上げから導ける
  - Shapley 値を、ランダムな到着順における限界貢献の期待値として表し、部分集合表示との同値を証明できる
  - 配分規則に対する効率性・対称性・零プレイヤー性・加法性の四公理を定式化し、それぞれが何を要求するか説明できる
  - Shapley 値が四公理を満たすことを、到着順表示と限界貢献の性質から証明できる
  - 全会一致ゲームを定義し、任意の有限 TU ゲームを全会一致ゲームの有限和として表せることを再帰構成で証明できる
  - 四公理を満たす配分規則が Shapley 値に一意に定まることを、全会一致ゲーム分解から核心まで証明できる
  - Shapley 値が公平性・平均限界貢献を表す単一配分であり、一般にはコア所属を保証しないことを具体例で区別できる
