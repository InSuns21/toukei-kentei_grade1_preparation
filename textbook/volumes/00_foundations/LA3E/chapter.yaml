id: "LA3E"
title: "標準線形代数 III-E：テンソル積・外積代数"
volume: "foundations"
status: supplementary
prerequisites:
  - LA3A
  - LA3D
official_scope: []
learning_objectives:
  - テンソル積を二重線形写像の普遍性として定義し、有限次元で基底を構成できる
  - 共変・反変テンソルと評価写像による因子消去を有限次元線形代数として計算できる
  - 交代化と外冪を定義し、外冪の基底と次元公式を証明できる
  - 外積の結合性と次数付き交換則を証明し、具体計算できる
  - 最高次外積の基底変換が行列式で記述されることを説明できる
  - 内部積を定義し、外積に対する符号付き積の法則を証明できる
