id: "F0-00D0C"
title: "Cauchy構成とDedekind構成の同値"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00D0
  - F0-00D0B
official_scope: []
learning_objectives:
  - Cauchy実数からDedekind切断への自然な写像を定義できる
  - その写像がwell-definedで順序を保つことを説明できる
  - 任意のDedekind切断を有理Cauchy列で近似できることを示せる
  - 二つの実数構成が有理数を固定する順序体同型で結ばれることを説明できる
  - 構成が異なっても数学的対象が同じという意味を同型の言葉で説明できる
definitions:
  - { id: F000D0C-DEF-01, name: Cauchy実数から切断への対応 }
theorems:
  - { id: F000D0C-THM-01, name: 対応する集合がDedekind切断になること }
  - { id: F000D0C-THM-02, name: 順序保存性と単射性 }
  - { id: F000D0C-THM-03, name: Dedekind切断のCauchy近似 }
  - { id: F000D0C-THM-04, name: Cauchy実数とDedekind実数の順序体同型 }
canonical_examples: [有理数の像, sqrt2の二つの表現]
