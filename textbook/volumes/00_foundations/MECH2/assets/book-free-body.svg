<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">机上の本に働く重力と垂直抗力</title>
  <desc id="desc">左図は実際の作用位置を示し、重力 mg は本の重心 G から下向き、机からの接触力は本の下面に分布して上向きに働く。その分布の合力を N とする。右図は合力だけを示す自由物体図で、N は上向き、mg は下向きである。</desc>
  <rect width="980" height="520" fill="white"/>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0072B2"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#D55E00"/></marker>
  </defs>

  <g font-family="Noto Sans CJK JP, sans-serif" fill="#1F2937">
    <text x="175" y="42" font-size="22" font-weight="700">実際の作用位置</text>
    <text x="650" y="42" font-size="22" font-weight="700">合力だけを示す自由物体図</text>
  </g>

  <line x1="80" y1="340" x2="500" y2="340" stroke="#374151" stroke-width="5"/>
  <rect x="170" y="220" width="240" height="120" rx="4" fill="#F3F4F6" stroke="#374151" stroke-width="3"/>
  <text x="195" y="252" font-family="Noto Sans CJK JP, sans-serif" font-size="22" fill="#1F2937">本</text>

  <circle cx="290" cy="280" r="6" fill="#D55E00"/>
  <text x="318" y="266" font-family="Noto Sans CJK JP, sans-serif" font-size="20" fill="#D55E00" font-weight="700">G（重心）</text>
  <line x1="290" y1="280" x2="290" y2="325" stroke="#D55E00" stroke-width="5" marker-end="url(#arrow-orange)"/>
  <text x="340" y="315" font-family="Noto Sans CJK JP, sans-serif" font-size="22" fill="#D55E00" font-weight="700">mg</text>

  <g stroke="#0072B2" stroke-width="3" marker-end="url(#arrow-blue)">
    <line x1="210" y1="338" x2="210" y2="305"/>
    <line x1="255" y1="338" x2="255" y2="295"/>
    <line x1="325" y1="338" x2="325" y2="295"/>
    <line x1="370" y1="338" x2="370" y2="305"/>
  </g>
  <text x="112" y="382" font-family="Noto Sans CJK JP, sans-serif" font-size="19" fill="#0072B2">机からの接触力は下面に分布</text>
  <circle cx="290" cy="340" r="5" fill="#0072B2"/>
  <text x="88" y="410" font-family="Noto Sans CJK JP, sans-serif" font-size="18" fill="#0072B2">青点：接触力の合力 N の作用点（対称時）</text>

  <line x1="710" y1="280" x2="710" y2="115" stroke="#0072B2" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <line x1="710" y1="280" x2="710" y2="455" stroke="#D55E00" stroke-width="5" marker-end="url(#arrow-orange)"/>
  <circle cx="710" cy="280" r="8" fill="#1F2937"/>
  <text x="735" y="145" font-family="Noto Sans CJK JP, sans-serif" font-size="23" fill="#0072B2" font-weight="700">N（机 → 本）</text>
  <text x="735" y="430" font-family="Noto Sans CJK JP, sans-serif" font-size="23" fill="#D55E00" font-weight="700">mg（地球 → 本）</text>
  <text x="640" y="492" font-family="Noto Sans CJK JP, sans-serif" font-size="18" fill="#1F2937">N と mg は作用反作用ではない</text>
</svg>
