<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" data-layout-lint="strict" viewBox="0 0 980 460" role="img" aria-labelledby="title desc">
  <title id="title">机上の本に働く重力と垂直抗力</title>
  <desc id="desc">左では重力 mg が本の重心 G から下向き、机からの接触力が本の下面に分布して上向きに働く。右の自由物体図ではその接触力の合力 N と重力 mg を一点から示す。</desc>
  <rect width="980" height="460" fill="white"/>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0072B2"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#D55E00"/></marker>
  </defs>

  <line x1="80" y1="320" x2="500" y2="320" stroke="#374151" stroke-width="5"/>
  <rect x="170" y="200" width="240" height="120" rx="4" fill="#F3F4F6" stroke="#374151" stroke-width="3"/>
  <circle cx="290" cy="260" r="6" fill="#D55E00"/>
  <text x="255" y="175" font-family="Noto Sans CJK JP, sans-serif" font-size="21" fill="#1F2937" font-weight="700">G</text>
  <line data-series-group="left-forces" data-series-label="mg" x1="290" y1="260" x2="290" y2="305" stroke="#D55E00" stroke-width="5" stroke-dasharray="10 6" marker-end="url(#arrow-orange)"/>
  <text x="420" y="282" font-family="Noto Sans CJK JP, sans-serif" font-size="22" fill="#D55E00" font-weight="700">mg</text>

  <g data-series-group="left-forces" data-series-label="contact-distribution" stroke="#0072B2" stroke-width="3" marker-end="url(#arrow-blue)">
    <line x1="210" y1="318" x2="210" y2="285"/>
    <line x1="255" y1="318" x2="255" y2="275"/>
    <line x1="325" y1="318" x2="325" y2="275"/>
    <line x1="370" y1="318" x2="370" y2="285"/>
  </g>

  <line data-series-group="right-forces" data-series-label="N" x1="710" y1="250" x2="710" y2="95" stroke="#0072B2" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <line data-series-group="right-forces" data-series-label="mg" x1="710" y1="250" x2="710" y2="410" stroke="#D55E00" stroke-width="5" stroke-dasharray="10 6" marker-end="url(#arrow-orange)"/>
  <circle cx="710" cy="250" r="8" fill="#1F2937"/>
  <text x="742" y="125" font-family="Noto Sans CJK JP, sans-serif" font-size="23" fill="#0072B2" font-weight="700">N</text>
  <text x="742" y="390" font-family="Noto Sans CJK JP, sans-serif" font-size="23" fill="#D55E00" font-weight="700">mg</text>
</svg>
