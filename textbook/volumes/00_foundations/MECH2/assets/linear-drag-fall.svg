<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" role="img" aria-labelledby="title desc">
  <title id="title">線形抵抗を受ける落下</title>
  <desc id="desc">下向きを正に取った落下運動で、速度 v と重力 mg は下向き、線形抵抗力 cv は上向き。速度が増えると抵抗力が増え、終端速度でつり合う。</desc>
  <rect width="780" height="470" fill="white"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker></defs>
  <circle cx="315" cy="220" r="42" fill="none" stroke="#111" stroke-width="3"/>
  <g stroke="#111" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <line x1="315" y1="265" x2="315" y2="405"/>
    <line x1="290" y1="220" x2="290" y2="355"/>
    <line x1="340" y1="217" x2="340" y2="95"/>
  </g>
  <g font-family="sans-serif" font-size="25" fill="#111">
    <text x="335" y="390">v（下向きを正）</text>
    <text x="165" y="340">mg</text>
    <text x="360" y="120">cv</text>
    <text x="120" y="448">終端速度では mg = cv となり、加速度が 0 に近づく。</text>
  </g>
</svg>