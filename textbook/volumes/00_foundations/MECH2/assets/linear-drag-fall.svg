<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" data-layout-lint="strict" viewBox="0 0 820 500" role="img" aria-labelledby="title desc">
  <title id="title">線形抵抗を受ける落下</title>
  <desc id="desc">下向きを正に取る。質点の重心から重力 mg は下向き、線形抵抗力 cv は上向きに作用する。速度の向きは力の矢印と重ならないよう右側の補助矢印で下向きと示す。終端速度では mg と cv の大きさが等しくなる。</desc>
  <rect width="820" height="500" fill="white"/>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0072B2"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#D55E00"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#009E73"/></marker>
  </defs>

  <circle cx="340" cy="235" r="48" fill="#F3F4F6" stroke="#374151" stroke-width="3"/>
  <text x="135" y="238" font-family="Noto Sans CJK JP, sans-serif" font-size="18" fill="#1F2937">G（重心）</text>

  <line x1="340" y1="235" x2="340" y2="82" stroke="#009E73" stroke-width="5" marker-end="url(#arrow-green)"/>
  <line x1="340" y1="235" x2="340" y2="405" stroke="#D55E00" stroke-width="5" marker-end="url(#arrow-orange)"/>
  <circle cx="340" cy="235" r="6" fill="#1F2937"/>
  <text x="365" y="112" font-family="Noto Sans CJK JP, sans-serif" font-size="24" fill="#009E73" font-weight="700">cv（抵抗力）</text>
  <text x="365" y="382" font-family="Noto Sans CJK JP, sans-serif" font-size="24" fill="#D55E00" font-weight="700">mg（重力）</text>

  <line x1="570" y1="165" x2="570" y2="315" stroke="#0072B2" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="595" y="210" font-family="Noto Sans CJK JP, sans-serif" font-size="22" fill="#0072B2" font-weight="700">運動方向</text>
  <text x="595" y="242" font-family="Noto Sans CJK JP, sans-serif" font-size="22" fill="#0072B2">v &gt; 0</text>
  <text x="595" y="274" font-family="Noto Sans CJK JP, sans-serif" font-size="20" fill="#1F2937">（下向きを正）</text>

  <text x="120" y="465" font-family="Noto Sans CJK JP, sans-serif" font-size="22" fill="#1F2937">終端速度では mg = cv となり、加速度が 0 に近づく</text>
</svg>
