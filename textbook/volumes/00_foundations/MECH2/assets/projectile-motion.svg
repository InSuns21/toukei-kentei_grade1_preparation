<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" data-layout-lint="strict" viewBox="0 0 940 500" role="img" aria-labelledby="title desc">
  <title id="title">斜方投射の初期速度と重力加速度</title>
  <desc id="desc">左図は原点 O から角度 theta で与える初速度 v0 を示す。右図は同じ斜方投射の放物線軌道と、軌道上の点 P において鉛直下向きに向く重力加速度 g を示す。初速度の矢印と軌道を重ねず、役割を分けて表示する。</desc>
  <rect width="940" height="500" fill="white"/>
  <defs>
    <marker id="arrow-neutral" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0072B2"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#D55E00"/></marker>
  </defs>

  <g font-family="Noto Sans CJK JP, sans-serif" fill="#1F2937">
    <text x="175" y="40" font-size="22" font-weight="700">初期条件</text>
    <text x="640" y="40" font-size="22" font-weight="700">軌道と加速度</text>
    <text x="665" y="70" font-size="17" fill="#4B5563">（空気抵抗なし）</text>
  </g>

  <line x1="95" y1="405" x2="405" y2="405" stroke="#374151" stroke-width="3" marker-end="url(#arrow-neutral)"/>
  <line x1="95" y1="405" x2="95" y2="115" stroke="#374151" stroke-width="3" marker-end="url(#arrow-neutral)"/>
  <line data-series-group="initial-vector" data-series-label="v0" x1="95" y1="405" x2="270" y2="235" stroke="#0072B2" stroke-width="5" stroke-dasharray="12 7" marker-end="url(#arrow-blue)"/>
  <path d="M155 403 Q151 380 137 363" fill="none" stroke="#8E5FB2" stroke-width="3"/>
  <g font-family="Noto Sans CJK JP, sans-serif" font-size="22" fill="#1F2937">
    <text x="415" y="420">x</text>
    <text x="55" y="90">y</text>
    <text x="72" y="438">O</text>
    <text x="185" y="390" fill="#8E5FB2" font-weight="700">θ</text>
  </g>

  <line x1="515" y1="405" x2="865" y2="405" stroke="#374151" stroke-width="3" marker-end="url(#arrow-neutral)"/>
  <line x1="515" y1="405" x2="515" y2="115" stroke="#374151" stroke-width="3" marker-end="url(#arrow-neutral)"/>
  <path data-series-group="trajectory-panel" data-series-label="trajectory" d="M520 400 Q675 135 845 400" fill="none" stroke="#009E73" stroke-width="4" stroke-dasharray="11 8"/>
  <line data-series-group="trajectory-panel" data-series-label="g" x1="715" y1="190" x2="715" y2="320" stroke="#D55E00" stroke-width="5" marker-end="url(#arrow-orange)"/>
  <circle cx="715" cy="190" r="8" fill="#1F2937"/>
  <g font-family="Noto Sans CJK JP, sans-serif" font-size="22" fill="#1F2937">
    <text x="875" y="420">x</text>
    <text x="492" y="105">y</text>
    <text x="492" y="438">O</text>
    <text x="730" y="184">P</text>
  </g>
  <text x="110" y="468" font-family="Noto Sans CJK JP, sans-serif" font-size="20" fill="#0072B2" font-weight="700">v₀：初速度（破線）</text>
  <text x="650" y="468" font-family="Noto Sans CJK JP, sans-serif" font-size="20" fill="#D55E00" font-weight="700">g：常に鉛直下向き</text>
</svg>
