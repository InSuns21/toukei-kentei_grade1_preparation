<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" data-layout-lint="strict" viewBox="0 0 920 440" role="img" aria-labelledby="title desc">
  <title id="title">斜方投射の初速度・投射角・重力加速度</title>
  <desc id="desc">一つの座標系に斜方投射を示す。原点 O から初速度 v0 が軌道の接線方向へ出て、x 軸との間の投射角 theta を角度弧と引出し線で示す。軌道上の点 P では重力加速度 g が鉛直下向きに向く。</desc>
  <rect width="920" height="440" fill="white"/>
  <defs>
    <marker id="arrow-neutral" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0072B2"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#D55E00"/></marker>
  </defs>

  <line x1="105" y1="365" x2="845" y2="365" stroke="#374151" stroke-width="3" marker-end="url(#arrow-neutral)"/>
  <line x1="105" y1="365" x2="105" y2="60" stroke="#374151" stroke-width="3" marker-end="url(#arrow-neutral)"/>

  <path data-series-group="motion" data-series-label="trajectory"
        d="M105 360 Q370 35 810 360"
        fill="none" stroke="#009E73" stroke-width="4" stroke-dasharray="12 8"/>
  <line data-series-group="motion" data-series-label="v0"
        x1="105" y1="360" x2="237" y2="196"
        stroke="#0072B2" stroke-width="5" marker-end="url(#arrow-blue)"/>

  <path d="M170 365 Q167 337 146 315" fill="none" stroke="#6B7280" stroke-width="3"/>
  <line x1="205" y1="325" x2="161" y2="340" stroke="#6B7280" stroke-width="2"/>

  <circle cx="523" cy="215" r="8" fill="#1F2937"/>
  <line data-series-group="motion" data-series-label="g"
        x1="523" y1="215" x2="523" y2="320"
        stroke="#D55E00" stroke-width="5" stroke-dasharray="12 5 3 5"
        marker-end="url(#arrow-orange)"/>

  <g font-family="Noto Sans CJK JP, sans-serif" font-size="22" fill="#1F2937">
    <text x="855" y="381">x</text>
    <text x="80" y="50">y</text>
    <text x="78" y="397">O</text>
    <text x="580" y="180">P</text>
    <text x="215" y="339" font-weight="700">θ</text>
    <text x="190" y="230" fill="#0072B2" font-weight="700">v₀</text>
    <text x="555" y="300" fill="#D55E00" font-weight="700">g</text>
  </g>
</svg>
