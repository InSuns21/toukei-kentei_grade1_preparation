<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" data-layout-lint="strict" viewBox="0 0 940 500" role="img" aria-labelledby="title desc">
  <title id="title">斜方投射の初速度・投射角・重力加速度</title>
  <desc id="desc">一つの座標系で斜方投射を示す。原点 O から初速度 v0 が右上へ向き、x 軸との間の角度弧が投射角 theta を示す。破線の放物線が軌道で、軌道上の点 P から重力加速度 g が鉛直下向きに働く。</desc>
  <rect width="940" height="500" fill="white"/>
  <defs>
    <marker id="arrow-neutral" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0072B2"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#D55E00"/></marker>
  </defs>

  <text x="650" y="50" font-family="Noto Sans CJK JP, sans-serif" font-size="18" fill="#4B5563">空気抵抗なし</text>

  <line x1="110" y1="410" x2="860" y2="410" stroke="#374151" stroke-width="3" marker-end="url(#arrow-neutral)"/>
  <line x1="110" y1="410" x2="110" y2="85" stroke="#374151" stroke-width="3" marker-end="url(#arrow-neutral)"/>

  <path data-series-group="motion-elements" data-series-label="trajectory"
        d="M110 410 Q465 0 820 410"
        fill="none" stroke="#009E73" stroke-width="4" stroke-dasharray="11 8"/>

  <line data-series-group="motion-elements" data-series-label="v0"
        x1="110" y1="410" x2="230" y2="272"
        stroke="#0072B2" stroke-width="5" marker-end="url(#arrow-blue)"/>

  <path d="M178 410 Q174 379 151 363"
        fill="none" stroke="#8E5FB2" stroke-width="3"/>
  <line x1="151" y1="363" x2="158" y2="357"
        stroke="#8E5FB2" stroke-width="2" stroke-dasharray="5 4"/>

  <circle cx="572" cy="223" r="8" fill="#1F2937"/>
  <line data-series-group="motion-elements" data-series-label="g"
        x1="572" y1="223" x2="572" y2="350"
        stroke="#D55E00" stroke-width="5" stroke-dasharray="12 5 3 5"
        marker-end="url(#arrow-orange)"/>

  <g font-family="Noto Sans CJK JP, sans-serif" fill="#1F2937">
    <text x="875" y="430" font-size="22">x</text>
    <text x="82" y="75" font-size="22">y</text>
    <text x="82" y="445" font-size="22">O</text>
    <text x="190" y="398" font-size="23" fill="#8E5FB2" font-weight="700">θ</text>
    <text x="605" y="205" font-size="22">P</text>
  </g>

  <g font-family="Noto Sans CJK JP, sans-serif" font-size="20" font-weight="700">
    <text x="285" y="95" fill="#0072B2">v₀：原点 O からの初速度（実線）</text>
    <text x="285" y="125" fill="#009E73">軌道：放物線（破線）</text>
    <text x="620" y="360" fill="#D55E00">g：P から鉛直下向き（一点鎖線）</text>
  </g>
</svg>
