<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" data-layout-lint="strict" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">斜方投射の初速度・投射角・重力加速度</title>
  <desc id="desc">一つの座標系に斜方投射を示す。原点 O から初速度 v0 が軌道の接線方向へ出て、x 軸との間の投射角 theta を角度弧と引出し線で示す。軌道上の点 P では重力加速度 g が鉛直下向きに向く。</desc>
  <rect width="920" height="500" fill="white"/>
  <defs>
    <marker id="arrow-neutral" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0072B2"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#D55E00"/></marker>
  </defs>

  <g font-family="Noto Sans CJK JP, sans-serif" fill="#1F2937">
    <text x="330" y="42" font-size="24" font-weight="700">斜方投射：初期条件と運動を同じ図で読む</text>
    <text x="365" y="72" font-size="17" fill="#4B5563">空気抵抗を無視し、y 軸正方向を上向きとする</text>
  </g>

  <line x1="105" y1="410" x2="845" y2="410" stroke="#374151" stroke-width="3" marker-end="url(#arrow-neutral)"/>
  <line x1="105" y1="410" x2="105" y2="105" stroke="#374151" stroke-width="3" marker-end="url(#arrow-neutral)"/>

  <path data-series-group="motion" data-series-label="trajectory"
        d="M105 405 Q370 80 810 405"
        fill="none" stroke="#009E73" stroke-width="4" stroke-dasharray="12 8"/>
  <line data-series-group="motion" data-series-label="v0"
        x1="105" y1="405" x2="245" y2="235"
        stroke="#0072B2" stroke-width="5" marker-end="url(#arrow-blue)"/>

  <path d="M170 405 Q165 382 147 365" fill="none" stroke="#6B7280" stroke-width="3"/>
  <line x1="184" y1="356" x2="157" y2="378" stroke="#6B7280" stroke-width="2"/>
  <text x="190" y="352" font-family="Noto Sans CJK JP, sans-serif" font-size="21" fill="#1F2937" font-weight="700">θ（投射角）</text>

  <circle cx="523" cy="257" r="8" fill="#1F2937"/>
  <line data-series-group="motion" data-series-label="g"
        x1="523" y1="257" x2="523" y2="365"
        stroke="#D55E00" stroke-width="5" stroke-dasharray="12 5 3 5"
        marker-end="url(#arrow-orange)"/>

  <g font-family="Noto Sans CJK JP, sans-serif" font-size="22" fill="#1F2937">
    <text x="855" y="426">x</text>
    <text x="80" y="95">y</text>
    <text x="78" y="442">O</text>
    <text x="548" y="252">P</text>
    <text x="275" y="230" fill="#0072B2" font-weight="700">v₀（実線）</text>
    <text x="548" y="330" fill="#D55E00" font-weight="700">g（鎖線）</text>
  </g>

  <text x="255" y="470" font-family="Noto Sans CJK JP, sans-serif" font-size="20" fill="#1F2937">軌道は破線。v₀ は O で軌道に接し、g はどの時刻でも鉛直下向き。</text>
</svg>
