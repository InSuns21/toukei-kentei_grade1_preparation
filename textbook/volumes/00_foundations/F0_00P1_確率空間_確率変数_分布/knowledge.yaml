chapter: F0-00P1
scope: dream-theater
coverage: complete
prerequisites:
  - F0-00A
  - F0-00A1C
  - F0-00D2
  - F0-00D2A

# P1では密度・絶対連続性・Radon--Nikodymは次章への予告としてのみ言及する。
forward_references:
  - measure.absolute-continuity
  - measure.radon-nikodym-derivative
  - measure.radon-nikodym-theorem

concepts:
  - id: prob.probability-space
    name: 確率空間
    kind: definition
    aliases: [確率空間]
    requires:
      - measure.measure-space

  - id: prob.random-variable
    name: 実数値確率変数
    kind: definition
    aliases: [実数値確率変数, 確率変数]
    requires:
      - prob.probability-space
      - measure.measurable-function

  - id: measure.pushforward-measure
    name: 押し出し測度
    kind: definition
    aliases: [押し出し測度]
    requires:
      - measure.measure-space
      - measure.measurable-function

  - id: prob.pushforward-probability-measure
    name: 押し出しによる確率測度の構成
    kind: theorem
    aliases: [押し出しによる確率測度の構成]
    requires:
      - prob.probability-space
      - measure.pushforward-measure

  - id: prob.distribution-law
    name: 確率変数の分布
    kind: definition
    aliases: [確率変数の分布, 分布またはlaw]
    requires:
      - prob.random-variable
      - prob.pushforward-probability-measure

  - id: prob.cdf
    name: 累積分布関数
    kind: definition
    aliases: [累積分布関数]
    requires:
      - prob.distribution-law

  - id: prob.cdf-basic-properties
    name: 累積分布関数の基本性質
    kind: theorem
    aliases: [累積分布関数の基本性質]
    requires:
      - prob.cdf
      - measure.measure-monotonicity
      - measure.continuity-from-below

  - id: prob.joint-distribution
    name: 同時分布
    kind: term
    aliases: [同時分布]
    requires:
      - prob.random-variable
      - prob.distribution-law

  - id: prob.marginal-distribution
    name: 周辺分布
    kind: term
    aliases: [周辺分布]
    requires:
      - prob.joint-distribution
