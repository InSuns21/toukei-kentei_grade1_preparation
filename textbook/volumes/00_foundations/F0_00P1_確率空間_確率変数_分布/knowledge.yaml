chapter: F0-00P1
scope: dream-theater
coverage: complete
prerequisites:
  - F0-00D2

# P1では密度・絶対連続性・Radon--Nikodymは次章への予告としてのみ言及する。
forward_references:
  - measure.absolute-continuity
  - measure.radon-nikodym-derivative
  - measure.radon-nikodym-theorem

concepts:
  - id: prob.probability-space
    name: 確率空間
    kind: term
    aliases: [確率空間]
    requires:
      - measure.measure-space

  - id: prob.random-variable
    name: 確率変数
    kind: term
    aliases: [確率変数]
    requires:
      - prob.probability-space
      - measure.measurable-function

  - id: measure.pushforward-measure
    name: 押し出し測度
    kind: term
    aliases: [押し出し測度]
    requires:
      - measure.measure-space
      - measure.measurable-function

  # 本文では「Xの**分布**または law」と強調記法を挟むため、旧reader-source監査でも安定する末尾句を使う。
  - id: prob.distribution-law
    name: 確率変数の分布
    kind: term
    aliases: ["law といいます"]
    requires:
      - prob.random-variable
      - measure.pushforward-measure

  # 冒頭ロードマップにも名称が出るため、実際の説明節見出しを導入位置として固定する。
  - id: prob.cdf
    name: 累積分布関数
    kind: term
    aliases: [累積分布関数]
    introduction_aliases: ["累積分布関数は分布を半直線で読む"]
    requires:
      - prob.distribution-law

  - id: prob.joint-distribution
    name: 同時分布
    kind: term
    aliases: [同時分布]
    requires:
      - prob.random-variable
      - prob.distribution-law

  - id: prob.marginal-distribution
    name: 周辺分布
    kind: term
    aliases: [周辺分布]
    requires:
      - prob.joint-distribution
