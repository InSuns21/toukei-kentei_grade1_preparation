id: "F0-00P1"
title: "確率空間・確率変数・分布"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00A
  - F0-00D2
official_scope: []
learning_objectives:
  - 確率空間を三つ組として定義し具体例で公理を確認できる
  - 実数値確率変数を可測写像として説明し具体例で可測性を確認できる
  - 押し出し測度を定義し確率測度になることを証明できる
  - 確率変数の分布を押し出し測度として構成できる
  - 累積分布関数の基本性質を測度の下からの連続性から証明できる
  - 離散分布・連続分布・混合分布を測度として区別できる
