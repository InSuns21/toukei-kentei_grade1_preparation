chapter: STO2
scope: dream-theater
coverage: complete
prerequisites:
  - STO1
  - F0-00P3C
  - F0-00P4A

forward_references:
  - stochastic.finite-dimensional-distribution-consistency

concepts:
  - id: stochastic.discrete-martingale
    name: 離散時間martingale・submartingale・supermartingale
    kind: definition
    aliases: ["martingale", "submartingale", "supermartingale"]
    introduction: formal
    introduction_aliases: ["定義（マルチンゲール・劣マルチンゲール・優マルチンゲール）"]
    requires:
      - stochastic.filtration
      - stochastic.adapted-process

  - id: stochastic.predictable-transform
    name: 離散時間predictable processとpredictable transform
    kind: definition
    aliases: ["predictable transform", "martingale transform", "離散時間predictable process"]
    introduction: formal
    introduction_aliases: ["定義（離散時間予測可能過程と予測可能変換）"]
    requires:
      - stochastic.predictable-process
      - stochastic.discrete-martingale

  - id: stochastic.predictable-transform-theorem
    name: predictable transform theorem
    kind: proposition
    aliases: ["predictable transform of a martingale", "predictable transform of a submartingale", "predictable transform の命題"]
    introduction: formal
    introduction_aliases: ["命題（予測可能変換）"]
    requires:
      - stochastic.predictable-transform

  - id: stochastic.stopped-martingale
    name: stopped martingale theorem
    kind: theorem
    aliases: ["stopped martingale", "stopped submartingale"]
    introduction: formal
    introduction_aliases: ["定理（停止マルチンゲール / 劣マルチンゲール）"]
    requires:
      - stochastic.discrete-martingale
      - stochastic.stopping-time
      - stochastic.stopped-process

  - id: stochastic.bounded-optional-sampling
    name: bounded optional sampling theorem
    kind: theorem
    aliases: ["bounded optional sampling", "optional sampling theorem"]
    introduction: formal
    introduction_aliases: ["定理（有界任意抽出）"]
    requires:
      - stochastic.stopped-martingale
      - stochastic.stopping-sigma-field

  - id: stochastic.doob-decomposition
    name: 離散時間Doob decomposition
    kind: theorem
    aliases: ["Doob decomposition", "predictable compensator"]
    introduction: formal
    introduction_aliases: ["定理（離散時間 Doob 分解）"]
    requires:
      - stochastic.discrete-martingale
      - stochastic.predictable-transform

  - id: stochastic.doob-maximal-inequality
    name: Doob maximal inequality
    kind: theorem
    aliases: ["Doob maximal inequality", "Doobの最大不等式"]
    introduction: formal
    introduction_aliases: ["定理（Doob 最大不等式）"]
    requires:
      - stochastic.bounded-optional-sampling

  - id: stochastic.upcrossing-number
    name: upcrossing number
    kind: definition
    aliases: ["upcrossing", "upcrossing number"]
    introduction: formal
    introduction_aliases: ["定義（上向き横断回数）"]
    requires:
      - stochastic.discrete-martingale

  - id: stochastic.doob-upcrossing-inequality
    name: Doob upcrossing inequality
    kind: theorem
    aliases: ["Doob upcrossing inequality", "upcrossing inequality"]
    introduction: formal
    introduction_aliases: ["定理（Doob 上向き横断不等式）"]
    requires:
      - stochastic.upcrossing-number
      - stochastic.predictable-transform-theorem

  - id: stochastic.submartingale-as-convergence
    name: submartingale almost-sure convergence theorem
    kind: theorem
    aliases: ["submartingale convergence theorem", "martingale a.s. convergence"]
    introduction: formal
    introduction_aliases: ["定理（劣マルチンゲールの概収束）"]
    requires:
      - stochastic.doob-upcrossing-inequality

  - id: stochastic.ui-martingale-convergence
    name: uniformly integrable martingale convergence theorem
    kind: theorem
    aliases: ["UI martingale convergence", "uniformly integrable martingale convergence theorem"]
    introduction: formal
    introduction_aliases: ["定理（UI マルチンゲール convergence）"]
    requires:
      - stochastic.submartingale-as-convergence

  - id: stochastic.ui-optional-stopping
    name: UIを仮定したoptional stopping
    kind: corollary
    aliases: ["UI optional stopping", "uniformly integrable optional stopping"]
    introduction: formal
    introduction_aliases: ["系（UI を仮定した任意停止）"]
    requires:
      - stochastic.bounded-optional-sampling
      - stochastic.ui-martingale-convergence
