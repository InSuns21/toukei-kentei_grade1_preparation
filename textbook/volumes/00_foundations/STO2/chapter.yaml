id: "STO2"
title: "Encore IV Stochastic Analysis II：離散時間 martingale・不等式・収束"
volume: "foundations"
status: supplementary
prerequisites:
  - STO1
  - F0-00P3C
  - F0-00P4A
official_scope: []
learning_objectives:
  - martingale・submartingale・supermartingaleを条件付き期待値で定義し、有限状態例で三条件を直接検証できる
  - 離散時間predictable processとpredictable transformを定義し、martingale差分へ掛ける係数が一時刻前の情報で決まる意味を説明できる
  - stopped martingale/submartingale theoremを差分表示から証明できる
  - bounded optional sampling theoremを停止時刻sigma-fieldに関する条件付き不等式・等式まで証明できる
  - 離散時間Doob decompositionを構成し、predictable compensatorの非減少性と分解の一意性を証明できる
  - Doob maximal inequalityを初到達時刻とoptional samplingから導き、最大偏差確率を評価できる
  - upcrossing numberを定義し、Doob upcrossing inequalityをpredictable trading strategyから証明できる
  - upcrossing inequalityからsubmartingaleのa.s. convergence theoremを導き、極限が有限かつ可積分になる理由を追える
  - UI martingale convergence theoremをVitaliとLévy上昇定理へ接続し、a.s.収束・L1収束・terminal representationを区別できる
  - optional stoppingの条件を外すと結論が壊れることを倍賭け反例でUIの失敗まで計算できる
