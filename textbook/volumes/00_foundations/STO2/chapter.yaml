id: "STO2"
title: "Encore IV 確率解析 II：離散時間マルチンゲール・不等式・収束"
volume: "foundations"
status: supplementary
prerequisites:
  - STO1
  - F0-00P3C
  - F0-00P4A
official_scope: []
learning_objectives:
  - マルチンゲール・劣マルチンゲール・優マルチンゲールを条件付き期待値で定義し、有限状態例で三条件を直接検証できる
  - 離散時間予測可能過程と予測可能変換を定義し、マルチンゲール差分へ掛ける係数が一時刻前の情報で決まる意味を説明できる
  - stopped マルチンゲール/劣マルチンゲール theoremを差分表示から証明できる
  - bounded 任意抽出 theoremを停止時刻sigma-fieldに関する条件付き不等式・等式まで証明できる
  - 離散時間Doob 分解を構成し、predictable compensatorの非減少性と分解の一意性を証明できる
  - Doob 最大不等式を初到達時刻と任意抽出から導き、最大偏差確率を評価できる
  - 上向き横断 numberを定義し、Doob 上向き横断 inequalityをpredictable trading strategyから証明できる
  - 上向き横断 inequalityから劣マルチンゲールの概収束 theoremを導き、極限が有限かつ可積分になる理由を追える
  - UI マルチンゲール convergence theoremをVitaliとLévy上昇定理へ接続し、a.s.収束・L1収束・終端表現を区別できる
  - optional stoppingの条件を外すと結論が壊れることを倍賭け反例でUIの失敗まで計算できる
