id: "GEO14"
title: "幾何学 XIV：測地線・指数写像・正規座標"
volume: "foundations"
status: supplementary
prerequisites:
  - GEO13
  - ODE4
official_scope: []
learning_objectives:
  - 測地線を速度ベクトルが Levi-Civita 接続に関して平行である曲線として定義し、座標で測地線方程式を導出できる
  - 測地線方程式を一次の非線形自律系へ変換し、初期位置・初期速度からの局所存在一意性と滑らかな初期値依存を説明できる
  - 計量両立性から測地線の速さが一定であることを証明できる
  - 測地線のアフィン再パラメータ化と初期速度のスケーリング則を証明し、非線形再パラメータ化が測地線性を壊す理由を説明できる
  - 指数写像を定義し、滑らかさと原点での微分が恒等写像になることを証明できる
  - 指数写像と逆関数定理から正規近傍・正規座標を構成できる
  - 正規座標の基点で g_ij=delta_ij、Christoffel 係数が0、計量係数の一階微分が0になることを証明できる
  - Gauss の補題を Levi-Civita 接続の計量両立性と捩率0から核心まで証明できる
  - Gauss の補題から放射測地線の最短性と測地線の局所最短性を導出できる
  - 凸正規近傍を定義し、端点指数写像の局所可逆性から局所存在の仕組みを説明できる
