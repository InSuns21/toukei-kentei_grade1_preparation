  - { id: SYM4-PROP-03, name: Poisson括弧の基本性質 }
  - { id: SYM4-PROP-04, name: Hamiltonベクトル場の交換子 }
  - { id: SYM4-THM-03, name: Poisson括弧のJacobi恒等式 }
  - { id: SYM4-THM-04, name: シンプレクティック微分同相の下での自然性 }
