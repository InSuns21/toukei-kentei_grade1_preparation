id: "SYM4"
title: "Hamiltonベクトル場・Poisson括弧・シンプレクティック流"
volume: "foundations"
status: supplementary
prerequisites:
  - GEO2
  - GEO7
  - ODE8
  - AMECH6
  - SYM2
  - SYM3
official_scope: []
learning_objectives:
  - 非退化な2形式によってHamiltonベクトル場が存在・一意となることを証明し正準座標の符号を計算できる
  - Poisson括弧を2形式とHamiltonベクトル場から定義し正準座標式・基本括弧を導ける
  - Cartanの公式と局所流を用いてHamilton流の2形式保存を証明し完備性と区別できる
  - Poisson括弧の時間発展・保存量・Leibniz則を導出できる
  - Hamiltonベクトル場の交換子とJacobi恒等式を符号を含めて証明できる
  - シンプレクティック微分同相の下でHamiltonベクトル場とPoisson括弧が自然に変換することを証明できる
  - 非線形な有限時刻発散・調和振動子・角運動量と正準変換の具体計算を検算できる
