chapter: "F0-00P6B"
terms:
  - term: 希少Bernoulli三角配列
    english: rare Bernoulli triangular array
    meaning: 各行内で独立なBernoulli変数を並べ、行番号とともに最大成功確率が0へ行く三角配列。
  - term: intensity
    english: intensity
    meaning: 希少事象の期待件数を表す総和sum p_nk。本章ではその極限lambdaがPoisson平均になる。
  - term: Poisson少数法則
    english: law of small numbers
    meaning: 各事象が希少で総intensityが有限値へ収束するとき、独立Bernoulli和がPoisson分布へ収束する極限定理。
  - term: 独立Poisson vector
    english: independent Poisson vector
    meaning: 各成分がPoisson分布に従い、成分間が独立な確率ベクトル。互いに素なrare-event categoriesの極限に現れる。
