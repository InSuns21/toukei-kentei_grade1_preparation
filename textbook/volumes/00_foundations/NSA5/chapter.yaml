id: "NSA5"
title: "無限小・有限超実数・標準部"
volume: "foundations"
status: supplementary
prerequisites:
  - NSA4
  - F0-00A1B
official_scope: []
learning_objectives:
  - 有限超実数を標準実数による有界性で定義し、有限でない超実数が無限大超実数であることを示せる
  - 無限小近接 x≈y を定義し、無限小の基本演算から同値関係であることを証明できる
  - monad / halo を無限小近接の同値類として理解し、内部集合との違いを説明できる
  - 有限超実数 x に対して標準実数集合 A_x={r∈R:r≤x} を作り、実数の上限性質から標準部の存在を証明できる
  - 標準部の一意性を、無限小である標準実数は 0 だけであることから証明できる
  - 標準部が加法・乗法・符号反転を保ち、分母の標準部が 0 でなければ商も保つことを証明できる
  - 標準部の単調性と、狭義不等号が保存されない反例を説明できる
  - 標準部のグラフが外部集合であることを、有限超実数全体の外部性から示せる
  - 有界実数列から得る有限超実数の標準部を理解し、通常収束する場合は通常極限と一致することを示せる
definitions:
  - { id: NSA5-DEF-01, name: 有限超実数 }
  - { id: NSA5-DEF-02, name: 無限小近接 }
  - { id: NSA5-DEF-03, name: monad / halo }
  - { id: NSA5-DEF-04, name: 標準部 }
theorems:
