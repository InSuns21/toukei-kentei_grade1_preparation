  - "有限超実数 x の下側にある標準実数集合 A_x と sup A_x"
  - "正の無限小 ε は ε>0 だが st(ε)=0"
  - "ε≈2ε でも ε/ε と ε/(2ε) は無限小近接しない"
  - "有界列 (a_n) から得る有限超実数 [a_n] の標準部"
