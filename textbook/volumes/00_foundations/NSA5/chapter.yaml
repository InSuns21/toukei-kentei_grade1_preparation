  - { id: NSA5-LEM-01, name: 無限小の基本演算 }
  - { id: NSA5-PROP-02, name: 無限小近接は同値関係である }
  - { id: NSA5-THM-01, name: 標準部の存在と一意性 }
  - { id: NSA5-PROP-03, name: 標準部が 0 であることと無限小であること }
  - { id: NSA5-LEM-02, name: 有限超実数は加法・乗法で閉じる }
  - { id: NSA5-THM-02, name: 標準部は加法・乗法を保つ }
  - { id: NSA5-COR-01, name: 標準係数多項式と標準部 }
  - { id: NSA5-PROP-04, name: 標準部の単調性 }
  - { id: NSA5-PROP-05, name: 標準部と商 }
  - { id: NSA5-PROP-06, name: 標準部のグラフは外部集合である }
canonical_examples:
