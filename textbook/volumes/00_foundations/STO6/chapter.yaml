id: "STO6"
title: "Encore IV 確率解析 VI：確率積分"
volume: "foundations"
status: supplementary
prerequisites:
  - STO2
  - STO5
  - F0-00D2E
  - F0-00D3A
official_scope: []
learning_objectives:
  - 単純予測可能被積分過程を定義し、係数が各区間の左端情報で決まることを具体例で確認できる
  - 単純予測可能被積分過程に対するcontinuous マルチンゲール積分を増分和として定義し、adaptednessと連続性を確認できる
  - Itô 等長性をマルチンゲール incrementの直交性とブラケットのcharacterizationから証明できる
  - 単純予測可能被積分過程がL2(d[M]dP)で稠密である理由を説明し、L2 completionにより確率積分を構成できる
  - Doob L2 inequalityを連続時間へ持ち上げ、積分近似がsupremum normでも収束することを示せる
  - 確率積分がcontinuous square-integrable マルチンゲールになり、その二次変分が被積分過程の二乗をブラケットで積分したものになることを証明できる
  - stoppingと確率積分の交換をsimple 被積分過程から一般L2 被積分過程へ延長できる
  - locally square-integrable 被積分過程に対する積分を局所化で貼り合わせ、連続局所マルチンゲールを得られる
  - ブラウン確率積分でブラケットがLebesgue時間に退化することを用い、平均二乗評価を具体計算できる
  - BDG inequalityの標準形とp=2の場合の意味を説明し、path supremumと二次変分の対応を使える
  - predictabilityが未来のincrementを使わせない条件であり、adaptednessだけでは積分構成の直交性を保証しない理由を説明できる
