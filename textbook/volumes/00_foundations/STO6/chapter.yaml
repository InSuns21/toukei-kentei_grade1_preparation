id: "STO6"
title: "Encore IV Stochastic Analysis VI：stochastic integral"
volume: "foundations"
status: supplementary
prerequisites:
  - STO2
  - STO5
  - F0-00D2E
  - F0-00D3A
official_scope: []
learning_objectives:
  - simple predictable integrandを定義し、係数が各区間の左端情報で決まることを具体例で確認できる
  - simple predictable integrandに対するcontinuous martingale積分を増分和として定義し、adaptednessと連続性を確認できる
  - Itô isometryをmartingale incrementの直交性とbracketのcharacterizationから証明できる
  - simple predictable integrandがL2(d[M]dP)で稠密である理由を説明し、L2 completionによりstochastic integralを構成できる
  - Doob L2 inequalityを連続時間へ持ち上げ、積分近似がsupremum normでも収束することを示せる
  - stochastic integralがcontinuous square-integrable martingaleになり、そのquadratic variationがintegrandの二乗をbracketで積分したものになることを証明できる
  - stoppingとstochastic integralの交換をsimple integrandから一般L2 integrandへ延長できる
  - locally square-integrable integrandに対する積分をlocalizationで貼り合わせ、continuous local martingaleを得られる
  - Brownian stochastic integralでbracketがLebesgue時間に退化することを用い、平均二乗評価を具体計算できる
  - BDG inequalityの標準形とp=2の場合の意味を説明し、path supremumとquadratic variationの対応を使える
  - predictabilityが未来のincrementを使わせない条件であり、adaptednessだけでは積分構成の直交性を保証しない理由を説明できる
