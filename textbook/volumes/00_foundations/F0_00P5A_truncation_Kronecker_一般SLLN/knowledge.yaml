chapter: F0-00P5A
scope: dream-theater
coverage: complete
prerequisites:
  - F0-00P5
  - F0-00D2C

# 章末で次の確率論ルートとしてP6の分布収束・特性関数へ進む。
forward_references:
  - prob.characteristic-function
  - prob.distribution-convergence

concepts:
  - id: prob.truncation
    name: SLLNの切断法
    kind: term
    aliases: [truncation, 切断, truncation、切断, 大きすぎる観測を切る, 切断平均]
    introduction_aliases: [truncation、切断]
    requires:
      - prob.random-variable

  - id: prob.tail-sum-bound
    name: 可積分変数のtail-sum評価
    kind: lemma
    aliases: [tail-sum公式, tail-sum評価]
    requires:
      - prob.expectation
      - measure.tonelli-theorem

  - id: prob.truncated-variance-summability
    name: 切断後の分散級数の可算和可能性
    kind: lemma
    aliases: [切断二次モーメントの重み付き総和, 切断後の分散級数が有限になる]
    requires:
      - prob.truncation
      - prob.variance
      - measure.tonelli-theorem

  - id: prob.kolmogorov-convergence-theorem
    name: Kolmogorov収束定理
    kind: theorem
    aliases: [Kolmogorov収束定理]
    requires:
      - prob.kolmogorov-maximal-inequality
      - prob.borel-cantelli-1
      - prob.almost-sure-convergence

  - id: analysis.summation-by-parts
    name: summation by parts
    kind: term
    aliases: [summation by parts, 部分和変換]
    requires: []

  - id: analysis.cesaro-mean-convergence
    name: Cesaro平均の収束保存
    kind: term
    aliases: [Cesaro平均, Cesàro平均]
    requires: []

  - id: prob.kronecker-lemma
    name: Kronecker補題
    kind: lemma
    aliases: [Kronecker補題]
    requires:
      - analysis.summation-by-parts
      - analysis.cesaro-mean-convergence

  - id: prob.iid-integrable-slln
    name: iid有限平均強大数則
    kind: theorem
    aliases: [一般独立同分布強大数則, 独立同分布・有限平均版の強大数則]
    introduction_aliases: [独立同分布・有限平均版の強大数則]
    requires:
      - prob.truncation
      - prob.tail-sum-bound
      - prob.truncated-variance-summability
      - prob.kolmogorov-convergence-theorem
      - prob.kronecker-lemma
      - measure.dominated-convergence-theorem
      - measure.tonelli-theorem
      - prob.borel-cantelli-1
