  - { id: DYN14-THM-03, name: "基準軌道の安定・不安定集合は平行直線" }
  - { id: DYN14-THM-04, name: "両側有界な軌道とコンパクト全不変集合" }
propositions:
  - { id: DYN14-PROP-01, name: "対角模型の全整数時刻の軌道" }
canonical_examples:
