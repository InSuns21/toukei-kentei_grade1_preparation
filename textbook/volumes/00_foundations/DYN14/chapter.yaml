id: "DYN14"
title: "二次元の双曲線形模型・安定方向と不安定方向"
volume: "foundations"
status: supplementary
prerequisites:
  - DYN13
  - F0-00F
official_scope: []
learning_objectives:
  - 対角行列の全整数時刻の軌道と前後の指数率を正確に計算できる
  - 原点への安定集合と不安定集合を定義から両包含で導ける
  - 実固有ベクトルを用いた斜めの座標変換を計算できる
  - 逆三角不等式で混合ベクトルの発散と二方向を特徴付けられる
  - 基準軌道の差を用いて安定・不安定集合が平行直線になると示せる
  - 面積保存と軌道有界性を区別できる
  - 両側有界軌道とコンパクト全不変集合の唯一性を証明できる
  - 線形の双曲方向と区間のhorseshoe符号化を区別できる
