id: "F0-00D3"
title: "補講：外測度・Carathéodory可測性"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00A2
  - F0-00D2
official_scope: []
learning_objectives:
  - 区間被覆のinfimumからLebesgue外測度を定義できる
  - Lebesgue外測度が外測度であることを証明できる
  - Carathéodory可測性を定義し、その意味を分割加法性として説明できる
  - Carathéodory可測集合族がsigma代数になることを証明できる
  - 外測度を可測集合へ制限すると可算加法的な測度になることを証明できる
  - Carathéodory構成で得られる測度の完全性を証明できる
definitions:
  - { id: F000D3-DEF-01, name: 外測度 }
  - { id: F000D3-DEF-02, name: Lebesgue外測度 }
  - { id: F000D3-DEF-03, name: Carathéodory可測集合 }
  - { id: F000D3-DEF-04, name: 完全測度 }
theorems:
  - { id: F000D3-THM-01, name: Lebesgue外測度の外測度性 }
  - { id: F000D3-THM-02, name: Carathéodory可測集合族のsigma代数性 }
  - { id: F000D3-THM-03, name: 外測度制限の可算加法性 }
  - { id: F000D3-THM-04, name: Carathéodory構成の完全性 }
canonical_examples:
  - 開区間被覆から作るLebesgue外測度
  - 一点集合と可算集合の外測度0
