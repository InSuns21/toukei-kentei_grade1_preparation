learning_objectives:
  - 区間被覆のinfimumからLebesgue外測度を定義できる
  - 外測度の空集合・単調性・可算劣加法性を説明できる
  - Carathéodory可測性を定義し、その意味を分割加法性として説明できる
  - Carathéodory可測集合族がsigma代数になる証明の骨格を説明できる
  - 外測度を可測集合へ制限すると完全な測度になる理由を説明できる
