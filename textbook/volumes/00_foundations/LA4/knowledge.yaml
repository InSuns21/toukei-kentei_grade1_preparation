chapter: LA4
scope: dream-theater
coverage: complete
prerequisites:
  - LA3
  - F0-00F
  - F0-00F1
forward_references:
  - linear.complex-inner-product
  - linear.normal-operator

concepts:
  - id: linear.operator-polynomial
    name: 作用素多項式
    kind: definition
    aliases: [作用素多項式, polynomial in an operator]
    requires:
      - linear.linear-map

  - id: linear.polynomial-division
    name: 多項式の除法
    kind: lemma
    aliases: [多項式の除法, polynomial division]
    requires:
      - linear.operator-polynomial

  - id: linear.polynomial-root-bound
    name: 非零多項式の根の個数
    kind: lemma
    aliases: [非零多項式の根の個数, polynomial root bound]
    requires:
      - linear.polynomial-division

  - id: linear.polynomial-matrix-determinant
    name: 多項式行列の行列式
    kind: definition
    aliases: [多項式行列の行列式, Leibniz公式, polynomial matrix determinant]
    requires:
      - linear.abstract-determinant

  - id: linear.polynomial-determinant-evaluation
    name: 多項式行列式とスカラー代入
    kind: lemma
    aliases: [多項式行列式とスカラー代入, determinant evaluation]
    requires:
      - linear.polynomial-matrix-determinant

  - id: linear.polynomial-laplace-expansion
    name: 多項式行列のLaplace展開
    kind: lemma
    aliases: [多項式行列のLaplace展開, polynomial Laplace expansion]
    requires:
      - linear.polynomial-matrix-determinant

  - id: linear.characteristic-polynomial
    name: 特性多項式
    kind: definition
    aliases: [特性多項式, characteristic polynomial]
    requires:
      - linear.polynomial-matrix-determinant
      - linear.operator-polynomial

  - id: linear.minimal-polynomial
    name: 最小多項式
    kind: definition
    aliases: [最小多項式, minimal polynomial]
    requires:
      - linear.operator-polynomial

  - id: linear.adjugate-identity
    name: 余因子行列の恒等式
    kind: lemma
    aliases: [余因子行列の恒等式, 多項式行列恒等式]
    requires:
      - linear.polynomial-laplace-expansion

  - id: linear.polynomial-bezout-identity
    name: 多項式のBézout等式
    kind: lemma
    aliases: [多項式のBézout等式]
    requires:
      - linear.polynomial-division

  - id: linear.distinct-linear-factor-powers-coprime
    name: 相異なる一次因子の冪は互いに素
    kind: lemma
    aliases: [相異なる一次因子の冪は互いに素, coprime powers of distinct linear factors]
    requires:
      - linear.polynomial-bezout-identity

  - id: linear.coprime-product-divisibility
    name: 互いに素な因子の積による整除
    kind: lemma
    aliases: [互いに素な因子の積による整除]
    requires:
      - linear.polynomial-bezout-identity

  - id: linear.cayley-hamilton-theorem
    name: Cayley-Hamilton定理
    kind: theorem
    aliases: [Cayley-Hamilton定理, Cayley–Hamilton定理]
    requires:
      - linear.characteristic-polynomial
      - linear.minimal-polynomial
      - linear.adjugate-identity

  - id: linear.diagonalizable-minimal-polynomial-criterion
    name: 最小多項式による対角化判定
    kind: theorem
    aliases: [最小多項式による対角化判定]
    requires:
      - linear.minimal-polynomial
      - linear.polynomial-root-bound
      - linear.diagonalizable

  - id: linear.generalized-eigenspace
    name: 一般化固有空間
    kind: definition
    aliases: [一般化固有空間, generalized eigenspace]
    requires:
      - linear.eigenvalue
      - linear.operator-polynomial
      - linear.kernel-image

  - id: linear.generalized-eigenspace-decomposition
    name: 一般化固有空間分解
    kind: theorem
    aliases: [一般化固有空間分解, primary decomposition]
    requires:
      - linear.generalized-eigenspace
      - linear.minimal-polynomial
      - linear.sum-direct-sum
      - linear.polynomial-bezout-identity
      - linear.distinct-linear-factor-powers-coprime
      - linear.coprime-product-divisibility

  - id: linear.jordan-chain
    name: Jordan鎖
    kind: definition
    aliases: [Jordan鎖, Jordan chain]
    requires:
      - linear.generalized-eigenspace

  - id: linear.jordan-block
    name: Jordanブロック
    kind: definition
    aliases: [Jordanブロック, Jordan block]
    requires:
      - linear.jordan-chain
      - linear.representation-matrix

  - id: linear.jordan-canonical-form
    name: Jordan標準形定理
    kind: theorem
    aliases: [Jordan標準形定理, Jordan標準形, Jordan canonical form]
    requires:
      - linear.generalized-eigenspace-decomposition
      - linear.jordan-block
