id: "F0-00SP4"
title: "Encore IV：Itô積分・Itô公式・SDE"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00SP3
  - F0-00SP2
  - F0-00D2E
official_scope: []
learning_objectives:
  - simple predictable processとそのIto積分を定義できる
  - Ito isometryをcross term消失から証明できる
  - H_T^2のcompletionとして一般のIto積分を構成できる
  - Ito積分過程の連続martingale版を構成できる
  - Brown運動に対するC2 Ito公式をTaylor展開と二次変分から証明できる
  - 一般Ito process版のIto公式へsimple近似で拡張できる
  - SDEのstrong solutionを積分方程式として定義できる
  - global Lipschitz SDEの存在一意性をPicard反復・Ito isometry・Gronwallで証明できる
  - 幾何Brown運動とOrnstein--Uhlenbeck過程を解ける
