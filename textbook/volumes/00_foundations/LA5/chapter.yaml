learning_objectives:
  - 複素内積の共役対称性と線形性の向きを正しく扱える
  - 有限次元随伴を定義し共役転置との対応を説明できる
  - Hermitian・unitary・normal operatorを区別できる
  - Schur三角化を使ってnormal operatorのスペクトル定理を証明できる
  - Hermitian作用素とunitary作用素の固有値制約を導ける
