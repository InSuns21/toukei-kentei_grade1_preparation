chapter: LA5
scope: dream-theater
coverage: complete
prerequisites:
  - LA4
  - F0-00E1
  - F0-00E2
forward_references:
  - complex-analysis.fundamental-theorem-of-algebra
  - linear.spectral-theorem
  - linear.singular-value
  - linear.singular-value-decomposition
  - linear.hermitian-quadratic-form
  - linear.polar-decomposition
  - linear.complex-singular-value-decomposition
  - functional.norm
  - functional.l2-inner-product
  - linear.inner-product-recap-c1

concepts:
  - id: linear.complex-inner-product
    name: 複素内積
    kind: definition
    aliases: [複素内積, complex inner product]
    requires:
      - linear.real-complex-vector-space

  - id: linear.complex-gram-schmidt
    name: 複素Gram–Schmidt
    kind: theorem
    aliases: [複素Gram–Schmidt, complex Gram-Schmidt]
    requires:
      - linear.complex-inner-product

  - id: linear.orthonormal-extension
    name: 正規直交系の延長
    kind: theorem
    aliases: [正規直交系の延長, orthonormal extension]
    requires:
      - linear.complex-gram-schmidt

  - id: linear.finite-dimensional-adjoint
    name: 有限次元随伴
    kind: definition
    aliases: [有限次元随伴, finite-dimensional adjoint]
    requires:
      - linear.complex-inner-product
      - linear.linear-map

  - id: linear.finite-dimensional-adjoint-existence
    name: 有限次元随伴の存在一意性
    kind: theorem
    aliases: [有限次元随伴の存在一意性]
    requires:
      - linear.finite-dimensional-adjoint
      - linear.orthonormal-extension

  - id: linear.adjoint-calculus
    name: 随伴の計算規則
    kind: theorem
    aliases: [随伴の計算規則, 随伴の基本則, adjoint calculus]
    requires:
      - linear.finite-dimensional-adjoint

  - id: linear.hermitian-operator
    name: Hermitian作用素
    kind: definition
    aliases: [Hermitian作用素, Hermitian operator]
    requires:
      - linear.finite-dimensional-adjoint

  - id: linear.unitary-operator
    name: ユニタリ作用素
    kind: definition
    aliases: [ユニタリ作用素, unitary作用素, unitary operator]
    requires:
      - linear.finite-dimensional-adjoint

  - id: linear.normal-operator
    name: 正規作用素
    kind: definition
    aliases: [正規作用素, normal operator]
    requires:
      - linear.finite-dimensional-adjoint

  - id: linear.complex-eigenvalue-existence
    name: 複素有限次元自己写像の固有値の存在
    kind: lemma
    aliases: [複素有限次元自己写像の固有値の存在, 複素自己写像の固有値存在]
    requires:
      - linear.characteristic-polynomial
      - linear.eigenvalue

  - id: linear.schur-unitary-triangularization
    name: Schurのユニタリ三角化定理
    kind: theorem
    aliases: [Schurのユニタリ三角化定理, Schur三角化]
    requires:
      - linear.complex-inner-product
      - linear.orthonormal-extension
      - linear.complex-eigenvalue-existence

  - id: linear.complex-normal-spectral-theorem
    name: 複素正規作用素のスペクトル定理
    kind: theorem
    aliases: [複素正規作用素のスペクトル定理, 複素normal operatorのスペクトル定理]
    requires:
      - linear.normal-operator
      - linear.schur-unitary-triangularization

  - id: linear.hermitian-real-eigenvalues
    name: Hermitian作用素の固有値は実数
    kind: theorem
    aliases: [Hermitian作用素の固有値は実数]
    requires:
      - linear.hermitian-operator
      - linear.eigenvalue

  - id: linear.unitary-modulus-one-eigenvalues
    name: ユニタリ作用素の固有値は絶対値1
    kind: theorem
    aliases: [ユニタリ作用素の固有値は絶対値1, unitary作用素の固有値は絶対値1]
    requires:
      - linear.unitary-operator
      - linear.eigenvalue
