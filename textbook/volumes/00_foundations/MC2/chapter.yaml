  - { id: MC2-THM-01, name: 逆関数法の正当性 }
  - { id: MC2-THM-02, name: 棄却法の正当性 }
  - { id: MC2-COR-01, name: 棄却法の受理率と平均提案回数 }
  - { id: MC2-PROP-02, name: 固定された生成契約の再現性 }
canonical_examples:
  - 8状態の線形合同法で全周期でも規則性が強く残る例
  - 三点離散分布を一般化逆関数で生成する例
  - 指数分布を一様乱数から逆関数法で生成する例
  - 密度 2x on [0,1] を一様提案から棄却法で生成する例
  - 並列2ワーカーでサブストリームを固定して再現可能な標本列を作る設計
