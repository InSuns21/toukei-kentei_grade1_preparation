id: "MC2"
title: "乱数生成とサンプリング"
volume: "foundations"
status: supplementary
prerequisites:
  - MC1
official_scope: []
learning_objectives:
  - Monte Carlo 理論で仮定する独立一様乱数と、計算機上の疑似乱数列を区別して説明できる
  - 疑似乱数生成器を有限状態の決定論的状態遷移として定式化し、有限状態なら出力列が最終的に周期的になることを証明できる
  - 線形合同法を具体的に計算し、長い周期だけでは乱数品質を保証しないことを説明できる
  - 分布関数の一般化逆関数を用いた逆関数法を定式化し、その正当性を証明できる
  - 離散分布と指数分布に逆関数法を適用して標本生成式を導出できる
  - 提案密度と包絡定数を用いて棄却法を構成し、受理後の標本が目標密度に従うことを証明できる
  - 棄却法の受理率 1/M と平均提案回数 M を導き、提案分布の選び方と効率を結びつけられる
  - シード、乱数ストリーム、サブストリーム、並列割当てを再現性の観点から設計できる
  - 異なるシードを与えただけではストリーム間独立性が保証されないことを説明できる
  - Monte Carlo 実験の再現に必要な生成器、シード、ストリーム割当て、変換法、標本数を記録できる
