canonical_examples:
  - U^2 と (1-U)^2 を組にした対称変量法
  - U^2 の推定に既知平均 E[U]=1/2 を使う制御変量法
  - 単位区間を二層に分けた一様分布平均の層化抽出
  - P(U>0.99) を [0.9,1] 上の提案分布で推定する重点サンプリング
  - q(x)=2x により重みの二次モーメントが発散する重点サンプリングの失敗例
