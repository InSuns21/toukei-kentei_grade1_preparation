canonical_examples:
  - "3対3の余剰行列で対角割当ての総余剰33と利得分解 u=(8,9,10), p=(2,3,1) を用い、二者制約・効率性・競争均衡を同時に検証する例"
  - "2対2市場でコア条件を連立不等式として書き、主体側と対象側の取り分を共通定数だけ移せる範囲を求める例"
  - "外部選択肢0を導入すると等式型割当 LP の符号自由双対から、不等式型マッチング LP の非負双対へ変わることを比較する例"
