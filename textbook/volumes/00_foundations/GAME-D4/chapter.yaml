id: "GAME-D4"
title: "割当ゲーム・コア・競争均衡"
volume: "foundations"
status: supplementary
prerequisites:
  - GAME-D3
  - GAME-B1
  - MICRO6
official_scope: []
learning_objectives:
  - 二つの主体集合と組ごとの余剰から、提携価値を提携内の最大重みマッチングとして定める割当ゲームを定義できる
  - 「組まない」という外部選択肢を0と置くことで、GAME-D3 の等式型割当 LP と本章の不等式型マッチング LP の違いを説明できる
  - 割当ゲームのコア条件を、全主体の非負利得・各組の二者制約・全体効率性へ縮約して証明できる
  - 割当ゲームのコア配分が、最大重みマッチング LP の最適双対解と一致することを証明できる
  - DOPT4 の整数性と OPT10 の強双対性から、割当ゲームのコアが非空であることを説明できる
  - 対象価格と主体の純余剰を用いて、割当市場における競争均衡を個別最適化と市場清算の同時成立として定義できる
  - 競争均衡から得られる利得配分がコアに属し、逆に任意のコア配分から競争均衡を構成できることを証明できる
  - MICRO6 の Walras 均衡と本章の競争均衡に共通する「価格下の個別最適化＋市場清算」という構造を説明できる
  - 3対3の具体的市場で最適割当て、双対利得、コア、競争均衡を一つの計算として検証できる
  - 双対価格の共通移動が、外部選択肢0による非負制約のため有限区間に制限されることを説明できる
definitions:
