    name: Picard--Lindelöfの局所存在・一意性
    kind: theorem
    aliases: [Picard--Lindelöf, Picard–Lindelöf, Picard-Lindelöf, 局所存在・一意性]
    introduction: inline
    requires:
      - ode.ode1-picard-iteration
      - ode.ode1-lipschitz-y
      - analysis.uniform-cauchy
      - analysis.uniform-limit-continuity
