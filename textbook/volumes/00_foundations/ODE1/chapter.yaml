id: "ODE1"
title: "標準常微分方程式 I：一階常微分方程式・初期値問題"
volume: "foundations"
status: supplementary
prerequisites:
  - RA3
  - RA4
  - RA5
official_scope: []
learning_objectives:
  - 一階ODEを階数・線形性・自律性・初期値問題/境界値問題の観点から分類できる
  - 方向場から解曲線の局所的な向きを読める
  - 変数分離で平衡解を落とさずに解を構成できる
  - 一階線形ODEの積分因子を積の微分から導出し初期値問題を解ける
  - 完全微分方程式とBernoulli方程式を標準変形から解ける
  - 自律方程式の平衡点とphase lineから解の増減を読める
  - 初期値問題と積分方程式の同値性を説明できる
  - yに関するLipschitz条件を具体的な領域上で検証できる
  - Picard--Lindelöfの局所存在・一意性をPicard反復と一様収束から証明できる
  - 連続だがLipschitzでない場合の非一意性を反例と証明機構の破綻から説明できる
