  - { id: QMC2-THM-03, name: 積型重み Sobolev 核の最悪誤差公式 }
  - { id: QMC2-THM-04, name: 乱数点平均から得る最悪誤差の存在上界 }
  - { id: QMC2-THM-05, name: 可算和可能な積型重みによる強多項式 tractability }
canonical_examples:
  - K(x,y)=1+min(x,y) の積分表現元を直接計算する例
  - 同じ核の一点求積で最悪誤差が 1/sqrt(12) になる例
  - 線形関数 f(x)=ax+b で重み gamma が導関数方向をどれだけ罰するかを比較する例
  - 二次元積型重みで部分集合表示と積表示を直接展開する例
  - gamma_j=2^{-j} で重み尾と実効切断次元を計算する例
  - gamma_j=gamma>0 では可算和可能性を失い、次元一様な存在上界の証明機構が壊れる例
