id: "QMC2"
title: "RKHS・最悪誤差・重み付き空間"
volume: "foundations"
status: supplementary
prerequisites:
  - QMC1
  - F0-02C7
  - F0-00D2E
official_scope: []
learning_objectives:
  - 既存の再生核 Hilbert 空間と再生核を用いて、積分汎関数が連続になる十分条件を確認し、その Riesz 表現元を導ける
  - 求積誤差を RKHS の誤差表現元との内積として表し、単位球上の最悪誤差がそのノルムに一致することを証明できる
  - 再生核と求積点・求積重みだけから最悪誤差平方の閉じた公式を導ける
  - 一次元の重み付きアンカー型 Sobolev 空間で再生核 1+gamma min(x,y) を直接検証し、重みの役割を説明できる
  - 部分集合重みと積型重みを定義し、積型核の因数分解と半正定値性を説明できる
  - 積型重み Sobolev 核について等重み求積則の最悪誤差公式を導ける
  - 重み尾による実効切断次元を用いて、高い座標の影響が小さくなる仕組みを核の切断誤差から説明できる
  - 最悪誤差に対する情報複雑度、多項式 tractability、強多項式 tractability を定義できる
  - 独立一様乱数点に対する最悪誤差平方の期待値を計算し、よい決定論的点集合の存在上界を導ける
  - 可算和可能な積型重みから次元に依らない最悪誤差上界を導き、強多項式 tractability を証明できる
