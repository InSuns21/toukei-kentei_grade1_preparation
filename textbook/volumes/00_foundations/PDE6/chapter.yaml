  - { id: PDE6-THM-03, name: Greenの第二恒等式 }
  - { id: PDE6-COR-01, name: GreenエネルギーによるDirichlet一意性 }
  - { id: PDE6-COR-02, name: Neumann問題の整合条件と定数を除く一意性 }
  - { id: PDE6-THM-04, name: 基本解によるGreen表現公式 }
  - { id: PDE6-PROP-01, name: 単位円板のDirichlet Green関数 }
  - { id: PDE6-THM-05, name: Dirichlet Green関数によるPoisson表現 }
  - { id: PDE6-PROP-02, name: 単位円板のPoisson kernel再導出 }
canonical_examples: [単位円・正方形の法線微分, 対数基本解の単位flux, 単位円板中心のGreen関数, 単位円板Poisson kernel]
