id: "PDE6"
title: "標準偏微分方程式 VI：Greenの恒等式・基本解・Green関数"
volume: "foundations"
status: supplementary
prerequisites:
  - PDE5
  - VC4
official_scope: []
learning_objectives:
  - VC3--VC4で正本化された外向き法線・flux・発散定理の仮定を確認し、法線微分を円・長方形で計算できる
  - VC1の積の微分則とVC4のGreen theoremのflux formからGreenの第一・第二恒等式を証明できる
  - Greenの第一・第二恒等式からDirichlet一意性とNeumann整合条件・定数不定性を導ける
  - 二次元Laplacianの基本解を調和性と単位fluxで特徴付け、対数特異性の意味を説明できる
  - 基本解を用いたGreen表現公式を、特異点の小円を除く極限計算から導ける
  - Dirichlet Green関数を定義し、単位円板の明示式を検証できる
  - Green関数の境界法線微分からPoisson kernelを導き、PDE5のPoisson積分と一致することを示せる
  - Green恒等式が古典解の一意性・表現・境界条件を同じ積分構造で結ぶことを説明できる
definitions:
  - { id: PDE6-DEF-01, name: 法線微分 }
  - { id: PDE6-DEF-02, name: 二次元負Laplacianの基本解 }
  - { id: PDE6-DEF-03, name: Dirichlet Green関数 }
  - { id: PDE6-DEF-04, name: Green関数から得るPoisson kernel }
theorems:
