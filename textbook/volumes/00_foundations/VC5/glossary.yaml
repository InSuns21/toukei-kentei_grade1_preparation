chapter: "VC5"
terms:
  - term: 誘導された境界向き
    english: induced boundary orientation
    meaning: 向き付けられた曲面の向きと整合するように境界曲線へ入る向き。パラメータ領域の正向き境界を曲面へ写した向きで定義できる。
  - term: Kelvin--Stokesの定理
    english: Kelvin--Stokes theorem
    meaning: 境界上の循環を曲面上のcurlのfluxへ変換する積分定理。
  - term: irrotational
    english: irrotational
    meaning: curlが0であるベクトル場。領域のtopologyによってはglobal potentialを持たないことがある。
  - term: solenoidal
    english: solenoidal
    meaning: divergenceが0であるベクトル場。
  - term: vector potential
    english: vector potential
    meaning: 与えられた場Fに対してcurl A=Fを満たすベクトル場A。
  - term: gauge freedom
    english: gauge freedom
    meaning: vector potential Aへgradient fieldを加えてもcurlが変わらない非一意性。
