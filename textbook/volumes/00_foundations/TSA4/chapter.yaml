id: "TSA4"
title: "Encore IV 時系列解析 IV：線形フィルタ・ARMA / ARIMA・周波数領域"
volume: "foundations"
status: supplementary
prerequisites:
  - TSA1
  - TSA2
  - TSA3
official_scope: []
learning_objectives:
  - 後退作用素と絶対可算和可能な線形フィルタを定義し、L2 収束と二次定常性の保存を証明できる
  - 伝達関数を定義し、線形フィルタがスペクトル測度へ絶対値二乗を掛けることをスペクトル表現から証明できる
  - ARMA 多項式の単位円外根条件から因果性と可逆性を導き、共通因子と既約性の意味を説明できる
  - 因果 ARMA のスペクトル密度を白色雑音の平坦スペクトルと伝達関数から導ける
  - MA(q) の自己相関関数打切りと AR(p) の偏自己相関関数打切りを線形予測の言葉で証明できる
  - 通常差分と季節差分の伝達関数・零点周波数を計算し、ARIMA では差分後系列が定常対象であることを説明できる
  - ARMA の有理スペクトル因数分解と Wold 表示の関係を説明できる
