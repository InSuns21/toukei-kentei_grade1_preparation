id: "OPT5"
title: "Lagrange 双対・Slater 条件・KKT"
volume: "foundations"
status: supplementary
prerequisites:
  - OPT4
official_scope: []
learning_objectives:
  - 不等式制約とアフィン等式制約から Lagrangian を構成できる
  - 双対関数と Lagrange 双対問題を定義し、双対関数の凹性と弱双対性を証明できる
  - Slater条件を具体的な問題で検証できる
  - Slater 条件が摂動値関数の相対内部と支持傾きを通じて強双対性を生む機構を説明できる
  - KKT の4条件を導き、十分性には Slater 条件が不要で必要性には乗数存在が要ることを説明できる
  - 相補性と活性制約の関係を説明できる
definitions:
