  - { id: OPT5-DEF-03, name: 主問題・Lagrange双対問題 }
  - { id: OPT5-DEF-04, name: Slater条件 }
  - { id: OPT5-DEF-05, name: 活性制約 }
  - { id: OPT5-DEF-06, name: 双対ギャップ・強双対性 }
theorems:
