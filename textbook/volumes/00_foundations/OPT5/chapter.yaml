  - { id: OPT5-THM-02, name: Slater条件下の強双対性 }
  - { id: OPT5-THM-03, name: 凸問題のKKT条件 }
canonical_examples: [1変数境界最適化, Slater条件の直接確認, Slater条件失敗時の双対最適解不存在, 二次凸最適化]
