id: "OPT5"
title: "Lagrange 双対・Slater 条件・KKT"
volume: "foundations"
status: supplementary
prerequisites:
  - OPT4
official_scope: []
learning_objectives:
  - 不等式制約とaffine等式制約からLagrangianを構成できる
  - 双対関数とLagrange双対問題を定義し弱双対性を証明できる
  - Slater条件を具体的な問題で検証できる
  - Slater条件が強双対性で果たす役割を分離の観点から説明できる
  - KKTの4条件を導き凸問題で必要十分条件として使える
  - 相補性と活性制約の関係を説明できる
