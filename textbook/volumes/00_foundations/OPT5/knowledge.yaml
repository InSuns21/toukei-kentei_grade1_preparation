chapter: OPT5
scope: dream-theater
coverage: complete
prerequisites:
  - OPT4

forward_references:
  - optimization.tangent-cone
  - optimization.linearized-cone
  - optimization.licq
  - optimization.mfcq

concepts:
  - id: optimization.lagrangian
    name: Lagrangian
    kind: definition
    aliases: [Lagrangian]
    requires: [convex.convex-optimization]
  - id: optimization.dual-function
    name: 双対関数
    kind: definition
    aliases: [双対関数]
    requires: [optimization.lagrangian]
  - id: optimization.primal-problem
    name: 主問題
    kind: definition
    aliases: [主問題]
    introduction_aliases: [主問題・Lagrange 双対問題]
    requires: [convex.convex-optimization]
  - id: optimization.dual-problem
    name: Lagrange双対問題
    kind: definition
    aliases: [Lagrange双対問題, Lagrange 双対問題]
