id: "VN6"
title: "可換 von Neumann 環と $L^\\infty$"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00D2D
  - F0-00D2E
  - OA4
  - VN2
  - VN5
official_scope: []
learning_objectives:
  - 有限測度空間上の L^infinity 関数 f から L^2 上の乗算作用素 M_f を構成し、作用素ノルムが本質的上限に一致することを証明できる
  - L^infinity 乗算環の可換子を T1 から直接計算し、M_mu'=M_mu と二重可換子定理から可換 von Neumann 環であることを証明できる
  - 可測集合を零集合の差で同一視する測度代数を定義し、L^infinity 乗算環の射影との一対一対応を証明できる
  - ベクトル状態 omega_xi(M_f)=int f|xi|^2 dmu を計算し、可測集合の射影へ通常の確率測度を与えることを説明できる
  - C(K) と L^infinity の違いを点評価・射影・a.e.同値の観点から説明できる
  - 連続乗算作用素が不連続な可測射影へ SOT 収束する具体例を示し、作用素ノルム閉包と SOT/WOT 閉包の違いを説明できる
definitions:
  - { id: VN6-DEF-01, name: "乗算作用素" }
  - { id: VN6-DEF-02, name: "L^infinity 乗算環" }
  - { id: VN6-DEF-03, name: "測度代数" }
theorems:
  - { id: VN6-PROP-01, name: "乗算作用素のノルム・積・随伴" }
  - { id: VN6-THM-01, name: "L^infinity 乗算環は自分自身の可換子である" }
  - { id: VN6-THM-02, name: "測度代数と L^infinity 乗算環の射影の対応" }
  - { id: VN6-PROP-02, name: "L^infinity 乗算環上のベクトル状態の積分表示" }
  - { id: VN6-PROP-03, name: "連続乗算作用素の SOT 極限として現れる可測射影" }
canonical_examples:
  - "有限集合上の L^infinity が対角行列環になる例"
  - "[0,1] 上の指示関数射影と零集合を加えた集合が同じ射影になる例"
  - "xi=sqrt(2)1_[0,1/2] が作る正規状態と可測集合への確率"
  - "C([0,1]) の連続ランプ関数が 1_[0,1/2] へ SOT 収束するが作用素ノルム収束しない例"
problem_patterns:
