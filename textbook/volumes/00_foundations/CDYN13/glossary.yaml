chapter: "CDYN13"
terms:
  - term: 速遅系
    english: fast-slow system
    meaning: "異なる時間尺度で変化する成分を持つ微分方程式。本章ではεx'=−a(x−h(y)), y'=bを用いる。"
  - term: 臨界多様体
    english: critical manifold
    meaning: "特異極限で速い右辺が0になる点の集合。本章ではx=h(y)であり、ε>0の元の方程式に対して必ずしも不変ではない。"
  - term: 層方程式
    english: layer equation
    meaning: "速い時間τ=t/εで遅い変数を固定した極限方程式。本模型ではdX/dτ=−a(X−h(y_*))となる。"
  - term: 初期層
    english: initial layer
    meaning: "初期値が臨界多様体から離れている場合、時間尺度O(ε log(1/ε))で指数減衰する初期ずれの領域。"
  - term: 追従誤差
    english: tracking error
    meaning: "速い変数とその時刻の目標曲線の差q=x−h(y)。指数初期層と遅い変化によるO(ε)のずれから成る。"
  - term: 法線方向の引込み
    english: normal attraction
    meaning: "固定した遅い変数で、臨界多様体からの速い方向への変位が減衰する性質。本模型ではa>0で指数減衰する。"
  - term: 特異極限
    english: singular limit
    meaning: "小係数εを0へ近づけることで微分方程式の次数や解の初期値への依存が変わる極限。正時刻の収束と初期時刻の一様収束を区別する。"
  - term: 緩和振動
    english: relaxation oscillation
    meaning: "遅い動きと急速な遷移を繰り返す振動。速遅構造だけで周期解が成立するわけではなく、戻り機構や非線形性が要る。"
