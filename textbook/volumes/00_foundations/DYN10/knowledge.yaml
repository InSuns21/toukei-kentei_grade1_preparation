chapter: DYN10
scope: dream-theater
coverage: complete
prerequisites:
  - DYN9
concepts:
  - id: dynamical-systems.closed-itinerary
    name: 閉区間分割の有限旅程
    kind: definition
    introduction: formal
    introduction_aliases: ["定義（閉区間分割の有限旅程）"]
    requires: [dynamical-systems.tent-map, dynamical-systems.tent-branch-words]
  - id: dynamical-systems.closed-itinerary-cylinders
    name: 有限旅程と分枝区間の一致
    kind: theorem
    introduction_aliases: ["定理（有限旅程と分枝区間の一致）"]
    requires: [dynamical-systems.closed-itinerary, dynamical-systems.tent-dyadic-partition]
  - id: dynamical-systems.itinerary-boundary-multiplicity
    name: 境界訪問数と許容語の個数
    kind: proposition
    introduction_aliases: ["命題（境界訪問数と許容語の個数）"]
    requires: [dynamical-systems.closed-itinerary]
  - id: dynamical-systems.half-open-itinerary
    name: 半開規約の有限・無限旅程
    kind: definition
    introduction: formal
    introduction_aliases: ["定義（半開規約の有限・無限旅程）"]
    requires: [dynamical-systems.closed-itinerary]
  - id: dynamical-systems.half-open-cylinders
    name: 半開規約の有限語と閉分枝区間の関係
