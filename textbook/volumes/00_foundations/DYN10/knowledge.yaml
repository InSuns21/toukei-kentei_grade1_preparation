  - id: dynamical-systems.itinerary-prefix-bound
    name: 共通接頭語による初期値の距離評価
    kind: proposition
    introduction_aliases: ["命題（共通接頭語による初期値の距離評価）"]
    requires: [dynamical-systems.half-open-cylinders]
  - id: dynamical-systems.itinerary-time-shift
    name: 旅程の時間シフト
    kind: proposition
    introduction_aliases: ["命題（旅程の時間シフト）"]
    requires: [dynamical-systems.half-open-itinerary]
  - id: dynamical-systems.itinerary-injective-not-surjective
    name: Tent写像の無限旅程は単射、しかし全射ではない
    kind: theorem
    introduction_aliases: ["定理（Tent写像の無限旅程は単射、しかし全射ではない）"]
    requires: [dynamical-systems.itinerary-prefix-bound, dynamical-systems.itinerary-time-shift]
