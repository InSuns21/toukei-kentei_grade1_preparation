chapter: VC1
scope: dream-theater
coverage: complete
prerequisites:
  - RA6A

concepts:
  - id: vector-calculus.scalar-vector-field
    name: scalar field・vector field
    kind: definition
    aliases: [scalar field, vector field, スカラー場, ベクトル場]
    introduction: formal
    introduction_aliases: ["定義（scalar field・vector field）"]
    requires:
      - functional.frechet-derivative

  - id: vector-calculus.gradient
    name: gradient
    kind: definition
    aliases: [gradient, grad, 勾配]
    introduction: formal
    introduction_aliases: ["定義（gradient）"]
    requires:
      - vector-calculus.scalar-vector-field
      - functional.frechet-derivative

  - id: vector-calculus.level-gradient-normal
    name: 正則level surfaceとgradientの直交
    kind: theorem
    aliases: [level surfaceの法線, gradientの法線性]
    introduction: formal
    introduction_aliases: ["定理（正則 level surface と gradient の直交）"]
    requires:
      - vector-calculus.gradient
      - analysis.regular-level-set-local-graph

  - id: vector-calculus.divergence
    name: divergence
    kind: definition
    aliases: [divergence, div, 発散]
    introduction: formal
    introduction_aliases: ["定義（divergence）"]
    requires:
      - vector-calculus.scalar-vector-field

  - id: vector-calculus.curl
    name: curl
    kind: definition
    aliases: [curl, rotation, rot, 回転]
    introduction: formal
    introduction_aliases: ["定義（curl）"]
    requires:
      - vector-calculus.scalar-vector-field

  - id: vector-calculus.scalar-laplacian
    name: scalar Laplacian
    kind: definition
    aliases: [scalar Laplacian, Laplacian, ラプラシアン]
    introduction: formal
    introduction_aliases: ["定義（scalar Laplacian）"]
    requires:
      - vector-calculus.gradient
      - vector-calculus.divergence

  - id: vector-calculus.curl-gradient-zero
    name: curl grad = 0
    kind: theorem
    aliases: [curl grad zero]
    introduction: formal
    introduction_aliases: ["定理（curl grad = 0）"]
    requires:
      - vector-calculus.gradient
      - vector-calculus.curl

  - id: vector-calculus.divergence-curl-zero
    name: div curl = 0
    kind: theorem
    aliases: [div curl zero]
    introduction: formal
    introduction_aliases: ["定理（div curl = 0）"]
    requires:
      - vector-calculus.divergence
      - vector-calculus.curl

  - id: vector-calculus.product-rules
    name: ベクトル微分演算子の積の微分則
    kind: proposition
    aliases: [div(fF), curl(fF), div(F×G)]
    introduction: formal
    introduction_aliases: ["命題（主要な積の微分則）"]
    requires:
      - vector-calculus.gradient
      - vector-calculus.divergence
      - vector-calculus.curl
