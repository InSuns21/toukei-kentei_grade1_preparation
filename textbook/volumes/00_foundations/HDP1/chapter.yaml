id: HDP1
title: 指数Markov法・Hoeffding補題・Hoeffding不等式
volume: foundations
status: supplementary
prerequisites:
  - F0-00P2A
  - F0-00P3
  - RA3
official_scope: []
learning_objectives:
  - 指数Markov法を非負変数のMarkov不等式から導き有限指数モーメントの必要性を説明できる
  - 中心化対数指数モーメントを定義し二点分布で計算できる
  - 指数傾斜下の分散を用いてHoeffding補題の定数1/8を両符号で導出できる
  - 独立非同分布のHoeffding不等式と両側評価を証明し退化幅V=0を処理できる
  - 分布の独立性・有界性を落とした際の失敗機構を反例で特定できる
  - 標本平均と多座標の同時偏差にHoeffding評価を適用し標本数を設計できる
