id: "GPDE10"
title: "大学院偏微分方程式 X：Galerkin・時間発展 PDE の弱解"
volume: "foundations"
status: supplementary
prerequisites:
  - GPDE9
  - PDE3
  - PDE4
official_scope: []
learning_objectives:
  - H_0^1(Omega) subset L^2(Omega) subset H^{-1}(Omega) の Gelfand 三つ組を埋め込み評価とともに説明できる
  - 時間依存 L^2 空間と時間発展問題のエネルギー弱解を定義し、古典解が弱形式を満たすことを直接確認できる
  - u in L^2(0,T;V), u_t in L^2(0,T;V*) からエネルギー恒等式と C([0,T];H) 連続性を時間平滑化で導出できる
  - 有限次元 Galerkin 近似を連立 ODE として構成できる
  - 強圧条件と Young の不等式から次元に依らないアプリオリエネルギー評価を導出できる
  - L^2(0,T;V) の弱コンパクト性から Galerkin 列の弱収束部分列を取り出せる
  - 時間積分した弱形式で弱収束の極限を通し、u_t=f-Au in L^2(0,T;V*) を同定できる
  - 強圧的時間発展問題の存在・一意性・安定性を Galerkin 法とエネルギー法で証明できる
  - 零 Dirichlet 熱方程式へ抽象定理を適用し、エネルギー弱解の存在一意性を導ける
  - 弱収束だけでは一般の非線形項の極限を通せない反例を検証できる
  - 波動方程式の自然なエネルギー空間 H_0^1 x L^2 とエネルギー保存を説明できる
  - 強連続作用素族と mild 解の積分表示を定義し、固有モードで Duhamel 型表示を確認できる
