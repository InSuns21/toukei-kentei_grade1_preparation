id: "GPDE10"
title: "Encore III Graduate PDE X：Galerkin・時間発展 PDE の弱解"
volume: "foundations"
status: supplementary
prerequisites:
  - GPDE9
  - PDE3
  - PDE4
official_scope: []
learning_objectives:
  - H_0^1(Omega) subset L^2(Omega) subset H^{-1}(Omega) の Gelfand triple を埋め込み評価とともに説明できる
  - 時間依存 L^2 空間と energy weak solution を定義し、古典解が弱形式を満たすことを直接確認できる
  - u in L^2(0,T;V), u_t in L^2(0,T;V*) から energy identity と C([0,T];H) continuity を時間 mollification で導出できる
  - finite-dimensional Galerkin approximation を連立 ODE として構成できる
  - coercivity と Young inequality から次元に依らない a priori energy estimate を導出できる
  - L^2(0,T;V) の weak compactness から Galerkin 列の弱収束部分列を取り出せる
  - time-integrated weak form で弱収束の極限を通し、u_t=f-Au in L^2(0,T;V*) を同定できる
  - coercive evolution problem の存在・一意性・安定性を Galerkin と energy method で証明できる
  - 零 Dirichlet 熱方程式へ抽象定理を適用し、energy weak solution の存在一意性を導ける
  - weak convergence だけでは一般の nonlinear term の極限を通せない反例を検証できる
  - 波動方程式の natural energy space H_0^1 x L^2 と energy 保存を説明できる
  - mild solution / semigroup formulation の役割と本章の停止線を説明できる
