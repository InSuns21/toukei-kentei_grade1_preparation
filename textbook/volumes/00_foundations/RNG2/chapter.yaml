  - { id: RNG2-THM-02, name: 極大イデアルと商体 }
  - { id: RNG2-COR-01, name: 極大イデアルは素イデアル }
  - { id: RNG2-PROP-02, name: 互いに素なイデアルの交わりと積 }
  - { id: RNG2-THM-03, name: 中国剰余定理（二つのイデアル） }
  - { id: RNG2-LEM-01, name: 互いに素な条件を積へまとめる補題 }
  - { id: RNG2-THM-04, name: 中国剰余定理（有限個のイデアル） }
canonical_examples:
  - Z の (0), 5Z, 6Z による素・極大イデアルの比較
