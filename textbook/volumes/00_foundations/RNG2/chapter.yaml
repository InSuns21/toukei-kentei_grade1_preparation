id: "RNG2"
title: "抽象代数 VI：素イデアル・極大イデアル・中国剰余定理"
volume: "foundations"
status: supplementary
prerequisites:
  - RNG1
official_scope: []
learning_objectives:
  - 真のイデアル・素イデアル・極大イデアルを定義し、具体例で区別できる
  - 素イデアルで割った商環が整域になることとの同値を証明できる
  - イデアルの和・積を構成し、互いに素である条件を 1 の表示として使える
  - 極大イデアルで割った商環が体になることとの同値を証明できる
  - 極大イデアルが素イデアルであることをイデアルの和から直接証明できる
  - 互いに素なイデアルについて交わりと積が一致することを証明できる
  - 二つのイデアルに対する中国剰余定理を核と全射性の構成から証明できる
  - 有限個の二つずつ互いに素なイデアルへ中国剰余定理を拡張できる
  - 具体的な整数の同時合同式を中国剰余定理の構成から解ける
definitions:
  - { id: RNG2-DEF-01, name: 真のイデアル・素イデアル・極大イデアル }
