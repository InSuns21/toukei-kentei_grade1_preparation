  - F0-00C1
official_scope: []
learning_objectives:
  - 最大解と最大存在区間を定義し有限時間 blow-up の意味を説明できる
  - コンパクト集合から逃げない解を局所存在定理で延長できることを証明できる
  - Grönwall の不等式を証明し初期値差の指数評価を導ける
  - 線形成長条件から大域存在を導ける
  - 自律系の流れを定義し一意性から合成則を証明できる
  - C1 ベクトル場の流れを初期値で微分し変分方程式を導ける
