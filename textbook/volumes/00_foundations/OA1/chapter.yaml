  - "B(X) の作用素合成"
  - "C([0,1]) の座標関数 t↦t のスペクトル [0,1]"
  - "M2(C) の対角閉部分代数"
  - "I0={f∈C([0,1]):f(0)=0} と C([0,1])/I0≅C"
