id: "NPDE5"
title: "多孔質媒質方程式・有限伝播速度"
volume: "foundations"
status: supplementary
prerequisites:
  - NPDE4
official_scope: []
learning_objectives:
  - 多孔質媒質方程式 u_t=Delta(u^m), m>1 の退化拡散を線形熱方程式と比較して説明できる
  - 弱形式と質量保存を追い、質量保存型 scaling u_lambda(t,x)=lambda^d u(lambda^{d(m-1)+2}t,lambda x) を導ける
  - 質量保存と PDE scaling から similarity exponent alpha=d/[d(m-1)+2], beta=1/[d(m-1)+2] を導ける
  - profile equation から Barenblatt 型 profile と係数 k=(m-1)beta/(2m) を導ける
  - Barenblatt 解の support 半径 R(t)=sqrt(C/k)t^beta を計算し、有限伝播の意味を説明できる
  - 比較原理を用いた Barenblatt barrier から bounded compact-support 初期値の有限伝播を再構成できる
  - Gaussian 熱核の正値性から線形熱方程式の無限伝播を説明し、多孔質媒質方程式との差を説明できる
  - pressure variable p=m/(m-1)u^{m-1} を導入し、p_t=(m-1)p Delta p+|grad p|^2 を導ける
  - similarity variables により rescaled porous medium equation を導き、Barenblatt profile が定常解になることを確認できる
