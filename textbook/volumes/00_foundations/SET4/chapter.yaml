id: "SET4"
title: "超限再帰：以前の全段階から次を定義する"
volume: "foundations"
status: supplementary
prerequisites:
  - SET3
  - SET1
official_scope: []
learning_objectives:
  - 超限再帰と超限帰納法の役割を区別できる
  - 超限再帰定理の存在証明で近似・両立性・置換公理図式の役割を追える
  - 一般の整列集合が一意な順序数と順序同型になることを説明できる
  - 順序数の加法・乗法・冪を超限再帰で定義できる
  - 1+omega と omega+1 の違いを定義から計算できる
