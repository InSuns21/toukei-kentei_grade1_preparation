  - { id: RA4A-THM-03, name: 広義積分の線形性・有限区間切り捨て }
  - { id: RA4A-THM-04, name: 広義積分の比較判定 }
  - { id: RA4A-THM-05, name: 広義積分の極限比較判定 }
  - { id: RA4A-THM-06, name: 広義積分の絶対収束判定 }
  - { id: RA4A-THM-07, name: 級数と広義積分の積分判定 }
  - { id: RA4A-THM-08, name: 広義積分のDirichlet判定 }
  - { id: RA4A-THM-09, name: 広義積分のAbel判定 }
