id: "RA4A"
title: "標準実解析 IV-A：広義積分・収束判定"
volume: "foundations"
status: supplementary
prerequisites:
  - RA4
official_scope: []
learning_objectives:
  - 無限区間・端点特異点・内部特異点をもつ広義Riemann積分を片側極限で定義できる
  - 複数の不良端点では各片側積分を別々に判定し、Cauchy主値による相殺と区別できる
  - 広義積分のCauchy判定・非負関数の有界性判定・比較判定・極限比較判定を証明して使える
  - p積分と対数補正積分の収束・発散を分類できる
  - 絶対収束から収束を導き、条件収束との違いを説明できる
  - 級数と広義積分の積分判定を証明し、p級数へ適用できる
  - Dirichlet判定・Abel判定を有限区間のFTCから導き、振動積分の条件収束を判定できる
  - Cauchy主値は通常の広義積分とは異なる極限操作であることを反例から説明できる
definitions:
  - { id: RA4A-DEF-01, name: 広義Riemann積分 }
  - { id: RA4A-DEF-02, name: 広義積分の絶対収束・条件収束 }
  - { id: RA4A-DEF-03, name: 広義積分に対するCauchy主値 }
