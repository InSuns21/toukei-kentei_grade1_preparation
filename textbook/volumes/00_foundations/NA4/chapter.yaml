  - { id: NA4-PROP-01, name: 分割差分の再帰公式 }
  - { id: NA4-THM-02, name: Newton 補間公式 }
  - { id: NA4-THM-03, name: 多項式補間の誤差公式 }
  - { id: NA4-THM-04, name: 最高次係数1の多項式に対する Chebyshev の最小最大性 }
  - { id: NA4-PROP-02, name: データ摂動の増幅評価 }
canonical_examples:
