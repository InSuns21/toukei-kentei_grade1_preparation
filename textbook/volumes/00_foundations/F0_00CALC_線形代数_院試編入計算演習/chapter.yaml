id: "LAX1"
title: "線形代数・院試／編入 計算演習"
volume: "foundations"
status: supplementary
prerequisites:
  - LA6
official_scope: []
learning_objectives:
  - 行基本変形から階数・核・像・連立一次方程式の解を手計算で求められる
  - パラメータを含む連立一次方程式を階数条件で場合分けできる
  - 非標準基底間の基底変換と線形写像の表現行列を計算できる
  - 基本変形・Laplace展開を使い分けて行列式を効率よく計算できる
  - 固有値・固有ベクトル・対角化・行列の冪を手計算で処理できる
  - Gram–Schmidt法からQR分解を構成し、最小二乗問題へ適用できる
  - 直和分解から斜交射影を構成し、射影行列を求められる
  - Householder変換を構成して直交性と作用を確認できる
  - 特異値分解をA^*AまたはAA^*から構成し、特異値・作用素ノルムを求められる
  - 実対称行列の直交対角化から二次形式の符号と球面上の極値を求められる
  - 双対基底・annihilatorを具体的な基底行列から計算できる
  - 複素Hermitian行列のunitary対角化とSchur分解を具体的に計算できる
  - polar decompositionを正の平方根から構成できる
  - 最小多項式・Jordan鎖・核次元からJordan構造と行列の冪を計算できる
