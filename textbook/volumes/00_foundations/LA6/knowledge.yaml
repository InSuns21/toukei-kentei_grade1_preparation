chapter: LA6
scope: dream-theater
coverage: complete
prerequisites:
  - LA5
  - F0-00F1
  - F0-00F2
forward_references: []

concepts:
  - id: linear.hermitian-quadratic-form
    name: Hermitian二次形式
    kind: definition
    aliases: [Hermitian二次形式, Hermitian quadratic form]
    requires:
      - linear.hermitian-operator
      - linear.complex-inner-product

  - id: linear.congruence
    name: congruence
    kind: definition
    aliases: [congruence, 合同変換]
    requires:
      - linear.hermitian-quadratic-form
      - linear.representation-matrix

  - id: linear.sylvester-inertia-law
    name: Sylvesterの慣性法則
    kind: theorem
    aliases: [Sylvesterの慣性法則, law of inertia]
    requires:
      - linear.congruence
      - linear.complex-normal-spectral-theorem

  - id: linear.hermitian-psd-operator
    name: Hermitian PSD作用素
    kind: definition
    aliases: [Hermitian PSD作用素, Hermitian positive semidefinite operator, PSD作用素]
    requires:
      - linear.hermitian-operator

  - id: linear.psd-square-root
    name: Hermitian PSD平方根定理
    kind: theorem
    aliases: [Hermitian PSD平方根定理, PSD平方根]
    requires:
      - linear.hermitian-psd-operator
      - linear.complex-normal-spectral-theorem

  - id: linear.polar-decomposition
    name: polar decomposition
    kind: theorem
    aliases: [polar decomposition, 極分解]
    requires:
      - linear.psd-square-root
      - linear.unitary-operator
      - linear.orthonormal-extension

  - id: linear.complex-singular-value-decomposition
    name: 複素特異値分解
    kind: theorem
    aliases: [複素特異値分解, complex singular value decomposition]
    requires:
      - linear.hermitian-psd-operator
      - linear.complex-normal-spectral-theorem
      - linear.orthonormal-extension

  - id: linear.euclidean-operator-norm
    name: Euclidノルムから誘導される作用素ノルム
    kind: definition
    aliases: [Euclidノルムから誘導される作用素ノルム, Euclidean operator norm]
    requires:
      - linear.complex-inner-product

  - id: linear.unitary-operator-norm-invariance
    name: 作用素ノルムのunitary不変性
    kind: lemma
    aliases: [作用素ノルムのunitary不変性, unitary invariance of operator norm]
    requires:
      - linear.euclidean-operator-norm
      - linear.unitary-operator

  - id: linear.rank-invertible-invariance
    name: 可逆な左右乗算はrankを変えない
    kind: lemma
    aliases: [可逆な左右乗算はrankを変えない, rank invariance under invertible multiplication]
    requires:
      - linear.kernel-image

  - id: linear.diagonal-operator-norm
    name: 矩形対角行列の作用素ノルム
    kind: lemma
    aliases: [矩形対角行列の作用素ノルム, operator norm of a rectangular diagonal matrix]
    requires:
      - linear.euclidean-operator-norm
