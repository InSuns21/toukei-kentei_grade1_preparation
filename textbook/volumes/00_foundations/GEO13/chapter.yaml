id: "GEO13"
title: "幾何学 XIII：アフィン接続・Levi-Civita 接続・平行移動"
volume: "foundations"
status: supplementary
prerequisites:
  - GEO5
  - GEO12
official_scope: []
learning_objectives:
  - アフィン接続をベクトル場の方向微分を補正する演算として定義し、接続の公理を説明できる
  - 局所座標で Christoffel 係数を定義し、共変微分の座標公式を導出できる
  - 二つの接続の差が $(1,2)$ テンソル場になることを証明し、Christoffel 係数自体がテンソル成分ではない理由を説明できる
  - 接続の捩率を定義し、座標表示とテンソル性を示せる
  - 曲線に沿う共変微分を構成し、平行ベクトル場と平行移動を線形 ODE として求められる
  - 計量両立性を定義し、計量と両立する接続の平行移動が内積を保存することを証明できる
  - Koszul の公式を捩率0と計量両立性から導出できる
  - Koszul の公式を用いて Levi-Civita 接続の存在一意性を核心まで証明できる
  - Levi-Civita 接続の Christoffel 係数公式を導出し、極座標・共形計量・warped 型計量で計算できる
  - 共変微分を余ベクトル場・一般テンソル場へ拡張し、成分公式を使える
