id: "FDM4"
title: "差分法 IV：移流拡散と風上化"
volume: "foundations"
status: supplementary
prerequisites:
  - FDM3
official_scope: []
learning_objectives:
  - 一次元定常移流拡散問題で、移流と拡散が競合するときの解の境界層構造を具体的に計算できる
  - 中心一次差分と風上一次差分を Taylor 展開から比較し、中心差分が二次精度、風上差分が一次精度であることを説明できる
  - 格子 Péclet 数 Pe_h=|a|h/(2*kappa) を定義し、中心差分スキームの係数符号が Pe_h=1 を境に変わることを導ける
  - Pe_h <= 1 の下で中心差分型移流拡散スキームの離散最大値原理と一意性を証明できる
  - Pe_h > 1 で中心差分の離散解が交互振動する機構を特性根から説明し、非物理振動を具体計算で確認できる
  - 風上差分型移流拡散スキームが任意の Pe_h で離散最大値原理を保つことを証明できる
  - 風上差分の修正方程式から |a|h/2 の数値拡散を導き、振動抑制と精度低下のトレードオフを説明できる
  - FDM の風上化と後続 FEM7 の安定化有限要素法が、移流卓越時の離散安定性を回復するという共通問題に答えることを説明できる
