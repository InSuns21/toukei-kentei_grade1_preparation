chapter: OA4
scope: dream-theater
coverage: complete
prerequisites:
  - OA3
  - OA2
  - RA8

forward_references: []

concepts:
  - id: operator-algebra.normal-element
    name: 正規元
    kind: definition
    aliases: ["normal element in a C*-algebra"]
    introduction: formal
    introduction_aliases: ["定義（正規元）"]
    requires:
      - operator-algebra.cstar-algebra

  - id: operator-algebra.generated-unital-cstar-subalgebra
    name: 一つの元が生成する単位的 C*-部分環
    kind: definition
    aliases: ["generated unital C*-subalgebra"]
    introduction: formal
    introduction_aliases: ["定義（一つの元が生成する単位的 C*-部分環）"]
    requires:
      - operator-algebra.cstar-algebra

  - id: operator-algebra.normal-generated-commutative
    name: 正規元が生成する C*-部分環は可換である
    kind: proposition
    aliases: ["commutativity of the C*-algebra generated by a normal element"]
    introduction_aliases: ["命題（正規元が生成する C*-部分環は可換である）"]
    requires:
      - operator-algebra.normal-element
      - operator-algebra.generated-unital-cstar-subalgebra

  - id: operator-algebra.stone-weierstrass-self-adjoint
    name: 自己共役部分代数版 Stone--Weierstrass 定理
    kind: theorem
    aliases: ["self-adjoint Stone-Weierstrass theorem"]
    introduction_aliases: ["定理（自己共役部分代数版 Stone--Weierstrass）"]
    requires:
      - analysis.weierstrass-approximation
      - topology.compact-space

  - id: operator-algebra.commutative-gelfand-naimark
    name: 可換 Gelfand--Naimark 定理
    kind: theorem
    aliases: ["commutative Gelfand--Naimark theorem"]
    introduction_aliases: ["定理（可換 Gelfand--Naimark）"]
    requires:
      - operator-algebra.commutative-cstar-gelfand-isometry
      - operator-algebra.stone-weierstrass-self-adjoint
      - operator-algebra.gelfand-transform

  - id: operator-algebra.cstar-subalgebra-spectral-invariance
    name: 単位的 C*-部分環のスペクトル不変性
    kind: theorem
    aliases: ["spectral invariance of unital C*-subalgebras"]
    introduction_aliases: ["定理（単位的 C*-部分環ではスペクトルが保存される）"]
    requires:
      - operator-algebra.self-adjoint-generated-inverse-approximation
      - operator-algebra.cstar-algebra

  - id: operator-algebra.normal-character-spectrum-homeomorphism
    name: 正規元の character 空間とスペクトルの同相
    kind: theorem
    aliases: ["homeomorphism between the character space of C*(a,1) and the spectrum"]
    introduction_aliases: ["定理（正規元の character 空間はスペクトルと同相である）"]
    requires:
      - operator-algebra.normal-generated-commutative
      - operator-algebra.spectrum-characterization
      - operator-algebra.cstar-subalgebra-spectral-invariance
      - operator-algebra.commutative-cstar-gelfand-isometry

  - id: operator-algebra.continuous-functional-calculus
    name: 正規元の連続関数計算
    kind: theorem
    aliases: ["continuous functional calculus for normal elements"]
    introduction_aliases: ["定理（正規元の連続関数計算）"]
    requires:
      - operator-algebra.commutative-gelfand-naimark
      - operator-algebra.normal-character-spectrum-homeomorphism
      - operator-algebra.star-homomorphism-contractive

  - id: operator-algebra.continuous-spectral-mapping
    name: 連続スペクトル写像定理
    kind: theorem
    aliases: ["continuous spectral mapping theorem"]
    introduction_aliases: ["定理（連続スペクトル写像）"]
    requires:
      - operator-algebra.continuous-functional-calculus
      - operator-algebra.cstar-subalgebra-spectral-invariance
