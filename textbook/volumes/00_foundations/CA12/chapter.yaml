id: "CA12"
title: "標準複素解析 XII：Riemann ζ 関数・theta 変換・解析接続・関数等式"
volume: "foundations"
status: supplementary
prerequisites:
  - CA11
  - FOU2
  - FOU3
  - F0-00D2C
official_scope: []
learning_objectives:
  - Riemann ζ 関数の Dirichlet 級数が Re s>1 で局所一様絶対収束し正則であることを示せる
  - 一意分解と絶対収束から Euler 積を導き、Re s>1 で ζ が零点を持たないことを説明できる
  - Gaussian を周期化して Fourier 係数を計算し、theta 変換 theta(t)=t^(-1/2)theta(1/t) を証明できる
  - theta 関数の Mellin 表現で和と積分の交換条件を確認し、ζ を全平面へ有理型解析接続できる
  - 完成 zeta 因子の対称性から Riemann ζ 関数の関数等式を導ける
  - s=1 の留数、負の偶数の自明零点、ζ(0), ζ(-1), ζ(2) を既存の Gamma 関数・Euler 積と接続して導ける
definitions:
  - { id: CA12-DEF-01, name: Riemann ζ 関数 }
  - { id: CA12-DEF-02, name: Dirichlet eta 関数 }
  - { id: CA12-DEF-03, name: Jacobi theta 関数 }
  - { id: CA12-DEF-04, name: 完成 zeta 因子と Riemann xi 関数 }
theorems:
