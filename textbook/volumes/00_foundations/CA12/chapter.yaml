  - { id: CA12-THM-02, name: Riemann ζ 関数の Euler 積と右半平面での零点不存在 }
  - { id: CA12-PROP-01, name: Dirichlet eta 関数の右半平面での正則性 }
  - { id: CA12-THM-03, name: theta 変換 }
  - { id: CA12-THM-04, name: theta Mellin 表現 }
  - { id: CA12-THM-05, name: Riemann ζ 関数の有理型解析接続 }
  - { id: CA12-THM-06, name: Riemann ζ 関数の関数等式 }
  - { id: CA12-COR-01, name: 自明零点 }
  - { id: CA12-COR-02, name: 標準特殊値 }
