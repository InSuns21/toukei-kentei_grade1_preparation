  - { id: F0P4-THM-02, name: 独立列のブロック独立性 }
  - { id: F0P4-THM-03, name: Kolmogorovの0--1則 }
  - { id: F0P4-THM-04, name: Borel--Cantelli第1補題 }
  - { id: F0P4-THM-05, name: Borel--Cantelli第2補題 }
  - { id: F0P4-THM-06, name: 概収束のlimsupによる特徴付け }
  - { id: F0P4-THM-07, name: 概収束は確率収束を含意する }
  - { id: F0P4-THM-08, name: 確率収束から概収束部分列 }
