id: "F0-00P4"
title: "limsup・liminf・末尾事象・Borel--Cantelli・確率収束"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00P3
  - F0-00D3A
official_scope: []
learning_objectives:
  - 事象列のlimsupとliminfを量化記号と経路上の意味の両方で説明できる
  - i.o.とeventuallyをlimsupとliminfに対応付けられる
  - limsupとliminfの補集合関係を証明できる
  - 独立な事象列と末尾sigma代数・末尾事象を定義できる
  - 独立列のブロック独立性をpi-lambda定理から証明できる
  - Kolmogorovの0--1則を末尾事象が自分自身と独立になることから証明できる
  - Borel--Cantelli第1補題をunion boundから証明できる
  - Borel--Cantelli第2補題を独立性と無限積評価から証明できる
  - 概収束を誤差事象のlimsupで特徴付けられる
  - 概収束から確率収束を導ける
  - 確率収束列から概収束部分列を取れる
  - 確率収束が概収束を含意しない反例を説明できる
definitions:
  - { id: F0P4-DEF-01, name: 事象列の上極限 }
  - { id: F0P4-DEF-02, name: 事象列の下極限 }
