  - { id: MT3-LEM-01, name: 絶対連続かつ特異な符号付き測度は0 }
  - { id: MT3-THM-06, name: Lebesgue分解・σ-finite正測度版 }
  - { id: MT3-THM-07, name: Lebesgue分解・有限符号付き測度版 }
