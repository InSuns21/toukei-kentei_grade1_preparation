id: "MT3"
title: "標準測度論 IV：Radon–Nikodym定理・Lebesgue分解"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00D2A
  - F0-00D2B
  - MT2
official_scope: []
learning_objectives:
  - 有限正測度版Radon–Nikodym定理を候補密度の最大化とHahn分解から証明できる
  - σ-finite版を有限測度部分への可算局所化から構成できる
  - σ-finite性を外すとRadon–Nikodym表示が失敗する具体例を説明できる
  - 測度変更の積分公式とRadon–Nikodym微分のchain ruleを導出できる
  - Jordan分解を用いて有限符号付き測度版Radon–Nikodym定理へ還元できる
  - Lebesgue分解の絶対連続部分・特異部分を構成し一意性を証明できる
