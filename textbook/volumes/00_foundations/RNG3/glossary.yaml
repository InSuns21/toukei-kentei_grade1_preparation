chapter: "RNG3"
terms:
  - term: 整除
    english: divisibility
    meaning: a|b は、ある c が存在して b=ac と書けること。
  - term: 単元
    english: unit
    meaning: 乗法逆元を持つ環の元。
  - term: 同伴元
    english: associate elements
    meaning: 一方が他方に単元を掛けた形で表される二つの元。
  - term: 既約元
    english: irreducible element
    meaning: 0でも単元でもなく、積へ分解したとき少なくとも一方の因子が単元となる元。
  - term: 素元
    english: prime element
    meaning: 0でも単元でもなく、p|ab なら p|a または p|b を満たす元。
  - term: 最大公約元
    english: greatest common divisor
    meaning: 二元をともに割り、任意の公約元で割り切られる元。同伴を除いて一意。
  - term: Bézout 恒等式
    english: Bézout identity
    meaning: 最大公約元 d を d=ra+sb の形で表す恒等式。
  - term: Euclid 整域
    english: Euclidean domain
    meaning: 余りの Euclid 関数値を strictly に小さくできる除法を持つ整域。
  - term: Euclid 関数
    english: Euclidean function
    meaning: Euclid 除法で非零余りの大きさを測り、各段階で strictly に減少する非負整数値関数。
  - term: 単項イデアル整域
    english: principal ideal domain
    meaning: 全てのイデアルが一つの元で生成される整域。
  - term: 一意分解整域
    english: unique factorization domain
    meaning: 全ての非零非単元が既約元へ分解でき、その分解が順序と同伴元を除いて一意な整域。
