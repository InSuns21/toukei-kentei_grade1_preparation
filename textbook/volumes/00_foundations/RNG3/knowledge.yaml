  - id: algebra.unit-element
    name: 環論の単元
    kind: definition
    aliases: [unit]
    introduction: formal
    introduction_aliases: ["定義（整除・単元・同伴）"]
    requires: [algebra.divisibility]

  - id: algebra.associate-elements
    name: 整域の同伴元
    kind: definition
    aliases: [associates]
    introduction: formal
    introduction_aliases: ["定義（整除・単元・同伴）"]
    requires: [algebra.unit-element]

  - id: algebra.irreducible-element
    name: 整域の既約元
    kind: definition
    aliases: [irreducible element]
    introduction: formal
    introduction_aliases: ["定義（既約元・素元）"]
