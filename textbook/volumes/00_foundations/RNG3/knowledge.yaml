    introduction_aliases: ["定理（単項イデアル整域は一意分解整域）"]
    requires: [algebra.principal-ideal-domain, algebra.pid-ascending-chain-condition, algebra.pid-irreducible-implies-prime, algebra.unique-factorization-domain]
