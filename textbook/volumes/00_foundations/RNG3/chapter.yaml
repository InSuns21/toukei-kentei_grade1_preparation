id: "RNG3"
title: "抽象代数 VII：整除・Euclid 整域・PID・UFD"
volume: "foundations"
status: supplementary
prerequisites:
  - RNG2
official_scope: []
learning_objectives:
  - 整域における整除・単元・同伴元を定義し、主イデアルの包含との対応を説明できる
  - 既約元と素元を区別し、素元なら既約元であることを証明できる
  - 素元と素な主イデアルの同値を証明できる
  - 最大公約元を整除関係で定義し、Bézout 恒等式から最大公約元性を確認できる
  - Euclid 整域を定義し、Euclid の互除法が有限停止する理由を説明できる
  - Euclid の互除法から最大公約元と Bézout 係数を構成できる
  - Euclid 整域が単項イデアル整域であることを最小 Euclid 関数値の議論から証明できる
  - PID で (a)+(b) の生成元が最大公約元となることを証明できる
  - PID で既約元が素元になることをイデアルの和から証明できる
  - PID で有限既約分解が存在することと因数分解が一意であることを証明できる
  - Z[sqrt(-5)] で既約元が素元でない反例を説明できる
