id: "RNG3"
title: "抽象代数 VII：整除・Euclid 整域・単項イデアル整域・一意分解整域"
volume: "foundations"
status: supplementary
prerequisites:
  - RNG2
official_scope: []
learning_objectives:
  - 整域上の整除・単元・同伴を定義し、具体例で判定できる
  - 既約元と素元を区別し、素元なら既約元であることを証明できる
  - 最大公約元を同伴を除く一意性まで理解し、Bézout 等式との関係を説明できる
  - Euclid 整域を定義し、Euclid の互除法から最大公約元と Bézout 等式を構成できる
  - Euclid 整域の任意のイデアルが単項であることを最小 Euclid 値の元から証明できる
  - 単項イデアル整域で最大公約元が生成イデアル (a,b) の生成元になることを証明できる
  - 単項イデアル整域で既約元が素元になることを、主イデアルの極大性と RNG2 の結果から証明できる
  - 単項イデアル整域でイデアルの昇鎖が停止することを証明し、既約元分解の存在へつなげられる
  - 単項イデアル整域が一意分解整域であることを存在と一意性に分けて証明できる
  - 一般の整域では既約元が素元とは限らず、一意分解も壊れうることを具体例で説明できる
