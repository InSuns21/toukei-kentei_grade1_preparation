id: "OPT10"
title: "線形計画 I：多面体・極点・双対"
volume: "foundations"
status: supplementary
prerequisites:
  - OPT2
  - OPT5
official_scope: []
learning_objectives:
  - 線形計画問題を標準形へ変換し、スラック変数・余剰変数・自由変数分解の役割を説明できる
  - 多面体・有界多面体・実行可能方向・極点を定義し、低次元例で直接判定できる
  - 標準形実行可能集合で、極点と正成分に対応する列の一次独立性が同値であることを証明できる
  - 基本実行可能解を定義し、行フルランクの標準形で極点と基本実行可能解が一致することを証明できる
  - 実行可能で目的関数が下に有界な標準形LPが基本実行可能最適解を持つことを証明できる
  - 標準形LPの双対問題を導入し、双対可行解が主問題の下界証明書になることを弱双対性から説明できる
  - Farkasの補題を用いてLP強双対を証明し、退化や狭義可行点の不存在に依存しない理由を説明できる
  - 主・双対可行解について相補性と最適性が同値であることを双対ギャップの分解から示せる
  - 二変数LPを極点・基本実行可能解・双対価格・相補性の4視点で一貫して解ける
definitions:
  - { id: OPT10-DEF-01, name: 線形計画問題の標準形 }
