  - { id: OPT10-DEF-06, name: 退化した基本実行可能解 }
  - { id: OPT10-DEF-07, name: 線形計画双対 }
theorems:
  - { id: OPT10-THM-01, name: 標準形多面体の実行可能方向判定 }
  - { id: OPT10-THM-02, name: 標準形多面体の極点判定 }
  - { id: OPT10-THM-03, name: 極点と基本実行可能解の同値性 }
  - { id: OPT10-THM-04, name: 線形計画の基本定理 }
  - { id: OPT10-THM-05, name: 線形計画の弱双対性 }
  - { id: OPT10-THM-06, name: 線形計画の強双対性 }
  - { id: OPT10-THM-07, name: 相補性と最適性 }
canonical_examples:
  - 不等式制約を余剰変数で標準形へ直す二変数線形計画
  - 単体x1+x2+x3=1の極点と基本実行可能解
  - 正成分の列依存から極点でないことを示す例
  - 二変数線形計画の主問題と双対問題
  - 双対可行解による目的値下界の証明書
  - 相補性から主・双対最適解を復元する例
