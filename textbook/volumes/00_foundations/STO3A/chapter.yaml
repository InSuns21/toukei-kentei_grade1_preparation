id: "STO3A"
title: "経路空間の弱収束・tightness・Donsker不変原理"
volume: "foundations"
status: supplementary
prerequisites:
  - STO2
  - STO4
  - F0-00P6A
  - RA5
official_scope: []
learning_objectives:
  - C([0,1])をsup metricを持つ経路空間として定義し経路値 random variableを扱える
  - 経路空間 weak convergenceをbounded continuous functionalで定義できる
  - tightnessをcompact setsへの確率質量集中として定義できる
  - common modulus of continuityからC([0,1])のcompactnessを対角抽出で証明できる
  - modulus conditionからcontinuous-process lawsのtightness criterionを証明できる
  - fourth-moment increment boundからKolmogorov型tightness criterionを証明できる
  - polygonal random walkのfinite-dimensional convergenceを独立 block 中心極限定理から証明できる
  - bounded incrementsの場合のuniform fourth-moment increment boundを証明できる
  - 固定有界化とDoob maximal inequalityで有限分散経路のtightnessを証明できる
  - 独立同分布 finite-variance Donsker invariance principleをfdd+tightness+Prokhorovから再構成できる
  - continuous mappingでrandom-walk maximumなどの経路 functionalへ極限を移せる
