chapter: F0-00D2E
scope: dream-theater
coverage: complete
prerequisites:
  - F0-00D2D
  - F0-00D2B

# 後半の確率論への応用節では、後続章の確率概念を先取りして接続を示す。
forward_references:
  - prob.probability-space
  - prob.random-variable
  - prob.expectation
  - prob.variance
  - prob.conditional-expectation

concepts:
  - id: functional.normed-cauchy-sequence
    name: ノルム空間のCauchy列
    kind: definition
    aliases: [ノルム空間のCauchy列]
    requires: []

  - id: functional.banach-space
    name: Banach空間
    kind: definition
    aliases: [Banach空間]
    requires:
      - functional.normed-cauchy-sequence

  - id: functional.l2-inner-product
    name: L2内積
    kind: definition
    aliases: [L2内積, "内積）"]
    requires:
      - measure.holder-inequality
      - measure.lebesgue-integral

  - id: functional.inner-product-induced-norm
    name: 内積が誘導するノルム
    kind: proposition
    aliases: [内積が誘導するノルム]
    requires:
      - functional.l2-inner-product

  - id: functional.hilbert-space
    name: Hilbert空間
    kind: definition
    aliases: [Hilbert空間]
    requires:
      - functional.inner-product-induced-norm
      - functional.banach-space

  - id: functional.l2-completeness
    name: L2の完備性
    kind: theorem
    aliases: [完備性]
    requires:
      - measure.minkowski-inequality
      - measure.monotone-convergence-theorem
      - measure.almost-everywhere

  - id: functional.l2-hilbert
    name: L2のHilbert性
    kind: corollary
    aliases: [Hilbert性]
    requires:
      - functional.hilbert-space
      - functional.l2-completeness
      - functional.l2-inner-product
