  - "z+ 状態における sigma_x と sigma_y の Robertson 不等式の等号成立"
  - "z+ から x 測定を挟んで z を再測定する逐次 Stern--Gerlach 型測定"
  - "対角行列同士の可換性と共通固有基底"
problem_patterns:
