id: "MOD2"
title: "抽象代数 X：Smith 標準形・PID 上有限生成加群"
volume: "foundations"
status: supplementary
prerequisites:
  - MOD1
  - RNG4
official_scope: []
learning_objectives:
  - PID 上の行列に対する行・列基本変形を可逆な基底変換として説明し、行列同値が余核を変えないことを示せる
  - Smith 標準形を定義し、Bézout 等式と PID のイデアル昇鎖停止を用いて存在を証明できる
  - 小行列式イデアルを用いて Smith 標準形の不変因子が単元倍を除いて一意であることを証明できる
  - PID 上の有限階数自由加群の部分加群が自由であることを証明できる
  - 有限生成加群を自由加群の余核として表示し、Smith 標準形から PID 上有限生成加群の構造定理を導ける
  - 不変因子表示と素元冪による基本因子表示を相互に読み替えられる
  - 有限生成 Abel 群の構造定理を Z 上の構造定理として導き、具体的な有限 Abel 群を分類できる
  - 有限次元線形自己写像を F[x]-加群として扱い、構造定理から巡回分解と LA4 の Jordan 構造への接続を説明できる
