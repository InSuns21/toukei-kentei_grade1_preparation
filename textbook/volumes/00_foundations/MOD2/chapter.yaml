  - { id: MOD2-THM-01, name: Smith 標準形定理 }
  - { id: MOD2-PROP-01, name: 小行列式イデアルの行列同値不変性 }
  - { id: MOD2-THM-02, name: Smith 不変因子の一意性 }
  - { id: MOD2-THM-03, name: PID 上自由加群の部分加群は自由 }
  - { id: MOD2-PROP-02, name: 行列同値は余核を保つ }
  - { id: MOD2-THM-04, name: PID 上有限生成加群の構造定理 }
  - { id: MOD2-THM-05, name: 有限生成 Abel 群の構造定理 }
  - { id: MOD2-PROP-03, name: 線形自己写像の多項式環加群は有限生成ねじれ加群 }
canonical_examples:
  - 整数行列 [[2,4],[6,8]] の Smith 標準形 diag(2,4)
  - Z^2/AZ^2 を Z/2Z と Z/4Z の直和として読む例
  - Z/12Z と Z/18Z を不変因子表示と基本因子表示で読み替える例
  - Z^2 の部分加群を階数 2 の自由加群として具体化する例
  - F[x]/((x-1)^2) を Jordan 型作用素の巡回加群として読む例
