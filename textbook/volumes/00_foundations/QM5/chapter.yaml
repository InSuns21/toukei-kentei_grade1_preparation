id: "QM5"
title: "非有界作用素と自己共役性"
volume: "foundations"
status: supplementary
prerequisites:
  - QM4
  - EVOL1
  - FOU4
official_scope: []
learning_objectives:
  - 稠密定義作用素の随伴を定義域込みで定義し、随伴作用素が閉作用素になることを証明できる
  - symmetric operator と self-adjoint operator の違いを作用素の包含と定義域の等号として説明できる
  - symmetric operator が可閉であることを稠密性と内積恒等式から証明できる
  - c00 上の最小対角作用素の随伴を計算し、最大対角作用素が自己共役であることを示せる
  - essential self-adjointness を閉包の自己共役性として説明し、最小対角作用素で具体的に確認できる
  - L2(R) 上の位置作用素の定義域を明示し、その自己共役性を随伴の定義から証明できる
  - L2 Fourier 変換を用いて運動量作用素を自己共役作用素として構成し、滑らかな関数上で -i hbar d/dx と一致することを示せる
  - 有限次元で symmetric と self-adjoint が一致する直観が無限次元で破れる理由を定義域から説明できる
