id: "GEO5"
title: "幾何学 V：ベクトル場・積分曲線・局所流・Lie 括弧"
volume: "foundations"
status: supplementary
prerequisites:
  - GEO2
  - ODE1
  - ODE4
official_scope: []
learning_objectives:
  - 滑らかなベクトル場を接束の滑らかな切断として定義し、局所座標で成分表示できる
  - ベクトル場が滑らかな関数環上の導分を定めることをLeibniz則から説明できる
  - 積分曲線を局所座標で自律常微分方程式へ落とし、局所存在・一意性を導ける
  - 解の初期値への滑らかな依存をPicard反復の縮小評価から追える
  - 局所解を一意性で貼り合わせ、最大積分曲線と最大流を構成できる
  - 最大流の局所群則・滑らかさ・局所微分同相性を証明できる
  - 完備ベクトル場を定義し、コンパクト多様体上の滑らかなベクトル場が完備であることを証明できる
  - 微分同相写像によるベクトル場の押し出しと流れの共役を計算できる
  - Lie括弧を導分の可換子として定義し、座標公式・積の法則・Jacobi恒等式を導ける
  - Lie括弧を流れによるベクトル場の一次変化として解釈し、可換流との関係を説明できる
  - 非零ベクトル場の直線化定理を局所流と逆関数定理から証明できる
