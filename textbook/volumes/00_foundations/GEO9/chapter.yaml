id: "GEO9"
title: "幾何学 IX：Poincaré の補題・de Rham コホモロジー入門"
volume: "foundations"
status: supplementary
prerequisites:
  - GEO7
  - GEO8
  - TOP3
official_scope: []
learning_objectives:
  - 閉形式と完全形式を定義し、完全形式が閉形式であることを d²=0 から証明できる
  - 穴あき平面の角度1形式が閉だが完全でないことを循環積分から示せる
  - 滑らかなホモトピーとホモトピー作用素を定義し、Cartan の公式からホモトピー公式を証明できる
  - 星型開集合の縮約ホモトピーから Poincaré の補題を構成的に証明できる
  - de Rham 複体と de Rham コホモロジーを定義し、完全形式による商の意味を説明できる
  - 連結多様体の H^0_dR が R に同型であることを局所定数性から証明できる
  - 滑らかにホモトープな写像が de Rham コホモロジー上で同じ引き戻しを誘導することを証明できる
  - H^1_dR(S^1)≅R を周期関数の原始関数と積分から直接計算できる
  - 穴あき平面を S^1 へ変形レトラクトし、H^1_dR(R²\{0})≅R と角度1形式による生成を説明できる
