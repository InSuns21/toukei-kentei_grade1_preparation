official_scope: []
learning_objectives:
  - 2体Coulomb系を重心・相対運動に分離し換算質量とHamiltonianを導ける
  - 三次元Hardy不等式からCoulombポテンシャルの相対作用素界0と自己共役性を証明できる
  - 回転対称性・角運動量作用素と球面調和関数の量子数を対応させられる
  - 部分波変換のユニタリ性・動径作用素・原点の正則条件を証明できる
  - 動径因数分解と絡み合い関係で負固有値を完全列挙できる
  - 相対コンパクト性によって本質スペクトルを決め負の連続スペクトルを排除できる
  - Laguerre多項式から規格化された波動関数と量子数ごとの重複度を計算できる
  - 束縛状態・連続スペクトル・測定確率・時間発展を区別できる
