<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" data-layout-lint="strict" viewBox="0 0 820 500" role="img" aria-labelledby="title desc">
  <title id="title">位置ベクトル・運動量・力と角運動量・トルクの向き</title>
  <desc id="desc">原点 O から質点 P へ位置ベクトル r を引き、P を始点として運動量 p と力 F を描く。r から p および F への外積がともに正の z 方向となる配置で、角運動量 L=r×p とトルク tau=r×F が紙面手前を向くことを示す。</desc>
  <rect width="820" height="500" fill="white"/>
  <defs>
    <marker id="arrow-r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
    <marker id="arrow-p" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0072B2"/>
    </marker>
    <marker id="arrow-f" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#D55E00"/>
    </marker>
  </defs>

  <circle cx="120" cy="380" r="7" fill="#1F2937"/>
  <circle cx="430" cy="180" r="9" fill="#1F2937"/>

  <line x1="128" y1="375" x2="421" y2="186" stroke="#374151" stroke-width="4" marker-end="url(#arrow-r)"/>
  <line x1="430" y1="180" x2="430" y2="72" stroke="#0072B2" stroke-width="5" marker-end="url(#arrow-p)"/>
  <line x1="430" y1="180" x2="312" y2="118" stroke="#D55E00" stroke-width="5" stroke-dasharray="12 7" marker-end="url(#arrow-f)"/>

  <circle cx="610" cy="235" r="25" fill="none" stroke="#0072B2" stroke-width="4"/>
  <circle cx="610" cy="235" r="5" fill="#0072B2"/>
  <circle cx="610" cy="325" r="25" fill="none" stroke="#D55E00" stroke-width="4" stroke-dasharray="9 6"/>
  <circle cx="610" cy="325" r="5" fill="#D55E00"/>

  <g font-family="Noto Sans CJK JP, sans-serif" font-size="22" fill="#1F2937">
    <text x="91" y="416">O</text>
    <text x="446" y="202">P</text>
    <text x="250" y="338">r</text>
    <text x="450" y="108" fill="#0072B2" font-weight="700">p</text>
    <text x="328" y="101" fill="#D55E00" font-weight="700">F</text>
    <text x="650" y="243" fill="#0072B2" font-weight="700">L = r × p</text>
    <text x="650" y="333" fill="#D55E00" font-weight="700">τ = r × F</text>
    <text x="585" y="402">⊙ : +z</text>
  </g>
</svg>
