  - { id: MECH4-THM-03, name: "角運動量の時間変化とトルク" }
  - { id: MECH4-THM-04, name: "トルクが 0 のときの角運動量保存" }
  - { id: MECH4-PROP-01, name: "位置ベクトルに平行な力と角運動量保存" }
canonical_examples:
  - "同じ速さで逆向きに動く質点の運動量と運動エネルギーの比較"
  - "一定力の力積から運動量変化を求める例"
  - "位置ベクトルと力からトルクを外積で計算する例"
  - "位置ベクトル・運動量・力・トルク・角運動量の幾何関係を同じ図で読む例"
  - "中心方向の力でトルクが 0 となり角運動量が保存する例"
  - "平面中心力で L_z=mρ^2θdot から角度方向を一階化する例"
  - "斜方投射で水平運動量保存と非保存の角運動量を同時に確認する例"
