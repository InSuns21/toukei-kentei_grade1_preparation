id: "MECH4"
title: "運動量・角運動量・保存則"
volume: "foundations"
status: supplementary
prerequisites:
  - MECH3
official_scope: []
learning_objectives:
  - 運動量 p=mv を定義し、一定質量で dp/dt=F_net と書けることを説明できる
  - 力積を時間積分として定義し、力積―運動量定理 Δp=J を導ける
  - 合力が 0 のとき運動量が保存し、力が 0 の成分では対応する運動量成分が保存することを判定できる
  - 固定基準点まわりのトルク τ=r×F と角運動量 L=r×p を定義し、外積の向きと単位を説明できる
  - 一定質量・固定基準点の下で dL/dt=τ を導ける
  - トルクが 0 のとき角運動量が保存することを示せる
  - 力が位置ベクトルに平行なら角運動量が保存し、L≠0 なら軌道が固定平面内にあることを証明できる
  - 平面運動で L_z=mρ^2θdot を導き、保存則が二階方程式を一階関係へ下げる意味を説明できる
  - 並進・回転の一様性と運動量・角運動量保存の対応を Noether の定理の予告として区別して説明できる
