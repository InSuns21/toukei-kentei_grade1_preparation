id: "RNG4"
title: "抽象代数 VIII：多項式環・Gauss の補題・既約多項式"
volume: "foundations"
status: supplementary
prerequisites:
  - RNG3
official_scope: []
learning_objectives:
  - 整域上の一変数多項式環、次数、先頭係数を定義し、積の次数公式と単元の特徴付けを証明できる
  - 体上の多項式除法を最高次項の消去から構成し、商と余りの一意性を証明できる
  - 次数を Euclid 関数として F[x] が Euclid 整域であることを示し、PID・UFD 性へ接続できる
  - UFD 上で多項式の content と原始多項式を定義し、具体例で原始部分を取り出せる
  - Gauss の補題「原始多項式の積は原始」を素元による係数追跡から証明できる
  - content の乗法性を Gauss の補題から導ける
  - 原始多項式の R[x] と分数体 K[x] における既約性が一致することを、分母払いと content から証明できる
  - R が UFD なら R[x] も UFD であることを、content と K[x] の一意分解へ分けて説明できる
  - 2次・3次多項式の既約性を根の有無で判定し、有理根定理を使って候補を有限化できる
  - Eisenstein の既約判定を証明し、直接適用と変数平行移動による適用ができる
