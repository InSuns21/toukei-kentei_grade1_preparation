chapter: QM8
scope: dream-theater
coverage: complete
prerequisites:
  - QM7

forward_references: []

concepts:
  - id: quantum.canonical-commutation-relation
    name: 正準交換関係
    kind: definition
    aliases: ["CCR", "canonical commutation relation"]
    introduction: formal
    introduction_aliases: ["定義（共通不変領域上の正準交換関係）"]
    requires:
      - quantum.commutator
      - quantum.position-operator-self-adjoint
      - quantum.momentum-operator-fourier

  - id: quantum.bounded-ccr-impossibility
    name: 有界作用素による CCR の不可能性
    kind: proposition
    aliases: ["bounded CCR impossibility", "Wintner theorem for the canonical commutation relation"]
    introduction_aliases: ["命題（有界作用素では正準交換関係を満たせない）"]
    requires:
      - quantum.canonical-commutation-relation

  - id: quantum.schrodinger-weyl-unitaries
    name: Schrödinger 表現の平行移動と位相変調
    kind: proposition
    aliases: ["Schrodinger translation and modulation unitaries"]
    introduction_aliases: ["命題（Schrödinger 表現の平行移動と位相変調）"]
    requires:
      - quantum.stone-theorem
      - quantum.position-operator-self-adjoint
      - quantum.momentum-operator-fourier

  - id: quantum.weyl-relations
    name: Weyl 関係
    kind: definition
    aliases: ["Weyl relations", "Weyl commutation relations"]
    introduction: formal
    introduction_aliases: ["定義（Weyl 関係）"]
    requires:
      - quantum.schrodinger-weyl-unitaries
      - quantum.strongly-continuous-unitary-group

  - id: quantum.weyl-differentiation-ccr
    name: Weyl 関係の微分による CCR
    kind: proposition
    aliases: ["differentiation of Weyl relations to CCR"]
    introduction_aliases: ["命題（Weyl 関係の微分から CCR を得る）"]
    requires:
      - quantum.weyl-relations
      - quantum.canonical-commutation-relation
      - quantum.stone-theorem

  - id: quantum.irreducible-weyl-pair
    name: 既約な Weyl 対
    kind: definition
    aliases: ["irreducible Weyl pair", "irreducible Weyl representation"]
    introduction: formal
    introduction_aliases: ["定義（既約な Weyl 対）"]
    requires:
      - quantum.weyl-relations

  - id: quantum.stone-von-neumann-theorem
    name: Stone--von Neumann の定理
    kind: theorem
    aliases: ["Stone-von Neumann theorem", "Stone--von Neumann theorem"]
    introduction_aliases: ["定理（Stone--von Neumann の定理：1自由度 Weyl 形式）"]
    requires:
      - quantum.weyl-relations
      - quantum.irreducible-weyl-pair
