learning_objectives:
  - F0-02C3で正本化したFréchet連鎖律を残差評価から再構成できる
  - 合成写像の中間増分がO(||h||)になることを示し、二つの残差がo(||h||)になる理由を説明できる
  - Riesz表現定理を適用する前にx↦<Tx,y>が連続線形汎関数であることを確認できる
  - Riesz表現定理からHilbert随伴の存在・線形性・有界性・一意性を導ける
  - Hilbert随伴について||T†||=||T||を証明できる
  - 連鎖律と随伴を組み合わせて最小二乗汎関数を微分できる
