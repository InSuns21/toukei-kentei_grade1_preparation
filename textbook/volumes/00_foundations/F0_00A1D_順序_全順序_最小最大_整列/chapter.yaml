id: "F0-00A1D"
title: "順序集合：半順序・全順序・極値・整列"
volume: "foundations"
status: supplementary
prerequisites:
  - SET-U1
  - SET-U3
official_scope: []
learning_objectives:
  - 半順序と全順序を定義し、比較不能な元を持つ具体例を判定できる
  - 鎖を半順序集合の部分集合として定義し、全順序との関係を説明できる
  - 最小元・最大元と極小元・極大元を有限半順序集合で区別できる
  - 半順序集合の部分集合に対する上界・下界を定義し、具体例で求められる
  - 順序保存写像と順序同型を定義し、具体的な写像が順序同型か判定できる
  - 整列と全順序、整列可能性を区別できる
  - 辞書式順序の整列性を二段階の最小元選択から証明できる
