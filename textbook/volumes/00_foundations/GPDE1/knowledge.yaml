chapter: GPDE1
scope: dream-theater
coverage: complete
prerequisites:
  - PDE7
  - MT4
  - F0-02C2

concepts:
  - id: distribution.test-function
    name: テスト関数
    kind: definition
    aliases: [test function, C_c^infty]
    introduction: formal
    introduction_aliases: ["定義（テスト関数とテスト関数空間）"]

  - id: distribution.test-function-convergence
    name: テスト関数列の収束
    kind: definition
    aliases: [D収束, test-function convergence]
    introduction: formal
    introduction_aliases: ["定義（テスト関数列の収束）"]
    requires:
      - distribution.test-function

  - id: distribution.schwartz-distribution
    name: Schwartz 超関数
    kind: definition
    aliases: [超関数, distribution, Schwartz distribution]
    introduction: formal
    introduction_aliases: ["定義（超関数）"]
    requires:
      - distribution.test-function-convergence

  - id: distribution.local-finite-order-estimate
    name: 超関数の局所有限階評価
    kind: proposition
    aliases: [局所有限階評価, local finite-order estimate]
    introduction: formal
    introduction_aliases: ["命題（超関数の局所有限階評価）"]
    requires:
      - distribution.schwartz-distribution

  - id: distribution.regular-distribution
    name: 正則超関数
    kind: definition
    aliases: [regular distribution]
    introduction: formal
    introduction_aliases: ["定義（正則超関数）"]
    requires:
      - distribution.schwartz-distribution

  - id: distribution.locally-integrable-gives-distribution
    name: 局所可積分関数が定める超関数
    kind: proposition
    aliases: [regular distribution construction]
    introduction: formal
    introduction_aliases: ["命題（局所可積分関数は超関数を定める）"]
    requires:
      - distribution.regular-distribution
      - distribution.local-finite-order-estimate

  - id: distribution.dirac-delta
    name: Dirac のデルタ超関数
    kind: definition
    aliases: [Dirac delta, delta distribution, Dirac delta distribution]
    introduction: formal
    introduction_aliases: ["定義（Dirac のデルタ超関数）"]
    requires:
      - distribution.schwartz-distribution

  - id: distribution.distributional-convergence
    name: 超関数の収束
    kind: definition
    aliases: [distributional convergence]
    introduction: formal
    introduction_aliases: ["定義（超関数の収束）"]
    requires:
      - distribution.schwartz-distribution

  - id: distribution.distributional-solution
    name: 超関数解
    kind: definition
    aliases: [distributional solution, distribution solution]
    introduction: formal
    introduction_aliases: ["定義（Poisson 方程式の超関数解）"]
    requires:
      - distribution.regular-distribution
      - distribution.test-function

  - id: distribution.classical-poisson-implies-distributional
    name: 古典 Poisson 解は超関数解
    kind: proposition
    aliases: [classical implies distributional]
    introduction: formal
    introduction_aliases: ["命題（古典 Poisson 解は超関数解である）"]
    requires:
      - distribution.distributional-solution
