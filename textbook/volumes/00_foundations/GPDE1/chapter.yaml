id: "GPDE1"
title: "Encore III Graduate PDE I：テスト関数・distribution"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00D2
  - F0-02C2
official_scope: []
learning_objectives:
  - テスト関数とその収束を、共通コンパクト台と全階偏微分の一様収束から説明できる
  - distributionをテスト関数空間上の連続線形汎関数として定義し、局所的な有限階評価で連続性を検証できる
  - 局所可積分関数から正則distributionを構成し、連続性を直接証明できる
  - Dirac deltaを点評価distributionとして定義・検証し、正則distributionとの違いを説明できる
  - distributionの収束を作用の収束として扱い、Gaussian近似からdeltaへの収束を証明できる
  - Poisson方程式のdistributional solutionをテスト関数恒等式で定義し、古典解がdistributional solutionになることを証明できる
  - PDE6の基本解やPDE1のBurgers shockがdistributionの言葉を必要とする地点を説明できる
