id: "GPDE1"
title: "大学院偏微分方程式 I：テスト関数・Schwartz 超関数"
volume: "foundations"
status: supplementary
prerequisites:
  - PDE7
  - MT4
  - F0-02C2
official_scope: []
learning_objectives:
  - テスト関数とその収束を、共通コンパクト台と全階偏微分の一様収束から説明できる
  - Schwartz 超関数をテスト関数空間上の連続線形汎関数として定義し、局所有限階評価で連続性を検証できる
  - 局所可積分関数から正則超関数を構成し、連続性を直接証明できる
  - Dirac のデルタ超関数を点評価として定義・検証し、正則超関数との違いを説明できる
  - 超関数の収束を作用の収束として扱い、Gauss 核近似からデルタ超関数への収束を証明できる
  - Poisson 方程式の超関数解をテスト関数恒等式で定義し、古典解が超関数解になることを証明できる
  - PDE6 の基本解や PDE1 の Burgers の衝撃波が超関数の言葉を必要とする地点を説明できる
