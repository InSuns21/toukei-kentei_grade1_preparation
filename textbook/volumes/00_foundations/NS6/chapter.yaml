id: "NS6"
title: "スケーリング・臨界性・どのノルムを見るべきか"
volume: "foundations"
status: supplementary
prerequisites:
  - NS5
  - VC9
  - FOU4
official_scope: []
learning_objectives:
  - 三次元全空間の無外力 Navier--Stokes 方程式に u_lambda(x,t)=lambda u(lambda x,lambda^2 t)、p_lambda(x,t)=lambda^2 p(lambda x,lambda^2 t) を代入し、全項が同じ lambda^3 で変換されることを連鎖律から確認できる
  - Lp ノルムの尺度指数 1-3/p を変数変換から導き、L2 が超臨界、L3 が臨界、p>3 が劣臨界であることを定義に基づいて判定できる
  - 時空間ノルム Lq_t Lp_x の尺度指数 1-3/p-2/q を導き、2/q+3/p=1 が臨界線になることを説明できる
  - エネルギー量と粘性散逸がともに lambda^(-1) で変換されることを計算し、エネルギー不等式が尺度整合的でも三次元正則性には超臨界である理由を説明できる
  - Fourier 変換から斉次 Sobolev ノルムの尺度指数 s-1/2 を導き、dot H^(1/2) が三次元 Navier--Stokes の臨界空間であることを示せる
  - NS5 の H1 制御、L2 エネルギー、L3・dot H^(1/2) の臨界量を尺度の観点から比較し、それぞれが正則性問題で持つ役割を区別できる
  - 臨界量であることと、その量に対する大域事前評価や正則性判定が証明済みであることを混同せず、NS7 への課題を明確にできる
definitions:
  - { id: NS6-DEF-01, name: "Navier--Stokes の尺度変換" }
  - { id: NS6-DEF-02, name: "尺度に関する劣臨界・臨界・超臨界" }
  - { id: NS6-DEF-03, name: "斉次 Sobolev ノルム" }
theorems:
  - { id: NS6-PROP-01, name: "三次元 Navier--Stokes の尺度不変性" }
  - { id: NS6-PROP-02, name: "Lp ノルムの尺度則" }
  - { id: NS6-PROP-03, name: "時空間 Lq_t Lp_x ノルムの尺度則" }
  - { id: NS6-PROP-04, name: "斉次 Sobolev ノルムの尺度則" }
canonical_examples:
  - "u_0(x)=(-2x_2,2x_1,0)exp(-|x|^2) を lambda u_0(lambda x) へ集中させ、発散零が保たれることを直接確認する"
  - "p=2,3,6 に対する Lp 尺度指数 -1/2,0,1/2 を比較する"
  - "L-infinity_t L3_x、L4_t L6_x、L2_t L-infinity_x が同じ臨界線上にあることを指数計算で確認する"
  - "エネルギーと散逸がともに lambda^(-1) で変換される一方、L3 と dot H^(1/2) は不変であることを比較する"
  - "dot H^0、dot H^(1/2)、dot H^1 の尺度指数 -1/2,0,1/2 を Fourier 変換から比較する"
