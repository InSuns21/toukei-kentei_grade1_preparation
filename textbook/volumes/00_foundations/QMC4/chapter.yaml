id: "QMC4"
title: "(t,m,s)-net・(t,s)-sequence"
volume: "foundations"
status: supplementary
prerequisites:
  - QMC1
  - FLD3
  - F0-00E
official_scope: []
learning_objectives:
  - b 進基本区間を定義し、指数和から体積と解像度を計算できる
  - 底 b の (t,m,s)-ネットを定義し、t が小さいほど細かな基本区間まで点数を正確に制御することを説明できる
  - (t,m,s)-ネットが t' >= t に対して (t',m,s)-ネットでもあることを基本区間の細分から証明できる
  - (t,m,s)-ネットの粗い b 進箱で点数割合が体積と一致することを証明し、自己完結なスター・ディスクレパンシー上界を導ける
  - (t,s)-点列を整列ブロック条件として定義し、全ブロック条件が一様分布の証明で必要になる理由を説明できる
  - 根基逆関数を定義し、van der Corput 点列が (0,1)-点列になることを b 進桁の全パターンから証明できる
  - 素数底の有限体上で生成行列からデジタル点集合を構成し、具体的な生成行列から点を計算できる
  - 生成行列の先頭行ベクトルの一次独立性と (t,m,s)-ネット条件が同値であることを連立一次方程式の解数から証明できる
  - Sobol・Faure・Niederreiter 点列を生成行列型デジタル点列の代表例として位置付け、QMC5 の Walsh 双対理論への接続を説明できる
