  - { id: QMC4-THM-02, name: (t,m,s)-ネットの粗いスター・ディスクレパンシー上界 }
  - { id: QMC4-THM-03, name: van der Corput 点列は (0,1)-点列 }
  - { id: QMC4-THM-04, name: (t,s)-点列の一様分布 }
  - { id: QMC4-THM-05, name: 生成行列の一次独立性による (t,m,s)-ネット判定 }
canonical_examples:
  - 底2の4点集合で (0,2,2)-ネットを基本区間の三種類から直接確認する例
  - 対角4点集合が各座標では均等でも (0,2,2)-ネットではなく (1,2,2)-ネットになる失敗例
  - phi_2(6)=3/8 を二進桁反転から計算する例
  - 反転行列と単位行列から底2の4点デジタルネットを生成する例
  - 生成行列の先頭行を重複させると t が悪化し、座標間相関として現れる例
