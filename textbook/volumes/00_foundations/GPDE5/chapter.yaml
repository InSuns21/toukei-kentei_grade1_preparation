id: "GPDE5"
title: "Sobolev 埋め込み・コンパクト性"
volume: "foundations"
status: supplementary
prerequisites:
  - GPDE4
  - FA3
official_scope: []
learning_objectives:
  - 連続埋め込みとコンパクト埋め込みを定義し、両者の違いを列の収束性で説明できる
  - 1<=p<dでSobolev共役指数p*=dp/(d-p)が尺度変換から必然になることを導出できる
  - R^d上のW^{1,1} Sobolev不等式を座標方向の微分積分と関数型Loomis--Whitney不等式から証明できる
  - べき変換とHolder不等式から1<p<dのSobolev不等式を証明し、W^{1,p}(R^d)へ密度で延長できる
  - 有界 Lipschitz 領域上の拡張定理がSobolev 埋め込みに使われる位置と領域仮定を説明できる
  - p>d で Morrey 型連続性が現れ、p<dの積分可能性向上と役割が変わることを説明できる
  - Hilbert空間の有界列から弱収束部分列を抽出する対角線論法を再構成できる
  - H_0^1の零延長に対する平行移動評価を証明できる
  - L2 の平行移動コンパクト性補題を有限次元近似から証明できる
  - 有界開集合上でH_0^1がL2へコンパクトに埋め込まれるRellich--Kondrachovの標準形を証明できる
  - H_0^1での弱収束部分列とL2での強収束部分列の極限が一致することを証明できる
  - 臨界 Sobolev 指数でコンパクト性が壊れる集中列を尺度計算から構成できる
