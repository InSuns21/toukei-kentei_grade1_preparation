  - { id: ODE7-THM-02, name: 分離型境界条件による境界形式の消滅 }
  - { id: ODE7-THM-03, name: 固有値の実数性 }
  - { id: ODE7-THM-04, name: 異なる固有値に属する固有関数の直交性 }
  - { id: ODE7-THM-05, name: 分離型問題の固有値の単純性 }
  - { id: ODE7-THM-06, name: Dirichlet問題のRayleigh商 }
  - { id: ODE7-THM-07, name: 共鳴時の必要可解条件 }
