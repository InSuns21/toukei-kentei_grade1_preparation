id: "STO4"
title: "Encore IV Stochastic Analysis IV：Brown 運動・hitting time・strong Markov property"
volume: "foundations"
status: supplementary
prerequisites:
  - STO3
official_scope: []
learning_objectives:
  - Gaussian processを有限次元Gaussian vectorとして定義し、covariance kernelが有限次元分布を決めることを説明できる
  - covariance min(s,t)のpositive semidefinitenessを確認し、Kolmogorov extension theoremからGaussian processを構成できる
  - Gaussian incrementの第4momentとKolmogorov--Chentsov continuity theoremからcontinuous Brownian motionを構成できる
  - covariance計算からstationary independent incrementsを導き、Brownian scalingを証明できる
  - Brownian natural filtrationに対するdeterministic-time Markov propertyを条件付き期待値の形で導ける
  - stopping timeのdyadic approximationからstrong Markov propertyの核心証明を再構成できる
  - Brownian hitting timeがstopping timeであることをpath continuityから確認できる
  - strong Markov propertyからreflection principleを証明し、hitting timeの累積分布関数とdensityを導ける
  - hitting probability 1とinfinite meanを区別し、1次元Brownian motionの基本的recurrenceを証明できる
  - scalingとreflection principleを使ってBrownian time inversionを確認できる
