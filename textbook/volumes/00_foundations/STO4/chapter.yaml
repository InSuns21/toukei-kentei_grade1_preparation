id: "STO4"
title: "Encore IV 確率解析 IV：ブラウン運動・到達時刻・強マルコフ性"
volume: "foundations"
status: supplementary
prerequisites:
  - STO3
official_scope: []
learning_objectives:
  - STO3で定義したガウス過程を用い、平均関数と共分散核が有限次元分布を決めることを説明できる
  - 共分散 min(s,t)の半正定値性を確認し、STO3のガウス過程構成定理を適用してブラウン運動の基礎過程を構成できる
  - Gaussian incrementの第4momentとKolmogorov--Chentsov continuity theoremからcontinuous ブラウン運動を構成できる
  - 共分散計算からstationary independent incrementsを導き、ブラウン scalingを証明できる
  - ブラウン自然なフィルトレーションに対するdeterministic-time マルコフ性を条件付き期待値の形で導ける
  - 停止時刻のdyadic approximationから強マルコフ性の核心証明を再構成できる
  - ブラウン到達時刻が停止時刻であることをpath continuityから確認できる
  - 強マルコフ性から反射原理を証明し、到達時刻の累積分布関数とdensityを導ける
  - hitting probability 1とinfinite meanを区別し、1次元ブラウン運動の基本的再帰性を証明できる
  - scalingと反射原理を使ってブラウン時間反転を確認できる
