    requires:
      - operator-algebra.bounded-borel-functional-calculus
      - operator-algebra.commutative-representation-pvm

  - id: operator-algebra.gns-spectral-distribution
    name: GNS 表現でのスペクトル分布の回収
    kind: proposition
    aliases: ["spectral distribution in the GNS representation"]
