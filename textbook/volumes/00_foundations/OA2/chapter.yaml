id: "OA2"
title: "可換 Banach 環と Gelfand 変換"
volume: "foundations"
status: supplementary
prerequisites:
  - OA1
  - FA3
  - FA4
  - F0-00A3
official_scope: []
learning_objectives:
  - 可換複素単位的 Banach 環の character を定義し、character が自動的に連続・ノルム1で、その値が元のスペクトルに属することを証明できる
  - 極大イデアルが閉であることを示し、Zorn の補題で任意の真のイデアルを極大イデアルへ延長できる
  - Gelfand--Mazur の定理を OA1 のスペクトル非空性から証明し、character と極大イデアルの対応を導ける
  - character 空間に弱*位相の部分空間位相として Gelfand 位相を入れ、Banach--Alaoglu からコンパクト Hausdorff 性を証明できる
  - Gelfand 変換 a↦â を定義し、単位的代数準同型・縮小写像であることを確認できる
  - 可換 Banach 環で σ_A(a)=â(Δ(A)) を証明し、||â||∞=r(a) を導ける
  - C(K) の評価 character と、冪零元を持つ可換 Banach 環で Gelfand 変換が単射でない例を説明できる
