  - { id: OA2-PROP-02, name: "極大イデアルは閉" }
  - { id: OA2-LEM-01, name: "真のイデアルの極大イデアルへの延長" }
  - { id: OA2-THM-01, name: "Gelfand--Mazur の定理" }
  - { id: OA2-THM-02, name: "character と極大イデアルの対応" }
  - { id: OA2-THM-03, name: "character 空間のコンパクト Hausdorff 性" }
