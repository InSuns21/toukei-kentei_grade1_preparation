id: "TOP5A"
title: "標準位相 V-A：Urysohn の補題・局所コンパクト性・cutoff"
volume: "foundations"
status: supplementary
prerequisites:
  - TOP4
  - TOP5
official_scope: []
learning_objectives:
  - 正規性とT4、局所コンパクト性と局所コンパクトHausdorffを本教材の規約に沿って区別できる
  - コンパクトHausdorff空間が正規であることを、Hausdorff分離と二段階の有限部分被覆から証明できる
  - 正規空間の縮小補題を、閉集合FとX\\Uの分離から証明できる
  - Urysohnの補題を二進有理数による開集合族の構成から証明し、正規性が働く箇所を説明できる
  - 局所コンパクトHausdorff空間で開近傍をコンパクト閉包を持つ開集合へ縮小できる
  - 関数の台とC_c(X)を定義し、具体例について台を計算できる
  - コンパクト集合–開集合cutoffをUrysohnの補題・局所コンパクト性・コンパクト性から構成できる
