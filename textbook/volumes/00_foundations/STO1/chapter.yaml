id: "STO1"
title: "Encore IV 確率解析 I：確率過程・フィルトレーション・停止時刻"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00P1
  - F0-00P3C
official_scope: []
learning_objectives:
  - 確率過程を確率変数族として定義し、標本路・修正・識別不能性を区別できる
  - フィルトレーションと通常条件を定義し、有限情報モデルで各sigma代数を直接確認できる
  - 適合過程と自然なフィルトレーションを定義し、時刻ごとの可測性を検証できる
  - 発展的可測性を定義し、right-continuous 適合過程がprogressiveであることを証明できる
  - 予測可能 σ-代数と予測可能過程を定義し、単純予測可能過程の可測性を生成集合から確認できる
  - 停止時刻を定義し、離散時間の初到達時刻と連続pathのclosed-set 到達時刻が停止時刻になることを証明できる
  - 停止過程と停止時刻までのsigma代数 F_tau を定義し、F_tauがsigma代数であることと S<=T なら F_S subset F_T を証明できる
  - progressive processを停止時刻で評価した X_tau のF_tau可測性と停止過程のadaptednessを証明できる
  - 未来情報を使うランダム時刻が停止時刻でない理由を情報構造から判定できる
