id: "F0-00TS2"
title: "Encore IV：Herglotz定理・spectral measure・spectral density"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00D4
  - F0-00P2
  - F0-00TS1
  - F0-00FA2
official_scope: []
learning_objectives:
  - 正定値列を定義し自己共分散列が正定値になることを示せる
  - Herglotz定理をFejer型近似測度と弱収束部分列から証明できる
  - Herglotz表現の一意性をFejer近似から証明できる
  - spectral measureを自己共分散のFourier表現として定義できる
  - spectral densityをRadon--Nikodym密度として定義できる
  - 自己共分散の絶対可算和可能性からspectral densityを導ける
  - white noiseのflat spectrumとsinusoidのline spectrumを導ける
  - spectral representation theoremの位置づけを説明できる
  - periodogramと真のspectral densityを区別できる
definitions:
  - { id: F000TS2-DEF-01, name: 正定値列 }
  - { id: F000TS2-DEF-02, name: spectral measure }
  - { id: F000TS2-DEF-03, name: spectral density }
  - { id: F000TS2-DEF-04, name: periodogram }
theorems:
  - { id: F000TS2-THM-01, name: Herglotz定理 }
  - { id: F000TS2-THM-02, name: 絶対可算和可能な自己共分散のspectral density }
canonical_examples:
  - white noiseのflat spectrum
  - 指数型自己共分散のspectral density
  - random phase sinusoidのline spectrum
