id: "F0-01"
title: "統計のための微積分・線形代数・答案記法"
volume: "foundations"
status: reviewed
prerequisites: []
official_scope:
  - 変数変換
  - 固有値
  - 固有ベクトル
  - 線形結合
learning_objectives:
  - 確率密度関数の正規化、期待値、分散を積分から計算できる
  - 一変数・多変数の微分を尤度最大化とデルタ法に使える
  - ヤコビアンを用いた変数変換の立式ができる
  - 二次形式、正定値性、固有値分解、射影行列を統計モデルの形で扱える
  - 必要条件と十分条件、同値変形と一方向の含意を区別して答案を書ける
  - 詳細解答を20〜30分の本番答案へ圧縮できる
