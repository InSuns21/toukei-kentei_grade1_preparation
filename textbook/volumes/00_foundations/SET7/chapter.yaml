id: "SET7"
title: "Hartogs の補題：選択公理なしで大きすぎる順序数を作る"
volume: "foundations"
status: supplementary
prerequisites:
  - SET4
  - SET6
official_scope: []
learning_objectives:
  - 集合 X の部分集合上の整列全体を一つの集合に収められる理由を説明できる
  - 各整列の順序型を置換公理図式で集合として集められることを説明できる
  - X へ単射できない順序数を構成して Hartogs の補題を証明できる
  - Hartogs 数 h(X) の最小性を使える
  - 順序数 alpha の h(alpha) が alpha より大きい基数になることを証明できる
  - Hartogs の補題で選択公理を使っていないことを公理使用箇所から確認できる
definitions:
  - { id: SET7-DEF-01, name: X の部分集合上の整列の集合 }
  - { id: SET7-DEF-02, name: X 内で実現される順序型の集合 }
  - { id: SET7-DEF-03, name: Hartogs 数 }
theorems:
  - { id: SET7-LEM-01, name: gamma_X は X へ単射できない }
  - { id: SET7-THM-01, name: Hartogs の補題 }
  - { id: SET7-THM-02, name: 順序数の Hartogs 数はより大きい基数 }
  - { id: SET7-COR-01, name: 次の基数 }
canonical_examples:
  - 有限集合の Hartogs 数
  - aleph_1=h(omega)
  - AC から整列可能定理への停止保証
problem_patterns:
  - HARTOGS-CONSTRUCTION-1
  - HARTOGS-CARDINAL-1
  - AC-WELLORDER-STOPPING-1
past_exam_alignment: []
integrated_exam_problems: []
exercise_counts: { level_a: 4, level_b: 3, level_c: 1, level_d: 0 }
estimated_hours: { reading: 3.0, exercises: 2.5, review: 0.7 }
