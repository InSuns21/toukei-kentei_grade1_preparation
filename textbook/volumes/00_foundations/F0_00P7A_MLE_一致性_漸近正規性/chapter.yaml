id: "F0-00P7A"
title: "最尤推定量の一致性・漸近正規性"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00P7
  - F0-00P5
  - F0-00P6A
official_scope: []
learning_objectives:
  - 最尤推定量を定義し、点ごとの大数の法則と一様大数の法則の違いを説明できる
  - カルバック・ライブラー情報量から期待対数尤度が真値で最大になる理由を導ける
  - 一様収束と一意最大性から最尤推定量の一致性を証明できる
  - 一致性がTaylor展開の中間点を真値近傍へ閉じ込める役割を説明できる
  - スコア和の中心極限定理と2階微分の大数の法則をSlutskyの定理で合成できる
  - 1次元正則モデルの最尤推定量の漸近正規性を途中式から再構成できる
