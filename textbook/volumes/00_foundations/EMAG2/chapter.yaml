id: "EMAG2"
title: "Gauss の法則と静電場"
volume: "foundations"
status: supplementary
prerequisites:
  - EMAG1
  - VC3
  - VC4
  - VC9
official_scope: []
learning_objectives:
  - 向き付けられた曲面を貫く電束を定義し、閉曲面では外向き法線を用いる理由を説明できる
  - Gauss の法則を静電場の物理原理として読み、Gauss--Ostrogradsky の発散定理という数学定理と区別できる
  - Coulomb 場の閉曲面流束を、原点を除いた領域への発散定理から計算し、閉曲面の形に依らないことを示せる
  - 電荷配置の対称性から電場の向きと大きさの依存変数を先に絞り、計算に適した Gauss 面を選べる
  - 球対称電荷分布について包有電荷 Q(r) から電場を導き、一様帯電球・球殻を扱える
  - 無限直線電荷・無限円柱の円筒対称性から電場を導ける
  - 無限平面電荷・無限平板の平面対称性から電場を導ける
  - 正則な領域で積分形から div E=rho/epsilon_0 を導き、逆向きも Gauss--Ostrogradsky の発散定理で戻せる
  - 点電荷では通常の関数としての発散が原点で定義できず、三次元 delta 分布が局所式を補う理由を説明できる
  - 閉曲面の総電束が 0 でも電場そのものが 0 とは限らないことを反例で説明できる
definitions:
  - { id: EMAG2-DEF-01, name: "電束" }
  - { id: EMAG2-DEF-02, name: "Gauss 面" }
theorems:
  - { id: EMAG2-PROP-01, name: "Coulomb 場の閉曲面流束" }
  - { id: EMAG2-PROP-02, name: "球対称電荷分布の電場" }
  - { id: EMAG2-PROP-03, name: "無限直線電荷の電場" }
  - { id: EMAG2-PROP-04, name: "無限平面電荷の電場" }
canonical_examples:
  - "一様電場が平面を貫く電束を E A cos(theta) として計算する例"
  - "点電荷を囲む任意の閉曲面の電束が Q/epsilon_0 になることを穿孔領域で示す例"
  - "一様帯電球の内外の電場を球対称性と包有電荷から導く例"
  - "無限直線電荷の電場を円筒形 Gauss 面から導く例"
  - "無限平面電荷の電場を薄い円柱形 Gauss 面から導く例"
