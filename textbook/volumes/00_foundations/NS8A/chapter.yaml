  - NS-2026-TRANSPORT-VISCOSITY-BALANCE-1
  - NS-2026-SMOOTH-RESIDUAL-1
  - NS-2026-CD-MAPPING-1
  - NS-2026-LEAN-CMI-DISTINCTION-1
