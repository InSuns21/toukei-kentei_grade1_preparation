id: "NPDE2"
title: "entropy solution・選択原理・L1 contraction"
volume: "foundations"
status: supplementary
prerequisites:
  - NPDE1
  - GPDE2
official_scope: []
learning_objectives:
  - entropy / entropy flux pair を q'(u)=eta'(u)f'(u) から構成し、滑らかな保存則で entropy 等式を導ける
  - 粘性保存則から凸 entropy の散逸不等式を導き、entropy condition が追加選択原理であることを説明できる
  - 一本の跳躍に対して entropy jump condition [q]-s[eta]<=0 を導出し、Burgers の圧縮 shock と expansion shock を判別できる
  - 狭義凸流束の Lax 圧縮条件と chord による Oleinik 型条件の位置付けを説明できる
  - Kruzhkov entropy pair と Kruzhkov entropy solution を定義し、凸 Riemann 問題で shock / rarefaction を選別できる
  - doubling of variables から Kato 型不等式を導く核心を追跡できる
  - Kato 型不等式から局所 L1 評価・L1 contraction・entropy solution の一意性を導ける
  - vanishing viscosity の局所 L1 極限が entropy inequality を満たすことを導ける
