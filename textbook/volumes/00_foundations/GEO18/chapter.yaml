id: "GEO18"
title: "幾何学 XVIII：比較幾何入門"
volume: "foundations"
status: supplementary
prerequisites:
  - GEO15
  - GEO17
official_scope: []
learning_objectives:
  - 定断面曲率の模型空間と比較関数 s_kappa を定義し、s_kappa''+kappa s_kappa=0 と初期条件から Euclid・球面・双曲模型の法 Jacobi 場を統一的に記述できる
  - 法 Jacobi 場 J の長さ f=|J| に対して f''+kappa f の符号を断面曲率上界から導き、Rauch の比較定理の定曲率模型版を証明できる
  - 断面曲率 K<=kappa から最初の共役点の出現時刻を模型空間と比較し、K<=0 では共役点がないことを定量化できる
  - Ricci 曲率下界 Ric>=(n-1)kappa g, kappa>0 の下で平行法標構と試験ベクトル場を指数形式へ代入し、Bonnet--Myers の直径評価を証明できる
  - 完備性と Bonnet--Myers の直径評価から多様体のコンパクト性を Hopf--Rinow の定理を用いて導ける
  - 非正断面曲率の下で指数写像の微分が長さを縮めないことを Jacobi 場比較と Gauss の補題から証明できる
  - 完備な非正曲率多様体で指数写像が被覆写像になる機構を、局所逆写像の長さ制御と完備性から説明できる
  - 単連結性を定義し、Cartan--Hadamard の定理から完備単連結非正曲率多様体が Euclid 空間と微分同相であることを導ける
  - 正曲率下限・断面曲率上限・非正曲率が、それぞれ直径・共役点・指数写像・大域位相へどのように効くかを区別して説明できる
