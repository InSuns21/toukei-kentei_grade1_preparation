  - { id: GEO18-THM-02, name: Bonnet--Myers の定理 }
  - { id: GEO18-LEM-02, name: 拡大局所微分同相の被覆補題 }
  - { id: GEO18-THM-03, name: Cartan--Hadamard の定理 }
