id: "CA6"
title: "標準複素解析 VI：Möbius変換・Schwarz補題・調和関数・Poisson核"
volume: "foundations"
status: supplementary
prerequisites:
  - CA5
official_scope: []
learning_objectives:
  - Riemann球面上のMöbius変換を局所座標まで含めて全単射・等角と示し、一般化円の保存を基本変換への分解から証明できる
  - 円板自己同型の標準写像を直接計算し、Schwarz lemmaの最大値原理による証明と等号成立条件から自己同型を分類できる
  - C2調和関数から局所的な正則関数を構成し、Cauchy平均値公式を介して平均値性質と最大・最小値原理を導ける
  - Poisson kernelの非負性・質量1・境界から離れた質量消失を個別に証明し、Poisson積分の調和性と連続境界値への一様収束を導ける
  - Poisson積分の一意性を調和関数の最大・最小値原理から示し、Fourier級数表示を幾何級数から導ける
