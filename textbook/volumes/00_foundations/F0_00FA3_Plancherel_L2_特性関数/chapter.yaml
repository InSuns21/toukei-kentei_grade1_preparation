learning_objectives:
  - L2(R)の平行移動連続性を証明できる
  - Gaussian approximate identityのL2収束を証明できる
  - L1∩L2上でPlancherel等式をGaussian cutoffから証明できる
  - L1∩L2がL2に稠密であることを具体的な切断列で示せる
  - L2 Fourier変換を稠密部分空間からの極限として定義できる
  - Plancherel等式を全L2へ連続拡張できる
  - 正規化Fourier変換の可逆性とユニタリ性を説明できる
  - Parseval等式とPlancherel定理の関係を説明できる
