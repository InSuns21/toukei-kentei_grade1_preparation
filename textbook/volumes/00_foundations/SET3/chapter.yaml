  - { id: SET3-PROP-01, name: 後続段階だけでは極限を越えられない }
  - { id: SET3-PROP-02, name: 順序数の元は真の部分集合 }
  - { id: SET3-PROP-03, name: 極限順序数は以前の段階の合併 }
canonical_examples:
  - 最小反例法
  - alpha<omega という後続閉性だけでは omega を越えない例
  - 極限順序数の合併表示
