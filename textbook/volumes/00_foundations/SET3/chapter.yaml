id: "SET3"
title: "超限帰納法：極限段階を含む帰納法"
volume: "foundations"
status: supplementary
prerequisites:
  - SET2
official_scope: []
learning_objectives:
  - 超限帰納法を最小反例法から証明できる
  - 自然数上の強い帰納法と超限帰納法の共通点と違いを説明できる
  - 初期・後続・極限の三段階版を一般形から導ける
  - 後続段階だけでは極限順序数を越えられない反例を説明できる
  - 極限順序数を以前の段階の合併として表す公式を証明できる
definitions:
