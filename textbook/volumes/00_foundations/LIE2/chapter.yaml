id: "LIE2"
title: "Lie 理論 II：1パラメータ部分群・指数写像・随伴表現"
volume: "foundations"
status: supplementary
prerequisites:
  - LIE1
  - GRP3
  - ODE4
official_scope: []
learning_objectives:
  - 1パラメータ部分群を実数加法群から Lie 群への滑らかな群準同型として定義し、初速度との関係を説明できる
  - 単位元の任意の接ベクトルから左不変ベクトル場の積分曲線を用いて一意な1パラメータ部分群を構成できる
  - Lie 群の指数写像を定義し、exp(tX) の群則、d exp_0=id、局所微分同相性を証明できる
  - 一般線形群では Lie 群の指数写像が行列指数と一致することを級数と ODE から確認できる
  - Lie 群準同型が指数写像と可換することを1パラメータ部分群の一意性から証明できる
  - 共役写像を滑らかな Lie 群自己同型として扱い、その単位元微分から随伴表現 Ad を構成できる
  - Ad を単なる表現論の黒箱として使わず、Ad_{gh}=Ad_g Ad_h と GL(n) での Ad_g X=gXg^{-1} を直接導ける
  - 随伴表現を単位元で微分して ad を定義し、ad_XY=[X,Y] と Ad_{exp X}=exp(ad_X) を証明できる
  - 共役四項積の指数座標における混合二階微分が Lie 括弧になることを示し、Baker--Campbell--Hausdorff 公式への入口を説明できる
