<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 237" role="img" aria-labelledby="title desc">
  <title id="title">1の個数の偶奇を認識する決定性有限オートマトン</title>
  <desc id="desc">開始状態かつ受理状態Eと非受理状態O。0を読むとそれぞれ自分へ戻り、1を読むとEとOの間を相互に遷移する。</desc>
  <defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#39485b"/></marker></defs>
  <g fill="none" stroke="#39485b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arr)">
    <path d="M25 130 H143"/>
    <path d="M214 130 H367"/>
    <path d="M382 160 C339 220 242 220 202 160"/>
    <path d="M158 98 C101 17 253 17 196 98"/>
    <path d="M398 98 C341 17 493 17 436 98"/>
  </g>
  <g fill="#fff" stroke="#39485b" stroke-width="2.5">
    <circle cx="180" cy="130" r="36"/>
    <circle cx="180" cy="130" r="29"/>
    <circle cx="404" cy="130" r="36"/>
  </g>
  <g fill="#203956" font-family="sans-serif" font-size="19" text-anchor="middle">
    <text x="180" y="137">E</text><text x="404" y="137">O</text>
    <text x="288" y="116">1</text><text x="289" y="224">1</text>
    <text x="177" y="30">0</text><text x="417" y="30">0</text>
  </g>
</svg>
