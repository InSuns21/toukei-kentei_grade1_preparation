id: "NPDE6"
title: "半線形熱方程式・臨界性・有限時間 blow-up"
volume: "foundations"
status: supplementary
prerequisites:
  - NPDE4
  - PDE8
official_scope: []
learning_objectives:
  - 半線形熱方程式 u_t=Delta u+u^p, p>1 を拡散と反応の競合として説明し、非負 mild solution の Duhamel 表示を書ける
  - u^p の局所 Lipschitz 性と熱半群の L-infinity 収縮性から、BUC 非負初期値に対する局所存在一意性を再構成できる
  - 順序を保つ Picard 反復から非負 mild solution の比較原理を導ける
  - 最大存在時間 T_max を定義し、T_max<infinity なら L-infinity ノルムが発散する blow-up alternative を証明できる
  - 方程式の scaling u_lambda(t,x)=lambda^(2/(p-1))u(lambda^2t,lambda x) と L^q 臨界指数 q_c=d(p-1)/2 を導ける
  - q_c=1 から Fujita 指数 p_F=1+2/d を導き、質量尺度と反応の強さの境界として説明できる
  - backward heat-kernel average と Jensen の不等式から global existence の必要条件を導ける
  - 1<p<=p_F で非零非負 L1 初期値が有限時間 blow-up する Fujita 型結果を、劣臨界と臨界に分けて証明できる
  - p>p_F で Gaussian により十分小さく抑えられた非零初期値に global mild solution が存在することを supersolution で示せる
  - backward self-similar ansatz から blow-up profile 方程式を導き、定数 profile が空間一様 ODE blow-up を再現することを確認できる
