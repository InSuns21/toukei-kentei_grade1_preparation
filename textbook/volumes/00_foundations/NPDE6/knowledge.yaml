chapter: NPDE6
scope: dream-theater
coverage: complete
prerequisites:
  - NPDE4
  - PDE8

forward_references: []

concepts:
  - id: nonlinear-pde.semilinear-heat-equation
    name: 半線形熱方程式
    kind: definition
    aliases: ["semilinear heat equation"]
    introduction: inline
    requires:
      - pde.pde3-heat-equation

  - id: nonlinear-pde.semilinear-heat-mild-solution
    name: 半線形熱方程式の mild solution
    kind: definition
    aliases: ["semilinear heat mild solution"]
