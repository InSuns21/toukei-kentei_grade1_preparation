    introduction_aliases: ["定義（半線形熱方程式の mild solution）"]
    requires:
      - nonlinear-pde.semilinear-heat-equation
      - pde.pde8-heat-duhamel

  - id: nonlinear-pde.semilinear-local-existence
    name: 半線形熱方程式の局所存在一意性
    kind: theorem
    aliases: ["local well-posedness for semilinear heat equation"]
