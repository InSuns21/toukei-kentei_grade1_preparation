chapter: OA3
scope: dream-theater
coverage: complete
prerequisites:
  - OA2
  - RA8
  - F0-02C3A

forward_references: []

concepts:
  - id: operator-algebra.star-algebra
    name: 複素 *-代数
    kind: definition
    aliases: ["complex *-algebra", "*-algebra"]
    introduction: formal
    introduction_aliases: ["定義（複素 *-代数）"]
    requires:
      - operator-algebra.unital-banach-algebra

  - id: operator-algebra.cstar-algebra
    name: 単位的 C*-環
    kind: definition
    aliases: ["unital C*-algebra", "C*-algebra"]
    introduction: formal
    introduction_aliases: ["定義（単位的 C*-環）"]
    requires:
      - operator-algebra.star-algebra
      - operator-algebra.unital-banach-algebra

  - id: operator-algebra.star-isometric
    name: C*-環で随伴は等長
    kind: proposition
    aliases: ["isometry of involution in a C*-algebra"]
    introduction_aliases: ["命題（随伴は等長である）"]
    requires:
      - operator-algebra.cstar-algebra

  - id: operator-algebra.self-adjoint-element
    name: C*-環の自己共役元
    kind: definition
    aliases: ["self-adjoint element in a C*-algebra"]
    introduction: formal
    introduction_aliases: ["定義（自己共役元）"]
    requires:
      - operator-algebra.cstar-algebra

  - id: operator-algebra.self-adjoint-norm-spectral-radius
    name: 自己共役元のノルムとスペクトル半径の一致
    kind: proposition
    aliases: ["norm equals spectral radius for self-adjoint elements"]
    introduction_aliases: ["命題（自己共役元ではノルムとスペクトル半径が一致する）"]
    requires:
      - operator-algebra.self-adjoint-element
      - operator-algebra.spectral-radius-formula

  - id: operator-algebra.self-adjoint-spectrum-real
    name: 自己共役元のスペクトル実数性
    kind: theorem
    aliases: ["real spectrum of self-adjoint elements"]
    introduction_aliases: ["定理（自己共役元のスペクトルは実数である）"]
    requires:
      - operator-algebra.self-adjoint-element
      - operator-algebra.character
      - operator-algebra.spectrum-characterization

  - id: operator-algebra.unitary-element
    name: C*-環の unitary 元
    kind: definition
    aliases: ["unitary element"]
    introduction: formal
    introduction_aliases: ["定義（unitary 元）"]
    requires:
      - operator-algebra.cstar-algebra

  - id: operator-algebra.projection-element
    name: C*-環の projection
    kind: definition
    aliases: ["projection in a C*-algebra"]
    introduction: formal
    introduction_aliases: ["定義（projection）"]
    requires:
      - operator-algebra.self-adjoint-element

  - id: operator-algebra.commutative-cstar-gelfand-isometry
    name: 可換 C*-環の Gelfand 変換の等長性
    kind: theorem
    aliases: ["isometric Gelfand transform for commutative C*-algebras"]
    introduction_aliases: ["定理（可換 C*-環では Gelfand 変換は等長かつ単射）"]
    requires:
      - operator-algebra.cstar-algebra
      - operator-algebra.gelfand-transform-spectral-radius
      - operator-algebra.self-adjoint-norm-spectral-radius
      - operator-algebra.self-adjoint-spectrum-real

  - id: operator-algebra.unital-star-homomorphism
    name: 単位的 *-準同型
    kind: definition
    aliases: ["unital *-homomorphism"]
    introduction: formal
    introduction_aliases: ["定義（単位的 *-準同型）"]
    requires:
      - operator-algebra.cstar-algebra

  - id: operator-algebra.star-homomorphism-contractive
    name: 単位的 *-準同型の縮小性
    kind: theorem
    aliases: ["contractivity of unital *-homomorphisms"]
    introduction_aliases: ["定理（単位的 *-準同型は縮小的である）"]
    requires:
      - operator-algebra.unital-star-homomorphism
      - operator-algebra.self-adjoint-norm-spectral-radius

  - id: operator-algebra.positive-element
    name: C*-環の正元
    kind: definition
    aliases: ["positive element in a C*-algebra"]
    introduction: formal
    introduction_aliases: ["定義（正元）"]
    requires:
      - operator-algebra.self-adjoint-element
      - operator-algebra.self-adjoint-spectrum-real

  - id: operator-algebra.self-adjoint-generated-inverse-approximation
    name: 自己共役元が生成する閉部分代数での逆元近似
    kind: lemma
    aliases: ["inverse approximation in the C*-subalgebra generated by a self-adjoint element"]
    introduction_aliases: ["補題（自己共役元が生成する閉部分代数では逆元を多項式で近似できる）"]
    requires:
      - operator-algebra.self-adjoint-norm-spectral-radius
      - analysis.stone-weierstrass-real

  - id: operator-algebra.positive-square-root
    name: 正元の正の平方根
    kind: theorem
    aliases: ["positive square root in a C*-algebra"]
    introduction_aliases: ["定理（正元には一意な正の平方根が存在する）"]
    requires:
      - operator-algebra.positive-element
      - operator-algebra.self-adjoint-generated-inverse-approximation
      - analysis.stone-weierstrass-real
