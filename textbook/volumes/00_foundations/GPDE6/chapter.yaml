id: "GPDE6"
title: "Encore III Graduate PDE VI：弱形式・変分形式"
volume: "foundations"
status: supplementary
prerequisites:
  - GPDE5
  - PDE5
official_scope: []
learning_objectives:
  - Poisson零Dirichlet問題の古典形からテスト関数を用いて弱形式を座標ごとの部分積分で導出できる
  - H_0^1(Omega)の双対としてH^{-1}(Omega)を定義し、L2データがH^{-1} functionalを定めることをPoincare不等式から示せる
  - Poisson方程式のvariational weak solutionを定義し、H_0^1が零Dirichlet境界条件を担う意味を説明できる
  - classical solution・distributional solution・variational weak solutionの関係を仮定付きで証明できる
  - bounded bilinear formとcoercive bilinear formを定義し、Poisson formのboundednessとcoercivityを確認できる
  - gradient normと通常のH1 normでcoercivity定数がどう変わるかをPoincare不等式から導出できる
  - 対称coercive問題のenergy functionalを定義し、variational equationとenergy minimizationの同値を証明できる
  - Hilbert空間のnormが弱収束に関して下半連続であることを内積展開から証明できる
  - minimizing sequence・弱収束部分列・弱下半連続性を用いてPoisson変分問題の存在を直接法で証明できる
  - coercivityからPoisson弱解の一意性とH^{-1}データに対する安定性評価を導出できる
  - 非零Dirichlet条件とNeumann条件では試行空間を変える必要がある理由を説明できる
