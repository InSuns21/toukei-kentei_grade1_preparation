chapter: GPDE6
scope: dream-theater
coverage: complete
prerequisites:
  - GPDE5
  - PDE5

concepts:
  - id: sobolev.hminus1
    name: "H^{-1}(Omega)"
    kind: definition
    aliases: ["Hminus1", "Hminus1 空間", "H minus one space", "dual of H_0^1"]
    introduction: formal
    introduction_aliases: ["定義（H^{-1} 空間）"]
    requires:
      - sobolev.h01

  - id: pde.l2-data-hminus1
    name: 二乗可積分データがH^{-1}の汎関数を定める
    kind: proposition
    aliases: ["L2データがH^{-1} functionalを定める", "L2 forcing defines Hminus1 functional", "L2 to Hminus1"]
    introduction: formal
    introduction_aliases: ["命題（二乗可積分データは H^{-1} の汎関数を定める）"]
    requires:
      - sobolev.hminus1
      - sobolev.poincare-h01

  - id: pde.poisson-variational-weak-solution
    name: Poissonの変分弱解
    kind: definition
    aliases: ["Poisson variational weak solution", "Poisson変分弱解"]
    introduction: formal
    introduction_aliases: ["定義（Poisson の変分弱解）"]
    requires:
      - sobolev.hminus1
      - sobolev.h01

  - id: pde.classical-poisson-to-variational
    name: 古典Poisson解から変分弱解
    kind: theorem
    aliases: ["classical Poisson implies variational weak solution"]
    introduction: formal
    introduction_aliases: ["定理（古典 Poisson 解から変分弱解）"]
    requires:
      - pde.poisson-variational-weak-solution

  - id: pde.distributional-variational-equivalence
    name: 超関数解と変分弱解の同値
    kind: theorem
    aliases: ["distributional solutionと変分弱解の同値", "distributional variational equivalence", "distributional and variational weak solution equivalence"]
    introduction: formal
    introduction_aliases: ["定理（超関数解と変分弱解の同値）"]
    requires:
      - pde.poisson-variational-weak-solution
      - distribution.distributional-solution
      - distribution.weak-derivative

  - id: variational.bounded-bilinear-form
    name: 有界双線形形式
    kind: definition
    aliases: ["bounded bilinear form", "continuous bilinear form"]
    introduction: formal
    introduction_aliases: ["定義（有界双線形形式）"]

  - id: variational.coercive-bilinear-form
    name: 強圧的双線形形式
    kind: definition
    aliases: ["coercive bilinear form", "coercivity", "強圧性", "V-elliptic form"]
    introduction: formal
    introduction_aliases: ["定義（強圧的双線形形式）"]

  - id: pde.poisson-form-bounded-coercive
    name: Poisson双線形形式の有界性と強圧性
    kind: proposition
    aliases: ["Poisson formのboundednessとcoercivity", "Poisson bilinear form", "Poisson form bounded coercive"]
    introduction: formal
    introduction_aliases: ["命題（Poisson 双線形形式の有界性と強圧性）"]
    requires:
      - variational.bounded-bilinear-form
      - variational.coercive-bilinear-form
      - sobolev.poincare-h01
      - sobolev.gradient-norm-equivalence

  - id: variational.energy-functional
    name: エネルギー汎関数
    kind: definition
    aliases: ["energy functional", "quadratic energy functional"]
    introduction: formal
    introduction_aliases: ["定義（エネルギー汎関数）"]
    requires:
      - variational.bounded-bilinear-form

  - id: variational.symmetric-coercive-principle
    name: 対称強圧問題の変分原理
    kind: theorem
    aliases: ["対称coercive問題の変分原理", "symmetric coercive variational principle", "energy minimization principle"]
    introduction: formal
    introduction_aliases: ["定理（対称強圧問題の変分原理）"]
    requires:
      - variational.energy-functional
      - variational.coercive-bilinear-form

  - id: functional.weak-lsc-hilbert-norm
    name: Hilbert空間のノルムの弱下半連続性
    kind: lemma
    aliases: ["Hilbert normの弱収束時評価", "weak-limit norm estimate", "weak lower semicontinuity of Hilbert norm"]
    introduction: formal
    introduction_aliases: ["補題（Hilbert 空間のノルムの弱下半連続性）"]

  - id: pde.poisson-direct-method
    name: Poisson変分問題の直接法による存在一意性
    kind: theorem
    aliases: ["direct method for Poisson", "Poisson variational existence uniqueness"]
    introduction: formal
    introduction_aliases: ["定理（Poisson 変分問題の直接法）"]
    requires:
      - pde.poisson-variational-weak-solution
      - variational.symmetric-coercive-principle
      - functional.weak-lsc-hilbert-norm
      - functional-analysis.bounded-hilbert-sequence-weak-subsequence

  - id: pde.poisson-stability
    name: Poisson弱解の安定性
    kind: corollary
    aliases: ["Poisson stability estimate", "continuous dependence for Poisson weak solution"]
    introduction: formal
    introduction_aliases: ["系（Poisson 弱解の安定性）"]
    requires:
      - pde.poisson-direct-method
      - variational.coercive-bilinear-form
