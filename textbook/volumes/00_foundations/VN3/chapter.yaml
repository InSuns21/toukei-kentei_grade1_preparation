id: "VN3"
title: "射影・部分等長作用素・極分解"
volume: "foundations"
status: supplementary
prerequisites:
  - VN2
  - OA3
  - OA6
official_scope: []
learning_objectives:
  - B(H) の射影と閉部分空間が一対一に対応し、ran P と ker P の直交分解を証明できる
  - 部分等長作用素を初期空間上の等長性で定義し、V*V と VV* が初期射影・終射影になることを証明できる
  - 正作用素 A の支持射影 s(A) を定義し、A(A+epsilon I)^(-1) の SOT 極限として回収できる
  - 有界作用素 T に対し |T|=(T*T)^(1/2) を用いて極分解 T=U|T| を構成し、U の一意性まで証明できる
  - 極分解で U*U=s(|T|) および UU*=s(|T*|) を導ける
  - T が von Neumann 環 M に属するとき、極分解の部分等長作用素 U も M に属することを SOT 近似から証明できる
  - 2次行列の具体例で |T|、支持射影、部分等長作用素 U を手計算できる
