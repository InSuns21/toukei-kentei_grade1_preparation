  - { id: GAME-B6-PROP-02, name: Banzhaf swing 数の一様部分集合確率表示 }
  - { id: GAME-B6-PROP-03, name: 勝利提携構造による投票力指数の不変性 }
  - { id: GAME-B6-PROP-04, name: 零プレイヤー・対称プレイヤー・独裁者の投票力 }
canonical_examples:
  - "[3;2,1,1] でプレイヤー1が拒否権を持つが独裁者ではなく、Shapley--Shubik 指数は (2/3,1/6,1/6)、正規化 Banzhaf 指数は (3/5,1/5,1/5) となる例"
  - "[51;49,49,2] で任意の二人提携が勝利し任意の一人提携が敗北するため、49,49,2 という重み差にもかかわらず両指数が (1/3,1/3,1/3) となる例"
  - "[4;4,1,1] でプレイヤー1が独裁者となり両指数が (1,0,0) となる例"
