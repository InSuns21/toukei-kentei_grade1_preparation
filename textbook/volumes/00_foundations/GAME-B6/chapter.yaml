id: "GAME-B6"
title: "投票ゲーム・投票力指数"
volume: "foundations"
status: supplementary
prerequisites:
  - GAME-B1
  - GAME-B3
official_scope: []
learning_objectives:
  - 有限単純投票ゲームを単調な 0-1 値特性関数として定義し、勝利提携・敗北提携を具体的な投票規則から列挙できる
  - 重み付き投票ゲーム [q;w_1,...,w_n] を定義し、重みや議席比率そのものと投票力を区別できる
  - 拒否権プレイヤーを「すべての勝利提携に含まれるプレイヤー」として判定し、拒否権と独裁者を混同しない
  - Shapley--Shubik 投票力指数を単純投票ゲームの Shapley 値として定義し、ランダム順列で初めて敗北から勝利へ変える pivot の確率として導出できる
  - Banzhaf の swing 数、確率化 Banzhaf 指数、正規化 Banzhaf 指数を区別し、部分集合を一様に選ぶモデルから確率表示を導出できる
  - "[3;2,1,1] で Shapley--Shubik 指数 (2/3,1/6,1/6) と正規化 Banzhaf 指数 (3/5,1/5,1/5) を直接計算できる"
  - "[51;49,49,2] では重み比 49:49:2 に対して三者の投票力が等しくなることを勝利提携構造から説明できる"
  - 正の定数倍など異なる重み表示でも勝利提携族が同じなら投票力指数が不変であり、投票力は表示された重みではなく勝敗構造に依存することを説明できる
  - 零プレイヤー・対称プレイヤー・独裁者に対する両指数の値を証明できる
