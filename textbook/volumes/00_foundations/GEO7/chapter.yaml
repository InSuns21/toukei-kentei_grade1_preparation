id: "GEO7"
title: "幾何学 VII：テンソル場・微分形式・外微分"
volume: "foundations"
status: supplementary
prerequisites:
  - GEO2
  - GEO5
  - LA3E
official_scope: []
learning_objectives:
  - 滑らかな(r,s)型テンソル場を局所座標成分で定義し、ベクトル場・1形式との関係を説明できる
  - k次微分形式を交代的な共変テンソル場として定義し、局所座標基底で表示・評価できる
  - 微分形式の外積を計算し、結合性と次数付き交換則を使える
  - 滑らかな写像による微分形式の引き戻しを定義から計算し、外積との可換性を説明できる
  - 外微分を局所座標で構成し、Lie括弧を用いる座標不変表示からwell-defined性を説明できる
  - 外微分の次数付きLeibniz 則を証明し、d²=0を混合偏導関数の対称性と外積の反対称性から証明できる
  - 外微分が引き戻しと可換することをd²=0とLeibniz 則から証明できる
  - 内部積を定義し、外積に対する符号付き積の法則を使える
  - Lie 微分を局所流による引き戻しの変化率として定義し、具体的な流れで計算できる
  - Cartanの公式を関数・座標1形式から証明し、内部積・外微分・Lie 微分を接続できる
