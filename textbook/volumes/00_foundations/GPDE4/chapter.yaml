id: "GPDE4"
title: "大学院偏微分方程式 IV：H_0^1・境界値・Poincaré 不等式・トレース"
volume: "foundations"
status: supplementary
prerequisites:
  - GPDE3
official_scope: []
learning_objectives:
  - H_0^1(Omega)をC_c^infinity(Omega)のH^1 閉包として定義し、零Dirichlet境界条件を点値ではなく近似可能性で表す意味を説明できる
  - H_0^1(Omega)がH^1(Omega)の閉部分空間でありHilbert空間になることを説明できる
  - 任意の有界開集合でH_0^1版Poincaré不等式を断面積分から証明できる
  - Poincaré不等式から勾配半ノルムがH_0^1上のノルムとなり H^1 ノルムと同値になることを証明できる
  - 一変数W^{1,1}関数が絶対連続代表元を持つことを弱微分と超関数の議論から証明できる
  - 区間上のH^1 トレースを端点値として構成し、その連続性評価を証明できる
  - 区間上でH_0^1が零トレースのH^1関数と一致することを証明できる
  - 有界 Lipschitz 領域の定義と、一般trace定理に領域仮定が必要な理由を説明できる
  - 有界 Lipschitz 領域上のトレース作用素とH_0^1=\ker\operatorname{Tr}を正確な仮定付きで使用できる
  - 零トレース、点ごと zero、平均zeroの違いを区別し、Poincaré不等式の適用条件を確認できる
