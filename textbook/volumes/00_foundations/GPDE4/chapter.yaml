id: "GPDE4"
title: "Encore III Graduate PDE IV：H_0^1・境界値・Poincaré・trace"
volume: "foundations"
status: supplementary
prerequisites:
  - GPDE3
official_scope: []
learning_objectives:
  - H_0^1(Omega)をC_c^infinity(Omega)のH^1閉包として定義し、零Dirichlet境界条件を点値ではなく近似可能性で表す意味を説明できる
  - H_0^1(Omega)がH^1(Omega)の閉部分空間でありHilbert空間になることを説明できる
  - 任意の有界開集合でH_0^1版Poincare不等式を断面積分から証明できる
  - Poincare不等式から勾配seminormがH_0^1上のnormとなりH^1 normと同値になることを証明できる
  - 一変数W^{1,1}関数が絶対連続代表元を持つことを弱微分とdistributionの議論から証明できる
  - 区間上のH^1 traceを端点値として構成し、その連続性評価を証明できる
  - 区間上でH_0^1がtrace zeroのH^1関数と一致することを証明できる
  - bounded Lipschitz domainの定義と、一般trace定理に領域仮定が必要な理由を説明できる
  - bounded Lipschitz domain上のtrace作用素とH_0^1=ker Trを正確な仮定付きで使用できる
  - trace zero、点wise zero、平均zeroの違いを区別し、Poincare不等式の適用条件を確認できる
