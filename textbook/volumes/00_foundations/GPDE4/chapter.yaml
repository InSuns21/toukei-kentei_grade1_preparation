  - { id: GPDE4-COR-01, name: "勾配ノルムとH^1ノルムの同値性" }
  - { id: GPDE4-THM-02, name: "一変数W^{1,1}の絶対連続代表元" }
  - { id: GPDE4-THM-03, name: "区間上のトレース定理" }
  - { id: GPDE4-THM-04, name: "区間上のH_0^1と零トレースの同一視" }
  - { id: GPDE4-THM-05, name: "有界 Lipschitz 領域上のtrace定理" }
  - { id: GPDE4-THM-06, name: "H_0^1と零トレースの同一視" }
