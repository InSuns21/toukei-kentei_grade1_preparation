chapter: FOU3
scope: dream-theater
coverage: complete
prerequisites:
  - FOU2
  - F0-00D2B
  - F0-00D2C
forward_references:
  - FOU4

# FOU3 は旧 F0-00FA2 を concept owner / proof dependency にしない。
# L1 積分・DCT・Fubini は既存測度論正本を prerequisite として使い、L2/Hilbert の一般論は FOU4 へ送る。

concepts:
  - id: fourier.fou3-fourier-transform
    name: L1 Fourier変換
    kind: definition
    aliases: [Fourier transform on L1]
    introduction: formal

  - id: fourier.fou3-bounded-continuous
    name: Fourier変換の有界性と連続性
    kind: theorem
    aliases: [boundedness and continuity of Fourier transform]
    introduction: formal
    requires:
      - fourier.fou3-fourier-transform

  - id: fourier.fou3-transform-rules
    name: Fourier変換の平行移動・尺度変換・変調則
    kind: theorem
    aliases: [translation scaling modulation rules]
    introduction: formal
    requires:
      - fourier.fou3-fourier-transform

  - id: fourier.fou3-l1-translation
    name: L1の平行移動連続性
    kind: theorem
    aliases: [translation continuity in L1]
    introduction: formal

  - id: fourier.fou3-riemann-lebesgue
    name: Riemann--Lebesgueの補題
    kind: theorem
    aliases: [Riemann-Lebesgue lemma]
    introduction: formal
    requires:
      - fourier.fou3-fourier-transform
      - fourier.fou3-l1-translation

  - id: fourier.fou3-convolution
    name: 畳み込み
    kind: definition
    aliases: [convolution]
    introduction: formal

  - id: fourier.fou3-convolution-theorem
    name: L1畳み込みと畳み込み定理
    kind: theorem
    aliases: [convolution theorem]
    introduction: formal
    requires:
      - fourier.fou3-convolution
      - fourier.fou3-fourier-transform

  - id: fourier.fou3-derivative-rule
    name: Fourier変換と微分
    kind: theorem
    aliases: [differentiation rule for Fourier transform]
    introduction: formal
    requires:
      - fourier.fou3-fourier-transform

  - id: fourier.fou3-gaussian-transform
    name: GaussianのFourier変換
    kind: theorem
    aliases: [Fourier transform of Gaussian]
    introduction: formal
    requires:
      - fourier.fou3-fourier-transform
      - fourier.fou3-derivative-rule

  - id: fourier.fou3-approximate-identity
    name: approximate identity
    kind: definition
    aliases: [近似恒等核]
    introduction: formal

  - id: fourier.fou3-gaussian-approximation
    name: Gaussian approximate identity
    kind: theorem
    aliases: [Gaussian approximate identity theorem]
    introduction: formal
    requires:
      - fourier.fou3-approximate-identity
      - fourier.fou3-gaussian-transform

  - id: fourier.fou3-inversion
    name: Fourier反転定理
    kind: theorem
    aliases: [Fourier inversion theorem]
    introduction: formal
    requires:
      - fourier.fou3-gaussian-approximation
      - fourier.fou3-gaussian-transform
      - fourier.fou3-fourier-transform
