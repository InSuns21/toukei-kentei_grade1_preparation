id: "FOU3"
title: "標準Fourier解析 III：Fourier変換・畳み込み・反転"
volume: "foundations"
status: supplementary
prerequisites:
  - FOU2
  - F0-00D2B
  - F0-00D2C
  - MT7
# FOU1/FOU2 の離散周波数論から実数全体上の連続周波数へ進む。
# L1 Fourier変換で必要な DCT / Fubini / C_c 稠密性は既存のLebesgue積分正本を参照するが、L2/Hilbert 理論は FOU4 まで先取りしない。
official_scope: []
learning_objectives:
  - L1(R) 上のFourier変換を定義し、有界性と連続性を積分評価から証明できる
  - 平行移動・尺度変換・変調の各変換則を変数変換から導出できる
  - L1平行移動連続性からRiemann--Lebesgueの補題を証明できる
  - L1畳み込みの絶対可積分性を確認し、Fubiniの定理から畳み込み定理を証明できる
  - 十分な微分可能性と可積分性の下で微分が周波数側の乗算へ移ることを部分積分から導ける
  - GaussianのFourier変換を微分方程式として計算し、Gaussian核がapproximate identityになる機構を説明できる
  - fとf-hatがL1でfが連続ならFourier反転公式が成立することをGaussian正則化から証明できる
  - 空間側の局在と周波数側の広がり、畳み込みと積、微分と周波数乗算という対応を具体例で使える
