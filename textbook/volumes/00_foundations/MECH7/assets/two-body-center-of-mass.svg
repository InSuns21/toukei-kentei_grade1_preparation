<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" role="img" aria-labelledby="title desc" data-layout-lint="strict">
  <title id="title">二質点の重心と相対位置</title>
  <desc id="desc">質点1と質点2を結ぶ線分上に重心 R を示し、質点2から質点1へ相対位置ベクトル r=r1-r2 を描く。原点 O から各質点への位置ベクトル r1 と r2 も示す。</desc>
  <rect width="820" height="360" fill="white"/>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1f5f99"/></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8a3d2f"/></marker>
  </defs>
  <circle cx="100" cy="300" r="7" fill="#111"/>
  <text x="70" y="335" font-size="22">O</text>

  <line x1="100" y1="300" x2="640" y2="80" stroke="#1f5f99" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="100" y1="300" x2="300" y2="220" stroke="#1f5f99" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#arrow-blue)"/>

  <line x1="300" y1="220" x2="640" y2="80" stroke="#8a3d2f" stroke-width="4" marker-end="url(#arrow-red)"/>


  <circle cx="640" cy="80" r="18" fill="#eef4fa" stroke="#222" stroke-width="3"/>
  <circle cx="300" cy="220" r="30" fill="#f5ece9" stroke="#222" stroke-width="3"/>
  <circle cx="420" cy="171" r="8" fill="#111"/>

  <g font-family="Noto Sans CJK JP, sans-serif" font-size="21" fill="#111">
    <text x="670" y="75">m1</text>
    <text x="230" y="205">m2</text>
    <text x="405" y="132">R</text>
    <text x="500" y="112" fill="#8a3d2f" font-weight="700">r</text>
    <text x="430" y="230" fill="#1f5f99">r1</text>
    <text x="170" y="238" fill="#1f5f99">r2</text>
  </g>
</svg>