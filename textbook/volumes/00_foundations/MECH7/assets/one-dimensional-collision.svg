<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" role="img" aria-labelledby="title desc" data-layout-lint="strict">
  <title id="title">一次元衝突の前後の速度配置</title>
  <desc id="desc">上段に衝突前、下段に衝突後の二質点を描き、それぞれの質点から速度 u1,u2 と v1,v2 の矢印を水平方向へ示す。質点は塗りと大きさでも区別する。</desc>
  <rect width="860" height="430" fill="white"/>
  <defs>
    <marker id="arrow-a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1f5f99"/></marker>
    <marker id="arrow-b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8a3d2f"/></marker>
  </defs>

  <circle cx="255" cy="155" r="30" fill="#eef4fa" stroke="#222" stroke-width="3"/>
  <circle cx="600" cy="155" r="22" fill="#f5ece9" stroke="#222" stroke-width="3"/>
  <line x1="255" y1="105" x2="390" y2="105" stroke="#1f5f99" stroke-width="5" marker-end="url(#arrow-a)" data-series-group="before-velocity" data-series-label="particle-1"/>
  <line x1="600" y1="205" x2="505" y2="205" stroke="#8a3d2f" stroke-width="5" stroke-dasharray="10 7" marker-end="url(#arrow-b)" data-series-group="before-velocity" data-series-label="particle-2"/>

  <circle cx="305" cy="335" r="30" fill="#eef4fa" stroke="#222" stroke-width="3"/>
  <circle cx="560" cy="335" r="22" fill="#f5ece9" stroke="#222" stroke-width="3"/>
  <line x1="305" y1="285" x2="420" y2="285" stroke="#1f5f99" stroke-width="5" marker-end="url(#arrow-a)" data-series-group="after-velocity" data-series-label="particle-1"/>
  <line x1="560" y1="385" x2="650" y2="385" stroke="#8a3d2f" stroke-width="5" stroke-dasharray="10 7" marker-end="url(#arrow-b)" data-series-group="after-velocity" data-series-label="particle-2"/>

  <g font-family="Noto Sans CJK JP, sans-serif" font-size="21" fill="#111">
    <text x="105" y="82">衝突前</text>
    <text x="105" y="272">衝突後</text>
    <text x="220" y="195">m1</text>
    <text x="635" y="164">m2</text>
    <text x="265" y="375">m1</text>
    <text x="595" y="344">m2</text>
    <text x="316" y="88" fill="#1f5f99" font-weight="700">u1</text>
    <text x="520" y="250" fill="#8a3d2f" font-weight="700">u2</text>
    <text x="360" y="268" fill="#1f5f99" font-weight="700">v1</text>
    <text x="608" y="414" fill="#8a3d2f" font-weight="700">v2</text>
  </g>
</svg>