id: "NSA4"
title: "内部集合・外部集合・超自然数・超有限集合"
volume: "foundations"
status: supplementary
prerequisites:
  - NSA3
  - SET9
official_scope: []
learning_objectives:
  - 集合列の超冪から内部集合を定義し、内部集合への所属が代表元によらず定まることを証明できる
  - 標準集合 A の超準拡張 *A と標準元だけのコピーを区別し、有限集合では両者が一致することを証明できる
  - 写像列から内部写像を構成し、その評価が代表元によらないことを確認できる
  - 超自然数 *N と無限超自然数を定義し、[n+1] が無限超自然数であることを示せる
  - 超有限集合を有限集合列の内部集合として定義し、{1,...,H} が H∈*N に対する基本例であることを説明できる
  - 内部集合に対する overspill 型の補題を ultrapower の代表列から証明できる
  - 標準自然数全体、無限小全体、有限超実数全体が外部集合であることを、内部性を仮定した矛盾から説明できる
  - 内部集合と外部集合の差が transfer・最大値原理・後続の標準部でどこに効くかを説明できる
definitions:
  - { id: NSA4-DEF-01, name: 超自然数 }
  - { id: NSA4-DEF-02, name: 無限超自然数 }
  - { id: NSA4-DEF-03, name: 内部集合 }
  - { id: NSA4-DEF-04, name: 標準集合の超準拡張 }
  - { id: NSA4-DEF-05, name: 内部写像 }
  - { id: NSA4-DEF-06, name: 超有限集合 }
theorems:
  - { id: NSA4-PROP-01, name: 内部集合への所属は代表元によらない }
  - { id: NSA4-PROP-02, name: 有限標準集合の超準拡張は新しい元を持たない }
  - { id: NSA4-PROP-03, name: 内部写像の評価は代表元によらない }
  - { id: NSA4-PROP-04, name: 超有限初期区間の所属判定 }
  - { id: NSA4-THM-01, name: 内部集合の overspill }
  - { id: NSA4-COR-01, name: 標準自然数全体は外部集合である }
  - { id: NSA4-THM-02, name: 非空内部部分集合の超有限最大値原理 }
  - { id: NSA4-PROP-05, name: 無限小全体は外部集合である }
  - { id: NSA4-PROP-06, name: 有限超実数全体は外部集合である }
canonical_examples:
  - *N の無限超自然数 H=[n+1]
  - 固定集合 B の定数列から得る *B
  - A_n={0,...,n} から得る内部集合
  - f_n(k)=k+n から得る標準写像ではない内部写像
  - 無限 H に対する超有限初期区間 {1,...,H}
  - 標準自然数全体が内部ではないこと
  - 無限小全体を内部と仮定した対角化
