canonical_examples:
  - "長さ接頭辞を使った二文字列の組符号化"
  - "末尾ビットの一致を判定する検証器"
  - "空証明書で確認するP言語のNP所属"
  - "命題論理式の真偽値代入"
  - "三頂点クリークと四頂点Hamilton閉路"
