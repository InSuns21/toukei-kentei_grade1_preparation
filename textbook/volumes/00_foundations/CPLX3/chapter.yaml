id: "CPLX3"
title: "クラスNP：証明書と検証"
volume: "foundations"
status: supplementary
prerequisites:
  - CPLX2
official_scope: []
learning_objectives:
  - 入力と証明書の一意な組符号化・入力長・不正な候補の扱いを説明できる
  - 多項式長証明書と全入力停止する多項式時間検証器を区別しそれぞれの上界を確認できる
  - クラスNPの存在量化とyes/noの非対称性を明示できる
  - 長すぎる証明書を切断してもNPの定義が不変であることを証明できる
  - SATの真偽値割当てと構文木評価から正確な検証器を構成できる
  - CLIQUEの頂点集合と有向Hamilton閉路の巡回順序を証明書にし全検査条件を示せる
  - SAT・CLIQUE・DHCのNP所属を両方向の正しさと多項式時間で証明できる
  - NP所属とNP完全性・P非所属・候補の高速探索とを区別できる
definitions:
