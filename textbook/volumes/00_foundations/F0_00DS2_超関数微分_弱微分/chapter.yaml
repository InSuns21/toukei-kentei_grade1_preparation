id: "F0-00DS2"
title: "Encore III：超関数微分・弱微分・Heaviside関数"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00DS1
official_scope: []
learning_objectives:
  - 超関数微分を部分積分の双対化として定義できる
  - Heaviside関数の超関数微分がDirac deltaになることを示せる
  - 弱微分を局所可積分関数の等式として定義できる
  - 古典微分可能なら弱微分と一致することを説明できる
  - 絶対値関数や区分的滑らかな関数の弱微分を計算できる
  - jumpがある関数では超関数微分にdelta項が現れることを説明できる
definitions:
  - { id: F000DS2-DEF-01, name: 超関数微分 }
  - { id: F000DS2-DEF-02, name: 弱微分 }
  - { id: F000DS2-DEF-03, name: 多重指数による弱偏微分 }
theorems:
  - { id: F000DS2-THM-01, name: 古典微分と弱微分の一致 }
canonical_examples:
  - Heaviside関数の超関数微分
  - 絶対値関数の弱微分
  - jumpを持つ区分的C1関数
