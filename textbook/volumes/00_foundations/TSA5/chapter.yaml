id: "TSA5"
title: "Encore IV 時系列解析 V：エルゴード性・混合性・従属極限定理"
volume: "foundations"
status: supplementary
prerequisites:
  - TSA1
  - TSA4
  - F0-00P3A
  - F0-00P5
  - F0-00P6A
official_scope: []
learning_objectives:
  - 定常過程を標準経路空間上の測度保存シフトとして表し、エルゴード性を不変事象の自明性として判定できる
  - von Neumann の平均エルゴード定理を証明し、定常エルゴード過程の標本平均が L2 で母平均へ収束することを導ける
  - Birkhoff のエルゴード定理の結論と平均エルゴード定理との違いを説明し、定常エルゴード過程の強法則へ適用できる
  - 混合性と α-混合係数を定義し、m-依存過程が α-混合になること、および混合性がエルゴード性より強いことを説明できる
  - 固定ラグの標本自己共分散の一致性を Birkhoff の定理から証明できる
  - 自己共分散の絶対可算和可能性から長期分散を導き、2 pi f(0) との対応を説明できる
  - 絶対可算和可能な因果線形過程の従属中心極限定理を 独立同分布中心極限定理から証明し、因果 ARMA へ適用できる
  - α-混合中心極限定理の代表的十分条件を説明し、定常性・エルゴード性だけでは中心極限定理が従わないことを反例で確認できる
