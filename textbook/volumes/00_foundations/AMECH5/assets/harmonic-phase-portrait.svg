<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" data-layout-lint="strict" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">調和振動子の位相空間における等エネルギー楕円</title>
  <desc id="desc">横軸を一般化座標 q、縦軸を共役運動量 p とした位相空間で、一定エネルギー H=E の軌道が楕円になり、Hamilton 方程式に従って時計回りに進むことを示す。</desc>
  <rect width="920" height="430" fill="white"/>
  <defs>
    <marker id="flow-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0072B2"/>
    </marker>
  </defs>

  <line x1="105" y1="215" x2="815" y2="215" stroke="#374151" stroke-width="3"/>
  <line x1="460" y1="375" x2="460" y2="55" stroke="#374151" stroke-width="3"/>
  <text x="830" y="223" font-family="Noto Sans CJK JP, sans-serif" font-size="24" fill="#111827">q</text>
  <text x="468" y="42" font-family="Noto Sans CJK JP, sans-serif" font-size="24" fill="#111827">p</text>

  <ellipse cx="460" cy="215" rx="260" ry="130" fill="none" stroke="#0072B2" stroke-width="4"/>
  <text x="625" y="115" font-family="Noto Sans CJK JP, sans-serif" font-size="24" fill="#111827">H=E</text>

  <line x1="410" y1="86" x2="505" y2="91" stroke="#0072B2" stroke-width="4" marker-end="url(#flow-arrow)"/>
  <line x1="718" y1="172" x2="710" y2="260" stroke="#0072B2" stroke-width="4" marker-end="url(#flow-arrow)"/>
  <line x1="510" y1="344" x2="415" y2="339" stroke="#0072B2" stroke-width="4" marker-end="url(#flow-arrow)"/>
  <line x1="202" y1="258" x2="210" y2="170" stroke="#0072B2" stroke-width="4" marker-end="url(#flow-arrow)"/>

  <circle cx="460" cy="215" r="6" fill="#111827"/>
  <text x="472" y="245" font-family="Noto Sans CJK JP, sans-serif" font-size="22" fill="#111827">0</text>
</svg>
