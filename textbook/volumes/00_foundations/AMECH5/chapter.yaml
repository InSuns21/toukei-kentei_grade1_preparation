canonical_examples:
  - "一次元調和振動子で p=m dot q を反転し H=p^2/(2m)+kq^2/2 を得る例"
  - "速度に線形な ラグランジアン で Legendre 写像が速度を失い正則性が破れる例"
  - "調和振動子の相空間で等エネルギー曲線が楕円になる例"
  - "平面中心力を極座標で H=p_r^2/(2m)+p_theta^2/(2mr^2)+V(r) と書く例"
  - "total derivative を加えた ラグランジアン で canonical momentum がずれるが運動方程式は変わらない例"
