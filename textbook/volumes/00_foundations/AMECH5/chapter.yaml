id: "AMECH5"
title: "Legendre 変換と Hamilton 形式"
volume: "foundations"
status: supplementary
prerequisites:
  - AMECH4
official_scope: []
learning_objectives:
  - 速度変数から共役運動量への Legendre 写像を定義し、速度 Hessian が可逆である正則性条件を具体例で確認できる
  - 正則性から逆関数定理を用いて局所的に dot q=dot q(q,p,t) と速度を回収できることを説明できる
  - Hamiltonian H=sum_j p_j dot q_j-L を Legendre 変換として構成し、調和振動子で H=p^2/(2m)+V(q) を導ける
  - Hamiltonian の全微分で d dot q の項が消えることを途中式で示し、Hamilton の正準方程式を導ける
  - 正則 ラグランジアン の Lagrange 方程式と Hamilton の正準方程式が局所的に同値であることを証明できる
  - 相空間を q と p を独立座標として持つ状態空間として説明し、調和振動子の等エネルギー曲線と時間発展を読める
  - 自然な ラグランジアン L=(1/2) dot q^T M(q) dot q-V(q,t) から H=(1/2)p^T M(q)^(-1)p+V(q,t) を導ける
  - Hamiltonian が常に保存エネルギーとは限らず、dH/dt=partial H/partial t=-partial L/partial t となることを説明できる
  - 中心力を極座標で Hamilton 形式へ変換し、p_theta 保存と radial dynamics を正準方程式から再現できる
