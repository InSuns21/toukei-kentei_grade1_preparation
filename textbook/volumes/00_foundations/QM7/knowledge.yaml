chapter: QM7
scope: dream-theater
coverage: complete
prerequisites:
  - QM6

forward_references: []

concepts:
  - id: quantum.strongly-continuous-unitary-group
    name: 強連続1パラメータユニタリ群
    kind: definition
    aliases: ["strongly continuous one-parameter unitary group", "strongly continuous unitary group"]
    introduction: formal
    introduction_aliases: ["定義（強連続1パラメータユニタリ群）"]
    requires:
      - quantum.spectral-phase-unitary

  - id: quantum.infinitesimal-generator-unitary-group
    name: ユニタリ群の無限小生成作用素
    kind: definition
    aliases: ["無限小生成作用素", "infinitesimal generator of a unitary group"]
    introduction: formal
    introduction_aliases: ["定義（無限小生成作用素）"]
    requires:
      - quantum.strongly-continuous-unitary-group

  - id: quantum.self-adjoint-generated-unitary-group
    name: 自己共役作用素から得られるユニタリ群
    kind: proposition
    aliases: ["unitary group generated by a self-adjoint operator"]
    introduction_aliases: ["命題（自己共役作用素から得られるユニタリ群）"]
    requires:
      - quantum.self-adjoint-borel-functional-calculus
      - quantum.strongly-continuous-unitary-group

  - id: quantum.generator-domain-spectral-characterization
    name: スペクトル表示による生成作用素の定義域特徴付け
    kind: theorem
    aliases: ["spectral characterization of the generator domain"]
    introduction_aliases: ["定理（強微分可能性と Hamiltonian の定義域）"]
    requires:
      - quantum.self-adjoint-generated-unitary-group
      - quantum.unbounded-self-adjoint-spectral-theorem

  - id: quantum.unitary-generator-density-skew
    name: 強連続ユニタリ群の生成作用素の稠密性と歪対称性
    kind: proposition
    aliases: ["density and skew-symmetry of the unitary-group generator"]
    introduction_aliases: ["命題（生成作用素の稠密性と歪対称性）"]
    requires:
      - quantum.infinitesimal-generator-unitary-group

  - id: quantum.unitary-generator-laplace-resolvent
    name: 生成作用素の Laplace レゾルベント
    kind: proposition
    aliases: ["Laplace resolvent of the unitary-group generator"]
    introduction_aliases: ["命題（生成作用素の Laplace 型逆作用素）"]
    requires:
      - quantum.unitary-generator-density-skew

  - id: quantum.stone-theorem
    name: Stone の定理
    kind: theorem
    aliases: ["Stone theorem", "Stone's theorem"]
    introduction_aliases: ["定理（Stone の定理）"]
    requires:
      - quantum.generator-domain-spectral-characterization
      - quantum.unitary-generator-laplace-resolvent
      - quantum.self-adjoint-range-criterion

  - id: quantum.schrodinger-strong-solution
    name: Schrödinger 方程式の強解
    kind: definition
    aliases: ["strong solution of the Schrodinger equation"]
    introduction: formal
    introduction_aliases: ["定義（Schrödinger 方程式の強解）"]
    requires:
      - quantum.stone-theorem

  - id: quantum.schrodinger-evolution-wellposed
    name: Schrödinger 発展の存在・一意性
    kind: theorem
    aliases: ["existence and uniqueness of Schrodinger evolution"]
    introduction_aliases: ["定理（Schrödinger 発展の存在・一意性）"]
    requires:
      - quantum.schrodinger-strong-solution
      - quantum.stone-theorem

  - id: quantum.schrodinger-conservation
    name: ノルムとエネルギー分布の保存
    kind: proposition
    aliases: ["conservation of norm and energy distribution"]
    introduction_aliases: ["命題（ノルムとエネルギー分布の保存）"]
    requires:
      - quantum.schrodinger-evolution-wellposed
