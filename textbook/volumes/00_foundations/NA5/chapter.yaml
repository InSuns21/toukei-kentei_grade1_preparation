id: "NA5"
title: "数値解析 V：数値積分・直交多項式・Gauss 型積分"
volume: "foundations"
status: supplementary
prerequisites:
  - RA4
  - NA4
  - F0-00E1
official_scope: []
learning_objectives:
  - 求積公式と正確次数を定義し、与えられた公式が何次多項式まで厳密か判定できる
  - Lagrange 補間を積分して補間型求積公式を導き、台形則・Simpson 則を Newton--Cotes 公式として説明できる
  - 複合台形則と複合 Simpson 則を導き、局所誤差から大域誤差の次数を説明できる
  - 重み付き多項式内積と直交多項式を定義し、正の重みの下で n 次直交多項式が区間内部に n 個の単純零点を持つことを証明できる
  - 直交多項式の零点を節点とする n 点 Gauss 求積公式が次数 2n-1 まで厳密であることを証明できる
  - Gauss 求積公式の重みが正であり、n 点公式として正確次数 2n-1 が最適であることを証明できる
  - Gauss 求積の誤差公式を Hermite 補間から導き、滑らかさと直交多項式の役割を分離できる
definitions:
