id: "CA7"
title: "標準複素解析 VII：正則関数列・正規族・Riemann 写像定理"
volume: "foundations"
status: supplementary
prerequisites:
  - CA6
  - TOP5
official_scope: []
learning_objectives:
  - コンパクト集合上一様収束から正則性と全階導関数の局所一様収束が保存されることをCauchy積分公式から証明できる
  - 正規収束する正則関数級数を扱い、和の正則性と項別微分を正当化できる
  - 局所有界な正則関数族からCauchy評価で同程度連続性を導き、有限ネットと対角化からMontel の定理を証明できる
  - Hurwitz の定理で零点の安定性を示し、単射正則関数列の非定数極限が単射であることを導ける
  - 単連結真部分領域から単位円板への単射正則写像を構成し、極値問題・Montel の定理・Hurwitz の定理・Schwarz lemmaを用いてRiemann 写像定理を証明できる
  - 正規化したRiemann写像の一意性とSchwarz の鏡像原理を証明し、具体的な半平面・帯領域の写像へ適用できる
