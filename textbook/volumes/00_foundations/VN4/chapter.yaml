id: "VN4"
title: "trace class・predual・ultraweak 位相"
volume: "foundations"
status: supplementary
prerequisites:
  - VN3
  - FA7
  - F0-02C2
official_scope: []
learning_objectives:
  - コンパクト作用素 T の特異値を |T| の固有値として定義し、有限ランク近似との関係を説明できる
  - trace class S_1(H) とトレースノルムを定義し、有限ランク作用素がトレースノルムで稠密であることを証明できる
  - トレースを有限ランク作用素から trace class へ連続拡張し、rank-one 作用素のトレースを計算できる
  - B(H) と trace class のトレース対合 Tr(AT) による等長双対性 B(H)≅S_1(H)^* を証明できる
  - predual の意味を説明し、B(H)_*=S_1(H) と具体的な von Neumann 環 M の predual M_* を構成できる
  - ultraweak 位相を predual による弱*位相として定義し、WOT との包含関係とノルム有界集合上での一致を証明できる
  - M_n(C) と ell^2 上の対角作用素で trace class・トレース対合・ultraweak 収束を具体計算できる
