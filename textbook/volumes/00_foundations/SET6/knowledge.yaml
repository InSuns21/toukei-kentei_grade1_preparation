chapter: SET6
scope: dream-theater
coverage: complete
prerequisites:
  - SET4
  - SET-U3

forward_references:
  - set.choice-axiom
  - set.well-ordering-theorem
  - set.hartogs-lemma
  - set.successor-cardinal

concepts:
  - id: set.cardinal
    name: 基数・初期順序数
    kind: definition
    aliases: [基数, 初期順序数, cardinal, initial ordinal]
    requires:
      - set.ordinal
      - set.cardinality-comparison

  - id: set.wellorderable-cardinal-representative
    name: 整列可能な集合の基数代表
    kind: theorem
    aliases: [整列可能な集合の基数代表]
    requires:
      - set.cardinal
      - order.order-type

  - id: set.cardinality-wellorderable
    name: 整列可能な集合の基数
    kind: definition
    aliases: [整列可能な集合の基数]
    requires:
      - set.wellorderable-cardinal-representative

  - id: set.cardinal-injection-order
    name: 基数の順序と単射
    kind: theorem
    aliases: [基数の順序と単射]
    requires:
      - set.cardinal
      - set.cantor-bernstein

  - id: set.aleph-zero
    name: 最小の無限基数
    kind: definition
    aliases: [最小の無限基数, aleph_0]
    requires:
      - set.cardinal
      - set.omega

  - id: set.cardinal-addition
    name: 基数の加法
    kind: definition
    aliases: [基数の加法, cardinal addition]
    requires:
      - set.cardinal

  - id: set.cardinal-multiplication
    name: 基数の乗法
    kind: definition
    aliases: [基数の乗法, cardinal multiplication]
    requires:
      - set.cardinal

  - id: set.power-set-cardinality-growth
    name: Cantor の定理による冪集合の増大
    kind: proposition
    aliases: [Cantor の定理による冪集合の増大, 冪集合の濃度増大]
    requires:
      - set.cardinal
      - set.cantor-bernstein
      - set.cantor-theorem
