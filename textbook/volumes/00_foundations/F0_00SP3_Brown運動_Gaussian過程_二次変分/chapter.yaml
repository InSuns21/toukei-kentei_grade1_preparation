  - F0-00P6
official_scope: []
learning_objectives:
  - Brown運動を連続path・独立Gaussian増分で定義できる
  - Brown運動がGaussian過程であることを示せる
  - 共分散Cov(B_s,B_t)=min(s,t)を証明できる
  - Brown運動とB_t^2-tのmartingale性を証明できる
  - Brownian scalingを定義から証明できる
  - 一般の決定論的細分割で二次変分がtへL2収束することを証明できる
  - predictable係数付き二次変分の誤差評価を証明できる
  - 二次変分がIto公式の二階項を生む理由を説明できる
