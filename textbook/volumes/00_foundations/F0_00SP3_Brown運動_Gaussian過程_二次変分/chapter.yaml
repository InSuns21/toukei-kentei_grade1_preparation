learning_objectives:
  - Brown運動を連続path・独立定常Gaussian増分で定義できる
  - 共分散Cov(B_s,B_t)=min(s,t)を導ける
  - Brown運動をGaussian過程として特徴付けられる
  - scaling propertyを説明できる
  - Brown運動がmartingaleであることを示せる
  - 二次変分がtへ収束する理由を説明できる
  - 有限変分pathとの違いから通常の微積分が壊れる理由を説明できる
  - white noiseをBrown運動の超関数的時間微分として位置付けられる
