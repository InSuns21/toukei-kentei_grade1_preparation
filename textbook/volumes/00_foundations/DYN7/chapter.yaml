id: "DYN7"
title: "円周回転・有理回転と無理回転"
volume: "foundations"
status: supplementary
prerequisites:
  - DYN6
official_scope: []
learning_objectives:
  - 整数差で実数を同一視した円周を構成し距離の代表元不変性と三角不等式を証明できる
  - 同一視写像の連続全射性と端点0、1の同一視を具体例で確認できる
  - 円周回転が正しく定義された等距離同相写像であり反復が角度の加法になることを証明できる
  - 実直線の平行移動と円周回転を結ぶ半共役を示し区間での小数部分関数の跳躍と区別できる
  - 既約分数の分母が円周回転の全点の最小周期であり無理回転には周期点がないと証明できる
  - 鳩の巣原理と有限分割により無理回転の任意に小さい正時刻の回転を構成できる
  - 小回転の向きが正負どちらでも非負時刻の有限網目を作り前方軌道の稠密性を証明できる
  - 無理回転の非空閉前方不変集合は円周全体であることを証明し閉性を失う反例を説明できる
  - 回転の等距離性と無理回転の非周期性から吸引と軌道収束が起こらない理由を説明できる
definitions:
  - { id: DYN7-DEF-01, name: "整数による同一視と円周" }
