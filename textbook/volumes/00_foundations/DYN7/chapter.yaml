canonical_examples:
  - "0.98と0.02が端点同一視後は距離0.04となる"
  - "1/4回転は0から4歩で戻る"
  - "2/5回転の5点周期と既約分数の最小周期"
  - "sqrt2-1回転は周期点がなく全前方軌道が稠密"
  - "5(sqrt2-1)の正回転の小ささを分数の上下界で挟む"
  - "小数部分写像は区間上では跳躍し円周上の回転は連続"
  - "無理回転の前方軌道は真の稠密前方不変集合となる"
