  - { id: DYN7-THM-02, name: "無理回転の全前方軌道の稠密性" }
propositions:
  - { id: DYN7-PROP-01, name: "円周距離の正当性" }
  - { id: DYN7-PROP-02, name: "回転の可逆性・等距離性と半共役" }
  - { id: DYN7-PROP-03, name: "無理回転の閉じた前方不変集合" }
lemmas:
