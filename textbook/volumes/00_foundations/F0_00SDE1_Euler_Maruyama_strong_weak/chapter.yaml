id: "F0-00SDE1"
title: "Encore V：Euler--Maruyama・strong/weak convergence"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00SP4
  - F0-00MC1
  - F0-00NA4
official_scope: []
learning_objectives:
  - Euler--Maruyama法の格子点更新と連続時間補間を定義できる
  - strong convergenceとweak convergenceを区別できる
  - global Lipschitz条件から線形成長とEuler--Maruyamaの二次モーメント評価を導ける
  - 連続補間の1 step内L2増分がO(h)になることを証明できる
  - DoobのL2最大不等式とIto isometryからEuler--Maruyamaのstrong order 1/2を証明できる
  - weak order 1に追加の滑らかさが必要な理由を説明できる
  - SDE Monte Carloのsampling errorとtime discretization biasを分離できる
  - Milstein法への補正項を説明できる
definitions:
  - { id: F000SDE1-DEF-01, name: Euler--Maruyama法 }
  - { id: F000SDE1-DEF-02, name: L2-sup strong order }
  - { id: F000SDE1-DEF-03, name: weak order }
theorems:
  - { id: F000SDE1-THM-01, name: Euler--Maruyama格子点の二次モーメント一様評価 }
  - { id: F000SDE1-THM-02, name: Euler--Maruyama連続補間の局所増分評価 }
  - { id: F000SDE1-THM-03, name: Euler--Maruyamaのstrong order 1/2 }
canonical_examples:
