id: "NA11"
title: "数値解析 XI：Perron--Frobenius 理論と PageRank"
volume: "foundations"
status: supplementary
prerequisites:
  - NA9
  - NA10
official_scope: []
learning_objectives:
  - 非負行列・正行列・既約性・原始性を定義し、それぞれが Perron 固有値の存在・一意性・スペクトルギャップのどこを担うか説明できる
  - 正行列および既約非負行列に対する Perron--Frobenius 定理の核心証明を再構成できる
  - 既約性だけでは冪乗反復の収束に足りないことを2周期反例で示し、原始性の役割を説明できる
  - 列確率行列のスペクトル半径が1であることを示し、定常確率ベクトルを Perron 固有ベクトルとして導ける
  - PageRank 行列の teleportation が正値性・存在一意性を保証する仕組みを説明できる
  - PageRank 反復の1-ノルム縮小性を証明し、反復差から停止誤差を評価できる
  - PageRank を線形方程式と Neumann 級数で表し、疎行列反復との関係を説明できる
  - ダンピング係数 alpha が収束速度とリンク行列摂動感度に与えるトレードオフを評価できる
definitions:
