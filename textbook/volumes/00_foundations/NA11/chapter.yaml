  - { id: NA11-THM-02, name: 既約非負行列に対する Perron--Frobenius 定理 }
  - { id: NA11-PROP-02, name: 原始行列の Perron 固有値のスペクトルギャップ }
  - { id: NA11-PROP-03, name: 既約列確率行列の定常確率ベクトル }
  - { id: NA11-THM-03, name: 原始列確率行列の冪収束 }
  - { id: NA11-THM-04, name: PageRank の存在・一意性 }
