id: "SET-U2"
title: "可算集合・非可算集合"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00A1C
official_scope: []
learning_objectives:
  - 有限集合・可算無限集合・高々可算集合・非可算集合を定義から区別できる
  - 自然数の直積を対角線状に列挙し、明示的な全単射で可算性を証明できる
  - 可算集合の部分集合・有限直積・有限和が可算であることを、単射の構成から証明できる
  - 各集合の列挙または単射が具体的に与えられた可算集合族について、その和集合が可算であることを証明できる
  - 整数と有理数の可算性を具体的な符号化から証明できる
  - Cantor の対角線論法により区間と実数が非可算であることを証明できる
  - 可算集合の和における可算選択の論点を、明示的な列挙データがある場合と区別できる
definitions:
  - { id: SETU2-DEF-01, name: 有限集合 }
  - { id: SETU2-DEF-02, name: 可算無限集合 }
  - { id: SETU2-DEF-03, name: 高々可算集合・可算集合 }
  - { id: SETU2-DEF-04, name: 非可算集合 }
theorems:
  - { id: SETU2-THM-01, name: 自然数の直積は可算無限 }
  - { id: SETU2-PROP-01, name: 可算集合の部分集合は可算 }
  - { id: SETU2-PROP-02, name: 可算集合の有限直積は可算 }
  - { id: SETU2-PROP-03, name: 明示的に列挙された可算集合族の和集合は可算 }
  - { id: SETU2-PROP-04, name: 整数は可算無限 }
  - { id: SETU2-PROP-05, name: 有理数は可算 }
  - { id: SETU2-THM-02, name: 実数は非可算 }
canonical_examples:
  - 自然数の格子点の対角線列挙
  - 整数の 0,1,-1,2,-2 列挙
  - 既約分数による有理数の符号化
  - 小数表示の対角線論法
problem_patterns:
