chapter: "SET-U2"
terms:
  - term: 有限集合
    english: finite set
    meaning: ある非負整数 n に対して {1,...,n} と全単射を持つ集合。
  - term: 可算無限集合
    english: countably infinite set
    meaning: 自然数全体と全単射を持ち、自然数順に重複なく列挙できる無限集合。
  - term: 高々可算集合
    english: at most countable set
    meaning: 有限集合または可算無限集合。本教材では文脈上単に「可算集合」とも呼ぶ。
  - term: 非可算集合
    english: uncountable set
    meaning: 高々可算ではない集合。自然数順の列挙では尽くせない。
  - term: 対角線論法
    english: diagonal argument
    meaning: 仮定した列挙の n 番目の対象と n 番目の成分で必ず異なる新しい対象を構成し、列挙不能を示す方法。
