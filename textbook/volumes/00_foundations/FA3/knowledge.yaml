chapter: FA3
scope: dream-theater
coverage: complete
prerequisites:
  - F0-02C3
  - F0-02C6
  - LA3A
  - TOP6

forward_references: []

concepts:
  - id: functional.weak-topology
    name: 弱位相
    kind: definition
    aliases: [弱位相, weak topology, "### 定義（弱位相）"]
    introduction_aliases: ["### 定義（弱位相）"]
    requires:
      - functional.dual-space
      - topology.topological-space

  - id: functional.weak-convergence-banach
    name: Banach空間の弱収束
    kind: definition
    aliases: [Banach空間の弱収束, "### 定義（Banach空間の弱収束）"]
    introduction_aliases: ["### 定義（Banach空間の弱収束）"]
    requires:
      - functional.weak-topology
      - topology.net-convergence

  - id: functional.weak-convergence-functional-criterion
    name: 弱収束の汎関数判定
    kind: theorem
    aliases: [弱収束の汎関数判定, "### 定理（弱収束の汎関数判定）"]
    introduction_aliases: ["### 定理（弱収束の汎関数判定）"]
    requires:
      - functional.weak-convergence-banach
      - functional.dual-space
      - topology.directed-set

  - id: functional.norm-convergence-implies-weak
    name: ノルム収束なら弱収束
    kind: proposition
    aliases: [ノルム収束なら弱収束, "### 命題（ノルム収束なら弱収束）"]
    introduction_aliases: ["### 命題（ノルム収束なら弱収束）"]
    requires:
      - functional.weak-convergence-functional-criterion
      - functional.dual-norm

  - id: functional.weak-topology-hausdorff
    name: 弱位相はHausdorff
    kind: theorem
    aliases: [弱位相はHausdorff, "### 定理（弱位相は Hausdorff）"]
    introduction_aliases: ["### 定理（弱位相は Hausdorff）"]
    requires:
      - functional.weak-topology
      - functional.norm-preserving-extension
      - topology.hausdorff-space

  - id: functional.weak-norm-topology-finite-dimensional
    name: 弱位相とノルム位相の有限次元一致
    kind: theorem
    aliases: [弱位相とノルム位相の有限次元一致, "### 定理（弱位相とノルム位相が一致するのは有限次元の場合）"]
