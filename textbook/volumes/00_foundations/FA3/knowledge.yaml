    requires:
      - functional.weak-topology
      - functional.norm-preserving-extension
      - linear.vector-space

  - id: functional.weak-continuous-dual-recovery
    name: 弱位相の連続双対の同定
    kind: theorem
    aliases: [弱位相の連続双対の同定, "### 定理（弱位相の連続双対の同定）"]
    introduction_aliases: ["### 定理（弱位相の連続双対の同定）"]
    requires:
      - functional.weak-topology
      - functional.dual-space
      - functional.linear-functional

  - id: functional.weak-star-topology
    name: 弱*位相
    kind: definition
    aliases: [弱*位相, weak-star topology, weak* topology, "### 定義（弱*位相）"]
    introduction_aliases: ["### 定義（弱*位相）"]
    requires:
      - functional.dual-space
      - topology.topological-space

  - id: functional.weak-star-convergence
    name: 弱*収束
    kind: definition
    aliases: [弱*収束, weak-star convergence, weak* convergence, "### 定義（弱*収束）"]
    introduction_aliases: ["### 定義（弱*収束）"]
    requires:
      - functional.weak-star-topology
      - topology.net-convergence

  - id: functional.weak-star-convergence-evaluation-criterion
    name: 弱*収束の評価判定
    kind: theorem
    aliases: [弱*収束の評価判定, "### 定理（弱*収束の評価判定）"]
    introduction_aliases: ["### 定理（弱*収束の評価判定）"]
    requires:
      - functional.weak-star-convergence
      - topology.directed-set

  - id: functional.canonical-bidual-embedding
    name: 双対の双対と標準埋め込み
    kind: definition
    aliases: [双対の双対, 第二双対, 標準埋め込み, canonical bidual embedding, "### 定義（双対の双対と標準埋め込み）"]
    introduction_aliases: ["### 定義（双対の双対と標準埋め込み）"]
    requires:
      - functional.dual-space

  - id: functional.canonical-bidual-embedding-isometry
    name: 標準埋め込みは等長
    kind: theorem
    aliases: [標準埋め込みは等長, "### 定理（標準埋め込みは等長）"]
    introduction_aliases: ["### 定理（標準埋め込みは等長）"]
    requires:
      - functional.canonical-bidual-embedding
      - functional.norm-preserving-extension
      - functional.dual-norm

  - id: functional.weak-via-bidual-weak-star
    name: 弱収束と標準埋め込み後の弱*収束
    kind: proposition
    aliases: [弱収束と標準埋め込み後の弱*収束, "### 命題（弱収束と標準埋め込み後の弱*収束）"]
    introduction_aliases: ["### 命題（弱収束と標準埋め込み後の弱*収束）"]
    requires:
      - functional.canonical-bidual-embedding
      - functional.weak-convergence-functional-criterion
      - functional.weak-star-convergence-evaluation-criterion

  - id: functional.weak-star-continuous-dual-recovery
    name: 弱*連続線形汎関数は標準埋め込みの像
    kind: theorem
    aliases: [弱*連続線形汎関数は標準埋め込みの像, "### 定理（弱*連続線形汎関数は標準埋め込みの像）"]
    introduction_aliases: ["### 定理（弱*連続線形汎関数は標準埋め込みの像）"]
    requires:
      - functional.weak-star-topology
      - functional.canonical-bidual-embedding
      - functional.linear-functional

  - id: functional.bounded-map-weak-continuous
    name: 有界線形作用素の弱連続性
    kind: proposition
    aliases: [有界線形作用素の弱連続性, "### 命題（有界線形作用素の弱連続性）"]
    introduction_aliases: ["### 命題（有界線形作用素の弱連続性）"]
    requires:
      - functional.bounded-linear-operator
      - functional.weak-convergence-functional-criterion
