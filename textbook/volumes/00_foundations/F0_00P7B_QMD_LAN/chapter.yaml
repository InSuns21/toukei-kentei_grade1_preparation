id: "F0-00P7B"
title: "二次平均微分可能性・局所漸近正規性"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00P7
  - F0-00P6A
  - F0-00D2E
official_scope: []
learning_objectives:
  - Hellinger距離と平方根密度のL2幾何の関係を説明できる
  - 二次平均微分可能性をL2微分として定義し、正規位置モデルで直接確認できる
  - QMDの正規化からスコア平均0とフィッシャー情報行列を導ける
  - 1/sqrt(n)局所パラメータ化が情報量を有限に保つ尺度であることを説明できる
  - 中心列の多変量中心極限定理をCramér--Woldの判定法から導ける
  - QMD展開から対数尤度比の二次補正と剰余評価を追い、局所漸近正規性を証明できる
