  - { id: F002C5A-THM-03, name: MFCQ下の接錐一致 }
  - { id: F002C5A-THM-04, name: 通常制約でRobinson CQとMFCQの同値 }
  - { id: F002C5A-THM-05, name: 線形化coneのpolar表示 }
  - { id: F002C5A-THM-06, name: MFCQ下のKKT乗数存在 }
  - { id: F002C5A-THM-07, name: smooth convex inequalityのnormal cone }
canonical_examples: [x二乗制約の退化例, MFCQとLICQの比較, 単位円板の接錐とnormal cone]
