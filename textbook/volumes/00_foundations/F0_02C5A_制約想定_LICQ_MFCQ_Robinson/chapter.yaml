id: "F0-02C5A"
title: "関数解析V-A：制約想定・LICQ・MFCQ・Robinson CQ"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-02C4A
  - F0-02C5
learning_objectives:
  - active setと線形化coneを定義し具体例で計算できる
  - 制約想定がないと真のtangent coneと線形化coneがずれる反例を説明できる
  - LICQ・MFCQ・Robinson CQを定義から具体例で判定できる
  - LICQからMFCQを線形代数で証明できる
  - MFCQ下でtangent coneと線形化coneが一致することを証明できる
  - 通常の滑らかな制約でRobinson CQとMFCQの同値を証明できる
  - 線形化coneのpolarを制約勾配で表しKKT乗数存在を導ける
  - smooth convex inequalityのnormal coneをactive勾配の非負結合で表せる
