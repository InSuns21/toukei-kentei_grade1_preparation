id: "GAME-C1"
title: "Nash 交渉問題"
volume: "foundations"
status: supplementary
prerequisites:
  - OPT5
official_scope: []
learning_objectives:
  - 実行可能集合 F と決裂点 d から Nash 交渉問題を定式化し、各成分 x_i-d_i を交渉による利得増分として解釈できる
  - 個別合理的集合 F_d と essential な交渉問題を定義し、正の利得増分を全員が得られるかを具体例で判定できる
  - Nash 積を最大化する問題を定式化し、正の利得増分の領域では対数和最大化と同値であることを示せる
  - コンパクト性・essentiality・凸性を使って Nash 積最大化解の存在と一意性を証明できる
  - 凸性を失うと一意性証明の中点議論が壊れ、複数の Nash 積最大化解が生じ得ることを反例で説明できる
  - OPT5 の KKT 条件を適用するために、対数化した目的関数の凹性、線形制約、Slater 条件を局所的に確認できる
  - 線形資源制約 a・x<=B の下で x_i=d_i+(B-a・d)/(n a_i) を KKT から導出できる
  - Nash 積最大化解が Pareto 効率的であることを、積の単調性から証明できる
  - disagreement point の変化が同じ実行可能集合でも配分を変えることを具体的に計算し、Nash 均衡との概念上の違いを説明できる
