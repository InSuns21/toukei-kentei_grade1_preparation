  - { id: GAME-C1-PROP-02, name: 線形資源制約に対する KKT 表示 }
  - { id: GAME-C1-THM-02, name: Nash 交渉解の Pareto 効率性 }
canonical_examples:
  - "F={(x_1,x_2)>=0:x_1+x_2<=10}, d=(2,1) で surplus 7 を等しい利得増分 7/2,7/2 に分け、Nash 交渉解 (11/2,9/2) を得る例"
  - "F={(x_1,x_2):2x_1+x_2<=12, x>=(1,2)}, d=(1,2) で KKT から Nash 交渉解 (3,6) を導く例"
  - "非凸実行可能集合 {(0,0),(4,1),(1,4)} と d=(0,0) では Nash 積最大化解が二つ残り、凸性が一意性に必要な機構を確認する例"
