chapter: F0-00G2
scope: dream-theater
coverage: complete
prerequisites:
  - F0-00A1
  - F0-02C4A
  - F0-00G1
  - F0-02B

forward_references:
  - optimization.polar-cone
  - optimization.strong-duality-slater

concepts:
  - id: convex.fenchel-conjugate
    name: Fenchel共役
    kind: definition
    aliases: [Fenchel共役, Fenchel–Legendre 共役, Fenchel-Legendre共役]
    requires:
      - convex.convex-function
      - linear.inner-product

  - id: convex.support-function
    name: support function
    kind: definition
    aliases: [support function]
    requires:
      - convex.convex-set
      - linear.inner-product

  - id: convex.fenchel-young
    name: Fenchel--Youngの不等式
    kind: theorem
    aliases: [Fenchel--Young, Fenchel–Young, Fenchel–Young 不等式, Fenchel--Young不等式]
    requires:
      - convex.fenchel-conjugate

  - id: convex.fenchel-young-equality
    name: Fenchel--Youngの等号条件
    kind: theorem
    aliases: [Fenchel–Young の等号条件, Fenchel--Youngの等号条件, Fenchel–Youngの等号条件]
    requires:
      - convex.fenchel-young
      - convex.subgradient
      - convex.subdifferential

  - id: convex.biconjugate
    name: 二重共役
    kind: definition
    aliases: [二重共役]
    requires:
      - convex.fenchel-conjugate

  - id: convex.fenchel-moreau
    name: 有限次元Fenchel--Moreau
    kind: theorem
