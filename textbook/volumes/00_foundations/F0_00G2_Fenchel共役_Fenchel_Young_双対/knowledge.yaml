    aliases: [劣微分の逆関係]
    requires:
      - convex.fenchel-young-equality
      - convex.fenchel-moreau

  - id: convex.fenchel-duality
    name: Fenchel双対問題
    kind: definition
    aliases: [Fenchel 双対問題, Fenchel双対問題, Fenchel 双対, Fenchel双対]
    requires:
      - convex.fenchel-conjugate

  - id: convex.fenchel-weak-duality
    name: Fenchel双対の弱双対性
    kind: theorem
    aliases: [Fenchel 双対の弱双対性, Fenchel双対の弱双対性]
