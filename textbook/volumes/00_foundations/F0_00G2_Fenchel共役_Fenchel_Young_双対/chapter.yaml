id: "F0-00G2"
title: "Fenchel共役・Fenchel–Young・双対"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00G1
  - F0-02C4
  - F0-02C4A
official_scope: []
learning_objectives:
  - Fenchel共役を定義し基本例を計算できる
  - indicator関数の共役がsupport functionになることを説明できる
  - Fenchel–Young不等式と劣勾配による等号条件を証明できる
  - proper closed convex functionに対するFenchel–Moreau定理の幾何を説明できる
  - 劣微分の逆関係を共役関数から導ける
  - Fenchel双対を導出し弱双対性を示せる
  - relative-interior条件と強双対性・KKTの関係を説明できる
