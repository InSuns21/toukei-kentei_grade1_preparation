id: "NPDE4"
title: "尺度変換・熱核平滑化・自己相似"
volume: "foundations"
status: supplementary
prerequisites:
  - PDE3
  - GPDE5
official_scope: []
learning_objectives:
  - 放物型尺度変換 u_lambda(t,x)=lambda^alpha u(lambda^2 t,lambda x) を各微分項へ代入し、時間指数2を自力で導ける
  - Lp ノルムの scaling exponent alpha-d/p を変数変換から導き、尺度指数の符号による三分類を小スケール集中との関係で説明できる
  - d 次元熱核 G_t=t^{-d/2}Phi(x/sqrt(t)) の Lr ノルムを scaling から計算できる
  - Young の畳み込み不等式を証明し、熱核の Lp-Lq smoothing exponent d/2(1/p-1/q) を導ける
  - 熱核の一階微分評価で空間微分一回が t^{-1/2} を追加することを scaling と結び付けられる
  - d>=3 で Sobolev 不等式と L1-L2*-interpolation から Nash 型不等式を導ける
  - energy identity と Nash 型不等式から L1-L2 decay t^{-d/4} を導ける
  - 質量保存から自己相似指数 d/2 を導き、完成式の暗記なしに self-similar ansatz を再構成できる
  - similarity variables tau=log t, y=x/sqrt(t) の連鎖律を省略せず計算し、rescaled heat equation を導ける
  - Gaussian heat kernel profile が rescaled dynamics の定常解であることを直接検証できる
