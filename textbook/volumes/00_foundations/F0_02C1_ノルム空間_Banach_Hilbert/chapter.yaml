learning_objectives:
  - 関数空間をベクトル空間として扱う意味を説明できる
  - ノルム空間・Banach空間・内積空間・Hilbert空間を区別できる
  - supノルム・L2ノルム・l2ノルムの代表例を扱える
  - 内積がノルムを誘導することと、全てのノルムが内積由来ではないことを説明できる
  - Hilbert空間の閉凸集合への射影定理を有限次元との違いを意識して説明できる
