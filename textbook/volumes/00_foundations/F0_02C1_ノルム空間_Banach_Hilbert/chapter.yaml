id: "F0-02C1"
title: "関数解析I：ノルム空間・Banach空間・Hilbert空間"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00D1
  - F0-00D2E
  - F0-00E1
  - F0-00E2
learning_objectives:
  - 関数空間をベクトル空間として扱う意味を説明できる
  - ノルム空間・Banach空間・内積空間・Hilbert空間を区別できる
  - supノルム・L2ノルム・l2ノルムの代表例を扱える
  - ノルム写像の連続性を逆三角不等式から示せる
  - 内積由来ノルムが平行四辺形恒等式を満たすことを示せる
definitions:
  - { id: F002C1-DEF-01, name: ノルム空間 }
  - { id: F002C1-DEF-02, name: Banach空間 }
  - { id: F002C1-DEF-03, name: 内積空間 }
  - { id: F002C1-DEF-04, name: Hilbert空間 }
  - { id: F002C1-DEF-05, name: 直交 }
theorems:
  - { id: F002C1-THM-01, name: Cauchy--Schwarz不等式 }
  - { id: F002C1-THM-02, name: ノルム写像の連続性 }
  - { id: F002C1-THM-03, name: 平行四辺形恒等式 }
canonical_examples: [C区間のsupノルム, L2空間, l2空間]
problem_patterns: [FA-NORM-1]
exercise_counts: { level_a: 2, level_b: 1, level_c: 0, level_d: 0 }
dream_theater_exercise_count_exception: "関数解析への導入章として、後続で繰り返し使うノルムの基本操作と内積由来ノルムの判定に直結する A2/B1 に絞る。規定数への水増しは行わない。"
estimated_hours: { reading: 2.75, exercises: 1.0, review: 0.5 }
