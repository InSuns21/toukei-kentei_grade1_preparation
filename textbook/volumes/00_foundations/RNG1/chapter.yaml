id: "RNG1"
title: "抽象代数 V：環・環準同型・イデアル・商環"
volume: "foundations"
status: supplementary
prerequisites:
  - GRP2
  - F0-00A1D
official_scope: []
learning_objectives:
  - 環・可換環・単位元を持つ環を区別し、整数環・行列環などで公理を確認できる
  - 部分環を判定し、部分環とイデアルの違いを吸収性から説明できる
  - 零因子・整域・体を区別し、具体的な剰余環で零因子を判定できる
  - 環準同型の核と像を計算し、核がイデアルになることを証明できる
  - イデアルと主イデアルを具体例から判定できる
  - 商環の積が代表元によらず定まることとイデアル条件の同値を証明できる
  - 商環の標準射影を構成し、その核を求められる
  - 環の第一同型定理を証明し、具体的な環準同型へ適用できる
  - 整数環の任意のイデアルが nZ の形であることを証明できる
