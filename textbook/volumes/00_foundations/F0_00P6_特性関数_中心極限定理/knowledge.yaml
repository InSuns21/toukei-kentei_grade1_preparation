chapter: F0-00P6
scope: dream-theater
coverage: complete
prerequisites:
  - F0-00P3
  - F0-00D2B
  - F0-00D2C

# 二次展開とLévyを組み合わせたiid CLTは次章で正式にまとめる。
forward_references:
  - prob.standardized-iid-sum
  - prob.iid-clt

concepts:
  - id: prob.characteristic-function
    name: 特性関数
    kind: definition
    aliases: [特性関数]
    introduction_aliases: ["定義（特性関数）"]
    requires:
      - prob.random-variable
      - prob.expectation

  - id: prob.characteristic-function-properties
    name: 特性関数の基本性質
    kind: proposition
    aliases: [特性関数の基本性質]
    requires:
      - prob.characteristic-function
      - prob.independent-random-variables
      - measure.dominated-convergence-theorem

  - id: prob.distribution-convergence
    name: 分布収束
    kind: definition
    aliases: [分布収束]
    introduction_aliases: ["定義（分布収束）"]
    requires:
      - prob.cdf

  - id: prob.bounded-lipschitz-function
    name: 有界Lipschitz関数
    kind: definition
    aliases: [有界Lipschitz関数]
    introduction_aliases: ["定義（有界Lipschitz関数）"]
    requires: []

  - id: prob.bounded-lipschitz-characterization
    name: 有界Lipschitz関数による分布収束の特徴付け
    kind: theorem
    aliases: [有界Lipschitz関数による分布収束の特徴付け]
    requires:
      - prob.distribution-convergence
      - prob.cdf
      - prob.bounded-lipschitz-function

  - id: prob.gaussian-fourier-identity
    name: Gaussian Fourier 恒等式
    kind: lemma
    aliases: [Gaussian Fourier 恒等式, Gaussian Fourier identity]
    introduction_aliases: ["補題（Gaussian Fourier 恒等式）"]
    requires:
      - measure.lebesgue-integral

  - id: prob.gaussian-smoothing-density
    name: Gaussian 平滑化の密度公式
    kind: lemma
    aliases: [Gaussian 平滑化の密度公式, Gaussian smoothingの密度公式]
    introduction_aliases: ["補題（Gaussian 平滑化の密度公式）"]
    requires:
      - prob.gaussian-fourier-identity
      - prob.characteristic-function
      - prob.independent-random-variables
      - measure.fubini-theorem

  - id: prob.characteristic-function-uniqueness
    name: 特性関数の一意性
    kind: theorem
    aliases: [特性関数の一意性]
    requires:
      - prob.characteristic-function
      - prob.gaussian-smoothing-density
      - prob.cdf

  - id: prob.characteristic-function-second-order-expansion
    name: 特性関数の二次展開
    kind: theorem
    aliases: [特性関数の二次展開]
    requires:
      - prob.characteristic-function
      - prob.expectation
      - measure.dominated-convergence-theorem

  - id: prob.scheffe-lemma
    name: Schefféの補題
    kind: lemma
    aliases: [Schefféの補題]
    requires:
      - measure.dominated-convergence-theorem
      - measure.integrable-function

  - id: prob.levy-continuity-theorem
    name: Lévy連続性定理
    kind: theorem
    aliases: [Lévy連続性定理, Levy連続性定理]
    introduction_aliases: ["定理（Lévy連続性定理：極限分布が既知の版）"]
    requires:
      - prob.characteristic-function
      - prob.distribution-convergence
      - prob.bounded-lipschitz-characterization
      - prob.gaussian-smoothing-density
      - prob.scheffe-lemma
      - measure.dominated-convergence-theorem

  - id: prob.vector-characteristic-function
    name: 確率ベクトルの特性関数
    kind: definition
    aliases: [確率ベクトルの特性関数, 同時特性関数]
    introduction_aliases: ["定義（確率ベクトルの特性関数）"]
    requires:
      - prob.characteristic-function

  - id: prob.levy-continuity-theorem-finite-dimensional
    name: 確率ベクトルの特性関数収束定理
    kind: theorem
    aliases: [確率ベクトルの特性関数収束定理]
    introduction_aliases: ["定理（確率ベクトルの特性関数収束定理）"]
    requires:
      - prob.vector-characteristic-function
      - prob.gaussian-fourier-identity
      - prob.scheffe-lemma
      - prob.bounded-lipschitz-function
      - measure.fubini-theorem
      - measure.dominated-convergence-theorem
