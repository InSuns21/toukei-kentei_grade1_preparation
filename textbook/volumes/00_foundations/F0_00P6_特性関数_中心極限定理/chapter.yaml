id: "F0-00P6"
title: "特性関数・Lévy連続性定理"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00P3
  - F0-00D2B
  - F0-00D2C
official_scope: []
learning_objectives:
  - 特性関数を定義し常に存在する理由を証明できる
  - 独立和を特性関数の積へ変換できる
  - 分布収束をCDFの連続点で定義できる
  - bounded Lipschitz testによる分布収束の特徴付けを証明できる
  - Gaussian Fourier identityとGaussian smoothing密度公式を証明できる
  - 特性関数が分布を一意に定めることをGaussian smoothingから証明できる
  - 有限二次モーメントから特性関数の二次展開を証明できる
  - Scheffeの補題を証明できる
  - Levy連続性定理のCLTに必要な版をGaussian smoothingから証明できる
definitions:
  - { id: F0P6-DEF-01, name: 特性関数 }
  - { id: F0P6-DEF-02, name: 分布収束 }
