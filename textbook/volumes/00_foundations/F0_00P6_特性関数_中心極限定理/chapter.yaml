  - { id: F0P6-PROP-01, name: 特性関数の基本性質 }
  - { id: F0P6-THM-01, name: bounded Lipschitz testによる分布収束の特徴付け }
  - { id: F0P6-LEM-01, name: Gaussian Fourier identity }
  - { id: F0P6-LEM-02, name: Gaussian smoothingの密度公式 }
  - { id: F0P6-THM-02, name: 特性関数の一意性 }
  - { id: F0P6-THM-03, name: 特性関数の二次展開 }
  - { id: F0P6-LEM-03, name: Scheffeの補題 }
  - { id: F0P6-THM-04, name: Levy連続性定理の極限分布既知版 }
canonical_examples:
  - Bernoulli characteristic function
  - Gaussian characteristic function
  - independent Gaussian sum
  - Gaussian smoothing
