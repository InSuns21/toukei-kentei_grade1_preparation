chapter: DYN3
scope: dream-theater
coverage: complete
prerequisites:
  - DYN2
concepts:
  - id: dynamical-systems.logistic-fixed-branch
    name: 固定点枝
    kind: definition
    introduction: formal
    introduction_aliases: ["定義（固定点枝）"]
    requires: [dynamical-systems.logistic-fixed]
  - id: dynamical-systems.logistic-stability-regimes
    name: Logistic写像の固定点の局所安定領域
    kind: theorem
    introduction_aliases: ["定理（Logistic写像の固定点の局所安定領域）"]
    requires: [dynamical-systems.logistic-fixed, dynamical-systems.attracting-multiplier-criterion, dynamical-systems.repelling-multiplier-criterion]
  - id: dynamical-systems.logistic-local-error-bound
    name: 正の固定点の明示的な局所吸引域
    kind: proposition
    introduction_aliases: ["命題（正の固定点の明示的な局所吸引域）"]
    requires: [dynamical-systems.logistic-stability-regimes]
  - id: dynamical-systems.fixed-point-basin
    name: 固定点の吸引域
    kind: definition
    introduction: formal
    introduction_aliases: ["定義（固定点の吸引域）"]
    requires: [dynamical-systems.interval-map, dynamical-systems.limit-fixed]
  - id: dynamical-systems.logistic-origin-basin
    name: 原点の吸引域と臨界値r=1
    kind: theorem
    introduction_aliases: ["定理（原点の吸引域と臨界値 $r=1$）"]
    requires: [dynamical-systems.fixed-point-basin, dynamical-systems.logistic-fixed]
  - id: dynamical-systems.logistic-low-r-basin
    name: 1<r<=2における正の固定点の吸引域
    kind: theorem
    introduction_aliases: ["定理（$1<r\\le2$ における正の固定点の吸引域）"]
    requires: [dynamical-systems.fixed-point-basin, dynamical-systems.monotone-orbit]
  - id: dynamical-systems.logistic-repeller-basin
    name: 反発的な固定点の吸引域は有限時刻の逆像
    kind: proposition
    introduction_aliases: ["命題（反発的な固定点の吸引域は有限時刻の逆像）"]
    requires: [dynamical-systems.fixed-point-basin, dynamical-systems.repelling-multiplier-criterion]
  - id: dynamical-systems.logistic-critical-three
    name: r=3の正の固定点は漸近安定
    kind: theorem
    introduction_aliases: ["定理（$r=3$ の正の固定点は漸近安定）"]
    requires: [dynamical-systems.fixed-point-stability, dynamical-systems.local-attraction, dynamical-systems.logistic-stability-regimes]
