id: "CA10"
title: "標準複素解析 X：無限積・Weierstrass 因数分解・Mittag--Leffler"
volume: "foundations"
status: supplementary
prerequisites:
  - CA7
  - CA4
official_scope: []
learning_objectives:
  - 無限積の局所一様収束を対数級数で制御し、極限の正則性と零点の由来を説明できる
  - Weierstrass の 基本因子 の誤差評価を導き、任意の離散零点多重集合から整関数を構成できる
  - 零点を持たない整関数が指数関数として表せることを示し、Weierstrass 因数分解定理を証明できる
  - 指定 主要部 から Taylor 多項式を差し引く Mittag--Leffler 構成をコンパクト集合上一様収束まで追える
  - 留数定理から pi cot(pi z) の部分分数展開を導き、そこから sin(pi z) の Euler 積を証明できる
definitions:
  - { id: CA10-DEF-01, name: 関数の無限積 }
  - { id: CA10-DEF-02, name: Weierstrass の 基本因子 }
  - { id: CA10-DEF-03, name: 標準積 }
  - { id: CA10-DEF-04, name: 主要部 データ }
theorems:
  - { id: CA10-THM-01, name: 無限積の局所一様収束判定 }
  - { id: CA10-LEM-01, name: 基本因子 の誤差評価 }
  - { id: CA10-THM-02, name: 離散零点集合を持つ整関数の構成 }
  - { id: CA10-THM-03, name: 零点を持たない整関数の指数表示 }
  - { id: CA10-THM-04, name: Weierstrass 因数分解定理 }
  - { id: CA10-THM-05, name: Mittag--Leffler の定理 }
  - { id: CA10-THM-06, name: pi cot(pi z) の部分分数展開 }
  - { id: CA10-THM-07, name: sin(pi z) の Euler 積 }
canonical_examples: [正規収束する一次因子積, 正の整数を零点に持つ 標準積, 正の整数に単純極を持つ Mittag--Leffler 級数, pi cot(pi z), sin(pi z) の Euler 積]
