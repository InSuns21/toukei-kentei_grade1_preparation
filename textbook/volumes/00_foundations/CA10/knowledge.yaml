    aliases: [基本因子の誤差評価, elementary factor estimate]
    introduction: formal
    introduction_aliases: ["補題（基本因子の誤差評価）"]
    requires: [complex-analysis.weierstrass-elementary-factor]

  - id: complex-analysis.canonical-product
    name: 標準積
