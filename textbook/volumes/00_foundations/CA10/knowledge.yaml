    introduction_aliases: ["定理（無限積の局所一様収束判定）"]
    requires: [complex-analysis.infinite-product, complex-analysis.holomorphic-locally-uniform-limit]

  - id: complex-analysis.weierstrass-elementary-factor
    name: Weierstrass の基本因子
    kind: definition
    aliases: [Weierstrass の基本因子, elementary factor]
    introduction: formal
    introduction_aliases: ["定義（Weierstrass の基本因子）"]
