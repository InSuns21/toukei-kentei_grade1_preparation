    introduction_aliases: ["定義（関数の無限積）"]
    requires: [complex-analysis.locally-uniform-convergence]

  - id: complex-analysis.infinite-product-local-uniform-criterion
    name: 無限積の局所一様収束判定
    kind: theorem
    aliases: [無限積の局所一様収束判定, locally uniform convergence criterion for infinite products]
