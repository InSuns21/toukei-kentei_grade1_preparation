    introduction: formal
    introduction_aliases: ["定義（標準積）"]
    requires: [complex-analysis.weierstrass-elementary-factor]

  - id: complex-analysis.weierstrass-zero-set-construction
    name: 離散零点集合を持つ整関数の構成
    kind: theorem
    aliases: [離散零点集合を持つ整関数の構成, Weierstrass zero set construction]
