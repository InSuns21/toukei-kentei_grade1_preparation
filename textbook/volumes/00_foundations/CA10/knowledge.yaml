chapter: CA10
scope: dream-theater
coverage: complete
prerequisites:
  - CA7
  - CA4

concepts:
  - id: complex-analysis.infinite-product
    name: 関数の無限積
    kind: definition
    aliases: [関数の無限積, infinite product]
