id: "EMAG7"
title: "電磁誘導と Maxwell 方程式"
volume: "foundations"
status: supplementary
prerequisites:
  - EMAG6
  - VC9
official_scope: []
learning_objectives:
  - 面の向きと境界の向きを一致させて磁束と誘導起電力の符号を計算できる
  - 固定回路の Faraday の法則を物理原理として説明し、Stokes の定理から微分形を導ける
  - Lenz の法則を磁束の変化方向に適用し、誘導電流の向きを説明できる
  - 運動する導体の起電力を Lorentz 力から計算し、機械的仕事と抵抗損失を照合できる
  - 充電コンデンサーを例に、磁静場 Ampère 則の問題と変位電流が必要な理由を説明できる
  - Ampère--Maxwell の法則と電場の Gauss の法則から電荷保存の連続の式を導ける
  - 真空中の四つの Maxwell 方程式について、積分形・微分形と経験則・数学定理の役割を区別できる
  - Faraday の法則から E=-grad phi-partial_t A を導き、gauge 変換で E と B が不変なことを確認できる
  - 単連結性がない領域では curl E=0 でも循環が非零になりうることを説明できる
definitions:
  - { id: EMAG7-DEF-01, name: "磁束" }
