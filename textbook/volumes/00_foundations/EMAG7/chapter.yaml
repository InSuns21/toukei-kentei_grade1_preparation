canonical_examples:
  - "傾いた円板の符号付き磁束と法線反転"
  - "時間変化する一様磁束に対する円周の起電力と誘導電場の方向"
  - "滑る導体棒での磁気力・起電力・機械的仕事と Joule 損失"
  - "コンデンサーの二つの張り方で伝導電流と変位電流を照合"
  - "単連結でないソレノイド外部領域の局所的な回転と大域的循環"
