id: "FLD5"
title: "抽象代数 XV：Galois 理論の応用――作図可能性・根号による可解性"
volume: "foundations"
status: supplementary
prerequisites:
  - FLD4
  - GRP4
official_scope: []
learning_objectives:
  - 定規とコンパスによる作図可能数を座標体で定式化し、作図可能性と実二次拡大列による包含が同値であることを証明できる
  - 作図可能な代数的数の Q 上の次数が 2 の冪である必要性を塔の公式から導き、立方体倍積・60度角の三等分・正七角形の不可能性を判定できる
  - 正多角形の作図を1の根と結び付け、正五角形を二次方程式へ落として実際に作図可能性を確認できる
  - 交換子部分群・導来列・可解群を定義し、可解群の可解列による特徴付けと部分群・商群に対する閉性を証明できる
  - 根号拡大と多項式の根号による可解性を定義し、1の根を含む1段根号拡大の Galois 群が可換になる機構を説明できる
  - 素数次数の巡回 Galois 拡大を Lagrange の分解式 で1段の根号拡大として表し、標数0で根号可解性と Galois 群の可解性が同値であることを証明できる
  - A_5 の単純性から S_5 が可解でないことを示し、x^5-4x+2 の Galois 群が S_5 であることから根号で解けない五次方程式の存在を証明できる
