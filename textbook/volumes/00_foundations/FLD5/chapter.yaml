  - { id: FLD5-COR-01, name: 作図可能な代数的数の次数は2の冪 }
  - { id: FLD5-PROP-01, name: 交換子部分群と最大可換商 }
  - { id: FLD5-THM-02, name: 可解群の可解列による特徴付け }
  - { id: FLD5-PROP-02, name: 可解群の部分群・商群・拡大に対する閉性 }
  - { id: FLD5-LEM-01, name: 1の根を含む1段根号拡大の Galois 群 }
  - { id: FLD5-LEM-02, name: 可換 Galois 段階列の正規閉包は可解 }
  - { id: FLD5-LEM-03, name: 素数次数巡回拡大の Kummer 表示 }
  - { id: FLD5-THM-03, name: 根号可解性と Galois 群の可解性 }
  - { id: FLD5-THM-04, name: A_5 の単純性と S_5 の非可解性 }
  - { id: FLD5-THM-05, name: x^5-4x+2 の Galois 群は S_5 }
  - { id: FLD5-COR-02, name: 根号で解けない五次方程式の存在 }
canonical_examples:
  - 立方体倍積を x^3-2 の次数3から不可能と判定
  - cos20度の最小多項式 y^3-3y-1 を用いて60度角の三等分不可能性を判定
  - 1の5乗根から t=2cos72度 が t^2+t-1=0 を満たすことを導き正五角形の作図可能性を確認
  - S_3 と S_4 に可解列を作り、A_5 と S_5 では導来列が止まらない機構を確認
  - x^3-2 の分解体 Q(cuberoot(2),zeta_3) を根号拡大と可解 Galois 群の両側から読む
  - x^5-4x+2 を Eisenstein 判定・実根の個数・Cauchy の定理から Galois 群 S_5 と同定
