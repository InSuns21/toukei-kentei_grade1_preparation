  - { id: NA10-THM-02, name: 実対称行列に対するシフト付き逆反復法の方向収束 }
  - { id: NA10-THM-03, name: Rayleigh 商反復の局所3次収束 }
  - { id: NA10-PROP-02, name: 固有対残差の対称後方誤差 }
  - { id: NA10-PROP-03, name: QR 更新の直交相似性 }
canonical_examples:
  - 3次対角行列に対する冪乗法と方向誤差の縮小
  - 同じ行列に対してシフトを変え、逆反復法が異なる固有値を選ぶ例
  - 2次実対称行列に対する Rayleigh 商反復
  - 小さい固有対残差から近傍固有値の存在を保証する例
  - 2次実対称行列の1回の QR 更新
  - 支配固有値の絶対値が同じため冪乗法の方向が収束しない例
