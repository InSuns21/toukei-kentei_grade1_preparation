id: "NA10"
title: "数値解析 X：固有値数値計算"
volume: "foundations"
status: supplementary
prerequisites:
  - NA1
  - NA8
  - NA9
  - F0-00E1
  - F0-00F1
official_scope: []
learning_objectives:
  - 単位ベクトル x と Rayleigh 商 rho_A(x) から固有対残差 r=Ax-rho_A(x)x を構成し、残差が近似固有対の品質を表す理由を説明できる
  - 実対称行列に対する冪乗法の収束を固有ベクトル展開から導き、支配固有値の絶対値比で方向誤差を評価できる
  - 逆反復法とシフト付き逆反復法を線形方程式の反復として構成し、シフトに最も近い単純固有値へ収束する条件を説明できる
  - Rayleigh 商反復を定義し、実対称行列の単純固有値近傍で方向誤差が局所的に3次で縮小することを証明できる
  - 実対称行列について Rayleigh 商と残差から近傍固有値への距離を評価し、残差ノルムが対称摂動に対する後方誤差になることを示せる
  - 直交反復法と QR 法を結び付け、1回の QR 更新が直交相似変換で固有値と対称性を保存することを証明できる
  - 支配固有値の絶対値の重複、初期ベクトルの直交、シフトの選択、固有値の重複が各反復法へ与える影響を説明できる
  - 冪乗法・シフト付き逆反復法・Rayleigh 商反復・QR 法の役割を、求めたい固有値の位置と1反復コストの観点から使い分けられる
