<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420" role="img" aria-labelledby="title desc" data-layout-lint="strict">
  <title id="title">無限直線電流と円形の Ampère 経路</title>
  <desc id="desc">紙面手前向きに流れる直線電流を中心に、半径 s の破線円 C を取り、円周上の接線方向に磁場 B が反時計回りを向く上面図。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
  </defs>

  <circle cx="330" cy="210" r="120" fill="none" stroke="#666" stroke-width="3" stroke-dasharray="10 8"/>
  <circle cx="330" cy="210" r="22" fill="#eeeeee" stroke="#222" stroke-width="3"/>
  <circle cx="330" cy="210" r="6" fill="#222"/>

  <line x1="330" y1="210" x2="450" y2="210" stroke="#777" stroke-width="2"/>
  <line x1="392" y1="90" x2="268" y2="90" stroke="#2f6f9f" stroke-width="5" marker-end="url(#arrow)"/>

  <text x="370" y="270" font-size="24" font-family="sans-serif">I</text>
  <text x="386" y="190" font-size="24" font-family="sans-serif">s</text>
  <text x="196" y="132" font-size="24" font-family="sans-serif">C</text>
  <text x="410" y="60" font-size="26" font-family="sans-serif">B</text>
</svg>
