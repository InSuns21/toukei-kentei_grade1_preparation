id: "EMAG5"
title: "電流・磁場・Ampère の法則"
volume: "foundations"
status: supplementary
prerequisites:
  - EMAG4
  - VC5
official_scope: []
learning_objectives:
  - 向き付けられた面を横切る電流を電流密度 J の流束として定義し、単位と符号を説明できる
  - 固定体積の電荷保存から積分形の電荷保存則を立て、発散定理を使って連続の式 partial_t rho + div J = 0 を導ける
  - 定常電流では div J=0 となり、同じ境界を持つ曲面を貫く電流が一致する理由を説明できる
  - Biot--Savart の法則から無限直線電流の磁場 B=mu_0 I/(2 pi s) e_phi を途中式付きで導ける
  - 磁静場における Ampère の法則を対称性と組み合わせ、直線電流・円柱電流・同軸配置の磁場を求められる
  - 磁束に対する Gauss の法則と div B=0 の意味を、磁力線に始点・終点がないことと結び付けて説明できる
  - VC5 のベクトルポテンシャル B=curl A を磁場へ適用し、A->A+grad chi のゲージ自由度を具体例で確認できる
  - VC9 の Ampère--Maxwell 則と本章の磁静場近似の関係を説明し、時間変化する場では変位電流が必要になることを述べられる
