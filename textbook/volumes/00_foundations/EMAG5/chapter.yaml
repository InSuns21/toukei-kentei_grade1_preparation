canonical_examples:
  - "一様な電流密度が円形断面を通るとき I=J pi a^2 を確認する例"
  - "固定体積の電荷変化と境界から流出する電流を対応させて連続の式を導く例"
  - "Biot--Savart の法則を無限直線電流へ適用し、方向と 1/s の大きさを導く例"
  - "Ampère の法則で一様電流密度を持つ円柱導体の内外磁場を求める例"
  - "一様磁場に対する二つのベクトルポテンシャルがゲージ変換で結ばれる例"
