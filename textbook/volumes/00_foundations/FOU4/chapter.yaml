id: "FOU4"
title: "標準Fourier解析 IV：Plancherel・L2 Fourier解析"
volume: "foundations"
status: supplementary
prerequisites:
  - FOU3
  - MT7
  - F0-02C1
# FOU4 で初めて L2 完備性・Hilbert 空間を明示的に使う。
# 複素解析は prerequisite にしない。留数計算等は変換対を求める別ルートであり、本章の Plancherel / L2 拡張の論理基盤ではない。
official_scope: []
learning_objectives:
  - 複素L2の内積・完備性とFourier規約の正規化定数を区別して扱える
  - L2平行移動連続性をCc稠密性から証明し、Gaussian approximate identity がL2でも収束することを示せる
  - Gaussian正則化で得られる稠密な良い関数族上でPlancherel等式をFourier反転から証明できる
  - 稠密部分空間上のFourier変換をL2完備性により全L2へ一意に延長できる
  - L1かつL2の関数ではL2 Fourier変換が従来のL1 Fourier変換と一致することを示せる
  - Parseval内積等式を導き、正規化Fourier変換をユニタリ作用素として理解できる
  - L2での反転、平行移動・変調、L1-L2畳み込みの公式を密度と連続性から延長できる
  - 本章で必要な関数解析と、複素解析・Sobolev理論へ送る事項の境界を説明できる
