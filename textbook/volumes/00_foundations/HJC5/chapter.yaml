  - "無制御ブラウン運動と terminal cost x^2 に対する V(t,x)=x^2+sigma^2(T-t)"
  - "control が一つしかない場合に二階 HJB が Feynman--Kac の線形 PDE へ戻る例"
  - "rank-deficient sigma による degenerate diffusion と半正定値二階項"
