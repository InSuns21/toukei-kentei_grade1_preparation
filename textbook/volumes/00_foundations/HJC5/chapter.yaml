id: "HJC5"
title: "確率制御・二階 Hamilton--Jacobi--Bellman 方程式"
volume: "foundations"
status: supplementary
prerequisites:
  - HJC3
  - STO7
  - STO9
  - STO11
official_scope: []
learning_objectives:
  - progressively measurable な確率制御と controlled diffusion を定義し、決定論的制御との違いを説明できる
  - 期待損失を用いた stochastic value function を定式化し、条件付き期待値を使う stochastic dynamic programming principle を再構成できる
  - controlled generator を Itô 公式から計算し、ドリフトが一階項、拡散が Hessian を含む二階項を生むことを説明できる
  - stochastic DPP の短時間展開から二階 HJB equation を導出できる
  - smooth verification theorem を Itô 公式と HJB 不等式から証明し、最適 feedback の候補を検証できる
  - 二階 HJB の viscosity subsolution / supersolution 条件を C^{1,2} test function で記述できる
  - stochastic DPP から value function の viscosity solution 性を、上接触・下接触の両方向で導ける
  - 拡散行列 a=sigma sigma^T が半正定値であることから、二階 HJB の degenerate parabolic 構造を説明できる
  - Feynman--Kac の線形後退 PDE と、control の infimum が入る HJB の非線形性の違いを説明できる
  - 一次元線形 Gaussian 制御で quadratic ansatz から Riccati 型 ODE と最適 feedback を導出し、verification まで行える
