  - F0-00D2B
forward_references: []

concepts:
  - id: analysis.local-oscillation
    name: 局所振動
    kind: definition
    aliases: [局所振動, local oscillation]
    requires:
      - topology.metric-space
      - set.function

  - id: analysis.darboux-simple-integral-agreement
    name: Darboux和と単関数積分の一致
