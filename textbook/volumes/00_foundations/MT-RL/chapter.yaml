id: "MT-RL"
title: "標準測度論ブリッジ：Riemann積分とLebesgue積分"
volume: "foundations"
status: supplementary
prerequisites:
  - RA4
  - F0-00D4
  - F0-00D2B
official_scope: []
learning_objectives:
  - Darboux上和・下和をLebesgue単関数の積分として読み替えられる
  - 有界なRiemann可積分関数がLebesgue可積分で積分値が一致することを説明できる
  - LebesgueのRiemann可積分性判定を使って可積分・非可積分を判定できる
  - 広義Riemann積分とLebesgue積分の一致条件・不一致例を区別できる
definitions:
  - { id: MT-RL-DEF-01, name: 局所振動 }
