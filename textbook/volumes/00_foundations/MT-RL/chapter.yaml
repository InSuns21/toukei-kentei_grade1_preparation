  - { id: MT-RL-THM-01, name: Riemann積分とLebesgue積分の一致 }
  - { id: MT-RL-THM-02, name: LebesgueのRiemann可積分性判定 }
  - { id: MT-RL-THM-03, name: 非負広義Riemann積分とLebesgue積分の一致 }
canonical_examples: [Dirichlet関数, Thomae関数, Cantor集合の指示関数, sin(x)/xの広義積分]
