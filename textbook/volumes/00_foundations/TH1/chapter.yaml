id: "TH1"
title: "平衡状態・状態量・温度"
volume: "foundations"
status: supplementary
prerequisites:
  - MECH1
  - RA3
official_scope: []
learning_objectives:
  - 系と環境・境界の選び方を示し、閉鎖系・開放系・孤立系を区別できる
  - 熱力学的平衡と非平衡な定常状態を区別し、状態量の定義を説明できる
  - 示量量と示強量の複製則を使って体積・物質量・温度・圧力・密度を判定できる
  - 第0法則と対称性・反射性から熱平衡の同値関係を証明し、経験温度の非一意性を説明できる
  - 理想気体の状態方程式の適用範囲・単位・独立変数の制限を説明できる
  - 理想気体の拡大不変性と等温・定積での圧力偏微分を途中式から導出できる
definitions:
  - { id: TH1-DEF-01, name: "系・環境・境界" }
  - { id: TH1-DEF-02, name: "熱力学的平衡状態" }
  - { id: TH1-DEF-03, name: "巨視的状態量・状態関数" }
  - { id: TH1-DEF-04, name: "示量量・示強量" }
  - { id: TH1-DEF-05, name: "熱平衡関係" }
  - { id: TH1-DEF-06, name: "経験温度" }
  - { id: TH1-DEF-07, name: "状態方程式" }
theorems:
