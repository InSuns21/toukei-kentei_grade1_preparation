  - { id: TH1-PROP-01, name: "熱平衡関係の同値性" }
  - { id: TH1-PROP-02, name: "理想気体の拡大不変性" }
  - { id: TH1-PROP-03, name: "理想気体の圧力の偏微分" }
canonical_examples:
  - 密閉ピストンの閉鎖系と非孤立系の違い
  - 二室の温度差と非平衡な定常熱流
  - 物質量と体積を二倍にする理想的な複製
  - 温度計を仲立ちにした熱平衡関係
  - 四つの測定量の拘束としての理想気体の状態方程式
  - 圧力の温度微分と体積微分の符号の比較
