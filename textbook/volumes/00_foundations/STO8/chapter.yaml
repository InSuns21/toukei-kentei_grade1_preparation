id: "STO8"
title: "Encore IV Stochastic Analysis VIII：local time・Tanaka formula"
volume: "foundations"
status: supplementary
prerequisites:
  - STO3
  - STO4
  - STO5
  - STO6
  - STO7
  - F0-00D2C
official_scope: []
learning_objectives:
  - 絶対値のkinkで通常のC2 Itô formulaが止まる理由を説明し、平滑化で欠けた二階項を局所時間として取り出せる
  - Brown運動のlevel aにおけるlocal timeをoccupation kernelの極限として構成し、Tanaka formulaを証明できる
  - Tanaka formulaからpositive part / negative partの公式を導出できる
  - local timeの増加測度がlevel set {B=a}に支えられる一方、そのlevel setのLebesgue時間が0であることを証明できる
  - Brownian local timeの空間変数aに関する連続versionをmoment estimateとKolmogorov--Chentsovで構成できる
  - occupation time formulaをkernel近似とTonelli/Fubiniから証明し、local timeが滞在時間密度であることを説明できる
  - interval occupationからL_t^aを回収する近似公式を導ける
  - Skorokhod reflection lemmaとLevy transformを用い、|B|とlocal timeを反射Brown運動として表現できる
  - reflection principleを使いL_t^0の分布を計算し、局所時間とrunning maximumの関係を説明できる
