id: "STO8"
title: "Encore IV 確率解析 VIII：局所時間・Tanaka 公式"
volume: "foundations"
status: supplementary
prerequisites:
  - STO3
  - STO4
  - STO5
  - STO6
  - STO7
  - F0-00D2C
official_scope: []
learning_objectives:
  - 絶対値のkinkで通常のC2 Itô formulaが止まる理由を説明し、平滑化で欠けた二階項を局所時間として取り出せる
  - ブラウン運動のlevel aにおける局所時間をoccupation kernelの極限として構成し、Tanaka 公式を証明できる
  - Tanaka 公式からpositive part / negative partの公式を導出できる
  - 局所時間の増加測度がレベル集合 {B=a}に支えられる一方、そのレベル集合のLebesgue時間が0であることを証明できる
  - ブラウン局所時間の空間変数aに関する連続versionをモーメント評価とKolmogorov--Chentsovで構成できる
  - 滞在時間公式をkernel近似とTonelli/Fubiniから証明し、局所時間が滞在時間密度であることを説明できる
  - interval occupationからL_t^aを回収する近似公式を導ける
  - Skorokhod 反射補題とLevy transformを用い、|B|と局所時間を反射ブラウン運動として表現できる
  - 反射 principleを使いL_t^0の分布を計算し、局所時間とrunning maximumの関係を説明できる
