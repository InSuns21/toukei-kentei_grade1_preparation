  - { id: STO8-PROP-01, name: "局所時間の増加はレベル集合に支えられる" }
  - { id: STO8-PROP-02, name: "ブラウンレベル集合のLebesgue時間は0" }
  - { id: STO8-LEM-01, name: "interval occupation moment bound" }
  - { id: STO8-THM-02, name: "ブラウン局所時間の空間連続性" }
  - { id: STO8-THM-03, name: "滞在時間公式" }
  - { id: STO8-COR-02, name: "interval occupationによる局所時間近似" }
  - { id: STO8-LEM-02, name: "Skorokhod 反射補題" }
  - { id: STO8-PROP-03, name: "Levy transformはブラウン運動" }
  - { id: STO8-THM-04, name: "ブラウン反射 representation by 局所時間" }
canonical_examples:
  - "a=0でE[L_t^0]=sqrt(2t/pi)"
  - "ブラウン zero setはLebesgue measure 0だがL^0はそこでのみ増える"
  - "1/(2epsilon) integral 1{|B_s-a|<epsilon} ds -> L_t^a"
  - "|B_t|=beta_t+L_t^0 と L_t^0=-min_{s<=t} beta_s"
  - "L_t^0 has the same 法則 as sup_{s<=t} B_s and |B_t|"
