  - { id: STO8-LEM-01, name: "interval occupation moment bound" }
  - { id: STO8-THM-02, name: "Brownian local timeの空間連続性" }
  - { id: STO8-THM-03, name: "occupation time formula" }
  - { id: STO8-COR-02, name: "interval occupationによるlocal time近似" }
  - { id: STO8-LEM-02, name: "Skorokhod reflection lemma" }
  - { id: STO8-PROP-03, name: "Levy transformはBrown運動" }
  - { id: STO8-THM-04, name: "Brownian reflection representation by local time" }
canonical_examples:
  - "a=0でE[L_t^0]=sqrt(2t/pi)"
  - "Brownian zero setはLebesgue measure 0だがL^0はそこでのみ増える"
  - "1/(2epsilon) integral 1{|B_s-a|<epsilon} ds -> L_t^a"
  - "|B_t|=beta_t+L_t^0 と L_t^0=-min_{s<=t} beta_s"
  - "L_t^0 has the same law as sup_{s<=t} B_s and |B_t|"
