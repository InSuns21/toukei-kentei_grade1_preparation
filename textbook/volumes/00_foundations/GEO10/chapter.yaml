id: "GEO10"
title: "幾何学 X：Euclid 空間の曲線・超曲面 I：基本形式と形作用素"
volume: "foundations"
status: supplementary
prerequisites:
  - GEO3
  - VC2
  - VC3
  - LA5
official_scope: []
learning_objectives:
  - VC2 の正則曲線・弧長を踏まえて弧長パラメータ・単位速曲線を定義し、正則曲線を局所的に弧長パラメータへ再表示できる
  - 単位速曲線の曲率・Frenet 標構・捩率を定義し、Frenet--Serret 公式を導出できる
  - 一般パラメータから曲率と捩率を計算し、円・らせんで直接検証できる
  - Euclid 空間の超曲面と単位法線場を部分多様体として定義し、第一基本形式を誘導内積として計算できる
  - Gauss 写像・形作用素・第二基本形式を定義し、形作用素が接空間に値を取り自己共役になることを証明できる
  - 局所パラメータ表示から第一・第二基本形式の係数を計算し、形作用素の行列を G^{-1}B として求められる
  - 主曲率・Gauss 曲率・平均曲率を定義し、自己共役性から主方向の正規直交基底が存在することを説明できる
  - 正規曲率を第二基本形式で表し、Euler の公式を主方向分解から導出できる
  - 平面・球面・円柱・トーラスの第一・第二基本形式と主曲率を直接計算できる
