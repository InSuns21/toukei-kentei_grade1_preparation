id: "VN7"
title: "factor と型分類への入口"
volume: "foundations"
status: supplementary
prerequisites:
  - VN2
  - VN3
  - VN5
  - VN6
official_scope: []
learning_objectives:
  - von Neumann 環 M の中心 Z(M)=M∩M' を定義し、中心射影 z による M≅zM⊕(I-z)M の分解を証明できる
  - factor を Z(M)=CI で定義し、M_n(C) と B(H) が factor になることを行列単位・rank-one 作用素から証明できる
  - 射影 p,q の Murray--von Neumann 同値を部分等長作用素 v*v=p, vv*=q で定義し、それが同値関係であることを証明できる
  - M_n(C) では射影の Murray--von Neumann 同値が rank の一致と同値であることを証明できる
  - 有限射影・無限射影・最小射影を定義し、片側シフトから B(l2) の単位射影が無限であることを示せる
  - factor の I / II / III 型を最小射影と有限射影の有無から区別し、M_n(C) を I_n 型、B(l2) を I_infinity 型と判定できる
  - II 型・III 型が必要になる理由を、最小射影と有限射影が失われる構造として説明できる
