  - { id: LIE3-THM-03, name: 閉部分群定理 }
  - { id: LIE3-THM-04, name: 特殊線形群とその Lie 環 }
  - { id: LIE3-THM-05, name: 直交群・特殊直交群とその Lie 環 }
  - { id: LIE3-THM-06, name: ユニタリ群・特殊ユニタリ群とその Lie 環 }
