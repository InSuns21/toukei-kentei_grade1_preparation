id: "LIE3"
title: "Lie 理論 III：Lie 部分群・古典群"
volume: "foundations"
status: supplementary
prerequisites:
  - LIE2
  - LA6
official_scope: []
learning_objectives:
  - Lie 部分群を埋め込み部分多様体かつ部分群として定義し、包含写像の微分から接 Lie 環が親 Lie 環の Lie 部分環になることを説明できる
  - Lie 部分群の指数写像が親 Lie 群の指数写像の制限になることを Lie 群準同型の自然性から証明できる
  - 閉部分群定理が「閉部分群なら自動的に埋め込み Lie 部分群になる」という剛性を与えることと、本章での使用範囲を説明できる
  - SL(n,R) を det=1 の正則レベル集合として扱い、sl(n,R) がトレース0行列全体であることを直接計算できる
  - O(n) と SO(n) の接 Lie 環が歪対称行列全体であることを A^T A=I の微分から導ける
  - U(n) と SU(n) を複素行列空間を実多様体とみなして扱い、その接 Lie 環を歪Hermitian条件とトレース条件から導ける
  - GL(n,R), SL(n,R), O(n), SO(n), U(n), SU(n) の実次元を接空間の線形条件から計算できる
  - SO(2) と SU(2) の低次元例で指数写像と Lie 括弧を具体計算できる
