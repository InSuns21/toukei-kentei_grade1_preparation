id: "FEM1"
title: "有限要素法 I：Poisson 方程式・変分形式・Galerkin 法"
volume: "foundations"
status: supplementary
prerequisites:
  - GPDE7
official_scope: []
learning_objectives:
  - Poisson 零 Dirichlet 問題を変分形式として確認し、有限次元部分空間へ制限する Galerkin 離散化を定式化できる
  - 適合性 V_h subset V により連続問題の有界性・強圧性が離散問題へ継承されることを説明し、Lax--Milgram から離散解の存在一意性を導ける
  - Galerkin 基底から係数行列 A_ij=a(phi_j,phi_i) と右辺 b_i=F(phi_i) を構成し、強圧性から正則性、対称問題では実対称正定値性を証明できる
  - 連続問題と離散問題の差から Galerkin 直交性を証明できる
  - 有界性・強圧性・Galerkin 直交性から Céa の補題を証明し、準最良近似性の意味を説明できる
  - 対称強圧的問題でエネルギーノルムを定義し、Pythagoras 型恒等式から厳密な最良近似性を証明できる
  - 一次元 Poisson 問題を低次元 Galerkin 空間へ落とし、剛性行列・右辺・係数・近似解を手計算できる
  - Céa の補題だけでは収束率が閉じず、空間の近似能力を FEM2--FEM4 で評価する必要があることを説明できる
definitions:
