  - { id: FEM1-PROP-01, name: Galerkin 方程式の行列表現 }
  - { id: FEM1-THM-02, name: Galerkin 直交性 }
  - { id: FEM1-THM-03, name: Céa の補題 }
  - { id: FEM1-THM-04, name: 対称 Galerkin 法のエネルギーノルム最良近似性 }
  - { id: FEM1-COR-01, name: Poisson Galerkin 近似の存在一意性と最良近似性 }
canonical_examples:
