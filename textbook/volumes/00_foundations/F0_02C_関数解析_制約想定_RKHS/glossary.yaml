chapter: "F0-02C"
terms:
  - term: 関数解析
    english: functional analysis
    meaning: ノルム・内積・位相などを備えた関数空間や無限次元ベクトル空間を扱う解析学。
  - term: Banach空間
    english: Banach space
    meaning: 完備なノルム空間。詳細はF0-02C1で扱う。
  - term: Hilbert空間
    english: Hilbert space
    meaning: 内積から定まるノルムについて完備な空間。詳細はF0-02C1で扱う。
  - term: RKHS
    english: reproducing kernel Hilbert space
    meaning: 点評価が連続な関数Hilbert空間。詳細はF0-02C7で扱う。
