  - "調和振動子で Lagrangian energy が通常の力学的エネルギーに一致する例"
  - "V(x,y)=V(y) の粒子で x 方向並進から p_x 保存を得る例"
  - "中心ポテンシャルで無限小回転から角運動量保存を得る例"
