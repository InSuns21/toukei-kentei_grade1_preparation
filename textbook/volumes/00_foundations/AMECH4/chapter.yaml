id: "AMECH4"
title: "対称性・循環座標・Noether の定理"
volume: "foundations"
status: supplementary
prerequisites:
  - AMECH3
official_scope: []
learning_objectives:
  - 一般化運動量 p_j=partial L/partial dot q_j を定義し、座標選択によって通常の運動量や角運動量成分になることを具体例で確認できる
  - 循環座標 q_a に対して Lagrange 方程式から p_a の保存を途中式を追って導ける
  - Lagrangian energy E_L=sum_j dot q_j p_j-L の時間微分を計算し、dE_L/dt=-partial L/partial t を証明できる
  - 自然な Lagrangian で E_L=T+V となる条件を確認し、時間並進対称性とエネルギー保存を結び付けられる
  - 本章で扱う1パラメータ無限小対称性を変換の生成方向 xi と定数時間シフト tau で記述できる
  - 有限自由度の Noether の定理を証明し、保存量 J=sum_j p_j xi_j-tau E_L を導ける
  - 空間並進から運動量、回転から角運動量、時間並進からエネルギーが現れることを手計算で示せる
  - 対称性が壊れたとき対応する保存量が一般には保存しないことを具体例で説明できる
