id: "DYN2"
title: "固定点の安定性と乗数"
volume: "foundations"
status: supplementary
prerequisites:
  - DYN1
  - RA3
official_scope: []
learning_objectives:
  - Lyapunov安定性・局所吸引性・漸近安定性・不安定性をε–δの量化順序から判定できる
  - 固定点の乗数を差商の極限から求め端点の片側微分も正しく扱える
  - 絶対値1未満の乗数から局所誤差の幾何収束と漸近安定性を証明できる
  - 平均値定理の適用区間と導関数の一様上界を確認して局所縮小を証明できる
  - 絶対値1を超える乗数から任意に近い初期値が有限時刻で近傍を出ることを証明できる
  - 反復の導関数が固定点で乗数のn乗になることを連鎖律から導ける
  - 乗数の絶対値が1となる場合に安定・吸引・不安定の異なる例を定義へ戻って分類できる
  - 非線形・非C1の具体写像について局所判定と大域的な軌道収束を区別できる
definitions:
  - { id: DYN2-DEF-01, name: "固定点の安定性と吸引性" }
  - { id: DYN2-DEF-02, name: "固定点の乗数" }
theorems:
