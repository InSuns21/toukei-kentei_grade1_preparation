propositions:
  - { id: DYN2-PROP-01, name: "平均値定理による局所的な一様縮小" }
  - { id: DYN2-PROP-02, name: "固定点での反復写像の導関数" }
canonical_examples:
  - "恒等写像の安定だが非吸引な固定点"
  - "1-x/2の負の乗数と交互収束"
  - "x²の二固定点で異なる安定性"
  - "2x/(1+x)の端点の吸引と反発"
  - "x-x²とx+x²(1-x)の乗数1で異なる挙動"
  - "微分係数0だが導関数が近傍で非有界な振動写像"
  - "a*x/(1+(a-1)*x)の軌道の明示公式"
