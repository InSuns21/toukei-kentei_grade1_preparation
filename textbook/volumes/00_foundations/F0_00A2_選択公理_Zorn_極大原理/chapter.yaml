official_scope: []
learning_objectives:
  - 選択関数と選択公理を定義し、有限選択・可算選択との違いを説明できる
  - 半順序集合・chain・上界・極大元を定義し、最大元と区別できる
  - Zornの補題を正確に述べ、典型的な適用手順を説明できる
  - 一般のベクトル空間にHamel基底が存在する標準証明と選択公理の関係を説明できる
  - Hahn--Banachの極大延長でZornの補題が使われる理由を説明できる
