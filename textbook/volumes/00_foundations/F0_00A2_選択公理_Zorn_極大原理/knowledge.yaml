chapter: F0-00A2
scope: dream-theater
coverage: complete
prerequisites: []

# Zornそのものは次章A3で正式導入する。A2では同値形として先に名前だけ出す。
forward_references:
  - set.zorn-lemma

concepts:
  - id: set.choice-function
    name: 選択関数
    kind: definition
    aliases: [選択関数]
    requires: []

  # 現行formal監査は「公理」をformal kindに含めないため、依存グラフ上は用語として登録する。
  # 本文では formal-statement パネルで公理として明示されている。
  - id: set.choice-axiom
    name: 選択公理
    kind: term
    introduction: inline
    aliases: [選択公理, axiom of choice, AC]
    requires:
      - set.choice-function

  - id: set.countable-choice
    name: 可算選択公理
    kind: term
    introduction: inline
    aliases: [可算選択公理, countable choice]
    requires:
      - set.choice-function

  # metadata上では同値定理の依存を先に宣言する。raw監査は本文の実行番号を使うため、
  # 本文で整列の定義が定理より後なら隠せない。
  - id: set.well-order
    name: 整列
    kind: definition
    aliases: [整列]
    requires: []

  - id: set.choice-equivalence-summary
    name: 選択公理の代表的同値形
    kind: theorem
    aliases: [選択公理の代表的同値形]
    requires:
      - set.choice-axiom
      - set.well-order
