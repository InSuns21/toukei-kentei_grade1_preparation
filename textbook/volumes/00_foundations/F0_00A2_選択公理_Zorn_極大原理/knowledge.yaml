chapter: F0-00A2
scope: dream-theater
coverage: complete
prerequisites:
  - F0-00A1D

# Zornとその半順序語彙は次章A3で正式導入する。線形代数への言及は後続応用の予告。
forward_references:
  - set.partial-order
  - set.zorn-lemma
  - set.maximum-maximal-element
  - set.chain
  - linear.vector-space
  - linear.basis

concepts:
  - id: set.choice-function
    name: 選択関数
    kind: definition
    aliases: [選択関数]
    requires:
      - set.indexed-family
      - set.function

  - id: set.choice-axiom
    name: 選択公理
    kind: axiom
    aliases: [選択公理, axiom of choice, AC]
    requires:
      - set.choice-function

  - id: set.countable-choice
    name: 可算選択公理
    kind: axiom
    aliases: [可算選択公理, countable choice]
    requires:
      - set.choice-function

  - id: set.well-ordering-theorem
    name: 整列可能定理
    kind: theorem
    aliases: [整列可能定理, 整列定理, well-ordering theorem]
    requires:
      - set.choice-axiom
      - order.well-orderable

  - id: set.choice-equivalence-summary
    name: 選択公理の代表的同値形
    kind: theorem
    aliases: [選択公理の代表的同値形]
    requires:
      - set.choice-axiom
      - set.well-ordering-theorem
