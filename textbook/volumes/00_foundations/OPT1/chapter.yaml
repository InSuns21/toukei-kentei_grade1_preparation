  - { id: OPT1-THM-02, name: 準凸性の下位集合による特徴付け }
  - { id: OPT1-THM-03, name: 微分可能な凸関数の一次支持不等式 }
  - { id: OPT1-THM-04, name: 凸関数の局所最小は大域最小 }
  - { id: OPT1-THM-05, name: 狭義凸関数の最小点の一意性 }
  - { id: OPT1-PROP-01, name: 凸最適化問題の実行可能集合は凸 }
canonical_examples:
  - 半空間と円周を凸集合の定義から比較する例
  - 二次関数で凸性・狭義凸性を直接検算する例
  - 非負直交象限を凸錐として定義から検算する例
  - x^3 が準凸かつ準凹だが凸でも凹でもない例
  - 非凸実行可能集合で局所最小が大域最小にならない例
  - 正定値二次目的と単体型制約からなる凸最適化問題
