id: "OPT1"
title: "凸集合・凸関数・凸最適化"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00G
official_scope: []
learning_objectives:
  - 凸集合・凸包・凸関数の既存定義を使い、低次元の集合と関数の凸性を定義から判定できる
  - 凸錐を定義し、凸集合との違いを非負係数の条件から説明できる
  - 準凸関数・準凹関数を定義し、凸性・凹性より弱い概念であることを具体例で示せる
  - 準凸性と全ての下位集合の凸性が同値であることを証明できる
  - 狭義凸関数の最小点が存在すれば一意であることを証明できる
  - 凸不等式制約と affine 等式制約から作る実行可能集合が凸になることを証明できる
  - 凸選好に対応する関数側の性質が凸性ではなく準凹性であることを区別できる
  - 非凸な実行可能集合では局所最小から大域最小への議論が壊れる機構を説明できる
definitions:
  - { id: OPT1-DEF-01, name: 凸錐 }
  - { id: OPT1-DEF-02, name: 準凸関数・準凹関数 }
theorems:
  - { id: OPT1-THM-01, name: 準凸性の下位集合による特徴付け }
  - { id: OPT1-THM-02, name: 狭義凸関数の最小点の一意性 }
  - { id: OPT1-PROP-01, name: 凸最適化問題の実行可能集合は凸 }
canonical_examples:
  - 非負直交象限を凸錐として定義から検算する例
  - x^3 が準凸かつ準凹だが凸でも凹でもない例
  - 非凸実行可能集合で局所最小が大域最小にならない例
  - 正定値二次目的と単体型制約からなる凸最適化問題
problem_patterns:
  - OPT1-CONVEX-SET-1
  - OPT1-CONVEX-CONE-1
  - OPT1-QUASICONVEX-1
  - OPT1-CONVEX-PROBLEM-1
  - OPT1-STRICT-CONVEX-UNIQUENESS-1
  - OPT1-INTEGRATED-1
