id: "OPT1"
title: "凸集合・凸関数・凸最適化"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00F1
  - VC1
official_scope: []
learning_objectives:
  - 凸結合・凸集合・凸包を定義し、低次元の集合の凸性を定義から判定できる
  - 凸関数・狭義凸関数を定義し、C2 関数の凸性と Hessian 半正定値性の同値を証明できる
  - 凸錐を定義し、凸集合との違いを非負係数の条件から説明できる
  - 準凸関数・準凹関数を定義し、凸性・凹性より弱い概念であることを具体例で示せる
  - 準凸性と全ての下位集合の凸性が同値であることを証明できる
  - 微分可能凸関数の一次支持不等式を証明し、停留点が大域最小になる理由を説明できる
  - 凸関数の局所最小が大域最小になることを証明できる
  - 狭義凸関数の最小点が存在すれば一意であることを証明できる
  - 凸不等式制約と affine 等式制約から作る実行可能集合が凸になることを証明できる
  - 凸選好に対応する関数側の性質が凸性ではなく準凹性であることを区別できる
  - 非凸な実行可能集合では局所最小から大域最小への議論が壊れる機構を説明できる
