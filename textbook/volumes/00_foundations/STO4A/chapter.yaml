id: "STO4A"
title: "Brown運動の標本路幾何"
volume: "foundations"
status: supplementary
prerequisites:
  - STO4
  - STO5
  - STO8
  - MT8
official_scope: []
learning_objectives:
  - Gaussian incrementの高次momentからBrown標本路が任意のalpha<1/2でHolderであることを導ける
  - alpha>1/2のHolder標本路ではquadratic variationが0になることを示しBrown motionとの矛盾を説明できる
  - Brownian total variationが無限でquadratic variationが時間になる意味をregularity scaleとして説明できる
  - dyadic incrementsとBorel-CantelliからBrown標本路のnowhere differentiabilityを証明できる
  - Brownian zero setがclosedで孤立点を持たずLebesgue measure zeroであることを証明できる
  - dyadic hitting intervalsの期待個数をO(sqrt n)で評価しzero-set Hausdorff dimensionの上界1/2を証明できる
  - Tanaka formulaとBDG inequalityからlocal timeのtemporal Holder regularityを証明できる
  - local-time Stieltjes measureがzero setに集中することと質量分布原理からdimension下界1/2を証明できる
  - Brownian zero setのHausdorff dimensionが1/2であることをupper/lower boundから再構成できる
definitions: []
