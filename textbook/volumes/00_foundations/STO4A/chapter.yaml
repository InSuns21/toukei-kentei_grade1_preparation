  - { id: STO4A-THM-01, name: Brown標本路のHolder正則性：指数1/2未満 }
  - { id: STO4A-THM-02, name: Brown標本路のHolder臨界指数：1/2より大きい指数は不可 }
  - { id: STO4A-PROP-02, name: Brown標本路のvariation scale }
  - { id: STO4A-THM-03, name: Brown標本路はnowhere differentiable }
  - { id: STO4A-PROP-03, name: Brownian zero setの基本性質 }
  - { id: STO4A-LEM-01, name: Gaussian tailの簡単な上界 }
  - { id: STO4A-THM-04, name: Brownian zero setのdimension上界 }
  - { id: STO4A-THM-05, name: Brownian local timeの時間Holder regularity }
  - { id: STO4A-THM-06, name: Brownian zero setのdimension下界 }
  - { id: STO4A-THM-07, name: Brownian zero setのHausdorff dimension }
