official_scope: []
learning_objectives:
  - 有限符号付き測度の正集合・負集合・零集合を量化まで含めて区別できる
  - 符号付き測度の値域有界性を可算加法性から証明しHahn分解の存在へ接続できる
  - Hahn分解からJordan分解の存在・一意性・最小性を導出できる
  - 全変動測度の分割表示と積分評価を証明できる
  - 密度が既知の符号付き測度について正負部分と全変動を計算できる
  - 絶対連続性をJordan部分・全変動の零集合条件へ言い換えられる
