id: "F0-00WK3"
title: "Encore III：楕円型PDE・Galerkin法・有限要素法への橋"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00WK2
official_scope: []
learning_objectives:
  - 一般の二階楕円型方程式を弱形式へ落とす骨格を説明できる
  - lower-order項を含む双線形形式の連続性とcoercivityを確認できる
  - Galerkin近似を有限次元部分空間上の弱形式として定義できる
  - Galerkin直交性を導ける
  - Ceaの補題の意味を説明し、近似誤差と離散化誤差を結び付けられる
  - 区分線形有限要素がH0^1の部分空間になる理由を説明できる
  - Encore IIIの範囲と、より高度な正則性・非線形PDEの範囲を区別できる
definitions:
