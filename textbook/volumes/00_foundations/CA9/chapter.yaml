id: "CA9"
title: "標準複素解析 IX：楕円関数・Weierstrass wp 関数"
volume: "foundations"
status: supplementary
prerequisites:
  - CA8
  - CA7
official_scope: []
learning_objectives:
  - 楕円関数を複素トーラス上の有理型関数として解釈し、基本平行四辺形の対辺積分相殺から留数和0と零点数・極数の一致を証明できる
  - 格子点個数のO(R^2)評価から格子冪和の収束を導き、Weierstrass wp級数の正規収束をコンパクト集合上一様評価で証明できる
  - wpの偶性・周期性・極構造とLaurent展開を導き、g2・g3を定義できる
  - Laurent展開と正則楕円関数の剛性からWeierstrassの微分方程式を証明できる
  - 半周期点とwp'の零点を対応させ、半周期値が三次式の相異なる根となり判別式が非零であることを証明できる
  - Weierstrassの加法公式を極の比較から証明し、wpとwp'が複素トーラスを非特異三次曲線へ結び付けることを説明できる
