id: "STO14"
title: "Encore IV 確率解析 XIV：Lévy 過程・跳躍型確率解析"
volume: "foundations"
status: supplementary
prerequisites:
  - STO13
  - STO7
  - STO2
  - F0-00D2E
  - F0-00P6
official_scope: []
learning_objectives:
  - 複合 Poisson 過程を Poisson 計数と独立同分布の跳躍幅から構成し、その特性関数を導ける
  - Lévy 過程を独立定常増分と確率連続性で定義し、各時刻の分布が無限分解可能であることを証明できる
  - Lévy 指数の半群構造を特性関数から導き、Lévy--Khintchine 公式の各項の意味を説明できる
  - Lévy 測度の積分条件から大跳躍が有限活動度になることと、小跳躍が無限活動度になり得ることを判定できる
  - 補償 Poisson ランダム測度に対する予測可能被積分過程の L2 確率積分を単純過程から完備化で構成できる
  - 小跳躍の補償積分を切断極限として構成し、L2 等長性と最大不等式から収束を証明できる
  - Lévy--Itô 分解の構成側を Brown 運動・大跳躍・補償小跳躍へ分けて再構成できる
  - 跳躍を含む Itô 公式を有限活動度近似から導き、連続部分にはない跳躍補正項の役割を説明できる
  - Lévy 過程の生成作用素を Lévy--Khintchine triplet から導き、生成作用素マルチンゲールへ接続できる
  - 拡散・跳躍 SDE で左極限 X_{t-} を係数に使う理由を予測可能性から説明できる
