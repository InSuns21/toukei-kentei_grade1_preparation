id: "MQ2"
title: "変分原理・二次形式・基底状態"
volume: "foundations"
status: supplementary
prerequisites:
  - MQ1
  - QM6
  - FOU4
official_scope: []
learning_objectives:
  - 下に有界な自己共役作用素の Rayleigh 商を定義し、スペクトル測度からスペクトル下端の変分原理を定義域込みで証明できる
  - 非負平方根作用素を用いて閉二次形式と形式定義域を構成し、作用素定義域との違いと閉性を検証できる
  - 有界実ポテンシャルの Schrödinger 形式を H¹ 上に同定し、H² と区別して扱える
  - 変分下限の達成が基底固有ベクトルと同値であることを証明し、本質スペクトルの下の離散固有値の十分条件を使える
  - 有限次元 Rayleigh–Ritz の単調上界・形式稠密性のもとでの収束と有限次元 min–max 原理を証明・計算できる
  - Gaussian trial function の規格化・運動項・ポテンシャル項を実際に積分し、下端の上界と基底状態の存在を混同しない
