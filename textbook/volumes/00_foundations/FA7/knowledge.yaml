  - FA6

forward_references: []

concepts:
  - id: functional.self-adjoint-bounded-operator
    name: 自己共役有界作用素
    kind: definition
    aliases: [自己共役有界作用素, self-adjoint bounded operator, "### 定義（自己共役有界作用素）"]
    introduction_aliases: ["### 定義（自己共役有界作用素）"]
    requires:
      - functional.bounded-linear-operator
      - functional.hilbert-space

  - id: functional.compact-identity-kernel-finite
    name: I-Kの核の有限次元性
    kind: theorem
    aliases: [I-Kの核の有限次元性, compact perturbation finite kernel, "### 定理（I-Kの核の有限次元性）"]
