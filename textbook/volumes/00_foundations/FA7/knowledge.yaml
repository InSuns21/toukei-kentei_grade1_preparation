    aliases: [自己共役作用素のRayleigh商によるノルム評価, self-adjoint Rayleigh norm formula, "### 補題（自己共役作用素のRayleigh商によるノルム評価）"]
    introduction_aliases: ["### 補題（自己共役作用素のRayleigh商によるノルム評価）"]
