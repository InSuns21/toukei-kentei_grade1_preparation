official_scope: []
learning_objectives:
  - QMC1–QMC8 の主要理論をブラウザ内 Python の穴埋め演習として再現できる
  - 一次元中点集合のスター・ディスクレパンシーと Koksma--Hlawka 型上界を実測できる
  - 再生核 K(x,y)=1+min(x,y) に対する等重み求積の最悪誤差を核公式から計算できる
  - ランク1格子上の複素指数モードの離散直交性を双対格子条件と照合できる
  - 底2のデジタルネットを生成行列から構成し、b 進基本区間の点数条件を検査できる
  - Walsh 周波数が双対ネットへ属する場合だけデジタルネット平均に残ることを確認できる
  - 多項式格子の Laurent 展開係数から生成行列を作り、canonical 4点例を再現できる
  - 一様デジタルシフトの独立反復から不偏性・分散・標準誤差を推定できる
  - 桁交互配置により一次のデジタル点列から高次準 Monte Carlo 点列を作り、滑らかな関数で約 N^{-2} の収束を観察できる
  - 理論 stable anchor と実験 stable anchor の対応を機械可読台帳から追跡できる
definitions: []
theorems: []
canonical_examples:
  - QMC1 一次元中点集合のスター・ディスクレパンシーと x^2 の求積誤差
  - QMC2 K(x,y)=1+min(x,y) の midpoint rule 最悪誤差
  - QMC3 N=5 の生成ベクトル (1,1) と (1,2) に対する Fourier モード消去
  - QMC4 底2の4点デジタル (0,2,2)-ネット
  - QMC5 canonical 4点デジタルネット上の Walsh 双対周波数
  - QMC6 p=x^2+x+1, q=(1,x) の4点多項式格子
  - QMC7 P={0,1/2} の一様デジタルシフトと Walsh 係数に対応する厳密分散
  - QMC8 Sobol 2座標の桁交互配置による滑らかな一次元積分の高次収束
