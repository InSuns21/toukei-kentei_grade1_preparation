id: "GPDE3"
title: "大学院偏微分方程式 III：Sobolev 空間"
volume: "foundations"
status: supplementary
prerequisites:
  - GPDE2
  - MT7
official_scope: []
learning_objectives:
  - a.e.同値類としてのLp空間を踏まえ、Sobolev空間でも点値ではなく同値類を扱う理由を説明できる
  - W^{k,p}(Omega)をLp関数とLp弱微分によって定義し、Sobolev ノルムを具体的に計算できる
  - 弱微分作用素の閉性をテスト関数との双対性から証明できる
  - Lpの完備性と弱微分の閉性からW^{k,p}(Omega)の完備性を証明できる
  - H^k=W^{k,2}の内積を定義し、H^kがHilbert空間であることを説明できる
  - 絶対値関数・べき関数・区分線形関数・跳躍関数についてSobolev 空間への所属・非所属を判定できる
  - 滑らかな乗数との積の弱微分公式を証明し、切断関数で Sobolev 関数を局所化できる
  - 1<=p<infinityでLp平行移動連続性と平滑化核による近似を使い、局所 W^{k,p} 近似を証明できる
  - R^d上でC_c^infinityがW^{k,p}に稠密である標準形を切断関数と平滑化から証明できる
  - p=\inftyや境界付き領域では同じ密度主張を無条件に使えない理由を具体例から説明できる
