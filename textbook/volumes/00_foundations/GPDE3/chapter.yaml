  - { id: GPDE3-PROP-02, name: "滑らかな乗数との積の弱微分" }
  - { id: GPDE3-LEM-01, name: "Lp平行移動連続性" }
  - { id: GPDE3-THM-03, name: "Sobolev 関数の局所平滑化" }
