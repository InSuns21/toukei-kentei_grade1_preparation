  - { id: VC8-THM-01, name: Newton ポテンシャルは Poisson 方程式を解く }
  - { id: VC8-THM-02, name: Helmholtz 分解 }
  - { id: VC8-PROP-02, name: 調和ベクトル場による曖昧さ }
  - { id: VC8-COR-01, name: Biot--Savart 型の渦度再構成 }
canonical_examples:
  - Newton 核の球面流束
  - 単位球の指示関数に対する中心 Newton ポテンシャル
  - コンパクトな台を持つ源・渦からの Helmholtz ポテンシャル
  - ゲージ変換で回転が不変になる直接計算
  - 縦成分と横成分の直接計算
  - 定数ベクトル場による調和成分の曖昧さ
  - 無発散場の Biot--Savart 型再構成
