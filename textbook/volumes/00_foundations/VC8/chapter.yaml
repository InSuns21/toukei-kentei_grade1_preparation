id: "VC8"
title: "標準ベクトル解析 VIII：Newton ポテンシャル・Helmholtz 分解"
volume: "foundations"
status: supplementary
prerequisites:
  - VC5
  - PDE6
official_scope: []
learning_objectives:
  - 三次元 Newton 核の調和性と単位流束を計算し、点源を表す機構を説明できる
  - Newton ポテンシャルが Poisson 方程式を解くことを球面平均から証明できる
  - 発散と回転から Helmholtz のスカラーポテンシャル・ベクトルポテンシャルを積分表示で構成できる
  - コンパクトな台を持つ C3 級ベクトル場について Helmholtz 分解を証明できる
  - ベクトルポテンシャルのゲージ自由度と Coulomb ゲージを区別できる
  - 縦成分・横成分と無回転・無発散の対応を説明できる
  - 有界領域で生じる調和成分の曖昧さと、境界条件・無限遠条件の役割を説明できる
  - Helmholtz 分解の証明で必要な無限遠境界項の消失条件を局所的に確認できる
  - 無発散速度場を渦度から Biot--Savart 型公式で再構成できる
  - 静電場・重力場・静磁場・非圧縮流に共通するポテンシャル構造を識別できる
definitions:
  - { id: VC8-DEF-01, name: Newton 核 }
