chapter: RA2
scope: dream-theater
coverage: complete
prerequisites:
  - RA1

forward_references:
  - topology.compact-set
  - topology.heine-borel
  - topology.extreme-value-theorem

concepts:
  - id: analysis.function-limit
    name: 関数の極限
    kind: definition
    aliases: [関数の極限, epsilon-delta極限]
    requires: [analysis.archimedean-property]

  - id: analysis.real-function-continuity
    name: 実数部分集合上の連続性
    kind: definition
    aliases: [実数部分集合上の連続性, 実関数の連続性]
    requires: [analysis.function-limit]

  - id: analysis.sequential-criterion-limit
    name: 関数極限の点列判定
    kind: theorem
    aliases: [関数極限の点列判定]
    requires:
      - analysis.function-limit
      - analysis.real-sequence-convergence

  - id: topology.bolzano-weierstrass-real
    name: 実数列のBolzano--Weierstrass
    kind: theorem
    aliases: [実数列のBolzano--Weierstrass, 実数列のBolzano–Weierstrass, Bolzano--Weierstrassの定理]
    requires:
      - topology.subsequence
      - analysis.real-completeness

  - id: analysis.closed-interval-finite-subcover
    name: 閉区間の有限部分被覆定理
    kind: theorem
    aliases: [閉区間の有限部分被覆定理]
    requires:
      - analysis.least-upper-bound-property

  - id: analysis.intermediate-value-theorem
    name: 中間値定理
    kind: theorem
    aliases: [中間値定理, intermediate value theorem]
    requires:
      - analysis.real-function-continuity
      - analysis.least-upper-bound-property

  - id: analysis.extreme-value-closed-interval
    name: Weierstrassの最大最小定理（閉区間版）
    kind: theorem
    aliases: [閉区間版Weierstrassの最大最小定理, 閉区間上の最大最小定理]
    requires:
      - analysis.real-function-continuity
      - topology.bolzano-weierstrass-real
      - analysis.least-upper-bound-property

  - id: analysis.uniform-continuity
    name: 一様連続
    kind: definition
    aliases: [一様連続, uniform continuity]
    requires: [analysis.real-function-continuity]

  - id: analysis.lipschitz-continuity
    name: Lipschitz連続
    kind: definition
    aliases: [Lipschitz連続, リプシッツ連続]
    requires: [analysis.uniform-continuity]

  - id: analysis.heine-cantor
    name: Heine--Cantorの定理（閉区間版）
    kind: theorem
    aliases: [Heine--Cantorの定理, Heine–Cantorの定理, Heine-Cantor theorem]
    requires:
      - analysis.real-function-continuity
      - analysis.uniform-continuity
      - topology.bolzano-weierstrass-real
