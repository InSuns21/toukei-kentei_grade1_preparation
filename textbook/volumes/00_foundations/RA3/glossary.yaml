chapter: "RA3"
terms:
  - term: 高階導関数
    english: higher derivative
    meaning: 導関数を反復して得る2階以上を含む導関数。k階導関数を f^(k) と書く。
  - term: C^k級
    english: C^k class
    meaning: k階までの導関数が存在し、それらがすべて連続である関数の滑らかさの階級。
  - term: C∞級
    english: smooth function / C-infinity class
    meaning: 任意の階数まで導関数が存在し、それらがすべて連続である関数。滑らかな関数ともいう。
  - term: 平均値定理
    english: mean value theorem
    meaning: 区間全体の平均変化率と一致する瞬間変化率を持つ点が区間内に存在するという定理。
  - term: Cauchyの平均値定理
    english: Cauchy mean value theorem
    meaning: 二つの関数の増分比を導関数比へ結び付ける平均値定理。
  - term: Taylorの定理
    english: Taylor theorem
    meaning: 関数を有限次数の多項式と剰余項に厳密に分解する定理。
  - term: Lagrange剰余項
    english: Lagrange remainder
    meaning: Taylor展開の誤差をある中間点での高階導関数により表す剰余項。
