learning_objectives:
  - 任意の距離空間のCauchy列から完備化を構成できる
  - 完備化上の距離がwell-definedであることを証明できる
  - 元の空間が定数列埋め込みによって完備化へ等長かつ稠密に入ることを証明できる
  - 完備化が完備であることを対角近似で証明できる
  - 完備化の一意性を等長同型の意味で証明できる
  - 既に完備な空間や具体例の完備化を一意性から同定できる
