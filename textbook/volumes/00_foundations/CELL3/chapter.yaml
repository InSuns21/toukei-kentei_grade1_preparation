  - { id: CELL3-DEF-03, name: "前周期性・過渡長・最終周期" }
  - { id: CELL3-DEF-04, name: "状態遷移有向グラフと一歩前像" }
  - { id: CELL3-DEF-05, name: "弱連結成分" }
theorems:
