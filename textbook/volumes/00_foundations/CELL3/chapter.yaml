id: "CELL3"
title: "有限環の軌道・周期・状態遷移グラフ"
volume: "foundations"
status: supplementary
prerequisites:
  - CELL2
official_scope: []
learning_objectives:
  - 周期有限環の配置空間と同期更新を定義し全配置数を数えられる
  - 前方軌道・固定点・周期点・最小周期を検証できる
  - 前周期性・過渡長・最終周期を区別して計算できる
  - 鳩の巣原理による有限写像の最終周期性・最小性と上界を完全証明できる
  - Rule 60の3セル環の全8状態遷移と前像数を再計算できる
  - 有限状態遷移グラフの弱連結成分に閉路が一つあることを証明できる
  - 入次数の総和と有限集合での単射・全射の同値を証明できる
  - 無限線で前周期性が失われる具体例を構成できる
