id: "GRP1"
title: "抽象代数 I：群・部分群・巡回群・置換群"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00A
official_scope: []
learning_objectives:
  - 群・可換群を定義し、単位元・逆元の一意性、消去法則、積の逆元公式を群公理だけから証明できる
  - 部分群を定義し、空でない部分集合に対する部分群判定を使って具体例を判定できる
  - 生成部分群と元の位数を定義し、巡回群を具体的な冪または整数倍として計算できる
  - 巡回群の任意の部分群が巡回群であることを証明し、有限巡回群の部分群を約数で分類できる
  - 群の直積を定義し、成分ごとの演算が群公理を満たすことを確認できる
  - 対称群を全単射の合成として扱い、有限置換を互いに素な巡回置換へ分解できる
  - inversion によって置換の偶奇を定義し、交代群が対称群の部分群であることを証明できる
  - 正多角形の回転・反転から二面体群を構成し、r^n=e, s^2=e, srs=r^{-1} から全要素を標準形へ直せる
  - 左移動によって任意の群を置換群の部分群として忠実に実現する Cayley の定理を証明できる
