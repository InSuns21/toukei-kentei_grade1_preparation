id: "VC6"
title: "標準ベクトル解析 VI：直交曲線座標"
volume: "foundations"
status: supplementary
prerequisites:
  - VC1
  - VC3
  - RA7
official_scope: []
learning_objectives:
  - 直交曲線座標を正則座標写像と直交するcoordinate tangent vectorsで定義し、scale factorsと位置依存orthonormal basisを構成できる
  - scale factorsから線素・座標面素・体積要素を導き、Jacobianの絶対値がh1h2h3になることを説明できる
  - 全微分と線素からgradient公式を導ける
  - 微小coordinate boxのflux balanceからdivergence公式を導ける
  - 微小coordinate rectangleのcirculationからcurl公式を導ける
  - div gradからscalar Laplacian公式を導ける
  - cylindrical coordinatesとspherical coordinatesのscale factors・basis variation・grad/div/curl/Laplacianを再構成できる
  - vector Laplacianでは位置依存basisの微分が必要であり、物理成分へscalar Laplacianを機械的に適用できないことを説明できる
  - radial field・inverse-square field・axisymmetric fieldを円柱・球座標で計算し、VC4のGauss theoremと照合できる
