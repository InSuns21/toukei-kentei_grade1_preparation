id: "VC6"
title: "標準ベクトル解析 VI：直交曲線座標"
volume: "foundations"
status: supplementary
prerequisites:
  - VC5
official_scope: []
learning_objectives:
  - 直交曲線座標を正則座標写像と直交する座標接ベクトルで定義し、尺度因子と位置依存正規直交基底を構成できる
  - 尺度因子から線素・座標面素・体積要素を導き、Jacobianの絶対値がh1h2h3になることを説明できる
  - 全微分と線素から勾配公式を導ける
  - 微小座標直方体の流束収支から発散公式を導ける
  - 微小座標長方形の循環から回転公式を導ける
  - 勾配の発散からスカラー・ラプラシアン公式を導ける
  - 円柱座標と球座標の尺度因子・基底の変化・勾配・発散・回転・ラプラシアンを再構成できる
  - ベクトル・ラプラシアンでは位置依存基底の微分が必要であり、物理成分へスカラー・ラプラシアンを機械的に適用できないことを説明できる
  - 放射状場・逆二乗場・軸対称場を円柱・球座標で計算し、VC4のGauss--Ostrogradsky の発散定理と照合できる
