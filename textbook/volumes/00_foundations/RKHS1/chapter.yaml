  - { id: RKHS1-COR-01, name: 点評価の基本評価 }
  - { id: RKHS1-THM-01, name: RKHS の再生核の正半定値性 }
  - { id: RKHS1-PROP-03, name: 特徴写像から作った核の正半定値性 }
  - { id: RKHS1-LEM-01, name: 核切片上の内積の表示独立性 }
  - { id: RKHS1-LEM-02, name: 完備化後の関数表示の単射性 }
  - { id: RKHS1-LEM-03, name: 核切片の線形包の稠密性 }
  - { id: RKHS1-THM-02, name: Moore--Aronszajn の定理 }
