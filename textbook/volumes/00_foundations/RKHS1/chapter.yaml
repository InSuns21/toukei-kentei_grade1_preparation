id: "RKHS1"
title: "再生核 Hilbert 空間・Moore--Aronszajn"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-02C2
official_scope: []
learning_objectives:
  - Hilbert 関数空間であっても点評価が自動的に連続になるわけではないことを説明できる
  - 再生核 Hilbert 空間を評価汎関数の連続性によって定義できる
  - Riesz 表現定理から点評価の表現元と再生性を導ける
  - 再生核が対称な正半定値核になることをノルム二乗へ変形して証明できる
  - 標準特徴写像を構成し、核を Hilbert 空間の内積として表せる
  - 正半定値性を失うと RKHS 構成が壊れることを反例から説明できる
  - Moore--Aronszajn の構成で核切片の有限線形包に内積を定義し、その定義が表示によらないことを証明できる
  - 点評価の有界性を使って完備化後の元を関数として一意に識別できることを証明できる
  - 核切片の稠密性から Moore--Aronszajn の一意性を証明できる
  - 有限集合上の RKHS を Gram 行列とその逆行列から具体的に構成できる
definitions:
