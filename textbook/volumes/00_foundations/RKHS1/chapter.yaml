canonical_examples:
  - 線形関数空間で評価汎関数の連続性と再生核を直接確認する例
  - 線形核・定数付き線形核・二次多項式核を特徴写像から構成する例
  - 2点上の対称行列が正半定値性を失い再生核になれない反例
  - 2点上の正定値 Gram 行列から RKHS 内積を逆行列で構成する例
  - 特異な半正定値 Gram 行列では RKHS が点を区別できない例
