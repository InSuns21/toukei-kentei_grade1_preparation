id: "F0-00TS3"
title: "Encore IV：線形filter・ARMA transfer function・周波数領域"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00TS2
  - E2-03
official_scope: []
learning_objectives:
  - 線形filterをbackshift operatorで表現できる
  - 周波数応答A(e^{-i lambda})を導ける
  - filter後のspectral densityが|A|^2倍になることを示せる
  - ARMAのtransfer functionとspectral densityを導ける
  - AR1のスペクトル形状をphiの符号と絶対値から説明できる
  - differencing operatorの周波数応答を説明できる
  - seasonal differencingの除去周波数を説明できる
  - causality・invertibilityをfilterの安定性とinnovation復元の観点で説明できる
  - 時間領域のACF/PACFと周波数領域のspectral densityを使い分けられる
