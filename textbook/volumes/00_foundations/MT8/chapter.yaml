id: "MT8"
title: "標準測度論 IX：Hausdorff 測度・Hausdorff 次元"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00D4
  - F0-00C1
official_scope: []
learning_objectives:
  - δ-Hausdorff 内容量と Hausdorff 外測度を定義し、δ に関する単調性を説明できる
  - Hausdorff 外測度の外測度性を近似被覆の結合から証明できる
  - Hausdorff 外測度が距離外測度であることを正距離で離れた集合の被覆分離から証明できる
  - 距離外測度が Borel 集合を Carathéodory 可測にする機構を閉集合の距離帯から説明できる
  - Hausdorff 測度の臨界指数性を証明し、Hausdorff 次元を臨界指数として定義できる
  - Lipschitz 写像が Hausdorff 測度を L^s 倍以下にし、Hausdorff 次元を増やさないことを証明できる
  - 区間の Hausdorff 次元が1であることを Lebesgue 外測度と等分被覆から証明できる
  - 質量分布原理を証明し、Hausdorff 次元の下界評価に使える
  - 中三分 Cantor 集合の Hausdorff 次元 log2/log3 を上界・下界の両方から証明できる
