id: "MT8"
title: "標準測度論 IX：Hausdorff測度・Hausdorff次元"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00D4
  - F0-00C1
official_scope: []
learning_objectives:
  - delta-Hausdorff content と Hausdorff外測度 を定義し delta に関する単調性を説明できる
  - Hausdorff外測度 の外測度性を近似 cover の結合から証明できる
  - Hausdorff外測度 が 距離外測度 であることを正距離で離れた集合の cover 分離から証明できる
  - 距離外測度 が Borel 集合を Caratheodory 可測にする機構を閉集合の距離帯から説明できる
  - Hausdorff measure の threshold property を証明し Hausdorff次元 を臨界指数として定義できる
  - Lipschitz map が Hausdorff measure を L^s 倍以下にし dimension を増やさないことを証明できる
  - 区間の Hausdorff次元 が1であることを Lebesgue outer measure と等分 cover から証明できる
  - 質量分布原理 を証明し Hausdorff次元 の下界評価に使える
  - middle-thirds Cantor set の Hausdorff次元 log2/log3 を upper/lower bound の両方から証明できる
