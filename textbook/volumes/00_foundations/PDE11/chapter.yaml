learning_objectives:
  - 円板の Helmholtz 固有値問題を変数分離し Bessel 方程式を導ける
  - Bessel 関数の零点と円板 Dirichlet 固有値を結び付けられる
  - 円板上の熱・波動方程式で Bessel モードの時間発展を説明できる
