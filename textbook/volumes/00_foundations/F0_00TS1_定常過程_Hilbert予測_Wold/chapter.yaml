id: "F0-00TS1"
title: "Encore IV：定常過程・Hilbert予測・innovation・Wold分解"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00SP2
  - F0-00E2
  - F0-02C1A
official_scope: []
learning_objectives:
  - 二次定常性を平均とlag共分散で定義できる
  - 過去の線形予測空間を閉部分空間として定義できる
  - 最良線形予測をHilbert射影として証明できる
  - innovationを一段で増える直交方向として説明できる
  - stationarityから時間shiftのunitary性を証明できる
  - remote pastとpurely nondeterministicを定義できる
  - 減少閉部分空間への射影収束を証明できる
  - Wold decompositionを有限直交分解の極限として証明できる
  - psi_0=1とsum psi_j^2<∞を導ける
  - AR(1)のWold係数を導ける
