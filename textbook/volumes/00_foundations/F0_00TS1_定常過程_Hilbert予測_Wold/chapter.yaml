learning_objectives:
  - 二次定常過程を平均と自己共分散で定義できる
  - 二乗可積分確率変数をL2 Hilbert空間の元として扱える
  - 過去の確率変数が張る閉部分空間を定義できる
  - 最良線形予測を直交射影として特徴付けられる
