  - "極座標基底 e_r, e_theta の時間微分から向心加速度を回収する例"
  - "万有引力の有効ポテンシャルで円軌道と転回点を読む例"
  - "逆二乗力の軌道方程式を u=1/r で定係数方程式へ変換する例"
  - "楕円の近日点・遠日点と離心率を ρ=p/(1+e cos theta) から読む例"
  - "面積速度一定から Kepler 第2法則を確認する例"
  - "楕円面積と角運動量から Kepler 第3法則を導く例"
  - "双曲線軌道の漸近線から散乱角を読む例"
