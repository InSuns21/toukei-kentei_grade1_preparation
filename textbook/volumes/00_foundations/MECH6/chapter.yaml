id: "MECH6"
title: "中心力・万有引力・Kepler 問題"
volume: "foundations"
status: supplementary
prerequisites:
  - MECH4
  - ODE2
official_scope: []
learning_objectives:
  - 中心力を F=f(ρ)e_r と表し、MECH4 の角運動量保存から L≠0 の運動が固定平面へ縮約されることを説明できる
  - 平面極座標で速度・加速度を基底ベクトルの時間微分から導き、動径方向と角度方向の運動方程式を書ける
  - 保存角運動量 ell=m ρ^2 thetadot を使って力学的エネルギーを E=(1/2)m ρdot^2+V_eff(ρ) に縮約し、有効ポテンシャルを解釈できる
  - 万有引力 F=-(GMm/ρ^2)e_r とポテンシャル U=-GMm/ρ の対応を確認し、円軌道速度・脱出速度を導ける
  - u=1/ρ の変数変換から Binet 型の軌道方程式を導き、逆二乗力で ρ=p/(1+e cos(theta-theta0)) を得られる
  - 軌道の離心率 e とエネルギーの関係を導き、楕円・放物線・双曲線を分類できる
  - Kepler 第1・第2・第3法則を万有引力と保存則から導き、各法則で使った仮定を説明できる
  - 双曲線軌道の漸近線から散乱角の入口となる chi=2 arcsin(1/e) を導ける
  - 1/r ポテンシャルが古典重力と Coulomb 型中心力で共通する数学構造であることを区別して説明できる
