chapter: F0-00P2A
scope: dream-theater
coverage: complete
prerequisites:
  - F0-00P2
  - F0-00D2B

forward_references:
  - prob.independent-events
  - prob.independent-random-variables
  - measure.product-measure
  # P2AではLOTUSを先に使用し、完全証明はP3Dで与える。
  - measure.pushforward-integration-theorem

concepts:
  - id: prob.expectation
    name: 期待値
    kind: term
    aliases: ["期待値は確率測度に関する積分"]
    requires:
      - prob.random-variable
      - measure.lebesgue-integral

  # ここではLOTUSを計算原理として先に導入する。完全証明はP3Dの押し出し積分公式。
  - id: prob.lotus
    name: 押し出し積分公式（LOTUS）
    kind: term
    aliases: [LOTUS]
    requires:
      - measure.pushforward-measure

  - id: prob.moment
    name: モーメント
    kind: term
    aliases: [次モーメント]
    requires:
      - prob.expectation

  - id: prob.variance
    name: 分散
    kind: term
    aliases: ["Var(X)"]
    requires:
      - prob.expectation

  - id: prob.union-bound
    name: 可算劣加法性（union bound）
    kind: theorem
    aliases: [可算劣加法性, union bound]
    requires:
      - prob.probability-space
      - measure.measure-monotonicity

  - id: prob.probability-continuity-from-above
    name: 確率測度の上からの連続性
    kind: theorem
    aliases: [確率測度の上からの連続性, 上からの連続性]
    requires:
      - prob.probability-space
      - measure.continuity-from-below

  - id: prob.markov-inequality
    name: Markovの不等式
    kind: theorem
    aliases: [Markovの不等式, Markov不等式]
    requires:
      - prob.expectation
