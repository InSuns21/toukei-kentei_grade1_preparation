chapter: F0-00P2A
scope: dream-theater
coverage: complete
prerequisites:
  - F0-00P2
  - F0-00D2B

forward_references:
  - prob.independent-events
  - prob.independent-random-variables
  - prob.probability-convergence
  - measure.product-measure
  - stat.likelihood
  - measure.pushforward-integration-theorem

concepts:
  - id: prob.expectation
    name: 期待値
    kind: definition
    aliases: [期待値]
    requires:
      - prob.random-variable
      - measure.lebesgue-integral

  - id: prob.lotus
    name: LOTUS：分布による期待値計算
    kind: theorem
    aliases: [LOTUS, "LOTUS：分布による期待値計算"]
    requires:
      - measure.pushforward-measure
      - measure.simple-function-approximation
      - measure.monotone-convergence-theorem
      - measure.positive-negative-parts

  - id: prob.moment
    name: モーメント
    kind: definition
    aliases: [モーメント, 次モーメント]
    requires:
      - prob.expectation

  - id: prob.variance
    name: 分散
    kind: term
    aliases: [分散, "Var(X)"]
    requires:
      - prob.expectation

  - id: prob.union-bound
    name: 可算劣加法性（union bound）
    kind: theorem
    aliases: ["可算劣加法性（union bound）", union bound]
    introduction_aliases: ["可算劣加法性（union bound）"]
    requires:
      - prob.probability-space
      - measure.measure-monotonicity

  - id: prob.probability-continuity-from-above
    name: 確率測度の上からの連続性
    kind: theorem
    aliases: [確率測度の上からの連続性]
    introduction_aliases: [確率測度の上からの連続性]
    requires:
      - prob.probability-space
      - measure.continuity-from-below

  - id: prob.markov-inequality
    name: Markovの不等式
    kind: theorem
    aliases: [Markovの不等式, Markov不等式]
    requires:
      - prob.expectation

  - id: prob.chebyshev-inequality
    name: Chebyshevの不等式
    kind: theorem
    aliases: [Chebyshevの不等式, Chebyshev不等式, チェビシェフの不等式, チェビシェフ不等式]
    requires:
      - prob.markov-inequality
      - prob.variance
