id: "F0-00P2A"
title: "期待値・LOTUS"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00P2
  - F0-00D2B
official_scope: []
learning_objectives:
  - 期待値をLebesgue積分として定義できる
  - LOTUSを押し出し積分公式として説明できる
  - 離散和と連続積分を統一できる
  - 可算劣加法性（union bound）を可算加法性から証明できる
  - 確率測度の上からの連続性を下からの連続性から証明できる
  - Markovの不等式を期待値の単調性から証明し、tail確率評価に使える
  - 積分と極限交換に収束定理を使える
