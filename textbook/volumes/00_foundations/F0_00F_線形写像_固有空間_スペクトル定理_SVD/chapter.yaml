id: "F0-00F"
title: "線形写像・固有空間・スペクトル定理・SVD"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00
  - F0-00C
  - F0-00E
official_scope: []
learning_objectives:
  - 線形写像とその行列表現を基底との関係から説明できる
  - 核・像・階数・退化次数を定義し、rank-nullity theoremを基底から説明できる
  - 固有値・固有空間・不変部分空間を区別して説明できる
  - 実対称行列の異なる固有値に属する固有ベクトルが直交することを示せる
  - Rayleigh商とコンパクト性から実対称行列のスペクトル定理の流れを説明できる
  - 正定値・半正定値、平方根行列をスペクトル分解から構成できる
  - A^T A のスペクトル分解からSVDを構成し、特異値と作用素ノルムの関係を説明できる
