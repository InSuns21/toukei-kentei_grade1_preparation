  - { id: F000F-THM-02, name: 実対称行列のスペクトル定理 }
  - { id: F000F-THM-03, name: 特異値分解 }
  - { id: F000F-THM-04, name: 2-作用素ノルムと最大特異値の一致 }
canonical_examples:
  - 基底から線形写像の行列を作る
  - 対称行列の固有空間を直交分解する
  - PSD行列の平方根をスペクトル分解から構成する
  - 長方形行列のSVDと作用素ノルムを計算する
