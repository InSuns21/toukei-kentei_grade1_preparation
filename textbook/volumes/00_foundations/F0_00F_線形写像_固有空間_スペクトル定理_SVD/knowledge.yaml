      - linear.linear-map
      - linear.coordinate-vector
      - linear.basis

  - id: linear.similarity
    name: 相似
    kind: definition
    aliases: [相似]
    requires:
      - linear.representation-matrix

  - id: linear.eigenvalue
    name: 固有値
    kind: definition
    introduction_aliases: [固有値・固有ベクトル・固有空間]
    aliases: [固有値, 固有値・固有ベクトル・固有空間]
    requires:
      - linear.linear-map

  - id: linear.eigenvector
    name: 固有ベクトル
    kind: definition
    introduction_aliases: [固有値・固有ベクトル・固有空間]
    aliases: [固有ベクトル, 固有値・固有ベクトル・固有空間]
    requires:
      - linear.eigenvalue

  - id: linear.eigenspace
    name: 固有空間
    kind: definition
    introduction_aliases: [固有値・固有ベクトル・固有空間]
    aliases: [固有空間, 固有値・固有ベクトル・固有空間]
    requires:
      - linear.eigenvalue
      - linear.kernel-image

  - id: linear.diagonalizable
    name: 対角化可能
    kind: definition
    aliases: [対角化可能]
    requires:
      - linear.eigenvector
      - linear.basis
      - linear.representation-matrix

  - id: linear.eigenvalue-multiplicities
    name: 代数的重複度・幾何学的重複度
    kind: definition
    aliases: [代数的重複度・幾何学的重複度, 代数的重複度, 幾何学的重複度]
    requires:
      - linear.eigenvalue
      - linear.eigenspace
      - linear.dimension
