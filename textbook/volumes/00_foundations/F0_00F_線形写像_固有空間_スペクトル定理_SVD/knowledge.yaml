chapter: F0-00F
scope: dream-theater
coverage: complete
prerequisites:
  - F0-00E
  - F0-00E1

forward_references:
  - linear.spectral-theorem
  - linear.singular-value-decomposition

concepts:
  - id: linear.linear-map
    name: 線形写像
    kind: definition
    aliases: [線形写像]
    requires:
      - linear.vector-space

  - id: linear.kernel-image
    name: 核と像
    kind: definition
    aliases: [核と像, kernel と image]
    requires:
      - linear.linear-map
      - linear.linear-subspace

  - id: linear.rank-nullity-theorem
    name: rank-nullity theorem
    kind: theorem
    aliases: [rank-nullity theorem]
    requires:
      - linear.kernel-image
      - linear.dimension
      - linear.basis-extension-theorem

  - id: linear.representation-matrix
    name: 表現行列
    kind: definition
    aliases: [表現行列]
