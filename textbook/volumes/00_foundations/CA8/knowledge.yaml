    introduction_aliases: ["定義（零点・極の位数）"]
    requires: [complex-analysis.riemann-surface-meromorphic-function]

  - id: complex-analysis.order-coordinate-invariance
    name: 位数の座標不変性
    kind: theorem
    aliases: [位数の座標不変性, coordinate invariance of order]
    introduction: formal
    introduction_aliases: ["定理（位数の座標不変性）"]
    requires: [complex-analysis.zero-pole-order, complex-analysis.biholomorphism]

  - id: complex-analysis.sphere-meromorphic-rational
    name: Riemann 球面上の有理型関数の分類
    kind: theorem
    aliases: [Riemann 球面上の有理型関数の分類, meromorphic functions on the Riemann sphere are rational]
