chapter: CA8
scope: dream-theater
coverage: complete
prerequisites:
  - CA7
  - TOP1
  - TOP2
  - TOP4
  - TOP5

concepts:
  - id: complex-analysis.complex-chart
    name: 複素座標近傍
    kind: definition
    aliases: [複素座標近傍, complex chart]
    introduction: formal
    introduction_aliases: ["定義（複素座標近傍）"]
    requires: [topology.homeomorphism]

  - id: complex-analysis.holomorphic-atlas
    name: 正則アトラス
    kind: definition
    aliases: [正則アトラス, holomorphic atlas]
    introduction: formal
    introduction_aliases: ["定義（正則アトラス）"]
    requires: [complex-analysis.complex-chart, complex-analysis.holomorphic-function]

  - id: complex-analysis.riemann-surface
    name: Riemann 面
    kind: definition
    aliases: [Riemann 面, Riemann surface]
    introduction: formal
    introduction_aliases: ["定義（Riemann 面）"]
    requires: [complex-analysis.holomorphic-atlas, topology.t2-space-recap-top4, topology.second-countable]

  - id: complex-analysis.riemann-sphere-atlas
    name: Riemann 球面の標準アトラス
    kind: proposition
    aliases: [Riemann 球面の標準アトラス, standard atlas of the Riemann sphere]
    introduction: formal
    introduction_aliases: ["命題（Riemann 球面の標準アトラス）"]
    requires: [complex-analysis.riemann-surface]

  - id: complex-analysis.riemann-surface-holomorphic-map
    name: Riemann 面間の正則写像
    kind: definition
    aliases: [Riemann 面間の正則写像, holomorphic map of Riemann surfaces]
    introduction: formal
    introduction_aliases: ["定義（Riemann 面間の正則写像）"]
    requires: [complex-analysis.riemann-surface, complex-analysis.holomorphic-function]

  - id: complex-analysis.holomorphic-coordinate-invariance
    name: 正則性の座標不変性
    kind: theorem
    aliases: [正則性の座標不変性, coordinate invariance of holomorphicity]
    introduction: formal
    introduction_aliases: ["定理（正則性の座標不変性）"]
    requires: [complex-analysis.riemann-surface-holomorphic-map, complex-analysis.holomorphic-atlas]

  - id: complex-analysis.biholomorphism
    name: 双正則写像
    kind: definition
    aliases: [双正則写像, biholomorphism]
    introduction: formal
    introduction_aliases: ["定義（双正則写像）"]
    requires: [complex-analysis.riemann-surface-holomorphic-map]

  - id: complex-analysis.riemann-surface-meromorphic-function
    name: Riemann 面上の有理型関数
    kind: definition
    aliases: [Riemann 面上の有理型関数, meromorphic function on a Riemann surface]
