    introduction_aliases: ["定義（Riemann 面上の有理型関数）"]
    requires: [complex-analysis.riemann-surface, complex-analysis.meromorphic-function]

  - id: complex-analysis.zero-pole-order
    name: 零点・極の位数
    kind: definition
    aliases: [零点・極の位数, zero and pole order]
