learning_objectives:
  - 波動方程式と熱方程式の時間発展の違いを説明できる
  - 実数全体上の波動方程式をFourier変換して周波数ごとの調和振動子へ落とせる
  - 有限区間で変数分離法を使い空間固有値問題を導ける
  - 固定端境界条件から正弦関数の固有モードを導ける
  - Laplace方程式を定常的な楕円型方程式として位置付けられる
  - 長方形領域のLaplace方程式を変数分離で解く骨格を説明できる
  - 熱・波動・Laplaceの三つを拡散・振動・平衡として比較できる
