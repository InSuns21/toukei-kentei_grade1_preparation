id: "MT7"
title: "Lp完備性・稠密性・双対"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00D2D
  - F0-00D2E
  - MT3
  - MT5
official_scope: []
learning_objectives:
  - 1<=p<∞ の L^p 完備性を速い部分列と差分級数から証明し、p=∞ の完備性を本質的一様収束から証明できる
  - L^p 関数を単関数で近似し、1<=p<∞ で単関数が L^p に稠密であることを証明できる
  - 局所コンパクト Hausdorff 空間上の Radon 測度に対し、局所化関数と正則性から C_c(X) の L^p 稠密性を証明できる
  - σ有限測度空間で 1<=p<∞ の双対 (L^p)* を L^q で表現し、作用素ノルムと L^q ノルムの一致を証明できる
  - p=∞ では同じ Radon--Nikodym 構成が一般に閉じない理由を L^∞ ノルムでの指示関数列の非収束から説明できる
definitions: []
theorems:
  - { id: MT7-THM-01, name: Lpの完備性 }
  - { id: MT7-THM-02, name: 単関数のLp稠密性 }
  - { id: MT7-THM-03, name: CcのLp稠密性 }
  - { id: MT7-THM-04, name: σ有限Lp双対定理 }
  - { id: MT7-PROP-01, name: L-infinity双対でRadon--Nikodym構成が閉じない理由 }
canonical_examples: [速いL^p-Cauchy部分列, 指示関数のC_c近似, L^p-L^q積分汎関数, L^∞双対の境界]
