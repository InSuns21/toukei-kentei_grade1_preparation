id: "GRP3"
title: "抽象代数 III：群作用・軌道・安定化群・共役"
volume: "foundations"
status: supplementary
prerequisites:
  - GRP2
official_scope: []
learning_objectives:
  - 群作用を定義し、作用と準同型 G→Sym(X) の同値性を証明できる
  - 軌道と安定化群を計算し、軌道が集合を分割することを証明できる
  - G/G_x→Gx の自然な全単射を構成し、well-defined 性・単射性・全射性を確認できる
  - 有限群作用で軌道・安定化群公式を使い、軌道サイズと安定化群の位数を相互に求められる
  - 推移的作用・忠実な作用を判定し、作用準同型の核との関係を説明できる
  - 共役作用から共役類・群の中心・元の中心化群を構成できる
  - 類等式を軌道分解と軌道・安定化群公式から導ける
  - 類等式を使って有限 p-群の中心が非自明であることを証明できる
definitions:
  - { id: GRP3-DEF-01, name: 群作用 }
  - { id: GRP3-DEF-02, name: 忠実な群作用・推移的な群作用 }
  - { id: GRP3-DEF-03, name: 群作用の軌道・安定化群 }
  - { id: GRP3-DEF-04, name: 共役作用・共役類 }
  - { id: GRP3-DEF-05, name: 群の中心・元の中心化群 }
  - { id: GRP3-DEF-06, name: 有限 p-群 }
theorems:
  - { id: GRP3-THM-01, name: 群作用と対称群への準同型の対応 }
  - { id: GRP3-PROP-01, name: 軌道による分割 }
  - { id: GRP3-THM-02, name: 剰余類と軌道の自然な全単射 }
  - { id: GRP3-THM-03, name: 軌道・安定化群公式 }
  - { id: GRP3-PROP-02, name: 群の中心・元の中心化群は部分群 }
  - { id: GRP3-THM-04, name: 類等式 }
  - { id: GRP3-THM-05, name: 有限 p-群の中心非自明性 }
canonical_examples:
  - S_3 の {1,2,3} への自然な作用
  - 群 G の自身への左移動作用
  - G の左剰余類集合 G/H への作用
  - S_3 の共役作用と三つの共役類
  - D_4 の共役類と類等式
  - 位数 p^2 の群への p-群中心定理の応用
problem_patterns:
