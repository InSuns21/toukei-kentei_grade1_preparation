chapter: DOPT4
scope: dream-theater
coverage: complete
prerequisites:
  - DOPT3
  - LA3C

forward_references: []

concepts:
  - id: optimization.totally-unimodular-matrix
    name: 全単模行列
    kind: definition
    aliases:
      - totally unimodular matrix
      - TU matrix
    introduction: formal
    introduction_aliases: ["定義（全単模行列）"]
    requires:
      - linear.matrix-determinant

  - id: optimization.tu-basic-closures
    name: 全単模性の基本的な閉包性
    kind: proposition
    aliases: []
    introduction: formal
    introduction_aliases: ["命題（全単模性の基本的な閉包性）"]
