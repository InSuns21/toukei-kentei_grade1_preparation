id: "QM2"
title: "状態・観測量・Born 則"
volume: "foundations"
status: supplementary
prerequisites:
  - QM1
official_scope: []
learning_objectives:
  - 純粋状態を Hilbert 空間の ray として捉え、計算では単位ベクトル代表を選ぶ理由と全体位相不変性を説明できる
  - 有限次元の観測量を自己共役作用素で表し、固有値が実数で測定値候補になることを既習のスペクトル定理へ接続できる
  - 自己共役作用素の固有空間への直交射影を構成し、縮退固有値では基底ベクトルではなく固有空間全体を測る理由を説明できる
  - Born 則から各測定結果の確率を射影ノルムまたは内積で計算し、確率の非負性と総和1を確認できる
  - 理想射影測定の状態更新を用いて逐次 Stern--Gerlach 型測定を計算できる
  - 測定値の期待値と分散を確率分布から導き、有限次元では内積表示と一致することを証明できる
  - Pauli 行列を用いて spin 1/2 の z 軸・x 軸測定を計算し、相対位相が別基底の統計へ現れることを説明できる
definitions:
  - { id: QM2-DEF-01, name: "純粋状態の単位ベクトル代表" }
  - { id: QM2-DEF-02, name: "有限次元の観測量" }
  - { id: QM2-DEF-03, name: "固有空間への射影測定" }
theorems:
