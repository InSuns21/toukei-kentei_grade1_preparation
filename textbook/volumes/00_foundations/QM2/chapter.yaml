  - { id: QM2-PROP-01, name: "Born 確率の全体位相不変性" }
  - { id: QM2-PROP-02, name: "期待値の内積表示" }
  - { id: QM2-PROP-03, name: "分散の作用素表示" }
canonical_examples:
  - "C^2 の一般純粋状態と global phase"
  - "Pauli z 行列 sigma_z と z 軸 spin 測定"
  - "Pauli x 行列 sigma_x と相対位相を含む測定確率"
  - "C^3 の縮退固有値と二次元固有空間への射影"
  - "z+ から x 測定を経て再び z を測る逐次射影測定"
