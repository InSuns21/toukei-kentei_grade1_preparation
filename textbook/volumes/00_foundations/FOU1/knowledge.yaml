chapter: FOU1
scope: dream-theater
coverage: complete
prerequisites:
  - RA4
forward_references: []

# 本章は Fourier 級数の係数計算を Riemann 積分と有限和だけで閉じる。
# 無限級数の収束論は後続 FOU2 の責務とし、FOU1 の概念・証明は旧 Fourier 教材を参照しない。

concepts:
  - id: fourier.fou1-trigonometric-polynomial
    name: 三角多項式
    kind: definition
    aliases: [三角多項式, trigonometric polynomial]
    introduction: formal

  - id: fourier.fou1-frequency-cancellation
    name: 正弦・余弦の一周期積分消去則
    kind: theorem
    aliases: [正弦・余弦の一周期積分消去則, 一周期積分消去則]
    introduction: formal
    requires:
      - fourier.fou1-trigonometric-polynomial

  - id: fourier.fou1-real-coefficient
    name: 実 Fourier 係数
    kind: definition
    aliases: [実 Fourier 係数, 実Fourier係数]
    introduction: formal
    requires:
      - fourier.fou1-frequency-cancellation

  - id: fourier.fou1-finite-sum
    name: N次 Fourier 有限和
    kind: definition
    aliases: [N次 Fourier 有限和, Fourier 有限和]
    introduction: formal
    requires:
      - fourier.fou1-real-coefficient

  - id: fourier.fou1-coefficient-extraction
    name: 一周期積分による Fourier 係数の抽出
    kind: theorem
    aliases: [一周期積分による Fourier 係数の抽出, Fourier係数の抽出, 係数公式の導出]
    introduction: formal
    requires:
      - fourier.fou1-frequency-cancellation
      - fourier.fou1-real-coefficient

  - id: fourier.fou1-least-squares
    name: Fourier有限和の固定次数最小二乗性
    kind: theorem
    aliases: [Fourier有限和の固定次数最小二乗性, 固定次数最小二乗性, 平均二乗誤差の最小化]
    introduction: formal
    requires:
      - fourier.fou1-finite-sum
      - fourier.fou1-frequency-cancellation

  - id: fourier.fou1-complex-exponential-coefficient
    name: 複素指数係数
    kind: definition
    aliases: [複素指数係数, complex exponential coefficient]
    introduction: formal
    requires:
      - fourier.fou1-real-coefficient

  - id: fourier.fou1-parity
    name: 偶奇性による Fourier 係数の消失則
    kind: theorem
    aliases: [偶奇性による Fourier 係数の消失則, 偶関数の係数消失則, 奇関数の係数消失則]
    introduction: formal
    requires:
      - fourier.fou1-real-coefficient

  - id: fourier.fou1-half-range
    name: 半区間正弦・余弦係数
    kind: definition
    aliases: [半区間正弦・余弦係数, half-range sine coefficient, half-range cosine coefficient]
    introduction: formal
    requires:
      - fourier.fou1-parity

  - id: fourier.fou1-finite-energy-bound
    name: Fourier係数の有限エネルギー不等式
    kind: theorem
    aliases: [Fourier係数の有限エネルギー不等式, 有限エネルギー不等式]
    introduction: formal
    requires:
      - fourier.fou1-least-squares
