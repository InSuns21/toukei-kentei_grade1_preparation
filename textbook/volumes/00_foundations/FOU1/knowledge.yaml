chapter: FOU1
scope: dream-theater
coverage: complete
prerequisites:
  - RA4
forward_references:
  - analysis.pointwise-convergence
  - fourier.fejer-kernel
  - fourier.trig-system-l2-completeness
  - fourier.parseval-identity
  - fourier.partial-sum-l2-convergence

# 本章はFourier級数の係数計算をRiemann積分と有限和の直交関係だけで閉じる。
# 三角関数系の完全性、Parseval等式、各点収束、Fejer平均はFOU2側の責務とする。
# 旧FA1の概念正本はFOU2実装まで維持し、FOU1では章ローカルIDで入口理論を閉じる。

concepts:
  - id: fourier.fou1-trigonometric-polynomial
    name: 三角多項式
    kind: definition
    aliases: [三角多項式, trigonometric polynomial]
    introduction: formal

  - id: fourier.fou1-trigonometric-orthogonality
    name: 三角関数系の直交性
    kind: theorem
    aliases: [三角関数系の直交性, 三角関数の直交性, 直交性, 直交]
    introduction: formal
    requires:
      - fourier.fou1-trigonometric-polynomial

  - id: fourier.fou1-real-coefficient
    name: 実 Fourier 係数
    kind: definition
    aliases: [実 Fourier 係数, 実Fourier係数, Fourier係数]
    introduction: formal
    requires:
      - fourier.fou1-trigonometric-orthogonality

  - id: fourier.fou1-partial-sum
    name: Fourier 部分和
    kind: definition
    aliases: [Fourier 部分和, Fourier部分和]
    introduction: formal
    requires:
      - fourier.fou1-real-coefficient

  - id: fourier.fou1-coefficient-extraction
    name: 直交性による Fourier 係数の抽出
    kind: theorem
    aliases: [直交性による Fourier 係数の抽出, 直交性によるFourier係数の抽出, Fourier係数の抽出, 係数公式の導出]
    introduction: formal
    requires:
      - fourier.fou1-trigonometric-orthogonality
      - fourier.fou1-real-coefficient

  - id: fourier.fou1-least-squares
    name: Fourier 部分和の有限次数最小二乗性
    kind: theorem
    aliases: [Fourier 部分和の有限次数最小二乗性, Fourier部分和の有限次数最小二乗性, 有限次数最小二乗性, 平均二乗誤差の最小化]
    introduction: formal
    requires:
      - fourier.fou1-partial-sum
      - fourier.fou1-trigonometric-orthogonality

  - id: fourier.fou1-complex-coefficient
    name: 複素 Fourier 係数
    kind: definition
    aliases: [複素 Fourier 係数, 複素Fourier係数]
    introduction: formal
    requires:
      - fourier.fou1-real-coefficient

  - id: fourier.fou1-parity
    name: 偶奇性と Fourier 係数
    kind: theorem
    aliases: [偶奇性と Fourier 係数, 偶奇性とFourier係数, 偶関数のFourier係数, 奇関数のFourier係数]
    introduction: formal
    requires:
      - fourier.fou1-real-coefficient

  - id: fourier.fou1-half-range
    name: 半区間正弦・余弦係数
    kind: definition
    aliases: [半区間正弦・余弦係数, 半区間正弦級数, 半区間余弦級数, half-range sine series, half-range cosine series]
    introduction: formal
    requires:
      - fourier.fou1-parity

  - id: fourier.fou1-bessel-inequality
    name: Fourier 係数に対する Bessel 不等式
    kind: theorem
    aliases: [Fourier 係数に対する Bessel 不等式, Fourier係数に対するBessel不等式]
    introduction: formal
    requires:
      - fourier.fou1-least-squares

  - id: fourier.fou1-square-wave-harmonics
    name: 矩形波の奇数高調波
    kind: method
    aliases: [矩形波の奇数高調波, 奇数高調波]
    introduction: inline
    requires:
      - fourier.fou1-parity
      - fourier.fou1-real-coefficient

  - id: fourier.fou1-half-range-method
    name: 偶延長・奇延長による半区間展開
    kind: method
    aliases: [偶延長・奇延長による半区間展開, 偶延長, 奇延長, 半区間展開]
    introduction: inline
    requires:
      - fourier.fou1-half-range
