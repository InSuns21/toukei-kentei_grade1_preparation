  - { id: EMAG6-PROP-03, name: "交差電場・磁場の E cross B ドリフト" }
  - { id: EMAG6-THM-01, name: "電磁場中の Lagrangian と Lorentz 力" }
  - { id: EMAG6-PROP-04, name: "電磁場中の正準運動量" }
canonical_examples:
  - "正電荷と負電荷で磁気力の向きが反転することを v cross B から確認する例"
  - "B=B0 e_z 中で初速度 v0 e_x を持つ正電荷が時計回りに円運動することを成分方程式から導く例"
  - "E=E0 e_x、B=B0 e_z の交差場で v_D=E cross B/B^2=-(E0/B0)e_y を確認する例"
  - "一様磁場の対称 gauge A=(-B0 y/2,B0 x/2,0) から p=mv+qA を具体計算する例"
