id: "EMAG6"
title: "Lorentz 力と荷電粒子"
volume: "foundations"
status: supplementary
prerequisites:
  - EMAG5
  - AMECH4
official_scope: []
learning_objectives:
  - Lorentz 力 F=q(E+v cross B) の各項の向き・単位・電荷符号への依存を説明できる
  - 磁気力が仕事をせず、荷電粒子の運動エネルギー変化が q E dot v で決まることを導ける
  - 一様磁場中の運動を磁場に平行・垂直な速度へ分解し、円運動・螺旋運動、cyclotron 角周波数、Larmor 半径を導ける
  - 一様な交差電場・磁場で E cross B ドリフト速度を導き、電荷符号や質量に依らないことを説明できる
  - scalar potential phi と vector potential A から E=-grad phi-partial_t A、B=curl A を置いたときの電磁場中の Lagrangian を扱える
  - 電磁場中の Lagrangian L=m|v|^2/2+q A dot v-q phi の Euler--Lagrange 方程式から Lorentz 力を成分計算で再現できる
  - 直交座標における正準運動量 p=mv+qA を導き、力学的運動量 mv と区別できる
  - gauge transformation が場を変えず Lagrangian を全時間微分だけ変えることを確認し、正準運動量の gauge 依存性を説明できる
principles:
