official_scope: []
learning_objectives:
  - 距離空間の連続性をepsilon-delta・点列・開集合逆像の三形式で説明し同値性を証明できる
  - コンパクト性と点列コンパクト性の同値性を距離空間で証明できる
  - Bolzano--WeierstrassからHeine--Borelを証明できる
  - 連続像のコンパクト性とWeierstrassの最大最小定理を証明できる
  - 有限直積のコンパクト性を証明できる
  - 互いに素な非空コンパクト集合間の距離が正になることを証明できる
  - 閉集合への最近点存在証明を再構成できる
