id: "TSA2"
title: "Encore IV 時系列解析 II：Wold 分解"
volume: "foundations"
status: supplementary
prerequisites:
  - TSA1
official_scope: []
learning_objectives:
  - 過去空間の一段差をイノベーション部分空間として定義し、標準イノベーションがその空間を生成することを証明できる
  - 無限遠過去を過去空間の共通部分として定義し、減少閉部分空間への射影が共通部分への射影へ収束することを証明できる
  - 純非決定論性と線形決定論的成分を remote past で特徴付けられる
  - 過去空間を remote past と時刻別イノベーション部分空間の直交和へ分解できる
  - Wold 分解を Hilbert 空間の直交分解から導き、係数の平方可和性と psi_0=1 を証明できる
  - Wold 分解の決定論成分・イノベーション・移動平均係数の一意性を説明できる
  - AR(1) の無限移動平均表示と純非決定論性を直接検証できる
  - 可逆 MA(1) で観測過去から駆動ホワイトノイズを L2 復元し、Wold 表示を直接検証できる
