chapter: EVOL4
scope: dream-theater
coverage: complete
prerequisites:
  - EVOL3
  - GPDE10

forward_references: []

concepts:
  - id: evolution.abstract-cauchy-classical-solution
    name: 抽象 Cauchy 問題の classical 解
    kind: definition
    aliases: ["classical solution of an abstract Cauchy problem"]
    introduction: formal
    introduction_aliases: ["定義（抽象 Cauchy 問題の classical 解）"]
    requires:
      - evolution.infinitesimal-generator
      - evolution.closed-operator

  - id: evolution.abstract-cauchy-strong-solution
    name: 抽象 Cauchy 問題の strong 解
    kind: definition
    aliases: ["strong solution of an abstract Cauchy problem"]
    introduction: formal
    introduction_aliases: ["定義（抽象 Cauchy 問題の strong 解）"]
    requires:
      - evolution.infinitesimal-generator

  - id: evolution.variation-of-constants-classical
    name: classical 解の variation of constants formula
    kind: theorem
    aliases: ["variation of constants formula for classical solutions", "Duhamel formula for classical solutions"]
    introduction: formal
    introduction_aliases: ["定理（classical 解の variation of constants formula）"]
    requires:
      - evolution.abstract-cauchy-classical-solution
      - evolution.generator-orbit-differentiation
      - evolution.mild-solution

  - id: evolution.mild-solution-continuity-stability
    name: mild 解の存在・連続性・安定性
    kind: proposition
    aliases: ["continuity and stability of semigroup mild solutions"]
    introduction: formal
    introduction_aliases: ["命題（mild 解の存在・連続性・安定性）"]
    requires:
      - evolution.mild-solution
      - evolution.strongly-continuous-semigroup

  - id: evolution.strong-implies-mild
    name: strong 解から mild 解への含意
    kind: proposition
    aliases: ["strong solutions are mild solutions"]
    introduction: formal
    introduction_aliases: ["命題（strong 解は mild 解）"]
    requires:
      - evolution.abstract-cauchy-strong-solution
      - evolution.mild-solution
      - evolution.generator-orbit-differentiation
      - evolution.generator-closed-dense

  - id: evolution.mild-to-classical-regularity
    name: mild 解から classical 解への正則性回復
    kind: theorem
    aliases: ["regularity recovery from mild to classical solutions"]
    introduction: formal
    introduction_aliases: ["定理（mild 解から classical 解への正則性回復）"]
    requires:
      - evolution.mild-solution-continuity-stability
      - evolution.generator-orbit-differentiation
      - evolution.abstract-cauchy-classical-solution
