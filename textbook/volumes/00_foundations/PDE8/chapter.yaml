official_scope: []
learning_objectives:
  - 熱核による自由発展を定義し Duhamel 原理の意味を説明できる
  - 非斉次熱方程式の Duhamel 公式を微分して証明できる
  - d'Alembert 公式から非斉次一次元波動方程式の Duhamel 公式を導ける
  - 非斉次項 の依存領域を波動方程式の有限伝播と結び付けられる
  - 半線形熱方程式の Duhamel 反復差を評価し Picard 反復の収束機構を説明できる
