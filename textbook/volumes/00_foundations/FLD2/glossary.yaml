chapter: "FLD2"
terms:
  - term: 分解体
    english: splitting field
    meaning: 多項式が一次式の積に完全分解し、かつその全ての根によって基礎体上生成される最小の拡大体。
  - term: 体の埋め込み
    english: field embedding
    meaning: 体から体への単射な体準同型。本章では基礎体を各点で固定する埋め込みを主に扱う。
  - term: 代数拡大
    english: algebraic extension
    meaning: 拡大体の全ての元が基礎体上代数的である体拡大。
  - term: 代数閉体
    english: algebraically closed field
    meaning: 係数をその体に持つ任意の非定数多項式が、その体の中に根を持つ体。
  - term: 代数閉包
    english: algebraic closure
    meaning: 基礎体の代数拡大であり、同時に代数閉体でもある拡大体。
  - term: 形式微分
    english: formal derivative
    meaning: 多項式の係数に次数を掛けて指数を1下げる代数的演算。解析学の極限を用いずに定義される。
  - term: 根の重複度
    english: multiplicity of a root
    meaning: 根 α に対し (x-α)^m が割り切れる最大の整数 m。
  - term: 単根
    english: simple root
    meaning: 重複度1の根。
  - term: 重根
    english: multiple root
    meaning: 重複度2以上の根。
  - term: 分離多項式
    english: separable polynomial
    meaning: 分解体で重根を持たない多項式。
  - term: 分離的な元
    english: separable element
    meaning: 基礎体上の最小多項式が分離多項式である代数的元。
  - term: 分離拡大
    english: separable extension
    meaning: 拡大体の全ての元が基礎体上分離的である代数拡大。
  - term: 正規拡大
    english: normal extension
    meaning: 基礎体上既約な多項式が拡大体に一つ根を持てば、その拡大体上で完全に一次式へ分解する代数拡大。
