  - { id: FLD2-LEM-01, name: 一段の埋め込み延長 }
  - { id: FLD2-THM-02, name: 有限代数拡大上への埋め込み延長 }
  - { id: FLD2-THM-03, name: 分解体の同型を除く一意性 }
  - { id: FLD2-LEM-02, name: 形式微分の積の微分則 }
  - { id: FLD2-THM-04, name: 重根の形式微分判定 }
