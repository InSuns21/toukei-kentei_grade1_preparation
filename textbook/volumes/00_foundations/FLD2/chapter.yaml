  - { id: FLD2-PROP-02, name: 分解体は基礎体固定埋め込みで保たれる }
  - { id: FLD2-THM-05, name: 有限正規拡大と分解体 }
canonical_examples:
  - Q(√2) を x^2-2 の分解体として直接確認
  - Q(∛2,ω) を x^3-2 の分解体として構成し次数6を計算
  - Q(∛2)/Q を分離的だが正規でない有限拡大として確認
  - F_p(t^{1/p})/F_p(t) を正規だが分離的でない有限拡大として確認
  - Q(√[4]{2},i) を x^4-2 の分解体として構成し次数8を計算
