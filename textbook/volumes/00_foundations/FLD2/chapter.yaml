id: "FLD2"
title: "抽象代数 XII：分解体・分離性・正規性"
volume: "foundations"
status: supplementary
prerequisites:
  - FLD1
official_scope: []
learning_objectives:
  - 分解体を定義し、二次・三次・四次多項式の全ての根から分解体と拡大次数を具体的に決定できる
  - FLD1 の既約多項式による単純拡大を反復し、任意の非定数多項式に分解体が存在することを次数帰納法で証明できる
  - 基礎体を固定する体の埋め込みを定義し、代数的元の像が最小多項式の根によって決まることを証明できる
  - 代数拡大を定義し、有限拡大が代数拡大になることを FLD1 の有限次元論から説明できる
  - 一段の埋め込み延長を反復し、有限代数拡大上への埋め込み延長と分解体の同型を除く一意性を証明できる
  - 形式微分と根の重複度を定義し、重根と gcd(f,f') の関係を証明して分離性を判定できる
  - 既約多項式 p に対し p が分離的であることと p'≠0 が同値であることを証明し、標数0の場合へ適用できる
  - 正規拡大を定義し、有限拡大が正規であることと基礎体上の多項式の分解体であることの同値を証明できる
  - 分離性と正規性を区別し、標数0の非正規例と正標数の非分離正規例で壊れる証明機構を説明できる
