chapter: "F0-02B"
terms:
  - term: 凸結合
    english: convex combination
    meaning: 非負係数で係数和が1となる線形結合。
  - term: 凸集合
    english: convex set
    meaning: 集合内の任意の2点を結ぶ線分をすべて含む集合。
  - term: 凸包
    english: convex hull
    meaning: 与えられた集合を含む最小の凸集合。有限点集合では全ての凸結合の集合。
  - term: 凸錐
    english: convex cone
    meaning: 非負実数倍について閉じ、かつ凸である集合。
  - term: 分離超平面
    english: separating hyperplane
    meaning: 二つの集合または集合と点を異なる半空間へ分ける超平面。
  - term: strict separation
    english: strict separation
    meaning: 分離対象の汎関数値の間に厳密な不等号がある分離。
  - term: 最近点射影
    english: metric projection
    meaning: 点から集合までの距離を最小にする集合上の点。本章では有限次元の閉凸集合で存在一意性を示す。
  - term: 有限生成凸錐
    english: finitely generated convex cone
    meaning: 有限個の生成ベクトルの非負線形結合で表される凸錐。
  - term: Farkasの補題
    english: Farkas lemma
    meaning: 線形方程式の非負解の存在と、それが不可能であることを証明する分離証明書の存在を二者択一で述べる定理。
