id: "F0-02B"
title: "分離超平面定理・Farkasの補題・SVM"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00C2
  - F0-00E1
  - F0-00G
  - F0-02
  - F0-02A
official_scope: []
learning_objectives:
  - 凸結合・凸集合・凸包・凸錐を定義できる
  - 閉凸集合への最近点射影から点と閉凸集合の分離超平面定理を導出できる
  - 有限生成凸錐の閉性を一次独立な生成系と座標表示から説明できる
  - 分離超平面定理から古典的なFarkasの補題を導出できる
  - KKTで使うFarkas型alternativeとpolar cone表現の出所を説明できる
  - 線形分離可能性と正負クラスの凸包が交わらないことの同値性を説明できる
  - ハードマージンSVMを二つの凸包の最近点対と最大マージンの幾何として解釈できる
  - SVM双対変数を正負クラスの凸包上の凸結合として解釈できる
