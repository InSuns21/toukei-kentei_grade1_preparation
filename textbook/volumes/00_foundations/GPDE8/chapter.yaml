id: "GPDE8"
title: "Encore III Graduate PDE VIII：二階線形楕円型PDE"
volume: "foundations"
status: supplementary
prerequisites:
  - GPDE7
official_scope: []
learning_objectives:
  - divergence form二階線形作用素と零Dirichlet変分弱解を定義できる
  - 行列係数Aの一様楕円性を仮定込みで述べ、非対称部分が対角二次形式に寄与しないことを説明できる
  - A,b,cのL∞評価とPoincare不等式から双線形形式のboundedness定数を導出できる
  - 一様楕円性とlower-order termの小ささからcoercivity定数alpha=lambda-C_P||b||∞-C_P^2||c_-||∞を導出できる
  - b∈W^{1,∞}のとき一次項の対角恒等式をC_c^∞近似から証明し、c-(1/2)div bの符号からcoercivityを示せる
  - Lax--Milgramを用いて一般係数零Dirichlet問題の弱解の存在一意性とenergy estimateを導出できる
  - 負の零次項がcoercivityを破壊する機構を区間上の固有関数例で確認できる
  - 外力と係数の摂動に対するH_0^1安定性評価を導出できる
  - 弱勾配0のH^1関数がconnected domain上で定数になることをlocal mollificationから証明できる
  - bounded connected Lipschitz domain上のPoincare--Wirtinger不等式をextensionとtranslation compactnessから証明できる
  - 純Neumann問題で定数kernelとcompatibility condition F(1)=0が生じる理由を説明できる
  - 平均ゼロ部分空間でLax--Milgramを適用し、Neumann弱解の存在と定数を除いた一意性を証明できる
