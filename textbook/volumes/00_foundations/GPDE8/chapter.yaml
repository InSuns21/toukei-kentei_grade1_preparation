id: "GPDE8"
title: "大学院偏微分方程式 VIII：二階線形楕円型 PDE"
volume: "foundations"
status: supplementary
prerequisites:
  - GPDE7
official_scope: []
learning_objectives:
  - 発散形二階線形作用素と零Dirichlet変分弱解を定義できる
  - 行列係数Aの一様楕円性を仮定込みで述べ、非対称部分が対角二次形式に寄与しないことを説明できる
  - A,b,cのL∞評価とPoincaré不等式から双線形形式の有界性定数を導出できる
  - 一様楕円性と下位項の小ささから強圧性定数alpha=lambda-C_P||b||∞-C_P^2||c_-||∞を導出できる
  - b∈W^{1,∞}のとき一次項の対角恒等式をC_c^∞近似から証明し、c-(1/2)div bの符号から強圧性を示せる
  - Lax--Milgramを用いて一般係数零Dirichlet問題の弱解の存在一意性とエネルギー評価を導出できる
  - 負の零次項が強圧性を破壊する機構を区間上の固有関数例で確認できる
  - 外力と係数の摂動に対するH_0^1安定性評価を導出できる
  - 弱勾配0のH^1関数が連結領域上で定数になることを局所平滑化から証明できる
  - 有界連結Lipschitz領域上のPoincaré--Wirtinger不等式を拡張と平行移動コンパクト性から証明できる
  - 純Neumann問題で定数からなる核と適合条件F(1)=0が生じる理由を説明できる
  - 平均ゼロ部分空間でLax--Milgramを適用し、Neumann弱解の存在と定数を除いた一意性を証明できる
definitions:
  - { id: GPDE8-DEF-01, name: "発散形二階線形作用素" }
