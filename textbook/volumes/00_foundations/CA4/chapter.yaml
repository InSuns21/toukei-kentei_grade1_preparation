id: "CA4"
title: "標準複素解析 IV：Laurent展開・孤立特異点・留数・偏角原理・Rouché"
volume: "foundations"
status: supplementary
prerequisites:
  - CA3
official_scope: []
learning_objectives:
  - 有限個の穴を持つ領域で外側境界と内側境界の向きを追い、三角形分割による境界積分の相殺を説明できる
  - 環状領域のCauchy型表示から内外の幾何級数を一様収束させ、Laurent展開と係数公式・一意性を導ける
  - Laurent主部と可除特異点・極・真性特異点の三分類を双方向に対応づけられる
  - 留数をLaurent係数として定義し、単純極・高位極の留数公式を導ける
  - 小円を除いた領域の境界向きを明示して単純閉曲線版の留数定理を証明できる
  - 実積分へ留数定理を適用するとき、大円弧の寄与を被積分関数の上界と弧長のML評価で0へ送れる
  - 対数微分f'/fの留数から零点・極の位数を数え、単純閉曲線版の偏角原理を導ける
  - f+tgが境界で消えないことと連続な整数値零点数を使ってRouchéの定理を証明できる
