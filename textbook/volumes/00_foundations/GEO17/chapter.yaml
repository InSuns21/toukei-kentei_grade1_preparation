id: "GEO17"
title: "幾何学 XVII：変分公式・Jacobi 場・共役点"
volume: "foundations"
status: supplementary
prerequisites:
  - GEO14
  - GEO16
official_scope: []
learning_objectives:
  - 曲線の変分・変分ベクトル場・固定端点変分を定義し、二変数写像上で曲線に沿う共変微分を交換する公式を証明できる
  - エネルギーの第一変分公式を導き、固定端点変分に対して測地線がエネルギーの臨界点であることとその逆を証明できる
  - 長さの第一変分公式を導き、単位速測地線に対する境界項と加速度項の役割を説明できる
  - 固定端点の測地線に沿うエネルギーの第二変分公式を導き、指数形式に曲率項が現れることを説明できる
  - 測地線変分を微分して Jacobi 方程式を導き、逆に任意の Jacobi 場を測地線変分から実現できる
  - 指数写像の微分を Jacobi 場の終値として表し、共役点と指数写像の微分の退化が同値であることを証明できる
  - 半径 a の球面上で Jacobi 方程式を解き、対蹠点が距離 pi a で最初の共役点となり重複度 n-1 を持つことを計算できる
  - 共役点がない区間で指数形式が正定値になることを Jacobi 基本行列の分解から証明できる
  - 区間内部に共役点があると負の第二変分方向を構成でき、測地線が局所最短でなくなることを説明できる
  - 非正断面曲率では共役点が生じないことを Jacobi 場の長さ二乗の凸性から証明できる
