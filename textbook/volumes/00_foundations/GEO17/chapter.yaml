  - { id: GEO17-THM-05, name: Jacobi 場の測地線変分による実現 }
  - { id: GEO17-PROP-01, name: 指数写像の微分と Jacobi 場 }
  - { id: GEO17-THM-06, name: 共役点と指数写像の微分の退化 }
  - { id: GEO17-PROP-02, name: 球面の対蹠点は共役点 }
  - { id: GEO17-THM-07, name: 共役点がない区間での指数形式の正定値性 }
  - { id: GEO17-THM-08, name: 区間内部の共役点は局所最短性を壊す }
