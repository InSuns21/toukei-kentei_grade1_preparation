  - { id: QMC3-THM-02, name: 三角多項式に対する格子則の積分誤差公式 }
  - { id: QMC3-THM-03, name: 絶対収束 Fourier 級数に対する格子則の積分誤差公式 }
  - { id: QMC3-THM-04, name: 重み付き周期 Fourier 空間における格子則の最悪誤差公式 }
  - { id: QMC3-THM-05, name: "一次元格子則の滑らかさ依存最悪誤差率" }
  - { id: QMC3-THM-06, name: 生成ベクトルの可逆スカラー倍不変性 }
canonical_examples:
  - N=5, z=(1,2) のランク1格子点集合を全点書き出す例
  - z=(1,1) では h=(1,-1) が双対格子に入り cos(2pi(x1-x2)) の誤差が 1 になる失敗例
  - z=(1,2), N=5 では同じ低周波モードが消える例
  - 一次元で双対格子が N Z となり滑らかな周期関数の高周波だけが誤差に残る例
  - N=5 の有限周波数切断基準で z2=1,2,3,4 を比較し CBC の一段を実行する例
