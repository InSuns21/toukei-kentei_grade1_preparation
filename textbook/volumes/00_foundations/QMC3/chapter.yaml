id: "QMC3"
title: "格子則"
volume: "foundations"
status: supplementary
prerequisites:
  - QMC2
  - FOU1
official_scope: []
learning_objectives:
  - ランク1格子点集合と生成ベクトルを定義し、点が重複しないための最大公約数条件を説明できる
  - 双対格子を定義し、複素指数モードの格子平均が双対格子上でのみ残る離散直交性を証明できる
  - FOU1 の複素指数係数を単位トーラス上の多次元 Fourier 係数へ規格化し、三角多項式および絶対収束 Fourier 級数に対する格子則の積分誤差公式を導ける
  - 生成ベクトルが低周波の双対ベクトルを持つと大きな積分誤差が生じることを具体例で説明できる
  - 重み付き周期 Fourier 空間を定義し、Cauchy--Schwarz の不等式から双対格子和による最悪誤差公式を導ける
  - 一次元格子則では双対格子が N Z となり、滑らかさ alpha に応じて最悪誤差が N^{-alpha} で減衰することを証明できる
  - N と互いに素なスカラー倍が同じランク1格子点集合を与えることを証明し、素数 N で第一成分を 1 に正規化できる理由を説明できる
  - 成分逐次構成（CBC）を定義し、全生成ベクトル探索ではなく座標を一つずつ追加する設計思想を説明できる
  - 有限周波数切断した双対格子基準を手計算し、CBC の一段を実行できる
