  - { id: SET9-THM-04, name: 超フィルターの二者択一 }
  - { id: SET9-PROP-01, name: 余有限族はフィルターである }
  - { id: SET9-THM-05, name: Zorn からの超フィルター拡張 }
  - { id: SET9-THM-06, name: 自然数上の自由超フィルターの存在 }
canonical_examples:
