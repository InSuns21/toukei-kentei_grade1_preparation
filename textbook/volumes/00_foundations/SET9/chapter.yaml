id: "SET9"
title: "弱い選択原理と超フィルター"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00A2
  - F0-00A3A
  - TOP6
official_scope: []
learning_objectives:
  - 有限選択・可算選択・従属選択・完全な選択公理を区別できる
  - AC から DC、DC から可算選択を導ける
  - TOP6 のフィルターを再利用して超フィルターを定義できる
  - 超フィルターの二者択一を極大性から証明できる
  - 余有限フィルターがフィルターであることを直接確認できる
  - Zorn の補題から超フィルター拡張を証明できる
  - 余有限フィルターの延長から自然数上の自由超フィルターを構成できる
  - 超フィルター補題を完全な選択公理と無条件に同一視しない
