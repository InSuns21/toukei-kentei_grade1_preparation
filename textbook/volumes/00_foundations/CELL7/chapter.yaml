id: "CELL7"
title: "シフト空間・円筒集合・配置の近さ"
volume: "foundations"
status: supplementary
prerequisites:
  - CELL6
official_scope: []
learning_objectives:
  - 全シフト空間とシフト写像を定義し逆方向の写像を検算できる
  - 円筒集合の交差と中央一致窓への包含を再現できる
  - 中央一致距離の強い三角不等式を証明できる
  - 配置列の収束と有限窓の最終的一致の同値を証明できる
  - シフトと有限半径CAの連続性を入力窓から導ける
  - 対角部分列構成による列コンパクト性を証明できる
  - 円筒被覆の有限部分被覆と一様有限窓の帰結を導ける
  - 無限状態の反例を使い有限状態仮定の役割を述べられる
