  - { id: CELL7-DEF-01, name: "全シフト空間とシフト写像" }
  - { id: CELL7-DEF-02, name: "円筒集合と中央一致窓" }
  - { id: CELL7-DEF-03, name: "中央一致距離" }
  - { id: CELL7-DEF-04, name: "配置列の収束" }
  - { id: CELL7-DEF-05, name: "配置空間上の連続写像" }
theorems:
  - { id: CELL7-THM-01, name: "中央一致距離の強い三角不等式" }
  - { id: CELL7-THM-02, name: "収束と有限窓の最終的一致" }
  - { id: CELL7-THM-03, name: "有限状態全シフトの列コンパクト性" }
  - { id: CELL7-THM-04, name: "円筒被覆の有限部分被覆" }
propositions:
  - { id: CELL7-PROP-01, name: "円筒集合と中央一致窓の対応" }
  - { id: CELL7-PROP-02, name: "開球と中央一致窓" }
  - { id: CELL7-PROP-03, name: "連続性の有限窓判定" }
  - { id: CELL7-PROP-04, name: "シフトと有限半径CAの連続性" }
