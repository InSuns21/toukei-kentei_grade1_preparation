id: "F0-00G"
title: "凸集合・凸関数・凸最適化の基礎"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00F1
official_scope: []
learning_objectives:
  - 凸結合・凸集合・凸包を定義し具体例を判定できる
  - 凸関数・狭義凸関数を定義できる
  - 開凸領域上のC2関数について凸性とHessian半正定値性の同値を証明できる
  - 狭義凸とHessian正定値を同値と誤解しない
  - 微分可能凸関数の一次支持不等式を導ける
  - 凸関数では局所最小が大域最小になることを示せる
  - 凸制約から作られる実行可能集合が凸になる条件を説明できる
