learning_objectives:
  - 凸結合・凸集合・凸包を定義し具体例を判定できる
  - 凸関数・狭義凸関数を定義しグラフの幾何で説明できる
  - 微分可能凸関数の一次支持不等式を説明できる
  - 凸関数では局所最小が大域最小になることを示せる
  - 凸制約から作られる実行可能集合が凸になる条件を説明できる
  - Slater条件を厳密実行可能点の存在として説明できる
  - 凸最適化で強双対性が成立する代表的条件としてSlater条件を位置付けられる
