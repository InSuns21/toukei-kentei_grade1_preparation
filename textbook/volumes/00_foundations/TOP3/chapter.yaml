id: "TOP3"
title: "標準位相 III：連結性・弧状連結性・連結成分"
volume: "foundations"
status: supplementary
prerequisites:
  - TOP2
  - F0-00A1
official_scope: []
learning_objectives:
  - 分離と非自明な開閉集合の不存在が連結性の同値な見方であることを両方向に証明できる
  - 連結空間の連続像が連結であることを逆像による分離の引き戻しから証明できる
  - 実数の区間が連結であることを上限を用いた矛盾法で証明できる
  - 実数の連結部分集合が区間になることを中間点の欠落から分離を作って示せる
  - 道と弧状連結性を定義し、弧状連結なら連結であることを区間の連結性から証明できる
  - 共通点を持つ連結集合族の合併が連結であることを使い、連結成分の極大性と分割を証明できる
  - 連結集合の閉包が連結であることから、連結成分が閉集合であることを証明できる
definitions:
  - { id: TOP3-DEF-01, name: 分離 }
  - { id: TOP3-DEF-02, name: 連結空間・連結性 }
  - { id: TOP3-DEF-03, name: 道・弧状連結 }
  - { id: TOP3-DEF-04, name: 連結成分 }
  - { id: TOP3-DEF-05, name: 開閉集合 }
theorems:
