  - { id: TOP3-THM-01, name: 連結空間の連続像は連結 }
  - { id: TOP3-THM-02, name: 実数の区間は連結 }
  - { id: TOP3-THM-03, name: 実数の連結部分集合は区間 }
  - { id: TOP3-THM-04, name: 弧状連結なら連結 }
  - { id: TOP3-PROP-02, name: 凸集合は弧状連結 }
  - { id: TOP3-LEM-01, name: 共通点を持つ連結集合族の合併は連結 }
  - { id: TOP3-THM-05, name: 連結成分は極大連結集合であり空間を分割する }
  - { id: TOP3-LEM-02, name: 連結集合の閉包は連結 }
  - { id: TOP3-THM-06, name: 連結成分は閉集合 }
