chapter: F0-00FA1
scope: dream-theater
coverage: complete
prerequisites:
  - F0-00E2
  - F0-00D2
  - F0-00D2E
  - F0-00D3
  - F0-02C1
  - F0-00H1

concepts:
  - id: fourier.complex-coefficient
    name: 複素 Fourier 係数
    kind: definition
    aliases: [複素 Fourier 係数]

  - id: fourier.partial-sum
    name: Fourier 部分和
    kind: definition
    aliases: [Fourier 部分和]
    requires:
      - fourier.complex-coefficient

  - id: fourier.bessel-inequality
    name: Fourier 係数に対する Bessel 不等式
    kind: theorem
    aliases: [Fourier 係数に対する Bessel 不等式]
    requires:
      - fourier.partial-sum

  - id: fourier.fejer-kernel
    name: Fejér kernel
    kind: definition
    aliases: [Fejér kernel]

  - id: fourier.translation-continuity-l2
    name: L2 の平行移動連続性
    kind: lemma
    aliases: [平行移動連続性]

  - id: fourier.fejer-l2-convergence
    name: Fejér 平均の L2 収束
    kind: theorem
    aliases: [Fejér 平均の]
    requires:
      - fourier.fejer-kernel
      - fourier.translation-continuity-l2

  - id: fourier.trig-system-l2-completeness
    name: 三角関数系の L2 完全性
    kind: theorem
    aliases: [三角関数系の]
    requires:
      - fourier.fejer-l2-convergence

  - id: fourier.parseval-identity
    name: Parseval 等式
    kind: corollary
    aliases: [Parseval 等式]
    requires:
      - fourier.bessel-inequality
      - fourier.trig-system-l2-completeness

  - id: fourier.partial-sum-l2-convergence
    name: Fourier 部分和の L2 収束
    kind: corollary
    aliases: [Fourier 部分和の]
    requires:
      - fourier.partial-sum
      - fourier.trig-system-l2-completeness
