learning_objectives:
  - 周期関数を三角関数系で展開するFourier級数を定義できる
  - 三角関数系の直交性からFourier係数を導ける
  - 複素指数関数によるFourier級数へ書き換えられる
  - Bessel不等式とParseval等式をFourier係数へ適用できる
  - L2収束と各点収束を区別できる
  - Fourier級数をHilbert空間の正規直交展開として説明できる
  - 正弦・余弦が微分作用素の固有関数として現れることを説明できる
