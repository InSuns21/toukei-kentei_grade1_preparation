id: "CELL11"
title: "二次元CAとConwayのGame of Life"
volume: "foundations"
status: supplementary
prerequisites:
  - CELL10
official_scope: []
learning_objectives:
  - Moore近傍とvon Neumann近傍を座標で定義し、斜めの扱いを説明できる
  - 二次元の局所規則と全平面の同期更新を定義できる
  - LifeのB3/S23を近隣生存数の規則式で判定できる
  - 二次元CAの有限伝播を正方形の包含関係から帰納証明できる
  - 生セルの包囲長方形の時間発展上界を証明できる
  - 静止物体と振動子を配置の等式で区別し、ブロックとブリンカーを全近傍で検証できる
  - グライダーの4世代移動を全近傍の数え上げで証明できる
  - 無限平面・固定境界・周期境界を区別して数値例を計算できる
  - 局所的な運動模様の観測と計算普遍性の証明を区別できる
definitions:
  - { id: CELL11-DEF-01, name: "二次元の近傍" }
