  - { id: CELL11-PROP-02, name: "ブロックは静止物体" }
  - { id: CELL11-PROP-03, name: "ブリンカーは最小周期2" }
  - { id: CELL11-PROP-04, name: "グライダーの4世代移動" }
canonical_examples:
  - "Moore近傍とvon Neumann近傍の斜め位置の差"
  - "LifeのB3/S23状態判定"
