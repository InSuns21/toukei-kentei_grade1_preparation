id: "GEO15"
title: "幾何学 XV：完備性・Hopf--Rinow"
volume: "foundations"
status: supplementary
prerequisites:
  - GEO14
  - TOP5
official_scope: []
learning_objectives:
  - Riemann 距離に関する距離完備性と、最大測地線が全実数へ延長できる測地完備性を区別して定義できる
  - 測地完備性と指数写像が全接空間上で定義されることの同値を説明できる
  - 最短測地線を定義し、その存在だけでは完備性を導けないことを開 Euclid 球で説明できる
  - 距離完備性から有限時刻で終わる測地線を延長する証明を、位置の Cauchy 性・座標速度の有界性・Christoffel 係数の局所有界性まで追って再構成できる
  - 距離の下限へ近づく曲線列と正規球面のコンパクト性から、小さい球面上の距離減少点を構成できる
  - 最短な区分的測地線が角を持てないことを凸正規近傍から証明できる
  - 一点で指数写像が全域定義されることから、任意点までの最短測地線を open-closed 型の延長論証で構成できる
  - 全域指数写像と最短測地線の存在から閉距離球を接空間の閉球の指数像として表し、コンパクト性を証明できる
  - Hopf--Rinow の距離完備・測地完備・指数写像の全域定義・閉有界集合のコンパクト性の同値を循環なく証明できる
  - 切断時刻・切断点・切断跡を定義し、円周と球面で最短性の喪失を説明できる
