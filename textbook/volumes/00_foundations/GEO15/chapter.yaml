  - { id: GEO15-THM-01, name: 距離完備なら測地完備 }
  - { id: GEO15-LEM-01, name: 小さい正規球面上の距離減少点 }
  - { id: GEO15-LEM-02, name: 最短な区分的測地線に角はない }
  - { id: GEO15-THM-02, name: 全域指数写像から最短測地線を得る }
  - { id: GEO15-PROP-02, name: 閉距離球は接空間の閉球の指数像 }
  - { id: GEO15-PROP-03, name: 閉有界集合がコンパクトなら距離完備 }
  - { id: GEO15-THM-03, name: Hopf--Rinow の定理 }
  - { id: GEO15-COR-01, name: 完備 Riemann 多様体の閉有界集合はコンパクト }
