  - { id: GEO15-DEF-01, name: 距離完備な Riemann 多様体 }
  - { id: GEO15-DEF-02, name: 測地完備な Riemann 多様体 }
  - { id: GEO15-DEF-03, name: 最短測地線 }
  - { id: GEO15-DEF-04, name: 切断時刻 }
  - { id: GEO15-DEF-05, name: 切断点・切断跡 }
