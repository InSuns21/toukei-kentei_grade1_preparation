  - { id: MT4-LEM-02, name: 1次元有限区間選択補題 }
  - { id: MT4-THM-01, name: Hardy–Littlewood 最大関数の弱1-1評価 }
  - { id: MT4-THM-02, name: Lebesgue微分定理 }
  - { id: MT4-THM-03, name: Lebesgue密度定理 }
  - { id: MT4-LEM-03, name: Lebesgue積分の絶対連続性 }
  - { id: MT4-THM-04, name: L1不定積分の絶対連続性とa.e.微分 }
  - { id: MT4-THM-05, name: ACならBV }
  - { id: MT4-LEM-04, name: AC関数の変動関数もAC }
  - { id: MT4-LEM-05, name: 連続増加関数のLebesgue–Stieltjes測度 }
