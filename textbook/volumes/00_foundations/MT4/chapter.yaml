id: "MT4"
title: "Lebesgue微分定理・絶対連続関数"
volume: "foundations"
status: supplementary
prerequisites:
  - MT0
  - MT3
  - F0-00D2B
official_scope: []
learning_objectives:
  - 局所可積分を開集合上で定義し、制限・コンパクト台との積・Lpからの包含を説明できる
  - 1次元区間選択補題からHardy–Littlewood 最大関数の弱(1,1)評価を証明できる
  - 有界区間外で0となる連続関数のL1稠密性と弱型評価を使ってLebesgue微分定理を証明できる
  - Lebesgue密度定理を指示関数への微分定理適用として導出できる
  - L1不定積分が絶対連続でa.e.に元の関数へ微分されることを示せる
  - 絶対連続関数を有界変動および増加AC関数の差へ接続できる
  - Lebesgue–Stieltjes測度とRadon–Nikodym定理からAC版FTCを構成できる
  - Cantor関数を用いてBV・a.e.微分可能性とACの差を説明できる
definitions:
  - { id: MT4-DEF-01, name: 局所可積分 L1_loc }
  - { id: MT4-DEF-02, name: Hardy–Littlewood 最大関数 }
  - { id: MT4-DEF-03, name: 絶対連続関数 }
  - { id: MT4-DEF-04, name: 有界変動と全変動 }
theorems:
