official_scope: []
learning_objectives:
  - 線形汎関数と連続線形汎関数を区別できる
  - 線形汎関数の連続性と有界性の同値を説明できる
  - 双対空間X*と双対ノルムを定義できる
  - C区間上の評価汎関数とL2上の点評価の違いを説明できる
  - Riesz表現定理を有限次元の内積表示と対応付け、Hilbert空間で証明の流れを説明できる
