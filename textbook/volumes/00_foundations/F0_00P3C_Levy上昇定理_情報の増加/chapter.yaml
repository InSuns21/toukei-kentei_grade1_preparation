id: "F0-00P3C"
title: "Lévy上昇定理・情報の増加"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00P3A
  - F0-00D2B
official_scope: []
learning_objectives:
  - 増加する部分σ代数列と極限情報を定義できる
  - 増加情報の和集合が代数になることを示せる
  - 生成σ代数の集合を有限段階の情報で確率近似できることを示せる
  - 集合近似から有限段階可測単関数のL1稠密性を証明できる
  - 上向き横断を定義し具体的な数列で回数を確認できる
  - 条件付き期待値のL1縮小性からLévy上昇定理のL1収束を証明できる
  - 予測可能な0/1保有戦略から上向き横断評価を導ける
  - 上向き横断評価とFatouの補題からa.s.収束を証明できる
  - 次章の確率収束を先取りせずa.s.極限を同定できる
