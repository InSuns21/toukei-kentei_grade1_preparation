id: "SET1"
title: "公理的集合論への入口：ZF と ZFC"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00A1D
official_scope: []
learning_objectives:
  - Russell のパラドックスから無制限内包が破綻する理由を説明できる
  - ZF の主要公理・公理図式がどの集合構成を保証するか説明できる
  - 分出公理図式と無制限内包を区別できる
  - 置換公理図式が一価な対応の像を集合として確保する役割を説明できる
  - 正則性公理から自己所属や有限の所属循環が排除されることを示せる
  - ZF と ZFC を区別し、後続構成で選択公理を使う位置を追跡できる
definitions:
  - { id: SET1-TERM-01, name: 真の類 }
  - { id: SET1-TERM-02, name: 公理図式 }
  - { id: SET1-DEF-01, name: ZF と ZFC }
theorems:
