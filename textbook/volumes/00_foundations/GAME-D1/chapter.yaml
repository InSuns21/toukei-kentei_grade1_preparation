id: "GAME-D1"
title: "安定結婚問題・Gale--Shapley アルゴリズム"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00A
official_scope: []
learning_objectives:
  - 二つの同数な有限集合と各主体の厳密な選好順位から、一対一マッチング市場を定式化できる
  - 一対一マッチングを相互に整合する対応として定義し、小規模な割当てがマッチングかどうかを直接確認できる
  - blocking pair を「現在の相手より互いを厳密に好む未成立の組」として定義し、安定性を全ての組について検証できる
  - 提案側受入保留アルゴリズムを、提案・保留・拒否・再提案の順に手計算で実行できる
  - 各提案組が高々1回しか現れないことから、受入保留アルゴリズムが有限回で停止することを証明できる
  - 同数・完全選好の仮定の下で、停止時に全主体がマッチすることを証明できる
  - 受け手が保留相手を交換するとき必ずより好む相手へ移ることを用い、Gale--Shapley アルゴリズムの出力が安定であることを完全証明できる
  - 単純な永久確定型の貪欲割当てが blocking pair を残し得る例と比較し、受入を保留する意味を説明できる
  - 安定性が「互いに逸脱したい組がない」という二者的条件であり、単なる順位合計の最小化や個々の第一希望人数最大化とは異なることを説明できる
definitions:
  - { id: GAME-D1-DEF-01, name: 厳密選好リスト }
  - { id: GAME-D1-DEF-02, name: 一対一マッチング }
  - { id: GAME-D1-DEF-03, name: blocking pair・安定マッチング }
  - { id: GAME-D1-DEF-04, name: 受入保留アルゴリズム }
theorems:
