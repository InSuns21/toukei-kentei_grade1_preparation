  - { id: GAME-D1-PROP-02, name: 同数・完全選好の下での完全マッチング }
  - { id: GAME-D1-THM-01, name: Gale--Shapley の安定マッチング存在定理 }
canonical_examples:
  - "3対3の選好表で、a と b が同じ受け手 x に提案し、x が b を保留して a を拒否した後に再提案が連鎖する例"
  - "最終マッチング (a,y),(b,x),(c,z) について、各提案者が最終相手より好む受け手は過去に自分を拒否しているため blocking pair がないことを直接確認する例"
  - "永久確定型の貪欲割当てでは b と x が互いに現在相手より好み合って blocking pair を作る例"
