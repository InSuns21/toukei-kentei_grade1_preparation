id: "F0-00WK1"
title: "Encore III：弱形式・変分形式・Poisson方程式"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00SOB2
  - F0-00PDE3
official_scope: []
learning_objectives:
  - Poisson方程式の古典解と弱解を区別できる
  - テスト関数を掛けて部分積分することで弱形式を導ける
  - Dirichlet境界条件をH0^1へ組み込める
  - 双線形形式a(u,v)と線形汎関数F(v)を定義できる
  - 弱形式をHilbert空間上の方程式a(u,v)=F(v)として読める
  - 対称問題では弱解とエネルギー汎関数の最小化が対応することを説明できる
