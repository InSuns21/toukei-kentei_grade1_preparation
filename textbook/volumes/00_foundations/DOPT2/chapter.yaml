id: "DOPT2"
title: "ネットワーク最適化"
volume: "foundations"
status: supplementary
prerequisites:
  - DOPT1
official_scope: []
learning_objectives:
  - 有向グラフ上の容量付きネットワークと s--t フローを定義し、容量制約・流量保存則・フロー値を具体例で検算できる
  - s--t カットとカット容量を定義し、任意の実行可能フロー値が任意のカット容量以下であることを証明できる
  - 残余ネットワークと増加路を構成し、逆向き残余辺が過去の流量を取り消す役割を説明できる
  - 増加路が存在しないとき到達可能頂点集合から最小カットを構成し、最大流最小カット定理を証明できる
  - 整数容量ネットワークで Ford--Fulkerson 型増加を行うと整数最大流が得られる理由と有限停止性を説明できる
  - 最大流問題を線形計画として表し、整数条件を課していないにもかかわらず整数容量では整数最適解を選べることを説明できる
  - 供給・需要・容量・単位費用を持つ最小費用流を定式化し、小規模ネットワークの最適流を手計算できる
  - 最小費用流の残余費用を定義し、負費用閉路に沿う修正が目的値を改善することを証明できる
  - 実行可能流の差を残余ネットワーク上の循環へ移し、負費用閉路がないことと最小費用性の同値を証明できる
definitions:
  - { id: DOPT2-DEF-01, name: 容量付き有向ネットワーク }
  - { id: DOPT2-DEF-02, name: s--t フローとフロー値 }
  - { id: DOPT2-DEF-03, name: s--t カットとカット容量 }
  - { id: DOPT2-DEF-04, name: 残余ネットワーク }
  - { id: DOPT2-DEF-05, name: 増加路 }
  - { id: DOPT2-DEF-06, name: 最小費用流 }
  - { id: DOPT2-DEF-07, name: 残余費用 }
  - { id: DOPT2-DEF-08, name: 非負循環 }
theorems:
  - { id: DOPT2-THM-01, name: フロー・カット不等式 }
  - { id: DOPT2-PROP-01, name: 増加路に沿う更新の実行可能性 }
  - { id: DOPT2-THM-02, name: 最大流最小カット定理 }
  - { id: DOPT2-THM-03, name: 整数容量に対する整数最大流 }
  - { id: DOPT2-LEM-01, name: 非負循環の閉路分解 }
  - { id: DOPT2-PROP-02, name: 負費用残余閉路による改善 }
  - { id: DOPT2-THM-04, name: 最小費用流の負閉路最適性条件 }
canonical_examples:
  - 4頂点ネットワークで容量制約と流量保存則を直接確認する s--t フロー
  - 同じネットワークでフロー値5と容量5のカットを一致させる最大流・最小カット
  - 逆向き残余辺を用いて既存フローを一部取り消し別経路へ振り替える例
  - 整数容量ネットワークを単位以上ずつ増加して整数最大流へ到達する例
  - 供給4・需要4の3頂点ネットワークで最小費用14を得る例
  - 残余ネットワークの負費用閉路に3単位流して総費用を20から14へ改善する例
problem_patterns:
