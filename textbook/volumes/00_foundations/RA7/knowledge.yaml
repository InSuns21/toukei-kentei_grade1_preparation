chapter: RA7
scope: dream-theater
coverage: complete
prerequisites:
  - RA4
  - RA6
  - LA3C

# RA7 では有限次元版を結果として先に使い、完全証明は後段の位相空間論で回収する。
# これらは prerequisite edge ではなく proof ownership / forward reference である。
forward_references:
  - topology.bolzano-weierstrass-rp
  - topology.heine-borel
  - topology.heine-cantor-compact-metric
  - topology.extreme-value-theorem

concepts:
  - id: analysis.finite-dimensional-heine-borel
    name: 有限次元 Heine--Borel 型結果
    kind: theorem
    aliases: [有限次元 Heine--Borel 型結果, 有限次元Heine--Borel型結果, R^nの閉有界集合の有限化]
    requires:
      - topology.bolzano-weierstrass-real

  - id: analysis.finite-dimensional-heine-cantor
    name: 有限次元 Heine--Cantor 型結果
    kind: theorem
    aliases: [有限次元 Heine--Cantor 型結果, 有限次元Heine--Cantor型結果, R^nの閉有界集合上の一様連続性]
    requires:
      - analysis.finite-dimensional-heine-borel

  - id: analysis.closed-bounded-open-buffer
    name: 一様な内側余裕
    kind: corollary
    aliases: [一様な内側余裕]
    requires:
      - analysis.finite-dimensional-heine-borel

  - id: analysis.multidimensional-darboux-sums
    name: 多次元Darboux上和・下和
    kind: definition
    aliases: [多次元Darboux上和, 多次元Darboux下和]
    requires:
      - analysis.darboux-sums

  - id: analysis.multiple-riemann-integral
    name: 多重Riemann積分
    kind: definition
    aliases: [多重Riemann積分, 多次元Riemann積分]
    requires:
      - analysis.multidimensional-darboux-sums

  - id: analysis.jordan-measurable-set
    name: Jordan可測集合
    kind: definition
    aliases: [Jordan可測集合, Jordan可測]
    requires:
      - analysis.multiple-riemann-integral

  - id: analysis.jordan-domain-riemann-integral
    name: Jordan可測集合上のRiemann積分
    kind: definition
    aliases: [Jordan可測集合上のRiemann積分]
    requires:
      - analysis.jordan-measurable-set
      - analysis.multiple-riemann-integral

  - id: analysis.continuous-multiple-riemann-integrable
    name: 連続関数の多重Riemann可積分性
    kind: theorem
    aliases: [連続関数の多重Riemann可積分性]
    requires:
      - analysis.multiple-riemann-integral
      - analysis.finite-dimensional-heine-cantor

  - id: analysis.iterated-riemann-integral-rectangle
    name: 矩形上の反復積分定理
    kind: theorem
    aliases: [矩形上の反復積分定理, Riemann版反復積分定理]
    requires:
      - analysis.continuous-multiple-riemann-integrable
      - analysis.riemann-integrable

  - id: analysis.linear-volume-scaling
    name: 線形写像の体積倍率
    kind: theorem
    aliases: [線形写像の体積倍率]
    requires:
      - analysis.jordan-measurable-set
      - linear.determinant-elementary-operations
      - linear.determinant-multiplicativity

  - id: analysis.local-volume-scaling
    name: C1写像の局所体積倍率
    kind: lemma
    aliases: [C1写像の局所体積倍率, 局所体積倍率補題]
    requires:
      - analysis.linear-volume-scaling
      - analysis.multivariable-differentiability
      - analysis.finite-dimensional-heine-cantor
      - linear.determinant-invertibility-criterion

  - id: analysis.multivariable-riemann-change-of-variables
    name: Riemann積分の多変数変数変換定理
    kind: theorem
    aliases: [Riemann積分の多変数変数変換定理, 多変数変数変換定理]
    requires:
      - analysis.jordan-domain-riemann-integral
      - analysis.local-volume-scaling
      - analysis.multivariable-differentiability
      - analysis.finite-dimensional-heine-cantor
      - analysis.closed-bounded-open-buffer
      - linear.matrix-determinant

  - id: analysis.polar-spherical-riemann-change-of-variables
    name: 極座標・球座標のRiemann積分公式
    kind: corollary
    aliases: [極座標のRiemann積分公式, 球座標のRiemann積分公式]
    requires:
      - analysis.multivariable-riemann-change-of-variables