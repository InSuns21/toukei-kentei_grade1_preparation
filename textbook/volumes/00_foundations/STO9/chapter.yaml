id: "STO9"
title: "Encore IV 確率解析 IX：SDE・強解・存在一意性・局所化"
volume: "foundations"
status: supplementary
prerequisites:
  - STO5
  - STO6
  - STO7
  - RA5
official_scope: []
learning_objectives:
  - ブラウン運動で駆動されるSDEを積分方程式として定式化し、強解と経路ごとの一意性を区別して説明できる
  - 大域 Lipschitz条件の下でPicard反復を構成し、L2 supremum評価から強解の存在を証明できる
  - Gronwall型評価から経路ごとの一意性と有限時間二乗moment評価を導ける
  - 初期値・係数の摂動に対するSDE解の安定性を同一ブラウン運動上で評価できる
  - 局所 Lipschitz係数をcutoffして整合的な停止解を貼り合わせ、maximal 強解と爆発時刻を構成できる
  - 線形成長条件から停止解の一様moment評価を作り、explosionが起こらないことを証明できる
  - coerciveなC2関数を用いるLyapunov型条件から非爆発を証明できる
  - 局所 Lipschitzだけでは有限時間爆発が起こり得ることを具体例で説明できる
  - 一次元SDEで同一拡散係数を持つ二つの解について比較定理を平滑化とItô formulaから証明できる
