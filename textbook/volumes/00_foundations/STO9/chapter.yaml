id: "STO9"
title: "Encore IV Stochastic Analysis IX：SDE・strong solution・存在一意性・局所化"
volume: "foundations"
status: supplementary
prerequisites:
  - STO5
  - STO6
  - STO7
official_scope: []
learning_objectives:
  - Brown運動で駆動されるSDEを積分方程式として定式化し、strong solutionとpathwise uniquenessを区別して説明できる
  - global Lipschitz条件の下でPicard反復を構成し、L2 supremum評価からstrong solutionの存在を証明できる
  - Gronwall型評価からpathwise uniquenessと有限時間二乗moment評価を導ける
  - 初期値・係数の摂動に対するSDE解の安定性を同一Brown運動上で評価できる
  - local Lipschitz係数をcutoffして整合的な停止解を貼り合わせ、maximal strong solutionとexplosion timeを構成できる
  - linear growth条件から停止解の一様moment評価を作り、explosionが起こらないことを証明できる
  - coerciveなC2関数を用いるLyapunov型条件から非爆発を証明できる
  - local Lipschitzだけでは有限時間爆発が起こり得ることを具体例で説明できる
  - 一次元SDEで同一diffusion係数を持つ二つの解について比較定理を平滑化とItô formulaから証明できる
