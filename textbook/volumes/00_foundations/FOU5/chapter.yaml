id: "FOU5"
title: "標準Fourier解析 V：確率・離散Fourier変換・サンプリング"
volume: "foundations"
status: supplementary
prerequisites:
  - FOU4
  - F0-00P3D
  - F0-00P6A
official_scope: []
learning_objectives:
  - 有限Borel測度のFourier変換を定義し、確率変数の特性関数との符号規約を説明できる
  - 確率測度の畳み込みを押し出し測度として定義し、独立和の分布とFourier積の対応を証明できる
  - iid中心極限定理をFourier解析の観点から読み直し、独立和・尺度変換・局所二次展開の役割を説明できる
  - 離散Fourier変換を定義し、1のN乗根の直交性から反転公式とParseval等式を証明できる
  - 巡回畳み込みが離散Fourier変換で成分ごとの積へ変わることを証明できる
  - Cooley--Tukey型の偶奇分割が計算量をO(N log N)へ下げる機構を説明できる
  - 等間隔標本化で周波数が2pi/Delta周期で同一視されるエイリアシングを式から導ける
  - 連続Fourier変換・特性関数・離散Fourier変換の共通構造と相違点を整理できる
definitions:
  - { id: FOU5-DEF-01, name: 有限測度のFourier変換 }
