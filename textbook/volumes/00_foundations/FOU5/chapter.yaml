  - { id: FOU5-PROP-02, name: 独立和・畳み込み・Fourier積 }
  - { id: FOU5-LEM-01, name: 1のN乗根の直交性 }
  - { id: FOU5-THM-01, name: 離散Fourier反転公式 }
  - { id: FOU5-THM-02, name: 離散Parseval等式 }
  - { id: FOU5-THM-03, name: 巡回畳み込み定理 }
