official_scope: []
learning_objectives:
  - 常微分方程式・初期値問題・境界値問題を区別できる
  - 変数分離形と一階線形常微分方程式を解ける
  - 二階定係数線形常微分方程式を特性方程式から解ける
  - 線形常微分方程式の重ね合わせ原理を説明できる
  - 連立線形系 x'=Ax の解を行列指数 exp(tA) で表せる
  - 対角化可能な場合の exp(tA) と固有値による安定性を説明できる
  - Fourier変換後の偏微分方程式が常微分方程式へ落ちる理由を理解できる
