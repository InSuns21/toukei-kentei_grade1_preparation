chapter: F0-00C1
scope: dream-theater
coverage: complete
prerequisites:
  - F0-00C

concepts:
  - id: topology.open-cover
    name: 開被覆
    kind: definition
    aliases: [開被覆]
    requires:
      - topology.open-set

  - id: topology.compact-set
    name: コンパクト集合
    kind: definition
    aliases: [コンパクト集合]
    requires:
      - topology.open-cover

  - id: topology.sequentially-compact
    name: 点列コンパクト性
    kind: definition
    aliases: [点列コンパクト, 点列コンパクト性]
    requires:
      - topology.sequence-convergence

  - id: topology.compact-sequential-equivalence-metric
    name: 距離空間におけるコンパクト性と点列コンパクト性
    kind: theorem
    aliases: [距離空間におけるコンパクト性と点列コンパクト性, コンパクト性と点列コンパクト性]
    requires:
      - topology.compact-set
      - topology.sequentially-compact

  - id: topology.totally-bounded
    name: 全有界性
    kind: definition
    aliases: [全有界性]
    requires:
      - topology.metric-space

  - id: topology.lebesgue-number
    name: Lebesgue数
    kind: definition
    aliases: [Lebesgue数]
    requires:
      - topology.open-cover
      - topology.open-ball

  - id: topology.bolzano-weierstrass-real
    name: 実数列のBolzano–Weierstrass
    kind: lemma
    aliases: [実数列のBolzano–Weierstrass, 実数列のBolzano--Weierstrass]
    requires:
      - topology.bounded-set

  - id: topology.bolzano-weierstrass-rp
    name: R^pのBolzano–Weierstrass
    kind: lemma
    aliases: ["$\\mathbb R^p$ のBolzano–Weierstrass", R^pのBolzano–Weierstrass]
    requires:
      - topology.bolzano-weierstrass-real

  - id: topology.heine-borel
    name: Heine–Borel
    kind: theorem
    aliases: [Heine–Borel, Heine--Borel]
    requires:
      - topology.compact-sequential-equivalence-metric
      - topology.bolzano-weierstrass-rp
      - topology.closed-set
      - topology.bounded-set

  - id: topology.continuous-image-compact
    name: コンパクト集合の連続像
    kind: theorem
    aliases: [コンパクト集合の連続像, コンパクト集合の連続像はコンパクト]
    requires:
      - topology.continuous-map
      - topology.compact-set
