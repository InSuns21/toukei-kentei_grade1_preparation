id: "GPDE2"
title: "Encore III Graduate PDE II：distribution 微分・mollifier・弱微分"
volume: "foundations"
status: supplementary
prerequisites:
  - GPDE1
official_scope: []
learning_objectives:
  - 多重指数を使って高階偏微分を表し、distribution微分を部分積分の双対化として定義できる
  - distribution微分が常にdistributionであり、高階微分とdistribution収束が安定に交換することを証明できる
  - 滑らかな関数ではdistribution微分が古典微分と一致することを証明できる
  - Heavisideや区分的C1関数のjumpからDirac delta項が生じることを直接計算できる
  - weak derivativeをdistribution微分が正則distributionで表せる場合として定義し、cuspとjumpの違いを説明できる
  - mollifierの尺度変換・台・全質量を確認し、局所mollificationがC∞になることを証明できる
  - L1平行移動連続性からmollifierの局所L1近似を証明できる
  - 正則distribution埋め込みの単射性とweak derivativeのa.e.一意性をmollifierで証明できる
  - weak derivativeとmollificationの交換をテスト関数の適用条件まで確認して証明できる
