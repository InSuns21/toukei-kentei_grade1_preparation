  - { id: GPDE2-PROP-02, name: 古典微分との整合性 }
  - { id: GPDE2-PROP-03, name: 超関数微分作用素の連続性 }
  - { id: GPDE2-PROP-04, name: Heaviside の超関数微分 }
  - { id: GPDE2-PROP-05, name: 有限個の跳躍を持つ関数の超関数微分 }
  - { id: GPDE2-THM-01, name: 局所平滑化の滑らかさ }
  - { id: GPDE2-LEM-01, name: 多次元の平行移動補題 }
  - { id: GPDE2-THM-02, name: 平滑化核の局所 L1 近似 }
  - { id: GPDE2-PROP-06, name: 正則超関数埋め込みの単射性 }
  - { id: GPDE2-PROP-07, name: 弱微分の一意性 }
  - { id: GPDE2-THM-03, name: 弱微分と平滑化の交換 }
