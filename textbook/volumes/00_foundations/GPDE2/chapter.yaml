id: "GPDE2"
title: "超関数の微分・平滑化核・弱微分"
volume: "foundations"
status: supplementary
prerequisites:
  - GPDE1
  - MT7
official_scope: []
learning_objectives:
  - 多重指数を使って高階偏微分を表し、超関数の微分を部分積分の双対化として定義できる
  - 超関数の微分が常に超関数であり、高階微分と超関数収束が安定に交換することを証明できる
  - 滑らかな関数では超関数の微分が古典微分と一致することを、各一階微分の適用条件まで追って証明できる
  - Heaviside 関数や区分的 C1 関数の跳躍から Dirac のデルタ超関数項が生じることを直接計算できる
  - 弱微分を超関数の微分が正則超関数で表せる場合として定義し、尖点と跳躍の違いを説明できる
  - 平滑化核の尺度変換・台・全質量を確認し、局所平滑化が C∞ 級になることを証明できる
  - L1 平行移動連続性から平滑化核の局所 L1 近似を証明できる
  - 正則超関数埋め込みの単射性と弱微分の a.e. 一意性を平滑化核で証明できる
  - 弱微分と平滑化の交換を、テスト関数の適用条件まで確認して証明できる
definitions:
