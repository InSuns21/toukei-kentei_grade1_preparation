chapter: GPDE2
scope: dream-theater
coverage: complete
prerequisites:
  - GPDE1
  - MT7

concepts:
  - id: distribution.multi-index
    name: 多重指数
    kind: definition
    aliases: [multi-index, 多重指標]
    introduction: formal
    introduction_aliases: ["定義（多重指数）"]

  - id: distribution.distributional-derivative
    name: 超関数の微分
    kind: definition
    aliases: [distributional derivative, distribution derivative, 超関数微分]
    introduction: formal
    introduction_aliases: ["定義（超関数の微分）"]
    requires:
      - distribution.schwartz-distribution
      - distribution.test-function
      - distribution.multi-index

  - id: distribution.derivative-stability
    name: 超関数微分の安定性
    kind: proposition
    aliases: [distribution derivative stability]
    introduction: formal
    introduction_aliases: ["命題（超関数は何回微分しても超関数である）"]
    requires:
      - distribution.distributional-derivative
      - distribution.local-finite-order-estimate

  - id: distribution.classical-derivative-compatibility
    name: 古典微分との整合性
    kind: proposition
    aliases: [classical derivative compatibility]
    introduction: formal
    introduction_aliases: ["命題（古典微分との整合性）"]
    requires:
      - distribution.distributional-derivative
      - distribution.regular-distribution

  - id: distribution.derivative-continuity
    name: 超関数微分作用素の連続性
    kind: proposition
    aliases: [continuity of distributional differentiation]
    introduction: formal
    introduction_aliases: ["命題（超関数微分作用素の連続性）"]
    requires:
      - distribution.distributional-derivative
      - distribution.distributional-convergence

  - id: distribution.heaviside-derivative
    name: Heaviside の超関数微分
    kind: proposition
    aliases: [Heaviside derivative, H'=delta]
    introduction: formal
    introduction_aliases: ["命題（Heaviside の超関数微分）"]
    requires:
      - distribution.distributional-derivative
      - distribution.dirac-delta
      - distribution.regular-distribution

  - id: distribution.jump-derivative
    name: 跳躍を持つ関数の超関数微分
    kind: proposition
    aliases: [jump formula, jump derivative]
    introduction: formal
    introduction_aliases: ["命題（有限個の跳躍を持つ関数の超関数微分）"]
    requires:
      - distribution.distributional-derivative
      - distribution.dirac-delta
      - distribution.regular-distribution

  - id: distribution.weak-derivative
    name: 弱微分
    kind: definition
    aliases: [weak derivative]
    introduction: formal
    introduction_aliases: ["定義（弱微分）"]
    requires:
      - distribution.distributional-derivative
      - distribution.regular-distribution

  - id: distribution.mollifier
    name: 平滑化核
    kind: definition
    aliases: [mollifier, 軟化子, Friedrichs mollifier]
    introduction: formal
    introduction_aliases: ["定義（平滑化核）"]
    requires:
      - distribution.test-function

  - id: distribution.local-mollification
    name: 局所平滑化
    kind: definition
    aliases: [local mollification, convolution smoothing]
    introduction: formal
    introduction_aliases: ["定義（局所平滑化）"]
    requires:
      - distribution.mollifier
      - distribution.regular-distribution

  - id: distribution.mollification-smoothing
    name: 局所平滑化の滑らかさ
    kind: theorem
    aliases: [mollifier smoothing, smoothing by convolution]
    introduction: formal
    introduction_aliases: ["定理（局所平滑化の滑らかさ）"]
    requires:
      - distribution.local-mollification

  - id: analysis.l1-translation-continuity-rd
    name: $\mathbb R^d$ の平行移動補題
    kind: lemma
    aliases: [Rd translation lemma]
    introduction: formal
    introduction_aliases: ["補題（$\mathbb R^d$ の平行移動補題）"]
    requires:
      - measure.cc-dense-in-lp

  - id: distribution.mollifier-l1loc-approximation
    name: 平滑化核の局所 $L^1$ 近似
    kind: theorem
    aliases: [local L1 mollifier approximation, approximate identity in L1loc]
    introduction: formal
    introduction_aliases: ["定理（平滑化核の局所 $L^1$ 近似）"]
    requires:
      - distribution.local-mollification
      - analysis.l1-translation-continuity-rd

  - id: distribution.regular-embedding-injective
    name: 正則超関数埋め込みの単射性
    kind: proposition
    aliases: [regular distribution embedding injectivity]
    introduction: formal
    introduction_aliases: ["命題（正則超関数埋め込みの単射性）"]
    requires:
      - distribution.regular-distribution
      - distribution.mollifier-l1loc-approximation

  - id: distribution.weak-derivative-uniqueness
    name: 弱微分の一意性
    kind: proposition
    aliases: [weak derivative uniqueness]
    introduction: formal
    introduction_aliases: ["命題（弱微分の一意性）"]
    requires:
      - distribution.weak-derivative
      - distribution.regular-embedding-injective

  - id: distribution.weak-derivative-mollifier-commutation
    name: 弱微分と平滑化の交換
    kind: theorem
    aliases: [weak derivative mollifier commutation, derivative commutes with mollification]
    introduction: formal
    introduction_aliases: ["定理（弱微分と平滑化の交換）"]
    requires:
      - distribution.weak-derivative
      - distribution.mollification-smoothing
      - distribution.local-mollification
