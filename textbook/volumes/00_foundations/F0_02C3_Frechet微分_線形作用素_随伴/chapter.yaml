id: "F0-02C3"
title: "関数解析III：Fréchet微分・線形作用素・随伴"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-02C2
official_scope: []
learning_objectives:
  - 方向微分・Gateaux微分・Frechet微分の違いを説明できる
  - Frechet微分が双対空間または有界線形作用素として現れることを説明できる
  - 有界線形作用素と作用素ノルムを定義できる
  - 連鎖律を作用素の合成として読める
  - Banach空間での随伴作用素を定義し、有限次元の転置行列と対応付けられる
  - Hilbert空間でRiesz表現を介して随伴をベクトル間作用素として表せる
