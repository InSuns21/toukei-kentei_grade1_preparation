id: "F0-02C3"
title: "関数解析III：Banach空間のFréchet微分・有界線形作用素・連鎖律"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-02C1
  - F0-02C2
  - RA6
official_scope: []
learning_objectives:
  - 有界線形作用素の有界性と連続性の同値を証明できる
  - 作用素ノルムを定義し基本評価を使える
  - Fréchet微分を有界線形作用素による一次近似として定義できる
  - Fréchet微分の一意性と微分可能性からの連続性を証明できる
  - 方向微分・Gâteaux微分・Fréchet微分を区別できる
  - Gâteaux微分可能性だけではFréchet微分可能性に足りない反例を説明できる
  - Hilbert空間でRiesz表現により微分を勾配として表せる
  - Fréchet連鎖律を残差評価から証明できる
