id: "AMECH6"
title: "Poisson 括弧と Hamiltonian flow"
volume: "foundations"
status: supplementary
prerequisites:
  - AMECH5
official_scope: []
learning_objectives:
  - 正準座標上の Poisson 括弧を定義し、基本関係 {q_i,q_j}=0, {p_i,p_j}=0, {q_i,p_j}=delta_ij を直接計算できる
  - Poisson 括弧の双線形性・反対称性・Leibniz 則・Jacobi 恒等式を座標表示から説明できる
  - Hamilton 方程式と連鎖律から df/dt={f,H}+partial f/partial t を導き、保存量の判定に使える
  - 自律 Hamilton 系で Poisson 可換な量が保存されること、および保存量同士の Poisson 括弧も保存量になることを Jacobi 恒等式から示せる
  - 三次元の角運動量 ell=r cross p について {ell_i,ell_j}=epsilon_ijk ell_k を具体成分から確認できる
  - Hamiltonian vector field X_H=(partial H/partial p,-partial H/partial q) を定義し、Hamilton 方程式を位相空間上のベクトル場として読める
  - Hamiltonian flow Phi_t を局所解の写像として定義し、自律系で Phi_0=id と Phi_{t+s}=Phi_t circ Phi_s が成り立つ理由を説明できる
  - Hamiltonian vector field の発散が 0 であることから、Liouville の定理として Hamiltonian flow が局所的に位相体積を保存することを導ける
  - Poisson 括弧と量子力学の交換子の対応は構造上の類似であり、同一の演算ではないことを説明できる
