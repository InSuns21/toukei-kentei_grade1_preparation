canonical_examples:
  - "delta_1=4/5, delta_2=1/2 で、プレイヤー1が最初の提案者なら配分が (5/6,1/6) となり、プレイヤー2の拒否後価値が1/6と一致する例"
  - "共通割引因子 delta=3/4、決裂確率 q=1/3 で有効割引因子が1/2となり、提案者取り分が2/3となる例"
  - "共通割引因子3/4で、プレイヤー2の外部選択肢2/5は基準継続価値3/7を下回って効かず、1/2なら拘束して初回配分を (1/2,1/2) へ変える例"
  - "決裂時利得は q d_i+(1-q)delta_i V_i に入り、外部選択肢は max{b_i, continuation value} に入るという役割の違い"
