id: "GAME-C5"
title: "交渉力の比較静学・外部選択肢・決裂リスク"
volume: "foundations"
status: supplementary
prerequisites:
  - GAME-C4
official_scope: []
learning_objectives:
  - 異質な割引因子 delta_1, delta_2 を持つ交互提案交渉ゲームを定義し、各応答者の継続価値から二本の受諾境界を立てられる
  - 異質な割引因子の定常部分ゲーム完全均衡を構成し、初回提案者の取り分 (1-delta_2)/(1-delta_1 delta_2) を導出できる
  - 自分と相手の割引因子に関する比較静学を偏微分で行い、忍耐強さが拒否後継続価値を通じて配分へ効くことを説明できる
  - 同一プレイヤーの先手時と後手時の利得差を導き、先手優位が1期の待機費用から生じることを説明できる
  - 拒否後の外生的決裂リスクを定義し、決裂時利得が0なら beta_i=(1-q)delta_i という有効割引因子へまとめられることを示せる
  - 対称な割引因子の下で、決裂確率が現在の提案者取り分へ与える影響を計算できる
  - 片側外部選択肢を持つ交渉ゲームで受諾境界を max{outside option, continuation value} として定式化できる
  - 外部選択肢原理を場合分けから導き、外部選択肢が既存の継続価値を上回るときだけ均衡配分を変えることを説明できる
  - 決裂時利得と外部選択肢を、期待継続価値と選択可能な退出行動の違いとして区別できる
