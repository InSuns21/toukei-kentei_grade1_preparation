  - { id: MECH1-PROP-02, name: "等速円運動の速度と加速度" }
  - { id: MECH1-PROP-03, name: "Galilei 変換における速度・加速度" }
canonical_examples:
  - "多項式軌道から位置・速度・加速度を順に計算する例"
  - "等速円運動で速さ一定でも中心向き加速度が生じる例"
  - "等速列車内の静止物体を地上系と列車系で記述する例"
  - "三つの離散位置測定を二次関数で補間し、モデル仮定と派生量を区別する例"
