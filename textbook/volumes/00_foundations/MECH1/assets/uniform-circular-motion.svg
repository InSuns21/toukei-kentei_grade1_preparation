<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">等速円運動の速度と向心加速度</title>
  <desc id="desc">円周上の点 P で、緑の位置ベクトル r は中心 O から P へ、青の速度 v は接線方向へ、朱色の加速度 a は中心 O 方向へ向く。色に加えて各ベクトルを文字で表示する。</desc>
  <rect width="760" height="430" fill="white"/>
  <defs>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#009E73"/></marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0072B2"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#D55E00"/></marker>
  </defs>
  <circle cx="300" cy="225" r="145" fill="none" stroke="#374151" stroke-width="3"/>
  <circle cx="300" cy="225" r="7" fill="#1F2937"/>
  <circle cx="412" cy="133" r="8" fill="#1F2937"/>
  <line x1="305" y1="221" x2="404" y2="140" stroke="#009E73" stroke-width="4" fill="none" marker-end="url(#arrow-green)"/>
  <line x1="417" y1="128" x2="528" y2="260" stroke="#0072B2" stroke-width="4" fill="none" marker-end="url(#arrow-blue)"/>
  <line x1="407" y1="140" x2="307" y2="219" stroke="#D55E00" stroke-width="4" fill="none" marker-end="url(#arrow-orange)"/>
  <g font-family="sans-serif" font-size="24" fill="#1F2937">
    <text x="277" y="260">O</text><text x="430" y="127">P</text>
    <text x="350" y="165" fill="#009E73" font-weight="700">r</text>
    <text x="520" y="246" fill="#0072B2" font-weight="700">v</text>
    <text x="354" y="202" fill="#D55E00" font-weight="700">a</text>
    <text x="84" y="405">v は接線方向、a は中心 O 方向</text>
  </g>
</svg>
