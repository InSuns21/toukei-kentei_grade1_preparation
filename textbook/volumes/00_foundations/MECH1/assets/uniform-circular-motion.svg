<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" data-layout-lint="strict" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">等速円運動の位置・速度・向心加速度</title>
  <desc id="desc">同じ円周上の点 P を二つの図で示す。左では位置ベクトル r が中心 O から P へ、速度 v が P から接線方向へ向く。右では半径方向を破線で示し、加速度 a が P から中心 O へ向く。</desc>
  <rect width="920" height="430" fill="white"/>
  <defs>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#009E73"/></marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0072B2"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#D55E00"/></marker>
  </defs>

  <g font-family="Noto Sans CJK JP, sans-serif" fill="#1F2937">
    <text x="205" y="38" font-size="22" font-weight="700">位置と速度</text>
    <text x="625" y="38" font-size="22" font-weight="700">向心加速度</text>
  </g>

  <circle cx="245" cy="210" r="125" fill="none" stroke="#4B5563" stroke-width="3"/>
  <circle cx="245" cy="210" r="6" fill="#1F2937"/>
  <circle cx="343" cy="132" r="7" fill="#1F2937"/>
  <line x1="245" y1="210" x2="343" y2="132" stroke="#009E73" stroke-width="4" marker-end="url(#arrow-green)"/>
  <line x1="343" y1="132" x2="438" y2="240" stroke="#0072B2" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <g font-family="Noto Sans CJK JP, sans-serif" font-size="23" fill="#1F2937">
    <text x="225" y="244">O</text>
    <text x="370" y="102">P</text>
  </g>

  <circle cx="665" cy="210" r="125" fill="none" stroke="#4B5563" stroke-width="3"/>
  <circle cx="665" cy="210" r="6" fill="#1F2937"/>
  <circle cx="763" cy="132" r="7" fill="#1F2937"/>
  <line x1="665" y1="210" x2="763" y2="132" stroke="#9CA3AF" stroke-width="3" stroke-dasharray="9 7"/>
  <line x1="763" y1="132" x2="687" y2="193" stroke="#D55E00" stroke-width="5" marker-end="url(#arrow-orange)"/>
  <g font-family="Noto Sans CJK JP, sans-serif" font-size="23" fill="#1F2937">
    <text x="645" y="244">O</text>
    <text x="790" y="102">P</text>
  </g>

  <g font-family="Noto Sans CJK JP, sans-serif" font-size="20" font-weight="700">
    <text x="95" y="366" fill="#009E73">r：O から P への位置ベクトル</text>
    <text x="95" y="394" fill="#0072B2">v：P から接線方向</text>
    <text x="545" y="380" fill="#D55E00">a：P から中心 O 方向</text>
  </g>
</svg>
