<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" data-layout-lint="strict" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Galilei 変換で結ばれた二つの基準系</title>
  <desc id="desc">同じ向きの x 軸を共有する基準系 S と S' を示す。原点 O と O' は水平軸上にあり、y 軸と y' 軸は平行である。質点 P への位置ベクトル r は O から、r' は O' から P へ向く。O' は S に対して右向き速度 U で移動する。</desc>
  <rect width="920" height="430" fill="white"/>
  <defs>
    <marker id="arrow-neutral" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8E5FB2"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#009E73"/></marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0072B2"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#D55E00"/></marker>
  </defs>

  <line x1="115" y1="310" x2="835" y2="310" stroke="#374151" stroke-width="3" marker-end="url(#arrow-neutral)"/>
  <line x1="140" y1="310" x2="140" y2="75" stroke="#374151" stroke-width="3" marker-end="url(#arrow-neutral)"/>
  <line x1="410" y1="310" x2="410" y2="95" stroke="#8E5FB2" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#arrow-purple)"/>

  <circle cx="140" cy="310" r="5" fill="#1F2937"/>
  <circle cx="410" cy="310" r="5" fill="#8E5FB2"/>
  <circle cx="735" cy="115" r="8" fill="#1F2937"/>

  <line x1="140" y1="310" x2="735" y2="115" stroke="#009E73" stroke-width="4" marker-end="url(#arrow-green)"/>
  <line x1="410" y1="310" x2="735" y2="115" stroke="#0072B2" stroke-width="4" marker-end="url(#arrow-blue)"/>

  <line x1="300" y1="365" x2="420" y2="365" stroke="#D55E00" stroke-width="4" marker-end="url(#arrow-orange)"/>

  <g font-family="Noto Sans CJK JP, sans-serif" font-size="22" fill="#1F2937">
    <text x="855" y="318">x, x'</text>
    <text x="92" y="52">y</text>
    <text x="365" y="70" fill="#8E5FB2">y'</text>
    <text x="118" y="342">O</text>
    <text x="391" y="342" fill="#8E5FB2">O'</text>
    <text x="106" y="290">S</text>
    <text x="435" y="120" fill="#8E5FB2">S'</text>
    <text x="755" y="110">P</text>
    <text x="500" y="52" fill="#009E73" font-weight="700">r(t)：O → P</text>
    <text x="655" y="52" fill="#0072B2" font-weight="700">r'(t)：O' → P</text>
    <text x="342" y="330" fill="#D55E00" font-weight="700">U</text>
    <text x="455" y="374" font-size="19">O' は S に対して右向き速度 U で移動</text>
  </g>
</svg>
