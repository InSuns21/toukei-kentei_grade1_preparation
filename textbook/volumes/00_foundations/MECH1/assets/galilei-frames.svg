<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" data-layout-lint="strict" viewBox="0 0 920 400" role="img" aria-labelledby="title desc">
  <title id="title">Galilei 変換で結ばれた二つの基準系</title>
  <desc id="desc">同じ向きの x 軸を共有する基準系 S と S' を示す。原点 O と O' は水平軸上にあり、y 軸と y' 軸は平行である。質点 P への位置ベクトル r は O から、r' は O' から P へ向く。O' は S に対して右向き速度 U で移動する。</desc>
  <rect width="920" height="400" fill="white"/>
  <defs>
    <marker id="arrow-neutral" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8E5FB2"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#009E73"/></marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0072B2"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#D55E00"/></marker>
  </defs>

  <line x1="115" y1="300" x2="835" y2="300" stroke="#374151" stroke-width="3" marker-end="url(#arrow-neutral)"/>
  <line x1="140" y1="300" x2="140" y2="70" stroke="#374151" stroke-width="3" marker-end="url(#arrow-neutral)"/>
  <line x1="410" y1="300" x2="410" y2="90" stroke="#8E5FB2" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#arrow-purple)"/>

  <circle cx="140" cy="300" r="5" fill="#1F2937"/>
  <circle cx="410" cy="300" r="5" fill="#8E5FB2"/>
  <circle cx="735" cy="105" r="8" fill="#1F2937"/>

  <line data-series-group="position-vectors" data-series-label="r" x1="140" y1="300" x2="735" y2="105" stroke="#009E73" stroke-width="4" marker-end="url(#arrow-green)"/>
  <line data-series-group="position-vectors" data-series-label="r-prime" x1="410" y1="300" x2="735" y2="105" stroke="#0072B2" stroke-width="4" stroke-dasharray="12 7" marker-end="url(#arrow-blue)"/>
  <line data-series-group="frame-speed" data-series-label="U" x1="300" y1="350" x2="420" y2="350" stroke="#D55E00" stroke-width="4" stroke-dasharray="12 5 3 5" marker-end="url(#arrow-orange)"/>

  <g font-family="Noto Sans CJK JP, sans-serif" font-size="22" fill="#1F2937">
    <text x="855" y="308">x, x'</text>
    <text x="92" y="48">y</text>
    <text x="365" y="64" fill="#8E5FB2">y'</text>
    <text x="118" y="332">O</text>
    <text x="391" y="332" fill="#8E5FB2">O'</text>
    <text x="106" y="280">S</text>
    <text x="435" y="118" fill="#8E5FB2">S'</text>
    <text x="755" y="100">P</text>
    <text x="300" y="155" fill="#009E73" font-weight="700">r</text>
    <text x="600" y="255" fill="#0072B2" font-weight="700">r'</text>
    <text x="345" y="382" fill="#D55E00" font-weight="700">U</text>
  </g>
</svg>
