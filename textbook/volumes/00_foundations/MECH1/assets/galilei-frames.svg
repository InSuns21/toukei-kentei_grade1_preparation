<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
  <title id="title">Galilei 変換で結ばれた二つの基準系</title>
  <desc id="desc">基準系 S の原点 O と、一定速度 U で右へ動く基準系 S' の原点 O'、同じ質点 P の位置ベクトル r と r' を示す。</desc>
  <rect width="900" height="390" fill="white"/>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111"/></marker></defs>
  <g stroke="#111" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <line x1="95" y1="305" x2="805" y2="305"/><line x1="95" y1="305" x2="95" y2="70"/>
    <line x1="365" y1="305" x2="735" y2="305"/><line x1="365" y1="305" x2="365" y2="115"/>
    <line x1="101" y1="299" x2="650" y2="130"/><line x1="371" y1="299" x2="650" y2="130"/>
    <line x1="200" y1="258" x2="330" y2="258"/>
  </g>
  <circle cx="660" cy="125" r="9" fill="#111"/>
  <g font-family="sans-serif" font-size="23" fill="#111">
    <text x="815" y="321">x</text><text x="76" y="62">y</text><text x="78" y="340">O</text>
    <text x="349" y="340">O'</text><text x="738" y="321">x'</text><text x="337" y="108">y'</text>
    <text x="680" y="120">P</text><text x="384" y="182">r(t)</text><text x="520" y="208">r'(t)</text><text x="248" y="244">U</text>
    <text x="165" y="375">O' は S に対して一定速度 U で移動</text>
  </g>
</svg>