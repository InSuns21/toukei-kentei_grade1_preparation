<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
  <title id="title">Galilei 変換で結ばれた二つの基準系</title>
  <desc id="desc">静止側の基準系 S を濃灰、一定速度 U で右へ動く基準系 S' を紫で示す。質点 P への位置ベクトル r は緑、r' は青、基準系の相対速度 U は朱色で示し、文字と線種でも区別する。</desc>
  <rect width="900" height="390" fill="white"/>
  <defs>
    <marker id="arrow-neutral" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#374151"/></marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8E5FB2"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#009E73"/></marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0072B2"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#D55E00"/></marker>
  </defs>
  <g stroke="#374151" stroke-width="3" fill="none" marker-end="url(#arrow-neutral)">
    <line x1="95" y1="305" x2="805" y2="305"/><line x1="95" y1="305" x2="95" y2="70"/>
  </g>
  <g stroke="#8E5FB2" stroke-width="3" fill="none" stroke-dasharray="10 6" marker-end="url(#arrow-purple)">
    <line x1="365" y1="305" x2="735" y2="305"/><line x1="365" y1="305" x2="365" y2="115"/>
  </g>
  <line x1="101" y1="299" x2="650" y2="130" stroke="#009E73" stroke-width="4" fill="none" marker-end="url(#arrow-green)"/>
  <line x1="371" y1="299" x2="650" y2="130" stroke="#0072B2" stroke-width="4" fill="none" marker-end="url(#arrow-blue)"/>
  <line x1="365" y1="340" x2="500" y2="340" stroke="#D55E00" stroke-width="4" fill="none" marker-end="url(#arrow-orange)"/>
  <circle cx="660" cy="125" r="9" fill="#1F2937"/>
  <g font-family="sans-serif" font-size="23" fill="#1F2937">
    <text x="815" y="321">x</text><text x="76" y="62">y</text><text x="78" y="340">O</text><text x="112" y="284">S</text>
    <text x="349" y="340" fill="#8E5FB2">O'</text><text x="738" y="321" fill="#8E5FB2">x'</text><text x="337" y="108" fill="#8E5FB2">y'</text><text x="382" y="292" fill="#8E5FB2">S'</text>
    <text x="680" y="120">P</text>
    <text x="384" y="182" fill="#009E73" font-weight="700">r(t)</text>
    <text x="520" y="208" fill="#0072B2" font-weight="700">r'(t)</text>
    <text x="422" y="332" fill="#D55E00" font-weight="700">U</text>
    <text x="165" y="380">O' は S に対して一定速度 U で移動</text>
  </g>
</svg>
