  - F0-00F
official_scope: []
learning_objectives:
  - 線形形式をベクトルをスカラーで測る写像として説明できる
  - 双対基底を構成し座標読み取りとの関係を説明できる
  - annihilator を部分空間の方程式側の記述として扱える
  - 商空間の双対と annihilator の同型を well-defined 性から示せる
  - 双対写像と有限次元二重双対同型を説明できる
