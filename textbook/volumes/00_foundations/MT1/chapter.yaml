id: "MT1"
title: "標準測度論 II：関数列の収束様式・Egorov・Lusin"
volume: "foundations"
status: supplementary
prerequisites:
  - RA5
  - F0-00D2
  - F0-00D2A
  - F0-00D2B
  - MT0
official_scope: []
learning_objectives:
  - 各点収束・a.e.収束・測度収束・Lp収束を量化と例外集合の違いから区別できる
  - 有限測度版の測度の上からの連続性を下からの連続性から導出できる
  - Lp収束から測度収束、測度収束からa.e.収束部分列への含意を、必要な仮定を過不足なく付けて証明できる
  - Egorovの定理で有限測度性が使われる箇所を明示して証明できる
  - Lusinの定理を、大値部分の切断・有限単関数一様近似・Lebesgue測度の内正則性から構成できる
  - 成立しない逆向きを反例と証明機構の欠落の両方で説明できる
