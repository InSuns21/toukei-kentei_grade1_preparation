  - { id: MT1-THM-01, name: Lp収束なら測度収束 }
  - { id: MT1-THM-02, name: 有限測度空間でa.e.収束なら測度収束 }
  - { id: MT1-THM-03, name: 測度収束からa.e.収束部分列 }
  - { id: MT1-THM-04, name: Egorovの定理 }
  - { id: MT1-THM-05, name: Lusinの定理 }
canonical_examples: [移動する指示関数, dyadic typewriter, 高さが発散するLp反例, Dirichlet関数のLusin適用]
