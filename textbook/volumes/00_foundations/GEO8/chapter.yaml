id: "GEO8"
title: "幾何学 VIII：向き・多様体上の積分・一般 Stokes の定理"
volume: "foundations"
status: supplementary
prerequisites:
  - GEO4
  - GEO7
  - RA7
  - VC5
official_scope: []
learning_objectives:
  - ベクトル空間と滑らかな多様体の向きを定義し、座標変換のJacobi行列式の符号で判定できる
  - 向き付け可能性と消えない最高次微分形式の存在が同値であることを1の分割を使って証明できる
  - 境界付き滑らかな多様体を半空間モデルで定義し、境界点が座標に依らないことを説明できる
  - 内部の向きから外向き先頭規約で境界向きを定め、区間・円板・円環で符号を判定できる
  - コンパクト台を持つ最高次形式の局所積分を定義し、多変数変数変換定理から座標不変性を証明できる
  - 1の分割を用いて多様体上の最高次形式の大域積分を定義し、選択に依らないことを証明できる
  - 半空間上の局所Stokesを一変数微積分学の基本定理から証明できる
  - 一般Stokesの定理を1の分割で局所化して証明し、各仮定の役割を説明できる
  - 微積分学の基本定理・Greenの定理・Kelvin--Stokesの定理・Gauss--Ostrogradskyの発散定理を一般Stokesの特殊例として回収できる
