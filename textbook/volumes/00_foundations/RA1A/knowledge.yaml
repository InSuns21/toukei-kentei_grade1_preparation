chapter: RA1A
scope: dream-theater
coverage: complete
prerequisites:
  - RA1

forward_references:
  - analysis.improper-riemann-integral
  - analysis.uniform-convergence
  - analysis.uniform-continuity

concepts:
  - id: analysis.series-term-necessary-condition
