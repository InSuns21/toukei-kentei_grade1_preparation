  - id: analysis.nonnegative-series
    name: 非負項級数
    kind: definition
    aliases: [非負項級数]
    requires: [analysis.series]
  - id: analysis.nonnegative-series-bounded-partial-sums
    name: 非負項級数の部分和有界性判定
    kind: theorem
    aliases: [非負項級数の部分和有界性判定]
