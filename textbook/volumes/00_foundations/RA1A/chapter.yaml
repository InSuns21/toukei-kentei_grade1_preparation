id: "RA1A"
title: "標準実解析 I-A：数値級数の収束論"
volume: "foundations"
status: supplementary
prerequisites:
  - RA1
official_scope: []
learning_objectives:
  - 級数の一般項が0へ行くことが必要条件にすぎない理由を説明できる
  - 非負項級数を部分和の単調性と有界性で判定できる
  - 比較判定・極限比較判定・比判定・根判定を仮定込みで証明して使い分けられる
  - Cauchy凝縮判定からp級数と対数補正級数の収束域を導ける
  - Leibnizの交代級数判定と剰余評価を証明できる
  - Abelの部分和変換を導き、Dirichlet判定・Abel判定を証明できる
  - 絶対収束と条件収束の差を再配列の挙動から説明できる
  - 各判定法が境界例で何を決められないかを反例で説明できる
definitions:
  - { id: RA1A-DEF-01, name: 非負項級数 }
  - { id: RA1A-DEF-02, name: 交代級数 }
  - { id: RA1A-DEF-03, name: 級数の再配列 }
