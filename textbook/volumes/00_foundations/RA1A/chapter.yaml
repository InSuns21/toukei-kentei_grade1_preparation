  - { id: RA1A-THM-06, name: 級数の根判定 }
  - { id: RA1A-THM-07, name: Cauchy凝縮判定 }
  - { id: RA1A-THM-08, name: Leibnizの交代級数判定 }
  - { id: RA1A-THM-09, name: Abelの部分和変換 }
  - { id: RA1A-THM-10, name: 級数のDirichlet判定 }
  - { id: RA1A-THM-11, name: 級数のAbel判定 }
  - { id: RA1A-THM-12, name: Riemann再配列定理（有限値版） }
