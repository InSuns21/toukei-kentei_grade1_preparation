    introduction_aliases: ["### 系（商空間による全射作用素の定量的持ち上げ）"]
    requires:
      - functional.quotient-banach-space
      - functional.bounded-inverse-theorem

  - id: functional.graph-norm
    name: グラフノルム
    kind: definition
    aliases: [グラフノルム, graph norm, "### 定義（グラフノルム）"]
    introduction_aliases: ["### 定義（グラフノルム）"]
    requires:
      - functional.operator-graph
      - functional.norm

  - id: functional.closed-graph-graph-norm-equivalence
    name: 閉グラフとグラフノルムの同値性
    kind: corollary
    aliases: [閉グラフとグラフノルムの同値性, "### 系（閉グラフとグラフノルム）"]
    introduction_aliases: ["### 系（閉グラフとグラフノルム）"]
    requires:
      - functional.closed-graph-theorem
      - functional.graph-norm
