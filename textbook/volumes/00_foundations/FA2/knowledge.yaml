    requires:
      - functional.banach-space
      - functional.bounded-linear-operator

  - id: functional.open-mapping-theorem
    name: 開写像定理
    kind: theorem
    aliases: [開写像定理, open mapping theorem, "### 定理（開写像定理）"]
    introduction_aliases: ["### 定理（開写像定理）"]
    requires:
      - functional.open-map
      - functional.closure-ball-to-image-ball
      - functional.banach-space
      - topology.baire-category-theorem-complete-metric

  - id: functional.bounded-inverse-theorem
    name: 有界逆定理
    kind: theorem
    aliases: [有界逆定理, bounded inverse theorem, inverse mapping theorem, "### 定理（有界逆定理）"]
    introduction_aliases: ["### 定理（有界逆定理）"]
    requires:
      - functional.open-mapping-theorem

  - id: functional.operator-graph
    name: 作用素のグラフ
    kind: definition
    aliases: [作用素のグラフ, graph of an operator, "### 定義（作用素のグラフ）"]
    introduction_aliases: ["### 定義（作用素のグラフ）"]
    requires:
      - linear.linear-map

  - id: functional.closed-graph-theorem
    name: 閉グラフ定理
    kind: theorem
    aliases: [閉グラフ定理, closed graph theorem, "### 定理（閉グラフ定理）"]
    introduction_aliases: ["### 定理（閉グラフ定理）"]
    requires:
      - functional.operator-graph
      - functional.bounded-inverse-theorem
      - functional.banach-space

  - id: functional.surjective-quotient-lifting
    name: 全射作用素の商空間による定量的持ち上げ
    kind: corollary
