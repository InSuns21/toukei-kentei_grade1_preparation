chapter: FA2
scope: dream-theater
coverage: complete
prerequisites:
  - FA1

forward_references: []

concepts:
  - id: functional.open-map
    name: 開写像
    kind: definition
    aliases: [開写像, open map, "### 定義（開写像）"]
    introduction_aliases: ["### 定義（開写像）"]
    requires:
      - topology.open-set

  - id: functional.closure-ball-to-image-ball
    name: 閉包内の球から像内の球への逐次近似
    kind: lemma
    aliases: [閉包内の球から像内の球への逐次近似, "### 補題（閉包内の球を実際の像内の球へ押し上げる）"]
