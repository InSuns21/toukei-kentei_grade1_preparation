id: "MQ3"
title: "量子調和振動子"
volume: "foundations"
status: supplementary
prerequisites:
  - MQ2
  - MQ0
  - MECH5
  - FOU4
official_scope: []
learning_objectives:
  - 古典的調和振動子の Hamiltonian を Schrödinger 作用素として書き、ユニタリ変換と長さ尺度で無次元化できる
  - Schwartz 共通不変領域上で生成・消滅演算子の形式的随伴、交換関係、Hamiltonian の因数分解を計算できる
  - 最低状態の Gaussian を一次微分方程式と規格化積分から導き、零点エネルギーの下界が達成されることを示せる
  - ladder 構成の交換子帰納法、正規化、直交性を証明し Hermite 多項式と明示的に対応付けられる
  - Hermite 関数の完全性を多項式直交性と整関数の Fourier 変換の一意性から証明できる
  - Hermite 基底上の最大対角作用素から自己共役な閉包と作用素定義域を構成し、全スペクトルと本質スペクトルを証明できる
  - 直接 Schrödinger 方程式の係数漸化式、閉形式の定義域、励起状態の時間発展を解析できる
definitions:
  - { id: MQ3-DEF-01, name: "調和振動子のユニタリ無次元化" }
