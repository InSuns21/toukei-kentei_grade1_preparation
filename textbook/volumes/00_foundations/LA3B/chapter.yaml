id: "LA3B"
title: "標準線形代数 III-B：行列式の構成"
volume: "foundations"
status: supplementary
prerequisites:
  - LA3A
  - F0-00F
official_scope: []
learning_objectives:
  - 面積・体積倍率に必要な性質から行列式を動機づけられる
  - 置換の符号と Leibniz 公式から一般の n×n 行列式を構成できる
  - 行列式の交代多重線形性を Leibniz 公式から示せる
  - 行列式が交代多重線形性と正規化で一意に決まることを示せる
  - 転置で行列式が不変であることを示せる
definitions:
  - { id: LA3B-DEF-01, name: 置換の転倒数と符号 }
  - { id: LA3B-DEF-02, name: Leibniz 公式による行列式 }
theorems:
  - { id: LA3B-LEM-01, name: 置換の符号の積 }
  - { id: LA3B-THM-01, name: 行列式の交代多重線形性 }
  - { id: LA3B-THM-02, name: 行列式の特徴付け }
  - { id: LA3B-THM-03, name: 転置で行列式は変わらない }
canonical_examples: [2x2 Leibniz公式, 3x3の置換項, 列交換と符号反転]
