official_scope: []
learning_objectives:
  - NA1–NA12 の主要理論をブラウザ内 Python の数値実験として再現できる
  - 丸め・反復・補間・求積・常微分方程式・線形代数・固有値・PageRank・最適化について理論予測と実測を照合できる
  - 誤差・残差・反復回数・安定性を数値表または図で診断できる
  - 各実験で shape・有限性・数値許容誤差・再現性を自動テストできる
  - 理論章の stable anchor と実験の stable anchor を相互対応表から追跡できる
definitions: []
theorems: []
canonical_examples:
  - NA1 桁落ちと安定な同値式
  - NA2 Newton 法の二次収束
  - NA3 非線形連立方程式の Newton 法
  - NA4 Runge 関数の等間隔節点と Chebyshev 節点
  - NA5 Gauss--Legendre 求積の誤差減衰
  - NA6 Euler 法の一次収束
  - NA7 硬い減衰問題での陽的 Euler 法と後退 Euler 法
  - NA8 Cholesky 分解の再構成誤差
  - NA9 共役勾配法の残差履歴
  - NA10 冪乗法の固有対残差
  - NA11 PageRank の停止誤差評価
  - NA12 実対称正定値二次関数に対する最急降下法と共役勾配法
