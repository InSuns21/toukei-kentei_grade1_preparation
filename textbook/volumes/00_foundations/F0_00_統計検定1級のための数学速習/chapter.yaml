canonical_examples:
  - 極座標変換によるガウス積分
  - 重積分の変数変換によるベータ関数とガンマ関数の関係
  - 和と比の変換におけるヤコビアン
  - 実対称行列の固有値分解と二次形式
  - 多変量ガウス積分
  - Taylor 展開とランダウ記号による n^{-1/2} スケールの漸近展開
  - ガンマ積分の Laplace 法によるスターリング公式の概略導出
  - 多項分布の分散共分散行列に現れる零空間と特異性
  - 正規方程式による最小二乗計算と残差の直交性
  - Cholesky分解の手計算
