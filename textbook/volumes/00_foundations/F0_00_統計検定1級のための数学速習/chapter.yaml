id: "F0-00"
title: "統計検定1級のための数学速習"
volume: "foundations"
status: reviewed
prerequisites: []
official_scope:
  - 変数変換
  - 固有値
  - 固有ベクトル
  - 線形結合
learning_objectives:
  - 一変数・多変数の基本微分公式を使い、テイラー展開と極値判定ができる
  - 部分積分の一般形を導き、部分積分・置換積分・広義積分を使って積分の収束条件を判定できる
  - ガウス積分を極座標とヤコビアンから導出できる
  - ガンマ関数・ベータ関数の定義、漸化式、相互関係を導出して使える
  - 重積分の領域を立式し、一般の変数変換とヤコビアンを計算できる
  - 上界・下界、sup・inf と最大・最小の違いを説明し、統計で現れる最悪値評価を読める
  - テイラー展開とランダウ記号を組み合わせ、n^{-1/2} スケールを含む典型的な漸近展開を処理できる
  - ガンマ積分の Laplace 法からスターリング公式が現れる概略を説明できる
  - 行列式・逆行列・階数・固有値・直交対角化・二次形式・正定値性を扱える
  - 線形包・零空間・特異行列を定義から説明し、階数・退化次数の定理と結び付けて使える
  - 射影行列・シュール補・基本的な行列微分を後続の統計問題で再利用できる
  - 行列積・掃き出し・3次行列の逆行列・固有分解・正規方程式・Cholesky分解と、基本微分・偏微分・積分を紙上で安定して計算できる
