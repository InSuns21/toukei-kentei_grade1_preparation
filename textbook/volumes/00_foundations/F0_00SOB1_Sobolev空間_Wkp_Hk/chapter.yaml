learning_objectives:
  - W^{k,p}を弱微分のLp可積分性で定義できる
  - H^k=W^{k,2}がHilbert空間になる理由を説明できる
  - Sobolevノルムを定義し、関数と弱微分を同時に測る意味を説明できる
  - 一次元でH1関数が通常の関数より多くの構造を持つことを説明できる
  - 古典的Ck空間とSobolev空間の違いを説明できる
  - 完備性が弱解の極限操作に必要な理由を説明できる
