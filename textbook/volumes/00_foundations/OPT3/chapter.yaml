id: "OPT3"
title: "閉真凸関数・劣微分・法錐"
volume: "foundations"
status: supplementary
prerequisites:
  - OPT2
  - F0-00A1
official_scope: []
learning_objectives:
  - 拡張実数値関数の実効定義域・真性・エピグラフを定義し、制約を標示関数で目的関数へ埋め込める
  - 拡張実数値凸関数の凸性とエピグラフの凸性の同値を証明できる
  - 下半連続性と閉エピグラフの同値を証明し、閉真凸関数を幾何学的に説明できる
  - 有限次元の下半連続かつ強圧的な関数が最小値を達成する理由を、劣位集合のコンパクト性から説明できる
  - 劣勾配・劣微分を定義し、絶対値や最大値関数で直接計算できる
  - 凸関数の Fermat 条件を証明し、微分可能な場合の勾配条件との関係を説明できる
  - 有限値凸関数の方向微分を劣微分の支持関数として表す定理を、有限次元の支持超平面から証明できる
  - 有限値凸関数の劣微分和則と有限個の最大値の劣微分公式を導ける
  - 標示関数の劣微分が法錐に一致することを証明できる
  - Bouligand 接錐・極錐・双対錐を定義し、符号規約を具体例で区別できる
  - 凸集合の接錐を閉錐包として表し、法錐と接錐の極双対関係を証明できる
  - 有限値凸関数の凸制約付き最小化を 0∈∂f(x*)+N_C(x*) で特徴付け、その幾何学的意味を説明できる
