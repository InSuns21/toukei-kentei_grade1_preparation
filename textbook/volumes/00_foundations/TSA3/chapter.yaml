id: "TSA3"
title: "Encore IV 時系列解析 III：Herglotz の定理とスペクトル表現"
volume: "foundations"
status: supplementary
prerequisites:
  - TSA1
  - TSA2
  - FOU2
  - RA5
  - F0-00D3A
  - MT5
  - F0-00P2
official_scope: []
learning_objectives:
  - 正定値列を定義し、二次定常過程の自己共分散列が正定値になることを複素係数まで含めて確認できる
  - Herglotz の定理の存在を非負近似測度・可算稠密集合での対角選択・Riesz--Markov 表現から証明できる
  - Herglotz 表現の一意性を三角多項式の一様稠密性から証明できる
  - スペクトル測度を自己共分散列の Fourier 表現として定義し、全質量が分散に一致することを説明できる
  - スペクトル密度を Radon--Nikodym 密度として定義し、自己共分散の絶対可算和可能性から連続な密度を導ける
  - 弱ホワイトノイズの平坦な絶対連続スペクトルとランダム正弦波の線スペクトルを直接導ける
  - 三角多項式から L2(F) と過程の閉線形空間の等長対応を構成できる
  - 直交増分ランダム測度とスペクトル確率積分を構成し、定常過程のスペクトル表現定理を証明できる
