id: "F0-00D2"
title: "補講：測度・可測関数・Lebesgue積分・Lp空間"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00A
  - F0-00B
  - F0-00C
  - F0-00D
official_scope: []
learning_objectives:
  - sigma代数と測度を定義し、長さ・確率を共通の枠組みで説明できる
  - 測度0集合と「ほとんど至るところ」の意味を説明できる
  - 可測関数を逆像によって定義し、指示関数・連続関数の例を扱える
  - 単関数から非負可測関数、一般の可積分関数へLebesgue積分を拡張する流れを説明できる
  - Riemann積分とLebesgue積分の違いをDirichlet関数で説明できる
  - 単調収束定理・Fatouの補題・優収束定理の役割を区別できる
  - Tonelli・Fubiniの定理が重積分と期待値計算を正当化する条件を説明できる
  - Lp空間をa.e.同値類として定義し、L2が内積空間になる理由を説明できる
  - 確率空間上の期待値をLebesgue積分として読める
