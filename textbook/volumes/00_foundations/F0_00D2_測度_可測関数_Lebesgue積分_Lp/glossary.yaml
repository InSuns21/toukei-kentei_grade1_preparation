chapter: "F0-00D2"
terms:
  - term: σ代数
    english: sigma-algebra
    meaning: 全体集合を含み、補集合と可算和について閉じた集合族。何を可測集合と認めるかを指定する。
  - term: 可測空間
    english: measurable space
    meaning: 集合Ωと、その上のσ代数Fの組(Ω,F)。
  - term: 生成σ代数
    english: generated sigma-algebra
    meaning: 与えられた集合族を含む最小のσ代数。
  - term: Borel σ代数
    english: Borel sigma-algebra
    meaning: 位相空間の開集合が生成するσ代数。実数直線では通常B(R)と書く。
  - term: 測度
    english: measure
    meaning: 可測集合へ非負の大きさを割り当て、空集合を0とし、互いに素な可算和に対して可算加法性を満たす写像。
  - term: 測度空間
    english: measure space
    meaning: 可測空間(Ω,F)と、その上の測度μからなる三つ組(Ω,F,μ)。
  - term: 数え上げ測度
    english: counting measure
    meaning: 集合Aの要素数をμ(A)とする測度。無限集合には∞を割り当てる。
  - term: Dirac測度
    english: Dirac measure
    meaning: 固定点x0を含む集合に1、含まない集合に0を割り当てる測度。
  - term: 測度0集合
    english: null set
    meaning: 測度が0である可測集合。空集合とは限らない。
  - term: ほとんど至るところ
    english: almost everywhere
    meaning: 例外が測度0集合にしか存在しないという意味。a.e.と略記する。
  - term: 可測関数
    english: measurable function
    meaning: 値域の可測集合の逆像が定義域で可測になる関数。実数値の場合は半直線の逆像で判定できる。
  - term: 指示関数
    english: indicator function
    meaning: 集合A上で1、外で0を取る関数1_A。Aが可測であることと1_Aが可測であることは同値。
