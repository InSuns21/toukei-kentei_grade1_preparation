id: "PDE2"
title: "標準偏微分方程式 II：二階線形PDEの分類"
volume: "foundations"
status: supplementary
prerequisites:
  - PDE1
official_scope: []
learning_objectives:
  - 二階線形PDEから主部と主係数行列を取り出せる
  - 二変数の判別式B^2-ACから楕円型・放物型・双曲型を分類できる
  - 主二次形式と実特性方向の本数から三分類の意味を説明できる
  - 可逆線形座標変換で型が保存されることを主係数行列から証明できる
  - 定係数主部を平方完成して三つの標準形へ変換できる
  - Laplace・熱・波動方程式を三類型の代表として位置付けられる
  - 変数係数PDEで型が点ごとに変わり得ることを判定できる
  - 型と初期データ・境界データの関係をwell-posednessと区別して説明できる
  - Laplace方程式のCauchy問題が不安定になり得る具体列を検証できる
