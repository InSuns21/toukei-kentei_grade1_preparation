  - { id: PDE2-THM-02, name: 二変数定係数主部の標準形 }
  - { id: PDE2-PROP-02, name: Tricomi型方程式の型変化 }
  - { id: PDE2-PROP-03, name: Laplace方程式のCauchyデータに対する不安定性 }
canonical_examples: [Laplace方程式, 熱方程式, 波動方程式, 混合微分の回転消去, Tricomi型方程式, Laplace方程式のCauchy不安定性]
