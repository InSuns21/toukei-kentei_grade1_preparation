id: "GAME-C7"
title: "不完備情報下の交渉入門"
volume: "foundations"
status: supplementary
prerequisites:
  - GAME-A11
  - GAME-C6
official_scope: []
learning_objectives:
  - 片側私的情報を持つ有限交渉ゲームを、自然によるタイプ選択・提案・受諾拒否・信念・遅延を含む展開形ゲームとして定式化できる
  - 情報を持たない側の提案がスクリーニング手段となり、情報を持つ側の受諾拒否がシグナルとなることを区別して説明できる
  - 拒否という観察から Bayes の公式で事後信念を更新し、その信念を使って次期の最適提示を求められる
  - 二タイプ・二提示の最終期問題で、タイプ別受諾条件からスクリーニング閾値を導出できる
  - 2期交渉モデルを後ろから解き、逐次合理性と Bayes 整合性を確認して Perfect Bayesian Equilibrium を構成できる
  - 事前確率と買い手の割引因子から、初期に低い提示で選別を試みる領域と高い提示で即時合意する領域の境界を導出できる
  - 私的情報があると一部タイプだけ合意が遅れることを計算し、遅延が情報獲得の代価として生じる仕組みを説明できる
  - 情報を持つ売り手が先に提示する変形で、提示価格そのものがタイプのシグナルになり得ることを PBE として検証できる
  - 完全情報の Rubinstein 型交渉との違いを、継続価値だけでなく信念更新が受諾境界へ入る点から説明できる
definitions:
  - { id: GAME-C7-DEF-01, name: 片側私的情報交渉 }
  - { id: GAME-C7-DEF-02, name: 交渉におけるスクリーニング提示 }
  - { id: GAME-C7-DEF-03, name: 交渉行動による事後信念 }
theorems:
  - { id: GAME-C7-PROP-01, name: 最終期提示の信念閾値 }
  - { id: GAME-C7-THM-01, name: 二期片側私的情報交渉の PBE }
  - { id: GAME-C7-PROP-02, name: スクリーニング領域と遅延確率 }
  - { id: GAME-C7-PROP-03, name: 私的情報を持つ提案者による分離型提示 }
canonical_examples:
  - "売り手タイプ U/P が私的で、買い手が初期価格3または6を提示し、拒否後に事後信念を更新して最終価格3または6を選ぶ二期モデル"
  - "買い手割引因子 delta=1/2 では、緊急売り手の事前確率 pi が2/5以上なら価格3で選別し、未満なら価格6で即時合意する例"
  - "選別時には U 型が初期に受諾し P 型だけが拒否するため、拒否後の事後確率が P 型1へ更新される例"
  - "私的情報を持つ売り手が価格3または8を提示し、提示価格そのものが U/P を分離する PBE の例"
