      - prob.l2-information-space
      - functional.hilbert-space
      - prob.markov-inequality
      - prob.union-bound

  - id: prob.conditional-expectation-l2-contraction
    name: 条件付き期待値のL^2縮小性
    kind: lemma
    aliases: ["条件付き期待値の$L^2$縮小性", 条件付き期待値のL2縮小性, "補題（条件付き期待値の     縮小性）"]
