chapter: "F0-00P7"
terms:
  - term: 統計モデル
    english: statistical model
    meaning: parameterで添字付けされた確率測度の族。
  - term: score
    english: score function
    meaning: log densityをparameterで微分した確率変数。
  - term: Fisher情報
    english: Fisher information
    meaning: scoreの共分散、または正則条件下で負の期待Hessian。
  - term: 正則性
    english: regularity
    meaning: 微分と積分の交換や共通supportなど漸近展開を正当化する条件群。
