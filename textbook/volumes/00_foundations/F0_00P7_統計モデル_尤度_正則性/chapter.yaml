id: "F0-00P7"
title: "正則統計モデル・尤度・スコア・フィッシャー情報量"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00P2
  - F0-00P2A
  - F0-00P3
official_scope: []
learning_objectives:
  - 統計モデルを確率測度族として定義し、共通の支配測度を置く意味を説明できる
  - 尤度をRadon--Nikodym密度から定義し、独立標本の尤度が積になる理由を説明できる
  - スコア恒等式で微分と積分の交換が必要な箇所を示せる
  - フィッシャー情報量の二つの表現を仮定とともに導ける
  - 支持集合が動くモデルで境界項が現れ、通常の正則証明が壊れる理由を説明できる
definitions:
  - { id: F0P7-DEF-01, name: 統計モデル }
  - { id: F0P7-DEF-02, name: 共通の支配測度をもつ統計モデル }
  - { id: F0P7-DEF-03, name: 尤度関数 }
  - { id: F0P7-DEF-04, name: スコア関数 }
  - { id: F0P7-DEF-05, name: フィッシャー情報量 }
  - { id: F0P7-DEF-06, name: 正則性条件 }
theorems:
