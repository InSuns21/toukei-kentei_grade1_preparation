id: "F0-02C5"
title: "関数解析V：一般化KKT・制約写像・制約想定"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-02C4
  - F0-02A
official_scope: []
learning_objectives:
  - 成分ごとの不等式制約を錐制約G(x)∈-Kへまとめられる
  - 一般化LagrangianとKKT条件を双対空間の型を確認しながら書ける
  - 有限次元の通常KKTを一般化KKTの特殊例として復元できる
  - 制約想定がないとKKT乗数が存在しない反例を説明できる
  - 真のtangent coneと線形化coneのずれを説明できる
  - LICQ・MFCQ・Robinson CQの役割と強さの違いを説明できる
  - 等式制約における微分の全射性の意味を説明できる
