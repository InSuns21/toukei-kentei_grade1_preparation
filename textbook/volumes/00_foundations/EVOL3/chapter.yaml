theorems:
  - { id: EVOL3-PROP-01, name: "Hilbert 空間での散逸性判定" }
  - { id: EVOL3-PROP-02, name: "m-散逸作用素は閉作用素" }
  - { id: EVOL3-LEM-01, name: "range condition の正実軸への伝播" }
  - { id: EVOL3-THM-01, name: "Lumer--Phillips 定理" }
  - { id: EVOL3-COR-01, name: "Hilbert 空間版 Lumer--Phillips" }
  - { id: EVOL3-PROP-03, name: "Dirichlet Laplacian の縮小半群生成性" }
canonical_examples:
