id: "GAME-C3"
title: "代替的交渉解"
volume: "foundations"
status: supplementary
prerequisites:
  - GAME-C2
official_scope: []
learning_objectives:
  - 二人 Nash 交渉問題で個別合理的集合の下方包括性と理想点を定義し、理想点が一般には同時達成可能な配分ではないことを具体例で説明できる
  - 各プレイヤーの決裂点からの改善を最大改善幅で規格化した理想点への相対到達率を計算できる
  - Kalai--Smorodinsky 交渉解を決裂点と理想点を結ぶ線上の最大実行可能点として定義し、コンパクト性・本質性・下方包括性が存在証明のどこで働くか説明できる
  - 二人問題で凸性と下方包括性を使い、Kalai--Smorodinsky 交渉解のパレート効率性を核心論証まで証明できる
  - 正のアフィン変換で理想点と解が同じ変換を受け、相対到達率が保存されることを証明できる
  - 曲線フロンティアの具体例で Nash 交渉解と Kalai--Smorodinsky 交渉解を双方計算し、両者が一般には一致しないことを説明できる
  - 実行可能集合の縮小で旧解が残っていても理想点が変われば Kalai--Smorodinsky 解が動く例を計算し、IIA を満たさない理由を説明できる
  - 理想点固定の制限単調性を定式化し、実行可能集合の拡大で Kalai--Smorodinsky 解が悪化しないことを証明できる
  - 絶対的な等利得増分と理想点への相対到達率を区別し、前者が効用尺度の変更に依存することを具体計算で示せる
  - 微分可能な効率的境界について Nash 解と Kalai--Smorodinsky 解が一致する接線条件を導出できる
