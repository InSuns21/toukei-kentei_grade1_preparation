  - { id: GAME-C3-THM-01, name: Kalai--Smorodinsky 解のパレート効率性 }
  - { id: GAME-C3-PROP-02, name: Kalai--Smorodinsky 解の正のアフィン不変性 }
  - { id: GAME-C3-PROP-03, name: Kalai--Smorodinsky 解の理想点固定制限単調性 }
canonical_examples:
  - "F={x>=0:x1+x2<=10}, d=(2,1) で理想点 (9,8) への相対到達率をそろえると KS 解 (11/2,9/2) が Nash 解と一致する線形資源例"
  - "F={x>=0:x2<=1-x1^2}, d=0 で KS 解 ((sqrt(5)-1)/2,(sqrt(5)-1)/2) と Nash 解 (1/sqrt(3),2/3) が異なる曲線フロンティア例"
  - "H={x>=0:x1+x2<=2} から G=conv{(0,0),(2,0),(1,1),(0,3/2)} へ縮小すると旧 KS 解 (1,1) を残したまま理想点が変わり、KS 解が (8/7,6/7) へ動いて IIA が破れる例"
  - "等利得増分ベンチマークはプレイヤー1の効用を100倍すると元の物理的配分を保存せず、正のアフィン不変性を欠くことを示す例"
