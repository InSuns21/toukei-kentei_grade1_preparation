id: "TOP7"
title: "標準位相 VII：一様構造・一様連続・Cauchy構造"
volume: "foundations"
status: supplementary
prerequisites:
  - TOP6
  - RA5
official_scope: []
learning_objectives:
  - entourage と uniformity の公理を距離の epsilon-neighborhood の抽象化として説明できる
  - 距離から一様構造を構成し、その誘導位相が元の距離位相と一致することを証明できる
  - 同じ位相を誘導する二つの距離が異なる一様構造を持ち得ることを具体例で示せる
  - 一様連続写像を entourage で定義し、距離空間の epsilon-delta 定義との同値を説明できる
  - Cauchy filter を定義し、距離 Cauchy 列との対応を証明できる
  - separated uniform space を定義し、誘導位相が Hausdorff になることを証明できる
  - uniform-space total boundedness を定義し、距離空間の全有界性との一致を説明できる
  - compact separated uniform space が complete かつ totally bounded であることを証明できる
  - 同じ topology でも completeness が変わり得ることを arctan metric で説明できる
