chapter: OPT7
scope: dream-theater
coverage: complete
prerequisites:
  - OPT1
  - NA12
  - RA4

forward_references: []

concepts:
  - id: optimization.lipschitz-gradient
    name: Lipschitz 連続勾配
    kind: definition
