chapter: F0-00F1
scope: dream-theater
coverage: complete
prerequisites:
  - F0-00
  - F0-00E1
  - F0-00E2
  - F0-00F

forward_references:
  - topology.extreme-value-theorem

concepts:
  - id: linear.eigen-data-recap-f1
    name: 固有値・固有ベクトル・固有空間の再掲
    kind: definition
    introduction_aliases: [固有値・固有ベクトル・固有空間]
    aliases: [固有値・固有ベクトル・固有空間の再掲]
    requires:
      - linear.eigenvalue
      - linear.eigenvector
      - linear.eigenspace

  - id: linear.invariant-subspace
    name: 不変部分空間
    kind: definition
    aliases: [不変部分空間]
    requires:
      - linear.linear-map
      - linear.linear-subspace

  - id: linear.rayleigh-quotient
    name: Rayleigh商
    kind: definition
    aliases: [Rayleigh商]
    requires:
      - linear.inner-product
      - linear.eigenvalue

  - id: linear.real-symmetric-eigenpair-existence
    name: 実対称行列の実固有対の存在
    kind: lemma
    aliases: [実対称行列の実固有対の存在, 実対称行列の固有対存在]
    requires:
      - linear.eigen-data-recap-f1
      - linear.inner-product

  - id: linear.symmetric-distinct-eigenspaces-orthogonal
    name: 実対称行列の異なる固有空間は直交する
    kind: theorem
    aliases: [実対称行列の異なる固有空間は直交する, 異なる固有値の固有ベクトルは直交する]
    requires:
      - linear.eigen-data-recap-f1
      - linear.inner-product

  - id: linear.spectral-theorem
    name: 実対称行列のスペクトル定理
    kind: theorem
    introduction_aliases: [実対称行列の直交対角化定理]
    aliases: [実対称行列のスペクトル定理, スペクトル定理, 実対称行列の直交対角化定理]
    requires:
      - linear.invariant-subspace
      - linear.real-symmetric-eigenpair-existence
      - linear.orthonormal-system
      - linear.gram-schmidt

  - id: linear.positive-definite-matrix
    name: 正定値行列
    kind: definition
    introduction: inline
    introduction_aliases: [正定値・半正定値]
    aliases: [正定値行列, 正定値]
    requires:
      - linear.spectral-theorem

  - id: linear.positive-semidefinite-matrix
    name: 半正定値行列
    kind: definition
    introduction: inline
    introduction_aliases: [正定値・半正定値]
    aliases: [半正定値行列, 半正定値, PSD]
    requires:
      - linear.spectral-theorem
      - linear.eigenvalue

  - id: linear.pd-psd-eigenvalue-characterization
    name: 正定値・半正定値の固有値判定
    kind: theorem
    aliases: [正定値・半正定値の固有値判定]
    requires:
      - linear.positive-definite-matrix
      - linear.positive-semidefinite-matrix
      - linear.spectral-theorem

  - id: linear.real-psd-square-root-f1
    name: 半正定値行列の平方根
    kind: theorem
    aliases: [半正定値行列の平方根]
    requires:
      - linear.positive-semidefinite-matrix
      - linear.spectral-theorem
