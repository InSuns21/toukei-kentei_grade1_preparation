id: "F0-00SP1"
title: "Encore IV：確率過程・filtration・stopping time"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00P3A
official_scope: []
learning_objectives:
  - 確率過程を確率変数族として定義できる
  - filtrationを時間とともに増える情報として定義できる
  - natural filtrationとadapted processを判定できる
  - stopping timeを情報制約付きランダム時刻として判定できる
  - 停止時刻までのσ代数F_tauを定義できる
  - sigma<=tauからF_sigma subset F_tauを証明できる
  - stopped processを定義できる
  - optional stoppingで使う予測可能な停止判定を説明できる
