chapter: F0-00P3
scope: dream-theater
coverage: complete
prerequisites:
  - F0-00P2A
  - F0-00D2C

forward_references:
  - prob.conditional-expectation
  - prob.conditional-expectation-existence

concepts:
  - id: prob.independent-events
    name: 独立な事象
    kind: definition
    aliases: [独立な事象]
    introduction_aliases: ["定義（独立な事象）"]
    requires:
      - prob.probability-space

  - id: prob.independent-sigma-algebras
    name: 独立なσ代数
    kind: definition
    aliases: [独立なσ代数, "独立な sigma代数"]
    introduction_aliases: ["定義（独立なσ代数）"]
    requires:
      - prob.independent-events
      - measure.sigma-algebra

  - id: prob.independent-random-variables
    name: 独立な確率変数
    kind: definition
    aliases: [独立な確率変数]
    introduction_aliases: ["定義（独立な確率変数）"]
    requires:
      - prob.independent-sigma-algebras
      - prob.random-variable

  - id: prob.pairwise-independence
    name: pairwise independence
    kind: definition
    aliases: [pairwise independence, pairwise independent]
    introduction_aliases: ["定義（pairwise independence と mutual independence）"]
    requires:
      - prob.independent-random-variables

  - id: prob.mutual-independence
    name: mutual independence
    kind: definition
    aliases: [mutual independence, mutually independent]
    introduction_aliases: ["定義（pairwise independence と mutual independence）"]
    requires:
      - prob.independent-random-variables

  - id: prob.independence-joint-factorization
    name: 独立性と積測度の同値
    kind: theorem
    aliases: [独立性と積測度の同値, 同時分布の積測度への因数分解]
    introduction_aliases: ["定理（独立性と積測度の同値）"]
    requires:
      - prob.independent-random-variables
      - prob.joint-distribution
      - prob.marginal-distribution
      - measure.product-measure

  - id: prob.expectation-factorization
    name: 独立な確率変数の期待値因数分解
    kind: theorem
    aliases: [独立な確率変数の期待値因数分解, 期待値因数分解]
    introduction_aliases: ["定理（独立な確率変数の期待値因数分解）"]
    requires:
      - prob.independence-joint-factorization
      - prob.expectation
      - prob.lotus
      - measure.tonelli-theorem
      - measure.fubini-theorem
