  - F0-00D2C
official_scope: []
learning_objectives:
  - 事象・sigma代数・確率変数の独立性を定義できる
  - pairwise independence と mutual independence を区別できる
  - 独立性と同時分布の積測度表示が同値であることを証明できる
  - 密度の積分解を積測度表示から導ける
  - 独立性から期待値の因数分解を可積分性確認込みで導ける
  - 無相関が独立性を含意しない反例を説明できる
