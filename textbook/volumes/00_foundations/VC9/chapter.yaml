  - 剛体回転で保存される半径の物質微分
  - 流れ関数からの非圧縮速度場と渦度
  - 単純せん断流の Newton 応力と表面力
  - 剛体回転流の渦度・循環・圧力勾配
  - 時間変化する一様磁束と Faraday の法則
