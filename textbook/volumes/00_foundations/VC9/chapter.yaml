id: "VC9"
title: "標準ベクトル解析 IX：保存則・流体・Maxwell 方程式"
volume: "foundations"
status: supplementary
prerequisites:
  - VC7
  - VC8
official_scope: []
learning_objectives:
  - VC4 の局所保存則を質量保存へ特殊化し、連続の式の積分形・微分形を対応付けられる
  - 物質微分を粒子軌道に沿う微分として導出し、連続の式を物質微分形へ変形できる
  - 非圧縮条件 div u=0 と密度保存の関係を区別して説明できる
  - 渦度を局所循環密度として解釈し、Kelvin--Stokes の定理で循環と結べる
  - 二次元非圧縮流に流れ関数を構成し、渦度と Poisson 方程式で結べる
  - 二項積・テンソル発散・応力テンソルを用いて積分運動量収支から局所運動量式を導ける
  - 角運動量保存と古典連続体の仮定から応力テンソルの対称性を導ける
  - Newton 流体の構成則から非圧縮 Navier--Stokes 方程式の標準形を導ける
  - Maxwell 方程式の積分形と微分形を Gauss--Ostrogradsky・Kelvin--Stokes の定理で相互変換できる
  - Maxwell 方程式から電荷保存の連続の式を導ける
  - 薄い箱と細いループから Maxwell 方程式の基本的な界面跳躍条件を導ける
