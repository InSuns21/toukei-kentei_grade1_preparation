chapter: CELL8
scope: dream-theater
coverage: complete
prerequisites:
  - CELL7

concepts:
  - id: cellular-automata.shift-equivariance
    name: シフト可換性
    kind: definition
    introduction: formal
    introduction_aliases: ["定義（シフト可換性）"]
    requires: [cellular-automata.full-shift]
  - id: cellular-automata.all-shift-equivariance
    name: 整数回シフトとの可換性
    kind: proposition
    introduction_aliases: ["命題（整数回シフトとの可換性）"]
    requires: [cellular-automata.shift-equivariance]
  - id: cellular-automata.origin-output
    name: 原点出力関数
    kind: definition
    introduction: formal
    introduction_aliases: ["定義（原点出力関数）"]
    requires: [cellular-automata.global-update]
  - id: cellular-automata.pointwise-window
    name: 連続性から原点出力の局所一定性
    kind: lemma
    introduction_aliases: ["補題（連続性から原点出力の局所一定性）"]
    requires: [cellular-automata.origin-output, cellular-automata.continuity-windows]
  - id: cellular-automata.uniform-window
    name: 原点出力の一様有限窓
    kind: lemma
    introduction_aliases: ["補題（原点出力の一様有限窓）"]
    requires: [cellular-automata.pointwise-window, cellular-automata.finite-subcover]
  - id: cellular-automata.chl
    name: Curtis–Hedlund–Lyndon定理
    kind: theorem
    introduction_aliases: ["定理（Curtis–Hedlund–Lyndon定理：一次元全シフト）"]
    requires: [cellular-automata.uniform-window, cellular-automata.all-shift-equivariance, cellular-automata.ca-continuity]
  - id: cellular-automata.composition
    name: CAの合成と半径の上界
    kind: proposition
    introduction_aliases: ["命題（CAの合成と半径の上界）"]
    requires: [cellular-automata.chl, cellular-automata.global-update]
