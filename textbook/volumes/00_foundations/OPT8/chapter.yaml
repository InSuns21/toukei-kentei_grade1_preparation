id: "OPT8"
title: "非滑らか・近接最適化"
volume: "foundations"
status: supplementary
prerequisites:
  - OPT2
  - OPT3
  - OPT7
official_scope: []
learning_objectives:
  - 劣勾配法の距離評価を導き、有界劣勾配のもとで最良反復値のO(1/sqrt(k))評価を再構成できる
  - 射影勾配法を閉凸集合への射影と制約付きFermat条件の両方から説明できる
  - 閉真凸関数の近接作用素を定義し、存在一意性と劣微分による最適性条件を示せる
  - 標示関数の近接作用素が最近点射影になることを導ける
  - 近接作用素の堅非拡大性を劣微分の単調性から証明できる
  - Moreau包絡の勾配公式を導き、絶対値関数でHuber型平滑化を計算できる
  - ℓ¹ノルムの近接作用素がソフト閾値処理になることを座標ごとに導ける
  - 合成目的関数f+gに対する近接勾配法の一段評価とO(1/k)収束を証明できる
  - 正則化付き最小二乗にISTAを適用し、Lipschitz定数と閾値を具体的に計算できる
