id: "TOP5"
title: "標準位相 V：コンパクト性の一般論"
volume: "foundations"
status: supplementary
prerequisites:
  - TOP4
official_scope: []
learning_objectives:
  - コンパクト性を「任意の開被覆から有限部分被覆を選べること」として量化を含めて説明できる
  - コンパクト性と閉集合族の有限交差性による特徴付けを、補集合とDe Morgan則を両方向に使って証明できる
  - コンパクト空間の閉部分集合がコンパクトであることを、部分空間位相の開集合を母空間の開集合へ持ち上げて証明できる
  - コンパクト空間の連続像がコンパクトであることを、像の開被覆を逆像へ引き戻して証明できる
  - Hausdorff空間のコンパクト部分集合が閉であることを、点ごとの分離と有限部分被覆を組み合わせて証明できる
  - コンパクト空間からHausdorff空間への連続全単射が同相写像になることを、閉写像性から証明できる
  - 一般位相ではコンパクト性と点列コンパクト性を同一視できないことを理解し、距離空間での同値を必要な補題から証明できる
  - 局所コンパクトHausdorff空間でcompact-open cutoffを、compact Hausdorffの正規性と連続分離から構成できる
