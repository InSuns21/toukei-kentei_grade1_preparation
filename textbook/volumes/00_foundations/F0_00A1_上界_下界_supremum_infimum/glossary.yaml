chapter: "F0-00A1"
terms:
  - term: 上限
    english: supremum / least upper bound
    meaning: 実数集合の上界全体の中で最小のもの。集合の要素とは限らない。
  - term: 下限
    english: infimum / greatest lower bound
    meaning: 実数集合の下界全体の中で最大のもの。集合の要素とは限らない。
  - term: 最大値
    english: maximum
    meaning: 集合に実際に属し、全要素以上にある値。
  - term: 最小値
    english: minimum
    meaning: 集合に実際に属し、全要素以下にある値。
