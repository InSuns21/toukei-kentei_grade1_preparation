id: "TSA1"
title: "Encore IV 時系列解析 I：定常過程・Hilbert 予測"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00P3B
  - F0-02C1A
official_scope: []
learning_objectives:
  - 狭義定常性と二次定常性を区別し、狭義定常かつ二乗可積分なら二次定常となることを証明できる
  - 自己共分散関数の対称性・Cauchy--Schwarz 上界・正定値性を証明できる
  - 過去の閉線形包と有限過去予測空間を構成できる
  - 有限過去最良線形予測の正規方程式を自己共分散から導ける
  - Hilbert 射影として無限過去の最良線形予測を特徴付けられる
  - 有限過去予測が無限過去予測へ L2 収束することを証明できる
  - 二次定常性から時間移動作用素のユニタリ性を証明できる
  - イノベーションの直交性・定常分散を証明し、弱ホワイトノイズとの関係を説明できる
  - 線形決定論的過程を識別し、ランダム正弦波が完全に線形予測できることを示せる
  - 条件付き期待値による最良予測と最良線形予測の射影先の違いを説明できる
