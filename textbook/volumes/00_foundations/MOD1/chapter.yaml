id: "MOD1"
title: "抽象代数 IX：加群・部分加群・商加群・自由加群"
volume: "foundations"
status: supplementary
prerequisites:
  - RNG4
  - LA2
official_scope: []
learning_objectives:
  - 左加群・右加群の公理を説明し、ベクトル空間・Abel 群・イデアルを加群の具体例として読み替えられる
  - 加群準同型、核、像、部分加群を定義し、部分加群判定を使って具体例を検証できる
  - 商加群の加法とスカラー倍が代表元によらず良定義であることを証明できる
  - 加群の第一同型定理を構成写像の良定義性・全射性・単射性まで含めて証明できる
  - 生成系・有限生成加群・基底・自由加群を定義し、環上では有限生成でも基底を持たない加群があることを説明できる
  - 自由加群の基底上の写像が一意な加群準同型へ延長することを証明し、具体的な準同型を構成できる
  - 整域上のねじれ元・ねじれ部分加群・ねじれなし加群を定義し、ねじれ部分が部分加群になることを証明できる
  - Abel 群を Z-加群として読み替え、整数倍と加群構造の対応を説明できる
  - 線形作用素 T から F[x]-加群構造 p(x)v=p(T)v を構成し、F[x]-部分加群と T-不変部分空間の対応を確認できる
