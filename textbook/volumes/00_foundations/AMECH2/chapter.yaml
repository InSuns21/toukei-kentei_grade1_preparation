  - { id: AMECH2-PROP-01, name: "一般化座標への射影式" }
  - { id: AMECH2-PROP-02, name: "運動エネルギー恒等式" }
  - { id: AMECH2-THM-01, name: "Lagrange 方程式" }
  - { id: AMECH2-THM-02, name: "保存力系の Lagrange 方程式" }
canonical_examples:
  - "滑らかな曲線上の質点で法線反力の仮想仕事がゼロになることを確認する例"
  - "単振り子で張力を解かずに Lagrange 方程式から運動方程式を得る例"
  - "平面中心力で動径方程式と角運動量保存を得る例"
  - "二質点連成振動子で Lagrangian から連立運動方程式を得る例"
  - "回転する円形フープで時間依存拘束の Lagrangian を作る例"
