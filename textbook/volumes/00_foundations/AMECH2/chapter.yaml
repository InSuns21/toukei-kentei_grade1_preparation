id: "AMECH2"
title: "d'Alembert 原理と Lagrange 方程式"
volume: "foundations"
status: supplementary
prerequisites:
  - AMECH1
official_scope: []
learning_objectives:
  - 拘束反力と既知の力を分け、理想拘束を仮想仕事がゼロになる条件として説明できる
  - Newton 方程式と理想拘束条件から d'Alembert 原理を導ける
  - 仮想変位を一般化座標で展開し、d'Alembert 原理を自由度ごとの方程式へ射影できる
  - 運動エネルギー恒等式を速度公式から途中式を追って証明できる
  - 一般化力を用いる Lagrange 方程式を d'Alembert 原理から導ける
  - 保存力の一般化力がポテンシャルの偏微分で表されることを連鎖律から導ける
  - 力学的 Lagrangian L=T-V から保存力系の Lagrange 方程式を計算できる
  - 振り子・平面中心力・連成振動子・時間依存拘束へ Lagrange 方程式を適用できる
definitions:
  - { id: AMECH2-DEF-01, name: "理想拘束" }
  - { id: AMECH2-DEF-02, name: "力学的ラグランジアン" }
theorems:
