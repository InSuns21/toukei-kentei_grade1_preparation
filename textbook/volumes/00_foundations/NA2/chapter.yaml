id: "NA2"
title: "数値解析 II：非線形方程式・不動点反復・Newton 法"
volume: "foundations"
status: supplementary
prerequisites:
  - NA1
  - RA2
  - RA3
  - F0-00D
official_scope: []
learning_objectives:
  - 連続関数の符号変化から二分法を構成し、区間幅から誤差上界と必要反復回数を評価できる
  - 不動点問題と不動点反復を定式化し、導関数評価から縮小性を判定できる
  - 閉区間上の縮小写像について不動点の存在・一意性、反復収束、事前・事後誤差評価を証明できる
  - 収束次数を定義し、線形収束と二次収束を区別できる
  - Newton 法を接線から導出し、単純根近傍での局所二次収束を Taylor の定理から証明できる
  - 多重根で Newton 法の二次収束が失われる機構を説明できる
  - 残差から根誤差を評価するために導関数下界が必要であることを示せる
  - 二分法の大域保証と Newton 法の局所速度を使い分けられる
