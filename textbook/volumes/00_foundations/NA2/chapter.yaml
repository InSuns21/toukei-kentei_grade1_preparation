  - { id: NA2-PROP-01, name: 導関数による縮小性判定 }
  - { id: NA2-THM-02, name: 閉区間上の縮小不動点反復 }
  - { id: NA2-THM-03, name: Newton 法の局所二次収束 }
  - { id: NA2-COR-01, name: Newton 法の二次誤差定数 }
