id: "PDE9"
title: "標準偏微分方程式 IX：多次元波動方程式・Kirchhoff 公式・Huygens 原理"
volume: "foundations"
status: supplementary
prerequisites:
  - PDE8
  - VC6
official_scope: []
learning_objectives:
  - 三次元の球面平均を定義し一次関数などで直接計算できる
  - 球面平均の Euler--Poisson--Darboux 関係を発散定理から導ける
  - 三次元波動方程式の Kirchhoff 公式を証明し初期条件を検証できる
  - Kirchhoff 公式から有限伝播速度と三次元 Huygens 原理を説明できる
  - 次元降下法 から二次元波動方程式の Poisson 公式を導ける
  - 二次元の尾と三次元の鋭い伝播の違いを説明できる
