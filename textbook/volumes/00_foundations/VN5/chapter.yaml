id: "VN5"
title: "正規汎関数・正規状態・トレース"
volume: "foundations"
status: supplementary
prerequisites:
  - VN4
  - OA5
official_scope: []
learning_objectives:
  - von Neumann 環上の正規汎関数を ultraweak 連続な線形汎関数として定義し、predual との関係を説明できる
  - B(H) 上の正規汎関数を一意な trace class 作用素 T による phi(A)=Tr(AT) として表し、正性が T>=0 と同値であることを証明できる
  - 正規状態と密度作用素 rho>=0, Tr(rho)=1 の一対一対応を証明し、ベクトル状態と混合状態を具体計算できる
  - 正規な正汎関数が単調増加する射影族の上限を保存することを示し、B(H) では射影に対する単調連続性から正規性を再構成できる
  - von Neumann 環上のトレースを拡張値正値写像として定義し、正規性・忠実性・半有限性の意味を説明できる
  - 無限次元 B(H) の標準トレースが正規・忠実・半有限であることを証明し、有限次元の正規化トレースとの違いを説明できる
  - 無限次元 B(H) に正規トレース状態が存在しないことを証明し、VN7 の有限性・型分類へ何が残るかを説明できる
