id: "F0-02C7"
title: "関数解析VII：RKHS・再生核・representer theorem・kernel SVM"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-02C6
official_scope: []
learning_objectives:
  - RKHSを点評価汎関数の連続性から定義できる
  - Riesz表現から再生核Kと再生性を導ける
  - 再生核が対称半正定値kernelになることを示せる
  - Moore--Aronszajn定理の構成の流れを説明できる
  - representer theoremを直交分解から説明できる
  - kernel SVMの解が有限個のkernel sectionの線形結合になる理由を説明できる
  - SVM双対目的関数にGram行列K(x_i,x_j)だけが現れることを導ける
