id: "F0-02C7"
title: "関数解析VII：RKHS・再生核・Moore--Aronszajn"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-02C2
learning_objectives:
  - RKHSを評価汎関数の連続性から定義できる
  - Riesz表現から再生核と再生性を導ける
