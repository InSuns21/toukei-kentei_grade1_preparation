id: "ODE5"
title: "標準 ODE V：Laplace変換と初期データ"
volume: "foundations"
status: supplementary
prerequisites:
  - ODE2
official_scope: []
learning_objectives:
  - 指数位数とLaplace変換を定義し、変換が収束する半直線を具体的な評価から判定できる
  - 線形性と微分則を定義から導き、初期値がs領域の代数式へ入る機構を説明できる
  - 指数因子による移動則と単位階段関数による時間移動則を証明し、遅延入力を変換できる
  - 基本変換表と部分分数分解から逆変換候補を構成し、順変換または元の初期値付き方程式への代入で検証できる
  - 片側合成積を定義し、有限三角領域での積分交換と絶対収束評価から合成積定理を証明できる
  - 定係数線形ODEの初期値付き方程式をLaplace変換で代数化し、初期データを落とさずに解ける
  - 階段入力を含む初期値付き方程式を時間移動則で解き、区分的な時間応答として読み戻せる
  - 零初期値の応答をGreen核・合成積と結び付け、インパルス応答という考え方とDirac deltaの厳密理論を区別できる
