  - { id: ODE5-THM-02, name: 微分のLaplace変換 }
  - { id: ODE5-THM-03, name: 指数移動則 }
  - { id: ODE5-THM-04, name: 時間移動則 }
  - { id: ODE5-THM-05, name: 畳み込み定理 }
  - { id: ODE5-THM-06, name: 定係数線形初期値問題の代数化 }
canonical_examples: [指数関数と多項式の変換, 微分則からsin-cos変換, 部分分数による逆変換, 遅延階段入力, 畳み込みと調和振動子Green核, 共鳴を含む二階初期値問題]
