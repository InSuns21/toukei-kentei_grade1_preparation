id: "TOP4"
title: "標準位相 IV：分離公理・可算性公理"
volume: "foundations"
status: supplementary
prerequisites:
  - TOP3
  - F0-00B1
official_scope: []
learning_objectives:
  - T0・T1・Hausdorff(T2)・T3・T4を「何を互いに分離できるか」で比較し、各含意でどの仮定を使うか説明できる
  - T1空間と一点集合が閉であることの同値性を両方向に証明できる
  - T4⇒T3⇒T2⇒T1⇒T0を、T1条件が使われる箇所を明示して証明できる
  - Sierpinski空間・補有限位相・K位相により分離公理の逆向きが一般には成り立たないことを確認できる
  - 局所基底・第一可算・第二可算・可分性を「何を可算な族で記述するか」で区別できる
  - 第二可算なら第一可算かつ可分であることを、可算基底から局所基底と稠密集合を構成して証明できる
  - 非可算離散空間と可算な非第一可算空間により可算性条件の逆向きが一般には成り立たないことを確認できる
  - 距離空間では可分性と第二可算性が同値であることを、稠密集合の点を中心とする有理半径の球から証明できる
