  - { id: TOP4-THM-01, name: 分離公理の含意関係 }
  - { id: TOP4-PROP-02, name: Sierpinski空間はT0だがT1でない }
  - { id: TOP4-PROP-03, name: 無限集合の補有限位相はT1だがHausdorffでない }
  - { id: TOP4-PROP-04, name: K位相はHausdorffだが正則でない }
  - { id: TOP4-THM-02, name: 第二可算なら第一可算かつ可分 }
