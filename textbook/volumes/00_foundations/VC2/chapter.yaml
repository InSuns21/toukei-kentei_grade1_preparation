id: "VC2"
title: "標準ベクトル解析 II：曲線・線積分・保存場"
volume: "foundations"
status: supplementary
prerequisites:
  - VC1
  - RA4
official_scope: []
learning_objectives:
  - 正則曲線・向き・再パラメータ表示・弧長・単位接ベクトルを定義して計算できる
  - scalar line integralとvector line integralを定義し、向きによる符号の違いを説明できる
  - 線積分の基本定理を連鎖律と一変数FTCから証明できる
  - 保存場・potential・経路独立・閉曲線積分ゼロの同値を証明できる
  - star-shaped domain上でcurl-free fieldからpotentialを明示的に構成できる
  - punctured planeでcurl-freeだが非保存的な場を計算し、失われたdomain条件を説明できる
  - simply connectedの役割をVC5への依存を逆輸入せず説明できる
