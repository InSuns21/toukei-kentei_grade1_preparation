  - { id: VC2-THM-02, name: 保存場・経路独立・閉曲線積分の同値 }
  - { id: VC2-THM-03, name: star-shaped domain上の初等Poincare lemma }
canonical_examples:
  - 単位円の弧長と循環
  - gradient fieldの端点差
  - star-shaped domainでのpotential構成
  - punctured planeのirrotational非conservative field
