chapter: "VC2"
terms:
  - term: 正則曲線
    english: regular curve
    meaning: パラメータ微分が消えないC1曲線。局所的に接方向が定まる。
  - term: scalar line integral
    english: scalar line integral
    meaning: scalar fieldを曲線の弧長に沿って積分するもの。曲線の向きを反転しても値は変わらない。
  - term: vector line integral
    english: line integral of a vector field
    meaning: vector fieldの接方向成分を曲線に沿って積分するもの。仕事や循環を表し、向きを反転すると符号が変わる。
  - term: 保存場
    english: conservative field
    meaning: あるscalar potentialのgradientとして書けるvector field。
  - term: 経路独立
    english: path independence
    meaning: 同じ始点と終点を結ぶ曲線ならvector line integralが経路によらず同じ値になる性質。
  - term: star-shaped domain
    english: star-shaped domain
    meaning: ある中心点から領域内の任意の点へ結ぶ線分が全て領域内に残る領域。
  - term: simply connected
    english: simply connected
    meaning: 本系列では任意の閉曲線を領域内で一点へ縮められることを表す。一般位相論の詳細は後続へ送る。
