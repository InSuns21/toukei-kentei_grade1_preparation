id: "INFO1"
title: "自己情報量・Shannonエントロピー・条件付け"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00P1
  - F0-00P2A
  - F0-00P3
official_scope: []
learning_objectives:
  - 零確率事象の規約を区別して自己情報量とエントロピーを有限分布から計算できる
  - 独立な正確率事象の自己情報量の加法性を導ける
  - 有限エントロピーの上下限と等号成立条件を対数不等式から証明できる
  - 結合・条件付き分布とエントロピーを零確率の行に注意して定義・計算できる
  - 有限分布の連鎖律を条件付き確率の積から証明できる
  - 相互情報量を複数の等価な表式から計算し、二値通信模型の両端を説明できる
  - 三変数の連鎖律を用い、二変数を合わせて観測することと個別の観測を区別できる
