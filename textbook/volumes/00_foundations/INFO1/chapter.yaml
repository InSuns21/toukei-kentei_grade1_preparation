  - { id: INFO1-THM-01, name: 有限離散エントロピーの上下限 }
  - { id: INFO1-THM-02, name: 結合エントロピーの連鎖律 }
canonical_examples:
  - 公平なコイン二回による自己情報量の加法性
  - 確率零の記号を含む四値情報源とエントロピー
  - 独立二値変数と決定的な写像による条件付きエントロピー
  - 二値対称な誤り模型による相互情報量
