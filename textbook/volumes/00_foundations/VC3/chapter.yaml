id: "VC3"
title: "標準ベクトル解析 III：曲面・向き・曲面積分・流束"
volume: "foundations"
status: supplementary
prerequisites:
  - VC1
  - RA7
  - LA3C
official_scope: []
learning_objectives:
  - 正則パラメータ曲面を定義し、座標接ベクトル・接平面・法線を計算できる
  - 古典的な向き付け可能性を連続単位法線場として説明し、球面と非向き付け例を区別できる
  - 外積から曲面積要素を導き、曲面積と向き付き流束の再パラメータ表示不変性を証明できる
  - スカラー曲面積分と向き付き流束積分を定義して計算できる
  - グラフ曲面の面積要素と上向きベクトル面積要素を導ける
  - 球面・円柱・平面で面積と流束を直接計算できる
  - 曲面の向きと境界向きの関係をVC5のStokes の定理への入口として説明できる
