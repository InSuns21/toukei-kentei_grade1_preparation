id: "VC3"
title: "標準ベクトル解析 III：曲面・向き・曲面積分・flux"
volume: "foundations"
status: supplementary
prerequisites:
  - VC1
  - RA7
  - LA3C
official_scope: []
learning_objectives:
  - 正則パラメータ曲面を定義し、coordinate tangent vectors・接平面・法線を計算できる
  - 古典的な向き付け可能性を連続単位法線場として説明し、球面と非向き付け例を区別できる
  - cross productから曲面積要素を導き、surface areaとoriented fluxの再パラメータ表示不変性を証明できる
  - scalar surface integralと向き付きflux integralを定義して計算できる
  - graph surfaceの面積要素と上向きvector area elementを導ける
  - sphere・cylinder・planeで面積とfluxを直接計算できる
  - surface orientationとboundary orientationの関係をVC5のStokes theoremへの入口として説明できる
