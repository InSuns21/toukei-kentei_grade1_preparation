id: "LIE4"
title: "Lie 理論 IV：Lie 群作用・軌道・等質空間・Maurer--Cartan"
volume: "foundations"
status: supplementary
prerequisites:
  - LIE3
  - GRP3
  - GEO3
  - GEO7
official_scope: []
learning_objectives:
  - GRP3 の群作用へ滑らかさを追加して Lie 群作用を定義し、各群要素が微分同相写像として作用することを説明できる
  - 軌道写像の微分を基本ベクトル場として計算し、安定化群が閉 Lie 部分群になることと ker dPhi_x = g_x を証明できる
  - 基本ベクトル場の流れを exp(tX) の作用として求め、本章の左作用規約では X→X_M が Lie 環反準同型になることを証明できる
  - 閉 Lie 部分群 H に対する G/H の滑らかな商多様体構造を局所積分解から構成し、dim G/H と T_eH(G/H) を計算できる
  - 等質空間を推移的 Lie 群作用として定義し、M≅G/G_x を安定化群から構成できる
  - 一般の軌道は自然にはめ込み多様体になるが埋め込み部分多様体とは限らないことを稠密軌道から説明できる
  - Lie 環値1形式と左 Maurer--Cartan 形式を定義し、GL(n,R) で theta=A^{-1}dA を計算できる
  - Maurer--Cartan 形式の左不変性・右移動則を証明し、Maurer--Cartan 方程式を外微分の座標不変表示から導ける
  - 構造定数から d theta^k = -1/2 sum c_ij^k theta^i wedge theta^j を導き、非可換 Lie 群で具体計算できる
