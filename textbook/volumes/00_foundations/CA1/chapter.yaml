id: "CA1"
title: "標準複素解析 I：複素微分・Cauchy–Riemann・初等正則関数"
volume: "foundations"
status: supplementary
prerequisites:
  - RA3
  - RA5
  - LA1
  - TOP3
official_scope: []
learning_objectives:
  - 複素差商の定義から複素微分可能性を判定し、複素微分可能なら連続であることを示せる
  - 和・積・商・合成の微分法則を差商と誤差表示から証明できる
  - 実方向と純虚方向の差商を比較してCauchy–Riemann必要条件を導ける
  - 偏導関数の連続性を使って横・縦の増分を一次化し、Cauchy–Riemann十分条件をo(|h|)評価から証明できる
  - Wirtinger微分でCauchy–Riemann方程式を一つの式partial_bar_z f=0として表せる
  - 共役写像と絶対値二乗を使い、一点での複素微分可能性と開集合上の正則性を区別できる
  - 導関数0の正則関数が連結開集合上で定数になることを局所定数性と連結性から証明できる
  - 複素指数関数の正則性・加法公式・周期性・零点不存在を定義から導ける
  - 複素正弦・余弦を指数関数から定義し、その導関数を導ける
definitions:
  - { id: CA1-DEF-01, name: 複素微分可能 }
  - { id: CA1-DEF-02, name: 正則関数 }
