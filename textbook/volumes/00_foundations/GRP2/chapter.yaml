id: "GRP2"
title: "抽象代数 II：準同型・剰余類・正規部分群・商群"
volume: "foundations"
status: supplementary
prerequisites:
  - GRP1
official_scope: []
learning_objectives:
  - 群準同型と群同型を定義し、単位元・逆元・冪が保存されることを群公理から導ける
  - 準同型の核と像を計算し、核が正規部分群、像が部分群になることを証明できる
  - 左剰余類・右剰余類と指数を定義し、剰余類が群を分割することを示せる
  - 有限群に対する Lagrange の定理を証明し、部分群の位数と元の位数へ応用できる
  - 正規部分群を複数の同値条件で判定し、核が正規部分群になる理由を説明できる
  - 商群の積が代表元によらず well-defined であることと正規性の関係を証明できる
  - 第一・第二・第三同型定理と対応定理を自然な写像から構成し、well-defined 性・核・像を追って証明できる
  - Z/nZ、S_n/A_n、行列式準同型を同じ核・商・像の枠組みで説明できる
