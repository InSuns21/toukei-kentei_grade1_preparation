id: "HJC4"
title: "決定論的微分ゲーム・Hamilton--Jacobi--Isaacs"
volume: "foundations"
status: supplementary
prerequisites:
  - HJC3
  - HJC2
  - HJC1
  - GAME-A2
official_scope: []
learning_objectives:
  - control と nonanticipative strategy の違いを情報構造の観点から説明し、未来を参照しない条件を判定できる
  - 二人零和微分ゲームの lower value / upper value を定義し、strategy を持つ側によって最適化順序が変わることを説明できる
  - game の dynamic programming principle を restriction・concatenation・到達状態の有限 net による continuation strategy の貼り合わせから再構成できる
  - lower / upper Isaacs Hamiltonian を局所 stage game から導き、sup-inf と inf-sup の順序を計算できる
  - lower / upper HJI equation を backward viscosity form に直し、DPP から粘性 subsolution / supersolution 条件を導ける
  - Isaacs Hamiltonian が comparison に必要な p-Lipschitz 条件と x 方向の線形成長 Lipschitz 条件を満たすことを確認できる
  - Isaacs condition の意味を minimax の弱不等式と結び付け、成立時に lower / upper HJI が一致することを説明できる
  - comparison による粘性解の一意性から game value V-=V+ を導ける
  - 一次元 pursuit--evasion で H^- と H^+ を計算し、明示的 value function を HJI と照合できる
  - Isaacs condition が失敗すると Hamiltonian・HJI・value が二つに分かれることを具体例で示せる
