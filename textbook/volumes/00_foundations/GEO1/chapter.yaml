  - { id: GEO1-DEF-06, name: 滑らかなアトラスの両立性 }
  - { id: GEO1-DEF-07, name: 極大滑らかアトラス }
  - { id: GEO1-DEF-08, name: 滑らかな構造・滑らかな多様体 }
  - { id: GEO1-DEF-09, name: n次元トーラス }
  - { id: GEO1-DEF-10, name: 滑らかな写像 }
  - { id: GEO1-DEF-11, name: 微分同相写像 }
theorems:
