id: "GEO1"
title: "幾何学 I：滑らかな多様体・滑らかな写像"
volume: "foundations"
status: supplementary
prerequisites:
  - TOP4
  - RA6A
official_scope: []
learning_objectives:
  - 位相多様体を Hausdorff 性・第二可算性・局所 Euclid 性から定義し、具体例で各条件を検証できる
  - 座標近傍・アトラス・滑らかな両立性を定義し、座標変換を具体計算できる
  - 滑らかなアトラス同士の両立性が同値関係であることを証明できる
  - 任意の滑らかなアトラスから一意な極大滑らかアトラスを構成できる
  - 球面・トーラス・実射影空間の標準滑らかな構造を座標変換から構成できる
  - 積多様体の滑らかな構造を構成できる
  - 滑らかな写像の定義が座標選択に依存しないことを証明し、微分同相写像を判定できる
definitions:
  - { id: GEO1-DEF-01, name: 位相多様体 }
