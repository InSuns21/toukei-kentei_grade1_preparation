learning_objectives:
  - 線形変換後の平均ベクトルと分散共分散行列を導出できる
  - 独立な多変量正規標本の標本平均ベクトルの分布を導出できる
  - Mahalanobis距離を計算し尺度と相関の補正を説明できる
  - 固有分解から白色化変換を構成できる
  - 条件付き正規分布を線形予測と残差化から説明できる
  - 共通分散共分散行列をもつ正規2群から線形判別関数を導ける
