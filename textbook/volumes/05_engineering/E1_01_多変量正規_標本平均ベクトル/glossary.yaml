chapter: "E1-01"
terms:
  - { term: 標本平均ベクトル, meaning: 複数変数を同時に観測した独立標本の各成分平均を並べたベクトル }
  - { term: Mahalanobis距離, meaning: 分散と相関を分散共分散行列で補正した多変量距離 }
  - { term: 白色化, meaning: 中心化したベクトルを線形変換し分散共分散行列を単位行列にすること }
  - { term: 確率楕円, meaning: Mahalanobis距離を一定以下に制限して得られる多変量正規分布の中心領域 }
  - { term: 条件付き平均, meaning: 一部の変数を観測した後の残りの変数の平均 }
  - { term: 線形判別分析, meaning: 共通分散共分散行列を仮定した群別正規モデルで線形境界を用いて分類する方法 }
