id: "E2-04"
title: "ブラウン運動・拡散極限"
volume: "engineering"
status: self_review
prerequisites:
  - E2-02
  - P3-03
  - P4-02
official_scope:
  - ブラウン運動
  - ランダムウォーク
  - 確率過程
  - 多変量正規分布
learning_objectives:
  - 標準ブラウン運動の定義を独立増分・正規増分・連続経路に分けて説明できる
  - 平均・分散・共分散を独立増分から導出できる
  - 複数時点の同時分布を多変量正規分布として構成できる
  - ランダムウォークの拡散スケーリングとブラウン運動の関係を説明できる
  - 自己相似性を増分分布から説明できる
  - 反射原理から最大値分布と初到達時刻分布を導出できる
  - ドリフト付きブラウン運動の平均・分散・増分分布を計算できる
