terms:
  - term: ブラウン運動
    definition: B(0)=0、独立増分、正規定常増分、連続経路を満たす連続時間確率過程。
  - term: 独立増分
    definition: 互いに重ならない時間区間上の増分が独立である性質。
  - term: 定常増分
    definition: 増分の分布が区間の位置ではなく区間長だけで決まる性質。
  - term: 拡散スケーリング
    definition: ランダムウォークで時間をn倍、空間を平方根nで縮尺する極限操作。
  - term: 自己相似性
    definition: 時間をc倍すると空間尺度が平方根c倍になるブラウン運動の縮尺不変性。
  - term: 反射原理
    definition: 水準への初到達後の経路を反射し、最大値事象を終点の確率へ対応させる方法。
  - term: 初到達時刻
    definition: 過程が指定水準へ初めて到達する時刻。
