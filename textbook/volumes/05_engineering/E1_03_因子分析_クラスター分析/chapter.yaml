id: "E1-03"
title: "因子分析・クラスター分析"
volume: "engineering"
status: reviewed
prerequisites:
  - E1-01
  - E1-02
  - F0-00
official_scope:
  - 因子分析
  - クラスター分析
learning_objectives:
  - 因子分析と主成分分析の目的・モデル化の違いを説明できる
  - 共通因子モデルから分散共分散行列 Sigma=Lambda Lambda^T+Psi を導出できる
  - 因子負荷量・共通性・独自性を計算し、標準化変数での意味を説明できる
  - 直交回転による因子負荷量の回転不定性を示し、回転の目的を説明できる
  - 因子数の判断と因子得点の位置付けを説明できる
  - 距離・標準化がクラスタリング結果へ与える影響を説明できる
  - 単連結法・完全連結法・群平均法・Ward法の結合規則を計算できる
  - Ward法の結合コストを群内平方和の増分として導出できる
  - k-meansの目的関数を記述し、固定クラスタに対する最適中心が標本平均であることを導出できる
  - 因子分析・PCA・階層型クラスタリング・k-meansを目的に応じて使い分けられる
