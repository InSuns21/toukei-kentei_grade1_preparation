terms:
  - term: 因子分析
    definition: 観測変数どうしの相関を、少数の潜在的な共通因子と各変数固有の誤差に分けて説明する多変量解析法。
  - term: 共通因子モデル
    definition: 中心化した観測ベクトルを X=Lambda F+epsilon と表し、共通因子 F と独自因子 epsilon に分解するモデル。
  - term: 因子負荷量
    definition: 共通因子が各観測変数へどれだけ影響するかを表す係数。標準化変数かつ因子分散1なら因子と観測変数の相関に一致する。
  - term: 共通性
    definition: 各観測変数の分散のうち共通因子で説明される部分。直交因子モデルでは因子負荷量の二乗和で表される。
  - term: 独自性
    definition: 各観測変数の分散のうち共通因子で説明されない固有部分。共通因子モデルでは独自因子の分散に対応する。
  - term: 因子回転
    definition: 共分散構造を保ちながら因子軸を回転し、因子負荷量を解釈しやすい形へ変換する操作。
  - term: 直交回転
    definition: 因子間の無相関を保つ回転。直交行列 T を用いて Lambda を Lambda T に変換する。
  - term: varimax回転
    definition: 各因子について大きい負荷量と小さい負荷量の差が明瞭になるよう直交回転を選ぶ代表的方法。
  - term: 因子得点
    definition: 各観測が潜在因子上でどの位置にあるかを推定した値。潜在因子そのものは直接観測されないため推定法に依存する。
  - term: クラスター分析
    definition: 観測対象間の類似度または非類似度に基づき、似た対象を同じ群へまとめる教師なし学習・多変量解析法。
  - term: 階層型クラスタリング
    definition: 近いクラスタを順次結合するなどして入れ子状のクラスタ構造を作る方法。結果はデンドログラムで表せる。
  - term: 単連結法
    definition: 二つのクラスタ間の距離を、所属点どうしの最小距離で定義する階層型クラスタリングの結合法。
  - term: 完全連結法
    definition: 二つのクラスタ間の距離を、所属点どうしの最大距離で定義する階層型クラスタリングの結合法。
  - term: 群平均法
    definition: 二つのクラスタに属する点の全組合せ距離の平均をクラスタ間距離とする結合法。
  - term: Ward法
    definition: 二つのクラスタを結合したときの群内平方和の増加量が最小となる組を順次結合する方法。
  - term: デンドログラム
    definition: 階層型クラスタリングで、どのクラスタがどの結合高さで統合されたかを木構造として表した図。
  - term: k-means法
    definition: クラスタ内平方和を小さくするよう、各点の所属クラスタとクラスタ中心を交互に更新する非階層型クラスタリング法。
  - term: クラスタ内平方和
    definition: 各点と所属クラスタ中心との二乗ユークリッド距離の総和。k-meansやWard法の中心的な目的量。
