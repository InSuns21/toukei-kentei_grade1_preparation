<svg xmlns="http://www.w3.org/2000/svg" width="840" height="430" viewBox="0 0 840 430" role="img" aria-labelledby="title desc">
  <title id="title">直列系と並列系の信頼性ブロック図</title>
  <desc id="desc">上段はA、B、Cの3部品が直列につながり全部が動作する必要がある系、下段はA、B、Cが並列につながり少なくとも1部品が動けばよい系を示す。</desc>
  <rect width="840" height="430" fill="white"/>
  <text x="45" y="34" font-size="20" font-weight="bold">システム信頼度は「動作条件」を図にすると分かりやすい</text>
  <text x="55" y="90" font-size="18" font-weight="bold">直列系：全部が動作して初めて成功</text>
  <line x1="130" y1="145" x2="230" y2="145" stroke="#222" stroke-width="3"/><rect x="230" y="115" width="110" height="60" fill="white" stroke="#222" stroke-width="2"/><text x="278" y="152" font-size="18">A</text><line x1="340" y1="145" x2="390" y2="145" stroke="#222" stroke-width="3"/><rect x="390" y="115" width="110" height="60" fill="white" stroke="#222" stroke-width="2"/><text x="438" y="152" font-size="18">B</text><line x1="500" y1="145" x2="550" y2="145" stroke="#222" stroke-width="3"/><rect x="550" y="115" width="110" height="60" fill="white" stroke="#222" stroke-width="2"/><text x="598" y="152" font-size="18">C</text><line x1="660" y1="145" x2="735" y2="145" stroke="#222" stroke-width="3"/>
  <text x="235" y="205" font-size="15">Rseries = RA RB RC</text>
  <text x="55" y="255" font-size="18" font-weight="bold">並列系：少なくとも1つ動けば成功</text>
  <line x1="130" y1="335" x2="190" y2="335" stroke="#222" stroke-width="3"/><line x1="190" y1="285" x2="190" y2="385" stroke="#222" stroke-width="3"/><line x1="650" y1="285" x2="650" y2="385" stroke="#222" stroke-width="3"/><line x1="650" y1="335" x2="735" y2="335" stroke="#222" stroke-width="3"/>
  <line x1="190" y1="290" x2="275" y2="290" stroke="#222" stroke-width="3"/><rect x="275" y="265" width="120" height="50" fill="white" stroke="#222" stroke-width="2"/><text x="328" y="297" font-size="18">A</text><line x1="395" y1="290" x2="650" y2="290" stroke="#222" stroke-width="3"/>
  <line x1="190" y1="335" x2="275" y2="335" stroke="#222" stroke-width="3"/><rect x="275" y="310" width="120" height="50" fill="white" stroke="#222" stroke-width="2"/><text x="328" y="342" font-size="18">B</text><line x1="395" y1="335" x2="650" y2="335" stroke="#222" stroke-width="3"/>
  <line x1="190" y1="380" x2="275" y2="380" stroke="#222" stroke-width="3"/><rect x="275" y="355" width="120" height="50" fill="white" stroke="#222" stroke-width="2"/><text x="328" y="387" font-size="18">C</text><line x1="395" y1="380" x2="650" y2="380" stroke="#222" stroke-width="3"/>
  <text x="430" y="410" font-size="15">Rparallel = 1 - (1-RA)(1-RB)(1-RC)</text>
</svg>