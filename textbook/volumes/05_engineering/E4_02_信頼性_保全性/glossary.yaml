chapter: "E4-02"
terms:
  - { term: 信頼度関数, meaning: 時刻tまで故障せず機能する確率を表す関数 }
  - { term: 危険率, meaning: 時刻tまで生存した条件のもとで直後に故障する強さ }
  - { term: 累積危険率, meaning: 危険率を時刻0からtまで積分した量 }
  - { term: 平均故障時間, meaning: 非修理部品が故障するまでの平均時間 }
  - { term: 平均故障間隔, meaning: 修理可能設備で故障間の平均的な稼働時間を表す指標 }
  - { term: 平均修復時間, meaning: 故障から修理完了までの平均時間 }
  - { term: 保全度, meaning: 故障後t時間以内に修理を完了できる確率 }
  - { term: アベイラビリティ, meaning: 修理可能設備が長期的に稼働している時間割合 }
  - { term: 共通原因故障, meaning: 複数部品を同時に故障させる共通要因による故障 }
