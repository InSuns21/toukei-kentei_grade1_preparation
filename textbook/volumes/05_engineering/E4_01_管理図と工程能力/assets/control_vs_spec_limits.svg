<svg xmlns="http://www.w3.org/2000/svg" width="820" height="390" viewBox="0 0 820 390" role="img" aria-labelledby="title desc">
  <title id="title">管理限界と規格限界の違い</title>
  <desc id="desc">上段は工程データから決まるUCL、CL、LCLを時間軸上に示し、下段は設計や顧客要求から与えられるLSLとUSLを品質特性の軸上に示す。両者が別の問いを扱うことを表す。</desc>
  <rect width="820" height="390" fill="white"/>
  <text x="45" y="32" font-size="20" font-weight="bold">管理限界と規格限界は「由来」も「役割」も違う</text>
  <text x="48" y="78" font-size="17" font-weight="bold">管理限界：工程の通常変動から決まる</text>
  <line x1="120" y1="112" x2="740" y2="112" stroke="#555" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="120" y1="160" x2="740" y2="160" stroke="#222" stroke-width="2"/>
  <line x1="120" y1="208" x2="740" y2="208" stroke="#555" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="760" y="117" font-size="15">UCL</text><text x="760" y="165" font-size="15">CL</text><text x="760" y="213" font-size="15">LCL</text>
  <polyline points="150,166 215,147 280,174 345,158 410,181 475,143 540,168 605,151 670,176" fill="none" stroke="#222" stroke-width="2"/>
  <g fill="white" stroke="#222" stroke-width="2"><circle cx="150" cy="166" r="5"/><circle cx="215" cy="147" r="5"/><circle cx="280" cy="174" r="5"/><circle cx="345" cy="158" r="5"/><circle cx="410" cy="181" r="5"/><circle cx="475" cy="143" r="5"/><circle cx="540" cy="168" r="5"/><circle cx="605" cy="151" r="5"/><circle cx="670" cy="176" r="5"/></g>
  <text x="48" y="270" font-size="17" font-weight="bold">規格限界：設計・顧客要求から与えられる</text>
  <line x1="120" y1="325" x2="740" y2="325" stroke="#222" stroke-width="2"/>
  <line x1="230" y1="294" x2="230" y2="348" stroke="#222" stroke-width="3"/>
  <line x1="630" y1="294" x2="630" y2="348" stroke="#222" stroke-width="3"/>
  <text x="207" y="372" font-size="15">LSL</text><text x="607" y="372" font-size="15">USL</text>
  <path d="M280 325 C335 325 350 285 430 285 C510 285 525 325 580 325" fill="none" stroke="#555" stroke-width="2.5"/>
  <text x="360" y="306" font-size="15">工程分布</text>
</svg>