chapter: "E4-01"
terms:
  - { term: 管理状態, meaning: 特殊原因がなく工程が同じ確率的仕組みで安定している状態 }
  - { term: 共通原因, meaning: 安定した工程に内在する多数の小さな変動要因 }
  - { term: 特殊原因, meaning: 通常工程へ追加される識別可能な異常要因 }
  - { term: 管理限界, meaning: 工程の統計的変動から計算する管理図上の判定境界 }
  - { term: 規格限界, meaning: 設計・顧客要求から定められる製品仕様の境界 }
  - { term: p管理図, meaning: 群ごとの不適合率を監視する管理図 }
  - { term: np管理図, meaning: 群サイズ一定のとき不適合品数を監視する管理図 }
  - { term: 平均連長, meaning: 管理図で信号が出るまでの平均群数 }
  - { term: 工程能力指数, meaning: 安定した工程のばらつきと規格幅・中心ずれを比較する指標 }
