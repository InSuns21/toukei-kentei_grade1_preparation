chapter: "E4-01"
terms:
  - { term: 共通原因, meaning: 安定した工程に本来的に含まれる多数の小さな変動要因 }
  - { term: 特殊原因, meaning: 設備異常など識別・除去可能な追加的変動要因 }
  - { term: 管理限界, meaning: 管理状態の工程分布から統計的に設定する監視境界 }
  - { term: 規格限界, meaning: 設計や顧客要求から定める品質要求の境界 }
  - { term: R管理図, meaning: 群内レンジを用いて工程の短期的なばらつきを監視する管理図 }
  - { term: p管理図, meaning: 各群の不適合率を監視する属性管理図 }
  - { term: np管理図, meaning: 群サイズ一定のとき不適合品数を監視する属性管理図 }
  - { term: 工程能力指数, meaning: 安定工程のばらつきと規格幅の関係を数値化する指標 }
