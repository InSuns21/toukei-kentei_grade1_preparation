id: "E4-01"
title: "管理図と工程能力"
volume: "engineering"
status: self_review
prerequisites:
  - P3-01
  - P3-02
  - P4-02
official_scope:
  - 管理図
  - プロセス管理
  - 工程能力指数
learning_objectives:
  - 管理図の3シグマ限界を標本分布から導ける
  - Xbar管理図とR管理図を使い分けられる
  - p管理図とnp管理図を二項分布から構成できる
  - 管理限界と規格限界を区別できる
  - 管理状態での平均連長を説明できる
  - 平均シフト後の検出確率と平均連長を計算できる
  - CpとCpkを計算し中心ずれを解釈できる
  - 管理状態確認後に工程能力を評価する理由を説明できる
