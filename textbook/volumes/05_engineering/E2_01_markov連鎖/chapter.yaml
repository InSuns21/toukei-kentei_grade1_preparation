  - { id: E201-DEF-04, name: 既約性と周期 }
  - { id: E201-DEF-05, name: 生成行列 }
theorems:
  - { id: E201-THM-01, name: チャップマン・コルモゴロフ方程式 }
  - { id: E201-THM-02, name: 有限既約非周期連鎖の収束 }
