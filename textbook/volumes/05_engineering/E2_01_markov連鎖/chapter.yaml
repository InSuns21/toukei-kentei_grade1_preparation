id: "E2-01"
title: "マルコフ連鎖・マルコフ過程"
volume: "engineering"
status: revision
prerequisites:
  - P1-02
  - P2-01
  - F0-00
official_scope:
  - マルコフ連鎖
  - マルコフ過程
learning_objectives:
  - 確率過程とマルコフ性を条件付き確率で表せる
  - 遷移行列と多段階遷移確率を計算できる
  - 定常分布と極限分布を区別できる
  - 既約性・周期性・吸収状態を判定できる
  - 吸収確率と平均到達時間の再帰方程式を解ける
  - 連続時間マルコフ連鎖の生成行列を説明できる
definitions:
  - { id: E201-DEF-01, name: マルコフ性 }
