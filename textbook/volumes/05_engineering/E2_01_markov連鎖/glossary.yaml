chapter: "E2-01"
terms:
  - { term: 確率過程, meaning: 時刻ごとに定義された確率変数の集まり }
  - { term: マルコフ過程, meaning: 現在を条件にすると将来の分布がそれ以前の履歴に追加依存しない確率過程 }
  - { term: マルコフ連鎖, meaning: 離散時間で有限または可算状態を取るマルコフ過程 }
  - { term: マルコフ性, meaning: 現在を条件にすると将来の状態分布が過去の履歴に追加依存しない性質 }
  - { term: 遷移行列, meaning: 現在の状態から次の状態への条件付き確率を並べた行列 }
  - { term: 定常分布, meaning: 遷移後も変化しない確率分布 }
  - { term: 既約, meaning: どの状態からどの状態へも有限回で正の確率で到達できる性質 }
  - { term: 周期, meaning: ある状態へ戻れる時刻の最大公約数で表す周期性 }
  - { term: 吸収状態, meaning: 一度入ると確率1でその状態に留まる状態 }
  - { term: 生成行列, meaning: 連続時間マルコフ連鎖の瞬間遷移率を並べた行列 }
