chapter: "E2-02"
terms:
  - { term: ランダムウォーク, meaning: 確率的な増分を逐次加えて位置を作る確率過程 }
  - { term: ポアソン過程, meaning: 独立・定常増分を持ち区間件数がポアソン分布に従う計数過程 }
  - { term: 独立増分, meaning: 重ならない時間区間の増分が互いに独立である性質 }
  - { term: 定常増分, meaning: 増分分布が開始時刻ではなく区間長だけで決まる性質 }
  - { term: 到着間隔, meaning: 連続する二つの事象発生時刻の差 }
  - { term: 到着時刻, meaning: 第k番目の事象が発生する時刻 }
  - { term: 重ね合わせ, meaning: 独立なポアソン過程の件数を足して一つの過程にする操作 }
  - { term: 間引き, meaning: 各到着を独立に分類して別のポアソン過程を作る操作 }
  - { term: 破産問題, meaning: 吸収境界を持つランダムウォークの到達確率や到達時間を扱う問題 }
