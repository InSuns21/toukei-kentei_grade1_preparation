id: "E1-04"
title: "プロビット・非線形回帰・SVM"
volume: "engineering"
status: reviewed
prerequisites:
  - E1-01
  - L2-01
  - L1-01
  - F0-00
official_scope:
  - プロビット分析
  - 非線形回帰モデル
  - サポートベクターマシン
learning_objectives:
  - 問題設定から「2値確率・連続平均曲線・分類境界」のどれを求める問題か判定し、ロジット・プロビット・非線形回帰・SVMを使い分けられる
  - 潜在変数モデルからプロビット回帰の成功確率 p=Phi(eta) を導出できる
  - プロビットリンクとロジットリンクをCDF・潜在誤差・係数解釈の観点から比較できる
  - ベルヌーイ尤度からプロビット回帰のスコアを導出できる
  - プロビット回帰の限界効果が説明変数の値に依存することを計算できる
  - 非線形回帰を「説明変数に非線形」と「母数に非線形」に区別し、現象モデルの母数推定という目的を説明できる
  - 正規誤差の下で非線形最小二乗法が最尤法に一致することを示せる
  - Jacobianによる一次近似からGauss--Newton更新式を導出し、局所線形最小二乗として説明できる
  - 非線形回帰の初期値依存・局所識別・変換による誤差モデル変更を説明できる
  - 確率を推定する2値回帰と分類境界を直接最適化するSVMの目的の違いを説明できる
  - SVMの幾何学的マージンからハードマージン最適化問題を構成できる
  - Lagrange双対問題を導出し、サポートベクトルとKKT条件の関係を説明できる
  - ハードマージンが現実データで厳しすぎる理由を説明し、スラック制約から xi_i=max(0,1-y_i f_i) とhinge損失を導出できる
  - Cが「広いマージン」と「違反を減らすこと」の交換比率であることを説明できる
  - 特徴写像によって元空間の非線形境界を特徴空間の線形境界として表す具体例を説明できる
  - 双対問題に特徴ベクトルの内積しか現れないことからkernel trickを導き、カーネルSVMの判別関数を書ける
