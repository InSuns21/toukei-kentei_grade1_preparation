id: "E1-04"
title: "プロビット・非線形回帰・SVM"
volume: "engineering"
status: reviewed
prerequisites:
  - E1-01
  - L2-01
  - L1-01
  - F0-00
official_scope:
  - プロビット分析
  - 非線形回帰モデル
  - サポートベクターマシン
learning_objectives:
  - 潜在変数モデルからプロビット回帰の成功確率 p=Phi(eta) を導出できる
  - プロビットリンクとロジットリンクの共通点・相違点を説明できる
  - ベルヌーイ尤度からプロビット回帰のスコアを導出できる
  - プロビット回帰の限界効果が説明変数の値に依存することを計算できる
  - 非線形回帰を「説明変数に非線形」と「母数に非線形」に区別できる
  - 正規誤差の下で非線形最小二乗法が最尤法に一致することを示せる
  - Jacobianによる一次近似からGauss--Newton更新式を導出できる
  - 非線形回帰の初期値依存・局所識別・変換による誤差モデル変更を説明できる
  - SVMの幾何学的マージンからハードマージン最適化問題を構成できる
  - Lagrange双対問題を導出し、サポートベクトルとKKT条件の関係を説明できる
  - ソフトマージンSVMとhinge損失の関係を説明できる
  - カーネル法が内積を置換する操作であることを説明できる
