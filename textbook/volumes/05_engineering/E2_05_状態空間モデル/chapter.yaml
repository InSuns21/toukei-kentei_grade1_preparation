  - 時系列解析
learning_objectives:
  - 状態と観測を分ける理由を具体例から説明できる
  - 線形Gaussian状態空間モデルの状態方程式・観測方程式・ノイズを識別できる
  - 1期先予測平均・予測分散を導出できる
  - イノベーションとその分散を計算できる
  - 多変量正規分布の条件付き分布からKalman gainと更新式を導出できる
  - スカラー形と行列形のKalman filterを使い分けられる
  - filtering・prediction・smoothingの違いを説明できる
  - ARモデルや局所レベルモデルを状態空間表現へ書き換えられる
  - イノベーション分解からGaussian尤度を構成できる
