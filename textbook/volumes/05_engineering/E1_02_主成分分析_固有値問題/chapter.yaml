id: "E1-02"
title: "主成分分析・固有値問題"
volume: "engineering"
status: self_review
prerequisites:
  - E1-01
  - F0-00
official_scope:
  - 主成分分析
  - 固有値
  - 固有ベクトル
  - 分散共分散行列
  - 相関行列
learning_objectives:
  - 最大分散問題から主成分の固有値問題を導出できる
  - 固有値と単位固有ベクトルから主成分得点を構成できる
  - 主成分分散と主成分間共分散を導出できる
  - 寄与率と累積寄与率を固有値から計算できる
  - 上位主成分による再構成を直交射影として表せる
  - 再構成誤差が捨てた固有値の和になることを導出できる
  - 分散共分散行列主成分分析と相関行列主成分分析を使い分けられる
