chapter: "E1-02"
terms:
  - { term: 主成分分析, meaning: 分散が大きい直交方向を順に取り多変量データを少数の線形結合へ要約する方法 }
  - { term: 第1主成分, meaning: 単位長制約の下で射影分散を最大にする線形結合 }
  - { term: 主成分得点, meaning: 各観測を主成分方向へ射影した座標 }
  - { term: 寄与率, meaning: 全分散に対して1つの主成分分散が占める割合 }
  - { term: 累積寄与率, meaning: 上位複数主成分の寄与率を合計した割合 }
  - { term: 相関行列主成分分析, meaning: 各変数を標準化した後の相関行列に対して行う主成分分析 }
  - { term: 再構成, meaning: 保持した主成分得点を元の変数空間へ射影して近似データを作ること }
