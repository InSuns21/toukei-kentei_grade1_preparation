chapter: "E3-01"
terms:
  - { term: 応答, meaning: 実験で結果として観測し比較する量 }
  - { term: 因子, meaning: 応答への影響を調べるため実験者が設定する変数 }
  - { term: 水準, meaning: 因子が取る具体的な設定値やカテゴリ }
  - { term: 処理, meaning: 実験単位へ実際に与える因子水準の組合せ }
  - { term: 実験単位, meaning: 処理を独立に割り付けられる最小の単位 }
  - { term: 無作為化, meaning: 処理割付や実施順序を確率的に決め未知の外乱との系統的な重なりを避けること }
  - { term: 反復, meaning: 同じ処理を複数の独立な実験単位へ適用して誤差と推定精度を評価できるようにすること }
  - { term: 局所管理, meaning: 既知の大きな外乱について似た実験単位をまとめ内部で処理比較する原則 }
  - { term: ブロック化, meaning: 局所管理を実現するため似た実験単位をブロックへまとめること }
  - { term: 完全無作為化法, meaning: 同質とみなす実験単位へ処理を無作為に割り付ける基本設計 }
  - { term: 固定効果, meaning: 選んだ水準そのものの平均差を推測対象とする効果 }
  - { term: 変量効果, meaning: 水準を母集団からの無作為標本とみなし水準間分散を推測対象とする効果 }
  - { term: 混合効果, meaning: 固定効果と変量効果を同じモデルに含めた効果構造 }
  - { term: 乱塊法, meaning: 各ブロック内に比較対象の全処理を配置してブロック差を誤差から分離する設計 }
  - { term: 要因計画, meaning: 複数因子の水準組合せを用いて主効果と交互作用を同時に調べる設計 }
  - { term: 分割法, meaning: 因子によって無作為化できる実験単位の大きさが異なるとき一次単位と二次単位に分ける設計 }
  - { term: 一次誤差, meaning: 分割法で一次単位への無作為化から生じ一次因子の検定に用いる誤差 }
  - { term: 二次誤差, meaning: 分割法で二次単位への無作為化から生じ二次因子や交互作用の検定に用いる誤差 }
  - { term: 直交表, meaning: 因子列が釣り合い異なる列どうしの内積が0になるよう構成された実験割付表 }
  - { term: 一部実施要因計画, meaning: 完全要因計画の一部を規則的に選び実験数を減らす代わりに一部効果を別名にする設計 }
  - { term: 交絡, meaning: 二つ以上の効果が同じ割付パターンを持ちデータから分離できないこと }
  - { term: 別名関係, meaning: 一部実施要因計画で同じ列を共有して分離できない効果同士の関係 }
  - { term: 解像度, meaning: 一部実施要因計画の定義関係に現れる最短語長で低次効果の交絡程度を表す指標 }
  - { term: 交絡法, meaning: ブロック差を重要度の低い効果へ意図的に重ね重要な効果を守る設計法 }
  - { term: 応答曲面法, meaning: 連続因子と応答平均の関係を一次または二次多項式で近似し良い条件を探索する方法 }
  - { term: D最適計画, meaning: 情報行列の行列式を最大化し回帰係数の一般化分散を小さくする実験計画 }
