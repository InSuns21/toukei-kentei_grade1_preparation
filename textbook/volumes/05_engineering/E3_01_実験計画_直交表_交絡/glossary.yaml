chapter: "E3-01"
terms:
  - { term: 無作為化, meaning: 処理割付や実施順序を確率的に決めること }
  - { term: 反復, meaning: 同じ処理を複数の独立な実験単位へ適用すること }
  - { term: ブロック化, meaning: 似た実験単位をまとめてブロック内で処理を比較すること }
  - { term: 固定効果, meaning: 選んだ水準そのものの平均差を推測対象とする効果 }
  - { term: 変量効果, meaning: 水準を母集団からの無作為標本とみなし水準間分散を推測対象とする効果 }
  - { term: 乱塊法, meaning: 各ブロック内に全処理を配置してブロック差を誤差から分離する設計 }
  - { term: 直交表, meaning: 因子列が釣り合い互いに直交するよう構成された実験割付表 }
  - { term: 交絡, meaning: 二つの効果が同じ割付パターンを持ちデータから分離できないこと }
  - { term: 別名関係, meaning: 一部実施要因計画で同じ列を共有して分離できない効果同士の関係 }
