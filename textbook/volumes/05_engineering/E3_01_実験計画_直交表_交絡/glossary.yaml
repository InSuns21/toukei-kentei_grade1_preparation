chapter: "E3-01"
terms:
  - { term: 固定効果, meaning: 実験で選んだ特定水準そのものの差を推測対象とする効果 }
  - { term: 変量効果, meaning: 水準を母集団からの無作為標本とみなし水準間分散を推測対象とする効果 }
  - { term: ブロック化, meaning: 主目的でない既知の変動要因を群分けして誤差から分離する設計 }
  - { term: 直交表, meaning: 列間の水準組合せが均衡し効果を直交的に推定できる実験配列表 }
  - { term: 交絡, meaning: 二つの効果が同じ比較方向を持ちデータから分離できない状態 }
