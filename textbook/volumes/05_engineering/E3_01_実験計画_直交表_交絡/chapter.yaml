id: "E3-01"
title: "実験計画・直交表・交絡"
volume: "engineering"
status: self_review
prerequisites:
  - L1-03
official_scope:
  - 実験の計画と実施
  - 固定効果
  - 変量効果
  - 交絡因子
  - ブロック化
  - 直交表
  - 交絡法
learning_objectives:
  - 無作為化・反復・ブロック化を区別できる
  - 固定効果と変量効果を推測対象から判定できる
  - 乱塊法の平方和とF統計量を計算できる
  - 一元変量効果モデルの分散成分を推定できる
  - 2水準要因実験の主効果と交互作用を計算できる
  - L4直交表の列の直交性と積列を確認できる
  - 一部実施要因計画の別名関係を導ける
  - ブロック交絡の原理と代償を説明できる
