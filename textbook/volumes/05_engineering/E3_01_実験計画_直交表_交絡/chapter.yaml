id: "E3-01"
title: "実験計画・直交表・交絡"
volume: "engineering"
status: reviewed
prerequisites:
  - L1-03
  - L1-02
official_scope:
  - 実験の計画と実施
  - 固定効果
  - 変量効果
  - 交絡因子
  - ブロック化
  - 直交表
  - 交絡法
learning_objectives:
  - 実験単位・因子・水準・処理・反復を具体例から判定できる
  - フィッシャーの3原則である無作為化・反復・局所管理を設計目的から説明できる
  - 完全無作為化法と乱塊法を使い分け分散分析表を構成できる
  - 固定効果と変量効果を推測対象から判定し期待平均平方から分散成分を求められる
  - 2水準要因計画の主効果・交互作用・平方和を符号列から導ける
  - 分割法の一次誤差と二次誤差を区別して正しいF比を作れる
  - 直交表の列割付と交互作用列を判定できる
  - 一部実施要因計画の定義関係・別名関係・解像度を求められる
  - ブロック生成子から交絡構造と設計上の代償を説明できる
  - 応答曲面の最急上昇方向とD最適性を線形モデルから説明できる
