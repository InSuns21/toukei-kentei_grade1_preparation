chapter: "E2-03"
terms:
  - { term: 弱定常性, meaning: 平均が一定で自己共分散が時点ではなくラグだけに依存する性質 }
  - { term: 自己共分散関数, meaning: 同じ系列の異なる時点間の共分散をラグの関数として表したもの }
  - { term: 自己相関関数, meaning: 自己共分散をラグ0の分散で標準化した関数 }
  - { term: 偏自己相関, meaning: 中間ラグの線形な影響を調整した後の相関で、AR(h)のYule--Walker方程式を解いた最後の係数に等しい }
  - { term: コレログラム, meaning: ラグごとの標本自己相関または標本偏自己相関を棒で描いた診断図 }
  - { term: 白色雑音, meaning: 平均0・一定分散で異時点間が無相関な時系列 }
  - { term: innovation, meaning: その時点までの過去からは予測できない新しいショック。AR・MAモデルでは通常白色雑音で表す }
  - { term: 自己回帰過程, meaning: 現在値を過去の値と白色雑音の線形結合で表す過程 }
  - { term: 移動平均過程, meaning: 現在値を現在と過去の白色雑音の線形結合で表す過程 }
  - { term: Yule--Walker方程式, meaning: ARモデルの両辺と過去値の共分散を取って得る、自己回帰係数と自己共分散を結ぶ連立方程式 }
  - { term: 反転可能性, meaning: MAモデルのinnovationを現在・過去の観測値の収束する線形結合として一意かつ安定に復元できる性質 }
  - { term: ARIMA過程, meaning: 差分後の系列がARMA過程となる時系列モデル }
