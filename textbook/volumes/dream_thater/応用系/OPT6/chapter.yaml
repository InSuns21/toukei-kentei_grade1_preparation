id: "OPT6"
title: "KKT の幾何学的導出・制約想定"
volume: "foundations"
status: supplementary
prerequisites:
  - OPT5
  - OPT2
  - RA6A
official_scope: []
learning_objectives:
  - 活性集合・線形化錐を定義し、OPT3 の Bouligand 接錐を一般の実行可能集合で計算できる
  - 局所最適性から接錐の極錐条件を導ける
  - 接錐が線形化錐に含まれることを証明し逆包含が壊れる反例を説明できる
  - LICQ と MFCQ を定義から判定し、LICQ から MFCQ を導ける
  - MFCQ 下で接錐と線形化錐が一致する核心証明を追える
  - 線形化錐の極錐表示から KKT 乗数の存在を導ける
  - LICQ 下の KKT 乗数一意性を証明できる
  - 正則な等式制約で二階必要条件が Lagrangian の Hessian に現れる機構を説明できる
definitions:
  - { id: OPT6-DEF-01, name: 活性集合 }
  - { id: OPT6-DEF-03, name: 線形化錐 }
  - { id: OPT6-DEF-04, name: LICQ }
  - { id: OPT6-DEF-05, name: MFCQ }
theorems:
  - { id: OPT6-THM-01, name: 局所最適点の接方向条件 }
  - { id: OPT6-THM-02, name: 接錐と線形化錐の基本包含 }
  - { id: OPT6-THM-03, name: LICQならMFCQ }
  - { id: OPT6-THM-04, name: MFCQ下の接錐一致 }
  - { id: OPT6-THM-05, name: 線形化錐の極錐表示 }
  - { id: OPT6-THM-06, name: MFCQ下のKKT乗数存在 }
  - { id: OPT6-THM-07, name: LICQ下のKKT乗数の一意性 }
  - { id: OPT6-THM-08, name: 正則な等式制約に対する二階必要条件 }
canonical_examples: [上半平面の接錐, 放物線制約の線形化錐, x二乗制約の退化例, MFCQとLICQの比較]
