<svg data-layout-lint="strict" xmlns="http://www.w3.org/2000/svg" width="560" height="290" viewBox="0 0 560 290" role="img" aria-labelledby="title desc">
  <title id="title">離散損失分布の75% VaR</title>
  <desc id="desc">損失額-20円、10円、50円に確率0.5、0.3、0.2を持つ分布の累積関数。α=0.75に初めて達する位置が10円。</desc>
  <rect x="0.5" y="0.5" width="559" height="289" rx="10" fill="#ffffff" stroke="#bfc9d2"/>
  <g font-family="sans-serif" font-size="14" fill="#253547">
    <text x="22" y="24" font-weight="bold">非超過確率 F(L ≤ ℓ)</text>
    <text x="345" y="276">損失 ℓ（円）</text>
  </g>
  <g stroke="#9aa6b2" stroke-width="1.3">
    <line x1="64" y1="235" x2="516" y2="235"/>
    <line x1="64" y1="235" x2="64" y2="35"/>
  </g>
  <g fill="#253547" font-family="sans-serif" font-size="13" text-anchor="end">
    <text x="56" y="239">0</text>
    <text x="56" y="139">0.5</text>
    <text x="56" y="79">0.8</text>
    <text x="56" y="39">1</text>
  </g>
  <g fill="#253547" font-family="sans-serif" font-size="14" text-anchor="middle">
    <text x="140" y="258">-20</text>
    <text x="270" y="258">10</text>
    <text x="390" y="258">50</text>
  </g>
  <path d="M 64 235 H 140 V 135 H 270 V 75 H 390 V 35 H 510"
        fill="none" stroke="#14678a" stroke-width="4" stroke-linecap="square"/>
  <g fill="none" stroke="#a34428" stroke-width="2.5" stroke-dasharray="8 5">
    <line x1="64" y1="85" x2="513" y2="85"/>
  </g>
  <g fill="none" stroke="#39475c" stroke-width="2" stroke-dasharray="2 5">
    <line x1="270" y1="235" x2="270" y2="75"/>
  </g>
  <circle cx="270" cy="75" r="5.5" fill="#14678a" stroke="#ffffff" stroke-width="2"/>
  <g font-family="sans-serif" font-size="13" fill="#a34428">
    <text x="403" y="78" font-weight="bold">α = 0.75</text>
  </g>
  <g font-family="sans-serif" font-size="13" fill="#39475c">
    <text x="278" y="178">VaR = 10 円</text>
  </g>
</svg>
