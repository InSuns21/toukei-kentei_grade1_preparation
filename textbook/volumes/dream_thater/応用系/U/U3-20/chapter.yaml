id: "U3-20"
title: "Greeks とヘッジ誤差"
volume: "foundations"
status: supplementary
prerequisites: [U3-19, U3-18, U3-16, U3-14]
official_scope: []
learning_objectives:
  - 配当付き欧州型 call/put の Delta・Gamma・Vega・Theta・Rho を、偏微分変数・固定条件・単位から定義できる
  - 正規密度恒等式を再導出して Delta・Gamma・Vega・Theta・Rho の解析式をすべて証明できる
  - call/put parity を偏微分して put の Greeks と感応度差を検算できる
  - 中心差分の二次局所打切り誤差を Taylor 展開から導き、満期折れ目での失敗を説明できる
  - デルタを固定した short-call の株式・預金・配当の自己金融損益を算定できる
  - BSM PDE と二変数 Taylor 展開から日次ヘッジ残差の Gamma–Theta 主項を導出できる
  - 解析 Greeks・中心差分・1日後の再評価を同じ数値例で検算し、近似誤差を区別できる
  - Q下の価格付けの診断とP下の実リスク・費用を区別できる
definitions:
  - { id: U3-20-DEF-01, name: "Delta・Gamma・Vega・Theta・Rho" }
