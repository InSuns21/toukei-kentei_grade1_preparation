  - { id: U3-20-THM-02, name: "小区間デルタ・ヘッジ誤差の主項" }
canonical_examples:
  - "s=K=100,r=.05,q=.02,sigma=.20,tau=1 の call=9.227005508、Delta=0.586851146、Gamma=0.018950579、Vega=37.901158"
  - "先渡価値を直接偏微分して Gamma=Vega=0 と Theta・Rho の符号を確認"
  - "100円近傍の call 閉形式・接線・二次近似を比較"
  - "1日=1/252年で標準化増分 Z=0,1,2 の再評価 P&L と Gamma–Theta 主項を比較"
  - "満期の折れ目、sigma=0、非ゼロ配当の左端近似における適用条件"
