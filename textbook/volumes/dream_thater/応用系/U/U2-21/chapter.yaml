id: "U2-21"
title: "SLAM の確率模型：軌跡と地図の同時事後"
volume: "foundations"
status: supplementary
prerequisites:
  - U2-20
official_scope: []
learning_objectives:
  - 既知地図の自己位置推定と既知姿勢の占有地図更新を未知軌跡・未知地図の同時推定から区別できる
  - 有限状態の軌跡・時不変地図・運動核・観測核とその条件付き独立性を定義し直接確認できる
  - 初期独立性・運動と観測の仮定から結合分布の因子分解を全時刻で証明できる
  - 正の証拠とゼロ証拠を区別し軌跡・地図の同時事後を正規化できる
  - 同時事後から軌跡・地図・最終状態の周辺と軌跡条件付き地図を再構成できる
  - 二値観測が姿勢と地図に相関を生み周辺積近似が予測値を変えることを厳密な分数で示せる
  - 独立した新観測と観測記録の二重利用の違いを説明できる
  - 平面の共通剛体変換と相対運動・測距方位のゲージ不変性を証明できる
  - 相対観測のみの零方向・非正規化問題と基準固定・絶対事前の効果を計算できる
  - データ対応の周辺化と同時事後の有限候補計算量を説明できる
  - Python標準ライブラリの有限列挙で非対称事前と二観測の同時事後を検算できる
definitions:
  - { id: U2-21-DEF-01, name: 有限状態 SLAM の生成模型 }
  - { id: U2-21-DEF-02, name: 軌跡・地図の同時事後 }
  - { id: U2-21-DEF-03, name: 平面 SLAM の共通座標変換 }
theorems:
  - { id: U2-21-THM-01, name: SLAM の生成分布の因子分解 }
  - { id: U2-21-THM-02, name: 同時事後の周辺化と条件付き地図の分解 }
  - { id: U2-21-PROP-01, name: 観測が生む姿勢・地図の相関 }
  - { id: U2-21-PROP-02, name: 相対運動・測距方位のゲージ不変性 }
canonical_examples:
  - 四候補の対称二値センサーで同時事後9/20・1/20・1/20・9/20を正規化
  - 周辺はそれぞれ1/2でも条件付き共分散1/5となり新観測の予測41/50と1/2が食い違う
  - 非対称運動事前で事後27/40・3/40・1/40・9/40と共分散3/20を導出
  - 平面姿勢とランドマークを共通回転平行移動して測距・方位の不変性を確認
  - 一次元相対観測のHessian零方向(1,1)と位置事前追加後の行列式を検算
  - 二つの独立したセンサー試行で事後81/164・1/164・1/164・81/164を導出
  - 標準ライブラリPythonで厳密有理数の同時事後と周辺化を相互検算
