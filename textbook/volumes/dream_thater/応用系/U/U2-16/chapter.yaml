id: "U2-16"
title: "誘拐されたロボット：粒子の崩壊から回復する"
volume: "foundations"
status: supplementary
prerequisites:
  - U2-15
official_scope: []
learning_objectives:
  - 初期位置の誤り・突然の位置変化・観測外れ値を異なる生成機構として説明できる
  - 通常遷移と広域置き直しを混合した確率遷移核を構成し正規化を確認できる
  - 誘拐混合遷移による予測支持の下限と観測証拠が正となる条件を証明できる
  - 誘拐の事前確率と観測後の事象事後確率を区別して計算できる
  - 外れ値混合観測の条件付き確率を検算し混合事後を導出できる
  - 混合観測の事後を通常事後と予測 belief の凸結合として説明できる
  - 混合提案による広域粒子再注入と状態模型の変更を区別できる
  - 重要度補正の分母と被覆条件を有限和から証明できる
  - 再注入の取り逃がし確率と有限標本の全重みゼロを検算できる
  - 粒子数とESSを増やしても失われた支持を必ず回復できない反例を構成できる
  - Python 標準ライブラリで正確な有理数と固定乱数による被覆実験を再現できる
definitions:
  - { id: U2-16-DEF-01, name: 誘拐混合遷移 }
  - { id: U2-16-DEF-02, name: 外れ値混合観測模型 }
  - { id: U2-16-DEF-03, name: 広域混合提案と補正重み }
theorems:
  - { id: U2-16-PROP-01, name: 混合遷移による予測支持の回復 }
  - { id: U2-16-THM-01, name: 外れ値混合の事後分布 }
  - { id: U2-16-PROP-02, name: 広域再注入の被覆確率と有限粒子の限界 }
canonical_examples:
  - 二地点で恒等運動・全粒子 A のとき、N を増やしても B が現れず ESS=N になる
  - 誘拐確率 1/5 と一様置き直しによる予測 (9/10,1/10) と事後 (1/2,1/2)
  - 誘拐の事象事後 5/9 と位置 B の事後 1/2 の相違
  - 外れ値混合の尤度 (9/50,41/50)、事後 (81/122,41/122)
  - 予測 (3/4,1/4) に対する提案 (7/10,3/10) と重み (15/56,5/6)
  - 四粒子が B を全て取り逃す確率 6561/10000
  - 厳密な観測証拠は 1/10 なのに有限標本の全重みがゼロとなる反例
