id: "U4-19"
title: "因子中立・PCA・多銘柄残差戦略"
volume: "foundations"
status: supplementary
prerequisites: [U4-18, U4-15, U4-16, U4-10, LA5]
official_scope: []
learning_objectives:
  - ETFを代理因子とした多銘柄収益率モデルの負荷量・残差・残差共分散を次元と仮定付きで設定できる
  - 切片付きETF回帰の負荷量を最小二乗から導き標本内残差の直交性と標本外の違いを説明できる
  - ドル中立と複数因子中立を符号付き投資額の線形制約として判定できる
  - フルランクの制約行列から希望保有の直交射影を証明し非零解の存在条件を判定できる
  - 標本共分散の固有ベクトルからPCA得点と残差を作り残差平方和の最小性を証明できる
  - ETF因子とPCA方向の違いおよび因子数・学習窓・銘柄入替に対する感度を反例で示せる
  - 中立額を約定株数・現金勘定へ変換し固定株数の自己金融損益を計算できる
  - 推定残差分散と実現損益を区別し中立性や低標本分散から裁定を結論しない
  - 情報利用可能時刻とモデル選択を固定した標本外比較の手順を組み立てられる
definitions:
  - { id: U4-19-DEF-01, name: "多銘柄の線形因子モデルと残差" }
  - { id: U4-19-DEF-02, name: "複数因子中立とドル中立" }
  - { id: U4-19-DEF-03, name: "標本PCAの主成分と残差" }
  - { id: U4-19-DEF-04, name: "時刻整合した多銘柄の自己金融保有" }
theorems:
  - { id: U4-19-PROP-01, name: "ETF単一因子回帰の負荷量と直交残差" }
  - { id: U4-19-PROP-02, name: "中立部分空間への直交射影" }
  - { id: U4-19-PROP-03, name: "PCAによる残差平方和の最小化" }
  - { id: U4-19-PROP-04, name: "多銘柄の因子損益と残差損益の分解" }
canonical_examples:
  - 3銘柄とETF因子の負荷量・残差共分散の条件確認
  - ETFの4観測からの回帰傾き・切片・標本残差・分散自由度の検算
  - 3銘柄におけるドル中立と市場因子中立の連立計算
  - 希望額の直交射影と2銘柄では非零中立が存在しない例
  - 3つの直交主成分による得点・残差・固有値の直接計算
  - PCA因子数と窓の変更による中立性崩壊の反例
  - 株数・現金・再均衡・費用を区別した損益例
  - 因子負荷量の将来変化と中立残差の負の損益状態
