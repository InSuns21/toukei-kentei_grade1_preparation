  - { id: U3-24-PROP-02, name: "射影 SOR 固定点と相補条件" }
  - { id: U3-24-THM-01, name: "離散相補問題の一意可解性と残差による誤差上界" }
  - { id: U3-24-PROP-03, name: "非負係数の下での比較原理" }
canonical_examples:
  - "2元系 A=[[3/2,-1/4],[-1,3]]、f=(1,0)、g=(1/2,1/2) で継続・行使の両節点を直接確認"
  - "r=0.05、q=0.02、sigma=0.20 で a_i,c_i>=0 と rK-qs の符号を確認"
  - "S0=K=100円、T=1年、Smax=300円で PSOR と CRR(800) の価格、相補残差を照合"
