id: "U3-24"
title: "American オプションの障害問題を解く"
volume: "foundations"
status: supplementary
prerequisites: [U3-21, U3-23]
official_scope: []
learning_objectives:
  - 連続時間の American put 障害条件を残存時間へ変換し、行使と継続で不等式・等式が切り替わる理由を説明できる
  - 陰的三点差分の境界寄与を含む離散相補問題を導出し、節点ごとの原始・双対・相補条件を判定できる
  - 射影 SOR の成分更新式を導き、射影の意味、緩和係数と収束保証の区別を説明できる
  - 非負空間係数の下で離散相補問題の存在・一意性と事後誤差上界を証明できる
  - American put の株価0・有限上端の境界値、行使領域判定、境界打切りの影響を区別できる
  - 再現可能な Python 実装で CRR 二項木との価格照合、相補残差、停止誤差、計算量を検査できる
definitions:
  - { id: U3-24-DEF-01, name: "American 差分相補問題" }
  - { id: U3-24-DEF-02, name: "射影 SOR 更新" }
