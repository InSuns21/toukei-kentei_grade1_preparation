id: "U4-08"
title: "満期方向・ボラティリティ曲面の整合性"
volume: "foundations"
status: supplementary
prerequisites: [U4-07]
official_scope: []
learning_objectives:
  - 共通の原資産・観測時刻・受渡と満期別の金利・配当・フォワードをそろえられる
  - コール価格をフォワード規格化し同じ規格化行使価格で満期比較できる
  - 平均保存的価格木と有限Jensen不等式から規格化コールの満期非減少性を証明できる
  - 配当付き確定価格過程により固定行使価格の素朴な満期単調性を反証できる
  - Black価格の総分散微分を導出して満期方向の総分散必要条件を説明できる
  - 行使価格方向と満期方向の条件の違い、必要条件とモデル固有の十分構成を区別できる
  - bid/askの規格化区間から価格選択可能性を判定し中値違反と約定可能な裁定を区別できる
  - 気配の異常・欠測・時点不一致を監査し価格曲面全体の無裁定を安易に結論しない
definitions:
  - { id: U4-08-DEF-01, name: フォワード規格化コール価格 }
  - { id: U4-08-DEF-02, name: 満期間をつなぐ規格化価格木 }
  - { id: U4-08-DEF-03, name: インプライド総分散とボラティリティ曲面 }
  - { id: U4-08-DEF-04, name: 規格化気配区間と満期間の価格選択可能性 }
theorems:
  - { id: U4-08-THM-01, name: 平均保存的価格木における満期方向の必要条件 }
  - { id: U4-08-THM-02, name: 総分散表示の満期方向必要条件 }
  - { id: U4-08-PROP-01, name: 二満期の気配区間の必要条件 }
canonical_examples:
  - フォワード100円・110円で両方k=1の規格化価格を比較
  - 0.8/1.2から分岐する二段の平均保存的木と0.15から0.175への価格変化
  - 配当率log(10/9)の確定価格過程で固定行使価格80円のコールが10円から1円へ低下
  - 同じkで総分散0.04から0.06へ増えても年率ボラティリティは20%から17.32%へ低下
  - 中値は満期方向に逆転するがbid/ask区間では価格選択できる例
  - 二満期三行使価格の気配監査でbidがaskを超える入力異常と真の区間不整合を区別
