id: "U4-20"
title: "合併裁定：deal spreadは無リスクか"
volume: "foundations"
status: supplementary
prerequisites: [U4-10, U4-15]
official_scope: []
learning_objectives:
  - 現金買収条件・価格・時刻・調達倍率・費用をそろえ、表示deal spreadと期末純損益を区別できる
  - 成功・失敗の条件付き確率と二状態期待純損益を定式化し、損益分岐確率を証明できる
  - 正の期待純損益と全状態無リスク裁定の非同値を、損失する状態を挙げて説明できる
  - 現金買収の失敗時価格と調達倍率の変化による感度を検算できる
  - 株式交換比率に応じた対象株ロングと買い手株ショートの株数・現金勘定を導出できる
  - 株式対価ヘッジの成立時相殺と失敗時の残存リスクを自己金融損益から証明できる
  - 競合提案・契約条件変更の状態を追加し、確率の排他性と期待値を検算できる
  - 公表時刻・約定可能価格・資金・借株等の仮定と無リスク性の判定範囲を明示できる
definitions:
  - { id: U4-20-DEF-01, name: "現金買収のdeal spreadと分岐純損益" }
  - { id: U4-20-DEF-02, name: "成立確率に基づく条件付き純損益評価" }
  - { id: U4-20-DEF-03, name: "株式対価買収の固定交換比率ヘッジ" }
  - { id: U4-20-DEF-04, name: "複数結果のイベント損益表" }
theorems:
  - { id: U4-20-PROP-01, name: "現金買収の損益分岐成功確率" }
  - { id: U4-20-PROP-02, name: "株式対価ヘッジの成立時消去と失敗時残存リスク" }
  - { id: U4-20-PROP-03, name: "有限イベント表での裁定判定と期待値の非同値" }
canonical_examples:
  - 94円の現金買収から成功4.56円と失敗マイナス25.44円の分岐損益を導出
  - 成功確率80パーセントと90パーセントで期待純損益の符号が反転する検算
  - 成功確率の損益分岐0.848と正の期待値でも損失状態が残る反例
  - 交換比率0.5株に対する株数と初期現金2円の自己金融確認
  - 買い手株価が失敗時120円になる場合にショートの買戻し費用が増える反例
  - 競合提案110円を独立状態として追加した三状態分岐表
  - 交換比率の変更によって相殺できない株価変動が残る反例
