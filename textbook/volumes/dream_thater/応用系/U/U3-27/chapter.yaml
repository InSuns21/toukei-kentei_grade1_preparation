id: "U3-27"
title: "Itô 積分の数値近似と誤差の実測"
volume: "foundations"
status: supplementary
prerequisites: [STO6, STO7, U3-26]
official_scope: []
learning_objectives:
  - Brown 運動の独立増分を同一路に結合し、適合左端和を数値生成できる
  - STO6 の確率積分の構成・等長性を使用し、左端近似の二乗平均収束を条件付きで説明できる
  - Brown 運動を被積分過程とする場合の厳密積分、二次変動による誤差恒等式を導ける
  - 左端和の二乗平均誤差 T²/(2m) と二乗平均平方根誤差 T/sqrt(2m) を再計算できる
  - 両端算術平均和と実時刻中点和の違い、および STO7 の Itô–Stratonovich 換算を確認できる
  - 真の時刻中点和の Stratonovich 目標への二乗平均誤差 T²/(4m) を導出できる
  - 時間刻み m と独立標本数 n を別々に変え、離散化誤差と誤差推定の標本誤差を区別できる
  - 近似した同一 Brown 運動を基準に検査し、浮動小数点の桁落ちを離散化誤差と区別できる
definitions:
  - { id: U3-27-DEF-01, name: "適合左端和と同一路の積分誤差" }
