id: "U4-30"
title: "研究の再現と3種の裁定の最終判定"
volume: "foundations"
status: supplementary
prerequisites: [U4-02, U4-15, U4-20, U4-21, U4-22, U4-23, U4-24, U4-26, U4-27, U4-28, U4-29]
official_scope: []
learning_objectives:
  - 入手可能時刻・観測時刻・データ版を区別して判断時点の再現可能なスナップショットを構成できる
  - 未来データ追記に対する凍結規則の判定不変性を証明し適用条件を説明できる
  - 同一ペイオフ二商品について買値・売値・費用・容量・借株・担保を照合し全状態の利得証明書を再計算できる
  - 静的裁定の単一取引証明と市場全体の裁定不在証明を区別できる
  - ペアの4約定の現金収支恒等式を導き学習・未使用期間の費用控除後損益を別々に計算できる
  - 関係解消・事後閾値改訂による偽陽性を反証し共和分の有限標本限界を説明できる
  - 現金買収の成功・失敗分岐と期待値・損益分岐確率・損失予算を独立に判定できる
  - 同じ監査レコードへ3種の判定を記載し証明・予測・仮定確率を混同せず結論を記述できる
  - 再現可能な合成データと標準ライブラリの検算プログラムを実行し想定外の仮定を把握できる
definitions:
  - { id: U4-30-DEF-01, name: "時点整合した再現記録" }
  - { id: U4-30-DEF-02, name: "期限・容量付き二商品裁定証明書" }
  - { id: U4-30-DEF-03, name: "一回の固定数量ペアの約定純損益" }
  - { id: U4-30-DEF-04, name: "イベント分岐と損失予算の同時判定" }
  - { id: U4-30-DEF-05, name: "三層の研究判定" }
theorems:
  - { id: U4-30-PROP-01, name: "凍結規則の過去判定は未来の追記に依存しない" }
  - { id: U4-30-PROP-02, name: "同一ペイオフ二商品の固定取引の全状態利得" }
  - { id: U4-30-PROP-03, name: "固定数量ペアの現金収支恒等式" }
canonical_examples:
  - 同一終端ペイオフ100円の商品Aの買値97円とBの売値101円で費用控除後2.5円の利得を証明する
  - 古い売値101円を執行可能な96円に直すと利得がマイナス2.5円になる
  - ペアの学習4取引で4円利益が保留一取引で6円損失となる
  - 合併成功確率仮定0.9で期待3円が正でも失敗時42円損失が予算30円を超える
  - 標準ライブラリだけで合成データの全シナリオ数値を再現する
