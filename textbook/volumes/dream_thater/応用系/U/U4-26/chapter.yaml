id: "U4-26"
title: "生存者・価格修正・情報時刻の監査"
volume: "foundations"
status: supplementary
prerequisites: [U4-11, U4-22, U4-23, U4-25]
official_scope: []
learning_objectives:
  - 期首ユニバースと事後生存銘柄集合を区別し生存選択による平均収益率の歪みを混合恒等式から計算できる
  - 上場廃止時の現金回収・不確定回収を欠測や終値据置と区別できる
  - 株式分割時の株数と現金配当を同一単位で換算し総収益率の不変性を証明できる
  - 有効時刻・公表時刻・受信時刻・訂正版を分け決定時点のas-ofスナップショットを復元できる
  - 時点整合データと決定時点に確定した規則だけが先読み防止に十分な情報条件であることを証明できる
  - 欠測値を根拠なく補完せず非負期首重みを使って収益率の条件付き上下界を導ける
  - 売値・買値・約定時刻・費用を使い中値評価と実行可能な純損益を区別できる
  - 同一ルールの先読みあり・なし・費用込み結果を通しで比較し偽利益を定量化できる
definitions:
  - { id: U4-26-DEF-01, name: "意思決定時点のユニバースと事後生存集合" }
  - { id: U4-26-DEF-02, name: "分割・配当を含む保有期間収益率" }
  - { id: U4-26-DEF-03, name: "時点整合スナップショット" }
  - { id: U4-26-DEF-04, name: "欠測収益率と実行可能価格の区別" }
theorems:
  - { id: U4-26-PROP-01, name: "生存銘柄平均と全銘柄平均の差" }
  - { id: U4-26-PROP-02, name: "株数換算と配当換算による総収益率の不変性" }
  - { id: U4-26-PROP-03, name: "時点整合入力からの先読み防止" }
  - { id: U4-26-PROP-04, name: "欠測収益率を含む固定重みポートフォリオの範囲" }
canonical_examples:
  - 生存2銘柄の平均7.5パーセントと廃止銘柄を含む平均マイナス8.333パーセント
  - 分割前100円と分割後新株52円および配当2円から総収益率6パーセント
  - 前日指標の訂正版が10時には受信未了で初期版だけ選択できる例
  - 廃止回収金の欠測をゼロにせず仮定付き収益率範囲を計算する例
  - 訂正値先読みの純損益プラス1円が適正スナップショットでマイナス3円になる例
