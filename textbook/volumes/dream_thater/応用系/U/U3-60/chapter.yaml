id: "U3-60"
title: "TWAP／VWAP／POV と基準執行スケジュール"
volume: "foundations"
status: supplementary
prerequisites: [U3-59]
official_scope: []
learning_objectives:
  - 親注文の目標配分・実約定・未約定と出来高上限を区別して計算できる
  - TWAP の時間均等配分と予測出来高による VWAP 型予定配分を定義できる
  - 実現市場 VWAP と開始前に利用可能な出来高予測を区別できる
  - POV の因果的な観測後発注と総執行上限・未約定式を証明できる
  - 固定配分の残数量恒等式を証明し流動性上限の影響を計算できる
  - 自分の平均約定価格と実現市場 VWAP の乖離を二項に分解できる
  - 同じ市場経路で三政策の IS・現金・在庫・未執行を計算できる
  - Python実験で最終区間の出来高変更が先行POV注文を変えないことを検算できる
