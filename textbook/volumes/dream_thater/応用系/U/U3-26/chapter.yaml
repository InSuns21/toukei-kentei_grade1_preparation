id: "U3-26"
title: "リスク中立期待値の Monte Carlo 推定"
volume: "foundations"
status: supplementary
prerequisites: [MC1, U3-14, U3-15, U3-17, U3-18, U3-19, U3-25]
official_scope: []
learning_objectives:
  - リスク中立 GBM の厳密な満期標本を独立に発生させ、割引 payoff の標本平均から価格を推定できる
  - MC1 の不偏性・分散命題を金融の割引支払額に適用し、標本数の平方根に反比例する標準誤差を説明できる
  - 割引支払額の標本分散の有限標本不偏性を証明し、標本標準偏差と推定標準誤差を区別できる
  - MC1 の CLT・大数の法則を欧州 call の正規近似区間へ適用し、被覆率の意味を説明できる
  - Call の二次モーメントを正規尾積分から導き、Black–Scholes 真値との数値照合ができる
  - MC1 のバイアス・分散分解を時間平均の近似へ代入し、標本数だけではバイアスが消えないことを示せる
  - 連続平均 Asian の右端離散近似の厳密期待値、誤差の符号と O(1/m) 上界を証明できる
  - 固定シード Python で標準誤差・反復被覆率・時間分割誤差を再現できる
definitions:
  - { id: U3-26-DEF-01, name: "リスク中立割引支払標本と価格の標本平均" }
theorems:
  - { id: U3-26-PROP-02, name: "割引支払額の標本分散の有限標本不偏性" }
  - { id: U3-26-PROP-03, name: "GBM 欧州 call の漸近95%価格区間" }
  - { id: U3-26-PROP-05, name: "零行使価格 Asian の右端平均バイアス" }
canonical_examples:
