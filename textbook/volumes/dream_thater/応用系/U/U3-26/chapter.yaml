id: "U3-26"
title: "リスク中立期待値の Monte Carlo 推定"
volume: "foundations"
status: supplementary
prerequisites: [U3-14, U3-15, U3-17, U3-18, U3-19, U3-25]
official_scope: []
learning_objectives:
  - リスク中立 GBM の厳密な満期標本を独立に発生させ、割引 payoff の標本平均から価格を推定できる
  - 標本平均の不偏性・分散を証明し、標本数の平方根に反比例する標準誤差を説明できる
  - 不偏標本分散を導出し、標本標準偏差と推定標準誤差を区別できる
  - 有限正分散の独立同分布標本に対する CLT と大数の法則を使い、漸近信頼区間と被覆率の意味を説明できる
  - Call の二次モーメントを正規尾積分から導き、Black–Scholes 真値との数値照合ができる
  - 離散化バイアスと Monte Carlo 標本誤差の MSE 分解を証明し、標本数だけではバイアスが消えないことを示せる
  - 連続平均 Asian の右端離散近似の厳密期待値、誤差の符号と O(1/m) 上界を証明できる
  - 固定シード Python で標準誤差・反復被覆率・時間分割誤差を再現できる
definitions:
  - { id: U3-26-DEF-01, name: "独立な割引支払額による Monte Carlo 推定量" }
  - { id: U3-26-DEF-02, name: "不偏標本分散・推定標準誤差" }
  - { id: U3-26-DEF-03, name: "時間離散化バイアス" }
theorems:
  - { id: U3-26-PROP-01, name: "独立標本平均の不偏性・分散" }
  - { id: U3-26-PROP-02, name: "標本分散が不偏となる理由" }
  - { id: U3-26-PROP-03, name: "標本標準誤差による漸近95%信頼区間" }
  - { id: U3-26-PROP-04, name: "標本分散と時間バイアスの平均二乗誤差分解" }
  - { id: U3-26-PROP-05, name: "非配当 K=0 Asian の右端平均バイアス" }
