id: "U4-10"
title: "無裁定と統計的裁定の論理的な距離"
volume: "foundations"
status: supplementary
prerequisites: [U4-09, F0-00P3]
official_scope: []
learning_objectives:
  - 全状態で非負の純損益と確率分布に関する期待純損益の主張を区別できる
  - 初期資金、資金調達、費用、状態集合をそろえて一期間純損益を定義できる
  - 勝率・期待値・分散・一期間Sharpe比を実際の二状態分布から検算できる
  - 高勝率でも期待値が負になる閾値条件を証明できる
  - 現実確率の期待利益が正でも無裁定と両立する例を状態価格から検証できる
  - 取引ルール、予測対象、母集団、評価時点、費用を事前に固定できる
  - 独立同分布と既知の損益上限を使った片側平均判定と第一種過誤保証を導出できる
  - 平均・Sharpe比が同じでも勝率や最大損失が異なる例を検算できる
  - データ選択・将来情報混入・分布変化で検証の仮定が壊れる理由を説明できる
definitions:
  - { id: U4-10-DEF-01, name: 全状態裁定と一期間純損益 }
  - { id: U4-10-DEF-02, name: 勝率・期待純損益・純損益の Sharpe 比 }
  - { id: U4-10-DEF-03, name: 事前固定した統計的利益仮説と反証条件 }
  - { id: U4-10-DEF-04, name: 独立同分布の検証標本 }
theorems:
  - { id: U4-10-PROP-01, name: 二状態取引の期待利益の閾値 }
  - { id: U4-10-PROP-02, name: 無裁定と正の現実期待利益の両立 }
  - { id: U4-10-THM-01, name: 固定した戦略に対する有界損益の片側判定 }
canonical_examples:
  - 正確な純損益を全状態で検算し初期純資金ゼロと取引可能性を確認する
  - 勝率90パーセントでも期待純損益がマイナス1.1円になる分布
  - 正の状態価格と現実確率を区別し期待利益と無裁定を両立させる二状態市場
  - 費用で期待利益が反転する取引と同じSharpe比で異なる裾の比較
  - 公平な硬貨の独立な二回の結果と同じ結果のコピーから独立同分布を区別
  - 固定ルール・独立同分布・既知損益上限に基づく保守的片側検定
problem_patterns:
