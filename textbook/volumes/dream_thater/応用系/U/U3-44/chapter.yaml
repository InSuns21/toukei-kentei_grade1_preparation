id: "U3-44"
title: "損益分布・リスクファクター・P と Q"
volume: "foundations"
status: supplementary
prerequisites: [U3-01, U3-15, U3-42, U3-43]
official_scope: []
learning_objectives:
  - 保有期間とリスクファクターの状態空間・可測シナリオを指定できる
  - 固定保有数量と時点別評価関数からシナリオごとの全再評価を計算できる
  - 途中の純現金収支と資金調達の比較倍率を入れ、損失の符号を正しく定義できる
  - 価格付け測度Qと実確率Pの役割を区別して株式・オプションの数値例で検算できる
  - 有限状態の損失分布・非超過確率・平均損失を計算できる
  - Qの価格付け条件からQ平均損失が0になる十分条件を証明できる
  - 有限状態でPとQの確率比を用いた期待値変換を証明・検算できる
  - 株式と債券の複数ファクターを用い残存満期を進めて再評価できる
definitions:
  - { id: U3-44-DEF-01, name: "保有期間とリスクファクター・シナリオ" }
