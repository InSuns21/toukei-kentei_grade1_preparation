  - { id: U3-44-DEF-03, name: "保有期間の基準額付き損失" }
  - { id: U3-44-DEF-04, name: "損失予測の P と価格付けの Q" }
  - { id: U3-44-DEF-05, name: "有限状態の損失分布" }
theorems:
  - { id: U3-44-PROP-01, name: "価格付け測度での基準額付き平均損失" }
  - { id: U3-44-PROP-02, name: "有限状態での P/Q 再重み付け" }
canonical_examples:
  - "二項株価100→120/80、R=1、P(U)=3/4とQ(U)=1/2の比較"
  - "株式1/2株とcall1契約の全再評価：現在60円、期末80/40円、損失-20/20円"
  - "2年物債券を1年保有した後の残存1年物金利による複数ファクター評価"
  - "3状態の株式とcallで損失の実確率と評価測度の平均を独立に照合"
