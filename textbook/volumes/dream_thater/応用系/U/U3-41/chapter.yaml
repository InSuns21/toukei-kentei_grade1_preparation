id: "U3-41"
title: "ジャンプ拡散と非完備市場"
volume: "foundations"
status: supplementary
prerequisites: [U3-04, U3-15, U3-26, U3-40]
official_scope: []
learning_objectives:
  - Poisson 過程の強度・独立増分・短時間での0回と1回の確率を計算できる
  - Brown 運動と独立な印付き Poisson ジャンプを持つ正の株価を明示式と積分形で記述できる
  - 倍率の平均から補償ドリフトを導出し、配当を含む割引総収益のマルチンゲール性を証明できる
  - ジャンプの有無で短時間期待値を分解し、非局所価格項を持つ PIDE を導ける
  - 独立な Brown リスクとジャンプリスクによる有界請求権の非複製を二次共変動で証明できる
  - Brown 密度と Poisson 尤度比から複数の同値マルチンゲール測度を構成できる
  - 対数正規ジャンプ条件付き分布から欧州 call の Poisson 混合式と非負打切り境界を証明できる
  - 厳密終端標本で Monte Carlo 推定し、混合式・標準誤差・マルチンゲール条件を比較できる
  - 有限3状態モデルで複製不能性と評価用確率の非一意性を直接検証できる
definitions:
  - { id: U3-41-DEF-01, name: "Poisson ジャンプ回数過程" }
  - { id: U3-41-DEF-02, name: "独立印付き Poisson ジャンプ拡散モデル" }
theorems:
