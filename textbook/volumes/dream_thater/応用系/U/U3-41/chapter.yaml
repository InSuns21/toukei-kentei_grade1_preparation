  - { id: U3-41-PROP-02, name: "ジャンプ拡散の価格 PIDE" }
  - { id: U3-41-THM-01, name: "Brown リスクとジャンプリスクが共存する市場の非完備性" }
  - { id: U3-41-PROP-03, name: "非一意な同値マルチンゲール測度" }
  - { id: U3-41-PROP-04, name: "対数正規ジャンプ倍率による call の Poisson 混合" }
