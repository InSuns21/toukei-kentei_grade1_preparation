id: "U3-47"
title: "正規・t 分布と分散共分散法による VaR/ES"
volume: "foundations"
status: supplementary
prerequisites: [U3-46, U3-45, U3-44]
official_scope: []
learning_objectives:
  - 線形因子損益の符号・単位・確定費用を固定し平均と分散共分散行列から損失分散を導ける
  - 多変量正規因子の線形射影を証明し正規損失のVaRとESを密度積分から導ける
  - Student tの自由度ごとの可積分性・分散条件と尺度・標準偏差を区別できる
  - 共通尺度混合の多変量tとその線形射影・共分散行列を導ける
  - t損失のVaRとESを上側尾部積分から導き正規モデルと同一分散で比較できる
  - 数値積分と有限標本推定を使って閉形式を検算しモデル誤差と標本誤差を区別できる
