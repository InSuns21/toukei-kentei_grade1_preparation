id: "U3-36"
title: "Least-squares Monte Carlo で American を評価"
volume: "foundations"
status: supplementary
prerequisites: [U3-06, U3-07, U3-14, U3-21, U3-26]
official_scope: []
learning_objectives:
  - GBM の Bermudan put で条件付き継続価値と一期間割引の後退帰納を再構成できる
  - LSM 回帰の基底・目的値・標本集合を定義し正規方程式と条件付き期待値の射影を証明できる
  - イン・ザ・マネー限定回帰と階数不足の条件を説明できる
  - 予測継続価値から先を見ない行使方策を構成し停止時刻性を証明できる
  - 独立評価の条件付き不偏性と Bermudan 価格への下界性を証明できる
  - 学習方策の損失・評価標本誤差・連続行使時刻との差を区別できる
  - 二期間 put の厳密計算と GBM の独立学習評価プログラムを比較し数値上限下限を慎重に解釈できる
definitions:
  - { id: U3-36-DEF-01, name: "Bermudan put の条件付き継続価値" }
  - { id: U3-36-DEF-02, name: "LSM 継続価値回帰" }
  - { id: U3-36-DEF-03, name: "学習済み LSM 行使方策" }
theorems:
  - { id: U3-36-PROP-01, name: "最小二乗の正規方程式と条件付き射影" }
  - { id: U3-36-PROP-02, name: "独立経路上の LSM 方策は停止時刻" }
  - { id: U3-36-PROP-03, name: "独立評価の条件付き不偏性と価格下界" }
canonical_examples:
  - "2期間二項 put: 時刻1上枝は継続・下枝は行使、American 1175/147円とEuropean 925/147円"
  - "2点1次基底の最小二乗と正規方程式"
  - "固定シードGBMの訓練40000経路・独立評価60000経路・CRR木比較"
