id: "U4-23"
title: "取引費用・借株・資金調達と損益分岐"
volume: "foundations"
status: supplementary
prerequisites: [U4-22, U4-03, U4-16]
official_scope: []
learning_objectives:
  - 中値・買値・売値と取引方向を揃え一株手数料と固定費を二重計上せずに計算できる
  - 空売り収入の拘束現金と自由現金を分け借入・運用利息と借株料を別々に計算できる
  - 税支払を契約・法域による外生的現金フローとして損益帳簿に追加できる
  - 費用付き自己金融帳簿の多時点損益恒等式を導出し再均衡の現金と時価を照合できる
  - 固定株数の往復取引で中値粗利益から費用を控除し終端現金を検算できる
  - spreadの損益分岐閾値と数量に比例する費用・固定費の効果を証明できる
  - 回転額と比例費用の恒等式を導き粗利益と純利益の順位が逆転する例を作れる
  - 保有期間と金利・借株料・借株拘束率の感度を独立に評価し無リスク利益と区別できる
definitions:
  - { id: U4-23-DEF-01, name: "中値評価と方向別約定費用" }
  - { id: U4-23-DEF-02, name: "拘束現金・調達利息・借株料" }
  - { id: U4-23-DEF-03, name: "摩擦を含む売買後の現金・純資産" }
  - { id: U4-23-DEF-04, name: "費用控除後の損益分岐spread変化" }
  - { id: U4-23-DEF-05, name: "中値取引金額による回転額" }
theorems:
  - { id: U4-23-PROP-01, name: "費用控除後の多時点損益恒等式" }
  - { id: U4-23-PROP-02, name: "往復取引の実現純損益" }
  - { id: U4-23-PROP-03, name: "株数換算した損益分岐条件と固定費の効果" }
  - { id: U4-23-PROP-04, name: "比例費用と回転額による利益条件" }
canonical_examples:
  - 中値100円の買値101円売値99円と手数料0.2円で往復取引の費用24円
  - ロング1株ショート1株の拘束現金と自由現金を区別した借入利息
  - 費用込み自己金融の中値時価と取引後現金の照合
  - 2銘柄30日間のgross6円がnet2.094円へ縮小する例
  - gross2円の勝ち取引が費用3.906円でnet赤字となる反例
  - spread損益分岐と固定費の数量換算
  - 反転売買で回転額が増え粗利益順位と純利益順位が逆転する例
  - 固定期間8日の期待純損益最適化と拘束率感度
