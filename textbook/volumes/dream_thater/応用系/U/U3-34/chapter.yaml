id: "U3-34"
title: "準 Monte Carlo と次元削減"
volume: "foundations"
status: supplementary
prerequisites: [U3-14, U3-26, U3-29, U3-33]
official_scope: []
learning_objectives:
  - リスク中立GBMの離散観測価格を単位立方体上の一様積分へ変換しQMCで近似できる
  - 一次元星食い違い度を直接計算し滑らかな関数の積分誤差上界を証明できる
  - 乱択QMCの周辺一様性と配置間独立性を区別して不偏性・反復標準誤差を導ける
  - Brownian bridgeによる終端先行の有限経路生成と条件付き平均・分散を導出できる
  - 橋生成と前進生成のBrown運動共分散が一致することを計算で検証できる
  - 第一座標の分散寄与率をGBM割引満期株式で厳密計算し実効次元と物理次元を区別できる
  - 同費用の独立MC・前進スクランブルSobol・橋スクランブルSobolを反復実験できる
  - RQMCの推定分散と監視時点・契約仕様の離散化差を別々に評価できる
