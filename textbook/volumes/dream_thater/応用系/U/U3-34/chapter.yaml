  - { id: U3-34-PROP-02, name: "独立乱択QMCの不偏性と反復標準誤差" }
  - { id: U3-34-PROP-03, name: "橋生成が Brown 運動の有限次元分布を保つ" }
  - { id: U3-34-PROP-04, name: "割引満期株式の第一座標寄与率" }
  - { id: U3-34-PROP-05, name: "乱択QMCの分散と監視仕様の偏り" }
