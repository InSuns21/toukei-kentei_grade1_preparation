  - { id: U3-66-PROP-01, name: "状態依存清算のHJBと境界条件" }
  - { id: U3-66-PROP-02, name: "状態依存の最適フィードバック候補" }
  - { id: U3-66-PROP-03, name: "一定係数・全量清算のAlmgren–Chrissへの縮退" }
canonical_examples:
  - "良い流動性Gと悪い流動性Bを観測する二状態二期間の政策表"
  - "在庫2株・上昇シグナルGでは待機、下落シグナルBでは1株売却"
  - "一定係数のRiccati方程式とsinh在庫曲線の照合"
