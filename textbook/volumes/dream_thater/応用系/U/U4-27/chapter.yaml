id: "U4-27"
title: "時系列のwalk-forwardと漏洩防止"
volume: "foundations"
status: supplementary
prerequisites: [U4-10, U4-16, U4-22, U4-26]
official_scope: []
learning_objectives:
  - 意思決定時刻・ラベルの結果期間・結果利用可能時刻を区別し時点別に学習可能な標本を判定できる
  - 学習・内側選定・外側テスト・最終保留テストの役割を分け時系列順送り検証を設計できる
  - 利用可能情報に閉じた推定・選定・予測の因果性を証明しその射程を説明できる
  - 保有期間が重なるラベルの結果期間を半開区間の不等式で判定しpurgingを実施できる
  - 回顧的交差検証における特徴量のlookbackに応じてembargoを導出しwalk-forwardとの違いを説明できる
  - ランダム分割によるイベント結果の再利用が二乗誤差を楽観化する反例を再計算できる
  - 異なる行数の外側テスト損失を行数で重み付けし正しく集計できる
  - 閾値をテストで選び直さず同時保有・費用・再学習時刻・最終保留を記録して検証できる
definitions:
  - { id: U4-27-DEF-01, name: "意思決定標本とラベルの結果期間" }
  - { id: U4-27-DEF-02, name: "凍結した選定手順のwalk-forward" }
  - { id: U4-27-DEF-03, name: "ラベル期間に基づくpurging" }
  - { id: U4-27-DEF-04, name: "固定lookback幅のembargo" }
  - { id: U4-27-DEF-05, name: "非重複外側テストの標本平均損失" }
theorems:
  - { id: U4-27-PROP-01, name: "時刻を守る学習・選定・予測は先読みしない" }
  - { id: U4-27-PROP-02, name: "結果期間の重複判定式" }
  - { id: U4-27-PROP-03, name: "固定lookbackに対する隔離幅の十分性" }
  - { id: U4-27-PROP-04, name: "外側テスト平均の行数重み付き集計" }
canonical_examples:
  - 日8と日9の3日先ラベルの利用可否を日12の寄付きで比較
  - 学習1〜8日・選定12〜15日・テスト19〜21日の凍結した時系列分割
  - ラベル期間(5,9]と(8,11]の重複と境界接触の違い
  - 固定lookback3日とembargoの境界での特徴量時刻の非重複
  - 重複イベントIDの記憶でランダム分割誤差ゼロと順送り誤差1
  - 外側窓の行数2と3の損失平均3.2と窓平均3の差
