id: "U4-22"
title: "売買シグナルを自己金融の保有量に変換"
volume: "foundations"
status: supplementary
prerequisites: [U4-15, U4-19, U4-21]
official_scope: []
learning_objectives:
  - シグナル時刻・注文時刻・約定時刻と情報集合を区別し未約定損益を排除できる
  - 多銘柄の自己金融現金更新式と純資産を定義から導出できる
  - 自己金融な多時点戦略の保有損益恒等式を証明し株数の時点添字を正しく使える
  - ロング・ショート方向と係数と総保有額制約を約定時の株数・現金へ変換できる
  - 約定遅延を考慮した建玉と手仕舞いの実現純損益を検算できる
  - 再均衡に伴う株数と現金の変化から純資産不変性を証明できる
  - 方向反転と複数時点の取引帳簿を通算し終端現金と区間損益を照合できる
  - 予測的中・自己金融・無リスク裁定・執行可能性が別の主張であると反例で説明できる
definitions:
  - { id: U4-22-DEF-01, name: "シグナル・注文・約定の情報時刻" }
  - { id: U4-22-DEF-02, name: "約定後の自己金融保有と現金勘定" }
  - { id: U4-22-DEF-03, name: "方向シグナルからの目標株数" }
  - { id: U4-22-DEF-04, name: "約定価格での再均衡" }
theorems:
  - { id: U4-22-PROP-01, name: "自己金融帳簿の損益恒等式" }
  - { id: U4-22-PROP-02, name: "遅延約定を含む一回の建玉・手仕舞いの損益" }
  - { id: U4-22-PROP-03, name: "再均衡時の純資産不変と区間損益の総和" }
canonical_examples:
  - シグナル後に103円で約定し95円で手仕舞う際の予測的中と実現損失
  - 2資産のロング1株ショート2株と現金から純資産を検算
  - 多銘柄自己金融の損益恒等式を一時点ごとに展開
  - 2単位のspreadと総保有額制約から約定株数と初期現金を計算
  - 104円49円で空売りを買い戻す再均衡前後の純資産の一致
  - 遅延約定と方向反転を通した終端現金と区間損益の一致
