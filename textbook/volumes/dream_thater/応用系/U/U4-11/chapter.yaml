id: "U4-11"
title: "価格・対数価格・収益率の定常性を分ける"
volume: "foundations"
status: supplementary
prerequisites: [U4-10]
official_scope: []
learning_objectives:
  - 価格差・対数価格・対数収益率・単純収益率の単位と変換を検算できる
  - 配当・株式分割を含む価格データの前処理と経済的収益率を区別できる
  - 強定常性と弱定常性の仮定を定義から点検し二次モーメントの役割を説明できる
  - 決定論的トレンド除去と階差の意味を計算で区別できる
  - AR(1)の定常解を構成し分散・自己共分散・自己相関を導出できる
  - ランダムウォークの水準の分散増大と階差の定常性を証明できる
  - 標本自己相関を計算し母集団の定常性との違いを説明できる
  - 独立なランダムウォーク水準の高相関が統計的利益の証明でないことを説明できる
definitions:
  - { id: U4-11-DEF-01, name: 価格・対数価格・収益率 }
  - { id: U4-11-DEF-02, name: 強定常性と弱定常性 }
  - { id: U4-11-DEF-03, name: 階差と決定論的線形トレンド }
  - { id: U4-11-DEF-04, name: 標本自己相関 }
theorems:
  - { id: U4-11-PROP-01, name: 有限二次モーメントのある強定常過程 }
  - { id: U4-11-PROP-02, name: 時点共通の変換で保たれる強定常性 }
  - { id: U4-11-THM-01, name: 安定な AR(1) の定常解と自己相関 }
  - { id: U4-11-PROP-03, name: ランダムウォークの非定常水準と定常階差 }
  - { id: U4-11-PROP-04, name: 線形トレンドの標本自己相関 }
canonical_examples:
  - 価格100円から110円への単純・対数収益率と表示単位変更
  - 二値独立同分布系列の強・弱定常性と時変平均の反例
  - 係数1/2のAR(1)の分散・自己相関
  - ランダムウォークの共分散と定常階差
  - 直線標本の標本自己相関が1へ近づく計算
  - 2対1株式分割で生データに発生する人工的なジャンプ
