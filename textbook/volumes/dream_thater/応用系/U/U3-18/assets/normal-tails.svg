<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 326" data-layout-lint="strict" role="img" aria-labelledby="tail-title tail-desc">
<title id="tail-title">Black–Scholes の二つの正規尾積分</title>
<desc id="tail-desc">左パネルは標準正規密度の境界 -d₂ から右の領域を塗り、面積は Phi(d₂)。右パネルは株価の指数重みを平方完成した後の標準正規密度を境界 -d₁ から右へ塗り、面積は Phi(d₁)。例では d₂=0.05、d₁=0.25 で、右側の境界が左へ移る。</desc>
