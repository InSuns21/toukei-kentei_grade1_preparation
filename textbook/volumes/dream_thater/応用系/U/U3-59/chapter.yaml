id: "U3-59"
title: "板・注文方式・執行コストの定義"
volume: "foundations"
status: supplementary
prerequisites: [U3-58]
official_scope: []
learning_objectives:
  - 有限注文板の価格順・数量・最良気配・中値・半スプレッドの条件を確認できる
  - 成行の価格優先消費を入替え論法で証明し約定単価と残数量を計算できる
  - 指値の価格制約と単純な価格・時間優先キューの約定数量を計算できる
  - 買いと売りの在庫・現金・手数料の符号を一貫して記帳できる
  - 未約定機会費用を含むimplementation shortfallと会計恒等式を導出できる
  - 時点中値の変化と同時点の執行価格差を別々に計算できる
  - 静止板の半スプレッド・深さ・手数料の分解を証明できる
  - ブラウザPythonで買い・売り・板不足の境界ケースを独立検算できる
definitions:
  - { id: U3-59-DEF-01, name: "有限注文板・最良気配・中値" }
  - { id: U3-59-DEF-02, name: "静止板の成行消費と数量加重平均約定価格" }
  - { id: U3-59-DEF-03, name: "指値の制約と先着数量模型" }
  - { id: U3-59-DEF-04, name: "到着時点基準の執行不足額と未執行機会費用" }
theorems:
  - { id: U3-59-PROP-01, name: "静止板の価格順消費は代金を最小にする" }
  - { id: U3-59-PROP-02, name: "在庫・現金と執行不足額の恒等式" }
  - { id: U3-59-PROP-03, name: "同一基準による IS の厳密分解" }
  - { id: U3-59-PROP-04, name: "静止板の半スプレッド・板深さ分解" }
