id: "U4-24"
title: "複数脚の約定不一致・市場アクセス"
volume: "foundations"
status: supplementary
prerequisites: [U4-23, U4-22, U4-04, U4-03]
official_scope: []
learning_objectives:
  - 注文・目標数量・実約定数量・残数量を区別し未約定脚を損益に混入させない
  - 板の方向別容量・借株・取引権限・保守的資金枠から全脚執行容量の必要条件を証明できる
  - 部分約定後の現金・中値純資産・手数料を数量と符号を保って計算できる
  - 区間価格変動と後続約定の費用を分離する損益恒等式を導出し逐次帳簿と照合できる
  - 共通因子への中立性が部分約定で崩れることを残数量による等式で説明できる
  - 各資産の価格変動幅から実在庫損益の上下界と達成条件を証明できる
  - 全脚約定確率の上下界を独立性なしで導出し独立モデルの値と区別できる
  - 指値・成行・IOCの保証範囲と市場アクセス失敗を理解し全脚成立と気配上の機会を区別できる
definitions:
  - { id: U4-24-DEF-01, name: "複数脚の目標数量・約定数量・残数量" }
  - { id: U4-24-DEF-02, name: "複数脚の市場アクセスと数量上限" }
  - { id: U4-24-DEF-03, name: "部分約定の現金・時価帳簿" }
  - { id: U4-24-DEF-04, name: "片脚残りの価格変動曝露" }
theorems:
  - { id: U4-24-PROP-01, name: "固定比率バスケットの全脚約定容量" }
  - { id: U4-24-PROP-02, name: "部分約定を含む損益恒等式" }
  - { id: U4-24-PROP-03, name: "価格変動幅による片脚曝露の上下界" }
  - { id: U4-24-PROP-04, name: "全脚約定確率の一般上下界" }
canonical_examples:
  - 目標2株とショート4株に対して約定が2株とショート1株だけの残数量
  - 取引容量・借株枠・買付資金枠の最小値がバスケット最大数量2を決める
  - 部分約定時の現金マイナス153円と中値純資産マイナス3円の検算
  - 追加約定後の純資産マイナス7.5円を区間保有損益と価格差に分解
  - 共通因子中立なバスケットの片脚だけが6円損失となる反例
  - 価格幅による最悪損失8円の達成例
  - 二脚の約定確率0.9と0.8から一般上下界0.7から0.8を導出
