  - { id: U3-03-THM-01, name: 割引株価のマルチンゲール性 }
  - { id: U3-03-THM-02, name: 後退帰納と条件付き期待値の一致 }
  - { id: U3-03-PROP-02, name: 満期株価だけに依存する請求権の二項和 }
canonical_examples:
  - 2期間4経路と株価108円への再結合
  - 上下両節点での割引株価の条件付き平均
  - 2期間コールの全経路と後退評価の厳密一致
  - UDだけを支払う請求権と経路順序の必要性
