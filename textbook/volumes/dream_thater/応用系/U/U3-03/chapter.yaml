id: "U3-03"
title: "多期間二項モデルと割引マルチンゲール"
volume: "foundations"
status: supplementary
prerequisites: [U3-01, U3-02]
official_scope: []
learning_objectives:
  - 多期間二項市場の全経路と再結合する株価節点を区別し時点別株価を求められる
  - 履歴に応じた情報と評価用確率を定義し条件付き平均の二枝公式を証明できる
  - 割引株価が評価用確率下のマルチンゲールとなることを示せる
  - 後退帰納評価が満期請求権の割引条件付き期待値に一致することを証明できる
  - 全経路評価と後退帰納を数値照合し経路依存の状態圧縮の可否を判定できる
