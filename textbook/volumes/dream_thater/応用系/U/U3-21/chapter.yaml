id: "U3-21"
title: "連続時間の American 価格：最適停止"
volume: "foundations"
status: supplementary
prerequisites: [U3-06, U3-07, U3-11, U3-13, U3-14, U3-15, U3-16, U3-17, U3-19]
official_scope: []
learning_objectives:
  - 連続時間の停止時刻の情報条件と American call/put の割引最適停止価格を定義し、未来情報を使った規則を排除できる
  - 同一 GBM 上で Bermudan 行使日格子を細分化した価格の単調収束を停止時刻の丸めと優収束で証明できる
  - 連続時間の割引 Snell 包絡の最小優マルチンゲール性と最初の接触時刻の最適性を説明できる
  - put の価値の凸性・非増加性・1-Lipschitz性を証明し、低株価側の行使領域を導ける
  - 無配当かつ非負金利の American call で早期行使が不要なことを Jensen 不等式と任意停止から証明できる
  - 継続領域と行使領域を区別し、滑らかな場所での Black–Scholes 変分不等式・満期条件を Itô 公式から導出できる
  - 2期および多期 CRR put の行使判断を再現し、格子の日程単調性と株価近似による誤差を混同しない
