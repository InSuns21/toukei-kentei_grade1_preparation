id: "U2-10"
title: "EKF の一貫性：角度・線形化誤差・innovation 診断"
volume: "foundations"
status: supplementary
prerequisites:
  - U2-09
official_scope: []
learning_objectives:
  - 実残差と予測の確率的innovationを区別し条件付き平均0と局所分散共分散行列Sの仮定を説明できる
  - 観測前に固定したSの正定値性を確認しNIS二次形式を相関も含めて手計算できる
  - 線形Gaussian基準でNISがカイ二乗分布に従う理由を白色化と独立性から証明できる
  - 二次元のカイ二乗分布の裾確率から5パーセントgateを導ける
  - 方位のwrap差と生差の誤判定を数値で比較し局所角度枝の限界を説明できる
  - 平均ずれと過小分散が期待NISに与える影響を計算できる
  - 二乗観測の線形化で平均と予測分散がずれ期待NISが13となることを検算できる
  - 一回の大NISから外れ値やモデル誤りの原因を一意に断定できない理由を説明できる
  - NISはinnovationの較正であって観測不能な状態共分散の較正ではないと反例で示せる
  - 固定乱数のPythonラボで理想基準と非線形破綻の有限標本診断を再現できる
definitions:
  - { id: U2-10-DEF-01, name: innovation 診断の局所基準模型 }
  - { id: U2-10-DEF-02, name: 正規化 innovation 二乗 }
  - { id: U2-10-DEF-03, name: 方位 NIS の局所角度残差 }
theorems:
  - { id: U2-10-PROP-01, name: 線形 Gaussian innovation の NIS 基準分布 }
  - { id: U2-10-PROP-02, name: 平均ずれと分散不足が NIS に与える影響 }
  - { id: U2-10-PROP-03, name: 二乗観測の線形化で生じる NIS の過大化 }
canonical_examples:
  - 予測残差の条件付き一次模型と1次元分散0.09の確認
  - 対角Sと2成分残差からNISが2となる
  - 相関がある2次形式でNIS4/3と対角近似2が異なる
  - 二次元Gaussian基準の上側5パーセント境界5.99146
  - 179度予測とマイナス179度観測の角度差がプラス2度
  - 0.3mの平均ずれで期待NISが10となる
  - 二乗観測でEKFの予測Sが0.25でも期待NISが13となる
  - Hが0ならNISから状態誤差分散を識別できない
  - Pythonで相関行列とGaussian基準のモンテカルロを自己検査
