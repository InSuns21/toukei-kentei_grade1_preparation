<line x1="255" y1="32" x2="303" y2="32" stroke="#bf6531" stroke-width="3" stroke-dasharray="9 5"/><rect x="274" y="27" width="10" height="10" fill="#bf6531"/><text x="312" y="37" font-size="16" fill="#213547">Milstein strong</text>
<line x1="514" y1="32" x2="562" y2="32" stroke="#33866d" stroke-width="3" stroke-dasharray="3 6"/><path d="M 538 26 L 532 37 L 544 37 Z" fill="#33866d"/><text x="572" y="37" font-size="16" fill="#213547">Linear weak</text>
