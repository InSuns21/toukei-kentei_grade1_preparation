<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" data-layout-lint="strict" role="img" aria-labelledby="u329-title u329-desc">
<title id="u329-title">GBM の強収束と弱収束の対数図</title>
<desc id="u329-desc">横軸は時間刻みhで左が細かく右が粗い。縦軸は理論誤差の絶対値（円）の対数目盛。丸印付き実線のEuler–Maruyama強誤差は右上がりの緩い傾き約1/2。四角印付き破線のMilstein強誤差と三角印付き点線の線形支払の弱偏りは傾き約1。いずれも有限刻みのGBM公式から求めた。</desc>
