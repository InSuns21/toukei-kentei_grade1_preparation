  - { id: U3-54-PROP-02, name: "分位点損失は VaR を選ぶ" }
  - { id: U3-54-THM-01, name: "正しい条件付き分布の PIT" }
  - { id: U3-54-THM-02, name: "CRPS の適切性" }
canonical_examples:
  - "二点予測p=0.20とp=0.05は75%VaR=0だがES=8と2"
  - "連続一様損失の誤ったq=8とe=8.8はES残差だけ0となる"
  - "原子の確率化PITは0日0.80W・10日0.80+0.20W"
