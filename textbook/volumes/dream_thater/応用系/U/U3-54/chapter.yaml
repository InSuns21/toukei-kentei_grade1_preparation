id: "U3-54"
title: "ES バックテストと予測分布検証"
volume: "foundations"
status: supplementary
prerequisites: [U3-44, U3-45, U3-46, U3-53]
official_scope: []
learning_objectives:
  - ESは分位点ではなく尾部平均であり超過回数だけでは検証できないことを離散分布で示す
  - 事前VaR・ES共同予測と可積分損失の条件を明示できる
  - 尾部残差の条件付きモーメントとVaR校正の組を導出し逆向きの仮定を説明できる
  - 分位点損失が条件付きVaRを選ぶ理由を導出できる
  - 離散原子に対応する確率化PITの条件付き一様性と時系列独立性を証明できる
  - CRPSの定義と期待スコア差の非負性を証明できる
  - 同じVaR超過回数でES残差とCRPSが異なる合成系列を手計算・Pythonで検証できる
  - 校正と比較と検定を区別し先読み・系列依存・有限標本の限界を述べられる
definitions:
  - { id: U3-54-DEF-01, name: "事前の VaR・ES 共同予測" }
  - { id: U3-54-DEF-02, name: "ES の尾部残差と VaR の校正残差" }
  - { id: U3-54-DEF-03, name: "分位点損失" }
  - { id: U3-54-DEF-04, name: "確率化した PIT" }
  - { id: U3-54-DEF-05, name: "CRPS" }
theorems:
