id: "U3-67"
title: "複数資産・クロスインパクト・流動性調整リスク"
volume: "foundations"
status: supplementary
prerequisites: [U3-66, U3-46]
official_scope: []
learning_objectives:
  - 二銘柄の固定予定・価格増分・売却代金を同じ単位で定義し損失恒等式を導出できる
  - 一時的クロスインパクト行列の対称性と正定値性・価格共分散率の半正定値性を区別できる
  - 恒久的影響の非対称行列における閉じた注文経路の負費用を導出し失敗機構を説明できる
  - 多資産二期間平均分散目的の勾配・厳密凸性・制約付き最適予定を計算できる
  - 市場損失と執行費用の同時分布から流動性調整 VaR・ES を定義し正規模型と確率的費用を判定できる
  - 流動性・共分散ストレスの条件付き指標と単一路径損失・混合分布を区別できる
  - Pythonの行列条件・数値最適化・正規VaR/ESを手計算と照合できる
