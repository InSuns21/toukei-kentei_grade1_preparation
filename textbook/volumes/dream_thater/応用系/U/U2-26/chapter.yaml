id: "U2-26"
title: "Rao–Blackwell 化粒子 SLAM：何を粒子化するか"
volume: "foundations"
status: supplementary
prerequisites:
  - U2-25
  - F0-00P3A
official_scope: []
learning_objectives:
  - 独立目印事前・既知対応・一目印観測という条件を列挙し、破れた例を区別できる
  - 軌跡を固定した地図事後の積分解を有限和による正規化から証明できる
  - 軌跡粒子と粒子ごとの条件付き地図表から同時・周辺事後を再構成できる
  - 旧地図による予測尤度から重点重みを導き、新観測で地図を一度だけ更新できる
  - bootstrap提案と観測を使う提案の重み比、零証拠・支持条件を検証できる
  - 条件付き平均による分散低減を有限確率の全分散の分解から証明できる
  - 正しい祖先・地図の複製と、地図混合・誤対応・ビーム結合の失敗機構を説明できる
  - 二姿勢・二値目印の二観測を厳密分数とPythonで再現できる
definitions:
  - { id: U2-26-DEF-01, name: 既知対応・独立目印の有限 SLAM 模型 }
  - { id: U2-26-DEF-02, name: 軌跡粒子と条件付き地図 }
theorems:
  - { id: U2-26-THM-01, name: 軌跡条件付き地図の積分解 }
  - { id: U2-26-THM-02, name: RBPF-SLAM の一歩の重み・地図更新 }
  - { id: U2-26-PROP-01, name: 条件付き平均による標本分散の低減 }
canonical_examples:
  - 二姿勢A/Bと二値目印の事前、運動・観測核の規格化
  - 第1観測の予測尤度3/5と1/2、軌跡重み6/11と5/11
  - 軌跡別の地図事後3/4と1/5、周辺値1/2
  - 第2観測の尤度3/4と17/25、軌跡重み45/79と34/79
  - 二回観測後の地図周辺確率85/158と全状態列挙
  - 地図を混合してしまった場合の誤重み36/61と25/61
  - Rao–Blackwell化の条件付き分散7/40と分散低減
  - 未知対応の二目印事後に生じる非独立性
