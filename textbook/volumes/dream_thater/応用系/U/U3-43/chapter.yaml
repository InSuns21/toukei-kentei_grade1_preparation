id: "U3-43"
title: "価格付けモデルの横断較正・検証"
volume: "foundations"
status: supplementary
prerequisites: [INV1, U3-11, U3-15, U3-19, U3-20, U3-26, U3-39, U3-40, U3-41, U3-42]
official_scope: []
learning_objectives:
  - 契約の満期・日数規約・配当・割引・払戻し・通貨・単位・気配を共通入力として固定できる
  - 非負株価の欧州 call に対する無裁定価格境界と put-call parity を払戻しの点wise不等式から証明できる
  - 買い気配と売り気配から規格化残差の損失を構成し勾配を導出できる
  - 価格残差・IV残差の条件の違いと、気配の半幅を確率的標準偏差と同一視できない理由を説明できる
  - 2満期の価格から線形ゼロ金利曲線の係数を識別し、満期重複時の非一意性を示せる
  - 同一入力でBSM・CRR木・厳密終端MCを三重照合し、離散化偏りと標本誤差・観測誤差を区別できる
  - MC割引払戻しの二乗モーメントと標準誤差を正規積分から再現できる
  - 債券曲線とオプションの割引規約の不一致を検出し、較正内適合と未観測商品への外挿を区別できる
definitions:
  - { id: U3-43-DEF-01, name: "価格付けの共通入力規約" }
  - { id: U3-43-DEF-02, name: "気配幅で規格化した横断較正" }
  - { id: U3-43-DEF-03, name: "三重照合と誤差内訳の検証台帳" }
theorems:
  - { id: U3-43-PROP-01, name: "配当付き欧州 call の無裁定価格境界" }
  - { id: U3-43-PROP-02, name: "規格化価格残差の勾配" }
  - { id: U3-43-PROP-03, name: "異なる2満期による線形ゼロ金利曲線の識別" }
