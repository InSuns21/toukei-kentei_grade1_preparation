  - { id: U3-68-PROP-02, name: "未来の入力変更に対する発注の不変性" }
  - { id: U3-68-PROP-03, name: "市場VWAP差の配分・価格差分解" }
  - { id: U3-68-PROP-04, name: "対応差の分散と同一経路利用" }
