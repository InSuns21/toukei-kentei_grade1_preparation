id: "U3-68"
title: "執行バックテスト・TCA と全科目統合"
volume: "foundations"
status: supplementary
prerequisites: [U3-67, U3-60, U3-59, U3-18, U3-44, U3-45, U3-46, U3-62, U3-66, MC2]
official_scope: []
learning_objectives:
  - 未約定の時価評価を含む到着価格基準の損失会計を二通りで導出・検算できる
  - 到着価格・市場VWAP・自分の約定平均を区別し、配分差と執行価格差に分解できる
  - 執行方針の情報時点を定義し、先読みと因果性の反例を判定できる
  - 学習経路と未使用経路を分離し、同じ市場経路上で複数方針を公平に比較できる
  - 対応のあるTCA平均差・分散・正規近似区間とモデル誤差を区別できる
  - 価格付け測度Qと将来損失の実確率Pを区別し、売却後のVaRとESを計算できる
  - Pythonで固定seed・同一経路・流動性ストレス・残在庫・先読み不変性を再現できる
