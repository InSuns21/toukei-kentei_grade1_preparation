id: "U2-06"
title: "平面姿勢と座標系：位置だけでは足りない"
volume: "foundations"
status: supplementary
prerequisites:
  - U2-05
official_scope: []
learning_objectives:
  - 世界座標と車体座標の軸・原点・向き・単位を区別し平面姿勢の角度周期性を説明できる
  - 回転行列を二つの基底ベクトルから作り点と変位に対する変換の差を説明できる
  - 平面剛体変換の同次行列を導き回転が直交し向きを保つことを確認できる
  - 平行移動と回転の順序に注意して逆変換を証明し具体点で検算できる
  - 三つの座標フレーム間の合成則を行列積と三角加法定理から証明できる
  - 同じ世界座標にある二姿勢から相対姿勢を求め往復変換を検算できる
  - 共通の世界座標変更で相対姿勢が不変な理由を行列積と逆変換の相殺で証明できる
  - 角度のwrapと観測引く予測の残差を導き境界と不連続性を判定できる
  - 座標フレームの混同と点・変位の混同が生む誤りを再現して修正できる
  - 平面姿勢の合成・点変換・角度残差を数値ラボと手計算で相互照合できる
definitions:
  - { id: U2-06-DEF-01, name: 平面姿勢 }
  - { id: U2-06-DEF-02, name: 座標フレーム間の平面剛体変換 }
  - { id: U2-06-DEF-03, name: 相対姿勢 }
  - { id: U2-06-DEF-04, name: 角度の正規化と角度残差 }
theorems:
  - { id: U2-06-PROP-01, name: 平面剛体変換の逆変換 }
  - { id: U2-06-THM-01, name: 平面剛体変換の合成則 }
  - { id: U2-06-PROP-02, name: 相対姿勢の世界座標不変性 }
canonical_examples:
  - 平面姿勢(2,1,π/2)で車体前方3mは世界(2,4)となる
  - 回転行列の二基底の直交性・行列式1・点と変位の違い
  - 逆変換で世界点(1,4)から車体点(3,1)へ戻す
  - AB(3,0,π/2)とBC(1,2,-π/2)の合成がAC(1,1,0)
  - 世界の二姿勢A(2,1,π/2)とB(2,4,π)から相対姿勢(3,0,π/2)
  - 予測179度・観測-179度の残差が正の2度となる
  - Pythonで座標の往復・合成・世界座標不変性・wrapを自己検査
