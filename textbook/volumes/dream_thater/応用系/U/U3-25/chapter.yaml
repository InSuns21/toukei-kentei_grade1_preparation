  - { id: U3-25-PROP-02, name: "監視集合の包含と価格の順序" }
  - { id: U3-25-PROP-03, name: "対数ドリフト0の障壁デジタル厳密価格" }
  - { id: U3-25-PROP-04, name: "Asian の増次元 Black–Scholes PDE" }
  - { id: U3-25-PROP-05, name: "Asian 線形領域の厳密価格" }
  - { id: U3-25-PROP-06, name: "Asian 陽的更新の非負性と刻み条件" }
