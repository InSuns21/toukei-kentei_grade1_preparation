id: "U3-25"
title: "Barrier/Asian の PDE：境界と状態追加"
volume: "foundations"
status: supplementary
prerequisites: [U3-08, U3-09, U3-13, U3-14, U3-16, U3-17, U3-22, U3-23]
official_scope: []
learning_objectives:
  - 連続監視 knock-out を停止時刻と吸収境界で定義し、既に失効した状態と生存状態を区別できる
  - 停止付き割引期待値から障壁内部の Black–Scholes PDE と正しい終端・境界条件を導ける
  - 監視日の包含による価格単調性と反射原理による障壁デジタルの厳密価格を証明できる
  - 対数変換の連鎖律と陽的差分を導き、境界打切り・格子誤差・監視規則の差を分離できる
  - 算術平均 Asian の累積積分状態と二次元生成作用素を Itô 公式から導ける
  - Asian PDE の s=0 境界・a=0 の非境界性・高累積量での厳密境界を区別できる
  - 非負な Asian 右向き差分と刻み条件を証明し、数値演算・記憶量を見積もれる
  - Python で barrier FD と反射原理の厳密解、Asian 連続／離散平均の計算を再現できる
definitions:
  - { id: U3-25-DEF-01, name: "連続監視 down-and-out と吸収境界" }
  - { id: U3-25-DEF-02, name: "連続算術平均 Asian と累積積分状態" }
  - { id: U3-25-DEF-03, name: "Asian の右向き累積量差分" }
theorems:
