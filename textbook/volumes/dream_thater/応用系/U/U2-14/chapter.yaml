id: "U2-14"
title: "逐次重要度サンプリング：粒子の重みはなぜ必要か"
volume: "foundations"
status: supplementary
prerequisites:
  - U2-13
official_scope: []
learning_objectives:
  - 目標分布の非正規化重みと提案分布、支持集合の被覆条件を区別できる
  - 重点重みの密度比と期待値の変換恒等式を有限和から証明できる
  - 四粒子の重複と重み正規化から離散的な位置 belief を構成できる
  - 目標の証拠0、有限標本の総重み0、部分ゼロ重みを区別できる
  - 自己正規化推定の強一致性と有限粒子でのバイアスを説明できる
  - 条件付き独立模型から経路事後と逐次提案分布を因子分解できる
  - 一般の提案核に対する逐次重要度重み再帰式を証明できる
  - 運動モデル提案では観測尤度が追加重みとなる条件を検査できる
  - 四粒子二時刻の近似と厳密 Bayes フィルタの差を計算できる
  - 観測に適応した提案確率と重み倍率を補正できる
  - Pythonラボで重み・正規化・厳密事後・ゼロ重みを検算できる
definitions:
  - { id: U2-14-DEF-01, name: 提案分布と重点重み }
  - { id: U2-14-DEF-02, name: 自己正規化した重み付き粒子近似 }
  - { id: U2-14-DEF-03, name: 経路の目標重みと逐次提案分布 }
theorems:
  - { id: U2-14-PROP-01, name: 有限状態の重点重み恒等式 }
  - { id: U2-14-THM-01, name: 自己正規化重点推定の強一致性 }
  - { id: U2-14-THM-02, name: 逐次重要度重みの再帰式 }
canonical_examples:
  - 三地点の予測 (1/2,1/3,1/6)、観測尤度 (1/5,4/5,1/2)、提案 (1/4,1/2,1/4)
  - 正しい事後 (6,16,5)/27 と四粒子 A,B,B,C の正規化重み (6,8,8,5)/27
  - 運動モデル提案での二時刻粒子重み (12,16,32,5)/65
  - 二時刻粒子近似 (5,28,32)/65 と厳密事後 (11,44,84)/139 の比較
  - 目標が正でも有限標本の全重点重みがゼロになる場合
  - 提案が支持集合を覆わない反例、N=1 の自己正規化バイアス
  - 観測適応提案 (1/3,2/3) で両枝の重み倍率が 3/4
