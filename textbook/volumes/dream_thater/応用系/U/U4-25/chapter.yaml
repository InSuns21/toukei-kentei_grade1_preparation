id: "U4-25"
title: "戦略の組合せとリスク予算"
volume: "foundations"
status: supplementary
prerequisites: [U4-19, U4-23, U4-24]
official_scope: []
learning_objectives:
  - 戦略倍率から原資産の符号付き円建て保有額を作りネット・グロス・市場と産業の因子中立をそれぞれ確認できる
  - 戦略の予測損益分布と共分散を同じ時刻・通貨・期間で定義し合成平均・分散とリスク寄与を導出できる
  - 予測標準偏差・グロス・ネット・個別集中・因子中立の同時予算を数値例で判定できる
  - 期待損益・共分散罰則・変更倍率に比例する取引費用を単位を揃えて合成できる
  - 正定値共分散と行フルランクの中立制約の下で唯一の二次最適解を証明できる
  - 二戦略の比例費用付き目的式を絶対値の符号別に解いて費用による倍率縮小を証明できる
  - ほぼ完全相関の推定共分散が最適倍率を暴走させる機構を示しグロス制限の役割を説明できる
  - 中立制約が産業集中や個別資産の極端損失を防げない反例を再計算できる
  - 指定ストレス損失と予測分散の違いを示し部分約定で制約が崩れることを実保有で判定できる
definitions:
  - { id: U4-25-DEF-01, name: "組合せ保有額・ネット額・グロス額・因子中立" }
  - { id: U4-25-DEF-02, name: "戦略損益ベクトルと予測共分散" }
  - { id: U4-25-DEF-03, name: "予測リスク・グロス・ネット・集中の同時制約" }
  - { id: U4-25-DEF-04, name: "共分散罰則と売買回転費用付き目的関数" }
  - { id: U4-25-DEF-05, name: "指定シナリオのストレス損失上限" }
theorems:
  - { id: U4-25-PROP-01, name: "合成損益の平均・分散と各戦略の寄与" }
  - { id: U4-25-PROP-02, name: "正定値共分散の下での中立制約付き最適倍率" }
  - { id: U4-25-PROP-03, name: "二戦略の中立制約下での比例費用付き最適倍率" }
  - { id: U4-25-PROP-04, name: "ほぼ完全相関する二戦略の倍率増幅" }
canonical_examples:
  - 2銘柄のドル中立と市場因子エクスポージャーが一致しない例
  - 4銘柄のネット・市場中立だが産業因子に2円相当残る例
  - 2戦略の共分散行列の正定値性と標準偏差・寄与を直接計算する例
  - 五種類の予算を個別に検算し集中上限の変更だけで予算外になる例
  - 中立制約付き二次最適倍率t=0.5と費用を入れたt=0.3の比較
  - 予測相関0.99から0.80への変化がモデル分散200を4000に増やす例
  - 部分約定によってストレス損失が0.6から1.4へ増える例
