id: "U3-42"
title: "金利曲線・債券・短期金利モデル"
volume: "foundations"
status: supplementary
prerequisites: [U3-15, U3-19, U3-26, STO9]
official_scope: []
learning_objectives:
  - ゼロクーポン債の割引因子から連続複利ゼロ金利と瞬間フォワード金利を計算できる
  - 割引曲線とフォワード金利の積分・微分恒等式を証明できる
  - 異なる満期のゼロクーポン債から無裁定先渡受渡価格を複製で導出できる
  - 確率的な短期金利と実現割引因子を区別し評価測度での条件付き割引期待値を証明できる
  - Vasicek 短期金利の陽解と条件付き平均分散を Itô 公式で導ける
  - 累積短期金利の条件付き正規分布からゼロクーポン債価格を導出できる
  - Vasicek 債券価格の PDE と金利感応度を検算できる
  - 厳密な累積金利標本の Monte Carlo と解析値・標準誤差を比較できる
  - 市場曲線と単一短期金利モデルの較正残差を区別できる
