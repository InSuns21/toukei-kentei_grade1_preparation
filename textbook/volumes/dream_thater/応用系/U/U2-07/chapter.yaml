id: "U2-07"
title: "オドメトリ・速度運動モデルと誤差"
volume: "foundations"
status: supplementary
prerequisites:
  - U2-06
official_scope: []
learning_objectives:
  - 無滑り差動二輪の左右車輪速度から中心前進速度と角速度を単位込みで導ける
  - 車体速度を世界座標へ変換し一定速度の円弧と直進の終姿勢を厳密積分できる
  - 始点Euler近似と厳密円弧の差および旋回ゼロ極限を説明できる
  - 車体座標での相対オドメトリを三段階に分け初期姿勢から終姿勢を復元できる
  - 車体座標で定義した並進誤差共分散を世界座標へ回転できる
  - 始点Euler模型の姿勢と速度に関する一次誤差行列を導ける
  - 独立性の仮定を使って姿勢誤差共分散を伝播し交差共分散を説明できる
  - 滑り・角度wrap・速度雑音の時間スケーリング・相関が予測を壊す条件を判定できる
  - 手計算とPythonラボで円弧・速度・共分散の数値を照合できる
definitions:
  - { id: U2-07-DEF-01, name: 差動二輪の無滑り速度模型 }
  - { id: U2-07-DEF-02, name: 平面速度運動モデル }
  - { id: U2-07-DEF-03, name: 三段階の相対オドメトリ模型 }
  - { id: U2-07-DEF-04, name: 車体座標での並進雑音 }
theorems:
  - { id: U2-07-THM-01, name: 一定車体速度の平面運動を厳密に積分する }
  - { id: U2-07-PROP-01, name: 車体雑音の世界座標への変換 }
  - { id: U2-07-PROP-02, name: 始点Euler運動の一次誤差行列 }
  - { id: U2-07-PROP-03, name: 独立速度雑音に対する局所一次共分散予測 }
canonical_examples:
  - 車輪半径0.1m・輪間0.5m・左右10/14rad毎秒から前進1.2m毎秒と旋回0.8rad毎秒
  - 半径1mの四分円を厳密積分すると終点(1,1)で始点Eulerは(pi/2,0)
  - 初期車体座標の相対並進(0,2)と向きpi/2を三段階オドメトリへ分解
  - 北向き車体の前後・左右雑音が世界のy・x方向の分散へ入れ替わる
  - 始点Eulerで初期姿勢共分散と速度誤差から予測共分散と交差項を計算
  - Pythonで車輪・円弧・回転共分散・局所Jacobi行列を再実行
