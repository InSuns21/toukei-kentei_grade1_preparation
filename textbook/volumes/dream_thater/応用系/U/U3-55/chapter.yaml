id: "U3-55"
title: "ストレステスト・シナリオ・流動性とモデルリスク"
volume: "foundations"
status: supplementary
prerequisites: [U3-44, U3-46, U3-50, U3-52, U3-54]
official_scope: []
learning_objectives:
  - 固定ポジションと期間の下で履歴外シナリオを指定し市場損失を再評価できる
  - 同時下落と集中ポジションの損失を資産別に比較できる
  - スプレッドと厚みに基づく清算費用を計算し単調性と注文量の凸性を証明できる
  - 同じシナリオで二つの評価モデルを比較し最悪損失と上界を導出できる
  - 一様下落族に対して線形と二次の逆ストレス水準を解ける
  - 固定VaR・ESが最大損失の上界にならない反例を証明できる
  - 通常時とストレス時の費用・モデル差を合成三状態で数値検算できる
  - 期間不一致と確率の後付けと流動性費用の二重計上を識別できる
definitions:
  - { id: U3-55-DEF-01, name: "金融ストレスシナリオ" }
  - { id: U3-55-DEF-02, name: "流動性調整済みストレス損失" }
  - { id: U3-55-DEF-03, name: "シナリオ・モデルの最悪損失" }
  - { id: U3-55-DEF-04, name: "単調ショック族の逆ストレス水準" }
theorems:
  - { id: U3-55-PROP-01, name: "流動性コストの単調性と注文量の凸性" }
  - { id: U3-55-PROP-02, name: "市場リスクと流動性リスクの最悪値の上界" }
  - { id: U3-55-PROP-03, name: "線形・二次損失での逆ストレス水準" }
  - { id: U3-55-PROP-04, name: "固定VaR・ESは最大損失を上から抑えない" }
canonical_examples:
  - "60/40万円の同時下落は市場損失28万円"
  - "通常時の費用1万円とストレス時4.2万円の分解"
