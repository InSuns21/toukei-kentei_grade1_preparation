id: "U2-15"
title: "粒子フィルタ：再標本化と有効標本サイズ"
volume: "foundations"
status: supplementary
prerequisites:
  - U2-14
official_scope: []
learning_objectives:
  - 重み退化・祖先退化・位置候補消失・全重みゼロを区別できる
  - 多項再標本化の祖先選択と等重み化を四粒子で手計算できる
  - 再標本化平均の抽選に関する期待値と分散を有限和から証明できる
  - 重みに基づく有効標本サイズの定義と上下限および等号条件を証明できる
  - 有効標本サイズと位置の多様性を同一視しない反例を作れる
  - 抽選で残る異なる祖先番号数の期待値と特定祖先消失確率を導出できる
  - 逐次重点再標本化の運動・観測・祖先選択の順序を説明できる
  - 運動モデル提案で新観測尤度のみを掛ける条件を判断できる
  - 一歩の未正規化積分の抽選に関する期待値と正規化比の偏りを区別できる
  - 全粒子の位置候補が消えた場合の観測後誤差を厳密 Bayes 更新と比較できる
  - Python ラボで有理数計算と固定乱数による多項再標本化を検算できる
definitions:
  - { id: U2-15-DEF-01, name: 多項再標本化 }
  - { id: U2-15-DEF-02, name: 重みに基づく有効標本サイズ }
  - { id: U2-15-DEF-03, name: 運動モデル提案型の逐次重点再標本化 }
theorems:
  - { id: U2-15-PROP-01, name: 多項再標本化の抽選平均と分散 }
  - { id: U2-15-THM-01, name: 有効標本サイズの範囲と等号 }
  - { id: U2-15-PROP-02, name: 残る祖先番号数の期待値 }
  - { id: U2-15-THM-02, name: SIR 一歩の未正規化量の抽選平均 }
canonical_examples:
  - U2-14 の四粒子 A・B・B・C と重み (6,8,8,5)/27 の抽選で C が消える例
  - 四粒子の重み (1/2,1/4,1/8,1/8) で ESS=32/11 と残存祖先期待数 5015/2048
  - 重み付き平均 7/8 と一回の再標本化後の平均 3/4 の比較
  - 四粒子が同位置でも等重みなら ESS=4 の反例
  - 恒等運動・観測尤度 (1/4,1) の下で B が消え事後の差が生じる例
  - ESS=25/7 でも希少粒子消失確率 6561/10000 の例
  - 二項再標本化と新観測の正規化比の有限標本バイアス
  - Python 標準ライブラリによる有理数・再標本化期待値・乱数実験
