id: "U2-20"
title: "占有格子地図の更新：log-odds と逆センサーモデル"
volume: "foundations"
status: supplementary
prerequisites:
  - U2-19
official_scope: []
learning_objectives:
  - 既知の二値占有格子と未知の Bernoulli 占有確率地図を区別できる
  - 占有確率が測距の確率密度ではないことを単位と条件付けから説明できる
  - 既知姿勢のビームを通過・命中・非観測セルに排他的に分類できる
  - 命中なしフラグ・測距上限・地図外の更新条件を判別できる
  - 逆センサーモデルの参照事前と厳密な一観測事後の違いを説明できる
  - log-odds と占有確率を相互変換して初期値と増分を計算できる
  - 条件付き独立と正の尤度の下で単一セル log-odds 更新式を Bayes の定理から証明できる
  - 参照事前の二重計数を回避して非対称事前でも更新できる
  - 2回のビーム走査から全セルの占有確率を正確な分数で再計算できる
  - 観測を受けないセルの不変性と逆モデルによる単調な更新方向を証明できる
  - 観測後のセル間依存と独立近似の誤差を具体的な同時事後で示せる
  - 同じ観測の再利用と条件付き独立な新観測を区別できる
definitions:
  - { id: U2-20-DEF-01, name: 有限占有格子の確率模型 }
  - { id: U2-20-DEF-02, name: 単一セルの逆センサーモデル }
  - { id: U2-20-DEF-03, name: 有限測距光線のセル別逆モデル }
  - { id: U2-20-DEF-04, name: 占有確率の log-odds }
theorems:
  - { id: U2-20-THM-01, name: 単一セル Bayes 更新の log-odds 表示 }
  - { id: U2-20-PROP-01, name: 逆モデルの更新方向と非観測セル }
  - { id: U2-20-PROP-02, name: 単一ビーム後の周辺値では同時地図を再現できない }
canonical_examples:
  - 二行二列の独立 Bernoulli 事前地図で16配置の正規化を確認
  - 四セル光線の通過2セル・命中1セル・未観測1セルへの逆確率割当て
  - p0=1/2・free=3/10・hit=4/5の2走査で9/58・12/19・4/5・1/2を導出
  - p0=1/5で参照事前を補正しないと4/5が1/2へ誤更新される反例
  - 二セルの少なくとも一方の占有観測から共分散-1/9を導く
  - 完全に同じ観測を二度処理すると2/3を4/5へ誤更新する反例
  - Bernoulli単一セルの前向き尤度から9/11・1/9の逆確率と二観測事後9/25を導く
  - Python標準ライブラリによるlog-odds逐次更新の数値検算
