id: "U2-17"
title: "地図が既知のときの観測尤度：障害物と測距"
volume: "foundations"
status: supplementary
prerequisites:
  - U2-16
official_scope: []
learning_objectives:
  - 二値占有格子と障害物領域を定義し既知領域と未知領域を区別できる
  - 姿勢とビーム角から世界座標の光線を構成し最初の障害物までの距離を求められる
  - 光線の定義域・最大距離・未命中・地図外の境界条件を判別できる
  - 有限量子化ビーム観測の確率質量関数を構成し正規化分母の必要性を証明できる
  - 地図と姿勢に条件付けた複数ビームの独立近似と姿勢を周辺化した依存性を区別できる
  - 複数ビーム観測を用いる有限姿勢集合の証拠と事後を導出できる
  - 一様外れ値混合の正規化と証拠の正の下限を証明できる
  - 事前支持の欠落が尤度だけで回復しないことを説明できる
  - 占有格子の解像度と粗視化による命中距離の変化を計算できる
  - 数値上の尤度積のアンダーフローと対数重みの使い方を説明できる
definitions:
  - { id: U2-17-DEF-01, name: 既知の二値占有格子地図 }
  - { id: U2-17-DEF-02, name: 既知地図での有限距離レイ投射 }
  - { id: U2-17-DEF-03, name: 有限値の測距ビーム尤度 }
  - { id: U2-17-DEF-04, name: 条件付き独立な複数ビーム模型 }
  - { id: U2-17-DEF-05, name: 一様外れ値を混ぜた有限ビーム尤度 }
theorems:
  - { id: U2-17-PROP-01, name: 最初の命中距離の存在 }
  - { id: U2-17-PROP-02, name: ビーム尤度の正規化と分母の必要性 }
  - { id: U2-17-THM-01, name: 複数ビームによる有限候補姿勢の事後分布 }
  - { id: U2-17-PROP-03, name: 外れ値混合の正規化と観測証拠の下限 }
canonical_examples:
  - 既知格子の二障害物と三つの姿勢から予測距離1.5・0.5・2.5 mを直接計算
  - ビン0から3への指数重みを全数正規化して観測番号1の尤度0.491007を計算
  - 三姿勢における尤度と事後分布0.493205・0.497679・0.009115
  - 二ビームの正規化と積の確率質量関数を確かめる
  - 外れ値混合率1/5で各ビーム下限1/20を得る
  - 姿勢条件付き独立だが周辺で同時確率0.41が0.25に一致しない反例
  - 粗視化で障害物入口がx=3からx=2へ変わり予測測距が1 m変わる
