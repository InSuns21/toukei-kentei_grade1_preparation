  - { id: U3-38-THM-01, name: "特性関数からの欧州型 call 価格公式" }
  - { id: U3-38-PROP-03, name: "Fourier 積分の打切り誤差" }
  - { id: U3-38-PROP-04, name: "台形価格の誤差分離" }
canonical_examples:
  - "確定価格 X=log100 で減衰 call が L1 になる積分"
  - "BSM s=K=100,r=.05,q=.02,sigma=.2,T=1 の call=9.227005508154 円"
  - "alpha=1.5 と上限 U=10,20,30,40 での Fourier 価格誤差"
  - "重尾分布で call は有限だが alpha=1 の指数モーメントが無限大となる例"
  - "固定 U での台形誤差と固定 N での打切り誤差の区別"
