id: "U3-38"
title: "Fourier／特性関数による価格付け"
volume: "foundations"
status: supplementary
prerequisites: [FOU3, U3-14, U3-19, U3-26]
official_scope: []
learning_objectives:
  - GBM の対数価格の複素特性関数と指数モーメントを導出できる
  - 減衰した対数行使価格の定義と絶対可積分性を直接例で確認できる
  - Fubini を使い減衰 call の変換分母を導出できる
  - FOU3 の Fourier反転定理を適用して正周波数価格積分を証明できる
  - 指数モーメント仮定と計算可能な alpha の範囲を判定できる
  - 一般の 1/U 尾部評価と正規モデルの Gaussian 尾部評価を証明できる
  - 複合台形則の 1/12 誤差係数を導出し打切りと求積誤差を分離できる
  - Python 標準ライブラリで配当付き Black–Scholes 閉形式と Fourier 価格を独立検算できる
definitions:
  - { id: U3-38-DEF-01, name: "対数満期価格の特性関数と複素延長" }
