id: "U4-17"
title: "非線形・閾値共和分とレジーム変化"
volume: "foundations"
status: supplementary
prerequisites: [U4-16, U4-15, U4-14, U4-13, U4-12, U4-10]
official_scope: []
learning_objectives:
  - 連続な二レジーム閾値自己回帰の閾値・分岐・条件付き平均を定義例で検算できる
  - 左右の傾きからLipschitz縮小評価を示し有限二次モーメントの定常解を構成できる
  - 閾値を無条件平均と混同せずレジーム別の局所復帰を説明できる
  - 共通ランダムウォークと定常TAR残差から2系列の共和分を検算できる
  - 固定係数の水準残差を非線形な誤差修正表現へ差分展開できる
  - 1期と2期の条件付き予測を区別し分岐越えによる非線形期待値誤差を反例で示せる
  - 閾値探索による標本内平方和改善と標本外予測改善を区別できる
  - 帰無仮説下の閾値非識別性と検定較正・情報時刻を説明できる
  - 構造変化による平均シフトと平均回帰係数消失の合成系列を作り定常TARと区別できる
  - 費用・約定不一致・標本外評価を含む統計的裁定の採否手順を構築できる
definitions:
  - { id: U4-17-DEF-01, name: "連続な2レジーム閾値自己回帰" }
  - { id: U4-17-DEF-02, name: "閾値誤差修正を持つ2系列の共和分" }
  - { id: U4-17-DEF-03, name: "閾値誤差修正項" }
  - { id: U4-17-DEF-04, name: "閾値選択と将来評価の分離" }
theorems:
  - { id: U4-17-PROP-01, name: "縮小する閾値自己回帰の定常解" }
  - { id: U4-17-PROP-02, name: "閾値自己回帰から誤差修正表現への恒等変形" }
  - { id: U4-17-PROP-03, name: "閾値モデルの1期予測と多期予測の注意" }
  - { id: U4-17-PROP-04, name: "同じデータで閾値を探索すると訓練誤差は改善し得る" }
canonical_examples:
  - 非対称な1期予測と0で連続な分岐
  - 閾値を跨ぐLipschitz評価と定常解の二乗平均構成
  - 共通ランダムウォークと定常TAR残差の共和分
  - 閾値誤差修正項の符号と株価階差
  - 2期先条件付き期待値と分岐越えの反例
  - 訓練平方和改善と閾値非識別性
  - 平均の単発構造変化による定常モデル破綻
  - 事前固定した学習・評価区間と費用控除後の戦略採否
