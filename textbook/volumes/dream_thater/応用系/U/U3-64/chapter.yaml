id: "U3-64"
title: "板の回復・過渡的インパクト"
volume: "foundations"
status: supplementary
prerequisites: [U3-63]
official_scope: []
learning_objectives:
  - 板の価格変位・回復率・減衰係数の単位と状態再帰を導出し直接計算できる
  - 注文履歴を含む平均約定費用と核行列を再帰式から導き在庫リスクの分散と区別できる
  - 指数核の正定値性と平均分散最適化の一意性および最適性条件を証明できる
  - 二期間の最適予定を厳密に解いて回復とリスク回避の感度を説明できる
  - 三期間の端点集中と瞬時回復・永久残存の極限および端点の非一意性を検算できる
  - 再帰費用と核二次形式・射影勾配の数値解を比較し境界テストを実行できる
