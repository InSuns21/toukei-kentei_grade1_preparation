id: "U4-05"
title: "現物・先渡・先物のcash-and-carry"
volume: "foundations"
status: supplementary
prerequisites: [U4-04]
official_scope: []
learning_objectives:
  - 現物bid/ask・先渡受渡価格・借入/運用累積係数・満期配当/保管費/借株料の単位と発生時点を区別できる
  - 現物買い・借入・売り先渡の初期自己金融と満期受渡からcarry純利益を導出できる
  - 現物借株・空売り・売却代金運用・買い先渡の実行条件と逆方向純利益を導出できる
  - 売買可能気配に対する先渡無裁定必要上下限を両方向別に構成・証明できる
  - 摩擦なし等価式の適用条件と保管費・空売り制約が等式を壊す仕組みを反証できる
  - 中間配当の運用および配当相当支払の借入を満期価値へ換算できる
  - 先物の途中値洗いと満期一括先渡の現金収支の差を再計算できる
  - basisの見かけの乖離と取引容量・資金枠・保管・借株・決済の実行可能性を分離できる
definitions:
  - { id: U4-05-DEF-01, name: 資金調達付き現物・先渡carry取引 }
  - { id: U4-05-DEF-02, name: 現物空売り・買い先渡のreverse carry取引 }
  - { id: U4-05-DEF-03, name: 売買可能なcarry超過額 }
theorems:
  - { id: U4-05-THM-01, name: 資金調達・空売り条件を含む先渡の無裁定必要条件 }
  - { id: U4-05-PROP-01, name: 摩擦なし・保管費なしの現物先渡等価式 }
  - { id: U4-05-PROP-02, name: 中間配当を満期へそろえる収支 }
  - { id: U4-05-PROP-03, name: 2回の値洗いがある買い先物の満期換算収支 }
canonical_examples:
  - ask100円・売り先渡bid108円・借入1.05・配当3円・保管費1円から満期5円を算出
  - 現物bid99円・買い先渡ask110円・運用1.02・配当3円・借株料2円から逆方向の赤字14.02円を算出
  - 実行可能先渡上下限103円と95.98円を別々に検証
  - 摩擦なし保管費なしの先渡等価式102円と保管費4円による上下限の乖離
  - 中間配当4円と運用1.01・借入1.06から上限101.96円を検算
  - 先物中間値洗い10円・終端値洗いマイナス5円の満期5.2円と先渡5円の差
  - 保管不可・空売り不可・同時気配不在の反証
