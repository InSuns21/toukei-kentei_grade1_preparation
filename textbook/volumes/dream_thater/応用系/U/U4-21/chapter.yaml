id: "U4-21"
title: "市場が示唆する成立確率とイベント時間"
volume: "foundations"
status: supplementary
prerequisites: [U4-20]
official_scope: []
learning_objectives:
  - 二状態の現金買収モデルで価格整合重みを逆算し存在範囲を必要十分に示せる
  - 示唆重みと自分の条件付き成立確率を区別し市場価格からの断定の限界を説明できる
  - 失敗価格・成立対価・割引因子・決着時刻に対する示唆重みの感度を計算できる
  - 成功と失敗で決着時刻が異なる場合の状態別割引価格式を導出できる
  - 決着時刻がランダムな場合に状態別の条件付き平均割引因子を導入できる
  - 同一の株価を説明する複数の確率・時間条件を構成し非識別を証明できる
  - 自分の成功確率・実際の買付価格・費用から期待現在価値差と閾値を求められる
  - モデル不整合・正の期待差・実行可能な無リスク裁定を混同せず判定できる
definitions:
  - { id: U4-21-DEF-01, name: "二状態モデルの価格整合的な示唆重み" }
  - { id: U4-21-DEF-02, name: "イベント状態別の割引因子" }
  - { id: U4-21-DEF-03, name: "個人の成立確率による期待現在価値差" }
theorems:
  - { id: U4-21-PROP-01, name: "二状態の逆算式と存在範囲" }
  - { id: U4-21-PROP-02, name: "二状態の示唆重みの局所感度" }
  - { id: U4-21-PROP-03, name: "状態別決着時刻の下での逆算式" }
  - { id: U4-21-PROP-04, name: "価格一つによる成立重みと決着時刻の非識別" }
canonical_examples:
  - 94円の買収価格で割引因子1と0.98に対する示唆重み0.8と約0.864の差を検算
  - 失敗価格60円・80円、割引因子0.96、対価105円の感度表
  - 割引因子0.93で示唆重みが1を超えるモデル不整合
  - 成功時割引因子0.98・失敗時0.94を用いた異時点決着とランダム時刻の計算
  - 同じ94円を再現する二組の割引因子と確率による非識別反例
  - 成功確率0.90と手数料・実際のaskによる期待価値差の符号逆転
