  - { id: U4-14-PROP-03, name: "ランク分解と基底変換の不変性" }
  - { id: U4-14-PROP-04, name: "Gaussian VECM の縮約ランク尤度" }
canonical_examples:
  - 3系列の共通トレンドと独立な2本の定常偏差
  - 共通トレンド係数行列の核によるランクの証明
  - 2系列の条件付き平均への誤差修正の影響
  - 3系列の正確なVECMと正定値ショック共分散
  - Johansenの2次元対角残差共分散と一般化固有値
  - ラグ・定数仕様を変える合成実験
  - 標本外係数変化による共和分崩壊の反例
