id: "U4-14"
title: "多変量共和分と誤差修正表現"
volume: "foundations"
status: supplementary
prerequisites: [U4-13, F0-00F, LA3B, F0-00F1, F0-00P7]
official_scope: []
learning_objectives:
  - 3系列の共和分空間とランクを分散計算から求められる
  - 共通確率トレンドの数と共和分ランクの関係を仮定込みで証明できる
  - VAR(p)からVECMへの係数変換を添字を追って導ける
  - 誤差修正の符号と調整方向を具体モデルで確認できる
  - Piのランク分解と基底変換を証明して正規化と識別を区別できる
  - Johansen法の残差共分散・一般化固有値・縮約尤度を説明できる
  - トレース統計量と最大固有値統計量を導出できる
  - 非標準臨界値・ラグ・決定論的項への感度を点検できる
  - 標本外の係数変化が共和分関係を壊す仕組みを示せる
  - 共和分の成立と取引可能性・無裁定性を区別できる
definitions:
  - { id: U4-14-DEF-01, name: "多変量共和分空間と共和分ランク" }
