id: "U4-02"
title: "有限市場の分離定理と状態価格の双対"
volume: "foundations"
status: supplementary
prerequisites: [U4-01, F0-00E1]
official_scope: []
learning_objectives:
  - 有限状態市場の保有数量、時点0の価格と時点1の受取額を行列の次元・符号・単位とともに設定できる
  - 同一ペイオフの価格一致を線形価格汎関数の定義可能性と核の条件で証明できる
  - 正の状態価格の方程式を全商品について解き非負と厳密に正を区別して検算できる
  - 非負単体と取引利得の部分空間を最短距離で分離する補題を再構成できる
  - 裁定の正規化主問題と正の状態価格の二者択一定理を必要十分の両方向で証明できる
  - 価格表のprimal裁定証明書またはdual価格整合証明書を手計算で提示できる
  - 状態価格の一意性と行列ランクを結び付け不完備市場の価格区間と境界裁定を判定できる
  - 空売りを禁止したとき無制約の分離定理をそのまま適用できない理由を反例で示せる
definitions:
  - { id: U4-02-DEF-01, name: 取引可能なペイオフの線形価格汎関数 }
  - { id: U4-02-DEF-02, name: 正の状態価格と価格整合証明書 }
  - { id: U4-02-DEF-03, name: 正規化した裁定探索問題 }
theorems:
  - { id: U4-02-PROP-01, name: 価格汎関数が定義できる条件 }
  - { id: U4-02-PROP-02, name: 裁定探索の実行可能性 }
  - { id: U4-02-LEM-01, name: 線形部分空間と非負単体の厳密分離 }
  - { id: U4-02-THM-01, name: 有限市場の裁定・状態価格の二者択一 }
  - { id: U4-02-PROP-03, name: 状態価格の一意性とペイオフの完備性 }
canonical_examples:
  - BとXの2状態価格方程式からq=(3/10,3/5)を計算しCの価格75円を再現
  - Cを80円にするとh=(1/2,1/2,-1)の初期受取り5円が主問題の解となる
  - 非負単体との最短距離の射影から全成分正の分離ベクトルを構成
  - B単独の不完備市場で新商品Xの無裁定価格範囲36<c<108を導く
  - c=36の境界でq_U=0と無料の上状態80円受取りを照合
  - Xの空売りを禁止すると正の状態価格がなくても裁定が消える反例
problem_patterns:
