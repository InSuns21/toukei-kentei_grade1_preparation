id: "U4-03"
title: "売値・買値・手数料・空売り制約を入れた裁定探索"
volume: "foundations"
status: supplementary
prerequisites: [U4-02, F0-00B]
official_scope: []
learning_objectives:
  - bid・askとmidの違いを同一ペイオフを持つ商品の実行可能価格で検算できる
  - 購入数量と空売り数量を分けて初期費用・満期借株料・状態別受取額を計算できる
  - 手数料・購入数量上限・借株枠・資金枠・空売り額面枠を線形制約として記述できる
  - 数量上限がある市場では裁定探索の規格化が失敗する理由を説明できる
  - 有界LPの最適値の正性と実行可能な裁定の同値性を証明できる
  - 有限生成錐と非負単体の分離から気配整合状態価格の必要十分条件を証明できる
  - 正の状態価格の購入・売却不等式を検算し、制約市場で必要条件にならない理由を説明できる
  - 借株料を状態別キャッシュフローへ加え、費用控除後の裁定証明書と上界証明を構成できる
  - 数値solverの実行可能性・最適性許容差と厳密な正性を区別して再検算できる
definitions:
  - { id: U4-03-DEF-01, name: 売買方向別の実行利得 }
  - { id: U4-03-DEF-02, name: 制約付き実行可能集合 }
  - { id: U4-03-DEF-03, name: 有界な制約付き裁定探索LP }
  - { id: U4-03-DEF-04, name: 売買気配と整合する正の状態価格 }
theorems:
  - { id: U4-03-PROP-01, name: 有界LPの最適値と裁定の同値性 }
  - { id: U4-03-LEM-01, name: 有限生成錐と非負単体の分離 }
  - { id: U4-03-THM-01, name: 比例費用付き無制約市場の裁定・気配整合の二者択一 }
canonical_examples:
  - Cのmid価格が複製midから1円ずれるがbid/askでは両方向とも損失となる例
  - q=(3/10,3/5)が3商品すべてのbid/ask区間に入る価格整合の検算
  - Cの売り手数料0.5円と満期借株料1円をBの1/100単位追加で相殺
  - Cの空売り禁止により無制約状態価格の不等式が満たされなくても無裁定となる例
  - 有限借株枠と買付資金枠の下で1.59円の初期受取りを達成し双対重みで最適性を証明
  - 1e-8円の価格差を厳密計算とsolver許容誤差で比較
