<svg xmlns="http://www.w3.org/2000/svg" width="600" height="300" viewBox="0 0 600 300" data-layout-lint="strict" role="img" aria-labelledby="bridge-title bridge-desc">
  <title id="bridge-title">両端点が同じでも障壁越境の有無は異なる</title>
  <desc id="bridge-desc">横軸を時間、縦軸を株価とし、水平障壁Hより下にある共通の始点と終点を結ぶ。実線は途中で障壁を上回り、破線は下に留まる。</desc>
  <rect width="600" height="300" fill="#ffffff"/>
  <path d="M72 36 V230 H558" fill="none" stroke="#303b4b" stroke-width="2"/>
  <path d="M74 100 H558" fill="none" stroke="#ad3f39" stroke-width="2.5" stroke-dasharray="10 5"/>
  <path d="M125 190 C205 174 230 52 309 68 C393 85 445 189 510 190" fill="none" stroke="#146b91" stroke-width="3.5" data-series-group="paths" data-series-label="crosses"/>
  <path d="M125 190 C205 205 255 150 330 176 S460 205 510 190" fill="none" stroke="#303b4b" stroke-width="3" stroke-dasharray="8 6" data-series-group="paths" data-series-label="stays-below"/>
  <circle cx="125" cy="190" r="5" fill="#303b4b"/>
  <circle cx="510" cy="190" r="5" fill="#303b4b"/>
  <text x="47" y="94" font-size="18" font-family="sans-serif" text-anchor="middle" fill="#933a35">H</text>
  <text x="53" y="36" font-size="15" font-family="sans-serif" text-anchor="middle" fill="#303b4b">S</text>
  <text x="125" y="270" font-size="15" font-family="sans-serif" text-anchor="middle" fill="#303b4b">0</text>
  <text x="510" y="270" font-size="15" font-family="sans-serif" text-anchor="middle" fill="#303b4b">T</text>
  <text x="559" y="270" font-size="15" font-family="sans-serif" text-anchor="middle" fill="#303b4b">t</text>
  <path d="M125 225 V232 M510 225 V232" stroke="#303b4b" stroke-width="2"/>
</svg>
