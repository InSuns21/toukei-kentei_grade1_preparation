id: "U3-33"
title: "層化抽出・重要度サンプリング"
volume: "foundations"
status: supplementary
prerequisites: [MC3, U3-14, U3-26, U3-32, U3-09]
official_scope: []
learning_objectives:
  - リスク中立GBMの正規変数を分位層に分割し条件付き分布から独立標本を生成できる
  - 金融層化推定量の不偏性・分散・比例配分と希少デジタル事象での改善率を検算できる
  - 正規平均シフトの提案分布と元のリスク中立密度の比から尤度重みを導出できる
  - 希少な満期閾値事象の厳密な二乗モーメント・分散を評価し過剰シフトの危険を説明できる
  - 離散監視上方ノックインの全経路への尤度比を証明し、連続監視と混同せず数値推定できる
  - 重みの和・二乗和から有効標本数を計算し、自己正規化の有限標本バイアスと低ESSを説明できる
  - 同じ経路評価予算で通常MC・層化・重点サンプリングの誤差を再現・比較できる
definitions:
  - { id: U3-33-DEF-01, name: "正規分位層によるGBM価格推定量" }
  - { id: U3-33-DEF-02, name: "正規平均シフトによる金融重点サンプリング" }
  - { id: U3-33-DEF-03, name: "離散監視上方ノックインの重み付き価格" }
  - { id: U3-33-DEF-04, name: "提案標本の有効標本数" }
theorems:
  - { id: U3-33-PROP-01, name: "正規層化推定量の分散と希少閾値" }
  - { id: U3-33-PROP-02, name: "Gaussianシフトの尤度比と閾値事象の分散" }
  - { id: U3-33-PROP-03, name: "多時点シフトの尤度比と離散監視事象" }
  - { id: U3-33-PROP-04, name: "自己正規化と有効標本数の限界" }
canonical_examples:
  - "s=100円,r=0.03,q=0,sigma=0.2,T=1年,H=180円の満期デジタル契約"
  - "分位層 [0,0.9],(0.9,0.99],(0.99,1] に各512標本、同費用1536標本の比較"
  - "標準正規のシフト lambda=2 と lambda=8 の真の二乗モーメント比較"
  - "4時点の離散監視上方ノックインデジタル契約の有限次元尤度比"
  - "独立反復の標本分散・固定seedによるPython検証"
