id: "U4-07"
title: "行使価格方向のオプション静的裁定"
volume: "foundations"
status: supplementary
prerequisites: [U4-06]
official_scope: []
learning_objectives:
  - 共通満期・原資産・契約倍率・決済条件を固定しコール満期受取額を状態別に計算できる
  - 前払先渡と割引債の受渡を用いてコールの上下限をポートフォリオから証明できる
  - 縦スプレッドの状態別受取額から単調性と割引行使価格差の上限を証明できる
  - 不等間隔の行使価格で蝶型の重みを導き全状態の受取額が非負であると証明できる
  - 離散傾きと凸性を同値変形し欠測行使価格の監査可能範囲を区別できる
  - bid/askでの実行可能な蝶型・縦スプレッドの必要条件と中値偽陽性を区別できる
  - 整数契約・板容量・固定費・空売り制約で静的裁定証明書の成立を検証できる
definitions:
  - { id: U4-07-DEF-01, name: 同一満期コールと行使価格格子 }
  - { id: U4-07-DEF-02, name: 不等間隔の蝶型スプレッド }
  - { id: U4-07-DEF-03, name: 静的スプレッドの実行可能な裁定証明書 }
theorems:
  - { id: U4-07-THM-01, name: コールの基本上下限 }
  - { id: U4-07-THM-02, name: 行使価格方向の単調性と縦スプレッド上限 }
  - { id: U4-07-THM-03, name: 蝶型非負性とコール価格の凸性 }
  - { id: U4-07-PROP-01, name: 不等間隔の離散傾き判定 }
  - { id: U4-07-THM-04, name: 売買気配に対する静的無裁定必要条件 }
canonical_examples:
  - 行使価格90・100・120円の満期受取額と整数比蝶型
  - 前払先渡100円・割引債0.96によるコール下限13.6円
  - 不等間隔90・100・120円の蝶型が与える中央価格上限38/3円
  - 中値蝶型は負費用でも実行気配の蝶型費用が2/3円となる反例
  - 欠測100円コールに許される仮想価格の範囲7から38/3円
  - 整数蝶型2対マイナス3対1と固定費・板容量による裁定成立条件
