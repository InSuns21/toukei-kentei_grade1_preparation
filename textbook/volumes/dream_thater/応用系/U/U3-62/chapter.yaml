  - { id: U3-62-THM-01, name: "離散最適清算の一意解と三重対角系" }
  - { id: U3-62-THM-02, name: "定数係数の離散最適在庫の解析解" }
  - { id: U3-62-PROP-02, name: "連続時間極限と境界値問題の解" }
  - { id: U3-62-PROP-03, name: "最適清算の費用とリスクの単調性" }
canonical_examples:
  - "100株2時間2区間の一定速度は期待費用60円・分散125円²"
