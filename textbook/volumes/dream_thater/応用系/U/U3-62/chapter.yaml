id: "U3-62"
title: "Almgren–Chriss 最適清算の導出"
volume: "foundations"
status: supplementary
prerequisites: [U3-61]
official_scope: []
learning_objectives:
  - 在庫と自己金融的な売却現金受取を対応づけ費用恒等式を導出できる
  - 売却前在庫により期待費用と価格変動に起因する分散を導出できる
  - リスク回避目的の係数・単位・仮定を説明できる
  - 離散Euler方程式と正定値三重対角行列を導出して一意性を証明できる
  - 双曲線関数の解析解を検算し非負の売却量を保証できる
  - 連続極限と境界値問題を導き一意の最適経路を求められる
  - コスト–リスクfrontierの単調性と先読みの禁止を説明できる
  - 三重対角ソルバーと解析解をPythonで比較して残差を検算できる
definitions:
  - { id: U3-62-DEF-01, name: "清算在庫と自己金融的な受取額" }
  - { id: U3-62-DEF-02, name: "平均費用と費用分散のリスク回避目的" }
theorems:
