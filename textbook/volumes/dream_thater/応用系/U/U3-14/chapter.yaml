id: "U3-14"
title: "幾何 Brown 運動と対数正規価格分布"
volume: "foundations"
status: supplementary
prerequisites: [U3-13, STO9]
official_scope: []
learning_objectives:
  - 幾何 Brown 運動を強解として定義し係数と単位を説明できる
  - 指数型の候補に Itô 公式を適用して SDE の陽解を構成し大域 Lipschitz 一意性と正値性を示せる
  - 対数正規価格密度の Jacobian と正規化および分位点を導ける
  - 対数増分と価格の平均・分散・中央値の違いを計算できる
  - 実数モーメントと条件付きモーメントを Brown 独立増分から再現できる
  - CRR 木の Brown 極限と定数係数 GBM の関係および測度の違いを説明できる
  - Python で解析的な分布特性と有限標本の統計誤差を照合できる
