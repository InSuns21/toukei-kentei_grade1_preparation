id: "U4-29"
title: "レジーム変化・テール・流動性のストレス監査"
volume: "foundations"
status: supplementary
prerequisites: [U4-16, U4-17, U4-20, U4-23, U4-24, U4-25, U4-27, U4-28]
official_scope: []
learning_objectives:
  - 基準時点の保有株数と将来の方向別約定価格から現金勘定と整合するストレス純損益を導出できる
  - 因子ショックと関係解消の固有残差を分け因子中立でも損失する例を再計算できる
  - 事前固定した有限シナリオの最大損失と稀な破綻事象を別々に計算し確率的保証と混同しない
  - 価格・費用の固定シナリオ下で最大損失の凸性とシナリオ追加に伴う単調性を証明できる
  - 追加証拠金額を保有継続の仮定の下で導き利用可能現金と比較できる
  - 借株回収や期限付き清算について銘柄別の累積約定容量による実行可能性を証明できる
  - 線形な板の限界価格を積分し清算時の価格インパクトと容量制約を区別できる
  - 平常利益と合併失敗・テール損失・資金停止を一つの時点整合した監査表へ統合できる
  - ストレスを選択後に付け替えずwalk-forwardと探索ログに接続し反証条件を保存できる
definitions:
  - { id: U4-29-DEF-01, name: "方向別退出費用付きストレス純損益" }
  - { id: U4-29-DEF-02, name: "因子ショックと関係解消残差" }
  - { id: U4-29-DEF-03, name: "有限シナリオの最大損失とテール事象" }
  - { id: U4-29-DEF-04, name: "保有継続に必要な追加証拠金" }
  - { id: U4-29-DEF-05, name: "期限付き銘柄別退出容量" }
  - { id: U4-29-DEF-06, name: "線形限界約定価格のインパクト" }
theorems:
  - { id: U4-29-PROP-01, name: "符号付き保有量の方向別退出損益恒等式" }
  - { id: U4-29-PROP-02, name: "固定シナリオ最大損失の凸性と単調性" }
  - { id: U4-29-PROP-03, name: "保有継続に必要な現金注入の最小額" }
  - { id: U4-29-PROP-04, name: "独立な銘柄別容量制約による期限内退出の必要十分条件" }
  - { id: U4-29-PROP-05, name: "線形板の総執行損失" }
canonical_examples:
  - 因子中立の2銘柄ペアが関係解消と方向別費用だけで30円失う例
  - 平常時99パーセントの1円利益と1パーセントの80円損失を区別するテール例
  - 2シナリオで固定価格の最大損失30円と損失予算25円を判定する例
  - 借株回収が必要な10株に対し2日で計8株の買戻し容量しかない例
  - 限界価格が注文量とともに低下する100株売却でインパクト500円となる例
  - 証拠金不足額430円と利用可能現金100円を照合する例
