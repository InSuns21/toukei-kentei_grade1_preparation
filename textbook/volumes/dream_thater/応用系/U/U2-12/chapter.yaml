id: "U2-12"
title: "軌跡を一括推定する：最小二乗と平滑化の入口"
volume: "foundations"
status: supplementary
prerequisites:
  - U2-11
official_scope: []
learning_objectives:
  - フィルタリングと固定区間平滑化が利用する観測の時刻を区別できる
  - 独立な線形Gaussian初期状態・運動・観測模型の密度を正しい次元と時刻添字で因子分解できる
  - 独立Gaussian誤差の負の対数事後から軌跡全体の重み付き二乗誤差目的関数を導ける
  - 正定値事前・過程雑音からバッチ目的関数の狭義凸性とMAP・事後平均の一致を証明できる
  - 隣接運動残差と各時刻の観測残差から正規方程式のブロック三重対角構造を導出できる
  - 三時刻の軌跡についてバッチ解と逐次Kalmanフィルタの差を数値で説明できる
  - 条件付き交差分散から後ろ向き平滑化利得の公式を導ける
  - 条件付き独立性と全分散の公式から固定区間平滑化の平均・分散再帰を証明できる
  - 未来の一回の観測で過去の状態が修正される例と事前情報欠落による非一意性を説明できる
  - Pythonでバッチ正規方程式・フィルタ・平滑化を独立に検算できる
definitions:
  - { id: U2-12-DEF-01, name: フィルタリングと固定区間平滑化 }
  - { id: U2-12-DEF-02, name: 軌跡の重み付き二乗誤差目的関数 }
  - { id: U2-12-DEF-03, name: 後ろ向き平滑化利得 }
theorems:
  - { id: U2-12-PROP-01, name: Gaussian 軌跡のバッチ最小二乗と事後平均 }
  - { id: U2-12-PROP-02, name: バッチ正規方程式のブロック三重対角構造 }
  - { id: U2-12-THM-01, name: 線形 Gaussian 固定区間平滑化の後ろ向き公式 }
canonical_examples:
  - 一歩のGaussian模型で時刻0のフィルタ平均0と平滑化平均2/3が異なる
  - 1次元三時刻の正規方程式が三重対角行列になり解が1/2,1,3/2となる
  - 同じ軌跡でKalmanフィルタは時刻1に2/3を返し平滑化は1へ修正する
  - 平滑化分散が5/8,1/2,5/8となりバッチ情報行列の逆行列と一致する
  - 初期位置の拘束を外した相対運動だけの軌跡には平行移動の零方向が残る
  - 最終観測だけの軌跡で過去の推定が3/4,3/2へ更新される
  - 標準ライブラリPythonで二種類の解法を相互検算する
