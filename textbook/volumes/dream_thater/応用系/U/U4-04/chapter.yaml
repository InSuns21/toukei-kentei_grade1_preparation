id: "U4-04"
title: "外国為替の三角裁定と同時刻気配"
volume: "foundations"
status: supplementary
prerequisites: [U4-03]
official_scope: []
learning_objectives:
  - 外国為替の基軸通貨・決済通貨とbid/askの売買方向を揃え有向換算率の単位を検算できる
  - 三角閉路の通貨数量と換算積を計算し同じ通貨での利益・損失を厳密に判定できる
  - 収益的閉路と負の対数閉路の同値性を導出できる
  - 無収益閉路と正の通貨評価係数による整合証明書の必要十分性を証明できる
  - 整合証明書を用いて任意の有限回の交換からの無償の正残高を排除できる
  - 各脚の受取額・支払額・板の投入容量から実行可能な最大開始額を計算できる
  - 比例・固定手数料や端数・ロット条件を正しい通貨単位で反映し偽陽性を反証できる
  - 気配の有効時刻・決済条件・多脚約定の不一致が理論的裁定と実現可能性を分ける理由を説明できる
definitions:
  - { id: U4-04-DEF-01, name: 実行可能な有向換算率 }
  - { id: U4-04-DEF-02, name: 閉路換算積と閉路裁定 }
  - { id: U4-04-DEF-03, name: 通貨評価係数による整合証明書 }
theorems:
  - { id: U4-04-PROP-01, name: 換算積と対数閉路の同値 }
  - { id: U4-04-THM-01, name: 収益的な閉路と整合証明書の二者択一 }
  - { id: U4-04-PROP-02, name: 閉路の各脚の容量上限 }
canonical_examples:
  - EUR/USD 1.1000/1.1002を使った双方向換算とbid/askの違いの確認
  - USD→EUR→JPY→USDの1000 USDでの実行換算積と1.369034 USDの無費用利得
  - 反対回りの換算積が1未満となる例
  - 非収益的な3辺の有向交換グラフに対する正の通貨評価係数の直接検算
  - 3脚各0.1%手数料で収益的閉路が消え各0.02%なら残る計算
  - 端数切捨てで連続数量の理論利得が消失する合成例
  - 混合時刻の気配から同時約定可能性が推定できない反例
problem_patterns:
