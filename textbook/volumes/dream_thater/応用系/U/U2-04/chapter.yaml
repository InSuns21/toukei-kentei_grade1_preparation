id: "U2-04"
title: "Kalman フィルタの予測：運動誤差の伝播"
volume: "foundations"
status: supplementary
prerequisites:
  - U2-03
official_scope: []
learning_objectives:
  - 観測後の時刻t-1と観測前の時刻tを区別し条件付き予測beliefを定義できる
  - 線形Gaussian運動模型の状態・制御入力・過程雑音の意味と行列次元を確認できる
  - 条件付き期待値と共分散の外積展開から平均・分散共分散の予測公式を導出できる
  - 先行状態と独立Gaussian雑音から予測分布がGaussianになる理由を説明できる
  - 正定値の予測共分散となる必要十分条件を二次形式で証明できる
  - 1次元の二時刻予測を観測有無と添字に注意して検算できる
  - 位置・速度の運動と共有加速度雑音の非対角共分散を計算できる
  - 過去誤差と相関する過程雑音が標準予測公式を破る機構を示せる
  - 既知制御と未知ランダム制御の条件付き分散の差を説明できる
  - 予測と既習のGaussian観測更新を順序通り接続できる
definitions:
  - { id: U2-04-DEF-01, name: 線形 Gaussian 運動模型 }
  - { id: U2-04-DEF-02, name: 線形運動の予測 belief }
theorems:
  - { id: U2-04-THM-01, name: 線形 Gaussian 運動の予測公式 }
  - { id: U2-04-PROP-01, name: 予測共分散が正定値となる条件 }
  - { id: U2-04-PROP-02, name: 過去の誤差と過程雑音が相関する場合 }
canonical_examples:
  - 1次元の指令3m、分散4+1による予測平均5m・分散5m2
  - 観測がない二時刻で平均4m・分散7m2を追跡
  - 位置速度の二次元模型で予測平均(2,3)、共分散[[6,3],[3,5]]
  - F=Q=0で正定値共分散が退化する反例
  - W=-eで交差共分散を無視すると分散0を2と誤算する反例
  - 分数演算のPythonラボと10本の単体検査
