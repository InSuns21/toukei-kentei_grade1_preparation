id: "U3-63"
title: "最適執行の数値最適化と感度"
volume: "foundations"
status: supplementary
prerequisites: [U3-62]
official_scope: []
learning_objectives:
  - 事前予測出来高・参加率・速度上限から固定容量を導き終端全量清算の実行可能性を判定できる
  - 時間別一時インパクト係数の凸二次目的・費用分散・その勾配を在庫から導出できる
  - 厳密凸性・最適性の変分不等式・唯一解を証明できる
  - 箱制約付き単体への射影を導出し反復射影勾配法の収束と残差を説明できる
  - 定数係数・無制約のAlmgren–Chriss参照解と制約付き数値解を照合できる
  - リスク回避・一時係数・容量・恒久係数を変えた感度と制約の折点を手計算できる
  - 将来出来高の先読みを避け、容量不足とモデル仮定の破綻を識別できる
definitions:
  - { id: U3-63-DEF-01, name: "事前容量と全量清算の実行可能集合" }
  - { id: U3-63-DEF-02, name: "時間別インパクトを含む制約付き平均分散目的" }
theorems:
  - { id: U3-63-THM-01, name: "制約付き執行二次計画の存在と一意性" }
  - { id: U3-63-THM-02, name: "容量付き単体へのEuclid射影" }
  - { id: U3-63-THM-03, name: "射影勾配反復の収束と誤差上界" }
  - { id: U3-63-PROP-01, name: "制約下の費用と分散の単調性" }
  - { id: U3-63-PROP-02, name: "二期間モデルの容量感度と折点" }
canonical_examples:
  - "100株2区間・先行区間60株上限・lambda1で(60,40)、期待費用62円、分散116円²"
  - "lambda0で(50,50)、lambda0.5から上限に達して感度が折れる"
  - "時間別eta・容量変更と無制約参照解の数値比較"
