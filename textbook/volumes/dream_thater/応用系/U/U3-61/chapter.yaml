id: "U3-61"
title: "市場インパクトと価格形成"
volume: "foundations"
status: supplementary
prerequisites: [U3-60]
official_scope: []
learning_objectives:
  - 注文直前中値・注文後中値・平均約定価格を区別し線形インパクト模型を単位付きで計算できる
  - 恒久的・一時的価格差の違いと注文内平均の1/2の根拠を説明できる
  - 売却コスト恒等式を有限和の展開から導出し恒久成分の二重計上を避けられる
  - 売却前在庫で独立な外生価格増分の期待コストと分散を導出できる
  - べき乗型一時インパクトの係数の単位を確認し一定速度の最小性を証明できる
  - 合成データからインパクト係数を逆算し実市場における因果的識別の限界を説明できる
  - ブラウザPythonとCLIで価格の前後・売却代金・確率的費用成分を検算できる
definitions:
  - { id: U3-61-DEF-01, name: "線形の一時的・恒久的市場インパクト模型" }
  - { id: U3-61-DEF-02, name: "全量売却の執行コストと売却前在庫" }
  - { id: U3-61-DEF-03, name: "外生価格増分の拡散型模型" }
  - { id: U3-61-DEF-04, name: "べき乗型の一時的インパクト" }
theorems:
  - { id: U3-61-PROP-01, name: "線形インパクトの執行コスト恒等式" }
  - { id: U3-61-PROP-02, name: "期待コストと売却前在庫による分散" }
  - { id: U3-61-PROP-03, name: "べき乗型一時コストを最小化する一定速度" }
canonical_examples:
  - "40株を1時間で売ると恒久中値差0.08円・一時差0.40円・平均約定単価99.56円"
  - "100株を(40,60)で売ると恒久費用10円・一時費用52円・合計62円"
  - "独立な外生増分σ0.1円／株／√時間なら(40,60)の費用分散136円²"
  - "外生ショック(+0.10,-0.05)で(40,60)の実現費用55円"
  - "一時指数1/2で(25,75)の費用約77.45円、(50,50)は約70.71円"
