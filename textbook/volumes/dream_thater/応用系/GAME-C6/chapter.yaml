  - { id: GAME-C6-COR-01, name: 対称な時間費用と Nash 交渉解 }
  - { id: GAME-C6-PROP-02, name: 遅延消失極限のプロトコル依存性 }
canonical_examples:
  - "delta_i(h)=exp(-r_i h) の単位パイで初回提案者1の取り分が h→0 で r_2/(r_1+r_2) へ収束する例"
  - "r_1=r_2 のとき単位パイの極限が (1/2,1/2) となり、通常の Nash 交渉解と一致する例"
  - "余剰フロンティア s_2=1-s_1^2 で対称な時間費用なら極限が (1/sqrt(3),2/3) となる例"
  - "同じフロンティアで r_1=2,r_2=1 とすると極限が (1/sqrt(5),4/5) となり、重み付き Nash 解として制度依存性が残る例"
