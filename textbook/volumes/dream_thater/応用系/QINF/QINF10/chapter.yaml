  - { id: QINF10-PROP-01, name: "可換状態の尤度比較" }
  - { id: QINF10-PROP-02, name: "二つの純粋状態の識別公式" }
  - { id: QINF10-PROP-03, name: "チャネル下での最適識別性能の単調性" }
canonical_examples:
  - "直交・同一の二状態と偏った事前確率"
  - "可換qubit混合状態の古典的尤度判定"
  - "|0>と|+>の最適射影測定・計算基底測定の比較"
  - "雑音で非対角成分が消える場合の識別性能"
