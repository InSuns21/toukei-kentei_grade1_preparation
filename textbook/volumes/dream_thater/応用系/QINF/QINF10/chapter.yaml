id: "QINF10"
title: "二状態識別とHelstrom界"
volume: "foundations"
status: supplementary
prerequisites:
  - QINF2
  - QINF5
  - QINF7
official_scope: []
learning_objectives:
  - 二状態の事前確率と二結果POVMから平均成功確率・平均誤り確率を構成し、一般の結果集合も二値判断へ集約できる
  - Helstrom作用素の正負・零固有空間を用いた最適効果作用素を構成し、核上の非一意性を説明できる
  - 正部分の変分原理を証明し、重み付きトレースノルムによるHelstrom界を誤り確率まで導出できる
  - 可換状態・同一状態・直交状態・非直交純粋状態で最適測定と誤り確率を直接計算できる
  - 事前確率の偏りと量子チャネルによる情報損失が最適識別性能へ与える影響を検算できる
definitions:
  - { id: QINF10-DEF-01, name: "二状態最小誤り識別" }
  - { id: QINF10-DEF-02, name: "Helstrom作用素とその正負部分" }
  - { id: QINF10-DEF-03, name: "有限次元トレースノルム" }
theorems:
