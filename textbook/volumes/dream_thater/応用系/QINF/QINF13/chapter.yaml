id: "QINF13"
title: "テレポーテーションと超密符号化"
volume: "foundations"
status: supplementary
prerequisites:
  - QINF1
  - QINF2
  - QINF3
  - QINF5
  - QINF6
  - QINF7
  - QINF12
official_scope: []
learning_objectives:
  - Bell基底の正規直交性と射影測定条件を確認し、CNOT・HadamardからBell測定回路を導出できる
  - 任意の純粋・混合qubitにテレポーテーション恒等式を適用し、各測定確率とPauli補正を順に検算できる
  - Aliceの二古典ビットが到着する前はBobの状態がI/2であることを証明し、複製不能定理との整合性を説明できる
  - Bell対への四つの局所ユニタリから超密符号化と完全復号を構成し、転置の対応を証明できる
  - エンタングルメントの有無による零誤り識別可能数と、ebit・cbit・qubitの通信資源を区別して算定できる
