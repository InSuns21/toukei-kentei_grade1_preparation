id: "QINF8"
title: "Stinespring表現と相補チャネル"
volume: "foundations"
status: supplementary
prerequisites:
  - QINF3
  - QINF4
  - QINF7
official_scope: []
learning_objectives:
  - 有限次元等長写像を定義し、Kraus完全性関係からStinespring等長写像を構成して入出力の次元と内積保存を検算できる
  - 環境の部分トレースが元の量子チャネルを与えること、およびすべての有限次元チャネルにこの表現が存在することを両方向から証明できる
  - 相補チャネルを定義し、その行列成分と完全正値性・トレース保存性を導ける
  - 振幅減衰と位相緩和について出力側・環境側の状態を計算し、環境へ漏れる情報を区別できる
  - 環境の最小次元と同じチャネルの環境表現の等長写像による非一意性を、精製の一意性から証明できる
  - 環境基底のKrausラベルと物理的測定記録を区別し、ユニタリ実現の次元条件を説明できる
definitions:
  - { id: QINF8-DEF-01, name: "Stinespring等長写像と環境系" }
  - { id: QINF8-DEF-02, name: "相補チャネル" }
theorems:
