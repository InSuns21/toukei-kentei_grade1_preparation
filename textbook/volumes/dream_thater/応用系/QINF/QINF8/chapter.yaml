  - { id: QINF8-PROP-01, name: "相補チャネルのKraus行列成分" }
  - { id: QINF8-PROP-02, name: "等長写像のユニタリ拡張" }
  - { id: QINF8-THM-02, name: "最小環境次元と環境表現の非一意性" }
  - { id: QINF8-PROP-03, name: "振幅減衰の相補チャネル" }
canonical_examples:
  - "振幅減衰の等長写像で直交性・正規化を各基底に対して検算"
  - "リセットチャネルでは出力が一定でも環境へ入力状態が移る"
  - "振幅減衰の相補写像がパラメータ1−γの振幅減衰と一致する"
  - "位相緩和の相補写像はZ期待値を受け取るが位相には依存しない"
  - "Krausラベルの回転と環境のユニタリ変換"
