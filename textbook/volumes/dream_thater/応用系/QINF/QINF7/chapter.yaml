  - { id: QINF7-PROP-02, name: "チャネルの合成と古典的混合" }
  - { id: QINF7-PROP-03, name: "チャネルと観測量の双対作用" }
canonical_examples:
  - "転置の正値性とBell状態に対する部分転置の負固有値"
  - "計算基底初期化チャネルと入力・出力次元の区別"
  - "位相緩和の非対角成分、脱分極のPauli Kraus和、振幅減衰の人口移動"
  - "振幅減衰と脱分極の合成順序依存"
