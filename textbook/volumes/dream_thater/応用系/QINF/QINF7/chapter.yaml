id: "QINF7"
title: "量子チャネルとKraus表示"
volume: "foundations"
status: supplementary
prerequisites:
  - QINF1
  - QINF2
  - QINF3
  - QINF5
official_scope: []
learning_objectives:
  - 正写像・完全正写像・量子チャネルを定義し、転置写像が正でトレース保存でも完全正でないことをBell状態で検算できる
  - 有限次元の完全正写像がKraus表示を持つことを行列単位と正値行列のスペクトル分解から証明できる
  - Kraus表示の完全正値性とトレース保存条件を導き、入出力次元と作用素積の順序を確認できる
  - 位相緩和・脱分極・振幅減衰のKraus作用素と出力を計算し、各雑音が失わせる情報を区別できる
  - 量子チャネルの合成・混合・測定instrumentとの関係と双対作用を計算できる
