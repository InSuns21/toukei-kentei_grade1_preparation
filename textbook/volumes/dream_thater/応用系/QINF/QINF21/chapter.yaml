  - { id: QINF21-PROP-01, name: "Holevo情報の範囲と零の等号条件" }
  - { id: QINF21-THM-01, name: "Holevo界" }
  - { id: QINF21-PROP-02, name: "可換アンサンブルにおけるHolevo界の達成" }
  - { id: QINF21-PROP-03, name: "送信前の量子チャネルでHolevo情報は増えない" }
canonical_examples:
  - "同一・直交・可換で混合した二状態のHolevo情報と測定相互情報量"
  - "非直交純粋状態|0>と|+>の平均状態の固有値と二種類の測定"
  - "位相消失チャネルがアンサンブルの古典情報を減らす例"
