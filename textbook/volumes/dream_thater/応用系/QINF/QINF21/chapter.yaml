id: "QINF21"
title: "Holevo情報と測定の限界"
volume: "foundations"
status: supplementary
prerequisites:
  - QINF5
  - QINF10
  - QINF17
  - QINF18
  - QINF20
official_scope: []
learning_objectives:
  - 有限アンサンブルと古典量子状態を正半定値性・正規化・周辺状態まで確認して構成できる
  - 古典量子状態のブロック固有値からHolevo情報と量子相互情報量の一致を導出できる
  - 任意の有限POVMの測定結果を古典通信路として表し、データ処理不等式からHolevo界を証明できる
  - Holevo情報の非負性・Shannonエントロピー上界と、可換・直交・同一状態の等号例を説明できる
  - 非直交二状態と量子チャネルによる情報損失を計算し、最小誤りと最大相互情報量を区別できる
definitions:
  - { id: QINF21-DEF-01, name: "密度演算子アンサンブル" }
  - { id: QINF21-DEF-02, name: "古典量子状態" }
  - { id: QINF21-DEF-03, name: "Holevo情報" }
  - { id: QINF21-DEF-04, name: "可アクセス情報量" }
theorems:
