id: "QINF6"
title: "Schmidt分解"
volume: "foundations"
status: supplementary
prerequisites:
  - QINF3
  - QINF4
  - LA6
official_scope: []
learning_objectives:
  - 二部純粋状態のSchmidt表示・Schmidt係数・Schmidt階数を定義し、直交性と正規化を具体例で検算できる
  - 係数行列の複素特異値分解からSchmidt分解を構成し、B側ベクトルの複素共役の位置と零特異値を検証できる
  - 二つの縮約状態の非零固有値が重複度込みで一致することを示し、rank・純粋性・測定確率を求められる
  - Schmidt階数1と積状態を同値と判定し、局所ユニタリ不変性と退化係数での基底非一意性を説明できる
  - 複素位相・長方形係数行列を含む具体的状態でSchmidt係数と局所状態を計算できる
definitions:
  - { id: QINF6-DEF-01, name: "Schmidt表示とSchmidt係数" }
  - { id: QINF6-DEF-02, name: "Schmidt階数" }
