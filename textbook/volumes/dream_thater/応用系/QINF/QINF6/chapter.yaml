  - { id: QINF6-PROP-01, name: "Schmidt階数と積状態" }
  - { id: QINF6-PROP-02, name: "局所ユニタリとSchmidt係数の不変性" }
canonical_examples:
  - "二qubit部分もつれ状態の定義確認と縮約の純粋性"
  - "位相を持つ二qubit状態のSchmidt基底と複素共役の扱い"
  - "二×三係数行列での零特異値・非零固有値・Schmidt階数"
  - "等しいSchmidt係数での基底非一意性"
