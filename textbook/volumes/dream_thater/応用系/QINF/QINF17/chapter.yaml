id: "QINF17"
title: "von Neumannエントロピー"
volume: "foundations"
status: supplementary
prerequisites:
  - QINF2
  - QINF3
  - QINF6
  - QINF14
  - INFO1
official_scope: []
learning_objectives:
  - 有限次元密度演算子の固有値からvon Neumannエントロピーを定義し、零固有値の規約と基底独立性を説明できる
  - エントロピーの非負性、rankによる上限、次元による最大値を証明し、純粋状態と最大混合状態の等号条件を判定できる
  - ユニタリ共役不変性とテンソル積の加法性を固有値の積から証明し、零固有値を含む例に適用できる
  - 古典対角状態のShannonエントロピーへの一致、二値エントロピー、majorizationに対する単調性を計算できる
  - 純粋二部系で両側のエントロピーが等しいことをSchmidt分解から導き、Bell対・積状態・古典相関状態を区別できる
definitions:
  - { id: QINF17-DEF-01, name: "von Neumannエントロピー" }
theorems:
  - { id: QINF17-THM-01, name: "von Neumannエントロピーの上下限と等号条件" }
  - { id: QINF17-PROP-01, name: "ユニタリ共役に対するエントロピー不変性" }
  - { id: QINF17-PROP-02, name: "テンソル積状態のエントロピー加法性" }
  - { id: QINF17-PROP-03, name: "古典対角状態とShannonエントロピー" }
  - { id: QINF17-PROP-04, name: "純粋二部状態の縮約エントロピーの一致" }
  - { id: QINF17-PROP-05, name: "majorizationによるエントロピーの単調性" }
canonical_examples:
  - "二qubit Bell純粋状態と両側の最大混合縮約"
  - "古典相関混合状態とBell純粋状態の局所・全体エントロピー比較"
  - "非対角qubit状態の固有値と二値エントロピー"
  - "零固有値を含む三準位状態とrank上限"
