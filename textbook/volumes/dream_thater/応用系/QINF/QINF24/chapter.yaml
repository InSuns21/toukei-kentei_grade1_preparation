  - { id: QINF24-LEM-03, name: "典型平坦化と達成可能率" }
  - { id: QINF24-LEM-04, name: "条件付きエントロピーの連続性" }
  - { id: QINF24-THM-01, name: "Lloyd–Shor–Devetak量子容量定理" }
  - { id: QINF24-THM-02, name: "劣化可能チャネルの単一文字式" }
  - { id: QINF24-THM-03, name: "量子消失チャネルの容量" }
