id: QINF24
title: "量子通信容量とcoherent information"
volume: foundations
status: supplementary
prerequisites: [QINF4, QINF7, QINF8, QINF11, QINF12, QINF17, QINF18, QINF19, QINF22, QINF23, INFO3]
official_scope: []
learning_objectives:
  - 参照系と最大エンタングル状態を用いて量子通信のブロック符号・エンタングルメント忠実度・達成可能率を定義し古典符号との違いを説明できる
  - coherent informationを条件付きエントロピーと相補チャネルのエントロピー差として導き、雑音チャネルで計算できる
  - 環境とのデカップリングから復号の存在を導き、ランダム部分空間・典型部分空間による達成可能性の核心を再構成できる
  - 条件付きエントロピーの連続性とデータ処理を使い一般量子容量の逆定理と正則化LSD式を説明できる
  - 消失チャネルの劣化可能性・反劣化可能性を判定し量子容量を厳密に計算できる
definitions:
  - { id: QINF24-DEF-01, name: "量子通信符号とエンタングルメント伝送容量" }
