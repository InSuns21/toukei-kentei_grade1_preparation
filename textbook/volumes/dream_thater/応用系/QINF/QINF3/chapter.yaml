  - { id: QINF3-PROP-02, name: "縮約状態と局所測定の周辺確率" }
  - { id: QINF3-THM-02, name: "純粋状態の積性と縮約の純粋性" }
  - { id: QINF3-PROP-03, name: "局所ユニタリと非選択射影測定の不変性" }
  - { id: QINF3-PROP-04, name: "三部系の逐次部分トレース" }
canonical_examples:
  - "二qubit積状態の片側縮約とtrace保存"
