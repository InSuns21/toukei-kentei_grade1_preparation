id: "QINF3"
title: "部分トレースと縮約状態"
volume: "foundations"
status: supplementary
prerequisites:
  - QINF1
  - QINF2
official_scope: []
learning_objectives:
  - 有限次元複合系の部分トレースを基底表示から定義し、局所期待値による一意な特徴づけと基底独立性を証明できる
  - 部分トレースの線形性・正値性・trace保存、積状態への作用を成分から検証できる
  - Bell純粋状態と古典相関混合状態の縮約状態を求め、同じ周辺状態から全系の相関を復元できないことを説明できる
  - 二部純粋状態の縮約のrank・純粋性と積状態条件の同値を、係数行列を用いて証明できる
  - 局所ユニタリ、結果を捨てた局所射影測定、三部系の逐次部分トレースについて縮約状態を計算できる
