official_scope: []
learning_objectives:
  - トレース距離を測定結果の全変動距離として特徴づけ、二状態識別と結び付けられる
  - 有限次元量子チャネルによるトレース距離の縮小を双対写像から証明できる
  - 平方根忠実度と二乗忠実度を区別し、純粋状態・可換混合状態で算出できる
  - Uhlmann定理を正準精製・極分解・補助系のユニタリ自由度から導ける
  - 忠実度のチャネル下の単調性とFuchs–van de Graaf不等式を証明・適用できる
  - 雑音チャネルの具体例で両指標と識別誤りを突き合わせられる
