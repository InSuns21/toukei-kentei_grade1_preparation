id: "QINF18"
title: "条件付きエントロピーと相互情報量"
volume: "foundations"
status: supplementary
prerequisites:
  - QINF3
  - QINF4
  - QINF17
  - INFO1
official_scope: []
learning_objectives:
  - 二部密度演算子の部分トレースから量子条件付きエントロピーと量子相互情報量を定義し、積・古典相関・Bell状態で計算できる
  - 純粋二部系の縮約エントロピーの一致を用い、負の条件付きエントロピーと相互情報量が二倍になる理由を説明できる
  - 有限行列の固有基底と対数不等式から部分加法性を証明し、相互情報量の非負性と積状態の等号条件を導ける
  - 精製と部分加法性からAraki–Lieb不等式を証明し、等号例および条件付きエントロピーの上下限を検算できる
  - 古典同時分布では条件付きエントロピーが非負であることを示し、量子純粋相関・古典相関・無相関の違いを判定できる
