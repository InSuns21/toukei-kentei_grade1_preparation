id: "QINF16"
title: "Bell不等式とCHSH"
volume: "foundations"
status: supplementary
prerequisites:
  - QINF2
  - QINF3
  - QINF5
  - QINF13
  - QINF15
official_scope: []
learning_objectives:
  - 二つの測定設定と二値結果の条件付き確率を定義し、局所隠れ変数模型の因子化と測定設定の独立性を区別できる
  - 確率的な局所応答まで含め、CHSH式の古典上界2を全ての設定に対して導ける
  - 二値POVMからHermitian収縮作用素を構成し、量子相関とCHSH作用素を密度演算子の期待値として表せる
  - 有限次元の任意の二値局所測定についてTsirelson上界2√2を証明できる
  - Bell対とPauli測定により上界を達成し、可換性・局所測定条件を検算できる
  - 分離可能性・CHSH違反・無信号条件の論理関係を具体的な混合状態と非量子的確率表から区別できる
