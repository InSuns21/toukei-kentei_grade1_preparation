id: "QINF5"
title: "一般化量子測定"
volume: "foundations"
status: supplementary
prerequisites:
  - QINF1
  - QINF2
  - QINF3
  - QINF4
official_scope: []
learning_objectives:
  - 射影測定の限界を三結果qubit測定で示し、POVMの正値性・完全性とBorn確率を検算できる
  - POVMの効果作用素と測定instrumentの状態変化を区別し、同一POVMの異なる状態更新を計算できる
  - 結果ごとの測定演算子による状態更新、非選択状態、零確率結果の扱いを導出できる
  - 任意の有限POVMを等長写像と補助系の射影測定に拡張し、ユニタリ実現まで証明できる
  - 複数測定演算子を含む有限instrumentの補助系実現を示し、測定確率と条件付き状態を追跡できる
definitions:
  - { id: QINF5-DEF-01, name: "POVMと効果作用素" }
  - { id: QINF5-DEF-02, name: "有限Kraus型測定instrument" }
theorems:
