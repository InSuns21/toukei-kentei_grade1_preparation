  - { id: QINF5-PROP-02, name: "instrumentの確率と状態更新" }
  - { id: QINF5-THM-01, name: "有限POVMのNaimark拡張" }
  - { id: QINF5-THM-02, name: "有限Kraus型instrumentの補助系実現" }
canonical_examples:
