id: "QINF20"
title: "量子相対エントロピーとデータ処理"
volume: "foundations"
status: supplementary
prerequisites:
  - QINF3
  - QINF5
  - QINF7
  - QINF8
  - QINF17
  - QINF18
  - QINF19
  - INFO2
official_scope: []
learning_objectives:
  - 有限次元量子相対エントロピーを台の包含条件付きで定義し、可換・非可換・無限大の例を区別できる
  - 非負性と等号条件を既習の非可換対数比較から導き、ユニタリ・等長変換での不変性を確認できる
  - 正定値行列の部分トレース比較を正半定値へ拡張し、零固有値の極限と出力の台包含を証明できる
  - Stinespring表現を用いて任意の有限次元量子チャネルのデータ処理不等式を証明できる
  - 相互情報量・強劣加法性・古典測定・等号例へ不等式を適用し、一般の等号構造定理との境界を説明できる
