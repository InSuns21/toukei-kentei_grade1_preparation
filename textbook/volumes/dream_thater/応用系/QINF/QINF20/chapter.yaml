  - { id: QINF20-LEM-02, name: "零固有値を許す部分トレース単調性" }
  - { id: QINF20-THM-01, name: "量子相対エントロピーのデータ処理不等式" }
  - { id: QINF20-COR-01, name: "局所チャネルによる量子相互情報量の単調性" }
  - { id: QINF20-PROP-02, name: "古典的粗視化の相対エントロピー差と等号" }
canonical_examples:
  - "純粋状態と最大混合状態、直交純粋状態のsupport条件"
  - "位相消失チャネルによる|+>と最大混合状態の識別情報の減少"
  - "Bell対・古典相関・積状態の相互情報量をチャネル処理で比較"
