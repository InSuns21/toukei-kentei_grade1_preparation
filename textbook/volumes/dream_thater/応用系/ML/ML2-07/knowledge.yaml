    introduction: formal
    introduction_aliases: ["定義（因子分析と確率的主成分分析）"]
    requires: [learning.continuous-gaussian-factor-model]
  - id: learning.factor-gaussian-marginal
    name: 因子模型の周辺Gaussian分布と共分散
    kind: theorem
    introduction: formal
    introduction_aliases: ["定理（因子模型の周辺Gaussian分布と共分散）"]
    requires: [learning.factor-analysis-ppca]
  - id: learning.factor-posterior-reconstruction
    name: 潜在因子の条件付き事後分布と再構成
