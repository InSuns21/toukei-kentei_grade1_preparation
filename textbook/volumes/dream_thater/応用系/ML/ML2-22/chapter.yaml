id: "ML2-22"
title: "敵対的生成モデルと分布比較"
volume: "foundations"
status: supplementary
prerequisites: [ML2-01, ML2-14]
official_scope: []
learning_objectives:
  - 有限集合で生成分布・識別器・敵対的目的を台と端点の対数規約込みで定義できる
  - 固定生成分布に対する最適識別器を凹性から導き零確率点での最適値と非達成を区別できる
  - Jensen–Shannon発散のKL表示・上下界・等号条件と最適識別器の価値との恒等式を証明できる
  - 共通基準測度の連続密度で必要な台・可測性・可積分性を確認できる
  - 台が分離する場合の飽和と固定識別器での勾配・非飽和生成損失の相違を説明できる
  - mode collapseを具体例で診断し大域最適性と交互最適化の違いを区別できる
  - 決定的な離散交互更新ラボで識別器の勾配・JS発散・生成分布を再計算できる
definitions:
  - { id: ML2-22-DEF-01, name: 敵対的生成モデルと識別器の価値関数 }
  - { id: ML2-22-DEF-02, name: Jensen–Shannon発散 }
theorems:
  - { id: ML2-22-THM-01, name: 固定生成分布の最適識別器 }
  - { id: ML2-22-THM-02, name: 敵対的価値とJensen–Shannon発散の恒等式 }
  - { id: ML2-22-PROP-01, name: Jensen–Shannon発散の上下界と台の分離 }
  - { id: ML2-22-PROP-02, name: 識別器logitと生成器softmaxの勾配 }
canonical_examples:
  - 二点分布の最適識別器と価値・発散の一致
  - 観測されない点の識別器の不定性と端点最適
  - 完全分離した台の飽和とmode collapseの差
  - 識別器logitと生成器softmaxの勾配
  - 固定設定での交互更新とJS発散の数値実験
problem_patterns: [ML2-22-A01, ML2-22-A02, ML2-22-A03, ML2-22-A04, ML2-22-B01, ML2-22-B02, ML2-22-B03, ML2-22-B04, ML2-22-C01]
