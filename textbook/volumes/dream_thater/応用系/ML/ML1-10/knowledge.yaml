  - id: learning.minibatch-gradient
    name: 復元抽出ミニバッチ勾配
    kind: definition
    introduction: formal
    introduction_aliases: ["定義（復元抽出ミニバッチ勾配）"]
    requires: [learning.stochastic-gradient-estimator]
  - id: learning.minibatch-variance
    name: ミニバッチの不偏性と分散の縮小
