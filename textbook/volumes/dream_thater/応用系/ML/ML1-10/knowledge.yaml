    introduction_aliases: ["定理（強凸・分散上界下での定数歩幅の誤差床）"]
    requires: [learning.sgd-expected-descent]
  - id: learning.sgd-exact-quadratic
    name: 二標本二次模型の正確な二乗誤差
    kind: theorem
