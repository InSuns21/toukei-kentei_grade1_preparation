id: "ML1-11"
title: "k近傍法・核密度推定"
volume: "foundations"
status: supplementary
prerequisites:
  - ML1-02
  - ML1-07
official_scope: []
learning_objectives:
  - Euclid距離・近傍数kと二種類の同点規則を固定し近傍集合を計算できる
  - k近傍回帰・分類を局所二乗損失と0–1損失の最小化として証明できる
  - 密度推定用の非負正規化核と正定値核の相違を説明できる
  - 核密度推定のhのp乗と全積分1を変数変換で導出できる
  - i.i.d.標本下の期待KDEを積分表示し箱型核の局所期待収束を証明できる
  - 帯域幅と近傍数の変化を具体標本で計算し予測最適性と区別できる
  - 二値立方体模型の距離集中を二乗平均・分散・確率上界から説明できる
  - 手動実装の計算ラボでk近傍とKDEの再計算を検証できる
definitions:
  - { id: ML1-11-DEF-01, name: k近傍集合 }
  - { id: ML1-11-DEF-02, name: k近傍回帰・分類予測器 }
  - { id: ML1-11-DEF-03, name: 密度推定用の核 }
  - { id: ML1-11-DEF-04, name: 核密度推定量 }
theorems:
  - { id: ML1-11-PROP-01, name: 局所的な二乗損失・0–1損失の最小化 }
  - { id: ML1-11-THM-01, name: 核密度推定量の非負性と正規化 }
  - { id: ML1-11-THM-02, name: 核密度推定の期待値と箱型核の局所収束 }
  - { id: ML1-11-THM-03, name: 二値立方体模型の距離集中 }
canonical_examples:
  - 二種類の同点規則が働く一次元近傍
  - kを変更したときの近傍の投票比率
  - 箱型核の全積分と帯域幅の変化
  - 標本自身を密度評価に使う影響
  - 二値立方体での距離集中と有限確率上界
