id: "ML2-15"
title: "深層最適化・正則化・汎化検証"
volume: "foundations"
status: supplementary
prerequisites:
  - ML2-14
  - ML1-09
  - ML1-10
  - ML1-12
official_scope: []
learning_objectives:
  - 非凸な深層損失に対する滑らかさと学習率の条件を区別し、勾配ノルムの平均上界を証明できる
  - 二次損失で安全な学習率と発散する学習率を厳密に判定できる
  - weight decayの目的関数、勾配更新、非凸大域解のノルム比較を説明できる
  - early stoppingを検証データによる選択として定式化し、訓練損失と検証損失が逆行する例を計算できる
  - inverted dropoutの訓練時と評価時を区別し、期待値と二乗損失への追加項を導出できる
  - 訓練・検証・テストの情報遮断を守った再現可能な実験を組み立てられる
  - 固定seedの二層網を実際に学習し学習率・正則化・停止時刻・ノイズの作用を検算できる
definitions:
  - { id: ML2-15-DEF-01, name: 深層網の正則化付き経験損失 }
  - { id: ML2-15-DEF-02, name: weight decay }
  - { id: ML2-15-DEF-03, name: early stopping }
  - { id: ML2-15-DEF-04, name: inverted dropoutと評価時予測 }
theorems:
  - { id: ML2-15-THM-01, name: 非凸滑らかな損失の勾配下降と停留性評価 }
  - { id: ML2-15-PROP-01, name: 二次模型の学習率閾値 }
  - { id: ML2-15-PROP-02, name: 非凸大域最小解の重みノルム比較 }
  - { id: ML2-15-PROP-03, name: inverted dropoutの期待損失 }
  - { id: ML2-15-PROP-04, name: early stoppingの反例 }
canonical_examples:
  - スカラー二次模型の収束・振動・発散
  - 同じ重みへの結合型weight decayとAdam型の分離型weight decayの区別
  - 訓練は改善するが検証では二反復目以降悪化する対照例
  - Bernoulli maskの全場合を列挙したdropoutの期待値・分散
  - 二層tanh網の固定seed数値ラボと独立test評価
problem_patterns: [ML2-15-A01, ML2-15-A02, ML2-15-A03, ML2-15-A04, ML2-15-B01, ML2-15-B02, ML2-15-B03, ML2-15-B04, ML2-15-C01]
past_exam_alignment: []
integrated_exam_problems: []
exercise_counts: { level_a: 4, level_b: 4, level_c: 1, level_d: 0 }
estimated_hours: { reading: 5, exercises: 6, review: 2 }
