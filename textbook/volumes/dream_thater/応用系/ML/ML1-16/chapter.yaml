  - { id: ML1-16-DEF-06, name: 二乗損失に対する残差加法更新 }
theorems:
  - { id: ML1-16-THM-01, name: 指数損失の一段最小化 }
  - { id: ML1-16-PROP-01, name: 重みの指数表示と正規化定数 }
  - { id: ML1-16-THM-02, name: AdaBoostの経験訓練誤差上界 }
  - { id: ML1-16-PROP-02, name: 低マージン点の割合 }
  - { id: ML1-16-PROP-03, name: 残差方向への一段更新の損失減少 }
canonical_examples:
