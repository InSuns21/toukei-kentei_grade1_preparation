id: "ML1-16"
title: "Boosting・加法モデル"
volume: "foundations"
status: supplementary
prerequisites:
  - ML1-15
  - ML1-14
  - ML1-12
  - ML1-08
official_scope: []
learning_objectives:
  - 加法得点と符号分類器・訓練マージンを定義し数値で判定できる
  - 経験指数損失と重み付き誤分類率を区別して計算できる
  - 一段指数損失の最適係数と正規化定数を厳密に導ける
  - 誤り率0・1/2以上の例外を判定し停止規則を適用できる
  - AdaBoostの重みの指数表示と損失の積表示を帰納的に証明できる
  - 訓練誤分類率の積上界と弱い優位性による指数上界を導ける
  - マージン分布の上界を導出し汎化誤りとの違いを説明できる
  - 二乗損失の残差加法更新と縮小による損失減少量を導ける
  - 閾値決定株の学習・重み更新・margin・損失推移をseed付き計算ラボで再現できる
