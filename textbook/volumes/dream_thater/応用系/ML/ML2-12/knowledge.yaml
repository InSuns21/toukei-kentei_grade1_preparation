    requires: [learning.gp-regression-model, learning.gp-posterior-prediction]
  - id: learning.gp-conditioning-variance
    name: 観測追加による条件付き分散の非増加
    kind: proposition
    introduction: formal
    introduction_aliases: ["命題（観測追加による条件付き分散の非増加）"]
    requires: [learning.gp-conditioning-theorem]
  - id: learning.gp-krr-equivalence
    name: GP事後平均とカーネルリッジ予測の一致
    kind: proposition
    introduction: formal
    introduction_aliases: ["命題（GP事後平均とカーネルリッジ予測の一致）"]
    requires: [learning.gp-conditioning-theorem, rkhs.kernel-ridge-closed-form]
