    name: 生成的分類模型
    kind: definition
    introduction: formal
    introduction_aliases: ["定義（生成的分類模型）"]
    requires: [learning.bayes-decision-rule, prob.distribution-law]
  - id: learning.generative-posterior
    name: 密度から事後確率と最適分類則を得る
    kind: theorem
    introduction: formal
    introduction_aliases: ["定理（密度から事後確率と最適分類則を得る）"]
    requires: [learning.generative-classification, learning.zero-one-bayes-rule]
  - id: learning.naive-bayes
    name: Naive Bayes模型
    kind: definition
    introduction: formal
    introduction_aliases: ["定義（Naive Bayes模型）"]
    requires: [learning.generative-classification, prob.mutual-independence]
  - id: learning.naive-bayes-log-score
    name: Bernoulli Naive Bayesの対数得点
    kind: proposition
    introduction: formal
    introduction_aliases: ["命題（Bernoulli Naive Bayesの対数得点）"]
