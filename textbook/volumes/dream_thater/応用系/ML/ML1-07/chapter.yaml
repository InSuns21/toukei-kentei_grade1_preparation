id: "ML1-07"
title: "生成的分類・Naive Bayes・LDA/QDA"
volume: "foundations"
status: supplementary
prerequisites:
  - ML1-02
  - F0-00P3
  - LA6
official_scope: []
learning_objectives:
  - クラス事前確率とクラス条件付き密度から混合密度とBayes事後確率を導ける
  - 条件付き独立からNaive Bayesの積とBernoulli対数得点を導ける
  - 条件付き独立が偽のときにNaive Bayesが識別情報を失う反例を説明できる
  - 正定値共分散と多変量正規密度の正規化・平均・共分散を確認できる
  - Gaussian生成模型の対数判別得点をBayes公式から導ける
  - 共有共分散のLDAで二次項が相殺され線形境界になることを証明できる
  - クラス別共分散のQDAで二次項が残ることを示し退化条件を区別できる
  - 訓練標本の共分散が特異になる条件と正定値化の方法を検算できる
  - 計算ラボで事前確率・平均・共分散を変えて三種類の判別境界を再現できる
