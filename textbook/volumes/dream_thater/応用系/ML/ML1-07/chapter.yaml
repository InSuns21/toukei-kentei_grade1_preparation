  - { id: ML1-07-PROP-01, name: Bernoulli Naive Bayesの対数得点 }
  - { id: ML1-07-LEM-01, name: 正規密度の正規化 }
  - { id: ML1-07-THM-02, name: 正規生成模型の判別得点 }
  - { id: ML1-07-THM-03, name: LDA判別境界のアフィン性 }
  - { id: ML1-07-THM-04, name: QDA判別差の二次式 }
canonical_examples:
  - 連続二クラス模型の混合密度と事後確率
  - 二値特徴のNaive Bayes事後確率と独立性失敗の反例
  - 正定値二次元共分散の多変量正規密度と正規化
  - 事前確率が動かす一次元LDA閾値
  - 同じ平均・異なる分散が作るQDAの左右の尾
  - 標本数不足による共分散特異性と対角正則化
  - Gaussian Naive Bayes・LDA・QDAのPython比較
