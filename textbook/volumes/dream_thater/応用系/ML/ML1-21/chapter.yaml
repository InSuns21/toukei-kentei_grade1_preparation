id: "ML1-21"
title: "分布シフト・欠測・総合検証実験"
volume: "foundations"
status: supplementary
prerequisites:
  - ML1-20
  - ML1-15
  - ML1-13
  - ML1-12
  - F0-00P3A
official_scope: []
learning_objectives:
  - 学習側と運用側の分布および評価リスクを分離して記述できる
  - 共変量シフトの台・条件付き分布仮定を確認し重要度重み恒等式を証明できる
  - ラベルシフトの条件を共変量シフトと区別し重み恒等式を導ける
  - MCAR・MAR・MNARを観測変数と欠測対象を指定して判定できる
  - MARの逆回答確率重み付けを証明し回答者平均の偏りを計算できる
  - MNARを含む観測上同値な複数の完全データ分布を構成できる
  - 共変量シフトとMARの積重み恒等式を条件・正値性込みで証明できる
  - 前処理漏洩を避けて訓練・検証・独立テストを設計できる
  - 固定seedのNumPy合成実験で定数模型・層別模型・Baggingとk-meansの役割を比較できる
definitions:
  - { id: ML1-21-DEF-01, name: 共変量シフト }
  - { id: ML1-21-DEF-02, name: ラベルシフト }
  - { id: ML1-21-DEF-03, name: MCAR・MAR・MNAR：目的変数欠測 }
  - { id: ML1-21-DEF-04, name: シフト下の訓練・検証・テスト手順 }
theorems:
  - { id: ML1-21-PROP-01, name: 共変量シフトのリスク重み付け }
  - { id: ML1-21-PROP-02, name: ラベルシフトのリスク重み付け }
  - { id: ML1-21-PROP-03, name: MAR下での逆回答確率重み付け }
  - { id: ML1-21-PROP-04, name: 欠測下の陽性率の非識別性 }
  - { id: ML1-21-THM-01, name: 共変量シフトとMARの積重み恒等式 }
canonical_examples:
  - 二値結合分布での共変量シフトとラベルシフトの異なる保存条件
  - 重み付き誤分類率17/25とラベル比による4/5
  - MAR回答群の陽性率17/25と逆回答率補正による1/2
  - MNARとMCARが同じ観測記録を生成する非識別例
  - 目的変数欠測と共変量シフトの積重み計算
  - 訓練平均とテスト情報混入の変換比較
  - 固定seedのNumPy実験による運用Brier損失とクラスタ平方和比較
