chapter: ML2-20
scope: dream-theater
coverage: complete
prerequisites: [ML2-08, ML2-09, ML2-14]
concepts:
  - id: learning.vae-model-encoder
    name: 変分autoencoderの生成模型とencoder
    kind: definition
    introduction: formal
    introduction_aliases: ["定義（変分autoencoderの生成模型とencoder）"]
    requires: [learning.elbo-continuous, learning.variational-family]
  - id: learning.vae-elbo-identity
    name: VAEのELBOと事後KL恒等式
    kind: theorem
    introduction: formal
    introduction_aliases: ["定理（VAEのELBOと事後KL恒等式）"]
    requires: [learning.vae-model-encoder, learning.elbo-identity-continuous]
  - id: learning.vae-diagonal-encoder
    name: 対角Gaussian encoder
    kind: definition
    introduction: formal
    introduction_aliases: ["定義（対角Gaussian encoder）"]
