id: "ML2-10"
title: "Monte Carlo・重要度サンプリング"
volume: "foundations"
status: supplementary
prerequisites: [ML2-08, MC3, F0-00P7A]
official_scope: []
learning_objectives:
  - Monte Carlo標本平均と重点サンプリングの既出結果を事後期待値へ適用し、台条件と二次モーメント条件を明示できる
  - 未知の周辺尤度を分子分母の標本平均で消去し、自己正規化推定量の定義域を検査できる
  - 非正規化重み付き和の期待値と分散、比の有限標本バイアスを二点模型から再計算できる
  - 大数の法則と中心極限定理から自己正規化推定量の一致性と漸近分散を導ける
  - 重みの経験的有効標本サイズを計算し、標本数・重みの集中と推定誤差を混同しない
  - 提案分布の台漏れ、重い重みの裾、まれな状態の未観測を区別して診断できる
  - 固定seedのPython計算で提案分布と標本数を変え、推定値、標本重み、ESS、偏りを検証できる
definitions:
  - { id: ML2-10-DEF-01, name: 自己正規化重点サンプリング推定量 }
  - { id: ML2-10-DEF-02, name: 重みの経験的有効標本サイズ }
theorems:
  - { id: ML2-10-PROP-01, name: 非正規化分子・分母推定の期待値と分散 }
  - { id: ML2-10-THM-01, name: 自己正規化推定の一致性と漸近分布 }
  - { id: ML2-10-PROP-02, name: 経験的有効標本サイズの範囲と極限 }
canonical_examples:
  - 二状態事後での正規化と重みの厳密な確認
  - 二標本全列挙による自己正規化の有限標本バイアス
  - 低頻度状態未観測時のESS最大値と大きな誤差
  - 正規化は可能でも二乗モーメントが無限大となる連続例
  - 固定seedによる提案確率・標本数別のPython実験
problem_patterns: [ML2-10-A01, ML2-10-A02, ML2-10-A03, ML2-10-A04, ML2-10-B01, ML2-10-B02, ML2-10-B03, ML2-10-B04, ML2-10-C01]
