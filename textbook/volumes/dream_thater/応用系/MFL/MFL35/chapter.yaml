id: "MFL35"
title: "E(n)等変GNNと座標更新"
volume: "foundations"
status: supplementary
prerequisites:
  - MFL34
  - MFL30
  - OPT1
official_scope: []
learning_objectives:
  - 有限グラフの座標・不変スカラー特徴・共有メッセージ関数の型を明示し座標更新を手計算できる
  - 距離二乗の不変性と相対ベクトルの変換則からE(n)等変性を鏡映も含め証明できる
  - 頂点置換等変性を和の添字変換で証明し有限多層へ帰納法で拡張できる
  - 双方向対称重みの重心保存と非負重みの凸包保持を区別して導出できる
  - 絶対座標係数と固定方向による等変性破れを具体的な反例で検査できる
  - 剛体運動・置換・層数を変えて等変残差を計算し有限検算と一般証明を区別できる
definitions:
  - { id: MFL35-DEF-01, name: 距離に基づく不変スカラーメッセージ }
  - { id: MFL35-DEF-02, name: 座標・特徴の同時更新層 }
theorems:
  - { id: MFL35-THM-01, name: 座標・特徴更新層のE(n)等変性 }
  - { id: MFL35-THM-02, name: 置換等変性と有限多層のE(n)等変性 }
  - { id: MFL35-PROP-01, name: 対称重みの重心保存と非負重みの凸包保持 }
canonical_examples:
  - 三角形の距離二乗重みによる座標・スカラー特徴の同時更新
  - 反射・回転・平行移動と頂点交換で変換順序を直接検算
  - 非対称メッセージによる重心変化と強い重みによる凸包逸脱
  - 絶対座標重みの平行移動失敗と固定方向更新の回転失敗
problem_patterns: [MFL35-A01, MFL35-A02, MFL35-A03, MFL35-A04, MFL35-B01, MFL35-B02, MFL35-B03, MFL35-B04, MFL35-C01]
past_exam_alignment: []
integrated_exam_problems: []
exercise_counts: { level_a: 4, level_b: 4, level_c: 1, level_d: 0 }
estimated_hours: { reading: 7.0, exercises: 6.0, review: 2.5 }
