id: "MFL11"
title: "Laplacian Eigenmaps"
volume: "foundations"
status: supplementary
prerequisites:
  - MFL7
  - SGT1
  - SGT2
official_scope: []
learning_objectives:
  - 点群の対称非負近傍重みからDirichletエネルギーと埋め込み変分問題を構成できる
  - 非正規化・次数正規化の制約と一般化固有値問題の対応を証明できる
  - 固有値の重複、座標の符号と直交回転の不定性を説明できる
  - 三点道の重み、次数、固有値、埋め込みを手計算できる
  - 孤立点・非連結・小さい橋での退化と失敗機構を診断できる
  - 再現可能な数値実験で行列、固有残差、制約、エネルギーを検算できる
definitions:
  - { id: MFL11-DEF-01, name: Laplacian Eigenmapsの変分問題 }
  - { id: MFL11-DEF-02, name: 正次数集合上のEigenmaps }
theorems:
