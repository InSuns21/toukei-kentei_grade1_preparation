  - { id: MFL11-THM-01, name: Laplacian Eigenmapsの固有値最小化 }
  - { id: MFL11-PROP-02, name: 非正規化Eigenmapsとの比較 }
  - { id: MFL11-PROP-03, name: 非連結・孤立点の埋め込み不定性 }
  - { id: MFL11-PROP-04, name: スケーリングと直交変換の不変性 }
canonical_examples:
