id: "MFL39"
title: "接ベクトル場とchart/frameの変更"
volume: "foundations"
status: supplementary
prerequisites:
  - MFL38
  - GEO2
  - GEO13
official_scope: []
learning_objectives:
  - 接ベクトル場の座標基底・成分表示を説明し、重なりで同一ベクトルを検算できる
  - チャート移行のJacobianで基底と成分が逆向きに変換することを証明し、計量ノルムの一致を導ける
  - 局所正規直交フレームの変更と座標変更を区別し、O(2)行列で成分と内積を検算できる
  - 球面の座標基底と正規直交フレームを作り、極点の座標退化を識別できる
  - 球面緯線で成分一定のベクトル場が平行でないことを計算し、接続項の必要性を説明できる
  - 数値ラボでチャート・フレーム変更の恒等式残差と有限差分誤差を区別できる
definitions:
  - { id: MFL39-DEF-01, name: 接ベクトル場の局所成分表示 }
  - { id: MFL39-DEF-02, name: 局所正規直交フレーム }
theorems:
  - { id: MFL39-THM-01, name: チャート変更での接ベクトル成分と計量ノルム }
  - { id: MFL39-PROP-01, name: 正規直交フレーム変更則 }
  - { id: MFL39-PROP-02, name: 球面の座標・正規直交フレーム }
  - { id: MFL39-PROP-03, name: 球面緯線の接続項と平行成分 }
canonical_examples:
  - 円柱のせん断チャートにおける同一接ベクトルの二つの成分
  - 一点の正規直交フレーム90度回転と成分の逆回転
  - 球面の極点を除く局所フレームと計量係数
  - 球面緯線上の成分一定場と平行場の対比
problem_patterns: [MFL39-A01, MFL39-A02, MFL39-A03, MFL39-A04, MFL39-B01, MFL39-B02, MFL39-B03, MFL39-B04, MFL39-C01]
