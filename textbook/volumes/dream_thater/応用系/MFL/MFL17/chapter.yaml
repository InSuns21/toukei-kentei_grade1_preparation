id: "MFL17"
title: "境界・adaptive近傍・density shift"
volume: "foundations"
status: supplementary
prerequisites:
  - MFL13
  - MFL15
  - MFL16
official_scope: []
learning_objectives:
  - 区間上の行正規化Gaussian核を定義し、片側切断モーメントを係数まで計算できる
  - 境界端点のO(sqrt epsilon)偏りと内点のO(epsilon)項を剰余付きで導ける
  - Neumann条件の必要性と境界層での点ごとの非一様性を具体例で区別できる
  - 点ごとに固定したadaptive bandwidthのgeneratorを導き、対称可変幅核と区別できる
  - density shiftによるdriftの変化とimportance weightingの条件を検証できる
  - 有限標本・alpha補正・スペクトル収束への推論の限界を説明し、決定論的実験で理論を検算できる
definitions:
  - { id: MFL17-DEF-01, name: 区間上の行正規化Gaussian核 }
  - { id: MFL17-DEF-02, name: 切断Gaussianモーメント }
  - { id: MFL17-DEF-03, name: 区間のNeumann境界条件 }
  - { id: MFL17-DEF-04, name: 点ごとに固定したadaptive帯域幅 }
  - { id: MFL17-DEF-05, name: 同一支持上のdensity shift }
theorems:
  - { id: MFL17-THM-01, name: 境界層の核平均展開 }
  - { id: MFL17-PROP-01, name: 端点の平方根偏りとNeumann条件 }
  - { id: MFL17-PROP-02, name: 左端Neumann条件と境界層の非一様性 }
  - { id: MFL17-THM-02, name: adaptive行帯域幅の内点generator }
  - { id: MFL17-PROP-03, name: density shiftとdriftの差 }
canonical_examples:
  - 一様密度でのf(x)=xの左端と内点
  - f(x)=x^2の端点とsqrt epsilon境界層
  - p_s(x)=1+s(2x-1)の正の密度とdrift
  - adaptiveな行帯域幅と対称核の違い
