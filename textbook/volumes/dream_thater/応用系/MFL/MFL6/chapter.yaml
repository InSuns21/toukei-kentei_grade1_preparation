id: "MFL6"
title: "内在次元・曲率の推定"
volume: "foundations"
status: supplementary
prerequisites:
  - MFL5
  - ML1-11
official_scope: []
learning_objectives:
  - 正の連続密度と滑らかな埋め込みの下で小球質量の r の d 乗則を証明できる
  - 二半径の対数傾きから内在次元を推定し有限標本の誤差を評価できる
  - 境界・密度零点・帯域と観測ノイズが次元推定に与える影響を反例で判定できる
  - k近傍距離比と局所PCA固有値から得られる次元情報の条件を説明できる
  - 三点の外接円曲率を定義し円で正確に検算できる
  - 弧長対称三点の曲率推定が曲線の真の曲率に収束することを証明できる
  - 二次差分による曲率推定の打切り誤差と有界ノイズの増幅を導出できる
  - 放物線の局所共分散から曲率の絶対値を復元し不識別条件を説明できる
definitions:
  - { id: MFL6-DEF-01, name: 二半径の小球質量傾き }
  - { id: MFL6-DEF-02, name: 標本対数傾き推定量 }
  - { id: MFL6-DEF-03, name: 近傍半径比による次元指標 }
  - { id: MFL6-DEF-04, name: 三点の外接円曲率 }
  - { id: MFL6-DEF-05, name: 弧長対称二次差分曲率 }
theorems:
  - { id: MFL6-PROP-01, name: 滑らかな小球の質量次数 }
  - { id: MFL6-PROP-02, name: 二半径の有限標本対数傾き誤差 }
  - { id: MFL6-PROP-03, name: 円周における小球傾きの曲率バイアス }
  - { id: MFL6-PROP-04, name: 対称三点の外接円曲率の極限 }
  - { id: MFL6-PROP-05, name: 二次差分曲率の打切り誤差とノイズ }
  - { id: MFL6-PROP-06, name: 対称放物線の共分散による曲率復元 }
canonical_examples:
  - 一様直線と二次元円板の小球確率および対数傾き
  - 一様円周の正確な弦長小球確率
  - 区間境界と密度零点で起こる異なる対数傾きの偏り
  - 円周三点の外接円曲率と直線上の零曲率
  - 二次差分による放物線と有界ノイズの比較
