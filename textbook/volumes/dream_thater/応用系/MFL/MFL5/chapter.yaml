  - { id: MFL5-PROP-02, name: 共分散摂動からの接空間距離評価 }
  - { id: MFL5-PROP-03, name: 有界ノイズによる共分散誤差 }
  - { id: MFL5-PROP-04, name: 有界な独立局所標本の共分散集中 }
  - { id: MFL5-PROP-05, name: Local PCAの有限標本接空間誤差 }
  - { id: MFL5-PROP-06, name: 観測近傍と真の近傍の包含 }
canonical_examples:
  - 三点直線標本の中心化共分散とPCAの接方向
  - 二次元の回転射影からsin角度を導く直接例
  - 片側放物線と左右対称放物線の交差共分散
  - 固定法線ノイズで母集団上位方向が逆転する反例
  - seeded Pythonラボの曲率・近傍非対称性・ノイズ比較
