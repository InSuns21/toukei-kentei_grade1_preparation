id: "MFL5"
title: "局所主成分分析と接空間推定"
volume: "foundations"
status: supplementary
prerequisites:
  - MFL4
  - ML1-19
  - HDP1
official_scope: []
learning_objectives:
  - 局所近傍と中心化共分散を構成しPCAの上位空間を接空間推定に使える
  - 射影距離で基底の符号・回転に依存しない接空間角度誤差を計算できる
  - 曲率の二次法線偏差から共分散ブロック誤差を導出できる
  - 接方向の分散下界と固有値ギャップの役割を証明できる
  - 有界ノイズと有限標本の共分散誤差を分離し角度の十分上界を導出できる
  - 局所点数を二項模型で評価し真の固定近傍と観測近傍を区別できる
  - 近傍選択バイアスと固定法線ノイズでLocal PCAが失敗する理由を説明できる
  - 片側放物線と左右対称標本の曲率バイアスを解析・数値両面で比較できる
definitions:
  - { id: MFL5-DEF-01, name: 局所共分散とLocal PCA }
  - { id: MFL5-DEF-02, name: 接空間の射影距離 }
theorems:
