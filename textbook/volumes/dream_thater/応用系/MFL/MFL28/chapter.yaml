id: "MFL28"
title: "円周Fourier・SO(2)の低次表現"
volume: "foundations"
status: supplementary
prerequisites:
  - MFL18
  - MFL24
  - MFL27
  - ML2-16
official_scope: []
learning_objectives:
  - SO(2)の角度の同一視と整数周波数mの実表現R(mα)を検算できる
  - 円周の有限実Fourier特徴を積分で計算し回転に従う行列式を証明できる
  - 連続なsteerable角度核の必要十分な形を導出しその積分層の等変性と逆を証明できる
  - 円周相互相関の周波数別行列作用と射影核を計算できる
  - 平面の方向核の角度依存と原点での消失条件を証明できる
  - 誤った周波数型の混合が生む等変性違反を具体入力で示せる
  - 有限標本台形和のaliasingと本来の等変性違反を分離して数値確認できる
definitions:
  - { id: MFL28-DEF-01, name: SO(2)と周波数型の実表現 }
  - { id: MFL28-DEF-02, name: 円周の実Fourier特徴 }
  - { id: MFL28-DEF-03, name: 円周のsteerable核 }
  - { id: MFL28-DEF-04, name: 円周相互相関 }
theorems:
  - { id: MFL28-PROP-01, name: 周波数型の群準同型と整数条件 }
  - { id: MFL28-THM-01, name: Fourier特徴の回転等変性と有限再構成 }
  - { id: MFL28-THM-02, name: 円周steerable核の分類と等変な積分層 }
  - { id: MFL28-THM-03, name: 円周相互相関の等変性と周波数作用 }
  - { id: MFL28-THM-04, name: 平面の周波数型核と原点の条件 }
canonical_examples:
  - 周波数1と2で四分の一回転に対する応答が異なる例
  - 連続Fourier係数の積分・回転後の直接展開
  - R(mθ)v型の円周核と誤ったm+1型の核
  - 二次周波数への射影相互相関と奇数核の作用
  - 平面の一次・二次多項式核と原点条件
  - 周波数混合による正の等変残差と離散台形和のaliasing
problem_patterns: [MFL28-A01, MFL28-A02, MFL28-A03, MFL28-A04, MFL28-B01, MFL28-B02, MFL28-B03, MFL28-B04, MFL28-C01]
past_exam_alignment: []
integrated_exam_problems: []
exercise_counts: { level_a: 4, level_b: 4, level_c: 1, level_d: 0 }
estimated_hours: { reading: 7.0, exercises: 6.0, review: 2.5 }
