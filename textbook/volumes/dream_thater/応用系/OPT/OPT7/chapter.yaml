id: "OPT7"
title: "滑らかな凸最適化"
volume: "foundations"
status: supplementary
prerequisites:
  - OPT1
  - NA12
  - RA4
official_scope: []
learning_objectives:
  - Lipschitz連続勾配とL-滑らかさを定義し、二次関数で定数を直接評価できる
  - 降下補題を微積分学の基本定理とLipschitz連続性から証明できる
  - 固定歩幅最急降下法の一段減少評価と安全な歩幅範囲を導ける
  - 凸性と降下補題を組み合わせてO(1/k)収束を望遠鏡和から証明できる
  - 強凸性を定義し、最小点の一意性と勾配下界を導ける
  - L-滑らかな強凸関数で固定歩幅最急降下法の線形収束を証明できる
  - 条件数L/muが収束速度へ現れる機構を正定値二次関数と対応付けられる
  - Armijo条件付き後退直線探索が有限停止する理由を説明できる
  - Newton法の局所二次収束をHessianの正定値性とLipschitz連続性から導ける
definitions:
  - { id: OPT7-DEF-01, name: Lipschitz 連続勾配 }
