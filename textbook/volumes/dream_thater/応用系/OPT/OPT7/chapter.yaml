  - { id: OPT7-DEF-03, name: 強凸性 }
  - { id: OPT7-DEF-04, name: 滑らかな強凸最適化の条件数 }
  - { id: OPT7-DEF-05, name: Armijo 条件 }
  - { id: OPT7-DEF-06, name: 後退直線探索 }
theorems:
  - { id: OPT7-THM-01, name: 降下補題 }
  - { id: OPT7-THM-02, name: 固定歩幅の降下評価 }
  - { id: OPT7-THM-03, name: 滑らかな凸関数に対する最急降下法の劣線形収束 }
  - { id: OPT7-THM-04, name: 強凸関数の最小点の一意性 }
  - { id: OPT7-THM-05, name: 強凸性による勾配下界 }
  - { id: OPT7-THM-06, name: 滑らかな強凸関数に対する線形収束 }
  - { id: OPT7-THM-07, name: 滑らかさによる後退直線探索の有限停止 }
  - { id: OPT7-THM-08, name: 最適化 Newton 反復の局所二次収束 }
canonical_examples:
