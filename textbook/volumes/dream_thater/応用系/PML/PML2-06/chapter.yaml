id: "PML2-06"
title: "PINNの強形式残差はどう定義されるか"
volume: "foundations"
status: supplementary
prerequisites:
  - PML2-05
official_scope: []
learning_objectives:
  - 滑らかな候補関数にPDE演算子を適用し強形式残差の定義域と必要な正則性を指定できる
  - collocation点での平均二乗物理損失を連続PDE残差および差分残差から区別できる
  - 固定された候補関数に対する独立一様選点の損失平均と分散を証明できる
  - 内部方程式と境界・観測条件から複合損失を構成し具体的な係数を代入できる
  - 低次元候補空間で零損失の一意性を証明し数値を検算できる
  - 有限選点で内部残差が零でも全域で真解に一致しない反例を構成できる
  - 熱方程式の時間・空間微分残差を直接計算し初期境界条件と区別できる
  - 観測雑音を含む複合損失の最小化係数を導き物理重みの効果を説明できる
definitions:
  - { id: PML2-06-DEF-01, name: PDEの強形式残差 }
  - { id: PML2-06-DEF-02, name: collocation点と経験物理損失 }
  - { id: PML2-06-DEF-03, name: 内部・境界・観測の複合損失 }
theorems:
  - { id: PML2-06-THM-01, name: 固定候補に対する物理損失の標本平均 }
  - { id: PML2-06-THM-02, name: 三係数の候補空間における零損失の一意性 }
canonical_examples:
  - 一次元Poissonの二次試行関数の強形式残差と境界違反
  - 任意collocation点で一定な残差と経験損失
  - 独立一様選点による残差二乗の期待値と分散
  - 二次試行関数の三項複合損失と境界・データの競合
  - 三係数試行空間の零損失一意性
  - 一点collocationを通り抜ける三重零点の摂動
  - 時間依存熱方程式の初期・境界・内部残差
