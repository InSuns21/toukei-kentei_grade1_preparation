id: "PML2-20"
title: "PINNとoperator learningは組み合わせられるか"
volume: "foundations"
status: supplementary
prerequisites:
  - PML2-19
  - PML2-18
  - PML2-14
  - PML2-12
  - PML2-11
  - PML2-09
  - PML2-06
official_scope: []
learning_objectives:
  - 作用素モデルの空間二階微分からphysics-informed operator損失の各項を導き入出力と評価点を指定できる
  - 教師入力とラベルなし物理入力と完全ホールドアウト入力を区別した比較を設計できる
  - Poissonの一係数branch/trunk模型で残差と解誤差を正確に計算できる
  - 教師と物理点を同じ入力に限ったときの未見入力誤差の反例を証明できる
  - ラベルなし物理入力の追加による係数識別と勾配降下の更新を再現できる
  - 入力・空間の被覆半径と残差のLipschitz性を用いた一様解誤差上界を証明できる
  - 有限空間collocation点をすり抜ける二階微分可能な誤差を構成できる
  - 観測雑音と物理重みを持つ二次損失の最小点を導ける
  - 標準Pythonで教師入力と完全ホールドアウト入力の数値誤差を比較できる
definitions:
  - { id: PML2-20-DEF-01, name: physics-informed operator損失 }
  - { id: PML2-20-DEF-02, name: 入力単位の完全ホールドアウト評価 }
theorems:
  - { id: PML2-20-PROP-01, name: 教師と物理点が同じ二入力だけなら未見入力を制御できない }
  - { id: PML2-20-PROP-02, name: ラベルなし物理入力による一係数の識別 }
  - { id: PML2-20-THM-01, name: 入力・空間の被覆と物理残差からの一様解誤差 }
  - { id: PML2-20-PROP-03, name: 任意の有限空間collocation点で残差零の非零解誤差 }
  - { id: PML2-20-PROP-04, name: 観測雑音と物理損失の重み }
canonical_examples:
  - 定数荷重Poisson族を一成分branch/trunkとして厳密に表現する
  - 二つの教師入力と同じ二つの物理入力では残るパラメータ間の誤差
  - ラベルなし中間入力の物理残差による一係数の一意な決定
  - 入力・空間方向の被覆半径からの残差と解誤差の伝播
  - 任意の有限空間点を三重零点で通過する誤差多項式
  - 雑音観測と物理重みの二次最適化
  - 教師二入力と未見二入力を分けた標準Python検算
