  - { id: PML1-11-THM-01, name: 二次模型のEuler–Maruyama有限時刻分布 }
  - { id: PML1-11-THM-02, name: 二次Euler–Maruyama鎖の定常分布と刻み幅条件 }
  - { id: PML1-11-PROP-01, name: Euler–Maruyama離散化のGibbs不変性の破れと定常分散の偏り }
  - { id: PML1-11-THM-03, name: 二次Langevin過程の厳密一歩遷移 }
canonical_examples:
  - 二次損失の一歩Euler–Maruyama更新における平均と分散
  - 安定域内の定常分散の刻み幅依存と不変分布の破れ
  - 厳密OU更新とEuler–Maruyama更新の減衰率・雑音分散の違い
  - 二次元対角二次損失の各曲率方向の離散定常分散
