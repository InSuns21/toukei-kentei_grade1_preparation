id: "PML1-11"
title: "Langevinの数値離散化はどこで偏るか"
volume: "foundations"
status: supplementary
prerequisites:
  - PML1-10
  - STO6
  - STO7
official_scope: []
learning_objectives:
  - 過減衰Langevin方程式からEuler–Maruyama法を導出し、ドリフトと雑音の刻み幅の違いを説明できる
  - 二次損失の離散鎖の有限時刻平均・分散を独立正規増分の和から導出できる
  - 二次模型の定常分布の存在・一意性と刻み幅の必要十分条件を証明できる
  - 連続時間Gibbs分布の一歩での非不変性と定常分散の絶対・相対偏りを計算できる
  - 厳密OU一歩遷移とEuler–Maruyama法の減衰率・雑音分散を比較できる
  - 再現可能な数値実験と多次元対角二次模型で偏りと安定性を検証できる
definitions:
  - { id: PML1-11-DEF-01, name: 過減衰Langevin方程式のEuler–Maruyama離散化 }
