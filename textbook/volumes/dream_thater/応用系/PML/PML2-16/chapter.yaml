  - { id: PML2-16-THM-02, name: FNO層の実数性と一様ノルム安定性 }
  - { id: PML2-16-THM-03, name: 格子における周波数の同一視 }
  - { id: PML2-16-THM-04, name: 偶奇分割によるFFTの再帰式 }
canonical_examples:
  - 定数波と余弦波のFourier係数
  - 余弦核が選ぶ周波数と実数出力
  - 四点DFTとFourier格子FNOの一致
  - 同一の重みと二つの格子で生じるエイリアシング差
