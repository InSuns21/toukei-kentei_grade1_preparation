id: "PML2-16"
title: "Fourier Neural OperatorはなぜFourier係数を用いるか"
volume: "foundations"
status: supplementary
prerequisites:
  - PML2-15
  - FOU5
official_scope: []
learning_objectives:
  - 周期関数のFourier係数と実数関数の共役対称性を説明し直接計算できる
  - 周期畳み込みの有限Fourier核による対角化を積分から証明できる
  - モード切断したFNO層を定義しチャネル数と重み行列の次元を確認できる
  - FNO層の実数性と一様ノルム安定性を条件から証明できる
  - DFTと逆DFTを有限等比数列から導き格子FNOを計算できる
  - エイリアシングの剰余類公式を証明し反例で標本化条件の必要性を説明できる
  - 偶奇分割のFFT再帰式を導きO(N log N)の演算量を説明できる
  - モード共有と異なる解像度での精度保証を区別できる
