id: "PML1-06"
title: "無秩序・相転移を学習へ持ち込める条件は何か"
volume: "foundations"
status: supplementary
prerequisites:
  - PML1-05
  - SG1
official_scope: []
learning_objectives:
  - 固定標本のランダム損失Gibbs模型でデータと候補の二つの確率法則を区別し、分配関数と二圧力を計算できる
  - 分配関数で傾けたデータ分布を構成して台と規格化を確認し、quenched・annealed差のKL恒等式を証明できる
  - 独立な局所損失の積模型で二圧力と典型標本の集中を導出し、正の差だけでは相転移を示せないことを証明できる
  - 有限規模の解析性と極限圧力の非解析性を区別し、導関数の左右極限から判定できる
  - SG1のREM極限定理を独立Gaussian損失に条件を照合して適用し、臨界点と圧力差を計算できる
  - 標本依存の共通損失移動が条件付きGibbs分布を変えずに二圧力の差を変える反例を説明できる
  - perceptron容量閾値・REM凍結・汎化誤差の定義と極限条件を混同しない
definitions:
  - { id: PML1-06-DEF-01, name: 固定標本のランダム損失Gibbs模型 }
  - { id: PML1-06-DEF-02, name: 分配関数で傾けたデータ分布 }
  - { id: PML1-06-DEF-03, name: 極限圧力に基づく相転移判定 }
theorems:
  - { id: PML1-06-PROP-01, name: quenched・annealed差のKL恒等式 }
  - { id: PML1-06-PROP-02, name: 独立な局所損失模型には凍結転移がない }
  - { id: PML1-06-PROP-03, name: 独立Gaussian損失模型での凍結判定 }
  - { id: PML1-06-PROP-04, name: 標本依存の共通損失移動 }
canonical_examples:
  - 二候補二標本でquenchedとannealedの平均順序を数値検算する
  - 二候補の傾斜分布Qと自然対数KLを直接確認する
  - 二値独立局所損失の分配関数の積と相転移のない極限を計算する
  - SG1のREM圧力極限を独立Gaussian損失として条件付き援用する
  - 一候補の標本依存共通損失によって圧力差が残る反例を作る
