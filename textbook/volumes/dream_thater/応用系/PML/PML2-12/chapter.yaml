id: "PML2-12"
title: "点上の残差ゼロで解が正しいと言えるか"
volume: "foundations"
status: supplementary
prerequisites:
  - PML2-11
official_scope: []
learning_objectives:
  - 連続残差ノルムと有限collocation点の二乗平均を区別し定義域を指定できる
  - 任意の有限点集合で境界条件と点残差を満たしながら誤差が非零となる多項式を構成できる
  - 一点反例の真のL2誤差と連続残差を直接積分で算出できる
  - 残差の次数制限とLagrange補間から有限点損失と連続残差の評価を証明できる
  - 点が相異なることと端点条件が必要な理由を説明できる
  - 充填距離とLipschitz定数の定義を直接例で確認できる
  - 残差の変化率と点配置から連続残差および解誤差の上界を導ける
  - 学習点と独立検証点を区別し条件付き不偏性の適用条件を証明できる
  - 反例、事前制約、検証点を用いて有限残差から誤差保証までの不足情報を整理できる
definitions:
  - { id: PML2-12-DEF-01, name: 有限点残差と連続残差の比較 }
  - { id: PML2-12-DEF-02, name: 有限点に対応するLagrange補間基底 }
  - { id: PML2-12-DEF-03, name: collocation点集合の充填距離 }
theorems:
  - { id: PML2-12-THM-01, name: 任意の有限collocation点をすり抜ける非零誤差 }
  - { id: PML2-12-THM-02, name: 次数制限下の有限点残差による解誤差評価 }
  - { id: PML2-12-THM-03, name: 充填距離と残差変化率からの連続残差上界 }
  - { id: PML2-12-PROP-01, name: 独立な検証点での条件付き不偏性 }
canonical_examples:
  - 一点に三重零点を持つ摂動の端点・残差・真誤差の検算
  - 任意有限点集合に対する三重因子の積によるすり抜け反例
  - 一点反例の連続残差とL2誤差の厳密積分
  - 相異なる二点のLagrange補間基底と二次候補族の識別
  - 二点の充填距離とLipschitz残差を満たす四次候補
  - 訓練点に適合する候補と独立検証点の期待値の違い
problem_patterns:
  - PML2-12-A01
  - PML2-12-A02
  - PML2-12-A03
  - PML2-12-A04
  - PML2-12-A05
  - PML2-12-B01
  - PML2-12-B02
  - PML2-12-B03
  - PML2-12-B04
  - PML2-12-C01
