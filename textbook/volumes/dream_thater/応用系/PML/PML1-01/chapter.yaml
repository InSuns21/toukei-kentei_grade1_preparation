id: "PML1-01"
title: "損失と物理エネルギーは何が同じで何が違うか"
volume: "foundations"
status: supplementary
prerequisites:
  - ML1-01
  - ML1-03
  - SM1
official_scope: []
learning_objectives:
  - 有限状態の物理エネルギーとデータ依存の経験損失の定義域・単位・依存を区別できる
  - 三状態ばねと有限候補回帰の直接計算で最小点を確認できる
  - 正のアフィン変換による最小点の不変性と倍率条件の反例を証明できる
  - 異なる単位の損失とペナルティを尺度で無次元化し二候補の重み切替え条件を導ける
  - 物理的なエネルギー温度と人工的な損失尺度を区別し指数重みの比を計算できる
  - 損失最小化だけでは物理的平衡・温度・学習標本分布を定めないと説明できる
definitions:
  - { id: PML1-01-DEF-01, name: 有限状態のエネルギー模型 }
  - { id: PML1-01-DEF-02, name: 有限候補のデータ依存損失 }
  - { id: PML1-01-DEF-03, name: 尺度を明示した結合目的関数 }
  - { id: PML1-01-DEF-04, name: 有限状態の指数重みと温度尺度 }
theorems:
  - { id: PML1-01-PROP-01, name: 正のアフィン変換と最小化解 }
  - { id: PML1-01-PROP-02, name: 二候補の重み切替え条件 }
canonical_examples:
  - 三状態ばねの物理的単位と最小エネルギー
  - 訓練データを変更した有限回帰模型での最小化解の逆転
  - 単位の異なる損失と物理的ペナルティの尺度付き比較
  - 指数重みの無次元性と温度尺度変更時の比
