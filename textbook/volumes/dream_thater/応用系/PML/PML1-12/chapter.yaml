id: "PML1-12"
title: "SGDの揺らぎは熱雑音と等しいか"
volume: "foundations"
status: supplementary
prerequisites:
  - PML1-11
official_scope: []
learning_objectives:
  - 有限データの復元抽出ミニバッチSGDと個別勾配の散布行列を定義し具体例で確かめられる
  - ミニバッチ勾配の条件付き平均と分散共分散行列C/bを交差項まで計算して証明できる
  - 非復元抽出の有限母集団補正と復元抽出との違いを導出できる
  - 等方的Langevin熱雑音とSGDの一歩共分散の一致条件および分布の非一致を説明できる
  - 固定時間内の雑音累積の二乗平均上界を示し学習率の次数の違いを説明できる
  - 状態依存・異方性の反例を計算し熱平衡の比喩が成り立つ条件を判定できる
definitions:
  - { id: PML1-12-DEF-01, name: 有限データの復元抽出ミニバッチSGD }
  - { id: PML1-12-DEF-02, name: 個別勾配の散布行列 }
theorems:
  - { id: PML1-12-PROP-01, name: 復元抽出SGDの条件付き平均・分散共分散行列 }
  - { id: PML1-12-PROP-02, name: 非復元ミニバッチの分散共分散行列 }
  - { id: PML1-12-PROP-03, name: 等方的熱雑音との一歩共分散一致条件 }
  - { id: PML1-12-PROP-04, name: 固定時間内のSGD雑音の二乗平均上界 }
canonical_examples:
  - 二損失の復元抽出でb=Nでも全勾配と一致しない一歩
  - 四損失の二次元散布行列と異方的なミニバッチ共分散
  - 復元・非復元抽出の有限母集団補正の数値比較
  - 二つの二次損失による状態依存雑音と最適点での雑音消失
