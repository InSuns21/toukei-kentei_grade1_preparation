id: "PML1-16"
title: "群平均はどのように不変モデルを作るか"
volume: "foundations"
status: supplementary
prerequisites:
  - PML1-15
  - MFL23
official_scope: []
learning_objectives:
  - 有限群の群平均作用素を具体的に計算し軌道平均との一致を導ける
  - 群平均の不変性・線形性・冪等性と不変関数への射影性を証明できる
  - 不変な有限評価重みの下で群平均が直交射影となることを示し誤差分解を導ける
  - 非不変教師値・非不変評価重みが誤差保証を壊す具体例を計算できる
  - 出力に線形表現を指定して等変平均を構成し変換則を証明できる
  - 有限回転と連続回転の保証範囲および平均の計算費用を区別できる
definitions:
  - { id: PML1-16-DEF-01, name: 有限群平均作用素 }
theorems:
  - { id: PML1-16-THM-01, name: 有限群平均の不変性と射影性 }
  - { id: PML1-16-THM-02, name: 不変な評価重みに関する直交射影 }
  - { id: PML1-16-PROP-01, name: 教師値の対称性と群平均後の二乗誤差 }
  - { id: PML1-16-THM-03, name: 有限群平均による等変化 }
canonical_examples:
  - 反転群で偶成分と奇成分を取り出す平均
  - 四回転群による異方的二次式の不変化
  - 正方形頂点の軌道平均と重複数
  - 非不変教師値または非不変重みが誤差を増す反例
  - ベクトル出力の定数バイアスを消す等変平均
