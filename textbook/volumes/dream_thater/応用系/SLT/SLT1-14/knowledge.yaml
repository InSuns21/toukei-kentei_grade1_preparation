    requires:
      - learning.replace-one-and-deletion-samples
      - learning.loss-function

  - id: learning.generalization-gap
    name: 汎化ギャップ
    kind: definition
    aliases: []
    introduction: formal
    introduction_aliases: ["定義（汎化ギャップ）"]
    requires:
      - learning.population-risk
      - learning.empirical-risk

