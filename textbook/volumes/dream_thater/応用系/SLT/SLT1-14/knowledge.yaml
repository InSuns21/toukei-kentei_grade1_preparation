chapter: SLT1-14
scope: dream-theater
coverage: complete
prerequisites:
  - SLT1-13
  - OPT7

concepts:
  - id: learning.replace-one-and-deletion-samples
    name: 一点置換標本と一点削除標本
    kind: definition
