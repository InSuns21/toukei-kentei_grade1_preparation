id: "SLT1-10"
title: "Rademacher複雑度とsymmetrization"
volume: "foundations"
status: supplementary
prerequisites:
  - SLT1-09
  - SLT1-07
  - HDP4
official_scope: []
learning_objectives:
  - Rademacher変数を標本から独立に導入し、経験・期待複雑度と絶対値版の違いを具体的に計算できる
  - 有限関数クラスの符号付き和の指数モーメントからlog M型上界の定数を導ける
  - ghost sampleの交換可能性を使い、片側と絶対偏差のsymmetrizationを全段階で証明できる
  - 有界差分の座標幅を検算し、期待・経験Rademacher複雑度による高確率汎化界を導ける
  - 経験L1被覆数の条件付き符号評価を、標本依存右辺を持つ汎化界に接続できる
  - 近似ERMの過剰リスク界へ一様偏差を代入し、最適化誤差を区別できる
  - 標本依存クラス・非独立標本・非有界損失でそれぞれどの論証が破綻するか説明できる
definitions:
  - { id: SLT1-10-DEF-01, name: 独立な公平符号と符号付き標本平均 }
  - { id: SLT1-10-DEF-02, name: 経験・期待Rademacher複雑度 }
theorems:
  - { id: SLT1-10-LEM-01, name: 有限関数クラスの符号複雑度 }
  - { id: SLT1-10-THM-01, name: Rademacher対称化 }
  - { id: SLT1-10-THM-02, name: 期待・経験Rademacher複雑度による汎化界 }
  - { id: SLT1-10-COR-01, name: 経験被覆からの高確率一様偏差界 }
canonical_examples:
  - 二点上の関数と一標本での符号・標本の二段階平均
  - 相異なる訓練点上の全二値関数で経験Rademacher複雑度1/2
  - 二標本のghost sampleと符号を使う片側・絶対値対称化
  - 有界差分の幅1/nと期待・経験高確率界の係数
  - 線形関数族の経験L1被覆によるデータ依存汎化界
  - 標本依存の単一関数で汎化gap1だが経験複雑度0となる反例
