id: "SLT2-12"
title: "幅極限と学習時間の極限"
volume: "foundations"
status: supplementary
prerequisites:
  - SLT2-11
  - SLT2-10
  - SLT2-09
  - ODE8
official_scope: []
learning_objectives:
  - 固定時間収束と時間一様収束および二つの反復極限を区別できる
  - Duhamel公式を使い有限幅の核誤差が学習誤差へ蓄積する仕組みを計算できる
  - 正のNTKスペクトルギャップの下で残差減衰とニューロン移動のbootstrapを閉じられる
  - 有限入力の二層網で時間一様な固定核近似が成立する条件と確率を述べられる
  - 消失する固有値による極限非可換の反例とNNGP分布の長時間射影を導ける
definitions:
  - { id: SLT2-12-DEF-01, name: 幅・時間の反復極限と時間一様近似 }
theorems:
  - { id: SLT2-12-THM-01, name: 有限時間のスペクトル付き核誤差界 }
  - { id: SLT2-12-THM-02, name: 正ギャップ下の時間一様NTK近似 }
  - { id: SLT2-12-PROP-01, name: 単調な残差による長時間の確率評価 }
  - { id: SLT2-12-PROP-02, name: 学習後Gaussian極限の零固有空間への射影 }
canonical_examples:
  - 1次元で幅と時間の反復極限を直接計算する
  - 二層網のニューロン移動と核の摂動を残差積分で評価する
  - 小固有値を持つ対角核で時間尺度mの非可換性を確認する
  - 初期Gaussian共分散とNTKの零空間が異なる場合の長時間共分散を計算する
problem_patterns:
  - SLT2-12-A01
  - SLT2-12-A02
