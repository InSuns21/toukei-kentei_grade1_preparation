id: "SLT2-02"
title: "最小ノルム補間と勾配流"
volume: "foundations"
status: supplementary
prerequisites:
  - SLT2-01
  - ML1-04
official_scope: []
learning_objectives:
  - SVDから一般階数のMoore–Penrose擬似逆を構成し、最小二乗解と補間可能性を区別できる
  - 行フルランクの場合に最小Euclidノルム補間解がXの転置とXXの転置の逆行列で表せることを証明できる
  - 平方損失の勾配流を特異モードごとに解き、零初期値の極限が擬似逆解となることを示せる
  - 非零初期値の核成分は保存され、階数欠損で応答を補間できない場合は最小二乗解へ収束することを説明できる
  - 有限時間の残差・遅い特異モードと最適化上の選択を区別し、汎化保証と混同しない
definitions:
  - { id: SLT2-02-DEF-01, name: 最小二乗勾配流と初期値 }
theorems:
  - { id: SLT2-02-THM-01, name: 最小ノルム解のSVD表示と行フルランク公式 }
  - { id: SLT2-02-THM-02, name: 勾配流の特異モード解と極限 }
  - { id: SLT2-02-PROP-01, name: 初期値の核成分の保存 }
canonical_examples:
  - 2行3列の行フルランク設計で擬似逆係数をノルム平方完成と逆Gram行列の双方で検算する
  - 同じ設計で勾配流の二つの指数減衰モードを計算する
  - 階数欠損で補間不能な応答への勾配流が最小二乗適合値へ収束することを確かめる
problem_patterns:
  - SLT2-02-A01
  - SLT2-02-A02
  - SLT2-02-A03
  - SLT2-02-A04
  - SLT2-02-A05
  - SLT2-02-B01
  - SLT2-02-B02
  - SLT2-02-B03
  - SLT2-02-B04
  - SLT2-02-C01
