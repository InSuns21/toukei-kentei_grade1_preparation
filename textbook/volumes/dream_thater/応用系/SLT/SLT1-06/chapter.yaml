id: "SLT1-06"
title: "Sauer–Shelah補題"
volume: "foundations"
status: supplementary
prerequisites:
  - SLT1-05
  - COMB2
official_scope: []
learning_objectives:
  - 有限二値ラベル列族の削除族・縮約族を定義し、各列の延長から分割恒等式を証明できる
  - 削除がshatteringを保存し縮約では次元上界が一つ下がることを量化順序から証明できる
  - Sauer–Shelah補題を点数の帰納法とPascalの二項和再帰から完全に導ける
  - 重複入力を持つ標本列にもトレース経由で成長関数上界を移せる
  - 二項和の上界からem/dのd乗の多項式界を仮定と境界ケース込みで導ける
  - 高々d点を1とするクラスで等号成立を示し、有限入力集合では成長関数が飽和することを計算できる
  - 組合せ的な成長関数界と確率的な一様汎化保証を区別できる
definitions:
  - { id: SLT1-06-DEF-01, name: 削除族と縮約族 }
theorems:
  - { id: SLT1-06-LEM-01, name: 削除・縮約の分割恒等式 }
  - { id: SLT1-06-LEM-02, name: 削除・縮約とshattering }
  - { id: SLT1-06-THM-01, name: Sauer–Shelah補題 }
  - { id: SLT1-06-COR-01, name: VC次元による成長関数上界 }
  - { id: SLT1-06-COR-02, name: 二項和の簡易上界 }
  - { id: SLT1-06-PROP-01, name: Sauer–Shelah上界の達成 }
canonical_examples:
  - 三列族の一点削除で削除族二列と縮約族一列を直接照合
  - VC次元2かつ五点の二項和上界16
  - 大きさd以下の有限部分集合の指示関数による上界の等号達成
  - 同じVC次元1でも二仮説クラスは成長関数が2で止まる例
  - 有限入力集合N点の成長関数がm>Nで飽和する例
