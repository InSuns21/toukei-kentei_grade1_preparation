id: "SLT2-03"
title: "ridgeのスペクトルと偏り・分散"
volume: "foundations"
status: supplementary
prerequisites:
  - SLT2-02
  - ML1-05
official_scope: []
learning_objectives:
  - ML1-05のridge目的とSLT2-02の平方損失の正規化を対応させ、特異値ごとの係数・予測フィルタを導ける
  - ridgeの平滑化行列のスペクトルと有効次元、雑音に対する作用素ノルム上界を証明できる
  - 固定設計の信号予測リスクをモードごとの偏り二乗と分散へ分解し、各項の正則化係数依存を検算できる
  - 弱い特異値・零特異値・真の信号の有無が係数リスクと訓練点予測リスクへ与える違いを説明できる
  - 訓練残差と信号予測リスクの期待値の差を導き、固定された正則化係数に対する補正式の限界を説明できる
definitions:
  - { id: SLT2-03-DEF-01, name: ridgeのスペクトルフィルタと平滑化行列 }
  - { id: SLT2-03-DEF-02, name: ridgeの有効次元 }
theorems:
  - { id: SLT2-03-THM-01, name: ridgeフィルタの安定性と有効次元 }
  - { id: SLT2-03-THM-02, name: 固定設計のモード別予測リスク }
  - { id: SLT2-03-PROP-01, name: 訓練残差と予測リスクの期待差 }
canonical_examples:
  - 二件三特徴の対角設計で係数・平滑化・有効次元を分けて計算する
  - 真の信号が弱い特異方向にない場合の偏り・分散を比較する
  - 行フルランク補間で訓練残差が零でも予測リスクが正となる理由を計算する
