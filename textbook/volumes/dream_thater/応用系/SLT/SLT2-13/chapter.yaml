id: "SLT2-13"
title: "粒子測度による二層網"
volume: "foundations"
status: supplementary
prerequisites:
  - SLT2-10
  - SLT2-11
  - SLT2-12
learning_objectives:
  - 二層網の経験確率測度を定義し、有限和と積分表示の一致と可積分性を確認できる
  - 1/mと1/√mの初期出力スケーリングを期待値・分散から区別できる
  - 二乗損失の全粒子勾配とm倍加速の意味を導出できる
  - 経験測度の試験関数に対する時間微分と損失減少式を有限幅から証明できる
  - 動く粒子Gram行列と予測残差の方程式を検算し、次章の連続極限に必要な追加条件を説明できる
definitions:
  - { id: SLT2-13-DEF-00, name: Dirac確率測度 }
  - { id: SLT2-13-DEF-01, name: 経験粒子測度と二層網の積分表示 }
  - { id: SLT2-13-DEF-02, name: 粒子ポテンシャルと加速勾配流 }
  - { id: SLT2-13-DEF-03, name: 有限粒子の試験関数 }
theorems:
  - { id: SLT2-13-THM-01, name: 二つの幅スケーリングの初期出力 }
  - { id: SLT2-13-THM-02, name: 加速粒子勾配流の厳密な変分式と損失減少 }
  - { id: SLT2-13-PROP-01, name: 経験粒子測度の弱形式 }
  - { id: SLT2-13-PROP-02, name: 動く粒子Gram行列の残差方程式 }
canonical_examples:
  - 二粒子の経験測度の原子と質量・積分を直接数える
  - 一点二粒子線形網の速度・残差速度・損失微分を二通りで検算する
  - 弱収束だけでは非有界特徴の積分が収束しない粒子列
