chapter: SLT1-01
scope: dream-theater
coverage: complete
prerequisites:
  - ML1-03

concepts:
  - id: learning.bayes-excess-risk
    name: Bayes超過リスク
    kind: definition
    aliases: []
    introduction: formal
    introduction_aliases: ["定義（Bayes超過リスク）"]
    requires:
      - learning.bayes-risk
      - learning.population-risk

  - id: learning.weighted-binary-excess-identity
    name: 二値0–1分類の重み付き超過リスク恒等式
    kind: theorem
    aliases: []
    introduction: formal
    introduction_aliases: ["定理（二値0–1分類の重み付き超過リスク恒等式）"]
    requires:
      - learning.bayes-excess-risk
      - learning.zero-one-bayes-rule
      - learning.conditional-risk

  - id: learning.restricted-risk-optimum
    name: クラス内最良予測器
    kind: definition
    aliases: []
    introduction: formal
    introduction_aliases: ["定義（クラス内最良予測器と近似誤差）"]
    requires:
      - learning.hypothesis-class
      - learning.population-risk

  - id: learning.approximation-error
    name: 近似誤差
    kind: definition
    aliases: []
    introduction: formal
    introduction_aliases: ["定義（クラス内最良予測器と近似誤差）"]
    requires:
      - learning.restricted-risk-optimum
      - learning.bayes-risk

  - id: learning.within-class-excess-risk
    name: クラス内超過リスク
