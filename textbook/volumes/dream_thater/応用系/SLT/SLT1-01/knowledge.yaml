    introduction_aliases: ["定義（クラス内超過リスク）"]
    requires:
      - learning.restricted-risk-optimum

  - id: learning.excess-risk-two-term-decomposition
    name: 超過リスクの近似成分とクラス内成分への分解
    kind: theorem
    aliases: []
    introduction: formal
    introduction_aliases: ["定理（超過リスクの近似成分とクラス内成分への分解）"]
    requires:
      - learning.bayes-excess-risk
      - learning.approximation-error
      - learning.within-class-excess-risk

  - id: learning.approximation-error-monotonicity
    name: クラス拡大による近似誤差の単調性
    kind: proposition
    aliases: []
    introduction: formal
    introduction_aliases: ["命題（クラス拡大による近似誤差の単調性）"]
    requires:
      - learning.approximation-error
