id: "SLT2-06"
title: "勾配流とearly stopping"
volume: "foundations"
status: supplementary
prerequisites:
  - SLT2-03
  - SLT2-05
  - ML2-15
official_scope: []
learning_objectives:
  - 最小二乗勾配流の有限時刻解を特異方向ごとに導き、早期停止の係数・予測フィルタと零固有値の扱いを説明できる
  - 時間と特異値に依存する信号通過率、残差、係数雑音増幅、有効次元を厳密に比較できる
  - mu=1/tと対応させたridgeとの二側不等式と、二つの方法が同一ではないことを証明できる
  - 固定設計と決定論的な停止時刻の下で係数・訓練点の信号予測リスクを偏りと分散へ分解できる
  - 一モードの最適停止時刻を計算し、未知信号・データ依存停止・標本外予測で追加条件が必要な理由を説明できる
definitions:
  - { id: SLT2-06-DEF-01, name: 早期停止のスペクトルフィルタ }
  - { id: SLT2-06-DEF-02, name: 勾配流の有効次元 }
theorems:
  - { id: SLT2-06-THM-01, name: 有限時刻勾配流のフィルタと安定性 }
  - { id: SLT2-06-THM-02, name: 早期停止とridgeのスペクトル比較 }
  - { id: SLT2-06-THM-03, name: 早期停止の固定設計偏り分散分解 }
  - { id: SLT2-06-PROP-01, name: 一モードの最適停止時刻 }
canonical_examples:
  - 二つの特異値をもつ設計で遅い方向と速い方向の通過率を比べる
  - 核方向の係数は初期値零から回復せず有限時刻でも変わらないことを示す
  - 対応するridgeと早期停止の通過率を厳密な二側不等式で比較する
  - 一モードの信号と雑音の大きさを変えて停止時刻の最適値を計算する
