  - { id: SLT1-05-PROP-02, name: 成長関数の基本性質 }
  - { id: SLT1-05-COR-01, name: 有限クラスのVC次元上界 }
  - { id: SLT1-05-THM-01, name: 片側閾値クラスの成長関数 }
  - { id: SLT1-05-THM-02, name: 閉区間クラスの成長関数 }
  - { id: SLT1-05-THM-03, name: 平面の軸平行矩形のVC次元 }
  - { id: SLT1-05-PROP-03, name: 有限部分集合の指示関数は無限VC次元 }
canonical_examples:
  - 二点上の閾値のトレースと欠ける10ラベルの検算
  - 定数一関数のVC次元0
  - 閾値のm+1パターンと区間の連続塊の数え上げ
  - 十字配置の四点と五点の座標極値による矩形の上下界
  - 有限集合の指示関数による任意点数のshattering
