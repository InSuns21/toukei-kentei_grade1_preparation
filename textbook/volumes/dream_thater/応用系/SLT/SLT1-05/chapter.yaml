id: "SLT1-05"
title: "shatteringとVC次元"
volume: "foundations"
status: supplementary
prerequisites:
  - SLT1-04
official_scope: []
learning_objectives:
  - 有限入力集合上のトレースとshatteringを定義し欠けるラベル列を示して判定できる
  - shatteringが部分集合へ遺伝することを全ラベル付けの延長から証明できる
  - 重複入力を許す成長関数とVC次元の関係を証明し有限仮説数の上界を導ける
  - 実数閾値と閉区間の成長関数を全パターンの数え上げから計算できる
  - 平面の軸平行矩形が四点をshatterする構成と任意の五点の不可能性を証明できる
  - 無限VC次元の具体例を構成し無限仮説数と有限VC次元を区別できる
  - VC次元の組合せ的結論と確率的汎化保証の間に別の証明が必要なことを説明できる
definitions:
  - { id: SLT1-05-DEF-01, name: 有限集合上のトレース }
  - { id: SLT1-05-DEF-02, name: shattering }
  - { id: SLT1-05-DEF-03, name: 成長関数 }
  - { id: SLT1-05-DEF-04, name: VC次元 }
theorems:
