id: "SLT2-16"
title: "flat minimaの座標依存性"
volume: "foundations"
status: supplementary
prerequisites:
  - SLT2-08
  - SLT1-01
learning_objectives:
  - 停留極小点のHessianと局所摂動sharpnessを定義し、二次近似の適用条件と剰余を説明できる
  - 滑らかな可逆座標変換によるHessianの変換公式を連鎖律から導き、停留点と非停留点を区別できる
  - 双線形二層模型で同じ予測を保つ再尺度化を構成し、Hessianの固有値を具体計算できる
  - 曲率の座標依存性と、モデルの実際の汎化リスクが予測関数で決まることを区別できる
  - 訓練データでの曲率が零でもテストリスクが大きくなる反例から保証の追加仮定を特定できる
definitions:
  - { id: SLT2-16-DEF-01, name: Hessianによる局所sharpnessと有限半径sharpness }
  - { id: SLT2-16-DEF-02, name: 予測関数の同値性 }
theorems:
  - { id: SLT2-16-THM-01, name: 停留点におけるHessianの再座標化公式 }
  - { id: SLT2-16-PROP-01, name: 有限半径sharpnessの二次近似 }
  - { id: SLT2-16-THM-02, name: 双線形予測器の同値な極小点と任意に大きい曲率 }
  - { id: SLT2-16-PROP-02, name: 訓練曲率零でもテストリスクが非零となる反例 }
canonical_examples:
  - 一次元二乗損失の座標再尺度化でsharpnessを直接比較する
  - 二つのパラメータの積で予測する模型のHessian・固有値・予測リスクを全計算する
  - ReLUの正の領域で双線形の再尺度化を実現する
  - 訓練入力零の線形模型で経験Hessian零と母集団リスクの乖離を示す
