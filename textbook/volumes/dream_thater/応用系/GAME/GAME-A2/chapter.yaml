  - GAME-A2-TWO-BY-TWO-MINIMAX-1
  - GAME-A2-LP-DUALITY-1
  - GAME-A2-ZERO-SUM-NASH-1
  - GAME-A2-PARAMETER-CLASSIFICATION-1
