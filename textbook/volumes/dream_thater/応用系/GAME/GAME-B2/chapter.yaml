  - { id: GAME-B2-PROP-02, name: コア被覆線形計画と平衡重み双対 }
  - { id: GAME-B2-THM-01, name: Bondareva--Shapley の定理 }
  - { id: GAME-B2-COR-01, name: 空コアの平衡証明書 }
canonical_examples:
  - 3人多数決型ゲームで三つの二人提携へ各1/2の重みを置き、重み付き要求3/2が大提携価値1を超える平衡証明書
  - 単独価値0・二人提携価値1・大提携価値2の3人ゲームで同じ平衡重みを使い、要求3/2が大提携価値2の範囲内に収まる例
  - 4人サイクル上の四つの二人提携を用い、平衡重みと大提携価値の閾値を計算する例
