canonical_examples:
  - "2対2の重み付き完全マッチングを二通り列挙し、総余剰13と9を比較する例"
  - "3対3の余剰行列で対角割当ての総余剰33と双対価格系の目的値33を一致させ、価格証明書から最適性を示す例"
  - "4対4市場で LP・整数性・双対価格・純余剰最大化を一つにつなぎ、一つの余剰摂動で古い価格証明書の失敗と割当最適性の失敗を区別する例"
