id: "GAME-D3"
title: "重み付き割当問題・割当 LP・双対価格"
volume: "foundations"
status: supplementary
prerequisites:
  - DOPT3
  - DOPT4
official_scope: []
learning_objectives:
  - 重み付き二部マッチングと完全割当てを区別し、小規模市場で完全マッチングの総余剰を直接比較できる
  - 余剰最大化割当問題を 0--1 線形計画と LP 緩和として定式化し、DOPT3 の費用最小化表示との符号対応を説明できる
  - DOPT4 の割当 LP 整数性定理について二部性・等しい頂点数・非空性・整数右辺・有界性を局所確認し、LP 緩和に 0--1 最適解を選べる理由を説明できる
  - DOPT3 の費用最小化双対から符号変換により余剰最大化双対を導き、双対制約を主体の取り分と対象価格の和として解釈できる
  - 主実行解と双対実行解の目的値一致から割当ての最適性を証明できる
  - 双対価格の下で各主体が価格調整後の純余剰を最大化することと、完全割当ての総余剰最大性を結び付けて証明できる
  - 価格と主体側余剰の共通水準移動不変性を証明し、絶対価格ではなく相対価格が本質である理由を説明できる
  - 安定マッチングのブロッキングペア基準と割当問題の総余剰最大化基準を区別し、次章の移転可能効用・コア・競争均衡への接続を説明できる
