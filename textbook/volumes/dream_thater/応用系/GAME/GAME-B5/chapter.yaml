canonical_examples:
  - 3人多数決型ゲーム v({i,j})=1, v(N)=1 でコアが空でも最小コア値 1/3 と配分 (1/3,1/3,1/3) が得られる例
  - v({1,2})=1, v(N)=2, その他の真部分提携価値0の3人ゲームで最小コアが線分 x=(t,3/2-t,1/2) となり、第2段階で仁 (3/4,3/4,1/2) に絞られる例
  - 同じ3人ゲームで Shapley 値 (5/6,5/6,1/3) と仁 (3/4,3/4,1/2) を比較し、平均限界貢献と辞書式安定性の違いを確認する例
