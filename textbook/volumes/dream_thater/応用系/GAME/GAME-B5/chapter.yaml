id: "GAME-B5"
title: "最小コア・仁"
volume: "foundations"
status: supplementary
prerequisites:
  - GAME-B1
  - GAME-B3
  - OPT10
official_scope: []
learning_objectives:
  - 有限 TU ゲームで提携 S の超過要求 e(S,x)=v(S)-x(S) を定義し、配分に対する提携の不足・余裕として符号を解釈できる
  - 配分上の最大超過要求 E(x) を最小化する最小コアを定義し、補助変数 epsilon を用いる線形計画として定式化できる
  - 最小コア値 epsilon* が非正であることとコア非空が同値であり、コア非空時には最小コアがコアに含まれることを証明できる
  - 空コアの3人多数決型ゲームで最小コア値 1/3 と対称配分 (1/3,1/3,1/3) を直接導出できる
  - 超過要求を非増加順に並べたベクトルを辞書式最小化する仁を定義し、最小コアとの関係を説明できる
  - 最小コアが線分として残る3人ゲームで、第2段階の最大未確定超過要求を最小化して仁 (3/4,3/4,1/2) を求められる
  - 有限性・配分集合のコンパクト性・超過要求の線形性を使い、仁の存在と一意性を核心まで証明できる
  - 仁の逐次線形計画では、ある端点でたまたま等号となる制約ではなく、前段階の最適面全体で固定される超過要求を保持すべき理由を説明できる
  - Shapley 値の平均限界貢献と、仁の提携超過要求の辞書式最小化が異なる配分原理であることを具体例で比較できる
