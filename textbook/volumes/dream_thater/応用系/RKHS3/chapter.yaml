  - RKHS3-SINGULAR-GRAM-1
  - RKHS3-SPECTRAL-SHRINKAGE-1
  - RKHS3-LINEAR-PRIMAL-DUAL-1
  - RKHS3-LAMBDA-LIMIT-1
