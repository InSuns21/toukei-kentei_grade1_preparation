id: "GAME-C4"
title: "Rubinstein 交渉"
volume: "foundations"
status: supplementary
prerequisites:
  - GAME-C3
  - GAME-A5
official_scope: []
learning_objectives:
  - 共通割引因子を持つ二人の無限期交互提案交渉ゲームを、提案者・応答者・受諾・拒否・提案者交代・割引利得から定義できる
  - 応答者が現在提案と拒否後の継続価値を比較して受諾境界を決めることを具体的な数値例で説明できる
  - 定常戦略を定義し、二つの継続局面から定常方程式を立てて提案者取り分 1/(1+delta) と応答者取り分 delta/(1+delta) を導出できる
  - 得られた定常戦略が全ての部分ゲームで最適反応を満たすことを確認し、部分ゲーム完全均衡であることを証明できる
  - 定常性を仮定せず、提案者の SPE 利得の下限 m と上限 M に対する二本の不等式から Rubinstein 交渉定理を証明できる
  - 全ての部分ゲーム完全均衡で直ちに合意し、提案者と応答者の均衡取り分が一意に決まる理由を説明できる
  - 有限期限版を GAME-A5 の後ろ向き帰納法で解き、p_n=(1-(-delta)^n)/(1+delta) と無限期の定常値への収束を導出できる
  - 共通割引因子の変化が初回提案者優位へ与える影響を計算し、delta が1へ近づくと半々の配分へ収束することを説明できる
  - 対称な単位パイで Nash 交渉解と Rubinstein 交渉解を比較し、公理的交渉と戦略的交渉が異なる問いであることを説明できる
