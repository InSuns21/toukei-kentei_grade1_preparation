canonical_examples:
  - "delta=1/2 で提案者 2/3・応答者 1/3 となり、応答者の拒否後価値 delta*(2/3)=1/3 が受諾境界と一致する例"
  - "delta=3/4 で Rubinstein 交渉解が (4/7,3/7) となる例"
  - "有限期限版の p_n=1-delta p_{n-1} を後ろ向き帰納法で解き、p_n=(1-(-delta)^n)/(1+delta) が無限期の 1/(1+delta) へ収束する例"
  - "単位パイ d=0 で Nash 交渉解 (1/2,1/2) と Rubinstein 交渉解を比較し、初回提案者の上乗せが (1-delta)/(2(1+delta)) となる例"
