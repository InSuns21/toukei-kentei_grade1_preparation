id: "RKHS4"
title: "最大マージンとハードマージン SVM"
volume: "foundations"
status: supplementary
prerequisites:
  - OPT2
  - OPT12
official_scope: []
learning_objectives:
  - 線形分離可能性を正負クラスの凸包非交差と結び付けられる
  - 関数マージンと幾何マージンを区別し、スケーリング不変性から正規化制約を導ける
  - 最大マージン問題をハードマージン SVM の凸二次計画として定式化できる
  - 線形分離可能性から Slater 条件を確認し、Lagrange 双対と強双対を正当化できる
  - 主問題の Lagrangian から双対問題を途中式付きで導出できる
  - KKT 条件から法線ベクトルの有限和表示、相補性、サポートベクトルの役割を説明できる
  - 双対変数を正負クラスの凸包上の凸結合として解釈し、最大マージンと凸包間最短距離を結び付けられる
  - 最適な法線ベクトルと切片の一意性を説明できる
  - マージン上の点と正の双対変数を持つ点が退化時には一致しない場合を区別できる
  - 線形分離不能な場合にハードマージン問題が実行不可能になる機構を説明できる
definitions:
  - { id: RKHS4-DEF-01, name: 線形分離可能性 }
  - { id: RKHS4-DEF-02, name: 関数マージン・幾何マージン }
  - { id: RKHS4-DEF-03, name: ハードマージン SVM }
  - { id: RKHS4-DEF-04, name: 双対サポートベクトル }
theorems:
  - { id: RKHS4-THM-01, name: 最大マージン問題とハードマージン SVM の同値性 }
  - { id: RKHS4-THM-02, name: ハードマージン SVM の Lagrange 双対 }
  - { id: RKHS4-THM-03, name: ハードマージン SVM の KKT 条件 }
  - { id: RKHS4-THM-04, name: 線形分離可能性と凸包非交差の同値性 }
  - { id: RKHS4-THM-05, name: 最大マージンと凸包間最短距離の対応 }
  - { id: RKHS4-PROP-01, name: 最適分類器の一意性 }
canonical_examples:
  - 1次元の正例 {2,3}・負例 {-1,0} を最大マージンで分離する例
  - 二つの平行な線分状凸包を中間超平面で分離する例
  - 双対変数を各クラスの凸結合へ正規化する例
  - マージン上の訓練点でも最適双対変数が0になり得る退化例
  - 正負クラスの凸包が交差してハードマージンが実行不可能になる例
problem_patterns:
  - RKHS4-MARGIN-SCALING-1
  - RKHS4-DUAL-DERIVATION-1
  - RKHS4-KKT-SUPPORT-1
  - RKHS4-CONVEX-HULL-1
  - RKHS4-DUAL-CONVEX-COMBINATION-1
past_exam_alignment: []
integrated_exam_problems: []
exercise_counts: { level_a: 4, level_b: 3, level_c: 1, level_d: 0 }
estimated_hours: { reading: 5.0, exercises: 4.0, review: 0.75 }
