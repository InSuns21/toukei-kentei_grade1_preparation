id: "SQC11"
title: "可測・Borelな円積"
volume: "foundations"
status: supplementary
prerequisites:
  - SQC9
  - SQC10
  - MT0
  - TOP6
  - SET1
  - F0-00D2C
official_scope: []
learning_objectives:
  - Borel集合、Lebesgue可測集合、Baire性の定義と包含関係を具体例と証明で区別できる
  - Lebesgue可測かつBaire性を持つ非Borel集合を構成原理から説明できる
  - Borelな有限平行移動等分解と有限値のBorelな移動選択写像の同値性を証明できる
  - Grabowski–Máthé–PikhurkoとMarks–Ungerの定理の仮定・結論および証明の引用範囲を区別できる
  - 円盤と正方形や円環に二定理を適用し、可測性・Borel性の強さと限界を検査できる
definitions:
  - { id: SQC11-DEF-01, name: Borel集合の再掲 }
  - { id: SQC11-DEF-02, name: Baire性 }
theorems:
  - { id: SQC11-PROP-01, name: Borel集合のLebesgue可測性とBaire性 }
  - { id: SQC11-PROP-02, name: Lebesgue可測かつBaire性を持つ非Borel集合の存在 }
  - { id: SQC11-PROP-03, name: Borel分割と移動選択写像の対応 }
  - { id: SQC11-THM-01, name: Grabowski–Máthé–Pikhurkoの可測等分解定理（引用） }
  - { id: SQC11-THM-02, name: Marks–UngerのBorel等分解定理（引用） }
  - { id: SQC11-COR-01, name: Borelな分割片による円積 }
canonical_examples:
  - 開集合と閉集合から生成されるBorel集合および半開長方形のBorel分割
  - Cantor集合の非Borel部分集合がLebesgue可測かつBaire性を持つ例
  - Borel移動ラベルの逆像から片を復元する構成
  - 半径rの閉円盤と等積な閉正方形のBorel円積への定理適用
  - 円周上の非Borel部分集合を除いた円盤に可測版だけを適用する例
problem_patterns:
  - SQC11-BOREL-SIGMA-ALGEBRA
  - SQC11-BAIRE-MEAGER
  - SQC11-NONBOREL-NULL-SUBSET
  - SQC11-BOREL-TRANSLATION-PIECES
  - SQC11-MEASURABLE-AREA
  - SQC11-THEOREM-HYPOTHESES
  - SQC11-FLOW-ARCHITECTURE
  - SQC11-ANNULUS-CIRCLE-SQUARING
past_exam_alignment: []
integrated_exam_problems: []
exercise_counts: { level_a: 5, level_b: 5, level_c: 1, level_d: 0 }
estimated_hours: { reading: 5.0, exercises: 5.5, review: 1.5 }
