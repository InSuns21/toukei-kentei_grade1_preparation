id: "SQC12"
title: "境界の小さい分割片と円積問題の到達点"
volume: "foundations"
status: supplementary
prerequisites:
  - SQC9
  - SQC11
  - MT0
  - RA7
official_scope: []
learning_objectives:
  - 既習のJordan可測性を境界の面積で判定し、Fσ集合・有限Boolean結合の定義を具体例で検査できる
  - 境界の上box次元が周囲次元より小さければJordan可測であることを被覆数から証明できる
  - Máthé–Noel–Pikhurkoの一般定理・円積定理の仮定と結論を区別し、正面積条件の必要性を反例で説明できる
  - 円盤と等積正方形で境界次元・Borel性・正面積の条件をすべて照合できる
  - 古典作図・近似作図・多角形等分解・任意片・可測片・小境界片の各問題を操作と片の条件から区別できる
definitions:
  - { id: SQC12-DEF-01, name: Jordan可測集合の境界判定 }
  - { id: SQC12-DEF-02, name: Fσ集合 }
  - { id: SQC12-DEF-03, name: Fσ集合の有限Boolean結合 }
theorems:
  - { id: SQC12-LEM-01, name: 小さい境界次元からJordan可測性へ }
  - { id: SQC12-PROP-01, name: 有限Boolean演算における境界の制御 }
  - { id: SQC12-THM-01, name: Máthé–Noel–Pikhurkoの小境界等分解定理（引用） }
  - { id: SQC12-LEM-02, name: 円盤と正方形の零面積交差 }
  - { id: SQC12-COR-01, name: 正面積かつJordan可測な片による円積 }
  - { id: SQC12-PROP-02, name: 孤立点による正面積片への障害 }
canonical_examples:
  - 半開正方形と有理点格子のJordan可測性を境界から判定する
  - Fσ集合とその有限Boolean結合を区間・長方形で構成する
  - 円盤と正方形の非正面積交差が丸みを帯びた正方形の境界に限られることを検証する
  - 孤立点を付加した正方形によって各片の正面積が保証されないことを示す
  - 円周の非Borel部分集合を除いた円盤に対し小境界定理とBorel性の違いを検証する
problem_patterns:
  - SQC12-JORDAN-BOUNDARY
  - SQC12-FSIGMA-BOOLEAN
  - SQC12-BOX-COVERING
  - SQC12-TRANSLATION-REGULARITY
  - SQC12-DISK-SQUARE-OVERLAP
  - SQC12-POSITIVE-PIECES-COUNTEREXAMPLE
  - SQC12-FINITE-VERSUS-COUNTABLE-BOUNDARY
  - SQC12-GRID-ERROR
  - SQC12-SIX-NOTIONS-COMPARISON
  - SQC12-NONBOREL-JORDAN-EQUIDECOMPOSITION
