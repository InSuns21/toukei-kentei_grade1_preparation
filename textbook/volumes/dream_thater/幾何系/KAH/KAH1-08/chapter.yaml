  - { id: KAH1-08-THM-01, name: Kähler正規座標の局所存在 }
  - { id: KAH1-08-PROP-02, name: Kähler条件と正則一階正規化 }
canonical_examples:
  - 一次元非定数Kähler計量の接続と混合微分
  - 平坦計量の非線形座標による非零係数
  - 定数計量の正規座標定義の全条件確認
  - 非Kähler対角Hermite計量の捩率障害
  - 二変数Kählerポテンシャルの明示的二次正規化
problem_patterns:
