  - { id: KAH1-15-PROP-01, name: Einstein定数の積分公式 }
  - { id: KAH1-15-THM-02, name: Fubini–Study計量のKähler–Einstein性 }
  - { id: KAH1-15-PROP-02, name: 定数倍によるEinstein定数の変化 }
canonical_examples:
  - C^n上の正定値定数係数Kähler計量
  - 複素トーラス上の平坦Ricci平坦計量
  - CP^nのFubini–Study計量とn+1のEinstein定数
  - 単位円板の負のEinstein定数
  - CP1と複素トーラスの積での非Einstein型積計量
problem_patterns:
