    name: Kähler類
    kind: definition
    introduction: formal
    introduction_aliases: ["定義（Kähler類）"]
    requires: [kahler.positive-real-eleven-form, geometry.de-rham-cohomology]
  - id: kahler.kahler-cone
    name: Kähler cone
    kind: definition
    introduction: formal
    introduction_aliases: ["定義（Kähler cone）"]
    requires: [kahler.kahler-class]
  - id: kahler.cone-convexity
    name: Kähler coneの凸錐性
    kind: proposition
    introduction: formal
    introduction_aliases: ["命題（Kähler cone の凸錐性）"]
    requires: [kahler.kahler-cone, kahler.positive-real-eleven-form]
  - id: kahler.representable-eleven-subspace
    name: 実閉(1,1)形式で表せる部分空間
    kind: definition
    introduction: formal
    introduction_aliases: ["定義（実閉(1,1)形式で表せる部分空間）"]
    requires: [geometry.de-rham-cohomology, kahler.positive-real-eleven-form]
  - id: kahler.relative-cone-openness
    name: Kähler coneの有限次元方向での開性
    kind: theorem
