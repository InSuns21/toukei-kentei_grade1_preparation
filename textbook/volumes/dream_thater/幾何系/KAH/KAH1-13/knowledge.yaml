  - id: kahler.no-global-kahler-potential
    name: コンパクト正次元では大域単一Kählerポテンシャルはない
    kind: corollary
    introduction: formal
    introduction_aliases: ["系（コンパクト正次元では大域単一Kählerポテンシャルはない）"]
