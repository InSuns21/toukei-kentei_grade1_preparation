  - { id: HOD1-02-DEF-03, name: "収縮作用素" }
theorems:
  - { id: HOD1-02-PROP-01, name: "随伴のunitary余標構表示" }
  - { id: HOD1-02-THM-01, name: "Lefschetz交換子の次数公式" }
  - { id: HOD1-02-PROP-02, name: "複素型と随伴の作用次数" }
canonical_examples:
  - 複素次元1の空・片側・両側の4基底状態
  - 複素次元2の基本形式・交差型・跡零(1,1)形式
  - 非KählerなHermite計量でも成立する点ごとの交換子
