id: "HOD1-02"
title: "Lefschetz作用素とその随伴"
volume: "foundations"
status: supplementary
prerequisites:
  - HOD1-01
  - KAH1-02
official_scope: []
learning_objectives:
  - 基本2形式のunitary余標構表示からLefschetz作用素Lと点ごとの随伴Lambdaを定義できる
  - 外積作用と収縮作用の随伴を符号込みで導出できる
  - 一複素次元の4状態を使い交換子[Lambda,L]の一般次数公式を証明できる
  - 複素次元1・2の(p,q)基底でLとLambdaを具体計算できる
  - 点ごとのHermite線形代数とKähler条件・大域解析を区別できる
definitions:
  - { id: HOD1-02-DEF-01, name: "Lefschetz作用素" }
