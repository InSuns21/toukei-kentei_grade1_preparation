id: "HOD1-11"
title: "Hard Lefschetz定理"
volume: "foundations"
status: supplementary
prerequisites:
  - HOD1-10
official_scope: []
learning_objectives:
  - 点ごとのLefschetz同型と調和形式上の同型が異なる主張であることを説明できる
  - 調和空間へのLとLambdaの制限を使い、高冪の単射と全射をPoincaré双対に頼らず証明できる
  - Hodge–de Rham同型を介してHard Lefschetz定理を厳密に導出できる
  - 型別のLefschetz同型とBetti数の次数対称性を導ける
  - 楕円曲線・複素二次元トーラス・CP1 x CP1で必要な冪と正規化係数を検算できる
  - 非コンパクトの場合と単なる閉2形式の場合で証明のどの段階が失敗するか説明できる
theorems:
  - { id: HOD1-11-PROP-01, name: "調和空間上のLefschetz同型" }
  - { id: HOD1-11-THM-01, name: "Hard Lefschetz定理" }
  - { id: HOD1-11-PROP-02, name: "型別Hard Lefschetz同型" }
  - { id: HOD1-11-COR-01, name: "Betti数の次数対称性" }
canonical_examples:
  - 楕円曲線の零次類と体積類のLefschetz同型
  - 複素二次元平坦トーラスの一次形式基底の同型
  - CP1 x CP1での零次・二次の冪と中央次数での核
  - 非コンパクト複素直線でのHard Lefschetz不成立
problem_patterns:
  - HOD1-11-POWER-AND-DEGREES
  - HOD1-11-ELLIPTIC-NORMALIZATION
  - HOD1-11-TORUS-MATRIX
  - HOD1-11-ORTHOGONAL-SURJECTIVITY
  - HOD1-11-HODGE-TYPE-REFINEMENT
  - HOD1-11-CP1-PRODUCT-POWER
  - HOD1-11-NONCOMPACT-COUNTEREXAMPLE
  - HOD1-11-LOW-HIGH-DEGREE
past_exam_alignment: []
integrated_exam_problems: []
exercise_counts: { level_a: 4, level_b: 4, level_c: 2, level_d: 0 }
