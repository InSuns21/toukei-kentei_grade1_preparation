id: "HOD1-09"
title: "具体例とHodgeダイヤモンドI"
volume: "foundations"
status: supplementary
prerequisites:
  - HOD1-07
  - CM2-05
  - KAH1-05
  - KAH1-07
official_scope: []
learning_objectives:
  - HodgeダイヤモンドとHodge多項式を定義し、低次元の実例から全型の次元とBetti数を復元できる
  - 任意の全格子による複素トーラスで、調和形式が定数係数形式に限られることを証明できる
  - 格子ベクトルに沿う周期積分と複素トーラスのHodge数の二項係数公式を計算できる
  - 複素射影直線のHodge数とKähler形式の規格化を既習結果から導ける
  - 積計量のLaplacian分解を使ってKünneth型のHodge数公式を証明し、積の例を計算できる
  - 奇数の第一Betti数がKähler性を妨げる論理を示し、Hopf曲面の存在と位相を確認できる
definitions:
  - { id: HOD1-09-DEF-01, name: "Hodgeダイヤモンド" }
  - { id: HOD1-09-DEF-02, name: "Hodge多項式" }
theorems:
  - { id: HOD1-09-LEM-01, name: "平坦トーラスの調和形式の定数性" }
  - { id: HOD1-09-THM-01, name: "複素トーラスのHodge数" }
  - { id: HOD1-09-PROP-01, name: "楕円曲線の周期とHodgeダイヤモンド" }
  - { id: HOD1-09-PROP-02, name: "射影直線のHodgeダイヤモンド" }
  - { id: HOD1-09-LEM-02, name: "積上のHodge Laplacianの分解" }
  - { id: HOD1-09-THM-02, name: "積のHodge数とHodge多項式" }
  - { id: HOD1-09-COR-01, name: "奇数の第一Betti数による非Kähler障害" }
  - { id: HOD1-09-PROP-03, name: "一次Hopf曲面の位相と非Kähler性" }
canonical_examples:
  - 楕円曲線のdzとdbar zの周期と四つのHodge数
  - 複素二次元トーラスの六つの二次Betti類
  - 射影直線と積CP1 x CP1のHodgeダイヤモンド
  - 楕円曲線と射影直線の積のHodge多項式
  - 一次Hopf曲面のS3 x S1への微分同相
