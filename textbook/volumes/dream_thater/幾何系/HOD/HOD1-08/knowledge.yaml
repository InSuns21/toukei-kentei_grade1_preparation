    requires: [complex-manifolds.dolbeault-bicomplex]
  - id: hodge.ddbar-easy-inclusions
    name: 二重完全形式の閉性と完全性
    kind: lemma
    introduction: formal
    introduction_aliases: ["補題（常に成り立つ包含）"]
    requires: [hodge.ddbar-exact-form]
  - id: hodge.green-dolbeault-commutation
    name: Green作用素と型別微分・随伴の可換性
    kind: lemma
    introduction: formal
