id: "HOD1-07"
title: "Hodge数の対称性と位相的制約"
volume: "foundations"
status: supplementary
prerequisites:
  - HOD1-06
official_scope: []
learning_objectives:
  - 複素共役とHodge星の線形性・反線形性と型の写り方を区別して調和形式の同型を証明できる
  - Hodge数の共役対称性と補次数対称性をKählerの仮定の下で導ける
  - 相補型の積分対が非退化であることをHodge星と正値内積で証明できる
  - Betti数のHodge数による和と奇数次Betti数の偶数性を証明できる
  - 複素曲面のHodge数を整理し必要条件と十分条件の違いを説明できる
