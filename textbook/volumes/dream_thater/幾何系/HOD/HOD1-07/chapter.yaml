  - { id: HOD1-07-LEM-02, name: "Hodge星とHodge Laplacianの可換性" }
  - { id: HOD1-07-THM-02, name: "Hodge数の補次数対称性" }
  - { id: HOD1-07-THM-03, name: "相補Hodge型の非退化積分対" }
  - { id: HOD1-07-THM-04, name: "Betti数に対するKähler制約" }
canonical_examples:
  - 平坦楕円曲線のHodge数と複素共役・星作用の符号
  - 楕円曲線の相補型積分と正値内積
  - 連結複素曲面のHodge数とBetti数の表
