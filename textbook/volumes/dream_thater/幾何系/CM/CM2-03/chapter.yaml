id: "CM2-03"
title: "局所bar∂-Poincaré補題と解析的準備"
volume: "foundations"
status: supplementary
prerequisites:
  - CM2-02
  - CM1-09
official_scope: []
learning_objectives:
  - bar∂閉性がbar∂方程式の局所可解性の必要条件であることを示せる
  - 局所bar∂原始形式を定義し外積の符号を含めて直接検算できる
  - 1/zの局所可積分性と分布的基本解を境界積分から証明できる
  - コンパクト台付きCauchy変換の平滑性とbar∂右逆性を導出できる
  - 切断関数と縮小円板による局所右逆の成立範囲を確認できる
  - 他変数の微分とT_jの交換、他変数での正則性保存を証明できる
  - 座標方向を一つずつ除去して局所bar∂-Poincaré補題を証明できる
  - 正の反正則次数と零次の違いを説明できる
  - 複素トーラスで局所可解でも大域可解でない具体例を周期積分から証明できる
