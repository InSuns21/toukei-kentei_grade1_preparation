official_scope: []
learning_objectives:
  - 滑らかな関数のWirtinger微分から∂fとbar∂fを導出し直接計算できる
  - 外微分の局所係数公式から(p,q)型に作用する∂とbar∂を構成できる
  - dの座標不変性と型分解の一意性から作用素の座標不変性を証明できる
  - d²=0と型の直和から∂²=bar∂²=0および反可換性を証明できる
  - 次数付きLeibniz則の符号を証明し具体計算で検証できる
  - 複素共役と正則引き戻しに対する自然性を証明できる
  - C1級関数についてbar∂f=0と正則性の同値を説明できる
  - 二重複体の配置と局所bar∂方程式の未解決部分を区別できる
