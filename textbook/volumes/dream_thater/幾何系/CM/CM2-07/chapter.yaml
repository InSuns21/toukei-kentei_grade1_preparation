  - { id: CM2-07-THM-01, name: 正則遷移行列からの貼り合わせ }
  - { id: CM2-07-PROP-02, name: 枠の変更と係数行列 }
  - { id: CM2-07-THM-02, name: 大域正則枠と正則自明性の同値 }
  - { id: CM2-07-PROP-03, name: 射影直線上の直和束の正則切断 }
canonical_examples:
  - 自明階数二束の三角行列による局所枠
  - 二つの非可換可逆行列の余輪条件
  - 射影直線上のO(-1)とO(1)の直和の大域切断
  - 射影直線の二乗写像による引き戻し
