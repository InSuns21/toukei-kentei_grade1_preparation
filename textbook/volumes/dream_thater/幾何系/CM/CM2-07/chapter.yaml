id: "CM2-07"
title: "正則ベクトル束と正則切断"
volume: "foundations"
status: supplementary
prerequisites:
  - CM2-06
  - CM1-05
  - CM1-10
official_scope: []
learning_objectives:
  - 階数rの正則ベクトル束・局所自明化・局所枠を定義し直接例で確かめられる
  - 行列値の遷移関数と非可換な余輪条件を枠の比較から導出できる
  - GLr値の正則余輪から商によって正則ベクトル束を貼り合わせられる
  - 正則切断の局所係数の整合式と枠変更公式を向きまで区別できる
  - 大域正則枠と正則自明性が同値であることを証明できる
  - 射影直線の直和束の大域正則切断を分類し階数と切断次元を区別できる
  - 二次正則写像の引き戻しで遷移行列と切断を計算できる
definitions:
  - { id: CM2-07-DEF-01, name: 正則ベクトル束と局所自明化 }
