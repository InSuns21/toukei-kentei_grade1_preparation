id: "CM2-06"
title: "正則線束・遷移関数"
volume: "foundations"
status: supplementary
prerequisites:
  - CM1-10
  - CM2-04
  - CA3
official_scope: []
learning_objectives:
  - 正則線束と局所自明化を定義し自明束で条件を確かめられる
  - 局所枠から遷移関数と余輪条件を導出できる
  - 乗法的余輪から正則線束を貼り合わせて構成できる
  - 正則切断の係数の変換則と枠の変更公式を区別して計算できる
  - 大域非零正則切断と正則自明性の同値を証明できる
  - 射影直線の普遍線束の遷移関数と非自明性を証明できる
  - O(k)の大域正則切断を多項式として分類できる
  - 正則写像の引き戻しで遷移関数が合成されることを具体例で確認できる
definitions:
  - { id: CM2-06-DEF-01, name: 正則線束と局所自明化 }
  - { id: CM2-06-DEF-02, name: 遷移関数と余輪条件 }
  - { id: CM2-06-DEF-03, name: 正則切断 }
  - { id: CM2-06-DEF-04, name: 射影直線の普遍線束 }
theorems:
