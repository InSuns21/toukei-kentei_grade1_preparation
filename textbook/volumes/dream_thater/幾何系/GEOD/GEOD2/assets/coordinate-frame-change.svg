<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" data-layout-lint="strict" role="img" aria-labelledby="title desc">
  <title id="title">同じ点の二つの座標系表示</title>
  <desc id="desc">座標系Aの原点からBの原点への変位がt、Bの原点から同じ点PまでがQp_B、Aの原点からPまでがp_A。Bの単位軸q1はAの縦軸、q2はAの横軸の負方向を向く。三本の変位はp_A=t+Qp_Bを満たす。</desc>
  <defs>
    <marker id="axis-arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7z" fill="#64748b"/></marker>
    <marker id="b-arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7z" fill="#15607a"/></marker>
    <marker id="t-arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7z" fill="#64748b"/></marker>
    <marker id="v-arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7z" fill="#15607a"/></marker>
    <marker id="p-arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7z" fill="#ad5e0a"/></marker>
  </defs>
  <path d="M85 324 H464 M85 324 V34" fill="none" stroke="#a0aec0" stroke-width="1.7" marker-end="url(#axis-arr)"/>
  <path d="M236 216 V71 M236 216 H117" fill="none" stroke="#15607a" stroke-width="1.7" stroke-dasharray="6 4" marker-end="url(#b-arr)"/>
  <path d="M85 324 L236 216" fill="none" stroke="#64748b" stroke-width="2.8" stroke-dasharray="4 5" marker-end="url(#t-arr)" data-series-group="displacements" data-series-label="translation"/>
  <path d="M236 216 L300 80" fill="none" stroke="#15607a" stroke-width="3.1" marker-end="url(#v-arr)" data-series-group="displacements" data-series-label="new-frame-vector"/>
  <path d="M85 324 L300 80" fill="none" stroke="#ad5e0a" stroke-width="2.4" stroke-dasharray="11 4 2 4" marker-end="url(#p-arr)" data-series-group="displacements" data-series-label="old-frame-vector"/>
  <circle cx="85" cy="324" r="4" fill="#0f172a"/>
  <circle cx="236" cy="216" r="4" fill="#0f172a"/>
  <circle cx="300" cy="80" r="4" fill="#0f172a"/>
  <text x="53" y="349" font-size="17" fill="#0f172a">O<tspan baseline-shift="sub" font-size="12">A</tspan></text>
  <text x="240" y="269" font-size="17" fill="#0f172a">O<tspan baseline-shift="sub" font-size="12">B</tspan></text>
  <text x="311" y="74" font-size="18" fill="#0f172a">P</text>
  <text x="462" y="295" font-size="16" fill="#475569">A₁</text>
  <text x="113" y="40" font-size="16" fill="#475569">A₂</text>
  <text x="247" y="78" font-size="17" fill="#15607a">q₁</text>
  <text x="120" y="187" font-size="17" fill="#15607a">q₂</text>
  <text x="99" y="262" font-size="18" fill="#475569">t</text>
  <text x="303" y="161" font-size="18" fill="#15607a">Qp<tspan baseline-shift="sub" font-size="12">B</tspan></text>
  <text x="153" y="177" font-size="18" fill="#92400e">p<tspan baseline-shift="sub" font-size="12">A</tspan></text>
</svg>
