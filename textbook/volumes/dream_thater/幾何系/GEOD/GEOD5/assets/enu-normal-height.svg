<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" role="img" aria-labelledby="title desc" data-layout-lint="strict">
  <title id="title">基準点の接平面と東・北・上の三方向</title>
  <desc id="desc">基準点Qを頂点とする局所接平面を淡い平行四辺形で示す。Qから東へ右下、北へ左上、楕円体外向き法線の上へ鉛直上向きの3本の矢印を描く。地上点PはQから上方向へ楕円体高hだけ進んだ位置にある。図は局所三次元配置の斜投影模式図で、地球全体の形状を表さない。</desc>
  <defs>
    <marker id="east" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#0a6886"/></marker>
    <marker id="north" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#a45110"/></marker>
    <marker id="up" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#27374e"/></marker>
  </defs>
  <path d="M275 233 L445 271 L347 210 L177 172 Z" fill="#e8eef2" stroke="#92a4b2" stroke-width="1.6"/>
  <path d="M275 233 L445 271" stroke="#0a6886" stroke-width="3" marker-end="url(#east)" data-series-group="enu-axes" data-series-label="東"/>
  <path d="M275 233 L177 172" stroke="#a45110" stroke-width="3" stroke-dasharray="9 4" marker-end="url(#north)" data-series-group="enu-axes" data-series-label="北"/>
  <path d="M275 233 V61" stroke="#27374e" stroke-width="3" stroke-dasharray="12 4 2 4" marker-end="url(#up)" data-series-group="enu-axes" data-series-label="上"/>
  <circle cx="275" cy="233" r="5" fill="#17212b"/>
  <circle cx="275" cy="103" r="6" fill="#17212b"/>
  <path d="M290 103 H319 M290 233 H319" stroke="#808c9b" stroke-width="1.2" stroke-dasharray="4 4"/>
  <path d="M314 103 V233" stroke="#536278" stroke-width="1.5"/>
  <path d="M308 109 L314 103 L320 109 M308 227 L314 233 L320 227" stroke="#536278" stroke-width="1.5" fill="none"/>
  <g fill="#17212b" font-family="sans-serif" font-size="20">
    <text x="249" y="257">Q</text>
    <text x="244" y="97">P</text>
    <text x="487" y="304">East E</text>
    <text x="82" y="144">North N</text>
    <text x="285" y="55">Up U</text>
    <text x="332" y="174">h</text>
  </g>
</svg>
