id: "GEOD22"
title: "総合演習：観測から測地座標、地域図・世界図まで"
volume: "foundations"
status: supplementary
prerequisites:
  - GEOD2
  - GEOD4
  - GEOD5
  - GEOD8
  - GEOD10
  - GEOD11
  - GEOD13
  - GEOD16
  - GEOD17
  - GEOD18
