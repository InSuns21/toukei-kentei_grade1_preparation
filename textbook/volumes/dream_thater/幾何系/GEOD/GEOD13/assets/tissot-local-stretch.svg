<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 288" role="img" aria-labelledby="title desc" data-layout-lint="strict">
  <title id="title">同じ半径の円が局所伸縮で楕円になる</title>
  <desc id="desc">左の接平面の単位円を、第一軸方向に2倍、第二軸方向に2分の1倍する。右の投影面では長半軸2、短半軸2分の1の楕円となる。基準の円は破線で示す。元と像の面積は等しい。</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#31373e"/>
    </marker>
  </defs>
  <g fill="#20242b" font-family="sans-serif" font-size="16">
    <text x="82" y="32">Source: unit circle</text>
    <text x="445" y="32">Image: axes 2 and 1/2</text>
  </g>
  <g stroke="#687480" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <path d="M60 164 H305"/>
    <path d="M176 266 V65"/>
    <path d="M368 164 H731"/>
    <path d="M546 266 V65"/>
  </g>
  <g fill="#303945" font-family="sans-serif" font-size="14">
    <text x="274" y="188">u1</text>
    <text x="187" y="82">u2</text>
    <text x="688" y="188">Du1</text>
    <text x="560" y="82">Du2</text>
  </g>
  <g data-series-group="unit-circle" data-series-label="元の円と基準円" stroke="#467a9d" stroke-width="3" fill="#d5e7f1" fill-opacity="0.45">
    <circle cx="176" cy="164" r="70"/>
  </g>
  <g data-series-group="unit-circle" data-series-label="投影面の基準円" stroke="#467a9d" stroke-width="2" stroke-dasharray="7 5" fill="none">
    <circle cx="546" cy="164" r="70"/>
  </g>
  <g data-series-group="tissot-ellipse" data-series-label="Tissot指示楕円" stroke="#b4562c" stroke-width="3.5" fill="#efcfbe" fill-opacity="0.32">
    <ellipse cx="546" cy="164" rx="140" ry="35"/>
  </g>
  <g stroke="#31373e" stroke-width="1.6" fill="none">
    <path d="M176 164 H246"/>
    <path d="M176 164 V94"/>
    <path d="M546 164 H686"/>
    <path d="M546 164 V129"/>
  </g>
  <g fill="#29313a" font-family="sans-serif" font-size="15">
    <text x="335" y="142">D</text>
    <text x="90" y="279">Area = π</text>
    <text x="468" y="279">Area = π</text>
  </g>
  <path d="M326 164 H358" stroke="#31373e" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>
</svg>
