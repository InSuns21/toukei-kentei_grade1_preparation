<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 405" data-layout-lint="strict" role="img" aria-labelledby="title desc">
  <title id="title">測地緯度と地心緯度の異なる向き</title>
  <desc id="desc">北半球の楕円の子午断面。中心Oから楕円上の点Pへ引く半径方向は赤道線との角ψ、Pでの外向き法線はその点を通る水平線との角φを作る。扁平な楕円では一般にφがψより大きい。</desc>
  <defs>
    <marker id="normal-arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8z" fill="#ad5e0a"/></marker>
    <marker id="radial-arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8z" fill="#15607a"/></marker>
  </defs>
  <path d="M32 235 H500 M260 336 V34" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="4 5" fill="none"/>
  <ellipse cx="260" cy="235" rx="184" ry="148" fill="#f0f7f9" stroke="#475569" stroke-width="2.2"/>
  <path d="M260 235 L390.1 130.35" stroke="#15607a" stroke-width="3.1" stroke-dasharray="9 5" fill="none" marker-end="url(#radial-arr)" data-series-group="lat-directions" data-series-label="radial"/>
  <path d="M390.1 130.35 L459.5 43.3" stroke="#ad5e0a" stroke-width="3.4" fill="none" marker-end="url(#normal-arr)" data-series-group="lat-directions" data-series-label="normal"/>
  <path d="M390.1 130.35 H518" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 5" fill="none"/>
  <path d="M305 235 A45 45 0 0 0 295.2 206.8" fill="none" stroke="#15607a" stroke-width="1.8"/>
  <path d="M436.1 130.35 A46 46 0 0 0 418.8 94.4" fill="none" stroke="#ad5e0a" stroke-width="1.8"/>
  <circle cx="260" cy="235" r="4" fill="#0f172a"/>
  <circle cx="390.1" cy="130.35" r="4" fill="#0f172a"/>
  <text x="238" y="280" font-size="18" fill="#0f172a">O</text>
  <text x="368" y="96" font-size="18" fill="#0f172a">P</text>
  <text x="507" y="252" font-size="17" fill="#475569">p</text>
  <text x="269" y="28" font-size="17" fill="#475569">Z</text>
  <text x="281" y="190" font-size="18" fill="#15607a">ψ</text>
  <text x="449" y="108" font-size="18" fill="#92400e">φ</text>
  <text x="307" y="140" font-size="17" fill="#15607a">OP</text>
  <text x="487" y="48" font-size="17" fill="#92400e">ν</text>
</svg>
