<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 405" data-layout-lint="strict" role="img" aria-labelledby="title desc">
  <title id="title">日本の平面直角座標XとY、一般的な北距と東距の対応</title>
  <desc id="desc">投影平面で原点Oから北へ180メートル、東へ250メートル進んだ点P。上向きが日本式Xおよび一般的なNp、右向きが日本式Yおよび一般的なE。値の順序がX,YとE,Npで逆である。</desc>
  <defs>
    <marker id="north-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#15578e"/></marker>
    <marker id="east-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#ab531c"/></marker>
  </defs>
  <path d="M140 345 V53" fill="none" stroke="#15578e" stroke-width="3" marker-end="url(#north-arrow)" data-series-group="axis" data-series-label="north"/>
  <path d="M140 345 H517" fill="none" stroke="#ab531c" stroke-width="3" stroke-dasharray="10 5" marker-end="url(#east-arrow)" data-series-group="axis" data-series-label="east"/>
  <path d="M140 165 H390 V345" fill="none" stroke="#778b9f" stroke-width="1.8" stroke-dasharray="5 6"/>
  <circle cx="140" cy="345" r="4" fill="#172235"/>
  <circle cx="390" cy="165" r="5.5" fill="#172235"/>
  <text x="114" y="371" font-size="20" fill="#172235">O</text>
  <text x="402" y="155" font-size="20" fill="#172235">P</text>
  <text x="155" y="61" font-size="19" fill="#15578e">+X = +Np</text>
  <text x="409" y="374" font-size="19" fill="#ab531c">+Y = +E</text>
  <text x="48" y="167" font-size="20" fill="#15578e">180 m</text>
  <text x="295" y="384" font-size="20" fill="#ab531c">250 m</text>
</svg>
