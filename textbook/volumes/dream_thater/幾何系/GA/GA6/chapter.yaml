  - { id: GA6-THM-01, name: "エネルギー恒等式と調和性の判定" }
  - { id: GA6-LEM-01, name: "Hodge作用素の楕円型評価" }
  - { id: GA6-THM-02, name: "Hodge Laplacianの非負自己共役実現と有限次元核" }
  - { id: GA6-THM-03, name: "閉多様体のHodge直交分解" }
  - { id: GA6-THM-04, name: "Hodge--de Rham同型" }
