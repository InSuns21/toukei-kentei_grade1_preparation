    requires: [geometric-analysis.h1-weak-poisson]
  - id: geometric-analysis.poisson-existence
    name: コンパクト境界なしPoisson問題の存在一意性
    kind: theorem
    introduction: formal
    introduction_aliases: ["定理（コンパクト境界なしPoisson問題の存在一意性）"]
