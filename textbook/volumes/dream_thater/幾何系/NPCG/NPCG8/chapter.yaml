learning_objectives:
  - 有限加重重心を定義し実直線と距離木で計算できる
  - CN不等式と完備性から重心の存在一意性を証明できる
  - 分散不等式を導出し近似重心の距離誤差を評価できる
  - Euclid空間の等式と距離木の厳密な不等号を区別できる
  - 四点の平方差評価から重心の安定性を証明できる
  - 閉凸集合への射影と二点間距離の平均から重心を評価できる
