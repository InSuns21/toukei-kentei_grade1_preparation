id: "NPCG7"
title: "閉凸集合への射影とPythagoras型評価"
volume: "foundations"
status: supplementary
prerequisites: [NPCG6]
official_scope: []
learning_objectives:
  - 距離射影を定義し具体的な集合で最近点を計算できる
  - CN不等式から最小化列のCauchy性と最近点の存在一意性を証明できる
  - 閉性・凸性・完備性の役割を反例で区別できる
  - Pythagoras型不等式を導き最近点の特徴付けに使える
  - 四点の平方差評価から距離射影の非拡大性を証明できる
  - 近似射影の誤差と交互射影の二乗距離減少を評価できる
definitions:
  - { id: NPCG7-DEF-01, name: "距離射影" }
theorems:
  - { id: NPCG7-THM-01, name: "閉凸集合への距離射影の存在と一意性" }
  - { id: NPCG7-THM-02, name: "射影のPythagoras型不等式" }
  - { id: NPCG7-THM-03, name: "距離射影の非拡大性" }
canonical_examples: [半直線, 有限距離木, Euclid平面の直線]
