id: "NPCG10"
title: "射影の平均と交互射影：凸集合の角度"
volume: "foundations"
status: supplementary
prerequisites: [NPCG9]
official_scope: []
learning_objectives:
  - 射影の加重重心平均と交互射影を定義し実直線と平面で計算できる
  - 射影平均の二乗距離減少と固定点の特徴付けおよび非拡大性を証明できる
  - 交互射影の二乗距離減少から移動距離の収束を証明できる
  - 距離下界条件から幾何級数型の距離評価と極限点の存在を証明できる
  - 直線の角度から正確な収束係数を計算し一般評価および仮定を外した反例と比較できる
definitions:
  - { id: NPCG10-DEF-01, name: "射影の加重重心平均" }
  - { id: NPCG10-DEF-02, name: "交互射影" }
  - { id: NPCG10-DEF-03, name: "交互射影の距離下界条件" }
theorems:
  - { id: NPCG10-THM-01, name: "射影平均の二乗距離減少" }
  - { id: NPCG10-THM-02, name: "射影平均の非拡大性" }
  - { id: NPCG10-THM-03, name: "交互射影の二乗距離減少" }
  - { id: NPCG10-THM-04, name: "距離下界条件による交互射影の収束率" }
canonical_examples: [実直線の区間への射影平均, Euclid平面の交差直線, 放物線の上側領域と横軸]
