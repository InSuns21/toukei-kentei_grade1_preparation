id: "NPCG2"
title: "長さ空間・測地線・比較三角形"
volume: "foundations"
status: supplementary
prerequisites:
  - NPCG1
  - F0-00C
  - RA2
official_scope: []
learning_objectives:
  - 分割和の上限から曲線長を計算し加法性と端点評価を証明できる
  - 長さ空間と測地空間の条件を確認し下限と最小値を区別できる
  - 測地線分の距離条件を確認し最短曲線の部分区間の性質を導ける
  - 三辺からEuclid比較三角形を構成し退化の場合も比較点への二乗距離を計算できる
definitions:
  - { id: NPCG2-DEF-01, name: 距離による曲線長 }
