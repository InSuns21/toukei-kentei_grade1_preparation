  - { id: NPCG2-THM-02, name: 最短曲線の部分区間と測地空間 }
  - { id: NPCG2-THM-03, name: 比較三角形の存在と合同性 }
  - { id: NPCG2-THM-04, name: 比較点への二乗距離公式 }
