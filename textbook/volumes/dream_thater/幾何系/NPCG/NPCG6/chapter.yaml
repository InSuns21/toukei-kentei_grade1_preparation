id: "NPCG6"
title: "四辺形不等式・等号・平坦な部分集合"
volume: "foundations"
status: supplementary
prerequisites:
  - NPCG5
official_scope: []
learning_objectives:
  - CN不等式から四辺形不等式と対角線の中点間距離評価を証明できる
  - 等号条件を非負の余りに分解し、中点一致だけでは不十分なことを説明できる
  - 二乗距離評価の等号を線分全体へ伝播させられる
  - 四点の平方差評価を線分の分割と相殺で証明できる
  - 等号から平坦な部分集合を構成し、空間全体の平坦性と区別できる
