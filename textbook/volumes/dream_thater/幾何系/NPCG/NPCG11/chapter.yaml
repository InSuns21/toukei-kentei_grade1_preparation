id: "NPCG11"
title: "非線形Poincaré不等式：CayleyグラフとHilbert版の比較"
volume: "foundations"
status: supplementary
prerequisites: [NPCG10, GCT14, F0-02C1, F0-00F1]
official_scope: []
learning_objectives:
  - Cayleyグラフの全対平均と辺平均を区別し非線形Poincaré不等式を定義できる
  - 最短歩道と生成条件により一般距離空間での有限定数を証明できる
  - 実数値ギャップとHilbert空間値の最良定数の一致を座標分解から証明できる
  - 一般距離空間への定数の移行と群の族での一様性が失敗する例を計算できる
  - 重心分散の比較と等長群作用の固定点評価を導ける
