learning_objectives:
  - 体上の行列の階数を像の次元から求め階数距離の公理と不変性を証明できる
  - 階数の劣加法性と等号の二条件を証明し反例を計算できる
  - 有限行列空間の点数と完備性・コンパクト性を証明し距離の違いを説明できる
  - 有限行列値Poincaré最良定数の達成と一様性の違いを説明し四頂点の例を計算できる
