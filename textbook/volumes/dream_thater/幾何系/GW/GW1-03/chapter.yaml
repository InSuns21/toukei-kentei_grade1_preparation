  - { id: GW1-03-THM-02, name: 閉曲面上の一階楕円型評価と正則性 }
  - { id: GW1-03-THM-03, name: 閉曲面上の楕円作用素はFredholm }
  - { id: GW1-03-THM-04, name: Riemann面上のDolbeault指数の計算 }
  - { id: GW1-03-THM-05, name: 擬正則写像の線形化の実指数 }
canonical_examples:
  - 平坦トーラスのFourierモードとSobolevノルム
  - 複素平面の正則・反正則変分の線形化
  - 複素数による主シンボルの逆
  - 定数写像の種数による指数
  - 射影直線へのべき写像とO(2d)の切断
