id: "GW1-03"
title: "楕円型正則性と線形化"
volume: "foundations"
status: supplementary
prerequisites:
  - GW1-02
  - GA2
  - GA3
  - GA6
  - CM2-03
  - CM2-04
  - CM2-05
  - CM2-10
  - HOD1-06
  - AG2-07
  - AG3-08
official_scope: []
learning_objectives:
  - Sobolev完備化による写像空間と非線形Cauchy–Riemann作用素の定義域・値域を説明できる
  - 捩率零接続による線形化を導出しJの微分項を落とさずに計算できる
  - 主シンボルの逆を示して楕円性と局所評価を証明できる
  - Rellichコンパクト性と楕円型評価からFredholm性を説明できる
  - 線束の点による短完全列からDolbeault指数を導き実指数の係数を検算できる
  - 定数写像と射影直線のべき写像について指数・核・余核を計算できる
  - Fredholm指数と横断性・商・標点を混同しない
