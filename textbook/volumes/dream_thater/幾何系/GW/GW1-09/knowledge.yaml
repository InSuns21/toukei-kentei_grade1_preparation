    introduction_aliases: ["定理（射影空間の凸性と変形次元）"]
    requires: [gromov-witten.convex-projective-target, algebraic-geometry.projective-tangent-euler, algebraic-geometry.p1-sheaf-cohomology]
  - id: gromov-witten.grassmann-convex
