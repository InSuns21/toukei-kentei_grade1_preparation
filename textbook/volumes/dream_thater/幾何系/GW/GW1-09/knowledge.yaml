    requires: [gromov-witten.stable-map, gromov-witten.global-generation-h1-vanishing]
  - id: gromov-witten.negative-normal-nonconvex
    name: 負の正規束を持つ射影標的は凸でない
    kind: proposition
    introduction: formal
