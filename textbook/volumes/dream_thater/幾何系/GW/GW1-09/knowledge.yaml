chapter: GW1-09
scope: dream-theater
coverage: complete
prerequisites:
  - GW1-08
  - GW1-03
  - CM2-07
  - AG2-09
  - AG2-10
  - AG3-08
concepts:
  - id: gromov-witten.fixed-domain-deformation-obstruction
    name: 固定定義域の変形空間と障害空間
    kind: definition
    introduction: formal
    introduction_aliases: ["定義（固定定義域の変形空間と障害空間）"]
    requires: [complex-manifolds.holomorphic-vector-bundle, algebraic-geometry.sheaf-cohomology]
  - id: gromov-witten.first-order-obstruction
    name: 一次変形と貼り合わせ障害
    kind: proposition
    introduction: formal
    introduction_aliases: ["命題（一次変形と貼り合わせ障害）"]
    requires: [gromov-witten.fixed-domain-deformation-obstruction, algebraic-geometry.connecting-cech]
  - id: gromov-witten.convex-projective-target
    name: 種数0に関する凸な射影標的
    kind: definition
    introduction: formal
    introduction_aliases: ["定義（種数0に関する凸な射影標的）"]
    requires: [gromov-witten.fixed-domain-deformation-obstruction]
  - id: gromov-witten.global-generation-on-curves
    name: 正則ベクトル束の大域生成
    kind: definition
    introduction: formal
    introduction_aliases: ["定義（正則ベクトル束の大域生成）"]
    requires: [complex-manifolds.holomorphic-vector-section]
