  - { id: GW1-09-LEM-01, name: 大域生成から球面上のH1消滅 }
  - { id: GW1-09-THM-01, name: 射影空間の凸性と変形次元 }
  - { id: GW1-09-PROP-02, name: Grassmann多様体の接束と凸性 }
  - { id: GW1-09-PROP-03, name: 凸標的への滑らかな球面写像の局所自由度 }
  - { id: GW1-09-PROP-04, name: 種数0の節点付き写像の切断と障害 }
  - { id: GW1-09-PROP-05, name: 負の正規束を持つ射影標的は凸でない }
canonical_examples:
  - 定数写像の引き戻し自明束と標的点の変形
  - 射影直線の次数d写像でのO(2d)のH1消滅
  - 接Euler列を用いた射影平面への直線写像の5次元変形と2次元商
  - Grassmann多様体のグラフ座標とS双対テンソルQ
  - 二つの次数1球面が節点で一致する場合の正規化短完全列
  - Hirzebruch曲面の負の切断とO(2)直和O(-2)の障害
