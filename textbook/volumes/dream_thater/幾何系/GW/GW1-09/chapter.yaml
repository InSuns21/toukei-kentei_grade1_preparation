id: "GW1-09"
title: "凸な射影標的と変形・障害"
volume: "foundations"
status: supplementary
prerequisites:
  - GW1-08
  - GW1-03
  - CM2-07
  - AG2-09
  - AG2-10
  - AG3-08
official_scope: []
learning_objectives:
  - 正則写像の固定定義域の一次変形と局所持ち上げの障害をH0・H1のČech計算から説明できる
  - 球面上の全正則写像でH1が消えるという凸性を定義し高種数への誤用を避けられる
  - 大域生成の評価写像条件を直接確認し長完全列からH1消滅を証明できる
  - 接Euler列から射影空間の凸性と変形次元を任意次数で導出できる
  - Grassmann多様体の接空間をグラフ座標から作り普遍部分束・商束の大域生成で凸性を示せる
  - Dolbeault線形化とRiemann–Rochから球面写像の滑らかな局所自由度・標点・再パラメータ化を数えられる
  - 節点付き木の正規化完全列と値一致写像の全射性からH0・H1を計算できる
  - 負の正規束を持つ滑らかな射影曲面の反例で障害と期待次元・実次元の相違を説明できる
  - 凸性による障害消滅と節点を含むモジュライ全体の構成・固有性との論証上の違いを特定できる
definitions:
  - { id: GW1-09-DEF-01, name: 固定定義域の変形空間と障害空間 }
  - { id: GW1-09-DEF-02, name: 種数0に関する凸な射影標的 }
  - { id: GW1-09-DEF-03, name: 正則ベクトル束の大域生成 }
theorems:
