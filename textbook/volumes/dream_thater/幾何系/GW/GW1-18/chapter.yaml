id: "GW1-18"
title: "平面有理曲線の数え上げ"
volume: "foundations"
status: supplementary
prerequisites:
  - GW1-17
  - GW1-16
  - GW1-15
  - GW1-14
  - GW1-13
  - GW1-12
  - GW1-10
