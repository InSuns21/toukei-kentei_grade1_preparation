id: "GW1-04"
title: "正則性・横断性と多重被覆"
volume: "foundations"
status: supplementary
prerequisites:
  - GW1-03
  - GW1-02
  - GW1-01
  - SYM8
  - AG3-08
  - RA6A
official_scope: []
learning_objectives:
  - Fredholm指数と線形化の全射性を区別し局所解空間の次元を導ける
  - 単射な正則点・単純曲線・分岐多重被覆の条件を具体例で判定できる
  - Jの接変分の反可換条件と普遍線形化の符号を導ける
  - 単純曲線の単射な正則点を使って普遍線形化の余核を消去する証明を再構成できる
  - Fredholm射影とSard–Smaleの一般位置原理から一般のJの正則性を説明できる
  - 正の線束と負の法束の被覆例で核・余核・指数と商後の次元を検算できる
  - 多重被覆には単純曲線の横断性証明がそのまま使えない理由を説明できる
definitions:
  - { id: GW1-04-DEF-01, name: 正則な擬正則写像 }
  - { id: GW1-04-DEF-02, name: 単射な正則点と単純曲線 }
  - { id: GW1-04-DEF-03, name: 多重被覆 }
  - { id: GW1-04-DEF-04, name: 普遍Cauchy–Riemann切断 }
theorems:
