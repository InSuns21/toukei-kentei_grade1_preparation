  - { id: GW1-04-PROP-02, name: 普遍線形化 }
  - { id: GW1-04-THM-01, name: 単純曲線における普遍横断性 }
  - { id: GW1-04-LEM-01, name: Fredholm写像の一般位置原理 }
  - { id: GW1-04-THM-02, name: 単純曲線に対する一般のJの正則性 }
  - { id: GW1-04-PROP-03, name: 負の法束を持つ球面の多重被覆 }
canonical_examples:
  - 射影直線のzのd乗写像における単射正則点の欠如と余核ゼロ
  - J変分の反可換線形代数と局所台の選択
  - 射影直線の負の法束二つの全空間における多重被覆の余核
  - 射影平面の直線の標点付き期待実次元
