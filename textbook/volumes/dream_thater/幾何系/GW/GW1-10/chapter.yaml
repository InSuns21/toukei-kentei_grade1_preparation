id: "GW1-10"
title: "モジュライの構成と次元"
volume: "foundations"
status: supplementary
prerequisites:
  - GW1-09
  - GW1-08
  - GW1-07
  - GW1-03
  - AG3-08
  - AG2-09
official_scope: []
learning_objectives:
  - 安定写像の家族と同型を定義しスタックと粗モジュライを自己同型の例で区別できる
  - 二重被覆の直像分解から凸性が球面の評価全射を与えることを証明できる
  - 木の正規化完全列と評価写像の全射を使って節点曲線のH1消滅を導ける
  - 安定性から一様に正な埋め込み束Lを構成しその次数・切断数を計算できる
  - Hilbertパラメータと座標変更群からモジュライの構成と固有性の証明工程を説明できる
  - 凸性を使う滑らかさと凸性なしでも成立する存在・固有性を区別できる
  - 各成分の変形・特殊点・座標変更・節点値一致・平滑化を数えて複素次元公式を導ける
  - 節点の個数と境界の余次元および正規交叉モデルの関係を導ける
  - 次数0の積表示と射影平面への次数1写像のモジュライを直接計算できる
definitions:
  - { id: GW1-10-DEF-01, name: 種数0安定写像の家族 }
  - { id: GW1-10-DEF-02, name: 安定写像のモジュライ・スタックと粗モジュライ }
theorems:
