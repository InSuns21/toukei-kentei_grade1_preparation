  - { id: GW1-10-PROP-01, name: 凸標的への種数0節点写像の障害消滅 }
  - { id: GW1-10-PROP-02, name: 安定性が与える一様な埋め込み次数 }
  - { id: GW1-10-THM-01, name: 種数0安定写像の代数的モジュライ }
  - { id: GW1-10-THM-02, name: 凸標的の種数0モジュライの滑らかさと次元 }
  - { id: GW1-10-PROP-03, name: 次数0モジュライの積表示 }
  - { id: GW1-10-PROP-04, name: 射影平面への無標点次数1安定写像 }
  - { id: GW1-10-PROP-05, name: 凸標的の節点数と境界の余次元 }
canonical_examples:
