    introduction_aliases: ["命題（次数0モジュライの積表示）"]
    requires: [gromov-witten.stable-map-zero-class, gromov-witten.stable-map-stack]
  - id: gromov-witten.lines-moduli
    name: 射影平面への無標点次数1安定写像
    kind: proposition
    introduction: formal
    introduction_aliases: ["命題（射影平面への無標点次数1安定写像）"]
    requires: [gromov-witten.stable-map-stack, gromov-witten.projective-space-convex]
  - id: gromov-witten.convex-boundary-codimension
    name: 凸標的の節点数と境界の余次元
    kind: proposition
    introduction: formal
    introduction_aliases: ["命題（凸標的の節点数と境界の余次元）"]
    requires: [gromov-witten.convex-moduli-dimension, gromov-witten.stable-marked-curve]
