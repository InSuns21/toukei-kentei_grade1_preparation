learning_objectives:
  - 凸性と安定範囲から有理スタック基本類による種数0一次GW不変量を定義できる
  - 実次数と複素次元の違いを保ちGW挿入の次数必要条件を導ける
  - 次数0の三点公式と四標点以上の一次不変量の消滅を証明できる
  - 横断的な孤立交叉から自己同型の逆数を重みとする計数公式を導ける
  - 射影平面への次数1写像の二点条件で横断性と数1を説明できる
  - 同一点条件で生じる正次元の境界逆像と非横断性を判定できる
  - 凸射影族の相対滑らかさと固有性から変形不変性の条件と結論を述べられる
  - 曲線の像の本数と標点付き安定写像の重み付き数を区別できる
