    requires: [gromov-witten.stable-map-degree-splitting, gromov-witten.stable-marked-curve]
  - id: gromov-witten.stable-map-constant-bound
    name: 定数成分数の組合せ上界
    kind: proposition
    introduction: formal
    introduction_aliases: ["命題（定数成分数の組合せ上界）"]
    requires: [gromov-witten.stable-map, gromov-witten.energy-quantization]
  - id: gromov-witten.stable-map-moduli-set
    name: 種数0安定写像のモジュライ集合
    kind: definition
    introduction: formal
    introduction_aliases: ["定義（種数0安定写像のモジュライ集合）"]
