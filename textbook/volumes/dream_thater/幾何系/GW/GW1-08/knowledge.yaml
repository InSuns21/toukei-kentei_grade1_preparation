  - id: gromov-witten.stable-map-forgetful
    name: 安定写像の標点忘却と安定化
    kind: proposition
    introduction: formal
    introduction_aliases: ["命題（安定写像の標点忘却と安定化）"]
    requires: [gromov-witten.stable-map, gromov-witten.forgetful-stabilization]
