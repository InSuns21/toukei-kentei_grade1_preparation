chapter: GW1-08
scope: dream-theater
coverage: complete
prerequisites:
  - GW1-07
concepts:
  - id: gromov-witten.stable-map
    name: 種数0の標点付き安定J-正則写像
    kind: definition
    introduction: formal
    introduction_aliases: ["定義（種数0の標点付き安定 $J$-正則写像）"]
    requires: [gromov-witten.stable-sphere-tree, gromov-witten.stable-marked-curve]
  - id: gromov-witten.stable-map-isomorphism
    name: 安定写像の同型と自己同型
    kind: definition
    introduction: formal
    introduction_aliases: ["定義（安定写像の同型と自己同型）"]
    requires: [gromov-witten.stable-map, gromov-witten.three-point-normalization]
  - id: gromov-witten.stable-map-finite-automorphisms
    name: 種数0の安定性と有限自己同型
    kind: theorem
    introduction: formal
    introduction_aliases: ["定理（種数0の安定性と有限自己同型）"]
    requires: [gromov-witten.stable-map-isomorphism, gromov-witten.three-point-normalization]
  - id: gromov-witten.stable-map-degree-splitting
    name: 次数・面積の成分加法性
    kind: proposition
    introduction: formal
    introduction_aliases: ["命題（次数・面積の成分加法性）"]
    requires: [gromov-witten.stable-map, gromov-witten.energy-identity]
  - id: gromov-witten.stable-map-zero-class
    name: 総曲線類0の種数0安定写像
    kind: proposition
