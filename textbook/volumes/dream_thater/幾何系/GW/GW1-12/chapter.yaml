id: "GW1-12"
title: "境界の分裂と貼り合わせ"
volume: "foundations"
status: supplementary
prerequisites:
  - GW1-11
  - GW1-10
  - GW1-09
  - GW1-08
  - GW1-07
official_scope: []
learning_objectives:
  - 許容分裂の安定条件と次数0の例外を標点配置から判定できる
  - 節点での値一致を二評価射のファイバー積で定義し具体例を検算できる
  - 二成分の貼り合わせが写像と同型に両立することを証明できる
  - 凸性による評価全射を用いて一節点境界の余次元1を導ける
  - 局所方程式xy=tと節点付き写像の障害消滅を結び付けて説明できる
  - 射影直線と射影平面の対角類を双対基底から計算できる
  - 一節点境界の挿入積分を二つの因子の積分へ分裂させ係数と次数を検証できる
  - 無標点同次数分裂の枝交換とスタック上の重みを区別できる
  - 四標点の異なる境界分割を用いて具体的な分裂公式を検算できる
definitions:
  - { id: GW1-12-DEF-01, name: 許容される一節点分裂 }
  - { id: GW1-12-DEF-02, name: 節点一致のファイバー積 }
  - { id: GW1-12-DEF-03, name: 対角類による節点一致の交叉類 }
theorems:
  - { id: GW1-12-PROP-01, name: 節点での貼り合わせ射 }
  - { id: GW1-12-PROP-02, name: 節点一致と境界の次元 }
  - { id: GW1-12-PROP-03, name: 凸標的の局所貼り合わせと平滑化 }
  - { id: GW1-12-THM-01, name: 凸標的の一節点境界の分裂公式 }
  - { id: GW1-12-PROP-04, name: 四標点境界の二通りの分裂 }
canonical_examples:
  - 四標点の次数0と次数1の許容分裂の比較
  - 射影直線の次数1写像二本の節点値一致と対称性
  - 射影平面の0+1分裂のファイバー積の次元
  - 局所平滑化xy=tと座標変換
  - 射影直線および射影平面の対角類展開
  - 射影直線の次数0四標点境界積分
  - 射影直線の次数1四標点の二種類の分裂
