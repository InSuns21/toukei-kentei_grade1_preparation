official_scope: []
learning_objectives:
  - Poincaré交叉行列と双対基底により三点相関の係数からコホモロジー類を復元できる
  - 有効曲線類のNovikov変数・完備化とChern次数の役割を説明できる
  - 三点種数0GW不変量から偶数部分の小量子積を定義し基底非依存性を証明できる
  - 量子積の次数0極限・単位元・次数の整合を公理から導ける
  - 四標点の境界の三通りの等値性と分裂公式から偶数挿入のWDVV方程式を導ける
  - 量子積を二回展開し12|34と14|23の境界公式から結合律を証明できる
  - 射影直線の量子積とWDVVを直接計算し奇数挿入・非凸標的への適用限界を指摘できる
definitions:
  - { id: GW1-16-DEF-01, name: 有効曲線類のNovikov完備化 }
  - { id: GW1-16-DEF-02, name: 偶数コホモロジーの小量子積 }
theorems:
  - { id: GW1-16-PROP-01, name: 古典極限・単位元・次数 }
  - { id: GW1-16-THM-01, name: 偶数挿入のWDVV方程式 }
  - { id: GW1-16-THM-02, name: 偶数部分の小量子積の結合律 }
canonical_examples:
  - 射影直線のPoincaré双対基底と復元式
  - 射影直線のh*h=qとNovikov次数
  - 射影平面の次数0での古典積の復元
  - 射影直線の次数1四標点WDVVを各分裂で検算
