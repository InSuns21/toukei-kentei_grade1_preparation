official_scope: []
learning_objectives:
  - 時間的関係の端点安定性を局所座標と開錐性から証明できる
  - 因果曲線を時間的場の流れで押し上げる変形と一様誤差評価を再現できる
  - push-up補題の二方向の含意を端点の摂動と連結で証明できる
  - 任意の部分集合の時間的未来・過去が開集合になる理由を説明できる
  - I±とJ±の内部・閉包の関係を因果到達関係から証明できる
  - 点除去Minkowski時空でJ+の非閉性を曲線の積分と近似直線から証明できる
