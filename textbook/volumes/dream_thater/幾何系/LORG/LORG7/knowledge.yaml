chapter: LORG7
scope: dream-theater
coverage: complete
prerequisites:
  - LORG1
  - LORG2
  - LORG3
  - LORG4
  - LORG5
  - LORG6
concepts:
  - id: lorentz-geometry.timelike-relation-openness
    name: 時間的関係の端点安定性
    kind: lemma
    introduction: formal
    introduction_aliases: ["補題（時間的関係の端点安定性）"]
    requires:
      - lorentz-geometry.chronological-causal-future

  - id: lorentz-geometry.causal-push-deformation
    name: 因果曲線の未来・過去への時間的変形
    kind: lemma
    introduction: formal
    introduction_aliases: ["補題（因果曲線の未来・過去への時間的変形）"]
    requires:
      - lorentz-geometry.causal-curve
      - lorentz-geometry.timelike-relation-openness

  - id: lorentz-geometry.push-up
    name: push-up補題
    kind: theorem
    introduction: formal
    introduction_aliases: ["定理（push-up補題）"]
    requires:
      - lorentz-geometry.causal-push-deformation
      - lorentz-geometry.timelike-relation-openness

  - id: lorentz-geometry.chronological-futures-open
    name: 時間的未来・過去の開性
    kind: theorem
    introduction: formal
    introduction_aliases: ["定理（時間的未来・過去の開性）"]
    requires:
      - lorentz-geometry.timelike-relation-openness
      - lorentz-geometry.future-of-subset

  - id: lorentz-geometry.chronological-causal-interior-closure
    name: 時間的未来と因果的未来の内部・閉包
    kind: proposition
    introduction: formal
    introduction_aliases: ["命題（時間的未来と因果的未来の内部・閉包）"]
    requires:
      - lorentz-geometry.push-up
      - lorentz-geometry.chronological-futures-open

  - id: lorentz-geometry.punctured-causal-nonclosed
    name: 点除去Minkowski時空での因果的未来の非閉性
    kind: proposition
    introduction: formal
    introduction_aliases: ["命題（点除去Minkowski時空での因果的未来の非閉性）"]
    requires:
      - lorentz-geometry.chronological-causal-interior-closure
      - lorentz-geometry.minkowski-causal-future
