learning_objectives:
  - 補助Riemann計量とLorentz計量の役割を区別して弧長パラメータ化できる
  - h弧長から1-Lipschitz評価を導き局所一様収束を判定できる
  - 局所的な因果錐の閉性と時間座標の速度下界を使って極限の因果性を証明できる
  - Hopf–RinowとArzelà–Ascoliおよび対角抽出から限界曲線を構成できる
  - 限界曲線が非延長になるための完備性と単位弧長の役割を説明できる
  - 補助弧長一様有界な端点列から因果的接続を得られる
  - 点除去時空で大域Jの非閉性と長さ非有界の関係を説明できる
definitions:
  - { id: LORG14-DEF-01, name: 補助Riemann弧長パラメータ化 }
  - { id: LORG14-DEF-02, name: コンパクト部分区間上一様な収束 }
theorems:
  - { id: LORG14-LEM-01, name: 弧長から1-Lipschitz評価へ }
  - { id: LORG14-LEM-02, name: 因果曲線の局所一様極限 }
  - { id: LORG14-THM-01, name: 限界曲線補題 }
  - { id: LORG14-PROP-01, name: 補助弧長が一様有界な端点列 }
canonical_examples:
