chapter: LORG9
scope: dream-theater
coverage: complete
prerequisites:
  - LORG1
  - LORG2
  - LORG3
  - LORG4
  - LORG5
  - LORG6
  - LORG7
  - LORG8
concepts:
  - id: lorentz-geometry.chronological-spacetime
    name: chronological時空
    kind: definition
    introduction: formal
    introduction_aliases: ["定義（chronological時空）"]
    requires: [lorentz-geometry.chronological-causal-future]
  - id: lorentz-geometry.causal-spacetime
    name: causal時空
    kind: definition
    introduction: formal
    introduction_aliases: ["定義（causal時空）"]
    requires: [lorentz-geometry.chronological-causal-future]
  - id: lorentz-geometry.causal-antisymmetry-equivalence
    name: 反対称性と閉因果曲線の同値
    kind: proposition
    introduction: formal
    introduction_aliases: ["命題（反対称性と閉因果曲線の同値）"]
    requires: [lorentz-geometry.causal-spacetime]
  - id: lorentz-geometry.causal-implies-chronological
    name: causalならchronological
    kind: theorem
    introduction: formal
    introduction_aliases: ["定理（causalならchronological）"]
    requires: [lorentz-geometry.causal-spacetime, lorentz-geometry.chronological-spacetime]
  - id: lorentz-geometry.cylinder-causal-velocity
    name: 円筒模型での未来因果速度
    kind: lemma
    introduction: formal
    introduction_aliases: ["補題（円筒模型での未来因果速度）"]
    requires: [lorentz-geometry.lorentz-metric, lorentz-geometry.causal-curve]
  - id: lorentz-geometry.chronological-noncausal-cylinder
    name: chronologicalだがcausalでない円筒
    kind: proposition
    introduction: formal
    introduction_aliases: ["命題（chronologicalだがcausalでない円筒）"]
    requires: [lorentz-geometry.chronological-spacetime, lorentz-geometry.causal-spacetime, lorentz-geometry.cylinder-causal-velocity]
  - id: lorentz-geometry.distinguishing-spacetime
    name: future / past distinguishing
    kind: definition
    introduction: formal
    introduction_aliases: ["定義（future / past distinguishing）"]
    requires: [lorentz-geometry.chronological-causal-future]
  - id: lorentz-geometry.distinguishing-implies-causal
    name: 片側の識別性だけでcausalityが従う
    kind: theorem
    introduction: formal
    introduction_aliases: ["定理（片側の識別性だけでcausalityが従う）"]
    requires: [lorentz-geometry.distinguishing-spacetime, lorentz-geometry.causal-spacetime, lorentz-geometry.push-up]
  - id: lorentz-geometry.causal-nondistinguishing-cylinder
    name: causalだがdistinguishingでない時空
    kind: proposition
    introduction: formal
    introduction_aliases: ["命題（causalだがdistinguishingでない時空）"]
    requires: [lorentz-geometry.cylinder-causal-velocity, lorentz-geometry.distinguishing-spacetime, lorentz-geometry.causal-spacetime]
  - id: lorentz-geometry.initial-causal-hierarchy
    name: 因果階層の最初の三段階
    kind: theorem
    introduction: formal
    introduction_aliases: ["定理（因果階層の最初の三段階）"]
    requires: [lorentz-geometry.distinguishing-implies-causal, lorentz-geometry.causal-implies-chronological, lorentz-geometry.causal-nondistinguishing-cylinder, lorentz-geometry.chronological-noncausal-cylinder]
