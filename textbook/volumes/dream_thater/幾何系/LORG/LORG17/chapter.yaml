  - { id: LORG17-PROP-02, name: 正の時間分離と時間的到達 }
  - { id: LORG17-LEM-01, name: 小区間の局所時間分離による長さの復元 }
  - { id: LORG17-THM-02, name: 因果曲線のLorentz長さの上半連続性 }
  - { id: LORG17-LEM-02, name: 正長因果曲線の時間的折れ線近似 }
  - { id: LORG17-THM-03, name: 時間分離の下半連続性 }
  - { id: LORG17-THM-04, name: 大域双曲的時空での時間分離の有限性と連続性 }
canonical_examples:
  - Minkowskiでの時間分離の公式と光的端点の零
  - 一様収束する振動因果曲線の長さの真の上半連続性
  - 原点除去Minkowskiの有限だが達成されない時間分離
  - 時間周期商の無限大の時間分離
