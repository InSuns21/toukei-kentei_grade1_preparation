id: "LORG17"
title: "Lorentz時間分離と曲線長の極限"
volume: "foundations"
status: supplementary
prerequisites:
  - LORG1
  - LORG3
  - LORG5
  - LORG6
  - LORG7
  - LORG8
  - LORG10
