official_scope: []
learning_objectives:
  - 時間分離の定義とMinkowskiの公式を因果条件つきで導出できる
  - 時間分離の逆三角不等式と正の時間分離の特徴付けを証明できる
  - 一様収束する因果曲線の長さが上半連続である理由を局所分割から説明できる
  - 任意の滑らかな時空での時間分離の下半連続性を時間的折れ線近似で導ける
  - 大域双曲性のもとで時間分離の有限性・連続性を曲線抽出から証明できる
  - 原点除去時空の非達成例と時間周期時空の無限時間分離を区別できる
definitions:
  - { id: LORG17-DEF-01, name: Lorentz時間分離 }
  - { id: LORG17-DEF-02, name: 上半連続性と下半連続性 }
  - { id: LORG17-DEF-03, name: Lorentz長さの上半連続性 }
theorems:
