chapter: LORG17
scope: dream-theater
coverage: complete
prerequisites:
  - LORG1
  - LORG3
  - LORG5
  - LORG6
  - LORG7
  - LORG8
  - LORG10
  - LORG14
  - LORG16
concepts:
  - id: lorentz-geometry.time-separation
    name: Lorentz時間分離
    kind: definition
    introduction: formal
    introduction_aliases: ["定義（Lorentz時間分離）"]
    requires: [lorentz-geometry.lorentzian-length, lorentz-geometry.chronological-causal-future]
  - id: lorentz-geometry.minkowski-time-separation
    name: Minkowski時空の時間分離
    kind: theorem
    introduction: formal
    introduction_aliases: ["定理（Minkowski時空の時間分離）"]
    requires: [lorentz-geometry.time-separation, lorentz-geometry.minkowski-length-bound]
  - id: lorentz-geometry.time-separation-reverse-triangle
    name: 時間分離の逆三角不等式
    kind: proposition
    introduction: formal
    introduction_aliases: ["命題（時間分離の逆三角不等式）"]
    requires: [lorentz-geometry.time-separation, lorentz-geometry.length-additivity]
  - id: lorentz-geometry.positive-time-separation
    name: 正の時間分離と時間的到達
    kind: proposition
    introduction: formal
    introduction_aliases: ["命題（正の時間分離と時間的到達）"]
    requires: [lorentz-geometry.time-separation, lorentz-geometry.push-up-lemma]
  - id: lorentz-geometry.length-upper-semicontinuity
    name: 曲線長の上半連続性
    kind: definition
    introduction: formal
    introduction_aliases: ["定義（曲線長の上半連続性）"]
    requires: [lorentz-geometry.lorentzian-length, lorentz-geometry.local-uniform-convergence]
  - id: lorentz-geometry.local-length-partitions
    name: 小区間の局所時間分離による長さの復元
    kind: lemma
    introduction: formal
    introduction_aliases: ["補題（小区間の局所時間分離による長さの復元）"]
    requires: [lorentz-geometry.convex-normal-neighborhood, lorentz-geometry.timelike-local-length-max]
  - id: lorentz-geometry.causal-length-usc
    name: 因果曲線のLorentz長さの上半連続性
    kind: theorem
    introduction: formal
    introduction_aliases: ["定理（因果曲線のLorentz長さの上半連続性）"]
    requires: [lorentz-geometry.length-upper-semicontinuity, lorentz-geometry.local-length-partitions]
  - id: lorentz-geometry.timelike-polygon-approximation
    name: 正長因果曲線の時間的折れ線近似
    kind: lemma
    introduction: formal
    introduction_aliases: ["補題（正長因果曲線の時間的折れ線近似）"]
    requires: [lorentz-geometry.timelike-local-length-max, lorentz-geometry.positive-time-separation]
  - id: lorentz-geometry.time-separation-lsc
    name: 時間分離の下半連続性
    kind: theorem
    introduction: formal
    introduction_aliases: ["定理（時間分離の下半連続性）"]
    requires: [lorentz-geometry.time-separation, lorentz-geometry.timelike-polygon-approximation, lorentz-geometry.chronological-open]
  - id: lorentz-geometry.gh-time-separation-continuity
    name: 大域双曲的時空での時間分離の有限性と連続性
    kind: theorem
    introduction: formal
    introduction_aliases: ["定理（大域双曲的時空での時間分離の有限性と連続性）"]
    requires: [lorentz-geometry.global-hyperbolicity, lorentz-geometry.compact-causal-curves, lorentz-geometry.causal-length-usc, lorentz-geometry.time-separation-lsc]
