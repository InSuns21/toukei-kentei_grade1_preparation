official_scope: []
learning_objectives:
  - achronalとacausalの定義を自己到達と光的対を区別して判定できる
  - edgeの任意近傍条件と局所到達関係を用いて時刻一定集合の端を計算できる
  - 未来集合とachronal境界を定義し閉性・achronal性を証明できる
  - 境界の局所連続・Lipschitzグラフ表示の構成と傾き評価を再現できる
  - 局所グラフの中間値の定理からachronal境界のedgeが空であることを証明できる
  - 局所因果曲線のコンパクト性から境界の光的生成子と過去端点条件を導ける
  - 半直線・線分の未来境界と光的生成子を座標で計算できる
