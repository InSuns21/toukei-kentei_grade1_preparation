official_scope: []
learning_objectives:
  - 反映性を時間的未来と過去の閉包の双方向条件で定義しMinkowskiの座標で検算できる
  - 反映性と時間的未来・過去の外側連続性の同値をコンパクト集合と列で証明できる
  - 因果連続性を両側distinguishingとreflectingから定義し直接確認できる
  - 体積関数の連続性と厳密単調性を証明し時間関数を構成できる
  - 因果単純性と積空間の因果関係の閉性の同値を証明できる
  - 因果単純性から因果連続性への含意をcausalityの反対称性で証明できる
  - 一点除去Minkowskiの時間的未来と光的非到達を計算し逆含意失敗を示せる
  - 安定因果性への既習の時間関数一般定理の援用範囲を説明できる
