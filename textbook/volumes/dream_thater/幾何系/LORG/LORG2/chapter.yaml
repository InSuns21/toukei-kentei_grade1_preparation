id: "LORG2"
title: "Lorentz計量と時間向き"
volume: "foundations"
status: supplementary
prerequisites:
  - LORG1
  - GEO4
  - GEO5
  - GEO7
  - GEO8
official_scope: []
learning_objectives:
  - Lorentz計量が滑らかな非退化対称2テンソル場であることと各接空間の慣性指数を検算できる
  - 時間的・光的・空間的接ベクトルを座標表示と点ごとの計量から分類できる
  - 時間的局所ベクトル場が常に存在することを座標延長と連続性から証明できる
  - 時間向きを未来錐の局所的に滑らかな成分選択として定義し具体例で確認できる
  - 時間向き付け可能性と大域的な滑らかな時間的ベクトル場の同値性を1の分割と未来錐の凸性から証明できる
  - 大域時間的場との内積の符号から非零因果ベクトルの未来・過去を判定できる
  - Minkowskiの時間反転商と空間並進商を構成し時間向きの有無を証明できる
definitions:
  - { id: LORG2-DEF-01, name: Lorentz計量とLorentz多様体 }
