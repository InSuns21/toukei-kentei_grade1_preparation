  - { id: LORG2-THM-01, name: 時間向き付け可能性と大域時間的ベクトル場の同値性 }
  - { id: LORG2-COR-01, name: 大域時間的場による未来向きの判定 }
  - { id: LORG2-PROP-01, name: 時間反転Minkowski商の時間向き不可能性 }
canonical_examples:
