official_scope: []
learning_objectives:
  - 過去・未来非延長因果曲線の定義を時空の欠損例と照らして判定できる
  - 未来・過去依存領域の全称条件と時間的未来との違いを説明できる
  - Minkowski因果曲線の速度上界から時刻零の交点補題を証明できる
  - 任意の初期集合の依存領域公式から閉区間・開区間の違いを導出できる
  - Cauchy horizonを定義し一般時空で閉性・achronal性を証明できる
  - 有限区間のhorizonと光的生成子を座標で検算できる
  - 点除去時空による非延長曲線の変化と依存領域の欠損を説明できる
  - 非連結な初期集合の未来・過去依存領域を計算できる
definitions:
  - { id: LORG13-DEF-01, name: 過去・未来非延長な因果曲線 }
