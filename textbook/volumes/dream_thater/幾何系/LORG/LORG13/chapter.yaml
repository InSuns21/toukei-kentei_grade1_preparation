  - { id: LORG13-COR-01, name: 閉じた初期区間の依存ダイヤモンド }
  - { id: LORG13-THM-02, name: Cauchy horizonの閉性とachronal性 }
  - { id: LORG13-PROP-01, name: 有限閉区間のCauchy horizon }
  - { id: LORG13-PROP-02, name: 点除去時空の未来依存領域 }
canonical_examples:
  - Minkowski時刻零全体と空のhorizon
  - 閉区間と開区間の依存ダイヤモンド
  - 二本の光的horizon生成子
  - 点除去時空の欠損領域
