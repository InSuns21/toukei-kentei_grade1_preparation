learning_objectives:
  - 正の滑らかな共形再尺度で未来錐・因果曲線・I±・J±が不変であることを定義から証明できる
  - 共形再尺度でLorentz長さが変わる公式を導き具体曲線の固有時を積分できる
  - 因果的凸集合の量化条件と部分時空に相対的な因果的凸性を区別できる
  - Alexandrovダイヤモンドの開性と因果的凸性をpush-up補題で証明できる
  - 局所時間座標の円錐評価から相対的な小ダイヤモンドの存在を構成できる
  - 時間周期円筒で大域的な小さい因果的凸近傍がないことを曲線で検証できる
