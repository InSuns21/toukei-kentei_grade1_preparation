  - { id: LORG18-PROP-01, name: 最大化曲線の部分曲線 }
  - { id: LORG18-PROP-02, name: 最大化曲線の測地線規則性 }
  - { id: LORG18-PROP-03, name: 平坦円筒の非最大測地線 }
canonical_examples:
  - Minkowskiでの直線と折れ線の長さ比較
  - 大域双曲性から最大曲線を抽出する構成
  - 平坦円筒の巻き付きと共役点不在
  - 有限時刻帯での最大化と測地不完備の共存
  - 原点除去時空で有限上限が達成されない例
