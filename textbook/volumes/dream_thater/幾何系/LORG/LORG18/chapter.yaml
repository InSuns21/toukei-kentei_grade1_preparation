id: "LORG18"
title: "最大化因果曲線とAvez–Seifert"
volume: "foundations"
status: supplementary
prerequisites:
  - LORG3
  - LORG4
  - LORG5
  - LORG6
  - LORG8
  - LORG14
  - LORG16
  - LORG17
  - GEO17
official_scope: []
learning_objectives:
  - 最大化因果曲線の定義を因果性・時間分離の有限性・長さの等号で判定できる
  - 大域双曲性・限界曲線・長さの上半連続性を接続してAvez–Seifert定理を証明できる
  - 最大化曲線の部分曲線が最大であることを置換論法で示せる
  - 最大化曲線の局所測地線規則性と時間的・光的の区別を説明できる
  - 指数写像の微分から共役点を定義し、最大性・測地完備性と区別できる
  - 点除去時空と平坦円筒で最大性を失う異なる原因を診断できる
definitions:
  - { id: LORG18-DEF-01, name: 最大化因果曲線 }
  - { id: LORG18-DEF-02, name: 測地線に沿う共役点 }
