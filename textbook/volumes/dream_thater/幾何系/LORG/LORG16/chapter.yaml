id: "LORG16"
title: "大域双曲性の特徴付け"
volume: "foundations"
status: supplementary
prerequisites:
  - LORG3
  - LORG6
  - LORG7
  - LORG9
  - LORG10
  - LORG12
  - LORG13
  - LORG14
  - LORG15
