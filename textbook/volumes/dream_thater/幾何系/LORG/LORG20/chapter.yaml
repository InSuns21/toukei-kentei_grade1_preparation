learning_objectives:
  - Cauchy temporal functionの二条件を勾配と非延長曲線上の値域から判定できる
  - 時間的勾配に直交する時刻レベルが滑らかで空間的なCauchy面になることを証明できる
  - Bernal–Sánchezの存在定理とtemporal stepの外部構成の証明境界を説明できる
  - 局所有限な段差関数の合成がtemporal性とCauchy性を保つことを検算できる
  - 完全時間的な流れと陰関数定理から滑らかな直交分割を構成できる
  - g=-βdT²+h_Tのlapse・正規化法線・誘導計量を導出できる
  - 時間再目盛りと点除去の反例から必要仮定の破綻を説明できる
