id: "LORG1"
title: "Lorentz内積と未来錐"
volume: "foundations"
status: supplementary
prerequisites:
  - LA6
official_scope: []
learning_objectives:
  - Lorentz内積の慣性指数と標準形をSylvesterの慣性法則から説明できる
  - 時間的・光的・空間的ベクトルと未来錐をMinkowski座標で判定できる
  - 閉未来錐の閉性・内部・凸性を座標ノルムから証明できる
  - 逆Cauchy–Schwarz不等式と等号条件を完全証明できる
  - 逆三角不等式と未来向き折れ線の固有時を比較できる
  - 時間的ベクトルの直交補が正定値であることを慣性法則から証明できる
  - Lorentz変換の計量保存と未来向き保存の違いを説明できる
