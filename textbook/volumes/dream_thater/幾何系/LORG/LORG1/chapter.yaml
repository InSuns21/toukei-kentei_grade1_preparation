  - { id: LORG1-DEF-02, name: Lorentz因果型 }
  - { id: LORG1-DEF-03, name: 閉未来錐と時間的未来錐 }
  - { id: LORG1-DEF-04, name: 未来因果ベクトルの固有時ノルム }
theorems:
