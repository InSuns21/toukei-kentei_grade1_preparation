  - { id: LORG1-THM-01, name: Lorentz型逆Cauchy–Schwarz不等式 }
  - { id: LORG1-COR-01, name: 未来錐上の逆三角不等式 }
  - { id: LORG1-LEM-01, name: 時間的ベクトルの直交補空間は正定値 }
canonical_examples:
  - 不定値形式のMinkowski座標への変換
  - 因果型の分類と未来錐の直接判定
  - 光的二方向の和が時間的になる例
  - 双曲角による逆Cauchy–Schwarzの検算
  - 時間的ベクトルの直交補空間と時間反転
