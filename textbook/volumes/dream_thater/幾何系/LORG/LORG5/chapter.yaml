  - { id: LORG5-LEM-01, name: 時間的測地線に沿うGaussian正規座標 }
  - { id: LORG5-THM-03, name: 時間的測地線の局所Lorentz長さ最大化 }
  - { id: LORG5-PROP-02, name: 平坦Lorentz円筒での非最大時間的測地線 }
canonical_examples:
  - Minkowskiでの正規座標と放射光円錐の直接計算
  - Minkowski開球でのLorentz凸正規近傍
  - Gaussian座標における固有時の積分上界と等号条件
  - 膨張計量での時間的測地線の最大化
  - 平坦Lorentz円筒の巻き付き時間的測地線
