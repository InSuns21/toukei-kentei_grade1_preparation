id: "LORG5"
title: "凸正規近傍と局所最大化"
volume: "foundations"
status: supplementary
prerequisites:
  - LORG1
  - LORG2
  - LORG3
  - LORG4
  - GEO14
official_scope: []
learning_objectives:
  - Lorentz正規座標と放射測地線を定義し基点での計量・接続係数と光円錐を導ける
  - 端点指数写像の逆と補助Euclid半径の凸性から凸正規近傍の局所存在を証明できる
  - Gaussの補題を捩率零と計量両立性から導出できる
  - 時間的測地線に沿うGaussian正規座標の計量分解を導出できる
  - 未来向き因果曲線のLorentz長さを座標時刻で評価し時間的測地線の局所最大化と等号条件を示せる
  - Lorentz円筒で局所最大化と大域非最大化が両立することを計算できる
  - 放射光円錐の分類と大域因果関係の判定を区別できる
