      - lorentz-geometry.lorentzian-length
      - lorentz-geometry.reparametrization-invariance

  - id: lorentz-geometry.flat-cylinder-nonmax-geodesic
    name: 平坦Lorentz円筒での非最大時間的測地線
    kind: proposition
    introduction: formal
    introduction_aliases: ["命題（平坦Lorentz円筒での非最大時間的測地線）"]
