official_scope: []
learning_objectives:
  - Cauchy超曲面を両側非延長因果曲線との一意交差で定義できる
  - Cauchy条件からacausal性とachronal性を説明し導出できる
  - causal時空でacausal条件とD(S)=MからCauchy面を特徴付けられる
  - Minkowski非延長因果曲線の時刻全域通過を証明できる
  - 一様Lipschitz定数が1未満のグラフについてCauchy条件を証明できる
  - 有限区間・点除去・光的グラフ・滑らかな双曲線の失敗を判定できる
  - 一般のCauchy面と滑らかな空間的超曲面を区別できる
