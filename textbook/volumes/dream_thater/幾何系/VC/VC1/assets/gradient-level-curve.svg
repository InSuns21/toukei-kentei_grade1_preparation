<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 310" width="440" height="310" data-layout-lint="strict">
  <title>レベル曲線と勾配・接方向</title>
  <desc>平面の円形レベル曲線 f=25 上の点 p=(3,4) において、勾配は半径方向、接方向は円の接線方向を指し、直交する。</desc>
  <defs>
    <marker id="vc1-arrow-grad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#175d9d"/></marker>
    <marker id="vc1-arrow-tangent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a34b12"/></marker>
  </defs>
  <rect x="0" y="0" width="440" height="310" fill="#fff"/>
  <circle cx="225" cy="188" r="100" stroke="#485666" stroke-width="2.5" fill="none"/>
  <line x1="225" y1="188" x2="285" y2="108" stroke="#8793a0" stroke-width="2" stroke-dasharray="5 5"/>
  <line data-series-group="directions" data-series-label="gradient" x1="285" y1="108" x2="327" y2="52" stroke="#175d9d" stroke-width="3.5" marker-end="url(#vc1-arrow-grad)"/>
  <line data-series-group="directions" data-series-label="tangent" x1="285" y1="108" x2="237" y2="72" stroke="#a34b12" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#vc1-arrow-tangent)"/>
  <circle cx="225" cy="188" r="3.5" fill="#485666"/>
  <circle cx="285" cy="108" r="4" fill="#242a30"/>
  <text x="210" y="218" font-size="18" fill="#303a46">O</text>
  <text x="273" y="159" font-size="19" fill="#303a46">p</text>
  <text x="340" y="52" font-size="19" fill="#175d9d">grad f</text>
  <text x="197" y="56" font-size="19" fill="#a34b12">v</text>
  <text x="106" y="70" font-size="19" fill="#485666">f = 25</text>
</svg>
