id: "SYZ1-09"
title: "Hessian計量とLegendre双対"
volume: "foundations"
status: supplementary
prerequisites:
  - SYZ1-08
official_scope: []
learning_objectives:
  - 追加仮定としての滑らかなSLagトーラス束と位相・規格化の条件を確認できる
  - 法線変形のHodge内積から基底の正定値L2計量を構成できる
  - Poincaré双対な周期サイクルの向きと積分対合を計算できる
  - 周期積分による計量の座標表示とJacobianの対称性を証明できる
  - 閉1形式からHessianポテンシャルを積分し正定値性を検算できる
  - Legendre双対の逆写像と双対Hessianの逆行列公式を途中式から導ける
  - 双対サイクルの逆転置遷移と計量の座標不変性を証明できる
  - 異方的平坦SLagトーラスで二種類の座標とポテンシャルを完全に計算できる
  - 局所Hessian構造と大域SLag束の存在を論理的に区別できる
definitions:
  - { id: SYZ1-09-DEF-01, name: "SLag変形の積分計量" }
  - { id: SYZ1-09-DEF-02, name: "Hessian計量" }
