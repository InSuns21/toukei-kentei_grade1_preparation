  - { id: SYZ1-09-THM-01, name: "SLag基底のHessian計量" }
  - { id: SYZ1-09-THM-02, name: "Legendre座標の逆変換と双対Hessian" }
  - { id: SYZ1-09-PROP-01, name: "双対周期座標とポテンシャルの遷移" }
canonical_examples:
  - 標準平坦二次元トーラスでのL2計量と向きの検算
  - 二次元双対サイクルの向きと積分対合
  - 正定値な二次HessianポテンシャルとLegendre双対
  - 異方的平坦SLagトーラスでの計量と双対ポテンシャル
