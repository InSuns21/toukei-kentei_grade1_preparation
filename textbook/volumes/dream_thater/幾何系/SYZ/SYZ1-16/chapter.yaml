id: "SYZ1-16"
title: "インスタントン補正と座標の貼り合わせ"
volume: "foundations"
status: supplementary
prerequisites:
  - SYZ1-15
  - SYZ1-10
  - COMB9
official_scope: []
learning_objectives:
  - 向き付きトーラスの交点数とホロノミー文字から仮定付き壁越え変換の指数・逆写像を導ける
  - 局所壁関数の零点を除いて補正付き複素チャートを双正則に貼り合わせ対数2形式の保存を証明できる
  - 経路整合性の条件を定式化し二壁横断の順序交換で三次の障害を計算できる
  - 形式冪級数による初次の散乱補正を構成して三次までの整合性・可逆性を再計算できる
  - Maslov指数0の壁関数とMaslov指数2のsuperpotentialを区別し関数の座標変換を導ける
  - 円板の存在・重み・計数の論理的差と局所模型から一般の鏡像再構成に必要な追加入力を説明できる
definitions:
  - { id: SYZ1-16-DEF-01, name: "壁越えの文字変換" }
  - { id: SYZ1-16-DEF-02, name: "単一壁の補正付き複素チャート" }
  - { id: SYZ1-16-DEF-03, name: "座標遷移の経路整合性" }
  - { id: SYZ1-16-DEF-04, name: "Maslov指数2の局所superpotential" }
theorems:
  - { id: SYZ1-16-PROP-01, name: "文字の積法則と逆壁越え" }
  - { id: SYZ1-16-PROP-02, name: "単一壁の正則貼り合わせと対数2形式" }
  - { id: SYZ1-16-PROP-03, name: "三次までの散乱補正" }
  - { id: SYZ1-16-PROP-04, name: "superpotentialの座標変換" }
canonical_examples:
  - 境界クラスの交点数による冪とLaurent文字変換の計算
  - q=1/4の補正付き座標と零点除外
  - 二つの壁変換の非可換性と三次の障害
  - 形式冪級数の三次散乱補正と対数2形式
  - 指数2の二項ポテンシャルの座標間引き戻し
problem_patterns:
