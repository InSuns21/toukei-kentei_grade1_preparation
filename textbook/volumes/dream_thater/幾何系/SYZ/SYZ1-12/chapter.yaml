id: "SYZ1-12"
title: "楕円曲線の完全計算"
volume: "foundations"
status: supplementary
prerequisites:
  - SYZ1-11
official_scope: []
learning_objectives:
  - 楕円曲線の複素格子と平坦Kähler形式を周期1座標から導き面積を検算できる
  - 円周ファイバーの位相0のSLag条件・較正・長さ・直交基底長を直接検証できる
  - 収縮の符号とH0の周期の意味を区別して二つのアフィン周期を計算できる
  - ホロノミー文字とB場の貼り合わせから双対曲線の複素周期を計算できる
  - 平坦円周T双対の規格化の下で複素・複素化Kählerパラメータ交換を証明できる
  - McLean由来Hessian計量と逆半径規格化による定数倍の違いを説明できる
  - 二重双対の行列計算を完遂し特異ファイバーへの無条件な一般化を避けられる
definitions:
  - { id: SYZ1-12-DEF-01, name: "規格化した楕円曲線の幾何データ" }
  - { id: SYZ1-12-DEF-02, name: "B場でねじった双対楕円曲線" }
  - { id: SYZ1-12-DEF-03, name: "平坦円周の双対計量・2形式の規則" }
theorems:
  - { id: SYZ1-12-PROP-01, name: "複素周期とシンプレクティック面積の分離" }
  - { id: SYZ1-12-THM-01, name: "楕円曲線の滑らかなSLag円周束" }
  - { id: SYZ1-12-PROP-02, name: "円周束の二つのアフィン周期" }
  - { id: SYZ1-12-THM-02, name: "双対楕円曲線の複素周期" }
  - { id: SYZ1-12-THM-03, name: "平坦楕円曲線の複素・Kählerパラメータ交換" }
  - { id: SYZ1-12-PROP-03, name: "平坦模型の二重双対" }
canonical_examples:
  - 傾いた楕円曲線の正定値計量と面積
  - 位相0のSLag円周と直交水平ベクトル
  - シンプレクティック・正則体積形式の二つの周期
  - B場の位相ずれと双対複素格子
  - 非直交計量のBuscher型双対と二重双対
problem_patterns:
