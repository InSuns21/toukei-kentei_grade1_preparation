id: "SYZ1-03"
title: "較正形式と体積最小性"
volume: "foundations"
status: supplementary
prerequisites:
  - SYZ1-02
  - CYG1-04
  - SYM6
  - GEO8
official_scope: []
learning_objectives:
  - 正規直交接枠によるcomassを計算し、向きと較正の等号条件を具体的な平面で判定できる
  - 較正の閉性とcomass不等式を分離し、同一ホモロジー類での体積最小性をStokesの定理から証明できる
  - 閉性・向き・同じホモロジー類のいずれかを落としたとき証明が壊れる箇所を具体例で指摘できる
  - 較正から停留性・安定性が導かれる理由と、厳密安定性の非帰結を区別できる
  - 複素行列式のHadamard不等式の等号条件とLagrange接平面との同値性を実内積・Hermitian内積から導ける
  - 平坦な特殊Lagrange較正で位相・向きの等号を検算し、Lagrangeグラフの具体例と比較できる
definitions:
  - { id: SYZ1-03-DEF-01, name: "comass" }
  - { id: SYZ1-03-DEF-02, name: "較正形式と較正部分多様体" }
theorems:
  - { id: SYZ1-03-THM-01, name: "較正された部分多様体の体積最小性" }
  - { id: SYZ1-03-PROP-01, name: "較正と変分の関係" }
  - { id: SYZ1-03-LEM-01, name: "複素行列式の不等式とLagrange等号条件" }
  - { id: SYZ1-03-THM-02, name: "平坦空間での特殊Lagrange較正" }
canonical_examples:
  - dx外積のcomassと水平平面・逆向きの較正判定
  - 平坦二次元トーラスの斜め閉路と体積下界
  - 非閉形式を用いた円筒計量の同一ホモロジー類での反例
  - 球面の赤道と平坦トーラスの平行移動による変分の違い
  - 複素行列式の非Lagrange平面と回転した較正平面
  - 二次ポテンシャルのLagrangeグラフと特殊Lagrangeグラフの比較
