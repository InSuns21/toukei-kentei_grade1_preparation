id: "SYZ1-10"
title: "semi-flat鏡像I――双対トーラスと複素構造"
volume: "foundations"
status: supplementary
prerequisites:
  - SYZ1-09
official_scope: []
learning_objectives:
  - 滑らかなSLagトーラス束という追加仮定と周期格子の選択を明示できる
  - シンプレクティック周期余接格子の整数双対接格子を定義から計算できる
  - 双対接トーラスと平坦U(1)ホロノミー文字の同型を核・全射・基底変更から証明できる
  - 接束の整数格子商と局所複素チャートの関係を直接説明できる
  - 虚部の周期1を踏まえ指数複素座標とその逆を構成できる
  - 整数アフィン遷移の下で複素構造と三重の貼り合わせを証明できる
  - Laurent単項式遷移とその正則な逆を計算できる
  - 余接トーラスと双対接トーラスの逆転置・正変換を区別できる
  - 平坦異方的トーラスの双対複素周期を全て計算できる
  - 非単模遷移が格子商上で失敗する機構と計量構成への停止線を説明できる
definitions:
  - { id: SYZ1-10-DEF-01, name: "シンプレクティック周期の双対接格子" }
  - { id: SYZ1-10-DEF-02, name: "semi-flat双対トーラスの複素チャート" }
theorems:
