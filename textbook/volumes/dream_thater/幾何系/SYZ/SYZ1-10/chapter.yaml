  - { id: SYZ1-10-THM-01, name: "semi-flat双対トーラスの複素構造と貼り合わせ" }
  - { id: SYZ1-10-PROP-02, name: "指数複素座標のLaurent単項式遷移" }
  - { id: SYZ1-10-PROP-03, name: "余接トーラスと双対接トーラスの遷移" }
canonical_examples:
  - 非直交整数基底の双対格子と定義条件の検証
  - 円環の指数座標と逆写像
  - 二次元せん断の正則遷移と逆
  - 非単模変換での商写像の非可逆性
  - 異方的平坦SLagトーラスの双対複素周期
