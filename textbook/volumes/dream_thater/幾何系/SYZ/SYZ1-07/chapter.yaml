  - { id: SYZ1-07-DEF-03, name: "周期格子から定まる作用座標" }
  - { id: SYZ1-07-DEF-04, name: "周期1の角変数" }
theorems:
  - { id: SYZ1-07-PROP-01, name: "Hamilton流によるトーラスの表示" }
  - { id: SYZ1-07-LEM-01, name: "周期1形式の閉性" }
  - { id: SYZ1-07-PROP-02, name: "周期からの作用座標の構成" }
  - { id: SYZ1-07-THM-01, name: "滑らかなLagrangeトーラス束の局所作用・角座標" }
  - { id: SYZ1-07-PROP-03, name: "SLagトーラス束から局所変形空間への写像" }
canonical_examples:
  - 平坦複素トーラスの水平SLagファイバーと位相0の全条件確認
  - 変速円周の時間周期と周期余接格子
  - 非Lagrange切断の閉2形式を角変数のずれで除去する具体計算
  - 平坦SLagトーラスでのHamilton符号と作用座標
  - 変速2トーラスの局所作用角標準形とSLag存在主張の停止線
