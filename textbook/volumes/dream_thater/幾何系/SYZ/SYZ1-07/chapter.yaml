id: "SYZ1-07"
title: "局所トーラス・ファイブレーションと作用・角変数"
volume: "foundations"
status: supplementary
prerequisites:
  - SYZ1-06
  - SYM6
official_scope: []
learning_objectives:
  - McLean局所変形空間と追加仮定としての滑らかなSLagトーラス束を区別できる
  - 正則値集合と局所積表示、ファイバーのLagrange性と実次元を確認できる
  - 基底関数のHamilton場がファイバー接空間を張り可換な全時間流を作ることを証明できる
  - 流れの安定化群が全格子となりファイバーをR^n/格子と同定できる
  - 時間周期を余接格子へ移し周期1形式の閉性を時間1恒等流から証明できる
  - 周期1形式を積分して作用座標を構成しGL(n,Z)による基底変更を計算できる
  - 角変数と局所切断から2形式の余分な基底項を計算し角のシフトで標準形に直せる
  - McLeanの1形式と作用微分の周期積分の符号を検算し局所moduliへの微分同相を説明できる
  - SLag性とLagrange性の差、大域束の存在と局所標準化の差を反例や失敗条件で判定できる
definitions:
  - { id: SYZ1-07-DEF-01, name: "滑らかなSLagトーラス・ファイブレーション" }
