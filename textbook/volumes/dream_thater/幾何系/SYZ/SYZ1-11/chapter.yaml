id: "SYZ1-11"
title: "semi-flat鏡像II――Kähler形式・計量・接続"
volume: "foundations"
status: supplementary
prerequisites:
  - SYZ1-10
official_scope: []
learning_objectives:
  - 正定値Hessianと前講の複素チャートからsemi-flat Kähler計量と形式を構成できる
  - Hessianの三階微分の対称性からKähler形式の閉性とポテンシャル係数を導ける
  - 整数アフィン遷移による計量・Kähler形式の貼り合わせを中間行列で証明できる
  - 正則体積形式の向き条件と遷移行列式の符号を判定できる
  - Ricci形式を求めRicci平坦性と実Monge–Ampère定数行列式条件を区別できる
  - Levi-Civita接続と整数アフィン平坦接続の違いを具体的な係数から説明できる
  - 平坦U(1)接続の符号・曲率・ホロノミー・整数ゲージ同値を計算できる
  - B場の2サイクル位相とU(1)接続の1サイクルホロノミーを区別できる
  - 滑らかなsemi-flat計量の追加仮定と特異性・補正の未包含範囲を説明できる
