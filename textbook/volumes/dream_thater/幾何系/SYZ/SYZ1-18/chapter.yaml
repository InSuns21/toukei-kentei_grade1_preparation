id: "SYZ1-18"
title: "滑らかな定理から一般予想への証明地図・総合演習"
volume: "foundations"
status: supplementary
prerequisites:
  - SYZ1-17
official_scope: []
learning_objectives:
  - 較正による体積最小性とMcLean変形理論の仮定・主要中間式・結論を再導出できる
  - McLeanの局所moduliと大域SLagトーラス束の追加存在仮定を論理的に区別できる
  - 二重整数アフィン周期からHessian・Legendre双対・semi-flat複素及びKähler構造を手計算できる
  - 節点モノドロミーの接格子・余接格子への作用と滑らかな延長障害を証明できる
  - 指定した壁関数の形式的な貼り合わせを次数2まで検算し幾何的円板計数との区別を説明できる
  - Gross–Siebert型の代数的再構成の追加条件と一般的SYZ予想の証明上の停止線を分類できる
