  - { id: SYZ1-18-PROP-03, name: "非自明な周回が示す延長障害" }
  - { id: SYZ1-18-PROP-04, name: "二壁の二次不整合と条件付き補正" }
canonical_examples:
  - McLeanの局所変形と大域ファイブレーションの論理的差
