id: "DEF1-11"
title: "Calabi–Yauの局所モジュライ"
volume: "foundations"
status: supplementary
prerequisites:
  - DEF1-01
  - DEF1-04
  - DEF1-08
  - DEF1-10
  - CYG1-12
  - HOD1-07
  - RA6A
learning_objectives:
  - 非消滅正則体積形式によるH¹(X,T_X)とH^{n-1,1}(X)の対応を局所座標計算で説明できる
  - BTTの非障害性とKuranishi半普遍性から滑らかな局所変形座標とその次元を導ける
  - 体積形式の定数倍・Hodge基底変更が一次座標に与える変換則を検算できる
  - H⁰(X,T_X)とH^{n-1,0}(X)を結び、標識付き普遍性の十分条件を説明できる
  - 標識付き局所変形空間と標識を忘れた同型類の商を区別し、有限群商の特異性を例で検証できる
theorems:
  - { id: DEF1-11-DEF-01, name: "標識付き局所変形座標" }
  - { id: DEF1-11-THM-01, name: "Calabi–Yauの滑らかな局所変形座標" }
  - { id: DEF1-11-PROP-01, name: "体積形式とHodge基底による一次座標変換" }
  - { id: DEF1-11-PROP-02, name: "Hodge数と無限小自己同型" }
  - { id: DEF1-11-COR-01, name: "局所剛性の判定" }
canonical_examples:
  - 複素二次元トーラスの四つのBeltrami方向と収縮符号
  - 楕円曲線の周期パラメータの非自明な同型類同一視
  - 二変数符号反転の商で生じる二次錐特異点
problem_patterns:
  - DEF1-11-CONTRACTION-COORDINATES
  - DEF1-11-TORUS-DIMENSION
  - DEF1-11-VOLUME-SCALING
  - DEF1-11-RIGIDITY
  - DEF1-11-ELLIPTIC-IDENTIFICATION
  - DEF1-11-SMOOTH-CHART
  - DEF1-11-AUTOMORPHISM-CRITERION
  - DEF1-11-FINITE-QUOTIENT
  - DEF1-11-BASIS-TRANSITION
  - DEF1-11-CAPSTONE
