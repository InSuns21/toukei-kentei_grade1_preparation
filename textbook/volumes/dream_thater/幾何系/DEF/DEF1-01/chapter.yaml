id: "DEF1-01"
title: "変形族からKodaira–Spencer写像をどう作るか"
volume: "foundations"
status: supplementary
prerequisites:
  - CM1-02
  - CM1-03
  - CM1-05
  - CM2-03
  - CM2-04
  - AG3-07
  - CYG1-12
official_scope: []
learning_objectives:
  - 固有正則沈め込みによる複素多様体の族を定義し、滑らかなEhresmann局所自明化と正則積表示を区別できる
  - パラメータ方向の局所正則持ち上げからČechコサイクルを構成し、符号・閉条件・持ち上げ選択独立性を証明できる
  - 分割1を用いてČech類を接束値Dolbeault類へ送り、閉性・完全類の判定を出発点から説明できる
  - 楕円曲線の実際の正則族でBeltramiの一次係数と非零Kodaira–Spencer類を計算できる
  - 基底変更の微分公式を証明し、ある一点で一次写像が零でも族全体の自明性を意味しないと判定できる
theorems:
  - { id: DEF1-01-DEF-01, name: "コンパクト複素多様体の正則変形族" }
  - { id: DEF1-01-THM-01, name: "固有沈め込みの滑らかな局所自明化" }
  - { id: DEF1-01-DEF-02, name: "Kodaira–Spencer写像" }
  - { id: DEF1-01-PROP-01, name: "Čech類の閉性と選択独立性" }
  - { id: DEF1-01-THM-02, name: "Kodaira–Spencer類のČech–Dolbeault対応" }
  - { id: DEF1-01-PROP-02, name: "Kodaira–Spencer写像の基底変更" }
canonical_examples:
  - 積の族の固有正則沈め込みと零Kodaira–Spencer類
  - 遷移座標z_j=z_i+t z_i^2での持ち上げと符号
  - 楕円曲線族E_tauのBeltrami微分と非零の周期積分
  - 非固有沈め込みでファイバーの基本群が変わる例
  - 基底変更tau=i+s^2で一点の一次類が零になる例
problem_patterns:
  - DEF1-01-CHART-DERIVATIVE-SIGN
  - DEF1-01-CECH-COCYCLE
  - DEF1-01-LIFT-GAUGE
  - DEF1-01-ELLIPTIC-BELTRAMI
  - DEF1-01-TRIVIAL-FAMILY
  - DEF1-01-NONPROPER-FAILURE
  - DEF1-01-CECH-DOLBEAULT-BRIDGE
  - DEF1-01-BASE-CHANGE-ZERO
  - DEF1-01-ELLIPTIC-CAPSTONE
