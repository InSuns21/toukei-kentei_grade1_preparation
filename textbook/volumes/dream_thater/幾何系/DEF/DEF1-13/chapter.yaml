id: "DEF1-13"
title: "Hodge構造の変動と周期写像"
volume: "foundations"
status: supplementary
prerequisites:
  - DEF1-01
  - DEF1-12
  - HOD1-15
  - HOD1-16
  - CM2-05
learning_objectives:
  - 固有正則沈め込みのKählerファイバーにHodgeフィルトレーションを置き、Gauss–Manin接続の平坦枠と区別できる
  - 相対正則de Rham複体と解析的基底変更を使ってHodge束の正則性を説明できる
  - 局所平坦自明化から周期写像を構成し、モノドロミーに対する変換を導ける
  - 相対形式の持ち上げを局所計算してGriffiths横断性を証明できる
  - Kodaira–Spencer類の収縮として周期写像の微分を記述できる
  - 楕円曲線の周期と偏極の正値性を計算し、仮定の役割を説明できる
theorems:
  - { id: DEF1-13-DEF-01, name: "Kähler族のHodgeフィルトレーション束" }
  - { id: DEF1-13-THM-01, name: "Hodgeフィルトレーションの正則変動" }
  - { id: DEF1-13-DEF-02, name: "周期写像" }
  - { id: DEF1-13-THM-02, name: "Griffiths横断性" }
  - { id: DEF1-13-PROP-01, name: "周期写像の微分とKodaira–Spencer収縮" }
  - { id: DEF1-13-PROP-02, name: "楕円曲線族の周期写像" }
canonical_examples:
  - 積Kähler族の一定のHodgeフィルトレーション
  - 楕円曲線E_tauのF^1と周期座標tau
  - 楕円曲線の偏極と上半平面
problem_patterns:
  - DEF1-13-FILTRATION-RANK
  - DEF1-13-CONSTANT-FAMILY
  - DEF1-13-ELLIPTIC-HOLOMORPHIC-LINE
  - DEF1-13-TRANSVERSALITY-BOUNDARY
  - DEF1-13-RAMIFIED-BASE-CHANGE
  - DEF1-13-GAUGE-PERIOD-CHART
  - DEF1-13-MONODROMY
  - DEF1-13-POLARIZATION
  - DEF1-13-KOD-SPENCER-PAIRING
  - DEF1-13-PRODUCT-ELLIPTIC-CAPSTONE
