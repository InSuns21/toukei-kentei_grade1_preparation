id: "DEF1-05"
title: "二次以上の障害類"
volume: "foundations"
status: supplementary
prerequisites:
  - DEF1-04
learning_objectives:
  - 二次障害類をH^2(X,T_X)に定義し、括弧の閉性と一次代表変更に対する不変性を証明できる
  - 二次障害が零であることと二次補正の存在の必要十分性を証明できる
  - Bianchi恒等式から全高次障害形式の閉性と次数別延長判定を導ける
  - 高次障害の低次選択への依存性とH^2=0の形式的十分性を区別できる
  - 複素二次元トーラスでH^2非零と無障害な一次方向が両立することを積分・括弧で検算できる
  - 形式的解と解析的に収束する実際の変形を区別できる
theorems:
  - { id: DEF1-05-LEM-01, name: "接束値Dolbeault複体の括弧恒等式" }
  - { id: DEF1-05-DEF-01, name: "二次障害類" }
  - { id: DEF1-05-THM-01, name: "二次延長の必要十分条件と代表独立性" }
  - { id: DEF1-05-DEF-02, name: "高次障害形式と障害類" }
  - { id: DEF1-05-LEM-02, name: "Maurer–Cartan曲率のBianchi恒等式" }
  - { id: DEF1-05-THM-02, name: "高次障害の閉性と延長判定" }
canonical_examples:
  - 複素平面上の非零括弧がDolbeault完全になる二次補正
  - 二次元複素トーラスのH^2非零性と定数係数Beltrami微分の無障害性
  - 非零の二次障害を持つ純代数的次数付きLie模型
problem_patterns:
  - DEF1-05-ORDER-EXPANSION
  - DEF1-05-FIRST-CLOSEDNESS
  - DEF1-05-QUADRATIC-SCALING
  - DEF1-05-FOURTH-ORDER
  - DEF1-05-REPRESENTATIVE-INVARIANCE
  - DEF1-05-HIGHER-CHOICE
  - DEF1-05-TORUS-NONEXACT
  - DEF1-05-ALGEBRAIC-OBSTRUCTED-MODEL
  - DEF1-05-CAPSTONE
past_exam_alignment: []
integrated_exam_problems: []
exercise_counts: { level_a: 4, level_b: 4, level_c: 1, level_d: 0 }
estimated_hours: { reading: 7, exercises: 8, review: 4 }
