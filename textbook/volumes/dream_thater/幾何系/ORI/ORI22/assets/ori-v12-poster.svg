<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc" data-layout-lint="strict">
<title id="title">ORI-V12 円パッキングの必要制約</title>
<desc id="desc">半径0.60と0.45の円板は中心距離d≥1.05で内部非交差、d=1.05で接する。 中心距離d=1.850、半径和1.05、差d−1.05=0.800。離れている（内部非交差）。 tree method全構成の実装ではない。</desc>
<rect x="2" y="2" width="756" height="426" rx="12" fill="#f8fbfd" stroke="#8ca3b3"/>
<text x="26" y="43" font-size="20" font-weight="700" font-family="system-ui,sans-serif" fill="#243c4f">ORI-V12　中心距離で円板の重なりを判定</text>
<text x="27" y="78" font-size="17" font-family="system-ui,sans-serif" fill="#243c4f">半径 r₁=0.60（実線）、r₂=0.45（破線）は固定</text>
<line x1="200" y1="126" x2="484.90" y2="126" stroke="#475f71" stroke-width="1.8"/>
<line x1="200" y1="119" x2="200" y2="133" stroke="#475f71" stroke-width="1.8"/>
<line x1="484.90" y1="119" x2="484.90" y2="133" stroke="#475f71" stroke-width="1.8"/>
<text x="342.45" y="110" text-anchor="middle" font-size="17" font-family="system-ui,sans-serif" fill="#243c4f">d=1.85</text>
<circle cx="200" cy="230" r="92.40" fill="#d3e9f4" fill-opacity=".48" stroke="#185b82" stroke-width="3"/>
<circle cx="484.90" cy="230" r="69.30" fill="#f7deb6" fill-opacity=".48" stroke="#a35227" stroke-width="3" stroke-dasharray="9 5"/>
<line x1="200" y1="230" x2="484.90" y2="230" stroke="#496375" stroke-width="1.7" stroke-dasharray="4 5"/>
<circle cx="200" cy="230" r="5" fill="#173044"/>
<circle cx="484.90" cy="230" r="5" fill="#173044"/>
<text x="142" y="210" font-size="17" font-family="system-ui,sans-serif" fill="#173044">r₁</text>
<text x="509.90" y="210" font-size="17" font-family="system-ui,sans-serif" fill="#173044">r₂</text>
<text x="194" y="347" font-size="17" font-family="system-ui,sans-serif" fill="#243c4f">A</text>
<text x="478.90" y="347" font-size="17" font-family="system-ui,sans-serif" fill="#243c4f">B</text>
<text x="27" y="395" font-size="17" font-family="system-ui,sans-serif" fill="#243c4f">d−1.05=0.80</text>
<text x="420" y="395" font-size="17" font-weight="700" font-family="system-ui,sans-serif" fill="#243c4f">非重複：条件成立</text>
</svg>
