<title id="title">ORI-V05 O5の折り線候補</title>
<desc id="desc">円x²+y²=4と目標直線y=hの交点が像の候補。 目標y=0.000、円と直線の交点2個、折り線2本。 特定のO5座標配置の例。</desc>
