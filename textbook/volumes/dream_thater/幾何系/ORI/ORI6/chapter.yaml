id: ORI6
title: "Huzita–Justin公理O1〜O4"
volume: foundations
status: supplementary
prerequisites: [ORI5]
official_scope: []
learning_objectives:
  - 一折りの条件を鏡映の点・直線の一致条件として読み、O1〜O4の違いを説明できる
  - O1・O2の折り線を求め、二点が一致する場合の非一意性を証明できる
  - O3の交差・平行・一致の各場合について折り線の本数と方程式を証明できる
  - O4の垂線を射影によって構成し、点が直線上にある場合を含め一意性を証明できる
  - 与えられた点・直線から一折りで得られる条件と、有限紙で実現できる範囲を区別できる
definitions:
  - { id: ORI6-DEF-01, name: 一折りの許容折り線 }
  - { id: ORI6-DEF-02, name: 直線への符号付き距離 }
