  - { id: ORI6-AXIOM-03, name: Huzita–Justin公理O3 }
  - { id: ORI6-THM-01, name: O3の解の分類 }
  - { id: ORI6-AXIOM-04, name: Huzita–Justin公理O4 }
  - { id: ORI6-PROP-03, name: O4の存在と一意性 }
  - { id: ORI6-THM-02, name: O1〜O4の解の本数 }
canonical_examples:
  - O1の異なる二点と一致する二点、O2の中点と垂直二等分線
  - O3の座標軸の二等分線と異なる平行線の中央線
  - O3の一致直線を保つ無数の鏡映軸
  - O4の斜めの直線と直線上にある点からの垂線
