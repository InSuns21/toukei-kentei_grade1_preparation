<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc" data-layout-lint="strict">
<title id="title">ORI-V03 等分位置と面積帯</title>
<desc id="desc">辺長2の正方形をn帯に分けると面積は各4/n。 8等分。幅2/n=0.2500、各面積4/n=0.5000、合計面積4。 折り順の実現可能性は別問題。</desc>
