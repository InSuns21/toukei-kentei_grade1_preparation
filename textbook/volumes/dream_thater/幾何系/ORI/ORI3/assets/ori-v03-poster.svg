<title id="title">ORI-V03 等分位置と面積帯</title>
<desc id="desc">辺長2の正方形をn帯に分けると面積は各4/n。 7等分。幅2/n=0.2857、各面積4/n=0.5714、合計面積4。 折り順の実現可能性は別問題。</desc>
