<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc" data-layout-lint="strict">
<title id="title">ORI-V10 層順と循環</title>
<desc id="desc">A&gt;B,B&gt;C,C&gt;Aは循環して不可能。 上→下の制約：A&gt;B, B&gt;C, A&gt;C。現時点では非循環。必要条件のみ。 非循環だけでは平坦折りは保証されない。</desc>
