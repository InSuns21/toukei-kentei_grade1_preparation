<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 385" data-layout-lint="strict" role="img" aria-labelledby="miura-title miura-desc">
  <title id="miura-title">Miura格子の未折時と折り上げ時の上面投影</title>
  <desc id="miura-desc">左はa=2、b=1、鋭角60度、t=0の2行2列の平行四辺形格子。右は同じ格子をt=1/2まで折った上面投影。両方とも2行ごとに斜辺が左右交互に傾く。右の横周期Aは左のaより短く、2行分の縦周期2Hも短い。これは立体配置の平面投影で、各頂点の高さは本文の式で指定する。</desc>
  <defs>
    <marker id="miura-arrow" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0 L7 3.5 L0 7 Z" fill="#344054"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1120" height="385" rx="12" fill="#fff"/>
  <text x="78" y="47" font-family="sans-serif" font-size="22" fill="#182230">t = 0</text>
  <text x="657" y="47" font-family="sans-serif" font-size="22" fill="#182230">t = 1/2</text>
  <g fill="#d6e8f8" fill-opacity="0.6" stroke="none">
    <polygon points="80,100 280,100 330,186.6 130,186.6"/>
    <polygon points="280,100 480,100 530,186.6 330,186.6"/>
    <polygon points="130,186.6 330,186.6 280,273.2 80,273.2"/>
    <polygon points="330,186.6 530,186.6 480,273.2 280,273.2"/>
  </g>
  <g fill="#bce5db" fill-opacity="0.65" stroke="none">
    <polygon points="660,100 833.2,100 890.9,181.6 717.7,181.6"/>
    <polygon points="833.2,100 1006.4,100 1064.1,181.6 890.9,181.6"/>
    <polygon points="717.7,181.6 890.9,181.6 833.2,263.3 660,263.3"/>
    <polygon points="890.9,181.6 1064.1,181.6 1006.4,263.3 833.2,263.3"/>
  </g>
  <g stroke="#253858" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80 100 H480 M130 186.6 H530 M80 273.2 H480"/>
    <path d="M80 100 L130 186.6 L80 273.2 M280 100 L330 186.6 L280 273.2 M480 100 L530 186.6 L480 273.2"/>
    <path d="M660 100 H1006.4 M717.7 181.6 H1064.1 M660 263.3 H1006.4"/>
    <path d="M660 100 L717.7 181.6 L660 263.3 M833.2 100 L890.9 181.6 L833.2 263.3 M1006.4 100 L1064.1 181.6 L1006.4 263.3"/>
  </g>
  <g fill="#253858">
    <circle cx="80" cy="100" r="4"/><circle cx="280" cy="100" r="4"/><circle cx="480" cy="100" r="4"/>
    <circle cx="130" cy="186.6" r="4"/><circle cx="330" cy="186.6" r="4"/><circle cx="530" cy="186.6" r="4"/>
    <circle cx="80" cy="273.2" r="4"/><circle cx="280" cy="273.2" r="4"/><circle cx="480" cy="273.2" r="4"/>
    <circle cx="660" cy="100" r="4"/><circle cx="833.2" cy="100" r="4"/><circle cx="1006.4" cy="100" r="4"/>
    <circle cx="717.7" cy="181.6" r="4"/><circle cx="890.9" cy="181.6" r="4"/><circle cx="1064.1" cy="181.6" r="4"/>
    <circle cx="660" cy="263.3" r="4"/><circle cx="833.2" cy="263.3" r="4"/><circle cx="1006.4" cy="263.3" r="4"/>
  </g>
  <g stroke="#344054" stroke-width="1.7" fill="none" marker-start="url(#miura-arrow)" marker-end="url(#miura-arrow)">
    <path d="M85 321 H275"/>
    <path d="M665 321 H828.2"/>
    <path d="M65 105 V268.2"/>
    <path d="M632 105 V258.3"/>
  </g>
  <g font-family="sans-serif" font-size="18" fill="#182230">
    <text x="169" y="350">a</text>
    <text x="743" y="350">A</text>
    <text x="8" y="195">2bs</text>
    <text x="598" y="195">2H</text>
  </g>
</svg>
