id: ORI14
title: "Kawasaki–Justinの定理"
volume: foundations
status: supplementary
prerequisites: [ORI13]
official_scope: []
learning_objectives:
  - 単頂点の正の扇形角を巡回順に定義し、零角・二本の逆向き半直線・境界頂点を区別できる
  - 作動折り目を渡る相対鏡映から交互角歩行を導き、Kawasaki–Justin条件の必要性を証明できる
  - 角の合計360度と交互角和0が奇数・偶数角和180度ずつと同値であることを計算できる
  - 偶数番目の最小途中和から始点を選び、半平面内の重なり構成により十分性を説明できる
  - 四折り線と六・八折り線の角度例を検算し、退化角を含む入力を誤判定しない
  - 山谷指定・複数頂点・連続的折り運動には十分性を拡張できない理由を説明できる
definitions:
  - { id: ORI14-DEF-01, name: 山谷未指定の単頂点局所平坦折り可能性 }
theorems:
  - { id: ORI14-PROP-01, name: 扇形像の交互角歩行 }
  - { id: ORI14-THM-01, name: Kawasaki–Justinの定理 }
  - { id: ORI14-LEM-01, name: 偶数番目の最小和から始める }
  - { id: ORI14-COR-01, name: 四本の折り目の判定 }
canonical_examples:
  - 一本の直線を二本の逆向き半直線として数え、二角180度ずつを確認する
  - 六扇形の交互和を巡回移動し、負の途中和を全て非負へ変える
  - 四折り線の成立例と一周の合計のみが成立する不成立例を比較する
  - 八扇形の最小開始位置、像の角度区間、層順と接続を一括構成する
problem_patterns:
  - ORI14-FOUR-SECTOR-ALTERNATING-SUM
  - ORI14-SUM-360-COUNTEREXAMPLE
  - ORI14-UNKNOWN-ANGLE
  - ORI14-CYCLIC-START
  - ORI14-TWO-RAY-AND-ZERO-ANGLE
  - ORI14-STRICT-ANGLE-BOUND
  - ORI14-ANGULAR-WALK
  - ORI14-MINIMUM-SHIFT
  - ORI14-ANGLE-PERTURBATION
  - ORI14-EIGHT-RAY-CONSTRUCTION
