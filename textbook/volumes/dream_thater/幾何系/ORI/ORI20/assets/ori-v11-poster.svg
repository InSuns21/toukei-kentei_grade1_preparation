<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc" data-layout-lint="strict">
<title id="title">ORI-V11 対称二線分のfold-and-one-cut</title>
<desc id="desc">x=0で右面を折り返すとx=+1はx=−1に重なる。 折り角=180.0°。終端ではx=+1とx=−1が一致。 一般多角形のfold-and-one-cut定理とは区別する。</desc>
