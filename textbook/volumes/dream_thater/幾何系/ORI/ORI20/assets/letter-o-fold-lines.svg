<svg xmlns="http://www.w3.org/2000/svg" width="760" height="320" viewBox="0 0 760 320" role="img" aria-labelledby="title desc" data-layout-lint="strict">
  <title id="title">文字Oを一刀切りするための二本の輪郭の位置合わせ</title>
  <desc id="desc">左では第一象限の菱形の内側、折り線、外側の三本の平行線をそれぞれ実線、一点鎖線、破線で示す。右では外側の線を中間の線で反射すると、内側の短い線分と同じ切断直線上へ重なる様子を示す。座標の単位は a=1、b=3、m=2 に対応する。</desc>
