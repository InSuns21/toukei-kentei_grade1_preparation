<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc" data-layout-lint="strict">
<title id="title">ORI-V07 三等分と立方根</title>
<desc id="desc">x=2cos(α/3)はx³−3x=2cosα。立方根m³=rはO6で作れる。 α=150.00°、φ=α/3=50.00°。三倍角式一致。 恒等式とO6拘束の照合であり描画だけで一般構成を証明しない。</desc>
