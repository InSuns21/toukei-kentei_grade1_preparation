<title id="title">ORI-V02 点合わせと正方形</title>
<desc id="desc">点P=(0,2)をQ=(s,0)へ映す折り線はPQの垂直二等分線。 PからQ=(1.550,0)へ鏡映。中点M=(0.775,1)、鏡映先一致。 物理的な折り途中の表示ではない。</desc>
