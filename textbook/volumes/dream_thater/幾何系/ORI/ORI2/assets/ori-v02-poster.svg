<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc" data-layout-lint="strict">
<title id="title">ORI-V02 芳賀折りの三等分と辺長比</title>
<desc id="desc">正方形の右下角P=(2,0)を上辺Q=(u,2)へ映す。折った下辺の像と左辺の交点は高さ2u/(4-u)。 上辺の移動先u=1.000、折られた下辺と左辺の交点I=(0,0.66667)。左辺の下からの比=0.33333 = 1/3。 この点合わせの配置例であり、全ての芳賀折りの一般定理の証明ではない。</desc>
