<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc" data-layout-lint="strict">
<title id="title">ORI-V09 Maekawaの山谷本数差</title>
<desc id="desc">作動する4折り目で|山の数−谷の数|=2が必要。 山M=3本、谷V=1本、差|M−V|=2：必要条件成立。 必要条件であり十分条件ではない。</desc>
