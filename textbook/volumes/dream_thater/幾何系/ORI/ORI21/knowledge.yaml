    introduction: formal
    requires: [origami.one-cut-pattern]

  - id: origami.convex-wavefront-offset
    name: 凸多角形の等速移動
    kind: proposition
    introduction: formal
    requires: [origami.inward-offset-wavefront]

  - id: origami.straight-skeleton
    name: 直線骨格
    kind: definition
    introduction: formal
    requires: [origami.inward-offset-wavefront]

  - id: origami.wavefront-angle-bisector
    name: 二辺の波面交点は角二等分線上にある
