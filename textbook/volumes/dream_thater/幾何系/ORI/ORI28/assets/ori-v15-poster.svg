<title id="title">ORI-V15 円柱の母線と局所等長</title>
<desc id="desc">X(u,v)=(Rcos(u/R),Rsin(u/R),v)はE=G=1,F=0。 u=1.200、E=G=1、F=0。母線はv方向。 円柱の可展性モデルで曲線折り線の実物運動全体ではない。</desc>
