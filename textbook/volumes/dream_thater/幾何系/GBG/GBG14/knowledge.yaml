    kind: definition
    introduction: formal
    introduction_aliases: ["定義（曲線の水平リフト）"]
    requires: [gauge.principal-connection-form, gauge.horizontal-lift-splitting]

  - id: gauge.horizontal-lift-existence
    name: 水平リフトの存在・一意性
    kind: theorem
    introduction: formal
