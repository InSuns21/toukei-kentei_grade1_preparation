  - id: gauge.principal-parallel-transport
    name: 主束の平行移動
    kind: definition
    introduction: formal
    introduction_aliases: ["定義（主束の平行移動）"]
    requires: [gauge.horizontal-lift-existence]

  - id: gauge.parallel-transport-path-laws
    name: 平行移動の同変性・合成・逆路
    kind: theorem
    introduction: formal
    requires: [gauge.principal-parallel-transport, gauge.principal-connection-form]

  - id: gauge.local-transport-gauge-transformation
    name: 局所輸送行列とsection変更
    kind: proposition
    introduction: formal
