id: "GBG3"
title: "なぜゲージ選択は局所sectionの選択か"
volume: "foundations"
status: supplementary
prerequisites:
  - GBG2
official_scope: []
learning_objectives:
  - 局所sectionと大域sectionを定義し積主束の例で滑らかさと射影を確認できる
  - 局所sectionと同変自明化の両方向の構成と滑らかさを証明できる
  - 局所section変更から群座標と遷移関数の変換則を導き非可換な積の順序を守れる
  - 変換後のcocycle条件を検証できる
  - 大域sectionの存在と自明性の同値を両方向に証明できる
  - 遷移関数が局所関数で消去可能なことと自明性の同値を証明しHopf束・枠束で局所表示を計算できる
definitions:
  - { id: GBG3-DEF-01, name: 主束の局所sectionと大域section }
  - { id: GBG3-DEF-02, name: 局所sectionの変更関数 }
theorems:
  - { id: GBG3-THM-01, name: 局所sectionと同変自明化の対応 }
  - { id: GBG3-THM-02, name: 局所section変更による遷移関数の変換則 }
  - { id: GBG3-THM-03, name: 大域sectionと自明性の同値 }
  - { id: GBG3-PROP-01, name: 遷移関数による自明性の判定 }
canonical_examples:
  - 積主束の可変基準sectionと群座標
  - GL(2,R)による非可換な局所section変更
  - Hopf主U(1)束の局所section
  - 枠束の座標基底の変更
problem_patterns:
