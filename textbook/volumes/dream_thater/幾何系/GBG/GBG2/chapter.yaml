  - { id: GBG2-PROP-02, name: 局所自明化の間の変換 }
  - { id: GBG2-THM-01, name: 同じ基底の同変写像は同型 }
  - { id: GBG2-THM-02, name: Hopf主U(1)束 }
  - { id: GBG2-THM-03, name: 枠束の主束構造 }
canonical_examples:
  - M×Gの積主束と非可換行列群の右作用
  - Hopf主U(1)束S3→S2の二枚の局所自明化
  - 接束の枠束Fr(M)と可逆行列右作用
  - 非恒等cocycleによる自明主束
  - t→t³と自明群による局所自明化欠落の反例
