    requires: [gauge.flat-monodromy-representation, gauge.holonomy-subgroup, gauge.holonomy-base-change]

  - id: gauge.flat-circle-u1-holonomy
    name: 円周上の平坦接続によるホロノミー
    kind: proposition
    introduction: formal
    requires: [gauge.flat-principal-connection, gauge.flat-monodromy-representation, gauge.local-transport-gauge-transformation, complex-analysis.winding-number]

  - id: gauge.flat-simply-connected-parallel
    name: 単連結な基底上の平坦接続の大域平行 section
    kind: theorem
    introduction: formal
    requires: [gauge.flat-homotopy-invariance, gauge.flat-local-parallel-section, gauge.parallel-transport-path-laws, topology.simply-connected, gauge.global-section-triviality]
