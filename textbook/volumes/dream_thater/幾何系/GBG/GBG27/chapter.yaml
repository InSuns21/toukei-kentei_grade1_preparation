  - { id: GBG27-PROP-02, name: 曲率の直交分解 }
  - { id: GBG27-THM-01, name: Yang–Mills作用の位相的下界 }
  - { id: GBG27-THM-02, name: Yang–Mills作用の第一変分と方程式 }
  - { id: GBG27-THM-03, name: 自己双対・反自己双対接続はYang–Mills接続 }
canonical_examples:
  - Euclid4空間の正規直交2形式に対するHodge星の全基底での符号検査
  - 可換なSU(2)対角接続での自己双対曲率と反自己双対曲率
  - 基本表現の跡を用いた正の作用密度の直接検算
  - S4クラッチング次数プラス1とマイナス1での最小作用と双対符号
  - 向き反転と境界付き領域での作用・Chern数・境界項
