id: "GBG27"
title: "自己双対性はYang–Mills作用に何を与えるか"
volume: "foundations"
status: supplementary
prerequisites:
  - GBG26
  - GBG12
  - GBG11
  - GEO8
official_scope: []
learning_objectives:
  - 向き付きRiemann 4多様体の2形式についてHodge星を内積と体積形式から定義し基底で検算できる
  - 星の二乗が1になる理由とLorentz計量との違いを説明できる
  - SU(2)曲率を自己双対・反自己双対成分に直交分解し局所接続で検算できる
  - 反Hermite基本表現の正の跡内積からYang–Mills作用を正規化できる
  - 前講の第二Chern数の符号で作用を平方完成し8π²|k|下界と等号条件を導ける
  - S4クラッチングで正のkが反自己双対・負のkが自己双対に対応することを示せる
  - 接続の一次変分からd_A*F=0を境界項込みで導ける
  - Bianchi恒等式から自己双対接続がYang–Mills方程式を満たすと証明できる
  - 向き反転・境界条件・非コンパクト有限作用性・作用係数の条件を区別できる
definitions:
  - { id: GBG27-DEF-01, name: 4次元の2形式に作用するHodge星 }
  - { id: GBG27-DEF-02, name: 自己双対・反自己双対曲率 }
  - { id: GBG27-DEF-03, name: 4次元Riemann計量によるYang–Mills作用 }
theorems:
