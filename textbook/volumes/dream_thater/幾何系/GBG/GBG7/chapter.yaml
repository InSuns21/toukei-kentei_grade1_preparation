  - { id: GBG7-THM-03, name: 水平分布と接続1形式の一対一対応 }
  - { id: GBG7-PROP-01, name: 一点上の主束とMaurer–Cartan形式 }
  - { id: GBG7-PROP-02, name: 積主束における接続1形式の具体式 }
canonical_examples:
  - GL(n,R)積主束の標準接続と基本ベクトル・右同変性・核
  - 一点上の主G束におけるMaurer–Cartan形式の一意性
  - 任意の積主束の水平グラフとLie環値1形式bの対応
  - GL(2,R)で随伴項を落とした形式の右同変性違反
  - 再生条件を落として形式を2倍した例
