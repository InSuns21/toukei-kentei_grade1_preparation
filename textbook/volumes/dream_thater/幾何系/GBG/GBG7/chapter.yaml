id: "GBG7"
title: "水平分布とLie環値接続1形式はなぜ同値か"
volume: "foundations"
status: supplementary
prerequisites:
  - GBG6
official_scope: []
learning_objectives:
  - Lie環値1形式の線形性と滑らかさを既習定義から確認し、主束接続1形式の再生条件と右同変条件を独立に検算できる
  - 垂直射影と基本ベクトル場の同型から接続形式を構成し、滑らかさ・再生・右同変性・核・一意性を証明できる
  - 接続形式の核から水平分布を構成し、直和分解・滑らかな一定階数部分束・右作用同変性を証明できる
  - 双方向構成が互いに逆であることを中間式から証明できる
  - 左Maurer–Cartan形式が一点上の主束の唯一の接続形式であることを確認できる
  - 積主束で一般の接続形式と水平グラフの対応を計算し、右乗法と左乗法の向きを区別できる
  - 非可換行列の反例で右同変条件と再生条件を別々に失った場合の破綻を説明できる
definitions:
  - { id: GBG7-DEF-01, name: 主束の接続1形式 }
