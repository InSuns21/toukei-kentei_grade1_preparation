  - { id: GBG8-PROP-01, name: 局所変換則の合成 }
  - { id: GBG8-THM-02, name: 局所ポテンシャルからの大域接続の再構成 }
  - { id: GBG8-PROP-02, name: ゲージ自己同型による接続の引き戻し }
canonical_examples:
  - GL(2,R)積束で接続のsection引き戻しを直接計算
  - U(1)の位相関数から非斉次項を計算
  - SU(2)の対角ゲージ変換で共役と微分項を明示
  - 二つの局所自明化からの大域接続再構成
problem_patterns:
