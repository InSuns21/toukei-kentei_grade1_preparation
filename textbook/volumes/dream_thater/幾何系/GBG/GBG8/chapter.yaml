id: "GBG8"
title: "局所ゲージポテンシャルはどう変換するか"
volume: "foundations"
status: supplementary
prerequisites:
  - GBG7
official_scope: []
learning_objectives:
  - 主束上の大域接続と基底上の局所ポテンシャルを区別し、引き戻しの定義と直接例を説明できる
  - section変更の接ベクトルを右移動部分と基本ベクトル場部分へ分解して非斉次変換則を導出できる
  - U(1)とSU(2)の具体例で共役項とMaurer–Cartan項をそれぞれ計算できる
  - 変換の合成を積の微分と随伴作用から検算し三重重なりでの整合性を説明できる
  - 重なり条件を満たす局所ポテンシャルから大域接続を構成し存在・一意性を証明できる
  - 局所sectionの表示変更とゲージ自己同型による接続の引き戻しを区別できる
definitions:
  - { id: GBG8-DEF-01, name: 局所ゲージポテンシャル }
theorems:
