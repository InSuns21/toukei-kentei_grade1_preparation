id: "GBG13"
title: "ゲージ軌道とゲージ固定はどこが異なるか"
volume: "foundations"
status: supplementary
prerequisites:
  - GBG12
  - GBG10
  - GBG5
official_scope: []
learning_objectives:
  - ゲージ群の接続への右作用を引き戻しの合成順序を含めて証明し局所変換式を検算できる
  - 接続空間・ゲージ軌道・軌道集合・安定化群を定義し軌道と剰余類の対応を証明できる
  - 右作用規約で無限小ゲージ変換 delta A=d_A epsilon と曲率の変化を導出できる
  - 安定化群の無限小条件 d_A epsilon=0 を必要十分に説明できる
  - 区間上の U(1) 接続を基点付きゲージ変換で一意に零へ直せることを示せる
  - 円周上の U(1) 接続の軌道が実数の整数差で分類されることを積分で証明できる
  - 安定化群とゲージ固定条件を保つ残余変換を区別し一般の大域一意固定を仮定しない
definitions:
  - { id: GBG13-DEF-01, name: ゲージ軌道・ゲージ同値・軌道集合 }
  - { id: GBG13-DEF-02, name: 接続の安定化群 }
  - { id: GBG13-DEF-03, name: ゲージ固定条件と残余ゲージ変換 }
theorems:
  - { id: GBG13-THM-01, name: ゲージ群による接続への右作用 }
  - { id: GBG13-PROP-01, name: 安定化群は部分群、軌道は剰余類に対応する }
  - { id: GBG13-THM-02, name: 接続と曲率の無限小ゲージ変換 }
  - { id: GBG13-PROP-02, name: 安定化群の無限小条件 }
  - { id: GBG13-THM-03, name: 区間上の U(1) 接続の基点付きゲージ固定 }
  - { id: GBG13-THM-04, name: 円周上の U(1) 接続の軌道分類 }
canonical_examples:
  - U(1) のゲージ同値な二接続と曲率が異なる二接続
  - U(1) の定数ゲージ変換が作る安定化群
  - GL(2,R) の非可換な無限小変換と曲率の共役変化
  - 連結区間上の基点付き一意ゲージ固定
  - 円周上の定数係数接続と整数巻き数の残余変換
problem_patterns:
