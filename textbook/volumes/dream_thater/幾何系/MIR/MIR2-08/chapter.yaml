  - MIR2-08-EXPONENTIAL-INTEGRATION
  - MIR2-08-QUADRATIC-SHIFT
  - MIR2-08-NONCLOSED-COUNTEREXAMPLE
  - MIR2-08-SYMPLECTIC-SHEAR
  - MIR2-08-QUINTIC-COEFFICIENTS
  - MIR2-08-LOG-SHIFT
  - MIR2-08-INTEGRATED-CAPSTONE
