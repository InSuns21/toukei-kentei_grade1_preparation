id: "MIR1-08"
title: "Gauss–Manin接続・Hodge構造の変動"
volume: "foundations"
status: supplementary
prerequisites:
  - MIR1-07
  - DEF1-13
learning_objectives:
  - Dworkの滑らかな固有族の条件と平行サイクルを示しGauss–Manin周期微分を導ける
  - 留数周期の任意階の微分の極次数と係数を積分交換の条件とともに検算できる
  - 重さ3のHodgeフィルトレーションの各階数とGriffiths横断性の適用範囲を説明できる
  - 元のquinticの第3コホモロジー204次元とG不変部分4次元を区別できる
  - 有限ランクの切断の線形従属から有理型係数の周期微分方程式を構成できる
  - ψ座標とz座標の導関数の関係および形式の再規格化の必要性を計算できる
theorems:
  - { id: MIR1-08-PROP-01, name: "Dwork族の周期とGauss–Manin微分" }
  - { id: MIR1-08-PROP-02, name: "Dwork周期の高次パラメータ微分" }
  - { id: MIR1-08-PROP-03, name: "Dwork族のGriffiths横断性" }
  - { id: MIR1-08-PROP-04, name: "有限ランク接続からの周期微分方程式" }
  - { id: MIR1-08-PROP-05, name: "z座標への周期微分の変換" }
canonical_examples:
  - 積族の平行周期とGauss–Manin微分の一致
  - 一階・二階・三階の極係数5・50・750
  - 楕円曲線の周期1とτでHodge型が動くことの検証
  - quinticのHodge階数204とG不変部分4の区別
  - 群同一視でのψωψの変換とz微分
problem_patterns:
  - MIR1-08-PARALLEL-CYCLES
  - MIR1-08-POLE-DERIVATIVES
  - MIR1-08-HODGE-FILTRATION-RANKS
  - MIR1-08-COORDINATE-CHAIN-RULE
  - MIR1-08-ELLIPTIC-VARIATION
  - MIR1-08-INVARIANT-RANK
  - MIR1-08-RESCALING
  - MIR1-08-MEROMORPHIC-ODE
  - MIR1-08-INTEGRATED-CAPSTONE
past_exam_alignment: []
integrated_exam_problems: []
exercise_counts: { level_a: 4, level_b: 4, level_c: 1, level_d: 0 }
estimated_hours: { reading: 8, exercises: 10, review: 5 }
