id: "MIR2-16"
title: "低次数の照合と論理の総決算"
volume: "foundations"
status: supplementary
prerequisites:
  - MIR2-15
  - MIR2-14
  - MIR2-13
learning_objectives:
  - quinticのYukawa級数の係数a_m、無標点GW数N_m、被覆補正済み数n_dを区別して約数の式から導ける
  - 二次のa_2と三次のa_3を入力にしてN_1,N_2,N_3とn_1,n_2,n_3を正確に計算し逆代入で照合できる
  - 円錐曲線のパラメータ空間の次元11、五次式の剰余束の階数11と零点条件を説明できる
  - twisted cubicの次元16と五次式の制限条件16を具体的な三次埋め込みから導ける
  - KatzおよびEllingsrud–Strømmeの独立な低次数列挙結果とミラー定理の計算結果を証明範囲を混同せず照合できる
  - 特殊・特異・非横断の曲線や一般次数・高種数に単純な曲線本数解釈を拡張できない理由を示せる
  - MIR1の周期・鏡像座標とMIR2の仮想GW計数・I/J・局所化・被覆補正の依存の鎖を順番に説明できる
definitions: []
theorems:
  - { id: MIR2-16-PROP-01, name: "係数を約数ごとに分ける" }
  - { id: MIR2-16-PROP-02, name: "低次数GW数と整数型数値の復元" }
  - { id: MIR2-16-PROP-03, name: "円錐曲線の11条件" }
  - { id: MIR2-16-PROP-04, name: "twisted cubicの16条件" }
  - { id: MIR2-16-THM-01, name: "quinticの低次数における数値照合" }
canonical_examples:
  - 任意のn1とn2の形式模型から次数2の被覆寄与を分ける
  - a2=4876875とa3=8564575000からN2,N3とn2,n3を両方向に検算する
  - 非退化二次形式Q=x0x2-x1^2と可除な五次式Fを用いて円錐曲線の零点条件を確かめる
  - 三次埋め込みへ具体的な五次式を代入して16条件を確認する
  - 特殊な可約五次式で横断的な有限本数の仮定が破れることを示す
problem_patterns:
  - MIR2-16-DIVISOR-COEFFICIENT
  - MIR2-16-GW-RATIONAL-VALUES
  - MIR2-16-TRIPLE-COVER
  - MIR2-16-CONIC-RANK
  - MIR2-16-TWISTED-CUBIC-RANK
  - MIR2-16-INVERT-DEGREE-THREE
  - MIR2-16-LAMBERT-DERIVATIVE
  - MIR2-16-CONIC-ZERO-CONDITION
  - MIR2-16-DEGREE-FOUR-MULTICOVER
  - MIR2-16-FINAL-SYNTHESIS
past_exam_alignment: []
integrated_exam_problems: []
exercise_counts: { level_a: 5, level_b: 4, level_c: 1, level_d: 0 }
estimated_hours: { reading: 8, exercises: 10, review: 5 }
