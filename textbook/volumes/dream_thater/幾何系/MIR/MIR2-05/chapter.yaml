id: "MIR2-05"
title: "種数0ポテンシャルとA側Yukawa結合"
volume: "foundations"
status: supplementary
prerequisites:
  - MIR2-03
  - MIR2-04
learning_objectives:
  - 非凸quinticの仮想GW公理を入力として扱い、次数0の安定性と正次数の無標点数を区別できる
  - 因子方向の種数0ポテンシャルを定義し古典三次項と曲線寄与を係数から再構成できる
  - 反復因子公理から指数級数を導き、形式冪級数の微分に解析的収束が不要な理由を説明できる
  - Qを固定した三階微分からA側Yukawa結合と三点関数を導出できる
  - Poincaréペアリングによって大きい量子積とA側三次結合を照合できる
  - 三階微分の核が二次以下の多項式であることを証明しGW母関数の規格化との差を説明できる
  - QとtとQe^tを区別し、B側の周期・整数型曲線数との同一視に必要な未証明入力を特定できる
definitions:
  - { id: MIR2-05-DEF-01, name: "因子方向の種数0ポテンシャル" }
  - { id: MIR2-05-DEF-02, name: "quinticのA側Yukawa結合" }
theorems:
  - { id: MIR2-05-PROP-01, name: "種数0ポテンシャルの指数表示" }
  - { id: MIR2-05-PROP-02, name: "A側三次結合と三点関数" }
  - { id: MIR2-05-PROP-03, name: "量子積とのPoincaréペアリング" }
  - { id: MIR2-05-PROP-04, name: "三階微分の核と低次多項式の不定性" }
canonical_examples:
  - 次数0の三標点のみが非零で5t^3/6を作ることの確認
  - 次数2の反復因子挿入で指数級数と三階微分を検算
  - Q^2t^2の係数をポテンシャルと量子積の両方から照合
  - Yukawaは不変だがGW母関数ではない低次多項式の例
problem_patterns:
  - MIR2-05-DEGREE-ZERO-STABILITY
  - MIR2-05-DIVISOR-EXPONENTIAL
  - MIR2-05-CLASSICAL-TRIPLE-DERIVATIVE
  - MIR2-05-FORMAL-VARIABLES
  - MIR2-05-LOW-DEGREE-AMBIGUITY
  - MIR2-05-DIVISOR-AXIOM-PROOF
  - MIR2-05-PAIRING
  - MIR2-05-POTENTIAL-RECONSTRUCTION
  - MIR2-05-CHANGE-OF-VARIABLES
  - MIR2-05-INTEGRATED-CAPSTONE
