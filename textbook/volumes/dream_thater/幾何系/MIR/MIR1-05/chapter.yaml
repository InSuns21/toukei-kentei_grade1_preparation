id: "MIR1-05"
title: "特異点・crepant解消・鏡像のHodge数"
volume: "foundations"
status: supplementary
prerequisites:
  - MIR1-04
  - CYG1-13
learning_objectives:
  - 解消・例外因子・crepant性を定義し通常の三次元吹き上げがcrepantでないことを検算できる
  - 商の10本の特異曲線と10個の交点を支え・軌道から数えられる
  - A4型横断面の局所解消から曲線上の例外因子40を計算できる
  - ageを定義し支え2の局所群の境界12と内部6を重複なしに数えられる
  - 固定五次曲線の群商が射影直線となり不変一次形式が零になることを証明できる
  - FermatのJacobian商から群不変な複素構造方向が一つであることを検算できる
  - 外部定理の適用条件と局所計算の範囲を区別してHodge数101と1およびEuler標数200を導ける
theorems:
  - { id: MIR1-05-DEF-01, name: "crepant解消と例外因子" }
  - { id: MIR1-05-PROP-01, name: "10本の特異曲線と40の曲線上寄与" }
  - { id: MIR1-05-DEF-02, name: "ageと高さ1の群元" }
  - { id: MIR1-05-PROP-02, name: "支え2の各商点に固有な6つの高さ1成分" }
  - { id: MIR1-05-THM-01, name: "このquintic商のcrepant解消とorbifold Hodge対応（外部定理）" }
  - { id: MIR1-05-PROP-03, name: "固定五次曲線の商は射影直線" }
  - { id: MIR1-05-PROP-04, name: "Greene–Plesser型crepant解消のHodge数" }
canonical_examples:
  - 三次元原点の吹き上げでJacobianがtの二乗になりcrepantでないこと
  - A4の4つのage1法方向とcrepant半直線の格子行列式
  - 支え2の局所群でage1の境界12・内部6を整数解で列挙
  - Fermat五次の不変Jacobian商方向x0x1x2x3x4
problem_patterns:
  - MIR1-05-SINGULAR-LOCUS-INCIDENCE
  - MIR1-05-A4-RAYS
  - MIR1-05-AGE-CHECK
  - MIR1-05-BLOWUP-DISCREPANCY
  - MIR1-05-CURVE-QUOTIENT
  - MIR1-05-INVARIANT-JACOBIAN
  - MIR1-05-JUNIOR-SIMPLEX
  - MIR1-05-CAPSTONE
past_exam_alignment: []
integrated_exam_problems: []
exercise_counts: { level_a: 4, level_b: 3, level_c: 1, level_d: 0 }
estimated_hours: { reading: 7, exercises: 9, review: 5 }
