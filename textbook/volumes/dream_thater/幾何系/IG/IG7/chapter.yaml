  - { id: IG7-PROP-01, name: 三次テンソルの座標変換 }
  - { id: IG7-THM-02, name: α-接続の存在・捩率零・双対性 }
  - { id: IG7-THM-03, name: KL の三階微分と e/m 双対接続 }
canonical_examples:
  - Bernoulli の三次 score と p/logit における α-接続
  - Bernoulli KL の二種類の三階微分と引数反転
  - 正規位置尺度族の三次テンソルおよび e/m/Levi-Civita 係数
  - 非零捩率を持つ計量両立接続と Levi-Civita の区別
