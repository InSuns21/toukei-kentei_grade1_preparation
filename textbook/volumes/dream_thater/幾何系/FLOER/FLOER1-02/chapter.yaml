id: "FLOER1-02"
title: "stripの端と作用・エネルギー"
volume: "foundations"
status: supplementary
prerequisites:
  - FLOER1-01
  - SYM6
  - SYM8
  - GW1-02
  - GEO8
  - GA2
official_scope: []
learning_objectives:
  - 有限エネルギーと収束端の条件を区別し小さい横断曲線を選べる
  - 完全境界の作用を構成し第一変分と作用差の符号を導ける
  - 非定数stripのエネルギーを作用差で計算できる
  - 一般の境界の相対面積と非零の作用周期を説明できる
  - 漸近作用素の定義域と自己共役性および横断性による可逆性を証明できる
  - 平面モデルの固有値と減衰方向を計算できる
