  - { id: FLOER1-02-DEF-03, name: "完全Lagrange境界と作用汎関数" }
  - { id: FLOER1-02-DEF-04, name: "交点の漸近作用素" }
theorems:
  - { id: FLOER1-02-PROP-01, name: "有限エネルギーstripの小さい横断曲線" }
  - { id: FLOER1-02-PROP-02, name: "完全Lagrange境界での作用の第一変分" }
  - { id: FLOER1-02-THM-01, name: "完全境界での作用差とエネルギー" }
  - { id: FLOER1-02-PROP-03, name: "境界を保つ変形の面積と作用の周期" }
  - { id: FLOER1-02-THM-02, name: "漸近作用素の対称性と横断性" }
canonical_examples:
  - 有限帯の指数関数と無限帯での発散
  - 半円stripの作用差と面積
  - 円周を動く境界の非零周期
  - 二直線の漸近作用素の固有値と逆
