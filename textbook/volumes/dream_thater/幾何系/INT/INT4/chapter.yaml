id: "INT4"
title: "近可積分Hamilton系と小分母"
volume: "foundations"
status: supplementary
prerequisites:
  - INT1
  - INT2
  - INT3
  - SYM4
  - FOU1
  - FOU2
official_scope: []
learning_objectives:
  - 作用角変数上の近可積分Hamilton系を定義してHamilton方程式を導出できる
  - Fourier係数と角度平均から一次ホモロジー方程式を作れる
  - 有限Fourier和の非共鳴解と共鳴による可解性障害を証明できる
  - 無理数振動数に小分母が存在することを鳩の巣原理で証明できる
  - Diophantine条件と具体的な二次無理数の評価を説明できる
  - Fourier減衰と格子点の計数から正則性損失を導ける
  - 単一共鳴モードの永年項を厳密解から導出できる
