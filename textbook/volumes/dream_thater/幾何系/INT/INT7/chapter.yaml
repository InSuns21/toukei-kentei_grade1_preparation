id: "INT7"
title: "twist mapとPoincaré–Birkhoff"
volume: "foundations"
status: supplementary
prerequisites:
  - INT3
  - INT4
  - INT5
  - SYM4
official_scope: []
learning_objectives:
  - 2自由度Hamilton系の正則エネルギー面で第一帰還写像を定義し面積保存を証明できる
  - 円環写像の面積保存・境界保存・単調twistを別個に確認できる
  - 可積分Hamilton系の固定エネルギー帰還回転数とtwist係数を導出できる
  - 面積保存twist写像の生成関数を構成し周期性と微分関係を証明できる
  - Poincaré–Birkhoff固定点定理の単調twist版を生成関数の極値から証明できる
  - 一般形との仮定の違いと境界保存の必要性を反例で説明できる
  - q回反復の条件を確認して共鳴周期点と周期軌道を区別できる
