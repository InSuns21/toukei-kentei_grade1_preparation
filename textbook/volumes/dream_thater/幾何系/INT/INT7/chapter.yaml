  - { id: INT7-LEM-01, name: 円環のtwist生成関数 }
  - { id: INT7-THM-01, name: Poincaré–Birkhoff固定点定理（単調twist版） }
  - { id: INT7-PROP-03, name: 反復twistから得る共鳴周期点 }
canonical_examples:
  - 二作用Hamilton系の帰還断面
  - 可積分せん断の単調twistと固定円
  - 標準写像生成関数と有限境界の非保存
  - 境界で消えるHamilton摂動による閉円環twist
  - 剛体回転における境界twistの欠落
