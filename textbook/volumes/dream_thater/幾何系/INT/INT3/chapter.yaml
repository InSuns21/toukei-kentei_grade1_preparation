  - { id: INT3-PROP-02, name: 振り子の分離曲線で周期は発散する }
  - { id: INT3-PROP-03, name: サイクルの整数基底変換 }
canonical_examples:
  - 一自由度調和振動子の作用積分・正準性
  - 二自由度非結合振動子の作用角表示
  - 振り子の往復と回転の作用積分
  - 分離曲線の両側における作用の異なる極限
