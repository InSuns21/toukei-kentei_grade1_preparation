id: "INT3"
title: "作用角変数"
volume: "foundations"
status: supplementary
prerequisites:
  - INT1
  - INT2
  - SYM4
  - SYM6
  - GEO8
  - RA6A
official_scope: []
learning_objectives:
  - 作用積分をサイクルと原始1形式の規約を明示して定義できる
  - 調和振動子の作用積分と正準Jacobianを実計算できる
  - 局所作用角座標定理の周期ベクトル場から作用と正準角度を構成できる
  - 作用のエネルギー微分が周期を与えることを証明できる
  - 振り子の往復・回転の作用と周期を区別して計算できる
  - 分離曲線で周期が発散して正則性を失うことを証明できる
  - 二自由度系の作用角表示と整数周期基底変換を検証できる
