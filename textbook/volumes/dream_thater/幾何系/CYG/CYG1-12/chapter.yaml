id: "CYG1-12"
title: "複素構造の一次変形と正則体積形式"
volume: "foundations"
status: supplementary
prerequisites:
  - CYG1-02
  - CYG1-04
  - CYG1-08
  - CM1-05
  - CM1-06
  - CM2-04
  - HOD1-06
official_scope: []
learning_objectives:
  - 消えない正則体積形式による接束と最高次より一つ低い正則形式束の同型を局所枠で構成し逆写像まで証明できる
  - ベクトル束値Dolbeault複体と層コホモロジーの役割を区別してH^1(X,T_X)とH^{n-1,1}(X)を接続できる
  - Beltrami微分の一次可積分条件と座標変換による同値を計算し無限小変形空間を説明できる
  - 楕円曲線と複素トーラスの代表元を計算し非零Dolbeault類とその収縮像を判定できる
  - quinticのh^{2,1}=101が何の一次変形次元を数えるか説明できる
  - 一次変形の接空間の次元と実際の滑らかなモジュライの次元を区別し必要な追加定理を述べられる
theorems:
  - { id: CYG1-12-DEF-01, name: "正則体積形式による収縮写像" }
  - { id: CYG1-12-THM-01, name: "収縮による正則ベクトル束の同型" }
  - { id: CYG1-12-THM-04, name: "収縮によるDolbeaultコホモロジーの同型" }
  - { id: CYG1-12-DEF-02, name: "一次Beltrami変形と自明変形" }
  - { id: CYG1-12-THM-02, name: "一次複素構造変形とDolbeault類" }
  - { id: CYG1-12-THM-03, name: "一次変形空間とHodge群の同型" }
  - { id: CYG1-12-PROP-01, name: "トーラス上の定数係数一次変形" }
canonical_examples:
  - 複素二次元でのdz1とdz2の収縮と符号
  - 複素一次元の楕円曲線における収縮と一次変形
  - 平坦複素二次元トーラスの定数係数Beltrami微分の独立性
  - quinticの101次元と変形の存在問題の境界
  - 零点を持つ体積形式で収縮の逆が壊れる例
problem_patterns:
  - CYG1-12-CONTRACTION-SIGNS
  - CYG1-12-INVERSE-BUNDLE-MAP
  - CYG1-12-DOLBEAULT-CHAIN
  - CYG1-12-BELTRAMI-CLOSEDNESS
  - CYG1-12-GAUGE-EXACTNESS
  - CYG1-12-TORUS-NONEXACT
  - CYG1-12-ELLIPTIC-FIRST-ORDER
  - CYG1-12-QUINTIC-HODGE
  - CYG1-12-VOLUME-ZERO-BOUNDARY
  - CYG1-12-UNOBSTRUCTEDNESS-BOUNDARY
