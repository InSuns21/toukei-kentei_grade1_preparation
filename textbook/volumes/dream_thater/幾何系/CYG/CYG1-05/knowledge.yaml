    requires: [cyg.hypersurface-degree-criterion, algebraic-geometry.hypersurface-jacobian-criterion]
  - id: cyg.lefschetz-quartic-input
    name: 滑らかな射影超曲面のLefschetz定理
    kind: theorem
    introduction: formal
    introduction_aliases: ["定理（滑らかな射影超曲面のLefschetz定理：外部入力）"]
    requires: [cyg.quartic-smooth-canonical]
  - id: cyg.quartic-k3-test
    name: Fermat四次曲面はK3曲面
