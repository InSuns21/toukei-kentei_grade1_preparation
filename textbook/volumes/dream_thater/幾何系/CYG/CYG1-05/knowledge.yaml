chapter: CYG1-05
scope: dream-theater
coverage: complete
prerequisites: [CYG1-04, CYG1-02, AG2-11, CAG1-11, KAH1-14, KAH1-16, HOD1-06, HOD1-09]
concepts:
  - id: cyg.k3-surface
    name: K3曲面
