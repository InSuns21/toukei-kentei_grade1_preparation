    introduction: formal
    introduction_aliases: ["定義（K3曲面）"]
    requires: [cyg.volume-trivialization-test, cyg.torus-holomorphic-volume]
  - id: cyg.quartic-smooth-canonical
    name: Fermat四次曲面の滑らかさと標準束
    kind: proposition
    introduction: formal
