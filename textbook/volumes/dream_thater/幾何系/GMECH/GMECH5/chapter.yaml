  - { id: GMECH5-PROP-02, name: 基本2形式の一意な降下 }
  - { id: GMECH5-THM-01, name: Marsden–Weinstein簡約 }
  - { id: GMECH5-THM-02, name: 不変Hamiltonianの簡約力学 }
canonical_examples:
  - 二自由度並進での基本形式と一点の軌道方向の消去
  - 平面回転対称系の極座標と遠心力ポテンシャル
  - 非零SO3角運動量レベルの商次元
  - 中心力問題の円軌道と簡約平衡
