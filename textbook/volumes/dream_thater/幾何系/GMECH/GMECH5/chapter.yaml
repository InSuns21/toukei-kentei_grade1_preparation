id: "GMECH5"
title: "Marsden–Weinstein簡約"
volume: "foundations"
status: supplementary
prerequisites:
  - GMECH4
official_scope: []
learning_objectives:
  - 基本2形式の不変性と水平性を定義し運動量レベルで確認できる
  - 基本2形式が滑らかな商へ一意に降下することを持ち上げと局所切片で証明できる
  - Marsden–Weinstein簡約で制限形式の核が群軌道方向に一致することを証明できる
  - 簡約形式の閉性と非退化性と商の次元を仮定つきで説明できる
  - 不変Hamiltonianが商のHamilton方程式を定めることを導ける
  - 平面回転対称系の極座標表示から簡約形式と有効ポテンシャルを計算できる
