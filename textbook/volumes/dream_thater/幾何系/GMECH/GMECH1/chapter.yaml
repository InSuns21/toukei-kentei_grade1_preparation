id: "GMECH1"
title: "Lie群作用と余接束への持ち上げ"
volume: "foundations"
status: supplementary
prerequisites:
  - GEO2
  - GEO7
  - LIE2
  - LIE4
  - SYM3
official_scope: []
learning_objectives:
  - Lie群の滑らかな左作用を各群元について余接持ち上げし、結合則と同時滑らかさを証明できる
  - 正準1形式と正準2形式の保存をSYM3の定理の仮定を確認して導ける
  - 位置の基本ベクトル場から逆転置Jacobianの微分を介して余接束上の無限小生成子を求められる
  - 無限小生成子の流れとLie括弧の反準同型の符号を既存Lie群作用の定理から導ける
  - 位置と運動量の両条件から余接束上の安定化群を特徴づけられる
  - 平行移動・回転・スケーリング・せん断・非可換アフィン群の具体計算を再現できる
definitions:
  - { id: GMECH1-DEF-01, name: 余接持ち上げられたLie群作用 }
  - { id: GMECH1-DEF-02, name: 余接持ち上げ作用の基本ベクトル場 }
theorems:
  - { id: GMECH1-THM-01, name: 余接持ち上げは滑らかな左作用を定める }
  - { id: GMECH1-PROP-01, name: 余接持ち上げ作用の正準形式保存 }
  - { id: GMECH1-THM-02, name: 余接持ち上げの無限小座標公式 }
  - { id: GMECH1-PROP-02, name: 余接持ち上げの流れと括弧 }
  - { id: GMECH1-PROP-03, name: 余接ベクトルの安定化群 }
canonical_examples:
  - 指数スケーリングの作用と逆倍率の運動量
  - SO(2)の有限回転と逆転置の一致
  - 正準1形式を保存する回転とシンプレクティックであっても余接持ち上げでない平行移動
  - 基本ベクトル場の逆転置微分と角運動量型の中間式
  - 原点上の非零運動量で安定化群が縮小する例
  - 非可換アフィン群の流れ・括弧の符号
problem_patterns:
  - GMECH1-TRANSLATION
  - GMECH1-ANISOTROPIC-SCALING
  - GMECH1-INFINITESIMAL
