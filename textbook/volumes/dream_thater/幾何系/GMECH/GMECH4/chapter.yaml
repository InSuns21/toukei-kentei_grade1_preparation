  - { id: GMECH4-PROP-03, name: 運動量レベル集合への制限作用 }
  - { id: GMECH4-PROP-04, name: レベル集合に制限した作用の自由性・固有性 }
  - { id: GMECH4-THM-01, name: 正則運動量レベルの滑らかな商 }
canonical_examples:
  - 並進対称系の正則レベルと一点商
  - SO3の非零角運動量レベルとSO2安定化群
  - SO2の零角運動量における階数落ちと固定点
  - 可換群の非零運動量でも安定化群が全群となる例
