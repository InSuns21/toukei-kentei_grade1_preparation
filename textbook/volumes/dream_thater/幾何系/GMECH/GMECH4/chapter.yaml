id: "GMECH4"
title: "運動量レベル集合・群作用・正則性"
volume: "foundations"
status: supplementary
prerequisites:
  - GMECH2
  - GMECH3
  - SYM4
  - LIE4
  - GEO2
official_scope: []
learning_objectives:
  - 正則値・レベル集合を定義し、全射性から接空間と次元を導ける
  - 運動量写像の微分の核と群軌道のシンプレクティック直交補の関係を証明できる
  - 安定化Lie代数が零であることと運動量写像の正則性の同値を証明し自由性との差を説明できる
  - 余随伴安定化群を同変性から導き非零運動量で全群を使えない理由を説明できる
  - 自由作用と固有作用を区別し正則レベル集合の商の次元公式と仮定を説明できる
  - SO2とSO3の具体例で臨界値・自由性・余随伴安定化群・商の次元を再計算できる
definitions:
  - { id: GMECH4-DEF-01, name: 運動量レベル集合と正則値 }
  - { id: GMECH4-DEF-02, name: 余随伴安定化群 }
  - { id: GMECH4-DEF-03, name: 自由作用と固有作用 }
theorems:
