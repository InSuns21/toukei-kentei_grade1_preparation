id: "YAU1-07"
title: "C0評価II：Moser反復"
volume: "foundations"
status: supplementary
prerequisites:
  - YAU1-06
  - GA2
official_scope: []
learning_objectives:
  - 固定した右辺密度の一様上界と上限ゼロ規格化のL1入力を区別できる
  - 複素Monge–Ampère方程式の差の因数分解と閉形式の部分積分から勾配エネルギー評価を導出できる
  - 実次元2とそれ以上でSobolev指数を選び、Poincaré不等式で反復開始のL2ノルムを制御できる
  - 指数列と定数積の収束を計算してパラメータに一様なL∞評価を証明できる
  - 平均ゼロのC0評価へ戻し、密度上界・コンパクト性の仮定を落とした際の破綻箇所を説明できる
definitions:
  - { id: YAU1-07-DEF-01, name: Moser反復の指数列 }
theorems:
  - { id: YAU1-07-LEM-01, name: Monge–Ampèreエネルギー評価 }
  - { id: YAU1-07-LEM-02, name: 反復開始のL2評価 }
  - { id: YAU1-07-PROP-01, name: Sobolevによる指数増幅 }
  - { id: YAU1-07-THM-01, name: Moser反復による一様C0評価 }
  - { id: YAU1-07-COR-01, name: 連続性のパスでの上下界 }
canonical_examples:
  - 平坦楕円曲線の余弦密度に対するエネルギー恒等式
  - 複素次元1のSobolev指数と幾何級数
  - 無制限密度のGreen核集中例との比較
