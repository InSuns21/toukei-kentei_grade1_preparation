<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" data-layout-lint="strict" role="img">
<title>Boundary of the homotopy square</title><desc>The horizontal coordinate is s and the vertical coordinate is t. The bottom edge maps by f and the top by g. The left edge maps constantly to P and the right constantly to Q.</desc>
<rect width="360" height="290" fill="white"/>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#222"/></marker></defs>
<g fill="none" stroke="#222" stroke-width="2.5"><path d="M94 218 H266 M94 58 H266"/><path d="M94 218 V58 M266 218 V58" stroke-dasharray="6 4"/><path d="M94 250 H266" marker-end="url(#arrow)"/><path d="M52 218 V58" marker-end="url(#arrow)"/></g>
<g fill="#222" font-family="sans-serif" font-size="16"><text x="168" y="43">g(s)</text><text x="168" y="236">f(s)</text><text x="106" y="142">P</text><text x="242" y="142">Q</text><text x="70" y="40">1</text><text x="62" y="235">0</text><text x="278" y="237">1</text><text x="22" y="142">t</text><text x="177" y="274">s</text><text x="151" y="119">H(s,t)</text></g>
</svg>
