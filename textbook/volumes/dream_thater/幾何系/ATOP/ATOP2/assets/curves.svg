<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" data-layout-lint="strict" role="img">
<title>Three stages of a fixed-endpoint homotopy</title><desc>At time zero the parabola arch has height 40, at time one half height 20, and at time one it is a straight segment. All three share the same endpoints in their respective panels.</desc>
<rect width="360" height="240" fill="white"/>
<g fill="none" stroke="#222" stroke-width="2.5"><path d="M92 70 Q206 -10 320 70"/><path d="M92 145 Q206 105 320 145"/><path d="M92 220 L320 220"/></g>
<g fill="#222"><circle cx="92" cy="70" r="4"/><circle cx="320" cy="70" r="4"/><circle cx="92" cy="145" r="4"/><circle cx="320" cy="145" r="4"/><circle cx="92" cy="220" r="4"/><circle cx="320" cy="220" r="4"/></g>
<g font-family="sans-serif" font-size="15" fill="#222"><text x="14" y="55">t = 0</text><text x="14" y="130">t = 1/2</text><text x="14" y="205">t = 1</text><text x="78" y="88">P</text><text x="328" y="88">Q</text><text x="78" y="163">P</text><text x="328" y="163">Q</text><text x="78" y="235">P</text><text x="328" y="235">Q</text></g>
</svg>
