id: ATOP19
title: "切除定理"
volume: foundations
status: supplementary
prerequisites: [ATOP18, ATOP15]
official_scope: []
learning_objectives:
  - 小さい鎖の複体を定義し領域ごとの鎖を判定できる
  - 特異鎖の細分作用素と境界の可換性を再帰的に証明できる
  - 細分と恒等写像を結ぶ鎖ホモトピーを構成できる
  - Lebesgue数とメッシュ評価を用いて有限鎖を小鎖化できる
  - 小さい鎖による同型と切除定理を証明し閉包条件の失敗を説明できる
  - 切除と長完全列を組み合わせて局所的な相対群を計算できる
definitions:
  - { id: ATOP19-DEF-01, name: 小さい鎖の複体 }
  - { id: ATOP19-DEF-02, name: 特異鎖の細分作用素 }
theorems:
  - { id: ATOP19-LEM-02, name: 特異錐の境界公式 }
  - { id: ATOP19-THM-01, name: 特異細分と境界の可換性 }
  - { id: ATOP19-THM-02, name: 特異細分の鎖ホモトピー }
  - { id: ATOP19-LEM-01, name: 有限鎖の小鎖化 }
  - { id: ATOP19-THM-03, name: 小さい鎖によるホモロジー同型 }
  - { id: ATOP19-THM-04, name: 切除定理 }
canonical_examples: [区間の細分, 区間の切除, 閉包条件の反例, 一点の周りの相対群]
problem_patterns: [ATOP19-A1, ATOP19-A2, ATOP19-A3, ATOP19-A4, ATOP19-B1, ATOP19-B2, ATOP19-B3, ATOP19-B4, ATOP19-C1]
