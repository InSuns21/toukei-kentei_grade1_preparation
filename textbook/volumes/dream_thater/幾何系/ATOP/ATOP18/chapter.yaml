  - { id: ATOP18-THM-02, name: 相対ホモロジーの接続準同型 }
  - { id: ATOP18-THM-03, name: 対のホモロジー長完全列 }
  - { id: ATOP18-THM-04, name: 対の長完全列の自然性 }
