id: ATOP18
title: "相対ホモロジーと長完全列"
volume: foundations
status: supplementary
prerequisites: [ATOP17]
official_scope: []
learning_objectives:
  - 空間の対と相対特異鎖群を構成し商で境界が定まることを確認できる
  - 相対サイクルと相対ホモロジー群を代表元から判定できる
  - 接続準同型の代表元によらない構成を再現できる
  - 長完全列の三位置の完全性と自然性を鎖の持ち上げから証明できる
  - 区間と有限点および円板と境界の相対群を長完全列から調べられる
