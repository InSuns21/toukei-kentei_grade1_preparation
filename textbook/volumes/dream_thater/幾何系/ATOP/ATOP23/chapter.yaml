id: ATOP23
title: "球面の写像度"
volume: foundations
status: supplementary
prerequisites: [ATOP22, GEO3, ATOP6]
official_scope: []
learning_objectives:
  - 球面の最高次ホモロジーから写像度を定義し基本性質を証明できる
  - 反射と対蹠写像の符号を計算できる
  - 局所度を相対ホモロジーで定義し切除から加法性を導ける
  - 正則値で微分の行列式の符号から写像度を計算できる
  - 円周の巻き数と写像度を対応させられる
