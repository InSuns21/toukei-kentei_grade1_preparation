id: ATOP31
title: "cup積とコホモロジー環"
volume: foundations
status: supplementary
prerequisites: [ATOP30]
official_scope: []
learning_objectives:
  - Alexander–Whitneyの前面と後面を用いてcup積の評価を計算できる
  - Leibniz則を面の交代和から導出し代表元によらない積を構成できる
  - 結合律と単位元と自然性を証明しコホモロジー環を扱える
  - shuffleの交換符号とEilenberg–Zilberの鎖ホモトピーから次数付き可換性を証明できる
  - 奇数次数の平方に対する係数環の影響を説明できる
