<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 290" data-layout-lint="strict" role="img" aria-labelledby="title desc">
<title id="title">Torus cycles</title><desc id="desc">A square has its opposite sides identified with equal orientations; the horizontal solid x cycle points right and the vertical dashed y cycle points upward. They cross once. The cap dual of a is y and that of b is minus x.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#243b53"/></marker></defs>
<rect x="65" y="30" width="230" height="230" fill="#f4f7fa" stroke="#718096" stroke-width="2"/>
<g fill="none" stroke="#718096" stroke-width="2" marker-end="url(#arrow)"><path d="M120 30 H160"/><path d="M120 260 H160"/><path d="M65 205 V165"/><path d="M295 205 V165"/></g>
<g fill="none" stroke="#243b53" stroke-width="3" marker-end="url(#arrow)"><path d="M65 145 H295"/><path d="M180 260 V30" stroke-dasharray="8 5"/></g>
<g font-family="sans-serif" font-size="17" fill="#243b53"><text x="310" y="150">x</text><text x="190" y="21">y</text><text x="83" y="21">A</text><text x="83" y="281">A</text><text x="43" y="85">B</text><text x="310" y="85">B</text></g>
</svg>
