id: ATOP15
title: "細分と単体近似"
volume: foundations
status: supplementary
prerequisites: [ATOP14, ATOP5, ATOP2, FIX1]
official_scope: []
learning_objectives:
  - 非空面の包含鎖から重心細分複体を構成し元の実現との同相を説明できる
  - 重心細分によるメッシュ縮小を利用して開スターの直径を評価できる
  - 細分鎖写像を再帰的に構成し境界との可換性を証明できる
  - 最大頂点写像と鎖ホモトピーを構成し細分前後のホモロジー群の同型を示せる
  - スター条件を用いて単体近似の存在と直線ホモトピーを証明できる
