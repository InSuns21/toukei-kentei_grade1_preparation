<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 270" data-layout-lint="strict">
  <title>線分の細分と単体近似</title>
  <desc>横軸は入力、縦軸は値。放物線 f は両端で零、中点で一となる。二本の直線からなる近似 g も同じ三点を通る。</desc>
  <rect width="340" height="270" fill="#ffffff"/>
  <g fill="none" stroke="#485563" stroke-width="1.5">
    <path d="M44 220 H304 M44 220 V20"/>
    <path d="M174 220 V34 M44 34 H174" stroke-dasharray="2 5" stroke-width="1"/>
  </g>
  <path d="M44 220 Q174 -152 304 220" fill="none" stroke="#235d87" stroke-width="2.6" data-series-group="maps" data-series-label="f"/>
  <path d="M44 220 L174 34 L304 220" fill="none" stroke="#a34d26" stroke-width="2.6" stroke-dasharray="7 4" data-series-group="maps" data-series-label="g"/>
  <g fill="#263746"><circle cx="44" cy="220" r="3.5"/><circle cx="174" cy="34" r="3.5"/><circle cx="304" cy="220" r="3.5"/></g>
  <g font-family="sans-serif" font-size="14" fill="#263746" text-anchor="middle">
    <text x="44" y="251">0</text><text x="174" y="251">1/2</text><text x="304" y="251">1</text>
    <text x="28" y="39">1</text><text x="321" y="223">x</text>
    <text x="92" y="75">f</text><text x="116" y="177">g</text>
  </g>
</svg>
