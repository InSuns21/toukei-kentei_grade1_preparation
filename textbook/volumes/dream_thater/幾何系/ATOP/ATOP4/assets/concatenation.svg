<svg xmlns="http://www.w3.org/2000/svg" width="640" height="310" viewBox="0 0 640 310" data-layout-lint="strict" role="img" aria-labelledby="title desc">
<title id="title">道の連結における時間区間の対応</title>
<desc id="desc">全体時間の前半はアルファの全区間、後半はベータの全区間に対応する。</desc>
<rect width="640" height="310" fill="#fff"/>
<g font-family="sans-serif" font-size="20" fill="#182532" text-anchor="middle">
<text text-anchor="middle" font-size="20" x="320" y="32">連結した道の時間 s</text>
<path data-series-group="joined" data-series-label="alpha" d="M60 72 H320" stroke="#255e99" stroke-width="5" fill="none"/>
<path data-series-group="joined" data-series-label="beta" d="M320 72 H580" stroke="#963c28" stroke-width="5" stroke-dasharray="12 5" fill="none"/>
<g stroke="#182532" stroke-width="2"><path d="M60 63 V81 M320 63 V81 M580 63 V81"/></g>
<text text-anchor="middle" font-size="20" x="60" y="122">0</text><text text-anchor="middle" font-size="20" x="320" y="122">1/2</text><text text-anchor="middle" font-size="20" x="580" y="122">1</text>
<g stroke="#687582" stroke-width="1.5" fill="none"><path d="M60 140 L60 185 M320 140 L290 185 M320 140 L350 185 M580 140 L580 185"/></g>
<path data-series-group="local" data-series-label="alpha" d="M60 195 H290" stroke="#255e99" stroke-width="5" fill="none"/>
<path data-series-group="local" data-series-label="beta" d="M350 195 H580" stroke="#963c28" stroke-width="5" stroke-dasharray="12 5" fill="none"/>
<g stroke="#182532" stroke-width="2"><path d="M60 186 V204 M290 186 V204 M350 186 V204 M580 186 V204"/></g>
<text text-anchor="middle" font-size="20" x="60" y="245">0</text><text text-anchor="middle" font-size="20" x="290" y="245">1</text><text text-anchor="middle" font-size="20" x="350" y="245">0</text><text text-anchor="middle" font-size="20" x="580" y="245">1</text>
<text text-anchor="middle" font-size="20" x="175" y="285">α の時間 2s</text><text text-anchor="middle" font-size="20" x="465" y="285">β の時間 2s−1</text>
</g></svg>
