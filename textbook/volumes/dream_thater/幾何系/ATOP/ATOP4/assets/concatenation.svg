<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" viewBox="0 0 640 250" role="img" aria-labelledby="title desc">
<title id="title">道の連結における時間区間の対応</title>
<desc id="desc">全体時間の前半はアルファの全区間、後半はベータの全区間に対応する。</desc>
<rect width="640" height="250" fill="#fff"/>
<g font-family="sans-serif" font-size="20" fill="#182532" text-anchor="middle">
<text x="320" y="32">連結した道の時間 s</text>
<path d="M60 72 H320" stroke="#255e99" stroke-width="5" fill="none"/>
<path d="M320 72 H580" stroke="#963c28" stroke-width="5" stroke-dasharray="12 5" fill="none"/>
<g stroke="#182532" stroke-width="2"><path d="M60 63 V81 M320 63 V81 M580 63 V81"/></g>
<text x="60" y="105">0</text><text x="320" y="105">1/2</text><text x="580" y="105">1</text>
<g stroke="#687582" stroke-width="1.5" fill="none"><path d="M60 115 L60 165 M320 115 L290 165 M320 115 L350 165 M580 115 L580 165"/></g>
<path d="M60 175 H290" stroke="#255e99" stroke-width="5" fill="none"/>
<path d="M350 175 H580" stroke="#963c28" stroke-width="5" stroke-dasharray="12 5" fill="none"/>
<g stroke="#182532" stroke-width="2"><path d="M60 166 V184 M290 166 V184 M350 166 V184 M580 166 V184"/></g>
<text x="60" y="207">0</text><text x="290" y="207">1</text><text x="350" y="207">0</text><text x="580" y="207">1</text>
<text x="175" y="237">α の時間 2s</text><text x="465" y="237">β の時間 2s−1</text>
</g></svg>
