id: ATOP4
title: "道・ループ・基本群"
volume: foundations
status: supplementary
prerequisites: [ATOP2, ATOP3, TOP3, GRP2]
official_scope: []
learning_objectives:
  - 道の連結と逆走の式を構成し連続性を検証できる
  - 道ホモトピーと再パラメータ化を使い演算の代表元独立性を証明できる
  - 結合律と単位元と逆元を明示的ホモトピーから導ける
  - 基点変更による群同型と道の選択による共役を説明できる
  - 誘導準同型と強変形レトラクトによる基本群の比較を証明できる
