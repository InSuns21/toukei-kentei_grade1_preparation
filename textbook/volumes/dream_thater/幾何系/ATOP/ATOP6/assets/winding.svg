<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 285" data-layout-lint="strict" role="img" aria-labelledby="title desc">
  <title id="title">正、負、零の巻き数の持上げ</title>
  <desc id="desc">時刻0から1の間に実数値の持上げは2、-1、0に到着する。零の場合は途中で1に到達してから戻る。</desc>
  <defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#334155"/></marker></defs>
  <rect width="420" height="285" fill="#fff"/>
  <g stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"><path d="M55 60 H315 M55 120 H315 M55 240 H315 M315 60 V180 M315 222 V240"/></g>
  <g stroke="#334155" stroke-width="1.5" fill="none"><path d="M55 252 V36" marker-end="url(#arrow)"/><path d="M44 180 H345" marker-end="url(#arrow)"/></g>
  <path d="M55 180 L315 60" stroke="#176899" stroke-width="3.5" fill="none" data-series-group="lift" data-series-label="positive"/>
  <path d="M55 180 L315 240" stroke="#9a3412" stroke-width="3" stroke-dasharray="9 5" fill="none" data-series-group="lift" data-series-label="negative"/>
  <path d="M55 180 Q185 60 315 180" stroke="#17634f" stroke-width="3" stroke-dasharray="2 5" stroke-linecap="round" fill="none" data-series-group="lift" data-series-label="zero"/>
  <g fill="#172b3c"><circle cx="55" cy="180" r="3.5"/><circle cx="315" cy="60" r="3.5"/><circle cx="315" cy="240" r="3.5"/><circle cx="315" cy="180" r="3.5"/></g>
  <g font-family="sans-serif" font-size="15" fill="#172b3c"><text x="45" y="23">u</text><text x="30" y="65">2</text><text x="30" y="125">1</text><text x="25" y="207">0</text><text x="22" y="245">-1</text><text x="310" y="207">1</text><text x="353" y="185">s</text><text x="328" y="65">w=2</text><text x="328" y="245">w=-1</text><text x="328" y="163">w=0</text></g>
</svg>
