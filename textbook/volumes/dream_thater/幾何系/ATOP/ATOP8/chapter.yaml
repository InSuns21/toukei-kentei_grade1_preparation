id: ATOP8
title: "グラフと自由群"
volume: foundations
status: supplementary
prerequisites: [ATOP2, ATOP3, ATOP4, ATOP5, ATOP6, ATOP7]
official_scope: []
learning_objectives:
  - 有限グラフの幾何学的実現を商空間として構成できる
  - 全域木の存在と辺数を証明できる
  - 全域木の縮約が基点付きホモトピー同値であることを証明できる
  - 自由群の既約語を計算し花束の基本群をvan Kampen定理で求められる
  - 非木辺から自由生成元を構成し基本群の階数と最小性を説明できる
