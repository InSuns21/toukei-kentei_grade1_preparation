id: ATOP24
title: "非レトラクション・Brouwer・毛玉の定理"
volume: foundations
status: supplementary
prerequisites: [ATOP23, FIX1]
official_scope: []
learning_objectives:
  - 円板の非レトラクション定理をホモロジーから証明できる
  - 半直線の交点を計算し不動点なしの仮定からレトラクションを構成できる
  - Brouwer 不動点定理の閉単位球の場合をホモロジーで導ける
  - 偶数次元球面の接ベクトル場の零点を写像度から証明し奇数次元と比較できる
