    requires: [atop.path-lifting, atop.homotopy-lifting-square, atop.path-homotopy]
  - id: atop.covering-induced-injective
    name: 被覆写像が誘導する基本群準同型
    kind: theorem
    introduction: formal
    requires: [atop.lift-endpoint-invariance, atop.induced-fundamental-group-homomorphism]
