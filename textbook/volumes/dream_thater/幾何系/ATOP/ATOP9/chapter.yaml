  - { id: ATOP9-THM-04, name: 被覆の枚数と指数 }
  - { id: ATOP9-THM-05, name: 基点なしの連結被覆の分類 }
  - { id: ATOP9-THM-06, name: 普遍被覆の存在と因子化 }
  - { id: ATOP9-THM-07, name: デッキ変換群と正規化群 }
