id: ATOP9
title: "被覆空間の分類と普遍被覆"
volume: foundations
status: supplementary
prerequisites: [ATOP4, ATOP5, ATOP6, ATOP8]
official_scope: []
learning_objectives:
  - 局所弧状連結性と半局所単連結性の違いを説明できる
  - 道類から任意の部分群に対応する連結被覆を構成できる
  - 基点付き分類と基点なしの共役による分類を証明できる
  - 被覆の枚数を部分群の指数から計算できる
  - 普遍被覆の存在と因子化を証明し八の字の木を説明できる
  - デッキ変換群を正規化群の商として計算できる
definitions:
  - { id: ATOP9-DEF-01, name: 局所弧状連結性 }
  - { id: ATOP9-DEF-02, name: 半局所単連結性 }
  - { id: ATOP9-DEF-03, name: 被覆の同値 }
  - { id: ATOP9-DEF-04, name: 普遍被覆 }
  - { id: ATOP9-DEF-05, name: デッキ変換 }
