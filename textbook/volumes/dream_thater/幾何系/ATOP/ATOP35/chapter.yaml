learning_objectives:
  - 特異単体の前面を評価して後面を残すcap積を計算できる
  - 境界公式の符号を頂点削除の添字から導ける
  - 相対cap積を定義し代表元に依存しないことを示せる
  - cap積の自然性とcup積との評価関係を証明できる
  - 基本類による双対写像を構成し双対辺の局所模型と区別できる
