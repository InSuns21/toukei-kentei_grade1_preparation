id: ATOP33
title: "Borsuk–Ulam定理"
volume: foundations
status: supplementary
prerequisites: [ATOP32, MT1]
official_scope: []
learning_objectives:
  - 対蹠同変写像の条件を具体例で確認できる
  - 射影空間への降下と持上げの符号差から1次生成元の引き戻しを導ける
  - cup冪の非零性による低次元球面への写像の不存在を証明できる
  - Borsuk–Ulam定理を低次元の例外処理を含めて証明できる
  - 有限測度の連続性と切断面の仮定を確認してハムサンドイッチ定理を導ける
definitions:
  - { id: ATOP33-DEF-01, name: 対蹠同変写像 }
theorems:
  - { id: ATOP33-PROP-01, name: 対蹠同変写像による1次生成元の引き戻し }
  - { id: ATOP33-THM-01, name: 低次元球面への対蹠同変写像の不存在 }
  - { id: ATOP33-THM-02, name: Borsuk–Ulam定理 }
  - { id: ATOP33-THM-03, name: ハムサンドイッチ定理 }
canonical_examples: [赤道の包含, 射影空間の生成元, 球面の座標射影, 二つの長方形の等分]
