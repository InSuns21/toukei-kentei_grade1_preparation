id: ATOP34
title: "局所向き・向き付け・基本類"
volume: foundations
status: supplementary
prerequisites: [ATOP25, ATOP29, ATOP23]
official_scope: []
learning_objectives:
  - 局所ホモロジーの生成元を計算し近傍の向きの整合性を確認できる
  - 閉集合の相対 Mayer–Vietoris 列を鎖群の短完全列から導ける
  - コンパクト集合上の相対類の消滅と点による検出を証明できる
  - 向きの局所系の符号変換と Möbius 帯の向き反転を説明できる
  - 閉多様体の整数および mod 2 基本類の存在一意性を局所から証明できる
