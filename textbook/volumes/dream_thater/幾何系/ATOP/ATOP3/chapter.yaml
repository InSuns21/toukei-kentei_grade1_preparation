id: ATOP3
title: "レトラクト・変形レトラクト・可縮性"
volume: foundations
status: supplementary
prerequisites: [ATOP2, TOP1, TOP3]
official_scope: []
learning_objectives:
  - レトラクションと包含の合成を区別できる
  - 変形レトラクトと強変形レトラクトの条件を検証しホモトピー同値を導ける
  - 円環と穴あき平面の動径変形の連続性と値域を確認できる
  - 可縮性と一点空間とのホモトピー同値およびレトラクトへの継承を証明できる
  - 可縮性から道連結性を導き境界への動径写像の限界を説明できる
