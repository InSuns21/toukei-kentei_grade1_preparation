<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" data-layout-lint="strict" role="img" aria-labelledby="title desc">
  <title id="title">円周の円板への包含</title>
  <desc id="desc">左は境界だけの円周、右は内部を含む円板。同じ角度の境界上の点が包含写像で対応し、右の原点は左の円周にない。</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#333"/></marker></defs>
  <circle cx="78" cy="84" r="54" fill="none" stroke="#245b83" stroke-width="3"/>
  <circle cx="282" cy="84" r="54" fill="#e4edf4" stroke="#245b83" stroke-width="3"/>
  <circle cx="78" cy="30" r="4" fill="#333"/>
  <circle cx="282" cy="30" r="4" fill="#333"/>
  <circle cx="282" cy="84" r="3" fill="#333"/>
  <path d="M140 84H220" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <g font-family="sans-serif" font-size="14" fill="#222" text-anchor="middle">
    <text x="78" y="18">a</text><text x="282" y="18">i(a)=a</text>
    <text x="180" y="71">包含 i</text>
    <text x="282" y="104">0</text>
    <text x="78" y="159">円周 S¹</text><text x="282" y="159">円板 D²</text>
  </g>
</svg>
