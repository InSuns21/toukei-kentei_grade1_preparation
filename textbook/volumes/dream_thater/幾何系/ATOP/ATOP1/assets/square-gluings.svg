<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320" data-layout-lint="strict" role="img">
<title>Side identifications for cylinder and torus</title><desc>In both squares the a sides are matched from bottom to top. In the second square the b sides are also matched from left to right. The first produces a cylinder, the second a torus, shown schematically.</desc>
<rect width="360" height="320" fill="white"/>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#222"/></marker></defs>
<g fill="none" stroke="#222" stroke-width="2"><rect x="35" y="35" width="96" height="96"/><rect x="35" y="190" width="96" height="96"/><path d="M35 106 V60 M131 106 V60 M35 261 V215 M131 261 V215 M55 190 H109 M55 286 H109" marker-end="url(#arrow)"/><path d="M151 83 H201 M151 238 H201" marker-end="url(#arrow)"/><ellipse cx="276" cy="49" rx="42" ry="15"/><path d="M234 49 V113 M318 49 V113 M234 113 A42 15 0 0 0 318 113"/><path d="M234 113 A42 15 0 0 1 318 113" stroke-dasharray="5 4"/><ellipse cx="276" cy="238" rx="55" ry="38"/><ellipse cx="276" cy="238" rx="25" ry="12"/><path d="M251 238 Q276 224 301 238" stroke-dasharray="4 3"/></g>
<g font-family="sans-serif" font-size="15" fill="#222" text-anchor="middle"><text x="23" y="85">a</text><text x="143" y="85">a</text><text x="23" y="240">a</text><text x="143" y="240">a</text><text x="83" y="181">b</text><text x="83" y="307">b</text><text x="276" y="148">cylinder</text><text x="276" y="301">torus</text></g>
</svg>
