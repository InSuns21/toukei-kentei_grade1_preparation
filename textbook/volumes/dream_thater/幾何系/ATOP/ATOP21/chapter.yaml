id: ATOP21
title: "単体ホモロジーと特異ホモロジーの比較"
volume: foundations
status: supplementary
prerequisites: [ATOP20]
official_scope: []
learning_objectives:
  - 頂点順序を固定した比較写像を構成し境界との可換性を証明できる
  - 相対単体鎖群と長完全列の比較を説明できる
  - 骨格の近傍への変形と切除を使って相対特異群を分解できる
  - 有限単体複体の次元帰納によって比較同型を証明できる
  - 任意の単体写像に関する自然性と頂点順序への非依存性を説明できる
  - 有限三角形分割から位相不変量を計算できる
definitions:
  - { id: ATOP21-DEF-01, name: 単体・特異鎖の比較写像 }
  - { id: ATOP21-DEF-02, name: 相対単体ホモロジー群 }
theorems:
  - { id: ATOP21-THM-01, name: 比較写像と境界の可換性 }
  - { id: ATOP21-THM-02, name: 完全列の中央の比較 }
  - { id: ATOP21-THM-03, name: 骨格対の相対特異ホモロジーの分解 }
  - { id: ATOP21-THM-04, name: 単体ホモロジーと特異ホモロジーの比較定理 }
  - { id: ATOP21-THM-05, name: 比較同型の自然性と頂点順序への非依存性 }
canonical_examples: [三角形の比較写像, 骨格の帯への変形, 二枚の三角形の相対群]
problem_patterns: [ATOP21-A1, ATOP21-A2, ATOP21-A3, ATOP21-A4, ATOP21-B1, ATOP21-B2, ATOP21-B3, ATOP21-C1]
past_exam_alignment: []
integrated_exam_problems: []
exercise_counts: { level_a: 4, level_b: 3, level_c: 1, level_d: 0 }
estimated_hours: { reading: 4, exercises: 3, review: 1 }
