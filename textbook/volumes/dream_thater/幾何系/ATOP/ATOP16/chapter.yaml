id: ATOP16
title: "特異鎖・特異ホモロジーと関手性"
volume: foundations
status: supplementary
prerequisites: [ATOP14, FIX1, TOP3]
official_scope: []
learning_objectives:
  - 特異単体と有限支持の整数特異鎖を定義し単体鎖との違いを説明できる
  - 面写像と交代和から境界を計算し二重境界の消滅を任意次数で証明できる
  - サイクルと境界の商として特異ホモロジー群を構成できる
  - 連続写像の誘導準同型の良定義性と恒等写像・合成の保存を証明できる
  - 0次特異ホモロジー群と道連結成分の対応を証明し具体的な群と写像を計算できる
definitions:
  - { id: ATOP16-DEF-01, name: 特異単体 }
