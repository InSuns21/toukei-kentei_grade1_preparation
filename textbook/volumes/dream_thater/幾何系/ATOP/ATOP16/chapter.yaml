  - { id: ATOP16-DEF-03, name: 面写像 }
  - { id: ATOP16-DEF-04, name: 特異境界作用素 }
  - { id: ATOP16-DEF-05, name: 特異サイクルと特異境界鎖 }
  - { id: ATOP16-DEF-06, name: 特異ホモロジー群 }
  - { id: ATOP16-DEF-07, name: 特異鎖の誘導準同型 }
theorems:
  - { id: ATOP16-THM-01, name: 特異鎖の二重境界の消滅 }
  - { id: ATOP16-THM-02, name: 特異鎖の誘導準同型と境界の可換性 }
  - { id: ATOP16-THM-03, name: 特異ホモロジーの誘導準同型 }
  - { id: ATOP16-THM-04, name: 0次特異ホモロジーと道連結成分 }
canonical_examples: [曲がった特異三角形, 一点空間の全次数, 二成分の0次群]
