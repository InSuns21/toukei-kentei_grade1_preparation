<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" data-layout-lint="strict" role="img"><title>円周リンクと区間リンク</title><desc>左は中心vと四頂点で四三角形が作る円周リンク。右はvから三頂点に伸びる二三角形で区間リンク。外側の太線がリンクを表す。</desc><g fill="#e3eef7" stroke="#293b48" stroke-width="1.8" stroke-linejoin="round"><path d="M82 90 L82 25 L147 90 Z M82 90 L147 90 L82 155 Z M82 90 L82 155 L17 90 Z M82 90 L17 90 L82 25 Z"/><path d="M264 145 L200 65 L264 25 Z M264 145 L264 25 L328 65 Z"/></g><g fill="none" stroke="#293b48" stroke-width="3.5" stroke-linejoin="round"><path d="M82 25 L147 90 L82 155 L17 90 Z"/><path d="M200 65 L264 25 L328 65"/></g><g fill="#293b48"><circle cx="82" cy="90" r="4"/><circle cx="264" cy="145" r="4"/><circle cx="82" cy="25" r="3"/><circle cx="147" cy="90" r="3"/><circle cx="82" cy="155" r="3"/><circle cx="17" cy="90" r="3"/><circle cx="200" cy="65" r="3"/><circle cx="264" cy="25" r="3"/><circle cx="328" cy="65" r="3"/></g><g font-family="sans-serif" font-size="14" fill="#293b48"><text x="91" y="79">v</text><text x="273" y="158">v</text></g></svg>
