id: ATOP7
title: "van Kampen定理と群の表示"
volume: foundations
status: supplementary
prerequisites: [ATOP4, ATOP5, ATOP6]
official_scope: []
learning_objectives:
  - 生成元と関係式から群を構成し準同型を定められる
  - 自由積の構成と普遍性を証明し直積群との違いを説明できる
  - 開被覆によるループの細分と補助の道を使って基本群の生成性を証明できる
  - ホモトピー正方形の細分から評価の不変性を示しvan Kampen定理を証明できる
  - 交わりの条件を確認して自由積と関係式から基本群を計算できる
