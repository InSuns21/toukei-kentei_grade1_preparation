id: ATOP37
title: "境界付き多様体とPoincaré–Lefschetz双対性"
volume: foundations
status: supplementary
prerequisites: [ATOP36, ATOP30]
official_scope: []
learning_objectives:
  - カラー近傍と内部への押し込みを具体的に構成できる
  - 相対基本類の存在一意性と境界の誘導向きを局所計算から説明できる
  - 相対コホモロジーと内部のコンパクト支持コホモロジーを比較できる
  - Poincaré–Lefschetz双対性の二同型を導き長完全列の符号を検算できる
  - 円板と円筒の絶対群・相対群および双対写像を計算できる
