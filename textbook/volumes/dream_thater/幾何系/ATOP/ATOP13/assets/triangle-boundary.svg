<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" data-layout-lint="strict">
  <title>向き付き三角形の境界</title>
  <desc>頂点a、b、cを巡る矢印はaからb、bからc、cからaであり、昇順の辺ab、bc、acの係数は順に正、正、負である。</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#174c72"/></marker></defs>
  <path d="M60 190 L280 190 L170 40 Z" fill="#e6eff5" stroke="#174c72" stroke-width="2"/>
  <g fill="none" stroke="#174c72" stroke-width="3" marker-end="url(#arrow)">
    <path d="M110 190 L215 190"/>
    <path d="M255 156 L199 80"/>
    <path d="M144 75 L87 153"/>
  </g>
  <g fill="#174c72"><circle cx="60" cy="190" r="4"/><circle cx="280" cy="190" r="4"/><circle cx="170" cy="40" r="4"/></g>
  <g font-family="sans-serif" font-size="17" fill="#174c72" text-anchor="middle">
    <text x="44" y="210">a</text><text x="296" y="210">b</text><text x="170" y="24">c</text>
    <text x="170" y="222">+ab</text><text x="273" y="105">+bc</text><text x="67" y="105">−ac</text>
  </g>
</svg>
