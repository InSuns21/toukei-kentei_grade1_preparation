id: ATOP13
title: "向き付き単体と単体鎖複体"
volume: foundations
status: supplementary
prerequisites: [ATOP10, MOD1, LA3B]
official_scope: []
learning_objectives:
  - 頂点列の置換の符号から向きを判定し整数鎖を構成できる
  - 単体境界作用素を計算し向きとの整合性を証明できる
  - 二重境界の消滅を削除添字の相殺から証明できる
  - 境界行列を基底から構成し積を検算できる
  - 単体写像の退化した像を零として境界との可換性と合成を証明できる
