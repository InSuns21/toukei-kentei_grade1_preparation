id: ATOP27
title: "Lefschetz不動点定理"
volume: foundations
status: supplementary
prerequisites: [ATOP15, ATOP23, ATOP26]
official_scope: []
learning_objectives:
  - 有理係数への比較の移行を分母を払う議論で証明できる
  - 自己写像の誘導ホモロジー写像から Lefschetz数を計算できる
  - 境界とサイクルに適合する基底で Hopfのトレース公式を証明できる
  - 二段階の細分と距離評価から Lefschetz不動点定理を証明できる
  - Lefschetz数が零の場合と有限多面体の仮定の意味を説明できる
definitions:
  - { id: ATOP27-DEF-01, name: Lefschetz数 }
