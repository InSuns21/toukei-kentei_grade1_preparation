id: ATOP26
title: "H1と基本群の可換化"
volume: foundations
status: supplementary
prerequisites: [ATOP12, ATOP17, ATOP22]
official_scope: []
learning_objectives:
  - 特異2単体の境界から道の連結と逆走の鎖の関係を導ける
  - 基本群から1次特異ホモロジーへの準同型を構成できる
  - 補助道と端点係数の相殺から次数1の Hurewicz 定理を証明できる
  - 基点変更と誘導準同型の効果を説明できる
  - グラフと曲面の1次群を基本群の可換化と胞体鎖の両方で計算できる
definitions: []
