chapter: ANF9
scope: dream-theater
coverage: complete
prerequisites:
  - ANF8
forward_references: []

concepts:
  - id: number-theory.p-adic-valuation
    name: p進付値
    kind: definition
    introduction: formal
    requires: [number-theory.prime-ideal-factorization]

  - id: number-theory.valuation-product-sum
    name: 付値の積と和
    kind: proposition
    introduction: formal
    requires: [number-theory.p-adic-valuation]

  - id: number-theory.p-adic-absolute-value
    name: p進絶対値と距離
    kind: definition
    introduction: formal
    requires: [number-theory.p-adic-valuation]

  - id: number-theory.p-adic-ultrametric
    name: 非Archimedes三角不等式
    kind: proposition
    introduction: formal
    requires: [number-theory.valuation-product-sum, number-theory.p-adic-absolute-value]

  - id: number-theory.localize-integers-at-p
    name: 素数pにおけるZの局所化
    kind: definition
    introduction: formal
    requires: [algebraic-geometry.localization, number-theory.p-adic-valuation]

  - id: number-theory.local-ring-valuation
    name: 局所化の単元と極大イデアル
    kind: proposition
    introduction: formal
    requires: [number-theory.localize-integers-at-p, number-theory.valuation-product-sum]

  - id: number-theory.p-adic-cauchy-completion
    name: p進数体のCauchy完備化
    kind: definition
    introduction: formal
