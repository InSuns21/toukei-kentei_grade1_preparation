  - id: number-theory.p-adic-integers
    name: p進整数環
    kind: definition
    introduction: formal
    requires: [number-theory.p-adic-complete-field]

  - id: number-theory.p-adic-inverse-limit
    name: 互換な剰余列・逆極限
    kind: definition
    introduction: formal
    requires: [number-theory.p-adic-integers]

  - id: number-theory.localized-finite-quotients
    name: 局所化と有限剰余環
    kind: lemma
