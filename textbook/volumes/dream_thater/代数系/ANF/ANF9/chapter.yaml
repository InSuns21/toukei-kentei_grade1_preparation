id: "ANF9"
title: "付値・局所化・完備化"
volume: "foundations"
status: supplementary
prerequisites:
  - ANF8
official_scope: []
learning_objectives:
  - 有理数のp進付値・p進絶対値を定義し積・和の非Archimedes評価を証明できる
  - Z_(p)の元・単元・極大イデアルを付値で判定し局所化と完備化を区別できる
  - Cauchy列の同値類からQ_pの演算・逆元・完備性・稠密性を構成し証明できる
  - Z_(p)の有限剰余環がZ/p^n Zと一致することを示せる
  - Z_pと互換な剰余列の逆極限との同型を両方向の構成で証明できる
  - p進桁展開の存在と一意性を証明し有理数の桁を計算できる
  - Z_pの単元・主イデアル・剰余体を付値を使って証明できる
  - 数体の素イデアル付値を局所単項性から導入し局所完備化と有限剰余環の関係を導ける
