  - { id: ANF2-THM-02, name: 判別式の基底変換則 }
  - { id: ANF2-PROP-03, name: 判別式の符号 }
  - { id: ANF2-THM-03, name: 判別式と指数の平方 }
  - { id: ANF2-THM-04, name: 二次体の判別式公式 }
canonical_examples:
  - Q(sqrt(2))の乗法行列・跡・ノルムと判別式
  - Q(sqrt(2),sqrt(3))で最小多項式が拡大次数より小さい場合の共役値の重複
  - Q(sqrt(3))のノルム1の単元
  - Q(sqrt(5))の整数基底とZ[sqrt(5)]の指数2
  - Q(sqrt(-3))で負の判別式
  - Q(cuberoot(2))の基底判別式マイナス108
  - Q(sqrt(13))で指数と単元を同時に検算
