id: "ANF2"
title: "跡・ノルム・判別式"
volume: "foundations"
status: supplementary
prerequisites:
  - ANF1
  - FLD2
  - RNG4
official_scope: []
learning_objectives:
  - 数体の乗法写像からノルムを定義し複素埋め込みの和と積による跡・ノルムを証明できる
  - 最小多項式と体の拡大次数から跡とノルムを計算し共役値の重複次数を説明できる
  - 跡の線形性とノルムの乗法性・整性を証明しノルムによる単元判定を使える
  - 跡行列の定義から基底の判別式を求め基底変換の二乗則と非零性を証明できる
  - 判別式の複素埋め込み表示から符号を説明できる
  - 整数基底から体の判別式を定義し部分格子の指数の平方則を証明・適用できる
  - 二次体の判別式公式を導出し整な基底と整数基底の違いを数値で判定できる
