  - { id: ANF5-LEM-01, name: 体積による鳩の巣原理 }
  - { id: ANF5-THM-02, name: Minkowskiの凸体定理 }
  - { id: ANF5-LEM-02, name: ノルム評価用凸体の体積 }
  - { id: ANF5-THM-03, name: Minkowskiの小ノルム元の存在 }
canonical_examples:
  - Q(sqrt(5))の二つの実埋め込みと共体積sqrt(5)
  - Q(sqrt(-5))の複素埋め込みと共体積sqrt(5)
  - Q(sqrt(-5))の非主素イデアル(2,1+sqrt(-5))の格子面積2sqrt(5)
  - Q(sqrt(-3))の複素基底の共体積sqrt(3)/2
  - 実二次体の菱形と虚二次体の円盤の体積比較
  - Q(sqrt(-5))の理想ノルム2と元ノルム4の具体上界
