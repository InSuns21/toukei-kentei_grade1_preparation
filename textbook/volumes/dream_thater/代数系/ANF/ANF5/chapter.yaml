id: "ANF5"
title: "Minkowski埋め込みと格子"
volume: "foundations"
status: supplementary
prerequisites:
  - ANF4
  - NDA3
official_scope: []
learning_objectives:
  - 実埋め込みと複素共役の組を区別し次数n=r1+2r2および体ノルム公式を具体例で確認できる
  - NDA3で導入した全階数格子・共体積を使い整数環・整イデアルの実座標像を構成できる
  - 判別式の埋め込み行列と整数基底からcovol(j(I))=2^(-r2)sqrt(abs(D_K))N(I)を証明できる
  - NDA3で証明済みのBlichfeldt補題とMinkowski凸体定理の適用条件・証明機構を具体的な格子で確認できる
  - ノルム評価用凸体の体積を実座標と複素極座標の積分から求められる
  - 凸体定理と相加相乗平均から明示定数(4/pi)^r2 n!/n^nによる小ノルム元の存在を証明できる
  - 実二次体と虚二次体の共体積・ノルム上界を手計算で検算し後続の類群有限性へ接続できる
definitions:
  - { id: ANF5-DEF-01, name: Minkowski埋め込み }
theorems:
  - { id: ANF5-THM-01, name: 整数環とイデアルの共体積 }
  - { id: ANF5-LEM-02, name: ノルム評価用凸体の体積 }
  - { id: ANF5-THM-03, name: Minkowskiの小ノルム元の存在 }
canonical_examples:
  - Q(sqrt(5))の二つの実埋め込みと共体積sqrt(5)
  - Q(sqrt(-5))の複素埋め込みと共体積sqrt(5)
  - Q(sqrt(-5))の非主素イデアル(2,1+sqrt(-5))の格子面積2sqrt(5)
  - Q(sqrt(-3))の複素基底の共体積sqrt(3)/2
  - 実二次体の菱形と虚二次体の円盤の体積比較
  - Q(sqrt(-5))の理想ノルム2と元ノルム4の具体上界
