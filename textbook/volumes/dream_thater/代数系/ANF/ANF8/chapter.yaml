id: "ANF8"
title: "Dedekindゼータと解析類数公式"
volume: "foundations"
status: supplementary
prerequisites:
  - ANF7
official_scope: []
learning_objectives:
  - 整イデアルとイデアル類に関するDedekindゼータ関数と部分ゼータ関数を定義できる
  - 素イデアル分解と次数公式からEuler積の絶対収束と局所因子を証明できる
  - 中心化対数座標の定義と単数による平行移動を導出し生成元のw_K重複を説明できる
  - 角度積分と対数変換のJacobianを計算して単数基本領域の体積を導ける
  - Lipschitz境界の格子点計数の誤差を説明して各イデアル類のノルム計数漸近式を証明できる
  - 部分積分からDedekindゼータ関数のs=1近傍の有理型延長と解析類数公式を導ける
  - QとQ(i)でEuler積および格子点の二つの経路から留数を検算できる
  - Q(sqrt(-5))とQ(sqrt(2))の公式における類数とレギュレータの役割を説明できる
definitions:
  - { id: ANF8-DEF-01, name: Dedekindゼータ関数 }
