  - { id: ANF8-LEM-02, name: 単数基本領域の体積 }
  - { id: ANF8-LEM-03, name: 境界がLipschitzな領域の格子点計数 }
  - { id: ANF8-THM-01, name: 各イデアル類の計数漸近式 }
  - { id: ANF8-THM-02, name: 解析類数公式 }
canonical_examples:
  - Qの整イデアルとリーマンゼータ関数
  - Q(i)のEuler局所因子と格子点による留数pi/4の検算
  - Q(sqrt(-5))の類数2が留数へ現れる例
  - Q(sqrt(2))のレギュレータと留数
  - 中心化対数の拡大不変性と実二次体の具体座標
