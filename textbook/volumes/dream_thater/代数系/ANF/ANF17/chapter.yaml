id: "ANF17"
title: "局所類体論：相互法則・関手性"
volume: "foundations"
status: supplementary
prerequisites:
  - ANF16
official_scope: []
learning_objectives:
  - 算術的Frobeniusで規格化した有限局所Artin写像の対象・核・像を説明できる
  - 非分岐拡大でArtin写像を直接計算しノルム群との対応を検証できる
  - 一般の局所相互法則で使う外部定理とこの講で証明する帰結を区別できる
  - 有限Abel拡大のArtin商同型とノルム判定を証明できる
  - 中間体へのGalois制限とノルム商の射影の可換性・核を証明できる
  - 基礎体変更のノルムと制限の向きを正しく記述し非分岐例で直接証明できる
  - 有限Abel拡大と開有限指数部分群の包含反転対応を導ける
definitions:
  - { id: ANF17-DEF-01, name: 有限拡大の局所 Artin 写像・ノルム剰余記号 }
theorems:
  - { id: ANF17-THM-01, name: 局所相互法則・有限商による表示（一般形は外部定理） }
  - { id: ANF17-PROP-01, name: 有限局所 Artin 写像の核と位数 }
  - { id: ANF17-PROP-02, name: 中間体への制限と自然性 }
  - { id: ANF17-THM-02, name: 局所相互法則のノルム・制限の関手性（一般形は外部定理） }
  - { id: ANF17-PROP-03, name: 非分岐拡大での基礎体変更 }
  - { id: ANF17-COR-01, name: 有限 Abel 拡大と開有限指数部分群の対応 }
canonical_examples:
  - Q3(i)の非分岐二次Artin写像と核
  - Q5(5の四乗根)からQ5(sqrt5)へのGalois制限とノルム商
  - 非分岐三次を非分岐二次基礎体へ変更したときのFrobenius二乗
  - Q3(sqrt3)の3と-3で異なるノルム剰余記号
