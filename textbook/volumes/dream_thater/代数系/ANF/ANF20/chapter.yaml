id: "ANF20"
title: "大域Artin写像と剰余類体"
volume: "foundations"
status: supplementary
prerequisites:
  - ANF19
official_scope: []
learning_objectives:
  - 法の有限合同条件と実素点の符号条件を定義し具体的に判定できる
  - 剰余類群と通常類群との違いを説明し有理数体の法5と法5∞を計算できる
  - 弱近似を用いて剰余類群の有限性を証明できる
  - 局所単数群を使って剰余類群とイデール商の同型を証明できる
  - 局所Artin写像の積の有限性と算術的Frobenius規約を確認できる
  - 大域相互法則と剰余類体の存在定理の未証明部分を区別できる
  - 五次円分体のFrobeniusと分数イデアルのArtin像を計算できる
