  - { id: ANF12-LEM-01, name: 有限体のノルム・跡は全射 }
  - { id: ANF12-PROP-02, name: 非分岐拡大の段階商でのノルム・跡 }
  - { id: ANF12-THM-02, name: 非分岐局所拡大のノルム・跡 }
canonical_examples:
  - Q_5におけるU^0,U^1,U^2の包含
  - Q_3(i)の有限体跡とノルムの法9合同
  - Q_5(sqrt5)の非ノルム単元2とQ_2(sqrt2)の跡像
  - 非分岐拡大での主単数のノルム逐次持ち上げ
