id: "ANF12"
title: "局所単数・ノルム・跡"
volume: "foundations"
status: supplementary
prerequisites:
  - ANF11
official_scope: []
learning_objectives:
  - 局所単数のフィルトレーションを定義し剰余群と段階商を具体計算できる
  - U^0/U^1の乗法群とU^r/U^{r+1}の加法群の同型を証明できる
  - 局所ノルムの付値公式と整数環の跡の整数性を確認できる
  - 非分岐拡大で剰余体ノルムと跡を乗法行列の還元から導ける
  - 有限体ノルム・跡の全射性を証明できる
  - 非分岐拡大で主単数と全単元のノルム全射性を逐次近似で証明できる
  - 非分岐ノルム群p^{fZ}Z_p^timesを求め付値による判定ができる
  - 分岐二次拡大で単元剰余の障害と跡の非全射を具体的に示せる
definitions:
