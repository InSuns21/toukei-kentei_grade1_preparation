  - TRN3-FACTORIAL-SERIES-IRRATIONAL
  - TRN3-FACTORIAL-VERSUS-EXPONENTIAL
  - TRN3-INTEGER-NORM-DISTINCTION
  - TRN3-ENDPOINT-IDENTITY
  - TRN3-THREE-GATES
