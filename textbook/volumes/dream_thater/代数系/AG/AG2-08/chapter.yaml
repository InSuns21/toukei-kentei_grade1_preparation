id: "AG2-08"
title: "局所パラメータ・微分形式・標準束"
volume: "foundations"
status: supplementary
prerequisites:
  - AG2-07
  - AG2-06
  - AG2-05
  - AG1-04
  - AG1-11
official_scope: []
learning_objectives:
  - Kähler微分加群を積の規則から構成し多項式環と一方程式の商環で計算できる
  - 局所化に伴う分数の微分公式を導出し微分加群の局所基底を構成できる
  - 滑らかな曲線の局所パラメータの変更で微分基底が単元倍になることを証明できる
  - 正則1形式と標準束を可逆層として構成できる
  - 有理微分形式の位数と標準因子を定義し標準束との対応を証明できる
  - 射影直線の標準束がO(-2)で大域正則1形式が零であることを計算できる
  - 滑らかなWeierstrass三次曲線で非消失微分を局所計算し標準束の自明性を説明できる
definitions:
  - { id: AG2-08-DEF-01, name: Kähler微分加群 }
  - { id: AG2-08-DEF-02, name: 正則1形式と曲線の標準束 }
