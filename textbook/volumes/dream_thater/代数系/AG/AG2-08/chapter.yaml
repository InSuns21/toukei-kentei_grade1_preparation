  - { id: AG2-08-PROP-02, name: 滑らかな曲線の微分の局所基底 }
  - { id: AG2-08-THM-01, name: 局所パラメータによる微分基底の変換 }
  - { id: AG2-08-THM-02, name: 標準因子と標準束 }
  - { id: AG2-08-THM-03, name: 射影直線の標準束 }
  - { id: AG2-08-THM-04, name: 滑らかなWeierstrass三次曲線の非消失微分 }
canonical_examples:
  - 放物線y=x^2上のdy=2x dxと微分形式の零点
  - 射影直線上のdy=-x^{-2}dxとK=-2P_infinity
  - 射影放物線YZ=X^2上のdxの無限遠位数
  - 滑らかな射影三次曲線上のdx/(2y)の貼り合わせと非消失
