  - { id: AG2-06-PROP-02, name: O(d)の貼り合わせの整合性 }
  - { id: AG2-06-PROP-03, name: 斉次式から作る大域切断 }
  - { id: AG2-06-LEM-01, name: アフィン空間上の大域正則関数 }
  - { id: AG2-06-THM-01, name: 射影直線上のO(d)の大域切断 }
  - { id: AG2-06-THM-02, name: 射影空間上のO(d)の大域切断 }
  - { id: AG2-06-PROP-04, name: ねじれ層のテンソル積と双対 }
canonical_examples:
  - 射影直線上でe_T=x e_Sを満たす局所基底
  - O(2)のS^2とSTとT^2の二チャート係数
  - 負の次数で大域切断が存在しないこと
  - O(1)の非自明性
