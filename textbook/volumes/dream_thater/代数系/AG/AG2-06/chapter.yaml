id: "AG2-06"
title: "可逆層とO(d)"
volume: "foundations"
status: supplementary
prerequisites:
  - AG2-05
  - AG2-01
  - AG1-04
  - AG1-07
  - LA3E
  - F0-00C1
official_scope: []
learning_objectives:
  - 可逆層を局所自由階数1の層として説明し具体例で局所基底を確認できる
  - 遷移関数の単元条件と三重の重なりでの積条件を検証できる
  - 射影空間のO(d)の遷移関数を構成し負次数でも定義良好と証明できる
  - 切断の局所係数が基底と逆向きに変換されることを導出できる
  - 斉次多項式からO(d)の大域切断を構成できる
  - 射影直線の大域切断を完全に求め正負の次数による相違を証明できる
  - 射影空間一般の大域切断と次元公式を導出できる
  - テンソル積と双対の遷移関数を計算し局所自明と大域自明の差を説明できる
definitions:
  - { id: AG2-06-DEF-01, name: 可逆層・直線束 }
  - { id: AG2-06-DEF-02, name: 遷移関数 }
