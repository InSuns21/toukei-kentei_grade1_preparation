  - { id: AG2-11-LEM-01, name: 超曲面の閉点での局所次元 }
  - { id: AG2-11-THM-02, name: 超曲面の滑らかさと正則局所環 }
  - { id: AG2-11-PROP-02, name: 滑らかな超曲面での局所余接基底 }
canonical_examples:
  - 斉次二次曲線X0X2-X1²の滑らかさと接方向
  - Fermat型五次超曲面と標準束の自明性
  - 二次円錐X0X1-X2²の唯一の頂点
  - 可約な二直線の交点と非被約二重直線
