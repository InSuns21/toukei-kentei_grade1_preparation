id: "AG2-11"
title: "滑らかな超曲面と正則性"
volume: "foundations"
status: supplementary
prerequisites:
  - AG2-10
  - AG2-09
  - AG2-08
  - AG2-02
  - AG1-10
  - AG1-09
  - AG1-04
official_scope: []
learning_objectives:
  - 斉次多項式のEuler恒等式を導き射影Jacobianとアフィンチャートの判定を一致させられる
  - 射影超曲面の滑らかな点と特異点をJacobian階数で判定できる
  - 局所環の埋め込み次元と正則局所環の定義を具体例で確認できる
  - 超曲面の局所環とZariski余接空間から滑らかさの判定を再導出できる
  - 滑らかな点の近傍でKähler微分の局所基底を明示できる
  - Fermat型と円錐・尖点・可約な超曲面の特異点を正しく計算できる
  - 滑らかさの検査後に随伴公式を適用し非被約方程式との違いを説明できる
definitions:
  - { id: AG2-11-DEF-01, name: 超曲面の滑らかさと特異性 }
  - { id: AG2-11-DEF-02, name: 正則局所環と埋め込み次元 }
