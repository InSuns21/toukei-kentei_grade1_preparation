id: "AG3-07"
title: "層の射と完全列・Čechコホモロジー"
volume: "foundations"
status: supplementary
prerequisites:
  - AG3-06
  - AG3-04
  - AG3-02
  - AG2-06
  - AG1-04
official_scope: []
learning_objectives:
  - 層の射を制限との可換性で定義し茎を使って単射と同型を判定できる
  - 核・像の層と完全列を定義し茎での完全性および大域切断との違いを説明できる
  - 有限開被覆からČech複体を構成し交代微分の二乗が零であることを証明できる
  - 零次Čech群と大域切断の同型を貼り合わせ公理から証明できる
  - 短完全列の局所持ち上げから一次障害を作り選択不変性と零類の意味を示せる
  - 射影直線のO(d)の零次・一次Čech群をLaurent多項式の指数で計算できる
  - Koszul型短完全列で大域切断の全射性が失敗する仕組みを計算できる
