id: "AG3-02"
title: "素スペクトルの位相と構造層"
volume: "foundations"
status: supplementary
prerequisites:
  - AG3-01
  - AG1-04
  - AG2-05
  - RNG2
official_scope: []
learning_objectives:
  - 任意の可換環についてV(I)が定めるZariski位相とD(f)の開基を証明できる
  - 素点の閉包と特殊化を包含関係で求め環準同型による連続写像を説明できる
  - 主開集合の準コンパクト性を根基イデアルによって証明できる
  - 点ごとの局所分数表示から構造層を定め制限と貼り合わせを検証できる
  - 主開集合の切断環と局所化の同型を貼り合わせの具体計算から再構成できる
  - 素点の茎が局所環に一致することを証明し冪零元の例で位相との違いを説明できる
definitions:
  - { id: AG3-02-DEF-01, name: 素スペクトルのZariski閉集合と主開集合 }
  - { id: AG3-02-DEF-02, name: 素スペクトルの構造層 }
theorems:
  - { id: AG3-02-PROP-01, name: Zariski位相と主開基 }
