  - { id: AG3-02-PROP-03, name: 環準同型が定める連続写像 }
  - { id: AG3-02-THM-01, name: 主開集合の準コンパクト性 }
  - { id: AG3-02-PROP-04, name: 構造層の制限と貼り合わせ }
  - { id: AG3-02-THM-02, name: 主開集合の切断環 }
  - { id: AG3-02-THM-03, name: 素点での構造層の茎 }
canonical_examples:
  - 一変数多項式環の一般点と閉点およびD(t)の切断
  - 冪零元をもつ厚み付き一点の構造層
  - 二本の座標軸の局所化と交わり
