official_scope: []
learning_objectives:
  - 正次数付き環の斉次素イデアルと無関係イデアルからProjの点と位相を定義し具体例を判定できる
  - 次数零の局所化を計算し標準開集合D_+(f)とSpec((S_f)_0)の同相および重なりの同型を証明できる
  - 標準開アフィンスキームを貼って構造層と構造射を作り射影空間との一致を示せる
  - 斉次商環のProjが閉部分スキームを定めることを証明し冪零構造を計算できる
  - 次数1有限生成環の射影空間への閉埋込みを構成できる
  - 次数付き加群の層化と多項式環のねじりO(r)の局所基底・遷移関数を求められる
