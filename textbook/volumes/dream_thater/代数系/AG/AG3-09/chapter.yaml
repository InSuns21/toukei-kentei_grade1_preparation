  - { id: AG3-09-THM-04, name: 次数1生成環の射影空間への閉埋込み }
  - { id: AG3-09-PROP-01, name: 多項式環のねじりとO(r) }
canonical_examples:
  - k[x0,x1]の斉次素イデアルと無関係イデアル
