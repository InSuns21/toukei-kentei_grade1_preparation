id: "AG1-10"
title: "Zariski接空間とJacobian判定の準備"
volume: "foundations"
status: supplementary
prerequisites:
  - AG1-09
  - AG1-08
  - AG1-07
  - AG1-05
  - AG1-04
  - AG1-03
  - RNG2
official_scope: []
learning_objectives:
  - Zariski接空間を消滅イデアルの一次条件で定義し生成方程式のJacobianの核として計算できる
  - 座標の異なる具体曲線や交差点で接空間の次元を求め幾何学的次元と比較できる
  - 点の局所環の極大イデアルから余接空間M/M²を定義し具体計算できる
  - 方向微分の局所化を構成し接空間とM/M²の双対の自然同型を証明できる
  - 正則写像の接写像と連鎖律を証明しパラメータ表示の微分が零になる例を説明できる
  - 既約超曲面の次元とJacobian階数の関係を証明し滑らかさ判定の未証明部分を識別できる
  - 非根基的方程式の一次情報と点集合の接空間を区別し反例を与えられる
definitions:
  - { id: AG1-10-DEF-01, name: Zariski接空間 }
  - { id: AG1-10-DEF-02, name: 余接空間と内在的接空間 }
theorems:
