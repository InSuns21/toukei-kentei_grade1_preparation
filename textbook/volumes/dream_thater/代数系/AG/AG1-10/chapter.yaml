  - { id: AG1-10-THM-01, name: Jacobianの核と局所環の双対の一致 }
  - { id: AG1-10-PROP-02, name: 正則写像による接写像 }
  - { id: AG1-10-PROP-03, name: 既約超曲面の次元と一次接条件 }
  - { id: AG1-10-PROP-04, name: 根基化と一次情報の違い }
canonical_examples:
  - 放物線の接方向とその一次Taylor展開
  - 二軸の原点と非原点でのJacobian階数
  - 局所環k[t]_(t)の一次商
  - 尖点のパラメータ表示と零接写像
  - 二重零点x²と根基化xの接空間の差
