id: "AG2-04"
title: "射影曲線と次数・Bézoutの例"
volume: "foundations"
status: supplementary
prerequisites:
  - AG2-03
  - AG2-02
  - AG2-01
  - AG1-11
  - AG1-04
  - CA3
  - VC1
official_scope: []
learning_objectives:
  - 被約な斉次方程式から射影平面曲線と次数を定義し冪を除く理由を説明できる
  - 直線への斉次式の制限から交点重複度を定義し座標表示の不変性を示せる
  - 二変数斉次式の因数分解と無限遠根の計数を証明できる
  - 直線と射影平面曲線のBézout公式を前提と結論を分けて証明できる
  - 射影線形変換による次数と交点重複度の保存を証明できる
  - 滑らかな点の接線条件を直線制限多項式の一次係数から導ける
  - 二次曲線の四交点例で無限遠点・根の相異性・Jacobianを検算できる
  - 共通成分がある場合と一般の二曲線Bézout定理の証明範囲を区別できる
definitions:
  - { id: AG2-04-DEF-01, name: 射影平面曲線と次数 }
  - { id: AG2-04-DEF-02, name: 直線と曲線の交点重複度 }
theorems:
  - { id: AG2-04-LEM-01, name: 二変数斉次式の根の重複度の総和 }
  - { id: AG2-04-THM-01, name: 直線と射影平面曲線のBézout公式 }
  - { id: AG2-04-PROP-01, name: 射影線形変換と次数 }
  - { id: AG2-04-PROP-02, name: 滑らかな点の接線と重複度 }
  - { id: AG2-04-PROP-03, name: 相異なる四交点を持つ二つの二次曲線 }
canonical_examples:
  - 平方因子を除いた被約曲線の次数
  - 無限遠根と射影直線の斉次式因数分解
  - 二次曲線の接線と二重交点
  - 三次尖点曲線への直線の三重交点
  - 二つの二次曲線の相異なる四交点とJacobian
  - Segre二次曲面の平面切断
