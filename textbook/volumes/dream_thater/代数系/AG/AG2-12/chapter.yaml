  - { id: AG2-12-PROP-02, name: 三次曲線上の座標関数の主因子 }
  - { id: AG2-12-THM-02, name: Fermat quinticの滑らかさと標準束 }
  - { id: AG2-12-PROP-03, name: quinticの局所標準形式 }
canonical_examples:
