official_scope: []
learning_objectives:
  - 射影Weierstrass三次曲線の有限点と無限遠点にJacobian判定を適用し既約性を検証できる
  - 滑らかな三次曲線で局所パラメータを交換し非消失正則1形式を全点で再構成できる
  - 座標関数の零点位数と無限遠での極の位数を求め主因子を計算できる
  - Fermat quinticの滑らかさ・余接階数・標準束を随伴公式で求められる
  - quinticの局所3形式を構成し消去方向と射影チャート変更の符号を追跡できる
  - 滑らかさの仮定が崩れた三次曲線とquinticでどの証明操作が使えなくなるか説明できる
definitions: []
