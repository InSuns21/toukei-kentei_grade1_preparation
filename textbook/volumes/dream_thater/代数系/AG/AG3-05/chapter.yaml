id: "AG3-05"
title: "ファイバー積と基底変換"
volume: "foundations"
status: supplementary
prerequisites:
  - AG3-04
  - LA3E
  - AG3-03
  - AG3-02
  - AG3-01
  - AG1-04
  - AG1-02
official_scope: []
learning_objectives:
  - スキームのファイバー積の普遍性を定義しアフィンの場合にテンソル積で証明できる
  - テンソル積を方程式として計算し相対的な積と素点の単純な直積の違いを説明できる
  - アフィンチャートから一般のファイバー積を貼り合わせて普遍性を検証できる
  - 基底変換と反復基底変換を説明し結合法則を普遍性から証明できる
  - 開埋め込みと閉埋め込みの基底変換を局所化・商環で証明できる
  - 点上のファイバー・幾何学的ファイバーと剰余体の関係を示し特異・冪零ファイバーを計算できる
