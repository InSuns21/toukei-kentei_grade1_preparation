  - { id: AG3-05-THM-02, name: スキームのファイバー積の存在と一意性 }
  - { id: AG3-05-PROP-02, name: 反復基底変換と結合法則 }
  - { id: AG3-05-PROP-03, name: 開部分と閉部分の基底変換 }
  - { id: AG3-05-PROP-04, name: アフィンな族の点上のファイバー }
canonical_examples:
  - アフィン直線二本の積と多項式環
  - 二つの二乗写像のファイバー積
  - 閉部分・開部分の基底変換
  - x²=tとxy=tの特殊ファイバー
  - 実数体上の複素点のファイバー積
