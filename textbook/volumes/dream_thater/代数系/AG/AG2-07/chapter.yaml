  - { id: AG2-07-THM-02, name: Cartier因子類と可逆層の同型類 }
  - { id: AG2-07-THM-03, name: 射影直線の因子類とPicard群 }
canonical_examples:
  - 放物線y=x^2の原点における局所パラメータと零点位数
