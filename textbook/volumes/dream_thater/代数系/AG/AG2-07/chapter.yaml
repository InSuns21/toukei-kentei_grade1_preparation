id: "AG2-07"
title: "Weil因子・Cartier因子と可逆層"
volume: "foundations"
status: supplementary
prerequisites:
  - AG2-06
  - AG2-05
  - AG2-01
  - AG1-04
  - AG1-05
  - AG1-07
  - AG1-11
  - CA3
official_scope: []
learning_objectives:
  - Weil因子・有効因子・主因子・線形同値・次数を定義し射影直線で位数を計算できる
  - 滑らかな平面曲線の局所パラメータをJacobianから構成し位数の一意性を証明できる
  - Cartier因子の単元条件を検証し滑らかな曲線上でWeil因子との同型を証明できる
  - 局所方程式の逆数を基底にして可逆層を構成し切断条件を導出できる
  - Cartier因子類とPicard群の同型を局所係数で証明できる
  - 射影直線のPicard群を次数で分類しO(d)との対応を計算できる
  - 特異点で局所主性が壊れる具体例を計算し一般化の限界を説明できる
