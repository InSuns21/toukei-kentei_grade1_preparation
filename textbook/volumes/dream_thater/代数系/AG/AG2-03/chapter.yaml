  - { id: AG2-03-PROP-02, name: Veronese写像の埋め込みと閉じた像 }
  - { id: AG2-03-PROP-03, name: 二次Veronese写像の像 }
  - { id: AG2-03-THM-01, name: Segre写像の像と二次小行列式 }
  - { id: AG2-03-PROP-04, name: Segre二次曲面 }
canonical_examples:
  - 次数の異なる座標式の代表元依存性
  - 共通零点で未定義になる射影写像
  - 二次Veroneseによる射影直線の二次曲線表示
  - Veroneseの一般次数のチャート逆写像
  - Segre写像の階数1行列と小行列式
  - Segre二次曲面の二つの直線族
