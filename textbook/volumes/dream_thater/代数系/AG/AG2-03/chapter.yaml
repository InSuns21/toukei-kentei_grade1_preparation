id: "AG2-03"
title: "射影射・Veronese写像・Segre写像"
volume: "foundations"
status: supplementary
prerequisites:
  - AG2-02
  - AG2-01
  - AG1-03
official_scope: []
learning_objectives:
  - 同次数斉次式の代表元不変性・共通零点なし条件から射影射を構成できる
  - 射影射のチャート上の正則性と未定義点の違いを説明できる
  - Veronese写像を一般次数で構成し単射性・局所逆・閉じた像を証明できる
  - 二次Veroneseの像の斉次方程式と逆写像を計算できる
  - Segre写像の像が階数1行列の二次小行列式で定まることを両包含から証明できる
  - Segre二次曲面のチャートと二直線族を計算できる
