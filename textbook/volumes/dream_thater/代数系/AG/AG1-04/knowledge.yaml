chapter: AG1-04
scope: dream-theater
coverage: complete
prerequisites:
  - AG1-03
  - RNG2
  - RNG4
forward_references: []

concepts:
  - id: algebraic-geometry.multiplicative-set
    name: 乗法的集合
    kind: definition
    introduction: formal
    introduction_aliases: ["定義（乗法的集合）"]
    requires: [algebra.commutative-ring, algebra.unital-ring]

  - id: algebraic-geometry.localization
    name: 局所化
    kind: definition
    introduction: formal
    introduction_aliases: ["定義（局所化）"]
    requires: [algebraic-geometry.multiplicative-set, algebra.ring-homomorphism]

  - id: algebraic-geometry.localization-fractions
    name: 局所化の演算と零判定
    kind: proposition
    introduction: formal
    introduction_aliases: ["命題（局所化の演算と零判定）"]
    requires: [algebraic-geometry.localization]

  - id: algebraic-geometry.localization-universal
    name: 局所化の普遍性
    kind: theorem
    introduction: formal
    introduction_aliases: ["定理（局所化の普遍性）"]
    requires: [algebraic-geometry.localization-fractions, algebra.ring-homomorphism]

  - id: algebraic-geometry.principal-open
    name: 主開集合と一元局所化
    kind: definition
    introduction: formal
    introduction_aliases: ["定義（主開集合と一元局所化）"]
    requires: [algebraic-geometry.zariski-topology, algebraic-geometry.localization]

  - id: algebraic-geometry.principal-open-basis
    name: 主開集合は開集合の基底
    kind: proposition
    introduction: formal
    introduction_aliases: ["命題（主開集合は開集合の基底）"]
    requires: [algebraic-geometry.principal-open, algebraic-geometry.zariski-topology]

  - id: algebraic-geometry.principal-open-fractions
    name: 主開集合上の分数関数
