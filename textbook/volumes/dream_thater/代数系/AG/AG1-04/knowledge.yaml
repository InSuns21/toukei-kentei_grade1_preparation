    introduction: formal
    introduction_aliases: ["定義（局所環）"]
    requires: [algebra.maximal-ideal, algebra.commutative-ring]

  - id: algebraic-geometry.point-local-ring
    name: 点の極大イデアルと点の局所環
    kind: definition
    introduction: formal
