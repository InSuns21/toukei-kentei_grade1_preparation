    requires: [algebraic-geometry.point-local-ring, algebraic-geometry.principal-open]

  - id: algebraic-geometry.germ-local-ring-isomorphism
    name: 点の局所環と分数関数の芽の一致
    kind: theorem
    introduction: formal
    introduction_aliases: ["定理（点の局所環と分数関数の芽の一致）"]
