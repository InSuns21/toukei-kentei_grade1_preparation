  - AG1-05-POLYNOMIAL-CONVERSE
  - AG1-05-LOCALIZATION-WITH-ZERO-DIVISORS
  - AG1-05-ZARISKI-CLOSED-DCC
  - AG1-05-FINITE-EQUATIONS
  - AG1-05-INTEGRATED-REDUCTION
