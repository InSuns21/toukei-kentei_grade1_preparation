id: "AG3-01"
title: "関手的視点とSpec"
volume: "foundations"
status: supplementary
prerequisites:
  - AG1-07
  - AG1-04
  - AG1-03
  - AG1-02
  - RNG2
  - FLD3
official_scope: []
learning_objectives:
  - k代数のB値点を準同型として構成し値域変更の関手性を示せる
  - k値点が冪零情報を検出しない例と代数値点の違いを説明できる
  - 素イデアルからSpecを構成し閉点に加えて一般点を識別できる
  - 素点の剰余体を定義し体値点が剰余体を経由することを証明できる
  - 環準同型が素スペクトルへ反変写像を与えることを証明・計算できる
  - 自然変換とk代数準同型の一対一対応を恒等写像への評価から再導出できる
