  - { id: AG3-01-THM-01, name: 代数の値点関手の自然変換 }
canonical_examples:
  - 多項式環と二本の軸のB値点
  - 冪零元をもつ二重原点の代数値点
  - k[t]の閉点と一般点の剰余体
  - 二乗写像による素イデアルの引き戻し
