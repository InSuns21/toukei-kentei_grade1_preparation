id: "AG3-08"
title: "層コホモロジーの基本計算"
volume: "foundations"
status: supplementary
prerequisites:
  - AG3-07
  - AG3-06
  - AG3-04
  - AG2-06
  - AG1-04
official_scope: []
learning_objectives:
  - 大域切断の左完全性を証明し短完全列の大域全射性が失敗する理由を説明できる
  - 入射分解を用いた層コホモロジーの定義と分解選択不変性を再構成できる
  - 短完全列の連結写像を構成し長完全列の完全性を追える
  - 主開被覆の増大Čech複体の完全性と準連接層のアフィン消滅を証明できる
  - アフィン有限交叉のČech比較を二重複体で説明し適用条件を判定できる
  - P1のO(d)のH0・H1・高次消滅を導出し基底を求められる
  - Koszul型短完全列の連結写像と局所持ち上げの障害を一致させられる
definitions:
  - { id: AG3-08-DEF-01, name: 入射層と入射分解 }
  - { id: AG3-08-DEF-02, name: 層コホモロジー }
