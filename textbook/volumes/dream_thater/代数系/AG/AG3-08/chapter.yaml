  - { id: AG3-08-LEM-02, name: Čech零化から層コホモロジーの零化 }
  - { id: AG3-08-THM-02, name: 準連接層のアフィン消滅 }
  - { id: AG3-08-THM-03, name: アフィン交叉を持つ被覆のČech比較 }
  - { id: AG3-08-THM-04, name: 二アフィン被覆のMayer–Vietoris列 }
  - { id: AG3-08-THM-05, name: 射影直線の層コホモロジー }
  - { id: AG3-08-PROP-03, name: 局所持ち上げと連結準同型 }
