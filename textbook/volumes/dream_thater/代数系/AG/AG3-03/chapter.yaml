id: "AG3-03"
title: "局所環付き空間とアフィンスキーム"
volume: "foundations"
status: supplementary
prerequisites:
  - AG3-02
  - AG3-01
  - AG1-04
  - AG2-05
official_scope: []
learning_objectives:
  - 局所環付き空間の定義と素スペクトルの局所環性および剰余体を証明できる
  - 局所環付き空間の射の局所性と剰余体の誘導写像を説明できる
  - 環準同型が定めるSpecの射を構成し主開切断と茎を計算できる
  - アフィンスキーム間の射と環準同型の全単射を完全に証明できる
  - 主開集合のアフィン表示と商環のスペクトルおよび茎の商を計算できる
  - 局所性を外した環の層の射の反例を構成できる
