  - { id: AG3-03-THM-03, name: アフィンスキームの射と環準同型の対応 }
  - { id: AG3-03-PROP-02, name: 主開集合のアフィン表示 }
  - { id: AG3-03-PROP-03, name: 商環が定める閉集合への射 }
canonical_examples:
  - 体と双対数の一点空間と茎の非同型性
  - 二乗写像と分数切断の引き戻し
  - 主開集合の局所化環による表示
  - 冪零な厚みを持つ閉部分空間
