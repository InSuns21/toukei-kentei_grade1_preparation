id: "AG3-04"
title: "スキームの貼り合わせと射"
volume: "foundations"
status: supplementary
prerequisites:
  - AG3-03
  - AG3-02
  - AG2-05
  - AG1-04
official_scope: []
learning_objectives:
  - スキームの局所アフィン性と開部分スキームの構成を説明・証明できる
  - 貼り合わせデータの自己一致・逆変換・三重一致を具体例で判定できる
  - 貼り合わせスキームの商位相・構造層・茎と一意性を証明できる
  - 射影直線を二つのアフィン直線から構成し大域切断が体であることを証明できる
  - 開被覆上の射を整合条件で貼り合わせアフィンチャートごとの射を判定できる
  - 原点を二重に持つ直線を構成し大域切断では非アフィン性を復元できない例を示せる
