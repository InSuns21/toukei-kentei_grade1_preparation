  - { id: AG2-09-THM-02, name: 射影空間の標準束 }
  - { id: AG2-09-THM-03, name: 射影空間の接Euler列 }
  - { id: AG2-09-COR-01, name: 射影空間の大域正則1形式と標準形式 }
canonical_examples:
  - P1での核の基底とdy=-x^{-2}dxの対応
  - P2でのdu∧dv=-x^{-3}dx∧dyによる局所計算
  - PnでのEuler写像の右逆と核のn本の自由基底
  - P1・P2・P3の標準束の次数
