id: "AG2-09"
title: "射影空間の標準束とEuler列"
volume: "foundations"
status: supplementary
prerequisites:
  - AG2-08
  - AG2-06
  - AG2-05
  - AG2-01
official_scope: []
learning_objectives:
  - 射影空間の余接層と標準束を局所座標の微分と外冪から構成できる
  - O(-1)の斉次座標によるEuler写像の貼り合わせ・全射性・核の自由基底を証明できる
  - 局所座標の分数微分と核の基底変換を照合して余接Euler列の完全性を証明できる
  - 局所分裂短完全列の行列式の同型を基底と持ち上げから導ける
  - 余接Euler列から射影空間の標準束O(-n-1)と標準因子類を計算できる
  - 接Euler列を局所双対から導き接層の階数と遷移を説明できる
  - 大域切断の単射と負次数のO(d)の大域切断定理から大域正則1形式の消失を証明できる
definitions:
