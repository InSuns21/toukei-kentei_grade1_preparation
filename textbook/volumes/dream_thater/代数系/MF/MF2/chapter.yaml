  - { id: MF2-LEM-01, name: 周期方向の格子和 }
  - { id: MF2-THM-03, name: Eisenstein級数のq展開 }
  - { id: MF2-THM-04, name: 判別式の非零性と格子判別式 }
  - { id: MF2-THM-05, name: jの不変性・カスプでの極・格子との対応 }
canonical_examples:
