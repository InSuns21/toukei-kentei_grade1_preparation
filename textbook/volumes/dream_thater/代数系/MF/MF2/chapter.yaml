id: "MF2"
title: "モジュラー形式・q展開・Eisenstein級数"
volume: "foundations"
status: supplementary
prerequisites:
  - MF1
  - CA8
  - CA9
  - CA12
  - GRP3
  - NT2
  - NT3
  - NT4
official_scope: []
learning_objectives:
  - 上半平面の正則関数についてモジュラー形式の変換則とカスプ正則性を別々に判定できる
  - 周期性からq座標を構成し、q展開とカスプ形式の条件を証明できる
  - Eisenstein級数の局所一様絶対収束、重さkの変換則、カスプ正則性を検算できる
  - E2の周期性・正則性とSでの重さ2変換則の破れを具体的に判定できる
  - 周期方向の格子和から約数和係数を導き、E4とE6の最初の係数を計算できる
  - Bernoulli数の母関数とcotの部分分数表示からEisenstein級数の一般係数を導ける
  - 格子のg2・g3とモジュラー判別式を結び、上半平面での非零性を証明できる
  - j不変量の群不変性とカスプでの極を求め、格子相似の不変量と説明できる
