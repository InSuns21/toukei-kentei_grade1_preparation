official_scope: []
learning_objectives:
  - 零点位数とカスプ位数を定義し、境界の楕円固定点の重みを説明できる
  - 基本領域と偏角原理からvalence formulaの主要積分と角度補正を導ける
  - E4とE6の零点軌道・位数をvalence formulaで決定できる
  - Δでカスプ形式を割って重さを12下げ、次元公式を証明できる
  - 定数項除去と単項式計数からM*がC[E4,E6]と同型であることを示せる
  - valenceからΔの非消失と有限q係数同一性判定を証明でき、極を負に数える意味を説明できる
  - モジュラー関数の定義を判定し、jの一意的軌道対応とC(j)を説明できる
