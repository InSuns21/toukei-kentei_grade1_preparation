  - { id: MF6-THM-02, name: Fricke変換と完成L関数の関数等式 }
  - { id: MF6-THM-03, name: Hecke固有形式のEuler積 }
  - { id: MF6-COR-01, name: 中心値が強制的に零になる条件 }
canonical_examples:
