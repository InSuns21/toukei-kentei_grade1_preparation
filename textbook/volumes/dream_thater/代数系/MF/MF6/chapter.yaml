id: "MF6"
title: "モジュラー形式のL関数"
volume: "foundations"
status: supplementary
prerequisites:
  - MF5
  - MF4
  - MF2
  - ANT2
  - CA12
official_scope: []
learning_objectives:
  - カスプ形式の係数成長評価を導きDirichlet級数の絶対収束半平面を確認できる
  - Gamma積分によりMellin表示を絶対収束から導ける
  - Fricke行列の正規化と共役計算を検証できる
  - 積分分割と変数変換から完成L関数の整解析接続を証明できる
  - Fricke変換の相手を区別して関数等式と中心符号を導ける
  - Hecke固有係数の漸化式からEuler積の二次因子を導ける
  - レベルを割る素数のUp固有性とnewform理論の役割を区別できる
