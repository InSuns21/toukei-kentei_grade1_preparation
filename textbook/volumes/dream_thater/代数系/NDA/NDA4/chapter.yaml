  - { id: NDA4-LEM-02, name: Fejér核による三角多項式近似 }
  - { id: NDA4-THM-01, name: Weyl判定 }
  - { id: NDA4-THM-02, name: 無理回転の一様分布 }
  - { id: NDA4-THM-03, name: Kroneckerの近似定理 }
  - { id: NDA4-COR-01, name: 有理独立とトーラス上の一様分布 }
canonical_examples:
  - 四分の一回転と長さ八分の一の区間の訪問頻度
  - 平方根2の無理回転と等比級数の指数和
  - 平方根2と二倍平方根2の整数関係による到達可能な目標
problem_patterns:
