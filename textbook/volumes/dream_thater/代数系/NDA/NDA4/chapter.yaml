id: "NDA4"
title: "一様分布・Weyl判定・Kronecker近似"
volume: "foundations"
status: supplementary
prerequisites:
  - NDA3
  - RA7
  - FOU2
official_scope: []
learning_objectives:
  - 小数部分・トーラス・半開直方体による一様分布の定義を直接例で判定できる
  - 連続関数の判定とFejér核による三角多項式の一様近似を証明できる
  - Weyl判定の必要十分性を証明し有理・無理回転の指数和を計算できる
  - 整数関係の必要十分条件を用いてKronecker近似を証明し同時近似の可否を判定できる
  - 有理独立とトーラス上の一様分布・連続関数の時間平均を関連付けられる
definitions:
