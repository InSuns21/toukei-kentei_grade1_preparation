id: "NDA7"
title: "Thue–Siegel–Rothの定理"
volume: "foundations"
status: supplementary
prerequisites:
  - NDA6
  - FLD1
  - LA3C
official_scope: []
learning_objectives:
  - Rothの定理を任意のepsilonと有限個の既約近似の量化を含めて正確に述べられる
  - 有限例外から定数付き一様下界を作り代数的無理数の無理性指数2を証明できる
  - 整数線形方程式の箱詰め補題を鳩の巣原理から証明できる
  - 規格化した零点の指数を導入し積・微分の指数則を証明できる
  - 消滅条件の個数を有限平均で評価し高さ付き補助多項式を構成できる
  - 多変数一般化Wronskianの非消滅性とRothの補題の帰納法を再構成できる
  - 分母と変数別次数を選び非零整数の下界とTaylor上界からRothの定理を完全に証明できる
  - Rothの定理を三次Thue型不定方程式の有限性に適用できる
