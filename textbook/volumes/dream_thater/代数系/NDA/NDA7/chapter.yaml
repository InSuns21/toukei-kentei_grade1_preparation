  - { id: NDA7-LEM-03, name: 代数的な点での高次消滅条件 }
  - { id: NDA7-LEM-04, name: 指数の演算則 }
  - { id: NDA7-LEM-05, name: 高さ付き補助多項式 }
  - { id: NDA7-LEM-06, name: 多項式の線形独立性と一般化Wronskian }
  - { id: NDA7-LEM-07, name: Rothの補題 }
