  - { id: NT6-LEM-04, name: Gauss整数の既約元は素元 }
  - { id: NT6-THM-03, name: 1 mod 4の素数の二平方表示 }
  - { id: NT6-THM-04, name: Fermatの二平方和定理 }
canonical_examples:
  - 84x+30y=18の一般解
  - 原始三つ組(5,12,13)の媒介表示
  - 3と11の法4での二平方不存在
