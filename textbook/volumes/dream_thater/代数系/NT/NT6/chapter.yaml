id: "NT6"
title: "不定方程式と平方和"
volume: "foundations"
status: supplementary
prerequisites:
  - NT1
  - NT3
  - RNG3
official_scope: []
learning_objectives:
  - 一次不定方程式の可解条件をBézout等式から証明し、全整数解と非負整数解を列挙できる
  - 原始Pythagoras三つ組の媒介表示を偶奇と互いに素な平方積から導出し、逆の原始性まで確認できる
  - 合同式による解不存在判定と3 mod 4の素数の指数制限を証明できる
  - Gauss整数のノルムと除法から既約元の素元性を導き、1 mod 4の素数を二平方に表示できる
  - Fermatの二平方和定理の必要性・十分性を証明し、具体的に表示を構成できる
  - 四平方定理の主張と二平方の相違、局所条件の役割と限界を説明できる
