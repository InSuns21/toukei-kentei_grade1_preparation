id: "NT8"
title: "素数分布への入口"
volume: "foundations"
status: supplementary
prerequisites:
  - NT5
  - RA1
official_scope: []
learning_objectives:
  - Euclid の素数無限性を矛盾の構成から証明し、素数の数え上げ問題との違いを説明できる
  - 素数計数関数、Chebyshev の theta・psi 関数、von Mangoldt 関数を定義し素数冪で計算できる
  - von Mangoldt 関数の約数和と階乗恒等式を素因数分解・二重計数から導ける
  - 中央二項係数を使い素数計数関数の両側 Chebyshev 型評価を証明できる
  - 素数定理の漸近式を正確に説明し、pi と theta の漸近式の同値性を証明できる
  - 絶対収束する Dirichlet 級数を定義し、Euler 積と素数の逆数和の発散を導ける
definitions:
  - { id: NT8-DEF-01, name: 素数計数関数 }
  - { id: NT8-DEF-02, name: Chebyshev の theta 関数 }
  - { id: NT8-DEF-03, name: von Mangoldt 関数 }
  - { id: NT8-DEF-04, name: Chebyshev の psi 関数 }
  - { id: NT8-DEF-05, name: Dirichlet 級数 }
theorems:
