  - { id: NT8-PROP-01, name: 素数冪ごとの分解 }
  - { id: NT8-PROP-02, name: 対数の約数和と階乗恒等式 }
  - { id: NT8-LEM-01, name: 二項係数と区間内素数 }
  - { id: NT8-THM-02, name: Chebyshev 型の上界 }
  - { id: NT8-LEM-02, name: 二項係数からの psi の下界 }
  - { id: NT8-LEM-03, name: 素数冪の余剰寄与 }
  - { id: NT8-THM-03, name: 素数計数関数の両側 Chebyshev 型評価 }
  - { id: NT8-THM-04, name: 素数定理（主張のみ） }
  - { id: NT8-PROP-03, name: 素数定理と theta の漸近式の同値性 }
  - { id: NT8-THM-05, name: 絶対収束域における Euler 積 }
canonical_examples:
