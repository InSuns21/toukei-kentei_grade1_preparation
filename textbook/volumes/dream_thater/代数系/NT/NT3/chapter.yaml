id: "NT3"
title: "平方剰余・平方剰余の相互法則"
volume: "foundations"
status: supplementary
prerequisites:
  - NT1
  - NT2
  - GRP2
  - FLD1
official_scope: []
learning_objectives:
  - 平方剰余・平方非剰余・Legendre記号を定義し、奇素数法の平方剰余を列挙して検証できる
  - 原始根の巡回性からEulerの規準とLegendre記号の乗法性を証明できる
  - Gaussの補題を積の並べ替えと約分によって証明し、補充法則を導出できる
  - Gaussの補題の床関数表示を導き、格子点計数で平方剰余の相互法則を完全に証明できる
  - Jacobi記号の乗法性と相互法則を導き、値1が合成数法の平方可解性を保証しないことを説明できる
  - 奇素数冪および2の冪への平方根の持ち上げを証明し、中国剰余定理で合成数法の二次合同式を解ける
