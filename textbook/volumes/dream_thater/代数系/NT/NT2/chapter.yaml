id: "NT2"
title: "乗法群・Fermat–Euler・原始根"
volume: "foundations"
status: supplementary
prerequisites:
  - NT1
  - GRP2
  - FLD1
official_scope: []
learning_objectives:
  - 法nの単数群とEulerのφ関数を定義し、素因数分解と中国剰余定理からφの積公式を証明できる
  - 元の位数とLagrangeの定理からEulerの定理およびFermatの小定理を導出し、必要な互いに素条件を説明できる
  - 逆元対の組と固定点の判定からWilsonの定理を完全に証明できる
  - 原始根の定義と具体的なべきの列から位数を判定できる
  - 有限可換群の指数補題と体上の多項式の根数から素数法の乗法群の巡回性を証明できる
  - 奇素数冪への原始根の持ち上げを二項展開で証明できる
  - 原始根が存在する法を2、4、奇素数冪とその2倍に分類し、非存在の場合に壊れる条件を説明できる
