id: "AFR15"
title: "分岐局所表現・newvector"
volume: "foundations"
status: supplementary
prerequisites: [AFR14]
official_scope: []
learning_objectives:
  - レベル部分群と主合同部分群を区別し中心指標との関係を証明できる
  - 指標と表現の導手指数および新ベクトルを定義できる
  - レベル二重剰余類と安定化条件から主系列の固定空間の次元を計算できる
  - Whittaker汎関数の変換則と既約表現の模型への単射性を証明できる
  - 主系列の安定Whittaker積分を構成し分岐した具体例で新ベクトルを規格化できる
