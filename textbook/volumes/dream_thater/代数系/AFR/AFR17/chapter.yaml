  - { id: AFR17-THM-02, name: "素数Hecke固有値による直線の決定" }
  - { id: AFR17-THM-03, name: "固有形式の生成加群の既約性" }
  - { id: AFR17-THM-04, name: "レベル1固有形式の局所データ" }
