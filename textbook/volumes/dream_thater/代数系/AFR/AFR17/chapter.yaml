id: "AFR17"
title: "GL_2の保型表現と古典形式"
volume: "foundations"
status: supplementary
prerequisites: [AFR16, AFR12, AFR11, MF5]
official_scope: []
learning_objectives:
  - 最低重さ条件をCauchy–Riemann方程式に翻訳し古典カスプ形式を復元できる
  - 素数Hecke固有値と第一係数から古典形式の全Fourier係数を決定できる
  - カスプ形式の生成加群の既約性を離散分解の射影を用いて証明できる
  - 局所の球固定直線と実側の最低重さ直線から古典形式および局所L因子を読み取れる
  - 離散分解とFlathの定理の外部入力の範囲を区別できる
definitions:
  - { id: AFR17-DEF-01, name: "カスプ保型表現" }
