id: "AFR5"
title: "Eisenstein級数と関数等式"
volume: "foundations"
status: supplementary
prerequisites: [AFR4, CA12]
official_scope: []
learning_objectives:
  - 原始的な整数組による級数の収束と保型性を証明できる
  - 双曲Laplace作用素の固有方程式とMellin表示を導ける
  - Gauss積分から定数項と非零Fourier係数を計算できる
