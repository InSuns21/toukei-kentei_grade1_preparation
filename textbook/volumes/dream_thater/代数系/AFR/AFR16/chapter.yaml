id: "AFR16"
title: "制限テンソル積・局所大域L因子"
volume: "foundations"
status: supplementary
prerequisites: [AFR15, MF6]
official_scope: []
learning_objectives:
  - 基準ベクトルを使って制限テンソル積を構成し群作用の整合性と滑らかさを証明できる
  - 局所新ベクトルの固定条件から大域的な有限レベルを計算できる
  - 局所因子から絶対収束するEuler積とDirichlet係数を構成できる
  - 分岐主系列のWhittaker積分から一次因子を計算できる
  - 古典Hecke作用と球Hecke作用の正規化を導出し古典Euler積と照合できる
