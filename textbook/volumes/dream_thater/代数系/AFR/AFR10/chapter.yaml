id: "AFR10"
title: "Tateの学位論文：`GL_1`のゼータ積分"
volume: "foundations"
status: supplementary
prerequisites: [AFR9, CA11]
official_scope: []
learning_objectives:
  - 乗法測度の規格化と有限位数Hecke指標の構成を説明できる
  - 不分岐および分岐の局所ゼータ積分と実Gamma因子を計算できる
  - 絶対収束性を確かめて大域積分をEuler積に分解できる
  - Poisson和と非零有理数和の減衰から解析接続・関数等式・留数を導ける
  - 導手に対応するFourier変換とGauss和から完成Hecke L関数の関数等式を導ける
definitions:
  - { id: AFR10-DEF-01, name: "局所乗法測度" }
  - { id: AFR10-DEF-02, name: "有限位数Hecke指標" }
  - { id: AFR10-DEF-03, name: "Tateゼータ積分" }
  - { id: AFR10-DEF-04, name: "有限位数Hecke L関数" }
theorems:
