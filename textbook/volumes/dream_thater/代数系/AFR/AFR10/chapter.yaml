  - { id: AFR10-PROP-01, name: "分岐指標に適合する試験関数" }
  - { id: AFR10-PROP-02, name: "実局所ゼータ因子" }
  - { id: AFR10-THM-02, name: "大域ゼータ積分のEuler分解" }
  - { id: AFR10-LEM-01, name: "非零有理数和の一様減衰" }
  - { id: AFR10-THM-03, name: "Tateの大域関数等式" }
  - { id: AFR10-THM-04, name: "分岐試験関数のFourier変換" }
  - { id: AFR10-THM-05, name: "完成Hecke L関数の関数等式" }
canonical_examples: [法5の二次指標, 不分岐局所因子, Gaussianによる完成Riemannゼータ関数, 法3のGauss和]
