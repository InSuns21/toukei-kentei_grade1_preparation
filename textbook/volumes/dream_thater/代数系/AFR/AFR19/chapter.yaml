id: "AFR19"
title: "Weil表現・theta級数"
volume: "foundations"
status: supplementary
prerequisites: [AFR18, AFR9, CA12]
official_scope: []
learning_objectives:
  - Weyl作用の積公式と振動子の三基本変換の共変性を計算できる
  - 実振動子作用の射影性を証明し二重被覆上の実Weil表現を構成できる
  - 有理基本変換に対するtheta和の不変性を証明できる
  - 複素theta級数の変換則を導出し二次元の直交群との交換を確認できる
