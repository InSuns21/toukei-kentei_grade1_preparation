id: "AFR14"
title: "球Hecke代数とSatakeパラメータ"
volume: "foundations"
status: supplementary
prerequisites: [AFR13]
official_scope: []
learning_objectives:
  - 局所Cartan分解と指数pの二重剰余類を構成できる
  - 球Hecke代数の積と固定空間への作用を有限和で証明できる
  - 二つの生成元による可換性とGL_2のSatake同型を証明できる
  - 正規化主系列の球Hecke固有値と既約許容表現の固定直線を導出できる
  - Satakeパラメータから局所Euler因子と係数漸化式を復元できる
