id: "AFR7"
title: "保型L関数・Rankin型積分の初例"
volume: "foundations"
status: supplementary
prerequisites: [AFR6]
official_scope: []
learning_objectives:
  - 保型性と高さの選択を用いてMaassカスプ形式の係数を評価できる
  - 絶対収束域を確かめてDirichlet級数とEuler積を結び付けられる
  - Mellin積分の尺度変換とGamma積分による核の計算を再現できる
  - Rankin型積分を帯に展開して二乗係数級数と平均的評価を導ける
