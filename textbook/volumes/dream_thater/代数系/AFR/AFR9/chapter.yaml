id: "AFR9"
title: "アデール上のFourier解析"
volume: "foundations"
status: supplementary
prerequisites: [AFR8, FOU3]
official_scope: []
learning_objectives:
  - p進小数部分から局所加法指標を構成し対角有理数上での大域自明性を証明できる
  - 加法Haar測度を規格化して局所球と有限アデール部分群の体積を計算できる
  - Schwartz–Bruhat関数の条件と有限剰余類分解を説明できる
  - 局所球のFourier変換と自己双対規格化による反転を導出できる
  - 有限アデールの格子条件と実周期化を接続してPoisson和公式を証明できる
definitions:
  - { id: AFR9-DEF-01, name: "標準局所加法指標" }
  - { id: AFR9-DEF-02, name: "Schwartz–Bruhat関数" }
  - { id: AFR9-DEF-03, name: "アデールFourier変換" }
theorems:
  - { id: AFR9-PROP-01, name: "大域加法指標の有理数上の自明性" }
  - { id: AFR9-PROP-02, name: "p進加法Haar測度の規格化" }
  - { id: AFR9-LEM-01, name: "有限アデール試験関数の剰余類分解" }
  - { id: AFR9-THM-01, name: "p進球指示関数のFourier変換" }
  - { id: AFR9-THM-02, name: "アデールFourier反転" }
  - { id: AFR9-THM-03, name: "有理数体のアデールPoisson和公式" }
canonical_examples: [有理数1/6の指標の打ち消し, p進球の指示関数の変換, Gaussianと整数環の自己双対性, 移動した格子のPoisson和公式]
problem_patterns: [AFR9-A1, AFR9-A2, AFR9-A3, AFR9-A4, AFR9-B1, AFR9-B2, AFR9-B3, AFR9-B4, AFR9-C1]
past_exam_alignment: []
integrated_exam_problems: []
exercise_counts: { level_a: 4, level_b: 4, level_c: 1, level_d: 0 }
estimated_hours: { reading: 7, exercises: 5, review: 2 }
