id: LREP28
title: "離散対称性と総合演習"
volume: "foundations"
status: supplementary
prerequisites: [LREP27, LREP8]
official_scope: []
learning_objectives:
  - 空間反転で左右Weyl表現が交換されることをDirac行列で計算できる
  - 正エネルギーと時間反転の反ユニタリ性の関係を証明できる
  - 空間反転と時間反転のヘリシティの変化を区別できる
  - 場の電荷共役と粒子空間上の電荷交換を区別しCPTとスピン統計定理の追加仮定を説明できる
  - Weyl収縮、Wigner回転、Diracスピン和、光子偏極を相互に接続できる
definitions:
  - { id: LREP28-DEF-01, name: 反ユニタリ作用素 }
theorems:
  - { id: LREP28-PROP-01, name: Dirac空間での空間反転 }
  - { id: LREP28-PROP-02, name: 正エネルギーの時間反転条件 }
  - { id: LREP28-PROP-03, name: 離散操作によるヘリシティの変化 }
canonical_examples:
  - Weyl列の鏡映
  - 正エネルギーの時間発展と複素共役
  - スピン1/2の時間反転
  - 電荷の交換
