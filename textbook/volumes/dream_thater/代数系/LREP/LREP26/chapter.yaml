official_scope: []
learning_objectives:
  - 場の成分の変換と粒子波束のユニタリ変換を区別できる
  - 静止系の絡作用条件から一般運動量での共変モード係数を構成できる
  - 質量殻積分による波束写像の共変性を証明できる
  - 正質量Diracモードの二次元の像と規格化を検算できる
  - 運動量断面の変更に対して場と波束ノルムが不変であることを示せる
