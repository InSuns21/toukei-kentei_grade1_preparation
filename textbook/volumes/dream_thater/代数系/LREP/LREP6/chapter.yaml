id: LREP6
title: "SU(2)の有限次元既約表現"
volume: "foundations"
status: supplementary
prerequisites:
  - LREP5
official_scope: []
learning_objectives:
  - su2の実Lie環からsl2(C)のH,E,Fを作り交換関係を直接検算できる
  - ウェイトと最高ウェイトベクトルの条件を具体表現で判定できる
  - 昇降公式を導き有限次元性と既約性から最高ウェイトが非負整数であることを証明できる
  - 斉次多項式模型V_nを構成し群法則・微分作用・既約性を証明できる
  - SU2表現とその微分の既約性・同値性を指数写像を使って接続できる
  - 正規直交基底の昇降係数を導き、核元の符号からSO3への降下を判定できる
definitions:
  - { id: LREP6-DEF-01, name: 標準三生成子 }
  - { id: LREP6-DEF-02, name: ウェイトと最高ウェイトベクトル }
  - { id: LREP6-DEF-03, name: 次数nの多項式表現 }
theorems:
