<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" data-layout-lint="strict" role="img" aria-labelledby="title desc"><title id="title">Gauge classes in a plane</title><desc id="desc">In the real slice spanned by e1 and k, two vectors from the origin have the same horizontal component. The dashed vertical segment joining their tips is parallel to k.</desc><defs><marker id="arr" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#334155"/></marker></defs><g fill="none" stroke="#334155" marker-end="url(#arr)"><line x1="74" y1="222" x2="420" y2="222" stroke-width="1.5"/><line x1="74" y1="222" x2="74" y2="30" stroke-width="1.5"/><line x1="74" y1="222" x2="282" y2="222" stroke-width="3.5" data-series-group="representatives" data-series-label="e1"/><line x1="74" y1="222" x2="282" y2="76" stroke-width="2" data-series-group="representatives" data-series-label="shifted"/><line x1="282" y1="222" x2="282" y2="76" stroke-width="2" stroke-dasharray="6 5"/></g><g fill="#334155" font-family="sans-serif" font-size="18"><text x="48" y="32">k</text><text x="426" y="228">e₁</text><text x="45" y="245">0</text><text x="241" y="247">e₁</text><text x="291" y="69">e₁ + ak</text><text x="294" y="152">ak</text></g></svg>
