id: LREP4
title: "直和・テンソル積・双対表現"
volume: "foundations"
status: supplementary
prerequisites:
  - LREP3
  - LA3E
official_scope: []
learning_objectives:
  - 群表現の直和を定義して群法則と不変部分空間を計算できる
  - テンソル積表現の群法則・次元とLie環への微分公式を証明できる
  - 双対表現で逆元と転置が必要な理由を評価の不変性から証明できる
  - 複素共役表現と双対表現を区別し、不変Hermite内積の下での同値を示せる
  - VテンソルV双対と自己準同型の同変同型と固定テンソルを構成できる
  - 不変双線形形式を双対への絡作用素として説明し、epsilonの不変性を二次元行列で検算できる
