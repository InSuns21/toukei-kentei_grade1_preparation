id: LREP13
title: "Lorentz不変収縮"
volume: "foundations"
status: supplementary
prerequisites:
  - LREP12
official_scope: []
learning_objectives:
  - 左右の交代収縮の保存と一意性を示し混合収縮との違いを説明できる
  - 四元ベクトルのMinkowski内積を行列収縮で計算できる
  - Weyl列から二階テンソルを構成し完全収縮を検算できる
  - 空間反転による左右交換を導出し単独のWeyl表現が閉じないことを示せる
