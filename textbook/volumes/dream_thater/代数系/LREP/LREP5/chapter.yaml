id: LREP5
title: "SU(2)からSO(3)への二重被覆"
volume: "foundations"
status: supplementary
prerequisites:
  - LREP4
official_scope: []
learning_objectives:
  - Pauli行列でR3を跡零Hermite行列と同一視し、内積・行列積の公式を検算できる
  - SU(2)の共役作用からSO(3)の滑らかな群準同型を構成し、長さと向きの保存を証明できる
  - 軸角表示とRodrigues公式から像がSO(3)全体であることを示せる
  - 共役作用の核が{I,-I}であることを行列計算で示し、各回転の持ち上げを二つと証明できる
  - 微分の同型とコンパクト性から局所二枚の被覆条件を確認できる
  - 2pi回転による符号変化と標準表現・テンソル二乗の降下の違いを判定できる
definitions:
  - { id: LREP5-DEF-01, name: Pauli行列と三次元の行列模型 }
  - { id: LREP5-DEF-02, name: 共役による三次元作用 }
theorems:
