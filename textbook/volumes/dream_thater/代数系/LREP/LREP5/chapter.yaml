  - { id: LREP5-PROP-01, name: 軸角表示と三次元回転 }
  - { id: LREP5-THM-02, name: 像と核 }
  - { id: LREP5-THM-03, name: SU(2)からSO(3)への二重被覆 }
  - { id: LREP5-COR-01, name: 回転群の商表示 }
  - { id: LREP5-PROP-02, name: 2π回転と表現の降下 }
canonical_examples:
  - Pauli行列と跡零Hermite行列の実三次元対応
  - z軸回転の対角SU2行列による共役
  - 軸角表示とRodrigues公式
  - SU2のS3パラメータと局所二重被覆
  - 2pi回転で符号反転する二成分標準表現
