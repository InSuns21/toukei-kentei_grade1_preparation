official_scope: []
learning_objectives:
  - 左右Weyl表現の作用と回転制限を計算し複素線形非同値性を示せる
  - 複素共役と双対を区別し交代形式で添字を上げ下げできる
  - 共役空間と右Weyl空間の絡同型と反線形対応を示せる
  - 二添字行列から四元ベクトルを復元してLorentz共変性と実条件を検算できる
