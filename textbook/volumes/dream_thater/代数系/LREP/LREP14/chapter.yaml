id: LREP14
title: "Clifford代数の構成"
volume: "foundations"
status: supplementary
prerequisites:
  - LREP13
official_scope: []
learning_objectives:
  - テンソル代数の両側イデアルによる商としてClifford代数を構成できる
  - 二乗条件と反交換関係の同値性を証明し基底語を整列できる
  - Clifford代数の普遍性を証明し行列への準同型を構成できる
  - Minkowski符号での四次行列模型を検算し跡を使って16次元性を証明できる
definitions:
  - { id: LREP14-DEF-01, name: テンソル代数 }
  - { id: LREP14-DEF-02, name: Clifford代数 }
