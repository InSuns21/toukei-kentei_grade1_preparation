  - { id: LREP14-THM-01, name: Clifford代数の普遍性 }
  - { id: LREP14-PROP-02, name: 順序付きClifford単項式による生成 }
  - { id: LREP14-THM-02, name: 四次元複素Clifford代数の行列模型 }
canonical_examples:
  - 一次元時間方向の商代数
  - 順序付き基底語の整列
  - 四次元Minkowski空間の光的ベクトルの行列
