id: "ANT3"
title: "Dirichlet文字・Gauss和・Dirichlet L関数"
volume: "foundations"
status: supplementary
prerequisites:
  - ANT2
  - NT2
  - NT3
official_scope: []
learning_objectives:
  - Dirichlet文字・主文字・原始文字の定義を確認し有限な単数群の例を構成できる
  - 有限可換群の指標の分離と直交関係を証明し剰余類指示関数を導出できる
  - 原始性がGauss変換へ及ぼす役割を証明しGauss和の絶対値を直交性から導出できる
  - Dirichlet L関数の絶対収束、Euler積と右半平面での非零性を証明できる
  - 非主L関数の正則延長と主L関数の単純極をAbelの部分和から説明できる
  - L(1,chi)の存在と非零性を区別しDirichletの定理の未証明の核心を特定できる
