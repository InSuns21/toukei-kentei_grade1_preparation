  - ANT5-EULER-LOG-DERIVATIVE
  - ANT5-PRIME-POWER-ERROR
  - ANT5-THETA-PI-ABEL
  - ANT5-MELLIN-SUM-EXCHANGE
  - ANT5-ERROR-ZERO-FREE
