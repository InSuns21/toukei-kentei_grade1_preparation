id: "ANT6"
title: "Re s=1の零点不存在と素数定理"
volume: "foundations"
status: supplementary
prerequisites:
  - ANT5
  - CA12
  - NT8
  - ODE5
official_scope: []
learning_objectives:
  - Euler積に三角多項式の非負性を適用しζの境界正値不等式を導出できる
  - ζの1+itにおける零点を仮定して位数と極の比較から矛盾を導ける
  - Newman型複素Tauber補題を輪郭積分と境界評価から証明できる
  - ψのMellin型積分をLaplace変換へ変換し虚軸上の正則延長を示せる
  - 積分収束とψの単調性からψ(x)~xを導ける
  - 素数冪誤差と部分和公式からπ(x)~x/log xを再構成できる
  - 境界零点不存在と零点なし帯域・冪型誤差評価との違いを説明できる
definitions: []
theorems:
  - { id: ANT6-LEM-01, name: ζの三項正値不等式 }
  - { id: ANT6-THM-01, name: Re s=1上のζの零点不存在 }
  - { id: ANT6-LEM-02, name: Newman型の複素Tauber補題 }
  - { id: ANT6-PROP-01, name: ψの正規化誤差のLaplace変換 }
  - { id: ANT6-THM-02, name: Chebyshevのψ関数の素数定理 }
  - { id: ANT6-THM-03, name: 素数定理の解析的証明 }
canonical_examples:
  - 三項三角多項式の平方への分解
  - 零点位数mによる4m-3の指数比較
  - Laplace変換の極の相殺
  - f(u)=exp(-u)によるTauber補題の検算
  - 短区間積分の収束だけでは点ごとの収束が出ない反例
problem_patterns:
  - ANT6-POSITIVITY
  - ANT6-ZERO-ORDER
  - ANT6-LAPLACE-SUBSTITUTION
  - ANT6-POLE-CANCELLATION
  - ANT6-NEWMAN-CONTOUR
  - ANT6-LOCAL-OSCILLATION
  - ANT6-PSI-TO-PI
