  - { id: IWA18-DEF-03, name: "局所条件付きSelmer群" }
  - { id: IWA18-DEF-04, name: "楕円曲線の有限係数Selmer群とTate–Shafarevich群" }
  - { id: IWA18-DEF-05, name: "円分塔のp無限Selmer群" }
  - { id: IWA18-DEF-06, name: "離散pべきねじれ群のPontryagin双対" }
  - { id: IWA18-DEF-07, name: "連続2次群コホモロジー" }
theorems:
  - { id: IWA18-THM-01, name: "楕円曲線のKummer完全列" }
  - { id: IWA18-THM-02, name: "有限係数Selmer完全列" }
  - { id: IWA18-THM-03, name: "離散pべきねじれ群の双対完全性" }
  - { id: IWA18-PROP-04, name: "Selmer双対の不変元と商の対応" }
  - { id: IWA18-THM-05, name: "Selmer双対の有限生成判定" }
  - { id: IWA18-THM-06, name: "Poitou–Tate双対の核の対応" }
