id: IWA18
title: "Selmer群とPontryagin双対"
volume: "foundations"
status: supplementary
prerequisites:
  - IWA6
  - IWA9
  - IWA12
  - EC4
  - EC6
  - EC9
official_scope: []
learning_objectives:
  - 連続コサイクルとコバウンダリを計算して制限写像を作る
  - Kummer完全列と局所条件から有限係数Selmer完全列を証明する
  - 係数方向の包含と塔の制限を区別しp無限Selmer群を構成する
  - Pontryagin双対の完全性と反変作用を証明する
  - 不変元とT商の対応から有限生成性とねじれ性を区別する
  - 有限係数Poitou–Tate双対の局所核を識別して適用する
