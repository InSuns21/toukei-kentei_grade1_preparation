id: "IWA9"
title: "分岐条件と無分岐最大p拡大"
volume: "foundations"
status: supplementary
prerequisites:
  - IWA8
official_scope: []
learning_objectives:
  - Hilbert類体のp部分から最大無分岐アーベルp拡大を構成しArtin同型と最大性を証明できる
  - S外で非分岐な最大アーベルpro-p拡大と全素点で無分岐な拡大を惰性群商で区別できる
  - S整数環の類群を素イデアル類で割った商として証明し完全分解と分岐許容を区別できる
  - 円分塔の完全分岐と非分岐基礎体変更からHilbert p類体の塔を構成できる
  - X_inftyを無分岐アーベルpro-p拡大のGalois群として定義し類群逆極限のノルムと制限の対応を導ける
  - Delta指標射影と局所惰性群の商が可換である条件を証明できる
  - 自明な有限係数のH^1に対する無分岐局所条件を定義し類群の文字との同型を証明できる
  - coinvariants比較・非可換p拡大・一般のSelmer群をこの講の結論と混同しない
