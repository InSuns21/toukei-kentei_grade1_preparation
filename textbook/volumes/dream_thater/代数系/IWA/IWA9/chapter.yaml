  - { id: IWA9-DEF-03, name: S整数環の類群とp分解条件 }
  - { id: IWA9-DEF-04, name: 無分岐岩澤加群 }
  - { id: IWA9-DEF-05, name: 無分岐な一次コホモロジー局所条件 }
theorems:
  - { id: IWA9-THM-01, name: 無分岐アーベルp拡大と類群のp部分 }
  - { id: IWA9-PROP-01, name: 局所惰性群で割ると類群が現れる }
  - { id: IWA9-PROP-02, name: S整数環への局所化と類群の商 }
  - { id: IWA9-THM-02, name: 類群逆極限のGalois表示 }
  - { id: IWA9-PROP-03, name: 指標射影と局所条件の両立 }
  - { id: IWA9-PROP-04, name: 無分岐文字は類群の文字に一致する }
canonical_examples:
