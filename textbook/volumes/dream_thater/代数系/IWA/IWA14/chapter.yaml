learning_objectives:
  - Bernoulli数と多項式を生成関数から計算できる
  - 多項式の分布公式を係数比較から証明できる
  - Bernoulli分布の正則化と整数値測度の条件を確認できる
  - 正則化測度の積分公式を一様誤差評価から証明できる
  - Kummer合同の整数性と補助因子を除く条件を説明できる
  - 合同から固定剰余類上の連続補間を構成できる
