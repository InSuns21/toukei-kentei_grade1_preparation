official_scope: []
learning_objectives:
  - 無分岐岩澤加群の指標成分と解析側の反射指標を対応させる
  - 円分座標の反転置換を導出し環自己同型と不変量保存を証明する
  - 円分岩澤主予想の仮定と特徴イデアルの等式を正確に述べる
  - 自明成分の極と奇数番号の枝の消失を区別する
  - 補間値から成分の有限性と岩澤不変量を判定する
  - 特徴イデアルの限界と両方向の整除の必要性を説明する
