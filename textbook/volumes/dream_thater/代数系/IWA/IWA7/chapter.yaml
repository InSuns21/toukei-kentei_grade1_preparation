  - { id: IWA7-PROP-03, name: 初等加群の成長公式 }
  - { id: IWA7-THM-01, name: Iwasawaの類数成長公式 }
  - { id: IWA7-PROP-04, name: 成長差からμとλを読む }
  - { id: IWA7-THM-02, name: Ferrero–Washingtonのμ=0定理 }
canonical_examples:
  - 3進のω_nと初等加群のcoinvariants
  - T+3とTによる有限性の対照
  - p=2でT+4とT+2の違い
  - p二乗因子と二重distinguished因子と有限群の合成
