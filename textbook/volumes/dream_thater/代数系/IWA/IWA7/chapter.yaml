id: "IWA7"
title: "類数成長公式とμ不変量の役割"
volume: "foundations"
status: supplementary
prerequisites:
  - IWA6
official_scope: []
learning_objectives:
  - 有限層のp部分類群と逆極限加群を定義しcoinvariantsと区別できる
  - ω_n=(1+T)^{p^n}-1の次数とp冪因子の位数公式を証明できる
  - distinguished多項式とω_nが互いに素な場合の線形成長を終結式と付値から証明できる
  - 初等Λ加群のμp^n+λn+νを導出し有限擬零部分と共通因子の効果を判定できる
  - 類数成長の算術的定理と代数的模型の適用条件を分離して述べられる
  - Ferrero–Washingtonのμ消失定理のAbel数体・円分Z_p拡大の仮定を明記できる
  - 連続層の指数差からμとλを読める
definitions:
  - { id: IWA7-DEF-01, name: 有限層作用素とcoinvariants }
theorems:
  - { id: IWA7-PROP-01, name: p冪因子の位数成長 }
