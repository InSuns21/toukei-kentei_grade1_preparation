  - { id: IWA5-PROP-02, name: 擬零と有限性 }
  - { id: IWA5-PROP-03, name: pTの商加群の擬同型 }
  - { id: IWA5-PROP-04, name: 擬同型の局所判定 }
  - { id: IWA5-THM-01, name: 有限生成torsion岩澤加群の構造定理 }
  - { id: IWA5-PROP-05, name: 有限なT商からtorsionを導く }
canonical_examples:
  - R/(T)とRのtorsion性の比較
  - R/(p,T)とR/(p,T^2)の擬零性
  - R/(pT)からR/(p)とR/(T)への単射と有限余核
  - 3成分の直和を用いた擬同型の核・余核と非同型性
