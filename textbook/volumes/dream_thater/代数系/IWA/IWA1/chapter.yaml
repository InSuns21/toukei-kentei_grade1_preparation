id: "IWA1"
title: "p進数から無限拡大へ：なぜ塔を作るか"
volume: "foundations"
status: supplementary
prerequisites:
  - ANF22
official_scope: []
learning_objectives:
  - Z_pの有限商と閉部分群を、p進位相・付値から証明して分類できる
  - Z_p拡大の有限層を固定体で構成し、一意性と次数を証明できる
  - 有限Galois群の制限写像から無限Galois群の逆極限を構成・証明できる
  - 位相的生成元と普通の生成元の違いを説明し単元判定で計算できる
  - p=3の円分第一層と分岐・類群の問いを区別できる
