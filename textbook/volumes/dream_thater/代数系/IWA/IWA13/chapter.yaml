id: "IWA13"
title: "p進測度・積分とIwasawa代数"
volume: "foundations"
status: supplementary
prerequisites:
  - IWA12
  - F0-00P1
  - F0-02C2
official_scope: []
learning_objectives:
  - p進分布の有限層整合関係とZ_p値測度を具体例で確認できる
  - 局所定数関数から連続関数へ積分を一意に延長し作用素評価を証明できる
  - 測度と連続Z_p線形汎関数の双方向の対応を証明できる
  - 畳み込みの分布関係と積分公式を有限層から証明できる
  - 測度環から完備群環・岩澤代数への環同型を構成できる
  - 二項式モーメントの冪級数と岩澤代数の積を対応させられる
  - p進Mellin変換を連続指標で定義し評価公式を計算できる
  - 一様なQ_p値分布が有界測度にならない理由を説明できる
