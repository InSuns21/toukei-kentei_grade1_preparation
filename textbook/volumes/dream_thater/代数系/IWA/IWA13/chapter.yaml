  - { id: IWA13-PROP-01, name: 畳み込みの整合性と積分公式 }
  - { id: IWA13-THM-03, name: 測度環と岩澤代数 }
  - { id: IWA13-THM-04, name: 二項式変換と岩澤代数の積 }
  - { id: IWA13-THM-05, name: Mellin変換の評価公式 }
  - { id: IWA13-PROP-02, name: 平行移動不変な有界Q_p値測度 }
