id: "CAG1-05"
title: "GAGA I――連接層コホモロジーの比較"
volume: "foundations"
status: supplementary
prerequisites:
  - CAG1-04
official_scope: []
learning_objectives:
  - 射影的な複素スキームと代数的連接層について自然な全次数コホモロジー比較写像を構成し、射影性・連接性の役割を説明できる
  - 射影空間の解析的Stein被覆から高次消滅を導き、代数的なねじり層の有限直和による全射表示を使える
  - ねじり層の比較を初期条件とする降下帰納で、長完全列の全射性と単射性を別々に証明できる
  - 射影的閉埋込みの直像と解析化の交換を確認し、特異・非被約なXにも比較を移せる
  - 具体的な層の短完全列・連結写像・零次切断を両側で計算し、非固有なアフィン例との違いを説明できる
definitions:
