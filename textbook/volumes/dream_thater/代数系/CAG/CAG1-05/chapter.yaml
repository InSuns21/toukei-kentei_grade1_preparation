  - { id: CAG1-05-LEM-02, name: ねじり層の有限直和による全射表示 }
  - { id: CAG1-05-LEM-03, name: 一次数降下の全射・単射補題 }
  - { id: CAG1-05-THM-01, name: GAGA I――連接層コホモロジーの比較 }
  - { id: CAG1-05-PROP-01, name: 閉埋込みの直像と解析化の交換 }
canonical_examples:
  - P1上のO(-2)の一次コホモロジー比較
  - P1の長さ2の非被約点の構造層と境界写像
  - P2内の射影直線の構造層とその高次消滅
  - アフィン直線のOに対するH0比較の失敗
