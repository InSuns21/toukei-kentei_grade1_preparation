id: "EC8"
title: "Hasse評価・拡大体上の点数・有限体ゼータ関数"
volume: "foundations"
status: supplementary
prerequisites:
  - EC7
  - EC4
official_scope: []
learning_objectives:
  - 同種写像の次数の二次性とFrobeniusの固定点公式からHasse評価を証明できる
  - 正整数係数の次数二次形式の非負性を用いて判別式の符号を説明できる
  - 次数の乗法性と二次性からFrobeniusの二次関係式を証明できる
  - Frobeniusの根の絶対値と拡大体上の点数の漸化式を導ける
  - 有限体ゼータ関数の指数型定義を有理関数へ変形できる
  - 標数2・3・5の例で直接計数と公式を突き合わせられる
definitions:
  - { id: EC8-DEF-01, name: 同種写像の次数によるトレース }
