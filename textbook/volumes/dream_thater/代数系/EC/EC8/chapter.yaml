  - { id: EC8-LEM-01, name: 次数ノルムによる二次消去恒等式 }
  - { id: EC8-THM-02, name: Frobeniusの二次関係式 }
  - { id: EC8-THM-03, name: 拡大体上の点数公式 }
  - { id: EC8-THM-04, name: 楕円曲線ゼータ関数の有理表示 }
canonical_examples:
  - F3上のy²=x³+x+1のF9への拡大と16点の直接計数
  - F5上のy²=x³+x+1のa5=-3とF25上の27点
  - F2上のy²+y=x³+xでa2=-2とF4上の5点
