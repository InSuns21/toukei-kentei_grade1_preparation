id: "EC7"
title: "有限体の点数とFrobenius"
volume: "foundations"
status: supplementary
prerequisites:
  - EC4
  - FLD3
official_scope: []
learning_objectives:
  - 有限体の有理点と代数閉包上の点を区別し無限遠点を含めて数えられる
  - 標数2・3・5で非特異性と点数を確認し有限群の群則を計算できる
  - q-Frobeniusを係数体の不変性から定義し曲線の準同型と証明できる
  - Frobeniusの次数qと非分離性を関数体から導ける
  - Frobenius固定点がE(F_q)と一致することを証明できる
  - 1-Frobeniusが分離的で次数が有限体の点数に等しいことを証明できる
  - 点数差a_qを計算しEC8の次数二次形式の入力を説明できる
definitions:
  - { id: EC7-DEF-01, name: 有限体上の有理点と点数 }
  - { id: EC7-DEF-02, name: 楕円曲線のq-Frobenius }
  - { id: EC7-DEF-03, name: 有限体上の点数差 }
theorems:
