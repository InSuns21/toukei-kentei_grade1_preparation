  - { id: EC7-PROP-02, name: Frobeniusは原点を保つ同種写像 }
  - { id: EC7-THM-01, name: Frobeniusの次数と非分離性 }
  - { id: EC7-THM-02, name: 有理点とFrobenius固定点 }
  - { id: EC7-PROP-03, name: 点数と差の射の次数 }
canonical_examples:
  - F2上のy²+y=x³+xで全5点と位数5の群を照合
  - F3上のy²=x³+x+1で4点と位数4の生成元を確認
  - F5上のy²=x³+x+1で9点と位数9の生成元を確認
  - F2上のy²+xy=x³+1で非特異性と位数4を確認
