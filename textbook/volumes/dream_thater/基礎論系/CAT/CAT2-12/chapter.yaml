id: "CAT2-12"
title: "一般随伴関手定理"
volume: "foundations"
status: supplementary
prerequisites:
  - CAT2-10
  - CAT2-11
  - CAT2-04
  - SET2
official_scope: []
learning_objectives:
  - 弱始対象集合と始対象の違いを射の存在・一意性で説明し、積から弱始対象を一つ作れる
  - 局所小かつ完備な圏で弱始対象集合から始対象を構成する証明を、全自己射の等化子・引き込み・任意の平行射の等化子まで再導出できる
  - 解集合条件を各 d についての具体的な射の因子分解として述べ、comma圏の弱始対象集合と同値であることを確認できる
  - 極限を保存する関手に対して comma圏が完備であることを、極限錐と F の保存性を使い証明できる
  - Freydの一般随伴関手定理の必要十分条件とその論証を述べ、普遍射から左随伴の関手性・自然性まで組み立てられる
  - 冪集合の順序圏で随伴を具体計算し、極限保存・解集合条件・完備性の各役割を識別できる
  - 大きな順序圏の反例で解集合条件が欠けると結論が破れる仕組みを説明できる
definitions:
  - { id: CAT2-12-DEF-01, name: 弱始対象集合 }
  - { id: CAT2-12-DEF-02, name: 解集合条件 }
theorems:
  - { id: CAT2-12-THM-01, name: 弱始対象集合から始対象を得る定理 }
  - { id: CAT2-12-PROP-01, name: 解集合条件とcomma圏の弱始対象集合 }
  - { id: CAT2-12-PROP-02, name: 極限保存関手のcomma圏の完備性 }
  - { id: CAT2-12-THM-02, name: Freydの一般随伴関手定理 }
  - { id: CAT2-12-PROP-03, name: 小さい圏での解集合条件の自動成立 }
  - { id: CAT2-12-PROP-04, name: 順序圏での一般随伴関手定理の適用 }
  - { id: CAT2-12-PROP-05, name: 解集合条件の必要性を示す反例 }
canonical_examples:
  - 二点鎖における弱始対象集合と始対象の区別
  - 恒等関手の解集合条件とcomma圏の始対象
  - 冪集合における A との和集合関手と差集合左随伴
  - A との共通部分関手が空極限を保存しない例
  - 順序数の反対圏から一対象圏への関手と解集合条件の破綻
