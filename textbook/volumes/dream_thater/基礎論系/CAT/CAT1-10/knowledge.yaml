  - id: category.category-of-elements
    name: 元の圏
    kind: definition
    introduction: formal
    introduction_aliases: ["定義（元の圏）"]
    requires: [category.covariant-functor, category.contravariant-functor]
  - id: category.universal-elements-initial-terminal
    name: 普遍元と始対象・終対象
    kind: proposition
    introduction: formal
    introduction_aliases: ["命題（普遍元と始対象・終対象）"]
    requires: [category.category-of-elements, category.covariant-universal-element, category.contravariant-universal-element, category.initial-object, category.terminal-object]
  - id: category.representing-object-uniqueness
    name: 普遍元付き表現対象の一意性
    kind: theorem
