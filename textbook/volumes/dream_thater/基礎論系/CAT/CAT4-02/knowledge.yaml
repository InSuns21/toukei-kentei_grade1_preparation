    name: 形式的テンソル式と語
    kind: definition
    introduction: formal
    introduction_aliases: ["定義（形式的テンソル式と語）"]
    requires: [category.monoidal-category]
  - id: category.tensor-reduction-normal-form
    name: 書換え、正規形、正規化射
    kind: definition
    introduction: formal
    introduction_aliases: ["定義（書換え、正規形、正規化射）"]
    requires: [category.formal-tensor-expression, category.monoidal-category]
  - id: category.tensor-normalization-termination
    name: 正規化の停止と正規形の対象
    kind: proposition
    introduction: formal
