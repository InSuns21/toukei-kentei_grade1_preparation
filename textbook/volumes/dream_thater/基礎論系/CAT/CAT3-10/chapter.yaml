  - { id: CAT3-10-THM-02, name: 密度定理とYonedaに沿う左Kan拡張 }
  - { id: CAT3-10-THM-03, name: Yonedaに沿う左Kan拡張の計算式 }
  - { id: CAT3-10-PROP-02, name: 余極限保存関手の表現可能対象による決定 }
canonical_examples:
  - 矢印圏の元の圏と標準余錐
  - 離散二対象前層の表現可能前層からの余積表示
  - 二対象矢印圏のcoend商の具体的計算
  - 離散圏に沿う左Kan拡張の要素表示
  - 余極限を保存しない直積二乗関手の反例
