id: "CAT3-10"
title: "密度定理とKan拡張"
volume: "foundations"
status: supplementary
prerequisites:
  - CAT1-12
  - CAT2-07
  - CAT2-11
  - CAT3-07
  - CAT3-09
official_scope: []
learning_objectives:
  - 前層の元の圏の対象・射・合成と小ささを定義から検証できる
  - 元に付随する表現可能前層の標準余錐を自然性・余錐条件とともに構成できる
  - 密度定理の余極限から前層への評価写像と逆写像を作り、well-defined性と二変数の自然性を証明できる
  - coend表示の生成関係と反変co-Yoneda公式を実例で計算できる
  - Yoneda埋め込みに沿う左Kan拡張を元の圏の余極限として構成できる
  - 余極限保存関手を表現可能対象上の値から復元し、保存仮定の必要性を反例で説明できる
definitions:
  - { id: CAT3-10-DEF-01, name: 前層の元の圏 }
  - { id: CAT3-10-DEF-02, name: 元に付随する標準余錐 }
