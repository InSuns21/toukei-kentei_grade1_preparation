  - id: category.density-colimit-determination
    name: 余極限保存関手の表現可能対象による決定
    kind: proposition
    introduction: formal
    introduction_aliases: ["命題（余極限保存関手の表現可能対象による決定）"]
    requires: [category.yoneda-density, category.yoneda-free-extension]
