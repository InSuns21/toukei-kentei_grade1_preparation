chapter: CAT3-10
scope: dream-theater
coverage: complete
prerequisites:
  - CAT1-12
  - CAT2-07
  - CAT2-11
  - CAT3-07
  - CAT3-09

concepts:
  - id: category.presheaf-elements-category
    name: 前層の元の圏
    kind: definition
    introduction: formal
    introduction_aliases: ["定義（前層の元の圏）"]
    requires: [category.set-valued-presheaf]
  - id: category.presheaf-element-cocone
    name: 元に付随する標準余錐
    kind: definition
    introduction: formal
    introduction_aliases: ["定義（元に付随する標準余錐）"]
    requires: [category.presheaf-elements-category, category.contravariant-yoneda-lemma]
  - id: category.yoneda-density
    name: Yonedaの密度定理
    kind: theorem
    introduction: formal
    introduction_aliases: ["定理（Yonedaの密度定理）"]
