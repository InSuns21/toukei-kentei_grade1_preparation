  - { id: CAT4-05-THM-02, name: 反復カリー化 }
  - { id: CAT4-05-THM-03, name: Cartesian閉圏と閉モノイダル構造 }
  - { id: CAT4-05-THM-04, name: ベクトル空間の閉構造 }
  - { id: CAT4-05-PROP-02, name: 二元順序圏の指数 }
  - { id: CAT4-05-PROP-03, name: 基点付き集合の反例 }
canonical_examples:
  - 集合の全関数集合を右随伴とする転置・逆転置と自然性の直接検算
  - 有限集合の指数対象の評価と一意性
  - 任意次元のベクトル空間におけるテンソル積と線形写像空間の随伴
  - 二元順序圏の指数表の不等式による検証
  - 基点付き二点集合のHom濃度による非閉性
