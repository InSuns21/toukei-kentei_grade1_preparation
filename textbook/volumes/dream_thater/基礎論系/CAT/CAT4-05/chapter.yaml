id: "CAT4-05"
title: "閉モノイダル圏と Cartesian closed category"
volume: "foundations"
status: supplementary
prerequisites:
  - CAT4-01
  - CAT4-03
  - CAT4-04
  - CAT2-08
  - CAT2-09
  - LA3E
official_scope: []
learning_objectives:
  - 固定した対象Aに対する右随伴(-)⊗Aと内部Hom[A,B]の型を区別し、右閉性の必要条件を記述できる
  - 評価射とカリー化の普遍性を両方向に証明し、二変数の自然性と復元式を検算できる
  - 内部Homの反変・共変性と反復カリー化[A⊗B,C]≅[A,[B,C]]を一意な転置から導ける
  - 指数対象の評価の一意性を確認し、有限積を持つ圏がCartesian閉であることと直積による右閉性の同値を証明できる
  - 集合と有限集合・ベクトル空間・二元順序圏でそれぞれ閉構造を構成し、Cartesian性の違いを説明できる
  - 基点付き集合では指数対象が存在しない理由をHom集合の濃度により示せる
definitions:
  - { id: CAT4-05-DEF-01, name: 右閉モノイダル圏 }
  - { id: CAT4-05-DEF-02, name: 内部Hom }
  - { id: CAT4-05-DEF-03, name: 指数対象 }
  - { id: CAT4-05-DEF-04, name: Cartesian閉圏 }
theorems:
