  - { id: CAT1-03-PROP-04, name: 分裂射の消去律と両側逆の一致 }
  - { id: CAT1-03-PROP-05, name: モノ射・エピ射・同型射は合成で閉じる }
  - { id: CAT1-03-PROP-06, name: 半順序圏のモノ射・エピ射・同型射 }
  - { id: CAT1-03-PROP-07, name: 全射でないモノイドのエピ射 }
