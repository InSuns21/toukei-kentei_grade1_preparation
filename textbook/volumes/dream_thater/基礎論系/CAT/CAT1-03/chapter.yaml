id: "CAT1-03"
title: "同型・モノ射・エピ射"
volume: "foundations"
status: supplementary
prerequisites:
  - CAT1-01
  - CAT1-02
official_scope: []
learning_objectives:
  - 同型射・逆射・同型な対象を二つの合成等式で定義し、逆射の一意性を証明できる
  - モノ射とエピ射の左右消去律を射の向きと全称量化を保って述べられる
  - Set でモノ射と単射、エピ射と全射、同型射と全単射の一致を両方向に証明できる
  - 分裂モノ射と分裂エピ射を区別し、逆射・消去律・合成との関係を証明できる
  - 半順序圏およびモノイドの圏で、モノ射かつエピ射が同型でない例を構成できる
  - モノイド準同型の圏の非全射エピ射を証明し、射のクラスに依存する性質を説明できる
