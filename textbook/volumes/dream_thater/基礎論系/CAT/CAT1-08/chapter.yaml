  - { id: CAT1-08-PROP-03, name: whiskering の自然性 }
  - { id: CAT1-08-PROP-04, name: 水平合成の自然性と結合則 }
  - { id: CAT1-08-PROP-05, name: 水平合成と垂直合成の交換法則 }
canonical_examples:
  - 二対象矢印圏から集合の圏への関手と可換四角形
  - 対角自然変換と射影自然変換の垂直合成
  - 対角自然変換と射影自然変換の水平合成
  - 直積関手間の自然変換と交換法則の座標計算
