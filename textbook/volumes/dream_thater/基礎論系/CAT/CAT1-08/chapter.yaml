id: "CAT1-08"
title: "関手圏と水平・垂直合成"
volume: "foundations"
status: supplementary
prerequisites:
  - CAT1-02
  - CAT1-06
  - CAT1-07
official_scope: []
learning_objectives:
  - 小さい圏と局所小圏の仮定を区別し、関手圏の対象・Hom集合がなぜ構成できるか説明できる
  - 関手圏の恒等自然変換と垂直合成が自然であること、および結合則・単位律を成分ごとに証明できる
  - 矢印圏から集合の圏への関手と可換四角形の対応を具体的に検証できる
  - 自然変換の前後からの whiskering の型と自然性を確認できる
  - 水平合成の二つの成分公式が一致する理由を自然性から導出し、水平合成そのものの自然性を証明できる
  - 水平合成の結合則・恒等変換との関係および垂直合成との交換法則を型付きで証明できる
  - 集合の直積関手による例で二種類の合成を計算し、関手圏のサイズの落とし穴を判別できる
definitions:
  - { id: CAT1-08-DEF-01, name: 関手圏 }
  - { id: CAT1-08-DEF-02, name: 垂直合成 }
  - { id: CAT1-08-DEF-03, name: whiskering }
  - { id: CAT1-08-DEF-04, name: 水平合成 }
theorems:
