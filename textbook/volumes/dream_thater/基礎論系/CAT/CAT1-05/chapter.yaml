id: "CAT1-05"
title: "部分圏・積圏・スライス圏"
volume: "foundations"
status: supplementary
prerequisites:
  - CAT1-01
  - CAT1-02
  - CAT1-03
  - CAT1-04
official_scope: []
learning_objectives:
  - 部分圏・充満部分圏・広い部分圏の条件をHomと合成から判定し、単なる射の抜き出しが失敗する例を示せる
  - 二つの圏の積圏を構成し、恒等射・合成・結合則・局所小性を成分ごとに検証できる
  - 積圏における同型・モノ射・エピ射の成分ごとの判定を証明できる
  - 基底対象への射からスライス圏を構成し、可換三角形・恒等射・合成の条件を検証できる
  - 余スライス圏を双対的に構成し、スライス圏の終対象と余スライス圏の始対象を証明できる
  - 集合と半順序圏の例で三つの構成を比較し、射の存在・一意性・サイズ条件を確かめられる
definitions:
  - { id: CAT1-05-DEF-01, name: 部分圏・充満部分圏・広い部分圏 }
  - { id: CAT1-05-DEF-02, name: 積圏 }
  - { id: CAT1-05-DEF-03, name: スライス圏 }
  - { id: CAT1-05-DEF-04, name: 余スライス圏 }
theorems:
  - { id: CAT1-05-PROP-01, name: 部分圏の構成と充満部分圏 }
  - { id: CAT1-05-PROP-02, name: 積圏の公理と局所小性 }
  - { id: CAT1-05-PROP-03, name: 積圏の同型・モノ射・エピ射 }
  - { id: CAT1-05-PROP-04, name: スライス圏の公理と局所小性 }
  - { id: CAT1-05-PROP-05, name: スライス圏と余スライス圏の特別な対象 }
  - { id: CAT1-05-PROP-06, name: 余スライス圏と反対圏 }
canonical_examples:
  - 三点鎖の充満部分圏と非充満な広い部分圏
  - 一対象圏の部分圏と部分モノイド
  - 二点鎖どうしの積圏の四点順序
  - 集合から基底集合への写像とファイバーを保つ射
  - 半順序圏の主下集合・主上集合としてのスライス・余スライス圏
