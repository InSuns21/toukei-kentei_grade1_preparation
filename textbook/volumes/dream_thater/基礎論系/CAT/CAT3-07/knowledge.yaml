  - id: category.left-kan-comma-transport
    name: comma添字の移送と左Kan関手の構成
    kind: proposition
    introduction: formal
    introduction_aliases: ["命題（comma添字の移送と関手の構成）"]
    requires: [category.pointwise-left-kan-extension, category.colimit]
  - id: category.pointwise-left-kan-universality
    name: 点ごとの左Kan拡張の公式と普遍性
