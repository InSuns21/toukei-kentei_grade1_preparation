  - { id: CAT2-03-PROP-02, name: モノ射の引き戻し }
  - { id: CAT2-03-PROP-03, name: 対角射の引き戻しによる等化子 }
canonical_examples:
  - 有限集合の偶奇判定で作る等化子
  - 非空集合の圏で等化子が存在しない例
  - 整数群の偶数部分群としての等化子
  - 部分空間位相による等化子の連続な媒介射
  - 有限集合のファイバー積と射影
  - 群の合同条件によるファイバー積
  - 二乗写像に沿う位相空間の引き戻しと同相
  - モノ射を欠いた引き戻しの射影が非モノ射となる例
