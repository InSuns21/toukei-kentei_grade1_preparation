id: "CAT2-03"
title: "等化子と引き戻し"
volume: "foundations"
status: supplementary
prerequisites:
  - CAT2-02
  - GRP2
  - TOP1
official_scope: []
learning_objectives:
  - 平行射の等化子の条件と任意の媒介射の存在一意性を述べられる
  - 等化子のモノ射性と同型を除いた一意性を普遍性から証明できる
  - 集合・群・位相空間の等化子を構成し、群演算と連続性まで検算できる
  - 引き戻しの可換条件と媒介射の存在一意性を定義し、集合のファイバー積を直接検算できる
  - 二項積と等化子から引き戻しを構成し、射影の等式で一意性まで証明できる
  - 群と位相空間の引き戻しで演算・位相の整合性と普遍性を確認できる
  - モノ射の引き戻しのモノ射性を証明し、仮定を落とした反例を説明できる
  - 対角射の引き戻しで等化子を構成し、二つの普遍構成の関係を再現できる
definitions:
  - { id: CAT2-03-DEF-01, name: 等化子 }
  - { id: CAT2-03-DEF-02, name: 引き戻し }
theorems:
  - { id: CAT2-03-PROP-01, name: 等化子の一意性とモノ射性 }
