id: "CAT1-02"
title: "小さい圏と局所小圏"
volume: "foundations"
status: supplementary
prerequisites:
  - CAT1-01
  - SET1
  - F0-00A1D
official_scope: []
learning_objectives:
  - 対象・射全体が集合であることと各Homが集合であることを区別できる
  - 小さい圏は局所小であること、および対象が集合なら逆向きの含意が成り立つことを集合公理から証明できる
  - 半順序集合と結合的な単位元付き演算から圏を作り、全公理と小ささを検証できる
  - Set のHom集合を写像グラフとして構成し、Setが局所小だが小さくないことを証明できる
  - 対象数が有限でもHomが真の類になり得ることを具体例で検証できる
  - 全有限集合の圏と一対象の大きなHomの圏を比較し、誤ったサイズ推論を反証できる
