  - { id: CAT2-05-PROP-01, name: 空図式と離散図式の余極限 }
  - { id: CAT2-05-THM-02, name: 集合の余等化子の商構成 }
  - { id: CAT2-05-THM-03, name: 小さい余積と余等化子による余極限の構成 }
  - { id: CAT2-05-THM-04, name: 余完備性の存在判定 }
canonical_examples:
  - 一本の矢印図式の余極限と終域対象
  - 空図式の始対象と集合の空集合
  - 同じ元を持つ二集合のタグ付き非交和
  - 最小同値関係に関する有限鎖と商のwell-defined性
  - 小図式の余極限としての非交和の商
  - 有限集合の圏の有限余完備性と可算余積不在
  - 半順序圏での上限と非存在
