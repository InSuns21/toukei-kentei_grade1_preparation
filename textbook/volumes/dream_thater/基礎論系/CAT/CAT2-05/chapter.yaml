id: "CAT2-05"
title: "余極限・始対象・余積・余等化子"
volume: "foundations"
status: supplementary
prerequisites:
  - CAT2-04
official_scope: []
learning_objectives:
  - 小さい図式の余錐・余極限を射の型と向きをそろえて定義し、極限との双対性を説明できる
  - 余極限余錐の脚を保つ一意な同型を普遍性の二方向の適用から構成できる
  - 空図式と離散図式の余極限を始対象・小さい余積として捉え、Setのタグ付き非交和で普遍性を直接証明できる
  - 平行二射の余等化子を定義し、Setで最小同値関係の有限鎖と商のwell-defined性を証明できる
  - 小図式の対象と射で添字を付けた二つの余積から平行二射を型付きで構成できる
  - 余等化子で得た射族が余極限余錐をなすことを整合性・媒介射の存在一意性から示せる
  - 余完備性と有限余完備性の存在判定を双方向に証明できる
  - 集合の圏の余完備性と有限集合の圏の有限余完備性・非余完備性を区別して示せる
  - 順序圏の余極限が上限となることと無限図式の非存在例を説明できる
definitions:
  - { id: CAT2-05-DEF-01, name: 余錐 }
