id: "CAT3-04"
title: "モナド性を判定するための条件"
volume: "foundations"
status: supplementary
prerequisites:
  - CAT3-03
official_scope: []
learning_objectives:
  - 分裂余等化子の四条件を型付きで検証し、余等化子の普遍性と任意の関手による保存を証明できる
  - R-分裂平行二射とその余等化子の創出を定義し、保存との違いを具体例で説明できる
  - 同型を反映する条件を説明し、Eilenberg–Moore忘却関手で逆代数射を構成できる
  - Eilenberg–Moore忘却関手による分裂余等化子の創出を、代数構造の存在・一意性と普遍性まで証明できる
  - 余単位の標準平行二射と代数射の転置判定から、比較関手の充満忠実性の必要十分条件を証明できる
  - 第二射影の随伴で比較関手と余単位の余等化子条件が失敗する仕組みを説明できる
definitions:
  - { id: CAT3-04-DEF-01, name: 分裂余等化子 }
  - { id: CAT3-04-DEF-02, name: R-分裂平行二射 }
  - { id: CAT3-04-DEF-03, name: R-分裂余等化子の創出 }
  - { id: CAT3-04-DEF-04, name: 同型を反映する関手 }
theorems:
  - { id: CAT3-04-PROP-01, name: 分裂余等化子の普遍性と絶対保存性 }
  - { id: CAT3-04-PROP-02, name: 代数忘却関手は同型を反映する }
  - { id: CAT3-04-THM-01, name: Eilenberg–Moore忘却関手による創出 }
  - { id: CAT3-04-LEM-01, name: 余単位の標準平行二射 }
  - { id: CAT3-04-LEM-02, name: 代数射の転置判定 }
  - { id: CAT3-04-THM-02, name: 比較関手の充満忠実性の判定 }
canonical_examples:
  - 二点集合の分裂余等化子と非分裂余等化子
  - 有限語モナドの代数評価に伴う分裂平行二射
  - Eilenberg–Moore忘却関手が分裂余等化子の代数構造を復元する例
  - 積圏から第二成分への射影と余単位の余等化子条件の失敗
