id: "CAT3-03"
title: "Eilenberg–Moore圏と比較関手"
volume: "foundations"
status: supplementary
prerequisites:
  - CAT3-02
official_scope: []
learning_objectives:
  - モナド代数の単位律・結合律と代数射の可換条件を型付きで検証し、Eilenberg–Moore圏を構成できる
  - 自由代数・忘却関手とそのHom自然全単射を構成し、随伴が元のモナドを誘導することを証明できる
  - 任意の随伴から比較関手を構成し、対象の代数公理と射の可換性を三角恒等式・自然性から証明できる
  - Kleisli圏から自由代数の充満部分圏への完全忠実な関手を導き、全代数との違いを説明できる
  - 有限語モナドの代数とモノイド、例外モナドの代数と指定点集合の対応を計算できる
