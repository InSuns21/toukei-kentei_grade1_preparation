  - { id: CAT1-04-PROP-05, name: 同型射と分裂射の双対性 }
  - { id: CAT1-04-PROP-06, name: 始対象と終対象の双対性 }
  - { id: CAT1-04-PROP-07, name: 始対象・終対象の一意同型 }
canonical_examples:
  - 二点鎖と反対順序による反対圏
  - 非可換モノイドの積の順序を逆にする一対象反対圏
  - 集合の包含写像のモノ性と反対圏でのエピ性
  - 空集合と一元集合の始対象・終対象
  - 最小元・最大元と離散圏での存在失敗
