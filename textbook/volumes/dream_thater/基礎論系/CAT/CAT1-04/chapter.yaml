id: "CAT1-04"
title: "反対圏と双対原理"
volume: "foundations"
status: supplementary
prerequisites:
  - CAT1-01
  - CAT1-02
  - CAT1-03
official_scope: []
learning_objectives:
  - 反対圏のHom・恒等射・合成を型付きで定義し、結合則と単位律を証明できる
  - 二重反対圏が元の圏に一致することと小ささ・局所小性が保存されることを検証できる
  - 双対原理を正しい量化範囲で説明し、左右消去律からモノ射とエピ射の対応を導ける
  - 同型射と分裂モノ射・分裂エピ射の双対対応を証明できる
  - 始対象と終対象をHomの一意性で定義し、反対圏での対応と一意同型を証明できる
  - 集合・半順序圏・一対象圏の具体例で射の向きと存在条件を判定できる
