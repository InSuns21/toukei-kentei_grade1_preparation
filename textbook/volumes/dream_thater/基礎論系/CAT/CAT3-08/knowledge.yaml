    introduction: formal
    introduction_aliases: ["定義（右Kan拡張のcomma添字図式）"]
    requires: [category.comma-category, category.covariant-functor, category.limit]
  - id: category.pointwise-right-kan-extension
    name: 点ごとの右Kan拡張の極限構成
    kind: definition
    introduction: formal
    introduction_aliases: ["定義（点ごとの右Kan拡張の極限構成）"]
    requires: [category.right-kan-comma-diagram, category.complete-category, category.right-kan-extension]
  - id: category.right-kan-comma-transport
    name: 添字の引き戻しと右Kan関手
    kind: proposition
    introduction: formal
    introduction_aliases: ["命題（添字の引き戻しと右Kan関手）"]
    requires: [category.pointwise-right-kan-extension, category.limit]
  - id: category.pointwise-right-kan-universality
    name: 点ごとの右Kan拡張の公式と普遍性
    kind: theorem
    introduction: formal
