  - id: category.right-kan-fully-faithful-counit
    name: 充満忠実な関手に沿う右Kan拡張の余単位
    kind: proposition
    introduction: formal
    introduction_aliases: ["命題（充満忠実な関手に沿う右Kan拡張の余単位）"]
    requires: [category.pointwise-right-kan-extension, category.fully-faithful-functor]
  - id: category.right-kan-terminal-obstruction
    name: 終対象がないため右Kan拡張が存在しない例
    kind: proposition
    introduction: formal
    introduction_aliases: ["命題（終対象がないため右Kan拡張が存在しない例）"]
    requires: [category.right-kan-extension, category.terminal-object]
