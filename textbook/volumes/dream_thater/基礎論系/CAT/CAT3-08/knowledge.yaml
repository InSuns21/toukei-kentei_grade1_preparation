chapter: CAT3-08
scope: dream-theater
coverage: complete
prerequisites:
  - CAT1-09
  - CAT2-01
  - CAT2-04
  - CAT2-10
  - CAT3-06
  - CAT3-07

concepts:
  - id: category.right-kan-comma-diagram
    name: 右Kan拡張のcomma添字図式
