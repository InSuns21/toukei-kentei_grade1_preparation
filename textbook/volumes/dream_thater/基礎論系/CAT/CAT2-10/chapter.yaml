  - { id: CAT2-10-THM-02, name: 双対の普遍射と右随伴の同値 }
  - { id: CAT2-10-PROP-03, name: 普遍射の同型一意性 }
  - { id: CAT2-10-THM-03, name: 自由群の普遍射 }
  - { id: CAT2-10-PROP-04, name: 自由加群の普遍射 }
  - { id: CAT2-10-PROP-05, name: 有限集合の包含関手の障害 }
canonical_examples:
