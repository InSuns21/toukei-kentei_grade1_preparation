id: "CAT2-10"
title: "普遍射とcomma圏"
volume: "foundations"
status: supplementary
prerequisites:
  - CAT2-09
  - CAT1-05
  - CAT1-10
  - GRP1
  - MOD1
official_scope: []
learning_objectives:
  - 二つの関手のcomma圏を射の型と可換条件から構成し、恒等射・合成・局所小性を確認できる
  - Gへの普遍射をcomma圏の始対象として特徴づけ、双対の終対象による普遍射と区別できる
  - 各対象で選んだ普遍射から左随伴の対象・射への作用、単位、二変数自然なHom全単射を復元できる
  - 双対の普遍射から右随伴を復元し、単位・余単位との関係を型付きで説明できる
  - 自由群と自由加群の普遍性を具体的に検証し、選び方による同型一意性を説明できる
  - 普遍射が存在しない場合をHom集合の濃度の障害から証明できる
