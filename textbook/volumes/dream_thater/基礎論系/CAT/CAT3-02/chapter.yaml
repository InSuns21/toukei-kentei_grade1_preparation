  - { id: CAT3-02-THM-01, name: Kleisli圏の圏公理 }
  - { id: CAT3-02-THM-02, name: Kleisli随伴 }
  - { id: CAT3-02-PROP-02, name: 有限語のKleisli合成 }
  - { id: CAT3-02-PROP-03, name: 例外モナドと失敗伝播 }
  - { id: CAT3-02-PROP-04, name: 冪集合のKleisli圏と二項関係 }
canonical_examples:
  - 恒等モナドのKleisli圏
  - 有限語の順序付き分岐と空語による消去
  - 例外モナドの成功・失敗と途中失敗の伝播
  - 冪集合の分岐と関係の合成
  - 印付き集合のモナドによる非可換な印の蓄積
