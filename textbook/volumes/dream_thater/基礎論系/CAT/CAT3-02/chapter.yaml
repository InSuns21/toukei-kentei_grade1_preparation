id: "CAT3-02"
title: "Kleisli圏"
volume: "foundations"
status: supplementary
prerequisites:
  - CAT3-01
official_scope: []
learning_objectives:
  - モナドの射 f:A→TB と持ち上げ f^♯:TA→TB の型を区別し、持ち上げの三法則を導出できる
  - Kleisli圏の恒等射・合成を定め、自然性とモナド公理から単位律・結合律を証明できる
  - 自由関手と忘却関手を構成して Kleisli 随伴とそれが誘導する元のモナドを検証できる
  - 有限語モナドの Kleisli 合成を空語を含めて具体計算できる
  - 例外モナドを構成して失敗の伝播と部分写像の合成を説明できる
  - 冪集合モナドの Kleisli 合成を二項関係の合成と対応付けられる
definitions:
  - { id: CAT3-02-DEF-01, name: Kleisli持ち上げ }
  - { id: CAT3-02-DEF-02, name: Kleisli圏 }
theorems:
