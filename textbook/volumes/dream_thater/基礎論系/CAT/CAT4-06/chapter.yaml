id: "CAT4-06"
title: "型付きラムダ計算の圏論的意味"
volume: "foundations"
status: supplementary
prerequisites:
  - CAT2-02
  - CAT4-05
official_scope: []
learning_objectives:
  - 単純型・文脈・型付き項の構文規則と捕獲を避ける代入を具体的に導出できる
  - 外延的βη等式の型・自由変数条件を確認し反例を説明できる
  - Cartesian閉圏で型を対象・文脈を有限積・項を射へ解釈できる
  - 置換補題を構文帰納法で証明しラムダ抽象の場合の自然性を検算できる
  - 積と指数の普遍性からβη等式の健全性を証明できる
  - 項の等式類から構文圏を作り圏公理・終対象・積・指数の普遍性を証明できる
  - 集合・二元順序圏・基点付き集合を通じ閉構造の意味と存在の限界を区別できる
definitions:
  - { id: CAT4-06-DEF-01, name: 単純型 }
  - { id: CAT4-06-DEF-02, name: 単純型付き項と型付け }
  - { id: CAT4-06-DEF-03, name: 捕獲を避ける同時代入 }
  - { id: CAT4-06-DEF-04, name: 外延的βη等式理論 }
  - { id: CAT4-06-DEF-05, name: Cartesian閉圏における項の解釈 }
  - { id: CAT4-06-DEF-06, name: βη構文圏 }
theorems:
  - { id: CAT4-06-PROP-01, name: 型付けと射の型の一致 }
  - { id: CAT4-06-LEM-01, name: 置換補題 }
  - { id: CAT4-06-THM-01, name: βη等式の健全性 }
  - { id: CAT4-06-THM-02, name: 構文圏はCartesian閉圏 }
canonical_examples:
  - 定数関数の型付けと射影により二回カリー化される集合の二値型
  - 捕獲を避けた代入と誤った代入の区別
  - 有限積の射影とラムダ項の置換が作る型付きの射
  - 二元順序圏の含意としての指数型の解釈
  - 基点付き集合の指数対象が存在しない反例
