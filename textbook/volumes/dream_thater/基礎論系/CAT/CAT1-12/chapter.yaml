id: "CAT1-12"
title: "Yoneda埋め込み"
volume: "foundations"
status: supplementary
prerequisites:
  - CAT1-02
  - CAT1-03
  - CAT1-08
  - CAT1-09
  - CAT1-10
  - CAT1-11
official_scope: []
learning_objectives:
  - 小さい圏の反変集合値前層圏を構成し、Yoneda埋め込みの対象・射の作用を型付きで記述できる
  - Hom(-,f)の自然性・恒等射保存・合成保存を直接検証できる
  - 反変Yonedaの補題を入力としてYoneda埋め込みの充満忠実性を両方向から証明できる
  - 自然変換から射を恒等射で復元し、対象の自然同型から元の対象の同型を構成できる
  - 普遍元の全称存在一意条件をYonedaの評価式と結び付けて表現可能性を判定できる
  - 小さい有限圏で表現可能前層と非表現可能前層を区別し、埋め込みが全ての前層を覆うとは限らないことを示せる
definitions:
  - { id: CAT1-12-DEF-01, name: 集合値前層と前層圏 }
  - { id: CAT1-12-DEF-02, name: Yoneda埋め込み }
theorems:
  - { id: CAT1-12-THM-01, name: Yoneda埋め込みの充満忠実性 }
  - { id: CAT1-12-COR-01, name: 表現可能前層の自然同型と表現対象の同型 }
  - { id: CAT1-12-PROP-01, name: Yoneda評価による普遍元判定 }
canonical_examples:
  - 二対象順序圏0<1の二つの表現可能前層と射の自然変換
  - 二元の群を一対象圏としたときの左乗法と右作用の可換性
  - 集合と写像の有限な小圏で特性写像が冪集合前層を表現する例
  - 二対象離散圏の定値一元集合前層は表現可能でない
problem_patterns:
