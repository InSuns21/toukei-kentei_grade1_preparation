id: "CAT2-04"
title: "小図式の極限の構成"
volume: "foundations"
status: supplementary
prerequisites:
  - CAT2-03
  - CAT2-02
  - CAT2-01
  - CAT1-02
official_scope: []
learning_objectives:
  - 小さい対象族の積を定義し無限直積の普遍性を集合で直接検証できる
  - 小図式の対象集合と射集合から二つの積PとQおよび平行二射を型付きで構成できる
  - 二射の等化子が図式の錐を定めることを各射の整合条件から証明できる
  - 任意の錐からの媒介射の存在一意性を積と等化子の普遍性から再構成できる
  - 空図式・離散図式・一本の矢印・引き戻し・等化子を一般公式へ還元できる
  - 完備圏と有限完備圏を区別し各存在判定の十分性と必要性を証明できる
  - 無限図式の逆極限を整合する列の集合として構成できる
  - 有限集合の圏が有限完備でも完備でないことを反例の全称条件から説明できる
definitions:
  - { id: CAT2-04-DEF-01, name: 小さい積 }
  - { id: CAT2-04-DEF-02, name: 完備圏と有限完備圏 }
theorems:
  - { id: CAT2-04-THM-01, name: 小さい積と等化子による極限の構成 }
  - { id: CAT2-04-THM-02, name: 完備性の存在判定 }
  - { id: CAT2-04-THM-03, name: 有限極限の存在判定 }
canonical_examples:
  - 可算個の二元集合の積と任意の射族の一意な束ね方
  - 空図式の極限と終対象
  - 離散図式の極限と積
  - 一本の矢印図式の極限と始域
  - 三対象の合流図式の極限と引き戻し
  - 平行二射の極限と等化子
  - 自然数上の整合する列の逆極限
  - 集合の圏の完備性
  - 有限集合の圏の可算積不在と有限完備性
problem_patterns:
