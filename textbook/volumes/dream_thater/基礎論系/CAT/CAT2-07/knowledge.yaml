  - id: category.evaluation-limit-preservation
    name: 評価関手による極限・余極限の保存
    kind: proposition
    introduction: formal
    introduction_aliases: ["命題（評価関手による極限・余極限の保存）"]
    requires: [category.evaluation-functor, category.functor-pointwise-limits, category.functor-pointwise-colimits]
