id: "CAT2-07"
title: "関手圏と前層圏の極限"
volume: "foundations"
status: supplementary
prerequisites:
  - CAT2-05
  - CAT1-08
official_scope: []
learning_objectives:
  - 小さい圏の上の関手圏で評価関手を定義し、恒等射と垂直合成の保存を検証できる
  - 点ごとに選んだ極限錐から関手の射への作用を作り、自然性と普遍性を全て証明できる
  - 点ごとに選んだ余極限余錐から関手の射への作用を作り、自然性と普遍性を全て証明できる
  - 集合値前層を反対圏からの関手として定義し、制限写像の方向と自然変換の整合性を説明できる
  - 前層圏の完備性・余完備性と評価による保存を示し、前層の積・余積・引き戻し・余等化子を具体的に構成できる
  - 値域の小完備性が欠けると構成できない図式があることを有限集合の可算積で反証できる
definitions:
  - { id: CAT2-07-DEF-01, name: 評価関手 }
theorems:
  - { id: CAT2-07-THM-01, name: 関手圏の極限の点ごとの構成 }
  - { id: CAT2-07-THM-02, name: 関手圏の余極限の点ごとの構成 }
  - { id: CAT2-07-COR-01, name: 前層圏の完備性・余完備性 }
  - { id: CAT2-07-PROP-01, name: 評価関手による極限・余極限の保存 }
canonical_examples:
  - 一本の矢印図式における評価関手と可換四角形
  - 集合値関手の積と射影自然変換
  - 集合値関手のタグ付き余積と包含自然変換
  - 一本の矢印上の前層の制限と積・余積
  - 前層の引き戻しと点ごとの余等化子
  - 有限集合の圏で存在しない可算二元積
problem_patterns:
  - CAT2-07-EVALUATION-COMPOSITION
