id: "CAT3-09"
title: "end・coendとKan公式"
volume: "foundations"
status: supplementary
prerequisites:
  - CAT1-11
  - CAT3-07
  - CAT3-08
official_scope: []
learning_objectives:
  - H:A^op×A→C のくさび・余くさびのdinaturalityを射の型とともに検査できる
  - end・coendの普遍性を述べ、積と等化子・余積と余等化子から存在構成を証明できる
  - 集合値coendの商関係を生成元から計算できる
  - 共変・反変co-Yoneda公式の双方向の写像と自然性を証明できる
  - 自然変換のend表示とend形Yoneda公式を定義から導ける
  - 左Kanのcoend公式と右Kanのend公式を点ごとのcomma圏構成へ接続し、射の作用まで検算できる
definitions:
  - { id: CAT3-09-DEF-01, name: くさびとdinaturality }
  - { id: CAT3-09-DEF-02, name: end }
  - { id: CAT3-09-DEF-03, name: 余くさびとcoend }
