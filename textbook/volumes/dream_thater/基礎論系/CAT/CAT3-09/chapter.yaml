  - { id: CAT3-09-THM-02, name: 反変co-Yoneda公式 }
  - { id: CAT3-09-PROP-03, name: 自然変換集合のend表示 }
  - { id: CAT3-09-THM-03, name: end形の共変Yoneda公式 }
  - { id: CAT3-09-THM-04, name: 集合値左Kan拡張のcoend公式 }
  - { id: CAT3-09-THM-05, name: 集合値右Kan拡張のend公式 }
canonical_examples:
  - 二対象矢印圏でHomの恒等射族がくさびとなる例
  - 二対象矢印圏の写像が三元を貼り合わせて一元のcoendを作る例
  - 共変co-Yonedaの二対象圏での商の計算
  - 定値一元関手から二対象矢印圏への左右Kan延長
  - 矢印圏を一点へ潰すとcoendが余極限、endが極限になる例
