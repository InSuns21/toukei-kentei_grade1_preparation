id: "CATB2-06"
title: "豊穣随伴と豊穣Kan拡張"
volume: "foundations"
status: supplementary
prerequisites:
  - CATB2-05
  - CAT2-08
  - CAT3-06
official_scope: []
learning_objectives:
  - 豊穣随伴のHom対象同型と二変数の豊穣自然性を記述できる
  - 豊穣随伴による重み付き余極限・極限の保存を証明できる
  - 左右の豊穣Kan拡張の普遍性と重みの向きを区別できる
  - 重み付き極限・余極限から点ごとのKan公式と関手構造を導出できる
  - 点ごとの存在条件と通常のKan拡張との関係を説明できる
