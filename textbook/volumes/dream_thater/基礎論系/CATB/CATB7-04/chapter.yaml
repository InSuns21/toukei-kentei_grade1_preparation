id: "CATB7-04"
title: "導来圏と完全三角形"
volume: foundations
status: supplementary
prerequisites: [CATB7-03, CATB7-02]
official_scope: []
learning_objectives:
  - 擬同型の局所化として導来圏を構成しroofの和とシフトを計算できる
  - 錐の標準モデルから完全三角形を定義し任意の射を完全三角形へ拡張できる
  - 完全三角形のコホモロジー長完全列と接続射を導出できる
  - 回転の符号を二重の錐で導出し逆回転も検証できる
  - ホモトピー可換な四角形の錐の射と短完全列の完全三角形を構成できる
  - 三角圏の公理の全体像と本講で証明した範囲を区別できる
