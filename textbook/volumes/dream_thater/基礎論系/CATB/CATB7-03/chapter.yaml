id: "CATB7-03"
title: "擬同型と局所化"
volume: foundations
status: supplementary
prerequisites: [CATB7-02, CATB7-01]
official_scope: []
learning_objectives:
  - ホモトピー圏の射と複体の同型・ホモトピー同値・擬同型を区別できる
  - 擬同型の2-out-of-3性質と写像錐による判定を証明できる
  - 写像錐による擬同型の分母調整と消去を構成できる
  - roofの共通細分と合成を定義し選択独立性を証明できる
  - 擬同型を逆にする局所化の普遍性を証明しコホモロジーへの因子化を計算できる
