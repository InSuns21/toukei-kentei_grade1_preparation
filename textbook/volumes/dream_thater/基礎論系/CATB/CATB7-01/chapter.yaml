id: "CATB7-01"
title: "複体と鎖写像"
volume: foundations
status: supplementary
prerequisites: [CATB1-05]
official_scope: []
learning_objectives:
  - 余鎖複体と余鎖写像の条件を検証できる
  - 余鎖写像の合成と加法および双積を構成できる
  - アーベル圏で核の中への像の包含と余核を構成できる
  - 二項および三項複体のコホモロジーを計算し完全性を判定できる
  - コホモロジーの誘導射の存在と関手性を証明し具体例を計算できる
