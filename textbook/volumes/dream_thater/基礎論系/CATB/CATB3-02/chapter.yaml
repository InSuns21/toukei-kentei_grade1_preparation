id: "CATB3-02"
title: "有限表示対象"
volume: "foundations"
status: supplementary
prerequisites: [CATB3-01, CATB1-04]
official_scope: []
learning_objectives:
  - Homの比較写像を構成し、有限表示性を段階表示と等号の段階判定で説明できる
  - 集合が有限表示対象となる条件を証明できる
  - 加群のフィルター余極限を台集合から構成できる
  - 加群の有限表示性と有限個の生成元・関係式による表示の同値性を証明できる
  - 有限生成でも有限表示でない加群の反例を検証できる
