id: "CATB3-03"
title: "局所有限表示圏"
volume: "foundations"
status: supplementary
prerequisites: [CATB3-02, CAT2-05]
official_scope: []
learning_objectives:
  - 局所有限表示圏の余完備性と小さい材料による生成条件を区別できる
  - 集合の圏の局所有限表示性を有限部分集合による余極限表示から証明できる
  - 任意の左加群を有限個の生成元と関係式を持つ段階のフィルター余極限として構成できる
  - 材料の同型代表への置換と小ささを確認できる
  - 有限表示対象の余極限が有限表示対象とは限らない理由を説明できる
