    introduction_aliases: ["定義（擬自然変換）"]
    requires: [category.indexed-category, category.natural-isomorphism]
  - id: category.modification
    name: "修正"
    kind: definition
    introduction: formal
    introduction_aliases: ["定義（修正）"]
    requires: [category.pseudonatural-transformation]
  - id: category.grothendieck-biequivalence
    name: "Grothendieck構成の2圏的対応"
    kind: theorem
    introduction: formal
    introduction_aliases: ["定理（Grothendieck構成の2圏的対応）"]
    requires: [category.grothendieck-reconstruction, category.pseudonatural-transformation, category.modification, category.grothendieck-fibration]
