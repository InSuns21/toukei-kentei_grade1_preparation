id: "CATB8-02"
title: "微分付き次数付き代数と懸垂"
volume: foundations
status: supplementary
prerequisites: [CATB8-01, CATB7-02]
official_scope: []
learning_objectives:
  - 次数付き代数と微分付き次数付き代数の条件を具体例で確認できる
  - 余鎖次数のシフトによる微分と積の符号を計算できる
  - 被約テンソル余代数の余積と余導分の延長を構成できる
  - 余導分の二乗零と微分付き代数の恒等式の同値性を証明できる
  - 三入力演算を加えた場合の低次の恒等式を導出できる
