  - { id: CATB1-01-THM-03, name: 正則エピ・モノ分解は像を与える }
  - { id: CATB1-01-THM-04, name: 核対の余等化子による像分解 }
  - { id: CATB1-01-THM-05, name: 集合における正則エピ射の引き戻し安定性 }
canonical_examples:
  - 三元集合の核対と像分解
  - 平行二射の余等化子としての全射
  - 半順序圏での正則でないエピ射
  - 有限集合での引き戻し安定性
