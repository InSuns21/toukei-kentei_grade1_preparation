id: "CATB1-01"
title: "像と正則エピ射"
volume: "foundations"
status: supplementary
prerequisites:
  - CAT1-03
  - CAT2-03
  - CAT2-04
  - CAT2-05
official_scope: []
learning_objectives:
  - 核対を引き戻しとして定義し、集合で具体的に計算できる
  - 正則エピ射を余等化子として定義し、エピ射との違いを証明できる
  - 核対の余等化子と正則エピ射の関係、集合における全射との同値性を証明できる
  - 像の普遍性と正則エピ・モノ分解の同型一意性を証明できる
  - 有限極限と核対の余等化子及び引き戻し安定性から分解を構成できる
  - 集合で正則エピ射の引き戻し安定性と像分解の基底変換を証明できる
