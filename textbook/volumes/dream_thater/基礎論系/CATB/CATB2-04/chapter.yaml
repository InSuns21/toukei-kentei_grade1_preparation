learning_objectives:
  - 内部Homの評価から基底の自己豊穣化と表現可能関手を構成できる
  - パラメータ付き自然性の型を確認し積と等化子によるHom対象を構成できる
  - 豊穣Yoneda同型と逆射を作用の法則から証明できる
  - 二変数の自然性と共変・反変の向きを区別できる
  - 集合・線形空間・距離におけるHom対象を具体的に計算できる
