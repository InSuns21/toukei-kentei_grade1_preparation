  - id: category.covariant-grothendieck-construction
    name: "共変Grothendieck構成"
    kind: definition
    introduction: formal
    introduction_aliases: ["定義（共変Grothendieck構成）"]
    requires: [category.covariant-pseudofunctor]
  - id: category.grothendieck-opfibration
    name: "共変構成と余ファイブレーション"
    kind: theorem
    introduction: formal
    introduction_aliases: ["定理（共変構成と余ファイブレーション）"]
    requires: [category.covariant-grothendieck-construction, category.grothendieck-fibration, category.opfibration-duality]
