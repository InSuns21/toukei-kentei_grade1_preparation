chapter: CATB4-05
scope: dream-theater
coverage: complete
prerequisites: [CATB4-04, CATB4-03, CATB4-02, CATB4-01, CAT1-04]
concepts:
  - id: category.cocartesian-morphism
    name: "coCartesian射"
    kind: definition
    introduction: formal
    introduction_aliases: ["定義（coCartesian射）"]
    requires: [category.covariant-functor]
  - id: category.opfibration
    name: "余ファイブレーション"
    kind: definition
    introduction: formal
    introduction_aliases: ["定義（余ファイブレーション）"]
    requires: [category.cocartesian-morphism]
  - id: category.opfibration-duality
    name: "余ファイブレーションの双対性"
    kind: proposition
    introduction: formal
    introduction_aliases: ["命題（余ファイブレーションの双対性）"]
    requires: [category.opfibration, category.opposite-category, category.fibration]
  - id: category.family-opfibration
    name: "集合族の余ファイブレーション"
    kind: theorem
    introduction: formal
    introduction_aliases: ["定理（集合族の余ファイブレーション）"]
    requires: [category.opfibration, category.family-fibration]
  - id: category.covariant-pseudofunctor
