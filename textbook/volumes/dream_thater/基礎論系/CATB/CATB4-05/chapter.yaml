id: "CATB4-05"
title: "余ファイブレーションと双対"
volume: "foundations"
status: supplementary
prerequisites: [CATB4-04, CATB4-03, CATB4-02, CATB4-01, CAT1-04]
official_scope: []
learning_objectives:
  - coCartesian射の普遍性を直接検証し反対圏でのCartesian射との対応を証明できる
  - 集合族の非交和による持ち上げを構成し媒介射を計算できる
  - 選んだ持ち上げから共変擬関手を構成し比較と単位の整合性を証明できる
  - 共変Grothendieck構成の合成と同型判定を導出し全圏を復元できる
