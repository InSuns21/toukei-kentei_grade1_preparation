learning_objectives:
  - 整数次数付き加群とテンソル積の次数別成分を計算できる
  - Koszul符号付きテンソル写像を構成し交換則を導出できる
  - テンソル積複体の微分の二乗零を交差項の相殺から証明できる
  - 余鎖写像のテンソル積と次数付き交換が微分を保つことを証明できる
  - 三因子のテンソル積の微分と結び直しの整合性を確認できる
