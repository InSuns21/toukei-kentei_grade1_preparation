id: "CATB5-04"
title: "層化のplus構成"
volume: "foundations"
status: supplementary
prerequisites: [CATB5-03, CATB5-02]
official_scope: []
learning_objectives:
  - 局所同値の同値関係性とplus構成の小ささを証明できる
  - plus構成の前層性と標準写像の自然性を確認できる
  - 標準写像の局所一致と局所表示を使って分離性を証明できる
  - 分離前層のplus構成が層になることを証明できる
  - 二重plusの必要性を離散空間の例で説明できる
