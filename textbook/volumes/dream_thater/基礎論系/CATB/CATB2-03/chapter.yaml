id: "CATB2-03"
title: "豊穣関手と豊穣自然変換"
volume: "foundations"
status: supplementary
prerequisites:
  - CATB2-02
  - CAT1-08
official_scope: []
learning_objectives:
  - 豊穣関手のHom上の構造射と合成・単位保存を型から確認できる
  - 台となる関手を構成し豊穣関手と通常の関手の違いを説明できる
  - 前順序とLawvere型拡張距離で豊穣関手を判定できる
  - 豊穣自然性の型と台の自然性への移行を証明できる
  - 豊穣自然変換の存在と成分ごとの合成を確認できる
