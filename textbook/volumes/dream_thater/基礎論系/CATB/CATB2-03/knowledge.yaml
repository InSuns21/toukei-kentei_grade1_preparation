    requires: [category.enriched-natural-transformation, category.enriched-underlying-functor, category.mac-lane-coherence]
  - id: category.enriched-vertical-composition
    name: 豊穣自然変換の成分ごとの合成
    kind: proposition
    introduction: formal
    introduction_aliases: ["命題（豊穣自然変換の成分ごとの合成）"]
    requires: [category.enriched-natural-transformation, category.vertical-composition, category.mac-lane-coherence]
