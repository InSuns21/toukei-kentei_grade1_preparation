    kind: definition
    introduction: formal
    introduction_aliases: ["定義（豊穣関手）"]
    requires: [category.enriched-category, category.covariant-functor]
  - id: category.enriched-underlying-functor
    name: 豊穣関手から台の関手へ
    kind: theorem
    introduction: formal
    introduction_aliases: ["定理（豊穣関手から台の関手へ）"]
    requires: [category.enriched-functor, category.enriched-underlying-category]
  - id: category.enriched-thin-functor
    name: 順序・費用による豊穣関手の判定
    kind: proposition
    introduction: formal
    introduction_aliases: ["命題（順序・費用による豊穣関手の判定）"]
    requires: [category.enriched-functor, category.two-valued-enrichment, category.lawvere-metric-enrichment]
  - id: category.enriched-natural-transformation
    name: 豊穣自然変換
