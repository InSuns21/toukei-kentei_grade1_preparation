id: "CATB6-04"
title: "正則論理と整合論理"
volume: "foundations"
status: supplementary
prerequisites: [CATB6-03, CATB6-02, CATB6-01, CATB4-07, CATB1-02, CAT2-04]
official_scope: []
learning_objectives:
  - 正則式と整合式の構成規則を区別できる
  - 等号と関係を逆像、連言を共通部分、存在量化を像で解釈できる
  - 正則式の代入則と基本推論を証明できる
  - 整合圏の有限上限の安定性から選言の推論と代入を導ける
  - 正則性だけでは選言の安定性が従わない反例を説明できる
