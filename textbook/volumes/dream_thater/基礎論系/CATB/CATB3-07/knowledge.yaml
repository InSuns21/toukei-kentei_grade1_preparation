    introduction_aliases: ["定理（スケッチのモデルの点ごとの極限）"]
    requires: [category.sketch-set-model, category.functor-pointwise-limits]
  - id: category.sketch-model-filtered-colimits
    name: スケッチのモデルの点ごとのフィルター余極限
    kind: theorem
    introduction: formal
    introduction_aliases: ["定理（スケッチのモデルの点ごとのフィルター余極限）"]
    requires: [category.sketch-set-model, category.functor-pointwise-colimits, category.filtered-colimit-finite-limit-commutation]
