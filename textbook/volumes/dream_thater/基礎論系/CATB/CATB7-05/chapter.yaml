id: "CATB7-05"
title: "分解・導来関手・Ext"
volume: foundations
status: supplementary
prerequisites: [CATB7-04, CATB7-03, CATB7-02, CATB7-01, CATB1-05, CATB1-04]
official_scope: []
learning_objectives:
  - 射影対象と入射対象の持ち上げ条件を具体例で検証できる
  - 十分な射影対象または入射対象の仮定から分解を構成し擬同型を検証できる
  - 分解の比較写像を構成しホモトピーを除く一意性を証明できる
  - 左右導来関手の選択独立性と0次を導出できる
  - 巡回整数加群のExtと第一変数の反変性を計算できる
  - 導来圏のHomとExtの対応および入射分解による計算の仮定を説明できる
