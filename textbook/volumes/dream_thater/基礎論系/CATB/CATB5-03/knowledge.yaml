    introduction_aliases: ["命題（生成篩上の整合族の判定）"]
    requires: [category.sieve-matching-family, category.generated-sieve]
  - id: category.open-site-sheaf-equivalence
    name: "開集合圏の層条件との同値性"
    kind: theorem
    introduction: formal
    introduction_aliases: ["定理（開集合圏の層条件との同値性）"]
    requires: [category.site-sheaf, category.generated-sieve-matching-test, category.open-set-grothendieck-topology, category.topological-set-sheaf]
