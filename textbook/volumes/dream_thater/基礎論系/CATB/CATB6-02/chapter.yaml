id: "CATB6-02"
title: "量化子の随伴表示"
volume: "foundations"
status: supplementary
prerequisites: [CATB6-01, CATB5-08, CATB4-07, CATB5-06, CAT2-08, CAT2-03]
official_scope: []
learning_objectives:
  - 存在量化と全称量化を逆像の左右随伴として説明できる
  - 初等トポスで像とファイバー包含条件から量化子を構成できる
  - 射影に沿う量化の自由変数と型を判定できる
  - 空ファイバーで二つの量化の真偽が異なる理由を説明できる
  - 随伴の単位と余単位および量化子の合成を導ける
  - 異種の量化子を交換できない反例を計算できる
