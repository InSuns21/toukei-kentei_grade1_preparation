  - { id: CATB7-02-DEF-03, name: "余鎖複体のシフト" }
  - { id: CATB7-02-DEF-04, name: "写像錐" }
theorems:
  - { id: CATB7-02-THM-01, name: "余鎖ホモトピーの同値性とコホモロジー不変性" }
  - { id: CATB7-02-THM-02, name: "写像錐の複体条件と短完全列" }
  - { id: CATB7-02-THM-03, name: "余鎖複体のコホモロジー長完全列" }
