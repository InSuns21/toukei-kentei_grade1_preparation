id: "CATB7-02"
title: "鎖ホモトピー・シフト・写像錐"
volume: foundations
status: supplementary
prerequisites: [CATB7-01, CATB1-06]
official_scope: []
learning_objectives:
  - 余鎖ホモトピーの等式を検証し誘導射の不変性を証明できる
  - 可縮な複体と全コホモロジーが零である複体を区別できる
  - シフトの符号と写像錐の微分の二乗零を検算できる
  - 各次数で短完全な複体の列から接続射を構成し長完全性を証明できる
  - 写像錐の列の接続射を元の写像の誘導射と比較できる
