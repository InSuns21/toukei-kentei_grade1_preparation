id: "CATB5-08"
title: "トポスでの像と正確性"
volume: "foundations"
status: supplementary
prerequisites: [CATB5-07, CATB1-02, CATB5-05, CATB5-06, CATB5-03, CATB5-02]
official_scope: []
learning_objectives:
  - 冪対象と分類射を用いて像分解を構成できる
  - ファイバー包含条件の表現からエピ射の引き戻し安定性を証明できる
  - グラフの像を使いエピ射が核対の余等化子になることを証明できる
  - 同値類の族と像を使って初等トポスのBarr-正確性を証明できる
  - 層の局所全射と成分全射の違いを具体例で説明できる
  - 成分商の層化の普遍性と核対の保存を証明できる
