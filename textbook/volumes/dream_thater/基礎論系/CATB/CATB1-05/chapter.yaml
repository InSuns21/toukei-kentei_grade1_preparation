id: "CATB1-05"
title: "像・余像・完全列"
volume: "foundations"
status: supplementary
prerequisites:
  - CATB1-01
  - CATB1-04
official_scope: []
learning_objectives:
  - 核の余核と余核の核から比較射を構成できる
  - アーベル圏の正規性を用いて比較射が同型であることを証明できる
  - 像の普遍性を用いて完全列を判定できる
  - 核へのエピ射と余核からのモノ射によって完全性を判定できる
  - 短完全列と核・余核の同値性を示せる
  - 完全性と片側逆射の存在を区別できる
