  - { id: CATB1-03-THM-02, name: 加法圏の存在条件 }
  - { id: CATB1-03-THM-03, name: 双積の射の行列表示 }
  - { id: CATB1-03-PROP-03, name: 双積による射の和の復元 }
canonical_examples:
