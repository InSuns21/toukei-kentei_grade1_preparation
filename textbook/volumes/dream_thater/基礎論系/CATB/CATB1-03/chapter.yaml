id: "CATB1-03"
title: "加法圏と双積"
volume: "foundations"
status: supplementary
prerequisites:
  - CAT2-05
official_scope: []
learning_objectives:
  - Homの可換群構造と合成の双加法性を具体例で検証できる
  - 零対象と恒等射が零射に一致する条件の同値性を証明できる
  - 有限積と有限余積から双積を構成し双方の普遍性を証明できる
  - 加法圏の存在条件と前加法圏との差を説明できる
  - 有限双積に関する射の行列表示と合成則を導出できる
  - 対角射と余対角射を用いて射の加法を復元できる
