id: "CATB2-02"
title: "前順序・距離空間と豊穣"
volume: "foundations"
status: supplementary
prerequisites:
  - CATB2-01
  - F0-00B
official_scope: []
learning_objectives:
  - 順序を基底とすると豊穣公理が射の存在条件へ還元される理由を説明できる
  - 二値豊穣圏と前順序の対応を双方向に証明できる
  - Lawvere距離の基底の順序反転と加法を検証し、豊穣構造と距離公理の対応を証明できる
  - 非対称性・無限距離・分離性の違いとゼロ費用の前順序を説明できる
