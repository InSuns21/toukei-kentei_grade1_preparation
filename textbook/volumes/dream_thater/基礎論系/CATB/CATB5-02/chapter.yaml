id: "CATB5-02"
title: "篩とGrothendieck位相"
volume: "foundations"
status: supplementary
prerequisites: [CATB5-01, CAT1-02, CAT1-06, CAT1-12]
official_scope: []
learning_objectives:
  - 篩と生成篩を定義し具体的な圏で列挙できる
  - 篩の引き戻しを計算し合成則と最大篩の判定を証明できる
  - Grothendieck位相の三公理を確認し上方閉性と有限交差を導ける
  - 開集合圏と位相の基底で被覆篩の公理を証明できる
  - 基底変換や有限交差の仮定の重要性を反例で説明できる
