  - HOLO12-ONSHELL-GENERATOR
  - HOLO12-WARD-DIVERGENCE
  - HOLO12-FOURIER-TO-POSITION
  - HOLO12-LOG-COUNTERTERM
  - HOLO12-INTEGRATED-CURRENT
