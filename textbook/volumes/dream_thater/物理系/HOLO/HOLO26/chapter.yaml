id: HOLO26
title: "HKLL再構成"
volume: foundations
status: supplementary
prerequisites:
  - HOLO25
  - HOLO8
  - HOLO9
  - HOLO6
official_scope: []
learning_objectives:
  - 純global AdS3の質量零自由スカラー場について計量から波動作用素と径方程式を導出できる
  - 正則性と源零の境界条件から有限多項式global正規モードの周波数と係数漸化式を求められる
  - 正規化可能モードの非零境界係数を計算し境界Fourier係数から内部係数を取り出せる
  - 有限モードHKLL型smearing核を構成し境界Fourier直交性から再構成等式を証明できる
  - 無限モードの収束と量子演算子の分布的意味を区別し条件付きの極限を説明できる
  - 全境界での自由場再構成と部分領域復号および有限Nの重力的局所性の違いを反例とともに述べられる
definitions:
  - { id: HOLO26-DEF-01, name: global正規化可能モード }
  - { id: HOLO26-DEF-02, name: 正規化可能な境界データ }
  - { id: HOLO26-DEF-03, name: global有限モードHKLL型核 }
theorems:
  - { id: HOLO26-PROP-01, name: 正則な多項式モードのスペクトル }
  - { id: HOLO26-PROP-02, name: 境界Fourier係数によるモードの復元 }
  - { id: HOLO26-THM-01, name: 有限モードでのHKLL型再構成 }
canonical_examples:
  - 最小の角非依存モードの波動方程式と境界係数の確認
  - 第2径モードの負の境界係数と符号の役割
  - 角依存モードの中心正則性と境界極限
  - 単一モードのsmearing核積分の直接確認
  - 同一時刻の境界データが消えても内部場が非零である反例
