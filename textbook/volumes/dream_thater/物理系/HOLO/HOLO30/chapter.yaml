id: HOLO30
title: "作用素代数量子誤り訂正"
volume: foundations
status: supplementary
prerequisites:
  - HOLO29
  - HOLO28
official_scope: []
learning_objectives:
  - 有限次元観測量代数・可換子・中心・直和セクターを行列から計算できる
  - 全論理状態の回復と部分代数の完全再構成を区別して局所表現を構成できる
  - 相補的代数再構成と中心射影の両領域表現を有限符号で証明できる
  - 補領域の圧縮作用素が論理代数と可換になる必要条件を導ける
  - 面積型中心作用素と代数エントロピーから量子RT型恒等式・相対エントロピー一致を台条件付きで導ける
  - 有限次元の証明とType III局所環・半古典重力への条件付き類比を区別できる
definitions:
  - { id: HOLO30-DEF-01, name: 有限次元の観測量代数と中心 }
  - { id: HOLO30-DEF-02, name: 直和セクターの論理代数 }
  - { id: HOLO30-DEF-03, name: 領域上の論理代数の完全再構成 }
  - { id: HOLO30-DEF-04, name: 有限直和代数の状態エントロピー }
theorems:
  - { id: HOLO30-PROP-01, name: 直和論理代数の中心と可換子 }
  - { id: HOLO30-THM-01, name: 直和コードの相補的代数再構成 }
  - { id: HOLO30-PROP-02, name: 完全再構成の補領域可換性 }
  - { id: HOLO30-THM-02, name: 有限直和コードの量子RT型恒等式 }
canonical_examples:
  - 2次元対角代数と全行列代数の中心を行列要素から比較
  - 二セクターの射影とセクター間遷移作用素を比較
  - 直和符号の物理側の局所表現を6次元行列で構成
  - 二セクターの純粋入力で代数エントロピーと面積型中心項を検算
  - 相対エントロピーで面積型項が相殺される台条件付き計算
