id: HOLO25
title: "causal wedgeとentanglement wedge"
volume: foundations
status: supplementary
prerequisites:
  - HOLO24
  - HOLO2
official_scope: []
learning_objectives:
  - 境界領域の依存域を全因果曲線の条件から定義しMinkowski区間の因果菱形を導出できる
  - 因果未来と因果過去の共通部分としてcausal wedgeを定義し純AdS球領域の不等式を証明できる
  - 二つのnull境界の交差としてcausal information surfaceを構成できる
  - RT/HRT面と相同な領域の依存域としてentanglement wedgeを定義し境界条件の役割を述べられる
  - 純AdS真空区間のcausal wedgeとentanglement wedgeの一致をnull生成線から検算できる
  - 一般時空での古典包含に必要な因果性 null曲率 maximin安定性などの条件と証明の引用範囲を説明できる
  - 包含と等号および領域包含とバルク作用素再構成を混同しない
  - Lorentz boostした境界区間で両wedgeとHRT面を具体的に変換できる
definitions:
  - { id: HOLO25-DEF-01, name: 境界領域の依存域と因果菱形 }
  - { id: HOLO25-DEF-02, name: causal wedge }
