  - { id: HOLO25-PROP-02, name: 純AdS区間の因果くさび領域 }
  - { id: HOLO25-PROP-03, name: 純AdS真空区間における二つのwedgeの一致 }
  - { id: HOLO25-THM-01, name: 古典的causal wedge inclusion（適用条件付き既存結果） }
canonical_examples:
  - 境界Minkowski区間の因果菱形と全因果曲線による内外判定
  - 境界先端からのnull信号と純AdS因果くさび
  - 二枚のnull境界の交差によるcausal information surface
  - RT半円と相同なバルク初期領域
  - 半円からのnull生成線による真空wedge一致
  - 二曲線の比較模型による真の包含と一般的物理実現との差
  - Lorentz boostによる動く区間とそのwedge
