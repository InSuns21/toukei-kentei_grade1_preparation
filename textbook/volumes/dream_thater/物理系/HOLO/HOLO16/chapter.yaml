  - { id: HOLO16-PROP-03, name: 高温CFTとBTZの条件付き一致 }
  - { id: HOLO16-PROP-04, name: 時間対称BTZ断面の橋 }
  - { id: HOLO16-PROP-05, name: TFDの二側相関と熱的解析接続 }
canonical_examples:
  - 二準位TFDの規格化と右側密度行列の非対角項の消去
  - r_+=LのBTZ温度・質量・地平線円周
  - 固有距離座標でのBTZの最小円周
  - 二準位模型での両側相関の余弦表示
  - 熱的AdSとBTZの先頭自由エネルギー交差
