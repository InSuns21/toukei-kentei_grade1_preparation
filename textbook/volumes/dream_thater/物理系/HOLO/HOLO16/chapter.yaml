id: HOLO16
title: "BTZ・熱場二重状態"
volume: foundations
status: supplementary
prerequisites:
  - HOLO15
  - QINF17
official_scope: []
learning_objectives:
  - TFDの規格化と左側部分跡を固有基底で計算し右側の正準熱密度行列を導ける
  - 左右の二側相関と片側熱相関の虚時間シフトを符号・行列要素から検算できる
  - 非回転BTZの計量と境界円周を読み取りEuclid地平線の正則性から温度を導ける
  - BTZの質量・地平線エントロピー・自由エネルギーと第一法則を再計算できる
  - Brown–Henneaux中央電荷・モジュラー不変性の条件下で高温CFTとBTZの熱力学を照合できる
  - 時間対称BTZ断面の橋の誘導計量を固有距離座標で導出できる
  - Kruskal延長で二境界間の未来向き因果曲線が存在しないことを示しTFDの限界を区別できる
definitions:
  - { id: HOLO16-DEF-01, name: 熱場二重状態 }
  - { id: HOLO16-DEF-02, name: 非回転BTZ外部領域 }
