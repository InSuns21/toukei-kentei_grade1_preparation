id: HOLO31
title: "テンソル網・HaPPY模型"
volume: foundations
status: supplementary
prerequisites:
  - HOLO30
  - HOLO29
official_scope: []
learning_objectives:
  - 四脚完全テンソルの部分トレース条件を有限体の二行行列式で全組検証できる
  - 完全テンソルの二脚対二脚ユニタリと一脚対三脚消失訂正符号の対応を明示できる
  - 二頂点テンソル網を最大エンタングル内部脚で結び、等長性と領域上の全論理代数の再構成を証明できる
  - greedy吸収の判定条件を実行し、十分条件であることと非局所な相関の再構成を区別できる
  - 内部脚の最小cutと境界のエントロピーを計算し、論理入力のエントロピー項を区別できる
  - 結合の最大エンタングル性を外した反例から最小cut等号の成立条件を説明できる
  - HaPPY型の離散符号と連続AdS/CFT・Einstein方程式の論証範囲を区別できる
definitions:
  - { id: HOLO31-DEF-01, name: 四脚の完全テンソル }
  - { id: HOLO31-DEF-02, name: 二頂点のテンソル網符号 }
  - { id: HOLO31-DEF-03, name: 四脚完全テンソル網のgreedy吸収 }
  - { id: HOLO31-DEF-04, name: 内部脚のcut容量 }
theorems:
  - { id: HOLO31-PROP-01, name: 四qutritの完全テンソル }
  - { id: HOLO31-THM-01, name: 二頂点網の等長性と領域再構成 }
  - { id: HOLO31-THM-02, name: 二頂点網の量子RT型エントロピー恒等式 }
canonical_examples:
  - 六組の二脚行列式から四脚の完全性と二脚対二脚の可逆性を検証
  - 三qutrit消失訂正符号と明示的な二脚復号ユニタリを構成
  - 二頂点網の入力a=1 b=2について境界四脚の規格化を検算
  - 単一境界qutritの縮約が任意の論理入力でI3/3となることを計算
  - 左右二脚の論理X Zと非隣接二脚の論理差の表現を区別
  - 積論理入力と最大エンタングル論理入力でcutとエントロピーを比較
  - 内部結合を積状態へ変更して最小cut等号が壊れる機構を確認
problem_patterns:
