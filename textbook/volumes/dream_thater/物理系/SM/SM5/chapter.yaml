id: "SM5"
title: "古典理想気体とアンサンブルの同値性"
volume: "foundations"
status: supplementary
prerequisites:
  - SM4
official_scope: []
learning_objectives:
  - 連続相空間・作用セル・同種粒子の1/N!補正を仮定とともに定義し、Gaussian積分から古典理想気体の正準分配関数を導出できる
  - 正準密度の規格化からMaxwell–Boltzmann速度ベクトル分布・速さ分布・各成分の分散を証明できる
  - 正準分配関数の微分から理想気体の内部エネルギー・圧力・自由エネルギー・エントロピーを導出できる
  - Stirlingの漸近式を用いてSackur–Tetrode式を導き、古典希薄条件と補正因子の役割を説明できる
  - 累積相空間体積を高次元球とGamma関数から計算し、微正準型の温度と圧力を求められる
  - 正準エネルギーのGamma分布・平均・分散・Chebyshev集中を出発点から証明できる
  - 微正準と正準の一粒子当たりのエントロピー極限・温度・圧力を比較し、全変動収束とは区別できる
  - 理想気体の大分配関数を級数から計算し、Poisson粒子数・密度揺らぎの消失を説明できる
