canonical_examples:
  - 一粒子と二粒子で1/N!の役割を直接確かめる
  - 高次元球体積をGaussian積分とGamma積分から導出する
  - Maxwell–Boltzmannの速度密度から速さ密度への変数変換を行う
  - 正準エネルギーの相対分散と全変動距離の違いを確認する
  - 粒子数Poisson分布の階乗モーメントから分散を再計算する
