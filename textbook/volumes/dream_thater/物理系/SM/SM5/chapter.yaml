  - { id: SM5-PROP-03, name: "累積相空間体積と微正準型の状態方程式" }
  - { id: SM5-THM-02, name: "正準エネルギーの分布と集中" }
  - { id: SM5-THM-03, name: "古典理想気体の熱力学量の同値性" }
