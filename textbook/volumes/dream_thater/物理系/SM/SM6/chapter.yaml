  - { id: SM6-THM-03, name: "固定密度の三次元Bose気体の基底占有" }
canonical_examples:
  - Bose一モードとFermi一モードの重み・規格化・占有数を比較する
  - 同エネルギー二モードで固定粒子数2の占有配置を列挙する
  - 周期境界の零波数と第一励起殻を直接数える
  - Bose積分の原点近傍で収束と発散の境界を確かめる
  - Fermi波数球の球殻積分を行う
