  - { id: SM6-PROP-02, name: "モード和と熱力学微分" }
  - { id: SM6-PROP-03, name: "三次元自由粒子の状態密度" }
  - { id: SM6-PROP-04, name: "希薄極限と最初の量子補正" }
  - { id: SM6-PROP-05, name: "三次元自由Fermi気体の零温度極限" }
theorems:
