theorems:
  - { id: SM7-THM-01, name: "Curie–Weiss圧力の変分表示と磁化集中" }
  - { id: SM7-THM-02, name: "Curie–Weiss模型の零外場臨界点" }
  - { id: SM7-THM-03, name: "Curie–Weiss模型の自発磁化と極限の非可換性" }
canonical_examples:
  - 二スピンの四配置を数える
  - 三スピンの磁化階級を列挙する
  - 一次元開放鎖を隣接積へ変換する
  - 零外場の自己無撞着方程式の停留点と最大点を区別する
