id: "SM7"
title: "Ising模型とCurie–Weiss平均場"
volume: "foundations"
status: supplementary
prerequisites:
  - SM3
official_scope: []
learning_objectives:
  - 有限Ising模型を定義し二スピンの分配関数と磁化を直接計算できる
  - 零外場の有限系の全反転対称性と平均磁化ゼロを証明できる
  - 一次元開放鎖の変数変換と二点相関を厳密に求められる
  - Curie–Weiss全結合のスケーリングと自己相互作用の定数差を説明できる
  - 磁化階級ごとの重複度と分配関数を導出できる
  - 二項係数の一様エントロピー評価と圧力の変分極限・指数集中を証明できる
  - 自己無撞着方程式の停留点と最大点を区別し臨界温度を求められる
  - 外場を用いた自発磁化と反復極限の非可換性を証明できる
  - 有限系の磁化分散の応答公式と常磁性相の感受率を導出できる
definitions:
  - { id: SM7-DEF-01, name: "有限強磁性Ising模型" }
  - { id: SM7-DEF-02, name: "Curie–Weiss平均場模型" }
propositions:
  - { id: SM7-PROP-01, name: "有限零外場の反転対称性" }
  - { id: SM7-PROP-02, name: "一次元開放鎖の分配関数と相関" }
  - { id: SM7-PROP-03, name: "磁化階級別のCurie–Weiss分配関数" }
  - { id: SM7-PROP-04, name: "磁化分散と常磁性相の感受率" }
lemmas:
