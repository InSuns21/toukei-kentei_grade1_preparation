id: "SM3"
title: "正準アンサンブルと分配関数"
volume: "foundations"
status: supplementary
prerequisites:
  - SM2
  - TH5
official_scope: []
learning_objectives:
  - 孤立した試料・熱浴の複合系の微正準等確率から、試料の厳密な周辺分布を状態数で導ける
  - 熱浴の対数状態数の一次近似と誤差仮定を明示し、正準Gibbs重みが現れる条件を説明できる
  - 有限正準アンサンブルと分配関数を定義し、状態の確率と準位の多重度による確率を区別できる
  - 分配関数の対数微分から平均エネルギー・分散・温度単調性を完全に導出できる
  - GibbsエントロピーとHelmholtz自由エネルギーを有限和から構成し、S・U・Fの関係を証明できる
  - 自由エネルギー変分原理を対数不等式と等号条件まで証明できる
  - 温度非依存のエネルギーという仮定の下で熱容量とエネルギー揺らぎの関係を証明できる
  - 相互作用のない直積系の分配関数・自由エネルギーの加法性を証明し、相互作用がある場合と区別できる
definitions:
  - { id: SM3-DEF-01, name: "有限正準アンサンブルと分配関数" }
  - { id: SM3-DEF-02, name: "有限確率分布のGibbsエントロピー" }
  - { id: SM3-DEF-03, name: "正準Helmholtz自由エネルギー" }
theorems:
  - { id: SM3-PROP-01, name: "有限熱浴の厳密な周辺分布" }
  - { id: SM3-PROP-02, name: "熱浴近似と指数重みの誤差" }
  - { id: SM3-PROP-03, name: "正準分布の規格化と準位表示" }
  - { id: SM3-THM-01, name: "分配関数の微分とエネルギー揺らぎ" }
  - { id: SM3-THM-02, name: "正準エントロピーと自由エネルギーの恒等式" }
  - { id: SM3-THM-03, name: "有限正準分布の自由エネルギー変分原理" }
  - { id: SM3-PROP-04, name: "正準エネルギー揺らぎと熱容量" }
  - { id: SM3-PROP-05, name: "独立な二系の分配関数と自由エネルギー" }
canonical_examples:
  - 熱浴の厳密な周辺確率と一次近似の誤差評価を分離する
  - 基底1配置と励起2配置の三状態模型で分配関数と分散を計算する
  - 一様分布と一点集中分布でGibbsエントロピーを比較する
  - エネルギーがゼロの多状態模型で自由エネルギーを確認する
  - 二つの独立な励起単位で分配関数の積と揺らぎを検算する
