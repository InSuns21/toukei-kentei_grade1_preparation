<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 340" role="img" aria-labelledby="title desc" data-layout-lint="strict">
  <title id="title">増える磁束と時計回りの誘導電場</title>
  <desc id="desc">灰色の円 C を正面から見る。青い丸と点は紙面手前向きの磁場 B を表す。磁束が増えると、回路右端から下向きに伸びる橙色の矢印 E が示すように誘導電場は時計回りを向く。磁場は点記号、誘導電場は矢印で、色なしでも区別できる。</desc>
  <defs>
    <marker id="induced-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D55E00"/>
    </marker>
  </defs>
  <circle cx="300" cy="174" r="112" fill="none" stroke="#6B7280" stroke-width="3"/>
  <circle cx="300" cy="174" r="17" fill="none" stroke="#0072B2" stroke-width="2.5"/>
  <circle cx="300" cy="174" r="4.5" fill="#0072B2"/>
  <text x="330" y="182" font-size="23" font-family="sans-serif" fill="#0072B2">B</text>
  <text x="287" y="39" font-size="22" font-family="sans-serif" fill="#1F2937">C</text>

  <line x1="412" y1="174" x2="412" y2="251" stroke="#D55E00" stroke-width="4" marker-end="url(#induced-arrow)"/>
  <text x="437" y="226" font-size="24" font-family="sans-serif" fill="#D55E00">E</text>

  <circle cx="100" cy="116" r="13" fill="none" stroke="#0072B2" stroke-width="2"/>
  <circle cx="100" cy="116" r="3.5" fill="#0072B2"/>
  <circle cx="100" cy="174" r="13" fill="none" stroke="#0072B2" stroke-width="2"/>
  <circle cx="100" cy="174" r="3.5" fill="#0072B2"/>
  <circle cx="100" cy="232" r="13" fill="none" stroke="#0072B2" stroke-width="2"/>
  <circle cx="100" cy="232" r="3.5" fill="#0072B2"/>
</svg>
