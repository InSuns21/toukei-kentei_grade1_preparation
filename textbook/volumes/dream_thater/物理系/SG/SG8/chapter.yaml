learning_objectives:
  - 正の因子を持つ有限因子木のcavity messageとBP更新式を導出できる
  - BP局所beliefとBethe分配関数を構成し木上の厳密性を証明できる
  - Ising対相互作用をcavity fieldに変換し二頂点を計算できる
  - 三角形のloop補正を求め木と一般グラフを区別できる
  - Poisson分枝木のRS分布再帰と高温収縮を証明できる
  - 1RSBの状態重み付けとMézard–Parisiの仮説的射程を説明できる
