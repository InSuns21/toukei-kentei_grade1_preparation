id: "MECH5"
title: "振動"
volume: "foundations"
status: supplementary
prerequisites:
  - MECH4
  - RA3
  - ODE2
official_scope: []
learning_objectives:
  - 保存力 F=-V' の平衡点を判定し、V'(x*)=0 と V''(x*)>0 を非退化安定平衡点の条件として区別できる
  - Taylor の定理を V と V' へ適用し、一般ポテンシャルの非退化極小近傍から m yddot+k_eff y=0 を導ける
  - 単振動の振幅・位相・固有角振動数・周期を初期条件から求められる
  - 単振動のエネルギー保存 E=(1/2)m ydot^2+(1/2)k y^2 を運動方程式から導ける
  - 線形減衰振動子を不足減衰・臨界減衰・過減衰に分類し、それぞれの解の形を物理的に説明できる
  - 減衰振動で dE/dt=-c ydot^2<=0 を導き、抵抗による散逸を説明できる
  - 正弦駆動される減衰振動子の定常応答を係数比較から導き、振幅と位相差を求められる
  - 無減衰の厳密共振で t sin(omega_0 t) 型の増大項が現れることを導ける
  - 減衰ありの変位振幅ピーク Omega_r=sqrt(k/m-c^2/(2m^2)) の成立条件を導き、omega_0 との違いを説明できる
  - 一般ポテンシャル極小付近で調和振動子が普遍的に現れる理由と、小振幅近似が破れる条件を説明できる
