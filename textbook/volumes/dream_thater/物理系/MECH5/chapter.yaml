  - { id: MECH5-PROP-02, name: "減衰振動の三領域" }
  - { id: MECH5-PROP-03, name: "減衰強制振動の定常応答" }
  - { id: MECH5-PROP-04, name: "無減衰線形振動子の厳密共振" }
canonical_examples:
  - "ばねの自然長で平衡条件と復元力の向きを確認する例"
  - "一般ポテンシャルの非退化極小を Taylor 展開して有効ばね定数を得る例"
  - "初期位置・初速度から単振動の振幅と位相を決める例"
  - "単振動の運動エネルギーとポテンシャルエネルギーの交換"
  - "不足減衰・臨界減衰・過減衰を特性根で分類する例"
  - "減衰強制振動で過渡応答が消え定常応答へ近づく例"
  - "無減衰の厳密共振と減衰ありの有限ピークを比較する例"
