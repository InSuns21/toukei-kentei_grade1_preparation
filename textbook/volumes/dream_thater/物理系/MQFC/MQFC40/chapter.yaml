learning_objectives:
  - 因果帰納条件と開被覆の重なりでの整合から全対角外の一意性を説明できる
  - 相対座標での有限スケーリング次数の延長と局所反項を計算できる
  - 添字置換の平均による対称化を証明できる
  - 挿入数ごとのユニタリティ条件と全対角の補正を導出できる
