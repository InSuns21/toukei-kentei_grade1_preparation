id: MQFC8
title: "反射陽性はなぜ成り立つか"
volume: foundations
status: supplementary
prerequisites: [MQFC5, MQFC6, MQFC7]
official_scope: []
learning_objectives:
  - 時間反転と正時間の多項式から反射陽性を定義し通常の正値性との違いを説明できる
  - 時間周波数の逆Fourier積分を指数核として導出できる
  - 自由共分散の正時間支持を使い反射形式を重み付き絶対値二乗へ因子分解できる
  - Gaussian共通成分の分解を使い線形測定から多項式へ反射陽性を拡張できる
