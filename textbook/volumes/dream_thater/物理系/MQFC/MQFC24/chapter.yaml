learning_objectives:
  - 二値群のWilson重みを指標係数で展開し辺積分の偶奇条件を導出できる
  - 平面格子の境界の単射性から厳密な面積則を証明できる
  - 物理面積の係数と静的ポテンシャルを計算できる
  - 高次元での閉じた面の相殺と連結集合の計数から体積一様な面積評価を導出できる
  - 固定格子の面積則と連続理論の質量ギャップの証明責務を区別できる
