learning_objectives:
  - 一致点を除く試験空間でのE0–E4の意味と直接例を説明できる
  - 1973年と1975年の再構成条件を区別し自由Gaussian場の線形増大条件を検証できる
  - 非負生成作用素から複素時間の正則性と実時間境界値を導ける
  - 自由二点相関およびWick多点相関の境界値を計算し質量殻を確認できる
  - 一般再構成に必要な追加評価とスペクトルギャップの証明責務を区別できる
