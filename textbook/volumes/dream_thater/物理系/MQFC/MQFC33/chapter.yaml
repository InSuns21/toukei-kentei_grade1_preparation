id: MQFC33
title: "原点を除く分布をどう延長するか"
volume: foundations
status: supplementary
prerequisites: [MQFC32, GPDE1, GPDE2]
official_scope: []
learning_objectives:
  - 原点を除く分布の延長条件と次数の下界を説明できる
  - 原点Taylor減算を計算し微分値の消失を確認できる
  - 縮尺分布の一様有限階評価を導出できる
  - 環状分解によって有限なスケーリング次数を保つ延長を構成できる
  - 次元未満での一意性と整数境界で必要な減算次数を説明できる
