id: MQFC11
title: "粒子質量とスペクトル測度"
volume: foundations
status: supplementary
prerequisites: [MQFC3, MQFC9, MQFC10, LREP22]
official_scope: []
learning_objectives:
  - 質量二乗とエネルギーを区別し未来質量殻の測度を扱える
  - 二点分布の正値性から正運動量測度を導ける
  - Lorentz不変性からKällén–Lehmann表示を導出できる
  - 質量の原子と連続成分を区別し二粒子の運動学的下限を計算できる
  - Euclid二点量のスペクトル表示を計算し観測量の検出範囲を説明できる
