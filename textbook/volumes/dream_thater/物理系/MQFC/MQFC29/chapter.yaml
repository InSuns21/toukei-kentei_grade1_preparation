learning_objectives:
  - ゲージ不変観測量を試験関数で平均し規格化の役割を説明できる
  - 連続極限と無限体積極限の一様誤差を判定できる
  - 緊密性と積相関の一様可積分性を区別し評価できる
  - 共通部分列を抽出し反射陽性と増大条件の保存を説明できる
  - 極限の一意性・非自明性・物理ギャップを別々に判定できる
