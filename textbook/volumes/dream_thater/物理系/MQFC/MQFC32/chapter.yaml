id: MQFC32
title: "分布のscaling degree"
volume: foundations
status: supplementary
prerequisites: [MQFC31, GPDE1, GPDE2]
official_scope: []
learning_objectives:
  - Jacobianを含む分布のスケール変換を導出し作用の連続性を確認できる
  - スケーリング次数の定義から斉次核と対数核の次数を計算できる
  - デルタ導関数のスケーリング次数を導出できる
  - 和と微分と座標の積による次数の変化を証明できる
  - 紫外と赤外の挙動を区別し冪核の局所可積分性と延長の条件を比較できる
