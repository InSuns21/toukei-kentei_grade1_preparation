  - { id: MQFC23-THM-02, name: "転送作用素の真空規格化" }
  - { id: MQFC23-THM-03, name: "格子Hamiltonianの構成" }
canonical_examples: [一本の辺の頂点平均, 零結合, 有限対角作用素, 二値群の閉路]
