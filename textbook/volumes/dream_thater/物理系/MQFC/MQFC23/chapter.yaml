id: MQFC23
title: "転送作用素と物理Hilbert空間"
volume: foundations
status: supplementary
prerequisites: [MQFC9, MQFC20, MQFC21, MQFC22]
official_scope: []
learning_objectives:
  - Haar平均による一時刻のゲージ不変空間への直交射影を導出できる
  - 自由時間境界Wilson測度から一層の転送作用素と端点因子を導出できる
  - 指標展開によって転送作用素の非負性とコンパクト性を証明できる
  - 零方向商と真空規格化から格子Hamiltonianおよびその定義域を構成できる
  - 固有値比と相関減衰および有限格子ギャップの関係を計算できる
definitions:
  - { id: MQFC23-DEF-01, name: "Wilson転送作用素" }
