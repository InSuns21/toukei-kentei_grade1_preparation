id: MQFC21
title: "Wilson格子ゲージ測度"
volume: foundations
status: supplementary
prerequisites: [MQFC19, MQFC20, SM3]
official_scope: []
learning_objectives:
  - 有限格子のWilson格子作用の不変性と有界性を導出できる
  - 分配関数の正値性と確率測度の構成および境界条件ごとのゲージ不変性を説明できる
  - ゲージ不変観測量の期待値を計算し辺の独立性と区別できる
  - 分配関数の微分から作用の平均と分散を計算できる
  - 滑らかな接続の正方形展開から連続古典作用の係数を導出できる
