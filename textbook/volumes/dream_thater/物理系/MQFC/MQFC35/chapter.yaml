id: MQFC35
title: "Feynman核の対角延長を計算する"
volume: foundations
status: supplementary
prerequisites: [MQFC31, MQFC32, MQFC33, MQFC34, MICA6, QFT6, GPDE1]
official_scope: []
learning_objectives:
  - 質量ゼロの時間順序二点核と原点外の二線核を導出し次数を求められる
  - 光円錐での同側境界値の積と原点への延長を区別できる
  - 複素Gaussian積分から対数発散の係数を計算できる
  - 位置空間減算とcutoff反項の対応および有限反項の自由度を導ける
  - 相対座標のデルタ反項を二頂点の対角の作用へ戻せる
