id: MQFC9
title: "OS Hilbert空間と時間並進半群"
volume: foundations
status: supplementary
prerequisites: [MQFC8, MQFC4, QM6, EVOL2]
official_scope: []
learning_objectives:
  - 反射形式から零空間商と完備化を構成し状態の同値性を説明できる
  - 反転と時間並進の関係および時間倍増評価から自己共役縮小半群を導ける
  - 自由Gaussian場で時間並進不変性と強連続性の仮定を検証できる
  - 半群のスペクトル表示と差商から非負生成作用素およびその定義域を求められる
  - 自由場の一次および二次状態の時間減衰とエネルギーを計算できる
