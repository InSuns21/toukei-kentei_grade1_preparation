  - { id: MQFC20-PROP-02, name: "表現間の平均化" }
  - { id: MQFC20-THM-01, name: "既約表現の行列要素の直交性" }
  - { id: MQFC20-THM-02, name: "既約指標の直交性" }
  - { id: MQFC20-THM-03, name: "群平均による不変部分空間への直交射影" }
  - { id: MQFC20-PROP-03, name: "格子の積Haar測度のゲージ不変性" }
canonical_examples: [U(1)の円周積分, SU(2)の球面二次モーメント, 有限指標射影, 共有辺のトレース積分]
