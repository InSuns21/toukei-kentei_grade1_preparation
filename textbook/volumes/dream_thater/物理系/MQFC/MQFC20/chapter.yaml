id: MQFC20
title: "Haar積分と表現の直交性"
volume: foundations
status: supplementary
prerequisites: [MQFC19, LREP2, LREP4]
official_scope: []
learning_objectives:
  - 正規化Haar測度の左・右・逆元不変性を説明しSU(2)の座標積分を計算できる
  - 表現間の平均化とSchurの補題から既約表現の行列要素の直交性を導出できる
  - 指標の直交性から重複度と有限指標射影を計算しテンソル積の指標展開を説明できる
  - 群平均と指標による射影を導出し不変成分と同値類ごとの成分を区別できる
  - 格子の積Haar測度のゲージ不変性を証明し共有辺を積分できる
