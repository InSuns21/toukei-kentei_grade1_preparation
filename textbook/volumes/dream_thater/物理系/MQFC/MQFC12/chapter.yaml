id: MQFC12
title: "質量ギャップと指数的相関減衰"
volume: foundations
status: supplementary
prerequisites: [MQFC9, MQFC10, MQFC11, QM6]
official_scope: []
learning_objectives:
  - 真空直交補空間のスペクトルでギャップを定義できる
  - 連結Euclid時間相関を有限正測度のLaplace積分として表せる
  - ギャップから指数評価を導き稠密な観測族で逆向きを証明できる
  - 個別観測の減衰率と全空間のギャップを区別できる
  - 真空一意性と有限系のギャップが極限の正の下界を保証しない理由を説明できる
