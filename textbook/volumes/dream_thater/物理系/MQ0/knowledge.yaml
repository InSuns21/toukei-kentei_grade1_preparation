  - QM8
  - AMECH6
  - MECH3
  - MECH7
  - EMAG3

concepts:
  - id: mathematical-quantum.canonical-quantization-basic
    name: 一次元 Schrödinger 表現での正準量子化の基本対応
    kind: definition
    aliases: ["basic canonical quantization correspondence in Schrodinger representation"]
    introduction: formal
    introduction_aliases: ["定義（一次元 Schrödinger 表現での正準量子化の基本対応）"]
    requires:
      - quantum.position-operator-self-adjoint
      - quantum.momentum-operator-fourier
      - quantum.canonical-commutation-relation
      - analytical-mechanics.hamiltonian

  - id: mathematical-quantum.symmetric-ordering-qp
    name: 対称順序量子化
    kind: definition
    aliases: ["symmetric ordering of qp"]
    introduction: formal
    introduction_aliases: ["定義（対称順序量子化）"]
    requires:
      - mathematical-quantum.canonical-quantization-basic
      - quantum.canonical-commutation-relation

  - id: mathematical-quantum.heisenberg-picture-observable
    name: Heisenberg 描像の観測量
    kind: definition
    aliases: ["Heisenberg picture observable"]
