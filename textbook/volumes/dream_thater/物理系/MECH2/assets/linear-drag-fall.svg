<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" data-layout-lint="strict" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">線形抵抗を受ける落下</title>
  <desc id="desc">下向きを正に取る。質点の重心 G から重力 mg は下向き、線形抵抗力 cv は上向きに作用する。右側の補助矢印 v は下向きの運動方向を示す。</desc>
  <rect width="760" height="430" fill="white"/>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0072B2"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#D55E00"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#009E73"/></marker>
  </defs>

  <circle cx="320" cy="215" r="48" fill="#F3F4F6" stroke="#374151" stroke-width="3"/>
  <circle cx="320" cy="215" r="6" fill="#1F2937"/>
  <text x="250" y="220" font-family="Noto Sans CJK JP, sans-serif" font-size="20" fill="#1F2937" font-weight="700">G</text>

  <line data-series-group="forces" data-series-label="cv" x1="320" y1="215" x2="320" y2="65" stroke="#009E73" stroke-width="5" stroke-dasharray="12 7" marker-end="url(#arrow-green)"/>
  <line data-series-group="forces" data-series-label="mg" x1="320" y1="215" x2="320" y2="380" stroke="#D55E00" stroke-width="5" marker-end="url(#arrow-orange)"/>
  <text x="350" y="92" font-family="Noto Sans CJK JP, sans-serif" font-size="24" fill="#009E73" font-weight="700">cv</text>
  <text x="350" y="355" font-family="Noto Sans CJK JP, sans-serif" font-size="24" fill="#D55E00" font-weight="700">mg</text>

  <line data-series-group="motion" data-series-label="v" x1="555" y1="145" x2="555" y2="300" stroke="#0072B2" stroke-width="4" stroke-dasharray="12 5 3 5" marker-end="url(#arrow-blue)"/>
  <text x="585" y="225" font-family="Noto Sans CJK JP, sans-serif" font-size="24" fill="#0072B2" font-weight="700">v</text>
</svg>
