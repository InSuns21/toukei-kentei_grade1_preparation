learning_objectives:
  - 静的計量の逆行列・接続・曲率を同じ座標と符号で導き、RindlerとSchwarzschildを区別できる
  - 静止時計の固有時、静止観測者の固有加速度、自由粒子の保存量を混同せず計算できる
  - Schwarzschild動径光線の座標走時と静止観測者間の重力赤方偏移を導ける
  - Newton弱場極限のPoisson方程式・加速度・時計比の近似次数を点検できる
  - TT波の偏極・検出器差動応答と円軌道二体系の先頭四重極波形・放射パワーを計算できる
  - 計量から観測までの複合問題で仮定・符号・次元・定義域を一貫して監査できる
