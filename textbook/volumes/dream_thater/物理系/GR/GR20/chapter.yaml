id: "GR20"
title: "Shapiro時間遅延"
volume: "foundations"
status: supplementary
prerequisites:
  - GR3
  - GR14
  - GR16
  - GR17
  - GR18
official_scope: []
learning_objectives:
  - Schwarzschild静的外部で光線のKilling保存量と光的条件から座標時間の厳密な積分式を導ける
  - 座標伝播時間と静止時計の固有時間の違いを計量から確かめられる
  - 面積半径から等方半径への変換と計量成分の検算ができる
  - 弱場等方計量の光的条件から光学的な線積分を一次まで求められる
  - 固定端点の直線長さの一次変分が消える理由を示せる
  - Shapiro片道座標時間超過の対数を導出しその端点条件と弱場極限を説明できる
  - 往復レーダー固有時間の換算と時計補正を正確に分離できる
  - 光子球付近や運動する装置へ弱場静止模型を無条件に外挿しない
definitions:
  - { id: GR20-DEF-01, name: Schwarzschild座標伝播時間 }
