id: "GR45"
title: "Killing地平線の表面重力"
volume: "foundations"
status: supplementary
prerequisites:
  - GR14
  - GR29
  - GR32
  - GR44
official_scope: []
learning_objectives:
  - Killing地平線上の零生成場から非アフィン係数として表面重力を定義しノルム勾配との同値性を証明できる
  - Killing場の一定倍による表面重力の変化と無限遠あるいは観測者での規格化を区別できる
  - 正則なEddington–Finkelstein座標から静的球対称計量の表面重力を導出できる
  - SchwarzschildとReissner–Nordströmの表面重力と極限を計算しSI加速度単位へ復元できる
  - Kerr地平線の回転Killing生成場を用いて表面重力が角度によらないことを直接検算できる
  - 赤方偏移を掛けた静止観測者の固有加速度との関係および古典幾何と熱力学の境界を説明できる
