  - { id: GR10-PROP-02, name: 体積密度の変分 }
  - { id: GR10-LEM-01, name: Levi-Civita接続の変分 }
  - { id: GR10-LEM-02, name: Palatini恒等式 }
  - { id: GR10-THM-01, name: Einstein–Hilbert作用の計量変分 }
canonical_examples:
  - Minkowski対角計量族で逆計量と体積密度の符号を直接検証
  - Minkowskiで局所的な接続変分の添字と符号を確認
  - コンパクト台の変分で発散項を積分消去
  - 平坦時空の非一様な変分で局所曲率変化と全微分を区別
  - 共形変分と一定曲率時空でEinsteinテンソルのトレースを検算
