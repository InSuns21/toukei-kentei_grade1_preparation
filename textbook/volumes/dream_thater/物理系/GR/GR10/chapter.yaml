id: "GR10"
title: "Einstein–Hilbert作用の変分"
volume: "foundations"
status: supplementary
prerequisites:
  - GR9
  - GR7
  - GR6
  - AMECH2
official_scope: []
learning_objectives:
  - 逆計量と共変計量の変分の符号を逆行列の恒等式から導出できる
  - Lorentz体積密度の座標不変性と変分公式を行列式から検算できる
  - Levi-Civita接続の計量変分を捩率零と計量両立性から再導出できる
  - Palatini恒等式を曲率の四項公式から示しRicci縮約の添字を追える
  - スカラー曲率と体積の変分を統合しEinsteinテンソルと宇宙項の係数を導ける
  - コンパクト台変分と境界での計量固定の違いを法線微分の例で説明できる
  - 共形計量変分と一定曲率模型で係数・符号を独立に検算できる
definitions:
  - { id: GR10-DEF-01, name: 逆計量変分と跡 }
  - { id: GR10-DEF-02, name: Lorentz体積密度 }
  - { id: GR10-DEF-03, name: Einstein–Hilbert作用 }
theorems:
