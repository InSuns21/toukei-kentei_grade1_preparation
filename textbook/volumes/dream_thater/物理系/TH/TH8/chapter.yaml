id: "TH8"
title: "相転移・磁性・Landau理論への入口"
volume: "foundations"
status: supplementary
prerequisites:
  - TH7
official_scope: []
learning_objectives:
  - 温度・外場を制御した自由エネルギーの枝から一次相転移と連続相転移を区別し、非解析性がどの導関数に現れるか説明できる
  - 秩序変数・磁化と共役外場の符号規約を定義し、極小値の包絡微分から磁化と感受率を求められる
  - 対称な四次Landau模型のすべての停留点・安定性・平衡自由エネルギーを温度ごとに証明できる
  - 四次模型の秩序変数・感受率・臨界等温線の臨界指数を導き、比熱の有限な跳びを計算できる
  - 六次Landau模型で一次転移の共存条件・秩序変数跳躍・潜熱と準安定枝を求められる
  - 共存点での外場・温度の微小変化を自由エネルギー差で評価し、熱力学的なClapeyron型関係を導ける
  - Landau理論が現象論的・平均場的近似であることと、有限系・揺らぎ・対称性に関する適用限界を説明できる
definitions:
  - { id: TH8-DEF-01, name: "秩序変数と対称性" }
  - { id: TH8-DEF-02, name: "共役外場と磁化" }
