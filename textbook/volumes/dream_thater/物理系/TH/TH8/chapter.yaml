  - { id: TH8-THM-02, name: "連続転移の自由エネルギーと比熱" }
  - { id: TH8-THM-03, name: "平均場感受率と臨界指数" }
  - { id: TH8-THM-04, name: "六次模型の一次転移と潜熱" }
  - { id: TH8-PROP-02, name: "共存線の外場・温度勾配" }
canonical_examples:
  - 二次模型で外場微分と感受率の正号を検算
  - 四次模型の正の温度差・負の温度差・臨界温度での極小比較
  - 磁場を正負に近づける際の秩序変数跳躍とエントロピー跳躍の区別
  - 六次模型の共存点と障壁の数値例
