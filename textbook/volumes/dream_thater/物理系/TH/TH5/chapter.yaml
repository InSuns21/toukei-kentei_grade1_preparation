learning_objectives:
  - 局所Legendre変換の可逆性条件と全微分の相殺を証明し、失敗例を説明できる
  - U・F・H・Gの定義と自然変数を、符号を含めて導出できる
  - 混合二階偏微分から四つのMaxwell関係式を導き、理想気体で検算できる
  - 一次同次性からEuler関係式とGibbs–Duhem関係式を途中式つきで証明できる
  - 明示的な基本関係と理想気体についてLegendre変換・化学ポテンシャルを計算できる
