id: "TH2"
title: "第一法則・内部エネルギー・熱・仕事"
volume: "foundations"
status: supplementary
prerequisites:
  - TH1
  - MECH1
  - RA3
official_scope: []
learning_objectives:
  - 閉鎖系の内部エネルギーが状態関数である意味を説明し、熱・仕事の正負を一貫して使える
  - 第一法則を用いて経路ごとの熱・仕事・内部エネルギー変化を分け、閉路の収支を証明できる
  - 外圧の力学的仕事から準静的な体積仕事の積分を導き、自由膨張へ誤適用しない
  - 状態方程式だけでは内部エネルギーの形が定まらないことを理解し、物性仮定を区別できる
  - 定積・定圧熱容量の関係と準静的等温仕事を途中式付きで導出できる
  - 定数熱容量の断熱曲線と等積・等温・等圧を組み合わせた一巡収支を再現できる
