id: "TH7"
title: "化学ポテンシャル・多成分系・相平衡"
volume: "foundations"
status: supplementary
prerequisites:
  - TH6
official_scope: []
learning_objectives:
  - 成分別化学ポテンシャルを多成分基本関係の偏微分として定義し、二成分の具体的な基本関係から計算できる
  - 多成分系の一次同次性からEuler関係式とGibbs–Duhem関係式を全微分まで導ける
  - 温度・圧力・総物質量の制約を固定して相間物質移動の平衡条件と二階安定判定を導ける
  - 単相ごとの化学ポテンシャルの全微分からClapeyron式と潜熱の関係を証明し、近似形と区別できる
  - 理想混合のGibbs自由エネルギーから化学ポテンシャル、混合エントロピー、組成曲率を計算できる
  - 化学量論係数に沿う方向微分から反応平衡条件とその安定判定を証明できる
  - 第三法則の完全結晶表示を仮定付きで述べ、熱容量積分と残留エントロピーの適用限界を説明できる
