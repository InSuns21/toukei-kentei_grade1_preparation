canonical_examples:
  - 二成分の一次同次な内部エネルギーから各成分の化学ポテンシャルを直接微分
  - 成分総量固定の移動座標と端点での片側微分の注意
  - 気液相共存でClapeyron式の符号とClausius–Clapeyron近似の追加仮定
  - 等モル理想混合で自由エネルギー低下とエントロピー増大を検算
  - 理想混合反応AとBの平衡組成比と正の反応曲率
  - 完全結晶の低温熱容量と零温度まで延長できない一定熱容量模型
