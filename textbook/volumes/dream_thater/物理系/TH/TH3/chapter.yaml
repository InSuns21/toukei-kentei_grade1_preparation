id: "TH3"
title: "第二法則・Carnotの定理・絶対温度"
volume: "foundations"
status: supplementary
prerequisites:
  - TH2
  - TH1
official_scope: []
learning_objectives:
  - 第一法則の収支と第二法則の禁止を区別し、循環機関と冷凍機の熱・仕事を符号付きで計算できる
  - Kelvin–PlanckとClausiusの二表現の同値性を装置の正味の熱・仕事を追って証明できる
  - 可逆性の環境まで含めた定義を説明し、準静的と可逆を区別できる
  - Carnotの定理を可逆冷凍機との合成によって証明し、効率上限を評価できる
  - 可逆熱量比の合成則から絶対温度を構成し、効率の温度比公式を導ける
  - 理想気体の二本の断熱曲線から体積比を導き、四行程の熱・仕事・効率を検算できる
