  - { id: TH3-PROP-02, name: "第二法則の二表現の同値性" }
  - { id: TH3-THM-01, name: "Carnotの定理" }
  - { id: TH3-PROP-03, name: "二熱浴での完全変換の禁止" }
  - { id: TH3-PROP-04, name: "可逆熱量比の合成則" }
  - { id: TH3-THM-02, name: "可逆熱量比と絶対温度の関係" }
  - { id: TH3-PROP-05, name: "理想気体Carnot循環" }
canonical_examples:
  - 二熱浴熱機関の100 J収支と符号
  - 摩擦がある準静的ピストンと可逆性の区別
  - 冷凍機と一浴機関を組み合わせたClausius違反
  - 可逆機関と実機の高温交換を相殺する効率比較
  - 中間熱浴を介した可逆熱量比の合成
  - 理想気体の等温・断熱四行程の効率
