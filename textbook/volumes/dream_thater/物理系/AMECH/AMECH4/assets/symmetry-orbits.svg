<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" data-layout-lint="strict" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">並進対称性と回転対称性の1パラメータ変換</title>
  <desc id="desc">左は点 q を一定方向 a に平行移動して q epsilon へ移す変換、右は原点 O のまわりで点 q を微小回転して q epsilon へ移す変換を示す。回転では生成方向 xi が円の接線方向を向く。</desc>
  <rect width="920" height="420" fill="white"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
    <marker id="blue-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#0072B2"/>
    </marker>
  </defs>

  <line x1="460" y1="55" x2="460" y2="365" stroke="#D1D5DB" stroke-width="2"/>

  <circle cx="150" cy="235" r="8" fill="#111827"/>
  <circle cx="330" cy="155" r="8" fill="#111827"/>
  <line x1="160" y1="230" x2="315" y2="162" stroke="#0072B2" stroke-width="4" marker-end="url(#blue-arrow)"/>
  <text x="126" y="272" font-family="Noto Sans CJK JP, sans-serif" font-size="24" fill="#111827">q</text>
  <text x="345" y="132" font-family="Noto Sans CJK JP, sans-serif" font-size="24" fill="#111827">qε</text>
  <text x="202" y="165" font-family="Noto Sans CJK JP, sans-serif" font-size="24" fill="#0072B2">a</text>

  <circle cx="665" cy="245" r="7" fill="#111827"/>
  <text x="641" y="280" font-family="Noto Sans CJK JP, sans-serif" font-size="24" fill="#111827">O</text>
  <circle cx="665" cy="245" r="105" fill="none" stroke="#9CA3AF" stroke-width="3" stroke-dasharray="10 8"/>
  <circle cx="744" cy="176" r="8" fill="#111827"/>
  <circle cx="773" cy="227" r="8" fill="#111827"/>
  <line x1="665" y1="245" x2="738" y2="181" stroke="#374151" stroke-width="3"/>
  <line x1="665" y1="245" x2="766" y2="228" stroke="#374151" stroke-width="3"/>
  <path d="M716 184 Q744 190 758 215" fill="none" stroke="#0072B2" stroke-width="4" marker-end="url(#blue-arrow)"/>
  <line x1="744" y1="176" x2="786" y2="224" stroke="#D55E00" stroke-width="4" marker-end="url(#orange-arrow)"/>
  <text x="758" y="140" font-family="Noto Sans CJK JP, sans-serif" font-size="24" fill="#111827">q</text>
  <text x="808" y="270" font-family="Noto Sans CJK JP, sans-serif" font-size="24" fill="#111827">qε</text>
  <text x="812" y="188" font-family="Noto Sans CJK JP, sans-serif" font-size="24" fill="#D55E00">ξ</text>
</svg>
