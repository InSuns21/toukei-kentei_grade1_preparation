id: "AMECH7"
title: "正準変換"
volume: "foundations"
status: supplementary
prerequisites:
  - AMECH6
  - VC1
official_scope: []
learning_objectives:
  - 正準変換を、相空間の局所座標変換が基本 Poisson 括弧を保つという条件で定義できる
  - 正準変換が任意の相空間関数の Poisson 括弧を保つことを連鎖律から証明できる
  - 変換の Jacobian 行列 M と標準行列 J を用いて M J M^T=J および M^T J M=J という正準条件を判定できる
  - 一自由度では正準条件が det partial(Q,P)/partial(q,p)=1 に一致する一方、多自由度では体積保存だけでは不十分であることを反例で説明できる
  - Hamiltonian flow の微分 D Phi_t が正準条件を保つことを変分方程式から示せる
  - 第2種母関数 F_2(q,P,t) から p=partial F_2/partial q, Q=partial F_2/partial P を作り、正準変換を構成できる
  - 時間依存母関数では新 Hamiltonian が K=H+partial F_2/partial t となることを作用積分の境界項から導ける
  - 正準 shear、正準 scaling、移動座標系を具体計算し、非正準変換との違いを Poisson 括弧で判定できる
  - 母関数で K=0 を狙うことが Hamilton--Jacobi 方程式へつながる見取り図を説明できる
