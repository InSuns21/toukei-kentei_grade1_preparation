  - { id: AMECH7-THM-02, name: "正準変換の Jacobian 行列条件" }
  - { id: AMECH7-PROP-01, name: "一自由度の正準条件" }
  - { id: AMECH7-PROP-02, name: "正準変換の局所体積保存" }
  - { id: AMECH7-THM-03, name: "Hamiltonian flow は正準変換" }
  - { id: AMECH7-THM-04, name: "第2種母関数による正準変換と Hamiltonian の変換" }
canonical_examples:
  - "Q=a q, P=p/a が正準変換であることを Poisson 括弧から確認する例"
  - "Q=q, P=p+alpha q の正準 shear と、Q=a q, P=a p の非正準 scaling を比較する例"
  - "一次元調和振動子の Hamiltonian flow が正準変換であることを行列条件から確認する例"
  - "F_2(q,P)=qP-alpha q^2/2 から正準 shear を構成する例"
  - "F_2(q,P,t)=(q-a(t))P により移動座標 Q=q-a(t) と K=H-dot a P を導く例"
