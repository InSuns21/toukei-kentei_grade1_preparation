id: "SREL6"
title: "電磁場のLorentz変換・エネルギー運動量テンソル"
volume: "foundations"
status: supplementary
prerequisites:
  - SREL5
official_scope: []
learning_objectives:
  - Lorentz boostで電場と磁場が混合する符号と係数を計算し二つの場の不変量を導ける
  - 計量とSI単位を固定し電磁場のエネルギー運動量テンソルを定義して成分・応力を導ける
  - 電磁場テンソルの縮約からエネルギー運動量テンソルの対称性・零トレース・Lorentz共変性を示せる
  - Maxwell方程式の二つの四元式から局所エネルギー運動量収支を導き物質への力密度を計算できる
  - 平面電磁波の場・エネルギー流・運動量密度・boost変換を全成分で検算できる
