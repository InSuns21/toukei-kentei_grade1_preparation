  - { id: SREL6-THM-02, name: エネルギー運動量テンソルの共変性・対称性・零トレース }
  - { id: SREL6-THM-03, name: 電磁場のエネルギー運動量収支 }
canonical_examples:
  - 純電場のboostで現れる磁場と負のPoynting流
  - 純静電場のエネルギー運動量テンソルの直接成分確認
  - null電磁波の局所収支とboost時のDoppler因子
