  - "接ベクトルの行列式で横断・接触を区別"
  - "q0=4arctan(exp t), p0=2sech tを分離曲線として検算"
  - "時間周期強制を位相作用の自律Hamilton系へ拡張"
  - "小さい正の周波数でMelnikov積分の単純零点を導出"
  - "ローブの上下グラフの面積積分"
