  - { id: CELE6-PROP-02, name: "振り子のホモクリニック分離曲線" }
  - { id: CELE6-PROP-03, name: "強制振り子の鞍型周期軌道" }
  - { id: CELE6-THM-01, name: "強制振り子のMelnikov関数と単純零点" }
  - { id: CELE6-PROP-04, name: "分離量の単純零点から横断交差へ" }
  - { id: CELE6-PROP-05, name: "二記号horseshoeから導く複雑さ" }
  - { id: CELE6-PROP-06, name: "ローブ面積の保存とグラフ表示" }
external_results:
  - "非線形安定多様体定理とパラメータ依存性：graph transformを要する外部入力として仮定を明示"
  - "Melnikov分離量のC1一様二次剰余：安定多様体の存在とは別に無限時間の摂動評価を要する外部入力"
  - "Smale–Birkhoffホモクリニック定理：一般の平面horseshoe構成は意図的黒箱"
canonical_examples:
