id: "CELE6"
title: "ホモクリニック構造とHamiltonian chaos"
volume: "foundations"
status: supplementary
prerequisites:
  - CELE5
  - CELE4
  - INT7
  - DYN13
  - DYN14
  - ODE11
official_scope: []
learning_objectives:
  - 双曲固定点の安定集合・不安定集合および横断ホモクリニック点を定義から判定できる
  - ホモクリニック点の全反復で両側収束と横断性が保存されることを証明できる
  - 振り子の分離曲線をHamilton方程式と保存エネルギーから検算できる
  - 周期強制振り子を自律二自由度Hamilton系へ拡張し帰還写像の乗数を導ける
  - Melnikov関数の符号と部分積分を追い単純零点を証明できる
  - 分離量のC1一様展開と非線形安定多様体定理が横断判定に必要な理由を説明できる
  - Smale–Birkhoff定理の仮定と結論を正確に述べ外部定理と本文中の証明を区別できる
  - 二記号両側シフト上の周期点数を導き帰還写像との反復の違いを説明できる
  - ローブ面積の積分公式と面積保存を導き制限三体問題での適用条件を列挙できる
definitions:
  - { id: CELE6-DEF-01, name: "双曲固定点と周期軌道" }
