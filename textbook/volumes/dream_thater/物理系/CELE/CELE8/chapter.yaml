id: "CELE8"
title: "太陽系の長期力学"
volume: "foundations"
status: supplementary
prerequisites:
  - CELE4
  - CELE5
  - CELE7
  - INT8
official_scope: []
learning_objectives:
  - 間接項を含む階層的三体摂動関数を展開し二重平均の成立条件を説明できる
  - 円軌道の外側摂動天体による四重極永年Hamiltonianを平均近点角の測度から導出できる
  - 平面Delaunay作用で近日点の永年歳差速度と適用限界を導ける
  - 平均運動共鳴の遅い角度と整数比から共鳴位置および振り子島幅を求められる
  - Kirkwood空隙の位置推算と軌道輸送の証明を区別できる
  - Trojan型1対1共軌道運動と三角形Lagrange点の線形安定条件を適用できる
  - 円公転剛体の自転・公転1対1共鳴を振り子模型に帰着して周波数と速度幅を求められる
  - 面積保存数値写像を検証し長期安定性の厳密理論・平均化・有限時間計算を区別できる
definitions:
  - { id: CELE8-DEF-01, name: "二重平均と永年摂動" }
  - { id: CELE8-DEF-02, name: "平均運動共鳴" }
  - { id: CELE8-DEF-03, name: "Trojan型の共軌道運動" }
  - { id: CELE8-DEF-04, name: "1対1自転・公転共鳴" }
theorems:
  - { id: CELE8-PROP-01, name: "円軌道外部摂動天体の四重極永年項" }
  - { id: CELE8-PROP-02, name: "平面円外部摂動の永年近日点歳差" }
  - { id: CELE8-PROP-03, name: "共鳴正規形の島幅" }
  - { id: CELE8-PROP-04, name: "自転・公転同期の振り子模型" }
  - { id: CELE8-PROP-05, name: "振り子の一段数値写像の面積保存" }
canonical_examples:
  - 二重平均で整数Fourierモードが消える直接積分と共鳴近傍の限界
  - Legendre多項式の円周平均とKepler楕円の平均半径二乗
  - Delaunay作用変換からの歳差速度の再計算
  - 木星半径5.2AUを模型値とした内側2対1・3対1共鳴位置
  - 正三角形Lagrange点の線形安定条件を質量比に代入
  - 同期自転振り子の線形化と分離曲線上の速度幅
  - symplectic Eulerの行列式とエネルギー非保存の反例
problem_patterns:
  - CELE8-DOUBLE-AVERAGE
  - CELE8-QUADRUPOLE-AVERAGE
  - CELE8-KEPLER-MEAN-ANOMALY
  - CELE8-MEAN-MOTION-LOCATION
  - CELE8-TROJAN-STABILITY
  - CELE8-APSIS-PRECESSION
  - CELE8-RESONANCE-WIDTH
  - CELE8-SPIN-ORBIT
  - CELE8-SYMPLECTIC-STEP
  - CELE8-LONG-TERM-SYNTHESIS
past_exam_alignment: []
integrated_exam_problems: []
exercise_counts: { level_a: 5, level_b: 4, level_c: 1, level_d: 0 }
estimated_hours: { reading: 11, exercises: 8, review: 3 }
