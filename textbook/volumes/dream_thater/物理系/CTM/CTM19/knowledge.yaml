    introduction: formal
    introduction_aliases: ["定義（標準線形固体と内部応力）"]
    requires: [continuum.maxwell-series-connection]
  - id: continuum.sls-internal-stress
    name: 標準線形固体の内部応力
    kind: definition
    introduction: formal
    introduction_aliases: ["定義（標準線形固体と内部応力）"]
    requires: [continuum.standard-linear-solid]
  - id: continuum.relaxation-function
    name: ひずみステップによる緩和関数
    aliases: [緩和関数]
    kind: definition
    introduction: formal
    requires: [continuum.standard-linear-solid]
  - id: continuum.sls-history-integral
    name: 標準線形固体の緩和関数と履歴積分
    kind: theorem
    introduction: formal
    requires: [continuum.sls-internal-stress, continuum.relaxation-function]
  - id: continuum.sls-creep
