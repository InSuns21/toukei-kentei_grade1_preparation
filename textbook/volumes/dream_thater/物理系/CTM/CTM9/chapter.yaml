id: "CTM9"
title: "仕事と熱はエネルギー収支でどう結ばれるか"
volume: "foundations"
status: supplementary
prerequisites:
  - CTM8
official_scope: []
learning_objectives:
  - "比内部エネルギー、温度、熱流束、比熱供給率の意味と単位を区別し、外向き熱流束の符号から入出熱を判定できる"
  - "物質領域の全エネルギー第一法則から運動エネルギー収支を差し引き、rho D_t e=sigma:D-div q+rho r を完全な仮定のもとで導ける"
  - "境界の面力仕事・熱流出・体積熱源を別々に積分し、局所と積分のエネルギー収支を検算できる"
  - "Q=J F^{-1}(q o chi) と P:dot F=J sigma:D を使い、基準配置の内部エネルギー収支を証明できる"
  - "第一法則と温度-内部エネルギー・熱流束の構成則を区別し、断熱・流入・流出境界条件の符号を判定できる"
