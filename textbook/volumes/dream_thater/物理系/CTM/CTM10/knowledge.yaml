  - id: continuum.helmholtz-free-energy
    name: 比 Helmholtz 自由エネルギー
    kind: definition
    introduction: formal
    introduction_aliases: ["定義（比 Helmholtz 自由エネルギー）"]
    requires: [continuum.specific-internal-energy, continuum.entropy-inequality]
  - id: continuum.clausius-duhem
    name: Clausius–Duhem 散逸不等式
