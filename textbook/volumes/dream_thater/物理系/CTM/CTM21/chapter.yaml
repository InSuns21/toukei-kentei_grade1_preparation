id: "CTM21"
title: "成長を単なる弾性変形と区別するには"
volume: "foundations"
status: supplementary
prerequisites:
  - CTM20
official_scope: []
learning_objectives:
  - "物質領域の質量源を含む積分収支を物質・空間の局所式へ導き、密度と体積倍率の違いを説明できる"
  - "乗法的成長分解F=FeFgを追加の構成仮定として導入し、弾性・成長倍率と観測者回転を検算できる"
  - "一定自然密度の仮定の下で、三次元等方成長の質量源と現在密度を導出できる"
  - "成長体積当たりエネルギーから基準体積エネルギーと第一Piola応力を方向微分で導ける"
  - "一次元の自由成長・両端固定・非一様成長の変位、応力、境界力を符号と単位込みで解ける"
  - "結合した二層の残留応力と、三次元の非整合成長場を別の機構として判定できる"
  - "成長による弾性蓄積率を計算し、物質供給と化学エネルギーの未規定部分を区別できる"
