  - "三次元等方成長と軸のみの成長でJgの違いを行列式で確かめる"
  - "自然長と固定長で弾性倍率・境界反力の符号を直接検算する"
  - "空間的に異なる成長を一自由棒なら無応力化できる反例"
  - "並列結合棒で張力と圧縮が釣り合う残留応力を検算する"
  - "成長場の混合偏微分の矛盾から非整合を検出する"
  - "固定棒の弾性蓄積と供給機構の必要性を算出する"
