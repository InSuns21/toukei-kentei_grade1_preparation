<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 370" role="img" aria-labelledby="ttl desc" data-layout-lint="strict">
<title id="ttl">Cauchy の小四面体</title>
<desc id="desc">四面体の斜面ABCには外向き法線nと面力t(n)がある。原点Oを含む三つの座標面は外向き法線がそれぞれマイナスe1、マイナスe2、マイナスe3で、斜面の法線成分n1、n2、n3の比率だけの面積を持つ。</desc>
<defs>
<marker id="arr-solid" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#204f7b"/></marker>
<marker id="arr-dash" markerWidth="8" markerHeight="8" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#a04430"/></marker>
</defs>
<g fill="#c7dee7" fill-opacity=".65" stroke="#3b5867" stroke-width="1.6">
<polygon points="150,277 408,263 113,102" fill="#e6edf2"/>
<polygon points="150,277 408,263 330,125" fill="#d3e7e4"/>
<polygon points="150,277 113,102 330,125" fill="#ebebdf"/>
<polygon points="408,263 113,102 330,125" fill="#aacbdc"/>
</g>
<g font-family="sans-serif" font-size="16" fill="#233643">
<text x="135" y="305">O</text><text x="411" y="277">A</text><text x="90" y="92">B</text><text x="334" y="116">C</text>
<text x="269" y="172">A, n</text>
<text x="259" y="325">−e3 面</text>
<text x="115" y="193">−e1 面</text>
<text x="405" y="180">−e2 面</text>
</g>
<g stroke="#204f7b" stroke-width="3" fill="none" marker-end="url(#arr-solid)" data-series-group="tetra-vectors" data-series-label="outward-normal">
<line x1="286" y1="167" x2="339" y2="63"/>
</g>
<text x="343" y="58" font-size="19" fill="#204f7b" font-family="sans-serif">n</text>
<g stroke="#a04430" stroke-width="3" stroke-dasharray="8 4" fill="none" marker-end="url(#arr-dash)" data-series-group="tetra-vectors" data-series-label="surface-force">
<line x1="286" y1="167" x2="401" y2="96"/>
</g>
<text x="406" y="91" font-size="18" fill="#9a3829" font-family="sans-serif">t(n)</text>
<text x="21" y="350" fill="#304550" font-family="sans-serif" font-size="14">模式図：座標面積 Ai = A |ni|（斜面積 A）</text>
</svg>
