learning_objectives:
  - "基準体積当たりのエネルギーと第一Piola応力の仕事共役を区別し、超弾性P=partial_F Wの定義域と仮定を説明できる"
  - "客観性と材料等方性の左・右回転を区別し、有限変形の不変量を具体的に検算できる"
  - "圧縮可能neo-Hooke模型を方向微分から導き、P、第二Piola応力、Cauchy応力を算出できる"
  - "一様伸長の面積・traction・側面境界と単純せん断の垂直応力を検算できる"
  - "小変形極限のエネルギーと応力が等方Hooke則へ戻ることを二次・一次展開で示せる"
