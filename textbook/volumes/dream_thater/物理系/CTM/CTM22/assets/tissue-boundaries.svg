<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 290" width="850" height="290" role="img" aria-labelledby="title desc" data-layout-lint="strict">
  <title id="title">一次元組織の自由端と両端固定の境界条件</title>
  <desc id="desc">上段は左端を固定した帯の右端が面力零である。下段は両端固定で、引張応力が正のとき帯に働く左端外力は左向きマイナスAs、右端外力は右向きプラスAsとなる。矢印は帯に作用する外力である。</desc>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#244b6b"/></marker>
  </defs>
  <g font-family="DejaVu Sans, sans-serif" font-size="19" fill="#172b4d">
    <text x="160" y="32">left fixed / right free</text>
    <rect x="160" y="61" width="490" height="39" rx="3" fill="#e6f0f6" stroke="#244b6b" stroke-width="2"/>
    <rect x="144" y="56" width="16" height="49" fill="#b1bac7" stroke="#536274" stroke-width="1.5"/>
    <path d="M146 56 l12 12 m-12 0 l12 12 m-12 0 l12 12 m-12 0 l12 12" stroke="#627285" stroke-width="1.5"/>
    <text x="160" y="131" text-anchor="middle">u(0)=0</text>
    <text x="650" y="131" text-anchor="middle">σ(L)=0</text>
    <text x="160" y="171">both ends fixed (s &gt; 0)</text>
    <rect x="160" y="200" width="490" height="39" rx="3" fill="#e6f0f6" stroke="#244b6b" stroke-width="2"/>
    <rect x="144" y="195" width="16" height="49" fill="#b1bac7" stroke="#536274" stroke-width="1.5"/>
    <rect x="650" y="195" width="16" height="49" fill="#b1bac7" stroke="#536274" stroke-width="1.5"/>
    <path d="M146 195 l12 12 m-12 0 l12 12 m-12 0 l12 12 m-12 0 l12 12 M652 195 l12 12 m-12 0 l12 12 m-12 0 l12 12 m-12 0 l12 12" stroke="#627285" stroke-width="1.5"/>
    <path d="M160 219 H66" stroke="#244b6b" stroke-width="3" fill="none" marker-end="url(#arr)"/>
    <path d="M650 219 H744" stroke="#244b6b" stroke-width="3" fill="none" marker-end="url(#arr)"/>
    <text x="110" y="273" text-anchor="middle">F0 = -As</text>
    <text x="700" y="273" text-anchor="middle">FL = +As</text>
  </g>
</svg>
