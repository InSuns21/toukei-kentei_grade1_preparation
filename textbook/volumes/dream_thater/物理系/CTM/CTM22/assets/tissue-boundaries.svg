<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" width="480" height="330" role="img" aria-labelledby="title desc" data-layout-lint="strict">
  <title id="title">一次元組織の自由端と両端固定の境界条件</title>
  <desc id="desc">上段では左端変位が零、右端の面力が零。下段は両端変位零で、引張応力が正のとき帯に作用する左端外力が左向き、右端外力が右向き。矢印は組織帯に作用する外力。</desc>
  <defs>
    <marker id="force-arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#184769"/>
    </marker>
  </defs>
  <g font-family="DejaVu Sans, sans-serif" font-size="20" fill="#1c2936">
    <text x="32" y="31">Left fixed, right free</text>
    <rect x="110" y="70" width="260" height="42" rx="3" fill="#deedf6" stroke="#184769" stroke-width="2"/>
    <rect x="95" y="64" width="15" height="54" fill="#b8c6d2" stroke="#536a7a" stroke-width="1.5"/>
    <path d="M96 65 l12 12 m-12 0 l12 12 m-12 0 l12 12 m-12 0 l12 12" stroke="#596e80" stroke-width="1.5" fill="none"/>
    <text x="110" y="145" text-anchor="middle">u(0)=0</text>
    <text x="369" y="145" text-anchor="middle">σ(L)=0</text>
    <text x="32" y="196">Both fixed (s &gt; 0)</text>
    <rect x="110" y="237" width="260" height="42" rx="3" fill="#deedf6" stroke="#184769" stroke-width="2"/>
    <rect x="95" y="231" width="15" height="54" fill="#b8c6d2" stroke="#536a7a" stroke-width="1.5"/>
    <rect x="370" y="231" width="15" height="54" fill="#b8c6d2" stroke="#536a7a" stroke-width="1.5"/>
    <path d="M96 232 l12 12 m-12 0 l12 12 m-12 0 l12 12 m-12 0 l12 12 M371 232 l12 12 m-12 0 l12 12 m-12 0 l12 12 m-12 0 l12 12" stroke="#596e80" stroke-width="1.5" fill="none"/>
    <path d="M110 258 H36" stroke="#184769" stroke-width="3" fill="none" marker-end="url(#force-arrow)"/>
    <path d="M370 258 H444" stroke="#184769" stroke-width="3" fill="none" marker-end="url(#force-arrow)"/>
    <text x="72" y="319" text-anchor="middle">−As</text>
    <text x="409" y="319" text-anchor="middle">+As</text>
  </g>
</svg>
