<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" data-layout-lint="strict" role="img" aria-labelledby="title desc">
<title id="title">平行平板 Poiseuille 流の圧力差、放物線速度分布、壁面せん断 traction</title>
<desc id="desc">上壁と下壁は静止。左の高い入口圧力から右の低い出口圧力へ流れる。中央に向かうほど右向きの速度矢印が長くなり、先端は放物型の破線に並ぶ。上下壁から流体へ働くせん断 traction は両方とも左向き。流量 q は右向き。</desc>
