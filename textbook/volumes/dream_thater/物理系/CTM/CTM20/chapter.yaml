id: "CTM20"
title: "内部エネルギーを消費する能動応力をどう記述するか"
volume: "foundations"
status: supplementary
prerequisites:
  - CTM19
official_scope: []
learning_objectives:
  - "受動応力と燃料で駆動される能動応力の構成則上の違い、引張正の収縮性張力の符号と次元を説明できる"
  - "一次元の準静的運動量釣合と境界tractionを導き、自由端と両端固定で変位・支持体の反力を求められる"
  - "非一様な活動応力について全応力一定の条件と境界条件から変位を求められる"
  - "化学自由エネルギーの蓄積と消費率を含む仕事・散逸収支を導き、第二法則と受動散逸を区別できる"
  - "粘性を持つ自由帯の活動ステップ応答とその積算エネルギーを検算できる"
  - "繊維方向の三次元能動応力を法線tractionへ写し、対称性と観測者回転の客観性を検算できる"
definitions:
  - { id: CTM20-DEF-01, name: "一次元の能動応力模型" }
  - { id: CTM20-DEF-02, name: "化学エネルギー蓄積と消費率" }
theorems:
  - { id: CTM20-THM-01, name: "能動帯の準静的釣合と境界力" }
  - { id: CTM20-PROP-01, name: "一様能動張力の自由収縮と固定反力" }
  - { id: CTM20-PROP-02, name: "非一様能動応力と拘束反力" }
  - { id: CTM20-THM-02, name: "化学エネルギーを含めた非負散逸条件" }
  - { id: CTM20-PROP-03, name: "粘性を持つ自由帯の活動ステップ応答" }
  - { id: CTM20-PROP-04, name: "繊維に沿う能動応力の対称性・客観性" }
canonical_examples:
  - "固定帯と自由端の能動張力・短縮ひずみの符号の直接検算"
  - "一定能動張力による境界反力を自由物体図と力の総和で検算"
  - "非一様活動場で平均応力と局所ひずみを積分"
  - "化学消費率を入れた非負散逸と燃料枯渇を検算"
  - "活動開始後の過渡収縮・積算化学消費・弾性蓄積・粘性散逸の一致"
  - "繊維方向を回転したときの応力とtractionの共変性"
