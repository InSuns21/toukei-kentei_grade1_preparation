<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" width="820" height="290" role="img" aria-labelledby="title desc" data-layout-lint="strict">
  <title id="title">両端固定した能動的な帯の境界力</title>
  <desc id="desc">横方向の帯の左端は固定され、帯に作用する左端の外力は左向き、右端は右向きである。内部の能動張力は正で、帯が支持体へ及ぼす力はこれらと反対になり支持体を互いに引き寄せる。</desc>
  <rect x="0" y="0" width="820" height="290" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L8 4.5 L0 9 Z" fill="#1c4360"/>
    </marker>
  </defs>
  <rect x="170" y="125" width="480" height="68" fill="#e9f2f7" stroke="#425a69" stroke-width="2"/>
  <rect x="156" y="112" width="12" height="92" fill="#71838f"/>
  <rect x="652" y="112" width="12" height="92" fill="#71838f"/>
  <text x="160" y="86" font-size="20" text-anchor="middle" fill="#182b39">fixed</text>
  <text x="657" y="86" font-size="20" text-anchor="middle" fill="#182b39">fixed</text>
  <text x="410" y="163" font-size="24" text-anchor="middle" fill="#182b39">ε = 0, σ = a &gt; 0</text>
  <line x1="171" y1="160" x2="75" y2="160" stroke="#1c4360" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="649" y1="160" x2="745" y2="160" stroke="#1c4360" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="90" y="227" font-size="22" text-anchor="middle" fill="#1c4360">-Aa</text>
  <text x="730" y="227" font-size="22" text-anchor="middle" fill="#1c4360">+Aa</text>
  <line x1="170" y1="252" x2="650" y2="252" stroke="#425a69" stroke-width="2"/>
  <line x1="170" y1="246" x2="170" y2="258" stroke="#425a69" stroke-width="2"/>
  <line x1="650" y1="246" x2="650" y2="258" stroke="#425a69" stroke-width="2"/>
  <text x="170" y="284" font-size="18" text-anchor="middle" fill="#182b39">0</text>
  <text x="650" y="284" font-size="18" text-anchor="middle" fill="#182b39">L</text>
</svg>
