  - { id: CTM13-THM-02, name: "縦波・横波の波速" }
  - { id: CTM13-PROP-01, name: "発散と回転の伝播方程式" }
  - { id: CTM13-PROP-02, name: "弾性波の局所エネルギー保存" }
canonical_examples:
  - "進行方向と粒子変位の平行・垂直の直接確認"
  - "音響テンソルの基底計算と二つの固有値"
  - "波速と周波数・波長の単位検算"
  - "単色進行横波の応力・エネルギー流束"
  - "矩形物体の定在横波と全側面のtraction"
