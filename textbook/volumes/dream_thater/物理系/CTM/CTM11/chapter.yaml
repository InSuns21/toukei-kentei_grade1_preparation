id: "CTM11"
title: "Hooke則と等方線形弾性の独立な定数"
volume: "foundations"
status: supplementary
prerequisites:
  - CTM10
official_scope: []
learning_objectives:
  - "微小ひずみを有限ひずみの一次近似から導き、回転と伸縮を具体例で区別できる"
  - "材料等方性から二定数の二次弾性エネルギーとHooke則を導出できる"
  - "体積ひずみと偏差ひずみへ分解し、エネルギー正定値性と係数の条件を必要十分に証明できる"
  - "一軸応力と一軸ひずみの違いを説明し、Young率・Poisson比とLamé係数を相互に変換できる"
  - "引張り・せん断・体積変化の実験をエネルギーと応力の両方から照合し、線形近似の限界を説明できる"
