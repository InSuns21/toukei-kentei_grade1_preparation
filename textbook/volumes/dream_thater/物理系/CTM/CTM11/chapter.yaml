  - { id: CTM11-PROP-01, name: "エネルギーの直交分解と正定値条件" }
  - { id: CTM11-THM-02, name: "Lamé係数・Young率・Poisson比の関係" }
canonical_examples:
  - "微小剛体回転と伸縮のひずみ対比"
  - "体積伸びと純せん断におけるKとmuの役割"
