id: "CELEV6"
title: "n体舞踏解・組み紐と軌道分類"
volume: "foundations"
status: supplementary
prerequisites:
  - CELEV5
  - CELEV4
  - CELEV1
  - CELE2
  - CA5
official_scope: []
learning_objectives:
  - 等質量n体単純舞踏解の粒子番号と周期の位相規約を式で検証できる
  - 円形正n角形の加速度を粒子ごとに計算し任意のnのNewton舞踏解を構成できる
  - 衝突のない配置空間と周期組み紐を定義しラベル付きと巡回置換閉合を区別できる
  - 二粒子の相対巻き数が整数となり非衝突ホモトピーで不変なことを証明できる
  - 正多角形舞踏解の全粒子対の相対巻き数を計算できる
  - 8の字と円形解・Hip-Hop型・数値候補を混同せず存在と対称性の論理を区別できる
definitions:
  - { id: CELEV6-DEF-01, name: "等質量平面n体の単純舞踏解" }
  - { id: CELEV6-DEF-02, name: "ラベル付き配置空間と周期組み紐" }
  - { id: CELEV6-DEF-03, name: "周期軌道の対ごとの相対巻き数" }
theorems:
  - { id: CELEV6-PROP-01, name: "単純舞踏解の巡回位相と重心" }
  - { id: CELEV6-THM-01, name: "等質量正多角形の円形舞踏解" }
  - { id: CELEV6-PROP-02, name: "巻き数の整数性と非衝突変形不変性" }
canonical_examples:
  - 三体と四体の位相差の検算
  - 正二角形と正三角形のNewton力の計算
  - 二粒子の時空間組み紐と静止配置の比較
  - 正多角形円運動の全粒子対巻き数
  - 8の字の自己交差と同時刻衝突の区別
problem_patterns:
  - CELEV6-PHASE-INDEX
  - CELEV6-NEWTON-TWO-BODY
  - CELEV6-WINDING-DOUBLE
  - CELEV6-SELF-INTERSECTION
