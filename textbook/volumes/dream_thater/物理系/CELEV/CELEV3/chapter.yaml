  - CELEV3-KEPLER-SINGULAR-INTEGRAL
  - CELEV3-BARYCENTER-PROJECTION
  - CELEV3-TRANSVERSE-SURGERY
  - CELEV3-STRONG-FORCE-H1
  - CELEV3-SYMMETRIC-PASTING
  - CELEV3-FREE-ENDPOINT-COMPETITORS
  - CELEV3-ONE-DIMENSION-FAILURE
  - CELEV3-COLLISIONLESS-PERIODIC-EXISTENCE
