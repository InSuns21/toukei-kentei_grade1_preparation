id: "CELEV8"
title: "数値変分法と実際のn体シミュレーション"
volume: "foundations"
status: supplementary
prerequisites:
  - CELEV7
  - CELEV6
  - CELEV2
  - CELEV1
  - CELE2
  - CELE3
  - NA1
  - NA6
forward_references: []
official_scope: []
learning_objectives:
  - 周期格子上の離散Newton作用を連続作用から導き、係数と周期添字を確かめられる
  - 離散勾配と中央差分Newton方程式を符号を含めて導出できる
  - 三体舞踏・重心零・反転対称性を満たす直交射影を導出できる
  - 射影勾配法の作用降下と特異点・局所停留の限界を証明できる
  - velocity-Verletの更新をNewton力から実装し全運動量保存を示せる
  - エネルギー・重心・角運動量・格子残差と閉合残差を区別できる
  - ブラウザ内Pythonの積分と変分探索を操作し初期値依存性・刻み依存性を説明できる
  - 数値停留点と連続周期解の厳密存在証明を混同しない
definitions:
  - { id: CELEV8-DEF-01, name: "周期格子上の離散Newton作用" }
  - { id: CELEV8-DEF-02, name: "離散Newton残差" }
  - { id: CELEV8-DEF-03, name: "三体舞踏格子の直交射影" }
  - { id: CELEV8-DEF-04, name: "固定刻みvelocity-Verlet法" }
theorems:
  - { id: CELEV8-PROP-01, name: "離散Newton作用の勾配" }
  - { id: CELEV8-PROP-02, name: "射影の制約保存と最小距離" }
  - { id: CELEV8-PROP-03, name: "射影勾配の局所降下方向" }
  - { id: CELEV8-PROP-04, name: "Verlet法の全運動量保存" }
canonical_examples:
  - 静止二体格子の有限作用と非零Newton残差
  - N=12の8の字型ループでの全線形拘束の直接検算
  - 二体円運動の最初のvelocity-Verletステップ
  - 等質量二体の解析的エネルギーと角運動量
