id: QFT42
title: "QCDの漸近自由性の適用域・静的ポテンシャル・閉じ込めの境界"
volume: foundations
status: supplementary
prerequisites: [QFT20, QFT28, QFT41]
official_scope: []
learning_objectives:
  - 固定フレーバーの一ループQCD流からΛパラメータを導き、高尺度摂動展開の有効域とその破綻を区別できる
  - 色一重項の二次Casimirと運動量積分から短距離のクォーク–反クォーク静的ポテンシャルを導ける
  - Wilsonループを格子上の順序付き積として定義し、局所ゲージ不変性を添字で確認できる
  - 純SU(3)格子ゲージ理論の強結合展開の最初の非零項をHaar積分で計算できる
  - 有限ループの強結合展開・Wilson面積則・動的クォークによるstring breaking・連続QCDの閉じ込めを論理的に区別できる
definitions:
  - { id: QFT42-DEF-01, name: 一ループQCDのΛ尺度と摂動域 }
  - { id: QFT42-DEF-02, name: 静的色源の相互作用ポテンシャル }
  - { id: QFT42-DEF-03, name: 格子のWilsonループ }
  - { id: QFT42-DEF-04, name: 純ゲージWilson格子作用 }
theorems:
  - { id: QFT42-PROP-01, name: 一ループ流の積分定数と尺度依存 }
  - { id: QFT42-PROP-02, name: 短距離色一重項ポテンシャル }
  - { id: QFT42-PROP-03, name: Wilsonループのゲージ不変性 }
  - { id: QFT42-LEM-01, name: SU(3)Haar積分の基本直交性 }
  - { id: QFT42-PROP-04, name: 有限矩形Wilsonループの強結合先頭項 }
canonical_examples:
  - 三フレーバーでQ/Λがexp(5)とexp(2)の場合の一ループ結合
  - 三色一重項の色二次CasimirとCoulomb係数
  - 対角リンクの一周積と局所変換の相殺
  - 一つと二つのplaquetteについてのHaar積分
  - 動的クォークがある場合の弦の切断と面積則の適用限界
