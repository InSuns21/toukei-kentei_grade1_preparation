  - { id: QFT47-PROP-02, name: 一世代の超電荷異常係数の同時相殺 }
  - { id: QFT47-PROP-03, name: 固定フレーバー流の解とDISの運動学的境界 }
  - { id: QFT47-PROP-04, name: 木レベルmatchingから低尺度runningへの接続 }
  - { id: QFT47-PROP-05, name: 三つの整数セクターのθ曲率 }
