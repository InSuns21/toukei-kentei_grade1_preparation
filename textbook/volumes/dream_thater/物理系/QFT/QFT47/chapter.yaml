id: QFT47
title: "電弱・異常相殺・QCD・EFT・非摂動近似を結ぶ総合演習"
volume: foundations
status: supplementary
prerequisites: [SM3, QFT36, QFT37, QFT38, QFT40, QFT41, QFT42, QFT43, QFT44, QFT45, QFT46]
official_scope: []
learning_objectives:
  - Higgs真空から中性ゲージ質量行列を対角化し、電荷・W/Z質量・Fermi定数の木レベル関係を一続きに検算できる
  - 最小標準模型一世代の左巻き場一覧から四種の超電荷異常係数を重複度込みで求め、局所と大域の検査を区別できる
  - CKMユニタリ性を質量基底の荷電電流へ適用する条件を確認できる
  - 固定フレーバーQCDの一ループ流と深非弾性散乱の運動学を使い、摂動域と因子化の前提を診断できる
  - 重いスカラーの木レベルmatchingと軽い結合のrunningを分け、係数・符号・打切り誤差を検算できる
  - 重い場の一ループ質量閾値をカットオフと修正最小減算法で比較し、個別の質量補正の方式依存性を説明できる
  - 格子の有限模型、整数セクターのθ分配関数、古典インスタントンから主張できる範囲と、未証明の連続極限・閉じ込めを区別できる
definitions: []
theorems:
