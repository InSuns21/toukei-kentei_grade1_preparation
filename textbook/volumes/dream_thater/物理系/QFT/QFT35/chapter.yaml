  - { id: QFT35-PROP-02, name: 共役Higgs二重項の変換 }
  - { id: QFT35-THM-02, name: 標準模型Yukawa項のゲージ不変性 }
canonical_examples:
  - レプトン弱二重項の上下成分の電荷
  - 三色クォーク二重項の成分と左右の表現
  - 局所U(1)変換における共変微分の余分な項の相殺
  - Higgs真空代表の電荷中性条件
  - 上型・下型・荷電レプトンYukawa項の超電荷検算
