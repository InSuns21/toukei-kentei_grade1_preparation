id: QFT35
title: "標準模型のゲージ群・フェルミオン表現・超電荷とHiggs結合"
volume: foundations
status: supplementary
prerequisites: [QFT34, QFT32, QFT28, QFT17]
official_scope: []
learning_objectives:
  - SU(3)×SU(2)×U(1)の表現ラベルと世代・色・弱二重項の添字を区別できる
  - Q=T3+Yの規約から標準模型の各成分の電荷を導出し、左右のカイラリティの表現の違いを説明できる
  - 三つのゲージ因子の共変微分を構成し、局所変換での共変性と運動項の不変性を検算できる
  - Higgs二重項と共役二重項の変換を導き、Yukawa結合の群表示と超電荷の条件を確認できる
  - 最小標準模型の場一覧と世代の反復、右巻きニュートリノの任意性、量子異常検査との違いを識別できる
