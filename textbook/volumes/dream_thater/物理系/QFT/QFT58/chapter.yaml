  - QFT58-SCHWARZIAN-ROOT
  - QFT58-TWIST-PERMUTATIONS
  - QFT58-WARD-WEIGHT
  - QFT58-ANALYTIC-CONTINUATION
  - QFT58-MULTI-INTERVAL-MONODROMY
  - QFT58-CENTRAL-CHARGE-EXPONENT
  - QFT58-INTEGRATED-REPLICA
