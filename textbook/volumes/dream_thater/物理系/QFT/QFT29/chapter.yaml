  - { id: QFT29-THM-01, name: 局所的Faddeev–Popov恒等式 }
  - { id: QFT29-PROP-02, name: ghost積分と三点相互作用 }
  - { id: QFT29-THM-02, name: 古典BRST変換のoff-shell冪零性 }
  - { id: QFT29-THM-03, name: ゲージ固定作用のBRST完全性と不変性 }
canonical_examples:
  - SU(2)の純ゲージ場がLorenz条件を保つための波動方程式
  - SU(2)の一定時間成分によるFaddeev–Popov作用素の色混合
  - 平面回転のゲージ軌道と二重交差・Jacobian
  - 二組のGrassmann変数が行列式を生む直接展開
  - SU(2)のghost非線形変換とBRSTの二回作用
  - BRST doubletのBが閉じていて正確なことの確認
