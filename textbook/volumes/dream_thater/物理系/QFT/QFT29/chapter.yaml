id: QFT29
title: "Faddeev–Popovゲージ固定・ghostとBRST対称性"
volume: foundations
status: supplementary
prerequisites: [QFT28, QFT19, QFT16]
official_scope: []
learning_objectives:
  - 非可換ゲージ軌道とLorenzゲージ条件面の関係、局所一意性とGribovコピーの違いを具体例で説明できる
  - 随伴共変微分からFaddeev–Popov作用素を導出し零モード・符号・作用域を検査できる
  - 有限次元JacobianとBerezin積分の行列式を対応付けghostの三点相互作用を導出できる
  - 補助場Bの平方完成から共変ゲージ固定項を導きその役割を説明できる
  - BRST変換のGrassmann符号とJacobi恒等式を使ってoff-shell冪零性を証明できる
  - ゲージ固定フェルミオンのBRST変換からghostを含む作用と不変性を導ける
  - BRSTコホモロジーの定義と物理状態解釈の条件、量子異常・Gribov問題の限界を区別できる
