id: QFT4
title: "実スカラー場のFock空間と正準量子化"
volume: foundations
status: supplementary
prerequisites:
  - QFT3
  - QM8
official_scope: []
learning_objectives:
  - 一粒子Hilbert空間から対称Fock空間と真空・有限粒子Schwartz稠密領域を定義し、二粒子波束を規格化できる
  - 生成・消滅演算子を粒子成分上に構成して随伴性と正準交換関係を出発式から導出できる
  - 実Schwartz試験関数による自由場のsmearingを定義し、作用素値分布としての連続性と弱いKlein–Gordon方程式を検証できる
  - 等時刻の場・共役運動量の交換関係をFourier規格化と現実条件から導ける
  - 粒子数・正規順序Hamiltonianの作用と生成交換子を導き、真空と一粒子のエネルギーを検算できる
  - 有限モードの零点エネルギーと正規順序の差を計算し、カットオフ除去時の発散と有限な励起エネルギーを区別できる
