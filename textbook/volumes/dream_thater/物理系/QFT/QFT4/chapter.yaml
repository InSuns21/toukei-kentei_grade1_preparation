  - { id: QFT4-THM-02, name: 自由実スカラー場の等時刻正準交換関係 }
  - { id: QFT4-PROP-02, name: 粒子数とエネルギーの生成交換子 }
  - { id: QFT4-PROP-03, name: 有限モードの正規順序と零点エネルギー }
