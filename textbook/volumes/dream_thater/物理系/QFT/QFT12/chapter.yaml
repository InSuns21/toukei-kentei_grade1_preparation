id: QFT12
title: "散乱の運動学・不変位相空間・崩壊率と断面積"
volume: foundations
status: supplementary
prerequisites: [QFT11]
official_scope: []
learning_objectives:
  - 質量殻・エネルギー運動量保存からMandelstam不変量と二体反応の閾値・重心系運動量を導ける
  - 正エネルギー質量殻測度からLorentz不変な多粒子位相空間を構成し二体角度測度を積分できる
  - S行列の有限体積・時間規格化から一粒子崩壊率と二粒子散乱の入射流束を導ける
  - 重心系の微分断面積を計算し、同一終状態の過剰計数を階乗因子で除ける
  - 四次スカラー頂点の木レベル振幅から全断面積を求め、閾値と適用仮定を判定できる
