id: QFT49
title: "応力テンソルの改良・Ward恒等式・接触項と共形保存流"
volume: foundations
status: supplementary
prerequisites: [QFT2, QFT48]
official_scope: []
learning_objectives:
  - 自由Euclidスカラー場の局所並進変分から応力テンソルと発散恒等式を導ける
  - 保存を保つ改良項を構成し、共形改良係数とオンシェルのトレース零を検算できる
  - 量子相関関数の局所並進Ward恒等式における接触項を試験関数に作用させて説明できる
  - 共形Killing方程式と改良テンソルから共形保存流を作れる
  - 自由基本スカラー場の拡大縮小・特殊共形Ward恒等式を二点関数で照合できる
  - 質量項・量子異常・境界流束・合成演算子の限界を区別できる
