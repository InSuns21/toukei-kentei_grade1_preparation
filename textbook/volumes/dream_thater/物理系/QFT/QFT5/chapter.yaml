id: QFT5
title: "自由場の二点関数・因果的交換子・局所的可換性"
volume: foundations
status: supplementary
prerequisites:
  - QFT4
official_scope: []
learning_objectives:
  - Fock真空の二点量を作用素から導き、Wightman二点分布の運動量表示と正規化を計算できる
  - 複素試験関数に対する二点分布の正値性と正エネルギー質量殻上のスペクトル条件を検証できる
  - Pauli–Jordan交換子を二点分布の反対称部分として導出し、Klein–Gordon方程式と等時刻Cauchyデータの符号を確認できる
  - 局所エネルギーの流束評価から有限伝播速度を証明し、因果的交換子の支持を光円錐内に制限できる
  - 時空的に離れた試験関数の支持から局所的可換性を示し、二点相関そのものの消滅とは区別できる
  - 空間的分離の真空相関と時間的分離の交換子を具体例で検証できる
