  - { id: QFT5-THM-02, name: Pauli–Jordan交換子の表示とCauchyデータ }
  - { id: QFT5-THM-03, name: Klein–Gordon解の有限伝播速度 }
  - { id: QFT5-THM-04, name: 自由実スカラー場の局所的可換性 }
canonical_examples:
