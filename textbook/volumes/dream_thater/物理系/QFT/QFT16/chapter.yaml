id: QFT16
title: "共変ゲージ固定・光子伝播関数と保存電流"
volume: foundations
status: supplementary
prerequisites: [QFT15, QFT6]
official_scope: []
learning_objectives:
  - Maxwell作用の二次作用素に縦方向の零モードがあることを検算できる
  - 共変ゲージ固定項を変分しゲージパラメータ付き方程式を導ける
  - 光的でない運動量の縦・横射影でゲージ固定作用素を反転できる
  - Feynman処方による光子伝播関数と二重極の意味を説明できる
  - 保存電流との縮約でゲージパラメータ依存項が消える条件を検査できる
  - Coulombゲージの横偏極と瞬時的Gauss拘束を共変記述と比較できる
definitions:
  - { id: QFT16-DEF-01, name: 共変ゲージ固定Maxwell作用 }
  - { id: QFT16-DEF-02, name: 非光的運動量の横・縦射影 }
  - { id: QFT16-DEF-03, name: 共変ゲージの光子Feynman伝播関数 }
theorems:
  - { id: QFT16-PROP-01, name: 自由Maxwell二次作用素のゲージ零方向 }
  - { id: QFT16-THM-01, name: ゲージ固定作用のEuler–Lagrange方程式 }
  - { id: QFT16-THM-02, name: ゲージ固定二次形式の反転 }
  - { id: QFT16-PROP-02, name: Feynmanゲージと一般共変ゲージの伝播関数 }
  - { id: QFT16-THM-03, name: 保存電流間の交換核のゲージ非依存性 }
  - { id: QFT16-PROP-03, name: 光的運動量での二つの物理偏極 }
canonical_examples:
  - 勾配方向のMaxwell零モードとゲージ固定項の変化
  - 時間的な非光的運動量における射影行列の直接検算
  - Feynmanゲージと一般のxiにおける分子の検算
  - 保存電流と非保存電流を用いたゲージ依存項の比較
  - z方向の光的波での物理偏極和の検算
