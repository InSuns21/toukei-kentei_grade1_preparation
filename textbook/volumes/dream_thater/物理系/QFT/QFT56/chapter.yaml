id: QFT56
title: "境界自由場・区間のUV正則化と熱的尺度"
volume: foundations
status: supplementary
prerequisites: [QFT55, QFT53, QFT50, QFT19, QFT20]
official_scope: []
learning_objectives:
  - 半平面上のDirichletとNeumann境界条件を法線微分まで区別できる
  - 二次元Gaussian自由bosonの作用とGreen方程式の係数を変分から検算できる
  - 鏡像法による二つの境界Green核を導き、局所特異性と赤外零モードの相違を説明できる
  - 指数関数による座標写像で半平面から幅Wの帯へ移したDirichlet核と境界での零値を検算できる
  - 点分離UV cutoffによる自己縮約の対数と境界近傍での有効範囲を導ける
  - Dirichlet境界のGaussian頂点一体関数を正規順序から計算し指数と非普遍定数を分離できる
  - 区間端点のUV正則化と場の二点相関・領域エントロピーの違いを説明できる
  - 熱円筒の二点核から正規化された比を作り、短距離・長距離・cutoff変更を検算できる
definitions:
  - { id: QFT56-DEF-01, name: 半平面と二つの境界条件 }
  - { id: QFT56-DEF-02, name: 二次元自由bosonの境界Green核 }
  - { id: QFT56-DEF-03, name: 区間端点の点分離cutoff }
  - { id: QFT56-DEF-04, name: 平面規格化のGaussian頂点演算子 }
theorems:
  - { id: QFT56-THM-01, name: Dirichlet境界核の鏡像公式 }
  - { id: QFT56-PROP-01, name: Neumann鏡像核と零モードの曖昧さ }
  - { id: QFT56-THM-02, name: 帯領域のDirichlet Green核 }
  - { id: QFT56-PROP-02, name: 境界距離とUV自己縮約 }
  - { id: QFT56-THM-03, name: Dirichlet境界の頂点一体関数 }
  - { id: QFT56-PROP-03, name: 熱円筒の正規化二点比と尺度極限 }
canonical_examples:
  - 半平面の二点に対する鏡像距離
  - 帯の中央と端への接近における自己縮約
  - 頂点演算子の規格化尺度を二倍にした場合の係数
  - 有限区間の端点に置くcutoff円と境界の違い
  - 熱相関の温度・cutoffの二つの極限
