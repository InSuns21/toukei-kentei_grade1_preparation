id: QFT13
title: "木レベル散乱・交差対称性と光学定理"
volume: foundations
status: supplementary
prerequisites: [QFT12]
official_scope: []
learning_objectives:
  - 三次・四次スカラー相互作用のラベル付き木図を数えてs・t・uチャネル振幅と干渉を導ける
  - 重心系の角度依存振幅から同種終状態因子を含む微分・全断面積と閾値極限を求められる
  - 全入射外線表示と交差対称性を理解し解析振幅と物理的断面積を区別できる
  - S行列の単位性から前方光学定理を導き全終状態の位相空間和へ移せる
  - 四次スカラー散乱で木レベルと次次数の虚部の関係を検算し適用仮定を説明できる
definitions:
  - { id: QFT13-DEF-01, name: 三つの交換チャネル }
