  - { id: QFT13-PROP-03, name: 同一実スカラー四点木振幅の交差関係 }
  - { id: QFT13-THM-01, name: S行列の単位性と前方光学定理 }
  - { id: QFT13-PROP-04, name: 四次スカラー相互作用で単位性が要求する虚部 }
canonical_examples:
