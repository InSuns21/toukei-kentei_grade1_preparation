  - { id: QFT7-THM-03, name: Dirac作用と保存電流 }
  - { id: QFT7-THM-04, name: 平面波解の規格化とスピン和 }
  - { id: QFT7-PROP-01, name: スピン和から得る相補射影 }
canonical_examples:
  - Pauli行列から組み立てた四つのgamma行列
  - z軸回転の2π符号とz方向boostの非ユニタリ性
