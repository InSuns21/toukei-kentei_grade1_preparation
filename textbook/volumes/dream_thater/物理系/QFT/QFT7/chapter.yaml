id: QFT7
title: "Dirac場のLorentz変換・Clifford代数と平面波解"
volume: foundations
status: supplementary
prerequisites:
  - QFT6
  - SREL3
official_scope: []
learning_objectives:
  - Minkowski計量に対応するClifford反交換関係をDirac表示の行列で確認し、一次のDirac作用素からKlein–Gordon方程式を導ける
  - Lorentz変換のスピノル表現を無限小生成子から構成し、回転・boost・二重被覆・非ユニタリ性を具体的に区別できる
  - Dirac随伴を使ってDirac方程式と作用のLorentz共変性、および保存電流を導ける
  - 正負振動数の平面波スピノルを構成し、質量殻条件・二成分解・規格化を検算できる
  - スピン和と質量殻射影子を行列積から導き、スピン基底に依らない式として利用できる
  - 古典場の負振動数成分と量子論の反粒子解釈を区別し、後続の反交換関係へ接続できる
