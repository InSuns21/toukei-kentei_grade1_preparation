  - { id: QFT52-THM-01, name: 零電荷自由bosonの状態–演算子対応 }
  - { id: QFT52-THM-02, name: 一次場の輪郭モード作用 }
  - { id: QFT52-PROP-02, name: 自由bosonの低レベルVirasoro子孫 }
  - { id: QFT52-THM-03, name: レベル1・2のGram行列 }
  - { id: QFT52-COR-01, name: 自由bosonのレベル2特異ベクトル }
canonical_examples:
  - 電流の二次極の留数と真空モードの正ノルム
  - 正規順序微分電流とa_-n状態の対応
