id: QFT14
title: "自由場の二点関数から散乱確率までの総合演習"
volume: foundations
status: supplementary
prerequisites: [QFT13]
official_scope: []
learning_objectives:
  - 自由場のWightman二点分布・時間順序二点分布・交換子を導き、相関と因果性の相違を説明できる
  - 四次スカラー相互作用のWick収縮とLSZ外線切断を規格化・留数の仮定付きで再構成できる
  - 二体位相空間のJacobianと入射流束から同種・異種粒子の全断面積を求められる
  - 木レベル散乱・交差チャネルと単位性の摂動次数を区別し、光学定理の係数を検算できる
  - 質量殻極、安定漸近粒子、外線留数、閾値、同種粒子係数の適用条件を横断的に判定できる
