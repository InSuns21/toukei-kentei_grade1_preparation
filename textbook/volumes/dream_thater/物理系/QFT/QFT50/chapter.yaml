id: QFT50
title: "二次元の正則共形変換・複素応力テンソルと局所Ward恒等式"
volume: foundations
status: supplementary
prerequisites: [QFT49, CA3]
official_scope: []
learning_objectives:
  - 複素座標とWirtinger微分を実座標から定義し、計量・Laplace作用素・面積要素を検算できる
  - 二次元の共形Killing方程式とCauchy–Riemann方程式の同値を導き、局所正則写像と大域変換を区別できる
  - 正則ベクトル場のWitt括弧を計算し、量子Virasoro代数の中心項を先取りしない
  - 二次元自由bosonで複素応力テンソルとトレースを計算し、保存から正則性を導ける
  - 一次場の正則・反正則ウェイトを定義例で確認し、局所Ward核と接触分布・輪郭積分の対応を導ける
  - 二点相関へのWard作用を検算し、挿入点・境界・零モード・量子異常に伴う制限を説明できる
