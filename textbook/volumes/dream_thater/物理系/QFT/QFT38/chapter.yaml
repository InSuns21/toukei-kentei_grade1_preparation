id: QFT38
title: "弱崩壊・Fermi四フェルミオン相互作用と低エネルギー有効理論"
volume: foundations
status: supplementary
prerequisites: [QFT37, QFT12, QFT26, QFT17]
official_scope: []
learning_objectives:
  - 質量基底の荷電弱電流をCKM因子と共役の向きまで正しく書ける
  - 重いWの代数的消去から次元6のFermi演算子の係数を導き、微分補正の適用範囲を言える
  - 左射影子二つの係数を追ってFermi定数と電弱真空期待値の木レベル関係を導ける
  - ミューオン崩壊のV-Aスピン和と三体位相空間の積分を出発点から計算できる
  - 半レプトン過程のCKM因子とハドロン行列要素の必要性を区別できる
