  - { id: QFT38-THM-03, name: 質量零・木レベルでのミューオン全崩壊率 }
  - { id: QFT38-PROP-01, name: 半レプトン崩壊のCKM係数 }
canonical_examples:
  - udクォーク・電子荷電電流の電荷と共役係数
  - muon崩壊の四フェルミオン場の選択と質量次元
  - 左射影子二つによるFermi定数の係数検算
  - 質量零ミューオン三体位相空間を不変質量で因数分解
  - 中性子beta崩壊で必要なハドロン行列要素
