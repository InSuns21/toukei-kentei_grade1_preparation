  - QFT21-THIRD-CUMULANT
  - QFT21-1PI-COMPOSITION
  - QFT21-MIXTURE-CUMULANT
  - QFT21-HBAR-GAUSSIAN
  - QFT21-QUARTIC-CUMULANT
past_exam_alignment: []
integrated_exam_problems: []
