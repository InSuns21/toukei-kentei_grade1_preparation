id: QFT37
title: "Yukawa質量行列・世代基底の回転とCKM混合"
volume: foundations
status: supplementary
prerequisites: [QFT36, QFT35, LA6]
official_scope: []
learning_objectives:
  - 三世代のゲージ不変Yukawa結合を添字つきで書き、Higgs真空からフェルミオン質量行列とHiggs結合を導ける
  - 複素特異値分解で左右の場を別々にユニタリ回転し、質量固有場と零質量・縮退時の基底の非一意性を説明できる
  - 荷電弱電流の相対回転からCKM行列のユニタリ性を導き、光子・Z・Higgsの木レベル中性結合が対角であることを確かめられる
  - 三世代の再位相付けと物理パラメータ数を導き、再位相不変量でCP位相を検査できる
  - ニュートリノ質量を持たない最小模型のレプトン混合と、量子補正・質量縮退への主張の限界を区別できる
