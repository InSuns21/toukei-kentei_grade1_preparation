id: QFT34
title: "局所U(1)対称性・Abelian Higgs機構・ゲージ固定と物理自由度"
volume: foundations
status: supplementary
prerequisites: [QFT33, QFT15, QFT16, QFT17, QFT29]
official_scope: []
learning_objectives:
  - 複素スカラーとゲージ場の局所U(1)変換を定め、共変微分と場の強さの不変性を直接計算できる
  - Abelian Higgs模型の真空と二次作用を展開して動径質量・ゲージ場質量・位相場との混合を検算できる
  - 非零スカラー領域の局所ユニタリゲージとゲージ不変ベクトルを構成し、適用限界を説明できる
  - Proca方程式の発散制約から三偏極を導き、Higgs機構前後の物理自由度を計数できる
  - Rxiゲージの混合相殺・位相場とghostのゲージ依存極・保存電流交換核を計算できる
  - 大域的Goldstone定理と局所ゲージ冗長性を区別し、木レベル計算の量子論的限界を述べられる
definitions:
  - { id: QFT34-DEF-01, name: 荷電スカラー場の局所U(1)変換と共変微分 }
