  - { id: QFT34-PROP-01, name: 真空周りの二次作用と木レベル質量 }
  - { id: QFT34-THM-02, name: 正則な局所領域でのHiggs–Proca表示 }
  - { id: QFT34-THM-03, name: 正の質量を持つProca場の三偏極 }
  - { id: QFT34-THM-04, name: Rξ二次作用の対角化と非物理的な質量 }
canonical_examples:
