  - { id: QFT2-THM-02, name: 並進対称性とエネルギー運動量保存 }
  - { id: QFT2-PROP-02, name: 改良項の恒等的保存 }
canonical_examples:
  - 二成分回転の各二次項での不変性の直接確認
  - 回転する二成分平面波の電流と質量殻の検算
  - 自由実スカラー場のT00とエネルギー流の同定
  - 明示的外部源による内部対称性の破れ
  - 質量零の場合のトレース改良と境界条件
