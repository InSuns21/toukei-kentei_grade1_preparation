id: QFT2
title: "場の対称性・Noether流・エネルギー運動量テンソル"
volume: foundations
status: supplementary
prerequisites:
  - QFT1
official_scope: []
learning_objectives:
  - 固定座標での場の連続内部変換と全微分を許す作用の対称性を区別できる
  - 場のEuler–Lagrange方程式からNoether流のオフシェル恒等式とオンシェル保存則を導ける
  - 実二成分場と複素スカラー場のU(1)保存流を符号と規格化まで検算できる
  - 時空並進の能動変換から正準エネルギー運動量テンソルを導き、自由実スカラー場の各成分を計算できる
  - 境界フラックスと適切な減衰・周期条件を用いて保存電荷・エネルギー・運動量を区別できる
  - 保存則を保つ改良項と、明示的な対称性破れで保存則が失われる仕組みを説明できる
