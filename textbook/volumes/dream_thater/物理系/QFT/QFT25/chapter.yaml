  - { id: QFT25-PROP-01, name: 一ループの流れの積分と有効域 }
  - { id: QFT25-PROP-02, name: 有限な結合再定義と一ループ係数 }
canonical_examples:
  - 自由理論の固定裸微分でβ関数と異常次元が零となることを確かめる
  - φ⁴の裸四点結合の微分でεの係数と極の係数を分ける
  - 零外部運動量の一ループ四点頂点にくりこみ群微分を作用させる
  - QED真空偏極の対数を微分して電荷β関数の符号を確認する
  - 有限スケールの流れの分母と摂動有効域を比較する
