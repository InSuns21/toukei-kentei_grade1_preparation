id: QFT25
title: "くりこみ群方程式・β関数・異常次元と一ループの走る結合"
volume: foundations
status: supplementary
prerequisites: [QFT21, QFT23, QFT24]
official_scope: []
learning_objectives:
  - 裸の量とくりこみスケールを区別し固定裸パラメータ微分からβ関数と異常次元を定義できる
  - φ⁴模型の一ループ結合・質量反項からβλとβm²を係数と符号まで導ける
  - 波動関数因子から1PI頂点のくりこみ群方程式を導き一ループ四点関数と照合できる
  - QED真空偏極の有限対数とWard恒等式に整合する電荷の一ループβ関数を求められる
  - 一ループの流れを積分しLandau極・方式依存・質量閾値・摂動論の適用限界を説明できる
