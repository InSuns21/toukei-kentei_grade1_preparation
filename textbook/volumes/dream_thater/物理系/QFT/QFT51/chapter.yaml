id: QFT51
title: "自由bosonの応力テンソルOPE・中心電荷とVirasoro代数"
volume: foundations
status: supplementary
prerequisites: [QFT50, QFT19, CA3]
official_scope: []
learning_objectives:
  - 零モードを除く二次元自由Gaussian場のGreen核と微分場二点収縮を作用の規格化から導出できる
  - 点分離正規順序を定義し、tJ短距離展開と微分場の正則ウェイトを検算できる
  - Wickの二重収縮と単一収縮を全件数え、tt短距離展開の四次・二次・一次極を導ける
  - 自由実boson一成分の中心電荷c=1を求め、独立成分での加法性を確認できる
  - 動径順序付き輪郭積分からVirasoroモード交換子と中心項の係数を導ける
  - 応力テンソルの局所Ward作用に現れる三階微分項と古典Witt代数との差を説明できる
definitions:
  - { id: QFT51-DEF-01, name: 点分離正規順序と量子応力テンソル }
  - { id: QFT51-DEF-02, name: 応力テンソルOPEと中心電荷 }
  - { id: QFT51-DEF-03, name: 応力テンソルの輪郭モード }
theorems:
  - { id: QFT51-PROP-01, name: 微分自由bosonの二点収縮 }
  - { id: QFT51-PROP-02, name: 量子応力テンソルと微分場の短距離展開 }
  - { id: QFT51-THM-01, name: 実自由bosonの中心電荷は1 }
  - { id: QFT51-THM-02, name: 応力テンソルOPEからのVirasoro交換子 }
  - { id: QFT51-COR-01, name: 応力テンソルの局所量子Ward作用 }
canonical_examples:
  - 二次元Laplace核の流束と微分場の二点収縮
  - Wick正規順序による自己収縮の除去
  - tJ短距離展開とウェイト1
  - 四点Wickの二重収縮2通りと単一収縮4通り
  - c=1でのL2とL-2の交換子
  - 二成分独立自由bosonでの中心電荷の加法性
