  - { id: QFT6-THM-03, name: 時間順序二点分布の極とデルタ源 }
  - { id: QFT6-PROP-01, name: 因果的応答と空間的真空相関の相違 }
canonical_examples:
  - 一つの振動数の正弦核における跳びとデルタ源
  - 正負の質量殻極の上下半平面への移動
  - 時間順序による正負の周波数の切替
  - 空間的分離でも残るFeynman相関のGaussian表示
  - コンパクト台外力への遅延応答と真空相関の比較
