id: QFT6
title: "遅延・先進・Feynman伝播関数とiε処方"
volume: foundations
status: supplementary
prerequisites:
  - QFT5
official_scope: []
learning_objectives:
  - 因果核Eから遅延・先進基本解を構成し、分布微分の跳びからKlein–Gordon作用素のデルタ源を確認できる
  - 有限伝播速度から遅延・先進核の支持と、コンパクト台外力に対する因果的な解を導ける
  - Fourier–Laplace境界値の極の位置を計算し、遅延・先進のi0処方を時間方向と照合できる
  - 真空Wightman分布から時間順序付きFeynman二点分布を構成し、運動量のiε処方を導出できる
  - Feynman二点分布とKlein–Gordon基本解のi係数および空間的分離での非零相関を区別できる
  - 基本解・交換子・時間順序二点分布を同じ模型の例題で比較し、因果的応答と真空相関を混同せず説明できる
