id: QFT36
title: "電弱混合・W／Z／光子の質量と荷電・中性電流"
volume: foundations
status: supplementary
prerequisites: [QFT35, QFT34]
official_scope: []
learning_objectives:
  - Higgs二重項の共変微分を真空代表で展開し、荷電・中性ゲージ場の二次質量項を係数まで導ける
  - 中性質量行列の零固有値と正固有値を対角化し、電弱混合角とW・Z・光子の正準規格化を検算できる
  - 残存する電荷生成子と光子の結合を対応させ、e=gsinθW=g'cosθWを導ける
  - 荷電電流・中性電流の左／右カイラル結合を表現と超電荷から計算できる
  - 木レベルの質量関係・Higgs結合・自由度計数の成立条件と量子補正の限界を説明できる
definitions:
  - { id: QFT36-DEF-01, name: 電弱混合角と質量固有場 }
