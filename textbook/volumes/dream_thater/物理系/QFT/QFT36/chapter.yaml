  - 同じ結合g=g'での45度混合と零固有ベクトル
  - 電子左右成分とニュートリノの光子・Z結合
  - 弱二重項の荷電電流と右巻き一重項の不参加
  - 単一二重項の自由度保存と質量比の検算
