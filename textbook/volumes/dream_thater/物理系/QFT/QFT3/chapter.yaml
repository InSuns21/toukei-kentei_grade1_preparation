id: QFT3
title: "Klein–Gordon場の初期値・振動数分解・超関数"
volume: foundations
status: supplementary
prerequisites:
  - QFT2
  - FOU4
  - GPDE2
official_scope: []
learning_objectives:
  - 三次元空間Fourier変換の規格化を固定してKlein–Gordon方程式を周波数ごとの常微分方程式へ移せる
  - Schwartz初期値から自由場の解を構成し初期条件と一意性を検算できる
  - 正振動数・負振動数の係数と実場の現実条件を導き質量零の零運動量での扱いを説明できる
  - 保存されるKlein–Gordon双線形型の符号を計算し正振動数空間と全解空間を区別できる
  - 平面波と有限エネルギーの波束を区別してFourier側のエネルギー式を導ける
  - Schwartz試験関数による場のsmearingと超関数としての運動方程式を定義し検証できる
