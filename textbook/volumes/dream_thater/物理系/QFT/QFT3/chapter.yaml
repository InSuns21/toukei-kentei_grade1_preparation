  - { id: QFT3-PROP-02, name: Fourier表示の自由場エネルギー }
  - { id: QFT3-PROP-03, name: 古典Klein–Gordon解の超関数表示 }
canonical_examples:
  - 余弦・正弦の二成分からCauchy条件を直接復元
  - 実Gaussian初期値に対する正負振動数の対
  - 周期箱の複素平面波によるKlein–Gordon形式の正負
  - 時空GaussianをSchwartz試験関数とするsmearing
