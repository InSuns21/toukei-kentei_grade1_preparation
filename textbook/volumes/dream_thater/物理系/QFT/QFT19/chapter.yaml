id: QFT19
title: "Gaussian・Grassmann積分と生成汎関数"
volume: foundations
status: supplementary
prerequisites: [QFT9, QFT8, QFT4]
official_scope: []
learning_objectives:
  - 有限次元の正定値二次形式のGaussian積分を平方完成で評価し逆行列から二点・四点関数を導ける
  - Grassmann代数の反交換性・Berezin積分の順序規約を使い行列式を符号付きで導ける
  - ボース・フェルミオン双方のソース付き生成汎関数を導きWickの組合せと符号を再現できる
  - 有限格子の生成汎関数から自由場の形式的汎関数へ対応付け収束・正則化の限界を説明できる
