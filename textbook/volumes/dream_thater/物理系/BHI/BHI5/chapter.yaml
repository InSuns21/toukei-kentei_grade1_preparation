id: BHI5
title: "粗視化と精細エントロピー"
volume: foundations
status: supplementary
prerequisites:
  - BHI4
  - QINF18
  - QINF20
official_scope: []
learning_objectives:
  - 有限温度のGibbs周辺状態を共有する純粋対・古典相関状態・積状態の全体エントロピーを部分トレースと固有値から比較できる
  - 放射の精細エントロピーと局所積基準の粗視化エントロピーを定義し、その差を相互情報量の連鎖に展開して等号条件まで証明できる
  - 有限次元の局所Hamiltonianと平均エネルギー一致の下でGibbs基準エントロピーの上界を相対エントロピーから証明できる
  - 相関を捨てた差と局所非熱性による差を分離して計算でき、非線形な積基準割当てを量子チャネルと混同しない
  - 面積エントロピー・熱的参照エントロピー・放射全体の精細エントロピーの対象・仮定・適用限界を区別できる
definitions:
  - { id: BHI5-DEF-01, name: "局所周辺状態に基づく粗視化エントロピー" }
  - { id: BHI5-DEF-02, name: "局所Gibbs基準の熱的エントロピー" }
theorems:
  - { id: BHI5-THM-01, name: "局所粗視化と相関欠損の恒等式" }
  - { id: BHI5-PROP-01, name: "精細・局所粗視化・熱的基準の階層" }
canonical_examples:
  - 有限温度Gibbs周辺を共有する純粋・古典相関・積状態の比較
  - 相関測定XテンソルXと局所積割当ての非線形性
  - 三量子ビットGHZと古典相関混合の連鎖相互情報量
  - 参照Gibbs状態と平均エネルギーのみ一致する非熱平衡三準位状態
problem_patterns:
  - BHI5-PRODUCT-SPECTRUM
  - BHI5-THERMAL-PURE-PAIR
  - BHI5-CLASSICAL-CORRELATION
  - BHI5-GIBBS-PARTITION
