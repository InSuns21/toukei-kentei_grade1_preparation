id: BHI32
title: "放射のentanglement wedge"
volume: foundations
status: supplementary
prerequisites:
  - BHI31
  - HOLO25
  - HOLO30
official_scope: []
learning_objectives:
  - 選択済みQESに対応する放射のentanglement wedgeを空island枝と非空枝で構成できる
  - 幾何学的領域の依存域と物理Hilbert空間の部分系を区別し二つの区間の因果菱形を計算できる
  - 極値化済み二枝のPage転移とウェッジの候補の切替を時刻ごとに判定できる
  - islandが放射のウェッジにあることと内部作用素が放射に再構成できることの追加条件を述べられる
  - 有限二量子ビット符号で論理作用素の放射への表現を等長写像の両基底で検算できる
  - 放射の一つのエントロピー値だけから作用素再構成可能性が決まらない反例を計算できる
  - 二つの独立な領域で非可換な論理代数を完全再構成できないことを証明できる
  - QES選択・コード部分空間・JLMS・近似誤差・ドレッシングの役割を区別できる
definitions:
  - { id: BHI32-DEF-01, name: "浴の放射に対するisland wedge" }
  - { id: BHI32-DEF-02, name: "二枝模型の放射ウェッジ相図" }
  - { id: BHI32-DEF-03, name: "放射と残存系の情報移送符号" }
theorems:
  - { id: BHI32-PROP-01, name: "離れた二区間の因果依存域" }
  - { id: BHI32-PROP-02, name: "二枝交点と放射ウェッジの切替" }
  - { id: BHI32-PROP-03, name: "情報移送符号の早期と後期の演算子再構成" }
  - { id: BHI32-PROP-04, name: "非可換論理演算子の独立二領域への複製障害" }
canonical_examples:
  - 非重力浴の区間Rと重力側island Iの同一断面上の境界検査
  - Minkowski局所座標の二つの因果菱形とisland内部の点の判定
  - 極値化済み二枝の線形模型におけるPage時刻と同点
  - SWAPにより情報が残存系から放射へ移る二量子ビット等長符号
  - 同じ放射エントロピーで復元可能性が反対になる二つの符号
  - 非可換Pauli演算子の二領域再構成における矛盾
problem_patterns:
