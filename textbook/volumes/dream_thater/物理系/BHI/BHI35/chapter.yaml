  - 球面調和関数の縮退とスカラーのポテンシャルの分離計算
  - Wronskian流束保存と灰色体因子
  - 透過確率半分のモード占有数とエントロピー
  - 四次元の光子と重力子の粗視化収支係数の限定例
  - 面積項と対数物質エントロピーの球対称局所補助模型
  - 温度の断熱変化と停止質量の適用区間
