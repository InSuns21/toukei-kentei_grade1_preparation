id: "MQ1"
title: "微分作用素・Schrödinger 作用素と本質的自己共役性"
volume: "foundations"
status: supplementary
prerequisites:
  - MQ0
  - QM6
  - EVOL1
  - FOU4
official_scope: []
learning_objectives:
  - Schwartz 空間上の微分式と最大乗算作用素の定義域を区別し、自由 Hamiltonian の本質的自己共役性をグラフノルム近似で証明できる
  - Fourier 空間の重み付き L² 条件から H0 の定義域とスペクトルを計算し、形式固有関数と L² 固有ベクトルを区別できる
  - 実有界ポテンシャルおよび相対界1未満の対称摂動について自己共役性と core の保存を証明できる
  - 強可換性をスペクトル射影で検証し、微分式の交換子の計算だけで判断しない
  - 離散スペクトルと本質スペクトルを区別し、自由粒子のスペクトルが全て本質スペクトルである理由を説明できる
  - Schrödinger 二次形式と作用素定義域の違いを理解し、次章の変分原理へ接続できる
