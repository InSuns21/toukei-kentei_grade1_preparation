id: "RBD8"
title: "無トルク対称剛体と姿勢の再構成"
volume: "foundations"
status: supplementary
prerequisites:
  - RBD7
official_scope: []
learning_objectives:
  - 力学的対称剛体と無トルク条件の違いを慣性テンソルと外力系で判定できる
  - 対称剛体のEuler方程式を積分し物体系横角速度と回転率の符号を導出できる
  - 空間の角運動量と回転エネルギーの保存を証明し対称軸との円錐角を計算できる
  - 任意初期姿勢から固定角運動量軸と体軸の二回転によって姿勢を再構成できる
  - 再構成した姿勢が初期角速度と運動方程式を満たすことを直接微分して検算できる
  - 対称軸の歳差率とEuler角の自転率と体軸方向角速度を区別できる
  - 純粋軸回転や球対称極限と無回転の特異ケースを正しく扱える
  - 円板型と細長い型の差およびトルクがある場合の適用限界を説明できる
definitions:
  - { id: RBD8-DEF-01, name: "力学的対称剛体と無トルク回転" }
theorems:
