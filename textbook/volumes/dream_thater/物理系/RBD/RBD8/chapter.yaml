  - { id: RBD8-PROP-01, name: "自由回転の角運動量・エネルギーと円錐角" }
  - { id: RBD8-THM-02, name: "無トルク対称剛体の姿勢の再構成" }
canonical_examples:
  - 一様薄円板による力学的対称剛体の条件確認
  - 円板型と細長い型の横角速度の回転向き
  - 固定角運動量と動く対称軸の円錐
  - I=2 J=3 の初期姿勢と姿勢微分の再現
  - Euler角の自転率と体軸角速度の違い
  - 純粋対称軸回転と球対称極限
