<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" data-layout-lint="strict" role="img" aria-labelledby="rbd8-title rbd8-desc">
  <title id="rbd8-title">無トルク対称剛体の固定角運動量と動く対称軸</title>
  <desc id="rbd8-desc">I=2、J=3、初期角速度(1,0,1)の例。共通の重心Cから、空間に固定された角運動量L0=(2,0,3)、初期対称軸n(0)=(0,0,1)、初期空間角速度omega_s(0)=(1,0,1)、半歳差後の対称軸n(T)=(12/13,0,5/13)を異なる線種で描く。細い点線の閉曲線はRodrigues公式で計算した対称軸先端の時間軌跡の斜投影。長さの比較は意味せず方向のみ示す。</desc>
  <defs>
    <marker id="rbd8-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#26364a"/></marker>
    <marker id="rbd8-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1965a3"/></marker>
    <marker id="rbd8-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b75c25"/></marker>
  </defs>
  <rect x="1" y="1" width="718" height="418" rx="10" fill="#fff" stroke="#d1d9e0"/>
  <text x="22" y="32" fill="#1f2a39" font-size="18" font-weight="700">空間に固定される L₀ と、歳差する n(t)</text>
  <text x="22" y="54" fill="#586b7e" font-size="13">I = 2, J = 3, R(0) = 1, ωᵦ(0) = (1,0,1)　｜　斜投影</text>
  <g stroke="#d5dfe8" stroke-width="1.5" fill="none">
    <path d="M200 335 L200 80"/>
    <path d="M200 335 L515 335"/>
    <path d="M200 335 L140 365" stroke-dasharray="5 5"/>
