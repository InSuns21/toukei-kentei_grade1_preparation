    <text x="329" y="154" font-weight="700">L₀</text>
    <text x="329" y="172" font-size="12">(2,0,3)</text>
  </g>
  <path d="M401 257 L493 247" stroke="#1965a3" fill="none" stroke-width="1.4"/>
