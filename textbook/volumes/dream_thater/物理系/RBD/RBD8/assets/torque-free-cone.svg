<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" data-layout-lint="strict" role="img" aria-labelledby="rbd8-title rbd8-desc">
  <title id="rbd8-title">無トルク対称剛体の固定角運動量と動く対称軸</title>
  <desc id="rbd8-desc">I=2、J=3、初期角速度(1,0,1)の例。共通の重心Cから、空間に固定された角運動量L0=(2,0,3)、初期対称軸n(0)=(0,0,1)、初期空間角速度omega_s(0)=(1,0,1)、半歳差後の対称軸n(T)=(12/13,0,5/13)を異なる線種で描く。細い点線の閉曲線が対称軸先端の時間軌跡で、正確な回転公式による斜投影。長さの比較は意味せず方向のみ示す。</desc>
  <defs>
    <marker id="rbd8-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#26364a"/></marker>
    <marker id="rbd8-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1965a3"/></marker>
    <marker id="rbd8-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b75c25"/></marker>
  </defs>
  <rect x="1" y="1" width="718" height="418" rx="10" fill="#fff" stroke="#d1d9e0"/>
  <text x="22" y="32" fill="#1f2a39" font-size="18" font-weight="700">空間に固定される L₀ と、歳差する n(t)</text>
  <text x="22" y="54" fill="#586b7e" font-size="13">I = 2, J = 3, R(0) = 1, ωᵦ(0) = (1,0,1)　｜　斜投影</text>
  <g stroke="#d5dfe8" stroke-width="1.5" fill="none">
    <path d="M200 335 L200 80"/>
    <path d="M200 335 L515 335"/>
    <path d="M200 335 L140 365" stroke-dasharray="5 5"/>
  </g>
  <g fill="#617081" font-size="14">
    <text x="207" y="87">z</text><text x="519" y="340">x</text>
    <text x="118" y="385">y</text>
  </g>
  <g fill="none">
    <path d="M200 130 C219 139 229 154 249 170 C285 197 313 211 340 215 C362 223 376 240 389 256 C362 247 334 235 307 216 C268 187 229 146 200 130 Z" stroke="#7a8997" stroke-width="2" stroke-dasharray="4 7"/>
    <path d="M200 335 L314 164" stroke="#26364a" stroke-width="4" marker-end="url(#rbd8-arrow)"/>
    <path d="M200 335 L200 130" stroke="#1965a3" stroke-width="4.5" marker-end="url(#rbd8-blue)"/>
    <path d="M200 335 L389 256" stroke="#1965a3" stroke-width="3" stroke-dasharray="10 5" marker-end="url(#rbd8-blue)"/>
    <path d="M200 335 L345 190" stroke="#b75c25" stroke-width="3.5" stroke-dasharray="3 6" marker-end="url(#rbd8-orange)"/>
  </g>
  <circle cx="200" cy="335" r="5" fill="#26364a"/>
  <g fill="#26364a" font-size="15">
    <text x="180" y="353">C</text>
    <text x="329" y="154" font-weight="700">L₀</text>
    <text x="329" y="172" font-size="12">(2,0,3)</text>
  </g>
  <g fill="#1965a3" font-size="15">
    <text x="110" y="123" font-weight="700">n(0)</text>
    <text x="94" y="141" font-size="12">(0,0,1)</text>
    <text x="400" y="263" font-weight="700">n(T)</text>
    <text x="400" y="281" font-size="12">(12/13,0,5/13)</text>
  </g>
  <g fill="#b75c25">
    <path d="M353 193 L393 200" stroke="#b75c25" stroke-width="1.5"/>
    <text x="401" y="204" font-size="14" font-weight="700">ωₛ(0)</text>
    <text x="401" y="222" font-size="12">(1,0,1)</text>
  </g>
  <g font-size="13" fill="#455569">
    <text x="20" y="404">実線 L₀：固定　｜　太実線 n(0)、破線 n(T)：動く軸　｜　点線 ωₛ(0)：角速度</text>
  </g>
</svg>
