<title id="rbd9-title">角運動量球面と中間軸を通る分離曲線</title>
<desc id="rbd9-desc">慣性モーメント2,3,4のとき、角運動量球面の投影上にL3が正または負のsqrt2倍L1である二つの平面断面（大円）を実際の三次元座標から正射影した図。両円は上側の正中間軸と下側の負中間軸で交わる。線種が正負の平面を区別する。</desc>
