<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 390" data-layout-lint="strict" role="img" aria-labelledby="diagram-title diagram-desc">
  <title id="diagram-title">斜面上の円柱または球の自由物体図</title>
  <desc id="diagram-desc">右上へ上る斜面に円形物体が接する。重心Cは接点Pより左上にある。重力mgはCから鉛直下向き、法線反力Nは接点Pから斜面に垂直な左上向き、摩擦力fはPから斜面を上る右上向きに描く。斜面下向きの接線方向e_tは左下、半径aはCとPの距離である。</desc>
  <defs>
    <marker id="arr-solid" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#222"/>
    </marker>
    <marker id="arr-open" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4.5 L0,9" fill="none" stroke="#222" stroke-width="1.5"/>
    </marker>
  </defs>
  <g id="surface">
    <path d="M80,340 L660,175" fill="none" stroke="#555" stroke-width="4"/>
    <path d="M80,340 L115,356 M155,319 L190,335 M235,296 L270,312 M315,273 L350,289 M445,236 L480,252 M535,211 L570,227 M615,188 L650,204" fill="none" stroke="#aaa" stroke-width="2"/>
  </g>
  <g id="body">
    <circle cx="369" cy="178" r="77" fill="#f6f7f9" stroke="#333" stroke-width="3"/>
    <circle cx="369" cy="178" r="4.5" fill="#222"/>
    <text x="340" y="170" font-size="19" font-family="Noto Sans CJK JP, sans-serif" fill="#222">C</text>
    <circle cx="390" cy="252" r="5" fill="#222"/>
    <text x="408" y="279" font-size="19" font-family="Noto Sans CJK JP, sans-serif" fill="#222">P</text>
    <path d="M369,178 L390,252" stroke="#555" stroke-width="1.8" stroke-dasharray="5 4" fill="none"/>
    <text x="401" y="225" font-size="18" font-family="Noto Sans CJK JP, sans-serif" fill="#222">a</text>
  </g>
  <g id="forces">
    <path d="M369,178 L369,256" data-series-group="force-vectors" data-series-label="weight" stroke="#222" stroke-width="3.5" fill="none" marker-end="url(#arr-solid)"/>
    <text x="319" y="232" font-size="19" font-family="Noto Sans CJK JP, sans-serif" fill="#222">mg</text>
    <path d="M390,252 L344,91" data-series-group="force-vectors" data-series-label="normal" stroke="#222" stroke-width="2.6" fill="none" marker-end="url(#arr-open)"/>
    <text x="315" y="88" font-size="19" font-family="Noto Sans CJK JP, sans-serif" fill="#222">N</text>
    <path d="M390,252 L525,213" data-series-group="force-vectors" data-series-label="friction" stroke="#222" stroke-width="2.8" stroke-dasharray="9 4" fill="none" marker-end="url(#arr-solid)"/>
    <text x="531" y="213" font-size="19" font-family="Noto Sans CJK JP, sans-serif" fill="#222">f</text>
  </g>
  <g id="directions">
    <path d="M227,303 L143,327" stroke="#333" stroke-width="2.3" fill="none" marker-end="url(#arr-open)"/>
    <text x="119" y="305" font-size="19" font-family="Noto Sans CJK JP, sans-serif" fill="#222">e_t</text>
    <text x="462" y="300" font-size="16" font-family="Noto Sans CJK JP, sans-serif" fill="#444">静止斜面</text>
  </g>
</svg>