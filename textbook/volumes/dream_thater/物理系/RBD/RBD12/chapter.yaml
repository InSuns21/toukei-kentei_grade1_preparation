  - { id: RBD12-THM-02, name: "正則な定常歳差の小章動と固有振動数" }
  - { id: RBD12-PROP-01, name: "遅い歳差のジャイロ近似と誤差" }
canonical_examples:
  - 赤道での重力トルクと定常歳差の直接検算
  - 60度での定常歳差二枝と異なる鉛直角運動量
  - 初期傾きの微小摂動が往復章動になる具体例
  - 赤道定常歳差の章動振動数と歳差周期の比較
  - 初期傾き速度零でも定常歳差ではない反例
  - ジャイロ近似の無次元誤差の評価
