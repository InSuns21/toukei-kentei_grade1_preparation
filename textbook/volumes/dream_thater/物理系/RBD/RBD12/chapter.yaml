id: "RBD12"
title: "定常歳差・章動とジャイロ近似"
volume: "foundations"
status: supplementary
prerequisites:
  - RBD11
official_scope: []
learning_objectives:
  - 重い対称こまの保存量h k Eと有効ポテンシャルから歳差速度と傾きの二階ODEを復元できる
  - 定常歳差の必要十分条件を有効ポテンシャルと初期速度から導出できる
  - 正則な傾きでの速い歳差と遅い歳差の枝と判別式および向きの条件を判定できる
  - 固定したh kに対する有効ポテンシャルの二階微分を計算し小章動振動数と転回点を導出できる
  - ジャイロの遅い歳差近似を条件付きで導き厳密な相対誤差を評価できる
  - 重力トルク付きODEを積分する図で保存エネルギーと定常歳差および章動の違いを検算できる
definitions:
  - { id: RBD12-DEF-01, name: "定常歳差" }
  - { id: RBD12-DEF-02, name: "章動と転回点" }
theorems:
