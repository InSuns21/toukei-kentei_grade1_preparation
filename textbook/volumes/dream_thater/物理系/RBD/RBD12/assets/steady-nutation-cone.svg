<svg xmlns="http://www.w3.org/2000/svg" width="620" height="420" viewBox="0 0 620 420" data-layout-lint="strict" role="img" aria-labelledby="svgtitle svgdesc">
<title id="svgtitle">重い対称こまの定常歳差円と章動帯</title>
<desc id="svgdesc">固定支点Oから物体軸nが出て、鉛直軸zのまわりに一定の傾き60度の円を描く。内側と外側の異なる線種の楕円は章動で変わる傾きの上下限を示す。重力は重心Cから鉛直下向き、トルクは鉛直軸とnに垂直な接線方向である。円は三次元の円の斜投影。</desc>
