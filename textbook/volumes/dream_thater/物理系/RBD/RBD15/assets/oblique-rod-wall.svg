<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" width="560" height="440" data-layout-lint="strict" role="img" aria-labelledby="impact-title impact-desc">
  <title id="impact-title">斜め棒の端と固定壁の偏心衝突</title>
  <desc id="impact-desc">右上がりに傾いた棒の重心Cから右上端Pへ腕rが伸び、Pが右側の固定壁に当たる。法線nは右向き、棒が受ける衝撃量−JnはPから左向きに働く。重心の初速度Vは右向きである。</desc>
  <defs>
    <marker id="impact-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#23476c"/>
    </marker>
    <marker id="impact-arrow-green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#20664a"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="558" height="438" rx="8" fill="#fff" stroke="#d4d9df" stroke-width="1"/>
  <g fill="none" stroke="#78818b" stroke-width="2">
    <line x1="355" y1="48" x2="355" y2="402" stroke-width="6"/>
    <line x1="355" y1="85" x2="377" y2="63"/>
    <line x1="355" y1="139" x2="377" y2="117"/>
    <line x1="355" y1="247" x2="377" y2="225"/>
    <line x1="355" y1="301" x2="377" y2="279"/>
    <line x1="355" y1="355" x2="377" y2="333"/>
  </g>
  <text x="403" y="68" font-size="18" font-family="sans-serif" fill="#343c45">固定壁</text>
  <line x1="135" y1="398" x2="355" y2="178" stroke="#506780" stroke-width="12" stroke-linecap="round"/>
  <circle cx="245" cy="288" r="8" fill="#fff" stroke="#23476c" stroke-width="3"/>
  <circle cx="355" cy="178" r="7" fill="#a64a35" stroke="#fff" stroke-width="1.5"/>
  <text x="263" y="317" font-size="21" font-family="sans-serif" fill="#1b3147">C</text>
  <text x="369" y="153" font-size="21" font-family="sans-serif" fill="#1b3147">P</text>
  <text x="304" y="260" font-size="20" font-family="sans-serif" fill="#1b3147">r</text>
  <line x1="245" y1="288" x2="325" y2="288" stroke="#23476c" stroke-width="3" marker-end="url(#impact-arrow)"/>
  <text x="306" y="276" font-size="18" font-family="sans-serif" fill="#23476c">V</text>
  <line x1="355" y1="178" x2="260" y2="178" stroke="#20664a" stroke-width="4" marker-end="url(#impact-arrow-green)" data-series-group="contact-directions" data-series-label="impulse"/>
  <text x="281" y="158" font-size="21" font-family="sans-serif" fill="#20664a">−Jn</text>
  <line x1="355" y1="178" x2="448" y2="178" stroke="#23476c" stroke-width="2.8" stroke-dasharray="9 5" marker-end="url(#impact-arrow)" data-series-group="contact-directions" data-series-label="normal"/>
  <text x="448" y="158" font-size="21" font-family="sans-serif" fill="#23476c">n</text>
</svg>
