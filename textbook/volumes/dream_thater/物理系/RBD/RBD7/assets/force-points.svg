<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" data-layout-lint="strict" role="img" aria-labelledby="rbd7-fig-title rbd7-fig-desc">
  <title id="rbd7-fig-title">剛体の自由物体図：重心、支点、偏心外力の作用点</title>
  <desc id="rbd7-fig-desc">水平な剛体の左側に支点 O、中央に重心 C、右側に外力作用点 P がある。反力 R_O は支点から斜め上、重力 Mg は重心から下、外力 f_P は P から上に描かれている。C から P までの距離を破線の腕 r_CP で示す。反力の方向と三つの矢印長は模式的なもので、力の実際の大小や符号は示さない。</desc>
  <defs>
    <marker id="rbd7-arrow" markerWidth="10" markerHeight="10" refX="8.2" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M 0 1 L 9 5 L 0 9 Z" fill="#394c60"/>
    </marker>
  </defs>
  <g aria-label="剛体の輪郭">
    <rect x="177" y="146" width="311" height="68" rx="12" fill="#eaf0f6" stroke="#546779" stroke-width="2.5"/>
    <path d="M 188 155 L 476 155" stroke="#b4c5d3" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <g aria-label="作用位置と重心">
    <circle cx="205" cy="180" r="7" fill="#ffffff" stroke="#223344" stroke-width="2.7"/>
    <circle cx="326" cy="180" r="6.5" fill="#223344"/>
    <circle cx="456" cy="180" r="6.5" fill="#223344"/>
  </g>
  <g aria-label="外力矢印">
    <path data-series-group="forces" data-series-label="支点反力" d="M 205 180 L 117 73" fill="none" stroke="#28796a" stroke-width="3.7" stroke-dasharray="3 7" stroke-linecap="round" marker-end="url(#rbd7-arrow)"/>
    <path data-series-group="forces" data-series-label="偏心外力" d="M 456 180 L 456 61" fill="none" stroke="#205cba" stroke-width="4.2" stroke-linecap="round" marker-end="url(#rbd7-arrow)"/>
    <path data-series-group="forces" data-series-label="重力" d="M 326 180 L 326 278" fill="none" stroke="#b14e4e" stroke-width="3.9" stroke-dasharray="11 6" stroke-linecap="round" marker-end="url(#rbd7-arrow)"/>
  </g>
  <g aria-label="重心から外力までのモーメント腕">
    <path d="M 326 219 L 326 246 M 456 219 L 456 246" fill="none" stroke="#607487" stroke-width="1.8" stroke-dasharray="4 5"/>
    <path d="M 330 239 L 452 239" fill="none" stroke="#607487" stroke-width="2" stroke-dasharray="5 5"/>
    <circle cx="326" cy="239" r="2.5" fill="#607487"/>
    <circle cx="456" cy="239" r="2.5" fill="#607487"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="19" font-weight="600" fill="#1d2b39">
    <text x="184" y="241">O</text>
    <text x="315" y="128">C</text>
    <text x="473" y="185">P</text>
    <text x="63" y="62" fill="#205f54">R_O</text>
    <text x="474" y="66" fill="#184a91">f_P</text>
    <text x="344" y="293" fill="#943b3b">Mg</text>
    <text x="367" y="272" font-size="18" fill="#485d71">r_CP</text>
  </g>
</svg>
