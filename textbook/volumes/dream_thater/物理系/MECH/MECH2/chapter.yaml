id: "MECH2"
title: "Newton の運動法則と運動方程式"
volume: "foundations"
status: supplementary
prerequisites:
  - MECH1
  - ODE1
official_scope: []
learning_objectives:
  - 質量・力・合力を区別し、力の次元と SI 単位を説明できる
  - 慣性系の意味を Newton の第1法則と Galilei 変換から説明できる
  - Newton の第2法則を経験法則として位置付け、一定質量の質点について m q''=F(q,q',t) を立てられる
  - Newton の第3法則で相互作用する二物体の作用反作用を識別し、同一物体に働くつり合いの二力と混同しない
  - 重力・ばね・線形抵抗力のモデルを状況と符号規約から式にできる
  - 運動方程式を位置と速度を初期条件とする初期値問題として読み替えられる
  - 空気抵抗を無視した自由落下と斜方投射を Newton 方程式から導ける
  - 線形抵抗を受ける落下運動を一階線形 ODE として解き、終端速度と時定数を説明できる
  - 加速座標系で慣性力が必要になる理由を座標変換から導ける
definitions:
  - { id: MECH2-DEF-01, name: "質量・力・合力" }
