  - "机上の本で重力と垂直抗力が作用反作用の組ではないことを確認する例"
  - "地表近くの自由落下を m y''=-mg から導く例"
  - "斜方投射を x 方向と y 方向の運動方程式へ分解する例"
  - "線形抵抗下の落下で終端速度を一階線形 ODE から導く例"
