<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc" data-layout-lint="strict">
  <title id="title">万有引力の有効ポテンシャル</title>
  <desc id="desc">有効ポテンシャルが ρ が 0 に近いと正の無限大へ上がり、有限半径 ρ_c で負の極小を取り、遠方では 0 の負側から近づく形と、負の束縛エネルギー線を示す。</desc>
  <rect width="760" height="430" fill="white"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="currentColor"/></marker>
  </defs>
  <line x1="90" y1="170" x2="700" y2="170" stroke="#222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="90" y1="380" x2="90" y2="55" stroke="#222" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="710" y="215" font-size="20">ρ</text>
  <text x="10" y="35" font-size="20">V_eff</text>
  <path d="M120,70 C152,135 172,218 212,278 C247,331 295,325 338,286 C402,228 486,198 675,186" fill="none" stroke="#1f5f99" stroke-width="4"/>
  <line x1="110" y1="250" x2="675" y2="250" stroke="#8a3d2f" stroke-width="3" stroke-dasharray="12 8"/>
  <text x="690" y="260" font-size="20">E</text>
  <circle cx="278" cy="314" r="6" fill="#111"/>
  <line x1="278" y1="314" x2="278" y2="350" stroke="#777" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="258" y="378" font-size="20">ρ_c</text>
</svg>
