id: QCURV16
title: "二次元共形模型・trace anomaly・Schwarzian流束"
volume: foundations
status: supplementary
prerequisites:
  - QCURV15
  - QCURV10
official_scope: []
learning_objectives:
  - 2次元null座標と正味の外向きエネルギー流束の符号を再計算できる
  - 局所共変な2次元trace anomalyの係数と条件を説明し、保存則とトレースから応力テンソル成分を復元できる
  - Schwarzian微分とその合成則を導出し、座標の付替えと状態の変更を区別できる
  - 指数的な後期光線写像から正の出射流束を求め、1次元熱流の係数と照合できる
  - 2次元静的Schwarzschild模型の将来地平線正則性と三状態の遠方流束を条件付きで比較できる
  - 2次元共形模型と4次元の灰色体散乱・dilaton結合・半古典逆作用の射程を区別できる
