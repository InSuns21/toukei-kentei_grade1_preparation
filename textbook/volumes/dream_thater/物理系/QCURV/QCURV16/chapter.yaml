  - { id: QCURV16-THM-03, name: 指数光線写像の後期Schwarzian流束 }
  - { id: QCURV16-PROP-02, name: 静的null応力の地平線での相殺 }
canonical_examples:
  - 右向き古典波に対するTtxとT^txの符号
  - 共形因子rho=lambda uvでの局所曲率とtrace anomaly
  - 線形写像と指数写像のSchwarzian微分
  - 指数光線写像の流束と熱的Bose積分の一致
  - 静的Schwarzschild断面における将来地平線の定数項相殺
