  - id: qcurv.ultrastatic-vacuum
    name: 超静的背景の規格化モードと真空
    kind: proposition
    introduction: formal
    requires: [qcurv.fock-wightman, qcurv.curved-kg-pairing, qcurv.ultrastatic-equation]
