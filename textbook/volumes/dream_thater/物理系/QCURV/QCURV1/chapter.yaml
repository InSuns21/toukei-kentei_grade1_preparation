id: QCURV1
title: "曲率結合Klein–Gordon場の作用とCauchy問題"
volume: foundations
status: supplementary
prerequisites:
  - QFT1
  - GR6
  - GR9
  - HPDE16
official_scope: []
learning_objectives:
  - 固定背景、実スカラー場、計量符号・曲率結合の各仮定を区別し、曲がった時空の作用を定義できる
  - 体積密度と共変発散を座標表示へ直し、コンパクト支持変分から場の方程式を符号付きで導出できる
  - Minkowski極限と静的な曲率背景の直接例で質量項・曲率結合の寄与を検算できる
  - 大域双曲性・normally hyperbolic性・初期データの条件を照合し、古典Cauchy問題の存在一意性と有限伝播を説明できる
  - 古典的な解の一意性と量子真空・粒子数の選択が別問題であることを説明できる
