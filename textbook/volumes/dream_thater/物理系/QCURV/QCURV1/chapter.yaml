  - { id: QCURV1-PROP-02, name: 超静的背景での場の方程式 }
  - { id: QCURV1-COR-01, name: 曲率結合場の大域Cauchy問題 }
canonical_examples:
  - 定数場と固定背景という仮定の確認
  - 有限時間の円筒領域での作用と停留性の直接確認
  - Minkowski符号切替と平面波の分散関係
  - 時間と半径が固定されたR×S3上の曲率結合モード
  - コンパクト支持初期データと有限伝播
