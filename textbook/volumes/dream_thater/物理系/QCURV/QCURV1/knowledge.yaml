  - id: qcurv.action-stationarity
    name: 曲率結合作用の停留条件
    kind: theorem
    introduction: formal
    requires: [qcurv.curvature-coupled-action, qcurv.kg-coordinate-form]
  - id: qcurv.ultrastatic-equation
    name: 超静的背景での場の方程式
