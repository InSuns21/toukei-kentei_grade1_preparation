chapter: QCURV1
scope: dream-theater
coverage: complete
prerequisites:
  - QFT1
  - GR6
  - GR9
  - HPDE16
forward_references: []
concepts:
  - id: qcurv.fixed-background-real-scalar
    name: 固定背景上の実スカラー場
    kind: definition
    introduction: formal
    requires: [qft.real-scalar-field, lorentz-geometry.lorentz-metric]
  - id: qcurv.curvature-coupled-action
    name: 曲率結合スカラー場の作用
    kind: definition
    introduction: formal
    requires: [qcurv.fixed-background-real-scalar, gravity.local-matter-action, gravity.lorentz-scalar-curvature]
  - id: qcurv.curvature-coupled-kg
    name: 曲率結合Klein–Gordon作用素
    kind: definition
    introduction: formal
