  - { id: QCURV7-PROP-02, name: 固有加速度の計量符号整合 }
  - { id: QCURV7-PROP-03, name: Rindlerモード方程式とKG符号 }
  - { id: QCURV7-PROP-04, name: Minkowski二点分布の等加速度引戻し }
  - { id: QCURV7-PROP-05, name: 右左くさびにまたがるMinkowski真空の相関 }
canonical_examples:
  - 右くさびの一点と左くさびの一点で逆変換・時間向きを直接確認
  - 一定Rindler半径の双曲線と固有加速度の計算
  - 分離したモードのKG正値性と左くさびのboost符号
  - 質量零Minkowski真空の等加速度二点分布と慣性短距離極限
  - 等時刻で右左くさびにまたがる二点相関
