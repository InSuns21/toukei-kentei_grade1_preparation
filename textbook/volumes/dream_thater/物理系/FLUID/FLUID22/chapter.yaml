id: "FLUID22"
title: "平板境界層の自己相似解はどう出るか"
volume: "foundations"
status: supplementary
prerequisites:
  - FLUID21
official_scope: []
learning_objectives:
  - "零圧力勾配平板と局所Reynolds数の仮定を確認し、相似座標ηと流れ関数ψの次元を説明する"
  - "流れ関数のx,y偏微分でu,vと境界条件を導き、連続の式を検算する"
  - "Prandtl運動量方程式へ相似表示を代入してBlasius境界値問題f'''+ff''/2=0を導く"
  - "曲率f''の符号と射撃法の初期曲率aを説明し、有限区間・数値刻み誤差を区別する"
  - "壁応力と局所摩擦係数Cf=2a/sqrt(Re_x)、99%厚さを計算して正符号・単位・適用限界を検算する"
  - "PythonのRK4・二分射撃・刻み半減・速度曲線表示により数値近似を再現する"
definitions:
  - { id: FLUID22-DEF-01, name: "平板境界層のBlasius自己相似表示" }
  - { id: FLUID22-DEF-02, name: "Blasius境界値問題の有限区間射撃法" }
theorems:
  - { id: FLUID22-PROP-01, name: "相似流れ関数がつくる速度場" }
  - { id: FLUID22-THM-01, name: "零圧力勾配平板境界層のBlasius方程式" }
  - { id: FLUID22-PROP-02, name: "正の初期曲率と速度の単調性" }
  - { id: FLUID22-PROP-03, name: "Blasius平板の99%厚さと局所摩擦係数" }
canonical_examples:
  - "境界条件を満たしてもODE残差が消えない指数型試行関数"
  - "相似流れ関数から両速度を再構成し、連続条件と壁条件を照合"
  - "射撃法の初期曲率a=0.2,0.5で終端速度を挟み二分法を実行"
  - "Re_x=10^6の平板でdelta99・Cf・正の壁面応力を計算"
  - "相似変数の正規化を変えてODE係数・遠方条件・壁摩擦の不変性を照合"
