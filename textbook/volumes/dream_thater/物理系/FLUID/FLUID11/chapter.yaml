id: "FLUID11"
title: "流れ関数と速度ポテンシャルはいつ存在するか"
volume: "foundations"
status: supplementary
prerequisites:
  - FLUID10
  - VC9
  - VC2
official_scope: []
learning_objectives:
  - "二次元非圧縮場の流れ関数を長方形上で積分構成し、速度との符号を確かめられる"
  - "無渦条件から局所速度ポテンシャルを構成し、非圧縮性と無渦性を区別できる"
  - "閉曲線の循環と流束から大域的存在の必要十分条件を証明し、単連結の役割を説明できる"
  - "穴あき平面の周回流・放射流で発散、渦度、循環、流束、局所・大域関数を検算できる"
  - "流れ関数と速度ポテンシャルの Cauchy–Riemann 関係、調和性、等高線直交性を導ける"
  - "ブラウザ Python で等高線の離散表現と微分残差を区別して確認できる"
definitions:
  - { id: FLUID11-DEF-01, name: "速度ポテンシャル" }
  - { id: FLUID11-DEF-02, name: "閉曲線の速度流束" }
