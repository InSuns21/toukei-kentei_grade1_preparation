  - { id: FLUID11-THM-01, name: "速度ポテンシャル・流れ関数の大域的存在判定" }
  - { id: FLUID11-PROP-03, name: "流れ関数と速度ポテンシャルの関係" }
canonical_examples:
  - "一様流の流れ関数と速度ポテンシャル"
  - "剛体回転の流れ関数と局所ポテンシャル不存在"
