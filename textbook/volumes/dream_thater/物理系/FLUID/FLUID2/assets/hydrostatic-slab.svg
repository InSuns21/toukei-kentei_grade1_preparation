<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 390" role="img" aria-labelledby="title desc" data-layout-lint="strict">
  <title id="title">静止流体要素の鉛直方向の力</title>
  <desc id="desc">上向きのz軸に対し、液体中の薄い直方体の上面では圧力が下向き、下面では上向き、重力は内部で下向きに作用する。上面の高さはz+Δz、下面はzである。</desc>
  <defs>
    <marker id="pressure-head" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#17628c"/>
    </marker>
    <marker id="gravity-head" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#a04438"/>
    </marker>
    <marker id="axis-head" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#273442"/>
    </marker>
  </defs>
  <rect x="290" y="60" width="280" height="270" rx="4" fill="#eef7fa" stroke="#657e88" stroke-width="1.7"/>
  <path d="M 292 85 H 568" stroke="#357b96" stroke-width="2.6" stroke-dasharray="11 5"/>
  <rect x="320" y="162" width="220" height="78" fill="#d2eaf0" stroke="#24495d" stroke-width="2.6"/>
  <line x1="430" y1="116" x2="430" y2="160" stroke="#17628c" stroke-width="3.6" marker-end="url(#pressure-head)"/>
  <line x1="430" y1="286" x2="430" y2="242" stroke="#17628c" stroke-width="3.6" marker-end="url(#pressure-head)"/>
  <line x1="478" y1="180" x2="478" y2="223" stroke="#a04438" stroke-width="3.6" marker-end="url(#gravity-head)"/>
  <line x1="666" y1="300" x2="666" y2="92" stroke="#273442" stroke-width="2.7" marker-end="url(#axis-head)"/>
  <text x="305" y="137" font-family="Arial, sans-serif" font-size="20" fill="#154968">p(z+Δz)A</text>
  <text x="450" y="310" font-family="Arial, sans-serif" font-size="20" fill="#154968">p(z)A</text>
  <text x="500" y="206" font-family="Arial, sans-serif" font-size="21" fill="#7b3227">mg</text>
  <text x="212" y="168" font-family="Arial, sans-serif" font-size="21" fill="#263846">z+Δz</text>
  <text x="265" y="240" font-family="Arial, sans-serif" font-size="21" fill="#263846">z</text>
  <text x="686" y="95" font-family="Arial, sans-serif" font-size="21" fill="#263846">+z</text>
</svg>
