    introduction: formal
    introduction_aliases: ["定義（尖った後縁の Kutta 条件）"]
    requires: [fluid.joukowski-cusp, fluid.joukowski-velocity-transform]
  - id: fluid.kutta-circulation
    name: Joukowski尖点で選ばれる循環
    kind: proposition
    introduction: formal
    introduction_aliases: ["命題（Joukowski 尖点で選ばれる循環）"]
    requires: [fluid.kutta-condition, fluid.joukowski-cusp, fluid.circulating-cylinder, fluid.blasius-force]
