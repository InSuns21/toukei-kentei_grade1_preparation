chapter: FLUID14
scope: dream-theater
coverage: complete
prerequisites:
  - FLUID13
  - FLUID9
  - FLUID6
  - CA4
concepts:
  - id: fluid.lift-drag
    name: 単位スパン当たりの抗力・揚力
    kind: definition
    introduction: formal
    introduction_aliases: ["定義（単位スパン当たりの抗力・揚力）"]
    requires: [fluid.ideal-potential-force-model]
  - id: fluid.circulating-cylinder
    name: 循環のある円柱流と表面接線速度
    kind: proposition
    introduction: formal
    introduction_aliases: ["命題（循環のある円柱流と表面接線速度）"]
    requires: [fluid.complex-velocity-formula, fluid.material-loop-circulation, fluid.cylinder-potential-flow]
  - id: fluid.cylinder-lift
    name: 循環円柱のKutta–Joukowski揚力と零抗力
    kind: theorem
    introduction: formal
