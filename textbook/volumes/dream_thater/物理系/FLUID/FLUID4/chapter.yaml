id: "FLUID4"
title: "流線・流跡線・流脈線はなぜ異なるか"
volume: "foundations"
status: supplementary
prerequisites:
  - FLUID3
  - CTM1
official_scope: []
learning_objectives:
  - "流線で観測時刻を固定し、流跡線で初期粒子を固定し、流脈線で注入口と観測時刻を固定する違いを定義と微分方程式で説明できる"
  - "一つの非定常解析速度場から三曲線を積分・パラメータ消去で導出して、共通終点と異なる途中点を比較できる"
  - "定常場で三曲線が同一の幾何学的軌道上にあることをODEの一意性から証明し、非定常でも一致する例を示せる"
  - "放出時刻区間を保持して実際の流脈線の範囲を決定できる"
  - "前進Euler法の時間刻み誤差を厳密解で検算し、粒子追跡と瞬時流線を混同しない"
definitions:
  - { id: FLUID4-DEF-01, name: "流線" }
  - { id: FLUID4-DEF-02, name: "流跡線" }
  - { id: FLUID4-DEF-03, name: "固定注入口からの流脈線" }
theorems:
  - { id: FLUID4-PROP-01, name: "非定常一様速度場の三曲線" }
  - { id: FLUID4-THM-01, name: "定常速度場における三曲線の一致" }
  - { id: FLUID4-PROP-02, name: "非定常一様場に対する前進Euler法の誤差" }
canonical_examples:
  - "u=(U,at)の瞬時流線の時刻固定計算"
  - "初期時刻を指定した流跡線の初期値確認"
  - "連続注入の流脈線で放出時刻を消去"
  - "三曲線を共通終点で比較して途中点と接線の違いを検算"
  - "定常場の時間平行移動と停止した注入口の有限区間"
  - "Euler時間刻みと鉛直座標の解析的誤差"
problem_patterns:
  - FLUID4-INSTANT-STREAMLINE
  - FLUID4-PATHLINE-RELEASE-TIME
  - FLUID4-STREAKLINE-RELEASE-LABEL
  - FLUID4-THREE-CURVE-COMPARISON
  - FLUID4-STEADY-SEGMENTS
  - FLUID4-SHIFTED-INJECTION-POINT
  - FLUID4-EULER-CONVERGENCE
  - FLUID4-UNSTEADY-COLLINEAR
  - FLUID4-TRUNCATED-INJECTION-INTEGRATED
past_exam_alignment: []
integrated_exam_problems: []
exercise_counts: { level_a: 5, level_b: 3, level_c: 1, level_d: 0 }
estimated_hours: { reading: 5, exercises: 6, review: 2 }
