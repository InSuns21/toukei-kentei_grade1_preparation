id: "FLUID32"
title: "地球回転で地衡流が成立する条件は何か"
volume: "foundations"
status: supplementary
prerequisites:
  - FLUID1
  - FLUID16
  - FLUID31
official_scope: []
learning_objectives:
  - "回転座標の基底微分から Coriolis 加速度の係数2と遠心項を導き、traditional approximationの仮定を区別する"
  - "緯度によるCoriolisパラメータの符号と地衡流の右左・高低圧側を具体例で検証する"
  - "Rossby数、Ekman数、局所時間尺度を運動方程式の項から導いて地衡近似の成立・破綻を判定する"
  - "地衡流速の二成分と一定f面での水平発散・相対渦度を導出する"
  - "静水圧・地衡釣合から熱風関係を導き、水平密度勾配と鉛直シアの符号を検算する"
  - "半空間・静止底面・定粘性のEkman層を複素速度で解き、両端条件・らせんの符号・輸送を検証する"
  - "赤道・非定常・高Ro・壁・緯度変化でどの仮定と釣合が破れるか説明する"
