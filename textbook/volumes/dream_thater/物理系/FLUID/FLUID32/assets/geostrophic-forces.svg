<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="diagram-title diagram-desc" data-layout-lint="strict">
  <title id="diagram-title">Northern-hemisphere eastward geostrophic flow</title>
  <desc id="diagram-desc">At one fluid parcel, geostrophic velocity points east; pressure-gradient acceleration points north; Coriolis apparent acceleration points south. The equal opposite accelerations balance.</desc>
  <defs>
    <marker id="axis-arrow" markerWidth="7" markerHeight="7" refX="5.8" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#777"/></marker>
    <marker id="velocity-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#146f46"/></marker>
    <marker id="pressure-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#175e9c"/></marker>
    <marker id="coriolis-arrow" markerWidth="8" markerHeight="8" refX="6.5" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#a14a25"/></marker>
  </defs>
  <rect width="720" height="330" rx="10" fill="#fff"/>
  <line x1="90" y1="168" x2="634" y2="168" stroke="#777" stroke-width="1.5" stroke-dasharray="2 9" marker-end="url(#axis-arrow)"/>
  <line x1="320" y1="310" x2="320" y2="26" stroke="#777" stroke-width="1.5" stroke-dasharray="2 9" marker-end="url(#axis-arrow)"/>
  <text x="640" y="142" font-size="18" fill="#222">east x</text>
  <text x="231" y="27" font-size="18" fill="#222">north y</text>
  <line x1="320" y1="168" x2="525" y2="168" stroke="#146f46" stroke-width="5" marker-end="url(#velocity-arrow)"/>
  <text x="475" y="142" font-size="19" fill="#146f46">u_g</text>
  <line x1="320" y1="168" x2="320" y2="59" stroke="#175e9c" stroke-width="4.5" marker-end="url(#pressure-arrow)" data-series-group="forces" data-series-label="pressure"/>
  <text x="345" y="83" font-size="18" fill="#175e9c">Pressure</text>
  <line x1="320" y1="168" x2="320" y2="277" stroke="#a14a25" stroke-width="4.5" stroke-dasharray="12 6" marker-end="url(#coriolis-arrow)" data-series-group="forces" data-series-label="coriolis"/>
  <text x="345" y="270" font-size="18" fill="#a14a25">Coriolis</text>
  <circle cx="320" cy="168" r="7" fill="#222"/>
</svg>
