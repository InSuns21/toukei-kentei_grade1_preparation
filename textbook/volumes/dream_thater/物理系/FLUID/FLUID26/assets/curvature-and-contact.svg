<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 350" data-layout-lint="strict" role="img" aria-labelledby="title desc">
<title id="title">球形界面の曲率と壁面の接触角</title>
<desc id="desc">左は内側相Aを囲む球の断面で中心から表面までの半径Rと外向き法線nを示し、二主曲率はともに正の1/Rである。右は鉛直壁の右側に液体があり、壁で高く遠方で水平になる液体と気体の界面と、液体の内側で測る接触角シータを示す。模式図であり実測形状ではない。</desc>
<defs>
<marker id="arrow-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#315c82"/></marker>
</defs>
<rect width="940" height="350" fill="#fff"/>
<path d="M465 30 V319" stroke="#bbb" stroke-width="1.5" stroke-dasharray="5 6"/>
<circle cx="217" cy="185" r="91" fill="#e6f3f6" stroke="#315c82" stroke-width="3"/>
<circle cx="217" cy="185" r="3.6" fill="#315c82"/>
<path d="M217 185 L282 121" stroke="#555" stroke-width="2" stroke-dasharray="5 4"/>
<path d="M282 121 L327 77" stroke="#315c82" stroke-width="2.8" marker-end="url(#arrow-n)"/>
<circle cx="282" cy="121" r="4" fill="#315c82"/>
<text x="220" y="138" font-family="sans-serif" font-size="20" fill="#20262c">R</text>
<text x="337" y="75" font-family="sans-serif" font-size="20" fill="#20262c">n</text>
<text x="170" y="210" font-family="sans-serif" font-size="21" fill="#20262c">A</text>
<text x="378" y="235" font-family="sans-serif" font-size="21" fill="#20262c">B</text>
<text x="108" y="318" font-family="sans-serif" font-size="20" fill="#20262c">κ₁ = κ₂ = 1/R</text>
<path d="M545 132 C612 171 700 224 872 224 L872 320 L545 320 Z" fill="#e6f3f6"/>
<path d="M545 132 C612 171 700 224 872 224" fill="none" stroke="#315c82" stroke-width="3.5"/>
<path d="M545 35 V320" stroke="#555" stroke-width="8" stroke-linecap="square"/>
<path d="M545 165 A33 33 0 0 0 574 148" fill="none" stroke="#a65c25" stroke-width="2.4"/>
<text x="566" y="186" font-family="sans-serif" font-size="20" fill="#20262c">θ</text>
<text x="711" y="104" font-family="Noto Sans CJK JP, sans-serif" font-size="21" fill="#20262c">気体</text>
<text x="713" y="280" font-family="Noto Sans CJK JP, sans-serif" font-size="21" fill="#20262c">液体</text>
</svg>