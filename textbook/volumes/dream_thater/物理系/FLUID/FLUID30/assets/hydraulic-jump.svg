<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-labelledby="title desc" data-layout-lint="strict">
  <title id="title">動く浅水段波と左右の相対流</title>
  <desc id="desc">平底の水路で、左側の浅い水深 h1 から右側の深い水深 h2 へ不連続に変化する理想化された段波。水は左から右へ相対流量 J 正で通過する。鉛直破線は速度 s で移動する境界を表す。</desc>
  <defs>
    <marker id="arr-flow" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#155e75"/></marker>
    <marker id="arr-wave" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#7c3aed"/></marker>
  </defs>
  <rect x="0" y="0" width="960" height="380" fill="#fff"/>
  <path d="M70 300 L70 195 L475 195 L475 105 L900 105 L900 300 Z" fill="#d7eef7"/>
  <path d="M70 195 H475 V105 H900" fill="none" stroke="#155e75" stroke-width="3"/>
  <path d="M70 300 H900" stroke="#334155" stroke-width="4"/>
  <path d="M475 72 V300" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="8 7"/>
  <path d="M180 260 H365" stroke="#155e75" stroke-width="4" marker-end="url(#arr-flow)"/>
  <path d="M595 260 H780" stroke="#155e75" stroke-width="4" marker-end="url(#arr-flow)"/>
  <path d="M475 58 H575" stroke="#7c3aed" stroke-width="3" marker-end="url(#arr-wave)"/>
  <g fill="#0f172a" font-family="sans-serif" font-size="22">
    <text x="170" y="157">上流 1：h₁</text>
    <text x="620" y="67">下流 2：h₂</text>
    <text x="235" y="236">v₁ = J/h₁</text>
    <text x="644" y="236">v₂ = J/h₂</text>
    <text x="510" y="31" fill="#6d28d9">段差速度 s</text>
    <text x="88" y="345">固定平底（単位幅）</text>
    <text x="602" y="345">J &gt; 0、h₂ &gt; h₁</text>
  </g>
</svg>
