id: "FLUID30"
title: "段波と跳水の上下流をどうつなぐか"
volume: "foundations"
status: supplementary
prerequisites:
  - FLUID29
official_scope: []
learning_objectives:
  - "移動段波の左右の水深・流速・界面速度と、相対流量・跳び記号を区別する"
  - "平底浅水保存則を動く検査区間へ積分し、質量・運動量の Rankine–Hugoniot 条件を導く"
  - "運動量跳躍を相対流量で表し、共役水深・Froude数の式を途中計算から導く"
  - "正の水深比から超臨界流・常流と特性の収束方向を判定する"
  - "力学的エネルギーの移動系への変換と水頭損失を計算し、非許容跳躍を判別する"
  - "停止した跳水と動く段波の符号・単位・数値跳躍残差をブラウザ Python で検算する"
definitions:
  - { id: FLUID30-DEF-01, name: "移動座標の比エネルギー水頭" }
theorems:
  - { id: FLUID30-THM-01, name: "移動する段波の質量・運動量跳躍条件" }
  - { id: FLUID30-THM-02, name: "共役水深と Froude 数" }
  - { id: FLUID30-THM-03, name: "跳水の水頭損失とエネルギーの許容条件" }
  - { id: FLUID30-PROP-01, name: "右向き相対流の圧縮型跳水" }
canonical_examples:
  - "移動面を横切る相対流量と実験室の流量を区別する"
  - "Fr1=2から共役水深・下流Froude数を計算する"
  - "水頭損失の立方則と逆向きの不許容跳びを比較する"
  - "速度を一定値シフトして跳び残差が不変なことを確認する"
problem_patterns:
  - FLUID30-RELATIVE-DISCHARGE
  - FLUID30-CONJUGATE-RATIO
  - FLUID30-CHARACTERISTIC-COUNTEREXAMPLE
  - FLUID30-HEAD-LOSS-SIGN
  - FLUID30-NEGATIVE-SPEED
  - FLUID30-MOVING-CONTROL-VOLUME
  - FLUID30-CUBIC-HEAD-LOSS
  - FLUID30-GALILEAN-JUMP
  - FLUID30-COMPRESSION-CHARACTERISTICS
  - FLUID30-INTEGRATED-JUMP-DIAGNOSTIC
