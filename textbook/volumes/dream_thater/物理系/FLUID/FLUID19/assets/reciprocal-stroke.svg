  <title id="figure-title">一自由度の相反的な開閉ストローク</title>
  <desc id="figure-description">上段は閉じた二本の腕を開く行程で、左の狭い形から右の広い形へ向かう実線矢印。下段は同じ広い形から狭い形へ戻す行程で、破線の矢印。形状の往復経路が同一で逆向きになる。</desc>
