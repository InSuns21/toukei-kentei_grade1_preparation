  - { id: FLUID17-THM-02, name: "第一問題の壁面せん断力と運動量収支" }
  - { id: FLUID17-THM-03, name: "Stokes 第二問題の振動境界層" }
  - { id: FLUID17-PROP-01, name: "振動壁のせん断力と一周期平均の散逸" }
canonical_examples:
  - "境界条件を満たしても拡散方程式を満たさない指数候補"
  - "粘度1e-6m2/sの1秒後、2mm位置の急発進速度"
  - "1Hzでの振動浸透深さと位相の数値検算"
  - "周期解のt=0の非零速度が静止初期値と矛盾する例"
