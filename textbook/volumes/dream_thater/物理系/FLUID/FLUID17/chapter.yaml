id: "FLUID17"
title: "壁が急に動くと運動量はどう広がるか"
volume: "foundations"
status: supplementary
prerequisites:
  - FLUID16
  - CTM15
official_scope: []
learning_objectives:
  - "非圧縮一方向非定常速度場で対流項が厳密に零になることを成分で示し、粘性拡散式を導く"
  - "Stokes 第一問題の不連続な壁始動と初期条件を区別し、相似変数から相補誤差関数解を導く"
  - "速度閾値厚さの定義と平方根時間則を示し、壁面力と流体全運動量の収支を検算する"
  - "Stokes 第二問題の単一周波数周期解を複素振幅から導き、位相と減衰長を計算する"
  - "周期壁面せん断力、平均入力仕事、粘性散逸を計算し、周期解と突然の振動開始を区別する"
  - "前進Euler差分の安定条件・格子細分化・解析解との誤差をブラウザ内Pythonで検証する"
definitions:
  - { id: FLUID17-DEF-01, name: "Stokes 第一問題" }
  - { id: FLUID17-DEF-04, name: "相補誤差関数" }
  - { id: FLUID17-DEF-02, name: "第一問題の速度閾値厚さ" }
  - { id: FLUID17-DEF-03, name: "Stokes 第二問題の周期応答" }
theorems:
