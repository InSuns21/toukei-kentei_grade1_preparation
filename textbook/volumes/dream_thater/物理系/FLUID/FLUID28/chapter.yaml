id: "FLUID28"
title: "群速度はエネルギーの輸送とどう関係するか"
volume: "foundations"
status: supplementary
prerequisites:
  - FLUID27
official_scope: []
learning_objectives:
  - "近接する線形波の干渉から搬送波・包絡を分離し、狭帯域での群速度の意味と適用限界を説明する"
  - "有限水深重力・毛管波の分散関係を微分して群速度を導出し、深水重力・毛管・浅水の極限を確認する"
  - "重力・表面張力・運動の二次平均エネルギーをポテンシャルの深さ積分から再現する"
  - "圧力仕事と表面張力仕事の双方を含む局所エネルギー保存式を導出する"
  - "平均流束を独立に計算し、群速度とエネルギー輸送速度の一致を示す"
  - "ブラウザPythonで解析群速度・差分微分・二波の包絡・エネルギー流束の各残差を比較する"
definitions:
  - { id: FLUID28-DEF-01, name: "群速度" }
