id: "FLUID39"
title: "乱流のエネルギーは尺度間をどう移るか"
volume: "foundations"
status: supplementary
prerequisites:
  - FLUID38
  - FLUID37
  - CTM15
official_scope: []
learning_objectives:
  - "一定密度・非圧縮・微分と集合平均の交換条件を明示し、変動方程式から厳密な乱流運動エネルギー収支を導く"
  - "平均剪断の生成、非負の粘性散逸、三次・圧力・粘性の物理空間輸送を符号と単位で区別する"
  - "周期三次元 Fourier 場の波数殻エネルギーを定義し、Parseval からエネルギー・散逸の波数積分を導く"
  - "非線形モード移送の総和ゼロを証明し、正の前方フラックスと空間輸送の違いを説明する"
  - "Kolmogorov 微細尺度を次元で検証し、K41 仮説の下でのみ -5/3 乗則を導く"
  - "合成切断スペクトルの解析積分と数値台形積分を比較し、DNS・観測・フラックス測定との違いを説明する"
definitions:
  - { id: FLUID39-DEF-01, name: "変動エネルギーの生成・散逸・空間輸送" }
  - { id: FLUID39-DEF-02, name: "波数殻エネルギーと一側エネルギースペクトル" }
  - { id: FLUID39-DEF-03, name: "波数別の非線形移送と前方フラックス" }
  - { id: FLUID39-DEF-04, name: "Kolmogorovの微細尺度" }
theorems:
  - { id: FLUID39-PROP-01, name: "乱流運動エネルギーの局所収支" }
  - { id: FLUID39-PROP-02, name: "Parsevalによるエネルギーと散逸の表示" }
  - { id: FLUID39-PROP-03, name: "非線形移送の総和はゼロ" }
  - { id: FLUID39-PROP-04, name: "K41仮説の下での慣性領域スペクトル次元則" }
canonical_examples:
  - "平行剪断のReynolds共分散から生成率を直接計算し散逸の符号と区別"
  - "位相平均した発散ゼロ単一Fourierモードの殻エネルギーと散逸"
  - "二つの波数殻で非線形移送総和と前方フラックスを照合"
  - "動粘度と平均散逸率から微細尺度の単位・指数を検算"
  - "合成切断-5/3スペクトルのエネルギー・散逸積分と格子誤差・積算割合"
problem_patterns:
  - FLUID39-PRODUCTION-DISSIPATION
  - FLUID39-GRADIENT-DISSIPATION
  - FLUID39-SPECTRAL-UNIT
  - FLUID39-WAVENUMBER-DISSIPATION
  - FLUID39-KOLMOGOROV-SENSITIVITY
  - FLUID39-TKE-DERIVATION
  - FLUID39-SPECTRAL-FLUX-SIGN
  - FLUID39-POWER-LAW-INTEGRATION
  - FLUID39-K41-CONDITIONS
  - FLUID39-SYNTHETIC-SPECTRUM-DIAGNOSTICS
past_exam_alignment: []
integrated_exam_problems: []
