id: "FLUID20"
title: "薄い流れで潤滑方程式が現れるのはなぜか"
volume: "foundations"
status: supplementary
prerequisites:
  - FLUID19
official_scope: []
learning_objectives:
  - "細長比ε=H/Lと慣性比Re_L ε²を項別に比較し、薄膜近似の成立条件と捨てた項を説明する"
  - "無滑り境界条件からCouette–Poiseuille型速度分布と単位幅流量qを積分して導出する"
  - "動く上壁の運動学的境界条件と非圧縮質量保存からReynolds潤滑方程式を導く"
  - "定常収束くさびで入口出口の圧力、一定流量、最大圧力の位置と値を求める"
  - "平行平板の押しつぶし流で圧力分布、荷重、膜厚への依存を検算し、空洞化や慣性の限界を区別する"
  - "Python検算で圧力と流量の独立関係、端条件、質量収支を照合する"
