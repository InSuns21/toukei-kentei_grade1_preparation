<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 385" width="940" height="385" data-layout-lint="strict" role="img" aria-labelledby="title desc">
  <title id="title">物体を囲む検査体積と後流の運動量欠損</title>
  <desc id="desc">流れは左から右へ進む。中央の固定物体を長方形の仮想検査面が囲み、右側には速度欠損と符号の異なる二つの渦を描く。上下の検査面にも流体の出入りがあり、後流の質量欠損を補償する。渦列と流れの分布は模式的であり数値解ではない。</desc>
  <defs>
    <marker id="arr-blue" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#23648a"/>
    </marker>
    <marker id="arr-purple" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8251a1"/></marker>
    <marker id="arr-orange" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a14c26"/>
    </marker>
  </defs>
