id: "FLUID46"
title: "格子を細かくすれば必ず正しくなるか"
volume: "foundations"
status: supplementary
prerequisites:
  - FLUID45
official_scope: []
learning_objectives:
  - "Courant数とCFL条件を定義し、空間・時間刻みの細分経路を具体的に判定する"
  - "離散Fourierモードの増幅因子と直交性を導き、一次風上法の安定範囲とCFL超過反例を証明する"
  - "中心FTCSが周期格子の高周波モードで不安定になることを証明し、総量保存との違いを説明する"
  - "滑らかな波の修正方程式から数値拡散係数を導き、振幅誤差と位相誤差を区別する"
  - "厳密セル平均を基準にE1・Einf・観測次数を定義し、滑らかな周期解の一次風上収束評価を証明する"
  - "同一Pythonラボで格子細分・時間刻み細分・不安定例を再現し、CFL・誤差・質量残差を区別する"
