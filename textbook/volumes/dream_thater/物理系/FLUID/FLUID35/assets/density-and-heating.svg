<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" data-layout-lint="strict" role="img" aria-labelledby="fig-title fig-description">
  <title id="fig-title">Two distinct sources of buoyancy instability</title>
  <desc id="fig-description">Left: an upper, denser, semi-infinite fluid is above a lighter lower fluid; a curved interface is disturbed while gravity points down. Right: a single layer lies between a cooler upper plate and a warmer lower plate; conductive heat flux points up, opposite downward gravity. The left model has an interface, the right has solid temperature boundaries.</desc>
