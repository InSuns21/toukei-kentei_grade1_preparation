      <path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#2b3545" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="up-arrow" markerWidth="9" markerHeight="9" refX="7.2" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#3e7464" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
