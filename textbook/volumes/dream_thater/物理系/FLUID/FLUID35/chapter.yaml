id: "FLUID35"
title: "重い流体が上にあると何が起きるか"
volume: "foundations"
status: supplementary
prerequisites:
  - FLUID26
  - FLUID31
  - FLUID34
official_scope: []
learning_objectives:
  - "上層と下層の密度差、重力、表面張力の符号を固定しRayleigh–Taylor不安定性を判定する"
  - "二層の線形分散式から成長率・不安定波数帯・最速成長波数を導き適用限界を説明する"
  - "連続温度成層のBoussinesq近似でRayleigh–Bénard導電基底状態を定義する"
  - "非圧縮条件と線形化した運動量・温度方程式から鉛直速度と温度の固有値問題を導く"
  - "固定温度・自由滑り境界の正弦鉛直モードから臨界Rayleigh数と臨界波数を証明する"
  - "自由滑りと無滑り、一定温度と一定熱流束を区別し、臨界値を無条件に転用しない"
  - "ブラウザPythonで線形モード固有値・分散残差と曲線を照合し線形と非線形を区別する"
definitions:
  - { id: FLUID35-DEF-01, name: "Rayleigh–Taylor密度逆転とAtwood数" }
  - { id: FLUID35-DEF-02, name: "Rayleigh–Bénardの伝導基底状態・Rayleigh数・Prandtl数" }
theorems:
  - { id: FLUID35-THM-01, name: "Rayleigh–Taylorの分散関係と成長率" }
  - { id: FLUID35-PROP-01, name: "表面張力で選択される不安定波数帯と最速波数" }
  - { id: FLUID35-THM-02, name: "自由滑り等温壁のRayleigh–Bénard固有値方程式" }
  - { id: FLUID35-THM-03, name: "自由滑り等温壁の臨界Rayleigh数" }
canonical_examples:
  - "軽い下層と重い上層で指数成長し、密度の順序を逆にすると振動する"
  - "表面張力が短波を安定化し無張力模型には最速波数がない"
  - "正弦鉛直モードが自由滑り・固定温度条件を実際に満たす"
  - "同じRayleigh数でも自由滑りと両面無滑りの発生閾値が異なる"
  - "PythonでRTの増幅曲線、RBC固有値と中立曲線を検算"
problem_patterns:
  - FLUID35-RT-SIGN
  - FLUID35-RT-CUTOFF
  - FLUID35-RBC-MODE-BOUNDARIES
  - FLUID35-NONDIMENSIONAL
  - FLUID35-RBC-TEMPERATURE
  - FLUID35-RT-FASTEST-DERIVATION
  - FLUID35-RBC-EIGEN-DETERMINANT
  - FLUID35-RBC-CRITICAL
  - FLUID35-HEATING-REVERSAL
  - FLUID35-MODEL-COMPARISON
past_exam_alignment: []
integrated_exam_problems: []
exercise_counts: { level_a: 5, level_b: 4, level_c: 1, level_d: 0 }
estimated_hours: { reading: 8, exercises: 9, review: 5 }
