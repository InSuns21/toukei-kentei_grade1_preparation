  <title id="diagram-title">Joukowski写像による円と尖点を持つ翼型状輪郭の対応</title>
  <desc id="diagram-desc">左はz平面で中心が負の実軸にある半径1.2の円、右はJ(z)=z+1/zで写した上下面のある閉曲線。左の円の右端z=1が、右の輪郭の尖点w=2に対応する。c=1、d=0.2。両パネルは同じ座標尺度。</desc>
