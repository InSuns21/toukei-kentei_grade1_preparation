<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" data-layout-lint="strict" role="img" aria-labelledby="svg-fluid8-title svg-fluid8-desc">
  <title id="svg-fluid8-title">非平行な密度勾配と圧力勾配による傾圧性渦度の生成</title>
  <desc id="svg-fluid8-desc">右向きの密度勾配と上向きの圧力勾配が一点で直交する。両者の外積は右手系の正のz方向、すなわち観察者へ向かう紙面手前方向を指す。中心の二重円の点印は紙面手前を表す。</desc>
  <defs>
    <marker id="fluid8-arrow-solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d567e"/>
    </marker>
    <marker id="fluid8-arrow-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#945322" stroke-width="1.7"/>
    </marker>
  </defs>
  <rect x="30" y="25" width="540" height="276" rx="12" fill="#f7f9fb" stroke="#cdd8df"/>
  <path d="M 215 264 L 215 85 M 165 224 L 440 224" fill="none" stroke="#b4bdc7" stroke-width="1.5" stroke-dasharray="5 6"/>
  <line x1="238" y1="224" x2="422" y2="224" stroke="#1d567e" stroke-width="5" data-series-group="gradients" data-series-label="density" marker-end="url(#fluid8-arrow-solid)"/>
  <line x1="215" y1="202" x2="215" y2="87" stroke="#945322" stroke-width="3" stroke-dasharray="9 5" data-series-group="gradients" data-series-label="pressure" marker-end="url(#fluid8-arrow-open)"/>
  <circle cx="215" cy="224" r="15" fill="white" stroke="#2c353b" stroke-width="2.5"/>
  <circle cx="215" cy="224" r="4.4" fill="#2c353b"/>
  <text x="438" y="253" font-size="22" font-family="sans-serif" fill="#1d567e">∇ρ</text>
  <text x="238" y="82" font-size="22" font-family="sans-serif" fill="#945322">∇p</text>
  <text x="93" y="246" font-size="19" font-family="sans-serif" fill="#2c353b">+z</text>
  <text x="89" y="271" font-size="17" font-family="sans-serif" fill="#2c353b">⊙</text>
  <text x="278" y="289" font-size="17" font-family="sans-serif" fill="#303d47">∇ρ × ∇p</text>
</svg>