<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" data-layout-lint="strict" role="img" aria-labelledby="title desc">
<title id="title">循環なし円柱ポテンシャル流の流線</title>
<desc id="desc">左から右へ向かう一様流が円柱を迂回する。円柱中心は図の中央、半径は70画素である。流線は流れ関数 psi=U(r-a²/r)sin(theta) の一定値を正確に標本化したもの。円の左端と右端に黒い点でよどみ点を示す。線は円の内部へ侵入しない。</desc>
<defs>
  <marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 1 L 9 5 L 0 9 Z" fill="#285c87"/></marker>
</defs>
