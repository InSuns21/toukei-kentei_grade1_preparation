id: "AMECH8"
title: "Hamilton--Jacobi 理論"
volume: "foundations"
status: supplementary
prerequisites:
  - AMECH7
  - MECH6
official_scope: []
learning_objectives:
  - 第2種母関数で新 Hamiltonian K=0 を要求し Hamilton--Jacobi 方程式を導ける
  - Hamilton の主関数を古典軌道上の作用として定義し S_q=p および S_t=-H を端点変分から証明できる
  - 完全積分の混合 Hessian 非退化条件を説明し定数 alpha,beta から元の Hamilton 軌道を局所的に再構成できる
  - 自律系で S=W-Et と分離し Hamilton の特性関数 H(q,W_q)=E を導ける
  - 1自由度の自然な Hamiltonian を特性関数の求積へ落とし時間積分を再現できる
  - 調和振動子で W_E から位相を回収できる
  - 平面中心力で S=W_r+ell theta-Et と分離し時間積分と軌道積分を導ける
  - Kepler 問題で Hamilton--Jacobi 分離から円錐曲線軌道を再導出できる
  - PDE12 の一般 Hamilton--Jacobi 理論との責務分担を説明できる
  - 幾何光学と WKB 半古典近似への接続を Hamilton--Jacobi 構造から説明できる
definitions:
  - { id: AMECH8-DEF-01, name: "Hamilton の主関数" }
