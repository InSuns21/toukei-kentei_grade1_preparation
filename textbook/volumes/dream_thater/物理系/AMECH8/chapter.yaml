  - { id: AMECH8-THM-03, name: "完全積分からの運動再構成" }
  - { id: AMECH8-PROP-01, name: "1自由度 Hamilton--Jacobi 法の求積" }
  - { id: AMECH8-PROP-02, name: "中心力 Hamilton--Jacobi 方程式の分離" }
canonical_examples:
  - "自由粒子の端点作用 S=m(q-q0)^2/[2(t-t0)] から p=S_q と S_t=-H を確認する例"
  - "自由粒子の完全積分 S=alpha q-alpha^2 t/(2m) から q(t),p(t) を回収する例"
  - "1自由度の自然な Hamiltonian を W(q,E) の求積へ落とす例"
  - "調和振動子で W_E から位相 theta=omega(t-t0) を回収する例"
  - "中心力で W_r と ell theta に分離して時間積分と軌道積分を得る例"
  - "Kepler potential で Hamilton--Jacobi 分離から円錐曲線軌道を再導出する例"
