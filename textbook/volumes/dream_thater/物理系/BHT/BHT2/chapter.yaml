  - BHT2-DEC-FLUX-CAUSALITY
  - BHT2-RICCI-TRANSVERSE-CANCELLATION
  - BHT2-VARIABLE-KAPPA-COUNTEREXAMPLE
  - BHT2-AFFINE-PARAMETER
  - BHT2-ZEROTH-LAW-SYNTHESIS
