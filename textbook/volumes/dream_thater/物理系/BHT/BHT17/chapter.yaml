id: "BHT17"
title: "電荷・回転とアンサンブル選択"
volume: "foundations"
status: supplementary
prerequisites:
  - BHT16
  - BHT10
  - BHT13
official_scope: []
learning_objectives:
  - 温度・電磁電位・角速度の境界データと固定Q・固定Φ・固定J・固定ΩのLegendre変換を、変分原理と第一法則から区別できる
  - 非極限Reissner–Nordströmの質量関数と共役量を用いて固定Q熱容量・固定Φ熱容量を導き、符号が変わる領域を説明できる
  - 二変数の縮約Euclid作用のHessianを計算し、固定Q方向の局所極小が固定Φ系の安定性を保証しない理由を示せる
  - Kerrの回転仕事項と固定J・固定Ωの境界条件の違いを説明し、非回転極限で縮約作用の曲率を検算できる
  - 無限遠の回転浴・超放射・反射壁・AdS境界で平衡サドルの存在と局所安定性を区別できる
definitions:
  - { id: BHT17-DEF-01, name: "電荷・回転を含む熱力学アンサンブル" }
  - { id: BHT17-DEF-02, name: "RNの縮約作用と局所Hessian" }
theorems:
  - { id: BHT17-PROP-01, name: "アンサンブルのLegendre微分" }
  - { id: BHT17-THM-01, name: "RNの固定電荷・固定電位熱容量" }
  - { id: BHT17-THM-02, name: "RNの電位固定Hessianの不定性" }
  - { id: BHT17-PROP-02, name: "Kerrの回転ポテンシャルと回転浴の条件" }
canonical_examples:
  - 固定電位と固定電荷を切り替えた境界変分の相殺を確かめる
  - 非極限RNでr=2、Q=sqrt(2)の固定Q正熱容量と固定Φ負熱容量を比較する
  - RNの質量Hessian行列式を展開して負符号を直接検算する
  - KerrのJ=0でM(S,J)の二階微分とSchwarzschild熱容量を照合する
  - AdS境界の回転Killing場が時間的であるための条件を計算する
problem_patterns:
  - BHT17-BOUNDARY-LEGENDRE
  - BHT17-RN-MASS-STATE
  - BHT17-FIXED-Q-HEAT-CAPACITY
  - BHT17-FIXED-PHI-HEAT-CAPACITY
  - BHT17-RN-POTENTIALS
  - BHT17-RN-HESSIAN
  - BHT17-ENSEMBLE-DIRECTION
  - BHT17-KERR-J-OMEGA
  - BHT17-ROTATING-BOUNDARY
  - BHT17-INTEGRATED-STABILITY
