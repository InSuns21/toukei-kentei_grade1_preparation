id: "BHT15"
title: "負熱容量と有限空洞"
volume: "foundations"
status: supplementary
prerequisites:
  - BHT14
official_scope: []
learning_objectives:
  - 漸近平坦Schwarzschildの熱容量を温度微分から求め、負熱容量が固定温度の正準平衡と両立しない理由を説明できる
  - 有限空洞の境界半径と固有温度を固定し、Tolman赤方偏移・準局所エネルギー・面積エントロピーから壁の第一法則を導ける
  - 壁温度の極小値と二つのSchwarzschild枝の存在範囲を導き、各枝の熱容量と縮約作用の局所安定性を計算できる
  - 平坦背景との相対作用で局所安定性と古典サドルの大域的指数比較を区別できる
  - 固定エネルギーの微正準条件と固定温度の正準条件を区別し、熱容量の符号だけから全重力モードの安定性を断言しない
definitions:
  - { id: BHT15-DEF-01, name: "境界を指定した熱容量" }
  - { id: BHT15-DEF-02, name: "有限空洞の正準・微正準熱力学" }
theorems:
  - { id: BHT15-PROP-01, name: "Schwarzschildの無限遠熱容量" }
  - { id: BHT15-THM-01, name: "有限空洞の壁第一法則と熱容量" }
  - { id: BHT15-THM-02, name: "有限空洞の二分岐と局所安定性" }
  - { id: BHT15-PROP-02, name: "有限空洞の古典サドル比較" }
  - { id: BHT15-PROP-03, name: "微正準曲率と正準エネルギー変動" }
canonical_examples:
  - 固定GでMを変化させた無限遠SchwarzschildのCを負と判定する
  - R=4GMの壁でE_R,T_R,C_Rを導き、R=5GM/2の壁で正符号を検算する
  - 固定Rのx=sqrt(1-2GM/R)を使い壁温度の極小と二つの質量枝を確認する
  - x=1/3で平坦参照背景との作用差が零となる温度を求める
  - 小枝の微正準エントロピー曲率が正でもエネルギー固定と矛盾しないことを確認する
problem_patterns:
  - BHT15-INFINITY-HEAT-CAPACITY
  - BHT15-REDSHIFT-TEMPERATURE
  - BHT15-WALL-ENERGY-FIRST-LAW
  - BHT15-HEAT-CAPACITY-SIGN
  - BHT15-WALL-TEMPERATURE-EXTREMUM
  - BHT15-TWO-BRANCHES-AND-HESSIAN
  - BHT15-BOUNDARY-PRESSURE
  - BHT15-FLAT-SADDLE-AND-CROSSING
  - BHT15-MICROCANONICAL-CURVATURE
  - BHT15-INTEGRATED-ENSEMBLE-ANALYSIS
