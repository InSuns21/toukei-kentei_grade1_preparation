chapter: CA7
scope: dream-theater
coverage: complete
prerequisites:
  - CA6
  - TOP5

concepts:
  - id: complex-analysis.locally-uniform-convergence
    name: 局所一様収束
    kind: definition
    aliases: [局所一様収束, コンパクト集合上一様収束, locally uniform convergence, compact convergence]
    introduction: formal
    introduction_aliases: ["定義（局所一様収束）"]
    requires: [topology.compact-space, analysis.uniform-convergence]

  - id: complex-analysis.holomorphic-locally-uniform-limit
    name: 正則関数列の局所一様極限
    kind: theorem
    aliases: [正則関数列の局所一様極限, holomorphic locally uniform limit theorem]
    introduction: formal
    introduction_aliases: ["定理（正則関数列の局所一様極限）"]
    requires: [complex-analysis.locally-uniform-convergence, complex-analysis.cauchy-integral-formula]

  - id: complex-analysis.derivative-local-uniform-convergence
    name: 導関数列の局所一様収束
    kind: corollary
    aliases: [導関数列の局所一様収束, local uniform convergence of derivatives]
    introduction: formal
    introduction_aliases: ["系（導関数列の局所一様収束）"]
    requires: [complex-analysis.holomorphic-locally-uniform-limit, complex-analysis.cauchy-differentiation-formula]

  - id: complex-analysis.normal-convergence
    name: 正規収束
    kind: definition
    aliases: [正規収束, normal convergence]
    introduction: formal
    introduction_aliases: ["定義（正規収束）"]
    requires: [complex-analysis.locally-uniform-convergence]

  - id: complex-analysis.normal-series-termwise-differentiation
    name: 正規収束する正則関数級数と微分の交換
    kind: corollary
    aliases: [正規収束する正則関数級数と微分の交換, differentiation of normally convergent holomorphic series]
    introduction: formal
    introduction_aliases: ["系（正規収束する正則関数級数と微分の交換）"]
    requires: [complex-analysis.normal-convergence, complex-analysis.derivative-local-uniform-convergence]

  - id: complex-analysis.locally-bounded-holomorphic-family
    name: 局所有界な正則関数族
    kind: definition
    aliases: [局所有界な正則関数族, locally bounded holomorphic family]
    introduction: formal
    introduction_aliases: ["定義（局所有界な正則関数族）"]
    requires: [complex-analysis.holomorphic-function]

  - id: complex-analysis.normal-family
    name: 正規族
    kind: definition
    aliases: [正規族, normal family]
    introduction: formal
    introduction_aliases: ["定義（正規族）"]
    requires: [complex-analysis.locally-uniform-convergence]

  - id: complex-analysis.cauchy-family-continuity
    name: Cauchy 評価による族共通連続性評価
    kind: lemma
    aliases: [Cauchy 評価による族共通連続性評価, Cauchy family continuity estimate]
    introduction: formal
    introduction_aliases: ["補題（Cauchy 評価による族共通連続性評価）"]
    requires: [complex-analysis.locally-bounded-holomorphic-family, complex-analysis.cauchy-estimate]

  - id: complex-analysis.compact-subsequence-extraction
    name: コンパクト集合上の部分列抽出
    kind: lemma
    aliases: [コンパクト集合上の部分列抽出, compact subsequence extraction]
    introduction: formal
    introduction_aliases: ["補題（コンパクト集合上の部分列抽出）"]
    requires: [complex-analysis.cauchy-family-continuity, topology.compact-space]

  - id: complex-analysis.montel-theorem
    name: Montel の定理
    kind: theorem
    aliases: [Montel の定理, Montel theorem]
    introduction: formal
    introduction_aliases: ["定理（Montel の定理）"]
    requires: [complex-analysis.normal-family, complex-analysis.compact-subsequence-extraction, complex-analysis.holomorphic-locally-uniform-limit]

  - id: complex-analysis.hurwitz-theorem
    name: Hurwitz の定理
    kind: theorem
    aliases: [Hurwitz の定理, Hurwitz theorem]
    introduction: formal
    introduction_aliases: ["定理（Hurwitz の定理）"]
    requires: [complex-analysis.holomorphic-locally-uniform-limit, complex-analysis.rouche-theorem]

  - id: complex-analysis.injective-limit-theorem
    name: 単射正則関数列の非定数極限
    kind: corollary
    aliases: [単射正則関数列の非定数極限, injective holomorphic limit theorem]
    introduction: formal
    introduction_aliases: ["系（単射正則関数列の非定数極限）"]
    requires: [complex-analysis.hurwitz-theorem]

  - id: complex-analysis.holomorphic-square-root
    name: 零点を持たない正則関数の正則平方根
    kind: lemma
    aliases: [零点を持たない正則関数の正則平方根, holomorphic square root]
    introduction: formal
    introduction_aliases: ["補題（零点を持たない正則関数の正則平方根）"]
    requires: [complex-analysis.cauchy-simply-connected, complex-analysis.local-primitive]

  - id: complex-analysis.riemann-map-class-nonempty
    name: Riemann 写像候補族の非空性
    kind: lemma
    aliases: [Riemann 写像候補族の非空性, nonemptiness of the Riemann mapping extremal family]
    introduction: formal
    introduction_aliases: ["補題（Riemann 写像候補族の非空性）"]
    requires: [complex-analysis.holomorphic-square-root, complex-analysis.standard-disk-automorphism]

  - id: complex-analysis.riemann-mapping-theorem
    name: Riemann 写像定理
    kind: theorem
    aliases: [Riemann 写像定理, Riemann mapping theorem]
    introduction: formal
    introduction_aliases: ["定理（Riemann 写像定理）"]
    requires: [complex-analysis.riemann-map-class-nonempty, complex-analysis.montel-theorem, complex-analysis.injective-limit-theorem, complex-analysis.holomorphic-square-root, complex-analysis.cauchy-estimate, complex-analysis.maximum-modulus-principle, complex-analysis.rouche-theorem, complex-analysis.open-mapping-theorem, complex-analysis.schwarz-lemma]

  - id: complex-analysis.normalized-riemann-map-uniqueness
    name: 正規化 Riemann 写像の一意性
    kind: corollary
    aliases: [正規化 Riemann 写像の一意性, uniqueness of normalized Riemann map]
    introduction: formal
    introduction_aliases: ["系（正規化 Riemann 写像の一意性）"]
    requires: [complex-analysis.riemann-mapping-theorem, complex-analysis.disk-automorphism-classification]

  - id: complex-analysis.morera-theorem
    name: Morera の定理
    kind: lemma
    aliases: [Morera の定理, Morera theorem]
    introduction: formal
    introduction_aliases: ["補題（Morera の定理）"]
    requires: [complex-analysis.complex-line-integral, complex-analysis.cauchy-goursat-triangle, complex-analysis.cauchy-differentiation-formula]

  - id: complex-analysis.schwarz-reflection-principle
    name: Schwarz の鏡像原理
    kind: theorem
    aliases: [Schwarz の鏡像原理, Schwarz reflection principle]
    introduction: formal
    introduction_aliases: ["定理（Schwarz の鏡像原理）"]
    requires: [complex-analysis.morera-theorem, complex-analysis.holomorphic-function]
