id: "MICA3"
title: "波面集合の定義と基本性質"
volume: "foundations"
status: supplementary
prerequisites:
  - MICA2
official_scope: []
learning_objectives:
  - 方向別Fourier規則性の補集合として波面集合を定義し、Dirac分布の波面集合を量化順序から計算できる
  - 波面集合の相対閉性と正の錐性を証明し、零方向を含めない理由を説明できる
  - 特異支持を定義して波面集合の位置射影との一致と空な波面集合の滑らかさ同値を証明できる
  - 局所性と和の包含をcutoffの共通化で導ける
  - 滑らかな係数との積による非増大と係数非零点での等号を証明し、零点での相殺を計算できる
  - 微分による波面集合の非増大をcutoffの微分項まで評価し、有限階の滑らかな係数微分作用素へ拡張できる
