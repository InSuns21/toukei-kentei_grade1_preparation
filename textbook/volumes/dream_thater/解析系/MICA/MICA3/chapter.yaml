  - { id: MICA3-PROP-02, name: 和の波面集合の包含 }
  - { id: MICA3-THM-02, name: 滑らかな係数との積 }
  - { id: MICA3-THM-03, name: 微分による波面集合の非増大 }
  - { id: MICA3-COR-01, name: 滑らかな係数の微分作用素 }
canonical_examples:
  - 点デルタの波面集合と滑らかな定数分布との対比
  - 特異支持と通常の台の違い
  - 滑らかな係数の零点でxデルタが消える例
  - 直線デルタの方向と接線方向の微分による消滅
