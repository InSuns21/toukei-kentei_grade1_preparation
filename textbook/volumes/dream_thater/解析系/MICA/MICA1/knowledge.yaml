    name: 超関数の局所化と局所Fourier変換
    kind: definition
    introduction: formal
    requires: [distribution.schwartz-distribution, distribution.test-function, fourier.fou3-fourier-transform]
  - id: microlocal.mica1-polynomial-growth
    name: コンパクト支持超関数のFourier変換の多項式増大
    kind: proposition
