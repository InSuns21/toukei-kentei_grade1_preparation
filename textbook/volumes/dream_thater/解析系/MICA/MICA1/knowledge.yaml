    name: 超関数微分のFourier表示
    kind: proposition
    introduction: formal
    requires: [microlocal.mica1-local-fourier, distribution.distributional-derivative]
  - id: microlocal.mica1-rapid-decay
    name: Fourier変換の急減少
    kind: definition
