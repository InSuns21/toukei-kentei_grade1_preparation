id: "MICA10"
title: "特異性の伝播"
volume: "foundations"
status: supplementary
prerequisites:
  - MICA9
  - MICA8
  - MICA5
  - MICA3
  - GPDE3
official_scope: []
learning_objectives:
  - 平坦波動方程式の分布解を光的座標で求め、波面とHamilton流の一致を検算できる
  - 実主型の伝播定理の対象、滑らかな右辺、双特性曲線に沿う不変性の射程を述べられる
  - Sobolev波面集合の方向別正則性と通常の波面集合との関係を説明できる
  - 擬微分作用素の交換子の主シンボルがHamilton微分になることを合成公式から導ける
  - 正交換子のescape functionと低階剰余のSobolev制御を再現できる
  - 一階への還元、半階ずつの反復、逆向きの流れから伝播を組み立てられる
  - Klein–Gordon作用素の光的伝播と特異な右辺による発生を区別できる
