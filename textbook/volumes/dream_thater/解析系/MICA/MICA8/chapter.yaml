  - { id: MICA8-LEM-02, name: 記号の漸近和 }
  - { id: MICA8-THM-01, name: 楕円方向のmicrolocal parametrix }
  - { id: MICA8-LEM-03, name: 周波数局所化と波面 }
  - { id: MICA8-THM-02, name: 擬微分作用素の擬局所性 }
  - { id: MICA8-THM-03, name: スカラー擬微分作用素の楕円正則性 }
canonical_examples:
  - 1+D_x²とその逆Fourier乗数の記号評価
  - D_xとxの乗算の非可換補正
  - D_yの非楕円周波数とHeaviside分布の消失
  - 1-∂_x²の基本解の微分の跳びと楕円正則性
