id: "MICA8"
title: "擬微分作用素と主シンボル"
volume: "foundations"
status: supplementary
prerequisites:
  - MICA7
official_scope: []
learning_objectives:
  - 微分作用素のFourier表示から全記号・主シンボルを導き、D=-i∂の符号規約で検算できる
  - symbol class S^m_{1,0} と古典記号を定義し、直接例の全微分評価を確認できる
  - 擬微分作用素の量子化と適切な支持・対角線外での核の滑らかさを説明できる
  - 合成記号のTaylor展開と低次補正を導き、主シンボルの積法則を検証できる
  - 楕円錐上で漸近和を使ったmicrolocal parametrixを構成できる
  - 擬局所性と楕円正則性の二方向の波面包含を証明し、非楕円方向の反例と区別できる
definitions:
  - { id: MICA8-DEF-00, name: 微分作用素の全記号 }
  - { id: MICA8-DEF-01, name: 記号クラス }
  - { id: MICA8-DEF-02, name: 古典記号と主シンボル }
  - { id: MICA8-DEF-03, name: Kohn–Nirenberg量子化・擬微分作用素 }
  - { id: MICA8-DEF-04, name: 楕円集合と非楕円方向 }
theorems:
