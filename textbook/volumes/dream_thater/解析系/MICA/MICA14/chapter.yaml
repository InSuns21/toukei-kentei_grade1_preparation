  - { id: MICA14-PROP-05, name: 滑らかな余りへの微分と対角制限 }
canonical_examples:
  - 対角余法束と正の零二点波面方向の交差
  - 質量零Minkowski真空の空間的な点分離発散
  - 滑らかな定数双解の加算によるWick平方期待値差
  - 曲率を含むv_0の対角値と尺度変更
