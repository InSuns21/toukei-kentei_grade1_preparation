id: "MICA14"
title: "対角制限とHadamard subtraction"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00P2A
  - MICA13
  - MICA12
  - MICA11
  - MICA7
  - MICA3
official_scope: []
learning_objectives:
  - 対角埋め込みの余法束とHadamard二点分布の波面集合との交差を再導出し、引き戻し定理の不適用と制限の絶対的不可能を区別できる
  - 正周波数Minkowski二点分布の空間的な点分離で発散を計算できる
  - 同じ作用素と交換子を持つ二つのHadamard二点分布の滑らかな差を用いて、対角への引き戻しと状態間のWick平方期待値差を証明できる
  - 全次数の局所Hadamard式を用いたsubtractionと有限次切断の違い、局所規約の選択を説明できる
  - 尺度変更のWick平方への寄与をv_0の対角値から求め、状態差の不変性と局所幾何学的有限項の自由度を区別できる
  - 微分後の点分離で必要な滑らかさと、応力テンソルの保存性が別の問題である理由を説明できる
definitions:
  - { id: MICA14-DEF-01, name: Hadamard subtraction後の対角余り }
