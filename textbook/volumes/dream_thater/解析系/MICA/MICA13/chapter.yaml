  - { id: MICA13-PROP-02, name: 交換子条件と片側包含から波面集合の等号 }
  - { id: MICA13-PROP-03, name: Hadamard二点分布の差の滑らかさ }
  - { id: MICA13-THM-01, name: RadzikowskiのHadamard同値定理 }
canonical_examples:
  - 平坦時空での余接平行移動と未来向き光的共変ベクトル
  - 質量零Minkowski真空の片側境界値と共変ベクトル方向
  - 転置した二点分布と負周波数の判定
  - 滑らかな双解の階数一変更
