id: "MICA13"
title: "Radzikowskiの波面集合条件"
volume: "foundations"
status: supplementary
prerequisites:
  - MICA12
  - MICA11
  - MICA10
  - MICA9
  - MICA7
  - F0-00E2
official_scope: []
learning_objectives:
  - 零測地線の余接平行移動と未来向き光的余接ベクトルから二点波面関係を定義し、第二変数の負符号を検算できる
  - Minkowski真空の位相と質量零境界値から二点波面集合の向きと非対角での特異性を判定できる
  - 双解性・CCR・正値性・Hadamard波面条件の論理的役割を区別できる
  - WFの片側包含と交換子関係から等号を導く証明を再構成できる
  - 二つのHadamard二点分布の差が滑らかになることを波面集合と転置対称性から証明できる
  - 局所Hadamard形と波面集合条件の同値について伝播・局所大域定理・参照状態の使用箇所と仮定を説明できる
definitions:
  - { id: MICA13-DEF-01, name: 二点の未来向き零測地線関係 }
  - { id: MICA13-DEF-02, name: Hadamard波面集合条件 }
theorems:
