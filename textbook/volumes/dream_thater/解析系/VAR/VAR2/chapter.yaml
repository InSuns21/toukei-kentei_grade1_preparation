id: "VAR2"
title: "第二変分と最小性"
volume: "foundations"
status: supplementary
prerequisites:
  - VAR1
  - AMECH3
  - OPT1
official_scope: []
learning_objectives:
  - 第二変分を対称双線形形式と二次形式として出発点から導出できる
  - 比較位相を明示して最小性の必要条件と強制評価による十分条件を証明できる
  - Legendre必要条件を局在高周波方向で証明し強化条件だけでは十分でない例を判定できる
  - Wirtinger不等式を証明してSturm型二次汎関数の閾値と退化を解析できる
  - 二次形式の変分からJacobi方程式を導き零方向と共役点の入口を説明できる
definitions:
  - { id: VAR2-DEF-01, name: "第二変分" }
  - { id: VAR2-DEF-02, name: "C1位相での局所最小点" }
  - { id: VAR2-DEF-03, name: "Jacobi方程式と零方向" }
  - { id: VAR2-DEF-04, name: "強められたLegendre条件" }
theorems:
  - { id: VAR2-PROP-01, name: "第二変分の二次形式" }
  - { id: VAR2-THM-01, name: "局所最小性の第一・第二必要条件" }
  - { id: VAR2-THM-02, name: "二次形式の強制評価による局所最小性" }
  - { id: VAR2-THM-03, name: "Legendreの必要条件" }
  - { id: VAR2-PROP-02, name: "Legendre条件と下界の組合せ" }
  - { id: VAR2-LEM-01, name: "固定端の鋭いWirtinger不等式" }
  - { id: VAR2-THM-04, name: "Sturm型二次汎関数の最小性閾値" }
  - { id: VAR2-PROP-03, name: "二次形式の停留方程式" }
canonical_examples: [二次エネルギーの第二変分, Legendre正でも不安定な二次模型, 退化する四次エネルギー, Sturm型最小性閾値, Jacobi初期値解]
problem_patterns: [VAR2-QUADRATIC, VAR2-NECESSITY, VAR2-LEGENDRE, VAR2-COERCIVITY, VAR2-WIRTINGER, VAR2-STURM, VAR2-JACOBI, VAR2-DEGENERACY]
