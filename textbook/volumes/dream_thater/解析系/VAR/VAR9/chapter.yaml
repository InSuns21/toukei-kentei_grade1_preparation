id: "VAR9"
title: "H¹弱収束と最小化の直接法"
volume: "foundations"
status: supplementary
prerequisites:
  - VAR8
  - VAR2
  - GPDE3
  - GPDE4
  - GPDE5
official_scope: []
learning_objectives:
  - 区間上の固定端点・周期・平均零のH1許容集合を区別し、トレースと平均汎関数から弱逐次閉性を示せる
  - H1有界列の一様収束部分列を一次元の微分積分と対角抽出から証明し、強いH1収束との違いを説明できる
  - 強制性と弱逐次下半連続性を定義・反例で区別し、直接法の全手順を証明できる
  - 固定端点二次エネルギーについてPoincaré評価・弱下半連続性・厳密凸性により存在と一意性を示せる
  - 平均零拘束のPoincaré評価を導き、周期条件のみでは定数方向に強制性を失うことを計算できる
  - 非凸な連続位置ポテンシャルを含む一次元のエネルギーで一様コンパクト性を用いた存在証明を行える
