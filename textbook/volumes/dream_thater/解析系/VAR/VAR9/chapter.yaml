  - { id: VAR9-THM-01, name: "Hilbert空間上の最小化の直接法" }
  - { id: VAR9-THM-02, name: "固定端点二次エネルギーの存在と一意性" }
  - { id: VAR9-PROP-03, name: "平均零の一次元Poincaré評価" }
  - { id: VAR9-PROP-04, name: "周期問題での強制性の成否" }
  - { id: VAR9-THM-03, name: "連続ポテンシャルを含む一次元直接法" }
