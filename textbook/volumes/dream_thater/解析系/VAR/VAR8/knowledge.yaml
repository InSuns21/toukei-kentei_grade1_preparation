  - id: calculus-of-variations.minimal-surface-jacobi-operator
    name: 極小曲面のJacobi作用素とJacobi関数
    kind: definition
    introduction: formal
    introduction_aliases: ["定義（極小曲面の Jacobi 作用素と Jacobi 関数）"]
    requires: [calculus-of-variations.minimal-surface-second-variation]
  - id: calculus-of-variations.minimal-surface-jacobi-linearization
    name: 平均曲率の線形化と第二変分の弱形式
