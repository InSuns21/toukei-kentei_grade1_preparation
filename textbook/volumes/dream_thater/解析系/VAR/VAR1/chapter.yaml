id: "VAR1"
title: "汎関数・第一変分・Euler–Lagrange方程式"
volume: "foundations"
status: supplementary
prerequisites:
  - AMECH3
official_scope: []
learning_objectives:
  - 固定端・自由端の許容クラスと許容方向を区別し、変分が拘束を保つ条件を検証できる
  - 第一変分の連鎖律と部分積分を計算し内部方程式と端点項を分離できる
  - 自然境界条件の必要十分性を端点方向の独立性から証明できる
  - 区分的滑らかな曲線の運動量接合条件を導き固定角点・移動角点を区別できる
  - Weierstrass–Erdmannの二つの接合条件を移動端の積分微分から導ける
  - 等周拘束の正則性を検査し制約を保つ変分とLagrange乗数の導出を証明できる
  - 最短グラフと懸垂線の第一積分を中間計算から導出できる
  - 停留性と大域最小性を別々に検証し第二変分・直接法が必要になる理由を説明できる
