  - { id: VAR1-THM-04, name: "正則な等周拘束のLagrange乗数" }
canonical_examples: [片端自由の二次汎関数, 媒質不連続な固定接合, 最短グラフの大域最小性, 懸垂線, 正則性を欠く等周拘束]
