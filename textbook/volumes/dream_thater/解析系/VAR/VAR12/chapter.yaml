official_scope: []
learning_objectives:
  - Morse指数と零化次数を負定値部分空間と双線形形式の核から定義し等方方向と区別できる
  - H0^1上の第二変分形式とL2上のSturm微分作用素の定義域を区別できる
  - 固定端点Sturm作用素の自己共役性とコンパクトなシフト逆作用素を証明できる
  - 正弦関数による負方向構成と分割Wirtinger評価の両側からMorse指数と零化次数を算出できる
  - 定曲率測地線で内部共役点と終点共役が指数・零化次数へ寄与する違いを証明できる
  - 等式制約下のLagrangian Hessianを接空間上で導き制約ありとなしの指数を区別できる
  - 固定端点作用の指数と時間発展の安定性・Floquet乗数を混同せず反例で示せる
