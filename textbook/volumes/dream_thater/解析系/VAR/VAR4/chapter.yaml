id: "VAR4"
title: "Riemann多様体上の測地線"
volume: "foundations"
status: supplementary
prerequisites:
  - VAR1
  - VAR2
  - VAR3
  - GEO12
  - GEO13
  - GEO14
  - GEO17
  - AMECH3
official_scope: []
learning_objectives:
  - Riemann計量から長さ・エネルギーと計量Lagrangianを構成し一定速の等号条件を検査できる
  - 計量Lagrangianの各偏微分からChristoffel係数を作りEuler–Lagrange方程式と測地線を対応させられる
  - Euclid極座標と球面の計量から測地線方程式を計算し直線・大円・非測地線を区別できる
  - 非アフィン再パラメータ化に対する長さとエネルギーの停留性の違いを証明できる
  - Gaussの補題に基づく局所最短性の適用範囲と大域最短性の失敗を具体例で説明できる
  - 運動エネルギーとポテンシャルの変分から力のない粒子と測地線の一致条件を示せる
definitions:
  - { id: VAR4-DEF-01, name: "計量の運動エネルギーLagrangian" }
theorems:
  - { id: VAR4-PROP-01, name: "計量Lagrangianと測地線方程式" }
  - { id: VAR4-PROP-02, name: "再パラメータ化と二種類の停留性" }
