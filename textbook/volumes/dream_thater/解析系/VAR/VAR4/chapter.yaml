problem_patterns: [VAR4-LENGTH-ENERGY, VAR4-DIAGONAL-METRIC, VAR4-SPHERE-EQUATOR, VAR4-FREE-PARTICLE, VAR4-POLAR-CONSERVATION, VAR4-FREE-END-ORTHOGONALITY, VAR4-NONAFFINE, VAR4-WARPED-METRIC]
