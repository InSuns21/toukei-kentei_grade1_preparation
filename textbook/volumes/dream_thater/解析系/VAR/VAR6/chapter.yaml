id: "VAR6"
title: "最短測地線と存在"
volume: "foundations"
status: supplementary
prerequisites:
  - VAR4
  - VAR5
  - GEO15
official_scope: []
learning_objectives:
  - 長さとエネルギーを区別し、エネルギーの下限と一定速最短測地線の対応を証明できる
  - 正規球の放射測地線と凸正規近傍内の二点間最短測地線の主張を区別できる
  - Hopf--Rinow の完備性仮定を確認して最短測地線とエネルギー最小曲線の存在を導ける
  - 穴あき平面で距離の下限が達成されない理由を迂回経路から計算できる
  - 球面の距離公式を導出し対蹠点・切断時刻・最短測地線の非一意性を判定できる
  - 平坦トーラスの距離を格子代表で計算し切断点集合を求められる
  - 曲率0でも切断点があり得ることを Jacobi 方程式と経路の競合から説明できる
  - 曲線空間の強収束と弱収束を区別し、幾何学的存在と直接法の違いを説明できる
definitions: []
theorems:
  - { id: VAR6-PROP-01, name: "単位時間エネルギーと距離の下限" }
  - { id: VAR6-PROP-02, name: "正規球と凸正規近傍での最短性" }
  - { id: VAR6-PROP-03, name: "完備な有限次元 Riemann 多様体でのエネルギー最小曲線の存在" }
  - { id: VAR6-PROP-04, name: "球面の距離と切断時刻" }
  - { id: VAR6-PROP-05, name: "平坦トーラスの距離と切断点集合" }
canonical_examples:
  - 同じ線分の異なる再パラメータ化
  - Euclid 円板の正規球
  - 穴あき Euclid 平面の迂回曲線
  - 半径 R の球面の対蹠点と大円
  - 平坦トーラスの格子最短代表と切断点
  - 高周波曲線での位置収束と導関数の非一様収束
