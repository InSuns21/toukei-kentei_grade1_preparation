  - { id: VAR7-THM-03, name: "極小曲面のグラフ方程式" }
  - { id: VAR7-PROP-02, name: "懸垂面は極小曲面" }
  - { id: VAR7-PROP-03, name: "螺旋面は極小曲面" }
canonical_examples:
  - 平面の法線変分と面積の一次変化
  - 球面の外向き変分での符号検査
  - 自由境界の平面円板
  - affineグラフと調和関数xy
  - 懸垂面の基本形式
  - 螺旋面の混合第二基本形式
  - Scherk型極小グラフ
