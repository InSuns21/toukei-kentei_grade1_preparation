id: "VAR7"
title: "曲面の面積の第一変分と極小曲面"
volume: "foundations"
status: supplementary
prerequisites:
  - VAR1
  - VAR3
  - GEO10
  - VC3
  - VC4
  - PDE1
official_scope: []
learning_objectives:
  - 曲面の変分場を接・法線成分に分け、面積の局所微分から内部平均曲率項と境界余法線項を証明できる
  - 形作用素の符号と法線の向きを球面で検算し、固定境界停留とH=0の同値性を証明できる
  - 支持面上の自由境界で必要となる直交条件を第一変分から導ける
  - グラフ面積の第一変分から発散形・非発散形の極小曲面方程式と境界流束を導出できる
  - 懸垂面と螺旋面の基本形式を計算し、全変分での停留を平均曲率ゼロから判定できる
  - $\Delta u=0$ と極小グラフの相違、停留と大域最小の相違を反例で説明できる
