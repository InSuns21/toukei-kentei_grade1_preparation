  - { id: VAR10-THM-02, name: "最小点の弱Euler–Lagrange必要条件" }
  - { id: VAR10-PROP-02, name: "運動量流束の絶対連続性" }
  - { id: VAR10-THM-03, name: "強い速度凸性の下での一次元正則性" }
  - { id: VAR10-PROP-03, name: "速度非凸な強制的汎関数の非達成例" }
canonical_examples:
  - 位置依存係数を持つ二次エネルギーのTonelli条件
  - sinh(t)/sinh(1)の弱・古典Euler–Lagrange方程式
  - 不連続材質の流束連続性と速度の跳び
  - 非凸速度の鋸歯状最小化列と非達成
