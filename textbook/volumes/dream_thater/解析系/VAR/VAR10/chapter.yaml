id: "VAR10"
title: "Tonelli型存在論・弱Euler–Lagrange方程式と正則性"
volume: "foundations"
status: supplementary
prerequisites:
  - VAR9
official_scope: []
learning_objectives:
  - 位置・速度に依存する積分汎関数の有限性と固定端点許容集合を正確に定められる
  - 速度凸性・二次成長・位置微分の成長条件を具体例で検査できる
  - 一次元の一様収束と速度の接線不等式から弱逐次下半連続性を完全証明できる
  - Tonelli型存在定理を強制性・弱閉性・弱下半連続性を区別して証明できる
  - 第一変分の微分積分交換を成長条件で正当化し弱Euler–Lagrange必要条件を導ける
  - 運動量流束の絶対連続性と強い速度凸性からC2正則性を示せる
  - 不連続材質の弱解と速度非凸な鋸歯列で古典正則性・最小値非達成の機構を説明できる
definitions:
  - { id: VAR10-DEF-01, name: "固定端点の積分汎関数" }
  - { id: VAR10-DEF-02, name: "一次元二次成長のTonelli型条件" }
  - { id: VAR10-DEF-03, name: "弱Euler–Lagrange方程式" }
theorems:
  - { id: VAR10-PROP-01, name: "速度凸な積分汎関数の弱逐次下半連続性" }
