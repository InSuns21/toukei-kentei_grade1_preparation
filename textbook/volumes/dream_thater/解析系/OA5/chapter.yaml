  - { id: OA5-THM-01, name: "正線形汎関数の Cauchy--Schwarz 不等式" }
  - { id: OA5-THM-02, name: "正線形汎関数のノルム" }
  - { id: OA5-PROP-01, name: "GNS 零空間は左イデアルである" }
  - { id: OA5-PROP-02, name: "GNS 商空間の内積" }
