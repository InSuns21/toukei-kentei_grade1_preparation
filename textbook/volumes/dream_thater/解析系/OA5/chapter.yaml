id: "OA5"
title: "正汎関数・状態・GNS 構成"
volume: "foundations"
status: supplementary
prerequisites:
  - OA4
  - OA3
  - LA5
official_scope: []
learning_objectives:
  - 正線形汎関数を平方 x*x に対する非負性で定義し、正元との関係を説明できる
  - 正線形汎関数が随伴を複素共役へ送り、Cauchy--Schwarz 型不等式を満たすことを証明できる
  - C*-ノルムから正線形汎関数の有界性とノルム公式 ||phi||=phi(1) を導ける
  - 状態を正規化された正線形汎関数として定義し、点評価・ベクトル状態・正規化トレースを検証できる
  - GNS 零空間 N_phi が線形部分空間かつ左イデアルであることを証明できる
  - A/N_phi 上の内積が well-defined であることを確認し、完備化 H_phi を構成できる
  - 左乗法が有界作用素へ降り、単位的 *-表現 pi_phi を与えることを証明できる
  - 巡回ベクトル Omega_phi=[1] から phi(a)=<pi_phi(a)Omega_phi,Omega_phi> を回収し、GNS 巡回表現の一意性を証明できる
definitions:
