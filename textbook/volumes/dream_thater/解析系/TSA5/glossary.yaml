chapter: "TSA5"
terms:
  - term: 測度保存シフト
    english: measure-preserving shift
    meaning: 標準経路空間上で時系列を一時点ずらし、その確率法則を不変に保つ写像。
  - term: 不変σ-加法族
    english: invariant sigma-field
    meaning: 時間シフトで変わらない事象を集めたσ-加法族。
  - term: エルゴード性
    english: ergodicity
    meaning: 不変事象が確率0または1しか持たず、時間方向に残る非自明なランダム成分がない性質。
  - term: 混合性
    english: mixing
    meaning: 十分離れた時間の事象間の依存が消え、同時確率が積へ近づく性質。
  - term: α-混合係数
    english: alpha-mixing coefficient
    meaning: 過去とn時点以上先の未来の事象間に残る依存を同時確率と積の差の上限で測る係数。
  - term: m-依存
    english: m-dependence
    meaning: m時点より大きく離れた過去と未来のσ-加法族が独立になる有限範囲依存。
  - term: 長期分散
    english: long-run variance
    meaning: 部分和の分散を標本サイズで割った極限に現れる自己共分散の総和。
  - term: 従属中心極限定理
    english: central limit theorem under dependence
    meaning: 依存を持つ定常列の標準化部分和が正規分布へ収束するための極限定理。
