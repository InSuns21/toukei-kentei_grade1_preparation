  - HA2-RIESZ-THORIN-STRIP
  - HA2-CONVOLUTION-INTERPOLATION
exercise_counts: { level_a: 5, level_b: 4, level_c: 1, level_d: 0 }
estimated_hours: { reading: 8, exercises: 5, review: 3 }
