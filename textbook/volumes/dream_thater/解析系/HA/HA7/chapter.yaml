id: "HA7"
title: "RieszポテンシャルとHardy–Littlewood–Sobolev不等式"
volume: "foundations"
status: supplementary
prerequisites:
  - HA1
  - HA2
  - HA5
  - MT7
official_scope: []
learning_objectives:
  - Rieszポテンシャルの核・局所積分可能性・スケーリングを確認できる
  - Hardy--Littlewood--Sobolevの指数関係と許容範囲を尺度から導ける
  - 近方の最大関数評価と遠方のHölder評価を証明して最適半径を選べる
  - HLSの1<p<d/alphaの強型Lp-Lq評価を再現できる
  - p=1の弱型端点と強型不成立を区別できる
  - 斉次Sobolev評価とNewtonポテンシャルの次元条件を説明できる
