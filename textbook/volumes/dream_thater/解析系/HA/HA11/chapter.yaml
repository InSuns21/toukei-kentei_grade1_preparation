  - { id: HA11-PROP-02, name: Knapp型の必要条件 }
  - { id: HA11-LEM-01, name: 解析接続と球面集中 }
  - { id: HA11-LEM-02, name: 解析族の端点評価 }
  - { id: HA11-THM-01, name: 球面のStein–Tomas型restriction・extension }
canonical_examples:
  - Fourier像が薄い球殻へ集中してもL2制限が連続でない例
  - Gauss関数の球面制限と定数振幅の拡張
  - capとtubeの位相差およびKnapp型必要指数
  - 解析族の球面集中・Bessel核の二端点
  - 半径変更による定数のscaling
  - 平坦超平面での非減衰
