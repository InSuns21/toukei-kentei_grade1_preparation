id: "HA11"
title: "Fourier restrictionとKakeyaへの入口"
volume: "foundations"
status: supplementary
prerequisites:
  - HA10
  - HA2
  - FOU3
  - MT7
official_scope: []
learning_objectives:
  - 球面上の点値制限が一般のL2同値類では定義できないことを例で示しrestrictionとextensionを定義できる
  - restrictionとextensionの双対性をFubiniとL^p双対から証明できる
  - 球面capと対応するtubeの尺度を求めKnapp型必要指数を導出できる
  - Gamma正規化した解析族の球面への集中とFourier逆変換の係数を導ける
  - 核のBessel級数・微分方程式・補間端点評価を証明できる
  - 複素補間とTT*から球面Stein–Tomas型評価を再構成できる
  - 球面半径のscalingと曲率ゼロの反例を検算できる
  - wave packetのcap/tube幾何とKakeya問題への接続を射程を混同せず説明できる
definitions:
  - { id: HA11-DEF-01, name: 球面へのFourier制限 }
  - { id: HA11-DEF-02, name: 球面Fourier拡張 }
  - { id: HA11-DEF-03, name: capと対応するtube }
  - { id: HA11-DEF-04, name: 球面集中型の解析族 }
theorems:
