id: "HA1"
title: "高次元最大作用素とLebesgue微分定理"
volume: "foundations"
status: supplementary
prerequisites:
  - MT4
  - MT7
  - FOU3
official_scope: []
learning_objectives:
  - 球と立方体の平均、中心付きと非中心Hardy--Littlewood最大作用素を定義し、具体例で評価できる
  - 有限球の3倍被覆補題を半径降順の貪欲選択から証明し、体積比を説明できる
  - 高次元最大作用素の弱(1,1)推定とL∞推定を、仮定・定数・可測性を含めて証明できる
  - L1稠密近似と超水準集合の評価から高次元Lebesgue微分定理を導き、局所可積分に拡張できる
  - 球・立方体による微分の一致、密度定理、コンパクト台近似恒等族の点ごと収束を導ける
  - 指示関数の遠方での減衰を積分し、最大作用素が強(1,1)有界でないことを示せる
definitions:
  - { id: HA1-DEF-01, name: 中心付きHardy--Littlewood最大作用素 }
  - { id: HA1-DEF-02, name: 非中心Hardy--Littlewood最大作用素 }
  - { id: HA1-DEF-03, name: Lebesgue点 }
theorems:
