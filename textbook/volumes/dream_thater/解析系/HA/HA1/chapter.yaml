  - { id: HA1-THM-02, name: 高次元Lebesgue微分定理 }
  - { id: HA1-PROP-02, name: 球と立方体による微分の一致 }
  - { id: HA1-COR-01, name: 高次元Lebesgue密度定理 }
  - { id: HA1-PROP-03, name: コンパクト台の近似恒等族 }
  - { id: HA1-PROP-04, name: 強い(1,1)評価の失敗 }
canonical_examples:
  - 単位球指示関数の原点最大値
  - 半径降順で選ぶ有限球の3倍被覆
  - 球と立方体の局所平均の比較
  - コンパクト台の平均核
  - 最大関数の遠方での対数発散
