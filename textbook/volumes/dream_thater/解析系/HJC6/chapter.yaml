id: "HJC6"
title: "確率微分ゲーム・二階 Isaacs 方程式"
volume: "foundations"
status: supplementary
prerequisites:
  - HJC4
  - HJC5
official_scope: []
learning_objectives:
  - 二人零和の controlled diffusion と期待 payoff を定式化し、確率制御と決定論的微分ゲームの両方との差を説明できる
  - stochastic nonanticipative strategy を定義し、相手 control と Brown noise の双方について未来を先読みしない条件を判定できる
  - lower / upper stochastic value を定式化し、strategy を持つ側の違いが局所的な sup-inf / inf-sup の順序へ現れることを説明できる
  - 二人制御 generator を Itô 公式から計算し、control-dependent diffusion が Hessian を含む二階項へ入ることを説明できる
  - stochastic DPP をランダムな中間状態と continuation strategy の貼り合わせから再構成できる
  - stochastic DPP の短時間展開から二階 lower / upper Isaacs equation を導出できる
  - lower / upper stochastic value が対応する二階 Isaacs equation の viscosity solution になる局所証明を追える
  - stochastic Isaacs condition を x, p, M 全体で検証し、決定論的 Isaacs condition との差を説明できる
  - Isaacs condition と二階 PDE の comparison principle を分離し、両者から game value の存在を導ける
  - 最悪外乱を第二プレイヤーとみなす robust-control viewpoint から局所 Hamiltonian と feedback candidates を計算できる
