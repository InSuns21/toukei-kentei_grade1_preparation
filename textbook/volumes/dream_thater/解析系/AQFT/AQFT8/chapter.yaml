id: "AQFT8"
title: "Minkowski真空とFock二点関数"
volume: "foundations"
status: supplementary
prerequisites:
  - AQFT7
  - AQFT5
  - AQFT3
  - QFT4
  - QFT5
  - OA5
official_scope: []
learning_objectives:
  - 自由Klein–Gordon解のCauchyデータから正周波数写像Kを構成し源商の代表に依存しないことを示せる
  - sigma=2Im(KF,KG)をCauchyデータのFourier表示から符号付きで再計算できる
  - 因果伝播子の正弦核からK[f]=i(2pi)^(-3/2)u_fを導いてQFT4の規格化と照合できる
  - Minkowski真空の二点形式とQFT5のWightman核の一致・Gram正値性・CCR反対称部を証明できる
  - Fock Weyl表現の指数ベクトル計算からWeyl積とGaussian真空期待値を導ける
  - Poincare不変性とFock多粒子スペクトルの前方光円錐包含および真空一意性を示せる
  - Weyl真空の巡回Fock表現とGNS表現の同値を確認し一般状態への無条件の拡張を避けられる
definitions:
  - { id: AQFT8-DEF-01, name: "Minkowski正周波数写像" }
