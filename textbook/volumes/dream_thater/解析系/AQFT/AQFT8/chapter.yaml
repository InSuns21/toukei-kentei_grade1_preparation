  - { id: AQFT8-PROP-02, name: "Fock Weyl関係と真空特性汎関数" }
  - { id: AQFT8-THM-02, name: "Minkowski Fock状態の正エネルギーと真空一意性" }
  - { id: AQFT8-PROP-03, name: "真空quasifree状態のGNSとFock表現" }
canonical_examples:
  - コンパクト支持初期データの位置・速度モードの二点虚部とシンプレクティック形式
  - 質量殻Fourier波束の位相iと(2pi)の規格化
  - 正負のWeyl位相と正のGaussian期待値
  - 一粒子・多粒子平行移動の共同スペクトル
  - 質量零の赤外積分の空間次元依存性
