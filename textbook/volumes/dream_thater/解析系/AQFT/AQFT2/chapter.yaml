  - { id: AQFT2-THM-01, name: "可換関数netの三公理" }
  - { id: AQFT2-PROP-02, name: "二地点模型のisotonyと局所性" }
  - { id: AQFT2-PROP-03, name: "三条件の独立性" }
  - { id: AQFT2-PROP-04, name: "quasilocal C*-環の構成" }
canonical_examples:
  - M2(C)の対角部分環と全行列環の交換子
  - 台が開領域に含まれる関数からの可換共変net
  - 二地点の行列因子による非可換な局所模型
  - Lorentz不変の領域量によるisotony反例
  - 固定地点の割当てによる共変性反例
