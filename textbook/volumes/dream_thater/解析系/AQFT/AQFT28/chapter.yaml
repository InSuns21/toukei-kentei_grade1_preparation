id: "AQFT28"
title: "局所Type III₁性の適用境界"
volume: "foundations"
status: supplementary
prerequisites:
  - AQFT9
  - AQFT14
  - AQFT15
  - AQFT16
  - AQFT17
  - AQFT18
  - AQFT19
  - AQFT20
