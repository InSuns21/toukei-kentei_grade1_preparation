learning_objectives:
  - wedge実線形部分空間と標準性の二条件を検証できる
  - AQFT8の位相iを含め半周境界値と反ユニタリjの符号を導ける
  - boost不変な稠密部分空間のグラフcore補題を証明できる
  - 一粒子Tomita作用素と幾何学的候補の閉作用素としての一致を証明できる
  - Fock指数ベクトルとWeyl元から第二量子化されたTomita作用素を同定できる
  - モジュラー流とrapidity -2πtのboostの一致を示せる
  - wedge双対性と全有界局所演算子のKMS性を適用条件付きで導ける
  - 一般Wightman場やdouble coneの型への無条件拡張を避けられる
