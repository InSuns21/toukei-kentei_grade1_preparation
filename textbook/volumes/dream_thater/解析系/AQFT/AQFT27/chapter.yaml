  - { id: AQFT27-PROP-01, name: "Weyl環のTomita作用素と第二量子化" }
  - { id: AQFT27-THM-02, name: "自由実スカラー場のBisognano–Wichmann定理" }
  - { id: AQFT27-COR-01, name: "自由スカラー場のwedge双対性" }
  - { id: AQFT27-COR-02, name: "wedge真空のboost–KMS性" }
canonical_examples:
  - 右wedgeに支持された非零試験関数とその虚数倍
