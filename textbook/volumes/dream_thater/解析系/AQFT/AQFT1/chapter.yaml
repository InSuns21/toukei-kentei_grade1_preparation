id: "AQFT1"
title: "Minkowskiの領域と因果補集合"
volume: "foundations"
status: supplementary
prerequisites:
  - SREL2
  - LORG6
official_scope: []
learning_objectives:
  - Minkowski計量(-+++)から点間の空間的・因果的分離条件を導出できる
  - 因果補集合を開集合として定義し、通常の集合補集合や点ごとの空間的関係と区別できる
  - double coneと右・左wedgeを定義し、座標による所属判定と因果補集合を証明できる
  - 二つのdouble coneの空間的分離を中心距離と半径から必要十分条件で判定できる
  - 領域包含と因果補集合の反変性、Poincaré変換の共変性を計算で説明できる
