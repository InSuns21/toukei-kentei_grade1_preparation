  - AQFT33-INFINITE-TO-FINITE
  - AQFT33-UNBOUNDED-VARIATIONAL
  - AQFT33-ORTHOGONAL-RESOLVENT
  - AQFT33-LOG-SIGNED-INTEGRAL
  - AQFT33-RESOLVENT-INCLUSION
  - AQFT33-GENERAL-MONOTONICITY
  - AQFT33-LOCAL-NET-APPLICATION
