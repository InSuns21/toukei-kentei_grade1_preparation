id: "AQFT23"
title: "Takesakiのモジュラー不変性"
volume: "foundations"
status: supplementary
prerequisites:
  - AQFT18
  - AQFT19
  - AQFT20
  - AQFT21
  - AQFT22
  - QM6
learning_objectives:
  - Tomita可換子定理の証明中の全時刻付き包含からモジュラー不変性の両包含を証明できる
  - JとDeltaの反線形関数計算による符号を正しく処理できる
  - 一般標準対のモジュラー自己同型群の群性・正規性・強連続性・状態保存を証明できる
  - Gaussian強作用素平均でvon Neumann環内のノルム全解析的元を構成できる
  - Gaussian作用素の複素時間ノルム評価と代数内の所属を検証できる
  - 平滑化した代数元のベクトルがDeltaの正負べきとSの共通グラフcoreになることを証明できる
  - 無限次元標準表現で強連続と作用素ノルム連続の違いを計算できる
  - 一般のTomita–Takesaki定理と未証明のKMS・幾何学的流を区別できる
