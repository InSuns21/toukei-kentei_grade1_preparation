  - { id: AQFT23-THM-03, name: "Gaussian平滑化による代数内全解析的元" }
  - { id: AQFT23-THM-04, name: "代数内解析元による共通グラフcore" }
  - { id: AQFT23-THM-05, name: "標準対に対するTomita–Takesaki定理" }
canonical_examples:
  - 忠実な二準位Hilbert–Schmidt模型のE12とE21のモジュラー位相
  - 二準位行列単位による全解析的元と固定点の直接検算
  - 無限次元Hilbert–Schmidt模型のshiftによるノルム不連続の反例
  - Gaussian核の複素平行移動と正負半べきの共通グラフcore
