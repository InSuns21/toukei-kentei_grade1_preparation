  - AQFT32-ZERO-CRITERION-GENERAL
  - AQFT32-NONCOMMUTING-GAP
  - AQFT32-OPERATOR-CONVEXITY
  - AQFT32-THREE-LEVEL-SPECTRAL-GAP
  - AQFT32-REGULARIZATION-DIVERGENCE
