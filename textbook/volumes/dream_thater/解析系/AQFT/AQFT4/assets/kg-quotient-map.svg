<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 238" width="780" height="238" data-layout-lint="strict" role="img" aria-labelledby="title-kgq desc-kgq">
  <title id="title-kgq">Klein–Gordonの試験関数商と解空間</title>
  <desc id="desc-kgq">左のコンパクト支持試験関数空間Dを商写像qで中央のV=D/PDへ送り、右の空間コンパクト斉次解Sol_sc(P)へ因果伝播子が誘導する同型で移す。商写像の核はPDである。</desc>
  <defs>
    <marker id="arrow-kgq" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#355f7d"/></marker>
  </defs>
  <rect x="20" y="56" width="192" height="110" rx="12" fill="#f4f7fb" stroke="#355f7d" stroke-width="2"/>
  <rect x="294" y="56" width="192" height="110" rx="12" fill="#eef6f5" stroke="#2e6c63" stroke-width="2"/>
  <rect x="568" y="56" width="192" height="110" rx="12" fill="#f4f7fb" stroke="#355f7d" stroke-width="2"/>
  <line x1="224" y1="111" x2="282" y2="111" stroke="#355f7d" stroke-width="2.8" marker-end="url(#arrow-kgq)"/>
  <line x1="498" y1="111" x2="556" y2="111" stroke="#355f7d" stroke-width="2.8" marker-end="url(#arrow-kgq)"/>
  <g fill="#1d3446" font-family="sans-serif" text-anchor="middle">
    <text x="116" y="101" font-size="25">D</text>
    <text x="116" y="133" font-size="17">compact f</text>
    <text x="390" y="101" font-size="25">V</text>
    <text x="390" y="133" font-size="17">D / P D</text>
    <text x="664" y="101" font-size="24">Sol_sc(P)</text>
    <text x="664" y="133" font-size="17">E f</text>
    <text x="253" y="87" font-size="19">q</text>
    <text x="527" y="87" font-size="19">Ē</text>
    <text x="116" y="200" font-size="16">ker(q) = P D</text>
    <text x="664" y="200" font-size="16">P(E f) = 0</text>
  </g>
</svg>
