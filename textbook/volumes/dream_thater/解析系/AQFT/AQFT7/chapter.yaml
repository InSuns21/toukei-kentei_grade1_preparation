  - { id: AQFT7-THM-01, name: "許容共分散からのGaussian Weyl状態" }
  - { id: AQFT7-PROP-02, name: "quasifree状態のGNS表現は規則的" }
canonical_examples:
  - 標準二次元の対角共分散とab≥1/4判定
  - 境界共分散の半正定値二点行列と負固有値の反例
  - Gaussian Weyl二元積の逆順による位相差
  - 有限生成部分群のFølner平均とGNSの強連続性
