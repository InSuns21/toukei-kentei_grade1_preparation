id: "AQFT7"
title: "quasifree状態と二点形式"
volume: "foundations"
status: supplementary
prerequisites:
  - AQFT6
  - AQFT5
  - AQFT3
  - OA5
  - QM7
official_scope: []
learning_objectives:
  - 実対称共分散の不確定性条件と複素二点形式のGram正値性が同値であることを証明できる
  - 標準二次元シンプレクティック空間の対角共分散でab≥1/4の必要十分条件を計算できる
  - Gaussian型Weyl特性汎関数の有限線形結合での正値性を指数Gram核から証明できる
  - 代数的正値性と具体的C*ノルムへの延長を区別しFølner平均によるノルム支配を追える
  - 状態のGaussian形から不確定性条件を二次の極限として逆導出できる
  - 中心化quasifree状態の二点形式とCCR反対称部の整合を計算できる
  - GNS表現の規則性を巡回ベクトルから稠密性で示し真空条件とは区別できる
definitions:
  - { id: AQFT7-DEF-01, name: "実共分散と不確定性条件" }
  - { id: AQFT7-DEF-02, name: "CCRと整合する二点形式" }
  - { id: AQFT7-DEF-03, name: "中心化quasifree状態" }
theorems:
