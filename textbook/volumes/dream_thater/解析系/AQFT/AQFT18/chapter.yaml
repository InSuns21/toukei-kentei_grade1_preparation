  - { id: AQFT18-THM-01, name: "Tomita初期作用素の可閉性" }
  - { id: AQFT18-PROP-02, name: "Tomita閉包の対合性と稠密値域" }
  - { id: AQFT18-PROP-03, name: "可換子側との反線形随伴包含" }
canonical_examples:
  - 二点対角環での標準対と座標共役の全計算
  - 有限測度空間L2上の乗算環での閉包の構成
  - Hilbert–Schmidt空間の左乗算表示での無限次元非有界Tomita初期作用素
  - 全行列環の巡回だが非分離的なベクトルでのwell-defined性の失敗
