id: "AQFT18"
title: "標準対とTomita作用素"
volume: "foundations"
status: supplementary
prerequisites:
  - AQFT13
learning_objectives:
  - 巡回性と分離性を区別して標準対を判定し可換子側の標準性を証明できる
  - 反線形作用素・グラフ・可閉性を定義し閉包を収束列から構成できる
  - S_0(A\Omega)=A^*\Omegaのwell-defined性・反線形性・稠密定義性と初期対合性を証明できる
  - 可換子側のF_0を構成し交換関係から反線形の基本対合公式を導ける
  - 可換子側の稠密性を使ってS_0とF_0の可閉性を証明できる
  - Tomita閉包Sの定義域・対合性・稠密な値域と反線形随伴の包含を追える
  - 二点対角環と無限次元Hilbert–Schmidt模型で標準性とTomita作用素を計算できる
  - 巡回性・分離性の欠落がどの構成を破るかを反例で判定できる
