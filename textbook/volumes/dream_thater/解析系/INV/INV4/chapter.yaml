id: "INV4"
title: "逆を正則化するとはどういうことか"
volume: "foundations"
status: supplementary
prerequisites:
  - INV3
official_scope: []
learning_objectives:
  - 最小ノルム一般化逆の定義域を厳密な可解データと観測不能成分に分けて説明できる
  - 有界な正則化作用素族と無雑音の整合性を定義し具体例で全条件を確認できる
  - ノイズを含む再構成の誤差を近似誤差とデータ誤差に分解して収束条件を証明できる
  - 不良設定な逆問題では整合的な正則化作用素のノルムが発散することを示せる
  - ell2の有限項復元で適切な打切りと早過ぎる打切り解除を比較し反例を構成できる
definitions:
  - { id: INV4-DEF-01, name: 最小ノルム一般化逆の定義域 }
  - { id: INV4-DEF-02, name: 正則化作用素族 }
  - { id: INV4-DEF-03, name: ノイズ下での正則化収束 }
theorems:
  - { id: INV4-THM-01, name: 正則化誤差の二項分解と収束 }
  - { id: INV4-THM-02, name: 不安定な逆に対する正則化ノルムの発散 }
  - { id: INV4-PROP-01, name: 対角観測の有限項正則化 }
  - { id: INV4-PROP-02, name: ノイズ増幅条件の必要性 }
canonical_examples:
  - 零空間と観測不能成分を持つ有限ランク作用素の一般化逆
  - ell2対角観測に対する有限項復元の整合性と作用素ノルム
  - 適切な打切りで全許容ノイズに対する収束を得る例
  - 打切りが早過ぎる場合と遅過ぎる場合の相異なる失敗例
