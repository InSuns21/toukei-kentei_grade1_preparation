id: "INV7"
title: "正則化パラメータをどう選ぶか"
volume: "foundations"
status: supplementary
prerequisites:
  - INV6
official_scope: []
learning_objectives:
  - Tikhonov残差を特異系で展開しパラメータに関する連続性・単調性・両端の極限を証明できる
  - Morozovの不一致原理の定義と存在一意性の条件を具体例で判定できる
  - 最小化性と最小ノルム性を用いてMorozov選択の強収束を証明できる
  - ノイズ水準の過小評価と過大評価が選択と復元を壊す機構を数値で説明できる
  - 観測ノイズと作用素近似誤差を区別し有効誤差による近似モデルの強収束を導ける
  - 事前選択・不一致原理・GCV・L曲線の前提と保証の違いを区別できる
definitions:
  - { id: INV7-DEF-01, name: Morozovの不一致原理 }
  - { id: INV7-DEF-02, name: 作用素近似に対する有効誤差上界 }
theorems:
  - { id: INV7-PROP-01, name: Tikhonov残差の値域 }
  - { id: INV7-THM-01, name: Morozovパラメータの存在・一意性 }
  - { id: INV7-THM-02, name: Morozov選択の強収束 }
  - { id: INV7-THM-03, name: 作用素近似を含む不一致原理の強収束 }
canonical_examples:
  - 核を持つ対角作用素の残差下限とMorozov選択の可解性
  - ノイズ過小評価による小特異値方向の復元誤差増幅
  - 作用素近似誤差から有効誤差を導く一次元・二次元の例
  - ell2対角作用素と有限ランク近似における有効誤差と強収束
