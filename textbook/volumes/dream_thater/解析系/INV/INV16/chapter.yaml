  - { id: INV16-PROP-02, name: Gaussian縮小事後の信用区間と被覆率 }
  - { id: INV16-PROP-03, name: 一次元Gaussian更新の事前感度 }
  - { id: INV16-THM-01, name: 関数空間でのBayes更新の正当化 }
canonical_examples:
  - 二次元の相関する差のGaussian信用区間
  - 固定真値下の縮小推定の被覆率低下
  - 事前分散の強弱による平均と信用幅
  - 固定バイアスと独立Gaussianモデル誤差の違い
  - ell2の原子的事前分布のBayes更新
  - ell2上の可算Gaussian座標による確率測度の構成
