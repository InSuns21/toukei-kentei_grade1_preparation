id: "INV16"
title: "逆問題の不確実性をどう読むか"
volume: "foundations"
status: supplementary
prerequisites:
  - INV15
  - F0-00D2C
  - MT3
official_scope: []
learning_objectives:
  - 事後分布から信用領域と線形観測量の信用区間を作り確率条件を直接検証できる
  - 事後確率と固定真値下の頻度論的被覆率を区別し縮小推定の被覆率を導出できる
  - Gaussian事前分散の変化による事後平均・分散の感度を計算できる
  - 決定論的モデル不一致と独立な確率的モデル不一致を区別し識別不能性を反例で示せる
  - 可分Hilbert空間の事前確率測度を基準とするBayes公式の正規化を証明できる
  - 関数空間の事後測度が条件付き分布であることをTonelliの定理で検証できる
  - 原子的事前分布と無限Gaussian座標の直接例で無限次元の測度更新を再構成できる
  - 有限次元Lebesgue密度の形式的拡張の限界とこの講の定理の適用範囲を説明できる
definitions:
  - { id: INV16-DEF-01, name: 信用領域 }
