id: "INV6"
title: "正則化の収束速度をどう求めるか"
volume: "foundations"
status: supplementary
prerequisites:
  - INV5
official_scope: []
learning_objectives:
  - 最小ノルム解への誤差をノイズ誤差とバイアスに分けて特異値ごとに計算できる
  - 正の作用素A*Aの分数冪によるsource conditionを定義し対角モデルで条件を確認できる
  - 0<nu<=1のsource conditionからTikhonovのバイアスと総誤差の上界を証明できる
  - ノイズ水準とsource normから事前パラメータを選び収束率を導出できる
  - Tikhonovのqualification限界を反例で示しTSVDの到達範囲と区別できる
definitions:
  - { id: INV6-DEF-01, name: 正則化のノイズ誤差とバイアス }
  - { id: INV6-DEF-02, name: 分数冪によるsource condition }
  - { id: INV6-DEF-03, name: Tikhonovの残差フィルタ }
  - { id: INV6-DEF-04, name: フィルタのqualification }
theorems:
  - { id: INV6-THM-01, name: Tikhonovのsource condition下での誤差上界 }
  - { id: INV6-THM-02, name: Tikhonovの事前パラメータと収束率 }
  - { id: INV6-THM-03, name: Tikhonovのqualificationが1であること }
  - { id: INV6-PROP-01, name: TSVDのsource condition下での収束率 }
canonical_examples:
