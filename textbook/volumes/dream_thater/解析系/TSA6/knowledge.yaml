    introduction_aliases: ["補題（正規ベクトルの条件付け）"]
    requires: []

  - id: timeseries.observation-innovation
    name: 観測イノベーション
    kind: definition
    aliases: ["observation innovation", "innovation process", "one-step prediction error"]
