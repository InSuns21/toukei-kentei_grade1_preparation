chapter: TSA6
scope: dream-theater
coverage: complete
prerequisites:
  - TSA1
  - P3-03
  - LA3B
  - F0-00P7

concepts:
  - id: timeseries.linear-gaussian-state-space
    name: 線形正規状態空間モデル
    kind: definition
    aliases: ["linear Gaussian state-space model", "linear Gaussian state space model"]
    introduction: formal
    introduction_aliases: ["定義（線形正規状態空間モデル）"]
    requires: []

  - id: timeseries.state-prediction-filtering
    name: 予測分布とフィルタ分布
    kind: definition
    aliases: ["予測分布", "フィルタ分布", "prediction distribution", "filtering distribution", "state filtering"]
    introduction: formal
    introduction_aliases: ["定義（予測分布とフィルタ分布）"]
    requires:
      - timeseries.linear-gaussian-state-space

  - id: timeseries.gaussian-conditioning-lemma
    name: 正規ベクトルの条件付け
    kind: lemma
    aliases: ["Gaussian conditioning", "conditional Gaussian formula"]
