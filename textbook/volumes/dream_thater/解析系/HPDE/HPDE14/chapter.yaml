id: "HPDE14"
title: "局所parametrixの誤差補正"
volume: "foundations"
status: supplementary
prerequisites:
  - HPDE13
  - HPDE12
  - HPDE11
  - HPDE10
  - HPDE9
  - HPDE5
  - HPDE4
  - HPDE3
official_scope: []
learning_objectives:
  - 有限Hadamard和の非滑らかな残差と滑らかな近似基本解の残差を区別できる
  - Riesz核の円錐上の次数を数えcutoff付き和が分布として収束する仕組みを示せる
  - 交換子と隣接次数の差による残差を導きその滑らかさと因果支持を証明できる
  - 滑らかな因果核に対するVolterra反復の階乗評価を再現できる
  - 近似核にVolterra逆を合成し真の局所点源基本解を構成できる
  - 既証局所Cauchy存在による補正とVolterra構成の論理的な違いを説明できる
  - 質量項を持つMinkowski模型で初項残差と補正の符号を検算できる
definitions:
  - { id: HPDE14-DEF-01, name: 因果的な局所近似基本解 }
  - { id: HPDE14-DEF-02, name: 切断付きHadamard核 }
  - { id: HPDE14-DEF-03, name: 因果Volterra核と反復積 }
theorems:
  - { id: HPDE14-LEM-01, name: cutoff交換子の計算 }
  - { id: HPDE14-THM-01, name: 滑らかな残差を持つ局所近似核の構成 }
  - { id: HPDE14-LEM-02, name: 因果Volterra核の階乗評価 }
  - { id: HPDE14-THM-02, name: 真の局所点源基本解への補正 }
  - { id: HPDE14-PROP-01, name: Cauchy補正との比較 }
canonical_examples:
  - 平坦massless核の誤差零と逆核の確認
  - 定質量模型の有限和で残差の符号を直接計算
  - 光円錐から離したcutoff微分と滑らかさの検証
  - 時間順序積分の単体積から階乗分母を導出
problem_patterns:
