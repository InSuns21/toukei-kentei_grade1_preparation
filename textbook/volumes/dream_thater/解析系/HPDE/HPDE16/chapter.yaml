id: "HPDE16"
title: "大域Cauchy問題の存在一意性"
volume: "foundations"
status: supplementary
prerequisites:
  - HPDE15
  - HPDE11
  - HPDE10
  - HPDE9
  - HPDE8
  - HPDE6
  - HPDE5
  - LORG20
