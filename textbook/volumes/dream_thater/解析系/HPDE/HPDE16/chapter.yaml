official_scope: []
learning_objectives:
  - 大域双曲性・Cauchy時間関数・コンパクト支持データの役割を区別し大域定理の仮定を説明できる
  - コンパクトな因果的影が有限時間帯ではコンパクトになる仕組みを因果曲線から示せる
  - 束値波動方程式の局所一階対称双曲化から有限時間の高階評価を導ける
  - 高階エネルギー界から有限端点で滑らかなCauchyトレースを構成できる
  - コンパクト支持を保つ局所貼り合わせと時間スライス延長により大域解を構成できる
  - 局所一意性と有限伝播から大域解の一意性および因果的支持を導ける
  - 非コンパクトな初期面への一様Sobolev評価を無条件に推論できない理由を示せる
definitions:
  - { id: HPDE16-DEF-01, name: 大域Cauchy問題 }
  - { id: HPDE16-DEF-02, name: 有限時間因果影 }
theorems:
