  - { id: HPDE16-LEM-02, name: コンパクト領域での束値高階評価 }
  - { id: HPDE16-LEM-03, name: 有限端点での滑らかな延長 }
  - { id: HPDE16-THM-01, name: 大域Cauchy問題の存在一意性 }
  - { id: HPDE16-COR-01, name: 因果的支持と時間スライス上のコンパクト性 }
canonical_examples:
  - Minkowski空間での有限時間因果影の計算
  - 一次対称双曲系のエネルギー微分と非自己随伴項の評価
  - 空間コンパクトな波動が時空コンパクトとは限らない模型
  - 非コンパクト面で局所時間幅の下限が零となる模型
