id: "HPDE2"
title: "高次元平坦波動とHuygens現象"
volume: "foundations"
status: supplementary
prerequisites:
  - HPDE1
  - PDE4
  - LORG6
official_scope: []
learning_objectives:
  - 球面平均の面積正規化とLaplace作用素との微分恒等式を証明できる
  - 三次元のKirchhoff公式を球面平均から導き、初期値と一意性を検算できる
  - 強いHuygens性を有限伝播と区別し、三次元の支持通過後の消失を証明できる
  - 球面の射影Jacobianを計算し、二次元Poisson公式と内部尾を導出できる
  - 一次元・二次元・三次元のmassless波動の支持構造を比較できる
  - 三次元massive方程式の内部残響をDuhamel表示と小質量展開で示せる
  - 曲率・質量項・空間次元によるHuygens性の成立条件を区別できる
definitions:
  - { id: HPDE2-DEF-01, name: 球面平均 }
  - { id: HPDE2-DEF-02, name: 強いHuygens性 }
theorems:
  - { id: HPDE2-LEM-01, name: 球面平均の微分恒等式 }
  - { id: HPDE2-THM-01, name: 三次元Kirchhoff公式 }
  - { id: HPDE2-PROP-01, name: 三次元massless波動の強いHuygens性 }
  - { id: HPDE2-THM-02, name: 二次元Poisson公式 }
  - { id: HPDE2-PROP-02, name: 質量項が作る三次元の内部残響 }
canonical_examples:
  - 二次関数での球面平均恒等式の直接検算
  - 三次元初期速度の球面支持と通過後の零
  - 二次元円板内部の正の尾
  - 小質量展開でコンパクト台データから現れる内部残響
problem_patterns:
  - HPDE2-SPHERICAL-AFFINE
  - HPDE2-SPHERICAL-QUADRATIC
  - HPDE2-INITIAL-VELOCITY
  - HPDE2-SPHERE-SUPPORT
  - HPDE2-DESCENT-JACOBIAN
  - HPDE2-POISSON-TAIL
  - HPDE2-CONSTANT-MASS
  - HPDE2-MULTIDIMENSIONAL-HUYGENS
