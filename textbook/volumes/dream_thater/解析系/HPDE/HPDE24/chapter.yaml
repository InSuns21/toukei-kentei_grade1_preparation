id: "HPDE24"
title: "反例・模型・AQFT/MICAへの橋"
volume: "foundations"
status: supplementary
prerequisites:
  - HPDE23
  - HPDE22
  - HPDE19
  - HPDE18
  - HPDE16
  - HPDE12
  - HPDE2
  - HPDE5
