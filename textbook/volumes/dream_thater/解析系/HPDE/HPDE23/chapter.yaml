id: "HPDE23"
title: "実Klein–Gordon解のシンプレクティック構造"
volume: "foundations"
status: supplementary
prerequisites:
  - HPDE22
  - HPDE21
  - HPDE20
  - HPDE19
  - HPDE16
  - HPDE7
