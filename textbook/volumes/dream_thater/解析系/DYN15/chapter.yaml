id: "DYN15"
title: "離散力学・記号力学・CA比較の総合論証"
volume: "foundations"
status: supplementary
prerequisites:
  - DYN14
  - DYN13
  - DYN12
  - DYN6
  - CELL3
  - CELL7
  - CELL8
official_scope: []
learning_objectives:
  - 有限環CAと連続区間で軌道が最終周期的かどうかを仮定から区別できる
  - 有限環左シフトのn回固定点数を最大公約数から証明できる
  - 有限環の最小周期とn回固定点の区別を具体的に数えられる
  - 両側シフトから片側シフトへの座標射影の連続性と全射性を確認できる
  - 区間horseshoeへの半共役を可換式の合成で証明できる
  - 両側シフトと片側シフトの周期点数が一致しても共役でない理由を証明できる
  - コンパクト全不変集合の固定点数から線形模型の共役障害を示せる
  - 区間全体と生存集合のエントロピーに関する結論の範囲を区別できる
  - ODE流れとの比較で必要な別の正本結果と未証明の一般定理を識別できる
definitions:
  - { id: DYN15-DEF-01, name: "非負座標への射影" }
theorems:
  - { id: DYN15-THM-01, name: "有限環シフトの固定反復点の個数" }
  - { id: DYN15-THM-02, name: "CAシフトから区間horseshoeへの半共役の連鎖" }
propositions:
  - { id: DYN15-PROP-01, name: "周期点計数と共役の障害" }
canonical_examples:
  - "有限環4セルの二歩固定点4配置と最小周期"
  - "区間x/2の非周期収束軌道"
  - "位置-1の違いを失う正座標射影"
  - "0101周期列とhorseshoeの3/10・9/10"
  - "双曲線形写像のコンパクト全不変集合の非共役"
problem_patterns:
  - DYN15-RING-FIXED-COUNT
  - DYN15-SHIFT-ORIENTATION
