chapter: "PDE11"
terms:
  - term: Bessel モード
    english: Bessel mode
    meaning: 円板や円筒の Laplacian 固有値問題で、Bessel 関数と角 Fourier モードを組み合わせた固有関数。
  - term: 球面調和関数
    english: spherical harmonic
    meaning: 球面 Laplacian の固有関数で、固有値は ell(ell+1) の形を持つ。
  - term: Legendre の陪微分方程式
    english: associated Legendre equation
    meaning: 球面上で方位角依存 e^(im phi) を分離したとき極角成分が満たす常微分方程式。
  - term: 立体調和関数
    english: solid harmonic
    meaning: 球面調和関数へ適切な r の冪を掛けて得る三次元調和関数。
