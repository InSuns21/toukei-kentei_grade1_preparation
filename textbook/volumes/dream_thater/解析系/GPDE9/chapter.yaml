  - { id: GPDE9-THM-01, name: "Poisson方程式のinterior H^2正則性" }
  - { id: GPDE9-PROP-02, name: "一般係数のCaccioppoli型評価" }
  - { id: GPDE9-THM-02, name: "局所Lipschitz係数のinterior H^2正則性" }
