id: "GPDE9"
title: "楕円型正則性"
volume: "foundations"
status: supplementary
prerequisites:
  - GPDE8
official_scope: []
learning_objectives:
  - 差分商を定義し、H^1関数に対するL^2一様評価を導出できる
  - 差分商版の部分積分公式を変数変換から証明できる
  - 差分商の一様L^2評価から弱微分の存在を導く判定法を証明できる
  - 局所化関数を用いてPoisson方程式のCaccioppoli型局所エネルギー評価を導出できる
  - テスト関数 -D_{-h}^k(eta^2 D_h^k u) を用いてPoisson弱解の内部H^2正則性を証明できる
  - f∈L^2_locからu∈H^2_locを得る際にfの微分を要求しない理由を説明できる
  - 一般発散形でD_h(A∇u)=A_h D_h∇u+(D_hA)∇uと展開し、係数正則性の役割を説明できる
  - 局所Lipschitz係数の一様楕円型方程式に対して内部H^2評価を導出できる
  - 跳躍係数が弱解のH^2正則性を壊す一次元反例を検証できる
  - 再入角でboundary H^2正則性が失敗する尺度計算と、内部差分商法が境界でそのまま使えない理由を説明できる
  - 有界C^{1,1}領域上のPoisson零Dirichlet問題ではglobal H^2正則性が期待できることと、その証明が境界の平坦化を要する別理論であることを説明できる
  - H^2正則性だけでは一般次元で古典解とは限らず、高階regularityとSobolev埋め込みを経てC^2へ戻る十分条件を説明できる
  - 内部正則性と境界正則性の違いを区別できる
