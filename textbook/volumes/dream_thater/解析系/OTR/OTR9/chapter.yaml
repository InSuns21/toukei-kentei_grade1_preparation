id: "OTR9"
title: "Wasserstein収束は何を意味するか"
volume: "foundations"
status: supplementary
prerequisites:
  - OTR8
official_scope: []
learning_objectives:
  - p-Wasserstein収束を定義し、Dirac測度と微小質量の有限原子例で直接判定できる
  - W_p収束から狭義収束とp次モーメント収束が従うことを証明できる
  - 狭義収束から近接結合を有限Borel分割で構成し、尾部評価と合わせてW_p収束の逆向きを証明できる
  - Polish空間上の可算貼り合わせとL^p評価によってWasserstein空間の完備性を証明できる
  - 可算稠密集合への有限点近似と有理重み近似によってWasserstein空間の可分性を証明できる
  - 質量の遠方逃避とW_p対W_qの差を仮定付きの反例で説明できる
definitions:
  - { id: OTR9-DEF-01, name: Wasserstein収束 }
