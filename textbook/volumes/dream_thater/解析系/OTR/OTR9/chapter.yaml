  - { id: OTR9-LEM-02, name: 狭義収束と積分収束からの一様な尾部評価 }
  - { id: OTR9-THM-01, name: Wasserstein収束の特徴付け }
  - { id: OTR9-LEM-03, name: 可算列の結合 }
  - { id: OTR9-THM-02, name: Wasserstein空間の完備性 }
  - { id: OTR9-THM-03, name: Wasserstein空間の可分性 }
canonical_examples:
  - 消失質量が遠方へ逃げると狭義収束するがW_p収束しない例
  - 固定距離にある消失質量ではW_p収束する例
  - W_pでは収束するがW_qでは収束しない例
  - 二点・三点空間で同じセルの質量を優先的に結合する例
