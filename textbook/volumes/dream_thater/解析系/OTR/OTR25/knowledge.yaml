    introduction_aliases: ["定義（有限OTの結合エントロピー正則化）"]
    requires: [transport.finite-primal, transport.jko-step]

  - id: transport.entropic-unique-interior
    name: 正則化結合の存在・正値性・一意性
    kind: theorem
