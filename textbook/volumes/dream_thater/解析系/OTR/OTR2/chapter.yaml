id: "OTR2"
title: "分割して運べば何が解消するか"
volume: "foundations"
status: supplementary
prerequisites:
  - OTR1
official_scope: []
learning_objectives:
  - 結合測度と二つの周辺分布を定義し、有限分布の行和・列和で許容性を判定できる
  - 積測度から任意の二つの確率測度の結合を構成できる
  - Kantorovichの最適輸送問題の許容集合・費用・下限を区別できる
  - 輸送写像のグラフ測度が結合になり、その費用がMonge費用に一致することを証明できる
  - 原子を分割する有限結合を作り、Mongeの不可能性と費用の厳密な差を検証できる
definitions:
  - { id: OTR2-DEF-01, name: 結合測度と周辺分布 }
  - { id: OTR2-DEF-02, name: Kantorovichの最適輸送問題 }
theorems:
  - { id: OTR2-PROP-01, name: 結合の非空性 }
  - { id: OTR2-PROP-02, name: 周辺分布の積分恒等式 }
  - { id: OTR2-PROP-03, name: Monge写像のグラフ結合への埋め込み }
  - { id: OTR2-PROP-04, name: Kantorovich下限とMonge下限の比較 }
  - { id: OTR2-PROP-05, name: 有限原子での写像と結合の判別 }
canonical_examples:
  - 一つの原子を二つの到着点へ分割する結合
  - 有限結合の行和・列和と積測度
  - 許容Monge写像があるのに分割で費用が下がる三対二輸送
problem_patterns:
  - OTR2-A01
  - OTR2-A02
  - OTR2-A03
  - OTR2-A04
  - OTR2-B01
  - OTR2-B02
  - OTR2-B03
  - OTR2-C01
