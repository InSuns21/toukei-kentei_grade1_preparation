id: "OTR1"
title: "写像で質量を運ぶとは何か"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00P3D
  - STO1
official_scope: []
learning_objectives:
  - 押し出し測度の定義を使い、任意の可測集合と可積分関数に対する質量保存を確認できる
  - 有限原子測度の輸送可能性を原子の質量の分割条件から判定できる
  - Monge問題の許容写像・費用・下限・最適写像を区別して記述できる
  - 二乗費用の最適写像を平均差の下界から構成できる
  - 許容写像が存在するのに最適写像が存在しない例の費用評価と非達成を証明できる
definitions:
  - { id: OTR1-DEF-01, name: 輸送写像 }
  - { id: OTR1-DEF-02, name: Mongeの最適輸送問題 }
theorems:
  - { id: OTR1-PROP-01, name: 有限原子測度の質量保存則 }
  - { id: OTR1-PROP-02, name: 押し出しの合成則 }
  - { id: OTR1-PROP-03, name: 平行移動の二乗費用最適性 }
  - { id: OTR1-PROP-04, name: 許容写像はあるが最小値を達成しない例 }
canonical_examples:
  - 有限原子測度の合流と分割不能
  - 区間の閾値写像による原子測度への輸送
  - 一様区間分布の平行移動
  - 二対一写像と区間分割による最小値非達成
problem_patterns:
