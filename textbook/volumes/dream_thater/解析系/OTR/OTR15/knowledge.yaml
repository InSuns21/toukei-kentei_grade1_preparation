  - id: transport.gaussian-displacement-geodesic
    name: 非退化Gaussian間の変位補間
    kind: proposition
    introduction: formal
    introduction_aliases: ["命題（非退化Gaussian間の変位補間）"]
    requires: [transport.gaussian-w2-spd, transport.displacement-geodesic]

  - id: transport.geodesic-intermediate-rigidity
    name: 測地線上の中間測度の直線表示
    kind: proposition
    introduction: formal
    introduction_aliases: ["命題（測地線上の中間測度の直線表示）"]
    requires: [transport.gluing-lemma, transport.displacement-geodesic, transport.wasserstein-p]
