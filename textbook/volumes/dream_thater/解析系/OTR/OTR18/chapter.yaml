id: "OTR18"
title: "測度曲線の速さを定義できるか"
volume: "foundations"
status: supplementary
prerequisites:
  - OTR17
  - RA8
official_scope: []
learning_objectives:
  - W2-絶対連続曲線と距離微分を定義し、Dirac測度・平行移動で極限とL2条件を検算できる
  - 可算稠密集合までの距離関数から距離微分の存在と最小速度上界を証明できる
  - L2(mu_t)速度・運動作用と有限エネルギー動的計画を定義し、周辺条件と速度積分を確認できる
  - 軌道の端点結合とMinkowski不等式からW2距離の速度評価を証明できる
  - 質量と流束の同時平滑化を構成してJensen不等式とW2近似誤差を証明できる
  - 有限作用の連続の方程式からsuperposition principleによる軌道表現を得る構成と極限操作を説明できる
  - 弱い連続の方程式のL2速度場が距離微分を上から抑えることを証明できる
  - 最適結合の折れ線近似と条件付き平均からAC2曲線の最小作用速度場を構成できる
  - 狭義連続な原子混合と逆向きの粒子軌道の反例で仮定と不等式の向きを説明できる
definitions:
  - { id: OTR18-DEF-01, name: W2-絶対連続曲線 }
  - { id: OTR18-DEF-02, name: 距離微分 }
  - { id: OTR18-DEF-03, name: L2(mu_t)速度と運動作用 }
  - { id: OTR18-DEF-04, name: 動的計画・軌道表現 }
theorems:
