  - { id: OTR18-LEM-01, name: 軌道作用による距離評価 }
  - { id: OTR18-LEM-02, name: 質量と流束の同時平滑化 }
  - { id: OTR18-THM-02, name: 有限二乗作用の重ね合わせ原理 }
  - { id: OTR18-THM-03, name: 速度場による距離微分の評価 }
  - { id: OTR18-LEM-03, name: 最適結合による折れ線近似 }
  - { id: OTR18-THM-04, name: AC2曲線の速度場と最小作用 }
canonical_examples:
  - 動くDirac測度と時間再パラメータ化による作用の増加
  - 原子二点が一点で合流するときの時間零集合の扱い
  - 一様分布の拡大流と分位点からの距離計算
  - 時計回りと反時計回りの軌道分布における条件付き速度の相殺
  - 狭義連続な原子混合が無限長になる反例
