id: "SP21"
title: "Brown 運動の再始動と境界到達の計算"
volume: "foundations"
status: supplementary
prerequisites:
  - STO4
official_scope: []
learning_objectives:
  - ブラウン運動の強 Markov 性の適用条件として停止時刻性とほとんど確実な有限性を確認し、二進格子近似による既習の核心証明を説明できる
  - 停止時刻後の最大上昇確率を強 Markov 性と反射原理から条件付き確率として計算できる
  - 反射原理の同時事象から最大値と終点の同時密度を導き、終点条件付き障壁非到達確率を計算できる
  - Gaussian increments から三つのマルチンゲールを導出し、二進丸めと可積分な支配から有界停止時刻の平均値保存を証明できる
  - 一側初到達時刻の Laplace 変換を指数マルチンゲールと停止・支配収束から導出できる
  - 強 Markov 性を用いて連続する二水準への到達待ち時間を独立な和へ分解できる
  - 区間の初退出時刻の停止時刻性と有限性を確認し、上下どちらへ退出する確率および平均退出時間を求められる
  - 一側初到達時刻の正のモーメントの有限性の境界を尾確率積分から証明し、両側退出の有限平均と対比できる
