id: "SP13"
title: "CTMC の Kolmogorov 方程式・定常性・可逆性"
volume: "foundations"
status: supplementary
prerequisites:
  - SP12
  - SP5
  - STO13
  - ODE3
  - RA5
official_scope: []
learning_objectives:
  - 有限状態 CTMC の遷移半群を定義し P'_t=QP_t=P_tQ の左右の意味を説明できる
  - 一様化の Poisson 級数と行列指数 P_t=e^{tQ} を結び付けられる
  - 二状態 CTMC の Kolmogorov 前進方程式を解き時刻別遷移確率を計算できる
  - 定常分布の定義を全時刻で確認し πQ=0 との同値性を証明できる
  - CTMC の詳細釣合いを率で判定し時間反転対称性との同値性を導ける
  - 定常だが非可逆な三状態 CTMC の総流量と対ごとの流量の違いを説明できる
  - 有限既約 CTMC の長期収束を一様化と離散時間の収束定理から導ける
  - 非既約性や零質量の例で定常性・可逆性・収束の仮定を区別できる
