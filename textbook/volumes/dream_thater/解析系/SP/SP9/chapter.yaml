id: "SP9"
title: "最大不等式・上向き横断・マルチンゲール収束"
volume: "foundations"
status: supplementary
prerequisites:
  - STO2
  - SP8
  - SP7
official_scope: []
learning_objectives:
  - 初到達停止時刻からDoob最大不等式を停止時刻の情報まで確認して再導出できる
  - 二乗可積分マルチンゲールの有限時間最大値のL2評価を導ける
  - 上向き横断回数を具体的標本路で数え、予測可能売買から不等式を証明できる
  - 横断回数の一様期待値評価から劣マルチンゲールの有限な概収束を導ける
  - 一様可積分性とL1有界性の違いを稀な巨大値の反例で説明できる
  - 一様可積分マルチンゲールのL1収束と終端条件付き期待値表示を証明できる
  - L2有界マルチンゲールの直交恒等式からL2収束を導ける
