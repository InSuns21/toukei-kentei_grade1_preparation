id: "SP15"
title: "更新過程・更新方程式・更新回数"
volume: "foundations"
status: supplementary
prerequisites:
  - SP10
  - F0-00P5A
official_scope: []
learning_objectives:
  - 正の独立同分布待ち時間から更新時刻と更新回数を定義し有限時刻での回数を判定できる
  - 指数モーメントの評価から局所有限性と有限時刻の全整数次モーメントを証明できる
  - 更新時刻の畳み込み分布から更新回数の分布公式と期待回数の級数表示を導ける
  - 最初の更新で条件付けた更新方程式を導き局所有界可測解の一意性を証明できる
  - 有限平均の強大数則と更新時刻の挟み撃ちから更新回数の標本路極限を導ける
  - 二乗モーメントの一様上界によって期待値と極限を交換し初等更新定理を証明できる
  - 格子型更新と指数型更新を比較し独立性や有限時刻と長期極限の違いを説明できる
