id: "SP14"
title: "出生死滅過程・吸収・化学反応ネットワーク"
volume: "foundations"
status: supplementary
prerequisites:
  - SP13
official_scope: []
learning_objectives:
  - 出生率と死亡率から有限状態の Q 行列を構成し境界条件と吸収状態を区別できる
  - 有限出生死滅過程で定常流量を用いて積の重みと唯一の定常分布を証明できる
  - 可算状態では正規化の必要性と非爆発性を区別し移入死亡系の Poisson 定常性を直接検証できる
  - 二つの吸収境界への到達確率を初跳躍方程式と差分の積から導出できる
  - 吸収時間の有限性と平均時間の後退方程式および一意性を証明できる
  - 有限化学反応ネットワークの状態変化と反応率から Q 行列と化学マスター方程式を導ける
  - 二状態分子変換の二項定常分布と片方向反応の吸収を比較できる
definitions:
  - { id: SP14-DEF-01, name: "出生死滅過程" }
  - { id: SP14-DEF-02, name: "有限状態の反応ネットワーク" }
