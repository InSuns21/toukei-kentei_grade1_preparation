  - { id: SP14-PROP-01, name: "有限反応ネットワークの化学マスター方程式" }
  - { id: SP14-THM-03, name: "二状態分子変換の二項定常分布" }
canonical_examples:
  - "三状態出生死滅系の Q 行列と隣接率の釣合い"
  - "無限状態の移入死亡過程と Poisson 定常分布の生存分解"
  - "両端吸収系の到達確率・平均到達時間"
  - "保存量を持つ A と B の可逆反応ネットワーク"
  - "片方向反応における吸収と可逆な定常状態の違い"
