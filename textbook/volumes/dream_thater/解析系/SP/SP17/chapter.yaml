id: "SP17"
title: "待ち行列の確率過程"
volume: "foundations"
status: supplementary
prerequisites:
  - SP16
  - SP14
official_scope: []
learning_objectives:
  - 到着とサービスから M/M/1 の人数過程・負荷率・境界付き Q 行列を定義し非爆発性を説明できる
  - 可算状態 M/M/1 の定常確率分布を流量釣合いと正規化から導き負荷率1以上と区別できる
  - Poisson 到着が見る人数分布と指数サービスの無記憶性から平均待機時間と平均滞在時間を計算できる
  - Little の法則の時間面積等式・端点誤差・収束条件を示し M/M/1 の平均人数と照合できる
  - 空き時間と繁忙期間の再生サイクルを構成し更新報酬による稼働時間割合を導ける
  - M/G/1 における人数過程の非 Markov 性と Lindley 再帰を示し負の平均増分から定常待ち時間を構成できる
definitions:
  - { id: SP17-DEF-01, name: "M/M/1 待ち行列と負荷率" }
