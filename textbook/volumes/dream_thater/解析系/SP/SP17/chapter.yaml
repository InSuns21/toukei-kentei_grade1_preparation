  - { id: SP17-PROP-04, name: "Lindley の待ち時間再帰" }
canonical_examples:
  - "到着率2・サービス率3の M/M/1 の Q 行列と幾何定常分布"
  - "稼働率と待機確率と平均滞在時間の違い"
  - "顧客滞在時間を人数の時間積分として数える面積等式"
  - "空き時間・繁忙時間の更新報酬比"
