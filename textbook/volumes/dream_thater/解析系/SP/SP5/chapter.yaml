  - { id: SP5-THM-01, name: "有限既約非周期連鎖の一様な正値性" }
  - { id: SP5-THM-02, name: "有限既約非周期 Markov 連鎖の収束" }
  - { id: SP5-PROP-03, name: "周期的既約連鎖の非収束" }
