id: "SP5"
title: "有限 Markov 連鎖の収束・周期性・結合"
volume: "foundations"
status: supplementary
prerequisites:
  - SP4
official_scope: []
learning_objectives:
  - 帰還可能時刻から周期を定義し通信クラス内で一致することを証明できる
  - 全変動距離の事象表示と半分の絶対差の和表示を結び遷移縮小を証明できる
  - 結合を周辺分布を保つ形で作り食い違い確率による距離上界を導ける
  - 非周期帰還時刻の最大公約数1から十分長い全時刻帰還可能性を導ける
  - 有限既約非周期性から共通歩数の全正遷移確率を構成できる
  - 共通一様成分の結合から定常分布への幾何的収束を証明できる
  - 周期的連鎖と非既約連鎖の反例で各仮定の必要性を説明できる
  - 混合時間の定義を理解し二状態連鎖と三状態サイクルで評価できる
