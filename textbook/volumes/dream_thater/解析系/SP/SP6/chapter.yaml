id: "SP6"
title: "ランダムウォーク・境界到達・破産問題"
volume: "foundations"
status: supplementary
prerequisites:
  - SP3
official_scope: []
learning_objectives:
  - 有限区間吸収ランダムウォークを定義し境界と吸収時刻を確かめられる
  - 有限区間の吸収時刻の幾何級数型尾評価と平均有限性を証明できる
  - 上端先着確率の調和差分方程式を導き境界値から一意解を求められる
  - 平均吸収時刻の非同次差分方程式を導き一意解を求められる
  - 公平な場合と偏った場合の公式を計算例で検算できる
  - 半直線上の破産確率を有限区間からの事象の増加極限で求められる
  - 半直線上の平均破産時刻を単調収束で導き確率1と有限期待値を区別できる
  - 状態依存の遷移確率について最初の一歩の方程式を組み立てられる
