  - { id: SP18-PROP-01, name: "世代人数の分散" }
  - { id: SP18-PROP-02, name: "総個体数の期待値" }
  - { id: SP18-PROP-03, name: "現在の人数から見た最終絶滅確率" }
canonical_examples:
  - "0人または2人の子を独立に残す家系の分枝木"
  - "超臨界二分枝の有限時点と最終的な絶滅確率"
  - "臨界0/2分枝と必ず一子を残す退化例の対比"
