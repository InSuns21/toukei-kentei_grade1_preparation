id: "SP18"
title: "Galton–Watson 分枝過程・絶滅"
volume: "foundations"
status: supplementary
prerequisites:
  - STO1
  - RA3
official_scope: []
learning_objectives:
  - 独立同分布の子孫数から世代人数を構成し、絶滅状態が吸収的であることを確認できる
  - 子孫数の確率母関数と合成反復から各世代の母関数と有限時点の絶滅確率を導ける
  - 絶滅確率が母関数の区間0から1における最小不動点であることを証明できる
  - 平均子孫数で劣臨界・臨界・超臨界を分類し、必ず一子を残す退化例を区別できる
  - 独立性と条件付けを使って世代人数の平均・分散を導出できる
  - 総個体数と途中世代からの条件付き絶滅確率を計算し、系譜と連続時間出生死滅モデルの違いを説明できる
