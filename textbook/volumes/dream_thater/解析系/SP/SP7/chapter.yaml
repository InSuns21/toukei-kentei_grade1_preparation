id: "SP7"
title: "マルチンゲール・条件付き期待値・予測可能変換"
volume: "foundations"
status: supplementary
prerequisites:
  - STO2
  - SP6
official_scope: []
learning_objectives:
  - マルチンゲール・劣／優マルチンゲールを条件付き期待値から区別できる
  - マルチンゲール差分の可測性・可積分性・条件付き平均を確認し累積過程を判定できる
  - 平均一定だけではマルチンゲールにならない反例を説明できる
  - 公平・偏向ランダムウォークの中心化と二乗補正を導ける
  - 予測可能変換の情報制約を検証し未来情報を使う戦略との違いを示せる
  - 二乗可積分マルチンゲールの条件付き二乗補正と二乗平均恒等式を証明できる
  - 適応的な賭け戦略の損益平均・二乗平均と同時分布を計算できる
