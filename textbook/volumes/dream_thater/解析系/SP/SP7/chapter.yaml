  - { id: SP7-THM-01, name: "予測可能変換の二乗平均恒等式" }
canonical_examples:
  - "二段階コイントスの差分と適合性"
  - "平均が一定でもマルチンゲールでない過程"
  - "偏りのある歩行の中心化と平方補正"
  - "前回の符号を使う賭けと未来情報を使う賭け"
