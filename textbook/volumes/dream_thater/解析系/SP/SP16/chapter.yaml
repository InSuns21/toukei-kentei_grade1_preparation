id: "SP16"
title: "更新報酬・残余寿命・長期平均"
volume: "foundations"
status: supplementary
prerequisites:
  - SP15
official_scope: []
learning_objectives:
  - 独立同分布サイクルの組から更新報酬過程を定義し、同一サイクルの報酬と長さの依存を許した強法則と期待値極限を証明できる
  - 年齢・残余寿命・観測サイクル長の定義を更新瞬間を含めて確認できる
  - 有界なサイクル内観測関数の長期時間平均を更新報酬定理と端サイクルの評価から導ける
  - 残余寿命と年齢の時間平均尾確率を待ち時間の尾積分で表せる
  - 長さに比例した観測バイアスと有限二次モーメント下の平均残余寿命を導ける
  - 更新測度による固定時刻の残余寿命の式を証明し、非格子性と鍵更新定理が必要となる位置を特定できる
  - 一定間隔・Poisson・二段階指数型を比較し、時間平均と固定時刻分布の違いを説明できる
