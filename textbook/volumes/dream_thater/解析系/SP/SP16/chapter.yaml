  - { id: SP16-PROP-01, name: "観測サイクル長の長さによる偏り" }
  - { id: SP16-PROP-02, name: "残余寿命の更新測度表示" }
  - { id: SP16-THM-03, name: "鍵更新定理（引用する特殊形）" }
  - { id: SP16-COR-01, name: "非格子型の固定時刻残余寿命極限" }
