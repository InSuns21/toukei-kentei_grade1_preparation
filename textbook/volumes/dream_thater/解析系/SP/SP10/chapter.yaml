id: "SP10"
title: "計数過程・Poisson 過程・指数待ち時間"
volume: "foundations"
status: supplementary
prerequisites:
  - STO2
official_scope: []
learning_objectives:
  - 単純計数過程の標本路条件とPoisson過程の独立定常増分を区別し実例で確認できる
  - Poisson過程の短時間到着確率と単位跳躍性を導ける
  - Poisson計数から独立同分布の指数待ち時間を密度変換で確認できる
  - 指数待ち時間の独立列から非爆発なPoisson計数過程を構成してPoisson分布と独立増分を証明できる
  - 到着数で条件付けた到着時刻の一様順序統計分布を導ける
  - Poisson過程の平均・分散・共分散を計算できる
  - 自然な過去の情報に対してN_t-lambda tがマルチンゲールであることを確認できる
  - 最初の待ち時間の無記憶性だけではPoisson過程にならない反例を説明できる
