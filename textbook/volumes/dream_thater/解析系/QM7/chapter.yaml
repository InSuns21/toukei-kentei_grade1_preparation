id: "QM7"
title: "Stone の定理と Schrödinger 発展"
volume: "foundations"
status: supplementary
prerequisites:
  - QM6
official_scope: []
learning_objectives:
  - 強連続1パラメータユニタリ群を定義し、群性・ユニタリ性・強連続性をそれぞれ確認できる
  - 自己共役作用素 H に対し U(t)=exp(-itH/ħ) を Borel 関数計算で構成し、強連続1パラメータユニタリ群になることを証明できる
  - U(t)=exp(-itH/ħ) の強微分可能な初期値がちょうど D(H) であり、dU(t)x/dt=-(i/ħ)HU(t)x を導ける
  - 強連続1パラメータユニタリ群の生成作用素を定義し、その定義域の稠密性と歪対称性を証明できる
  - Laplace 型積分から生成作用素の値域条件を導き、QM6 の自己共役性判定を用いて Stone の定理の逆向きを証明できる
  - Schrödinger 方程式の強解を unitary group と結び、初期値が D(H) に属する場合の存在・一意性を示せる
  - ユニタリ時間発展からノルム保存と Hamiltonian のスペクトル分布保存を説明できる
  - 二準位系・対角 Hamiltonian・自由粒子 Hamiltonian で時間発展を具体計算できる
