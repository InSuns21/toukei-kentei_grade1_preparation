  - { id: F0P2A-THM-03, name: 確率測度の上からの連続性 }
  - { id: F0P2A-THM-04, name: Markovの不等式 }
  - { id: F0P2A-THM-05, name: Chebyshevの不等式 }
canonical_examples: [Bernoulli期待値, Bernoulliモーメント, 一様分布の変換期待値, 標本平均のChebyshev評価]
