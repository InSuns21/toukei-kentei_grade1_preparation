id: "F0-00P2A"
title: "期待値・LOTUS"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00P2
  - F0-00D2B
official_scope: []
learning_objectives:
  - 期待値をLebesgue積分として定義し可積分性条件を説明できる
  - 押し出し積分公式を指示関数から一般の可測関数まで証明できる
  - 離散和と連続積分を押し出し積分公式で統一できる
  - モーメントを定義し具体例で確認できる
  - 可算劣加法性を可算加法性から証明できる
  - 確率測度の上からの連続性を下からの連続性から証明できる
  - Markov・Chebyshevの不等式を証明し確率評価に使える
  - 優収束定理などの適用条件を確認して期待値と極限を交換できる
definitions:
  - { id: F0P2A-DEF-01, name: 期待値 }
  - { id: F0P2A-DEF-02, name: モーメント }
theorems:
  - { id: F0P2A-THM-01, name: 押し出し積分公式 }
