chapter: F0-00P7A
scope: dream-theater
coverage: complete
prerequisites:
  - F0-00P7
  - F0-00P5
  - F0-00P6A

forward_references:
  - stat.qmd
  - stat.lan

concepts:
  - id: stat.slutsky-theorem
    name: Slutskyの定理
    kind: theorem
    aliases: [Slutsky theorem]
    introduction_aliases: ["定理（Slutsky の定理）"]
    requires:
      - prob.distribution-convergence
      - prob.probability-convergence
      - prob.bounded-lipschitz-characterization

  - id: stat.uniform-lln
    name: 一様大数の法則
    kind: definition
    aliases: [uniform law of large numbers]
    introduction_aliases: ["定義（一様大数の法則）"]
    requires:
      - prob.probability-convergence

  - id: stat.mle
    name: 最尤推定量
    kind: definition
    aliases: [maximum likelihood estimator]
    introduction_aliases: ["定義（最尤推定量）"]
    requires:
      - stat.likelihood

  - id: stat.kl-divergence
    name: カルバック・ライブラー情報量
    kind: definition
    aliases: [Kullback--Leibler divergence, KL divergence]
    introduction_aliases: ["定義（カルバック・ライブラー情報量）"]
    requires:
      - stat.dominated-model
      - prob.expectation

  - id: stat.argmax-consistency
    name: 最大化点の一致性
    kind: theorem
    aliases: [argmax consistency]
    introduction_aliases: ["定理（最大化点による最尤推定量の一致性）"]
    requires:
      - stat.uniform-lln
      - stat.kl-divergence

  - id: stat.mle-consistency
    name: 最尤推定量の一致性
    kind: theorem
    aliases: [MLE consistency, 最尤推定量一致性]
    introduction_aliases: ["定理（最大化点による最尤推定量の一致性）"]
    requires:
      - stat.mle
      - stat.argmax-consistency
      - prob.probability-convergence

  - id: stat.mle-asymptotic-normality
    name: 最尤推定量の漸近正規性
    kind: theorem
    aliases: [MLE asymptotic normality]
    introduction_aliases: ["定理（1次元正則モデルにおける最尤推定量の漸近正規性）"]
    requires:
      - stat.mle-consistency
      - stat.score-function
      - stat.fisher-information
      - prob.iid-clt
      - stat.slutsky-theorem
