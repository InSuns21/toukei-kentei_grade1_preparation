chapter: "F0-00P2"
terms:
  - term: 絶対連続
    english: absolute continuity
    meaning: nu(A)=0ならmu(A)=0となる測度間の関係。
  - term: Radon--Nikodym微分
    english: Radon--Nikodym derivative
    meaning: mu(A)=int_A f dnuを満たす密度f。
  - term: 支配測度
    english: dominating measure
    meaning: モデル内の測度がすべて絶対連続になる共通基準測度。
