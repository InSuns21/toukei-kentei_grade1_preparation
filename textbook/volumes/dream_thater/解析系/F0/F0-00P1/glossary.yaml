chapter: "F0-00P1"
terms:
  - term: 確率空間
    english: probability space
    meaning: 標本空間・sigma代数・確率測度の三つ組。
  - term: 確率変数
    english: random variable
    meaning: 確率空間から可測空間への可測写像。
  - term: 押し出し測度
    english: pushforward measure
    meaning: 写像の逆像を通じて元の測度を値域へ移した測度。
  - term: 分布
    english: law / distribution
    meaning: 確率変数が誘導する値域上の確率測度。
