chapter: F0-00D2B
scope: dream-theater
coverage: complete
prerequisites:
  - F0-00D2A

# 末尾の次章案内で D2C の積測度・Tonelli・Fubini を予告する。
forward_references:
  - measure.product-measure
  - measure.tonelli-theorem
  - measure.fubini-theorem

concepts:
  - id: measure.limit-inferior
    name: 可測関数列の下極限
    kind: definition
    aliases: [可測関数列の下極限, 関数列のliminf]
    introduction_aliases: [liminf, 下極限]
    requires: []

  - id: measure.monotone-convergence-theorem
    name: 単調収束定理
    kind: theorem
    aliases: [単調収束定理, MCT, monotone convergence theorem]
    requires:
      - measure.measurable-function
      - measure.lebesgue-integral

  - id: measure.nonnegative-integral-additivity-homogeneity
    name: 非負Lebesgue積分の加法性と正の斉次性
    kind: proposition
    aliases: [非負Lebesgue積分の加法性と正の斉次性]
    requires:
      - measure.monotone-convergence-theorem
      - measure.simple-function-approximation
      - measure.simple-function-integral

  - id: measure.integral-linearity-absolute-bound
    name: 可積分関数の線形性と絶対値評価
    kind: corollary
    aliases: [可積分関数の線形性と絶対値評価]
    requires:
      - measure.nonnegative-integral-additivity-homogeneity
      - measure.integrable-function
      - measure.positive-negative-parts

  - id: measure.fatou-lemma
    name: Fatouの補題
    kind: lemma
    aliases: [Fatouの補題, Fatou's lemma]
    requires:
      - measure.limit-inferior
      - measure.monotone-convergence-theorem

  - id: measure.dominating-function
    name: 支配関数
    kind: term
    aliases: [支配関数, dominating function]
    requires:
      - measure.measurable-function
      - measure.integrable-function

  - id: measure.l1-convergence
    name: L1収束
    kind: term
    introduction: prose-math
    aliases: [L1収束, L^1収束, L1 convergence]
    requires:
      - measure.lebesgue-integral

  - id: measure.dominated-convergence-theorem
    name: Lebesgueの優収束定理
    kind: theorem
    aliases: [Lebesgueの優収束定理, 優収束定理, DCT, dominated convergence theorem]
    requires:
      - measure.almost-everywhere
      - measure.dominating-function
      - measure.integrable-function
      - measure.fatou-lemma
      - measure.nonnegative-integral-additivity-homogeneity
      - measure.integral-linearity-absolute-bound
      - measure.nonnegative-ae-integral-invariance
      - measure.null-set-integral-invariance
      - measure.l1-convergence
