  - { id: HDP2-LEM-01, name: 指数関数の二次余剰 }
  - { id: HDP2-LEM-02, name: 片側有界変数の分散依存指数モーメント }
  - { id: HDP2-THM-01, name: Bennettの不等式 }
  - { id: HDP2-THM-02, name: Bernsteinの不等式 }
  - { id: HDP2-COR-01, name: Bernsteinの両側不等式 }
canonical_examples:
  - Bernoulliの中心化・分散・片側上限
  - Rademacherと異なる幅の非同分布和
  - 稀なBernoulliのHoeffding比較
  - 完全従属によるBernstein上界の反例
  - 片側上限の下裾への誤用の反例
