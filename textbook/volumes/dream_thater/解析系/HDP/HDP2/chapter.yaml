id: HDP2
title: Bennett・Bernstein不等式と分散依存の集中
volume: foundations
status: supplementary
prerequisites:
  - HDP1
official_scope: []
learning_objectives:
  - 指数関数の二次余剰を片側上限で抑え、分散依存の指数モーメント補題を証明できる
  - 独立非同分布の和にBennettの不等式を導き、率関数と最適パラメータを計算できる
  - Bernsteinの不等式を級数評価から証明し、二次・一次tailの切替を説明できる
  - 両側評価のための下側上限と退化分散の例外を処理できる
  - 稀なBernoulli観測と多座標の同時保証で標本数を逆算できる
  - 独立性または両側上限を落とした反例で証明が壊れる位置を特定できる
definitions:
  - { id: HDP2-DEF-01, name: Bennettの率関数 }
