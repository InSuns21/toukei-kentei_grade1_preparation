id: HDP6
title: ε-netとJohnson–Lindenstrauss射影
volume: foundations
status: supplementary
prerequisites:
  - HDP5
  - HDP1
  - F0-00F2
official_scope: []
learning_objectives:
  - 球面の有限epsilon-netと被覆数を定義し一次元・円周の直接例で検算できる
  - 体積法から球面の被覆数上界を構成と停止性を含めて証明できる
  - 有限netから一般行列の作用素ノルムと対称二次形式の評価を導ける
  - Gaussian行列の固定ベクトル長さ保存を正規二乗和の指数モーメントと最適化から証明できる
  - Johnson–Lindenstrauss補題を固定点集合の全組への和事象評価から証明できる
  - 二乗距離・距離の保証と入力次元・出力次元・点数の役割を区別できる
  - ランダム行列を見てから点を選ぶ場合や全方向への誤適用を核の反例で説明できる
definitions:
