  - { id: HDP6-LEM-03, name: 対称行列の二次形式net評価 }
  - { id: HDP6-LEM-04, name: Gaussian射影の固定ベクトル長さ保存 }
  - { id: HDP6-THM-01, name: Gaussian型Johnson–Lindenstrauss補題 }
canonical_examples:
  - 一次元球面と円周上の有限net
  - 体積法と半径eta/2の非交差開球
  - 四分の一netによる作用素ノルム近似
  - 正規二乗和の上側・下側指数最適化
  - 有限点集合の組の同時距離保存
  - 核ベクトルを使う全方向保証の反例
