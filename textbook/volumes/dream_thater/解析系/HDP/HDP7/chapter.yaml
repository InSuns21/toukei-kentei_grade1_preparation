id: HDP7
title: sub-Gaussianベクトルと標本共分散
volume: foundations
status: supplementary
prerequisites:
  - HDP6
  - HDP3
  - HDP1
  - F0-00F2
  - F0-00P4
official_scope: []
learning_objectives:
  - 全方向のpsi2条件を定義し等方性・座標別条件・次元一様性を区別できる
  - 等方的ベクトルと退化した共分散の具体例を計算できる
  - sub-Gaussian射影の二乗を中心化し局所指数モーメントを級数から導ける
  - 独立な二乗変数のBernstein型二領域集中を証明できる
  - 有限netと二次形式から標本共分散の非漸近作用素ノルム界を証明できる
  - 母平均未知の中心化恒等式と標本平均のnet評価を接続できる
  - 共分散尺度のsub-Gaussian条件を定義し特異なSigmaを像の次元へ白色化できる
  - 独立性・全方向条件・標本数の仮定を反例と階数で説明できる
definitions:
  - { id: HDP7-DEF-01, name: sub-Gaussian確率ベクトル }
  - { id: HDP7-DEF-02, name: 等方的確率ベクトル }
  - { id: HDP7-DEF-03, name: 共分散尺度に適合するsub-Gaussian条件 }
