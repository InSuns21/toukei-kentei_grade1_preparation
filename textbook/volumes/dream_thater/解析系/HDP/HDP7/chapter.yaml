  - { id: HDP7-THM-01, name: 等方的sub-Gaussian標本の共分散作用素ノルム評価 }
  - { id: HDP7-LEM-03, name: 等方的sub-Gaussian標本平均のノルム評価 }
  - { id: HDP7-COR-01, name: 標本平均で中心化した共分散の評価 }
  - { id: HDP7-THM-02, name: 退化を許す一般共分散の評価 }
canonical_examples:
  - 独立Rademacher成分の等方性と全方向のpsi2評価
  - 共分散diag(4,0)の特異Gaussian例と相対尺度
  - psi2平方のモーメント展開と固定方向のChernoff最適化
  - 四分の一netでの作用素ノルムと標本数条件
  - 中心化による階数一補正
  - 正の固有値部分空間だけでの白色化
  - 完全従属標本と低標本数の反例
