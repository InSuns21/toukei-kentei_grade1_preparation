id: HDP5
title: Gaussian集中とLipschitz関数
volume: foundations
status: supplementary
prerequisites:
  - HDP4
  - F0-00F2
  - VC1
official_scope: []
learning_objectives:
  - Euclid距離のLipschitz条件を最大値・ノルム・線形関数で直接検算できる
  - Gaussian部分積分を密度から証明し標準正規の指数モーメントを再計算できる
  - Ornstein–Uhlenbeck平均の不変性・微分交換・生成作用素を導出できる
  - 対数Sobolev不等式を半群のエントロピー減衰とCauchy–Schwarzから証明できる
  - Herbst法の微分積分からGaussian集中と係数1/2を導き非滑らかな関数へ拡張できる
  - Gaussian最大値・ベクトルノルムで期待値界と平均からの集中を接続できる
  - 共分散付きGaussianのアフィン像に対する作用素ノルムを用いた集中を導出できる
  - 集合までの距離がLipschitzとなることを直接証明できる
  - Gaussian入力と大域Lipschitz条件を外す反例を説明できる
