  - HDP10-ENTROPY-INTEGRAL
  - HDP10-DEPENDENT-GAUSSIAN
  - HDP10-EMPIRICAL-MGF
  - HDP10-MULTISCALE-CUBE
  - HDP10-ASSUMPTION-SELECTION
