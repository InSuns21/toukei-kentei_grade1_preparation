id: "GPDE6"
title: "弱形式・変分形式"
volume: "foundations"
status: supplementary
prerequisites:
  - GPDE5
  - PDE5
official_scope: []
learning_objectives:
  - Poisson零Dirichlet問題の古典形からテスト関数を用いて弱形式を座標ごとの部分積分で導出できる
  - H_0^1(Omega)の双対としてH^{-1}(Omega)を定義し、二乗可積分データがH^{-1}の汎関数を定めることをPoincaré不等式から示せる
  - Poisson方程式の変分弱解を定義し、H_0^1が零Dirichlet境界条件を担う意味を説明できる
  - 古典解・超関数解・変分弱解の関係を仮定付きで証明できる
  - 有界双線形形式と強圧的双線形形式を定義し、Poisson双線形形式の有界性と強圧条件を確認できる
  - 勾配ノルムと通常のH1ノルムで強圧定数がどう変わるかをPoincaré不等式から導出できる
  - 対称強圧問題のエネルギー汎関数を定義し、変分方程式とエネルギー最小化の同値を証明できる
  - Hilbert空間のノルムが弱収束時に満たす下側評価であることを内積展開から証明できる
  - 最小化列・弱収束部分列・弱収束時ノルム評価を用いてPoisson変分問題の存在を直接法で証明できる
  - 強圧条件からPoisson弱解の一意性とH^{-1}データに対する安定性評価を導出できる
  - 非零Dirichlet条件とNeumann条件では試行空間を変える必要がある理由を説明できる
