chapter: "F0-00P3A"
terms:
  - term: 条件付き期待値
    english: conditional expectation
    meaning: 部分sigma代数に可測で、その全事象上の積分が元の変数と一致する確率変数。
  - term: tower property
    english: tower property
    meaning: 情報sigma代数を段階的に粗くしても直接条件付けした結果と一致する性質。
  - term: sigma(Y)
    english: sigma-field generated by Y
    meaning: Yから判定できる全事象を集めたsigma代数。
