  - DYN10-CRITICAL-MULTIPLICITY
  - DYN10-RIGHT-CRITICAL-ITINERARY
  - DYN10-CYLINDER-ORDER
  - DYN10-CIRCLE-ENDPOINT
  - DYN10-BOUNDARY-COUNT
  - DYN10-HALFOPEN-CLOSURE
  - DYN10-PREFIX-DISTANCE
  - DYN10-NONSURJECTIVE-CODE
  - DYN10-CODING-SYNTHESIS
