id: GMT31
title: Besicovitch集合：有限段階から極限まで
volume: foundations
status: supplementary
prerequisites:
  - GMT5
  - MT1
official_scope: []
learning_objectives:
  - needleの連続回転問題と全方向の単位線分を含む集合の違いを定義と例から判定できる
  - 三角形の二分・平行移動で方向が保存されることと和集合面積の正確な減少率を断面積分で証明できる
  - 二進Perron木の心三角形・耳の面積漸化式を解き有限段階面積を任意に小さくできる
  - 小さい平行移動の局所化補題を証明して既存の開近傍の内部で再構成できる
  - 入れ子のコンパクト極限から測度零と各方向の単位線分の包含を別々に証明できる
  - 任意小面積の有限段階集合と測度零の集合、及び回転可能な針の領域を混同しない
definitions:
  - { id: GMT31-DEF-01, name: Besicovitch集合と連続回転可能な針の集合 }
  - { id: GMT31-DEF-02, name: Perron木の心三角形・耳 }
theorems:
  - { id: GMT31-LEM-01, name: 二分三角形の面積減少と方向保存 }
  - { id: GMT31-PROP-01, name: 二進Perron木の有限段階面積評価 }
  - { id: GMT31-LEM-02, name: 開近傍内での局所Perron再配置 }
  - { id: GMT31-LEM-03, name: 入れ子コンパクト集合における線分の保存 }
  - { id: GMT31-THM-01, name: 測度零のコンパクト平面Besicovitch集合の存在 }
canonical_examples:
  - 正三角形の角度幅と長さ1以上の放射線分
  - 二分操作のalpha=3/4における重なり面積と心・耳の実測
  - 四分操作のalpha=3/4における面積評価
  - 平行な線分を持つ有限和の連続回転の失敗
  - 入れ子閉近傍の方向ごとの始点の部分列選択
problem_patterns:
  - GMT31-SECTOR-DIRECTIONS
  - GMT31-CROSS-SECTION
  - GMT31-AREA-TWO-LEVELS
  - GMT31-ALPHA-OPTIMIZATION
  - GMT31-MOVEMENT-BOUND
  - GMT31-LOCAL-PERRON
  - GMT31-COMPACT-STARTPOINTS
  - GMT31-ZERO-MEASURE-LIMIT
  - GMT31-CONTINUITY-OBSTRUCTION
  - GMT31-FULL-CONSTRUCTION
exercise_counts: { level_a: 5, level_b: 4, level_c: 1, level_d: 0 }
past_exam_alignment: []
integrated_exam_problems: []
estimated_hours: { reading: 11, exercises: 8, review: 5 }
