id: GMT19
title: blow-upと接測度の基礎
volume: foundations
status: supplementary
prerequisites:
  - F0-00D2B
  - MT5
  - MT8
  - GMT1
  - GMT10
  - GMT13
  - GMT15
official_scope: []
learning_objectives:
  - 平行移動と拡大による測度の押し出しを試験関数の積分から計算できる
  - 局所弱収束と確率測度の弱収束を区別し、質量が無限遠へ逃げる例を説明できる
  - 接測度の任意の正規化と非零極限の条件を述べ、存在に局所倍加性が十分なことを証明できる
  - 平面、錐、点質量、疎な原子測度と滑らかな曲線の接測度を直接計算できる
  - 正の有限密度と全スケールの平坦極限から近似接平面を導く機構を説明できる
  - 一つの平坦な接測度の存在を強い一意性や一般Preiss定理と混同しない
