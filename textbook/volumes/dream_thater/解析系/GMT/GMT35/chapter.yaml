  - GMT35-HOLDER-LOSS
  - GMT35-EXPONENT-TRANSFER
  - GMT35-LOG-EPSILON
  - GMT35-MINKOWSKI-SIGN
  - GMT35-SCHUR-ROW-SUM
  - GMT35-CAP-THICKENING
  - GMT35-CRUDE-AND-SHARP
  - GMT35-MULTISCALE-SUM
  - GMT35-PLANAR-HAUSDORFF
  - GMT35-ENDPOINT-LOGIC
exercise_counts: { level_a: 5, level_b: 4, level_c: 2, level_d: 0 }
past_exam_alignment: []
integrated_exam_problems: []
estimated_hours: { reading: 12, exercises: 9, review: 5 }
