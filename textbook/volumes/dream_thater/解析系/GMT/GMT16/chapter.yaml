id: GMT16
title: 純非整流性と分解・反例
volume: foundations
status: supplementary
prerequisites:
  - MT8
  - GMT1
  - GMT5
  - GMT10
  - GMT12
  - GMT15
official_scope: []
learning_objectives:
  - 純m非整流部分と可算m整流可能部分の交差がHausdorff m測度零であることを証明できる
  - 有限Hausdorff m測度のBorel集合を最大整流可能部分と純非整流残余へ構成的に分解できる
  - 分解がHausdorff m零集合の移し替えを除いて一意であることを証明できる
  - 四隅Cantor集合の小球密度を上下から評価し円錐外質量による近似接線の失敗を示せる
  - 四進展開を使い同じ純非整流集合の零射影と正射影を具体計算できる
  - 混合集合の整流可能成分で元の集合の密度と接平面を測度微分により移せる
definitions: []
theorems:
  - { id: GMT16-LEM-01, name: 純非整流部分と可算整流可能部分の零交差 }
  - { id: GMT16-THM-01, name: 有限Hausdorff面積集合の整流可能・純非整流分解 }
  - { id: GMT16-LEM-02, name: 四隅Cantor集合には近似接線が存在しない }
  - { id: GMT16-PROP-01, name: 四隅集合の零射影と正射影 }
canonical_examples:
  - 零測度の有限集合が両クラスに入ることと正長線分の対比
  - 線分と平行移動した四隅Cantor集合の有限長混合分解
  - 四隅Cantor集合の全点における近似接線の失敗
  - 水平射影は零長で斜め方向の射影は長さ3/sqrt5の区間となる例
  - 可算稠密零集合の付着後も分解と射影長さが変わらない例
problem_patterns:
