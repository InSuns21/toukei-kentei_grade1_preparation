  - GMT36-CAP-ORTHOGONALITY
  - GMT36-INTERSECTION
  - GMT36-POINTWISE-VS-INTEGRATED
  - GMT36-CAP-TO-TUBE
  - GMT36-WEIGHTED-MULTIPLICITY
