id: "HJC1"
title: "決定論的最適制御・動的計画原理・HJB の導出"
volume: "foundations"
status: supplementary
prerequisites:
  - PDE12
  - ODE8
official_scope: []
learning_objectives:
  - 制御付き ODE、許容制御、制御軌道を定義し、通常の ODE 初期値問題との違いを説明できる
  - running cost・terminal cost・cost functional・value function を区別し、最小化問題として定式化できる
  - 制御の restriction と concatenation を使い、dynamic programming principle を epsilon 近似まで含めて証明できる
  - DPP の短時間分割から時間微分・状態微分・局所最適化が現れる仕組みを追える
  - 最小化規約の optimal-control Hamiltonian を定義し、HJB equation の符号を一貫して書ける
  - 滑らかな value function と十分正則な最適制御の下で、DPP から classical HJB を導出できる
  - smooth verification theorem を chain rule と HJB 不等式から証明し、候補 value function と最適制御を検証できる
  - 一次元有限時間 LQR で quadratic ansatz から Riccati 型 ODE と最適 feedback を導出できる
  - 速度制約付き bang-bang 例で value function を直接求め、HJB を滑らかな領域で確認できる
  - value function が自然に非微分可能になりうることを確認し、次章の粘性解が必要になる動機を説明できる
