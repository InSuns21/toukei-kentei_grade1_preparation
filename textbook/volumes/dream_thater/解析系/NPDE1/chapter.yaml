  - { id: NPDE1-THM-01, name: "Rankine--Hugoniot 条件" }
  - { id: NPDE1-COR-01, name: "定数状態を結ぶ衝撃波速度" }
  - { id: NPDE1-THM-02, name: "狭義凸流束の中心希薄波" }
  - { id: NPDE1-PROP-02, name: "Burgers Riemann 問題の弱解非一意性" }
canonical_examples:
  - Burgers 方程式を保存則の形へ書き直す
  - "u_L=2, u_R=0 の Burgers 衝撃波と速度 s=1"
  - "u_L=0, u_R=1 の Burgers 中心希薄波"
  - "同一 Riemann 初期値に対する expansion shock と rarefaction の共存"
