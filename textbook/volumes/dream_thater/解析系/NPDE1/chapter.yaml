id: "NPDE1"
title: "保存則・衝撃波・Rankine--Hugoniot 条件"
volume: "foundations"
status: supplementary
prerequisites:
  - PDE1
  - GPDE1
official_scope: []
learning_objectives:
  - 一次元スカラー保存則を局所保存の積分収支から導き、滑らかな場合に特性速度 f'(u) を再構成できる
  - 保存則の分布的弱解をテスト関数恒等式として定義し、初期値への局所 L1 収束と区別できる
  - 一本の移動界面をまたぐ部分積分から Rankine--Hugoniot 条件を導出できる
  - 定数状態を結ぶ衝撃波速度を流束の割線勾配として計算できる
  - Riemann 問題を定義し、Burgers 方程式の圧縮型と拡張型を特性速度から説明できる
  - 狭義凸流束の中心希薄波を自己相似変数から導き、弱解であることと初期値への収束を確認できる
  - Burgers の同一 Riemann 初期値に expansion shock と rarefaction が共存することを示し、弱解だけでは一意性がないことを説明できる
definitions:
  - { id: NPDE1-DEF-01, name: "一次元スカラー保存則" }
  - { id: NPDE1-DEF-02, name: "保存則の分布的弱解" }
  - { id: NPDE1-DEF-03, name: "定数状態を結ぶ衝撃波" }
  - { id: NPDE1-DEF-04, name: "Riemann 問題" }
  - { id: NPDE1-DEF-05, name: "中心希薄波" }
theorems:
