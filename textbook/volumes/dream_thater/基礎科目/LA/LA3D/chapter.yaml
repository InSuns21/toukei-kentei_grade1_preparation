id: "LA3D"
title: "交代多重線形形式・抽象行列式"
volume: "foundations"
status: supplementary
prerequisites:
  - LA3C
  - F0-00F
official_scope: []
learning_objectives:
  - 交代多重線形形式を符号付き体積の抽象化として説明できる
  - 最高次交代形式全体が1次元であることを示せる
  - 抽象行列式を最高次交代形式への倍率として定義できる
  - 抽象行列式が体積形式の選択に依存しないことを示せる
  - 抽象行列式と表現行列の行列式が一致することを示せる
definitions:
