id: "SET-U1"
title: "関係・同値関係・商集合"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00A1C
official_scope: []
learning_objectives:
  - 二項関係を直積の部分集合として読み、具体的な関係を集合として書ける
  - 同値関係の反射律・対称律・推移律を個別に検証できる
  - 同値類を計算し、同値類が一致する条件と交わらない条件を説明できる
  - 商集合と標準射影を定義し、標準射影のファイバーが同値類であることを説明できる
  - 同値関係と集合の分割の対応を両方向に構成できる
  - 同値類上で一定な写像を商集合上へ一意に降ろせる
