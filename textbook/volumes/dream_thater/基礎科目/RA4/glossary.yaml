chapter: "RA4"
terms:
  - term: Darboux上和
    english: Darboux upper sum
    meaning: 各小区間での関数の上限と区間幅の積を足した量。
  - term: Darboux下和
    english: Darboux lower sum
    meaning: 各小区間での関数の下限と区間幅の積を足した量。
  - term: Riemann可積分
    english: Riemann integrable
    meaning: 分割を細かくしたとき上積分と下積分が一致すること。
  - term: FTC
    english: Fundamental Theorem of Calculus
    meaning: Fundamental Theorem of Calculus の略語で、日本語では「微積分学の基本定理」。本章ではIを「積分からFを作る主張」、IIを「F'=fから定積分を計算する主張」と呼ぶ。文献によりI・IIの番号づけが逆の場合もある。
  - term: 微積分学の基本定理
    english: Fundamental Theorem of Calculus (FTC)
    meaning: 積分と微分が互いに逆向きの操作であることを、積分から作る関数の微分と定積分の評価公式の二側面から結ぶ定理群。英語名の頭文字からFTCと略す。
