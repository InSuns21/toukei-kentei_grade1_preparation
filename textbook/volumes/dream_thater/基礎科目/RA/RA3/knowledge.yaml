chapter: RA3
scope: dream-theater
coverage: complete
prerequisites:
  - RA2

concepts:
  - id: analysis.differential-coefficient
    name: 微分係数
    kind: definition
    aliases: [微分係数]
    introduction_aliases: [微分係数・微分可能性]
    requires: [analysis.function-limit]

  - id: analysis.derivative
    name: 導関数
    kind: definition
    aliases: [導関数, derivative]
    requires: [analysis.differential-coefficient]

  - id: analysis.differentiable-implies-continuous
    name: 微分可能なら連続
    kind: proposition
    aliases: [微分可能なら連続]
    requires:
      - analysis.differential-coefficient
      - analysis.real-function-continuity

  - id: analysis.product-rule
    name: 積の微分公式
    kind: proposition
    aliases: [積の微分公式]
    requires:
      - analysis.derivative
      - analysis.differentiable-implies-continuous

  - id: analysis.chain-rule
    name: 連鎖律
    kind: proposition
    aliases: [連鎖律, chain rule]
    requires:
      - analysis.derivative
      - analysis.differentiable-implies-continuous
  - id: analysis.higher-derivative
    name: 高階導関数
    kind: definition
    aliases: [高階導関数, k階導関数]
    requires: [analysis.derivative]
  - id: analysis.ck-smoothness-class
    name: C^k級・C∞級
    kind: definition
    aliases: [C^k級, C∞級, 滑らかな関数]
    requires: [analysis.higher-derivative]
  - id: analysis.rolle-theorem
    name: Rolleの定理
    kind: theorem
    aliases: [Rolleの定理]
    requires: [analysis.derivative, analysis.extreme-value-closed-interval]
  - id: analysis.mean-value-theorem
    name: 平均値定理
    kind: theorem
    aliases: [平均値定理, mean value theorem]
    requires: [analysis.rolle-theorem]
  - id: analysis.cauchy-mean-value-theorem
    name: Cauchyの平均値定理
    kind: theorem
    aliases: [Cauchyの平均値定理]
    requires: [analysis.mean-value-theorem]
  - id: analysis.taylor-theorem
    name: Taylorの定理
    kind: theorem
    aliases: [Taylorの定理, Taylor theorem]
    requires: [analysis.mean-value-theorem, analysis.ck-smoothness-class]
  - id: analysis.inverse-derivative
    name: 逆関数の微分
    kind: theorem
    aliases: [逆関数の微分]
    requires: [analysis.derivative]
