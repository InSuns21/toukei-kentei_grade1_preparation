chapter: "F0-00F"
terms:
  - { term: 線形写像, english: linear map, meaning: 加法とスカラー倍を保つ写像。 }
  - { term: 核, english: kernel, meaning: 0へ写る入力全体の部分空間。 }
  - { term: 像, english: image, meaning: 線形写像で到達できる出力全体の部分空間。 }
  - { term: 階数・退化次数の定理, english: rank-nullity theorem, meaning: 定義域の次元がkernelの次元とimageの次元の和になる定理。 }
