chapter: "F0-00C1"
terms:
  - term: 開被覆
    english: open cover
    meaning: 対象集合を和集合で覆う開集合の族。
  - term: 有限部分被覆
    english: finite subcover
    meaning: もとの開被覆から有限個だけを選び、それでも対象集合全体を覆っている部分族。
  - term: コンパクト集合
    english: compact set
    meaning: 任意の開被覆から有限部分被覆を選べる集合。距離空間では点列コンパクト性と同値。
  - term: 点列コンパクト性
    english: sequential compactness
    meaning: 任意の点列が集合内に極限を持つ収束部分列を持つ性質。
  - term: 全有界性
    english: total boundedness
    meaning: 任意の正の半径に対して有限個のその半径の開球で集合を覆える性質。
  - term: Lebesgue数
    english: Lebesgue number
    meaning: 各点のまわりの一定半径の球が、開被覆の要素のどれか一つに収まるような正の半径。
  - term: Heine--Borelの定理
    english: Heine--Borel theorem
    meaning: R^pではコンパクトであることと閉かつ有界であることが同値であるという定理。
