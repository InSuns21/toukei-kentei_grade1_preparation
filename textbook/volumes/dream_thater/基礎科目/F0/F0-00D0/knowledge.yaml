chapter: F0-00D0
scope: dream-theater
coverage: complete
prerequisites:
  - F0-00D
  - F0-00A
  - F0-00A1D
  - TOP2

concepts:
  - id: completion.rational-cauchy-equivalence
    name: 有理Cauchy列の同値関係
    kind: definition
    aliases: [有理Cauchy列の同値関係]
    requires: [topology.cauchy-sequence]

  - id: completion.rational-cauchy-equivalence-relation
    name: 有理Cauchy列上の関係は同値関係
    kind: proposition
    aliases: [有理Cauchy列上の関係は同値関係]
    introduction_aliases: [は同値関係]
    requires: [completion.rational-cauchy-equivalence]

  - id: completion.cauchy-real
    name: Cauchy実数
    kind: definition
    aliases: [Cauchy実数]
    requires: [completion.rational-cauchy-equivalence-relation]

  - id: completion.cauchy-sequence-bounded
    name: Cauchy列は有界
    kind: theorem
    aliases: [Cauchy列は有界]
    requires: [topology.cauchy-sequence]

  - id: completion.cauchy-real-operations-well-defined
    name: 加法・乗法のwell-defined性
    kind: theorem
    aliases: [加法・乗法のwell-defined性]
