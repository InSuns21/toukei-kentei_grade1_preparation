  - id: completion.cauchy-real-order
    name: Cauchy実数の正値性と順序
    kind: definition
    aliases:
      - Cauchy実数の正値性と順序
      - Cauchy 実数の正値性の定義
      - Cauchy 実数の順序定義
    requires: [completion.cauchy-real, completion.cauchy-real-operations-well-defined]

  - id: completion.cauchy-real-ordered-field
    name: Cauchy実数は順序体
    kind: theorem
    aliases: [Cauchy実数は順序体]
    requires: [completion.cauchy-real-order, completion.cauchy-real-operations-well-defined]

  - id: completion.cauchy-real-metric
    name: Cauchy実数の絶対値と距離
    kind: definition
    aliases: [Cauchy実数の絶対値と距離]
    requires: [completion.cauchy-real-ordered-field]

  - id: completion.rational-canonical-embedding
    name: 有理数の定数列埋め込み
    kind: theorem
    aliases: [有理数の定数列埋め込み]
    requires: [completion.cauchy-real-metric]

  - id: completion.rational-density-cauchy-real
    name: Cauchy実数内の有理数稠密性
    kind: theorem
    aliases: [Cauchy実数内の有理数稠密性]
    requires: [completion.rational-canonical-embedding, topology.cauchy-sequence]

  - id: completion.cauchy-real-complete
    name: Cauchy実数の完備性
    kind: theorem
    aliases: [Cauchy実数の完備性]
