id: "F0-00B0"
title: "数列・点列・部分列・十分大きい添字"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00A1C
  - SET-U2
official_scope: []
learning_objectives:
  - 実数列を自然数から実数への写像として定義し、実解析では数列が主役になることを説明できる
  - 点列を実数列の考え方を一般の集合へ広げたものとして定義できる
  - 部分列を狭義単調増加な添字列による抜き出しとして定義できる
  - 「十分大きいn」と「無限回起こる」を量化記号へ戻せる
  - 無限版の鳩ノ巣原理から定数部分列を構成できる
