  - { id: SETU3-PROP-01, name: 区間と自然数のべき集合は同じ濃度 }
  - { id: SETU3-THM-03, name: 実数と自然数のべき集合は同じ濃度 }
canonical_examples:
  - 自然数と正の偶数の濃度
  - 閉区間と開区間の Cantor--Bernstein による比較
  - 対角集合によるべき集合への全射不存在
  - 3進符号化と10進符号化による区間とべき集合の比較
