id: "SET-U3"
title: "濃度・Cantor--Bernstein・Cantor の定理"
volume: "foundations"
status: supplementary
prerequisites:
  - SET-U2
official_scope: []
learning_objectives:
  - 全単射の存在で「同じ濃度」を定義し、具体的な全単射から濃度の等号を証明できる
  - 単射の存在で濃度の大小を比較し、真の大小と区別できる
  - Cantor--Bernstein の定理の構成を追い、二本の単射から全単射を作れる
  - Cantor の定理を対角集合から証明し、任意の集合よりそのべき集合が真に大きいことを説明できる
  - 実数全体と自然数のべき集合が同じ濃度であることを具体的な相互単射から証明できる
  - 可算無限と連続体濃度の違いを、Cantor の定理と SET-U2 の可算性から説明できる
