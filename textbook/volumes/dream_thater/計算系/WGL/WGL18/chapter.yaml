id: WGL18
title: fragment shaderだけで時間発展できる？
volume: foundations
status: supplementary
prerequisites: [WGL17]
official_scope: []
learning_objectives:
  - 4x4格子の零流束境界と五点差分の一段更新を添字付きで導ける
  - rが0以上1/4以下なら非負性と離散総量を保存することを証明できる
  - 同一textureの読み書きを避けるping-pong更新とFBO検査を説明できる
  - GPUのRGBA32F読戻しを独立CPU計算と数値的に照合できる
  - 空間刻みと時間刻みの変更が精度・安定性に与える限界を説明できる
