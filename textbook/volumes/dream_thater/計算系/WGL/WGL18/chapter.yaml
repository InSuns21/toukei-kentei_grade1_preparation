  - { id: WGL18-PROP-02, name: 安定範囲での非負性と最大値原理 }
canonical_examples:
  - 中央付近の1点インパルスから第一・第二ステップの16値
  - 境界で外側の値を自分自身へ複写する更新
  - 2枚のRGBA32Fと交互のFBO読書き・CPU16点照合
