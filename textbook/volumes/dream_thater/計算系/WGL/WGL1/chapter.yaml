id: WGL1
title: ブラウザの画素までの最短経路
volume: foundations
status: supplementary
prerequisites: []
official_scope: []
learning_objectives:
  - HTML canvas から WebGL2 context を取得し、サポート不能時の診断と JS・GLSL の役割分担を説明できる
  - 頂点シェーダとフラグメントシェーダのコンパイル・リンク・draw の順序を自分のコードで再現できる
  - clip 座標と viewport の対応を導出し、三角形内外をCPU側で独立検算できる
  - CSS上の大きさとdrawing bufferを区別し、resize後のviewport更新を実装できる
  - 3タブラボでJS・vertex・fragmentソースを編集し、描画・ピクセル検査・shaderエラー・隔離実行を確認できる
definitions:
  - { id: WGL1-DEF-00, name: 透視除算 }
  - { id: WGL1-DEF-01, name: 描画バッファと画素 }
  - { id: WGL1-DEF-02, name: 正規化デバイス座標と viewport }
  - { id: WGL1-DEF-03, name: シェーダ段階と描画呼出し }
theorems:
  - { id: WGL1-PROP-01, name: 全画面viewportの座標対応 }
  - { id: WGL1-PROP-02, name: 三角形の符号付き面積による内外判定 }
canonical_examples:
  - 三角形の中心・左下背景のRGBA画素を CPU 算術と GPU readPixels で照合
  - 故意のGLSL構文誤りによる段階別コンパイルエラー
  - 描画バッファの寸法変更と viewport の再設定
problem_patterns: [WGL1-COORD, WGL1-PIXEL, WGL1-PIPELINE, WGL1-RESIZE, WGL1-ISOLATION]
past_exam_alignment: []
integrated_exam_problems: []
exercise_counts: { level_a: 4, level_b: 3, level_c: 1, level_d: 0 }
estimated_hours: { reading: 3, exercises: 4, review: 1 }
