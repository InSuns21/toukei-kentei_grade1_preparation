id: WGL7
title: テクスチャ画像はなぜにじみ・ちらつく？
volume: foundations
status: supplementary
prerequisites: [WGL6]
official_scope: []
learning_objectives:
  - UVからテクセル中心と最近傍添字を計算できる
  - REPEAT・CLAMP_TO_EDGE・MIRRORED_REPEATの境界動作を説明できる
  - 双線形フィルタの重みと補間値を導出できる
  - ミップマップの平均化と縮小フットプリントを計算できる
  - チェッカーとRGBA8データテクスチャの標本化・量子化の違いを説明できる
  - JSとGLSLを編集しCPU期待画素とWebGL2 readPixelsを比較できる
