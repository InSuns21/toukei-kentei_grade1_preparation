  - { id: WGL7-PROP-02, name: 交互チェッカーのミップ平均値 }
  - { id: WGL7-PROP-03, name: 本章初期実験の縮小度の下界 }
canonical_examples:
  - 4×2画像のUVから最近傍テクセルを求める
  - 四隅の値を双線形補間する
