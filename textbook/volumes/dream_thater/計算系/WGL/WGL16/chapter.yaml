id: WGL16
title: 同じ形を多数描くと何が速い？
volume: foundations
status: supplementary
prerequisites: [WGL15]
official_scope: []
learning_objectives:
  - 共通のメッシュと各コピー固有の中心・色を分離し位置式と重なりがない条件を確認できる
  - vertexAttribDivisorの0・1・2の意味と属性stride・offsetを説明できる
  - 通常描画とインスタンス描画の画素一致の仮定を示し、反例も説明できる
  - 呼び出し回数・頂点入力・インスタンス属性データ量を数えられる
  - 簡単な費用模型と同期時間計測の限界を区別できる
  - JS/GLSL編集ラボで両方式の全画素比較と独立CPU/GPU検算を行える
definitions:
  - { id: WGL16-DEF-01, name: 正方形メッシュのインスタンス }
  - { id: WGL16-DEF-02, name: 属性除数とインスタンス属性 }
theorems:
  - { id: WGL16-PROP-01, name: 重ならないコピーの描画結果の一致 }
  - { id: WGL16-PROP-02, name: 正方形格子の命令数と頂点数 }
  - { id: WGL16-PROP-03, name: 単純費用模型における高速化条件 }
canonical_examples:
  - 8x8正方形格子の中心と半幅の直接計算
  - 属性除数0・1・2の参照規則
  - 64対1 draw callと384頂点入力、1280バイトのインスタンス属性
  - 320x240の独立CPU予測とGPU6画素比較
  - 通常描画とインスタンス描画の全画素差およびgl.finish含む同期時間
problem_patterns: [WGL16-INSTANCE, WGL16-DIVISOR, WGL16-MESH, WGL16-COUNT, WGL16-PIXEL, WGL16-COST, WGL16-BLEND, WGL16-LAB]
past_exam_alignment: []
integrated_exam_problems: []
exercise_counts: { level_a: 5, level_b: 4, level_c: 1, level_d: 0 }
estimated_hours: { reading: 4, exercises: 4, review: 2 }
