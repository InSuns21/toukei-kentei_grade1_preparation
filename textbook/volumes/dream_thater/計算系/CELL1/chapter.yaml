  - { id: CELL1-DEF-04, name: "時刻発展と反復写像" }
  - { id: CELL1-DEF-05, name: "周期有限環と固定境界区間" }
propositions:
  - { id: CELL1-PROP-01, name: "局所規則からの大域写像の存在と一意性" }
  - { id: CELL1-PROP-02, name: "非負整数時刻の存在と反復の結合法則" }
  - { id: CELL1-PROP-03, name: "固定半径での局所規則の識別" }
theorems: []
canonical_examples:
