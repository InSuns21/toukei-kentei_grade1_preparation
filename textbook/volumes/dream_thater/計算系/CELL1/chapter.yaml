id: "CELL1"
title: "配置・局所規則・大域更新"
volume: "foundations"
status: supplementary
prerequisites:
  - AUT1
official_scope: []
learning_objectives:
  - 有限状態集合と無限線上の配置を写像として定義し、直接例で条件を検証できる
  - 半径と局所規則を指定して規則表を復元し、全配置の同期更新式を記述できる
  - 局所規則から大域写像が存在し一意となることを全整数位置について証明できる
  - 非負整数時刻の反復を帰納的に構成し、反復の結合法則を証明できる
  - 周期有限環・固定境界・無限線の区別と同時更新・逐次更新の違いを具体計算できる
  - 恒等規則・左右シフト・定数規則の性質および固定半径での局所規則の識別を証明できる
  - 有限環と無限線における局所規則の同一性と長期挙動の差を論証できる
definitions:
  - { id: CELL1-DEF-01, name: "状態集合と配置" }
  - { id: CELL1-DEF-02, name: "半径と局所規則" }
