  - COMB10-CARTESIAN-PRODUCT
  - COMB10-ORDERED-SEQUENCE
  - COMB10-ZERO-SIZE-COUNTEREXAMPLE
  - COMB10-RECURSIVE-SPECIFICATION
  - COMB10-TREE-CONVOLUTION
  - COMB10-UNORDERED-CAUTION
