id: COMB16
title: "重み付き計数と q-二項係数"
volume: "foundations"
status: supplementary
prerequisites:
  - COMB2
  - COMB4
  - COMB9
  - COMB13
forward_references: []
official_scope: []
learning_objectives:
  - 有限対象に二統計を与え、二変数重み付き多項式の係数を実際の対象数として解釈できる
  - 加法・乗法の成立条件を証明し、連結で生じる交差項と区別できる
  - 単調格子路の面積を位置の組として定義し、初歩的な路で直接検算できる
  - 最初または最後の一歩による二方向の q-Pascal 漸化式と初期値を導出できる
  - q-二項係数の積公式が多項式となる理由と q=1 の評価を説明できる
  - 語の反転による対称性と有限 q-二項定理の補正指数を証明できる
  - q-Vandermonde の交差面積を導出し、格子点通過制約の重み付き計数に適用できる
definitions:
  - { id: COMB16-DEF-01, name: 有限集合の重み付き計数多項式 }
  - { id: COMB16-DEF-02, name: 単調格子路の面積統計 }
  - { id: COMB16-DEF-03, name: q-二項係数 }
theorems:
  - { id: COMB16-PROP-01, name: 重み付き計数の加法・乗法 }
  - { id: COMB16-THM-01, name: 面積多項式の二方向の漸化式 }
  - { id: COMB16-THM-02, name: q-Pascal の二つの漸化式 }
  - { id: COMB16-THM-03, name: q-二項係数の積公式 }
  - { id: COMB16-PROP-02, name: q-二項係数の対称性と次数 }
  - { id: COMB16-THM-04, name: 有限 q-二項定理 }
  - { id: COMB16-THM-05, name: q-Vandermonde の畳み込み }
canonical_examples:
  - 長さ三の二値語での二変数多項式の係数抽出
  - 幅二高さ一および二の面積分布の直接列挙
  - 最初・最後の一歩の二方向の漸化式の一致
  - q-二項係数の積表示と q=1 の境界
  - n=3 の有限 q-二項定理と補正指数
  - 指定格子点を通る路の交差面積
problem_patterns:
  - COMB16-WEIGHT-INVENTORY
  - COMB16-WEIGHT-DISJOINT-PRODUCT
  - COMB16-PATH-AREA
  - COMB16-Q-PASCAL
  - COMB16-GAUSSIAN-PRODUCT
  - COMB16-Q-SYMMETRY
  - COMB16-Q-BINOMIAL-THEOREM
  - COMB16-Q-VANDERMONDE
exercise_counts: { level_a: 5, level_b: 5, level_c: 2, level_d: 0 }
estimated_hours: { reading: 5, exercises: 6, review: 2 }
