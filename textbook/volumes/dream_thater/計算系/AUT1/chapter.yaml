id: "AUT1"
title: "文字列・形式言語・判定問題"
volume: "foundations"
status: supplementary
prerequisites:
  - F0-00A
official_scope: []
learning_objectives:
  - 有限アルファベット、文字列、空文字列、長さ、Sigma star を定義し具体的に列挙できる
  - 連結の結合法則と単位元を位置ごとの記号から証明し、非可換性と区別できる
  - 形式言語を文字列全体の部分集合として記述し、空言語と空文字列だけの言語を区別できる
  - 判定問題と特性関数の一対一対応を構成し、写像の存在と計算可能性の違いを説明できる
  - 自然数や論理式の入力符号化と符号長を検討し、単射と一意に復号可能な列符号化を区別できる
  - 偶数個の1を含む言語の連結に関する閉性を証明し、他の言語の反例を構成できる
