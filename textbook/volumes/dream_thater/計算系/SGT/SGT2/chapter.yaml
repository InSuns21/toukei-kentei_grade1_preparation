id: "SGT2"
title: "正規化Laplacianとランダムウォーク"
volume: "foundations"
status: supplementary
prerequisites:
  - SGT1
  - F0-00F1
official_scope: []
learning_objectives:
  - 正次数集合を区別し、孤立頂点で逆行列を定義しない理由を具体例で説明できる
  - 対称正規化Laplacianとrandom-walk Laplacianの相似性を証明し、非一様重みの例で計算できる
  - 正規化Dirichletエネルギー、固有値の区間[0,2]、零空間と連結成分の対応を導出できる
  - 遷移行列・詳細釣合い・次数に比例する定常分布を導き、連結時の一意性を証明できる
  - 次数付き内積と正規化第二固有値の変分表示を証明し、周期2の反例で定常性と収束を区別できる
definitions:
  - { id: SGT2-DEF-01, name: 正次数頂点集合 }
  - { id: SGT2-DEF-02, name: 対称正規化Laplacianとrandom-walk Laplacian }
  - { id: SGT2-DEF-03, name: 重み付きランダムウォークの遷移行列 }
  - { id: SGT2-DEF-04, name: 詳細釣合い }
theorems:
