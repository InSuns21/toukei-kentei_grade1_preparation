  - { id: SGT2-THM-02, name: 正規化スペクトルの範囲と核 }
  - { id: SGT2-THM-03, name: 次数分布の詳細釣合いと定常性 }
  - { id: SGT2-THM-04, name: 連結グラフの定常分布の一意性 }
  - { id: SGT2-PROP-02, name: 遷移行列の重み付き自己随伴性 }
  - { id: SGT2-THM-05, name: 正規化第二固有値の変分表示 }
canonical_examples:
  - 重み2と1の三頂点道と孤立頂点の定義域比較
