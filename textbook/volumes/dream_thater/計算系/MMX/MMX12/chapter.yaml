id: MMX12
title: "companionのcompressor・exact・descent：タグ付き置換をoracleにしたネットワーク圧縮、サイズと複製数の台帳"
volume: foundations
status: supplementary
prerequisites: [MMX11, TSP6]
official_scope: []
learning_objectives:
  - 距離の二乗不等式から整数幅の厳密なモチーフ変換を導ける
  - 六地点の係数とlaneの割当を追って縮小段階の費用を計算できる
  - portsを用いた次数復元と反復エネルギーの幾何級数を導ける
  - タグ付き置換の整列と表引きにより厳密降下のサイズを見積もれる
  - 格子による借用wireの再利用とギャップの再規格化を計算できる
  - 償却圧縮のサイズ・境界・複製数を独立に管理できる
