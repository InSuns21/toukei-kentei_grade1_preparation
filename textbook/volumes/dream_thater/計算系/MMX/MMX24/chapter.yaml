id: MMX24
title: "sorting：stable sorting・batched table lookup、$2^u$ recordsで幅$O(u)$、$p<2$ の指数台帳"
volume: foundations
status: supplementary
prerequisites: [MMX15, MMX23]
official_scope: []
learning_objectives:
  - 安定整列を元位置のタグと隣接順序検査から実現できる
  - 長幅輸送仮定から通常幅整列の指数を導ける
  - 局所パックと大域整列の枠数および費用を評価できる
