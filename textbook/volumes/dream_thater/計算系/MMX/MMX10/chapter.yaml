id: MMX10
title: "spectral priceの曲率・完備化・ultralimit・積・合同と拡張条件、Euclid flatと非平坦空間の違い"
volume: foundations
status: supplementary
prerequisites: [MMX9, TSP12, NPCG6]
official_scope: []
learning_objectives:
  - 完備化と点付き超極限で価格の整合性を保存する理由を説明できる
  - 一点拡張の中心縮約と漸近スペクトル双対性による矛盾を再構成できる
  - 交差分解の階数指数を導きノルム剛性から非正曲率を示せる
  - 距離直積の曲率とスペクトル価格の加法性を区別できる
  - 平坦価格の斉次化と合同不変な Hilbert 空間上の価格の構成を条件付きで導ける
