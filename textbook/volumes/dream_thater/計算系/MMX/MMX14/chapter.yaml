id: MMX14
title: "同 companionのmodel/compress/gap/batch：ports側の符号付き普遍計数テンソルと厳密なbatch下界、その証明依存と対角線論法"
volume: foundations
status: supplementary
prerequisites: [MMX12, MMX13, GCT2, GCT16, ACOMP9]
official_scope: []
learning_objectives:
  - 普遍機械の符号付き計数と固定長推測の一意性を説明できる
  - 計数多項式の VNP 所属を真理値表から導ける
  - 圧縮展開の共有幅と私有幅を別々に評価できる
  - 二つの公開時計の記録生成・経路数保存・費用を計算できる
  - 有限体の線形写像で縮約を受理経路数に変換できる
  - 厳密バッチ下界の対角線論法と k に一様な閾値を再構成できる
