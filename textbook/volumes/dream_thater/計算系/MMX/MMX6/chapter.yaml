id: MMX6
title: "任意標数の分離補題、任意の体への9/4上界、Amanov–van den Berg–Zuiddamの証明とShpilka解説の照合"
volume: foundations
status: supplementary
prerequisites: [MMX5, ACOMP4, ACOMP21, ACOMP22]
official_scope: []
learning_objectives:
  - 切断多項式環と局所代入を使って任意標数の共有脚分離を再現できる
  - 多項式補間と固定頻度語から共有脚の評価を導ける
  - 行列式による核の分離と離散増大率の標数非依存性を説明できる
  - 代数閉包から有限拡大と座標計算を経て任意の体への指数移行を証明できる
  - 三つの上界証明の道具と主張の範囲を区別できる
