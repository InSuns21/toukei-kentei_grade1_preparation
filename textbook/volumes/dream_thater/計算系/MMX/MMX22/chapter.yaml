id: MMX22
title: "fermions・sphere：外積の縮約と符号、marked pointで定義される球面テンソル、衝突時の分解と脚幅"
volume: foundations
status: supplementary
prerequisites: ["MMX21","MMX8","LA3E"]
official_scope: []
learning_objectives:
  - 半整数エネルギーの外積基底を列挙し任意標数で縮約符号を計算できる
  - 印付き点の球面テンソルを構成し極と斉次性を説明できる
  - 内部組と外部への移動に分けて融合公式を再構成できる
  - 母関数と自己共役分割から脚幅の増加率を求められる
  - 重み付き枠を用いて任意の行列単位の融合による実現とエネルギー上界を証明できる
  - 球面テンソルの輸送上界と二次費用への接続を説明できる
