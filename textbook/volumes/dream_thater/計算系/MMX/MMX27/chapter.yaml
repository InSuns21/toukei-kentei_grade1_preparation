id: MMX27
title: "assembly・shaving：代替配線の符号化、routing・lookup・和の費用、複製数$d\\le n^{o(1)}$と圧縮定理の証明"
volume: foundations
status: supplementary
prerequisites: [MMX24, MMX26]
official_scope: []
learning_objectives:
  - 通信記録の重み付き和と一意な固定実現を説明し、容量別席と断片費用を導ける
  - 共通住所と局所記録による各段の処理費用を見積もり、二進群の相関計算を再現できる
  - 項別予算から固定ネットワークのサイズと端子数の上界を導ける
  - 乗法行列の鎖による有限拡大からの降下を証明できる
  - 複製数と指数の余裕を評価し、三価圧縮の定理を証明できる
