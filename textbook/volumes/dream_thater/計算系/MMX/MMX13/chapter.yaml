id: MMX13
title: "Circuit lower bounds companionの比較・entropy・product theorem：no-ports側のグラフentropy boundを導く"
volume: foundations
status: supplementary
prerequisites: [MMX10, MMX11, INFO4]
official_scope: []
learning_objectives:
  - 定常歩道の重心平滑化と雲の置換から対数的 Poincaré 障壁を導ける
  - ラベル抽出とランプ変位の符号化から観測エントロピー比較を証明できる
  - 対分布の対称化と自己対を用いて異なる周辺分布のグラフ比較を導ける
  - 平坦格子の共通 Euclid 成分を分離して冪実現可能表を抽出できる
  - 中点拡張と極小クラスの論証から積閉部分クラスの存在を導ける
  - 均衡切断による回路分解と価格の一次節約の条件付き下界を計算できる
