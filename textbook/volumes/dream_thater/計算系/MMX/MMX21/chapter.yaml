id: MMX21
title: "boundary・contact・sync：厳密saving仮定から動きを排除し、複数のtensorを同じprice拡張で評価する"
volume: foundations
status: supplementary
prerequisites: ["MMX20","MMX19","MMX10","MMX2"]
official_scope: []
learning_objectives:
  - 入力追加と動径収縮に対する幅エネルギーの費用差を導ける
  - 方向積分比較と最小原理から固定三脚の接触伝播を再構成できる
  - 四地点衝突から解析的地点族の動きが指数下界を強制することを説明できる
  - 付値付き価格の拡張判定と固定化目的の近似式を証明できる
  - 厳密節約仮定の下で円板の最小地点を固定し独立パラメータから同期へ移れる
  - 全混合積の判定から有理関数族も含む単一価格拡張を構成できる
