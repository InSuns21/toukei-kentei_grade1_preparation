learning_objectives:
  - 形式的な多出力算術回路で行列積のサイズを定義し出力下界を証明できる
  - 指数の下限と達成を区別しStrassenの七積の全成分を展開できる
  - ブロック再帰の演算数と零埋めによる全サイズの上界を導出できる
  - 算術演算数とビット計算及び実測性能を区別できる
