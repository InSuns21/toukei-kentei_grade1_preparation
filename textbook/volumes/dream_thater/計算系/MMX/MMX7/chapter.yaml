learning_objectives:
  - 三つの辺の増大率から長方形行列積指数を定義できる
  - 重みの同次性・置換不変性・単調性を証明できる
  - 正方ブロック分割と三方向のテンソル積から上下界を導ける
  - 双対行列積指数とその上界の仮定を区別できる
  - 正方形上界と長方形専用算法の上界を比較できる
