learning_objectives:
  - 短住所の変位評価と有限価格検査から輸送総幅を一様に抑えられる
  - 固定プールと幅指数の帰納法で長幅輸送仮定を導ける
  - 多種球面の脚幅と縫合を跨ぐ係数恒等式を検算できる
  - 初期配線を二球面に表現するエネルギーと制御費用を評価できる
  - 局所アリティ集中の最大幅・二乗和・総幅とホストの制約を導ける
