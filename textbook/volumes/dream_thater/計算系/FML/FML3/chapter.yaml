id: "FML3"
title: "多変数多項式・環準同型・算術回路の形式化"
volume: foundations
status: supplementary
prerequisites: [FML2, AG1-01, AG1-02, AG1-03, ACOMP1, ACOMP2, ACOMP3, ACOMP4]
official_scope: []
learning_objectives:
  - MvPolynomial の係数と評価値を区別する
  - 有限体で異なる多項式が同じ関数を定めることを証明する
  - 変数と係数の像を指定する評価準同型を使う
  - 型付きのレジスタ列で共有を表し演算サイズを数える
  - 回路の評価と準同型の交換を帰納法で証明する
