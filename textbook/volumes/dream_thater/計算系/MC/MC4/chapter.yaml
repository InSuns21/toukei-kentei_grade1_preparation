id: "MC4"
title: "Multilevel Monte Carlo"
volume: "foundations"
status: supplementary
prerequisites:
  - MC3
official_scope: []
learning_objectives:
  - 近似階層の期待値を望遠鏡和へ分解し、レベル補正の期待値の和として表せる
  - 隣接レベルを同じ基礎乱数で結合する目的を、レベル差の分散を小さくすることとして説明できる
  - Multilevel Monte Carlo 推定量の不偏性と分散を、レベル間独立性を確認して導出できる
  - 最終対象に対する二乗平均誤差を離散化バイアスの二乗とレベル別標本分散の和へ分解できる
  - 分散制約の下で総計算費用を最小にする標本配分が N_l proportional to sqrt(V_l/C_l) となることを Cauchy--Schwarz の不等式から導ける
  - バイアス率 alpha、レベル分散減衰率 beta、レベル費用増加率 gamma から MLMC の計算量を三つの場合に分けて導ける
  - 量子化近似の直接例で alpha=1、beta=2、gamma=1 を確認し、単一レベル Monte Carlo と MLMC の計算量を比較できる
  - 独立に生成した隣接レベルではレベル差の分散が減衰しない反例を計算し、結合が MLMC の核心であることを説明できる
  - 実装時に予備標本からレベル分散と費用を推定し、バイアス・標本分散・整数丸めを分けて管理できる
definitions:
  - { id: MC4-DEF-01, name: レベル間結合 }
  - { id: MC4-DEF-02, name: Multilevel Monte Carlo 推定量 }
  - { id: MC4-DEF-03, name: MLMC の率指数 }
theorems:
  - { id: MC4-THM-01, name: MLMC 推定量の期待値と分散 }
  - { id: MC4-PROP-01, name: MLMC の二乗平均誤差分解 }
  - { id: MC4-THM-02, name: 費用最小化のための最適標本配分 }
  - { id: MC4-THM-03, name: MLMC の計算量評価 }
canonical_examples:
  - U の二進量子化 Q_l を同じ U で結合したレベル補正
  - 同じ量子化近似を独立な U と V で差し引くとレベル分散が減衰しない反例
  - alpha=1、beta=2、gamma=1 の階層で MLMC が epsilon^{-2} 費用になる例
