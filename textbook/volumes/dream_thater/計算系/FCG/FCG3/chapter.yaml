  - { id: FCG3-DEF-03, name: "半Lagrange染料更新" }
theorems:
  - { id: FCG3-PROP-01, name: "双線形更新の値域不増大" }
  - { id: FCG3-PROP-02, name: "回転の厳密な逆追跡と一周後の復元" }
  - { id: FCG3-PROP-03, name: "非保存性と数値拡散の区別" }
canonical_examples:
  - "4個の格子値から足点値を双線形重みで求める"
