learning_objectives:
  - "液体領域の零等位集合と符号付き距離を区別し、符号・勾配・直接例を検証できる"
  - "Level Set輸送方程式を特性曲線から導き、せん断流の解析界面と面積不変を証明できる"
  - "半Lagrange双線形移流とGodunov再初期化を実装し、距離勾配と面積誤差を分けて調べられる"
