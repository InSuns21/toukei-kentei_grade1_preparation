chapter: FCG2
terms:
  - term: 受動スカラー
    english: passive scalar
    meaning: 水の流れに運ばれるが速度場そのものに影響しない濃度のような量
  - term: 差動回転
    english: differential rotation
    meaning: 半径によって角速度が異なり、染料の帯が引き伸ばされる回転運動
  - term: 移流
    english: advection
    meaning: 流れに沿って量が運ばれる現象。本講では拡散なしの特性曲線で厳密解を得る
  - term: R8正規化テクスチャ
    english: normalized R8 texture
    meaning: 1セルの濃度を8bit整数へ丸め、シェーダから0～1へ正規化した値を読むGPU形式
  - term: 物理格子
    english: physical grid
    meaning: 1m×1mの領域の128×128セル中心に置いた濃度標本
  - term: 描画フレーム
    english: rendering frame
    meaning: ある物理時刻の濃度を再表示する機会。物理時刻や移流計算の段数と別
