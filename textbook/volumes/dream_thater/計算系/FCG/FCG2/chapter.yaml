id: FCG2
title: "WebGL2で物理データを描くには"
volume: foundations
status: supplementary
prerequisites: [FCG1, WGL17]
official_scope: []
learning_objectives:
  - "8×8の解析スカラー場を物理時刻に従って更新し、PDE解法と区別できる"
  - "下原点の格子添字と画素中心UVの対応を導きクリック位置を検算できる"
  - "R8正規化テクスチャの量子化誤差とGPU表示誤差を分けて評価できる"
  - "CPU更新・二枚の交互テクスチャ転送・描画フレームを区別できる"
  - "共通ラボでJS・両GLSLを編集、再コンパイルしGPU画素と独立CPU基準を比較できる"
definitions:
  - { id: FCG2-DEF-01, name: "解析スカラー場の時刻別格子標本" }
  - { id: FCG2-DEF-02, name: "表示用R8テクスチャ時刻スナップショット" }
theorems:
  - { id: FCG2-PROP-01, name: "画素中心と格子セルの一意な対応" }
  - { id: FCG2-PROP-02, name: "解析格子場の値域と格子総和" }
canonical_examples:
  - "時刻1・格子(1,1)の値からR8整数150を計算する"
  - "320×240画面の画素(60,45)を格子(1,1)へ戻す"
  - "時刻0/2と1/3の模様の違いを解析値で確認する"
  - "JS場更新とGLSL色変換を別々に編集しGPU画素を検証する"
problem_patterns: [FCG2-FIELD, FCG2-INDEX, FCG2-R8, FCG2-TIME, FCG2-SUM, FCG2-FLIP, FCG2-SHADER, FCG2-INTEGRATED]
