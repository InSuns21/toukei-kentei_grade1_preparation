id: FCG2
title: "渦で染料はどう変形する？――物理の移流をWebGL2で描く"
volume: foundations
status: supplementary
prerequisites: [FCG1, WGL17]
official_scope: []
learning_objectives:
  - "発散ゼロの差動回転速度場で受動染料が引き伸ばされる機構を式と実画面で説明できる"
  - "移流方程式の特性曲線から厳密濃度を導き、値域と面積積分の保存を証明できる"
  - "128×128物理格子・R8テクスチャ・表示画素の解像度を区別して検算できる"
  - "omega/shear/amplitudeを実編集JavaScriptへ結び付け、剛体回転・差動回転・静止を比較できる"
  - "JS・頂点GLSL・フラグメントGLSLを編集し、独立CPU濃度とGPU画素を確認できる"
definitions:
  - { id: FCG2-DEF-01, name: "厳密移流スカラー場の時刻別格子標本" }
  - { id: FCG2-DEF-02, name: "表示用R8テクスチャ時刻スナップショット" }
theorems:
  - { id: FCG2-PROP-01, name: "画素中心と格子セルの一意な対応" }
  - { id: FCG2-PROP-02, name: "差動回転における染料の値域と面積積分保存" }
canonical_examples:
  - "二つの半径の角速度差から染料の伸長を予測する"
  - "128×128格子の初期セル(97,64)から濃度・R8・RGBA8を得る"
  - "512×512描画画素(130,302)を移流中の格子(32,75)へ戻す"
  - "shear=0と3の移流差、omega=0の停止、色だけの編集を比較する"
problem_patterns: [FCG2-FIELD, FCG2-INDEX, FCG2-R8, FCG2-TIME, FCG2-SUM, FCG2-FLIP, FCG2-SHADER, FCG2-INTEGRATED]
