id: "FFT2"
title: "有限可換群のFourier変換・双対群・文字表のテンソル積"
volume: foundations
status: supplementary
prerequisites: [FFT1, MOD2, TSP1, TSP5]
official_scope: []
learning_objectives:
  - 有限可換群の巡回因子から群の位数と指数を判定できる
  - 体の標数と原始根の存在条件を区別し有限体で判定できる
  - 双対群の全ての文字を列挙し文字表のKronecker積表示を導出できる
  - 文字の直交性と反転を導出して二軸の変換を計算できる
  - 標数2でWalsh変換が退化する理由を説明できる
