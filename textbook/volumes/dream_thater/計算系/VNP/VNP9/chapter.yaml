id: VNP9
title: "D：等号解析とEuclid cube、flatまたはcontracting"
volume: foundations
status: supplementary
prerequisites: [VNP8, VNP7, VNP3, NPCG6]
official_scope: []
learning_objectives:
  - 階数別平均の等号から横断四辺形の各等号を導ける
  - 外積分解の交換と符号反転から交差項が零になることを証明できる
  - 等号priceの全点対の距離を階数から求められる
  - 立方体頂点から内部への等長拡張を証明し平坦仮説と収縮仮説の少なくとも一方を導ける
