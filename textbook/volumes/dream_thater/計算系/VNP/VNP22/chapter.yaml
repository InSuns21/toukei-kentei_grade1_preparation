learning_objectives:
  - 排他的選択構成から格子和のHamilton閉路表示と頂点数を導出できる
  - 格子和の代入条件から節和および二つの場合の回路下界を再構成できる
  - 係数方程式と零点定理による同標数の回路移送を説明できる
  - 全標数の量化と標数2の例外を区別しクラス分離を証明できる
