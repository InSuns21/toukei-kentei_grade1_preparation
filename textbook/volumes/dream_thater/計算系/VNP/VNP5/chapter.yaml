learning_objectives:
  - 混合評価と被覆費用の下限を構成し上評価関数の条件を証明できる
  - 指定配列の評価を固定する正規化を再構成できる
  - 全wireの積の保存から古い各距離の保存を導ける
  - 有限集合上の近似と有限交差性から一般集合への拡張を説明できる
  - 共通乱数で線分とfanを構成し縦横の距離を評価できる
