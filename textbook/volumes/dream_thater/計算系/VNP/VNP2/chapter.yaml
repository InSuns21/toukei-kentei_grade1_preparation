id: VNP2
title: "A：多party tensor・wire・restriction・cover・push-forward"
volume: foundations
status: supplementary
prerequisites: [VNP1, TSP15, TSP16, TSP6]
official_scope: []
learning_objectives:
  - 有限party集合上の係数配列と局所制限を座標で計算できる
  - 被覆を局所制限の和として構成し直和からの制限との同値を証明できる
  - 任意のparty写像のpush-forwardを計算し積・合成・被覆の保存を証明できる
  - wireの基本比較と中央のpartyでの縮約を再現できる
