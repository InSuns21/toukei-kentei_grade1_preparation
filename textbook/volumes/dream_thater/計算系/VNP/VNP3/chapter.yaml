learning_objectives:
  - 被覆型スペクトル点を既習の加法型と区別し定義を検証できる
  - 対角資源の冪評価と擬距離および木の不等式を導ける
  - 二ハブの局所行列を構成し階数を長さへ変換できる
  - priceの極限と引き戻しを説明し評価のスケールを区別できる
  - 均衡分割の回路分解を証明してゲート数の不等式を得られる
