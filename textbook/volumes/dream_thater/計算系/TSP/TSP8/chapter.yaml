learning_objectives:
  - Zariski閉包から境界階数を定義し通常の階数と区別できる
  - 小行列式を使って平坦化による境界階数下界を証明できる
  - 三因子の階数3・境界階数2の例を多項式展開と平坦化で検算できる
  - 多因子Segre写像と割線多様体を構成し境界階数との同値性を証明できる
  - 多項式パラメータによる退化を構成しKronecker積で繰り返せる
