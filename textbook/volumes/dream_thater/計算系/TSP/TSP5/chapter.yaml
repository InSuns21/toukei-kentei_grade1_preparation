id: "TSP5"
title: "直和・Kronecker積・制限の前順序"
volume: "foundations"
status: supplementary
prerequisites:
  - TSP4
  - CAT1-02
official_scope: []
learning_objectives:
  - 直和とKronecker積を各因子の空間と基底表示から構成できる
  - 制限の反射律と推移律を証明し制限同値と半順序を説明できる
  - 直和とKronecker積が制限と両立することを局所写像の構成で証明できる
  - 対角テンソルの直和とKronecker積を標準基底の対応で計算できる
  - 階数・劣階数の加法評価と乗法評価を証明し繰り返し使用の評価に適用できる
