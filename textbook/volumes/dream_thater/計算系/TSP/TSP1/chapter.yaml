learning_objectives:
  - 任意の体上で多重線形写像と直積上の線形写像を区別できる
  - 多因子テンソル積の普遍性を説明し有限次元で構成できる
  - 単純テンソルの基底展開と次元公式を導き一意性を証明できる
  - 各因子の基底変換からテンソルの座標変換を導ける
  - 普遍性を利用して多重線形写像の線形化と因子の置換を構成できる
