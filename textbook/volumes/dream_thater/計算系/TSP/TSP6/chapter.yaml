id: "TSP6"
title: "テンソルネットワーク・縮約・wire：グラフの境界テンソル"
volume: "foundations"
status: supplementary
prerequisites:
  - TSP5
official_scope: []
learning_objectives:
  - 添字の縮約を計算し固定座標での規約とスカラー値の線形写像による評価を区別できる
  - 接続関係と境界順序から境界テンソルの係数式を構成できる
  - 縮約順序の独立性を有限和から証明し計算量の違いを評価できる
  - 恒等wireの挿入と除去が境界テンソルを保存することを証明できる
  - 切断の接続長から平坦化階数の上界を導き実現不可能性を判定できる
  - 三角形の接続の境界テンソルを基底展開できる
