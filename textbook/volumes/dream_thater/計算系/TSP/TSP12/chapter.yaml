id: "TSP12"
title: "Strassen漸近スペクトル双対性：仮定・証明の骨格と例"
volume: "foundations"
status: supplementary
prerequisites:
  - TSP11
  - F0-00A3
official_scope: []
learning_objectives:
  - 劣指数的な補助資源を用いた漸近比較を定義し閉包性を示せる
  - 消去則と全前順序への拡張からスペクトル点の分離を証明できる
  - 極値の達成と階数・劣階数公式を導出し追加条件の役割を説明できる
  - 三因子テンソルの追加条件を制限の具体計算から確認できる
  - 追加条件を失う反例で漸近比較と劣階数の違いを判定できる
definitions:
  - { id: TSP12-DEF-01, name: "漸近前順序" }
theorems:
  - { id: TSP12-THM-01, name: "漸近前順序の閉包性" }
  - { id: TSP12-THM-02, name: "閉じた前順序の消去則と間隔" }
  - { id: TSP12-THM-03, name: "全前順序への拡張" }
  - { id: TSP12-THM-04, name: "全前順序から得るスペクトル点" }
  - { id: TSP12-THM-05, name: "Strassen漸近スペクトル双対性" }
  - { id: TSP12-THM-06, name: "スペクトル極値と漸近階数・漸近劣階数" }
  - { id: TSP12-THM-07, name: "三因子テンソルのスペクトル極値公式" }
canonical_examples:
  - 非負有理数の漸近比較
  - 三因子テンソルの平坦化と対角テンソルへの制限
  - 非負整数係数多項式の劣階数反例
