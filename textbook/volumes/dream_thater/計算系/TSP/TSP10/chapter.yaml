id: "TSP10"
title: "前順序付き可換半環と自然数の埋込み"
volume: "foundations"
status: supplementary
prerequisites:
  - TSP9
official_scope: []
learning_objectives:
  - 可換半環と演算に両立する前順序の条件を例と反例から説明できる
  - 自然数からの標準写像の演算保存性と順序の忠実性を区別できる
  - 制限同値類上の演算の代表元独立性と半環公理を基底対応から証明できる
  - Strassen前順序の二条件をテンソルについて証明できる
  - 自然数による階数と劣階数の評価を抽象半環で導き仮定の限界を説明できる
