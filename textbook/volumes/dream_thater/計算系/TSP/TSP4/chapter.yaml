id: "TSP4"
title: "制限・劣階数・対角テンソルと局所線形写像"
volume: "foundations"
status: supplementary
prerequisites:
  - TSP3
official_scope: []
learning_objectives:
  - 各因子の線形写像からテンソル積上の写像を構成し成分を計算できる
  - 制限の向きを理解し階数と平坦化の階数の単調性を証明できる
  - 対角テンソルを用いて階数と劣階数を特徴付け基本評価を証明できる
  - 二因子での一致と三因子以上での不一致を具体的に示せる
