id: "TSP16"
title: "被覆・劣乗法的gauge・極限の準備：順序と凸性、一般スペクトルとの境界"
volume: foundations
status: supplementary
prerequisites: [TSP15]
official_scope: []
learning_objectives:
  - 前順序付き半環上の有限被覆を定義し費用の下限を計算できる
  - 被覆gaugeの単調性・劣加法性・劣乗法性を証明できる
  - Fekete補題の仮定を確認して冪の費用の極限を導ける
  - 分数被覆の凸性と価格による下界を示しスペクトル点との差を説明できる
