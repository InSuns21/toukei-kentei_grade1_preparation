id: "TSP7"
title: "行列積テンソルと双線形複雑性"
volume: "foundations"
status: supplementary
prerequisites:
  - TSP6
official_scope: []
learning_objectives:
  - 双線形写像を基底の組で評価して係数テンソルを構成し入力で評価できる
  - 双線形複雑性とテンソル階数の一致を両方向の変換と係数の一意性から証明できる
  - 長方形行列積テンソルの三因子の次元と平坦化階数を求め上下界を導ける
  - Strassenの七つの積と出力の組立てを展開して検算できる
  - 行列積テンソルのKronecker積を添字の付け替えで求められる
  - 再帰算法の乗算数と加減算数を区別して計算し階数上界と最小値を区別できる
