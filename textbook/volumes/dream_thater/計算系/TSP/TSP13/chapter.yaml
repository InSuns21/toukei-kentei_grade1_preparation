id: "TSP13"
title: "support functionals・エントロピーによるスペクトル評価"
volume: foundations
status: supplementary
prerequisites: [TSP12, INFO2, RA3]
official_scope: []
learning_objectives:
  - 台と周辺分布から重み付きエントロピーを計算できる
  - 基底最小化の必要性と局所線形写像による単調性を証明できる
  - 積と直和の評価を周辺分布と相対エントロピーから導出できる
  - 対角正規化と漸近劣階数の上界を証明し三項テンソルで計算できる
  - 劣乗法性とスペクトル点の乗法性を区別できる
