  - { id: TSP13-THM-03, name: "対角テンソルの一因子固定項の下界" }
  - { id: TSP13-THM-04, name: "上側support functionalの対角正規化" }
  - { id: TSP13-THM-05, name: "台エントロピーによる漸近劣階数の上界" }
