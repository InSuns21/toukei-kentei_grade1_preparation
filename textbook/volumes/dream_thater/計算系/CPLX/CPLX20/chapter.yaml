  - { id: CPLX20-THM-02, name: "ZPPと片側誤りの共通部分" }
  - { id: CPLX20-THM-03, name: "BPPはP/polyに含まれる" }
propositions:
  - { id: CPLX20-PROP-01, name: "片側誤りの増幅" }
  - { id: CPLX20-PROP-02, name: "乱択クラスの基本包含" }
  - { id: CPLX20-PROP-03, name: "短い種を全探索する脱乱択化" }
