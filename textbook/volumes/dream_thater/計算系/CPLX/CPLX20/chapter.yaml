id: "CPLX20"
title: "乱択計算"
volume: "foundations"
status: supplementary
prerequisites:
  - CPLX19
official_scope: []
learning_objectives:
  - 入力固定・乱数上の確率・最悪実行時間を明記して多項式時間乱択機械を定義し、具体的な乱数表を検算できる
  - RP・coRP・BPP・ZPPの誤り方向と時間条件を比較し、直接例で条件を確認できる
  - 独立な繰返しの片側誤りと多数決による両側誤りの増幅を、確率の積と指数モーメントから証明できる
  - ZPP=RP∩coRPを打切りと再試行の両方向で証明し、期待時間と最悪時間を区別できる
  - P・ZPP・RP・coRP・BPP・NPの基本包含と補集合への閉性を論証できる
  - BPP⊆P/polyの固定乱数存在証明を和事象上界から導き、非uniform性の制約を説明できる
  - 短い種・受理確率近似・生成効率を指定して、条件付きの脱乱択化を証明できる
definitions:
  - { id: CPLX20-DEF-01, name: "多項式時間乱択判定機械" }
