id: "ACOMP2"
title: "算術回路・straight-line program：加法・乗法・定数ゲート"
volume: "foundations"
status: supplementary
prerequisites:
  - ACOMP1
official_scope: []
learning_objectives:
  - 除算なし算術回路を定義し、閉路のない配線と形式多項式の一意性を説明できる
  - 回路の数値評価と形式多項式の評価の一致を証明し、有限体で逆が成立しない例を説明できる
  - 加法・乗法の演算サイズを数え、定数の入力と演算を区別できる
  - 回路と直線型プログラムを相互変換し、演算回数が保存されることを証明できる
  - 任意の多項式の回路を構成し、項数と演算サイズおよび上界と最小値を区別できる
definitions:
  - { id: ACOMP2-DEF-01, name: 算術回路 }
  - { id: ACOMP2-DEF-02, name: 算術回路の演算サイズ }
  - { id: ACOMP2-DEF-03, name: straight-line program }
theorems:
  - { id: ACOMP2-THM-01, name: 算術回路の形式多項式の一意性 }
  - { id: ACOMP2-THM-02, name: 算術回路とstraight-line programの対応 }
  - { id: ACOMP2-THM-03, name: 任意の多項式の算術回路による計算 }
canonical_examples:
  - 中間結果を再利用する算術回路
  - 有限体上の形式多項式と数値評価
  - Horner法と演算回数
