learning_objectives:
  - 非可換形式多項式と斉次非可換ABPの積の順序を説明できる
  - 語の分割によって係数行列を作り指定した体で階数を計算できる
  - 経路の切断と残余基底構成からNisan型ランク公式を証明できる
  - 回文多項式の指数下界と一般回路の線形上界を導出できる
  - 定数付き非可換ABPへの下界の拡張と可換モデルとの違いを説明できる
