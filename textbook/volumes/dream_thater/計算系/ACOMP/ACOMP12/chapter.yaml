id: "ACOMP12"
title: "Hamilton閉路多項式のVNP完全性：任意標数と特性2"
volume: "foundations"
status: supplementary
prerequisites:
  - ACOMP11
  - GCT4
official_scope: []
learning_objectives:
  - Hamilton閉路多項式とサイクル被覆の重み和を区別できる
  - 訪問順の証人行列で VNP 所属と次数・回路サイズの上界を示せる
  - 算術式を活動ビット付きの局所重み表に変換できる
  - 三頂点の排他的選択と局所表の照合から閉路を構成できる
  - 次元上界と成分の種類を検算して任意標数の VNP 完全性を証明できる
