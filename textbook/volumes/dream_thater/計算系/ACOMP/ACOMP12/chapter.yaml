  - { id: ACOMP12-THM-02, name: "算術式の局所重み表への変換" }
  - { id: ACOMP12-THM-03, name: "環状区間の排他的選択構成" }
  - { id: ACOMP12-THM-04, name: "局所重み表の Hamilton閉路表示" }
  - { id: ACOMP12-THM-05, name: "Valiant の Hamilton閉路多項式の VNP 完全性" }
