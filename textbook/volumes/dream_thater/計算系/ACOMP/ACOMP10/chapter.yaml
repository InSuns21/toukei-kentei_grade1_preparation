id: "ACOMP10"
title: "determinantの多項式サイズ回路：除算不要のBerkowitz型構成"
volume: "foundations"
status: supplementary
prerequisites:
  - ACOMP9
  - LA3B
official_scope: []
learning_objectives:
  - 逆順固有多項式の行列サイズに対応する次数の係数から行列式を取り出せる
  - 有限多項式の行操作でBerkowitz型係数再帰を証明できる
  - ベクトル反復と係数再帰を実行し演算サイズの多項式上界を示せる
  - 任意標数での行列式族のVP所属と完全性を区別できる
