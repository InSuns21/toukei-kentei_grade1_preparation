id: "ACOMP23"
title: "GCTへの入口：Zariski軌道閉包・determinantal complexity・表現論の役割"
volume: "foundations"
status: supplementary
prerequisites: [ACOMP22, AG1-03, LREP1]
official_scope: []
learning_objectives:
  - 行列式複雑性と斉次線形置換の関係を証明できる
  - 全線形置換の像と可逆置換の軌道の閉包の一致を証明できる
  - padded permanent の軌道閉包の包含を行列式の厳密表示および退化の下界に結び付けられる
  - 座標環の制限の向きと表現の出現・重複度による障害を説明し低次元の例を計算できる
