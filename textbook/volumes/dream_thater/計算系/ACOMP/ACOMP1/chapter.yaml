id: "ACOMP1"
title: "形式多項式と多項式関数：有限体とBoolean立方体"
volume: "foundations"
status: supplementary
prerequisites:
  - AG1-01
  - CPLX18
  - FLD3
official_scope: []
learning_objectives:
  - 形式多項式の係数の一致と指定入力上の関数の一致を区別し、評価の加法・乗法保存を説明できる
  - 各変数の次数制限の下で直積上の評価から多項式の一意性を証明できる
  - 有限体の全点で消える非零多項式を構成し、無限体の場合と比較できる
  - 有限直積上の関数の次数制限付き表示を構成して一意性を証明できる
  - Boolean立方体上の多重線形表示を計算し、係数体による違いと形式多項式の違いを説明できる
definitions:
  - { id: ACOMP1-DEF-01, name: 多項式関数と評価写像 }
theorems:
  - { id: ACOMP1-THM-01, name: 直積上の多項式の一意性 }
  - { id: ACOMP1-THM-02, name: 有限直積上の関数の多項式表示 }
canonical_examples:
  - x と x^2 の Boolean入力での一致
  - 有限体上の x^q-x
  - 二入力論理和の多重線形表示
problem_patterns:
  - ACOMP1-FORMAL-VS-EVALUATION
  - ACOMP1-FINITE-FIELD-COUNTEREXAMPLE
  - ACOMP1-EVALUATION-PRODUCT
  - ACOMP1-POINT-INDICATOR
  - ACOMP1-GRID-DEGREE-BOUND
  - ACOMP1-GRID-INTERPOLATION
  - ACOMP1-BOOLEAN-XOR
  - ACOMP1-BOOLEAN-VANISHING
