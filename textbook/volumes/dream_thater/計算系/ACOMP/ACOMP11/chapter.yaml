  - { id: ACOMP11-THM-04, name: "二位置の Boolean 和の局所消去" }
  - { id: ACOMP11-THM-05, name: "全ビット一致を表すパーマネント" }
  - { id: ACOMP11-THM-06, name: "Valiant のパーマネント VNP 完全性" }
