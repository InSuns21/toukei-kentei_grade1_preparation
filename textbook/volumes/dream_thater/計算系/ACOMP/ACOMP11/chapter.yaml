id: "ACOMP11"
title: "permanentのVNP完全性：標数2以外のgadgetの符号検算"
volume: "foundations"
status: supplementary
prerequisites:
  - ACOMP10
  - GCT3
official_scope: []
learning_objectives:
  - パーマネントの Boolean 和による VNP 所属を証明できる
  - 次数別回路から多項式長の展開証人を構成できる
  - 算術式をパーマネントで表し二位置消去の六通りの係数を検算できる
  - 一致ブロックと消去を組み合わせ p-projection と次元上界を示せる
  - 標数2における行列式との一致と証明の停止点を説明できる
