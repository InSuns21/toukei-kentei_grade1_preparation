learning_objectives:
  - 局所制約の指示多項式と重み付きの Boolean 和を構成できる
  - 次数別普遍回路の接続係数と全次数上界を証明できる
  - 余剰補助入力を固定して普遍和への p-projection を構成できる
  - VNP 困難性と VNP 完全性および帰着の方向を区別できる
