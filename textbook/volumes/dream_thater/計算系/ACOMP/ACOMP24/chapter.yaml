learning_objectives:
  - 判定・厳密計数・剰余計数と一様性の違いを説明できる
  - Boolean検証回路を低次数のVNP族として構成し一意な候補列による計数を証明できる
  - 固定素体での剰余計数と整数定数回路での厳密計数の条件付き含意を証明できる
  - 制限回路下界とBoolean側の証明障壁の適用範囲を区別できる
