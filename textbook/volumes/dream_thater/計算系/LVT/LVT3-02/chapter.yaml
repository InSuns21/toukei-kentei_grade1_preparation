id: "LVT3-02"
title: "全域性・部分正当性・停止性"
volume: "foundations"
status: supplementary
prerequisites: [LVT3-01]
official_scope: []
learning_objectives:
  - 実行予算を持つ計算モデルで部分正当性と停止性を区別する
  - 再帰する移送モデルの結果と停止までの予算を帰納法で証明する
  - 全正当性を二つの証明責務に分解し反例で必要性を確認する
  - 全域的なLean関数と有限予算モデルの結果が一致することを証明する
