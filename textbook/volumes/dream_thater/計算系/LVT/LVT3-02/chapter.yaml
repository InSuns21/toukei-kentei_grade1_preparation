  - { id: LVT3-02-DEF-04, name: "Leanの全域的な移送関数" }
propositions:
  - { id: LVT3-02-PROP-01, name: "移送モデルの部分正当性" }
  - { id: LVT3-02-PROP-02, name: "移送モデルの実行予算" }
  - { id: LVT3-02-PROP-03, name: "移送モデルの全正当性" }
  - { id: LVT3-02-PROP-04, name: "停止性を欠く部分正当なモデル" }
  - { id: LVT3-02-PROP-05, name: "全域的移送関数の正しさ" }
