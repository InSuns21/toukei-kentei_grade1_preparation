learning_objectives:
  - 整列性と重複を含む出現回数保存を独立の条件として仕様化する
  - 挿入操作の整列性と出現回数の変化を別々の帰納法で証明する
  - 全入力に対する挿入ソートの正当性を二条件から導く
  - 弱い仕様を満たす誤実装を具体例で反証し再ソートの性質を証明する
