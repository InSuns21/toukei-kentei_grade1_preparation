id: "LVT3-03"
title: "リスト処理の関数正当性"
volume: "foundations"
status: supplementary
prerequisites: [LVT3-02]
official_scope: []
learning_objectives:
  - 要素型の異なるリスト写像を全入力で標準の仕様と照合する
  - 長さ保存が十分な結果仕様ではないことを反例で説明する
  - 連結・合成・反転との交換則をリストの帰納法で証明する
  - 任意の累積引数へ主張を一般化して末尾再帰実装の正当性を示す
