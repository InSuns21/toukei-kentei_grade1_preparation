id: "FEM4"
title: "楕円型 FEM の誤差解析"
volume: "foundations"
status: supplementary
prerequisites:
  - FEM3
  - GPDE9
official_scope: []
learning_objectives:
  - Céa の補題と FEM3 の大域一次補間誤差評価を接続し、一次有限要素解の H1 誤差が O(h) になることを導ける
  - H1 誤差評価で解の H2 正則性・メッシュの形状正則性・適合性がそれぞれどこで必要か説明できる
  - L2 誤差評価のための楕円型双対問題を定式化し、随伴双線形形式に Lax--Milgram を適用して双対解の存在一意性を確認できる
  - Galerkin 直交性を使って L2 誤差の二乗を a(e,z-I_hz) に変換する Aubin--Nitsche 型双対論法を証明できる
  - 双対問題の大域 H2 正則性を仮定すると L2 誤差が H1 誤差より h 一段改善することを導ける
  - 一次有限要素について H1 誤差 O(h) と L2 誤差 O(h^2) を一つの仮定集合からまとめて導ける
  - 再入角 の具体例から、大域 H2 正則性が失われると標準的な誤差次数の証明機構も失われることを説明できる
  - メッシュ幅を半分にしたときの理論上の誤差減少率を H1 と L2 で比較し、h に対する誤差次数を解釈できる
definitions:
  - { id: FEM4-DEF-01, name: L2 誤差に対する楕円型双対問題 }
theorems:
  - { id: FEM4-THM-01, name: 一次有限要素解の H1 誤差評価 }
  - { id: FEM4-LEM-01, name: 楕円型双対問題の存在一意性 }
  - { id: FEM4-THM-02, name: Aubin--Nitsche 型 L2 誤差評価 }
  - { id: FEM4-COR-01, name: 一次有限要素法の標準 H1・L2 誤差評価 }
canonical_examples:
  - Poisson 問題で M=alpha=1 として Céa と節点補間を直接接続する計算
  - 一次元 Poisson 補助問題 -z''=e を具体的に解き、双対問題の定義を検証する例
  - メッシュ幅 h を h/2 にしたとき H1 上界が 1/2、L2 上界が 1/4 になる比較
  - 再入角 の調和特異関数 r^alpha sin(alpha theta) で H2 正則性が失われる尺度計算
  - Galerkin 直交性により a(e,I_h z)=0 として双対論法の一項が消える計算
problem_patterns:
  - FEM4-H1-CEA-INTERPOLATION-1
  - FEM4-POISSON-ENERGY-ERROR-1
  - FEM4-DUAL-PROBLEM-1
  - FEM4-GALERKIN-DUAL-CANCELLATION-1
  - FEM4-AUBIN-NITSCHE-1
  - FEM4-MESH-HALVING-RATE-1
  - FEM4-REGULARITY-FAILURE-1
  - FEM4-ERROR-SYNTHESIS-1
