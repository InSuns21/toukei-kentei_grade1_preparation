  - { id: FEM5-THM-02, name: 連続 Stokes inf-sup 条件 }
  - { id: FEM5-THM-03, name: Stokes 速度–圧力弱解の存在一意性 }
  - { id: FEM5-THM-04, name: 離散 inf-sup による混合有限要素法の安定性と準最良近似 }
  - { id: FEM5-PROP-01, name: 混合有限要素行列と Schur 補行列 }
canonical_examples:
  - R2 上の最小ノルム問題 u1+u2=1 を Lagrange 乗数付き三元鞍点系として解く例
  - b(v,q)=q(v1+v2) で制約核 と inf-sup 定数 beta=sqrt(2) を直接計算する例
  - スカラー関数 psi=x^2(1-x)^2 y^2(1-y)^2 から零境界で発散が 0 の速度を構成する例
  - 定数圧力モードが H_0^1 速度から見えず L2 全体では inf-sup 定数が 0 になる確認
  - B^T に非自明な核を持つ有限次元の組で偽圧力モードが生じる例
  - Taylor--Hood P2/P1 を代表的な離散 inf-sup 安定な組 として位置付ける例
