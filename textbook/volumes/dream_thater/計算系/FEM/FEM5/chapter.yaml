id: "FEM5"
title: "鞍点問題・Stokes 方程式"
volume: "foundations"
status: supplementary
prerequisites:
  - FEM4
  - GPDE7
official_scope: []
learning_objectives:
  - 制約付き最小化から抽象鞍点問題を導入し、Lagrange 乗数を第二未知量として持つ理由を説明できる
  - 積空間上の単純な強圧性が圧力方向で失敗することを示し、制約核と inf-sup 条件の必要性を説明できる
  - inf-sup 条件から制約右辺を満たす 有界な持ち上げ を Lax--Milgram を用いて構成し、そのノルム評価を証明できる
  - 制約核上の強圧性 と inf-sup 条件から Babuška--Brezzi 型の存在一意性と安定性評価を証明できる
  - 定常 Stokes 方程式の速度–圧力弱形式を導出し、圧力を L_0^2 に置く理由を定数圧力モードから説明できる
  - 連続 Stokes inf-sup を用いて速度–圧力弱解の存在一意性を導ける
  - 混合有限要素法を定式化し、離散 inf-sup 条件が連続 inf-sup から自動継承されないことを説明できる
  - 一様な離散 inf-sup 条件から混合準最良近似評価を導き、速度近似誤差と圧力近似誤差を分離できる
  - 混合有限要素行列の 2x2 ブロック構造と Schur 補行列を導き、偽圧力モード と B^T の核 の関係を説明できる
  - Taylor--Hood P2/P1 要素を代表的な inf-sup 安定な組 として位置付け、等次数の組 との違いを説明できる
definitions:
