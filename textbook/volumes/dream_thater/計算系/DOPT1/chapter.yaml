  - { id: DOPT1-DEF-05, name: 整数変数に対する分枝 }
  - { id: DOPT1-DEF-06, name: 分枝限定法 }
  - { id: DOPT1-DEF-07, name: 妥当不等式・切除平面 }
theorems:
  - { id: DOPT1-THM-01, name: LP 緩和が与える下界 }
  - { id: DOPT1-THM-02, name: 線形目的関数と整数包の最適値同値性 }
  - { id: DOPT1-PROP-01, name: 強い緩和ほど最小化下界は高い }
  - { id: DOPT1-LEM-01, name: 分枝による整数実行可能解の保存 }
  - { id: DOPT1-THM-03, name: 有限整数領域に対する分枝限定法の正当性 }
  - { id: DOPT1-PROP-02, name: 妥当不等式追加による整数解保存と下界改善 }
  - { id: DOPT1-PROP-03, name: 整数丸め不等式 }
canonical_examples:
  - 二変数0--1設備選択問題における整数最適値2とLP緩和値3/2
  - 単一点整数集合の整数包と分数LP点の比較
  - Mx>=1で比率型整数性ギャップがMまで拡大する例
  - 分数解x2=1/2から二分枝して0--1最適解を確定する例
  - x1+x2>=3/2を整数性からx1+x2>=2へ丸める切除
