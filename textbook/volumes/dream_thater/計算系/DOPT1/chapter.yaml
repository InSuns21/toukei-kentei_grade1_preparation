id: "DOPT1"
title: "整数計画・LP 緩和"
volume: "foundations"
status: supplementary
prerequisites:
  - OPT10
  - OPT11
official_scope: []
learning_objectives:
  - 整数線形計画とLP緩和を定義し、整数条件を外すことで実行可能集合がどのように広がるか説明できる
  - 最小化型整数線形計画でLP緩和が整数最適値の下界を与え、LP最適解が整数なら元問題でも最適であることを証明できる
  - 整数包を定義し、線形目的関数が整数実行可能集合とその凸包上で同じ最適値を持つことを証明できる
  - 加法的・比率型整数性ギャップを計算し、弱いLP緩和ではgapが大きくなり得ることを具体例で説明できる
  - 同じ整数実行可能集合を持つ二つの定式化について、包含関係からLP緩和の強弱を比較できる
  - 分数整数変数に対する標準的な二分枝が整数実行可能解を保存することを証明できる
  - 分枝限定法でLP下界・暫定最良値・実行不能性を使って節点を安全に刈り、有限整数領域での正当性を説明できる
  - 妥当不等式と切除平面を定義し、整数解を保存しながらLP下界を改善する理由を証明できる
  - 整数係数線形式の丸めから簡単な切除平面を導き、分枝と切除の役割を比較できる
definitions:
  - { id: DOPT1-DEF-01, name: 整数線形計画 }
  - { id: DOPT1-DEF-02, name: LP 緩和 }
  - { id: DOPT1-DEF-03, name: 整数包 }
