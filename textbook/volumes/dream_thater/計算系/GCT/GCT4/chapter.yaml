id: "GCT4"
title: "サイクル被覆・Hamilton閉路と順列の巡回分解"
volume: "foundations"
status: supplementary
prerequisites:
  - GCT3
  - GRP1
official_scope: []
learning_objectives:
  - 出次数と入次数からサイクル被覆を判定できる
  - 許容置換との全単射と巡回分解から被覆を構成できる
  - 重み付き被覆総和とパーマネントの一致を証明できる
  - 閉路数別の係数からHamilton閉路を抽出し閉歩道計数と区別できる
  - 零重み・負重みと普通の個数を区別して計算できる
