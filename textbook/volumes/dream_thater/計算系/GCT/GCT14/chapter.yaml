learning_objectives:
  - 有限群の右乗法からCayleyグラフを構成し左移動と生成条件を証明できる
  - ラベル列の積と歩道を対応させ計数の漸化式を使用できる
  - F₂上の上三角単位行列の群構造と逆元を計算できる
  - 列操作と行列積によって隣接生成元が全群を生成することを示せる
