id: "GCT8"
title: "格子状制約・局所表・重み付き分配和"
volume: "foundations"
status: supplementary
prerequisites:
  - GCT7
official_scope: []
learning_objectives:
  - 格子上の局所表と重みを定めて全割当の積和を書ける
  - 小格子の分配和を直接列挙し計数と重み付き総和を区別できる
  - 行状態による分配和漸化式を導出して適用できる
  - 転送行列を作り行状態の集計と計算量を説明できる
  - 隣接二行の仮定を外したときの状態不足を説明できる
