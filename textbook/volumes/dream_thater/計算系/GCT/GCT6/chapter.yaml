  - GCT1
official_scope: []
learning_objectives:
  - 木分解の三条件を検査して反例を構成できる
  - 木幅の上界と下界を区別し木幅1以下と森の同値性を証明できる
  - バッグ間の分離を出現節点の連結性から導出できる
  - 境界状態表を用いて重み付き独立集合を二重計上せずに数えられる
  - 共有状態で集計し与えられた木分解に対する計算量を評価できる
