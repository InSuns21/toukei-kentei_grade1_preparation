id: "GCT16"
title: "木プログラムの符号化と計算ネットワーク"
volume: "foundations"
status: supplementary
prerequisites:
  - GCT15
  - GCT5
  - GCT7
  - GCT9
official_scope: []
learning_objectives:
  - 有限木プログラムの状態・局所規則・実行・記録値を定義し具体例を検査できる
  - 状態別および記録値別の積和漸化式を導出し算術演算回数を評価できる
  - 規則番号と整合表による計数保存符号化を証明し非負重みを証明書の個数へ変換できる
  - 共有変数の等値制約と重みの一回だけの配置によって計数を保存できる
