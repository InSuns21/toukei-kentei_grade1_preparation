id: "GCT1"
title: "有限グラフ・辺重み・隣接行列：同型と歩道の計数"
volume: "foundations"
status: supplementary
prerequisites:
  - COMB1
  - SGT1
  - CPLX3
  - F0-00F
official_scope: []
learning_objectives:
  - 有限単純有向・無向グラフの頂点と辺を区別し、零重みの辺を含む辺重みを扱える
  - 通常と重み付きの隣接行列を構成し、行列から辺の存在を判定できる条件を説明できる
  - グラフ同型の条件を置換による行列表示へ変換し、両方向を証明できる
  - 歩道の個数と重みの総和を行列冪から計算し、最終辺による帰納法で証明できる
  - 閉歩道の計数と同型による不変性を証明し、逆の反例を作れる
