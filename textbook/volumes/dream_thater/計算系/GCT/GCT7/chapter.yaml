id: "GCT7"
title: "グラフ準同型・制約充足問題と因子グラフ"
volume: "foundations"
status: supplementary
prerequisites:
  - GCT6
  - GCT1
  - GCT5
official_scope: []
learning_objectives:
  - グラフ準同型の条件を確認し彩色と対応させられる
  - 局所制約を許容集合として指定しグラフ準同型や独立集合を表現できる
  - 因子グラフを構成し充足割当数を積和として導ける
  - 変数消去で全重み和を保存し消去順による表サイズを比較できる
  - 木分解に因子を一度ずつ配置して共有状態で重み和を集計できる
