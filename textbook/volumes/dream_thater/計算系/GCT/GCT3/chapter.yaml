id: "GCT3"
title: "完全マッチングの重み付き母関数とパーマネント"
volume: "foundations"
status: supplementary
prerequisites:
  - GCT2
  - COMB2
official_scope: []
learning_objectives:
  - 完全マッチングの重みの積を足し合わせ、指定辺の本数別の係数を解釈できる
  - 置換の列表示を用いてパーマネントを計算し、行列式との違いを説明できる
  - 完全マッチングと許容置換の全単射から重み付き母関数の一致を証明できる
  - 正重み・零重み・負重みで存在判定と重み付き総和の関係を区別できる
  - 行展開を導出し、一辺を固定した割当ての個数を計算できる
