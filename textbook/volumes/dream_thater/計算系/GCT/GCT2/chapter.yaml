id: "GCT2"
title: "二部マッチングとHallの定理"
volume: "foundations"
status: supplementary
prerequisites:
  - GCT1
  - DOPT3
official_scope: []
learning_objectives:
  - 二部グラフの候補辺とマッチングの選択辺を区別し、左右の飽和を判定できる
  - 交互探索によって増加路を構成して更新できる
  - 探索が停止したときの到達集合の近傍と選択相手の対応を証明できる
  - 不足数公式とHallの定理の増加路による別証明を再構成できる
  - 不足集合から必要な追加割当先の個数を求められる
definitions:
