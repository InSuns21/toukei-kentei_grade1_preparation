id: "GCT9"
title: "計数複雑性クラス：#P・FP・GapP"
volume: "foundations"
status: supplementary
prerequisites:
  - GCT8
  - CPLX4
official_scope: []
learning_objectives:
  - 固定長の証明書と受理経路数の全単射を構成できる
  - 非負整数値 FP と計数クラスの包含および NP の存在判定との関係を証明できる
  - 和と積の計数を重複なしの証明書で構成できる
  - GapP を二つの計数の差と機械の経路差で表し閉性を導ける
  - 充足割当と0–1パーマネントの所属を符号化から説明できる
