id: "PYNUM1"
title: "Python 数値計算速習"
volume: "foundations"
status: supplementary
prerequisites: []
official_scope: []
learning_objectives:
  - Python の反復・内包表記・関数定義・tuple unpacking を、数値計算で必要な範囲に限って読み書きできる
  - NumPy 配列の shape・axis・dtype を読み、演算結果の形状と型を事前に予測できる
  - 代入・ビュー・コピー の違いを説明し、意図しない共有メモリによる破壊的変更を避けられる
  - ブロードキャスト の適合条件を判定し、明示的な Python loop と ベクトル化 を適切に使い分けられる
  - 要素積・行列積・内積・ノルム・axis 付き集約を NumPy で正しく書ける
  - ブールマスク と np.where を用いて条件付き配列演算を記述できる
  - numpy.random.Generator を用いて再現可能な乱数生成を行い、グローバル乱数状態への依存を避けられる
  - Matplotlib で折れ線・散布図・log-log 図を作り、誤差対計算量の傾きを読める
  - NaN・inf・shape mismatch・dtype 切り捨て・off-by-one を診断し、数値計算コードの基本的な防御策を実装できる
  - SciPy の linalg・sparse・sparse.linalg・stats の役割を識別し、後続 NUMLAB で必要な API を探せる
  - PYNUM1 自身のブラウザ実験欄で NumPy・乱数生成器・Matplotlib を編集・実行し、自動判定まで確認できる
definitions:
  - { id: PYNUM1-DEF-01, name: NumPy 配列の形状・軸・データ型 }
  - { id: PYNUM1-DEF-02, name: NumPy のビューとコピー }
  - { id: PYNUM1-DEF-03, name: NumPy のブロードキャスト }
  - { id: PYNUM1-DEF-04, name: NumPy のベクトル化 }
  - { id: PYNUM1-DEF-05, name: NumPy のブールマスク }
  - { id: PYNUM1-DEF-06, name: NumPy 乱数生成器 }
  - { id: PYNUM1-DEF-07, name: log-log 図 }
theorems: []
canonical_examples:
  - shape=(3,4) の配列で axis=0 と axis=1 の集約結果の形状を比較する例
  - basic slicing が view を返し、copy を取らないと元配列まで変更される例
  - (3,1) と (4,) の ブロードキャスト から (3,4) を作る例
  - A*x と A@x の違いを shape と数式の両方から確認する例
  - ブールマスク で有限値だけを抽出する例
  - np.random.default_rng(seed) で同一 seed から同一列を再現する例
  - log-log 図上で誤差 E_N≈CN^{-p} の傾きが -p になることを確認する例
  - ブラウザ内 Python で shape・ビュー・乱数・log-log 図を実行する4本の数値ラボ
