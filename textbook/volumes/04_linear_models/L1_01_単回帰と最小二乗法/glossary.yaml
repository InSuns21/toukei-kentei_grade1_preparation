chapter: "L1-01"
terms:
  - { term: 単回帰モデル, meaning: 1個の説明変数で応答の条件付き平均を直線として表すモデル }
  - { term: 残差, meaning: 観測値と当てはめ値との差 }
  - { term: 残差平方和, meaning: 残差の二乗を全観測について足した量 }
  - { term: 最小二乗法, meaning: 残差平方和を最小にする係数を選ぶ方法 }
  - { term: 決定係数, meaning: 全変動のうち回帰で説明された割合を表す量 }
  - { term: 標準誤差, meaning: 推定量の標準偏差をデータから推定した量 }
  - { term: 予測区間, meaning: 新しい観測値が入る範囲を確率的に示す区間 }
