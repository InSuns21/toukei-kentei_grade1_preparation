terms:
  - term: カルバック・ライブラー情報量
    definition: 真の分布qと候補分布pのずれを、qの下での対数比の期待値として測る情報量。非負で、分布が一致すると0になる。
  - term: 対数損失
    definition: 観測値yに候補分布が与える確率または密度p(y)に対して -log p(y) とする損失。
  - term: 訓練誤差
    definition: モデルの学習に使ったデータ上で計算した平均損失。モデル選択にそのまま使うと楽観的になりやすい。
  - term: 汎化誤差
    definition: 同じ生成機構から将来得られる新しいデータに対する期待損失。
  - term: 情報量規準AIC
    definition: 最大対数尤度と推定母数数から -2ell(hat theta)+2k として構成し、予測的な当てはまりと複雑さを比較する情報量規準。
  - term: K分割クロスバリデーション
    definition: データをK個の分割に分け、各分割を1回ずつ検証用、残りを学習用として損失を平均する方法。
  - term: 1個抜きクロスバリデーション
    definition: 標本サイズnに対してK=nとし、1観測ずつ検証用に外して予測誤差を評価する交差検証。
  - term: バイアス・分散トレードオフ
    definition: モデルを複雑にすると近似バイアスは下がりやすい一方、推定結果の分散は上がりやすいという予測誤差上の釣合い。
  - term: 変数選択
    definition: 候補説明変数の集合から、目的に応じた基準で採用する説明変数の部分集合を選ぶ操作。
  - term: データリーク
    definition: 本来検証側として隔離すべき情報が、前処理・変数選択・ハイパーパラメータ調整などを通じて学習側へ流れ込み、評価を楽観的にすること。
  - term: BIC
    definition: 最大対数尤度に k log n の複雑度罰則を加えるモデル選択基準。AICとは目的と理論的背景が異なる。
