  - { id: L202-THM-02, name: 期待対数損失とカルバック・ライブラー情報量 }
  - { id: L202-THM-03, name: 正規線形回帰の訓練楽観バイアス }
  - { id: L202-THM-04, name: 二乗誤差のバイアス・分散分解 }
  - { id: L202-THM-05, name: 線形回帰の1個抜き残差公式 }
