id: "L2-02"
title: "モデル評価・選択"
volume: "linear_models"
status: reviewed
prerequisites:
  - L1-02
  - L2-01
  - L1-04
  - I1-01
official_scope:
  - カルバック・ライブラー情報量
  - 情報量規準AIC
  - クロスバリデーション
  - 変数選択
learning_objectives:
  - 訓練誤差と汎化誤差を区別し、訓練誤差だけでモデルを選べない理由を説明できる
  - カルバック・ライブラー情報量の非負性と対数損失との関係を導出できる
  - AIC=-2ell(hat theta)+2k の意味を当てはまりと複雑度罰則の釣合いとして説明できる
  - 正規線形回帰で訓練楽観バイアスが2pになることを計算できる
  - K分割クロスバリデーションと1個抜きクロスバリデーションを構成できる
  - 線形回帰の1個抜き残差 e_i/(1-h_ii) を導出し計算できる
  - バイアス・分散分解からモデル複雑度のトレードオフを説明できる
  - 全変数選択・前進選択・後退消去・逐次選択の違いと限界を説明できる
  - AIC・クロスバリデーション・部分F検定・BICの目的の違いを説明できる
  - 前処理・変数選択・ハイパーパラメータ調整を交差検証の訓練側だけで行う必要を説明できる
definitions:
  - { id: L202-DEF-01, name: カルバック・ライブラー情報量 }
