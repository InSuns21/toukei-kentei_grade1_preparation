learning_objectives:
  - 一般化線形モデルの三要素を説明できる
  - ベルヌーイ・ポアソンの確率関数から尤度とスコアを導ける
  - ロジスティック回帰係数をオッズ比として解釈できる
  - ポアソン回帰係数を平均件数比・発生率比として解釈できる
  - オフセットの役割を説明できる
  - 指数型分布族の平均・分散を正規化式から導ける
  - 逸脱度と入れ子モデルの逸脱度差を説明できる
