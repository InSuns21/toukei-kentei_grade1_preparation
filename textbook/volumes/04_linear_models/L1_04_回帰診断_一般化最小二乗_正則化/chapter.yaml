id: "L1-04"
title: "回帰診断・一般化最小二乗・正則化"
volume: "linear_models"
status: reviewed
prerequisites:
  - L1-02
official_scope:
  - 変数選択
  - 残差分析
  - 一般化最小二乗推定
  - 多重共線性
  - L1正則化法
  - 回帰診断法
learning_objectives:
  - ハット行列からレバレッジと残差分散を導出し、高レバレッジ点・大残差点・影響点を区別できる
  - 残差プロットの形から線形性・等分散性・独立性の破れを診断できる
  - Cook距離をレバレッジとStudent化残差から計算し、影響の大きい観測を説明できる
  - 誤差分散共分散行列が一般の形をもつとき、一般化最小二乗推定量とその分散を導出できる
  - 白色化によって一般化最小二乗法が通常最小二乗法へ帰着することを説明できる
  - 多重共線性が不偏性ではなく推定分散を悪化させることを説明し、VIFを導出・計算できる
  - 部分F検定・自由度調整済み決定係数・AIC・BICを用いて変数選択を比較できる
  - L1正則化の目的関数を説明し、直交設計で軟閾値解を導出・計算できる
