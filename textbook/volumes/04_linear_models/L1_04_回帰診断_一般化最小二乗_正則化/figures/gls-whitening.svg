<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
  <title id="title">GLSの白色化</title>
  <desc id="desc">相関と異なる分散をもつ誤差の楕円をLの逆行列で変換すると、分散共分散行列が単位行列の定数倍になり円になることを示す。</desc>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;fill:#222}.axis{stroke:#98a2b3;stroke-width:1.3}.ellipse{fill:#dbeafe;stroke:#2563eb;stroke-width:2.2}.circle{fill:#dcfce7;stroke:#16a34a;stroke-width:2.2}.arrow{stroke:#475467;stroke-width:2.5;marker-end:url(#arrow)}.small{font-size:15px;fill:#475467}.label{font-size:20px;font-weight:700}.formula{font-size:19px}.box{fill:#fff;stroke:#d0d5dd;rx:10}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475467"/></marker></defs>
  <rect width="1040" height="500" fill="#fafafa"/>
  <text x="520" y="35" text-anchor="middle" font-size="24" font-weight="700">GLS = 誤差を白色化してから OLS</text>

  <rect class="box" x="45" y="75" width="355" height="350"/>
  <text class="label" x="70" y="110">変換前</text>
  <line class="axis" x1="100" y1="340" x2="350" y2="340"/><line class="axis" x1="225" y1="145" x2="225" y2="385"/>
  <ellipse class="ellipse" cx="225" cy="265" rx="125" ry="55" transform="rotate(-28 225 265)"/>
  <line x1="145" y1="318" x2="310" y2="214" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="formula" x="75" y="395">Var(ε) = σ²Ω</text>
  <text class="small" x="75" y="418">方向によって分散が違い、成分も相関</text>

  <line class="arrow" x1="425" y1="245" x2="610" y2="245"/>
  <text x="517" y="215" text-anchor="middle" font-size="22" font-weight="700">L⁻¹</text>
  <text class="small" x="517" y="274" text-anchor="middle">Ω = LLᵀ</text>
  <text class="small" x="517" y="297" text-anchor="middle">ε* = L⁻¹ε</text>

  <rect class="box" x="640" y="75" width="355" height="350"/>
  <text class="label" x="665" y="110">変換後（白色化）</text>
  <line class="axis" x1="690" y1="340" x2="945" y2="340"/><line class="axis" x1="817" y1="145" x2="817" y2="385"/>
  <circle class="circle" cx="817" cy="265" r="85"/>
  <text class="formula" x="670" y="395">Var(ε*) = σ²I</text>
  <text class="small" x="670" y="418">全方向で同じ分散、相関なし</text>

  <text x="520" y="467" text-anchor="middle" font-size="17">y* = L⁻¹y,  X* = L⁻¹X と変換し、 y* = X*β + ε* に通常最小二乗法を適用する。</text>
</svg>
