<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
  <title id="title">高レバレッジ点、大残差点、影響点の違い</title>
  <desc id="desc">説明変数方向の離れをレバレッジ、回帰直線からの縦方向の離れを残差として示し、両方が大きい点はCook距離が大きくなりやすいことを示す。</desc>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;fill:#222}
    .axis{stroke:#667085;stroke-width:1.5}.fit{stroke:#2563eb;stroke-width:2.5}.pt{fill:#475467}.guide{stroke:#98a2b3;stroke-width:1.2;stroke-dasharray:5 5}.res{stroke:#dc2626;stroke-width:2}.lev{stroke:#7c3aed;stroke-width:2}.label{font-size:17px;font-weight:700}.small{font-size:14px;fill:#475467}.box{fill:#fff;stroke:#d0d5dd;rx:10}
  </style>
  <rect width="1040" height="560" fill="#fafafa"/>
  <text x="520" y="35" text-anchor="middle" font-size="24" font-weight="700">レバレッジと残差は「違う方向の外れ方」</text>
  <rect class="box" x="40" y="65" width="650" height="440"/>
  <line class="axis" x1="90" y1="445" x2="650" y2="445"/><line class="axis" x1="90" y1="105" x2="90" y2="465"/>
  <line class="fit" x1="110" y1="395" x2="630" y2="145"/>
  <text class="small" x="315" y="476">説明変数 x</text><text class="small" transform="translate(70 300) rotate(-90)">応答 y</text>
  <g class="pt">
    <circle cx="150" cy="370" r="5"/><circle cx="190" cy="345" r="5"/><circle cx="235" cy="330" r="5"/><circle cx="285" cy="300" r="5"/><circle cx="330" cy="288" r="5"/><circle cx="380" cy="260" r="5"/><circle cx="425" cy="245" r="5"/>
  </g>
  <!-- large residual near center -->
  <circle cx="330" cy="155" r="8" fill="#dc2626"/>
  <line class="res" x1="330" y1="155" x2="330" y2="289"/>
  <text class="label" x="245" y="135" fill="#dc2626">大残差点</text>
  <text class="small" x="245" y="155">xは中心付近、縦に外れる</text>
  <!-- high leverage on line -->
  <circle cx="610" cy="155" r="8" fill="#7c3aed"/>
  <line class="lev" x1="430" y1="430" x2="610" y2="430"/>
  <text class="label" x="505" y="112" fill="#7c3aed">高レバレッジ点</text>
  <text class="small" x="500" y="132">xが遠いが直線上</text>
  <!-- influential -->
  <circle cx="625" cy="285" r="9" fill="#f59e0b" stroke="#92400e" stroke-width="1.5"/>
  <line class="res" x1="625" y1="285" x2="625" y2="147"/>
  <text class="label" x="505" y="318" fill="#92400e">影響点候補</text>
  <text class="small" x="485" y="339">高レバレッジ + 大残差</text>
  <text class="small" x="485" y="359">→ Cook距離が大きくなりやすい</text>

  <rect class="box" x="720" y="100" width="280" height="330"/>
  <text class="label" x="745" y="135">3つの問いを分ける</text>
  <text x="745" y="180" font-size="16" font-weight="700">レバレッジ hᵢᵢ</text>
  <text class="small" x="745" y="204">説明変数空間で遠いか？</text>
  <text x="745" y="250" font-size="16" font-weight="700">Student化残差 rᵢ</text>
  <text class="small" x="745" y="274">回帰面から縦に外れるか？</text>
  <text x="745" y="320" font-size="16" font-weight="700">Cook距離 Dᵢ</text>
  <text class="small" x="745" y="344">その点を外すと当てはめが</text>
  <text class="small" x="745" y="365">どれだけ動くか？</text>
  <line class="guide" x1="745" y1="390" x2="970" y2="390"/>
  <text class="small" x="745" y="414">「外れている」だけでは削除理由にしない。</text>
</svg>
