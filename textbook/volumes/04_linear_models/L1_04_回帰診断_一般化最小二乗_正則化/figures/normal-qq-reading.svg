<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc">
<title id="title">正規Q-Qプロットの読み方</title><desc id="desc">正規分布に近い場合、重い裾、右に歪んだ場合のQ-Qプロットを比較する。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;fill:#222}.panel{fill:#fff;stroke:#cfd5dd;stroke-width:1.4}.axis{stroke:#667085;stroke-width:1.2}.ref{stroke:#667085;stroke-width:1.4;stroke-dasharray:5 5}.pt{fill:#2563eb}.tail{fill:#dc2626}.label{font-size:18px;font-weight:700}.small{font-size:14px;fill:#475467}</style>
<rect width="1080" height="430" fill="#fafafa"/><text x="540" y="32" text-anchor="middle" font-size="24" font-weight="700">正規Q-Qプロット：点の「曲がり方」を読む</text>
<g transform="translate(25 60)"><rect class="panel" width="330" height="320" rx="10"/><text class="label" x="20" y="32">A. ほぼ正規</text><line class="axis" x1="55" y1="250" x2="300" y2="250"/><line class="axis" x1="55" y1="65" x2="55" y2="265"/><line class="ref" x1="75" y1="225" x2="285" y2="85"/><g class="pt"><circle cx="78" cy="226" r="4"/><circle cx="103" cy="207" r="4"/><circle cx="128" cy="193" r="4"/><circle cx="153" cy="174" r="4"/><circle cx="178" cy="159" r="4"/><circle cx="203" cy="142" r="4"/><circle cx="228" cy="125" r="4"/><circle cx="253" cy="108" r="4"/><circle cx="282" cy="87" r="4"/></g><text class="small" x="165" y="286" text-anchor="middle">基準直線にほぼ沿う</text></g>
<g transform="translate(375 60)"><rect class="panel" width="330" height="320" rx="10"/><text class="label" x="20" y="32">B. 重い裾</text><line class="axis" x1="55" y1="250" x2="300" y2="250"/><line class="axis" x1="55" y1="65" x2="55" y2="265"/><line class="ref" x1="75" y1="225" x2="285" y2="85"/><g class="pt"><circle class="tail" cx="78" cy="244" r="5"/><circle cx="103" cy="211" r="4"/><circle cx="128" cy="191" r="4"/><circle cx="153" cy="174" r="4"/><circle cx="178" cy="158" r="4"/><circle cx="203" cy="142" r="4"/><circle cx="228" cy="126" r="4"/><circle cx="253" cy="102" r="4"/><circle class="tail" cx="282" cy="68" r="5"/></g><text class="small" x="165" y="286" text-anchor="middle">両端が外側へ離れる</text><text class="small" x="165" y="307" text-anchor="middle">極端値が正規より出やすい</text></g>
<g transform="translate(725 60)"><rect class="panel" width="330" height="320" rx="10"/><text class="label" x="20" y="32">C. 右に歪む</text><line class="axis" x1="55" y1="250" x2="300" y2="250"/><line class="axis" x1="55" y1="65" x2="55" y2="265"/><line class="ref" x1="75" y1="225" x2="285" y2="85"/><g class="pt"><circle cx="78" cy="214" r="4"/><circle cx="103" cy="207" r="4"/><circle cx="128" cy="198" r="4"/><circle cx="153" cy="184" r="4"/><circle cx="178" cy="166" r="4"/><circle cx="203" cy="145" r="4"/><circle cx="228" cy="119" r="4"/><circle cx="253" cy="87" r="4"/><circle class="tail" cx="282" cy="55" r="5"/></g><text class="small" x="165" y="286" text-anchor="middle">全体が系統的に湾曲</text><text class="small" x="165" y="307" text-anchor="middle">右端ほど大きく上へ外れる</text></g>
<text class="small" x="540" y="410" text-anchor="middle">有限標本では多少の揺れは普通。点1個ではなく、全体の系統的な形を見る。</text></svg>
