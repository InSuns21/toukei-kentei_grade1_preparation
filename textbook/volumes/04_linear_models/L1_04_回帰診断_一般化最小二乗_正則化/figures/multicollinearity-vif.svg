<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="520" viewBox="0 0 1040 520" role="img" aria-labelledby="title desc">
  <title id="title">多重共線性とVIF</title>
  <desc id="desc">説明変数同士がほぼ一直線に並ぶと、一方の変数の独自情報が小さくなり、回帰係数の不確実性が細長い方向に増幅されることを示す。</desc>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;fill:#222}.axis{stroke:#667085;stroke-width:1.4}.pt{fill:#2563eb;opacity:.85}.fit{stroke:#2563eb;stroke-width:2}.ellipse{fill:#fef3c7;stroke:#d97706;stroke-width:2.2}.minor{stroke:#d97706;stroke-width:2}.label{font-size:20px;font-weight:700}.small{font-size:15px;fill:#475467}.formula{font-size:20px;font-weight:700}.box{fill:#fff;stroke:#d0d5dd;rx:10}
  </style>
  <rect width="1040" height="520" fill="#fafafa"/>
  <text x="520" y="35" text-anchor="middle" font-size="24" font-weight="700">多重共線性：「当てはまらない」のではなく「係数を分けにくい」</text>

  <rect class="box" x="45" y="70" width="425" height="380"/>
  <text class="label" x="70" y="105">説明変数空間</text>
  <line class="axis" x1="105" y1="375" x2="430" y2="375"/><line class="axis" x1="105" y1="140" x2="105" y2="400"/>
  <line class="fit" x1="125" y1="350" x2="410" y2="165"/>
  <g class="pt"><circle cx="135" cy="345" r="5"/><circle cx="165" cy="324" r="5"/><circle cx="195" cy="306" r="5"/><circle cx="225" cy="286" r="5"/><circle cx="255" cy="270" r="5"/><circle cx="285" cy="246" r="5"/><circle cx="315" cy="232" r="5"/><circle cx="345" cy="205" r="5"/><circle cx="375" cy="188" r="5"/><circle cx="405" cy="169" r="5"/></g>
  <text class="small" x="250" y="410">X₁</text><text class="small" transform="translate(82 285) rotate(-90)">X₂</text>
  <text class="small" x="125" y="435">X₂ ≈ a + bX₁ → X₂独自の変動が少ない</text>

  <rect class="box" x="515" y="70" width="480" height="380"/>
  <text class="label" x="540" y="105">係数空間</text>
  <line class="axis" x1="570" y1="375" x2="950" y2="375"/><line class="axis" x1="570" y1="140" x2="570" y2="400"/>
  <ellipse class="ellipse" cx="760" cy="265" rx="155" ry="42" transform="rotate(-37 760 265)"/>
  <line class="minor" x1="650" y1="350" x2="870" y2="180" stroke-dasharray="6 4"/>
  <text class="small" x="735" y="410">β₁</text><text class="small" transform="translate(548 285) rotate(-90)">β₂</text>
  <text class="small" x="605" y="160">小さい固有値の方向</text>
  <text class="small" x="605" y="182">→ (XᵀX)⁻¹ で大きく増幅</text>

  <text class="formula" x="520" y="485">VIFⱼ = 1 / (1 − Rⱼ²)</text>
  <text class="small" x="775" y="485">VIFは「分散」の倍率。標準誤差は √VIF 倍。</text>
</svg>
