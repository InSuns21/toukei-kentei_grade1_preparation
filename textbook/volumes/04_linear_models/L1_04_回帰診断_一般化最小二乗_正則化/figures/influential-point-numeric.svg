<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
<title id="title">1点が回帰直線を強く動かす数値例</title><desc id="desc">xがマイナス2から2、yが0,2,2,4,9の5点について、全5点の回帰直線と第5点を除いた4点の回帰直線を比較する。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;fill:#222}.axis{stroke:#667085;stroke-width:1.5}.grid{stroke:#e4e7ec;stroke-width:1}.all{stroke:#2563eb;stroke-width:3}.drop{stroke:#7c3aed;stroke-width:3;stroke-dasharray:8 6}.pt{fill:#475467}.influential{fill:#f59e0b;stroke:#92400e;stroke-width:2}.label{font-size:18px;font-weight:700}.small{font-size:14px;fill:#475467}.box{fill:#fff;stroke:#d0d5dd;stroke-width:1.3}</style>
<rect width="1000" height="520" fill="#fafafa"/><text x="500" y="34" text-anchor="middle" font-size="24" font-weight="700">第5点 (2, 9) を入れるだけで回帰直線が大きく回転する</text>
<rect class="box" x="55" y="65" width="650" height="400" rx="10"/><g class="grid"><line x1="120" y1="410" x2="650" y2="410"/><line x1="120" y1="350" x2="650" y2="350"/><line x1="120" y1="290" x2="650" y2="290"/><line x1="120" y1="230" x2="650" y2="230"/><line x1="120" y1="170" x2="650" y2="170"/><line x1="120" y1="110" x2="650" y2="110"/></g><line class="axis" x1="120" y1="430" x2="660" y2="430"/><line class="axis" x1="120" y1="90" x2="120" y2="430"/>
<text class="small" x="385" y="455">x</text><text class="small" transform="translate(92 275) rotate(-90)">y</text>
<text class="small" x="112" y="448">−2</text><text class="small" x="242" y="448">−1</text><text class="small" x="380" y="448">0</text><text class="small" x="510" y="448">1</text><text class="small" x="642" y="448">2</text>
<line class="drop" x1="120" y1="382" x2="650" y2="238"/><line class="all" x1="120" y1="448" x2="650" y2="148"/>
<g class="pt"><circle cx="120" cy="410" r="6"/><circle cx="252" cy="350" r="6"/><circle cx="385" cy="350" r="6"/><circle cx="517" cy="290" r="6"/></g><circle class="influential" cx="650" cy="140" r="9"/><text x="610" y="118" font-size="16" font-weight="700" fill="#92400e">第5点 (2,9)</text>
<rect class="box" x="740" y="105" width="220" height="255" rx="10"/><line class="all" x1="765" y1="150" x2="815" y2="150"/><text class="small" x="830" y="155">全5点</text><text class="label" x="765" y="188">ŷ = 3.4 + 2x</text><line class="drop" x1="765" y1="235" x2="815" y2="235"/><text class="small" x="830" y="240">第5点を除く</text><text class="label" x="765" y="273">ŷ = 2.6 + 1.2x</text><text class="small" x="765" y="315">傾き: 1.2 → 2.0</text><text class="small" x="765" y="338">切片: 2.6 → 3.4</text>
<text class="small" x="500" y="495" text-anchor="middle">端の点はレバレッジが高い。そこに大きな残差も加わると、係数・回帰直線への影響が大きくなりやすい。</text></svg>
