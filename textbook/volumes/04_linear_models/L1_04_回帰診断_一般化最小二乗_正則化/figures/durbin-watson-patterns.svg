<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc">
<title id="title">Durbin-Watson比と残差列の対応</title>
<desc id="desc">正の系列相関、ほぼ無相関、負の系列相関の残差列を比較し、DW比が2より小さい、約2、大きい場合の直観を示す。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;fill:#222}.panel{fill:#fff;stroke:#cfd5dd;stroke-width:1.4}.axis{stroke:#667085;stroke-width:1.2}.zero{stroke:#98a2b3;stroke-dasharray:5 5}.seq{fill:none;stroke:#2563eb;stroke-width:2.5}.pt{fill:#2563eb}.label{font-size:18px;font-weight:700}.small{font-size:14px;fill:#475467}.dw{font-size:20px;font-weight:700}</style>
<rect width="1080" height="430" fill="#fafafa"/><text x="540" y="32" text-anchor="middle" font-size="24" font-weight="700">DW比は「隣り合う残差がどれだけ違うか」を見る</text>
<g transform="translate(25 60)"><rect class="panel" width="330" height="320" rx="10"/><text class="label" x="20" y="32">正の系列相関</text><line class="axis" x1="45" y1="245" x2="305" y2="245"/><line class="axis" x1="45" y1="65" x2="45" y2="265"/><line class="zero" x1="45" y1="155" x2="305" y2="155"/><polyline class="seq" points="58,98 82,92 106,101 130,111 154,128 178,150 202,172 226,191 250,202 274,194 298,180"/><g class="pt"><circle cx="58" cy="98" r="4"/><circle cx="82" cy="92" r="4"/><circle cx="106" cy="101" r="4"/><circle cx="130" cy="111" r="4"/><circle cx="154" cy="128" r="4"/><circle cx="178" cy="150" r="4"/><circle cx="202" cy="172" r="4"/><circle cx="226" cy="191" r="4"/><circle cx="250" cy="202" r="4"/><circle cx="274" cy="194" r="4"/><circle cx="298" cy="180" r="4"/></g><text class="dw" x="165" y="286" text-anchor="middle">DW &lt; 2</text><text class="small" x="165" y="308" text-anchor="middle">隣接差が小さくなりやすい</text></g>
<g transform="translate(375 60)"><rect class="panel" width="330" height="320" rx="10"/><text class="label" x="20" y="32">強い1次相関なし</text><line class="axis" x1="45" y1="245" x2="305" y2="245"/><line class="axis" x1="45" y1="65" x2="45" y2="265"/><line class="zero" x1="45" y1="155" x2="305" y2="155"/><polyline class="seq" points="58,155 82,195 106,145 130,125 154,165 178,145 202,135 226,125 250,185 274,175 298,155"/><g class="pt"><circle cx="58" cy="155" r="4"/><circle cx="82" cy="195" r="4"/><circle cx="106" cy="145" r="4"/><circle cx="130" cy="125" r="4"/><circle cx="154" cy="165" r="4"/><circle cx="178" cy="145" r="4"/><circle cx="202" cy="135" r="4"/><circle cx="226" cy="125" r="4"/><circle cx="250" cy="185" r="4"/><circle cx="274" cy="175" r="4"/><circle cx="298" cy="155" r="4"/></g><text class="dw" x="165" y="286" text-anchor="middle">DW = 2.00</text><text class="small" x="165" y="308" text-anchor="middle">この例では隣接相関も0</text></g>
<g transform="translate(725 60)"><rect class="panel" width="330" height="320" rx="10"/><text class="label" x="20" y="32">負の系列相関</text><line class="axis" x1="45" y1="245" x2="305" y2="245"/><line class="axis" x1="45" y1="65" x2="45" y2="265"/><line class="zero" x1="45" y1="155" x2="305" y2="155"/><polyline class="seq" points="58,94 82,214 106,99 130,207 154,103 178,211 202,98 226,205 250,108 274,213 298,102"/><g class="pt"><circle cx="58" cy="94" r="4"/><circle cx="82" cy="214" r="4"/><circle cx="106" cy="99" r="4"/><circle cx="130" cy="207" r="4"/><circle cx="154" cy="103" r="4"/><circle cx="178" cy="211" r="4"/><circle cx="202" cy="98" r="4"/><circle cx="226" cy="205" r="4"/><circle cx="250" cy="108" r="4"/><circle cx="274" cy="213" r="4"/><circle cx="298" cy="102" r="4"/></g><text class="dw" x="165" y="286" text-anchor="middle">DW &gt; 2</text><text class="small" x="165" y="308" text-anchor="middle">符号が交互で隣接差が大きくなりやすい</text></g>
<text class="small" x="540" y="410" text-anchor="middle">DW ≈ 2(1−ρ̂₁)。ただし有意判定は「2からの距離」だけで固定的に決めない。</text></svg>
