terms:
  - term: 残差分析
    definition: 観測値と回帰モデルの予測値との差である残差を調べ、平均構造・分散・独立性・外れ方などモデルの不適合を診断すること。
  - term: ハット行列
    definition: 通常最小二乗法で観測ベクトル y を当てはめ値へ写す行列 H=X(X^T X)^{-1}X^T。\hat y=Hy を満たす。
  - term: レバレッジ
    definition: ハット行列の対角要素 h_ii。観測 i の説明変数ベクトルが説明変数空間でどれだけ特異な位置にあるかを表す。
  - term: Student化残差
    definition: 残差 e_i を、その残差の標準偏差を推定した量で割って尺度をそろえた診断量。内部Student化残差では e_i/(s sqrt(1-h_ii)) を用いる。
  - term: Cook距離
    definition: 1観測を除いたときに回帰当てはめ全体がどれだけ変化するかを測る影響度指標。レバレッジと残差の両方が大きい観測で大きくなりやすい。
  - term: 影響点
    definition: その観測を除くことで回帰係数や当てはめ値が大きく変化する観測。高レバレッジ点や大残差点と同義ではない。
  - term: 一般化最小二乗法
    definition: 誤差分散共分散行列が sigma^2 Omega のとき、Omega^{-1} で残差を重み付けして二次形式を最小化する推定法。
  - term: 重み付き最小二乗法
    definition: 観測誤差が独立だが分散が異なる場合などに、精度の高い観測へ大きな重みを与えて残差平方和を最小化する方法。一般化最小二乗法の対角共分散の場合に相当する。
  - term: 白色化
    definition: 誤差の分散共分散行列を単位行列の定数倍へ変換する線形変換。GLSを変換後の通常最小二乗法として理解するために用いる。
  - term: 多重共線性
    definition: 複数の説明変数の間に強い線形関係があり、個々の回帰係数を分離して推定する情報が乏しくなる状態。
  - term: 分散拡大係数
    definition: 説明変数 X_j を他の説明変数で回帰した決定係数を R_j^2 としたとき 1/(1-R_j^2) で定義される、共線性による係数分散の拡大量。
  - term: 変数選択
    definition: 候補となる説明変数の集合から、推測や予測の目的に応じて採用する変数の組合せを選ぶこと。
  - term: L1正則化法
    definition: 損失関数へ回帰係数の絶対値和 lambda sum_j |beta_j| を加える正則化法。十分大きな lambda では一部係数を厳密に0へできる。
  - term: LASSO
    definition: 二乗誤差にL1罰則を加えた回帰法。Least Absolute Shrinkage and Selection Operator の略。
  - term: 軟閾値関数
    definition: S(z,lambda)=sign(z)(|z|-lambda)_+ で定義される関数。直交設計のLASSO解を与える。
