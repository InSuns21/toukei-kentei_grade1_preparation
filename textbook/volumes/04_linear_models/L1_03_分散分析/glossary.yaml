chapter: "L1-03"
terms:
  - { term: 一元配置分散分析, meaning: 1因子の複数水準について平均差を群間変動と群内変動から検定する方法 }
  - { term: 二元配置分散分析, meaning: 2因子の主効果と交互作用を変動分解して調べる方法 }
  - { term: 主効果, meaning: 他因子の水準について平均したときの因子の効果 }
  - { term: 交互作用, meaning: 一方の因子の効果が他方の因子の水準で変化すること }
  - { term: 家族内第一種過誤, meaning: 複数の検定のうち少なくとも1つで誤棄却する確率 }
  - { term: ボンフェローニ法, meaning: 各比較の有意水準を分割して家族内第一種過誤を制御する方法 }
  - { term: シェッフェ法, meaning: 任意の線形対比を同時に保護する多重比較法 }
