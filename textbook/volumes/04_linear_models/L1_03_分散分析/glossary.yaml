chapter: "L1-03"
terms:
  - { term: 分散分析, meaning: 平均差を群間変動と群内変動の比で評価する方法 }
  - { term: 主効果, meaning: 他因子の水準を平均したときの一つの因子の効果 }
  - { term: 交互作用, meaning: 一つの因子の効果が別の因子の水準に依存して変わること }
  - { term: 平均平方, meaning: 平方和を対応する自由度で割った量 }
  - { term: 多重比較, meaning: 複数の平均差や対比を同時に検討し家族全体の誤りを管理する比較 }
  - { term: 家族内第一種過誤, meaning: 一群の検定のうち少なくとも一つを誤って棄却する事象 }
  - { term: Bonferroni法, meaning: 比較数で有意水準を分割して家族内第一種過誤を上から抑える方法 }
  - { term: Scheffé法, meaning: 任意の線形対比を含む広い比較集合をF分布で同時に保護する方法 }
