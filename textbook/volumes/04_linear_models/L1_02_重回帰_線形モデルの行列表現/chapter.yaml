learning_objectives:
  - 線形モデルを行列表現し各量の次元を確認できる
  - 正規方程式から最小二乗推定量を導ける
  - 推定量の分散共分散行列と線形結合の分布を導ける
  - ガウス・マルコフの定理の分散比較を再現できる
  - 線形対比と一般の線形結合を区別できる
  - 制約付き最小二乗と一般線形仮説のF検定を導ける
