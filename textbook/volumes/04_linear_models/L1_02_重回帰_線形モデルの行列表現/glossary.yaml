chapter: "L1-02"
terms:
  - { term: 線形モデル, meaning: 応答の平均を未知係数の線形結合で表すモデル }
  - { term: 計画行列, meaning: 各観測の説明変数を行として並べた行列 }
  - { term: 射影行列, meaning: 観測ベクトルを計画行列の列空間へ直交射影する行列 }
  - { term: ガウス・マルコフの定理, meaning: 等分散・無相関誤差のもとで最小二乗推定量が線形不偏推定量の中で最小分散となる定理 }
  - { term: 線形対比, meaning: 群平均の係数和が0となる線形結合 }
  - { term: 線形制約, meaning: 回帰係数に課す線形方程式の条件 }
  - { term: 一般線形仮説, meaning: 複数の線形制約をまとめて検定する仮説 }
