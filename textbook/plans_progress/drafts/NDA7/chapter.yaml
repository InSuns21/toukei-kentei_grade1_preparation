id: "NDA7"
title: "Thue–Siegel–Rothの定理"
volume: "foundations"
status: supplementary
prerequisites:
  - NDA6
  - FLD1
official_scope: []
learning_objectives:
  - Rothの定理を任意のepsilonと有限個の既約分数の量化込みで説明できる
  - Rothの定理を前提として有限例外から一様下界と代数的無理数の無理性指数2を導出できる
  - 整数行列の非零核ベクトルに対する箱詰め補題を証明できる
  - 多項式の高さと展開係数を計算し、代数的な点に消滅条件を課す線形代数を再現できる
  - 消滅条件の存在とRothの完全証明の差を説明できる
  - Rothの定理を三次Thue型方程式の整数解の有限性へ適用できる
definitions:
  - { id: NDA7-DEF-01, name: 多項式の高さ }
  - { id: NDA7-DEF-02, name: 多変数多項式の展開係数 }
theorems:
  - { id: NDA7-THM-01, name: Thue–Siegel–Rothの定理, proof_status: unproved }
  - { id: NDA7-LEM-01, name: 有限例外から一様下界 }
  - { id: NDA7-COR-01, name: Rothの定数付き下界, conditional_on: NDA7-THM-01 }
  - { id: NDA7-THM-02, name: 代数的無理数の無理性指数, conditional_on: NDA7-THM-01 }
  - { id: NDA7-LEM-02, name: 整数線形方程式の箱詰め補題 }
  - { id: NDA7-LEM-03, name: 代数的な点での高次消滅条件 }
canonical_examples:
  - 平方根2と三乗根2における次数依存のLiouville下界とRoth指数の対比
  - 2行3列整数行列の整数核ベクトル
  - X-Yの冪による消滅条件だけでは非消滅を保証しない例
  - pの三乗と2qの三乗の差が±1となる整数方程式
problem_patterns:
  - NDA7-ROTH-QUANTIFIERS
  - NDA7-FINITE-EXCEPTIONS
  - NDA7-INTEGER-KERNEL
  - NDA7-AUXILIARY-VANISHING
  - NDA7-THUE-EQUATION-FINITENESS
exercise_counts: { level_a: 5, level_b: 3, level_c: 1, level_d: 0 }
estimated_hours: { reading: 9, exercises: 5, review: 4 }
past_exam_alignment: []
integrated_exam_problems: []
