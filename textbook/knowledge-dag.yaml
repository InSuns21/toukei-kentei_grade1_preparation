version: 1
scope: textbook

# 通常教材の知識DAG監査ポリシー。
# 章間DAGの正本は curriculum.yaml の prerequisites、章内の定義・定理は chapter.yaml / glossary.yaml。
# このファイルは「高信頼に機械検出したい概念」の別名・導入位置だけを補う。
# 自由文から全専門語を自動抽出すると誤検知が増えるため、確認済み概念から段階登録する。

strict:
  reject_future_volume_prerequisite: true
  reject_prerequisite_metadata_drift: true
  reject_unreachable_registered_concept: true
  reject_unresolved_concept_dependency: true

rollout:
  # 章DAGの既存負債は解消済み。登録概念は全通常章を strict に監査する。
  existing_findings: error

concepts:
  - id: blue
    name: BLUE
    aliases:
      - 最良線形不偏推定量
    # 現状は I1-02 と L1-02 の双方で自己完結に導入されている。
    # 重複整理後に canonical な導入章を1つへ絞る。
    introduced_in: [I1-02, L1-02]

  - id: gauss-markov-theorem
    name: ガウス・マルコフの定理
    aliases:
      - ガウス・マルコフ
      - Gauss--Markov
      - Gauss-Markov
    introduced_in: L1-02

  - id: sufficient-statistic
    name: 十分統計量
    aliases:
      - sufficient statistic
    introduced_in: S1-02

  - id: maximum-likelihood-estimator
    name: 最尤推定量
    aliases:
      - maximum likelihood estimator
      - maximum-likelihood estimator
      - MLE
    introduced_in: I1-01

  - id: score-function
    name: スコア関数
    aliases:
      - score function
    introduced_in: I1-01

  - id: fisher-information
    name: Fisher情報量
    aliases:
      - フィッシャー情報量
      - Fisher information
    introduced_in: I1-02
    requires: [score-function]

  - id: cramer-rao-inequality
    name: Cramér--Rao不等式
    aliases:
      - Cramér–Rao不等式
      - Cramer--Rao不等式
      - Cramer-Rao inequality
      - クラーメル・ラオの不等式
      - クラーメル・ラオ不等式
      - Cramér--Rao下限
      - Cramér–Rao下限
      - CRLB
    introduced_in: I1-02
    requires: [fisher-information]

  - id: slutsky-theorem
    name: Slutskyの定理
    aliases:
      - Slutsky型の定理
      - スルツキーの定理
      - Slutsky theorem
    introduced_in: P4-02

  - id: delta-method
    name: デルタ法
    aliases:
      - Delta法
      - delta method
    introduced_in: P4-02
    requires: [slutsky-theorem]

  - id: likelihood-ratio-test
    name: 尤度比検定
    aliases:
      - 尤度比統計量
      - likelihood ratio test
      - likelihood-ratio test
    introduced_in: I3-02
    requires: [maximum-likelihood-estimator]

  - id: score-test
    name: スコア型検定
    aliases:
      - Score検定
      - スコア検定
      - score test
    introduced_in: I3-02
    requires: [score-function, fisher-information]

  - id: kkt-conditions
    name: KKT条件
    aliases:
      - KKT conditions
      - Karush--Kuhn--Tucker条件
      - Karush-Kuhn-Tucker conditions
    # 通常教材では E1-04 §7.3 が4条件を自己完結に導入する。
    # より一般の導出は supplementary の F0-02 / F0-02A に委ねる。
    introduced_in: E1-04

  - id: consistency
    name: 一致性
    aliases:
      - 一致推定量
      - consistency
      - consistent estimator
    # P4-02 で確率収束を推定量の言葉へ読み替えて正式導入し、
    # I1-02 で推定量評価の観点から自己完結に再導入する。
    introduced_in: [P4-02, I1-02]

  - id: mle-asymptotic-normality
    name: 最尤推定量の漸近正規性
    aliases:
      - MLEの漸近正規性
      - MLE asymptotic normality
      - asymptotic normality of the MLE
    introduced_in: I2-01
    requires: [maximum-likelihood-estimator, fisher-information, consistency, slutsky-theorem]

  - id: root-n-asymptotic-variance
    name: root-$n$ 漸近分散
    aliases:
      - root-n 漸近分散
      - AVar
    introduced_in: I2-01

  - id: neyman-pearson-lemma
    name: ネイマン・ピアソン補題
    aliases:
      - NP補題
      - Neyman--Pearson lemma
      - Neyman-Pearson lemma
    introduced_in: I3-01

  - id: uniformly-most-powerful-test
    name: 一様最強力検定
    aliases:
      - UMP検定
      - uniformly most powerful test
    introduced_in: I3-01
    requires: [neyman-pearson-lemma]

  - id: wald-test
    name: ワルド型検定
    aliases:
      - Wald検定
      - ワルド検定
      - Wald test
    introduced_in: I3-02
    requires: [root-n-asymptotic-variance]

  - id: wilks-theorem
    name: Wilksの定理
    aliases:
      - ウィルクスの定理
      - Wilks theorem
    introduced_in: I3-02
    requires: [likelihood-ratio-test]

  - id: expectation-maximization
    name: 期待値最大化法
    aliases:
      - EMアルゴリズム
      - EM法
      - expectation-maximization algorithm
      - expectation maximization algorithm
    introduced_in: I4-02
    requires: [maximum-likelihood-estimator]

  - id: complete-statistic
    name: 完備統計量
    aliases:
      - 統計量の完備性
      - complete statistic
      - completeness of a statistic
    introduced_in: S1-02

  - id: rao-blackwell-theorem
    name: Rao--Blackwellの定理
    aliases:
      - Rao–Blackwellの定理
      - ラオ・ブラックウェルの定理
      - Rao-Blackwell theorem
      - Rao--Blackwell theorem
    introduced_in: S1-02
    requires: [sufficient-statistic]

  - id: umvu-estimator
    name: 一様最小分散不偏推定量
    aliases:
      - UMVU推定量
      - UMVU estimator
      - uniformly minimum variance unbiased estimator
    introduced_in: S1-02

  - id: lehmann-scheffe-theorem
    name: Lehmann--Schefféの定理
    aliases:
      - Lehmann–Schefféの定理
      - レーマン・シェッフェの定理
      - Lehmann-Scheffe theorem
      - Lehmann--Scheffe theorem
    introduced_in: S1-02
    requires: [sufficient-statistic, complete-statistic, rao-blackwell-theorem, umvu-estimator]

  - id: factorization-theorem
    name: ネイマンの分解定理
    aliases:
      - Neyman factorization theorem
      - Fisher--Neyman factorization theorem
      - Fisher-Neyman factorization theorem
    introduced_in: S1-02
    requires: [sufficient-statistic]

  - id: minimal-sufficient-statistic
    name: 最小十分統計量
    aliases:
      - minimal sufficient statistic
    introduced_in: S1-02
    requires: [sufficient-statistic]

  - id: exponential-family
    name: 指数型分布族
    aliases:
      - exponential family
    introduced_in: S1-02
    requires: [factorization-theorem]

  - id: likelihood-function
    name: 尤度関数
    aliases:
      - likelihood function
    introduced_in: I1-01

  - id: log-likelihood-function
    name: 対数尤度関数
    aliases:
      - 対数尤度
      - log-likelihood function
      - log likelihood
    introduced_in: I1-01
    requires: [likelihood-function]

  - id: unbiased-estimator
    name: 不偏推定量
    aliases:
      - unbiased estimator
    # P2-01 で期待値の応用として最小限を正式導入し、I1-02 で推定量評価として再導入する。
    introduced_in: [P2-01, I1-02]

  - id: efficient-estimator
    name: 有効推定量
    aliases:
      - efficient estimator
    introduced_in: I1-02
    requires: [cramer-rao-inequality]

  - id: relative-efficiency
    name: 推定量の相対効率
    aliases:
      - relative efficiency of estimators
      - estimator relative efficiency
    introduced_in: I1-02

  - id: method-of-moments
    name: モーメント法
    aliases:
      - method of moments
      - method-of-moments
    introduced_in: I1-02

  - id: least-squares-method
    name: 最小二乗法
    aliases:
      - least squares method
      - least-squares method
    introduced_in: I1-02

  - id: estimator-bias
    name: 推定量のバイアス
    aliases:
      - estimator bias
      - bias of an estimator
    introduced_in: I1-02

  - id: estimator-mean-squared-error
    name: 推定量の平均二乗誤差
    aliases:
      - estimator MSE
      - mean squared error of an estimator
      - mean-squared error of an estimator
    introduced_in: I1-02

  - id: ancillary-statistic
    name: 付随統計量
    aliases:
      - ancillary statistic
    introduced_in: S1-02

  - id: confidence-interval
    name: 信頼区間
    aliases:
      - confidence interval
    introduced_in: I2-02

  - id: pivotal-quantity
    name: ピボット量
    aliases:
      - pivotal quantity
      - pivot quantity
    introduced_in: I2-02

  - id: null-hypothesis
    name: 帰無仮説
    aliases:
      - null hypothesis
    introduced_in: I3-01

  - id: alternative-hypothesis
    name: 対立仮説
    aliases:
      - alternative hypothesis
    introduced_in: I3-01

  - id: test-function
    name: 検定関数
    aliases:
      - test function
    introduced_in: I3-01
    requires: [null-hypothesis, alternative-hypothesis]

  - id: rejection-region
    name: 棄却域
    aliases:
      - rejection region
      - critical region
    introduced_in: I3-01
    requires: [test-function]

  - id: test-statistic
    name: 検定統計量
    aliases:
      - test statistic
    introduced_in: I3-01
    requires: [rejection-region]

  - id: type-one-error
    name: 第一種の過誤
    aliases:
      - 第一種過誤
      - type I error
    introduced_in: I3-01
    requires: [null-hypothesis, rejection-region]

  - id: significance-level
    name: 有意水準
    aliases:
      - significance level
    introduced_in: I3-01
    requires: [type-one-error]

  - id: type-two-error
    name: 第二種の過誤
    aliases:
      - 第二種過誤
      - type II error
    introduced_in: I3-01
    requires: [alternative-hypothesis, rejection-region]

  - id: power-function
    name: 検出力関数
    aliases:
      - power function
    introduced_in: I3-01
    requires: [type-two-error]

  - id: p-value
    name: P値
    aliases:
      - p-value
    introduced_in: I3-01
    requires: [significance-level, rejection-region]

  - id: power-curve
    name: 検出力曲線
    aliases:
      - power curve
    introduced_in: I3-01
    requires: [power-function]

  - id: most-powerful-test
    name: 最強力検定
    aliases:
      - most powerful test
      - most-powerful test
    introduced_in: I3-01
    requires: [significance-level, power-function]

  - id: randomized-test
    name: ランダム化検定
    aliases:
      - randomized test
      - randomised test
    introduced_in: I3-01
    requires: [test-function, significance-level]

  - id: test-confidence-duality
    name: 検定と信頼集合の双対性
    aliases:
      - 検定と信頼区間の双対性
      - test-confidence set duality
      - duality between tests and confidence sets
    introduced_in: I3-01
    requires: [significance-level, confidence-interval]
