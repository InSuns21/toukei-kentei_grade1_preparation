version: 1
scope: dream-theater
metadata_file: knowledge.yaml

# DREAM THEATER 専用の概念依存監査ポリシー。
# 通常教材の chapter.yaml / glossary.yaml とは共用しない。
# 各 DREAM THEATER ページの概念は、そのページ直下の knowledge.yaml を正本とする。
# chapter.yaml / glossary.yaml は移行時の参考にはしてよいが、CIの入力にはしない。

strict:
  require_knowledge_for_changed_formal_page: true
  require_registered_formal_declaration: true
  reject_unreachable_registered_concept: true
  reject_unresolved_concept_dependency: true

dependency_tracking:
  # 教材内では正式に証明・参照するが、後続章の prerequisite 到達性としては追跡しない基礎結果。
  # 高校数学〜大学初年級の復習事項に限定し、専門的な主要定理の依存隠しには使わない。
  reachability_exempt_concepts:
    - analysis.chain-rule
    # 共通記号として notation-guide.md と LA3A 等の初出で独立に意味を説明する。
    # VC7 の3次元・Einstein縮約の formal owner を他系列の prerequisite にはしない。
    - vector-calculus.kronecker-delta

alias_matching:
  # 真の別称ではあるが、分野横断では多義的で自由文の部分一致だけでは意味を確定できない語。
  # formal label、完全一致の強調・リンク文字列・引用など、明示的な概念参照だけを高信頼使用とする。
  contextual_aliases:
    # 束の局所枠・複素束の遷移関数は、分布論・代数幾何の同形語にも使われる。
    # 一般文の部分一致では所有概念を確定せず、明示した参照だけを照合する。
    - 局所枠
    - 遷移関数
    # 環論とBanach環の極大イデアル、および複素解析・幾何・代数幾何の各種関数の芽を区別する。
    # 一般語や複合語の部分一致では所有分野を確定できないため、明示的参照だけ追跡する。
    - 極大イデアル
    - 芽
    - 関数の芽
    # 幾何解析と複素解析の最大値・調和性、PDEの切断操作と代数幾何の局所化、
    # 双線形形式の強圧条件と凸関数のcoercivityは文脈により別概念。
    # 自由文の部分一致のみで別分野のcanonical概念に帰属させない。
    - 最大値原理
    - 調和関数
    - 局所化
    - 強圧性
    # 連続時間のODE9と離散時間のDYN8で同名となる標準用語。文脈を明示したformal参照だけを追跡する。
    - 正の極限集合
    # 複素解析の原始関数・数値解析の原始行列・ODEの逆変換・解析力学の作用は、
    # 実変数の不定積分、一般の可逆座標変換、行列の積分、作用素ノルムにも部分一致する。
    # 数学用語を不自然に改名せず、明示的にその概念を参照するときだけ依存判定する。
    - 原始関数
    - 原始行列
    - 逆変換
    - 作用
    # 分野ごとに異なる意味で使う標準語や、より長い専門語の一部となる語。
    # CAの局所近傍・粒子流束・有限伝播・移動台数の上限を、
    # 位相近傍・ベクトル解析の流束・PDEの有限伝播・最大流と混同しない。
    # formal labelや完全一致した強調・リンク文字列では引き続き使用を検出する。
    - 近傍
    - 流束
    - 有限伝播
    - 上限
    - 上界
    - 最大流
    # 一般最適化の「最小化」は計算可能性理論の μ-最小化を意味しない。
    # グラフの連結性と位相空間の連結性、離散と連続のLaplacianを区別する。
    # 節点電位・枝電流は電磁気学でも扱うが、各科目の局所定義を自由文で誤認しない。
    - 最小化
    - 連結性
    - Laplacian
    - 電位
    - 電流
    - net
    - ネット
    - unit
    - torus
    - トーラス
    - 正規性
    - 正定値
    - normality
    - 埋め込み
    - embedding
    - 最小多項式
    - minimal polynomial
    - Frobenius の定理
    - Frobenius theorem
    - 位相
    - topology
    - support
    - 単体
    - simplex
    - 残差
    - residual
    - 平行移動
    # 凸解析の実アフィン超平面と射影幾何の斉次一次方程式の超平面を同一概念と誤認しない。
    - 超平面
    - 接平面
    - tangent plane
    - 法線
    - normal vector
    - 特性関数
    - 配分
    - 整合性
    - consistency
    - 弱収束
    - weak convergence
    - Green核
    - Green関数
    - グリーン関数
    - 座標写像
    - cycle
    - 三角形分割
    - triangulation
    - 交換子
    - commutator
    - 対応
    - correspondence
    # C*-環の状態と量子系の純粋状態、および時系列と作用素のスペクトル測度は別概念。
    # 自由文内の部分一致だけでは特定の canonical owner への依存とはしない。
    # 情報理論と熱力学で意味・単位・定義が異なり、文脈なしの短語一致では帰属を確定できない。
    - エントロピー
    - 状態
    - スペクトル測度
    - 跡
    - 中心
    - 錐
    # canonical name 自体が短く、別の専門語や一般的な説明句の一部へ部分一致しやすいものも含む。
    # 例: 「群」は「半群」の末尾、「刻み幅」は数値 ODE 以外の差分・近似でも一般語として現れる。
    - 群
    - 刻み幅
    # 分野横断で多義的、または別の専門語の一部として現れやすい語。
    # 自由文の部分一致ではなく、formal label・完全一致リンク等だけを高信頼参照とする。
    - differential
    - コア
    - 形作用素
    - 線形連立系
    - 核ベクトル
    - 特性多項式
    - 境界
    - 部分和
    - 境界条件
    - 常点
    - 発散
    - 特異点
    - 切断
    # 同形語を別分野のownerへ誤帰属しない。局所基底は線束と位相基、
    # 正則関数は代数的正則関数と複素解析、局所切断は一般の層と分布で異なる。
    - 局所基底
    - 正則関数
    - 局所切断
    - truncation
    - Cauchy列
    - 回転
    - スペクトル
    - spectrum
    - 鎖
    - chain
    - 置換
    - permutation
    - 互換
    - transposition
    - 三角多項式
    - trigonometric polynomial
    # 複数分野で標準的に使う語。ODE1/ODE9 固有概念への自由文部分一致としては扱わない。
    # formal label や明示的参照では従来どおり高信頼使用として検出する。
    - Lipschitz条件
    - Lipschitz 条件
    - Lyapunov 関数
    # 真の別称だが一般語として別分野でも頻出するため、自由文の部分一致だけでは依存を確定しない。
    - path
    - 一様ノルム
    - cancellation
    - compensator
    - 閉形式
    - 積分方程式
    # semigroup / Markov theory で分野横断に用いるため、自由文の部分一致だけでは所有概念を確定しない。
    - 生成作用素
    # SATの真偽値割当てで使う「充足可能」と、モデル理論の「充足」は文脈依存。
    - 充足
    - generator
    - infinitesimal generator
    # 『無限小生成子』の一部分を超準解析の無限小超実数へ誤対応させない。
    - 無限小
    # 滑らかな多様体の外微分形式と代数曲線上のKähler微分1形式は別の構成。
    # 「微分形式」の自由文部分一致だけでGEO7への依存とは判断しない。
    - 微分形式
    # 微分形式の内部積とテンソルの添字縮約は文脈で区別する。
    - 縮約
    # Fourier解析と整数論では畳み込みの演算対象が異なるため、自由文の部分一致では導入元を確定しない。
    - 畳み込み

rollout:
  # 既存ページは段階移行する。未移行ページそのものは audit では報告するが、
  # changed-only CI では変更ページだけを strict にする。
  missing_existing_knowledge: audit

formal_kinds:
  - definition
  - theorem
  - lemma
  - proposition
  - corollary

# 登録概念・formal statement・requires 依存関係に加え、changed-only CI では
# 高信頼の未定義専門語候補、local concept の first-use、曖昧 alias 使用も検査する。
# HTMLタグ・属性、コード、数式、URLなど読者本文ではない文字列は概念使用として扱わない。
# contextual_aliases は自由文の部分一致だけでは blocking にせず、明示的な高信頼参照だけを使用判定する。
# concept の name も matcher 上は aliases と同列に扱われるため、短い canonical name にもこの指定を使える。
# aliases は同一概念の真の別称だけに使い、関連語・検索語・構成要素を入れない。
# 複合見出し・formal label は introduction_aliases、再掲は一意な再掲名 + canonical concept への requires で表す。
# stable ID / anchor は後方互換性を担うが、alias は担わない。意味的に誤った alias を互換目的で残さない。
# 数学的意味を持つ記号（例: 弱*位相の *）は alias 正規化で失わない。
# 既存違反は audit/WARN に残し、新しく持ち込む違反だけを merge blocker にする。
