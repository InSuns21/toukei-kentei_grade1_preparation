version: 2
updated: 2026-10-12

# 全系列に共通するルーティング設定のみ。現在地は各系列manifestの章statusから導出する。
# 章を進めるたびに共有ファイルを書き換えず、異なる系列の並行作業を可能にする。
# ID未指定の場合、未完了系列が一つならそれを選び、複数なら系列を確認する。
routing:
  series_directory: textbook/dream-theater-series
  chapter_root: textbook/volumes/dream_thater
  authoring_standard: textbook/DREAM_THEATER_AUTHORING_STANDARD.md
  exercise_policy: textbook/DREAM_THEATER_EXERCISE_POLICY.md
  public_contents: textbook/dream-theater.md
  knowledge_dag: textbook/knowledge-dag.yaml

validation:
  pull_request:
    mode: changed_only
    commands:
      - npm run validate:textbook:changed
      - npm run validate:textbook-knowledge:changed
      - npm run validate:dream-theater-concepts:changed
  full:
    mode: main_or_nightly
    workflow: .github/workflows/validate-textbook.yml
