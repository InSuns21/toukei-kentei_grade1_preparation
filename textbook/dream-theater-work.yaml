version: 1
updated: 2026-10-12

active_series: SYM
active_plan: textbook/plans_progress/DREAM_THEATER_SYMPLECTIC_GEOMETRY_I_PLAN.md
series_manifest: textbook/dream-theater-series/SYM.yaml

completed_through: SYM2
next_work: SYM3
after_next: SYM4

# SYM1〜SYM2実装・査読・公開済。SYM3以降と科目横断監査は進行中。

# 次章の執筆と直前完了章の追跡監査を同じ作業単位で実施する。
# target_source は固定の章IDではなく、着手時の routing と series manifest から解決する。
review_handoff:
  enabled: true
  mode: paired_previous_chapter_audit
  with_work_source: next_work
  target_source: completed_through
  target_series_source: series_manifest
  authoring_standard_section: "10.3"
  evidence_template: textbook/prompts/dream-theater-review-evidence.md

routing:
  chapter_root: textbook/volumes/00_foundations
  authoring_standard: textbook/DREAM_THEATER_AUTHORING_STANDARD.md
  exercise_policy: textbook/DREAM_THEATER_EXERCISE_POLICY.md
  global_index: textbook/dream-theater-index.json
  knowledge_dag: textbook/knowledge-dag.yaml

validation:
  pull_request:
    mode: changed_only
    commands:
      - npm run validate:textbook:changed
      - npm run validate:textbook-knowledge:changed
      - npm run validate:dream-theater-concepts:changed
  full:
    mode: main_or_nightly
    workflow: .github/workflows/validate-textbook.yml
