learning_objectives:
  - winding numberを定義し、整数値性・局所定数性と一般閉曲線の留数定理への接続を説明できる
  - CA4の単純閉曲線版留数定理・偏角原理をindexで重み付けした一般閉曲線版へ拡張できる
  - 解析接続の一意性を恒等定理から導き、経路に沿う解析接続を定式化できる
  - monodromy theoremで単連結性が経路独立性を生む箇所をホモトピー分割から説明できる
