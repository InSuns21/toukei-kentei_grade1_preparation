name: Temporary LA3A-D CI fixes

on:
  push:
    branches:
      - audit/la3abcd-quality-20260912

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[ci-fix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/la3abcd-quality-20260912
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply CI fixes
        run: python .github/tmp/fix_la3abcd_ci.py
      - name: Remove temporary machinery
        run: |
          rm -f .github/tmp/fix_la3abcd_ci.py
          rm -f .github/workflows/tmp-la3abcd-ci-fix.yml
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add textbook/volumes/00_foundations/LA3A/index.md \
                  textbook/volumes/00_foundations/LA3B/index.md \
                  textbook/volumes/00_foundations/LA3C/index.md \
                  .github/tmp/fix_la3abcd_ci.py \
                  .github/workflows/tmp-la3abcd-ci-fix.yml
          git commit -m "Fix LA3A-D audit references and alias collisions [ci-fix-applied]"
          git push origin HEAD:audit/la3abcd-quality-20260912
