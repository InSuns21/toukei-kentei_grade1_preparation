name: Deploy learning site to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'pages/**'
      - 'textbook/**'
      - 'statistical-mathematics/**'
      - 'applied-rikou-80/**'
      - 'anki/**'
      - 'references/**'
      - 'scripts/**'
      - 'CONTENT_GUIDELINES.md'
      - 'EXERCISE_GUIDELINES.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate statistical mathematics KaTeX
        run: npm run validate:mathstat

      - name: Validate applied science KaTeX
        run: npm run validate:rikou80

      - name: Validate shared exercise style
        run: npm run validate:exercise-style

      - name: Audit detailed-solution granularity
        run: npm run audit:granularity

      - name: Audit textbook detailed-solution granularity
        run: npm run audit:textbook-granularity

      - name: Assemble and validate Pages site
        run: npm run validate:pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Smoke-test changed published Pages files
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Smoke-test changed public paths
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          BASE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python3 scripts/smoke-pages-live.py --base-url "$PAGE_URL" --mode full
          else
            python3 scripts/smoke-pages-live.py --base-url "$PAGE_URL" --mode changed --base-sha "$BASE_SHA"
          fi
