name: Deploy learning site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate statistical mathematics KaTeX
        run: npm run validate:mathstat

      - name: Validate applied science KaTeX
        run: npm run validate:rikou80

      - name: Validate shared exercise style
        run: npm run validate:exercise-style

      - name: Audit detailed-solution granularity
        run: npm run audit:granularity

      - name: Audit textbook detailed-solution granularity
        run: npm run audit:textbook-granularity

      - name: Assemble and validate Pages site
        run: npm run validate:pages

      - name: Create published-file manifest
        run: find _site -type f ! -name '.nojekyll' -printf '%P\n' | LC_ALL=C sort > _site/pages-manifest.txt

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Smoke-test published Pages files
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Fetch every published file and fail on HTTP errors
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import os
          import time
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from urllib.error import HTTPError, URLError
          from urllib.parse import quote, urljoin
          from urllib.request import Request, urlopen

          base = os.environ['PAGE_URL']
          if not base.endswith('/'):
              base += '/'

          def fetch(url, attempts=5):
              last = None
              for attempt in range(attempts):
                  try:
                      request = Request(url, headers={'User-Agent': 'toukei-pages-smoke/1.0'})
                      with urlopen(request, timeout=30) as response:
                          status = response.status
                          response.read()
                          if not 200 <= status < 300:
                              raise RuntimeError(f'HTTP {status}: {url}')
                          return status
                  except (HTTPError, URLError, TimeoutError, RuntimeError) as exc:
                      last = exc
                      if attempt + 1 < attempts:
                          time.sleep(2 * (attempt + 1))
              raise RuntimeError(f'{url}: {last}')

          manifest_url = urljoin(base, 'pages-manifest.txt')
          fetch(manifest_url)
          with urlopen(Request(manifest_url, headers={'User-Agent': 'toukei-pages-smoke/1.0'}), timeout=30) as response:
              paths = [line.strip() for line in response.read().decode('utf-8').splitlines() if line.strip()]

          # The manifest itself is already checked above. Every other generated
          # file is fetched from the actual GitHub Pages origin after deployment.
          targets = [path for path in paths if path != 'pages-manifest.txt']

          def check(path):
              encoded = quote(path, safe='/._-~')
              url = urljoin(base, encoded)
              fetch(url)
              return path

          failures = []
          with ThreadPoolExecutor(max_workers=16) as pool:
              futures = {pool.submit(check, path): path for path in targets}
              for future in as_completed(futures):
                  path = futures[future]
                  try:
                      future.result()
                  except Exception as exc:
                      failures.append((path, str(exc)))

          if failures:
              print(f'Live GitHub Pages smoke test failed for {len(failures)} file(s):')
              for path, error in failures:
                  print(f'- {path}: {error}')
              raise SystemExit(1)

          print(f'Live GitHub Pages smoke test passed: {len(targets) + 1} published files returned HTTP 2xx.')
          print(f'Pages URL: {base}')
          PY
