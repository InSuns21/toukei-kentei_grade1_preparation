name: Validate LVT JSON Lines oracle
on:
  pull_request:
    paths:
      - 'textbook/volumes/dream_thater/計算系/LVT/LVT5-02/**'
      - 'textbook/volumes/dream_thater/計算系/LVT/LVT5-03/**'
      - 'textbook/volumes/dream_thater/計算系/LVT/LVT5-04/**'
      - 'textbook/volumes/dream_thater/計算系/LVT/LVT5-05/**'
      - 'textbook/volumes/dream_thater/計算系/LVT/LVT3-01/lab/**'
      - '.github/workflows/validate-lvt-oracle.yml'
  push:
    branches: [main]
    paths:
      - 'textbook/volumes/dream_thater/計算系/LVT/LVT5-02/**'
      - 'textbook/volumes/dream_thater/計算系/LVT/LVT5-03/**'
      - 'textbook/volumes/dream_thater/計算系/LVT/LVT5-04/**'
      - 'textbook/volumes/dream_thater/計算系/LVT/LVT5-05/**'
      - 'textbook/volumes/dream_thater/計算系/LVT/LVT3-01/lab/**'
      - '.github/workflows/validate-lvt-oracle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean-oracle:
    name: Lean JSON Lines and process checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee
        with:
          lake-package-directory: 'textbook/volumes/dream_thater/計算系/LVT/LVT5-02/lab'
          auto-config: 'false'
          build: 'true'
          test: 'true'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - name: Check pinned version, proofs and CLI
        working-directory: 'textbook/volumes/dream_thater/計算系/LVT/LVT5-02/lab'
        shell: bash
        run: |
          lean --version | grep -F 'version 4.35.0'
          lake env lean LvtOracle.lean | tee inspect.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          output = Path('inspect.log').read_text()
          entries = re.findall(r"depends on axioms:\s*\[([^\]]*)\]", output)
          empty = len(re.findall(r"does not depend on any axioms", output))
          assert len(entries) + empty == 2, output
          for entry in entries:
              assert set(x.strip() for x in entry.split(',') if x.strip()) <= {'propext', 'Classical.choice', 'Quot.sound'}, entry
          PY
          python3 compare.py
          if lake env lean Failure.lean > failure.log 2>&1; then
            echo 'Invalid proof unexpectedly accepted'
            exit 1
          fi
          cat failure.log
          grep -i 'type mismatch' failure.log
      - name: Check strict comparison against the Lean CLI
        working-directory: 'textbook/volumes/dream_thater/計算系/LVT/LVT5-03/lab'
        run: python3 audit.py ../../LVT5-02/lab/.lake/build/bin/lvtOracle
      - name: Check serialization proof and test driver
        working-directory: 'textbook/volumes/dream_thater/計算系/LVT/LVT5-03/lab'
        shell: bash
        run: |
          lake build
          lake test
          lake env lean LvtSerialization.lean | tee inspect.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          output = Path('inspect.log').read_text()
          entries = re.findall(r"depends on axioms:\s*\[([^\]]*)\]", output)
          empty = len(re.findall(r"does not depend on any axioms", output))
          assert len(entries) + empty == 2, output
          for entry in entries:
              assert set(x.strip() for x in entry.split(',') if x.strip()) <= {'propext', 'Classical.choice', 'Quot.sound'}, entry
          PY
          if lake env lean Failure.lean > failure.log 2>&1; then
            echo 'Invalid proof unexpectedly accepted'
            exit 1
          fi
          cat failure.log
          grep -Ei 'type mismatch|rfl.*failed|not definitionally equal' failure.log
      - name: Check Python Hypothesis differential tests and boundary proof
        working-directory: 'textbook/volumes/dream_thater/計算系/LVT/LVT5-04/lab'
        shell: bash
        run: |
          lake build
          lake test
          lake env lean LvtPythonDrt.lean
          if lake env lean Failure.lean > failure.log 2>&1; then
            echo 'Invalid proof unexpectedly accepted'
            exit 1
          fi
          grep -i 'type mismatch' failure.log
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install -r requirements.txt
          python -m pytest -q
          python differential.py discover /tmp/lvt-counterexample.json
          python differential.py replay /tmp/lvt-counterexample.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Check TypeScript fast-check asynchronous differential tests
        working-directory: 'textbook/volumes/dream_thater/計算系/LVT/LVT5-05/lab'
        shell: bash
        run: |
          lake build
          lake test
          lake env lean LvtTypeScriptDrt.lean
          if lake env lean Failure.lean > failure.log 2>&1; then
            echo 'Invalid proof unexpectedly accepted'
            exit 1
          fi
          grep -i 'type mismatch' failure.log
          npm install --ignore-scripts
          npm test
          npm run discover -- /tmp/lvt-ts-counterexample.json
          npm run replay -- /tmp/lvt-ts-counterexample.json
