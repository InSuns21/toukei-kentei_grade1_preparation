name: Validate LVT JSON Lines oracle
on:
  pull_request:
    paths:
      - 'textbook/volumes/dream_thater/計算系/LVT/LVT5-02/**'
      - 'textbook/volumes/dream_thater/計算系/LVT/LVT3-01/lab/**'
      - '.github/workflows/validate-lvt-oracle.yml'
  push:
    branches: [main]
    paths:
      - 'textbook/volumes/dream_thater/計算系/LVT/LVT5-02/**'
      - 'textbook/volumes/dream_thater/計算系/LVT/LVT3-01/lab/**'
      - '.github/workflows/validate-lvt-oracle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean-oracle:
    name: Lean JSON Lines and process checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee
        with:
          lake-package-directory: 'textbook/volumes/dream_thater/計算系/LVT/LVT5-02/lab'
          auto-config: 'false'
          build: 'true'
          test: 'true'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - name: Check pinned version, proofs and CLI
        working-directory: 'textbook/volumes/dream_thater/計算系/LVT/LVT5-02/lab'
        shell: bash
        run: |
          lean --version | grep -F 'version 4.35.0'
          lake env lean LvtOracle.lean | tee inspect.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          output = Path('inspect.log').read_text()
          entries = re.findall(r"depends on axioms:\s*\[([^\]]*)\]", output)
          empty = len(re.findall(r"does not depend on any axioms", output))
          assert len(entries) + empty == 2, output
          for entry in entries:
              assert set(x.strip() for x in entry.split(',') if x.strip()) <= {'propext', 'Classical.choice', 'Quot.sound'}, entry
          PY
          python3 compare.py
          if lake env lean Failure.lean > failure.log 2>&1; then
            echo 'Invalid proof unexpectedly accepted'
            exit 1
          fi
          cat failure.log
          grep -i 'type mismatch' failure.log
