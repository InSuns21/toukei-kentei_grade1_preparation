name: Setup textbook concept DAG batch10

on:
  push:
    branches:
      - audit/textbook-concept-dag-batch10-i303-theorems
    paths:
      - .github/workflows/tmp-textbook-concept-dag-batch10-setup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/textbook-concept-dag-batch10-i303-theorems
          fetch-depth: 0
      - name: Register Batch 10 concepts
        run: python3 scripts/tmp_textbook_concept_dag_batch10_setup.py
      - name: Commit Batch 10 concept DAG
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook/knowledge-dag.yaml
          git diff --cached --check
          git commit -m 'Register Batch 10 I3-03 theorem concepts'
          git push origin HEAD:audit/textbook-concept-dag-batch10-i303-theorems
