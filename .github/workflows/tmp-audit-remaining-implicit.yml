name: Temporary remaining implicit-definition audit

on:
  push:
    branches:
      - refactor/retire-implicit-formals-batch6
    paths:
      - 'scripts/tmp-audit-remaining-implicit.mjs'
      - '.github/workflows/tmp-audit-remaining-implicit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/retire-implicit-formals-batch6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/tmp-audit-remaining-implicit.mjs
