name: Temporary implicit formal retirement batch 1

on:
  push:
    branches:
      - refactor/retire-implicit-formals-batch1
    paths:
      - 'scripts/tmp-retire-implicit-formals-batch1.mjs'
      - '.github/workflows/tmp-retire-implicit-formals-batch1.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/retire-implicit-formals-batch1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/tmp-retire-implicit-formals-batch1.mjs
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add textbook/volumes/00_foundations/F0_00F_線形写像_固有空間_スペクトル定理_SVD/index.md textbook/volumes/05_engineering/E2_01_markov連鎖/index.md scripts/implicit-formal-baseline.txt
          git commit -m 'formalize linear-algebra and Markov definitions'
          git push
      - run: npm ci
      - run: npm run validate
      - run: npm run validate:pages
