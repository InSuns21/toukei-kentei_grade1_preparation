name: One-off DREAM THEATER title migration

on:
  pull_request:
    paths:
      - 'scripts/migrate-dream-theater-titles-from-facade.mjs'
      - '.github/workflows/migrate-dream-theater-titles.yml'

permissions:
  contents: write
  pull-requests: read

jobs:
  migrate:
    if: github.head_ref == 'fix/dream-theater-title-normalization-all'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply title migration
        run: node scripts/migrate-dream-theater-titles-from-facade.mjs

      - name: Commit generated title changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No migration changes remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add textbook/dream-theater.md textbook/volumes/00_foundations
          git commit -m "Normalize DREAM THEATER learner-facing titles"
          git push origin HEAD:${{ github.head_ref }}
