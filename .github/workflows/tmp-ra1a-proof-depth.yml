name: Temporary RA1A proof depth fix
on:
  push:
    branches: [feat/ra1a-series-convergence]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ra1a-series-convergence
          fetch-depth: 0
      - name: Strengthen rearrangement and double-log arguments
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('textbook/volumes/00_foundations/RA1A/index.md')
          s=p.read_text()
          old='''各ブロックの端点の部分和は $L$ に収束し、ブロック内部でも動く幅は最後に使われる項の大きさで抑えられて0へ行きます。したがって再配列後の部分和全体が $L$ に収束します。$\\square$'''
          new='''各ブロックの内部も確認します。正項を加えるブロックは $L$ より下の直前端点から単調に増え、最終端点で初めて $L$ を上回ります。したがってそのブロック内の任意の部分和 $T$ は、直前端点を $U<L$、最終端点を $V>L$ とすれば
$$
U\\le T\\le V,
$$
よって
$$
|T-L|\\le\\max\\{L-U,\\,V-L\\}.
$$
負項を加えるブロックでも不等号を逆にした同じ挟み撃ちが成り立ちます。直前端点と最終端点の $L$ からの距離は、上で示した上下の越え幅なのでともに0へ行きます。したがってブロック端点だけでなく、ブロック内部を含む再配列後の部分和全体が $L$ に収束します。$\\square$'''
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('rearrangement ending not found')

          old='''$p>1$ なら
$$
\\frac1{n(\\log n)^p(\\log\\log n)^q}
$$
は、$q$ が負でも対数の冪は任意の小さい正の $\\varepsilon$ に対して $(\\log n)^\\varepsilon$ より遅くしか増えません。したがって十分大きい $n$ で
$$
(\\log\\log n)^{-q}\\le (\\log n)^{(p-1)/2}
$$
とでき、項は
$$
\\frac1{n(\\log n)^{(p+1)/2}}
$$
で上から抑えられます。$(p+1)/2>1$ なので収束します。

$p<1$ では同様に、対数対数因子では $(\\log n)^{1-p}$ の不足を補えないため、十分大きい $n$ で
$$
\\frac1{n(\\log n)^p(\\log\\log n)^q}
\\ge
\\frac1{n(\\log n)^{(p+1)/2}}.
$$
ここで $(p+1)/2<1$ なので右辺は発散し、元も発散します。'''
          new='''ここで一度、対数対数因子の大きさを定量化します。任意の $r\\in\\mathbb R$ と $\\delta>0$ に対して、十分大きい $n$ では
$$
(\\log\\log n)^r\\le (\\log n)^\\delta
$$
が成り立ちます。$r\\le0$ なら左辺は十分大きい $n$ で1以下なので明らかです。$r>0$ なら両辺の対数を取り、
$$
r\\log\\log\\log n\\le\\delta\\log\\log n
$$
を示せばよいです。$t=\\log\\log n\\to\\infty$ と置けば、これは
$$
\\frac{\\log t}{t}\\le\\frac{\\delta}{r}
$$
に等しく、$\\log t/t\\to0$ から十分大きい $t$ で成立します。

$p>1$ とし $\\delta=(p-1)/2>0$ と置きます。上の評価を $r=-q$ に適用すると、十分大きい $n$ で
$$
(\\log\\log n)^{-q}\\le (\\log n)^\\delta.
$$
したがって
$$
\\frac1{n(\\log n)^p(\\log\\log n)^q}
\\le
\\frac1{n(\\log n)^{p-\\delta}}
=
\\frac1{n(\\log n)^{(p+1)/2}}.
$$
$(p+1)/2>1$ なのでB01の分類から右辺の級数は収束し、比較判定により元も収束します。

$p<1$ とし $\\delta=(1-p)/2>0$ と置きます。上の評価を $r=q$ に適用すると、十分大きい $n$ で
$$
(\\log\\log n)^q\\le(\\log n)^\\delta.
$$
したがって
$$
\\frac1{n(\\log n)^p(\\log\\log n)^q}
\\ge
\\frac1{n(\\log n)^{p+\\delta}}
=
\\frac1{n(\\log n)^{(p+1)/2}}.
$$
ここで $(p+1)/2<1$ なのでB01の分類から右辺は発散し、比較判定により元も発散します。'''
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('C01 block not found')
          p.write_text(s)
          PY
          rm .github/workflows/tmp-ra1a-proof-depth.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'RA1A: strengthen proof and solution granularity' || true
          git push origin HEAD:feat/ra1a-series-convergence
