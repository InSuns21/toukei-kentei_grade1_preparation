name: Temporary FA1 forward-wording cleanup

on:
  push:
    branches:
      - codex/fa2-open-mapping-bounded-inverse-closed-graph

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fa2-open-mapping-bounded-inverse-closed-graph
      - name: Avoid false proof dependency in FA1
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('textbook/volumes/00_foundations/FA1/index.md')
          s = p.read_text()
          old = 'ここでは FA2 の[開写像定理](../FA2/index.md#thm-fa2-open-mapping)を使っていません。**商ノルムの infimum から直接示した特殊な開写像**です。この非循環性は次章で重要になります。'
          new = 'これは次章 FA2 で扱う一般結果から導いたものではありません。**商ノルムの infimum だけから直接得た商写像固有の結論**であり、この非循環性が次章で重要になります。'
          if old not in s:
              raise SystemExit('target wording not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit cleanup and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook/volumes/00_foundations/FA1/index.md
          git rm .github/workflows/tmp-fa2-fa1-wording.yml
          git commit -m 'Avoid false FA1 proof dependency on FA2'
          git push origin HEAD:codex/fa2-open-mapping-bounded-inverse-closed-graph
