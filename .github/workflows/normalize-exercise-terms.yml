name: Normalize exercise terminology

on:
  push:
    branches:
      - chore/unify-exercise-guidelines
    paths:
      - 'scripts/normalize_exercise_terms.mjs'
      - '.github/workflows/normalize-exercise-terms.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working branch with history
        uses: actions/checkout@v4
        with:
          ref: chore/unify-exercise-guidelines
          fetch-depth: 0

      - name: Ensure main reference exists
        run: git fetch origin main:refs/remotes/origin/main

      - name: Normalize learner-facing prose only
        run: node scripts/normalize_exercise_terms.mjs

      - name: Commit normalized exercise text
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add statistical-mathematics applied-rikou-80
          if git diff --cached --quiet; then
            echo "No normalization changes needed."
          else
            git commit -m "style: normalize learner-facing statistical terminology"
            git push origin HEAD:chore/unify-exercise-guidelines
          fi
