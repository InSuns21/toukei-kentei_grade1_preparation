name: ODE7 maintenance

on:
  push:
    branches:
      - feat/ode7-sturm-liouville
    paths:
      - .github/workflows/ode7-maintenance.yml
      - scripts/ode7-maintenance.py

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/ode7-sturm-liouville
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Patch ODE7 integration
        run: python scripts/ode7-maintenance.py pre

      - name: Install dependencies
        run: npm ci

      - name: Run ODE7 validation suite
        id: validation
        shell: bash
        run: |
          set +e
          : > ode7-validation.log
          status=0
          run_check() {
            echo "===== $* =====" | tee -a ode7-validation.log
            "$@" 2>&1 | tee -a ode7-validation.log
            rc=${PIPESTATUS[0]}
            echo "[exit=$rc]" | tee -a ode7-validation.log
            if [ "$rc" -ne 0 ]; then status=1; fi
          }
          export DREAM_THEATER_BASE_SHA="$(git merge-base HEAD origin/main)"
          run_check npm run validate
          run_check npm run validate:pages
          run_check npm run validate:dream-theater-exercise-counts
          run_check npm run validate:dream-theater-concepts:changed
          run_check npm run validate:textbook-knowledge:changed
          run_check npm run validate:terminology:changed
          run_check npm run validate:dream-theater-standard-math-core
          run_check npm run audit:proof-pedagogy
          run_check npm run audit:formalism-pedagogy
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Finalize progress on success
        if: steps.validation.outputs.status == '0'
        run: |
          python scripts/ode7-maintenance.py post
          rm -f ode7-validation.log
          git rm .github/workflows/ode7-maintenance.yml scripts/ode7-maintenance.py

      - name: Commit maintenance result
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "${{ steps.validation.outputs.status }}" = "0" ]; then
            msg='Finalize ODE7 validation and progress ledger'
          else
            msg='Patch ODE7 integration and record validation failures'
          fi
          git add textbook/volumes/00_foundations/ODE7/index.md textbook/dream-theater.md textbook/DREAM_THEATER_ODE_FOURIER_PDE_RESTRUCTURE_PLAN.md
          if [ -f ode7-validation.log ]; then git add ode7-validation.log; fi
          git diff --cached --quiet || git commit -m "$msg"
          git push origin HEAD:feat/ode7-sturm-liouville

      - name: Fail when validation failed
        if: steps.validation.outputs.status != '0'
        run: exit 1
