name: Repair named formal math

on:
  push:
    branches:
      - audit/named-formal-results
    paths:
      - 'scripts/repair-named-formal-math.mjs'
      - '.github/workflows/migrate-named-formals.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: audit/named-formal-results

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Repair display math delimiters
        run: node scripts/repair-named-formal-math.mjs

      - name: Commit repair result
        run: |
          if git diff --quiet; then
            echo 'No repair changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook
          git commit -m '修正: formal statementの別行数式を復元'
          git push origin HEAD:audit/named-formal-results
