name: Temporary wire DREAM THEATER term audit

on:
  push:
    branches:
      - ci/dream-theater-undefined-term-first-use-final

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ci/dream-theater-undefined-term-first-use-final
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python scripts/tmp-wire-dream-theater-term-audit.py
      - name: Commit audit wiring
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json .github/workflows/validate-dream-theater-concepts.yml scripts/validate-dream-theater-concepts-changed.mjs textbook/dream-theater-knowledge.yaml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No wiring changes to commit.'
          else
            git commit -m 'ci: enforce undefined terms and chronological alias shadowing'
            git push origin HEAD:ci/dream-theater-undefined-term-first-use-final
          fi
      - name: Self-test concept audits
        run: npm run test:dream-theater-concept-audits
      - name: Validate changed DREAM THEATER concepts
        env:
          DREAM_THEATER_BASE_SHA: 2167dd85f53445d5c303f946c679f0071315284f
        run: npm run validate:dream-theater-concepts:changed
      - run: npm run audit:dream-theater-concepts
      - run: npm run validate
