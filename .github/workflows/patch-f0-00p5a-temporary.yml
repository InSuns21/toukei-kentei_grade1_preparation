name: Patch F0-00P5A canonical links

on:
  push:
    branches:
      - audit/f0-00p5a-slln-pedagogy

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/f0-00p5a-slln-pedagogy
      - name: Normalize accidentally nested links
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('textbook/volumes/00_foundations/F0_00P5A_truncation_Kronecker_一般SLLN/index.md')
          lines = p.read_text(encoding='utf-8').splitlines(keepends=True)
          changed = False
          continuity = '[下からの連続性](../F0_00D2_測度_可測関数_Lebesgue積分_Lp/index.md#thm-f0-00d2-01)'
          tonelli = '[Tonelliの定理](../F0_00D2C_積測度_Tonelli_Fubini/index.md#thm-tonelli)'

          for i, line in enumerate(lines):
              if line.startswith('$N$ を増やすと左辺の事象は単調に増えます。') and '下からの連続性' in line:
                  new = f'$N$ を増やすと左辺の事象は単調に増えます。{continuity}により $N\\to\\infty$ とすると\n'
                  if line != new:
                      lines[i] = new
                      changed = True
              elif line.startswith('$N$ を増やすと左辺の事象は単調増加するので、') and '下からの連続性' in line:
                  new = f'$N$ を増やすと左辺の事象は単調増加するので、{continuity}により\n'
                  if line != new:
                      lines[i] = new
                      changed = True
              elif 'を、指示関数と ' in line and 'Tonelli' in line and 'から示せ。' in line:
                  new = f'を、指示関数と {tonelli} から示せ。\n'
                  if line != new:
                      lines[i] = new
                      changed = True

          if changed:
              p.write_text(''.join(lines), encoding='utf-8')
              print('Normalized nested P5A links.')
          else:
              print('No nested links needed normalization.')
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo 'No patch needed.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add textbook/volumes/00_foundations/F0_00P5A_truncation_Kronecker_一般SLLN/index.md
          git commit -m 'Normalize F0-00P5A canonical links'
          git push origin HEAD:audit/f0-00p5a-slln-pedagogy
