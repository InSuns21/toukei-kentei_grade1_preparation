name: Temporary proof folding migration

on:
  push:
    branches:
      - audit/proof-pedagogy-folding
    paths:
      - 'scripts/migrate-proof-folding.mjs'
      - 'scripts/audit-proof-pedagogy.mjs'
      - '.github/workflows/tmp-proof-folding-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: audit/proof-pedagogy-folding

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Wrap explicit proof sections
        run: |
          set +e
          node scripts/migrate-proof-folding.mjs
          echo "migration_exit=$?" >> "$GITHUB_ENV"
          exit 0

      - name: Generate proof pedagogy audit
        run: node scripts/audit-proof-pedagogy.mjs --write textbook/f0-dream-theater-proof-pedagogy-audit.md > /tmp/proof-audit.txt

      - name: Commit migrated proof blocks and audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add textbook/volumes textbook/f0-dream-theater-proof-pedagogy-audit.md
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
          else
            git commit -m "fold textbook proofs and record pedagogy audit"
            git push
          fi

      - name: Show migration warnings
        if: always()
        run: |
          echo "migration_exit=${migration_exit:-0}"
          cat /tmp/proof-audit.txt | sed -n '1,120p'

      - name: Validate proof folding
        run: npm run validate:proof-folding
