name: Extend grade1 terminology audit

on:
  push:
    branches:
      - fix/mathstat-rikou80-terminology-full-audit

permissions:
  contents: write

jobs:
  patch-auditors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mathstat-rikou80-terminology-full-audit
          fetch-depth: 0
      - name: Extend terminology audit roots
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in [
              'scripts/audit_textbook_japanese_terminology.mjs',
              'scripts/audit_textbook_term_spacing.mjs',
          ]:
              p = Path(name)
              s = p.read_text()
              needle = "  'textbook/volumes/05_engineering',\n"
              insert = needle + "  'statistical-mathematics',\n  'applied-rikou-80',\n"
              if "  'statistical-mathematics',\n" not in s:
                  s = s.replace(needle, insert, 1)
              p.write_text(s)
          PY
          rm .github/workflows/extend-grade1-terminology-audit.yml
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/audit_textbook_japanese_terminology.mjs scripts/audit_textbook_term_spacing.mjs .github/workflows/extend-grade1-terminology-audit.yml
          git commit -m 'ci: extend Japanese terminology audit to mathstat and rikou80'
          git push
