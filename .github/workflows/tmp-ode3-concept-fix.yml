name: Temporary ODE3 concept wording fix

on:
  push:
    branches:
      - codex/dream-theater-ode3-linear-systems

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/dream-theater-ode3-linear-systems
      - name: Fix wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('textbook/volumes/00_foundations/ODE3/index.md')
          s = p.read_text()
          old = '一般の初期値でも回転行列は Euclid ノルムを保つので'
          new = '一般の初期値でも回転行列はユークリッド長さを保つので'
          if old not in s:
              raise SystemExit('expected text not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add textbook/volumes/00_foundations/ODE3/index.md
          git commit -m "Use local Euclidean-length wording in ODE3 exercise"
          git push origin HEAD:codex/dream-theater-ode3-linear-systems
