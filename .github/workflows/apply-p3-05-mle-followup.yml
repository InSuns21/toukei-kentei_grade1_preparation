name: Apply P3-05 MLE follow-up migration

on:
  push:
    branches:
      - fix/p3-05-mle-followup-placement
    paths:
      - '.github/workflows/apply-p3-05-mle-followup.yml'
      - 'scripts/apply_p3_05_mle_followup.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: fix/p3-05-mle-followup-placement
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migration
        run: python scripts/apply_p3_05_mle_followup.py

      - name: Check patch
        run: |
          git diff --check
          git diff --stat

      - name: Validate pages
        run: npm run validate:pages

      - name: Validate terminology
        run: npm run validate:terminology

      - name: Validate textbook
        run: npm run validate:textbook

      - name: Commit validated migration
        shell: bash
        run: |
          git rm .github/workflows/apply-p3-05-mle-followup.yml
          git rm scripts/apply_p3_05_mle_followup.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook/volumes/03_inference/I1_01_尤度_最尤推定/index.md
          git add textbook/volumes/03_inference/I1_01_尤度_最尤推定/chapter.yaml
          git add textbook/volumes/03_inference/I1_02_推定法と推定量の評価/index.md
          git add textbook/volumes/03_inference/I1_02_推定法と推定量の評価/chapter.yaml
          git add textbook/volumes/03_inference/I4_02_欠測_不完全データ_期待値最大化法/index.md
          git add textbook/volumes/03_inference/I4_02_欠測_不完全データ_期待値最大化法/chapter.yaml
          git commit -m 'Move deferred lifetime MLE exercises into inference chapters'
          git push origin HEAD:fix/p3-05-mle-followup-placement
