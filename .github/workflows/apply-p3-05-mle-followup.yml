          weibull = r'''### 13.1 右打ち切りワイブル寿命: $f(t)$ と $S(c)$ を最尤推定へつなぐ

P3-05 では、故障時刻 $t$ を観測した個体は密度 $f(t)$、時刻 $c$ まで故障しなかった個体は生存関数 $S(c)$ の情報を持つところまで扱いました。I1-01 で最尤推定を学んだので、ここではその情報を一つの尤度へまとめます。

形状母数 $k>0$、尺度母数 $\eta>0$ のワイブル寿命を

$$
S(t)=\exp\left[-\left(\frac{t}{\eta}\right)^k\right],
$$

$$
f(t)
=\frac{k}{\eta}\left(\frac{t}{\eta}\right)^{k-1}
\exp\left[-\left(\frac{t}{\eta}\right)^k\right]
$$

とします。観測時間を

$$
y_i=\min(T_i,c_i),
$$

故障を観測したとき $\delta_i=1$、右打ち切りなら $\delta_i=0$ とすると、各個体の尤度寄与は

$$
[f(y_i)]^{\delta_i}[S(y_i)]^{1-\delta_i}
$$

です。したがって

$$
\boxed{
L(k,\eta)
=\prod_i[f(y_i)]^{\delta_i}[S(y_i)]^{1-\delta_i}
}.
$$

ここで形状 $k$ を既知とし、尺度 $\eta$ だけを推定します。故障数を

$$
d=\sum_i\delta_i
$$

とすると、$\eta$ に依存する対数尤度は

$$
\ell(\eta)
=-dk\log\eta
-\eta^{-k}\sum_i y_i^k
+\text{const.}
$$

です。$d>0$ なら

$$
\frac{d\ell}{d\eta}
=-\frac{dk}{\eta}
+k\eta^{-k-1}\sum_i y_i^k=0,
$$

よって

$$
\boxed{
\hat\eta_{\mathrm{ML}}
=\left(\frac{\sum_i y_i^k}{d}\right)^{1/k}
}.
$$

分母が「全個体数」ではなく**実際に故障した個体数 $d$** になるのは、右打ち切り個体には密度の前因子 $k\eta^{-k}$ が付かず、生存関数だけが寄与するためです。

なお $d=0$、つまり全個体が右打ち切りなら、観測されたのは「どれもまだ故障していない」という情報だけです。この場合は有限の $\eta$ を最大点として決められず、$\eta\to\infty$ で尤度が上がります。打ち切りデータでは、**何個の故障を実際に観測したか**が識別可能性にも効きます。

'''
          t = replace_once(t, '## 14. 左切断', weibull + '## 14. 左切断', 'I4-02 Weibull theory')
          b05 = r'''### I4-02-B05 右打ち切りワイブル寿命の尺度最尤推定

- Level: B
- 目安時間: 15分
- 主題: 右打ち切りワイブル寿命
- 使用技術: 密度・生存関数、最尤推定

形状母数 $k=2$ を既知とするワイブル寿命

$$
S(t)=\exp\left[-(t/\eta)^2\right]
$$

を考える。3個の装置を試験し、2個は時刻 $1,2$ で故障し、残り1個は時刻 $3$ で試験終了となり未故障だった。

1. 正しい尤度を $f(t)$ と $S(t)$ を用いて書け。
2. $\eta$ の最尤推定量を求めよ。
3. 時刻3の個体を「時刻3で故障した」と誤って扱った場合の最尤推定量を求め、正しい推定量と大小を比較せよ。

<!-- solution-start -->

#### 解答

##### 詳細解答

$k=2$ では

$$
f(t)=\frac{2t}{\eta^2}e^{-(t/\eta)^2},
\qquad
S(t)=e^{-(t/\eta)^2}.
$$

したがって

$$
L(\eta)
=f(1)f(2)S(3)
\propto
\eta^{-4}\exp\left(-\frac{1^2+2^2+3^2}{\eta^2}\right)
=\eta^{-4}e^{-14/\eta^2}.
$$

故障数は $d=2$ なので一般式から

$$
\hat\eta^2=\frac{14}{2}=7,
\qquad
\boxed{\hat\eta=\sqrt7}.
$$

時刻3を故障と誤認すると $d=3$ となり、

$$
\hat\eta_{\rm wrong}^2=\frac{14}{3},
\qquad
\boxed{\hat\eta_{\rm wrong}=\sqrt{14/3}}.
$$

従って

$$
\sqrt{14/3}<\sqrt7.
$$

未故障個体を故障扱いすると「より早く壊れた」という誤情報を加えるため、尺度を過小に推定する方向へ動く。

##### 本番答案

$$
L(\eta)=f(1)f(2)S(3)
\propto\eta^{-4}e^{-14/\eta^2}.
$$

故障数 $d=2$ より

$$
\boxed{\hat\eta=\sqrt{14/2}=\sqrt7}.
$$

時刻3も故障扱いすると $d=3$ なので

$$
\boxed{\hat\eta_{\rm wrong}=\sqrt{14/3}<\sqrt7}.
$$

##### 採点基準

- $f(1)f(2)S(3)$: 6点
- 正しい最尤推定量: 7点
- 誤った推定量: 4点
- 大小と解釈: 3点

<!-- solution-end -->

'''
