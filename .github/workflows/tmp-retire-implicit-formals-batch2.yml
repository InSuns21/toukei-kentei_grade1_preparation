name: Temporary implicit formal retirement batch 2

on:
  push:
    branches:
      - refactor/retire-implicit-formals-batch2
    paths:
      - 'scripts/tmp-retire-implicit-formals-batch2.mjs'
      - '.github/workflows/tmp-retire-implicit-formals-batch2.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/retire-implicit-formals-batch2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/tmp-retire-implicit-formals-batch2.mjs
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add textbook/volumes/00_foundations/F0_00E_ベクトル空間_基底_Gram_Schmidt_直交射影/index.md textbook/volumes/00_foundations/F0_00E1_内積_Gram_Schmidt_射影_QR/index.md textbook/volumes/00_foundations/F0_00F2_SVD_特異値_作用素ノルム/index.md scripts/implicit-formal-baseline.txt
          git commit -m 'formalize core linear algebra definitions'
          git push
      - run: npm ci
      - run: npm run validate
      - run: npm run validate:pages
