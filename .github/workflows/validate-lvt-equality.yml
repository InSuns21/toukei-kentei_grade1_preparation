name: Validate LVT equality
on:
  pull_request:
    paths:
      - 'textbook/volumes/dream_thater/計算系/LVT/LVT2-03/**'
      - '.github/workflows/validate-lvt-equality.yml'
  push:
    branches: [main]
    paths:
      - 'textbook/volumes/dream_thater/計算系/LVT/LVT2-03/**'
      - '.github/workflows/validate-lvt-equality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lean-equality:
    name: Lean equality and rewriting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee
        with:
          lake-package-directory: 'textbook/volumes/dream_thater/計算系/LVT/LVT2-03/lab'
          auto-config: 'false'
          build: 'true'
          test: 'true'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - name: Verify exercises and expected failure
        working-directory: 'textbook/volumes/dream_thater/計算系/LVT/LVT2-03/lab'
        shell: bash
        run: |
          lean --version | grep -F 'version 4.35.0'
          lake env lean Inspect.lean
          lake exe lvtEqualityDemo | grep -Fx 'LVT2-03 OK'
          lake env lean ExerciseSolutions.lean
          if lake env lean Failure.lean > failure.log 2>&1; then
            echo 'Invalid proof unexpectedly accepted'
            exit 1
          fi
          cat failure.log
          grep -i 'type mismatch' failure.log
