name: Apply textbook concept DAG batch2 example

on:
  push:
    branches:
      - audit/textbook-concept-dag-batch2
    paths:
      - .github/workflows/apply-textbook-concept-dag-batch2-example.yml

permissions:
  contents: write

jobs:
  apply-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/textbook-concept-dag-batch2
          fetch-depth: 0
      - name: Add definition verification
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('textbook/volumes/02_distributions/P4_02_確率変数の収束_大数則_中心極限定理/index.md')
          text = p.read_text(encoding='utf-8')
          old = '''つまり一致性は、新しい収束概念ではありません。**確率収束を「推定量が真の母数へ近づく」という統計の言葉に読み替えたもの**です。後続の I1-02 では、不偏性・MSE・効率性と並べて推定量の評価基準として改めて扱います。\n\n### 2.2 概収束'''
          new = '''つまり一致性は、新しい収束概念ではありません。**確率収束を「推定量が真の母数へ近づく」という統計の言葉に読み替えたもの**です。後続の I1-02 では、不偏性・MSE・効率性と並べて推定量の評価基準として改めて扱います。\n\n<!-- definition-example-start: def-p4-02-consistency -->\n**定義の確認**\n独立同分布な $X_1,\\ldots,X_n\\sim\\operatorname{Bernoulli}(p)$ に対し $\\widehat p_n=\\overline X_n$ とおきます。弱大数則から\n\n$$\n\\widehat p_n=\\overline X_n\\xrightarrow{p}E[X_1]=p\n$$\n\nなので、$\\widehat p_n$ は $p$ の一致推定量です。\n<!-- definition-example-end -->\n\n### 2.2 概収束'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one insertion point, got {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook
          git diff --cached --check
          git commit -m 'Add consistency definition verification'
          git push origin HEAD:audit/textbook-concept-dag-batch2
