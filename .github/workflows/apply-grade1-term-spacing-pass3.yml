name: Apply Grade 1 terminology spacing cleanup

on:
  push:
    branches:
      - fix/mathstat-rikou80-terminology-full-audit

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mathstat-rikou80-terminology-full-audit
          fetch-depth: 0
      - name: Remove Japanese terminology spacing safely
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [
              Path('textbook/volumes/01_probability'),
              Path('textbook/volumes/02_distributions'),
              Path('textbook/volumes/03_inference'),
              Path('textbook/volumes/04_linear_models'),
              Path('textbook/volumes/05_engineering'),
              Path('statistical-mathematics'),
              Path('applied-rikou-80'),
          ]
          ignored = {'.git', 'node_modules', 'dist', 'build', 'sources', 'review'}
          terms = [
              'ベルヌーイ','ポアソン','ガンマ','フィッシャー','ベイズ','ワルド','スコア',
              'コーシー','ワイブル','パレート','確率質量関数','確率密度関数','累積分布関数',
              '確率母関数','モーメント母関数','特性関数','キュムラント母関数','独立同分布',
              '分散共分散行列','平均二乗誤差','最尤推定量','尤度比検定','尤度比','ワルド検定',
              'スコア検定','クラーメル・ラオ','ネイマン・ピアソン','最強力検定','一様最強力検定',
              '一様最強力不偏検定','一様最小分散不偏推定量','信頼区間','標準誤差','中心極限定理',
              '大数の法則','デルタ法','通常最小二乗法','一般化最小二乗法','分散分析','共分散分析',
              '一般化線形モデル','特異値分解','主成分分析','レーマン・シェッフェ','局外母数','ガウス・マルコフ'
          ]
          jp = r'[ぁ-んァ-ヶ一-龯々]'

          def protect(text):
              saved = []
              def hold(m):
                  token = f'@@PROTECTED_{len(saved):06d}@@'
                  saved.append(m.group(0))
                  return token
              for pat in [
                  re.compile(r'```[\s\S]*?```'),
                  re.compile(r'`[^`\n]*`'),
                  re.compile(r'\$\$[\s\S]*?\$\$'),
                  re.compile(r'\$(?:\\.|[^$\n])+\$'),
                  re.compile(r'\]\([^\n)]*\)'),
                  re.compile(r'https?://\S+'),
                  re.compile(r'^\s*<a\s+id=[^\n]*$', re.M),
                  re.compile(r'^\s*(?:id|topic):[^\n]*$', re.M),
              ]:
                  text = pat.sub(hold, text)
              return text, saved

          def restore(text, saved):
              for i, value in enumerate(saved):
                  text = text.replace(f'@@PROTECTED_{i:06d}@@', value)
              return text

          changed = 0
          replacements = 0
          for root in roots:
              for p in root.rglob('*.md'):
                  if any(part in ignored for part in p.parts):
                      continue
                  original = p.read_text()
                  text, saved = protect(original)
                  for term in terms:
                      e = re.escape(term)
                      text, n1 = re.subn(f'({jp})[ \\t]+({e})', r'\1\2', text)
                      text, n2 = re.subn(f'({e})[ \\t]+({jp})', r'\1\2', text)
                      replacements += n1 + n2
                  fixed = restore(text, saved)
                  if fixed != original:
                      p.write_text(fixed)
                      changed += 1
          print(f'changed_files={changed} replacements={replacements}')
          PY
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook statistical-mathematics applied-rikou-80
          if git diff --cached --quiet; then
            echo 'No fixes needed'
          else
            git commit -m 'fix: remove spacing around normalized Japanese terms'
            git push
          fi
