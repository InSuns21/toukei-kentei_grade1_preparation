name: Temporary F0 pedagogy next batch

on:
  push:
    branches:
      - refactor/f0-proof-pedagogy-next-batch
    paths:
      - 'scripts/tmp-refactor-f0-next-batch.py'
      - '.github/workflows/tmp-refactor-f0-next-batch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/f0-proof-pedagogy-next-batch
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Apply pedagogy rewrites
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/tmp-refactor-f0-next-batch.py')
          s = p.read_text()
          s = s.replace('## 10. 二つが同時には成立しない', '## 10. 両方同時には成立しない')
          s = s.replace('## 11. 少なくとも一方は成立する', '## 11. どちらか一方は必ず成立する')
          s = s.replace("old = re.sub(r'^## 9\\. .*$', '#### Step 5：$\\\\lambda(V)=0$ なら矛盾', old, count=1, flags=re.M)", "old = old.replace('## 9. $\\\\lambda(V)=0$ なら矛盾', '#### Step 5：$\\\\lambda(V)=0$ なら矛盾', 1)")
          s = s.replace("old = re.sub(r'^## 10\\. .*$', '#### Step 6：$\\\\lambda(V)>0$ でも矛盾', old, count=1, flags=re.M)", "old = old.replace('## 10. $\\\\lambda(V)>0$ でも矛盾', '#### Step 6：$\\\\lambda(V)>0$ でも矛盾', 1)")
          p.write_text(s)
          PY
          python3 scripts/tmp-refactor-f0-next-batch.py
      - name: Validate textbook and Pages
        run: |
          npm run validate
          npm run validate:pages
      - name: Run pedagogy audits
        run: |
          npm run audit:proof-pedagogy
          npm run audit:formalism-pedagogy
      - name: Commit rewritten textbook pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add textbook/volumes/00_foundations
          if git diff --cached --quiet; then
            echo 'No textbook changes.'
          else
            git commit -m 'rebalance next proof-heavy F0 batch and add exercises'
            git push
          fi
