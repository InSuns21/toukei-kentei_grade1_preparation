name: Temporary F0 pedagogy next batch

on:
  push:
    branches:
      - refactor/f0-proof-pedagogy-next-batch
    paths:
      - '.github/workflows/tmp-refactor-f0-next-batch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/f0-proof-pedagogy-next-batch
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Polish rewritten sections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          edits = {
            'textbook/volumes/00_foundations/F0_02B_分離超平面定理_Farkas_SVM/index.md': [
              ('## 0. 例：単位円板と外の点で「分離」を一周する', '## 0.1 例：単位円板と外の点で「分離」を一周する'),
            ],
            'textbook/volumes/00_foundations/F0_00D5_Vitali集合_非可測集合_選択公理/index.md': [
              ('## 6. これらの平行移動は $[0,1]$ を覆う', '#### Step 2：平行移動族は $[0,1]$ を覆う'),
            ],
          }
          for name, replacements in edits.items():
              p = Path(name)
              s = p.read_text()
              for old, new in replacements:
                  if old not in s:
                      raise SystemExit(f'missing expected text in {name}: {old}')
                  s = s.replace(old, new, 1)
              p.write_text(s)
          PY
      - name: Validate textbook and Pages
        run: |
          npm run validate
          npm run validate:pages
      - name: Run pedagogy audits
        run: |
          npm run audit:proof-pedagogy
          npm run audit:formalism-pedagogy
      - name: Commit polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add textbook/volumes/00_foundations
          if git diff --cached --quiet; then
            echo 'No textbook changes.'
          else
            git commit -m 'polish folded proof section structure'
            git push
          fi
