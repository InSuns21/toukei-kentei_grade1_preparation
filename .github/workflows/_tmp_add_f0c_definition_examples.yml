name: Temporary add F0-00C definition examples

on:
  push:
    branches:
      - audit/set-topology-exercises-20260912

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/set-topology-exercises-20260912
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add definition examples
        run: python scripts/_tmp_add_f0c_definition_examples.py
      - name: Remove temporary files
        run: |
          rm scripts/_tmp_add_f0c_definition_examples.py
          rm .github/workflows/_tmp_add_f0c_definition_examples.yml
      - name: Commit definition examples
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook/volumes/00_foundations scripts .github/workflows
          git commit -m 'Add explicit continuity definition checks'
          git push origin HEAD:audit/set-topology-exercises-20260912
