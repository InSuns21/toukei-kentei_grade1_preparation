name: tmp Batch11 normal exact DAG

on:
  push:
    branches:
      - audit/textbook-concept-dag-batch11-normal-exact-tests
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/textbook-concept-dag-batch11-normal-exact-tests
      - name: Apply Batch 11 nodes
        run: python3 scripts/tmp_batch11_normal_exact_dag.py
      - name: Check diff
        run: git diff --check
      - name: Commit generated DAG update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add textbook/knowledge-dag.yaml
          git diff --cached --check
          git commit -m "audit: register normal exact-test DAG concepts Batch 11"
          git push
