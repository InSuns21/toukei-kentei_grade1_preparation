name: Temporary ODE3 final fixes

on:
  push:
    branches:
      - codex/dream-theater-ode3-linear-systems

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/dream-theater-ode3-linear-systems
      - name: Apply exact fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('textbook/volumes/00_foundations/ODE3/index.md')
          s = p.read_text()
          replacements = [
              ('**定義の確認：冪零行列なら級数は有限で止まる**', '**定義の確認**\n\n冪零行列なら級数は有限で止まります。'),
              ('**定義の確認：対角系**', '**定義の確認**\n\n対角系で条件を直接確認します。'),
              ("**定義の確認：$x'=-2x$**", "**定義の確認**\n\n$x'=-2x$ で三つの安定性を直接確認します。"),
              ('固定行列 $P=(p_{ij})$ による乗算はノルムを高々定数倍します。', '固定行列 $P=(p_{ij})$ による乗算はユークリッド長さを高々定数倍します。'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'missing expected text: {old!r}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add textbook/volumes/00_foundations/ODE3/index.md
          git commit -m "Fix ODE3 definition examples and local length wording"
          git push origin HEAD:codex/dream-theater-ode3-linear-systems
