name: Apply textbook concept DAG batch4 fixes

# Temporary exact-edit workflow; removed before merge.
on:
  push:
    branches:
      - audit/textbook-concept-dag-batch4-core-inference
    paths:
      - .github/workflows/tmp-textbook-concept-dag-batch4-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/textbook-concept-dag-batch4-core-inference
          fetch-depth: 0
      - name: Apply exact edits
        run: python3 scripts/tmp_textbook_concept_dag_batch4_fix.py
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook
          git diff --cached --check
          git commit -m 'Fix Batch 4 concept DAG findings'
          git push origin HEAD:audit/textbook-concept-dag-batch4-core-inference
