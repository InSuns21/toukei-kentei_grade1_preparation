name: One-off I1-02 prerequisite renumber

on:
  push:
    branches:
      - fix/i102-blue-reading-order
    paths:
      - '.github/workflows/one-off-i102-renumber.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/i102-blue-reading-order
          fetch-depth: 0

      - name: Renumber prerequisite list
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('textbook/volumes/03_inference/I1_02_推定法と推定量の評価/index.md')
          source = path.read_text()
          old = '4. 共分散と Cauchy--Schwarz 不等式を使える。'
          new = '3. 共分散と Cauchy--Schwarz 不等式を使える。'
          if source.count(old) != 1:
              raise SystemExit(f'expected one prerequisite #4, got {source.count(old)}')
          path.write_text(source.replace(old, new))
          PY

      - name: Validate
        run: |
          npm ci
          npm run validate:structure
          npm run validate:math
          npm run validate:formal-statements
          npm run validate:definition-examples

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "textbook/volumes/03_inference/I1_02_推定法と推定量の評価/index.md"
          git diff --cached --quiet && exit 1
          git commit -m "Renumber I1-02 prerequisites"
          git push origin HEAD:fix/i102-blue-reading-order
