name: Temporary FA1 definition-example fix

on:
  push:
    branches:
      - codex/fa1-quotient-uniform-boundedness

permissions:
  contents: write

jobs:
  fix-fa1-definition-examples:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fa1-quotient-uniform-boundedness
      - name: Patch strict definition-example markers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('textbook/volumes/00_foundations/FA1/index.md')
          s = p.read_text()
          replacements = {
              '**定義の確認：$\\mathbb R^2$ を横方向で割る**': '**定義の確認**：$\\mathbb R^2$ を横方向で割る',
              '**定義の確認：$\\ell^2$ の座標汎関数**': '**定義の確認**：$\\ell^2$ の座標汎関数',
              '**定義の確認：同じ座標汎関数族**': '**定義の確認**：同じ座標汎関数族',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing target: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook/volumes/00_foundations/FA1/index.md
          git commit -m 'Fix FA1 strict definition-example markers'
          git push origin HEAD:codex/fa1-quotient-uniform-boundedness
