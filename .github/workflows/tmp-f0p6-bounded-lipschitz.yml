name: Temporary F0-00P6 bounded Lipschitz fix

on:
  push:
    branches:
      - fix/f0-00p6-bounded-lipschitz-definition

permissions:
  contents: write

jobs:
  patch-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/f0-00p6-bounded-lipschitz-definition
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: python scripts/tmp-f0p6-bl-fix.py
      - name: Commit focused fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook/volumes/00_foundations/F0_00P6_特性関数_中心極限定理
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No textbook changes to commit.'
          else
            git commit -m 'fix: define bounded Lipschitz functions in F0-00P6'
            git push origin HEAD:fix/f0-00p6-bounded-lipschitz-definition
          fi
      - run: npm run validate
      - run: npm run validate:dream-theater-exercise-counts
      - run: npm run audit:proof-pedagogy
      - run: npm run audit:formalism-pedagogy
