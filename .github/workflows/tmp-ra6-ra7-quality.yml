## 11. 演習B

### B01 三角形領域
- Level: B
- 目安時間: 15分

$T=\{(x,y):x\ge0,y\ge0,x+y\le1\}$ 上で $xy$ を積分せよ。

<!-- solution-start -->
**詳細解答**

$x$ を固定すると条件 $x+y\le1$ から

$$
0\le y\le1-x,
$$

またそのような $y$ が存在するためには $0\le x\le1$ です。したがって

$$
\begin{aligned}
\int_Txy\,dx\,dy
&=\int_0^1\int_0^{1-x}xy\,dy\,dx\\
&=\int_0^1 x\left[\frac{y^2}{2}\right]_0^{1-x}dx\\
&=\frac12\int_0^1x(1-x)^2dx.
\end{aligned}
$$

展開すると

$$
\frac12\int_0^1(x-2x^2+x^3)dx
=\frac12\left(\frac12-\frac23+\frac14\right)
=\frac1{24}.
$$

ここでは積分計算より先に、三角形を $x$ 固定の縦線で切ったときの範囲を書けることが核心です。

**本番答案**

$0\le x\le1$, $0\le y\le1-x$ と領域を記述し、$\int_0^1\int_0^{1-x}xy\,dy\,dx=1/24$。

**採点基準（20点）**：積分領域の記述8点、内側積分5点、外側積分7点。
<!-- solution-end -->

### B02 円環
- Level: B
- 目安時間: 15分

$A=\{(x,y):a^2\le x^2+y^2\le b^2\}$ で $1/(x^2+y^2)$ を積分せよ。ただし $0<a<b$。

<!-- solution-start -->
**詳細解答**

領域は半径 $a$ と $b$ の間の円環なので polar coordinates が自然です。

$$
a\le r\le b,
\qquad
0\le\theta\le2\pi.
$$

$a>0$ なので被積分関数の特異点 $r=0$ は領域に含まれません。変換後は

$$
\frac1{x^2+y^2}=\frac1{r^2},
\qquad
 dx\,dy=r\,dr\,d\theta,
$$

したがって

$$
\begin{aligned}
\int_A\frac{dx\,dy}{x^2+y^2}
&=\int_0^{2\pi}\int_a^b\frac1{r^2}r\,dr\,d\theta\\
&=2\pi\int_a^b\frac{dr}{r}
=2\pi\log\frac ba.
\end{aligned}
$$

**本番答案**

$a\le r\le b$ として $r^{-2}\cdot r=r^{-1}$。よって $2\pi\int_a^bdr/r=2\pi\log(b/a)$。

**採点基準（20点）**：領域変換5点、Jacobian込みの被積分関数7点、積分計算8点。
<!-- solution-end -->

### B03 線形変換の像
- Level: B
- 目安時間: 15分

$A=\begin{pmatrix}2&1\\0&3\end{pmatrix}$ とし、単位正方形 $Q=[0,1]^2$ の像 $A(Q)$ の面積を求めよ。また $A(Q)$ 上で定数関数1を積分する変数変換を書け。

<!-- solution-start -->
**詳細解答**

線形写像 $z=Au$ の体積倍率は $|\det A|$ です。

$$
\det A=2\cdot3-0\cdot1=6.
$$

単位正方形の面積は $|Q|=1$ なので

$$
|A(Q)|=|\det A|\,|Q|=6.
$$

積分として同じ事実を書くと

$$
\int_{A(Q)}1\,dz
=\int_Q 1\cdot|\det A|\,du
=\int_Q6\,du
=6.
$$

ここで $A$ は可逆であり、$\det A\ne0$ なので線形変数変換の仮定も満たしています。

**本番答案**

$|\det A|=6$ より $|A(Q)|=6$。また $z=Au$ と置けば $\int_{A(Q)}1dz=\int_Q6du=6$。

**採点基準（20点）**：行列式6点、面積倍率6点、変数変換式8点。
<!-- solution-end -->

