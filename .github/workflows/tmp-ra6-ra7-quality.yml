## 12. 演習C

### C01 非線形変数変換を設計する
- Level: C
- 目安時間: 30分

第一象限の領域

$$
D=\{(x,y):1\le xy\le4,\ 1\le y/x\le9\}
$$

を考える。$u=xy$, $v=y/x$ と置いて $D$ を長方形へ移し、$\int_D1\,dx\,dy$ を計算せよ。

<!-- solution-start -->
**詳細解答**

まず、この変数変換を選ぶ理由は領域の二つの境界条件がそのまま

$$
1\le u\le4,
\qquad
1\le v\le9
$$

となり、$(u,v)$ 平面では長方形になるからです。

第一象限では $x>0,y>0$ なので

$$
u=xy,
\qquad
v=\frac yx
$$

から

$$
x^2=\frac uv,
\qquad
y^2=uv
$$

となり、逆変換は一意に

$$
x=\sqrt{\frac uv},
\qquad
y=\sqrt{uv}
$$

と定まります。第一象限という条件がここで単射性を保証しています。

逆変換の偏微分は

$$
\frac{\partial x}{\partial u}=\frac{x}{2u},
\qquad
\frac{\partial x}{\partial v}=-\frac{x}{2v},
$$

$$
\frac{\partial y}{\partial u}=\frac{y}{2u},
\qquad
\frac{\partial y}{\partial v}=\frac{y}{2v}.
$$

従って

$$
\begin{aligned}
\det\frac{\partial(x,y)}{\partial(u,v)}
&=\frac{x}{2u}\frac{y}{2v}
-\left(-\frac{x}{2v}\right)\frac{y}{2u}\\
&=\frac{xy}{2uv}
=\frac1{2v},
\end{aligned}
$$

ここでは $xy=u$ を使いました。$v>0$ なので絶対値を取っても同じです。

よって

$$
\begin{aligned}
|D|
=\int_D1\,dx\,dy
&=\int_1^4\int_1^9\frac1{2v}\,dv\,du\\
&=\int_1^4\frac12\log9\,du\\
&=\frac32\log9
=3\log3.
\end{aligned}
$$

もし第一象限という条件がなければ、同じ $(u,v)$ に対して $(x,y)$ と $(-x,-y)$ が対応し得るため、この逆変換は一意でなくなります。変数変換では「式が解ける」だけでなく、対象領域上で一対一になっているかを確認する必要があります。

**本番答案**

$u=xy$, $v=y/x$ で領域は $[1,4]\times[1,9]$。第一象限より $x=\sqrt{u/v}$, $y=\sqrt{uv}$。逆Jacobianは $1/(2v)$ なので

$$
|D|=\int_1^4\int_1^9\frac{1}{2v}\,dv\,du=3\log3.
$$

**採点基準（30点）**：長方形化6点、逆変換と単射性8点、Jacobian計算10点、積分と結論6点。
<!-- solution-end -->

---

'''
          text = text[:ex_start] + exercises + text[ex_end:]
          ra7.write_text(text, encoding='utf-8')
