name: Temporary RA6 RA7 quality patch

on:
  push:
    branches:
      - audit/ra6-ra7-quality-20260912

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[ra6-ra7-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/ra6-ra7-quality-20260912
          fetch-depth: 0

      - name: Patch RA6 and RA7
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ra6 = Path('textbook/volumes/00_foundations/F0_02C3_Frechet微分_線形作用素_随伴/index.md')
          text = ra6.read_text(encoding='utf-8')
          start_marker = '二階偏微分が近傍で連続なら、混合偏微分は交換できるためHessianは対称になります。このとき\n'
          end_marker = '高階も同様に、$D^{k-1}f$ を作用素値写像とみなし、そのFréchet微分として $D^kf$ を定義します。'
          assert text.count(start_marker) == 1, text.count(start_marker)
          assert text.count(end_marker) == 1, text.count(end_marker)
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          ra6_insert = r'''二階偏微分が近傍で連続するとき、Hessian が対称になる根拠もここで閉じます。

### 混合偏微分の交換を確認する

$f$ が $a\in\mathbb R^n$ の近傍で二階偏微分を持ち、それらが連続であるとします。異なる二つの座標 $i,j$ だけを動かし、他の座標は $a$ に固定します。十分小さい $h,k$ に対して矩形増分

$$
\Delta(h,k)
=f(a+he_i+ke_j)-f(a+he_i)-f(a+ke_j)+f(a)
$$

を考えます。

まず $i$ 方向の差を先にまとめると

$$
\Delta(h,k)
=\{f(a+ke_j+he_i)-f(a+ke_j)\}
-\{f(a+he_i)-f(a)\}.
$$

各中括弧へ $i$ 方向の一変数平均値定理を使うより、同じ $i$ 位置で比較できるよう

$$
g_i(t)=f(a+te_i+ke_j)-f(a+te_i)
$$

と置きます。すると $\Delta(h,k)=g_i(h)-g_i(0)$ なので、ある $\theta\in(0,1)$ が存在して

$$
\Delta(h,k)
=h\,g_i'(\theta h)
=h\{\partial_i f(a+\theta h e_i+ke_j)-\partial_i f(a+\theta h e_i)\}.
$$

今度は中括弧に $j$ 方向の一変数平均値定理を使うと、ある $\eta\in(0,1)$ が存在して

$$
\Delta(h,k)
=hk\,\partial_j\partial_i f
(a+\theta h e_i+\eta k e_j).
$$

座標の役割を逆にして同じ矩形増分を計算すれば、ある $\theta',\eta'\in(0,1)$ に対して

$$
\Delta(h,k)
=hk\,\partial_i\partial_j f
(a+\theta' h e_i+\eta' k e_j).
$$

$hk\ne0$ で割ると両者は等しいので、$(h,k)\to(0,0)$ とします。二階偏微分の連続性から評価点はいずれも $a$ へ近づき、

$$
\partial_j\partial_i f(a)=\partial_i\partial_j f(a)
$$

を得ます。したがって $C^2$ 級の実数値関数では Hessian は対称です。

この証明の要点は、混合偏微分を「記号の順序交換」として扱わず、**同じ矩形増分 $\Delta(h,k)$ を二通りの順序で一変数平均値定理へ還元する**ことです。

このとき

$$
D^2f(a)[u,v]=u^{\mathsf T}H_f(a)v.
$$

'''
          text = text[:start] + ra6_insert + text[end:]
          ra6.write_text(text, encoding='utf-8')

          ra7 = Path('textbook/volumes/00_foundations/RA7/index.md')
          text = ra7.read_text(encoding='utf-8')

          shear_start = '3. **shear**：$x_i\\mapsto x_i+c x_j$、他の座標は固定する変換では、$x_j$ と残りの座標を固定した断面の $x_i$ 方向の長さは平行移動するだけで変わりません。矩形の有限和について反復積分すれば体積は不変です。\n\nJordan可測集合 $E$ は、境界を総体積任意小の矩形で覆うことで、内側・外側の有限矩形和に挟めます。上の三種類の写像ではその誤差矩形の総体積も固定定数倍にしかならないため、矩形和で成立した体積倍率を分割誤差を0へ送って $E$ へ移せます。\n\n'
          assert text.count(shear_start) == 1, text.count(shear_start)
          shear_new = r'''3. **shear**：$S(x)_i=x_i+c x_j$、他の座標は固定する変換を考えます。ここは「断面の長さが同じ」と言うだけではなく、Jordan内容の定義まで戻って確認します。

まず直方体

$$
Q=I_1\times\cdots\times I_n
$$

を考え、$I_j$ を $m$ 等分して $Q$ を $j$ 方向の薄い直方体 $Q_1,\dots,Q_m$ に分けます。$I_j$ の長さを $\ell_j$、各薄片の幅を $h=\ell_j/m$ とします。$Q_r$ の中では $x_j$ の振幅が $h$ なので、shear 後の $i$ 座標の振幅は元の $I_i$ の長さ $\ell_i$ より高々 $|c|h$ だけ増えます。従って $S(Q_r)$ は体積

$$
(\ell_i+|c|h)h\prod_{k\ne i,j}\ell_k
$$

の軸平行直方体に入ります。全薄片について足すと

$$
\sum_{r=1}^m |\text{cover}_r|
=|Q|+
\frac{|c|\ell_j^2}{m}
\prod_{k\ne i,j}\ell_k.
$$

右の余分な項は $m\to\infty$ で0へ行くので、$S(Q)$ の外側Jordan内容は $|Q|$ 以下です。

次に $S(Q)$ が実際にJordan可測であることを確認します。$\partial Q$ は有限個の $(n-1)$ 次元の面からなり、各面を細かい $(n-1)$ 次元格子へ分けると、その shear 像は辺長が格子幅の定数倍で抑えられる細長い直方体で覆えます。格子数は $O(\delta^{-(n-1)})$、各被覆直方体の $n$ 次元体積は $O(\delta^n)$ なので、総体積は $O(\delta)\to0$ です。従って

$$
\partial S(Q)=S(\partial Q)
$$

はJordan内容0で、$S(Q)$ はJordan可測です。

逆向きには $S^{-1}$ も係数 $-c$ の shear です。$S(Q)$ を外側から有限個の直方体 $R_1,\dots,R_N$ で

$$
S(Q)\subset\bigcup_{r=1}^N R_r,
\qquad
\sum_r|R_r|<|S(Q)|+\varepsilon
$$

と覆ります。各 $R_r$ に今の薄片評価を $S^{-1}$ について適用すると、$S^{-1}(R_r)$ は体積を $|R_r|$ に任意に近い上側からの直方体和で覆えます。従って

$$
|Q|
\le |S(Q)|+\varepsilon.
$$

$\varepsilon\downarrow0$ として $|Q|\le|S(Q)|$。先ほどの逆向きの評価と合わせて

$$
|S(Q)|=|Q|.
$$

最後に一般のJordan可測集合 $E$ へ移します。任意の $\varepsilon>0$ に対し、有限個の互いに内部で交わらない直方体の和 $I,O$ を

$$
I\subset E\subset O,
\qquad
|O|-|I|<\varepsilon
$$

となるように取れます。shear は単射で、各直方体の体積を保存するので

$$
S(I)\subset S(E)\subset S(O),
\qquad
|S(O)|-|S(I)|=|O|-|I|<\varepsilon.
$$

従って $S(E)$ はJordan可測で $|S(E)|=|E|$ です。これで shear の体積保存を、反復積分を未証明の指示関数へ拡張することなく閉じました。

'''
          text = text.replace(shear_start, shear_new)

          ex_start = text.index('## 10. 演習A')
          ex_end = text.index('## 13. 章末チェック', ex_start)
          exercises = r'''## 10. 演習A

ここでは答えだけでなく、**領域・座標変換・Jacobian・定理の仮定をどの順で確認するか**まで解答に残します。

### A01 多次元Darboux和
- Level: A
- 目安時間: 10分

$f(x,y)=x+y$ を $[0,1]^2$ 上で考え、各軸を $N$ 等分する。$U(f,P_N)-L(f,P_N)$ を求め、可積分性を直接示せ。

<!-- solution-start -->
**詳細解答**

小正方形

$$
Q_{ij}=\left[\frac{i-1}{N},\frac{i}{N}\right]
\times
\left[\frac{j-1}{N},\frac{j}{N}\right]
$$

では $f(x,y)=x+y$ は各座標について増加するので、最小値と最大値はそれぞれ左下・右上で取られます。従って振幅は

$$
M_{ij}-m_{ij}
=\frac2N.
$$

各小正方形の面積は $1/N^2$、全部で $N^2$ 個なので

$$
\begin{aligned}
U(f,P_N)-L(f,P_N)
&=\sum_{i,j}(M_{ij}-m_{ij})|Q_{ij}|\\
&=N^2\cdot\frac2N\cdot\frac1{N^2}
=\frac2N.
\end{aligned}
$$

これは $N\to\infty$ で0へ行きます。したがって任意の $\varepsilon>0$ に対して $N>2/\varepsilon$ と取れば $U-L<\varepsilon$ となり、多次元Darboux判定から $f$ はRiemann可積分です。

**本番答案**

各小正方形での振幅が $2/N$、面積和が1なので $U-L=2/N\to0$。よってDarboux判定から可積分。

**採点基準（20点）**：小正方形上の振幅8点、$U-L$ の総和6点、Darboux判定による結論6点。
<!-- solution-end -->

### A02 反復積分
- Level: A
- 目安時間: 10分

$$
\int_{[0,1]^2}(x^2+2xy)\,dx\,dy
$$

を反復積分で計算せよ。

<!-- solution-start -->
**詳細解答**

被積分関数は閉矩形上連続なので、反復積分定理を使えます。先に $y$ で積分すると

$$
\int_0^1(x^2+2xy)\,dy
=x^2+[xy^2]_{0}^{1}
=x^2+x.
$$

従って

$$
\int_0^1\int_0^1(x^2+2xy)\,dy\,dx
=\int_0^1(x^2+x)\,dx
=\frac13+\frac12
=\frac56.
$$

積分順序を交換しても同じ値になりますが、この問題では一方を計算すれば十分です。

**本番答案**

連続性から反復積分可能。
$\int_0^1(x^2+2xy)dy=x^2+x$ より、外側を積分して $5/6$。

**採点基準（20点）**：反復積分の設定4点、内側積分8点、外側積分と値8点。
<!-- solution-end -->

### A03 polar coordinates
- Level: A
- 目安時間: 10分

$a>0$ とする。円板 $x^2+y^2\le a^2$ 上で $x^2+y^2$ を積分せよ。

<!-- solution-start -->
**詳細解答**

円板なので

$$
x=r\cos\theta,\qquad y=r\sin\theta,
\qquad 0\le r\le a,\quad0\le\theta\le2\pi
$$

と置きます。被積分関数は

$$
x^2+y^2=r^2,
$$

Jacobian因子は $r$ です。従って

$$
\begin{aligned}
\int_{x^2+y^2\le a^2}(x^2+y^2)\,dx\,dy
&=\int_0^{2\pi}\int_0^a r^2\,r\,dr\,d\theta\\
&=2\pi\left[\frac{r^4}{4}\right]_0^a
=\frac{\pi a^4}{2}.
\end{aligned}
$$

$r=0$ でJacobianが退化しますが、本文で確認した通り原点はJordan内容0なので公式の値に影響しません。

**本番答案**

polar coordinates で被積分関数 $r^2$、Jacobian $r$。$\int_0^{2\pi}\int_0^a r^3drd\theta=\pi a^4/2$。

**採点基準（20点）**：座標範囲5点、被積分関数とJacobian7点、積分計算8点。
<!-- solution-end -->

### A04 絶対値の役割
- Level: A
- 目安時間: 10分

$\Phi(u,v)=(v,u)$ について $\det D\Phi$ と $|\det D\Phi|$ を求め、体積公式に絶対値が必要な理由を説明せよ。

<!-- solution-start -->
**詳細解答**

微分行列は一定で

$$
D\Phi=
\begin{pmatrix}
0&1\\
1&0
\end{pmatrix},
\qquad
\det D\Phi=-1,
\qquad
|\det D\Phi|=1.
$$

この写像は二つの座標を交換するだけなので、正方形・長方形を同じ面積の図形へ移します。一方、行列式の符号は向きが反転したことを記録するため $-1$ です。面積・体積は向きではなく大きさを測るので、倍率には

$$
|\det D\Phi|=1
$$

を使う必要があります。絶対値を外すと、正の面積を持つ領域の積分が座標交換だけで負になってしまいます。

**本番答案**

$\det D\Phi=-1$、$|\det D\Phi|=1$。座標交換は向きを反転するが面積を保存するので、体積倍率は行列式そのものではなく絶対値。

**採点基準（20点）**：Jacobian4点、行列式4点、向きと体積の区別8点、絶対値の結論4点。
<!-- solution-end -->

