name: Temporary promote CA1
on:
  push:
    branches:
      - codex/ca1-complex-differentiation
    paths:
      - .github/workflows/tmp-promote-ca1.yml
      - scripts/tmp_promote_ca1.py
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ca1-complex-differentiation
      - name: Promote CA1
        run: python scripts/tmp_promote_ca1.py
      - name: Validate promotion
        run: |
          npm ci
          npm run validate:dream-theater-standard-math-core
          npm run validate:dream-theater-index
      - name: Commit promotion
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add textbook/dream-theater-standard-math-core.yaml textbook/dream-theater-index.json textbook/dream-theater.md
          git diff --cached --quiet || git commit -m "feat: promote CA1 to published standard core"
          git push
