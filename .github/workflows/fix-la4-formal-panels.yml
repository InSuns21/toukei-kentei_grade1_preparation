name: One-shot LA4 formal panel repair

on:
  push:
    branches:
      - feature/dream-theater-linear-algebra-core

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/fix-la4-formal-panels.mjs
