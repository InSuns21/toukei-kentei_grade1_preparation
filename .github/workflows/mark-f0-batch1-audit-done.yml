name: Mark F0 Batch 1 audit done

on:
  push:
    branches:
      - feat/f0-batch1-metric-compact-complete
    paths:
      - 'scripts/mark-f0-batch1-audit-done.mjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f0-batch1-metric-compact-complete
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/mark-f0-batch1-audit-done.mjs
      - name: Commit audit update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook/f0-dream-theater-proof-audit.md
          git diff --cached --quiet && exit 0
          git commit -m 'docs: mark DREAM THEATER Batch 1 complete'
          git push
