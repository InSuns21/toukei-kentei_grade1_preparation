name: Fix Batch 1 display math

on:
  push:
    branches:
      - feat/f0-batch1-metric-compact-complete
    paths:
      - 'scripts/fix-batch1-display-math.mjs'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f0-batch1-metric-compact-complete
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fix-batch1-display-math.mjs
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook/volumes/00_foundations/F0_00B_距離空間_開集合_閉集合_収束/index.md
          git add textbook/volumes/00_foundations/F0_00C_連続写像_コンパクト性_最大最小/index.md
          git add textbook/volumes/00_foundations/F0_00D_Cauchy列_完備性_無限次元/index.md
          git diff --cached --quiet && exit 0
          git commit -m 'fix: normalize Batch 1 display math delimiters'
          git push
