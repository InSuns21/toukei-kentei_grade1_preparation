name: CA4 final reference fix

on:
  push:
    branches:
      - codex/ca4-laurent-residue-rouche
    paths:
      - .github/workflows/ca4-final-reference-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/ca4-laurent-residue-rouche
          fetch-depth: 0
      - name: Remove ambiguous named reference in CA4 exercise
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('textbook/volumes/00_foundations/CA4/index.md')
          s = p.read_text(encoding='utf-8')
          old = '境界上に零点がないことも Rouché の不等式から同時に保証される。'
          new = '境界上に零点がないことも、上の厳密不等式から同時に保証される。'
          if s.count(old) != 1:
              raise SystemExit(f'expected one target, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/ca4-final-reference-fix.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove ambiguous Rouché reference wording"
          git push origin HEAD:codex/ca4-laurent-residue-rouche
