name: One-shot MT2 normalization

on: [push]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mt5-radon-riesz-markov
          fetch-depth: 0

      - name: Normalize MT2 changed-page requirements
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("textbook/volumes/00_foundations/MT2/index.md")
          text = p.read_text(encoding="utf-8")

          old_intro = "です。この章ではこれを **有限符号付き測度** と呼びます。まず Hahn 分解を **Radon–Nikodym 定理に頼らず** 証明し、そこから Jordan 分解と全変動を導きます。"
          new_intro = "です。以下では実数値を取る場合に限定し、第1節の正式な定義から出発します。まず Hahn 分解を **Radon–Nikodym 定理に頼らず** 証明し、そこから Jordan 分解と全変動を導きます。"
          if text.count(old_intro) != 1:
              raise SystemExit(f"MT2 intro match count={text.count(old_intro)}")
          text = text.replace(old_intro, new_intro)

          marker = "\n### Level B\n"
          if text.count(marker) != 1:
              raise SystemExit(f"MT2 Level B marker count={text.count(marker)}")

          a_more = "\n".join([
              "",
              "<a id=\"ex-mt2-a03\"></a>",
              "#### MT2-A03 確率測度の差と全変動係数",
              "- Level: A",
              "",
              "$X=\\{1,2\\}$ 上の確率測度 $P,Q$ を",
              "",
              "$$",
              "P(\\{1\\})=\\frac34,\\quad P(\\{2\\})=\\frac14,",
              "\\qquad",
              "Q(\\{1\\})=\\frac14,\\quad Q(\\{2\\})=\\frac34",
              "$$",
              "",
              "で定め、$\\nu=P-Q$ とする。$|\\nu|(X)$ と $\\sup_A|P(A)-Q(A)|$ を求め、両者の係数関係を確認してください。",
              "",
              "<!-- solution-start -->",
              "**解答**：原子ごとに",
              "",
              "$$",
              "\\nu(\\{1\\})=\\frac12,\\qquad \\nu(\\{2\\})=-\\frac12",
              "$$",
              "",
              "なので Jordan 正負部分の全質量はそれぞれ $1/2$。従って",
              "",
              "$$",
              "|\\nu|(X)=\\frac12+\\frac12=1.",
              "$$",
              "",
              "一方、$A=\\{1\\}$ または $\\{2\\}$ で差の絶対値が $1/2$ となり、他の集合ではこれを超えないため",
              "",
              "$$",
              "\\sup_A|P(A)-Q(A)|=\\frac12=\\frac12|P-Q|(X).",
              "$$",
              "<!-- solution-end -->",
              "",
              "<a id=\"ex-mt2-a04\"></a>",
              "#### MT2-A04 符号付き積分と全変動評価",
              "- Level: A",
              "",
              "$X=\\{a,b\\}$ 上で $\\nu(\\{a\\})=2$, $\\nu(\\{b\\})=-3$ とし、$f(a)=1$, $f(b)=2$ とする。$\\int f\\,d\\nu$ と $\\int |f|\\,d|\\nu|$ を求め、全変動による積分評価を数値で確認してください。",
              "",
              "<!-- solution-start -->",
              "**解答**：離散積分を原子ごとに計算すると",
              "",
              "$$",
              "\\int f\\,d\\nu=1\\cdot2+2\\cdot(-3)=-4.",
              "$$",
              "",
              "また $|\\nu|(\\{a\\})=2$, $|\\nu|(\\{b\\})=3$ なので",
              "",
              "$$",
              "\\int |f|\\,d|\\nu|=1\\cdot2+2\\cdot3=8.",
              "$$",
              "",
              "従って",
              "",
              "$$",
              "\\left|\\int f\\,d\\nu\\right|=4\\le8=\\int|f|\\,d|\\nu|",
              "$$",
              "",
              "となり本文の評価を具体的に確認できます。",
              "<!-- solution-end -->",
              "",
          ])
          text = text.replace(marker, a_more + marker)
          p.write_text(text, encoding="utf-8")

          p = Path("textbook/volumes/00_foundations/MT2/chapter.yaml")
          text = p.read_text(encoding="utf-8")
          old = "exercise_counts: { level_a: 2, level_b: 3, level_c: 2, level_d: 0 }"
          new = "exercise_counts: { level_a: 4, level_b: 3, level_c: 2, level_d: 0 }"
          if text.count(old) != 1:
              raise SystemExit(f"MT2 chapter exercise count match={text.count(old)}")
          p.write_text(text.replace(old, new), encoding="utf-8")

          Path(".github/workflows/one-shot-mt2-normalize.yml").unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Normalize MT2 for changed-page validation"
          git push origin HEAD:codex/mt5-radon-riesz-markov
