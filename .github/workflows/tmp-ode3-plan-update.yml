name: Temporary ODE3 plan update

on:
  push:
    branches:
      - codex/dream-theater-ode3-linear-systems

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/dream-theater-ode3-linear-systems
      - name: Update restructure plan
        run: |
          echo '' | base64 -d | python
      - name: Commit plan update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add textbook/DREAM_THEATER_ODE_FOURIER_PDE_RESTRUCTURE_PLAN.md
          git commit -m "Mark ODE3 complete and advance plan to ODE4"
          git push origin HEAD:codex/dream-theater-ode3-linear-systems
