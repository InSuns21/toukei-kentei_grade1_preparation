name: Temporary ODE3 explicit dependency fixes

on:
  push:
    branches:
      - codex/dream-theater-ode3-linear-systems

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/dream-theater-ode3-linear-systems
      - name: Apply exact dependency fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('textbook/volumes/00_foundations/ODE3/index.md')
          s = p.read_text()
          replacements = [
              ('は複素数値の解です。Euler の公式から', 'は複素数値の解です。ODE2 の[定係数斉次方程式の基本解系](../ODE2/index.md#thm-ode2-constant-coefficient)で用いた $e^{i\\theta}=\\cos\\theta+i\\sin\\theta$ を使うと'),
              ('成分ごとに微積分学の基本定理を使えば', '成分ごとに[微積分学の基本定理I](../RA4/index.md#thm-ra4-ftc1)を使えば'),
              ('と分けます。$I$ と $J$ は可換なので、本文の回転ブロック公式から', 'と分けます。$I$ と $J$ は可換で $J^2=-I$ なので、行列指数の級数を偶数冪と奇数冪に分けると'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'missing expected text: {old!r}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add textbook/volumes/00_foundations/ODE3/index.md
          git commit -m "Resolve ODE3 explicit proof dependencies"
          git push origin HEAD:codex/dream-theater-ode3-linear-systems
