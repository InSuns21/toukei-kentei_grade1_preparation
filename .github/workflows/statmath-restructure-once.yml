name: One-shot statistical mathematics restructure

on:
  push:
    paths:
      - scripts/restructure_statistical_mathematics.mjs

permissions:
  contents: write

jobs:
  restructure:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/restructure_statistical_mathematics.mjs
      - run: npm run validate:mathstat
      - name: Commit normalized layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "refactor: align statistical mathematics with applied-rikou layout"
          git push origin HEAD:main
