# Retry transient Pages service failures without rebuilding or rolling back the site.
# The source workflow is trusted (main only); no repository code is checked out here.
name: Recover failed GitHub Pages deployment

on:
  workflow_run:
    workflows:
      - Deploy learning site to GitHub Pages
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: pages-deploy-recovery
  cancel-in-progress: false

jobs:
  retry-deploy:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for transient Pages service failures to clear
        run: sleep 90

      - name: Re-run failed deployment only for the current main commit
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          # A newer main push owns publication; never replay an older artifact.
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')"
          if [[ "$current_sha" != "$SOURCE_SHA" ]]; then
            echo "Skipping stale deployment $SOURCE_SHA; main is $current_sha"
            exit 0
          fi

          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          read -r status conclusion attempt head_sha < <(
            jq -r '[.status, .conclusion, (.run_attempt | tostring), .head_sha] | join(" ")' <<< "$run_json"
          )
          if [[ "$status" != "completed" || "$conclusion" != "failure" ||
                "$attempt" != "$SOURCE_RUN_ATTEMPT" || "$head_sha" != "$SOURCE_SHA" ]]; then
            echo "The failed run has changed since the recovery event; skipping"
            exit 0
          fi
          # Initial attempt plus at most two automated retries.
          if (( attempt >= 3 )); then
            echo "::error::Pages deployment still failing after $attempt attempts; manual investigation required"
            exit 1
          fi

          jobs_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs?per_page=100")"
          build_ok="$(jq '[.jobs[] | select(.name == "build" and .conclusion == "success")] | length' <<< "$jobs_json")"
          deploy_failed="$(jq '[.jobs[] | select(.name == "deploy" and .conclusion == "failure")] | length' <<< "$jobs_json")"
          if [[ "$build_ok" != "1" || "$deploy_failed" != "1" ]]; then
            echo "Skipping non-Pages failure (build successes: $build_ok, deploy failures: $deploy_failed)"
            exit 0
          fi

          # The original build artifact is reused; dependent smoke test runs too.
          echo "Retrying failed deployment for $SOURCE_SHA (attempt $((attempt + 1))/3)"
          gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID/rerun-failed-jobs"
