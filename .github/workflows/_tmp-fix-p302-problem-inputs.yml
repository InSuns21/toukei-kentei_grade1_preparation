name: Temporary P3-02 problem input fix

on:
  push:
    paths:
      - 'scripts/_tmp_fix_p302_problem_inputs.mjs'
      - '.github/workflows/_tmp-fix-p302-problem-inputs.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Apply source migration
        run: node scripts/_tmp_fix_p302_problem_inputs.mjs
      - name: Commit migrated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook/volumes/02_distributions/P3_02_主要な連続分布/index.md EXERCISE_GUIDELINES.md
          git diff --cached --check
          git commit -m 'align P3-02 problem inputs with common exercise rules'
          git push
