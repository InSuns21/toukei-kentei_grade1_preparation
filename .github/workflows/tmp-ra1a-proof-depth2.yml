name: Temporary RA1A proof depth runner
on:
  push:
    branches: [feat/ra1a-series-convergence]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ra1a-series-convergence
          fetch-depth: 0
      - name: Apply proof-depth fixes
        run: python scripts/tmp_ra1a_proof_depth.py
      - name: Commit fixes and remove temporary files
        run: |
          rm -f .github/workflows/tmp-ra1a-proof-depth.yml
          rm -f .github/workflows/tmp-ra1a-proof-depth2.yml
          rm -f scripts/tmp_ra1a_proof_depth.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'RA1A: strengthen proof and solution granularity'
          git push origin HEAD:feat/ra1a-series-convergence
