name: Temporary proof pedagogy edge fixes

on:
  push:
    branches:
      - audit/proof-pedagogy-folding
    paths:
      - 'scripts/fix-proof-pedagogy-edge-cases.mjs'
      - '.github/workflows/tmp-proof-edge-fixes.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: audit/proof-pedagogy-folding

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply edge-case fixes
        run: node scripts/fix-proof-pedagogy-edge-cases.mjs

      - name: Validate proof folding
        run: npm run validate:proof-folding

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add textbook/volumes
          if git diff --cached --quiet; then
            echo "No edge fixes to commit."
          else
            git commit -m "fold implicit proof and fix audit-found text issues"
            git push
          fi
