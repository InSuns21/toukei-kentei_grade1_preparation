name: Cleanup F0 C3-C7 exercise LaTeX

on:
  push:
    branches:
      - feat/f0-batch2-lebesgue-integration-foundations
    paths:
      - '.github/workflows/cleanup-f0-c3-c7-exercise-latex.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f0-batch2-lebesgue-integration-foundations
      - name: Normalize generated exercise LaTeX escapes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('textbook/volumes/00_foundations')
          dirs = [
              'F0_02C3_Frechet微分_線形作用素_随伴',
              'F0_02C3A_随伴作用素_Banach_Hilbert',
              'F0_02C4_凸解析_劣勾配_normal_cone_双対錐',
              'F0_02C4A_tangent_polar_dual_cone',
              'F0_02C5_一般化KKT_制約写像_制約想定',
              'F0_02C5A_制約想定_LICQ_MFCQ_Robinson',
              'F0_02C6_Hahn_Banach_分離定理',
              'F0_02C6A_分離定理_Minkowski_Farkas',
              'F0_02C7_RKHS_再生核_representer_kernel_SVM',
              'F0_02C7A_representer_kernel_SVM',
          ]
          for d in dirs:
              p = root / d / 'index.md'
              s = p.read_text()
              marker = '\n## 演習\n'
              if marker not in s:
                  raise SystemExit(f'missing exercise marker: {p}')
              head, tail = s.split(marker, 1)
              tail = tail.replace('\\\\', '\\')
              p.write_text(head + marker + tail)
          PY
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook
          git diff --cached --quiet && exit 0
          git commit -m 'fix: normalize C3-C7 exercise LaTeX escapes'
          git push
