name: FA4 Concept Fix

on:
  push:
    branches: [codex/fa4-banach-alaoglu-reflexivity]
    paths: ['.github/workflows/fa4-concept-fix.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fa4-banach-alaoglu-reflexivity
      - name: Patch FA4 concept reference
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('textbook/volumes/00_foundations/FA4/index.md')
          s = p.read_text(encoding='utf-8')
          old = '反射性と[前節の定理](#thm-fa4-reflexive-weak-compact-ball)により $B_X$ は弱コンパクトで、'
          new = '[反射性と閉単位球の弱コンパクト性](#thm-fa4-reflexive-weak-compact-ball)の $1\\Rightarrow2$ により $B_X$ は弱コンパクトで、'
          assert old in s
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add textbook/volumes/00_foundations/FA4/index.md
          git commit -m "Use canonical FA4 theorem reference"
          git push origin HEAD:codex/fa4-banach-alaoglu-reflexivity
