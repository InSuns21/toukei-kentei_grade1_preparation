name: One-shot LA dependency audit

on:
  push:
    branches:
      - fix/la4-la6-dependency-audit

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: bootstrap LA dependency audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/la4-la6-dependency-audit
          fetch-depth: 0

      - name: Patch LA4-LA6 dependency gaps
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def sub_once(text, pattern, replacement, label, flags=0):
              new, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise RuntimeError(f'{label}: expected 1 replacement, got {count}')
              return new

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected 1 exact match, got {count}')
              return text.replace(old, new, 1)

          # ---------- LA4 ----------
          path = Path('textbook/volumes/00_foundations/LA4/index.md')
          s = path.read_text(encoding='utf-8')

          la4_prefix = r'''## 2. 特性多項式と最小多項式

特性多項式では、行列の成分そのものが多項式になります。LA3で構成した通常の行列式はスカラー成分の行列に対するものでしたから、ここでいきなり $\det(tI-A)$ と書いて済ませず、まず多項式行列の行列式をLeibniz公式から定義します。

### 2.1 非零多項式の根の個数

<a id="lem-la4-polynomial-root-bound"></a>
<!-- formal-statement-start -->
> **補題（非零多項式の根の個数）**  
> 体 $\mathbb F$ 上の0でない次数 $d$ の多項式は、$\mathbb F$ の中に高々 $d$ 個しか相異なる根を持たない。
<!-- formal-statement-end -->

<!-- proof-start -->
### 証明

$d$ に関する帰納法で示します。$d=0$ の非零定数多項式には根がありません。

$d\ge1$ とし、$p$ が根 $a$ を持つとします。多項式の除法により
$$
p(t)=(t-a)q(t)+r
$$
と書け、余り $r$ は定数です。$t=a$ を代入すると
$$
0=p(a)=r
$$
なので
$$
p(t)=(t-a)q(t),
\qquad \deg q=d-1.
$$
$a$ と異なる根 $b$ があれば
$$
0=p(b)=(b-a)q(b).
$$
体では $b-a\ne0$ を割れるため $q(b)=0$ です。従って $a$ 以外の根は全て $q$ の根であり、帰納法の仮定からその個数は高々 $d-1$。$a$ を加えても高々 $d$ 個です。$\square$
<!-- proof-end -->

この補題は後で「次数より多くの点で一致する二つの多項式は同じ多項式」と判断するときにも使います。

### 2.2 多項式行列の行列式

<a id="def-la4-polynomial-matrix-determinant"></a>
<!-- formal-statement-start -->
> **定義（多項式行列の行列式）**  
> $M(t)=(m_{ij}(t))\in\mathbb F[t]^{n\times n}$ に対して
$$
\det M(t)
=
\sum_{\sigma\in S_n}
\operatorname{sgn}(\sigma)
\prod_{j=1}^n m_{\sigma(j),j}(t)
$$
> と定める。右辺は多項式の有限和・有限積なので $\mathbb F[t]$ の元である。
<!-- formal-statement-end -->

<!-- definition-example-start: def-la4-polynomial-matrix-determinant -->
**定義の確認**：
$$
M(t)=
\begin{pmatrix}
t-a&b\\
c&t-d
\end{pmatrix}
$$
なら、$S_2$ の2項をそのまま足して
$$
\det M(t)=(t-a)(t-d)-bc.
$$
これはスカラー行列式の公式を記号的に流用したのではなく、$\mathbb F[t]$ の加法・乗法でLeibniz公式を評価した結果です。
<!-- definition-example-end -->

<a id="lem-la4-polynomial-det-evaluation"></a>
<!-- formal-statement-start -->
> **補題（多項式行列式とスカラー代入）**  
> $s\in\mathbb F$ に対し、各成分へ $t=s$ を代入したスカラー行列を $M(s)$ と書く。このとき
$$
\bigl(\det M(t)\bigr)\big|_{t=s}
=\det M(s).
$$
<!-- formal-statement-end -->

<!-- proof-start -->
### 証明

定義へ $t=s$ を代入すると
$$
\begin{aligned}
\bigl(\det M(t)\bigr)\big|_{t=s}
&=
\sum_{\sigma\in S_n}
\operatorname{sgn}(\sigma)
\prod_{j=1}^n m_{\sigma(j),j}(s)\\
&=\det M(s).
\end{aligned}
$$
最後の式はLA3で定義したスカラー行列のLeibniz公式そのものです。$\square$
<!-- proof-end -->

### 2.3 特性多項式は基底に依存しない

<a id="def-la4-characteristic-polynomial"></a>
<!-- formal-statement-start -->
> **定義（特性多項式）**  
> $V$ を $n$ 次元、$T:V\to V$ を線形自己写像とする。基底 $\mathcal B$ を一つ選び、表現行列を
$$
A=[T]_{\mathcal B}
$$
> とする。このとき多項式行列の行列式として
$$
\chi_{T,\mathcal B}(t)=\det(tI-A)
$$
> と置く。次の定理で基底に依存しないことを示した後は、単に $\chi_T(t)$ と書く。
<!-- formal-statement-end -->

<a id="thm-la4-characteristic-basis-independent"></a>
<!-- formal-statement-start -->
> **定理（特性多項式の基底不変性）**  
> $\mathbb F=\mathbb R$ または $\mathbb C$ とする。二つの基底 $\mathcal B,\mathcal C$ に対して
$$
\chi_{T,\mathcal B}(t)=\chi_{T,\mathcal C}(t).
$$
> 従って特性多項式 $\chi_T$ は基底の選び方に依存しない。
<!-- formal-statement-end -->

<!-- proof-start -->
### 証明

$A=[T]_{\mathcal B}$、$B=[T]_{\mathcal C}$ とします。基底変換行列を $P$ とすれば
$$
B=P^{-1}AP.
$$
任意のスカラー $s\in\mathbb F$ について
$$
sI-B
=P^{-1}(sI-A)P.
$$
ここで $sI-A$ と $sI-B$ は通常のスカラー行列です。LA3の[行列式の相似不変性](../LA3/index.md#thm-la3-det-similarity-invariant)から
$$
\det(sI-B)=\det(sI-A).
$$
一方[多項式行列式とスカラー代入](#lem-la4-polynomial-det-evaluation)により
$$
\chi_{T,\mathcal C}(s)=\det(sI-B),
\qquad
\chi_{T,\mathcal B}(s)=\det(sI-A).
$$
従って二つの多項式は全ての $s\in\mathbb F$ で同じ値を取ります。

もし差
$$
h(t)=\chi_{T,\mathcal B}(t)-\chi_{T,\mathcal C}(t)
$$
が0でないなら、[非零多項式の根の個数](#lem-la4-polynomial-root-bound)から根は有限個しかありません。しかし $\mathbb R,\mathbb C$ は無限体で、全ての $s\in\mathbb F$ が $h$ の根になっています。矛盾です。従って $h=0$ であり、二つの特性多項式は一致します。$\square$
<!-- proof-end -->

<a id="thm-la4-characteristic-monic"></a>
<!-- formal-statement-start -->
> **定理（特性多項式は首一 $n$ 次）**  
> $\dim V=n$ なら
$$
\chi_T(t)=t^n+c_{n-1}t^{n-1}+\cdots+c_0
$$
> と書ける。特に次数はちょうど $n$、最高次係数は1である。
<!-- formal-statement-end -->

<!-- proof-start -->
### 証明

基底を選び $A=(a_{ij})$ とします。Leibniz公式で恒等置換 $\sigma=\mathrm{id}$ に対応する項は
$$
\prod_{j=1}^n(t-a_{jj}),
$$
したがって最高次項は $t^n$ で係数1です。

一方 $\sigma\ne\mathrm{id}$ なら、ある $j$ で $\sigma(j)\ne j$ です。その列から選ばれる $(tI-A)_{\sigma(j),j}$ は対角成分ではないので
$$
(tI-A)_{\sigma(j),j}=-a_{\sigma(j),j}
$$
となり、$t$ を含みません。従ってその置換に対応する積の次数は高々 $n-1$ です。よって $t^n$ を生むのは恒等置換の項だけで、$\chi_T$ は首一 $n$ 次です。$\square$
<!-- proof-end -->

<a id="thm-la4-eigenvalue-characteristic-root"></a>
<!-- formal-statement-start -->
> **定理（固有値と特性多項式の根）**  
> $\lambda\in\mathbb F$ に対して
$$
\lambda\text{ が }T\text{ の固有値}
\iff
\chi_T(\lambda)=0.
$$
<!-- formal-statement-end -->

<!-- proof-start -->
### 証明

基底を選び $A=[T]_{\mathcal B}$ とします。$\lambda$ が固有値であることは
$$
\ker(T-\lambda I)\ne\{0\}
$$
と同値です。有限次元の自己写像では、これは $T-\lambda I$ が可逆でないことと同値です。表現行列で言えば $A-\lambda I$ が可逆でありません。

LA3の[行列式による可逆性判定](../LA3/index.md#thm-la3-det-invertible)から
$$
A-\lambda I\text{ が不可逆}
\iff
\det(A-\lambda I)=0.
$$
$A-\lambda I=-(\lambda I-A)$ なので、各列から $-1$ をくくれば
$$
\det(A-\lambda I)=(-1)^n\det(\lambda I-A).
$$
従って0になるかどうかは同じです。[多項式行列式とスカラー代入](#lem-la4-polynomial-det-evaluation)から
$$
\det(\lambda I-A)=\chi_T(\lambda).
$$
以上の同値をつなげれば結論を得ます。$\square$
<!-- proof-end -->

<a id="note-la4-fta-boundary"></a>
> **証明境界（代数学の基本定理）**  
> 「複素係数の非定数多項式は複素数の根を持ち、従って一次因子の積へ分解できる」という事実は**代数学の基本定理**です。この章ではこれ自体の証明は行いません。後で「複素数上では特性多項式が一次因子へ分解する」と使う箇所は、すべてこの外部事実だけを使用しています。分解が得られた後の一般化固有空間・Jordan構造は、この章内で証明する多項式代数と線形代数だけで導きます。

<a id="def-la4-minimal-polynomial"></a>'''

          s = sub_once(
              s,
              r'## 2\. 特性多項式と最小多項式\n\n<a id="def-la4-characteristic-polynomial"></a>.*?<a id="def-la4-minimal-polynomial"></a>',
              la4_prefix,
              'LA4 section 2 prerequisite construction',
              flags=re.S,
          )

          s = replace_once(
              s,
              '<!-- definition-example-start: def-la4-characteristic-polynomial, def-la4-minimal-polynomial -->',
              '<!-- definition-example-start: def-la4-minimal-polynomial -->',
              'LA4 minimal-polynomial definition example marker',
          )

          la4_adjugate = r'''<a id="lem-la4-polynomial-laplace"></a>
<!-- formal-statement-start -->
> **補題（多項式行列のLaplace展開）**  
> $M(t)=(m_{ij}(t))\in\mathbb F[t]^{n\times n}$ とし、行 $i$ と列 $j$ を除いた小行列を $M_{ij}(t)$、
$$
C_{ij}(t)=(-1)^{i+j}\det M_{ij}(t)
$$
> と置く。このとき固定した行 $i$ に対して
$$
\det M(t)=\sum_{j=1}^n m_{ij}(t)C_{ij}(t).
$$
<!-- formal-statement-end -->

<!-- proof-start -->
### 証明

多項式行列式のLeibniz公式を、固定した行 $i$ がどの列 $j$ から選ばれるか、すなわち
$$
\sigma(j)=i
$$
となる $j$ ごとに分けます。
$$
\det M(t)
=
\sum_{j=1}^n
\sum_{\sigma:\sigma(j)=i}
\operatorname{sgn}(\sigma)
\prod_{k=1}^n m_{\sigma(k),k}(t).
$$
固定した $j$ の内側では $m_{ij}(t)$ が全項に共通です。第 $i$ 行と第 $j$ 列を取り除き、残った添字を昇順に詰めると $S_{n-1}$ の置換 $\bar\sigma$ が得られます。第 $i$ 行を先頭へ動かす $i-1$ 回と第 $j$ 列を先頭へ動かす $j-1$ 回の交換により
$$
\operatorname{sgn}(\sigma)
=(-1)^{i+j}\operatorname{sgn}(\bar\sigma).
$$
従って固定した $j$ の内側の和は
$$
m_{ij}(t)(-1)^{i+j}
\sum_{\bar\sigma\in S_{n-1}}
\operatorname{sgn}(\bar\sigma)
\prod m_{\bar\sigma(\cdot),\cdot}(t)
=m_{ij}(t)C_{ij}(t).
$$
ここで最後の和は定義通り $\det M_{ij}(t)$ です。$j$ について足せば主張を得ます。係数が多項式でも、必要なのは可換な加法・乗法と置換の符号だけであることが式から確認できます。$\square$
<!-- proof-end -->

<a id="lem-la4-adjugate-identity"></a>
<!-- formal-statement-start -->
> **補題（多項式行列の余因子行列の恒等式）**  
> $M(t)\in\mathbb F[t]^{n\times n}$ に対し、上の余因子を用いて
$$
\operatorname{adj}(M(t))_{kj}=C_{jk}(t)
$$
> と定める。このとき
$$
M(t)\operatorname{adj}(M(t))=\det(M(t))I.
$$
> $n=1$ では $0\times0$ 行列の行列式を1とする。
<!-- formal-statement-end -->

<!-- proof-start -->
### 証明

積の $(i,j)$ 成分は
$$
\bigl(M\operatorname{adj}(M)\bigr)_{ij}
=\sum_{k=1}^n m_{ik}(t)C_{jk}(t)
$$
です。

$i=j$ なら、[多項式行列のLaplace展開](#lem-la4-polynomial-laplace)を第 $j$ 行に適用して
$$
\sum_{k=1}^n m_{jk}(t)C_{jk}(t)=\det M(t).
$$

$i\ne j$ とします。$M(t)$ の第 $j$ 行を第 $i$ 行で置き換えた多項式行列を $N(t)$ とします。第 $j$ 行を削除した小行列は置換前と同じなので、第 $j$ 行の余因子は $C_{jk}(t)$ のままです。従ってLaplace展開から
$$
\det N(t)=\sum_{k=1}^n m_{ik}(t)C_{jk}(t).
$$
ところが $N(t)$ の第 $i$ 行と第 $j$ 行は等しいため、そのLeibniz和では各置換 $\sigma$ の項を、値 $i,j$ を入れ替えた置換 $(i\ j)\circ\sigma$ の項と対にできます。二つの積は等しく、置換の符号は互換1回分だけ反転するので各対が相殺します。従って
$$
\det N(t)=0.
$$
よって非対角成分は0、対角成分は $\det M(t)$ であり
$$
M(t)\operatorname{adj}(M(t))=\det(M(t))I.
$$
$\square$
<!-- proof-end -->'''

          s = sub_once(
              s,
              r'<a id="lem-la4-adjugate-identity"></a>.*?<!-- proof-end -->',
              la4_adjugate,
              'LA4 polynomial adjugate identity',
              flags=re.S,
          )

          old_ch = r'''上の[余因子行列の恒等式](#lem-la4-adjugate-identity)は、成分が多項式でも同じLaplace展開で成り立つので $M=tI-A$ に使えます。

そこで多項式行列 $tI-A$ に補題を適用すると
$$
(tI-A)\operatorname{adj}(tI-A)=\det(tI-A)I=\chi_A(t)I.
$$'''
          new_ch = r'''ここで必要な余因子恒等式は、スカラー行列の結果を記号的に流用するのではなく、直前の[多項式行列の余因子行列の恒等式](#lem-la4-adjugate-identity)として $\mathbb F[t]$ 上で証明済みです。これを $M(t)=tI-A$ に適用すると
$$
(tI-A)\operatorname{adj}(tI-A)=\det(tI-A)I=\chi_A(t)I.
$$'''
          s = replace_once(s, old_ch, new_ch, 'LA4 Cayley-Hamilton polynomial-ring bridge')

          s = replace_once(
              s,
              'は次数高々 $r-1$ なのに $r$ 個の相異なる点 $\\lambda_1,\\dots,\\lambda_r$ で0になるため、恒等的に0です。',
              'は次数高々 $r-1$ なのに $r$ 個の相異なる点 $\\lambda_1,\\dots,\\lambda_r$ で0になります。[非零多項式の根の個数](#lem-la4-polynomial-root-bound)から、この多項式は恒等的に0です。',
              'LA4 diagonalization root bound citation',
          )

          distinct_power_lemma = r'''
<a id="lem-la4-distinct-linear-powers-coprime"></a>
<!-- formal-statement-start -->
> **補題（相異なる一次因子の冪は互いに素）**  
> $\lambda\ne\mu$、$r,s\ge1$ なら
$$
(t-\lambda)^r
\quad\text{と}\quad
(t-\mu)^s
$$
> は互いに素である。
<!-- formal-statement-end -->

<!-- proof-start -->
### 証明

まず
$$
\frac{1}{\mu-\lambda}(t-\lambda)
-
\frac{1}{\mu-\lambda}(t-\mu)
=1
$$
です。両辺を $r+s-1$ 乗します。左辺を二項展開すると、各項は
$$
(t-\lambda)^k(t-\mu)^{r+s-1-k}
$$
の定数倍です。$k\ge r$ なら $(t-\lambda)^r$ で割り切れ、$k<r$ なら
$$
r+s-1-k\ge s
$$
なので $(t-\mu)^s$ で割り切れます。従って展開した全項を二群にまとめると、ある多項式 $a,b$ が存在して
$$
a(t)(t-\lambda)^r+b(t)(t-\mu)^s=1.
$$
Bézout等式が得られたので二つの冪は互いに素です。$\square$
<!-- proof-end -->
'''

          s = replace_once(
              s,
              '\n<a id="lem-la4-coprime-product-divisibility"></a>',
              distinct_power_lemma + '\n<a id="lem-la4-coprime-product-divisibility"></a>',
              'LA4 distinct linear powers coprime lemma insertion',
          )

          old_product_step = r'''次にこの2因子の場合を繰り返します。$f_1,\dots,f_r$ が2つずつ互いに素なら、積 $f_1\cdots f_{j-1}$ と $f_j$ も互いに素です。実際、両者に共通する既約因子があれば、その因子は $f_j$ といずれかの $f_i$（$i<j$）の共通因子になり、仮定に反します。従って
$$
f_1f_2\mid h,
$$
次に
$$
f_1f_2f_3\mid h,
$$
と順に進め、最後に
$$
f_1\cdots f_r\mid h
$$
を得ます。$\square$'''
          new_product_step = r'''次に積と次の因子が互いに素であることを、既約分解を仮定せずBézout等式から作ります。固定した $j\ge2$ について、各 $i<j$ で $f_i$ と $f_j$ は互いに素なので
$$
a_i(t)f_i(t)+b_i(t)f_j(t)=1
$$
と書けます。これらを $i=1,\dots,j-1$ について掛け合わせます。積を展開したとき、$f_j$ を一度も選ばない項は
$$
\left(\prod_{i<j}a_i\right)
\left(\prod_{i<j}f_i\right)
$$
だけで、それ以外の全項は $f_j$ を因子に持ちます。従ってある多項式 $A,B$ が存在して
$$
A(t)\prod_{i<j}f_i(t)+B(t)f_j(t)=1.
$$
よって $\prod_{i<j}f_i$ と $f_j$ は互いに素です。

これで先ほど示した2因子の場合を
$$
f_1,f_2;
\quad f_1f_2,f_3;
\quad\dots
$$
と順に適用できます。まず $f_1f_2\mid h$、次に $f_1f_2f_3\mid h$ と進み、最後に
$$
f_1\cdots f_r\mid h
$$
を得ます。$\square$'''
          s = replace_once(s, old_product_step, new_product_step, 'LA4 coprime product constructive proof')

          old_gcd = r'''$q_j$ は $(t-\lambda_j)$ を因子に持たないので
$$
\gcd\bigl(q_j(t),(t-\lambda_j)^N\bigr)=1.
$$'''
          new_gcd = r'''$q_j$ は $k\ne j$ の因子
$$
(t-\lambda_k)^{s_k}
$$
の積です。[相異なる一次因子の冪は互いに素](#lem-la4-distinct-linear-powers-coprime)なので、各因子は $(t-\lambda_j)^N$ と互いに素です。さらに[互いに素な因子の積による整除](#lem-la4-coprime-product-divisibility)の証明中でBézout等式を掛け合わせた構成を使えば、それらの積 $q_j$ も $(t-\lambda_j)^N$ と互いに素です。従って
$$
\gcd\bigl(q_j(t),(t-\lambda_j)^N\bigr)=1.
$$'''
          s = replace_once(s, old_gcd, new_gcd, 'LA4 generalized eigenspace gcd justification')

          s = replace_once(
              s,
              '$p_j$ と $q_j$ は共通因子を持たないので、[多項式のBézout等式](#lem-la4-polynomial-bezout)により多項式 $a_j,b_j$ が存在して',
              '$p_j$ と各 $p_k$（$k\\ne j$）は[相異なる一次因子の冪は互いに素](#lem-la4-distinct-linear-powers-coprime)です。上のBézout等式を掛け合わせる構成から、$p_j$ と $q_j=\\prod_{k\\ne j}p_k$ も互いに素です。従って[多項式のBézout等式](#lem-la4-polynomial-bezout)により多項式 $a_j,b_j$ が存在して',
              'LA4 generalized decomposition p-q coprime justification',
          )

          s = replace_once(
              s,
              '複素数上では特性多項式が必ず一次因子へ分解し、[Cayley–Hamilton定理](#thm-la4-cayley-hamilton)から最小多項式も特性多項式を割るので、全ての有限次元複素作用素にこの分解が使えます。',
              '複素数上では、先に明示した[代数学の基本定理という証明境界](#note-la4-fta-boundary)により特性多項式が一次因子へ分解します。[Cayley–Hamilton定理](#thm-la4-cayley-hamilton)から最小多項式は特性多項式を割るので、最小多項式も一次因子の冪へ分解し、全ての有限次元複素作用素にこの分解が使えます。',
              'LA4 generalized decomposition FTA boundary',
          )

          s = replace_once(
              s,
              '複素数上では特性多項式が一次因子へ分解するので、[一般化固有空間分解](#thm-la4-generalized-decomposition)により',
              '複素数上では[代数学の基本定理という証明境界](#note-la4-fta-boundary)により特性多項式が一次因子へ分解し、Cayley–Hamiltonから最小多項式も一次因子の冪へ分解します。従って[一般化固有空間分解](#thm-la4-generalized-decomposition)により',
              'LA4 Jordan FTA boundary',
          )

          exercise_a05 = r'''
<a id="ex-la4-a05"></a>
#### LA4-A05 固有値と特性多項式の根
- Level: A

実行列
$$
A=\begin{pmatrix}0&-1\\1&0\end{pmatrix}
$$
を、まず $\mathbb R$ 上、次に $\mathbb C$ 上の線形写像とみなす。それぞれの固有値を特性多項式から求めよ。

<!-- solution-start -->
**解答**：多項式行列の行列式から
$$
\chi_A(t)
=\det\begin{pmatrix}t&1\\-1&t\end{pmatrix}
=t^2+1.
$$
[固有値と特性多項式の根](#thm-la4-eigenvalue-characteristic-root)により、固有値はスカラー体の中にある $t^2+1$ の根とちょうど一致します。

$\mathbb R$ では $t^2+1>0$ なので根がなく、実固有値はありません。$\mathbb C$ では
$$
t^2+1=(t-i)(t+i)
$$
なので固有値は
$$
i,\ -i
$$
です。同じ行列でもスカラー体によって「特性多項式がどこまで分解するか」が変わることを確認できます。
<!-- solution-end -->
'''
          s = replace_once(s, '\n### Level B\n', exercise_a05 + '\n### Level B\n', 'LA4 eigenvalue-root exercise')

          path.write_text(s, encoding='utf-8')

          # ---------- LA5 ----------
          path = Path('textbook/volumes/00_foundations/LA5/index.md')
          s = path.read_text(encoding='utf-8')

          old_bridge = '[F0-00E1](../F0_00E1_内積_Gram_Schmidt_射影_QR/index.md) で実数の場合に確認したCauchy–Schwarz不等式・Gram–Schmidt・直交射影は、共役を正しく入れれば複素内積空間にも拡張できます。'
          new_bridge = r'''実数版で使ったGram–Schmidtを「共役を正しく入れれば同じ」と済ませると、この後の随伴の存在証明が未証明の正規直交基底を先取りします。そこで複素版をここで構成します。

<a id="thm-la5-complex-gram-schmidt"></a>
<!-- formal-statement-start -->
> **定理（複素Gram–Schmidt直交化）**  
> 複素内積空間の一次独立なベクトル $v_1,\dots,v_k$ に対し、正規直交系 $q_1,\dots,q_k$ を構成でき、各 $m=1,\dots,k$ で
$$
\operatorname{span}(q_1,\dots,q_m)
=
\operatorname{span}(v_1,\dots,v_m)
$$
> が成り立つ。
<!-- formal-statement-end -->

<!-- proof-start -->
### 証明

まず
$$
z_1=v_1,
\qquad
q_1=\frac{z_1}{\|z_1\|}
$$
とします。$v_1\ne0$ なので定義できます。

$q_1,\dots,q_{m-1}$ まで構成できたとして
$$
z_m
=v_m-\sum_{j=1}^{m-1}\langle q_j,v_m\rangle q_j
$$
と置きます。ここで係数が $\langle q_j,v_m\rangle$ であるのは、この章の規約で内積が第2変数について線形だからです。

まず $z_m\ne0$ を確認します。もし $z_m=0$ なら
$$
v_m
=\sum_{j=1}^{m-1}\langle q_j,v_m\rangle q_j.
$$
帰納法の仮定で各 $q_j$ は $\operatorname{span}(v_1,\dots,v_{m-1})$ に属するので、$v_m$ もそこに入り、$v_1,\dots,v_m$ の一次独立性に反します。従って
$$
q_m=\frac{z_m}{\|z_m\|}
$$
と定義できます。

$i<m$ に対して
$$
\begin{aligned}
\langle q_i,z_m\rangle
&=\langle q_i,v_m\rangle
-\sum_{j=1}^{m-1}\langle q_j,v_m\rangle\langle q_i,q_j\rangle\\
&=\langle q_i,v_m\rangle
-\langle q_i,v_m\rangle\\
&=0.
\end{aligned}
$$
従って $q_m$ はそれ以前の全ての $q_i$ と直交し、定義から $\|q_m\|=1$ です。

最後に張る空間を確認します。$z_m$ の定義から
$$
q_m\in\operatorname{span}(v_1,\dots,v_m),
$$
一方
$$
v_m=z_m+\sum_{j=1}^{m-1}\langle q_j,v_m\rangle q_j
$$
なので
$$
v_m\in\operatorname{span}(q_1,\dots,q_m).
$$
帰納法の仮定と合わせて両方のspanが一致します。これを $m=1,\dots,k$ まで繰り返せば結論を得ます。$\square$
<!-- proof-end -->

<a id="thm-la5-orthonormal-extension"></a>
<!-- formal-statement-start -->
> **系（正規直交基底の存在と正規直交系の延長）**  
> 有限次元複素内積空間は正規直交基底を持つ。また任意の有限正規直交系は、空間全体の正規直交基底へ延長できる。
<!-- formal-statement-end -->

<!-- proof-start -->
### 証明

任意の基底に[複素Gram–Schmidt直交化](#thm-la5-complex-gram-schmidt)を適用すれば正規直交基底を得ます。

次に正規直交系 $q_1,\dots,q_r$ が与えられたとします。一次独立なので、これを通常の線形代数の基底延長により
$$
q_1,\dots,q_r,w_{r+1},\dots,w_n
$$
という基底へ延長できます。この基底へGram–Schmidtを先頭から適用すると、最初の $r$ 本は既に正規直交なので各段階で
$$
z_j=q_j,
\qquad \|q_j\|=1
$$
となって変化しません。残りだけが直交化されるため、元の正規直交系を保ったまま正規直交基底へ延長できます。$\square$
<!-- proof-end -->'''
          s = replace_once(s, old_bridge, new_bridge, 'LA5 complex Gram-Schmidt before adjoint')

          old_adjoint_open = r'''正規直交基底を取り、ベクトルを座標列 $x,y$ で表します。$T$ の表現行列を $A$ とすると
$$
\begin{aligned}
\langle Tx,y\rangle
&=\langle Ax,y\rangle\\
&=(Ax)^*y\\
&=x^*A^*y\\
&=\langle x,A^*y\rangle.
\end{aligned}
$$'''
          new_adjoint_open = r'''[正規直交基底の存在](#thm-la5-orthonormal-extension)により正規直交基底 $q_1,\dots,q_n$ を取れます。ベクトルを
$$
x=\sum_i x_iq_i,
\qquad
y=\sum_j y_jq_j
$$
と書くと、共役線形性・線形性と $\langle q_i,q_j\rangle=\delta_{ij}$ から
$$
\begin{aligned}
\langle x,y\rangle
&=\sum_{i,j}\overline{x_i}y_j\langle q_i,q_j\rangle\\
&=\sum_i\overline{x_i}y_i\\
&=x^*y.
\end{aligned}
$$
従って正規直交基底では抽象内積が標準座標内積になることまで確認できました。

$T$ の表現行列を $A$ とすると
$$
\begin{aligned}
\langle Tx,y\rangle
&=(Ax)^*y\\
&=x^*A^*y\\
&=\langle x,A^*y\rangle.
\end{aligned}
$$'''
          s = replace_once(s, old_adjoint_open, new_adjoint_open, 'LA5 adjoint coordinate inner product')

          schur_prefix = r'''$n\ge2$ とします。[LA4で明示した代数学の基本定理という証明境界](../LA4/index.md#note-la4-fta-boundary)により、$n$ 次の特性多項式 $\chi_T$ は複素数の根 $\lambda$ を持ちます。[固有値と特性多項式の根](../LA4/index.md#thm-la4-eigenvalue-characteristic-root)から $\lambda$ は $T$ の固有値です。従って非零固有ベクトル $v$ が存在し、
$$
q_1=\frac{v}{\|v\|}
$$
と正規化すれば単位固有ベクトルになります。

[正規直交系の延長](#thm-la5-orthonormal-extension)を $q_1$ に適用し
$$
q_1,q_2,\dots,q_n
$$
という正規直交基底を取ります。複素Gram–Schmidtの係数・非零性・直交性はこの章の前半で既に証明済みなので、ここではその定理を依存先として使います。'''
          s = sub_once(
              s,
              r'\$n\\ge2\$ とします。複素数上では特性多項式が一次因子を持つので、\$T\$ は固有値.*?複素内積で必要な係数が \$\\langle q_j,w_k\\rangle\$ であることも、この直交性計算から分かります。',
              schur_prefix,
              'LA5 Schur FTA/eigenvalue/Gram-Schmidt dependencies',
              flags=re.S,
          )

          path.write_text(s, encoding='utf-8')

          # ---------- LA6 ----------
          path = Path('textbook/volumes/00_foundations/LA6/index.md')
          s = path.read_text(encoding='utf-8')

          s = replace_once(
              s,
              '正の固有値を $\\lambda_1,\\dots,\\lambda_p$、負の固有値を $\\lambda_{p+1},\\dots,\\lambda_{p+q}$、残りを0とします。',
              '正の固有値を $\\lambda_1,\\dots,\\lambda_p$、負の固有値を $\\lambda_{p+1},\\dots,\\lambda_{p+q}$ とし、零固有値の個数を $r=n-p-q$ とします。',
              'LA6 inertia r definition',
          )

          old_polar_basis = r'''$\operatorname{Im}P$ の正規直交基底 $p_1,\dots,p_r$ を取ると、内積保存性から
$$
U_0p_1,\dots,U_0p_r
$$
は $\operatorname{Im}A$ の正規直交基底です。さらに
$$
p_{r+1},\dots,p_n
$$
を $(\operatorname{Im}P)^\perp$ の正規直交基底、
$$
a_{r+1},\dots,a_n
$$
を $(\operatorname{Im}A)^\perp$ の正規直交基底とします。'''
          new_polar_basis = r'''$\operatorname{Im}P$ の正規直交基底 $p_1,\dots,p_r$ を取ると、内積保存性から
$$
U_0p_1,\dots,U_0p_r
$$
は $\operatorname{Im}A$ の正規直交基底です。また内積保存性から $U_0y=0$ なら
$$
\|y\|=\|U_0y\|=0
$$
なので $y=0$、従って $U_0$ は単射でもあります。

LA5の[正規直交系の延長](../LA5/index.md#thm-la5-orthonormal-extension)を使って
$$
p_1,\dots,p_r,p_{r+1},\dots,p_n
$$
を全空間の正規直交基底へ延長します。このとき追加した
$$
p_{r+1},\dots,p_n
$$
は最初の $p_1,\dots,p_r$ の全てに直交するので $(\operatorname{Im}P)^\perp$ の正規直交基底です。同様に
$$
U_0p_1,\dots,U_0p_r,a_{r+1},\dots,a_n
$$
を全空間の正規直交基底へ延長すれば、追加した
$$
a_{r+1},\dots,a_n
$$
は $(\operatorname{Im}A)^\perp$ の正規直交基底です。'''
          s = replace_once(s, old_polar_basis, new_polar_basis, 'LA6 polar orthonormal extension dependency')

          # The source accidentally defined Greek nu_i while every subsequent formula used u_i.
          nu_count = s.count(r'\nu_i')
          if nu_count != 3:
              raise RuntimeError(f'LA6 expected 3 literal \\nu_i occurrences, got {nu_count}')
          s = s.replace(r'\nu_i', 'u_i')

          s = replace_once(
              s,
              'これを正規直交基底\n$$\nu_1,\\dots,u_r,u_{r+1},\\dots,u_m\n$$\nへ延長します。',
              'これをLA5の[正規直交系の延長](../LA5/index.md#thm-la5-orthonormal-extension)により正規直交基底\n$$\nu_1,\\dots,u_r,u_{r+1},\\dots,u_m\n$$\nへ延長します。',
              'LA6 SVD orthonormal extension citation',
          )

          path.write_text(s, encoding='utf-8')
          PY

