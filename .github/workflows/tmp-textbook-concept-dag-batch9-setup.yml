name: Apply textbook concept DAG batch9 setup

on:
  push:
    branches:
      - audit/textbook-concept-dag-batch9-i303-tests
    paths:
      - .github/workflows/tmp-textbook-concept-dag-batch9-setup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/textbook-concept-dag-batch9-i303-tests
          fetch-depth: 0
      - name: Apply Batch 9 registration
        run: python3 scripts/tmp_textbook_concept_dag_batch9_setup.py
      - name: Commit Batch 9 concepts
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook/knowledge-dag.yaml
          git diff --cached --check
          git commit -m 'Register Batch 9 I3-03 testing concepts'
          git push origin HEAD:audit/textbook-concept-dag-batch9-i303-tests
