name: Repair statistical-mathematics control-character corruption

on:
  push:
    branches:
      - fix/ci-katex-20260825
    paths:
      - '.github/workflows/repair-mathstat-formfeed.yml'
      - 'statistical-mathematics/**'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/ci-katex-20260825

      - name: Repair known control-character damage
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('statistical-mathematics')
          repaired_frac = 0
          touched = []

          for path in root.rglob('*.md'):
              with path.open('r', encoding='utf-8', newline='') as f:
                  text = f.read()
              count = text.count('\x0crac')
              if not count:
                  continue
              fixed = text.replace('\x0crac', '\\frac')
              with path.open('w', encoding='utf-8', newline='') as f:
                  f.write(fixed)
              repaired_frac += count
              touched.append((str(path), count))

          rho_path = root / '05_regression_linear_models' / 'syllabus_gap_predicted_01_07.md'
          with rho_path.open('r', encoding='utf-8', newline='') as f:
              rho_text = f.read()
          broken_rho = r'&=\mu+' + '\n' + r'ho(E[X\mid X>c]-\mu).'
          fixed_rho = r'&=\mu+\rho(E[X\mid X>c]-\mu).'
          repaired_rho = rho_text.count(broken_rho)
          if repaired_rho:
              with rho_path.open('w', encoding='utf-8', newline='') as f:
                  f.write(rho_text.replace(broken_rho, fixed_rho))

          print(f'Repaired {repaired_frac} corrupted \\frac command(s).')
          for path, count in touched:
              print(f'  {path}: {count}')
          print(f'Repaired {repaired_rho} corrupted \\rho command(s).')

          remaining = []
          for path in root.rglob('*.md'):
              with path.open('r', encoding='utf-8', newline='') as f:
                  text = f.read()
              bad = [ch for ch in text if (ord(ch) < 32 and ch not in '\t\n\r') or ord(ch) == 127]
              if bad:
                  remaining.append(str(path))
          if remaining:
              raise SystemExit('Unexpected control character remains in: ' + ', '.join(remaining))
          PY

      - name: Commit repairs
        run: |
          if git diff --quiet -- statistical-mathematics; then
            echo 'No repair needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add statistical-mathematics
          git commit -m 'fix: repair remaining math control-character damage'
          git push origin HEAD:fix/ci-katex-20260825
