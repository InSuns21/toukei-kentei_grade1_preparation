name: Temporary MT5 Pages and acronym fix

on:
  push:
    branches:
      - codex/mt5-radon-riesz-markov

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mt5-radon-riesz-markov
          fetch-depth: 0
      - name: Fix MT4 acronym first use and inline TOP5 LCH supplement for Pages
        run: |
          python - <<'PY'
          from pathlib import Path

          mt4 = Path('textbook/volumes/00_foundations/MT4/index.md')
          s = mt4.read_text(encoding='utf-8')
          pairs = [
              (
                  'と置きます。$M,R\\to\\infty$ とすれば $f_{M,R}\\to f$ a.e. で、',
                  'と置きます。$M,R\\to\\infty$ とすれば $f_{M,R}\\to f$ ほとんど至る所（almost everywhere; a.e.）で、',
              ),
              (
                  'です。[DCT](../F0_00D2B_単調収束_Fatou_優収束/index.md#thm-f0-00d2b-01) により十分大きい $M,R$ で',
                  'です。[優収束定理（Dominated Convergence Theorem; DCT）](../F0_00D2B_単調収束_Fatou_優収束/index.md#thm-f0-00d2b-01) により十分大きい $M,R$ で',
              ),
              (
                  '有限部分和を増やして MCT（測度の下からの連続性）を使えば',
                  '有限部分和を増やし、測度の下からの連続性を使えば',
              ),
          ]
          for old, new in pairs:
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'MT4 expected one occurrence, got {n}: {old!r}')
              s = s.replace(old, new, 1)
          mt4.write_text(s, encoding='utf-8')

          script = Path('scripts/prepare-pages-textbook-single-page.mjs')
          p = script.read_text(encoding='utf-8')
          const_old = "const matrixDifferentiationAppendixName = 'matrix_differentiation_calculation.md';\n"
          const_new = const_old + "const top5LchCutoffAppendixName = 'lch-cutoff.md';\n"
          if p.count(const_old) != 1 or top5LchCutoffAppendixName in p:
              raise SystemExit('unexpected Pages script constant state')
          p = p.replace(const_old, const_new, 1)

          marker = "      const calculationDrillPath = path.join(sourceChapter, calculationDrillAppendixName);\n"
          insert = """      const top5LchCutoffPath = path.join(sourceChapter, top5LchCutoffAppendixName);
      if (chapter.name === 'TOP5' && fs.existsSync(top5LchCutoffPath)) {
        const appendix = demoteHeadings(fs.readFileSync(top5LchCutoffPath, 'utf8'), 1).trim();
        text = `${text.trimEnd()}\n\n---\n\n${appendix}\n`;
        inlinedAppendices += 1;
      }

"""
          if p.count(marker) != 1:
              raise SystemExit(f'expected one Pages insertion marker, got {p.count(marker)}')
          p = p.replace(marker, insert + marker, 1)
          script.write_text(p, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook/volumes/00_foundations/MT4/index.md scripts/prepare-pages-textbook-single-page.mjs
          git commit -m 'fix(MT5): repair Pages supplement and acronym first use'
          git push origin HEAD:codex/mt5-radon-riesz-markov
