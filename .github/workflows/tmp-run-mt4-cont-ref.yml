name: Temporary MT4 continuity reference fix

on:
  push:
    branches:
      - codex/mt5-radon-riesz-markov

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mt5-radon-riesz-markov
          fetch-depth: 0
      - run: python .github/tmp/fix_mt4_continuity_ref.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook/volumes/00_foundations/MT4/index.md
          git commit -m 'fix(MT4): link continuity from below'
          git push origin HEAD:codex/mt5-radon-riesz-markov
