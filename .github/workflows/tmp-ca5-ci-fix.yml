name: Temporary CA5 audit fix

on:
  push:
    branches:
      - codex/ca5-winding-monodromy

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/ca5-winding-monodromy
          fetch-depth: 0
      - name: Apply exact audit fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('textbook/volumes/00_foundations/CA5/index.md')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('面のindexによる境界chain', '面のindexによる境界分解'),
              ('[CA4 の留数・単純閉曲線版留数定理・対数微分](../CA4/index.md)', '[CA4 の留数](../CA4/index.md#def-ca4-residue)・[単純閉曲線版留数定理](../CA4/index.md#thm-ca4-residue)・[対数微分](../CA4/index.md#lem-ca4-log-derivative-residue)'),
              ('### 定理（winding number の整数値性・局所定数性）', '### 定理（winding numberの整数値性・局所定数性）'),
              ('### 系（winding number のホモトピー不変性）', '### 系（winding numberのホモトピー不変性）'),
              ('### 定義（領域内で null-homologous な閉曲線）', '### 定義（null-homologousな閉曲線）'),
              ('### 補題（非零 index の支持は $\\Omega$ 内でコンパクト）', '### 補題（非零indexの支持のコンパクト性）'),
              ('向き付き1-chainとして', '向き付き辺の形式和として'),
              ('1-chainとして等しい', '向き付き辺の形式和として等しい'),
              ('三角形版 Cauchy–Goursat により', '[三角形版 Cauchy–Goursat](../CA2/index.md#thm-ca2-goursat-triangle) により'),
              ('だから恒等定理により共通部分全体で一致し', 'だから [恒等定理](../CA3/index.md#thm-ca3-isolated-zeros-identity) により共通部分全体で一致し'),
              ('だから、恒等定理により共通部分全体で0', 'だから、[恒等定理](../CA3/index.md#thm-ca3-isolated-zeros-identity) により共通部分全体で0'),
              ('一般留数定理から', '[index付き留数公式](#thm-ca5-general-residue) から'),
              ('CA2 の正則線積分のホモトピー不変性から', '[正則線積分のホモトピー不変性](../CA2/index.md#thm-ca2-homotopy-invariance) から'),
              ('従って一般偏角原理から', '従って [index付き偏角公式](#thm-ca5-general-argument-principle) から'),
              ('解析接続し、monodromy theorem から $e^{L}=f$', '解析接続し、[monodromy theorem](#thm-ca5-monodromy) から $e^{L}=f$'),
              ('monodromy theorem と矛盾しない理由', '[monodromy theorem](#thm-ca5-monodromy) と矛盾しない理由'),
              ('ため monodromy theorem の仮定を満たさない', 'ため [monodromy theorem](#thm-ca5-monodromy) の仮定を満たさない'),
          ]
          for old, new in replacements:
              if old not in s:
                  print(f'warning: replacement source not found: {old}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          # Remove this one-shot workflow in the same generated commit.
          Path('.github/workflows/tmp-ca5-ci-fix.yml').unlink()
          PY
      - name: Commit fixes and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add textbook/volumes/00_foundations/CA5/index.md .github/workflows/tmp-ca5-ci-fix.yml
          git commit -m "Fix CA5 audit references and concept introductions"
          git push origin HEAD:codex/ca5-winding-monodromy
