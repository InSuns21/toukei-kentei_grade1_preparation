name: Apply syllabus Batch 1

on:
  push:
    branches:
      - audit/syllabus-term-coverage-batch1
    paths:
      - 'scripts/apply-syllabus-batch1.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: audit/syllabus-term-coverage-batch1
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply syllabus Batch 1 edits
        run: node scripts/apply-syllabus-batch1.mjs

      - name: Commit generated textbook edits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet; then
            git add textbook
            git commit -m 'Fill official syllabus Batch 1 textbook gaps'
            git push origin HEAD:audit/syllabus-term-coverage-batch1
          fi
