name: Cleanup F0 front granularity

on:
  push:
    branches:
      - feat/f0-batch2-lebesgue-integration-foundations
    paths:
      - '.github/workflows/cleanup-f0-front-granularity.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f0-batch2-lebesgue-integration-foundations
      - name: Normalize front split numbering and links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('textbook/volumes/00_foundations')

          def renumber(path, mapping):
              p = Path(path)
              s = p.read_text()
              # Remap both top-level headings (## 15.) and nested headings (### 16.1 etc.).
              for old, new in sorted(mapping.items(), reverse=True):
                  s = re.sub(rf'(?m)^(#+) {old}\.(?=\s)', rf'\1 {new}.', s)
                  s = re.sub(rf'(?m)^(#+) {old}\.(\d+)(?=\s)', rf'\1 {new}.\2', s)
              p.write_text(s)

          b1 = root / 'F0_02B1_SVM_凸包_最大マージン/index.md'
          c1a = root / 'F0_02C1A_Hilbert射影定理_直交分解/index.md'
          renumber(b1, {15:1,16:2,17:3,18:4,19:5,20:6,21:7,22:8})
          renumber(c1a, {11:1,12:2,13:3,14:4,15:5})

          # Compact-image theorem moved from old C to current C1.
          s = b1.read_text()
          s = s.replace(
              '[F0-00C](../F0_00C_連続写像_コンパクト性_最大最小/index.md) の「連続像はコンパクト」',
              '[F0-00C1](../F0_00C1_コンパクト性_点列コンパクト性_Heine_Borel/index.md) の「連続像はコンパクト」'
          )
          # Update the old C1--C7 route wording inside the moved SVM application, if present.
          s = s.replace('C1〜C7', 'C1→C1A→C2→C3→C3A→C4→C4A→C5→C5A→C6→C6A→C7→C7A')
          b1.write_text(s)

          # 02A: Farkas proof stays in 02B; SVM convex-hull geometry moved to 02B1.
          p = root / 'F0_02A_KKT条件の導出_接錐_polar_Farkas/index.md'
          s = p.read_text()
          old = 'さらに [F0-02B](../F0_02B_分離超平面定理_Farkas_SVM/index.md) では、SVMを別の幾何からも見ます。'
          new = 'さらに [F0-02B1](../F0_02B1_SVM_凸包_最大マージン/index.md) では、SVMを別の幾何からも見ます。'
          if old not in s:
              raise SystemExit('02A SVM bridge target missing')
          s = s.replace(old, new)
          old = 'Farkasの補題の証明、分離超平面定理、SVMの凸包・最近点対・最大マージンまでさらに遡る場合は [F0-02B 分離超平面定理・Farkasの補題](../F0_02B_分離超平面定理_Farkas_SVM/index.md) へ進んでください。'
          new = 'Farkasの補題の証明・分離超平面定理まで遡る場合は [F0-02B 分離超平面定理・Farkasの補題](../F0_02B_分離超平面定理_Farkas_SVM/index.md) へ、SVMの凸包・最近点対・最大マージンを見る場合は [F0-02B1 SVM・凸包・最大マージン](../F0_02B1_SVM_凸包_最大マージン/index.md) へ進んでください。'
          if old not in s:
              raise SystemExit('02A final route target missing')
          p.write_text(s.replace(old, new))

          # Facade: replace the entire finite optimization / functional analysis list numbering.
          p = Path('textbook/dream-theater.md')
          s = p.read_text()
          start = s.index('1. [F0-02 制約付き最適化・双対・KKT]')
          end = s.index('\n\n---\n\n### 2. 確率論', start)
          block = '''1. [F0-02 制約付き最適化・双対・KKT](textbook/volumes/00_foundations/F0_02_制約付き最適化_双対_KKT/index.md)
2. [F0-02A KKT条件の導出・接錐・polar・Farkas](textbook/volumes/00_foundations/F0_02A_KKT条件の導出_接錐_polar_Farkas/index.md)
3. [F0-02B 分離超平面定理・Farkas](textbook/volumes/00_foundations/F0_02B_分離超平面定理_Farkas_SVM/index.md)
4. [F0-02B1 SVM・凸包・最大マージン](textbook/volumes/00_foundations/F0_02B1_SVM_凸包_最大マージン/index.md)
5. [F0-02C 関数解析・制約想定・RKHS ロードマップ](textbook/volumes/00_foundations/F0_02C_関数解析_制約想定_RKHS/index.md)
6. [F0-02C1 ノルム空間・Banach・Hilbert](textbook/volumes/00_foundations/F0_02C1_ノルム空間_Banach_Hilbert/index.md)
7. [F0-02C1A Hilbert射影定理・直交分解](textbook/volumes/00_foundations/F0_02C1A_Hilbert射影定理_直交分解/index.md)
8. [F0-02C2 線形汎関数・双対空間・Riesz](textbook/volumes/00_foundations/F0_02C2_線形汎関数_双対空間_Riesz/index.md)
9. [F0-02C3 Fréchet微分・有界作用素・連鎖律](textbook/volumes/00_foundations/F0_02C3_Frechet微分_線形作用素_随伴/index.md)
10. [F0-02C3A 随伴作用素・Banach双対・Hilbert随伴](textbook/volumes/00_foundations/F0_02C3A_随伴作用素_Banach_Hilbert/index.md)
11. [F0-02C4 凸解析・劣勾配・normal cone](textbook/volumes/00_foundations/F0_02C4_凸解析_劣勾配_normal_cone_双対錐/index.md)
12. [F0-02C4A tangent cone・polar cone・dual cone](textbook/volumes/00_foundations/F0_02C4A_tangent_polar_dual_cone/index.md)
13. [F0-02C5 一般化KKT・錐制約・双対乗数](textbook/volumes/00_foundations/F0_02C5_一般化KKT_制約写像_制約想定/index.md)
14. [F0-02C5A 制約想定・LICQ・MFCQ・Robinson CQ](textbook/volumes/00_foundations/F0_02C5A_制約想定_LICQ_MFCQ_Robinson/index.md)
15. [F0-02C6 Hahn–Banach・汎関数拡張](textbook/volumes/00_foundations/F0_02C6_Hahn_Banach_分離定理/index.md)
16. [F0-02C6A 分離定理・Minkowski functional・Farkas](textbook/volumes/00_foundations/F0_02C6A_分離定理_Minkowski_Farkas/index.md)
17. [F0-02C7 RKHS・再生核・Moore–Aronszajn](textbook/volumes/00_foundations/F0_02C7_RKHS_再生核_representer_kernel_SVM/index.md)
18. [F0-02C7A representer theorem・kernel SVM](textbook/volumes/00_foundations/F0_02C7A_representer_kernel_SVM/index.md)'''
          p.write_text(s[:start] + block + s[end:])
          PY
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook
          git diff --cached --quiet && exit 0
          git commit -m 'fix: clean F0-02 front split numbering and links'
          git push
