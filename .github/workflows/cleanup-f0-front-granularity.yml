name: Cleanup F0 front granularity

on:
  push:
    branches:
      - feat/f0-batch2-lebesgue-integration-foundations
    paths:
      - 'scripts/cleanup-f0-front-granularity.py'
      - '.github/workflows/cleanup-f0-front-granularity.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f0-batch2-lebesgue-integration-foundations
      - name: Normalize front split numbering and links
        run: python3 scripts/cleanup-f0-front-granularity.py
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook
          git diff --cached --quiet && exit 0
          git commit -m 'fix: clean F0-02 front split numbering and links'
          git push
