name: Retry one-shot MT6 registry update

on:
  push:
    branches:
      - codex/mt6-c0-riesz-markov
    paths:
      - .github/workflows/retry-register-mt6-once.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mt6-c0-riesz-markov
          fetch-depth: 0
      - name: Execute corrected updater
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          p = Path('.github/workflows/register-mt6-once.yml')
          text = p.read_text(encoding='utf-8')
          code = text.split("python - <<'PY'\n", 1)[1].split('\n          PY', 1)[0]
          code = textwrap.dedent(code).replace('              count=2\n', '              count=1\n')
          exec(compile(code, '<mt6-registry-updater>', 'exec'))
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/register-mt6-once.yml .github/workflows/retry-register-mt6-once.yml
          git add textbook
          git diff --cached --check
          git commit -m "feat: register MT6 in standard math core"
          git push origin HEAD:codex/mt6-c0-riesz-markov
