name: Add MT6 manifest entry once

on:
  push:
    branches:
      - codex/mt6-c0-riesz-markov
    paths:
      - .github/workflows/add-mt6-manifest-once.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mt6-c0-riesz-markov
      - name: Add MT6 to facade manifest
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('textbook/dream-theater-index.json')
          s = p.read_text(encoding='utf-8')
          old = '        "textbook/volumes/00_foundations/MT5/index.md",\n        "textbook/volumes/00_foundations/MT-RL/index.md",'
          new = '        "textbook/volumes/00_foundations/MT5/index.md",\n        "textbook/volumes/00_foundations/MT6/index.md",\n        "textbook/volumes/00_foundations/MT-RL/index.md",'
          if s.count(old) != 1:
              raise SystemExit(f'expected one MT5->MT-RL manifest adjacency, got {s.count(old)}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/add-mt6-manifest-once.yml
          git add textbook/dream-theater-index.json
          git diff --cached --check
          git commit -m "fix: register MT6 in DREAM THEATER manifest"
          git push origin HEAD:codex/mt6-c0-riesz-markov
