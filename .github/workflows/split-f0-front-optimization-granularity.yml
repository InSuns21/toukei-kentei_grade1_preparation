name: Split F0 front optimization granularity

on:
  push:
    branches:
      - feat/f0-batch2-lebesgue-integration-foundations
    paths:
      - 'scripts/split-f0-front-optimization-granularity.py'
      - '.github/workflows/split-f0-front-optimization-granularity.yml'

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f0-batch2-lebesgue-integration-foundations
      - name: Allow exercise append on pages without chapter-check heading
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/split-f0-front-optimization-granularity.py')
          s = p.read_text()
          old = """    if marker not in s:\n        raise SystemExit(f'missing chapter check: {path}')\n    s = s.replace(marker, '\\n---\\n\\n' + exercise.strip() + marker, 1)\n    write(path, s)\n"""
          new = """    if marker not in s:\n        s = s.rstrip() + '\\n\\n---\\n\\n' + exercise.strip() + '\\n'\n    else:\n        s = s.replace(marker, '\\n---\\n\\n' + exercise.strip() + marker, 1)\n    write(path, s)\n"""
          if old not in s:
              raise SystemExit('exercise helper patch target missing')
          p.write_text(s.replace(old, new))
          PY
      - name: Split front optimization lectures and synchronize routes
        run: python3 scripts/split-f0-front-optimization-granularity.py
      - name: Commit split
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: split F0-02B and C1 granularity'
          git push
