name: Temporary batch1 display-math repair

on:
  push:
    branches:
      - refactor/retire-implicit-formals-batch1
    paths:
      - 'scripts/tmp-repair-batch1-display-math.mjs'
      - '.github/workflows/tmp-repair-batch1-display-math.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/retire-implicit-formals-batch1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/tmp-repair-batch1-display-math.mjs
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add textbook/volumes/00_foundations/F0_00F_線形写像_固有空間_スペクトル定理_SVD/index.md textbook/volumes/05_engineering/E2_01_markov連鎖/index.md
          git commit -m 'repair formal statement display math delimiters'
          git push
      - run: npm ci
      - run: npm run validate
      - run: npm run validate:pages
