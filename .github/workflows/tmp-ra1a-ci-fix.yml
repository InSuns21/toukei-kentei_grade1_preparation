name: Temporary RA1A CI fix
on:
  push:
    branches: [feat/ra1a-series-convergence]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ra1a-series-convergence
          fetch-depth: 0
      - name: Fix formal references and concept aliases
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('textbook/volumes/00_foundations/RA1A/index.md')
          s = p.read_text()
          replacements = {
              'Leibnizの交代級数判定から級数は収束します。': '[Leibnizの交代級数判定](#thm-ra1a-leibniz)から級数は収束します。',
              'Cauchy凝縮判定を使うと': '[Cauchy凝縮判定](#thm-ra1a-condensation)を使うと',
              'したがって級数のDirichlet判定から': 'したがって[級数のDirichlet判定](#thm-ra1a-dirichlet)から',
              '正部分と負部分を': '正側・負側の非負列を',
          }
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new, 1)
              elif new not in s:
                  raise SystemExit(f'missing RA1A pattern: {old}')
          p.write_text(s)

          p = Path('textbook/volumes/00_foundations/RA1A/knowledge.yaml')
          s = p.read_text()
          marker = '  - analysis.uniform-convergence\n'
          new_marker = marker + '  - analysis.uniform-continuity\n'
          if '  - analysis.uniform-continuity\n' not in s:
              if marker not in s:
                  raise SystemExit('uniform-convergence forward reference missing')
              s = s.replace(marker, new_marker, 1)
          p.write_text(s)
          PY

          rm .github/workflows/tmp-ra1a-ci-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'RA1A: fix formal links and forward references'
            git push origin HEAD:feat/ra1a-series-convergence
          fi
