name: Temporary P3-03 reader terminology cleanup

on:
  push:
    paths:
      - '.github/workflows/_tmp-p303-reader-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Remove nonessential advanced terminology
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('textbook/volumes/02_distributions/P3_03_多変量分布_条件付き分布/index.md')
          s = p.read_text()
          s = s.replace('topics: 多変量正規分布, 条件付き分布, Schur補', 'topics: 多変量正規分布, 条件付き分布')
          s = s.replace('に従い、全分散共分散行列は正定値とする。従って $\\Sigma_{22}$ は可逆である。条件付き正規公式そのものを導出する問題なので、公式は使用せず以下を示せ。', 'に従い、$\\Sigma_{22}$ の逆行列が存在するものとする。条件付き正規公式そのものを導出する問題なので、公式は使用せず以下を示せ。')
          s = s.replace('$\\operatorname{Cov}(\\boldsymbol R)$ がSchur補 $\\Sigma_{1\\mid2}$ であることを示せ。', '$\\operatorname{Cov}(\\boldsymbol R)=\\Sigma_{11}-\\Sigma_{12}\\Sigma_{22}^{-1}\\Sigma_{21}$ を示せ。')
          s = s.replace('25分でSchur補まで完成しなければ', '25分で条件付き分散共分散行列まで完成しなければ')
          s = s.replace('答案確認: 条件付き平均の係数、Schur補分散、独立と無相関を区別する。', '答案確認: 条件付き平均の係数、条件付き分散、独立と無相関を区別する。')
          s = s.replace('$N_2(\\boldsymbol\\mu,\\boldsymbol\\Sigma)$は、平均$\\boldsymbol\\mu\\in\\mathbb R^2$、正定値な分散共分散行列$\\boldsymbol\\Sigma$をもつ二変量正規分布を表す。その密度は', '$N_2(\\boldsymbol\\mu,\\boldsymbol\\Sigma)$は、平均$\\boldsymbol\\mu\\in\\mathbb R^2$、分散共分散行列$\\boldsymbol\\Sigma$をもつ二変量正規分布を表す。この問題では次の密度式を用いてよい。')
          old = '以下の分散共分散行列は、第1主座小行列式が4、第2主座小行列式が$4\\cdot9-2^2=32$でともに正なので正定値である。\n\n'
          s = s.replace(old, '')
          s = s.replace('正定値な二変量正規なので$Q\\sim\\chi_2^2$です。', '多変量正規分布のマハラノビス二次形式の結果より$Q\\sim\\chi_2^2$です。')
          s = s.replace('8. 密度式には共分散の正定値性が必要。', '8. 密度を使う問題では、問題文で与えられた分散共分散行列と密度式を確認する。')
          s = s.replace('=\\Sigma_{1\\mid2}.', '=\\Sigma_{11}-\\Sigma_{12}\\Sigma_{22}^{-1}\\Sigma_{21}.')
          s = s.replace('$\\boldsymbol R\\sim N_p(\\boldsymbol0,\\Sigma_{1\\mid2}).$', '$\\boldsymbol R\\sim N_p(\\boldsymbol0,\\Sigma_{11}-\\Sigma_{12}\\Sigma_{22}^{-1}\\Sigma_{21}).$')
          s = s.replace(',\\Sigma_{1\\mid2}\n\\right).', ',\\Sigma_{11}-\\Sigma_{12}\\Sigma_{22}^{-1}\\Sigma_{21}\n\\right).')
          s = s.replace(',\\Sigma_{1\\mid2}\\right).', ',\\Sigma_{11}-\\Sigma_{12}\\Sigma_{22}^{-1}\\Sigma_{21}\\right).')
          if 'Schur補' in s:
              raise SystemExit('Schur補 remains in P3-03 index')
          if '二乗可積分' in s or '半正定値' in s or '精度行列' in s:
              raise SystemExit('out-of-scope reader terminology remains')
          p.write_text(s)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Validate cleanup
        run: |
          npm run validate
          npm run audit:textbook-granularity
          npm run validate:pages
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook/volumes/02_distributions/P3_03_多変量分布_条件付き分布/index.md
          git diff --cached --check
          git commit -m 'simplify P3-03 advanced terminology'
          git push
      - name: Remove temporary workflow
        run: |
          git pull --ff-only
          rm .github/workflows/_tmp-p303-reader-cleanup.yml
          git add .github/workflows/_tmp-p303-reader-cleanup.yml
          git commit -m 'remove temporary P3-03 reader cleanup workflow'
          git push
