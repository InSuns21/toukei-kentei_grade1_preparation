name: Audit F0-00P5A pedagogy

on:
  pull_request:

jobs:
  audit-f0-00p5a:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate textbook
        run: npm run validate

      - name: Validate Pages
        run: npm run validate:pages

      - name: Validate DREAM THEATER exercise counts
        env:
          DREAM_THEATER_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run validate:dream-theater-exercise-counts

      - name: Audit proof pedagogy
        run: npm run audit:proof-pedagogy

      - name: Audit formalism pedagogy
        run: npm run audit:formalism-pedagogy

      - name: Validate changed DREAM THEATER concepts
        env:
          DREAM_THEATER_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run validate:dream-theater-concepts:changed

      - name: Validate changed textbook knowledge
        run: npm run validate:textbook-knowledge:changed
