name: Enhance CAX1 solution granularity

on:
  push:
    branches:
      - improve-cax1-solution-granularity

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve-cax1-solution-granularity
      - name: Apply CAX1 edits
        run: python3 scripts/tmp_enhance_cax1.py
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add textbook/volumes/00_foundations/F0_00CALC_複素解析_院試編入計算演習/index.md
          git diff --cached --quiet && exit 0
          git commit -m 'Strengthen CAX1 worked-solution derivations'
          git push origin HEAD:improve-cax1-solution-granularity
