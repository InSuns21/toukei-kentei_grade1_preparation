name: Temporary RA4A CI fixes
on:
  push:
    branches: [feat/ra4a-improper-integrals]
    paths: [.github/workflows/tmp-ra4a-ci-fix.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ra4a-improper-integrals
          fetch-depth: 0
      - name: Patch registries, aliases, and text
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Standard-core implementation batch.
          p = Path('textbook/dream-theater-standard-math-core.yaml')
          s = p.read_text(encoding='utf-8')
          old = '    nodes: [RA1, RA2, RA3, RA4, RA5]'
          new = '    nodes: [RA1, RA2, RA3, RA4, RA4A, RA5]'
          if old not in s and new not in s:
              raise SystemExit('real-analysis implementation batch not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # Remove unsafe one-token aliases that collide with ordinary real-analysis prose.
          p = Path('textbook/volumes/00_foundations/CA4/knowledge.yaml')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'aliases: [孤立特異点, isolated singularity, 可除特異点, removable singularity, 極, pole, 真性特異点, essential singularity]',
              'aliases: [孤立特異点, isolated singularity, 可除特異点, removable singularity, pole, 真性特異点, essential singularity]'
          )
          p.write_text(s, encoding='utf-8')

          p = Path('textbook/volumes/00_foundations/CA5/knowledge.yaml')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              'aliases: [winding number, 巻き数, 指数, index of a curve]',
              'aliases: [winding number, 巻き数, index of a curve]'
          )
          p.write_text(s, encoding='utf-8')

          # RA4A prose: avoid the complex-analysis-only "primitive" alias and an undeclared L'Hopital dependency.
          p = Path('textbook/volumes/00_foundations/RA4A/index.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace(
              '$q=1$ では原始関数が $\\log\\log x$ です。したがって',
              '$q=1$ では $\\frac{d}{dx}\\log\\log x=1/(x\\log x)$ です。したがって'
          )
          s = s.replace(
              '**解答**：原始関数は\n$$\n\\frac12\\log(1+x^2)\n$$\nです。したがって',
              '**解答**：\n$$\n\\frac{d}{dx}\\left(\\frac12\\log(1+x^2)\\right)=\\frac{x}{1+x^2}\n$$\nなので、有限区間では'
          )
          s = s.replace(
              '実際、右半直線では原始関数が $+\\infty$ へ発散し、左半直線では $-\\infty$ へ発散します。',
              '実際、右半直線の積分値は $\\frac12\\log(1+B^2)\\to+\\infty$、左半直線の積分値は $-\\frac12\\log(1+A^2)\\to-\\infty$ です。'
          )
          old_note = "なお $\\log x=o(x^\\eta)$ は、例えば $\\log x/x^{\\eta/|q|}\\to0$ をL'Hopitalの定理で確認すれば導けます。"
          new_note = '''なお、ここで使った「対数は任意の正のべきより遅く増える」は既存の微分定理を追加で仮定しなくても確認できます。$t=\\log x$ とし、整数 $N>|q|$ を取ると、指数関数の級数表示から
$$
e^{\\eta t}\\ge\\frac{(\\eta t)^N}{N!}.
$$
したがって
$$
0\\le\\frac{t^{|q|}}{e^{\\eta t}}
\\le\\frac{N!}{\\eta^N}t^{|q|-N}\\to0.
$$
$x=e^t$ に戻せば $(\\log x)^{|q|}=o(x^\\eta)$ が従います。'''
          if old_note in s:
              s = s.replace(old_note, new_note, 1)

          # Repair accidental control characters produced by escaped TeX sequences.
          repaired = []
          controls = []
          for i, ch in enumerate(s):
              o = ord(ch)
              if o < 32 and ch not in ('\n', '\t'):
                  controls.append((i, o, repr(s[max(0,i-12):i+18])))
                  if ch == '\x08':
                      repaired.append('\\b')
                  elif ch == '\x0c':
                      repaired.append('\\f')
                  elif ch == '\x0b':
                      repaired.append('\\v')
                  elif ch == '\r':
                      continue
                  else:
                      raise SystemExit(f'unknown control U+{o:04X} at {i}')
              else:
                  repaired.append(ch)
          if controls:
              print('Repaired controls:', controls)
          s = ''.join(repaired)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-ra4a-ci-fix.yml
          git add textbook/dream-theater-standard-math-core.yaml \
            textbook/volumes/00_foundations/CA4/knowledge.yaml \
            textbook/volumes/00_foundations/CA5/knowledge.yaml \
            textbook/volumes/00_foundations/RA4A/index.md
          git commit -m "Fix RA4A core registration and alias collisions"
          git push origin HEAD:feat/ra4a-improper-integrals
