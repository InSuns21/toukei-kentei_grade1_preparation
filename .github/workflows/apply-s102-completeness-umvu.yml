name: Apply S1-02 completeness and UMVU expansion

on:
  push:
    branches:
      - feat/textbook-completeness-rao-blackwell-lehmann-scheffe
    paths:
      - .github/workflows/apply-s102-completeness-umvu.yml

permissions:
  contents: write

jobs:
  apply-content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/textbook-completeness-rao-blackwell-lehmann-scheffe
          fetch-depth: 0
      - name: Apply exact content expansion
        run: python3 scripts/tmp_s102_completeness_umvu.py
      - name: Commit generated content
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook
          git diff --cached --check
          git commit -m 'Add completeness Rao-Blackwell and Lehmann-Scheffe to S1-02'
          git push origin HEAD:feat/textbook-completeness-rao-blackwell-lehmann-scheffe
