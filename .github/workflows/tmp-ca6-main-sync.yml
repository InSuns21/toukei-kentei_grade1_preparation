name: Temporary CA6 main sync
on:
  push:
    branches: [codex/ca6-mobius-schwarz-poisson]
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ca6-mobius-schwarz-poisson
          fetch-depth: 0
      - name: Merge current main without changing CA6 content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rm .github/workflows/tmp-ca6-main-sync.yml
          git add -A
          git commit -m "Remove temporary CA6 main sync workflow"
          git merge --no-edit origin/main
          git push origin HEAD:codex/ca6-mobius-schwarz-poisson
