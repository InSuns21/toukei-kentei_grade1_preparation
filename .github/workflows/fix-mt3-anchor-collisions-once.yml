name: One-shot MT3 anchor collision fix

on:
  push:
    branches:
      - codex/mt5-radon-riesz-markov
    paths:
      - .github/workflows/fix-mt3-anchor-collisions-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mt5-radon-riesz-markov
          fetch-depth: 0
      - name: Remove globally dangerous short aliases
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('textbook')

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              n = s.count(old)
              if n != count:
                  raise SystemExit(f'{path}: expected {count}, found {n}: {old!r}')
              p.write_text(s.replace(old, new), encoding='utf-8')

          # The concept scanner sees HTML anchor ids. Rename only MT3 canonical
          # anchors and all textbook links to them, so no bare English collision
          # token is needed as a global knowledge alias.
          replacements = {
              'def-mt3-rn-derivative': 'def-mt3-rn-density',
              'thm-mt3-chain-rule': 'thm-mt3-rn-composition',
          }
          hits = {k: [] for k in replacements}
          for p in root.rglob('*.md'):
              s = p.read_text(encoding='utf-8')
              orig = s
              for old, new in replacements.items():
                  n = s.count(old)
                  if n:
                      hits[old].append((str(p), n))
                      s = s.replace(old, new)
              if s != orig:
                  p.write_text(s, encoding='utf-8')
          for old, entries in hits.items():
              if not entries:
                  raise SystemExit(f'no textbook occurrences found for {old}')
              print(old, entries)

          k = 'textbook/volumes/00_foundations/MT3/knowledge.yaml'
          replace_exact(
              k,
              '    aliases: ["### 定義（Radon–Nikodym 微分）", derivative]',
              '    aliases: ["### 定義（Radon–Nikodym 微分）"]'
          )
          replace_exact(
              k,
              '    name: Radon–Nikodym微分のchain rule',
              '    name: Radon–Nikodym微分の連鎖律'
          )
          replace_exact(
              k,
              '    aliases: [Radon–Nikodym 微分の chain rule, RN微分のchain rule, chain]',
              '    aliases: [Radon–Nikodym 微分の連鎖律, RN微分の連鎖律]'
          )
          replace_exact(
              k,
              '    introduction_aliases: [Radon–Nikodym 微分の chain rule]',
              '    introduction_aliases: [Radon–Nikodym 微分の連鎖律]'
          )
          replace_exact(
              'textbook/volumes/00_foundations/MT3/index.md',
              '### 系（Radon–Nikodym 微分の chain rule）',
              '### 系（Radon–Nikodym 微分の連鎖律）'
          )
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/fix-mt3-anchor-collisions-once.yml
          git add textbook
          git diff --cached --check
          git commit -m "fix: stabilize MT3 RN anchors and aliases"
          git push origin HEAD:codex/mt5-radon-riesz-markov
