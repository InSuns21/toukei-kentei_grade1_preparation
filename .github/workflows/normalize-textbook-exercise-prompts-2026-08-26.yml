name: Normalize textbook exercise prompts

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/normalize-textbook-exercise-prompts-2026-08-26.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Normalize exercise problem statements
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          def replace_in_problem(text, heading, old, new, label):
              start = text.index(heading)
              end = text.index('<!-- solution-start -->', start)
              segment = text[start:end]
              count = segment.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly one match in problem, found {count}')
              segment = segment.replace(old, new, 1)
              return text[:start] + segment + text[end:]

          def replace_in_section(text, heading, replacements, label):
              start = text.index(heading)
              end_marker = '<!-- solution-end -->'
              end = text.index(end_marker, start) + len(end_marker)
              segment = text[start:end]
              for old, new in replacements:
                  if old not in segment:
                      raise RuntimeError(f'{label}: missing section token: {old!r}')
                  segment = segment.replace(old, new)
              return text[:start] + segment + text[end:]

          # ------------------------------------------------------------------
          # 1) Common exercise rules: textbook exercises use the same minimum
          #    problem-statement standard as the Math 100 / Applied 80 sets.
          # ------------------------------------------------------------------
          path = Path('EXERCISE_GUIDELINES.md')
          text = path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '''# 統計数理・統計応用 共通演習規約

このファイルを、次の2問題集に共通する作問・解答・採点・表記規約の**唯一の正本**とする。

- `statistical-mathematics/`
- `applied-rikou-80/`

各ディレクトリの `README.md` は構成・学習順・実装状況だけを扱い、ここに定める規約を別定義しない。規約を変更するときは本ファイルだけを更新し、両問題集の本文を同時に監査する。''',
              '''# 統計数理・統計応用・通常教材 共通演習規約

このファイルを、次の3教材に共通する作問・解答・採点・表記規約の**唯一の正本**とする。

- `textbook/`
- `statistical-mathematics/`
- `applied-rikou-80/`

各教材のローカル規約や `README.md` は構成・学習順・実装状況など教材固有の差分だけを扱い、ここに定める共通規約を別定義しない。規約を変更するときは本ファイルを更新し、3教材の演習本文を同じ観点で監査する。''',
              'exercise-guidelines intro',
          )

          anchor = '''必要に応じて「打ち切り判断」「補足」を追加してよいが、上記4区分の代替にはしない。

'''
          problem_rules = '''必要に応じて「打ち切り判断」「補足」を追加してよいが、上記4区分の代替にはしない。

### 1.1 問題文の最低記載水準

問題文は、**初見の受験者が記号の意味を推測せずに立式を開始できること**を最低条件とする。通常教材の演習も `statistical-mathematics/` の大問で用いる設定記述を最低基準とし、本文の定義・定理だけ丁寧なのに演習へ入ると記号宣言が消える状態を作らない。

- 確率変数・確率ベクトル・統計量・標本・母数は、初出時に「何を表す量か」を文章で宣言する。単に $X$, $Y$, $T$ を置いて意味を読者に推測させない。
- 離散型なら必要に応じて台と確率質量関数、連続型なら台と確率密度関数を明記する。式を使う場合は $p_X(x)=P(X=x)$、$f_X(x)$、$f_{X,Y}(x,y)$ のように記号の意味を先に宣言する。
- 名前付き分布を使う場合は、母数の範囲と本教材での規約が曖昧にならないようにする。幾何分布・負の二項分布・ガンマ分布など流儀が複数ある分布は、何を数えるか・台・shape/rate 等を問題文で再確認する。
- 問題を解くために確率質量関数・確率密度関数などの具体式が必要で、それ自体を導出させる問題でないなら、分布名だけから式を暗記で補わせず問題文付近に与える。
- $q=1-p$、$S=X+Y$、$\overline X$、$I=\boldsymbol{1}_A$ のような補助記号は、使用前に定義する。
- 条件付きモーメントでは、事象 $H_i$ と群ラベル確率変数 $H$ を混同しない。$E[X\mid H=0]$ と書くなら $H$ を確率変数として宣言し、有限分割の事象を使うなら $H_1,\ldots,H_m$ を事象として宣言する。同じ問題内で両記法を無言で混ぜない。
- 独立性、同一分布、有限二次モーメント、正の分散、母数範囲など、後続の定理・公式を使うために必要な仮定は問題文で与える。
- $P$, $E$, $\operatorname{Var}$, $\operatorname{Cov}$ のような標準演算子そのものを毎問定義し直す必要はない。ただし、その中に入る確率変数・分布・条件付け変数・母数の意味は明示する。

たとえば、次のような問題文は避ける。

> $P(X=0)=1/4$, $P(X=1)=1/2$, $P(X=2)=1/4$ のとき $E[X]$, $\operatorname{Var}(X)$ を求めよ。

最低でも次の水準まで設定を宣言する。

> 離散型確率変数 $X$ の台を $\{0,1,2\}$ とし、確率質量関数 $p_X(x)=P(X=x)$ が $p_X(0)=1/4$, $p_X(1)=1/2$, $p_X(2)=1/4$ で与えられるとする。$E[X]$ と $\operatorname{Var}(X)$ を定義から求めよ。

'''
          text = replace_once(text, anchor, problem_rules, 'insert problem statement rules')
          text = text.replace('統計数理・統計応用（理工学）の両方で、統計検定1級の試験条件に合わせる。', '統計数理・統計応用（理工学）・通常教材の演習で、統計検定1級の試験条件に合わせる。')
          text = text.replace('両問題集で同じ観点を使う。', '3教材の演習で同じ観点を使う。')
          review_anchor = '- 問題が要求した式を既知公式として先取りしていないか。\n'
          review_insert = '''- 問題文だけを読んで、確率変数・統計量・母数・補助記号が何を表すか分かるか。
- 台、確率質量関数・確率密度関数、分布規約、独立性など、立式に必要な条件が問題文にあるか。
- 条件付き記法で事象 $H_i$ と群ラベル確率変数 $H$ を無言で混同していないか。
- 問題が要求した式を既知公式として先取りしていないか。
'''
          text = replace_once(text, review_anchor, review_insert, 'review checklist prompt notation')
          path.write_text(text, encoding='utf-8')

          # Textbook-local guide points to the common rule rather than redefining it.
          path = Path('textbook/style-guide.md')
          text = path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '## 統計記述の必須事項\n\n',
              '## 統計記述の必須事項\n\n- 演習問題文は `EXERCISE_GUIDELINES.md` の「問題文の最低記載水準」に従い、統計数理100大問と同等以上の設定・記号導入を行う。本文の定義・定理で宣言した記号規約と演習の記法を一致させる。\n',
              'textbook style prompt rule',
          )
          path.write_text(text, encoding='utf-8')

          # ------------------------------------------------------------------
          # 2) P2-02 canonical page: make each exercise self-contained enough
          #    to identify the random variables and notation before calculating.
          # ------------------------------------------------------------------
          path = Path('textbook/volumes/01_probability/P2_02_期待値_分散_共分散_母関数/index.md')
          text = path.read_text(encoding='utf-8')

          text = replace_in_problem(
              text, '### P2-A04 離散平均・分散',
              '$P(X=0)=1/4$, $P(X=1)=1/2$, $P(X=2)=1/4$ のとき $E[X]$, $\\operatorname{Var}(X)$ を求めよ。',
              '''離散型確率変数 $X$ の台を $\\{0,1,2\\}$ とし、確率質量関数 $p_X(x)=P(X=x)$ が

$$
p_X(0)=\\frac14,\\qquad
p_X(1)=\\frac12,\\qquad
p_X(2)=\\frac14
$$

で与えられるとする。$E[X]$ と $\\operatorname{Var}(X)$ を定義から求めよ。''',
              'P2-A04',
          )

          text = replace_in_problem(
              text, '### P2-A05 線形変換',
              '$E[X]=2$, $\\operatorname{Var}(X)=3$ のとき $Y=4-2X$ の平均と分散を求めよ。',
              '実数値確率変数 $X$ が $E[X]=2$, $\\operatorname{Var}(X)=3$ を満たすとする。新たな確率変数を $Y=4-2X$ と定義する。$E[Y]$ と $\\operatorname{Var}(Y)$ を求めよ。',
              'P2-A05',
          )

          text = replace_in_problem(
              text, '### P2-A06 共分散公式',
              '$E[X]=1$, $E[Y]=2$, $E[XY]=5$ のとき $\\operatorname{Cov}(X,Y)$ を求めよ。',
              '実数値確率変数 $X,Y$ は二次モーメントが有限で、$E[X]=1$, $E[Y]=2$, $E[XY]=5$ を満たすとする。$\\operatorname{Cov}(X,Y)$ を求めよ。',
              'P2-A06',
          )

          text = replace_in_problem(
              text, '### P2-B04 連続分布のモーメント',
              '$f_X(x)=2x$（$0<x<1$）、台の外で0とする。',
              '連続型確率変数 $X$ の確率密度関数を $f_X(x)$ とし、\n\n$$\nf_X(x)=\n\\begin{cases}\n2x,&0<x<1,\\\\\n0,&\\text{その他}\n\\end{cases}\n$$\n\nで与えられるとする。',
              'P2-B04',
          )

          text = replace_in_problem(
              text, '### P2-B05 二値変数の相関',
              '$(X,Y)=(1,1),(1,-1),(-1,1),(-1,-1)$ の確率が順に $3/8,1/8,1/8,3/8$ である。',
              '''2変量離散型確率変数 $(X,Y)$ は $\\{(1,1),(1,-1),(-1,1),(-1,-1)\\}$ のみを取り、その同時確率質量関数が

$$
\\begin{aligned}
P(X=1,Y=1)&=\\frac38,&
P(X=1,Y=-1)&=\\frac18,\\\\
P(X=-1,Y=1)&=\\frac18,&
P(X=-1,Y=-1)&=\\frac38
\\end{aligned}
$$

で与えられるとする。''',
              'P2-B05',
          )

          text = replace_in_problem(
              text, '### P2-B06 確率母関数からモーメント',
              '$G_X(s)=(1+s)^3/8$ とする。',
              '非負整数値確率変数 $X$ の確率母関数を $G_X(s)=E[s^X]$ とする。$G_X(s)=(1+s)^3/8$ が与えられている。',
              'P2-B06',
          )

          text = replace_in_problem(
              text, '### P2-B07 ベルヌーイ分布からモーメント母関数を導く',
              '$P(X=1)=p$, $P(X=0)=1-p$（$0<p<1$）とする。',
              '離散型確率変数 $X$ の台を $\\{0,1\\}$ とし、$0<p<1$ の下で $P(X=1)=p$, $P(X=0)=1-p$ とする。モーメント母関数は $M_X(t)=E[e^{tX}]$ と定義する。',
              'P2-B07',
          )

          text = replace_in_problem(
              text, '### P2-B08 全共分散',
              '$P(H_0)=P(H_1)=1/2$ とする。条件付きモーメントが',
              '群ラベルを表す確率変数 $H\\in\\{0,1\\}$ が $P(H=0)=P(H=1)=1/2$ を満たすとする。実数値確率変数 $X,Y$ は二次モーメントが有限で、条件付きモーメントが',
              'P2-B08 preamble',
          )
          text = replace_in_section(
              text, '### P2-B08 全共分散',
              [('$H_0$', '$H=0$'), ('$H_1$', '$H=1$'), ('\\mid H_0', '\\mid H=0'), ('\\mid H_1', '\\mid H=1')],
              'P2-B08 H notation',
          )

          text = replace_in_problem(
              text, '### P2-C06 混合集団の全分散',
              '$P(H_1)=0.4$, $P(H_2)=0.6$、$E[X\\mid H_1]=1$, $E[X\\mid H_2]=3$、$\\operatorname{Var}(X\\mid H_1)=2$, $\\operatorname{Var}(X\\mid H_2)=1$ とする。',
              '群ラベルを表す確率変数 $H\\in\\{1,2\\}$ が $P(H=1)=0.4$, $P(H=2)=0.6$ を満たすとする。実数値確率変数 $X$ の条件付き平均・条件付き分散が $E[X\\mid H=1]=1$, $E[X\\mid H=2]=3$, $\\operatorname{Var}(X\\mid H=1)=2$, $\\operatorname{Var}(X\\mid H=2)=1$ で与えられている。',
              'P2-C06 preamble',
          )
          text = replace_in_section(
              text, '### P2-C06 混合集団の全分散',
              [('$H_1$', '$H=1$'), ('$H_2$', '$H=2$'), ('\\mid H_1', '\\mid H=1'), ('\\mid H_2', '\\mid H=2')],
              'P2-C06 H notation',
          )

          text = replace_in_problem(
              text, '### P2-C07 同時密度から相関係数',
              '$f_{X,Y}(x,y)=x+y$（$0<x<1$, $0<y<1$）、台の外で0とする。',
              '2変量連続型確率変数 $(X,Y)$ の同時確率密度関数を $f_{X,Y}(x,y)$ とし、$f_{X,Y}(x,y)=x+y$（$0<x<1$, $0<y<1$）、それ以外では0とする。',
              'P2-C07',
          )

          text = replace_in_problem(
              text, '### P2-C08 べき型裾とモーメントの存在',
              '$f_X(x)=cx^{-\\alpha}$（$x\\geq1$）、台の外で0、$\\alpha>1$ とする。',
              '連続型確率変数 $X$ の確率密度関数を $f_X(x)$ とする。未知の正規化定数 $c>0$ と母数 $\\alpha>1$ に対して $f_X(x)=cx^{-\\alpha}$（$x\\geq1$）、それ以外では0とする。',
              'P2-C08',
          )

          text = replace_in_problem(
              text, '### P2-C09 幾何級数型の確率母関数',
              '$P(X=k)=(1-p)p^k$（$k\\in\\mathbb N_0$, $0<p<1$）とする。',
              '非負整数値確率変数 $X$ の確率質量関数を $p_X(k)=P(X=k)$ とする。$0<p<1$ の下で $p_X(k)=(1-p)p^k$（$k\\in\\mathbb N_0$）と与えられている。',
              'P2-C09',
          )

          text = replace_in_problem(
              text, '### P2-C10 モーメント母関数と独立和',
              '$M_X(t)=(1-2t)^{-1/2}$（$t<1/2$）であり、$X_1,\\ldots,X_n$ は独立で各々 $X$ と同分布とする。',
              '実数値確率変数 $X$ のモーメント母関数を $M_X(t)=E[e^{tX}]$ とする。$M_X(t)=(1-2t)^{-1/2}$（$t<1/2$）が与えられている。$X_1,\\ldots,X_n$ は独立で、各々 $X$ と同じ分布に従うとする。',
              'P2-C10',
          )

          text = replace_in_problem(
              text, '### P2-D02 共分散不等式',
              '''二次モーメントが有限で分散が正の $X,Y$ について

$$
\\operatorname{Cov}(X,Y)^2
\\leq\\operatorname{Var}(X)\\operatorname{Var}(Y)
$$

を分散の非負性から証明せよ。さらに $|\\rho(X,Y)|\\leq1$ と、等号成立条件を示せ。''',
              '''実数値確率変数 $X,Y$ は $E[X^2],E[Y^2]<\\infty$ かつ $\\operatorname{Var}(X)>0$, $\\operatorname{Var}(Y)>0$ を満たすとする。相関係数を

$$
\\rho(X,Y)
=\\frac{\\operatorname{Cov}(X,Y)}
{\\sqrt{\\operatorname{Var}(X)\\operatorname{Var}(Y)}}
$$

と定義する。分散の非負性から

$$
\\operatorname{Cov}(X,Y)^2
\\leq\\operatorname{Var}(X)\\operatorname{Var}(Y)
$$

を証明せよ。さらに $|\\rho(X,Y)|\\leq1$ と、等号成立条件を示せ。''',
              'P2-D02',
          )

          text = replace_in_problem(
              text, '## P2-DRILL-02 問題',
              'とおく。条件付きモーメントは',
              'とおく。実数値確率変数 $X$ の条件付きモーメントは',
              'P2 drill X declaration',
          )

          path.write_text(text, encoding='utf-8')

          # ------------------------------------------------------------------
          # 3) P3-01 canonical page: same problem-statement standard.
          # ------------------------------------------------------------------
          path = Path('textbook/volumes/02_distributions/P3_01_主要な離散分布/index.md')
          text = path.read_text(encoding='utf-8')

          text = replace_in_problem(
              text, '### P3-A01 二項確率',
              '$X\\sim\\operatorname{Bin}(5,0.2)$ の $P(X=2)$、平均、分散を求めよ。',
              '成功確率 $p=0.2$ の独立なベルヌーイ試行を5回行い、成功回数を $X$ とする。このとき $X\\sim\\operatorname{Bin}(5,0.2)$ である。$P(X=2)$、$E[X]$、$\\operatorname{Var}(X)$ を求めよ。',
              'P3-A01',
          )

          text = replace_in_problem(
              text, '### P3-A02 幾何待ち時間',
              '$X\\sim\\operatorname{Geom}(0.25)$ の $P(X=4)$、平均、分散を求めよ。',
              '成功確率 $p=0.25$ の独立なベルヌーイ試行を、初めて成功するまで繰り返す。初成功が出る試行番号を $X$ とする。本章の規約では $X\\in\\{1,2,\\ldots\\}$ で $X\\sim\\operatorname{Geom}(0.25)$ である。$P(X=4)$、$E[X]$、$\\operatorname{Var}(X)$ を求めよ。',
              'P3-A02',
          )

          text = replace_in_problem(
              text, '### P3-A03 ポアソン確率',
              '$X\\sim\\operatorname{Poisson}(2)$ の $P(X\\leq1)$、平均、分散を求めよ。',
              '''非負整数値確率変数 $X$ は母数2のポアソン分布に従い、確率質量関数が

$$
P(X=k)=e^{-2}\\frac{2^k}{k!},
\\qquad k=0,1,2,\\ldots
$$

で与えられるとする。$P(X\\leq1)$、$E[X]$、$\\operatorname{Var}(X)$ を求めよ。''',
              'P3-A03',
          )

          text = replace_in_problem(
              text, '### P3-A04 ベルヌーイ分布',
              '成功確率0.3の1回の試行の成功指示変数を $I$ とする。$I$ の確率質量関数、平均、分散を求めよ。',
              '成功確率0.3の1回の試行について、成功なら $I=1$、失敗なら $I=0$ とする成功指示変数 $I$ を定義する。$I$ の確率質量関数、$E[I]$、$\\operatorname{Var}(I)$ を求めよ。',
              'P3-A04',
          )

          text = replace_in_problem(
              text, '### P3-B01 非復元抽出',
              '20個中6個が不良である。非復元で5個選ぶ不良数 $X$ について、台、$P(X=2)$、平均、分散を求めよ。',
              '20個中6個が不良、14個が正常である有限母集団から、非復元で5個を無作為抽出する。抽出された5個に含まれる不良品数を $X$ とする。$X$ の台、$P(X=2)$、$E[X]$、$\\operatorname{Var}(X)$ を求めよ。',
              'P3-B01',
          )

          text = replace_in_problem(
              text, '### P3-B02 3回目の成功',
              '成功確率0.4の独立試行で3回目の成功までの試行回数を $T$ とする。$P(T=5)$、平均、分散を求めよ。',
              '各回の成功確率が $p=0.4$ で互いに独立なベルヌーイ試行を繰り返す。3回目の成功が出る試行番号を $T$ とする。$P(T=5)$、$E[T]$、$\\operatorname{Var}(T)$ を求めよ。',
              'P3-B02',
          )

          text = replace_in_problem(
              text, '### P3-B03 三カテゴリ',
              '$\\boldsymbol X\\sim\\operatorname{Multinomial}(6;0.2,0.3,0.5)$ とする。$P(X_1=1,X_2=2,X_3=3)$、$E[X_1]$、$\\operatorname{Cov}(X_1,X_2)$ を求めよ。',
              '1回の試行がカテゴリ1,2,3に入る確率をそれぞれ $0.2,0.3,0.5$ とし、この試行を独立に6回行う。カテゴリ $i$ の度数を $X_i$ とし、$\\boldsymbol X=(X_1,X_2,X_3)$ とおく。このとき $\\boldsymbol X\\sim\\operatorname{Multinomial}(6;0.2,0.3,0.5)$ である。$P(X_1=1,X_2=2,X_3=3)$、$E[X_1]$、$\\operatorname{Cov}(X_1,X_2)$ を求めよ。',
              'P3-B03',
          )

          text = replace_in_problem(
              text, '### P3-C01 復元・非復元の比較',
              '100個中20個が成功である。',
              '100個中20個が「成功」、80個が「失敗」である有限母集団を考える。復元して10回抽出したときの成功数を $X$、非復元で10個抽出したときの成功数を $Y$ とする。',
              'P3-C01 variable declarations',
          )

          text = replace_in_problem(
              text, '### P3-C02 待ち時間と無記憶性',
              '$X\\sim\\operatorname{Geom}(p)$、$0<p<1$ とし、$m,n\\in\\mathbb N_0$ とする。',
              '成功確率 $0<p<1$ の独立なベルヌーイ試行を繰り返し、$q=1-p$ とする。初成功が出る試行番号を $X$ とするので、本章の規約では $X\\sim\\operatorname{Geom}(p)$、$X\\in\\{1,2,\\ldots\\}$ である。また $m,n\\in\\mathbb N_0$ とする。',
              'P3-C02',
          )

          text = replace_in_problem(
              text, '### P3-C03 ポアソン和と条件付き分布',
              '独立な $X\\sim\\operatorname{Poisson}(\\lambda)$, $Y\\sim\\operatorname{Poisson}(\\mu)$ とする。$S=X+Y$ とし、$n\\in\\mathbb N_0$、$k=0,\\ldots,n$ とする。',
              '''$\\lambda>0$, $\\mu>0$ とする。独立な非負整数値確率変数 $X,Y$ の確率質量関数が

$$
P(X=x)=e^{-\\lambda}\\frac{\\lambda^x}{x!},
\\qquad
P(Y=y)=e^{-\\mu}\\frac{\\mu^y}{y!},
\\qquad x,y\\in\\mathbb N_0
$$

で与えられている。すなわち $X\\sim\\operatorname{Poisson}(\\lambda)$, $Y\\sim\\operatorname{Poisson}(\\mu)$ である。$S=X+Y$ とし、$n\\in\\mathbb N_0$、$k=0,\\ldots,n$ とする。''',
              'P3-C03',
          )

          text = replace_in_problem(
              text, '### P3-C04 多項分布の集約',
              '$\\boldsymbol X\\sim\\operatorname{Multinomial}(n;p_1,p_2,p_3)$ とし、$p_1>0$, $p_2>0$ とする。',
              '''$n\\in\\mathbb N$ とし、$p_1>0$, $p_2>0$, $p_3\\geq0$, $p_1+p_2+p_3=1$ とする。1回の試行がカテゴリ $i$ に入る確率を $p_i$ とし、この試行を独立に $n$ 回行う。カテゴリ $i$ の度数を $X_i$、$\\boldsymbol X=(X_1,X_2,X_3)$ とする。このとき

$$
\\boldsymbol X\\sim\\operatorname{Multinomial}(n;p_1,p_2,p_3).
$$''',
              'P3-C04',
          )

          path.write_text(text, encoding='utf-8')

          print('Normalized common exercise rules and P2-02/P3-01 problem statements.')
          PY

      - name: Check diffs
        run: |
          git diff --check
          git diff --stat

      - name: Install dependencies
        run: npm ci

      - name: Validate exercise style and Pages
        run: |
          npm run validate:exercise-style
          npm run validate:pages

      - name: Commit normalized prompts
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add EXERCISE_GUIDELINES.md textbook/style-guide.md \
            'textbook/volumes/01_probability/P2_02_期待値_分散_共分散_母関数/index.md' \
            'textbook/volumes/02_distributions/P3_01_主要な離散分布/index.md'
          git commit -m 'textbook: align exercise prompts with Math 100 notation'
          git push origin HEAD:main
