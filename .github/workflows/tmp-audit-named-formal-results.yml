name: Temporary named formal result audit

on:
  push:
    branches:
      - fix/named-formal-results-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/tmp-audit-named-formal-results.mjs
