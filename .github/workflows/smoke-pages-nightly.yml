name: Full Pages live smoke

on:
  schedule:
    - cron: '47 18 * * *'
  workflow_dispatch:

concurrency:
  group: full-pages-live-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Smoke-test every published file
        run: |
          python3 scripts/smoke-pages-live.py \
            --base-url "https://insuns21.github.io/toukei-kentei_grade1_preparation/" \
            --mode full
