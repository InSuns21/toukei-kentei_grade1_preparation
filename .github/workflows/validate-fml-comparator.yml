name: Validate FML comparator
on:
  pull_request:
    paths:
      - 'textbook/volumes/dream_thater/計算系/FML/FML6/**'
      - '.github/workflows/validate-fml-comparator.yml'
  push:
    branches: [main]
    paths:
      - 'textbook/volumes/dream_thater/計算系/FML/FML6/**'
      - '.github/workflows/validate-fml-comparator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comparator:
    name: Lean Comparator and nanoda
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee
        with:
          lake-package-directory: 'textbook/volumes/dream_thater/計算系/FML/FML6/lab'
          auto-config: 'false'
          build: 'false'
          test: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - name: Install sandbox
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
      - name: Compare from clean environments
        working-directory: 'textbook/volumes/dream_thater/計算系/FML/FML6/lab'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/fml6-logs"
          TMPDIR="$RUNNER_TEMP/fml6-logs" bash verify.sh
          git diff --exit-code -- lean-toolchain lake-manifest.json
      - name: Preserve execution logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fml6-comparator-logs
          path: ${{ runner.temp }}/fml6-logs/**/*.log
