name: Temporary MT5 fix runner

on:
  push:
    branches:
      - codex/mt5-radon-riesz-markov

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mt5-radon-riesz-markov
          fetch-depth: 0
      - run: python .github/tmp/fix_mt5_pages_acronyms.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook/volumes/00_foundations/MT4/index.md scripts/prepare-pages-textbook-single-page.mjs
          git commit -m 'fix(MT5): repair Pages supplement and acronym first use'
          git push origin HEAD:codex/mt5-radon-riesz-markov
