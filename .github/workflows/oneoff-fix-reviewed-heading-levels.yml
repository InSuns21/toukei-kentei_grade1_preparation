name: One-off fix reviewed heading levels

on:
  push:
    paths:
      - '.github/workflows/oneoff-fix-reviewed-heading-levels.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize reviewed heading levels
        run: python scripts/oneoff_fix_reviewed_heading_levels.py
      - name: Remove one-off files and commit
        run: |
          rm scripts/oneoff_fix_reviewed_heading_levels.py
          rm .github/workflows/oneoff-fix-reviewed-heading-levels.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'textbook: normalize reviewed chapter heading levels'
          git push
