name: Fix P5A definition example marker

on:
  push:
    branches:
      - audit/f0-00p5a-slln-pedagogy

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/f0-00p5a-slln-pedagogy
      - name: Normalize definition example marker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('textbook/volumes/00_foundations/F0_00P5A_truncation_Kronecker_一般SLLN/index.md')
          s = p.read_text(encoding='utf-8')
          old = '**定義の確認。**  '
          new = '**定義の確認**  '
          if old not in s:
              raise SystemExit('expected marker not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add textbook/volumes/00_foundations/F0_00P5A_truncation_Kronecker_一般SLLN/index.md
          git commit -m 'Fix P5A definition example marker'
          git push origin HEAD:audit/f0-00p5a-slln-pedagogy
