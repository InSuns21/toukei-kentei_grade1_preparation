name: DREAM THEATER category relocation (one-time branch)
on:
  push:
    branches:
      - refactor/dream-theater-category-layout-r1-r2-20261012
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/dream-theater-category-relocation-run.yml'
      - 'scripts/migrate-dream-theater-categories.mjs'

permissions:
  contents: write

concurrency:
  group: dream-theater-category-relocation
  cancel-in-progress: false

jobs:
  relocate:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.head_ref == 'refactor/dream-theater-category-layout-r1-r2-20261012')
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: refactor/dream-theater-category-layout-r1-r2-20261012
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Apply migration exactly once
        run: |
          if grep -q 'textbook/volumes/00_foundations/' textbook/dream-theater-index.json; then
            node scripts/migrate-dream-theater-categories.mjs --apply
            node scripts/migrate-dream-theater-categories.mjs --check
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git diff --cached --stat | tail -n 24
            git commit -m 'refactor: relocate DREAM THEATER chapters into eight category folders'
            git push origin HEAD:refs/heads/refactor/dream-theater-category-layout-r1-r2-20261012
          else
            node scripts/migrate-dream-theater-categories.mjs --check
          fi
      - name: Verify relocation preserves text, proofs and assets
        run: node scripts/verify-dream-theater-category-relocation.mjs --base "$(git merge-base origin/main HEAD)"
