name: Apply FOU5 CI fixes

on:
  push:
    branches:
      - dream-theater/fou5-probability-dft-sampling

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply targeted fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('textbook/volumes/00_foundations/FOU5/index.md')
          s = p.read_text()
          s = s.replace('[iid中心極限定理]', '[独立同分布中心極限定理]')
          s = s.replace('iid 中心極限定理', '独立同分布中心極限定理')
          s = s.replace('複素正弦波', '複素指数波')
          s = s.replace('逆変換・一意性の機構', '復元・一意性の機構')
          s = s.replace('$L^2$ ではノルム極限として反転', '$L^2$ では $L^2$ 収束として反転')

          lines = s.splitlines()
          out = []
          in_formal = False
          in_display = False
          for line in lines:
              if '<!-- formal-statement-start -->' in line:
                  in_formal = True
              if in_formal:
                  stripped = line.lstrip()
                  if stripped.startswith('>'):
                      rest = stripped[1:]
                      if rest.startswith(' '):
                          rest = rest[1:]
                      if rest.strip() == '$$':
                          line = rest
                          in_display = not in_display
                      elif in_display:
                          line = rest
                  elif line.strip() == '$$':
                      in_display = not in_display
              out.append(line)
              if '<!-- formal-statement-end -->' in line:
                  in_formal = False
                  in_display = False
          p.write_text('\n'.join(out) + '\n')

          k = Path('textbook/volumes/00_foundations/FOU5/knowledge.yaml')
          ks = k.read_text().replace('iid CLT', '独立同分布 CLT')
          titles = {
              'fourier.fou5-measure-transform': '定義（有限測度の Fourier 変換）',
              'fourier.fou5-probability-transform': '命題（確率分布の Fourier 変換と特性関数の対応）',
              'fourier.fou5-probability-convolution': '定義（確率測度の畳み込み）',
              'fourier.fou5-independent-sum-convolution': '命題（独立和・畳み込み・Fourier積）',
              'fourier.fou5-dft': '定義（離散 Fourier 変換）',
              'fourier.fou5-root-orthogonality': '補題（$1$ の $N$ 乗根の直交性）',
              'fourier.fou5-dft-inversion': '定理（離散 Fourier 反転公式）',
              'fourier.fou5-dft-parseval': '定理（離散 Parseval 等式）',
              'fourier.fou5-circular-convolution': '定義（巡回畳み込み）',
              'fourier.fou5-circular-convolution-theorem': '定理（巡回畳み込み定理）',
              'fourier.fou5-aliasing': '定義（等間隔標本化におけるエイリアシング同値）',
              'fourier.fou5-sampling-aliasing': '命題（等間隔標本化のエイリアシング）',
          }
          klines = ks.splitlines()
          kout = []
          current = None
          for line in klines:
              if line.startswith('  - id: '):
                  current = line.split(': ', 1)[1]
              kout.append(line)
              if line.strip() == 'introduction: formal' and current in titles:
                  title = titles[current].replace('"', '\\"')
                  kout.append(f'    introduction_aliases: ["{title}"]')
          k.write_text('\n'.join(kout) + '\n')

          r = Path('textbook/volumes/00_foundations/F0_00R2_EncoreII_Fourier解析_微分方程式/knowledge.yaml')
          rs = r.read_text()
          anchor = '  - fourier.fou3-convolution\n'
          add = (
              '  - fourier.fou5-independent-sum-convolution\n'
              '  - fourier.fou5-dft\n'
              '  - fourier.fou5-circular-convolution\n'
              '  - fourier.fou5-aliasing\n'
              '  - fourier.fou5-sampling-aliasing\n'
          )
          if 'fourier.fou5-dft' not in rs:
              rs = rs.replace(anchor, anchor + add)
          r.write_text(rs)

          f = Path('textbook/dream-theater.md')
          fs = f.read_text()
          fou4 = '12. [FOU4 Plancherel・L2 Fourier解析](textbook/volumes/00_foundations/FOU4/index.md)'
          fou5 = '13. [FOU5 確率・離散Fourier変換・サンプリング](textbook/volumes/00_foundations/FOU5/index.md)'
          if fou5 not in fs:
              fs = fs.replace(fou4, fou4 + '\n' + fou5)
          f.write_text(fs)
          PY

          git rm .github/workflows/fou5-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook/volumes/00_foundations/FOU5/index.md \
                  textbook/volumes/00_foundations/FOU5/knowledge.yaml \
                  textbook/volumes/00_foundations/F0_00R2_EncoreII_Fourier解析_微分方程式/knowledge.yaml \
                  textbook/dream-theater.md
          git commit -m 'fix: FOU5 のCI規約と導線を整合'
          git push origin HEAD:dream-theater/fou5-probability-dft-sampling
