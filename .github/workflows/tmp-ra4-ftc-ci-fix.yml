name: Temporary RA4 FTC CI fix
on:
  push:
    branches:
      - fix/ra4-ftc-linkage
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ra4-ftc-linkage
          fetch-depth: 0
      - name: Apply RA4 FTC CI fix
        run: python scripts/tmp_ra4_ftc_ci_fix.py
      - name: Commit fix and remove temporary files
        run: |
          rm scripts/tmp_ra4_ftc_ci_fix.py .github/workflows/tmp-ra4-ftc-ci-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "RA4: avoid FTC concept-audit false positives"
          git push origin HEAD:fix/ra4-ftc-linkage
