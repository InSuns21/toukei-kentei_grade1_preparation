name: Temporary FA1 formal-link fix

on:
  push:
    branches:
      - codex/fa1-quotient-uniform-boundedness

permissions:
  contents: write

jobs:
  fix-fa1-links:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fa1-quotient-uniform-boundedness
      - name: Patch FA1 formal references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('textbook/volumes/00_foundations/FA1/index.md')
          s = p.read_text()
          replacements = [
              ('従って一様有界性原理から', '従って[一様有界性原理](#thm-fa1-uniform-boundedness)から'),
              ('Baire のカテゴリー定理から', '[Baire のカテゴリー定理](../TOP6/index.md#thm-top6-baire-category)から'),
              ('点ごとに有界。一様有界性原理により', '点ごとに有界。[一様有界性原理](#thm-fa1-uniform-boundedness)により'),
              ('- 一様有界性原理の適用: 7点', '- [一様有界性原理](#thm-fa1-uniform-boundedness)の適用: 7点'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'missing target: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook/volumes/00_foundations/FA1/index.md
          git commit -m 'Fix FA1 formal-reference links'
          git push origin HEAD:codex/fa1-quotient-uniform-boundedness
