name: Temporary PCA terminology repair

on:
  push:
    branches:
      - fix/f0-linear-algebra-before-banach

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/f0-linear-algebra-before-banach
      - name: Replace PCA terminology
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('textbook/volumes/00_foundations/F0_00E2_Cauchy_Schwarz_Bessel_Parseval/index.md')
          s = p.read_text(encoding='utf-8')
          s2 = s.replace('回帰・PCA・Fourier展開', '回帰・主成分分析・Fourier展開')
          if s2 == s:
              raise SystemExit('target PCA wording not found')
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add textbook/volumes/00_foundations/F0_00E2_Cauchy_Schwarz_Bessel_Parseval/index.md
          git diff --cached --check
          git commit -m "fix PCA terminology in Parseval note"
          git push origin HEAD:fix/f0-linear-algebra-before-banach
