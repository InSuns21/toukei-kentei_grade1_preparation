name: FOU5 merge-head pedagogy audits

on:
  push:
    branches:
      - audit/fou5-pedagogy-merge-head

jobs:
  pedagogy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Audit proof pedagogy
        run: npm run audit:proof-pedagogy
      - name: Audit formalism pedagogy
        run: npm run audit:formalism-pedagogy
