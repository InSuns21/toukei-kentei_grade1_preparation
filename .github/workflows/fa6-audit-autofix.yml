name: FA6 final audit fix

on:
  push:
    branches:
      - feat/fa6-compact-operator

permissions:
  contents: write

jobs:
  fix-and-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fa6-compact-operator
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Remove alias false positives and heading collision
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('textbook/volumes/00_foundations/FA6/index.md')
          s = p.read_text()
          replacements = [
              ('## 3. Riesz の補題：無限次元の単位球には離れた点を無限に作れる',
               '## 3. 無限次元の単位球には離れた点を無限に作れる'),
              ('作用素ノルム極限でも保存（値域Banach）', '作用素ノルム収束でも保存（値域Banach）'),
              ('## 6. 作用素ノルム極限でもコンパクト性は保たれる',
               '## 6. 作用素ノルム収束でもコンパクト性は保たれる'),
              ('有限ランク作用素の作用素ノルム極限はコンパクト',
               '有限ランク作用素の作用素ノルム収束先はコンパクト'),
              ('作用素ノルム極限', '作用素ノルムでの収束'),
              ('極限を取る例', '近似で得られる例'),
              ('極限点', '収束先'),
              ('Cauchy 列の極限が completion の中には存在しても',
               'Cauchy 列の収束先が completion の中には存在しても'),
              ('#### FA6-B03 指数核を有限ランクで近似する',
               '#### FA6-B03 核 $e^{st}$ を有限ランクで近似する'),
              ('指数級数', 'Taylor級数'),
          ]
          for old, new in replacements:
              s = s.replace(old, new)
          p.write_text(s)

          k = Path('textbook/volumes/00_foundations/FA6/knowledge.yaml')
          ks = k.read_text()
          ks = ks.replace('有限ランク作用素の作用素ノルム極限はコンパクト',
                          '有限ランク作用素の作用素ノルム収束先はコンパクト')
          k.write_text(ks)
          PY
          if grep -nE 'Riesz の補題：|指数核|指数級数|極' textbook/volumes/00_foundations/FA6/index.md; then
            echo 'alias-sensitive phrases remain in FA6 body' >&2
            exit 1
          fi
      - name: Autofix formal references
        run: node scripts/validate-formal-reference-links-dag.mjs --fix
      - name: Verify concept audit
        run: DREAM_THEATER_BASE_SHA=f45484524c038306e58f37ecde348ec2dd293710 npm run validate:dream-theater-concepts:changed
      - name: Remove temporary audit machinery and commit
        shell: bash
        run: |
          rm -f textbook/volumes/00_foundations/FA6/audit.tmp.txt
          git rm .github/workflows/fa6-audit-autofix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add textbook/volumes/00_foundations/FA6/index.md textbook/volumes/00_foundations/FA6/knowledge.yaml textbook/volumes/00_foundations/FA6/audit.tmp.txt
          git commit -m 'fix(FA6): clear audit false positives and cleanup'
          git push origin HEAD:feat/fa6-compact-operator
