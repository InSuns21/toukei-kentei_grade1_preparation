name: Temporary PDE3 pedagogy audit

on:
  pull_request:
    paths:
      - 'textbook/volumes/00_foundations/PDE3/**'
      - '.github/workflows/audit-pde3-temp.yml'
  workflow_dispatch:

jobs:
  audit-pde3-pedagogy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit proof pedagogy
        run: npm run audit:proof-pedagogy
      - name: Audit formalism pedagogy
        run: npm run audit:formalism-pedagogy
