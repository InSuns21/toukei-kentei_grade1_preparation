name: Temporary CA5 continuation anchor fix

on:
  push:
    branches:
      - codex/ca5-winding-monodromy

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/ca5-winding-monodromy
          fetch-depth: 0
      - name: Rename continuation anchor
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('textbook/volumes/00_foundations/CA5/index.md')
          s = p.read_text(encoding='utf-8')
          old = 'def-ca5-continuation-chain'
          new = 'def-ca5-analytic-continuation-along-path'
          if old not in s:
              raise SystemExit(f'{old} not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          Path('.github/workflows/tmp-ca5-continuation-anchor-fix.yml').unlink()
          PY
      - name: Commit anchor fix and remove temporary workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add textbook/volumes/00_foundations/CA5/index.md .github/workflows/tmp-ca5-continuation-anchor-fix.yml
          git commit -m "Rename CA5 analytic continuation anchor"
          git push origin HEAD:codex/ca5-winding-monodromy
