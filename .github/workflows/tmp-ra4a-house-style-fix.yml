name: Temporary RA4A house-style fix

on:
  push:
    branches:
      - feat/ra4a-improper-integrals
    paths:
      - .github/workflows/tmp-ra4a-house-style-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ra4a-improper-integrals
          fetch-depth: 0

      - name: Normalize formal display math and exercise wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('textbook/volumes/00_foundations/RA4A/index.md')
          s = p.read_text(encoding='utf-8')

          # House style: display math must not remain inside Markdown blockquotes.
          lines = s.splitlines(keepends=True)
          out = []
          in_quoted_display = False
          converted = 0
          for line in lines:
              body = line[:-1] if line.endswith('\n') else line
              nl = '\n' if line.endswith('\n') else ''
              if not in_quoted_display and body == '> $$':
                  out.append('$$' + nl)
                  in_quoted_display = True
                  converted += 1
                  continue
              if in_quoted_display:
                  if body.startswith('> '):
                      body = body[2:]
                  elif body == '>':
                      body = ''
                  out.append(body + nl)
                  if body == '$$':
                      in_quoted_display = False
                  continue
              out.append(line)
          if in_quoted_display:
              raise SystemExit('unterminated quoted display math')
          s = ''.join(out)

          old = 'また $p=1$ の調和級数が発散することを積分との比較不等式から明示せよ。'
          new = 'また $p=1$ では、各 $N$ について $\\int_1^{N+1} dx/x\\le\\sum_{n=1}^N 1/n$ を直接示し、調和級数の発散を導け。'
          if old not in s:
              raise SystemExit('target B03 wording not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          print(f'converted quoted display blocks: {converted}')
          PY

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/tmp-ra4a-house-style-fix.yml
          git add textbook/volumes/00_foundations/RA4A/index.md
          git commit -m "Fix RA4A formal math house style"
          git push origin HEAD:feat/ra4a-improper-integrals
