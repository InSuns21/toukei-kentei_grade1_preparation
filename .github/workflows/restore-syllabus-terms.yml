name: Restore syllabus terminology

on:
  push:
    branches:
      - chore/unify-exercise-guidelines
    paths:
      - 'scripts/restore_syllabus_terms.mjs'
      - '.github/workflows/restore-syllabus-terms.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/unify-exercise-guidelines
          fetch-depth: 0

      - name: Restore syllabus-aligned terms
        run: node scripts/restore_syllabus_terms.mjs

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo 'No terminology changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add applied-rikou-80
          git commit -m 'style: restore syllabus-standard terminology'
          git push origin HEAD:chore/unify-exercise-guidelines
