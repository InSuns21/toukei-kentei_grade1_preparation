name: Temporary P3-03 post-review repair

on:
  push:
    paths:
      - '.github/workflows/_tmp-migrate-p303-review.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Repair reviewed P3-03 precisely
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('textbook/volumes/02_distributions/P3_03_多変量分布_条件付き分布/index.md')
          s = p.read_text()

          def repair_display_segment(text, start_marker, end_marker, attached_close=None):
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              seg = text[start:end]
              seg = '\n'.join(('$$' if line.strip() == '$' else line) for line in seg.splitlines())
              if attached_close:
                  bad, good = attached_close
                  if bad not in seg:
                      raise SystemExit(f'attached close target missing in {start_marker}')
                  seg = seg.replace(bad, good, 1)
              return text[:start] + seg + text[end:]

          s = repair_display_segment(
              s,
              '## P3M-THM-01 平均・共分散の定数項を含む線形変換',
              '## P3M-THM-02 多変量正規のアフィン変換と周辺分布',
              ('\n$任意の$', '\n$$\n任意の$'),
          )
          s = repair_display_segment(
              s,
              '## P3M-THM-02 多変量正規のアフィン変換と周辺分布',
              '## P3M-THM-03 多変量正規の条件付き分布',
          )
          s = repair_display_segment(
              s,
              '### P3M-C04 白色化と二次形式',
              '### P3M-C05 正誤判定総合',
          )

          s = re.sub(r'(?<!\\)\bqquad\b', r'\\qquad', s)
          s = re.sub(r'(?<!\\)\bquad\b', r'\\quad', s)
          s = s.replace(r'\boldsymbol b,,A\Sigma A^{\mathsf T}', r'\boldsymbol b,\,A\Sigma A^{\mathsf T}')

          s = s.replace('平均・共分散・相関行列', '平均ベクトル・分散共分散行列・相関行列')
          s = s.replace('$A\\boldsymbol X+\\boldsymbol b$の平均・共分散を次元付きで求める。', '$A\\boldsymbol X+\\boldsymbol b$の平均ベクトル・分散共分散行列を次元付きで求める。')
          s = s.replace('条件付き共分散$\\Sigma_{11}-', '条件付き分散共分散行列$\\Sigma_{11}-')
          s = s.replace('対応する平均部分ベクトルと共分散主部分行列', '対応する平均部分ベクトルと分散共分散主部分行列')
          s = s.replace('これらを平均・共分散とする$N_2$', 'これらを平均ベクトル・分散共分散行列とする$N_2$')
          s = s.replace('共分散を $\\sigma_{XY}$ とすると、\n$$\nY\\mid(X=x)',
                        '共分散を $\\sigma_{XY}$ とすると、次式が成り立つ。$X,Y$ の役割を入れ替えて用いてもよい。\n$$\nY\\mid(X=x)')

          def replace_detailed_solution(text, start_marker, end_marker, new_detail):
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              sec = text[start:end]
              d0 = sec.index('##### 詳細解答')
              d1 = sec.index('##### 本番答案', d0)
              new_sec = sec[:d0] + '##### 詳細解答\n\n' + new_detail.strip() + '\n\n' + sec[d1:]
              return text[:start] + new_sec + text[end:]

          b01_detail = r'''
          平均は
          $$
          A\boldsymbol\mu+\boldsymbol b
          =\begin{pmatrix}1\\-2\end{pmatrix}
          +\begin{pmatrix}0\\1\end{pmatrix}
          =\begin{pmatrix}1\\-1\end{pmatrix}.
          $$
          分散共分散行列は $A\Sigma A^{\mathsf T}$ です。まず
          $$
          \begin{aligned}
          A\Sigma
          &=\begin{pmatrix}1&1&0\\0&1&-1\end{pmatrix}
          \begin{pmatrix}2&1&0\\1&3&1\\0&1&2\end{pmatrix}\\
          &=\begin{pmatrix}3&4&1\\1&2&-1\end{pmatrix}.
          \end{aligned}
          $$
          さらに
          $$
          \begin{aligned}
          A\Sigma A^{\mathsf T}
          &=\begin{pmatrix}3&4&1\\1&2&-1\end{pmatrix}
          \begin{pmatrix}1&0\\1&1\\0&-1\end{pmatrix}\\
          &=\begin{pmatrix}7&3\\3&3\end{pmatrix}.
          \end{aligned}
          $$
          従って
          $$
          \boldsymbol Y\sim N_2\left(
          \begin{pmatrix}1\\-1\end{pmatrix},
          \begin{pmatrix}7&3\\3&3\end{pmatrix}
          \right).
          $$
          '''
          s = replace_detailed_solution(s, '### P3M-B01 アフィン変換', '### P3M-B02 二変量正規の条件付け', b01_detail)

          b04_detail = r'''
          まず行列式は
          $$
          |\Sigma|=2\cdot2-1\cdot1=3>0.
          $$
          従って2次正方行列の逆行列公式から
          $$
          \begin{aligned}
          \Sigma^{-1}
          &=\frac1{|\Sigma|}\begin{pmatrix}2&-1\\-1&2\end{pmatrix}\\
          &=\frac13\begin{pmatrix}2&-1\\-1&2\end{pmatrix}.
          \end{aligned}
          $$
          次に $LL^{\mathsf T}=\Sigma$ を満たす可逆行列 $L$ を取り、
          $$
          \boldsymbol Z=L^{-1}\boldsymbol X
          $$
          と置きます。アフィン変換公式より
          $$
          E[\boldsymbol Z]=\boldsymbol0,
          \qquad
          \operatorname{Cov}(\boldsymbol Z)=L^{-1}\Sigma L^{-\mathsf T}=I_2.
          $$
          よって $\boldsymbol Z\sim N_2(\boldsymbol0,I_2)$ で、$Z_1,Z_2$ は独立な標準正規変数です。また
          $$
          \Sigma^{-1}=L^{-\mathsf T}L^{-1}
          $$
          なので
          $$
          \begin{aligned}
          Q
          &=\boldsymbol X^{\mathsf T}\Sigma^{-1}\boldsymbol X\\
          &=\boldsymbol X^{\mathsf T}L^{-\mathsf T}L^{-1}\boldsymbol X\\
          &=(L^{-1}\boldsymbol X)^{\mathsf T}(L^{-1}\boldsymbol X)\\
          &=Z_1^2+Z_2^2.
          \end{aligned}
          $$
          自由度2のカイ二乗分布を独立な標準正規変数2個の平方和として定義しているので
          $$
          Q\sim\chi_2^2.
          $$
          観測値 $\boldsymbol x=(1,-1)^{\mathsf T}$ では
          $$
          \Sigma^{-1}\boldsymbol x
          =\frac13\begin{pmatrix}2&-1\\-1&2\end{pmatrix}
          \begin{pmatrix}1\\-1\end{pmatrix}
          =\begin{pmatrix}1\\-1\end{pmatrix},
          $$
          従って
          $$
          \boldsymbol x^{\mathsf T}\Sigma^{-1}\boldsymbol x
          =(1,-1)\begin{pmatrix}1\\-1\end{pmatrix}=2.
          $$
          '''
          s = replace_detailed_solution(s, '### P3M-B04 マハラノビス二次形式', '## Level C：本番標準', b04_detail)

          p.write_text(s)

          starts = s.count('<!-- solution-start -->')
          ends = s.count('<!-- solution-end -->')
          if (starts, ends) != (15, 15):
              raise SystemExit(f'solution marker mismatch: {starts}/{ends}')
          if re.search(r'^\s*\$\s*$', s, flags=re.M):
              raise SystemExit('standalone single-dollar delimiter remains')
          if '$任意の$' in s:
              raise SystemExit('attached display-math close remains')
          if re.search(r'(?<!\\)\bq?quad\b', s):
              raise SystemExit('unescaped quad/qquad remains')
          if ',,' in s:
              raise SystemExit('suspicious double comma remains')
          print('P3-03 scoped repair complete; solution blocks=15')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Validate textbook
        run: npm run validate
      - name: Commit repair locally
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook/volumes/02_distributions/P3_03_多変量分布_条件付き分布/index.md
          git diff --cached --check
          git commit -m 'repair P3-03 notation and derivation detail'
      - name: Validate changed terminology and granularity
        run: |
          npm run validate:terminology:changed
          npm run audit:textbook-granularity
      - name: Push repair
        run: git push
