name: One-off Chebyshev terminology sweep

on:
  push:
    branches:
      - fix/chebyshev-existing-usage

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/chebyshev-existing-usage
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Replace Chebyshev terminology across all教材
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const roots = ['statistical-mathematics', 'applied-rikou-80', 'textbook/volumes', 'anki/cards'];
          const ignored = new Set(['.git', 'node_modules', 'dist', 'build', 'sources', 'review']);
          const files = [];
          function walk(dir) {
            if (!fs.existsSync(dir)) return;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (ignored.has(entry.name)) continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile() && full.endsWith('.md')) files.push(full);
            }
          }
          roots.forEach(walk);
          let changedFiles = 0;
          let replacements = 0;
          for (const file of files) {
            const before = fs.readFileSync(file, 'utf8');
            let after = before;
            const patterns = [
              /Chebyshev\s*(?:の\s*)?不等式/g,
              /チェビシェフ\s*不等式/g,
              /チェビシェフ\s+の\s*不等式/g,
            ];
            for (const pattern of patterns) {
              after = after.replace(pattern, () => {
                replacements += 1;
                return 'チェビシェフの不等式';
              });
            }
            if (after !== before) {
              fs.writeFileSync(file, after);
              changedFiles += 1;
              console.log(`fixed: ${file}`);
            }
          }
          console.log(`changed files: ${changedFiles}, replacements: ${replacements}`);
          NODE

      - name: Remove one-off workflow and commit fixes
        shell: bash
        run: |
          rm .github/workflows/tmp-fix-chebyshev.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: Chebyshev表記をチェビシェフの不等式へ統一"
            git push origin HEAD:fix/chebyshev-existing-usage
          fi

      - name: Install dependencies
        run: npm ci

      - name: Full terminology scan once
        run: npm run validate:terminology
