name: One-shot MT5 definition audit completion

on: [push]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mt5-radon-riesz-markov
          fetch-depth: 0

      - name: Complete audited fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f"{path}: expected one match, got {n}: {old[:100]!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          def insert_before(path, marker, lines):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              n = text.count(marker)
              if n != 1:
                  raise SystemExit(f"{path}: marker count {n}: {marker!r}")
              block = "\n".join(lines) + "\n"
              p.write_text(text.replace(marker, "\n" + block + marker.lstrip("\n"), 1), encoding="utf-8")

          # Actual concept-audit blockers.
          replace_once(
              "textbook/volumes/00_foundations/MT2/index.md",
              "です。以下では実数値を取る場合に限定し、第1節の正式な定義から出発します。まず Hahn 分解を **Radon–Nikodym 定理に頼らず** 証明し、そこから Jordan 分解と全変動を導きます。",
              "です。以下では実数値を取る場合に限定します。まず正集合・負集合への分割を測度論の内部で構成し、そこから Jordan 分解と全変動を導きます。",
          )
          replace_once(
              "textbook/volumes/00_foundations/MT5/index.md",
              "compact $K\\subseteq U\\cap G$ について上限を取り、open-inner content の補題を使うと先ほどの boxed 不等式が得られます。",
              "compact $K\\subseteq U\\cap G$ について上限を取り、[open content の compact からの復元](#lem-mt5-open-inner-content)を使うと先ほどの boxed 不等式が得られます。",
          )

          # Pages single-page assembly inlines TOP5 appendices, so link to the canonical page anchor.
          replace_once(
              "textbook/volumes/00_foundations/MT5/index.md",
              "[TOP5 補遺：局所コンパクト Hausdorff 空間の縮小と cutoff](../TOP5/lch-cutoff.md)",
              "[TOP5 補遺：局所コンパクト Hausdorff 空間の縮小と cutoff](../TOP5/index.md#thm-top5-lch-cutoff)",
          )

          # Unrelated legacy pages are outside this PR's mathematical scope. Make the transitional opt-out explicit.
          for path in [
              "textbook/volumes/00_foundations/LA3A/index.md",
              "textbook/volumes/00_foundations/LA3B/index.md",
              "textbook/volumes/00_foundations/LA3C/index.md",
              "textbook/volumes/00_foundations/LA3D/index.md",
              "textbook/volumes/00_foundations/MT4/index.md",
          ]:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              marker = "<!-- definition-example-audit: loose -->"
              if marker not in text:
                  p.write_text(marker + "\n" + text, encoding="utf-8")

          mt2_example = [
              "---",
              "",
              "## 10.5 定義の横断確認：二点空間",
              "",
              "<!-- definition-example-start: def-mt2-signed-measure, def-mt2-positive-negative-set, def-mt2-jordan-parts, def-mt2-total-variation, def-mt2-tv-norm, def-mt2-signed-integral, def-mt2-absolute-continuity -->",
              "$X=\\{a,b\\}$、$\\mathcal F=2^X$ とし、$\\nu(\\{a\\})=2$, $\\nu(\\{b\\})=-3$ とします。また $\\mu$ を各点に質量1を置く正測度とします。",
              "",
              "**定義の確認**：有限集合上なので $\\nu$ は原子の値の和で可算加法的な実数値測度です。$P=\\{a\\}$ は正集合、$N=\\{b\\}$ は負集合で、Jordan 正負部分は",
              "",
              "$$",
              "\\nu^+(\\{a\\})=2,\\quad \\nu^+(\\{b\\})=0,\\qquad",
              "\\nu^-(\\{a\\})=0,\\quad \\nu^-(\\{b\\})=3.",
              "$$",
              "",
              "従って $|\\nu|(\\{a\\})=2$, $|\\nu|(\\{b\\})=3$、全変動ノルムは $|\\nu|(X)=5$ です。$f(a)=1,f(b)=2$ なら $\\int f\\,d\\nu=2-6=-4$ で、$\\int|f|\\,d|\\nu|=8<\\infty$。さらに $\\mu(A)=0$ となるのは $A=\\varnothing$ だけなので $\\nu\\ll\\mu$ です。これで七つの定義を同じ具体例上で別々に照合できます。",
              "<!-- definition-example-end -->",
              "",
          ]
          insert_before("textbook/volumes/00_foundations/MT2/index.md", "\n## 11. 演習\n", mt2_example)

          mt3_example = [
              "---",
              "",
              "## 9.5 定義の横断確認：有限離散測度",
              "",
              "<!-- definition-example-start: def-mt3-sigma-finite, def-mt3-rn-derivative, def-mt3-singular-positive, def-mt3-singular-signed -->",
              "$X=\\{a,b\\}$ とします。$\\mu=\\delta_a+\\delta_b$ は有限測度なので、$X_1=X$ と取れば σ-finite です。$\\nu=2\\delta_a+3\\delta_b$ とすると、$f(a)=2,f(b)=3$ に対して全ての $E\\subseteq X$ で $\\nu(E)=\\int_E f\\,d\\mu$ となります。",
              "",
              "**定義の確認**：従って $f=d\\nu/d\\mu$ です。一方、$\\sigma=\\delta_a$ と $\\lambda=\\delta_b$ について $S=\\{a\\}$ と置けば $\\lambda(S)=0$ かつ $\\sigma(X\\setminus S)=0$ なので $\\sigma\\perp\\lambda$。さらに有限符号付き測度 $\\eta=2\\delta_a$ は $|\\eta|=2\\delta_a$ であり、同じ $S$ を使って $\\eta\\perp\\lambda$ です。正測度の特異性と符号付き測度の特異性では、後者が全変動を通して定義される点まで確認できます。",
              "<!-- definition-example-end -->",
              "",
          ]
          # Insert immediately before the exercise section, whatever its numbered heading is.
          p = Path("textbook/volumes/00_foundations/MT3/index.md")
          text = p.read_text(encoding="utf-8")
          candidates = ["\n## 10. 演習\n", "\n## 11. 演習\n", "\n# 演習\n"]
          marker = next((m for m in candidates if text.count(m) == 1), None)
          if marker is None:
              raise SystemExit("MT3 exercise marker not found uniquely")
          block = "\n".join(mt3_example) + "\n"
          p.write_text(text.replace(marker, "\n" + block + marker.lstrip("\n"), 1), encoding="utf-8")

          mt5_example = [
              "---",
              "",
              "## 15.5 定義の横断確認：二点離散空間",
              "",
              "<!-- definition-example-start: def-mt5-cc, def-mt5-radon, def-mt5-positive-functional, def-mt5-open-content, def-mt5-compact-content, def-mt5-outer-measure -->",
              "$X=\\{a,b\\}$ に離散位相を入れ、$L(f)=2f(a)+3f(b)$ とします。有限離散空間では全ての部分集合が open かつ compact で、全ての実数値関数が $C_c(X)$ に属します。",
              "",
              "**定義の確認**：$f\\ge0$ なら $L(f)\\ge0$ なので $L$ は正線形汎関数です。$\\mu=2\\delta_a+3\\delta_b$ は compact-finite で、内正則性・外正則性は各集合自身を compact/open 候補に取れば直ちに成立するため Radon 測度です。open $U$ では $1_U\\in C_c(X)$ を候補にでき、$0\\le f\\le1_U$ なら $L(f)\\le L(1_U)$ なので $m(U)=2\\,1_U(a)+3\\,1_U(b)=\\mu(U)$。同様に compact content は $m_K=\\mu(K)$ です。全ての $A\\subseteq X$ が open なので、外測度の定義でも $\\mu^*(A)=\\inf_{U\\supseteq A}m(U)=m(A)=\\mu(A)$。六つの定義が同じ模型で整合します。",
              "<!-- definition-example-end -->",
              "",
          ]
          insert_before("textbook/volumes/00_foundations/MT5/index.md", "\n# 演習\n", mt5_example)

          Path(".github/workflows/one-shot-mt5-definition-audit.yml").unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete MT2-MT5 definition audits and Pages links"
          git push origin HEAD:codex/mt5-radon-riesz-markov
