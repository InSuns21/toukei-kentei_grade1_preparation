name: Temporary MT4 final cleanup

on:
  push:
    branches:
      - codex/mt5-radon-riesz-markov

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mt5-radon-riesz-markov
          fetch-depth: 0
      - name: Canonicalize remaining RN link and remove this helper
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('textbook/volumes/00_foundations/MT4/index.md')
          s = p.read_text(encoding='utf-8')
          old = '[RN 定理](../MT3/index.md#thm-mt3-rn-finite)'
          new = '[RN 定理](../F0_00P2_密度_期待値_Radon_Nikodym/index.md#thm-f0-00p2-radon-nikodym)'
          if s.count(old) != 1:
              raise SystemExit(f'expected one stale RN link, got {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git rm .github/workflows/tmp-add-mt4-a04.yml
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook/volumes/00_foundations/MT4/index.md .github/workflows/tmp-add-mt4-a04.yml
          git commit -m 'fix(MT4): finish canonical references and cleanup'
          git push origin HEAD:codex/mt5-radon-riesz-markov
