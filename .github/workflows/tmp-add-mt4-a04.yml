name: Temporary MT4 A04 fix

on:
  push:
    branches:
      - codex/mt5-radon-riesz-markov

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      BLOCK_B64: 
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mt5-radon-riesz-markov
          fetch-depth: 0
      - name: Add one genuine Level A exercise to MT4
        run: |
          printf '%s' "$BLOCK_B64" | base64 -d > /tmp/mt4-a04.md
          python - <<'PY'
          from pathlib import Path
          p = Path('textbook/volumes/00_foundations/MT4/index.md')
          s = p.read_text(encoding='utf-8')
          marker = '\n### Level B\n'
          block = Path('/tmp/mt4-a04.md').read_text(encoding='utf-8')
          if s.count(marker) != 1:
              raise SystemExit(f'expected one Level B marker, got {s.count(marker)}')
          if 'ex-mt4-a04' in s:
              raise SystemExit('MT4-A04 already exists')
          p.write_text(s.replace(marker, '\n' + block + marker, 1), encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook/volumes/00_foundations/MT4/index.md
          git commit -m 'fix(MT4): add fourth Level A exercise'
          git push origin HEAD:codex/mt5-radon-riesz-markov
