name: Apply P4-01 content corrections

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-p4-01-content.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply corrections
        run: python scripts/patch_p4_01_once.py

      - name: Commit changes and remove one-time files
        shell: bash
        run: |
          rm .github/workflows/patch-p4-01-content.yml scripts/patch_p4_01_once.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook/volumes/02_distributions/P4_01_変数変換_順序統計量/index.md \
                  textbook/volumes/02_distributions/P4_01_変数変換_順序統計量/chapter.yaml \
                  textbook/style-guide.md \
                  .github/workflows/patch-p4-01-content.yml \
                  scripts/patch_p4_01_once.py
          git commit -m 'textbook: refine P4-01 exposition and add uniform-sum exercise'
          git push
