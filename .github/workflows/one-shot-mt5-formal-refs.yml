name: One-shot MT5 formal refs

on: [push]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mt5-radon-riesz-markov
          fetch-depth: 0

      - name: Apply formal reference fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def rep(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} match(es), got {actual}: {old[:80]!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          mt2 = "textbook/volumes/00_foundations/MT2/index.md"
          rep(mt2,
              "重要なのは、Hahn–Jordan 分解を後続の Radon–Nikodym 定理から逆輸入しないことです。依存の向きをこの章だけで閉じます。",
              "重要なのは、Hahn–Jordan 分解を後続の密度表示から逆輸入しないことです。依存の向きをこの章だけで閉じます。")
          rep(mt2,
              "[下からの連続性](#thm-mt2-continuity-below)",
              "[有限符号付き測度の下からの連続性](#thm-mt2-continuity-below)",
              count=2)
          rep(mt2,
              "Hahn 分解 $(P,N)$ を一つ固定します。",
              "[Hahn 分解](#thm-mt2-hahn) $(P,N)$ を一つ固定します。")
          rep(mt2,
              "Hahn 分解から作った $\\nu^+,\\nu^-$ が正測度で、",
              "[Hahn 分解](#thm-mt2-hahn)から作った $\\nu^+,\\nu^-$ が正測度で、")
          rep(mt2,
              "従って Hahn 分解から作った正負部分は $\\nu$ だけから決まり、Hahn 分解の選び方には依存しません。",
              "従って [Hahn 分解](#thm-mt2-hahn)から作った正負部分は $\\nu$ だけから決まり、その選び方には依存しません。")
          rep(mt2,
              "従って $(S,T)$ 自身が Hahn 分解です。上限表示、または Hahn 分解からの定義を使えば",
              "従って $(S,T)$ 自身が [Hahn 分解](#thm-mt2-hahn)です。上限表示、またはその分解からの定義を使えば")
          rep(mt2,
              "逆向きには Hahn 分解 $X=P\\sqcup N$ を使い、",
              "逆向きには [Hahn 分解](#thm-mt2-hahn) $X=P\\sqcup N$ を使い、")
          rep(mt2,
              "後続の Radon–Nikodym 定理では「符号付き測度が密度を持つ」方向を一般に証明します。ここでは逆に、密度が最初から与えられている場合だけを直接確認します。これは RN 定理を使っていません。",
              "後続章では「符号付き測度が密度を持つ」方向を一般に証明します。ここでは逆に、密度が最初から与えられている場合だけを直接確認し、後続結果は使いません。")
          rep(mt2,
              "したがって Jordan 分解から",
              "したがって [Jordan 分解](#thm-mt2-jordan)から")
          rep(mt2,
              "- Jordan 分解の存在・一意性・最小性",
              "- [Jordan 分解](#thm-mt2-jordan)の存在・一意性・最小性")
          rep(mt2,
              "Radon–Nikodym 定理は一度も使っていません。次の段階では、この章の Jordan 分解を使って符号付き測度の問題を正測度へ還元し、Radon–Nikodym と Lebesgue 分解を構成できます。",
              "後続の密度表示結果は一度も使っていません。次の段階では、この章の [Jordan 分解](#thm-mt2-jordan)を使って符号付き測度の問題を正測度へ還元し、密度表示と Lebesgue 分解を構成できます。")

          k2 = "textbook/volumes/00_foundations/MT2/knowledge.yaml"
          rep(k2,
              "aliases: [\"### 補題（下からの連続性）\"]\n    introduction_aliases: [\"### 補題（下からの連続性）\"]",
              "aliases: [有限符号付き測度の下からの連続性, \"### 補題（下からの連続性）\"]\n    introduction_aliases: [\"### 補題（下からの連続性）\"]")

          mt3 = "textbook/volumes/00_foundations/MT3/index.md"
          rep(mt3,
              "証明は関数解析の Riesz 表現定理を使いません。[MT2](../MT2/index.md) で構成した Hahn 分解を使い、測度論の内部だけで Radon–Nikodym 定理を証明します。",
              "証明は関数解析側の表現定理を使いません。[MT2 の Hahn 分解](../MT2/index.md#thm-mt2-hahn)を使い、測度論の内部だけで密度表示を構成します。")
          rep(mt3,
              "と置きます。単調収束定理より",
              "と置きます。[単調収束定理](../F0_00D2B_単調収束_Fatou_優収束/index.md#ref-limit-integral-exchange)より")
          rep(mt3,
              "$C_k$ 上の制限測度に有限版 RN 定理を適用すると、",
              "$C_k$ 上の制限測度に [§2 の有限正測度版](#thm-mt3-rn-finite)を適用すると、")
          rep(mt3,
              "一般の $h\\ge0$ については非負単関数列 $s_n\\uparrow h$ を取り、両方の測度に関する MCT を使って",
              "一般の $h\\ge0$ については非負単関数列 $s_n\\uparrow h$ を取り、両方の測度に関する [単調収束定理](../F0_00D2B_単調収束_Fatou_優収束/index.md#ref-limit-integral-exchange)を使って")
          rep(mt3,
              "$\\nu^+,\\nu^-$ は有限正測度なので σ-finite です。正測度版 RN 定理により非負可測関数 $f_+,f_-$ が存在して",
              "$\\nu^+,\\nu^-$ は有限正測度なので σ-finite です。[§3 の σ-finite 正測度版](#thm-mt3-rn-sigma-finite)により非負可測関数 $f_+,f_-$ が存在して")
          rep(mt3,
              "RN 定理から非負可測 $f,g$ が存在して",
              "[§3 の σ-finite 正測度版](#thm-mt3-rn-sigma-finite)から非負可測 $f,g$ が存在して")
          rep(mt3,
              "有限符号付き RN 定理から $f\\in L^1(\\mu)$ が存在して",
              "[§5 の有限符号付き測度版](#thm-mt3-rn-signed)から $f\\in L^1(\\mu)$ が存在して")
          rep(mt3,
              "- Hahn 分解を用いた残差消去",
              "- [Hahn 分解](../MT2/index.md#thm-mt2-hahn)を用いた残差消去")

          mt5 = "textbook/volumes/00_foundations/MT5/index.md"
          rep(mt5,
              "Carathéodory の定理によりこれは Borel 測度です。",
              "[Carathéodory の定理](../F0_00D3_外測度_Caratheodory可測性/index.md#thm-f0-00d3-caratheodory)によりこれは Borel 測度です。")

          k5 = "textbook/volumes/00_foundations/MT5/knowledge.yaml"
          rep(k5,
              "aliases: [C_c(X), compact support continuous functions]\n    introduction_aliases: [\"### 定義（        ）\"]",
              "aliases: [C_c(X), compact support continuous functions, \"### 定義（$C_c(X)$）\"]\n    introduction_aliases: [\"### 定義（        ）\", \"### 定義（$C_c(X)$）\"]")

          Path(".github/workflows/one-shot-mt5-formal-refs.yml").unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix MT2-MT5 formal references and raw aliases"
          git push origin HEAD:codex/mt5-radon-riesz-markov
