name: Apply last FOU5 concept fix

on:
  push:
    branches:
      - dream-theater/fou5-probability-dft-sampling

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace remaining ambiguous phrase
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('textbook/volumes/00_foundations/FOU5/index.md')
          s = p.read_text().replace('よって $Z=(0,2,0,2)$。逆変換は', 'よって $Z=(0,2,0,2)$。反転公式による復元は')
          p.write_text(s)
          PY
          git rm .github/workflows/fou5-fix4.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook/volumes/00_foundations/FOU5/index.md
          git commit -m 'fix: FOU5 の残存概念誤検出を解消'
          git push origin HEAD:dream-theater/fou5-probability-dft-sampling
