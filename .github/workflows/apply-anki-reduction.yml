name: Apply Anki reduction plan

on:
  push:
    branches: [main]
    paths:
      - 'anki/reduction-plan.yaml'

permissions:
  contents: write

concurrency:
  group: anki-reduction
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare gitignored source placeholders
        run: |
          mkdir -p pdfs/grade1_hani_20150508_2
          touch pdfs/MathStat_Answers.pdf
          touch pdfs/grade1_hani_20150508_2.pdf
          touch pdfs/grade1_hani_20150508_2/1.jpg
          touch pdfs/grade1_hani_20150508_2/2.jpg
          touch pdfs/grade1_hani_20150508_2/3.jpg
          touch pdfs/grade1_hani_20150508_2/4.jpg
          touch pdfs/statistics_grade1_card_titles_by_parent_priority.md

      - name: Apply reviewed reduction plan
        run: npm run anki:reduce

      - name: Validate Anki after reduction
        run: npm run anki:validate

      - name: Commit validated reduction
        shell: bash
        run: |
          if git diff --quiet -- anki/cards anki/archive anki/syllabus/coverage.yaml anki/progress.yaml; then
            echo 'No reduction changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add anki/cards anki/archive anki/syllabus/coverage.yaml anki/progress.yaml
          git commit -m 'apply reviewed Anki reduction plan'

          # Validation may regenerate tracked audit/build artifacts that are
          # intentionally not part of the reduction commit. Discard only those
          # remaining uncommitted changes before rebasing the validated commit.
          git reset --hard HEAD

          # main may advance while validation is running. Rebase the validated
          # bot commit onto the latest main before pushing so unrelated commits
          # do not turn a successful reduction into a non-fast-forward failure.
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              git rebase --abort || true
              echo 'Rebase conflict while publishing validated Anki reduction.' >&2
              exit 1
            fi
            echo "Push raced with another main update; retrying (${attempt}/3)." >&2
          done

          echo 'Failed to publish validated Anki reduction after 3 retries.' >&2
          exit 1
