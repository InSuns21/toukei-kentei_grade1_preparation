name: Validate LVT recursion
on:
  pull_request:
    paths:
      - 'textbook/volumes/dream_thater/計算系/LVT/LVT1-04/**'
      - '.github/workflows/validate-lvt-recursion.yml'
  push:
    branches: [main]
    paths:
      - 'textbook/volumes/dream_thater/計算系/LVT/LVT1-04/**'
      - '.github/workflows/validate-lvt-recursion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-recursion:
    name: Lean recursion and termination
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          lake-package-directory: 'textbook/volumes/dream_thater/計算系/LVT/LVT1-04/lab'
          auto-config: 'false'
          build: 'true'
          test: 'true'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - name: Verify version, evaluation and intended termination error
        working-directory: 'textbook/volumes/dream_thater/計算系/LVT/LVT1-04/lab'
        shell: bash
        run: |
          lean --version | grep -F 'version 4.35.0'
          lake env lean Inspect.lean | tee inspect.log
          diff -u <(printf '7\n1\n0\n0\n') inspect.log
          lake exe lvtRecursionDemo | grep -Fx 'LVT1-04 OK'
          lake env lean ExerciseSolutions.lean
          if lake env lean Failure.lean > failure.log 2>&1; then
            cat failure.log
            echo 'Expected termination error'
            exit 1
          fi
          cat failure.log
          grep -iF 'termination' failure.log
          grep -F 'loop' failure.log
