name: Temporary formal statement panel migration

on:
  push:
    branches:
      - refactor/formal-statement-panels
    paths:
      - 'scripts/tmp-migrate-formal-statements.mjs'
      - '.github/workflows/tmp-audit-formal-statements.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/formal-statement-panels
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Prepare migration helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/tmp-migrate-formal-statements.mjs')
          s=p.read_text()
          a=s.index('// Common authoring contract.')
          b=s.index('// Package scripts:')
          p.write_text(s[:a] + '// Common authoring contract is applied after migration.\n\n' + s[b:])
          PY
      - run: node scripts/tmp-migrate-formal-statements.mjs
      - name: Capture panel validator output
        run: |
          set +e
          npm run validate:formal-statements > tmp-formal-statement-validation.txt 2>&1
          cat tmp-formal-statement-validation.txt
          exit 0
      - name: Persist validation output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-formal-statement-validation.txt
          git commit -m 'record temporary formal statement validation output'
          git push
