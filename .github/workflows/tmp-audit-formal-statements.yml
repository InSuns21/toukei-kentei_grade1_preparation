name: Temporary formal statement markup audit

on:
  push:
    branches:
      - refactor/formal-statement-panels
    paths:
      - 'scripts/tmp-audit-formal-statements.mjs'
      - '.github/workflows/tmp-audit-formal-statements.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/formal-statement-panels
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/tmp-audit-formal-statements.mjs > tmp-formal-statement-audit.txt
      - run: cat tmp-formal-statement-audit.txt
      - name: Persist audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-formal-statement-audit.txt
          git commit -m 'record temporary formal statement audit'
          git push
