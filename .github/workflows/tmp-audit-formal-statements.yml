name: Temporary formal statement panel migration

on:
  push:
    branches:
      - refactor/formal-statement-panels
    paths:
      - 'scripts/tmp-migrate-formal-statements.mjs'
      - '.github/workflows/tmp-audit-formal-statements.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/formal-statement-panels
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Remove temporary guide-writing block from migration helper
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/tmp-migrate-formal-statements.mjs')
          s=p.read_text()
          a=s.index('// Common authoring contract.')
          b=s.index('// Package scripts:')
          p.write_text(s[:a] + '// Common authoring contract is applied after migration.\n\n' + s[b:])
          PY
      - name: Apply formal statement migration
        run: node scripts/tmp-migrate-formal-statements.mjs
      - name: Validate source and Pages
        run: |
          npm run validate
          npm run validate:pages
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pages textbook applied-rikou-80 statistical-mathematics scripts/validate-formal-statement-panels.mjs
          if git diff --cached --quiet; then
            echo 'No migration changes.'
          else
            git commit -m 'standardize formal statement panels and validation'
            git push
          fi
