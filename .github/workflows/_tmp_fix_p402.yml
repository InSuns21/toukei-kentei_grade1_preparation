name: One-shot P4-02 correction

on:
  push:
    paths:
      - '.github/workflows/_tmp_fix_p402.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python scripts/_tmp_fix_p402.py
      - name: Commit corrected textbook
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook/volumes/02_distributions/P4_02_確率変数の収束_大数則_中心極限定理/index.md
          git commit -m 'textbook: make P4-02 exercises self-contained'
          git push

# one-shot trigger
