name: Fix residual Fisher information wording

on:
  push:
    branches:
      - fix/mathstat-rikou80-terminology-full-audit

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mathstat-rikou80-terminology-full-audit
          fetch-depth: 0
      - name: Fix residual wording
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          roots = [
              Path('textbook/volumes/01_probability'),
              Path('textbook/volumes/02_distributions'),
              Path('textbook/volumes/03_inference'),
              Path('textbook/volumes/04_linear_models'),
              Path('textbook/volumes/05_engineering'),
              Path('statistical-mathematics'),
              Path('applied-rikou-80'),
          ]
          ignored = {'.git', 'node_modules', 'dist', 'build', 'sources', 'review'}
          pattern = re.compile(r'フィッシャー情報(?!量|行列)')
          changed = 0
          replacements = 0
          for root in roots:
              for p in root.rglob('*.md'):
                  if any(part in ignored for part in p.parts):
                      continue
                  s = p.read_text()
                  out, n = pattern.subn('フィッシャー情報量', s)
                  if n:
                      p.write_text(out)
                      changed += 1
                      replacements += n
          print(f'changed_files={changed} replacements={replacements}')
          PY
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook statistical-mathematics applied-rikou-80
          if git diff --cached --quiet; then
            echo 'No fixes needed'
          else
            git commit -m 'fix: normalize residual Fisher information wording'
            git push
          fi
