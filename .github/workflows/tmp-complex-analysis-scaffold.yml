          # CA4 Laurent展開・孤立特異点・留数定理

          > **実装状態**：定理文・例・演習を先行実装した draft。**証明は TODO**。留数計算だけを公式暗記にせず、Laurent 展開から留数が何を抽出しているかを主題にする。

          ## 1. Laurent 展開

          ### 定理 CA4-THM-01：Laurent 展開

          $f$ が環状領域 $r<|z-a|<R$ で正則なら

          $$
          f(z)=\sum_{n=-\infty}^{\infty}c_n(z-a)^n
          $$

          と一意に展開でき、係数は適切な円周 $|\zeta-a|=\rho$ 上で

          $$
          c_n=\frac1{2\pi i}\int_{|\zeta-a|=\rho}\frac{f(\zeta)}{(\zeta-a)^{n+1}}\,d\zeta
          $$

          と表される。

          **証明 TODO**：内側・外側の Cauchy 核をそれぞれ幾何級数展開し、一様収束で項別積分する。

          ## 2. 孤立特異点

          孤立特異点 $a$ の Laurent 主部により、可除特異点・極・真性特異点を分類する。

          ### 定理 CA4-THM-02：特異点分類

          - 負冪項が無い iff 可除特異点。
          - 負冪項が有限個で最高位が $(z-a)^{-m}$ iff $m$ 位の極。
          - 負冪項が無限個 iff 真性特異点。

          **証明 TODO**：有界性・零点の位数・Laurent 一意性を対応させる。

          ### 定理 CA4-THM-03：可除特異点定理

          孤立特異点の近傍で有界な正則関数はその点へ正則に延長できる。

          **証明 TODO**：Laurent の負係数が Cauchy 評価で消えることを示す。

          ## 3. 留数

          $c_{-1}$ を $f$ の $a$ における**留数** $\operatorname{Res}(f,a)$ と呼ぶ。

          ### 定理 CA4-THM-04：留数定理

          領域内の有限個の孤立特異点 $a_k$ を囲む適切な閉曲線 $\gamma$ に対し

          $$
          \int_\gamma f(z)\,dz
          =2\pi i\sum_k \operatorname{Ind}(\gamma,a_k)\operatorname{Res}(f,a_k).
          $$

          **証明 TODO**：特異点を小円でくり抜いた領域へ Cauchy の定理を適用し、境界向きを追跡する。

          ### 極での留数計算

          単純極なら

          $$
          \operatorname{Res}(f,a)=\lim_{z\to a}(z-a)f(z).
          $$

          $m$ 位の極なら導関数公式で計算できる。

          ## 4. 実積分への応用

          半円・鍵穴型 contour を使うと

          $$
          \int_{-\infty}^{\infty}\frac{dx}{1+x^2}=\pi
          $$

          などを複素積分へ移せる。大円弧の寄与を0とする箇所では、被積分関数の減衰と弧長の積を必ず評価する。

