          $$e^{x+iy}=e^x(\cos y+i\sin y).$$

          ### 定理 CA1-THM-04：複素指数関数
          $e^z$ は整関数で $(e^z)'=e^z$, $e^{z+w}=e^ze^w$, $e^{z+2\pi i}=e^z$、かつ零点を持たない。
