          # CA6 Möbius変換・Schwarz補題・調和関数・Poisson核

          > **実装状態**：複素解析から Fourier/PDE へ渡す発展標準章の draft。**定理の証明は TODO**。Riemann mapping theorem・Montel theorem はこの章では既知扱いせず、別の advanced-standard 拡張へ延期する。

          ## 1. Riemann 球面と Möbius 変換

          $$
          M(z)=\frac{az+b}{cz+d},\qquad ad-bc\ne0
          $$

          を Riemann 球面 $\widehat{\mathbb C}=\mathbb C\cup\{\infty\}$ 上の Möbius 変換として扱う。

          ### 定理 CA6-THM-01：Möbius 変換の基本性質

          Möbius 変換は全単射な等角写像で、逆写像も Möbius 変換である。また一般化円（円または直線）を一般化円へ写す。

          **証明 TODO**：行列表示と分数線形変換の直接計算、必要なら cross ratio を用いる。

          ## 2. Schwarz lemma

          ### 定理 CA6-THM-02：Schwarz lemma

          $f:\mathbb D\to\mathbb D$ が正則で $f(0)=0$ なら

          $$
          |f(z)|\le|z|,\qquad |f'(0)|\le1.
          $$

          どこかで等号が成立する非自明な場合、$f(z)=e^{i\theta}z$ である。

          **証明 TODO**：$g(z)=f(z)/z$ の可除特異点を埋め、最大値原理を半径 $r<1$ の円板で適用して $r\uparrow1$ とする。

          ### 系 CA6-COR-01：円板自己同型

          単位円板の正則自己同型は

          $$
          e^{i\theta}\frac{z-a}{1-\bar a z}
          $$

          の形で尽くされる。

          **証明 TODO**：$a$ を0へ送る Möbius 変換と Schwarz lemma を合成する。

          ## 3. 調和関数

          $u\in C^2$ が

          $$
          \Delta u=u_{xx}+u_{yy}=0
          $$

          を満たすとき調和関数という。

          ### 定理 CA6-THM-03：正則関数の実部・虚部は調和的

          $f=u+iv$ が正則なら $u,v$ は調和関数である。

          **証明 TODO**：CA3 により正則関数が十分滑らかであることを先に確保し、Cauchy–Riemann を微分して混合偏導関数を相殺する。

          ### 定理 CA6-THM-04：平均値性質と最大値原理（調和版）

          調和関数は円周平均で中心値を表せる。その結果、非定数調和関数は内部最大・最小を取らない。

          **証明 TODO**：正則関数の実部として局所表示する方法と、直接 Green 型計算を使う方法の依存を比較して採用する。

          ## 4. Poisson kernel

          単位円板では

          $$
          P_r(\theta)=\frac{1-r^2}{1-2r\cos\theta+r^2}
          $$

          を Poisson kernel とする。

          ### 定理 CA6-THM-05：Poisson integral

          連続境界データ $g$ に対し

          $$
          u(re^{i\theta})=\frac1{2\pi}\int_{-\pi}^{\pi}P_r(\theta-t)g(e^{it})\,dt
          $$

          は円板内で調和的で、$r\uparrow1$ で境界値 $g$ へ適切に収束する。

          **証明 TODO**：$P_r\ge0$、平均1、質量が $0$ 近傍へ集中する approximate identity の3性質を分離して証明する。

          > $P_r$ の Fourier 級数
          > $$P_r(\theta)=1+2\sum_{n\ge1}r^n\cos(n\theta)$$
          > は複素解析と Fourier 解析の直接の接点になる。後の標準 Fourier 系列ではここを正本として参照できる。

          ## 5. この章の境界

          Riemann mapping theorem、normal family、Montel theorem は重要だが、関数族のコンパクト性を本格的に使う。RA8 と接続した advanced-standard 章として後で追加し、この章では証明なしに使用しない。

