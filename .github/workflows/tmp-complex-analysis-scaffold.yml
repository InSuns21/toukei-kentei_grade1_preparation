          'CA5': r'''
          # CA5 零点・偏角原理・Rouché・解析接続

          > **実装状態**：標準複素解析の大域的な零点計数と解析接続をまとめる draft。**定理の証明は TODO**。

          ## 1. winding number / index

          閉曲線 $\gamma$ と $a\notin\gamma$ に対し

          $$
          \operatorname{Ind}(\gamma,a)
          =\frac1{2\pi i}\int_\gamma\frac{dz}{z-a}
          $$

          を $a$ のまわりの winding number とする。

          ### 定理 CA5-THM-01：index の整数値性と局所定数性

          $\operatorname{Ind}(\gamma,a)$ は整数で、$\mathbb C\setminus\gamma$ の各連結成分上で一定であり、非有界成分では0である。

          **証明 TODO**：対数の局所枝または曲線上の偏角持ち上げを構成し、終点での偏角差が $2\pi\mathbb Z$ に入ることを示す。

          ## 2. 偏角原理

          ### 定理 CA5-THM-02：偏角原理

          $f$ が閉曲線とその内部で meromorphic で、曲線上に零点・極を持たないなら

          $$
          \frac1{2\pi i}\int_\gamma\frac{f'(z)}{f(z)}\,dz
          =N-P
          $$

          （零点・極を重複度込みで数え、一般には index で重み付け）となる。

          **証明 TODO**：零点・極の局所因数分解から $f'/f$ の留数を計算する。

          ## 3. Rouché の定理

          ### 定理 CA5-THM-03：Rouché

          単純閉曲線 $\gamma$ 上で

          $$
          |g(z)|<|f(z)|
          $$

          が成り立ち、$f,g$ が曲線と内部で正則なら、$f$ と $f+g$ は内部に同数の零点を重複度込みで持つ。

          **証明 TODO**：$f+t g$ が曲線上で0にならないことを示し、偏角原理の積分値が $t$ に連続かつ整数値なので一定であることを使う。

          ## 4. 解析接続

          正則関数の芽を重なり合う領域へ恒等定理で一意に延ばす操作を解析接続と呼ぶ。

          ### 定理 CA5-THM-04：解析接続の一意性

          連結した重なりを通じた解析接続は、存在する限り恒等定理により一意である。

          **証明 TODO**：一致集合の開閉性または恒等定理の逐次適用で示す。

          ### 定理 CA5-THM-05：monodromy theorem（標準形）

          単連結領域で局所解析接続が全経路に沿って可能なら、解析接続は経路に依存せず一価の正則関数を与える。

