          区分的 $C^1$ 曲線 $\gamma:[a,b]\to\Omega$ に対し

          $$
          \int_\gamma f(z)\,dz
          :=\int_a^b f(\gamma(t))\gamma'(t)\,dt
          $$

          と定義する。右辺は実変数 Riemann 積分を実部・虚部ごとに取ったものとする。

          ### 定理 CA2-THM-01：再パラメータ化と ML 評価

          向きを保つ $C^1$ 再パラメータ化で線積分は不変であり、曲線長を $L(\gamma)$ とすると

          $$
          \left|\int_\gamma f(z)\,dz\right|
          \le L(\gamma)\max_{z\in\gamma([a,b])}|f(z)|.
          $$

          **証明 TODO**：実積分の置換と三角不等式を局所的に使用する。

          ## 2. 原始関数と経路独立性

          $F'=f$ を満たす正則関数 $F$ を $f$ の**原始関数**という。

          ### 定理 CA2-THM-02：複素線積分の基本定理

          $F'=f$ なら

          $$
          \int_\gamma f(z)\,dz=F(\gamma(b))-F(\gamma(a)).
          $$

          よって閉曲線上の積分は0である。

          **証明 TODO**：$F(\gamma(t))$ の連鎖律を実変数の FTC へ接続する。

          ### 定理 CA2-THM-03：経路独立性と原始関数

          領域 $\Omega$ 上の連続関数 $f$ について、任意の閉曲線で積分が0であること、端点だけで線積分値が決まること、$f$ が原始関数を持つことは適切な経路連結性の下で同値である。

          **証明 TODO**：基点からの積分で $F$ を定義し、微分可能性を小線分積分の評価から示す。

          ## 3. Cauchy–Goursat

          ### 定理 CA2-THM-04：三角形版 Cauchy–Goursat

          三角形 $\Delta$ とその近傍で $f$ が正則なら

          $$
          \int_{\partial\Delta}f(z)\,dz=0.
          $$

          **証明 TODO**：三角形を4分割する反復構成と、複素微分可能性から得る局所一次近似を用いる。偏導関数の連続性を追加仮定して逃げない Goursat 型で実装する。

          ### 定理 CA2-THM-05：星型領域の Cauchy の定理

          $\Omega$ が星型で $f$ が正則なら、$f$ は原始関数を持ち、任意の閉曲線 $\gamma$ に対して $\int_\gamma f\,dz=0$。

          **証明 TODO**：三角形版から基点を頂点にした積分で原始関数を構成する。

          ## 4. 穴がある領域

          単位円 $\gamma(t)=e^{it}$ について直接計算すると

          $$
          \int_\gamma \frac{dz}{z}=2\pi i.
          $$

          したがって $1/z$ は $\mathbb C\setminus\{0\}$ 全体では原始関数を持たない。局所的に正則であることと、大域的に原始関数を持つことの間には領域の位相が入る。

          ### 定理 CA2-THM-06：対数の枝

          単連結領域 $\Omega\subset\mathbb C\setminus\{0\}$ では、適切な Cauchy 定理を前提に $1/z$ の原始関数を取り、$e^{L(z)}=z$ を満たす正則な対数の枝 $L$ を構成できる。

          **証明 TODO**：単連結性から閉曲線積分0を得る段階をブラックボックス化せず、必要なホモトピー版 Cauchy 定理を先に実装する。

          ## 演習

          - Level: A — 線分 $0\to1+i$ 上で $\int z\,dz$ を計算せよ。
          - Level: A — 単位円上で $\int z^n\,dz$ を整数 $n$ ごとに計算せよ。
          - Level: A — 逆向き曲線で線積分の符号が反転することを示せ。
          - Level: A — ML 評価を使って短い円弧上の積分を評価せよ。
          - Level: B — 原始関数が存在すれば閉曲線積分が0になることを示せ。
          - Level: B — $1/z$ が $\mathbb C\setminus\{0\}$ で原始関数を持たないことを単位円積分から示せ。
          - Level: B — 星型領域で基点からの積分が経路に依存しないことから原始関数を構成せよ。
          - Level: C — $\mathbb C\setminus(-\infty,0]$ 上で主値対数を構成し、その導関数が $1/z$ であることを示せ。
          ''',
          'CA3': r'''
          # CA3 Cauchy積分公式・Taylor展開・Liouville・最大値原理

          > **実装状態**：FA5 の正式前提になる中核章の draft。定理文・論理順を先に固定し、**証明は TODO**。FA5 はこの章の証明完成後に実装する。

          ## 1. Cauchy 積分公式

          ### 定理 CA3-THM-01：Cauchy 積分公式

          $f$ が円板 $\overline{D(a,R)}$ を含む開集合で正則なら、$|z-a|<R$ に対して

          $$
          f(z)=\frac{1}{2\pi i}\int_{|\zeta-a|=R}\frac{f(\zeta)}{\zeta-z}\,d\zeta.
          $$

          **証明 TODO**：$\frac{f(\zeta)-f(z)}{\zeta-z}$ の可除特異性と Cauchy の定理を使い、$1/(\zeta-z)$ の円周積分を直接計算する。

          ### 定理 CA3-THM-02：高階導関数公式

          正則関数は無限回複素微分可能で

          $$
          f^{(n)}(z)=\frac{n!}{2\pi i}\int_{|\zeta-a|=R}\frac{f(\zeta)}{(\zeta-z)^{n+1}}\,d\zeta
