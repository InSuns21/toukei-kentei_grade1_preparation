          ## CA2 複素線積分・原始関数・Cauchy–Goursat `core`

          - 区分的 $C^1$ 曲線、複素線積分、ML 評価
          - 原始関数・経路独立性
          - 三角形版 Cauchy–Goursat と星型領域への拡張
          - $1/z$、穴のある領域、対数の枝

          ## CA3 Cauchy積分公式・Taylor展開・Liouville・最大値原理 `core`

          - Cauchy 積分公式・高階導関数公式
          - 正則 $\Rightarrow$ 局所べき級数展開
          - Cauchy 評価、Liouville、代数学の基本定理
          - 零点の孤立性・恒等定理・最大値原理・複素解析の開写像定理
          - **FA5 のスペクトル非空性はこの章へ正式依存する**

          ## CA4 Laurent展開・孤立特異点・留数定理 `core`

          - annulus 上の Laurent 展開
          - 可除特異点・極・真性特異点
          - residue と residue theorem
          - contour による実積分・Fourier transform の具体例

          ## CA5 偏角原理・Rouché・解析接続 `core / advanced-standard`

          - winding number / index
          - argument principle
          - Rouché theorem
          - analytic continuation と monodromy

          ## CA6 Möbius変換・Schwarz補題・調和関数・Poisson核 `advanced-standard / bridge`

          - Riemann sphere と Möbius transformation
          - Schwarz lemma、円板自己同型
          - 正則関数の実部・虚部と harmonic function
          - Poisson kernel / Poisson integral
          - Fourier 級数・Dirichlet 問題への直接接続

          **証明境界**：Riemann mapping theorem、normal family、Montel theorem はここで名前だけ既知扱いしません。RA8 の関数族コンパクト性と接続する advanced-standard 拡張として後段に回します。

          ---

          # 8. 関数解析：標準三大定理の先まで
