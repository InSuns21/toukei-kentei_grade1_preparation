name: Temporary complex analysis scaffold

on:
  push:
    branches:
      - codex/complex-analysis-core-scaffold
    paths:
      - '.github/workflows/tmp-complex-analysis-scaffold.yml'

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/complex-analysis-core-scaffold
      - name: Write complex analysis scaffold
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          def write(path, content):
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(textwrap.dedent(content).lstrip(), encoding='utf-8')

          chapters = {
          'CA1': r'''
          # CA1 複素微分・Cauchy–Riemann・初等正則関数

          > **実装状態**：章構造・定義・定理文・例・演習を先に固定した draft です。**定理の証明は TODO** とし、後続フェーズで本文から再構成できる密度まで実装します。証明未実装のまま標準コアの `implemented` にはしません。

          ## この章の役割

          実変数の微分可能性と複素微分可能性は別物である。複素微分では差商を複素平面の**あらゆる方向**から近づける必要があり、その強さが Cauchy–Riemann 方程式と正則関数の剛性を生む。本章では、後の Cauchy 理論・Fourier 解析・作用素の resolvent に必要な複素指数関数までを準備する。

          ## 1. 複素微分と正則性

          開集合 $\Omega\subset\mathbb C$ と $f:\Omega\to\mathbb C$ を考える。$z_0\in\Omega$ で

          $$
          f'(z_0)=\lim_{h\to0}\frac{f(z_0+h)-f(z_0)}{h}
          $$

          が複素数として存在するとき、$f$ は $z_0$ で**複素微分可能**という。$\Omega$ の各点で複素微分可能なら **正則（holomorphic）**、$\mathbb C$ 全体で正則なら **整関数（entire）** という。

          ### 定理 CA1-THM-01：微分法則

          複素微分可能な関数について和・積・商（分母非零）・合成の微分法則が実変数と同じ形で成り立つ。

          **証明 TODO**：差商の分解と $h\to0$ の量化を省略せず実装する。

          ## 2. Cauchy–Riemann 方程式

          $z=x+iy$ として

          $$
          f(z)=u(x,y)+iv(x,y)
          $$

          と書く。

          ### 定理 CA1-THM-02：複素微分可能性から Cauchy–Riemann へ

          $f$ が $z_0=x_0+iy_0$ で複素微分可能なら、対応する偏微分が存在し

          $$
          u_x=v_y,\qquad u_y=-v_x
          $$

          が $(x_0,y_0)$ で成立する。また

          $$
          f'(z_0)=u_x+iv_x=v_y-iu_y.
          $$

          **証明 TODO**：$h\in\mathbb R$ と $h=it$ の二方向から同じ差商極限を見る。

          ### 定理 CA1-THM-03：Cauchy–Riemann の十分条件

          $u,v$ の一階偏導関数が $z_0$ の近傍で存在して $z_0$ で連続であり、Cauchy–Riemann 方程式を $z_0$ で満たすなら $f$ は $z_0$ で複素微分可能である。

          **証明 TODO**：増分を $x$ 方向と $y$ 方向へ分け、実変数の平均値型評価から $o(|h|)$ を作る。

          > Cauchy–Riemann 方程式を一点で満たすだけでは十分ではない。十分条件に置いた偏導関数の局所的制御を消してはいけない。

          ## 3. Wirtinger 微分

          形式的に

          $$
          \partial_z=\frac12(\partial_x-i\partial_y),\qquad
          \partial_{\bar z}=\frac12(\partial_x+i\partial_y)
          $$

          と置くと、$C^1$ 級関数について Cauchy–Riemann 方程式は $\partial_{\bar z}f=0$ と同値になる。

          ### 例

          - $f(z)=z^n$ は正則で $f'(z)=nz^{n-1}$。
          - $f(z)=\bar z$ はどの点でも正則ではない。実軸方向と虚軸方向の差商が一致しない。
          - $f(z)=|z|^2$ は $z=0$ では複素微分可能だが、どの近傍でも正則ではない。「一点で微分可能」と「正則」は大きく違う。

          ## 4. 複素指数・三角関数

          $$
          e^{x+iy}=e^x(\cos y+i\sin y)
          $$

          と定義する。

          ### 定理 CA1-THM-04：複素指数関数

          $e^z$ は整関数で

          $$
          (e^z)'=e^z,\qquad e^{z+w}=e^ze^w,\qquad e^{z+2\pi i}=e^z
          $$

          を満たし、零点を持たない。

          **証明 TODO**：実指数・三角関数の加法定理と Cauchy–Riemann を用いて閉じる。

          $\cos z=(e^{iz}+e^{-iz})/2$, $\sin z=(e^{iz}-e^{-iz})/(2i)$ と定義する。これは Fourier 解析で使う $e^{inx}$ の正本となる。

          ## 演習

          - Level: A — $f(z)=z^3-2z+1$ の導関数を定義から確認せよ。
          - Level: A — $f(z)=\bar z$ の差商を実方向・虚方向から計算せよ。
          - Level: A — $f(z)=|z|^2$ が $0$ でのみ複素微分可能であることを示せ。
          - Level: A — $e^{z+2\pi i}=e^z$ を定義から示せ。
          - Level: B — $f(z)=u+iv$ が $C^1$ で Cauchy–Riemann を満たすとき、$f'$ の式を導け。
          - Level: B — $z\mapsto 1/z$ が $\mathbb C\setminus\{0\}$ で正則であることを示せ。
          - Level: B — $\sin z$ と $\cos z$ の導関数・加法公式を複素指数から導け。
          - Level: C — $f$ と $\bar f$ が同じ連結開集合上でともに正則なら $f$ は定数であることを示せ（後半では導関数0から定数を得る実変数の議論を使ってよい）。
          ''',
          'CA2': r'''
          # CA2 複素線積分・原始関数・Cauchy–Goursat

          > **実装状態**：定義・定理文・例・演習を固定した draft。**定理の証明は TODO**。特に Cauchy–Goursat は「既知」と書くだけで済ませず、三角形版から一般領域へ何を使って拡張するかを後続フェーズで明示する。

