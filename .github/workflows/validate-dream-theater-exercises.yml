name: Validate DREAM THEATER exercises

on:
  pull_request:
    paths:
      - 'textbook/dream-theater-index.json'
      - 'textbook/DREAM_THEATER_EXERCISE_POLICY.md'
      - 'textbook/volumes/**'
      - 'scripts/validate-dream-theater-exercise-counts.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-dream-theater-exercises.yml'
  push:
    branches:
      - main
    paths:
      - 'textbook/dream-theater-index.json'
      - 'textbook/DREAM_THEATER_EXERCISE_POLICY.md'
      - 'textbook/volumes/**'
      - 'scripts/validate-dream-theater-exercise-counts.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-dream-theater-exercises.yml'
  workflow_dispatch:

jobs:
  validate-dream-theater-exercises:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate changed DREAM THEATER exercise counts
        env:
          DREAM_THEATER_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run validate:dream-theater-exercise-counts
