name: Validate DREAM THEATER exercises

on:
  pull_request:
    paths:
      - 'textbook/dream-theater-index.json'
      - 'textbook/DREAM_THEATER_EXERCISE_POLICY.md'
      - 'textbook/volumes/**'
      - 'scripts/validate-dream-theater-exercise-counts.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-dream-theater-exercises.yml'
  push:
    branches:
      - main
    paths:
      - 'textbook/dream-theater-index.json'
      - 'textbook/DREAM_THEATER_EXERCISE_POLICY.md'
      - 'textbook/volumes/**'
      - 'scripts/validate-dream-theater-exercise-counts.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-dream-theater-exercises.yml'
  workflow_dispatch:

jobs:
  validate-dream-theater-exercises:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve PR merge-base parent for diff validation
        if: github.event_name == 'pull_request'
        run: echo "PR_COMPARISON_SHA=$(git rev-parse HEAD^1)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate changed DREAM THEATER exercise counts
        env:
          DREAM_THEATER_BASE_SHA: ${{ env.PR_COMPARISON_SHA || github.event.before }}
        run: npm run validate:dream-theater-exercise-counts
