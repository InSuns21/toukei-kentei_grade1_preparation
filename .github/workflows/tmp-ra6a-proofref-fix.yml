name: Temporary RA6A proof-reference fix

on:
  push:
    branches:
      - feat/ra6a-inverse-implicit-function

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ra6a-inverse-implicit-function
          fetch-depth: 0
      - name: Fix RA6A proof references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('textbook/volumes/00_foundations/RA6A/index.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('へ逆関数定理を適用して得られます。この一本の流れを証明まで追うことが本章の主題です。', 'の局所可逆性を調べることで導きます。この一本の流れを証明まで追うことが本章の主題です。', 1)
          s = s.replace('各成分に一変数の微積分学の基本定理を適用すると', '各成分に [微積分学の基本定理II](../RA4/index.md#thm-ra4-ftc2) を適用すると', 1)
          s = s.replace('Section 7 の接空間公式から', '[正則レベル集合の接空間公式](#cor-ra6a-regular-level-set)から', 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add textbook/volumes/00_foundations/RA6A/index.md
          if ! git diff --cached --quiet; then
            git commit -m "fix: link RA6A proof dependencies [ra6a-proofref-fix]"
            git push origin HEAD:feat/ra6a-inverse-implicit-function
          fi
