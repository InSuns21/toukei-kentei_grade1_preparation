name: CA4 Pages math link fix

on:
  push:
    branches:
      - codex/ca4-laurent-residue-rouche
    paths:
      - .github/workflows/ca4-pages-math-link-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/ca4-laurent-residue-rouche
          fetch-depth: 0
      - name: Avoid Markdown link parsing in CA4 displays
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('textbook/volumes/00_foundations/CA4/index.md')
          s = p.read_text(encoding='utf-8')
          old = '](z-a)'
          new = ']\\,(z-a)'
          count = s.count(old)
          if count != 4:
              raise SystemExit(f'expected four false-link targets, found {count}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          Path('.github/workflows/ca4-pages-math-link-fix.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Avoid false Pages links in CA4 math displays"
          git push origin HEAD:codex/ca4-laurent-residue-rouche
