name: Apply self-contained statement policy

on:
  push:
    branches:
      - fix/f0-batch0-reader-blockers
    paths:
      - 'scripts/apply-statement-self-contained-policy.mjs'
      - '.github/workflows/apply-statement-self-contained-policy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: fix/f0-batch0-reader-blockers
          fetch-depth: 0

      - name: Apply policy
        run: node scripts/apply-statement-self-contained-policy.mjs

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CONTENT_GUIDELINES.md textbook/f0-dream-theater-content-exercise-audit.md
          git commit -m 'docs: require self-contained mathematical statements'
          git push origin HEAD:fix/f0-batch0-reader-blockers
