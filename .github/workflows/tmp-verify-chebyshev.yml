name: Verify Chebyshev terminology sweep

on:
  push:
    branches:
      - fix/chebyshev-existing-usage

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/chebyshev-existing-usage
          fetch-depth: 0

      - name: Fix adjacent convergence typo
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'textbook/volumes/02_distributions/P4_02_確率変数の収束_大数則_中心極限定理/index.md';
          const before = fs.readFileSync(file, 'utf8');
          const from = '\\frac{\\sigma^2}{n\\varepsilon^2}o0.';
          const to = '\\frac{\\sigma^2}{n\\varepsilon^2}\\to0.';
          if (!before.includes(from)) throw new Error('expected typo not found');
          fs.writeFileSync(file, before.replace(from, to));
          NODE

      - name: Full Chebyshev terminology scan
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const roots = ['statistical-mathematics', 'applied-rikou-80', 'textbook/volumes', 'anki/cards'];
          const ignored = new Set(['.git', 'node_modules', 'dist', 'build', 'sources', 'review']);
          const bad = [
            /Chebyshev\s*(?:の\s*)?不等式/g,
            /チェビシェフ\s*不等式/g,
            /チェビシェフ\s+の\s*不等式/g,
          ];
          const findings = [];
          function walk(dir) {
            if (!fs.existsSync(dir)) return;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (ignored.has(entry.name)) continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile() && full.endsWith('.md')) {
                const text = fs.readFileSync(full, 'utf8');
                for (const pattern of bad) {
                  pattern.lastIndex = 0;
                  for (const match of text.matchAll(pattern)) findings.push(`${full}: ${match[0]}`);
                }
              }
            }
          }
          roots.forEach(walk);
          if (findings.length) {
            console.error(findings.join('\n'));
            process.exit(1);
          }
          console.log('Chebyshev terminology full scan: 0 forbidden occurrences');
          NODE

      - name: Remove one-off workflow and commit
        shell: bash
        run: |
          rm .github/workflows/tmp-verify-chebyshev.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: 大数の法則の収束記号を修正"
          git push origin HEAD:fix/chebyshev-existing-usage
