name: Validate statistical-mathematics KaTeX

on:
  push:
    branches:
      - main
    paths:
      - 'statistical-mathematics/**'
      - 'scripts/validate_math.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-mathstat-katex.yml'
  pull_request:
    paths:
      - 'statistical-mathematics/**'
      - 'scripts/validate_math.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-mathstat-katex.yml'

jobs:
  validate-katex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate statistical-mathematics KaTeX
        run: npm run validate:mathstat
