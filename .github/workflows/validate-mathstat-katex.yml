name: Validate statistical-mathematics

on:
  push:
    branches:
      - main
    paths:
      - 'statistical-mathematics/**'
      - 'EXERCISE_GUIDELINES.md'
      - 'scripts/validate_math.mjs'
      - 'scripts/validate_exercise_style.mjs'
      - 'scripts/audit_solution_granularity.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-mathstat-katex.yml'
  pull_request:
    paths:
      - 'statistical-mathematics/**'
      - 'EXERCISE_GUIDELINES.md'
      - 'scripts/validate_math.mjs'
      - 'scripts/validate_exercise_style.mjs'
      - 'scripts/audit_solution_granularity.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-mathstat-katex.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate statistical-mathematics KaTeX
        run: npm run validate:mathstat

      - name: Validate shared exercise terminology
        run: npm run validate:exercise-style

      - name: Audit solution granularity
        run: npm run audit:granularity
