name: One-shot MT concept DAG fix

on:
  push:
    branches:
      - codex/mt5-radon-riesz-markov
    paths:
      - .github/workflows/fix-mt-concept-dag-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mt5-radon-riesz-markov
          fetch-depth: 0
      - name: Apply targeted concept-DAG fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              actual = s.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {actual}: {old!r}')
              p.write_text(s.replace(old, new, count), encoding='utf-8')

          # MT2: do not import MT1 merely for a retrospective comparison.
          replace(
              'textbook/volumes/00_foundations/MT2/index.md',
              '正の測度の上からの連続性で必要だった「最初の集合の測度が有限」という条件がここに現れないのは、',
              '正の測度で減少列の極限を通す際に必要だった「最初の集合の測度が有限」という条件がここに現れないのは、'
          )
          # The generic phrase belongs to the local signed-measure definition on this page.
          replace(
              'textbook/volumes/00_foundations/MT2/knowledge.yaml',
              '    aliases: [符号付き測度の絶対連続性, "### 定義（符号付き測度の絶対連続性）"]',
              '    aliases: [符号付き測度の絶対連続性, 測度の絶対連続性, "### 定義（符号付き測度の絶対連続性）"]'
          )

          # MT3: short English tokens come from local RN vocabulary/anchors, not
          # ordinary differentiation or order-theoretic chains.
          replace(
              'textbook/volumes/00_foundations/MT3/knowledge.yaml',
              '    aliases: ["### 定義（Radon–Nikodym 微分）"]',
              '    aliases: ["### 定義（Radon–Nikodym 微分）", derivative]'
          )
          replace(
              'textbook/volumes/00_foundations/MT3/knowledge.yaml',
              '    aliases: [Radon–Nikodym 微分の chain rule, RN微分のchain rule]',
              '    aliases: [Radon–Nikodym 微分の chain rule, RN微分のchain rule, chain]'
          )

          # MT4 genuinely uses ordinary derivatives; RA3 also reaches RA2, which
          # supplies the already-used uniform-continuity concept.
          replace(
              'textbook/volumes/00_foundations/MT4/knowledge.yaml',
              '  - F0-00D2B\n\nforward_references:',
              '  - F0-00D2B\n  - RA3\n\nforward_references:'
          )

          # Reader-source normalization removes inline math. Make formal headings
          # themselves math-free, and keep knowledge aliases/introduction aliases exact.
          index_heading_pairs = [
              ('### 補題（$C_c(\\mathbb R)$ の $L^1$ 稠密性）', '### 補題（Cc(R) の L1 稠密性）'),
              ('### 定理（Hardy–Littlewood maximal 弱 $(1,1)$ 評価）', '### 定理（Hardy–Littlewood maximal の弱 (1,1) 評価）'),
              ('### 定理（Lebesgue 微分定理：$L^1(\\mathbb R)$ 版）', '### 定理（Lebesgue 微分定理：L1(R) 版）'),
              ('### 系（$L^1_{\\mathrm{loc}}$ 版）', '### 系（L1loc 版）'),
              ('### 定理（$L^1$ 不定積分の絶対連続性）', '### 定理（L1 不定積分の絶対連続性）'),
              ('### 定理（AC $\\Rightarrow$ BV）', '### 定理（AC なら BV）'),
          ]
          for old, new in index_heading_pairs:
              replace('textbook/volumes/00_foundations/MT4/index.md', old, new)

          knowledge_heading_pairs = [
              ('### 補題（$C_c(\\\\mathbb R)$ の $L^1$ 稠密性）', '### 補題（Cc(R) の L1 稠密性）'),
              ('### 定理（Hardy–Littlewood maximal 弱 $(1,1)$ 評価）', '### 定理（Hardy–Littlewood maximal の弱 (1,1) 評価）'),
              ('### 定理（Lebesgue 微分定理：$L^1(\\\\mathbb R)$ 版）', '### 定理（Lebesgue 微分定理：L1(R) 版）'),
              ('### 系（$L^1_{\\\\mathrm{loc}}$ 版）', '### 系（L1loc 版）'),
              ('### 定理（$L^1$ 不定積分の絶対連続性）', '### 定理（L1 不定積分の絶対連続性）'),
              ('### 定理（AC $\\\\Rightarrow$ BV）', '### 定理（AC なら BV）'),
          ]
          for old, new in knowledge_heading_pairs:
              replace('textbook/volumes/00_foundations/MT4/knowledge.yaml', old, new, count=2)

          # Strict declaration scanning also notices these narrative section headings.
          # Register them as aliases only; formal introductions stay on the ### lines.
          section_aliases = [
              ('    aliases: ["### 補題（有限区間族からの互いに素な選択）"]',
               '    aliases: ["### 補題（有限区間族からの互いに素な選択）", "## 3. 1次元区間選択補題"]'),
              ('    aliases: ["### 定理（Lebesgue 微分定理：L1(R) 版）"]',
               '    aliases: ["### 定理（Lebesgue 微分定理：L1(R) 版）", "## 5. Lebesgue 微分定理"]'),
              ('    aliases: ["### 定理（Lebesgue 密度定理）"]',
               '    aliases: ["### 定理（Lebesgue 密度定理）", "## 6. Lebesgue 密度定理"]'),
              ('    aliases: ["### 定理（絶対連続関数の基本定理）"]',
               '    aliases: ["### 定理（絶対連続関数の基本定理）", "## 12. AC 版の微積分学の基本定理"]'),
          ]
          for old, new in section_aliases:
              replace('textbook/volumes/00_foundations/MT4/knowledge.yaml', old, new)

          # AC means absolute continuity locally, not Axiom of Choice.
          replace(
              'textbook/volumes/00_foundations/MT4/knowledge.yaml',
              '    aliases: ["### 定義（絶対連続関数）"]',
              '    aliases: [AC, "### 定義（絶対連続関数）"]'
          )

          # Cantor-function proof only needs the explicit interval components of
          # the complement; avoid importing general connected-component theory.
          replace(
              'textbook/volumes/00_foundations/MT4/index.md',
              'Cantor 集合の補集合では各連結成分上で局所的に定数なので',
              'Cantor 集合の補集合をなす各開区間上で局所的に定数なので'
          )
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/fix-mt-concept-dag-once.yml
          git add textbook/volumes/00_foundations/MT2 textbook/volumes/00_foundations/MT3 textbook/volumes/00_foundations/MT4
          git diff --cached --check
          git commit -m "fix: resolve MT concept DAG collisions"
          git push origin HEAD:codex/mt5-radon-riesz-markov
