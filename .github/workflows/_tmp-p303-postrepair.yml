name: Temporary P3-03 scoped post-review repair

on:
  push:
    paths:
      - 'scripts/_tmp_p303_postrepair.py'
      - '.github/workflows/_tmp-p303-postrepair.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Apply scoped repair
        run: python scripts/_tmp_p303_postrepair.py
      - name: Install dependencies
        run: npm ci
      - name: Validate textbook
        run: npm run validate
      - name: Validate changed terminology
        run: npm run validate:terminology:changed
      - name: Audit textbook solution granularity
        run: npm run audit:textbook-granularity
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook/volumes/02_distributions/P3_03_多変量分布_条件付き分布/index.md
          git diff --cached --check
          git commit -m 'repair P3-03 notation and derivation detail'
          git push
