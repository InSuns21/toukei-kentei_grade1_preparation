name: Audit PDE5 pedagogy

on:
  push:
    branches:
      - dream-theater/pde5-laplace-poisson
    paths:
      - 'textbook/volumes/00_foundations/PDE5/**'
      - '.github/workflows/audit-pde5-pedagogy.yml'

jobs:
  audit-pde5-pedagogy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit proof pedagogy
        run: npm run audit:proof-pedagogy

      - name: Audit formalism pedagogy
        run: npm run audit:formalism-pedagogy
