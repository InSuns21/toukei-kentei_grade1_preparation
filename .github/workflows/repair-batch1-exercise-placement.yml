name: Validate Batch 1 exercise placement

on:
  push:
    branches:
      - fix/batch1-exercise-placement
    paths:
      - 'scripts/validate_textbook_structure.mjs'
      - '.github/workflows/repair-batch1-exercise-placement.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/batch1-exercise-placement
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate textbook structure and exercise placement
        run: node scripts/validate_textbook_structure.mjs
