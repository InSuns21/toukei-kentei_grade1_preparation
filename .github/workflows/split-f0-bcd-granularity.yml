name: Split F0 BCD granularity

on:
  push:
    branches:
      - feat/f0-batch2-lebesgue-integration-foundations
    paths:
      - 'scripts/split-f0-bcd-granularity.mjs'
      - '.github/workflows/split-f0-bcd-granularity.yml'

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f0-batch2-lebesgue-integration-foundations
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/split-f0-bcd-granularity.mjs
      - name: Commit split
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: split compactness and completeness lectures'
          git push
