name: Finalize MT6 once

on:
  push:
    branches:
      - codex/mt6-c0-riesz-markov
    paths:
      - .github/workflows/finalize-mt6-once.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/mt6-c0-riesz-markov
          fetch-depth: 0
      - name: Apply MT6 registry and proof refinements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              n = s.count(old)
              if n != count:
                  raise SystemExit(f'{path}: expected {count}, found {n}: {old!r}')
              p.write_text(s.replace(old, new, count), encoding='utf-8')

          # Machine-readable standard-core registry.
          replace(
              'textbook/dream-theater-standard-math-core.yaml',
              '''  - id: MT5\n    title: Radon測度・Riesz–Markov\n    area: measure-theory\n    tier: advanced-standard-bridge\n    status: implemented\n    implemented_at: 2026-09-07\n    implementation_path: textbook/volumes/00_foundations/MT5/index.md\n    prerequisites: [TOP5, MT3]\n\n  - id: FA0''',
              '''  - id: MT5\n    title: Radon測度・Riesz–Markov\n    area: measure-theory\n    tier: advanced-standard-bridge\n    status: implemented\n    implemented_at: 2026-09-07\n    implementation_path: textbook/volumes/00_foundations/MT5/index.md\n    prerequisites: [TOP5, MT3]\n  - id: MT6\n    title: C0版Riesz–Markov・有限符号付きRadon測度\n    area: measure-theory\n    tier: advanced-standard-bridge\n    status: implemented\n    implemented_at: 2026-09-08\n    implementation_path: textbook/volumes/00_foundations/MT6/index.md\n    prerequisites: [MT5]\n\n  - id: FA0'''
          )
          replace(
              'textbook/dream-theater-standard-math-core.yaml',
              '    prerequisites: [FA0, MT5]\n  - id: FA1',
              '    prerequisites: [FA0, MT6]\n  - id: FA1'
          )
          replace(
              'textbook/dream-theater-standard-math-core.yaml',
              '    nodes: [MT0, MT-RL, MT1, MT2, MT3, MT4, MT5]',
              '    nodes: [MT0, MT-RL, MT1, MT2, MT3, MT4, MT5, MT6]'
          )

          # Reader-facing DAG and curriculum notes.
          replace(
              'textbook/dream-theater-standard-math-core.md',
              '  MT5 --> HB\n',
              '  MT5 --> MT6["C0版Riesz-Markov・有限符号付きRadon測度<br/>MT6"]\n  MT6 --> HB\n'
          )
          replace(
              'textbook/dream-theater-standard-math-core.md',
              '''## MT5 Radon測度・Riesz–Markov `advanced-standard / bridge`\n\n- regular Borel measure、Radon measure\n- locally compact Hausdorff space\n- Riesz–Markov representation theorem\n- `C_c(X)` / `C_0(X)` と測度''',
              '''## MT5 Radon測度・Riesz–Markov `advanced-standard / bridge`\n\n- regular Borel measure、Radon measure\n- locally compact Hausdorff space\n- 正線形汎関数 `C_c(X) → R` の Riesz–Markov 表現\n- LCH cutoff と測度の構成・一意性\n\n## MT6 C0版Riesz–Markov・有限符号付きRadon測度 `advanced-standard / bridge`\n\n- `C_0(X)` の Banach lattice 性と `C_c(X)` の一様稠密性\n- 正錐上の envelope による有界汎関数の正負分解\n- 有限符号付き Radon 測度との表現対応\n- `||T|| = |ν|(X)` の等長性と一意性'''
          )

          # Main DREAM THEATER table of contents.
          replace(
              'textbook/dream-theater.md',
              '''14. [MT5 Radon測度・Riesz–Markov](textbook/volumes/00_foundations/MT5/index.md)\n15. [MT-RL Riemann積分とLebesgue積分の橋](textbook/volumes/00_foundations/MT-RL/index.md)\n16. [F0-00D2C 積測度・Tonelli・Fubini](textbook/volumes/00_foundations/F0_00D2C_積測度_Tonelli_Fubini/index.md)\n17. [F0-00D2D Lp・Hölder・Minkowski](textbook/volumes/00_foundations/F0_00D2D_Lp_Holder_Minkowski/index.md)\n18. [F0-00D2E L2完備性・Riesz–Fischer](textbook/volumes/00_foundations/F0_00D2E_L2完備性_Riesz_Fischer/index.md)''',
              '''14. [MT5 Radon測度・Riesz–Markov](textbook/volumes/00_foundations/MT5/index.md)\n15. [MT6 C0版Riesz–Markov・有限符号付きRadon測度](textbook/volumes/00_foundations/MT6/index.md)\n16. [MT-RL Riemann積分とLebesgue積分の橋](textbook/volumes/00_foundations/MT-RL/index.md)\n17. [F0-00D2C 積測度・Tonelli・Fubini](textbook/volumes/00_foundations/F0_00D2C_積測度_Tonelli_Fubini/index.md)\n18. [F0-00D2D Lp・Hölder・Minkowski](textbook/volumes/00_foundations/F0_00D2D_Lp_Holder_Minkowski/index.md)\n19. [F0-00D2E L2完備性・Riesz–Fischer](textbook/volumes/00_foundations/F0_00D2E_L2完備性_Riesz_Fischer/index.md)'''
          )

          # knowledge.yaml: keep only real canonical concept dependencies.
          replace(
              'textbook/volumes/00_foundations/MT6/knowledge.yaml',
              '''    requires:\n      - functional.c0-space\n      - topology.compact-open-cutoff''',
              '''    requires:\n      - functional.c0-space'''
          )
          replace(
              'textbook/volumes/00_foundations/MT6/knowledge.yaml',
              '''      - measure.signed-integral-variation-bound\n      - measure.hahn-decomposition\n      - topology.compact-open-cutoff''',
              '''      - measure.signed-integral-variation-bound\n      - measure.hahn-decomposition'''
          )

          # T^- is the positive envelope of -T on the positive cone.
          replace(
              'textbook/volumes/00_foundations/MT6/index.md',
              '''\\boxed{\n\\|T^+\\|\\le\\|T\\|,\n\\qquad\n\\|T^-\\|\\le2\\|T\\|\n}''',
              '''\\boxed{\n\\|T^+\\|\\le\\|T\\|,\n\\qquad\n\\|T^-\\|\\le\\|T\\|\n}'''
          )
          replace(
              'textbook/volumes/00_foundations/MT6/index.md',
              '''次に $T^-:=T^+-T$ と置きます。線形性と有界性は明らかで\n\n$$\n\\|T^-\\|\n\\le\n\\|T^+\\|+\\|T\\|\n\\le2\\|T\\|.\n$$\n\n$f\\ge0$ なら正部分 envelope の候補として $g=f$ を取れるので\n\n$$\nT^+(f)\\ge T(f).\n$$\n\n従って\n\n$$\nT^-(f)=T^+(f)-T(f)\\ge0.\n$$\n\nよって $T^-$ も正です。定義から直ちに $T=T^+-T^-$ です。''',
              '''次に $T^-:=T^+-T$ と置きます。$f\\ge0$ なら正部分 envelope の候補として $g=f$ を取れるので\n\n$$\nT^+(f)\\ge T(f),\n$$\n\n従って $T^-(f)\\ge0$、すなわち $T^-$ も正です。さらに $0\\le g\\le f$ に対し $h=f-g$ と置けば $0\\le h\\le f$ で\n\n$$\nT(g)-T(f)=-T(h).\n$$\n\nしたがって正錐上で\n\n$$\nT^-(f)\n=T^+(f)-T(f)\n=\\sup_{0\\le h\\le f}(-T(h)),\n$$\n\nつまり $T^-$ は $-T$ の正部分 envelope です。先ほど $T^+$ に示した評価を $-T$ に適用して\n\n$$\n\\|T^-\\|\\le\\|-T\\|=\\|T\\|.\n$$\n\n定義から直ちに $T=T^+-T^-$ です。'''
          )

          # Finite Radon measures are closed under finite sums; this is used in
          # the uniqueness proof when subtracting two signed Radon measures.
          marker = '弱めの Radon 規約を採用している MT5 では、「差だから Jordan 部分も自動的に正則」と一言で済ませるのは危険です。'
          insert = '''有限 Radon 測度 $\\alpha,\\beta$ の和も有限 Radon です。compact-finite は自明です。open $U$ では $\\alpha(U),\\beta(U)$ をそれぞれ compact $K_\\alpha,K_\\beta\\subseteq U$ で任意精度に近似し、$K_\\alpha\\cup K_\\beta$ を取れば open-inner regularity が従います。Borel $A$ では $\\alpha,\\beta$ それぞれの outer regularity から open $U_\\alpha,U_\\beta\\supseteq A$ を取り、$U_\\alpha\\cap U_\\beta$ を使えば outer regularity が従います。\n\n'''
          replace('textbook/volumes/00_foundations/MT6/index.md', marker, insert + marker)

          # One visually ambiguous level-set notation.
          replace(
              'textbook/volumes/00_foundations/MT6/index.md',
              '\\{||f||\\ge\\varepsilon\\}\n=\n\\{|f|\\ge\\varepsilon\\}',
              '\\{x:|f(x)|\\ge\\varepsilon\\}\n=\n\\{|f|\\ge\\varepsilon\\}'
          )
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/register-mt6-once.yml .github/workflows/retry-register-mt6-once.yml .github/workflows/finalize-mt6-once.yml
          git add textbook
          git diff --cached --check
          git commit -m "feat: finalize MT6 C0 Riesz-Markov integration"
          git push origin HEAD:codex/mt6-c0-riesz-markov
