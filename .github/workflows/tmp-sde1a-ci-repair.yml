name: Temporary SDE1A CI repair

on:
  pull_request:
    paths:
      - '.github/workflows/tmp-sde1a-ci-repair.yml'
      - 'textbook/volumes/00_foundations/F0_00SDE1A_Euler_Maruyama_weak_order_proof/index.md'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/syllabus-definition-density-batch2
          fetch-depth: 0
      - name: Import and formalize inherited SDE1A theorem
        run: |
          git fetch origin main
          p='textbook/volumes/00_foundations/F0_00SDE1A_Euler_Maruyama_weak_order_proof/index.md'
          git checkout origin/main -- "$p"
          python - <<'PY'
          from pathlib import Path
          p = Path('textbook/volumes/00_foundations/F0_00SDE1A_Euler_Maruyama_weak_order_proof/index.md')
          s = p.read_text()
          old = '''### 定理：Euler--Maruyama の weak order 1

SDE
'''
          new = '''<a id="thm-f0-00sde1a-weak-order-1"></a>

<!-- formal-statement-start -->
### 定理：Euler--Maruyama の weak order 1

SDE
'''
          if old not in s:
              raise SystemExit('theorem heading block not found')
          s = s.replace(old, new, 1)
          old2 = '''が成り立つ。したがって Euler--Maruyama 法の weak convergence order は1である。

### 証明の5行
'''
          new2 = '''が成り立つ。したがって Euler--Maruyama 法の weak convergence order は1である。
<!-- formal-statement-end -->

### 証明の5行
'''
          if old2 not in s:
              raise SystemExit('theorem closing block not found')
          p.write_text(s.replace(old2, new2, 1))
          PY
      - name: Validate formal statements
        run: node scripts/validate-formal-statement-panels.mjs
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook/volumes/00_foundations/F0_00SDE1A_Euler_Maruyama_weak_order_proof/index.md
          git commit -m 'Fix SDE1A formal theorem panel'
          git push origin HEAD:audit/syllabus-definition-density-batch2
