name: Temporary prose-math repair

on:
  push:
    branches:
      - fix/f0-linear-algebra-before-banach

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/f0-linear-algebra-before-banach
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Repair quoted display math and prose comparisons
        run: node scripts/fix-prose-math-rendering.mjs
      - name: Commit repairs
        run: |
          if git diff --quiet; then
            echo "No repair needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add textbook statistical-mathematics applied-rikou-80
          git diff --cached --check
          git commit -m "fix blockquote display math rendering globally"
          git push origin HEAD:fix/f0-linear-algebra-before-banach
