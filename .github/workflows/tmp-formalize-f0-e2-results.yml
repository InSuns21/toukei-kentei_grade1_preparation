name: Temporary F0-E2 formal theorem migration

on:
  push:
    branches:
      - fix/f0-e2-formal-theorems

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/tmp-formalize-f0-e2-results.mjs
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add textbook/volumes/00_foundations/F0_00E2_Cauchy_Schwarz_Bessel_Parseval/index.md
          if ! git diff --cached --quiet; then
            git commit -m "F0-00E2の主要結果をformal theorem化する"
            git push
          fi
      - run: npm ci
      - run: npm run validate
      - run: npm run validate:pages
