name: Temporary FA5 final fix

on:
  push:
    branches:
      - feat/fa5-spectrum-resolvent

permissions:
  contents: write

jobs:
  patch-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/fa5-spectrum-resolvent
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Patch FA5 audit issues
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('textbook/volumes/00_foundations/FA5/index.md')
          s = p.read_text(encoding='utf-8')

          def rep(old, new, count=1):
              global s
              n = s.count(old)
              if n != count:
                  raise SystemExit(f'expected {count}, got {n}: {old!r}')
              s = s.replace(old, new, count)

          rep(
              '複素数体を仮定する理由は spectrum 非空性で Liouville と代数学の基本定理を使うからです。',
              '複素数体を仮定する理由は spectrum 非空性で [Liouvilleの定理](../CA3/index.md#thm-ca3-liouville) と [代数学の基本定理](../CA3/index.md#cor-ca3-fta) を使うからです。'
          )
          rep(
              'これにより得られた極限自身が有界作用素になり、積との極限交換も正当化できます。',
              'これにより得られた収束先自身が有界作用素になり、積と収束操作を交換することも正当化できます。'
          )
          rep(
              'その近くの $\\lambda$ も可逆であることが Neumann級数から従います。',
              'その近くの $\\lambda$ も可逆であることが [Neumann級数](#lem-fa5-neumann-series)から従います。'
          )
          rep(
              '逆写像の安定性そのものを Neumann級数から作っています。',
              '逆写像の安定性そのものを [Neumann級数](#lem-fa5-neumann-series)から作っています。'
          )
          rep(
              '$\\|T/\\lambda\\|<1$ です。従って Neumann級数から',
              '$\\|T/\\lambda\\|<1$ です。従って [Neumann級数](#lem-fa5-neumann-series)から'
          )
          rep(
              '上の Neumann級数から $|\\lambda|>\\|T\\|$ なら',
              '上の [Neumann級数](#lem-fa5-neumann-series)から $|\\lambda|>\\|T\\|$ なら'
          )
          rep(
              '$T^m=0$ なら多項式 spectral mapping theorem から',
              '$T^m=0$ なら[多項式 spectral mapping theorem](#thm-fa5-polynomial-spectral-mapping)から'
          )
          rep('実は極限でちょうど一致します。', '実はこの列は収束し、その値がちょうど一致します。')
          rep(
              '#### Step 1：$\\|T^n\\|^{1/n}$ の極限が存在する',
              '#### Step 1：$\\|T^n\\|^{1/n}$ は収束する'
          )
          rep('従って極限が存在し、その値は $L$ です。', '従ってこの列は収束し、その値は $L$ です。')
          rep(
              'ML評価から',
              '[ML評価](../CA2/index.md#thm-ca2-reparam-ml)から'
          )
          rep(
              'まず $|\\lambda|>1$ なら Neumann級数により',
              'まず $|\\lambda|>1$ なら [Neumann級数](#lem-fa5-neumann-series)により'
          )
          rep('\n### 解答\n', '\n**解答・解説**\n', 8)
          rep(
              '\nNeumann級数から\n',
              '\n[Neumann級数](#lem-fa5-neumann-series)から\n'
          )
          rep(
              '$\\lambda,\\mu\\in\\rho(T)$ とする。resolvent恒等式から',
              '$\\lambda,\\mu\\in\\rho(T)$ とする。[resolvent恒等式](#thm-fa5-resolvent-identity)から'
          )
          rep(
              '\nresolvent恒等式\n\n$$',
              '\n[resolvent恒等式](#thm-fa5-resolvent-identity)\n\n$$'
          )
          rep(
              '$\\lambda\\in\\rho(T)$ とする。resolvent の局所級数表示から',
              '$\\lambda\\in\\rho(T)$ とする。[resolvent の局所級数表示](#thm-fa5-resolvent-open)から'
          )
          rep(
              '局所級数表示の定理によれば',
              '[resolvent集合の開性と局所級数表示](#thm-fa5-resolvent-open)によれば'
          )
          rep(
              '1. 多項式 spectral mapping theorem から',
              '1. [多項式 spectral mapping theorem](#thm-fa5-polynomial-spectral-mapping)から'
          )
          rep(
              'です。spectral mapping theorem から',
              'です。[多項式 spectral mapping theorem](#thm-fa5-polynomial-spectral-mapping)から'
          )
          rep(
              '\n多項式 spectral mapping theorem から\n',
              '\n[多項式 spectral mapping theorem](#thm-fa5-polynomial-spectral-mapping)から\n'
          )
          rep(
              '- Banach 性：$\\mathcal B(X)$ で Neumann級数を収束させ、有界逆定理を使う。',
              '- Banach 性：$\\mathcal B(X)$ で [Neumann級数](#lem-fa5-neumann-series)を収束させ、[有界逆定理](../FA2/index.md#thm-fa2-bounded-inverse)を使う。'
          )

          if '極' in s:
              hits = [(i+1, line) for i, line in enumerate(s.splitlines()) if '極' in line]
              raise SystemExit(f'unexpected 極 remains: {hits}')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate targeted checks
        shell: bash
        run: |
          export DREAM_THEATER_BASE_SHA="$(git merge-base HEAD origin/main)"
          npm run validate:structure
          npm run validate:dream-theater-concepts:changed
          npm run validate:pages
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-fa5-final-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add textbook/volumes/00_foundations/FA5/index.md .github/workflows/tmp-fa5-final-fix.yml
          git commit -m "fix(FA5): satisfy cross-cutting audits"
          git push origin HEAD:feat/fa5-spectrum-resolvent
