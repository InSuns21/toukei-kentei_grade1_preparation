name: Temporary F0 completeness pedagogy revision

on:
  push:
    branches:
      - revise/f0-completeness-pedagogy
    paths:
      - 'scripts/tmp-revise-f0-completeness-pedagogy.py'
      - '.github/workflows/tmp-revise-f0-completeness-pedagogy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: revise/f0-completeness-pedagogy

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply F0-00D narrative revision
        run: python3 scripts/tmp-revise-f0-completeness-pedagogy.py

      - name: Refresh proof pedagogy audit
        run: |
          node scripts/audit-proof-pedagogy.mjs --write textbook/f0-dream-theater-proof-pedagogy-audit.md > /tmp/proof-audit.txt
          sed -n '1,90p' /tmp/proof-audit.txt
          cat >> textbook/f0-dream-theater-proof-pedagogy-audit.md <<'EOF'

          ## 2026-09-02 人手再監査：F0-00D コーシー列・完備距離空間

          前回監査で唯一のP1候補として残ったF0-00Dを、完全証明を削らずに本文導線から改稿した。

          - `1/n`, `(-1)^n`, `sqrt(2)` の有理近似という三つの列から開始し、Cauchy性・非Cauchy性・非完備性を定義前に具体化。
          - 「収束は固定点との距離、Cauchyは列内部の距離」という役割分担を明示。
          - 4本の完全証明の前に、本文表示の「証明の見取り図」を追加。
          - 完備な大空間の部分集合では `closed ⇔ complete` になることを `[0,1]` と `(0,1)` で具体化。
          - compactnessとの違いを `[0,1]`, `(0,1)`, R, Q の表で整理し、`compact ⇔ complete + totally bounded` への接続を補足。
          - 完備性を「近似列をCauchyにすることで、極限の存在を同じ空間内に確保する装置」として、Banach/Lp/関数列へ接続。

          人手判定では、証明を全て閉じた状態でも「何がCauchyか / なぜcompleteが必要か / closedやcompactと何が違うか / 次に何へ使うか」を追える構成になった。
          EOF

      - name: Validate textbook
        run: npm run validate

      - name: Validate Pages assembly
        run: npm run validate:pages

      - name: Commit revision
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            textbook/volumes/00_foundations/F0_00D_Cauchy列_完備性_無限次元/index.md \
            textbook/f0-dream-theater-proof-pedagogy-audit.md
          if git diff --cached --quiet; then
            echo 'No revision changes to commit.'
          else
            git commit -m 'restore intuition and examples in completeness chapter'
            git push
          fi
