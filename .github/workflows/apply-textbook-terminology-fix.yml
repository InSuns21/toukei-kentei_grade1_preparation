name: Apply textbook terminology fix

on:
  push:
    branches:
      - fix/textbook-terminology-full-audit
    paths:
      - 'scripts/fix_textbook_japanese_terminology.mjs'
      - '.github/workflows/apply-textbook-terminology-fix.yml'

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/textbook-terminology-full-audit

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply terminology fixes
        run: node scripts/fix_textbook_japanese_terminology.mjs

      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo 'No terminology fixes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook/volumes/01_probability textbook/volumes/02_distributions textbook/volumes/03_inference textbook/volumes/04_linear_models textbook/volumes/05_engineering
          git commit -m 'fix: normalize terminology across grade-1 textbook'
          git push origin HEAD:fix/textbook-terminology-full-audit
