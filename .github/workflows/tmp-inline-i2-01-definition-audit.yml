name: Temporary inline I2-01 definition audit

on:
  push:
    branches:
      - fix/i2-01-inline-definition-audit

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inline definition verification blocks
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('textbook/volumes/03_inference/I2_01_漸近推測_Delta法/index.md')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'たとえば標本平均では、有限分散の独立同分布標本について $a_n=\\sqrt n$、$b_n=\\mu$ とすれば中心極限定理から正規分布が現れます。',
              '<!-- definition-example-start: def-i2-01-asymptotic-distribution -->\n**定義の確認**\n\nたとえば標本平均では、有限分散の独立同分布標本について $a_n=\\sqrt n$、$b_n=\\mu$ とすれば中心極限定理から正規分布が現れます。\n<!-- definition-example-end -->',
              'asymptotic distribution example',
          )

          replace_once(
              '### 2.2 例: 標本平均\n\n$X_i$ が独立同分布で',
              '### 2.2 例: 標本平均\n\n<!-- definition-example-start: def-i2-01-asymptotic-normality, def-i2-01-asymptotic-variance -->\n**定義の確認**\n\n$X_i$ が独立同分布で',
              'root-n normality example start',
          )

          replace_once(
              '\\operatorname{Var}(\\bar X)=\\frac{\\sigma^2}{n}.\n$$\n\n---\n\n## 3. 正則な最尤推定量はなぜ漸近正規になるか',
              '\\operatorname{Var}(\\bar X)=\\frac{\\sigma^2}{n}.\n$$\n\n<!-- definition-example-end -->\n\n---\n\n## 3. 正則な最尤推定量はなぜ漸近正規になるか',
              'root-n normality example end',
          )

          replace_once(
              'たとえば指数分布の率母数 $\\lambda$ では\n\n$$\n\\ell_n\'\'(\\lambda)=-\\frac n{\\lambda^2}\n$$',
              '<!-- definition-example-start: def-i2-01-observed-information -->\n**定義の確認**\n\nたとえば指数分布の率母数 $\\lambda$ では\n\n$$\n\\ell_n\'\'(\\lambda)=-\\frac n{\\lambda^2}\n$$',
              'observed information example start',
          )

          replace_once(
              'この例では二階微分がデータに依存しないため、観測情報量と期待フィッシャー情報量が一致します。\n\n一般には有限標本で両者は一致しませんが',
              'この例では二階微分がデータに依存しないため、観測情報量と期待フィッシャー情報量が一致します。\n<!-- definition-example-end -->\n\n一般には有限標本で両者は一致しませんが',
              'observed information example end',
          )

          replace_once(
              '<!-- formal-statement-end -->\n\n[正則な1母数最尤推定量の漸近正規性](#thm-i2-01-mle-asymptotic-normality)により、正則な最尤推定量はこの形を持ちます。ただし、有限標本の分散が厳密に $I_n^{-1}$ であるという意味ではありません。',
              '<!-- formal-statement-end -->\n\n<!-- definition-example-start: def-i2-01-asymptotic-efficiency -->\n**定義の確認**\n\nたとえば $X_i\\overset{\\mathrm{iid}}{\\sim}N(\\mu,\\sigma^2)$ で $\\sigma^2$ が既知なら、$\\hat\\mu=\\bar X$ であり\n\n$$\nI_1(\\mu)=\\frac1{\\sigma^2},\n\\qquad\n\\sqrt n(\\bar X-\\mu)\\sim N(0,\\sigma^2)=N\\!\\left(0,I_1(\\mu)^{-1}\\right).\n$$\n\nしたがって $\\bar X$ はこの定義の意味で漸近有効です。\n<!-- definition-example-end -->\n\n[正則な1母数最尤推定量の漸近正規性](#thm-i2-01-mle-asymptotic-normality)により、正則な最尤推定量はこの形を持ちます。ただし、有限標本の分散が厳密に $I_n^{-1}$ であるという意味ではありません。',
              'asymptotic efficiency example',
          )

          if '## 17. 定義の具体例による確認' in text:
              raise SystemExit('chapter-end definition example appendix reappeared')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate definition examples with full history
        run: node scripts/validate-definition-example-checks.mjs

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add textbook/volumes/03_inference/I2_01_漸近推測_Delta法/index.md
          git diff --cached --check
          git commit -m "I2-01: place definition checks next to definitions"
          git push
