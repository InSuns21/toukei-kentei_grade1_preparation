name: Temporary FOU3 FOU4 final fixer

on:
  push:
    paths:
      - '.github/workflows/tmp-fou-ci-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dream-theater-fou3-fourier-transform
          fetch-depth: 0
      - name: Apply fixes
        run: python3 scripts/tmp-fou-ci-fix.py
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/audit-dream-theater-undefined-terms.mjs textbook/volumes/00_foundations
          git commit -m 'fix: close FOU3 FOU4 validation gaps'
          git push origin HEAD:dream-theater-fou3-fourier-transform
# rerun 2
