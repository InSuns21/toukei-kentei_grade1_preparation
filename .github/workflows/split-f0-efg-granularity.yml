name: Cleanup F0 EFG split

on:
  push:
    branches:
      - feat/f0-batch2-lebesgue-integration-foundations
    paths:
      - '.github/workflows/split-f0-efg-granularity.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f0-batch2-lebesgue-integration-foundations
      - name: Normalize split separators
        run: |
          python3 - <<'PY'
          from pathlib import Path
          paths = [
              'textbook/volumes/00_foundations/F0_00E_ベクトル空間_基底_Gram_Schmidt_直交射影/index.md',
              'textbook/volumes/00_foundations/F0_00E1_内積_Gram_Schmidt_射影_QR/index.md',
              'textbook/volumes/00_foundations/F0_00E2_Cauchy_Schwarz_Bessel_Parseval/index.md',
              'textbook/volumes/00_foundations/F0_00F_線形写像_固有空間_スペクトル定理_SVD/index.md',
              'textbook/volumes/00_foundations/F0_00F1_固有空間_スペクトル定理_PSD/index.md',
              'textbook/volumes/00_foundations/F0_00F2_SVD_特異値_作用素ノルム/index.md',
              'textbook/volumes/00_foundations/F0_00G_凸集合_凸関数_凸最適化/index.md',
          ]
          for name in paths:
              p = Path(name)
              s = p.read_text()
              while '\n---\n\n---\n' in s:
                  s = s.replace('\n---\n\n---\n', '\n---\n')
              p.write_text(s)
          PY
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook
          git diff --cached --quiet && exit 0
          git commit -m 'fix: clean E F G split separators'
          git push
