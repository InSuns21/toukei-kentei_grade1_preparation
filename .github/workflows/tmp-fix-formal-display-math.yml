name: Temporary formal display math fix

on:
  push:
    branches:
      - fix/formal-anchors-and-definition-audit
    paths:
      - 'scripts/tmp-fix-formal-display-math.mjs'
      - '.github/workflows/tmp-fix-formal-display-math.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/formal-anchors-and-definition-audit
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/tmp-fix-formal-display-math.mjs
      - run: npm ci
      - run: npm run validate:math
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add textbook/volumes/00_foundations/F0_00D4_Lebesgue測度_Borel集合_拡張定理/index.md textbook/volumes/00_foundations/F0_00F1_固有空間_スペクトル定理_PSD/index.md
          git commit -m 'fix formal statement display math delimiters'
          git push
