name: Validate LVT indexing
on:
  pull_request:
    paths:
      - 'textbook/volumes/dream_thater/計算系/LVT/LVT1-05/**'
      - '.github/workflows/validate-lvt-indexing.yml'
  push:
    branches: [main]
    paths:
      - 'textbook/volumes/dream_thater/計算系/LVT/LVT1-05/**'
      - '.github/workflows/validate-lvt-indexing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-indexing:
    name: Lean safe indexing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          lake-package-directory: 'textbook/volumes/dream_thater/計算系/LVT/LVT1-05/lab'
          auto-config: 'false'
          build: 'true'
          test: 'true'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - name: Verify version, evaluation and intended range error
        working-directory: 'textbook/volumes/dream_thater/計算系/LVT/LVT1-05/lab'
        shell: bash
        run: |
          lean --version | grep -F 'version 4.35.0'
          lake env lean Inspect.lean | tee inspect.log
          diff -u <(printf 'some 7\nnone\nsome 0\n5\n') inspect.log
          lake exe lvtIndexingDemo | grep -Fx 'LVT1-05 OK'
          lake env lean ExerciseSolutions.lean
          if lake env lean Failure.lean > failure.log 2>&1; then
            cat failure.log
            echo 'Expected out-of-range error'
            exit 1
          fi
          cat failure.log
          grep -iF 'decide' failure.log
          grep -F '3 < 3' failure.log
