name: Temporary CA6 formal link fix

on:
  push:
    branches:
      - codex/ca6-mobius-schwarz-poisson

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ca6-mobius-schwarz-poisson
          fetch-depth: 0
      - name: Patch canonical formal references
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('textbook/volumes/00_foundations/CA6/index.md')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('ここで単位円そのものを境界として最大値原理を使ってはいけない。',
               'ここで単位円そのものを境界として[最大値原理](../CA3/index.md#thm-ca3-maximum-modulus)を使ってはいけない。'),
              ('しかも $|g|\\le1$ なので、最大値原理から $g$ は定数である。',
               'しかも $|g|\\le1$ なので、[最大値原理](../CA3/index.md#thm-ca3-maximum-modulus)から $g$ は定数である。'),
              ('半径 $R<1$ の閉円板へ局所化して最大値原理を適用し',
               '半径 $R<1$ の閉円板へ局所化して[最大値原理](../CA3/index.md#thm-ca3-maximum-modulus)を適用し'),
              ('は円板自己同型で $G(0)=0$ である。Schwarz lemma により',
               'は円板自己同型で $G(0)=0$ である。[Schwarz lemma](#thm-ca6-schwarz-lemma) により'),
              ('従って $|G(z)|=|z|$ が全ての $z$ で成り立つ。Schwarz lemma の等号条件から',
               '従って $|G(z)|=|z|$ が全ての $z$ で成り立つ。[Schwarz lemma](#thm-ca6-schwarz-lemma) の等号条件から'),
              ('境界に接する円板へ無断で Cauchy 公式を適用してはいない。',
               '境界に接する円板へ無断で [Cauchy 平均値公式](../CA3/index.md#cor-ca3-cauchy-mean-value) を適用してはいない。'),
              ('局所正則表示と Cauchy 公式が強制する構造である。',
               '局所正則表示と [Cauchy 平均値公式](../CA3/index.md#cor-ca3-cauchy-mean-value) が強制する構造である。'),
              ('[調和関数の最大値原理](#cor-ca6-harmonic-maximum-minimum-principle) により',
               '[調和関数の最大・最小値原理](#cor-ca6-harmonic-maximum-minimum-principle) により'),
              ('同様に $-w$ へ最大値原理を適用して',
               '同様に $-w$ へ [調和関数の最大・最小値原理](#cor-ca6-harmonic-maximum-minimum-principle) を適用して'),
              ('$G=F\\circ\\phi_a^{-1}$ と $G^{-1}$ の両方へ Schwarz lemma を適用し',
               '$G=F\\circ\\phi_a^{-1}$ と $G^{-1}$ の両方へ [Schwarz lemma](#thm-ca6-schwarz-lemma) を適用し'),
              ('**解答**：$G$ は円板自己同型で $G(0)=0$。Schwarz lemma から',
               '**解答**：$G$ は円板自己同型で $G(0)=0$。[Schwarz lemma](#thm-ca6-schwarz-lemma) から'),
              ('非零点を一つ取れば Schwarz lemma の等号条件から',
               '非零点を一つ取れば [Schwarz lemma](#thm-ca6-schwarz-lemma) の等号条件から'),
              ('調和関数の最大値原理により定数になって境界0と矛盾する。',
               '[調和関数の最大・最小値原理](#cor-ca6-harmonic-maximum-minimum-principle) により定数になって境界0と矛盾する。'),
              ('一意性側では最大・最小値原理が別の解を排除する。',
               '一意性側では [調和関数の最大・最小値原理](#cor-ca6-harmonic-maximum-minimum-principle) が別の解を排除する。'),
              ('- Schwarz lemma では $|z|=1$ 上の境界値を仮定せず、$R<1$ の閉円板で最大値原理を使って $R\\uparrow1$ とした。',
               '- [Schwarz lemma](#thm-ca6-schwarz-lemma) では $|z|=1$ 上の境界値を仮定せず、$R<1$ の閉円板で[最大値原理](../CA3/index.md#thm-ca3-maximum-modulus)を使って $R\\uparrow1$ とした。'),
              ('- 円板自己同型の分類では全単射性を $G^{-1}$ に Schwarz lemma を適用する箇所で使った。',
               '- 円板自己同型の分類では全単射性を $G^{-1}$ に [Schwarz lemma](#thm-ca6-schwarz-lemma) を適用する箇所で使った。'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'missing expected CA6 text: {old}')
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')

          k = Path('textbook/volumes/00_foundations/CA6/knowledge.yaml')
          ks = k.read_text(encoding='utf-8')
          old = 'aliases: [Poisson kernelのapproximate identity性, Poisson核の質量集中, approximate identity]'
          new = 'aliases: [Poisson kernelのapproximate identity性, Poisson核の質量集中]'
          if old not in ks:
              raise SystemExit('missing expected Poisson alias list')
          k.write_text(ks.replace(old, new), encoding='utf-8')
          PY
      - name: Commit fixes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-ca6-formal-link-fix.yml
          git add textbook/volumes/00_foundations/CA6/index.md textbook/volumes/00_foundations/CA6/knowledge.yaml
          git commit -m "Fix CA6 formal references and narrow Poisson alias"
          git push origin HEAD:codex/ca6-mobius-schwarz-poisson
