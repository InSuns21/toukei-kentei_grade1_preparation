name: Temporary F0-00P6 autofix validation

on:
  push:
    branches:
      - fix/f0-00p6-levy-pedagogy

permissions:
  contents: write

jobs:
  patch-and-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/f0-00p6-levy-pedagogy
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply exact CI-guided reference fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('textbook/volumes/00_foundations/F0_00P6_特性関数_中心極限定理/index.md')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('[Tonelliの定理](../F0_00D2C_積測度_Tonelli_Fubini/index.md)', '[Tonelliの定理](../F0_00D2C_積測度_Tonelli_Fubini/index.md#thm-tonelli)'),
              ('[Fubiniの定理](../F0_00D2C_積測度_Tonelli_Fubini/index.md)', '[Fubiniの定理](../F0_00D2C_積測度_Tonelli_Fubini/index.md#thm-f0-00d2c-02)'),
              ('DCTにより', '[優収束定理](../F0_00D2B_単調収束_Fatou_優収束/index.md#thm-f0-00d2b-01)により'),
              ('DCTから', '[優収束定理](../F0_00D2B_単調収束_Fatou_優収束/index.md#thm-f0-00d2b-01)から'),
              ('アフィン変換の公式から', '[特性関数の基本性質](#prop-f0-00p6-basic-properties)から'),
              ('Gaussian smoothingの密度公式から', '[Gaussian smoothingの密度公式](#lem-f0-00p6-gaussian-smoothing-density)から'),
              ('Schefféの補題から', '[Schefféの補題](#lem-f0-00p6-scheffe)から'),
              ('本文の特徴付け定理から', '[bounded Lipschitz testによる特徴付け](#thm-f0-00p6-bl-characterization)から'),
              ('$q(u)\\to0$ as $u\\to0$', '$u\\to0$ のとき $q(u)\\to0$'),
              ('0で不連続な点wise極限', '0で不連続な各点極限'),
              ('です。明らかに\n\n$$\n\\lim_{t\\to0,\\ t\\ne0}', 'です。実際\n\n$$\n\\lim_{t\\to0,\\ t\\ne0}'),
          ]
          changed = 0
          for old, new in replacements:
              n = s.count(old)
              if n:
                  s = s.replace(old, new)
                  changed += n
                  print(f'replaced {n}: {old[:70]}')
          if not changed:
              raise SystemExit('No replacements applied')
          p.write_text(s, encoding='utf-8')
          print(f'total replacements: {changed}')
          PY
      - name: Commit exact fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook/volumes/00_foundations/F0_00P6_特性関数_中心極限定理/index.md
          git diff --cached --check
          git commit -m 'fix: resolve F0-00P6 canonical references'
          git push origin HEAD:fix/f0-00p6-levy-pedagogy
      - name: Validate textbook
        run: npm run validate
      - name: Audit proof pedagogy
        run: npm run audit:proof-pedagogy
      - name: Audit formalism pedagogy
        run: npm run audit:formalism-pedagogy
