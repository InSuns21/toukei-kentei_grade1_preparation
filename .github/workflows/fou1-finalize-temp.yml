name: Temporary FOU1 pedagogy audit and ledger update

on:
  push:
    branches:
      - dream-theater-fou1-fourier-series

permissions:
  contents: write

jobs:
  finalize-fou1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dream-theater-fou1-fourier-series
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit proof pedagogy
        run: npm run audit:proof-pedagogy
      - name: Audit formalism pedagogy
        run: npm run audit:formalism-pedagogy
      - name: Update ODE/Fourier/PDE progress source of truth
        shell: python
        run: |
          from pathlib import Path

          path = Path("textbook/DREAM_THEATER_ODE_FOURIER_PDE_RESTRUCTURE_PLAN.md")
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              "特に Fourier解析の最初から Lebesgue 積分・Hilbert 空間を必須にはしない。既存 `F0-00FA1`～`FA3` の強い $L^2$ 理論は捨てず、後半の厳密化として再利用する。",
              "特に Fourier解析の最初から Lebesgue 積分・Hilbert 空間を必須にはしない。新しい `FOU*` 系列は旧 `F0-00FA1`～`FA3` を prerequisite・concept owner・proof dependency・forward reference にせず、自立した標準コアとして実装する。旧ページは URL 互換と旧導線のためだけに残す。"
          )

          text = text.replace(
              "現行 `F0-00FA1` の定義・直交性を再利用するが、初学者が Lebesgue/Hilbert 理論を完走しないと入れない構成にはしない。",
              "旧 `F0-00FA1` には依存しない。FOU1 自身で Riemann 積分と有限和から係数公式・有限次数最小二乗性・有限エネルギー評価まで閉じ、旧ページは互換導線に限定する。"
          )

          text = text.replace(
              "現行 `F0-00FA1` の Fejér kernel・完全性証明を主な再利用元とする。既存の強い証明を削るのではなく、計算的な Fourier 級数の導入と収束概念の整理を前段に追加する。",
              "FOU2 も旧 `F0-00FA1` を証明依存先にはしない。必要な Dirichlet / Fejér kernel、収束定理、完全性、Parseval の論証は FOU2 自身または現行 canonical prerequisite だけで閉じ、旧ページは互換導線に限定する。"
          )

          if "| FOU1 | **実装・検証完了（PR #289）**" not in text:
              text = text.replace(
                  "\n\n## 11.3 ODE1 で今回閉じた品質論点",
                  "\n| FOU1 | **実装・検証完了（PR #289）** | 周期波形・三角多項式、一周期積分消去則、実 Fourier 係数、N次 Fourier 有限和、固定次数最小二乗性、偶奇対称性、複素指数係数、半区間係数、有限エネルギー不等式を実装。$x$・矩形波・$|x|$・$x^2$・三角形波を手計算し、無限段階の収束論は FOU2 へ分離 | A4 / B3 / C1。全問に詳細解答あり | RA4 のみ。旧 `F0-00FA1`・旧 Fourier 本文を prerequisite / concept owner / proof dependency / forward reference にせず、FOU1 内で有限次数理論を閉じる | textbook / Pages / exercises / concepts / standard math core / terminology の6系統 green。proof / formalism pedagogy audit も実行 |\n\n## 11.3 ODE1 で今回閉じた品質論点"
              )

          text = text.replace(
              "次の実装単位は **FOU1「Fourier級数・直交性・係数計算」**。旧 `F0_00FA1_Fourier級数_直交展開` を主要再利用元として、初学者向けの係数計算・偶奇性・半区間展開・Bessel不等式を前段に整理し、測度論・Hilbert空間を入口の必須前提にしない。",
              "FOU1 は **実装・検証完了（PR #289）**。RA4 の Riemann 積分だけを前提に有限次数の Fourier 理論を自立実装し、旧 `F0_00FA1_Fourier級数_直交展開`・旧 Fourier 本文には依存しない。次の実装単位は **FOU2「Fourier級数の収束・Fejér・Parseval」**。FOU2 も旧教材を証明依存先にせず、無限段階の収束理論を現行 canonical prerequisite と章内論証で閉じる。"
          )

          path.write_text(text, encoding="utf-8")
      - name: Commit progress ledger update
        run: |
          if git diff --quiet -- textbook/DREAM_THEATER_ODE_FOURIER_PDE_RESTRUCTURE_PLAN.md; then
            echo "No progress-ledger changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add textbook/DREAM_THEATER_ODE_FOURIER_PDE_RESTRUCTURE_PLAN.md
          git commit -m "Update FOU1 completion status and standalone policy"
          git push origin HEAD:dream-theater-fou1-fourier-series
