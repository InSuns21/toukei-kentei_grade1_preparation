name: Temporary RA1A curriculum sync
on:
  push:
    branches: [feat/ra1a-series-convergence]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ra1a-series-convergence
          fetch-depth: 0
      - name: Sync RA1A into curriculum and dependencies
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if new in s:
                  return
              if old not in s:
                  raise SystemExit(f'pattern not found in {path}: {old[:80]!r}')
              p.write_text(s.replace(old, new, 1))

          # RA1 reader flow
          replace_once(
              'textbook/volumes/00_foundations/RA1/index.md',
              '**次：[RA2 極限・連続・一様連続](../RA2/index.md)**',
              '**数値級数の収束判定を固める：[RA1A 数値級数の収束論](../RA1A/index.md)**  \n\n**連続関数へ進む：[RA2 極限・連続・一様連続](../RA2/index.md)**'
          )

          # RA4A and RA5 explicit prerequisites
          for path, anchor in [
              ('textbook/volumes/00_foundations/RA4A/chapter.yaml', '  - RA4\n'),
              ('textbook/volumes/00_foundations/RA4A/knowledge.yaml', '  - RA4\n'),
          ]:
              p = Path(path); s = p.read_text()
              if '  - RA1A\n' not in s.split('forward_references:')[0]:
                  if anchor not in s: raise SystemExit(f'anchor missing {path}')
                  p.write_text(s.replace(anchor, anchor + '  - RA1A\n', 1))

          for path in [
              'textbook/volumes/00_foundations/RA5/chapter.yaml',
              'textbook/volumes/00_foundations/RA5/knowledge.yaml',
          ]:
              p = Path(path); s = p.read_text()
              if '  - RA1A\n' not in s.split('forward_references:')[0]:
                  anchor = '  - RA2\n'
                  if anchor not in s: raise SystemExit(f'anchor missing {path}')
                  p.write_text(s.replace(anchor, anchor + '  - RA1A\n', 1))

          # Reader-facing cross-links
          replace_once(
              'textbook/volumes/00_foundations/RA4A/index.md',
              '[RA4](../RA4/index.md) では、有限閉区間上の有界関数に対するRiemann/Darboux積分を構成し、微積分学の基本定理まで閉じました。本章では、**区間が無限に伸びる場合**と、**被積分関数が端点や内部で非有界になる場合**を扱います。',
              '[RA4](../RA4/index.md) では、有限閉区間上の有界関数に対するRiemann/Darboux積分を構成し、微積分学の基本定理まで閉じました。また、数値級数の収束判定は [RA1A](../RA1A/index.md) で比較・比・根・交代・Dirichlet/Abel判定まで整備します。本章では、**区間が無限に伸びる場合**と、**被積分関数が端点や内部で非有界になる場合**を扱います。'
          )
          replace_once(
              'textbook/volumes/00_foundations/RA5/index.md',
              '関数列では「各 $x$ では収束する」だけでは、連続性・積分・微分が極限へ引き継がれません。その境界を整理するのが一様収束です。',
              '数値級数の収束判定は [RA1A](../RA1A/index.md) までで閉じました。ここからは数を足す代わりに関数を足します。関数列では「各 $x$ では収束する」だけでは、連続性・積分・微分が極限へ引き継がれません。その境界を整理するのが一様収束です。'
          )

          # Machine-readable canonical DAG
          path = Path('textbook/dream-theater-standard-math-core.yaml')
          s = path.read_text()
          if '\n  - id: RA1A\n' not in s:
              old = '''    prerequisites: [BASE]\n  - id: RA2\n'''
              new = '''    prerequisites: [BASE]\n  - id: RA1A\n    title: 数値級数の収束論\n    area: real-analysis\n    tier: core\n    status: implemented\n    implemented_at: 2026-09-13\n    implementation_path: textbook/volumes/00_foundations/RA1A/index.md\n    prerequisites: [RA1]\n  - id: RA2\n'''
              if old not in s: raise SystemExit('RA1 insertion anchor missing')
              s = s.replace(old, new, 1)
          s = s.replace('''  - id: RA4A\n    title: 広義積分・収束判定\n    area: real-analysis\n    tier: core\n    status: implemented\n    implemented_at: 2026-09-13\n    implementation_path: textbook/volumes/00_foundations/RA4A/index.md\n    prerequisites: [RA4]\n''', '''  - id: RA4A\n    title: 広義積分・収束判定\n    area: real-analysis\n    tier: core\n    status: implemented\n    implemented_at: 2026-09-13\n    implementation_path: textbook/volumes/00_foundations/RA4A/index.md\n    prerequisites: [RA4, RA1A]\n''')
          s = s.replace('''  - id: RA5\n    title: 関数列・関数級数・一様収束\n    area: real-analysis\n    tier: core\n    status: implemented\n    implemented_at: 2026-09-06\n    implementation_path: textbook/volumes/00_foundations/RA5/index.md\n    prerequisites: [RA2]\n''', '''  - id: RA5\n    title: 関数列・関数級数・一様収束\n    area: real-analysis\n    tier: core\n    status: implemented\n    implemented_at: 2026-09-06\n    implementation_path: textbook/volumes/00_foundations/RA5/index.md\n    prerequisites: [RA2, RA1A]\n''')
          s = s.replace('nodes: [RA1, RA2, RA3, RA4, RA4A, RA5]', 'nodes: [RA1, RA1A, RA2, RA3, RA4, RA4A, RA5]')
          path.write_text(s)

          # Reader-facing standard core DAG + scope split
          path = Path('textbook/dream-theater-standard-math-core.md')
          s = path.read_text()
          if 'RA1A["実解析 I-A' not in s:
              s = s.replace(
                  '  RA1 --> RA2["実解析 II<br/>極限・連続・一様連続<br/>RA2"]\n',
                  '  RA1 --> RA1A["実解析 I-A<br/>数値級数の収束論<br/>RA1A"]\n  RA1 --> RA2["実解析 II<br/>極限・連続・一様連続<br/>RA2"]\n  RA1A --> RA4A\n  RA1A --> RA5\n',
                  1
              )
          old = '''## RA1 数列・級数 `core`\n\n- 数列、部分列、Cauchy列、単調収束、Bolzano–Weierstrass\n- `limsup` / `liminf`\n- 級数とCauchy判定、比較・比・根判定\n- 絶対収束・条件収束、交代級数\n- Riemann再配列定理、Cauchy積\n- 冪級数、収束半径\n\n既存 A1/A1B/B0/D は正本として再利用します。\n'''
          new = '''## RA1 数列・級数 `core`\n\n- 数列、部分列、Cauchy列、単調収束、Bolzano–Weierstrass\n- `limsup` / `liminf`\n- 級数を部分和列として定義し、Cauchy判定と絶対収束の基礎を構成\n- 絶対収束級数の再配列不変性、Cauchy積\n- 冪級数、収束半径\n\n既存 A1/A1B/B0/D は正本として再利用します。数値級数の詳細な収束判定は RA1A に分離します。\n\n## RA1A 数値級数の収束論 `core`\n\n- 一般項が0へ行く必要条件、非負項級数の部分和有界性判定\n- 比較判定・極限比較判定・比判定・根判定と境界値1の反例\n- Cauchy凝縮判定、$p$ 級数、対数補正級数\n- Leibnizの交代級数判定と剰余評価\n- Abelの部分和変換、Dirichlet判定、Abel判定\n- 条件収束とRiemann再配列定理（有限値版）\n\n判定法名を列挙するだけでなく、Cauchy条件・単調収束・部分和変換へ還元して核心論証を本文内で閉じます。\n'''
          if old in s:
              s = s.replace(old, new, 1)
          elif '## RA1A 数値級数の収束論 `core`' not in s:
              raise SystemExit('standard core RA1 scope block missing')
          path.write_text(s)

          # Dream Theater facade reading order
          path = Path('textbook/dream-theater.md')
          s = path.read_text()
          old = '''1. [RA1 数列・級数](textbook/volumes/00_foundations/RA1/index.md)\n2. [RA2 極限・連続・一様連続](textbook/volumes/00_foundations/RA2/index.md)\n3. [RA3 微分法の理論](textbook/volumes/00_foundations/RA3/index.md)\n4. [RA4 Riemann/Darboux積分・FTC](textbook/volumes/00_foundations/RA4/index.md)\n5. [RA4A 広義積分・収束判定](textbook/volumes/00_foundations/RA4A/index.md)\n6. [RA5 関数列・関数級数・一様収束](textbook/volumes/00_foundations/RA5/index.md)\n7. [RA6 多変数微分・Fréchet微分（既存 F0-02C3）](textbook/volumes/00_foundations/F0_02C3_Frechet微分_線形作用素_随伴/index.md)\n8. [RA6A 逆関数定理・陰関数定理](textbook/volumes/00_foundations/RA6A/index.md)\n9. [RA7 多重Riemann積分・変数変換](textbook/volumes/00_foundations/RA7/index.md)\n10. [RA8 関数族のコンパクト性・近似](textbook/volumes/00_foundations/RA8/index.md)\n'''
          new = '''1. [RA1 数列・級数](textbook/volumes/00_foundations/RA1/index.md)\n2. [RA1A 数値級数の収束論](textbook/volumes/00_foundations/RA1A/index.md)\n3. [RA2 極限・連続・一様連続](textbook/volumes/00_foundations/RA2/index.md)\n4. [RA3 微分法の理論](textbook/volumes/00_foundations/RA3/index.md)\n5. [RA4 Riemann/Darboux積分・FTC](textbook/volumes/00_foundations/RA4/index.md)\n6. [RA4A 広義積分・収束判定](textbook/volumes/00_foundations/RA4A/index.md)\n7. [RA5 関数列・関数級数・一様収束](textbook/volumes/00_foundations/RA5/index.md)\n8. [RA6 多変数微分・Fréchet微分（既存 F0-02C3）](textbook/volumes/00_foundations/F0_02C3_Frechet微分_線形作用素_随伴/index.md)\n9. [RA6A 逆関数定理・陰関数定理](textbook/volumes/00_foundations/RA6A/index.md)\n10. [RA7 多重Riemann積分・変数変換](textbook/volumes/00_foundations/RA7/index.md)\n11. [RA8 関数族のコンパクト性・近似](textbook/volumes/00_foundations/RA8/index.md)\n'''
          if old in s:
              s = s.replace(old, new, 1)
          elif 'RA1A 数値級数の収束論' not in s:
              raise SystemExit('dream theater real-analysis list missing')
          path.write_text(s)

          # Navigation index
          path = Path('textbook/dream-theater-index.json')
          obj = json.loads(path.read_text())
          ra1 = 'textbook/volumes/00_foundations/RA1/index.md'
          ra1a = 'textbook/volumes/00_foundations/RA1A/index.md'
          for section in obj['sections']:
              if ra1 in section.get('paths', []):
                  paths = section['paths']
                  if ra1a not in paths:
                      paths.insert(paths.index(ra1) + 1, ra1a)
                  break
          else:
              raise SystemExit('RA1 missing from dream theater index')
          path.write_text(json.dumps(obj, ensure_ascii=False, indent=2) + '\n')
          PY

          rm .github/workflows/tmp-ra1a-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'RA1A: sync reading order and prerequisites'
            git push origin HEAD:feat/ra1a-series-convergence
          fi
