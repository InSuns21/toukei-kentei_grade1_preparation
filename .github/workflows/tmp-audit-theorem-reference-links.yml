name: Temporary theorem reference link audit

on:
  push:
    branches:
      - fix/theorem-reference-anchor-ci
    paths:
      - 'scripts/tmp-finalize-formal-reference-ci-v2.py'
      - 'scripts/validate-formal-reference-links.mjs'
      - '.github/workflows/tmp-audit-theorem-reference-links.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/theorem-reference-anchor-ci
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Wire formal reference CI
        run: python3 scripts/tmp-finalize-formal-reference-ci-v2.py
      - name: Validate textbook and generated Pages
        run: |
          npm run validate
          npm run validate:pages
      - name: Commit permanent formal reference CI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            package.json \
            scripts/validate-pages-links.mjs \
            textbook/style-guide.md \
            .github/workflows/validate-textbook.yml
          if git diff --cached --quiet; then
            echo 'No permanent CI wiring changes.'
          else
            git commit -m 'enforce theorem-level links in source and Pages'
            git push
          fi
