name: Temporary theorem reference link audit

on:
  push:
    branches:
      - fix/theorem-reference-anchor-ci
    paths:
      - 'scripts/tmp-audit-theorem-reference-links.mjs'
      - 'scripts/tmp-list-reference-target-headings.mjs'
      - 'scripts/tmp-fix-formal-reference-links.py'
      - 'scripts/tmp-fix-formal-reference-links-extra.py'
      - 'scripts/validate-formal-reference-links.mjs'
      - '.github/workflows/tmp-audit-theorem-reference-links.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/theorem-reference-anchor-ci
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply formal reference fixes
        run: |
          python3 scripts/tmp-fix-formal-reference-links.py
          python3 scripts/tmp-fix-formal-reference-links-extra.py
      - name: Validate formal references
        run: node scripts/validate-formal-reference-links.mjs
      - name: Commit formal reference fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add textbook/volumes
          if git diff --cached --quiet; then
            echo 'No formal reference content changes.'
          else
            git commit -m 'link formal dependencies to stable theorem anchors'
            git push
          fi
