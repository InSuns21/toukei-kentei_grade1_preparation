name: Cleanup Probability granularity

on:
  push:
    branches:
      - refactor/probability-granularity
    paths:
      - 'scripts/cleanup-probability-granularity.py'
      - '.github/workflows/cleanup-probability-granularity.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/probability-granularity
      - name: Clean Probability split and downstream prerequisites
        run: python3 scripts/cleanup-probability-granularity.py
      - name: Commit Probability cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook
          git diff --cached --quiet && exit 0
          git commit -m 'fix: clean Probability split and prerequisites'
          git push
