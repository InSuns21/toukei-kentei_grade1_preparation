name: Normalize indicator notation once

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/normalize_indicator_notation_once.mjs'
      - '.github/workflows/normalize-indicator-once.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize indicator notation
        run: node scripts/normalize_indicator_notation_once.mjs

      - name: Commit normalized sources
        run: |
          if git diff --quiet; then
            echo "No normalization needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add statistical-mathematics applied-rikou-80 anki
          git commit -m "Normalize indicator-function notation"
          git push
