name: One-off normalize textbook prerequisites

on:
  push:
    branches:
      - audit/textbook-prerequisite-drift-s2
    paths:
      - '.github/workflows/one-off-normalize-textbook-prerequisites.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/textbook-prerequisite-drift-s2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Normalize prerequisite metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path

          curriculum = Path('textbook/curriculum.yaml')
          text = curriculum.read_text()
          replacements = {
            '  - { id: P2-01, title: 確率変数・確率質量関数・確率密度関数・累積分布関数, volume: probability, prerequisites: [ P1-02 ], official_scope: [ 確率関数, 確率密度関数, 累積分布関数, 同時分布, 周辺分布 ] }':
            '  - { id: P2-01, title: 確率変数・確率質量関数・確率密度関数・累積分布関数, volume: probability, prerequisites: [ P1-02, F0-00 ], official_scope: [ 確率関数, 確率密度関数, 累積分布関数, 同時分布, 周辺分布 ] }',
            '  - { id: P4-02, title: 確率変数の収束・大数則・中心極限定理, volume: distributions, prerequisites: [ P2-02, P3-02 ], official_scope: [ 大数の弱法則, 中心極限定理, 正規近似, ポアソン近似, 少数法則 ] }':
            '  - { id: P4-02, title: 確率変数の収束・大数則・中心極限定理, volume: distributions, prerequisites: [ F0-00, P2-02, P3-01, P3-02 ], official_scope: [ 大数の弱法則, 中心極限定理, 正規近似, ポアソン近似, 少数法則 ] }',
            '  - { id: E2-01, title: Markov連鎖, volume: engineering, prerequisites: [ P1-02, F0-00 ], official_scope: [ マルコフ連鎖, マルコフ過程 ] }':
            '  - { id: E2-01, title: Markov連鎖, volume: engineering, prerequisites: [ P1-02, P2-01, F0-00 ], official_scope: [ マルコフ連鎖, マルコフ過程 ] }',
            '  - { id: L1-02, title: 重回帰・線形モデルの行列表現, volume: linear_models, prerequisites: [ L1-01 ], official_scope: [ 線形重回帰, ガウス・マルコフの定理, 線形対比, 線形制約, 線形結合の分布, 重相関係数 ] }':
            '  - { id: L1-02, title: 重回帰・線形モデルの行列表現, volume: linear_models, prerequisites: [ L1-01, F0-00, P3-03, S1-01 ], official_scope: [ 線形重回帰, ガウス・マルコフの定理, 線形対比, 線形制約, 線形結合の分布, 重相関係数 ] }',
            '  - { id: L2-01, title: 一般化線形モデル, volume: linear_models, prerequisites: [ P3-01, L1-02 ], official_scope: [ 一般化線形モデル, ロジスティック回帰, ポアソン回帰 ] }':
            '  - { id: L2-01, title: 一般化線形モデル, volume: linear_models, prerequisites: [ P3-01, L1-02, P2-02, F0-00 ], official_scope: [ 一般化線形モデル, ロジスティック回帰, ポアソン回帰 ] }',
            '  - { id: E4-01, title: 管理図と工程能力, volume: engineering, prerequisites: [ P3-02, P4-02 ], official_scope: [ 管理図, プロセス管理, 工程能力指数 ] }':
            '  - { id: E4-01, title: 管理図と工程能力, volume: engineering, prerequisites: [ P3-01, P3-02, P4-02 ], official_scope: [ 管理図, プロセス管理, 工程能力指数 ] }',
            '  - { id: E4-02, title: 信頼性・保全性, volume: engineering, prerequisites: [ P3-02, P3-05, E4-01 ], official_scope: [ 信頼性, 保全性, ハザード, MTBF ] }':
            '  - { id: E4-02, title: 信頼性・保全性, volume: engineering, prerequisites: [ P3-02, P3-05, E2-01 ], official_scope: [ 信頼性, 保全性, ハザード, MTBF ] }',
            '  - { id: E3-01, title: 実験計画・直交表・交絡, volume: engineering, prerequisites: [ L1-03 ], official_scope: [ 実験の計画と実施, フィッシャーの3原則, 一元配置法, 二元配置法, 固定効果, 変量効果, 交絡因子, ブロック化, 乱塊法, 直交表, 一部実施要因計画, 交絡法 ] }':
            '  - { id: E3-01, title: 実験計画・直交表・交絡, volume: engineering, prerequisites: [ L1-03, L1-02 ], official_scope: [ 実験の計画と実施, フィッシャーの3原則, 一元配置法, 二元配置法, 固定効果, 変量効果, 交絡因子, ブロック化, 乱塊法, 直交表, 一部実施要因計画, 交絡法 ] }',
            '  - { id: E1-03, title: 因子分析・クラスター分析, volume: engineering, prerequisites: [ E1-01, E1-02 ], official_scope: [ 因子分析, クラスター分析 ] }':
            '  - { id: E1-03, title: 因子分析・クラスター分析, volume: engineering, prerequisites: [ E1-01, E1-02, F0-00 ], official_scope: [ 因子分析, クラスター分析 ] }',
            '  - { id: E1-04, title: プロビット・非線形回帰・SVM, volume: engineering, prerequisites: [ E1-01, L2-01 ], official_scope: [ プロビット分析, 非線形回帰モデル, サポートベクターマシン, トービット分析 ] }':
            '  - { id: E1-04, title: プロビット・非線形回帰・SVM, volume: engineering, prerequisites: [ L2-01, L1-01, F0-00 ], official_scope: [ プロビット分析, 非線形回帰モデル, サポートベクターマシン, トービット分析 ] }',
            '  - { id: S1-02, title: 統計量・十分性・分解定理, volume: inference, prerequisites: [ S1-01, P4-01 ], official_scope: [ 十分統計量, ネイマンの分解定理 ] }':
            '  - { id: S1-02, title: 統計量・十分性・分解定理, volume: inference, prerequisites: [ S1-01, P4-01, P2-02 ], official_scope: [ 十分統計量, ネイマンの分解定理 ] }',
            '  - { id: S1-03, title: 標本抽出・研究設計, volume: inference, prerequisites: [ P3-01, P4-02 ], official_scope: [ 実験研究, 観察研究, 調査, 完全無作為抽出, 単純無作為抽出, 層化抽出, 二段階抽出, サンプルサイズの設計, Horvitz--Thompson推定量, 有限母集団補正, 比推定量, 標本設計 ] }':
            '  - { id: S1-03, title: 標本抽出・研究設計, volume: inference, prerequisites: [ P3-01, P4-02, P2-02 ], official_scope: [ 実験研究, 観察研究, 調査, 完全無作為抽出, 単純無作為抽出, 層化抽出, 二段階抽出, サンプルサイズの設計, Horvitz--Thompson推定量, 有限母集団補正, 比推定量, 標本設計 ] }',
            '  - { id: I1-01, title: 尤度・最尤推定, volume: inference, prerequisites: [ S1-02 ], official_scope: [ 尤度関数, 対数尤度関数, 有効スコア関数, 最尤推定 ] }':
            '  - { id: I1-01, title: 尤度・最尤推定, volume: inference, prerequisites: [ S1-02, P3-05 ], official_scope: [ 尤度関数, 対数尤度関数, 有効スコア関数, 最尤推定 ] }',
            '  - { id: I4-02, title: 欠測・不完全データ・期待値最大化法, volume: inference, prerequisites: [ I1-01, P1-02, P3-04, P3-03 ], official_scope: [ 欠測, 不完全データ, 観測データ尤度, 期待値最大化法, 打ち切り, 切断 ] }':
            '  - { id: I4-02, title: 欠測・不完全データ・期待値最大化法, volume: inference, prerequisites: [ I1-01, P1-02, P3-04, P3-03, P3-05 ], official_scope: [ 欠測, 不完全データ, 観測データ尤度, 期待値最大化法, 打ち切り, 切断 ] }',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'curriculum replacement expected 1 match, got {count}: {old[:80]}')
              text = text.replace(old, new)
          curriculum.write_text(text)

          chapter = Path('textbook/volumes/05_engineering/E1_04_プロビット_非線形回帰_SVM/chapter.yaml')
          text = chapter.read_text()
          old = '''prerequisites:\n  - E1-01\n  - L2-01\n  - L1-01\n  - F0-00\n'''
          new = '''prerequisites:\n  - L2-01\n  - L1-01\n  - F0-00\n'''
          if text.count(old) != 1:
              raise SystemExit(f'E1-04 prerequisite block expected 1 match, got {text.count(old)}')
          chapter.write_text(text.replace(old, new))
          PY
      - name: Validate normalized DAG
        run: |
          npm run validate:structure
          node scripts/audit-textbook-knowledge-dag.mjs --strict
      - name: Commit normalized metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add textbook/curriculum.yaml "textbook/volumes/05_engineering/E1_04_プロビット_非線形回帰_SVM/chapter.yaml"
          git diff --cached --quiet && exit 1
          git commit -m "Normalize textbook prerequisite metadata"
          git push origin HEAD:audit/textbook-prerequisite-drift-s2
