name: Validate DREAM THEATER concepts

on:
  pull_request:
    paths:
      - 'textbook/dream-theater-index.json'
      - 'textbook/dream-theater-knowledge.yaml'
      - 'textbook/volumes/00_foundations/**'
      - 'scripts/audit-dream-theater-concepts.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-dream-theater-concepts.yml'
  push:
    branches:
      - main
    paths:
      - 'textbook/dream-theater-index.json'
      - 'textbook/dream-theater-knowledge.yaml'
      - 'textbook/volumes/00_foundations/**'
      - 'scripts/audit-dream-theater-concepts.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-dream-theater-concepts.yml'
  workflow_dispatch:

jobs:
  validate-dream-theater-concepts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate changed DREAM THEATER pages
        env:
          DREAM_THEATER_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run validate:dream-theater-concepts:changed

      - name: Audit full DREAM THEATER concept coverage
        run: npm run audit:dream-theater-concepts
