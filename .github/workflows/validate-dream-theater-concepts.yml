name: Validate DREAM THEATER concepts

on:
  pull_request:
    paths:
      - 'textbook/dream-theater-index.json'
      - 'textbook/dream-theater-knowledge.yaml'
      - 'textbook/dream-theater-inference-rules.yaml'
      - 'textbook/volumes/00_foundations/**'
      - 'scripts/audit-dream-theater-concepts.mjs'
      - 'scripts/audit-dream-theater-formal-order.mjs'
      - 'scripts/audit-dream-theater-explicit-dependencies.mjs'
      - 'scripts/audit-dream-theater-implicit-dependencies.mjs'
      - 'scripts/audit-dream-theater-undefined-terms.mjs'
      - 'scripts/audit-dream-theater-undefined-terms-filtered.mjs'
      - 'scripts/lib/dream-theater-concept-resolution.mjs'
      - 'scripts/validate-dream-theater-concepts-changed.mjs'
      - 'scripts/detect-dream-theater-concept-audit-scope.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-dream-theater-concepts.yml'
  push:
    branches:
      - main
    paths:
      - 'textbook/dream-theater-index.json'
      - 'textbook/dream-theater-knowledge.yaml'
      - 'textbook/dream-theater-inference-rules.yaml'
      - 'textbook/volumes/00_foundations/**'
      - 'scripts/audit-dream-theater-concepts.mjs'
      - 'scripts/audit-dream-theater-formal-order.mjs'
      - 'scripts/audit-dream-theater-explicit-dependencies.mjs'
      - 'scripts/audit-dream-theater-implicit-dependencies.mjs'
      - 'scripts/audit-dream-theater-undefined-terms.mjs'
      - 'scripts/audit-dream-theater-undefined-terms-filtered.mjs'
      - 'scripts/lib/dream-theater-concept-resolution.mjs'
      - 'scripts/validate-dream-theater-concepts-changed.mjs'
      - 'scripts/detect-dream-theater-concept-audit-scope.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-dream-theater-concepts.yml'
  workflow_dispatch:

concurrency:
  group: dream-theater-concepts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-dream-theater-concepts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Self-test DREAM THEATER concept audits
        run: |
          npm run test:dream-theater-concept-audits
          node scripts/detect-dream-theater-concept-audit-scope.mjs --self-test

      - name: Detect full-audit scope
        id: audit-scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/detect-dream-theater-concept-audit-scope.mjs --base "$BASE_SHA"

      - name: Validate changed DREAM THEATER pages
        if: github.event_name == 'pull_request'
        env:
          DREAM_THEATER_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run validate:dream-theater-concepts:changed

      - name: Audit full DREAM THEATER concept coverage
        if: github.event_name != 'pull_request' || steps.audit-scope.outputs.full == 'true'
        run: npm run audit:dream-theater-concepts
