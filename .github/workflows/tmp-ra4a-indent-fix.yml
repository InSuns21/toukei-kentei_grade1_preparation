name: Temporary RA4A YAML indent fix
on:
  push:
    branches: [feat/ra4a-improper-integrals]
    paths: [.github/workflows/tmp-ra4a-indent-fix.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ra4a-improper-integrals
      - name: Fix indentation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('textbook/dream-theater-standard-math-core.yaml')
          lines=p.read_text().splitlines()
          out=[]; inside=False
          for line in lines:
              if line == '  - id: RA4A':
                  inside=True
                  out.append(line)
                  continue
              if inside and line == '  - id: RA5':
                  inside=False
              if inside and line.startswith('  ') and not line.startswith('    '):
                  line='  '+line
              out.append(line)
          p.write_text('\n'.join(out)+'\n')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-ra4a-indent-fix.yml
          git add textbook/dream-theater-standard-math-core.yaml
          git commit -m "Fix RA4A standard-core YAML indentation"
          git push origin HEAD:feat/ra4a-improper-integrals
