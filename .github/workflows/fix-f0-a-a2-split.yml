name: Fix F0 A A2 split

on:
  push:
    branches:
      - feat/f0-batch2-lebesgue-integration-foundations
    paths:
      - '.github/workflows/fix-f0-a-a2-split.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f0-batch2-lebesgue-integration-foundations
      - name: Clean split headings and navigation
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const files=[
            'textbook/volumes/00_foundations/F0_00A_集合_写像_上限下限/index.md',
            'textbook/volumes/00_foundations/F0_00A1_上界_下界_supremum_infimum/index.md',
            'textbook/volumes/00_foundations/F0_00A2_選択公理_Zorn_極大原理/index.md',
            'textbook/volumes/00_foundations/F0_00A3_半順序_Zorn_極大延長/index.md'
          ];
          for(const p of files){
            let t=fs.readFileSync(p,'utf8');
            while(t.includes('\n---\n\n---\n')) t=t.replaceAll('\n---\n\n---\n','\n---\n');
            fs.writeFileSync(p,t);
          }
          let p=files[1], t=fs.readFileSync(p,'utf8');
          t=t.replace('### 8.1 maximum / minimumとの違い','### 2.1 maximum / minimumとの違い');
          fs.writeFileSync(p,t);
          p=files[3]; t=fs.readFileSync(p,'utf8');
          t=t.replace('### 6.1 例','### 2.1 例').replace('A_* $','A_*$');
          fs.writeFileSync(p,t);

          // Facade: use new responsibilities and insert A3.
          p='textbook/dream-theater.md'; t=fs.readFileSync(p,'utf8');
          t=t.replace('1. [F0-00A 集合・写像・上限下限]','1. [F0-00A 集合・写像・量化記号]');
          t=t.replace('3. [F0-00A2 選択公理・Zornの補題・極大原理]','3. [F0-00A2 選択関数・選択公理・可算選択]');
          if(!t.includes('[F0-00A3 半順序・Zornの補題・極大延長]')){
            t=t.replace(
              '3. [F0-00A2 選択関数・選択公理・可算選択](textbook/volumes/00_foundations/F0_00A2_選択公理_Zorn_極大原理/index.md)\n4. [F0-00B',
              '3. [F0-00A2 選択関数・選択公理・可算選択](textbook/volumes/00_foundations/F0_00A2_選択公理_Zorn_極大原理/index.md)\n4. [F0-00A3 半順序・Zornの補題・極大延長](textbook/volumes/00_foundations/F0_00A3_半順序_Zorn_極大延長/index.md)\n5. [F0-00B'
            );
            const s=t.indexOf('#### 基礎論\n\n'), e=t.indexOf('\n\n#### 制約付き最適化',s);
            let b=t.slice(s,e), n=0; b=b.replace(/^\d+\. /gm,()=>`${++n}. `); t=t.slice(0,s)+b+t.slice(e);
          }
          fs.writeFileSync(p,t);

          // Proof audit routes follow the actual split lectures.
          p='textbook/f0-dream-theater-proof-audit.md'; t=fs.readFileSync(p,'utf8');
          t=t.replace('A → A2 → B → C → D → D2 → D2A → D2B → D2C → D2D → D2E → E → E2 → F → G',
                      'A → A1 → A2 → A3 → B → F0-00C → F0-00C1 → F0-00C2 → D → D1 → D2 → D2A → D2B → D2C → D2D → D2E → E → E2 → F → G');
          t=t.replace('F0-02 → 02A → 02B → C1 → C2 → C3 → C4 → C5 → C6 → C7',
                      'F0-02 → 02A → 02B → F0-02C1 → C2 → C3 → C4 → C5 → C6 → C7');
          fs.writeFileSync(p,t);

          // Dependency graph: DREAM THEATER measure-construction branch returns to D2A.
          p='textbook/dependency-graph.md'; t=fs.readFileSync(p,'utf8');
          t=t.replace('F0-00D5 Vitali集合・非可測集合・選択公理\n  ↓\nF0-00Eへ復帰',
                      'F0-00D5 Vitali集合・非可測集合・選択公理\n  ↓\nF0-00D2Aへ復帰');
          fs.writeFileSync(p,t);
          NODE
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook
          git diff --cached --quiet && exit 0
          git commit -m 'fix: clean A and A2 split navigation'
          git push
