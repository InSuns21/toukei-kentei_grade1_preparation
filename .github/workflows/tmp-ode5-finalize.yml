name: Temporary ODE5 finalize

on:
  push:
    branches:
      - feat/ode5-laplace-ivp

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ode5-laplace-ivp
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch validation findings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('textbook/volumes/00_foundations/ODE5/index.md')
          s = p.read_text()
          replacements = {
              '- 畳み込み定理で積分順序を変えてよいのはなぜか。': '- 時間領域の積分による重ね合わせを、なぜ $s$ 領域の積として扱えるか。',
              '各 $y^{(k)}$ を微分則で変換すると、$s^kY$ と初期値多項式に分かれます。$Y$ の係数を集めるとちょうど特性多項式 $P(s)$ になります。': '各 $y^{(k)}$ を微分則で変換すると、$s^kY$ と初期値多項式に分かれます。$Y$ の係数を集めると、ちょうど上で定めた多項式 $P(s)$ になります。',
              '工学ではこの $h$ を**インパルス応答**と呼びます。': '工学では、この $h$ には**インパルス応答**という名称がよく使われます。',
              '畳み込み定理の最小例がすでに見えています。': 'この積の関係の最小例がすでに見えています。',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'missing ODE5 replacement target: {old}')
              s = s.replace(old, new, 1)

          def link_after(text, anchor, term, target):
              a = text.index(anchor)
              end = text.index('<!-- proof-end -->', a) + len('<!-- proof-end -->')
              head, tail = text[:end], text[end:]
              return head + tail.replace(term, f'[{term}]({target})')

          s = link_after(s, '<a id="thm-ode5-frequency-shift"></a>', '指数移動則', '#thm-ode5-frequency-shift')
          s = link_after(s, '<a id="thm-ode5-time-shift"></a>', '時間移動則', '#thm-ode5-time-shift')
          s = link_after(s, '<a id="thm-ode5-convolution"></a>', '畳み込み定理', '#thm-ode5-convolution')
          s = s.replace('[畳み込み定理](#thm-ode5-convolution)', '[Laplace変換の畳み込み定理](#thm-ode5-convolution)')
          p.write_text(s)

          p = Path('textbook/volumes/00_foundations/ODE5/knowledge.yaml')
          s = p.read_text()
          old = '''  - id: ode.ode5-convolution-theorem\n    name: 畳み込み定理\n    kind: theorem\n    aliases: [畳み込み定理, convolution theorem]'''
          new = '''  - id: ode.ode5-convolution-theorem\n    name: Laplace変換の畳み込み定理\n    kind: theorem\n    aliases: [Laplace変換の畳み込み定理, Laplace畳み込み定理, Laplace convolution theorem]'''
          if old not in s:
              raise SystemExit('missing convolution theorem knowledge target')
          p.write_text(s.replace(old, new, 1))

          p = Path('textbook/volumes/00_foundations/ODE5/chapter.yaml')
          s = p.read_text()
          old = '- { id: ODE5-THM-05, name: 畳み込み定理 }'
          new = '- { id: ODE5-THM-05, name: Laplace変換の畳み込み定理 }'
          if old not in s:
              raise SystemExit('missing convolution theorem chapter target')
          p.write_text(s.replace(old, new, 1))

          p = Path('textbook/volumes/00_foundations/ODE5/glossary.yaml')
          s = p.read_text()
          old = '  - term: 畳み込み定理\n'
          if old not in s:
              raise SystemExit('missing convolution theorem glossary target')
          p.write_text(s.replace(old, '  - term: Laplace変換の畳み込み定理\n', 1))

          p = Path('textbook/dream-theater.md')
          s = p.read_text()
          old = '''6. [ODE4 非線形系・位相平面・線形化](textbook/volumes/00_foundations/ODE4/index.md)\n7. [FA1 Fourier級数・直交展開](textbook/volumes/00_foundations/F0_00FA1_Fourier級数_直交展開/index.md)\n8. [FA2 Fourier変換・畳み込み・反転](textbook/volumes/00_foundations/F0_00FA2_Fourier変換_畳み込み_反転/index.md)\n9. [FA3 Plancherel・L2・特性関数](textbook/volumes/00_foundations/F0_00FA3_Plancherel_L2_特性関数/index.md)\n10. [PDE1 熱方程式・Fourier変換](textbook/volumes/00_foundations/F0_00PDE1_熱方程式_Fourier変換/index.md)\n11. [PDE2 波動方程式・Laplace方程式](textbook/volumes/00_foundations/F0_00PDE2_波動方程式_Laplace方程式_変数分離/index.md)\n12. [PDE3 Sturm–Liouville・スペクトル展開](textbook/volumes/00_foundations/F0_00PDE3_Sturm_Liouville_スペクトル展開/index.md)'''
          new = '''6. [ODE4 非線形系・位相平面・線形化](textbook/volumes/00_foundations/ODE4/index.md)\n7. [ODE5 Laplace変換と初期値問題](textbook/volumes/00_foundations/ODE5/index.md)\n8. [FA1 Fourier級数・直交展開](textbook/volumes/00_foundations/F0_00FA1_Fourier級数_直交展開/index.md)\n9. [FA2 Fourier変換・畳み込み・反転](textbook/volumes/00_foundations/F0_00FA2_Fourier変換_畳み込み_反転/index.md)\n10. [FA3 Plancherel・L2・特性関数](textbook/volumes/00_foundations/F0_00FA3_Plancherel_L2_特性関数/index.md)\n11. [PDE1 熱方程式・Fourier変換](textbook/volumes/00_foundations/F0_00PDE1_熱方程式_Fourier変換/index.md)\n12. [PDE2 波動方程式・Laplace方程式](textbook/volumes/00_foundations/F0_00PDE2_波動方程式_Laplace方程式_変数分離/index.md)\n13. [PDE3 Sturm–Liouville・スペクトル展開](textbook/volumes/00_foundations/F0_00PDE3_Sturm_Liouville_スペクトル展開/index.md)'''
          if old not in s:
              raise SystemExit('missing dream-theater facade target')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Validate ODE5 fully
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="$(git merge-base HEAD origin/main)"
          npm run validate
          npm run validate:pages
          npm run validate:dream-theater-exercise-counts
          DREAM_THEATER_BASE_SHA="$BASE_SHA" TERMINOLOGY_BASE_SHA="$BASE_SHA" npm run validate:dream-theater-concepts:changed
          npm run validate:dream-theater-standard-math-core
          npm run validate:terminology
          npm run audit:proof-pedagogy
          npm run audit:formalism-pedagogy
      - name: Mark ODE5 complete in progress ledger
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('textbook/DREAM_THEATER_ODE_FOURIER_PDE_RESTRUCTURE_PLAN.md')
          s = p.read_text()
          old = '| ODE5 | 未着手 | - | - | ODE2 | 未実施 |'
          new = '| ODE5 | **実装・検証完了（PR #286）** | 指数位数とLaplace変換の収束、線形性・微分則・2種の移動則、逆変換候補の検証、三角領域の積分交換からLaplace変換の畳み込み定理、定係数線形IVP、階段入力、Green核・応答核まで実装 | A4 / B3 / C1。全問に詳細解答あり | ODE2。一般の逆Laplace一意性・Fourier反転・Dirac delta超関数論を逆輸入せず、Green核はODE2正本を参照 | textbook / Pages / exercises / concepts / standard math core / terminology の6系統を検証。proof / formalism pedagogy audit も実行 |'
          if old not in s:
              raise SystemExit('missing ODE5 status row')
          s = s.replace(old, new, 1)
          old = '次の実装単位は **ODE5 Laplace変換と初期値問題**。Laplace変換の定義、線形性・微分・移動則、逆変換、畳み込み、階段関数とインパルス応答の考え方、定係数 ODE の初期値問題までを標準コアとして閉じる。Dirac delta の厳密な超関数論は Encore III へ送る。'
          new = '次の実装単位は **ODE6 級数解・正則特異点**。常点での冪級数解、係数漸化式、正則特異点、Frobenius 法の基本、Bessel / Legendre 方程式を代表例として標準コアを閉じる。特殊関数の百科事典化は避け、ODE2 + RA5 の前提境界を守る。'
          if old not in s:
              raise SystemExit('missing next-unit paragraph')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit validated changes and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-ode5-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook/volumes/00_foundations/ODE5/index.md textbook/volumes/00_foundations/ODE5/knowledge.yaml textbook/volumes/00_foundations/ODE5/chapter.yaml textbook/volumes/00_foundations/ODE5/glossary.yaml textbook/dream-theater.md textbook/DREAM_THEATER_ODE_FOURIER_PDE_RESTRUCTURE_PLAN.md .github/workflows/tmp-ode5-finalize.yml
          git commit -m 'Finalize ODE5 validation fixes and progress'
          git push origin HEAD:feat/ode5-laplace-ivp
