name: Fix P5A B01 title

on:
  push:
    branches:
      - audit/f0-00p5a-slln-pedagogy

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/f0-00p5a-slln-pedagogy
      - name: Normalize B01 title
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('textbook/volumes/00_foundations/F0_00P5A_truncation_Kronecker_一般SLLN/index.md')
          s = p.read_text(encoding='utf-8')
          old = '### F0-00P5A-B01 最大不等式から収束を再構成する'
          new = '### F0-00P5A-B01 tail部分和からCauchy性を再構成する'
          if old not in s:
              raise SystemExit('expected B01 title not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add textbook/volumes/00_foundations/F0_00P5A_truncation_Kronecker_一般SLLN/index.md
          git commit -m 'Clarify P5A B01 exercise title'
          git push origin HEAD:audit/f0-00p5a-slln-pedagogy
