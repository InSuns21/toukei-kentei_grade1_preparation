name: Temporary CA6 retrigger
on:
  push:
    branches: [codex/ca6-mobius-schwarz-poisson]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ca6-mobius-schwarz-poisson
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-ca6-retrigger.yml
          git commit -m "Remove temporary CA6 retrigger workflow"
          git push origin HEAD:codex/ca6-mobius-schwarz-poisson
