name: Validate textbook

on:
  pull_request:
    paths:
      - 'textbook/**'
      - '.github/workflows/validate-textbook.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-textbook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Replace premature Bessel definition example
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/ode6-series-frobenius'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('textbook/volumes/00_foundations/ODE6/index.md')
          text = path.read_text(encoding='utf-8')
          old = '''- Bessel 方程式

$$
x^2y''+xy'+(x^2-\\nu^2)y=0
$$

を $x\\ne0$ で割ると $p=1/x$, $q=1-\\nu^2/x^2$ です。$p,q$ 自身は発散しますが

$$
xp=1,
\\qquad x^2q=x^2-\\nu^2
$$
'''
          new = '''- $x^2y''+xy'-4y=0$ を $x\\ne0$ で割ると $p=1/x$, $q=-4/x^2$ です。$p,q$ 自身は発散しますが

$$
xp=1,
\\qquad x^2q=-4
$$
'''
          if old not in text:
              raise SystemExit('expected premature Bessel example not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook/volumes/00_foundations/ODE6/index.md
          git commit -m 'Use generic regular-singular definition example'
          git push origin HEAD:${{ github.head_ref }}