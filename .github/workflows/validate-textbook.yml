name: Validate textbook

on:
  push:
    branches:
      - main
    paths:
      - 'textbook/**'
      - 'statistical-mathematics/**'
      - 'applied-rikou-80/**'
      - 'scripts/**'
      - 'pages/index.html'
      - 'pages/math-renderer.js'
      - 'references/**'
      - 'agents/**'
      - 'AGENTS.md'
      - 'README.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-textbook.yml'
  pull_request:
    paths:
      - 'textbook/**'
      - 'statistical-mathematics/**'
      - 'applied-rikou-80/**'
      - 'scripts/**'
      - 'pages/index.html'
      - 'pages/math-renderer.js'
      - 'references/**'
      - 'agents/**'
      - 'AGENTS.md'
      - 'README.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-textbook.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-textbook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Resolve final FOU2 concept introduction
        if: github.head_ref == 'dream-theater-fou2-fourier-convergence'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('textbook/volumes/00_foundations/FOU2/index.md')
          text = index.read_text(encoding='utf-8')
          replacements = [
              ('> **定義（各点収束・一様収束・二乗平均収束）**  ',
               '> **定義（三種類の収束）**  '),
              ('- 二乗平均収束から Parseval 等式と三角系の完全性を導いた。',
               '- 二乗平均収束から係数エネルギー等式と三角系の完全性を導いた。'),
              ('- Parseval 等式を $x$ と矩形波へ適用し、逆二乗和を具体的に計算した。',
               '- 係数エネルギー等式を $x$ と矩形波へ適用し、逆二乗和を具体的に計算した。'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one target, found {count}: {old!r}')
              text = text.replace(old, new)
          index.write_text(text, encoding='utf-8')

          knowledge = Path('textbook/volumes/00_foundations/FOU2/knowledge.yaml')
          k = knowledge.read_text(encoding='utf-8')
          for concept_id in [
              'fourier.fou2-pointwise-convergence',
              'fourier.fou2-uniform-convergence',
              'fourier.fou2-mean-square-convergence-definition',
          ]:
              marker = f'  - id: {concept_id}\n'
              start = k.find(marker)
              if start < 0:
                  raise SystemExit(f'concept not found: {concept_id}')
              next_start = k.find('\n  - id: ', start + len(marker))
              end = len(k) if next_start < 0 else next_start
              block = k[start:end]
              if '    introduction_aliases:' not in block:
                  needle = '    introduction: formal\n'
                  if needle not in block:
                      raise SystemExit(f'formal introduction marker not found: {concept_id}')
                  block = block.replace(needle, '    introduction: formal\n    introduction_aliases: [三種類の収束]\n', 1)
                  k = k[:start] + block + k[end:]
          knowledge.write_text(k, encoding='utf-8')
          PY

          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add textbook/volumes/00_foundations/FOU2/index.md textbook/volumes/00_foundations/FOU2/knowledge.yaml
            git commit -m 'Resolve FOU2 local convergence concept introduction'
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit official syllabus term coverage
        run: npm run audit:textbook-syllabus -- --strict

      - name: Validate reader-facing wording
        run: python3 scripts/validate-reader-facing-wording.py

      - name: Validate textbook structure
        run: npm run validate:structure

      - name: Validate textbook knowledge DAG
        run: npm run validate:textbook-knowledge

      - name: Validate textbook math
        run: npm run validate:math

      - name: Validate exercise style
        run: npm run validate:exercise-style

      - name: Validate textbook text
        run: npm run validate:text

      - name: Validate prose outside math
        run: npm run validate:prose-math

      - name: Validate collapsible proof sections
        run: npm run validate:proof-folding

      - name: Validate formal statement panels and anchors
        run: npm run validate:formal-statements

      - name: Block new prose-style formal definitions
        run: npm run validate:implicit-formals

      - name: Validate named theorem-like results
        run: npm run validate:named-formals

      - name: Validate formal theorem and definition references
        run: npm run validate:formal-references

      - name: Validate definition examples against their definitions
        run: npm run validate:definition-examples