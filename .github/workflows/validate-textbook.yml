name: Validate textbook

on:
  push:
    branches:
      - main
    paths:
      - 'textbook/**'
      - 'statistical-mathematics/**'
      - 'applied-rikou-80/**'
      - 'scripts/**'
      - 'pages/index.html'
      - 'pages/math-renderer.js'
      - 'references/**'
      - 'agents/**'
      - 'AGENTS.md'
      - 'README.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-textbook.yml'
  pull_request:
    paths:
      - 'textbook/**'
      - 'statistical-mathematics/**'
      - 'applied-rikou-80/**'
      - 'scripts/**'
      - 'pages/index.html'
      - 'pages/math-renderer.js'
      - 'references/**'
      - 'agents/**'
      - 'AGENTS.md'
      - 'README.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-textbook.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-textbook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Rename ODE6 real power-series concept
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/ode6-series-frobenius'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('textbook/volumes/00_foundations/ODE6/index.md')
          text = index.read_text(encoding='utf-8').replace('実解析性', '局所収束冪級数表示')
          if '実解析性' in text or '実解析的' in text:
              raise SystemExit('ODE6 index still contains ambiguous real-analytic wording')
          index.write_text(text, encoding='utf-8')

          chapter = Path('textbook/volumes/00_foundations/ODE6/chapter.yaml')
          text = chapter.read_text(encoding='utf-8')
          text = text.replace('実解析的な係数', '局所収束冪級数表示をもつ係数')
          text = text.replace('一意な解析的解', '一意な局所冪級数解')
          text = text.replace('name: 実解析性', 'name: 局所収束冪級数表示')
          chapter.write_text(text, encoding='utf-8')

          knowledge = Path('textbook/volumes/00_foundations/ODE6/knowledge.yaml')
          text = knowledge.read_text(encoding='utf-8')
          text = text.replace('name: 実解析性', 'name: 局所収束冪級数表示')
          text = text.replace('aliases: [実解析性, 実解析的, real analytic]', 'aliases: [局所収束冪級数表示, 収束冪級数表示, local convergent power-series representation]')
          knowledge.write_text(text, encoding='utf-8')
          PY
          if ! git diff --quiet -- textbook/volumes/00_foundations/ODE6; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add textbook/volumes/00_foundations/ODE6
            git commit -m 'Rename ODE6 real power-series concept'
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit official syllabus term coverage
        run: npm run audit:textbook-syllabus -- --strict

      - name: Validate reader-facing wording
        run: python3 scripts/validate-reader-facing-wording.py

      - name: Validate textbook structure
        run: npm run validate:structure

      - name: Validate textbook knowledge DAG
        run: npm run validate:textbook-knowledge

      - name: Validate textbook math
        run: npm run validate:math

      - name: Validate exercise style
        run: npm run validate:exercise-style

      - name: Validate textbook text
        run: npm run validate:text

      - name: Validate prose outside math
        run: npm run validate:prose-math

      - name: Validate collapsible proof sections
        run: npm run validate:proof-folding

      - name: Validate formal statement panels and anchors
        run: npm run validate:formal-statements

      - name: Block new prose-style formal definitions
        run: npm run validate:implicit-formals

      - name: Validate named theorem-like results
        run: npm run validate:named-formals

      - name: Validate formal theorem and definition references
        run: npm run validate:formal-references

      - name: Validate definition examples against their definitions
        run: npm run validate:definition-examples

      - name: Audit proof pedagogy
        run: npm run audit:proof-pedagogy

      - name: Audit formalism pedagogy
        run: npm run audit:formalism-pedagogy