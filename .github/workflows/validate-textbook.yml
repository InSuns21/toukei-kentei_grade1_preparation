name: Validate textbook

on:
  push:
    branches:
      - main
    paths:
      - 'textbook/**'
      - 'statistical-mathematics/**'
      - 'applied-rikou-80/**'
      - 'scripts/**'
      - 'pages/index.html'
      - 'pages/math-renderer.js'
      - 'references/**'
      - 'agents/**'
      - 'AGENTS.md'
      - 'README.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-textbook.yml'
  pull_request:
    paths:
      - 'textbook/**'
      - 'statistical-mathematics/**'
      - 'applied-rikou-80/**'
      - 'scripts/**'
      - 'pages/index.html'
      - 'pages/math-renderer.js'
      - 'references/**'
      - 'agents/**'
      - 'AGENTS.md'
      - 'README.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-textbook.yml'
  workflow_dispatch:

jobs:
  migrate-formal-references:
    if: github.event_name == 'pull_request' && github.head_ref == 'audit/dream-theater-formal-reference-dag-s16'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Add the three missing canonical source anchors
        shell: python
        run: |
          from pathlib import Path

          edits = {
              Path('textbook/volumes/00_foundations/F0_02C1_ノルム空間_Banach_Hilbert/index.md'): (
                  '## 9. すべてのノルムが内積から来るわけではない',
                  '<a id="ref-parallelogram-identity"></a>\n\n## 9. すべてのノルムが内積から来るわけではない',
              ),
              Path('textbook/volumes/00_foundations/F0_02C2_線形汎関数_双対空間_Riesz/index.md'): (
                  '## 11. Hilbert空間では双対が再びベクトルになる',
                  '<a id="ref-riesz-representation"></a>\n\n## 11. Hilbert空間では双対が再びベクトルになる',
              ),
              Path('textbook/volumes/00_foundations/F0_02C6_Hahn_Banach_分離定理/index.md'): (
                  '## 12. ノルム空間での重要な系：ノルム保存拡張',
                  '<a id="ref-hahn-banach-norm-preserving-extension"></a>\n\n## 12. ノルム空間での重要な系：ノルム保存拡張',
              ),
          }

          for path, (needle, replacement) in edits.items():
              text = path.read_text()
              if replacement in text:
                  continue
              if needle not in text:
                  raise SystemExit(f'migration anchor insertion point not found: {path}')
              path.write_text(text.replace(needle, replacement, 1))

      - name: Rewrite named proof dependencies to canonical DAG sources
        run: |
          node scripts/validate-formal-reference-links-dag.mjs --fix || true
          node scripts/validate-formal-reference-links-dag.mjs --fix || true

      - name: Inspect migrated formal references
        run: npm run validate:formal-references

      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No migration changes.'
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook/volumes
          git commit -m 'Finish knowledge DAG proof links'
          git push origin HEAD:${{ github.head_ref }}

  validate-textbook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit official syllabus term coverage
        run: npm run audit:textbook-syllabus -- --strict

      - name: Validate reader-facing wording
        run: python3 scripts/validate-reader-facing-wording.py

      - name: Validate textbook structure
        run: npm run validate:structure

      - name: Validate textbook knowledge DAG
        run: npm run validate:textbook-knowledge

      - name: Validate textbook math
        run: npm run validate:math

      - name: Validate exercise style
        run: npm run validate:exercise-style

      - name: Validate textbook text
        run: npm run validate:text

      - name: Validate prose outside math
        run: npm run validate:prose-math

      - name: Validate collapsible proof sections
        run: npm run validate:proof-folding

      - name: Validate formal statement panels and anchors
        run: npm run validate:formal-statements

      - name: Block new prose-style formal definitions
        run: npm run validate:implicit-formals

      - name: Validate named theorem-like results
        run: npm run validate:named-formals

      - name: Validate formal theorem and definition references
        run: npm run validate:formal-references

      - name: Validate definition examples against their definitions
        run: npm run validate:definition-examples