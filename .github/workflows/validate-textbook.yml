name: Validate textbook

on:
  push:
    branches:
      - main
    paths:
      - 'textbook/**'
      - 'statistical-mathematics/**'
      - 'applied-rikou-80/**'
      - 'scripts/**'
      - 'pages/index.html'
      - 'pages/math-renderer.js'
      - 'references/**'
      - 'agents/**'
      - 'AGENTS.md'
      - 'README.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/recover-pages-deploy.yml'
      - '.github/workflows/validate-textbook.yml'
  pull_request:
    paths:
      - 'textbook/**'
      - 'statistical-mathematics/**'
      - 'applied-rikou-80/**'
      - 'scripts/**'
      - 'pages/index.html'
      - 'pages/math-renderer.js'
      - 'references/**'
      - 'agents/**'
      - 'AGENTS.md'
      - 'README.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-textbook.yml'
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:

concurrency:
  group: validate-textbook-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-textbook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve PR merge-base parent for diff validation
        if: github.event_name == 'pull_request'
        run: echo "PR_COMPARISON_SHA=$(git rev-parse HEAD^1)" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Block both failures seen after concurrent merges in the same required PR check.
      # The full index check (not facade-only) also validates chapter.yaml titles.
      - name: Validate DREAM THEATER public index and source alignment
        run: npm run validate:dream-theater-index

      - name: Validate formal statement panels and math layout
        run: npm run validate:formal-statements

      - name: Validate DREAM THEATER work-state router
        run: npm run validate:dream-theater-work

      - name: Self-test Lorentz metric sign convention
        run: npm run validate:lorentz-signature -- --self-test

      - name: Reject new positive-time Lorentz metric declarations
        if: github.event_name == 'pull_request'
        env:
          TEXTBOOK_BASE_SHA: ${{ env.PR_COMPARISON_SHA }}
        run: npm run validate:lorentz-signature -- --base "$TEXTBOOK_BASE_SHA"

      - name: Self-test validation scope semantics
        if: github.event_name == 'pull_request'
        run: node scripts/detect-textbook-validation-scope.mjs --self-test

      - name: Detect pull-request validation scope
        if: github.event_name == 'pull_request'
        id: scope
        env:
          TEXTBOOK_BASE_SHA: ${{ env.PR_COMPARISON_SHA }}
        run: node scripts/detect-textbook-validation-scope.mjs --github-output

      # Nonblocking notice: a PR may have accidentally carried unrelated chapter edits.
      - name: Self-test DREAM THEATER PR chapter scope advisory
        if: github.event_name == 'pull_request'
        run: node scripts/warn-dream-theater-pr-scope.mjs --self-test

      - name: Warn on unexpected DREAM THEATER chapter changes
        if: github.event_name == 'pull_request'
        env:
          TEXTBOOK_BASE_SHA: ${{ env.PR_COMPARISON_SHA }}
        run: node scripts/warn-dream-theater-pr-scope.mjs --base "$TEXTBOOK_BASE_SHA"

      - name: Self-test DREAM THEATER review evidence coverage
        if: github.event_name == 'pull_request'
        run: node scripts/validate-dream-theater-review-evidence.mjs --self-test

      - name: Validate DREAM THEATER chapter review evidence
        if: github.event_name == 'pull_request'
        env:
          TEXTBOOK_BASE_SHA: ${{ env.PR_COMPARISON_SHA }}
        run: node scripts/validate-dream-theater-review-evidence.mjs --base "$TEXTBOOK_BASE_SHA"

      - name: Self-test stable formal reference validation
        if: github.event_name == 'pull_request'
        run: node scripts/validate-formal-reference-links-dag.mjs --self-test

      - name: Self-test DREAM THEATER math layout lint
        run: npm run audit:math-layout -- --self-test

      - name: Inventory all DREAM THEATER numbering and math layouts
        if: github.event_name == 'pull_request'
        run: npm run audit:math-layout

      - name: Check math layout regressions in changed DREAM THEATER chapters
        if: github.event_name == 'pull_request'
        env:
          TEXTBOOK_BASE_SHA: ${{ env.PR_COMPARISON_SHA }}
        run: npm run audit:math-layout -- --changed-only --strict --base "$TEXTBOOK_BASE_SHA"

      - name: Report math layout density on main and nightly
        if: github.event_name != 'pull_request'
        run: npm run audit:math-layout

      - name: Validate changed textbook guardrails
        if: github.event_name == 'pull_request'
        env:
          TEXTBOOK_BASE_SHA: ${{ env.PR_COMPARISON_SHA }}
        run: npm run validate:textbook:changed -- --base "$TEXTBOOK_BASE_SHA"

      - name: Verify ORI animated SVG model invariants and fallback assets
        run: npm run test:ori-svg-phase-a

      - name: Verify ORI Phase B thirteen SVG models and fallbacks
        run: npm run test:ori-svg-phase-b

      - name: Fast validate changed textbook dependencies and SVG
        if: github.event_name == 'pull_request' && steps.scope.outputs.full != 'true'
        env:
          TEXTBOOK_BASE_SHA: ${{ env.PR_COMPARISON_SHA }}
          TEXTBOOK_KNOWLEDGE_BASE_SHA: ${{ env.PR_COMPARISON_SHA }}
        run: |
          npm run validate:svg-layout:changed -- --base "$TEXTBOOK_BASE_SHA"
          npm run validate:svg-quality -- --self-test
          npm run validate:svg-quality:changed -- --base "$TEXTBOOK_BASE_SHA"
          npm run validate:textbook-knowledge:changed

      - name: Validate changed SVG quality on full-audit PRs
        if: github.event_name == 'pull_request' && steps.scope.outputs.full == 'true'
        env:
          TEXTBOOK_BASE_SHA: ${{ env.PR_COMPARISON_SHA }}
        run: npm run validate:svg-quality:changed -- --base "$TEXTBOOK_BASE_SHA"

      - name: Validate PR structure and formal source invariants
        if: github.event_name == 'pull_request' && steps.scope.outputs.full != 'true'
        run: |
          npm run validate:structure
          npm run validate:implicit-formals
          npm run validate:named-formals
          npm run validate:formal-references
          npm run validate:definition-examples

      - name: Explain fast-path selection
        if: github.event_name == 'pull_request' && steps.scope.outputs.full != 'true'
        run: echo "Changed-only fast path selected; exhaustive textbook audit remains blocking on main and runs nightly."

      - name: Audit official syllabus term coverage
        if: github.event_name != 'pull_request' || steps.scope.outputs.full == 'true'
        run: npm run audit:textbook-syllabus -- --strict

      - name: Validate reader-facing wording
        if: github.event_name != 'pull_request' || steps.scope.outputs.full == 'true'
        run: python3 scripts/validate-reader-facing-wording.py

      - name: Validate textbook structure
        if: github.event_name != 'pull_request' || steps.scope.outputs.full == 'true'
        run: npm run validate:structure

      - name: Validate SVG label geometry
        if: github.event_name != 'pull_request' || steps.scope.outputs.full == 'true'
        run: |
          npm run validate:svg-layout -- --self-test
          npm run validate:svg-layout
          npm run validate:svg-quality -- --self-test
          npm run audit:svg-quality:existing

      # Use the PR's synthetic merge commit parent as the comparison base.
      # NUL-delimited paths support Japanese filenames and safe renames.
      - name: Self-test SVG rendering scope
        if: github.event_name == 'pull_request'
        run: python3 scripts/audit-svg-render.py --self-test

      - name: Detect changed SVGs for rendering
        if: github.event_name == 'pull_request'
        id: svg_render
        run: |
          git diff --name-only -z --diff-filter=ACMR "$PR_COMPARISON_SHA" HEAD -- ':(glob)textbook/volumes/**/*.svg' > "$RUNNER_TEMP/changed-svg-paths.nul"
          if [ -s "$RUNNER_TEMP/changed-svg-paths.nul" ]; then
            echo "render=true" >> "$GITHUB_OUTPUT"
            echo "Changed SVGs detected; render only changed paths."
          else
            echo "render=false" >> "$GITHUB_OUTPUT"
            echo "No changed SVGs; skip font installation and rendering."
          fi

      - name: Render mobile SVG contact sheets for visual inspection
        if: (github.event_name == 'pull_request' && steps.svg_render.outputs.render == 'true') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          # SVG title/desc contain accessibility prose, not painted labels.
          # Latin-only contact sheets should not depend on Ubuntu mirror DNS.
          cjk_needed=yes
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            python3 scripts/svg-needs-cjk-font.py --self-test
            cjk_needed="$(python3 scripts/svg-needs-cjk-font.py --paths-file "$RUNNER_TEMP/changed-svg-paths.nul")"
          fi
          if [ "$cjk_needed" = "no" ]; then
            echo "Changed SVGs contain no visible CJK text; skip font download."
          elif ! fc-list : family | grep -q 'Noto Sans CJK JP'; then
            # Pin upstream revision + Git blob checksum to keep the fallback reproducible.
            noto_file="$RUNNER_TEMP/NotoSansCJKjp-Regular.otf"
            if curl --fail --location --retry 3 --retry-all-errors --connect-timeout 15 \
              --max-time 240 --silent --show-error \
              --output "$noto_file" \
              'https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/OTF/Japanese/NotoSansCJKjp-Regular.otf'; then
              noto_blob="$(git hash-object "$noto_file")"
              if [ "$noto_blob" != 'f56224957fb13a81b4c14bac34f2f058a017f9fb' ]; then
                echo "::error::Noto CJK font checksum mismatch"
                exit 1
              fi
              sudo install -Dm644 "$noto_file" /usr/local/share/fonts/opentype/noto/NotoSansCJKjp-Regular.otf
              fc-cache -f
            else
              echo "::warning::Pinned Noto CJK download failed; trying Ubuntu package"
              sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk || {
                sudo apt-get update -qq
                sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk
              }
            fi
          fi
          python3 -m venv /tmp/svg-render-venv
          /tmp/svg-render-venv/bin/python -m pip install --quiet cairosvg Pillow
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            /tmp/svg-render-venv/bin/python scripts/audit-svg-render.py --paths-file "$RUNNER_TEMP/changed-svg-paths.nul"
          else
            # Nightly and manual runs keep the existing repository-wide audit.
            /tmp/svg-render-venv/bin/python scripts/audit-svg-render.py
          fi

      - name: Attach SVG rendering review images
        if: always() && ((github.event_name == 'pull_request' && steps.svg_render.outputs.render == 'true') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: svg-render-review
          path: _svg_render_review/
          if-no-files-found: warn
          retention-days: 14

      - name: Validate textbook knowledge DAG
        if: github.event_name != 'pull_request' || steps.scope.outputs.full == 'true'
        run: npm run validate:textbook-knowledge

      - name: Validate textbook math
        if: github.event_name != 'pull_request' || steps.scope.outputs.full == 'true'
        run: npm run validate:math

      - name: Self-test textbook math validator
        if: github.event_name == 'pull_request'
        run: npm run validate:math -- --self-test

      - name: Validate changed textbook math
        if: github.event_name == 'pull_request' && steps.scope.outputs.full != 'true'
        env:
          TEXTBOOK_BASE_SHA: ${{ env.PR_COMPARISON_SHA }}
        run: npm run validate:math:changed -- --base "$TEXTBOOK_BASE_SHA"

      - name: Validate exercise style
        if: github.event_name != 'pull_request' || steps.scope.outputs.full == 'true'
        run: npm run validate:exercise-style

      - name: Validate textbook text
        if: github.event_name != 'pull_request' || steps.scope.outputs.full == 'true'
        run: npm run validate:text

      - name: Validate prose outside math
        if: github.event_name != 'pull_request' || steps.scope.outputs.full == 'true'
        run: npm run validate:prose-math

      # U3-04's reproducible numerical check is short and uses Python stdlib only.
      - name: Verify U3-04 self-financing replication experiment
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 textbook/volumes/dream_thater/応用系/U/U3-04/assets/replication.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s textbook/volumes/dream_thater/応用系/U/U3-04/assets/tests -v

      # U3-06: the exhaustive stopping-policy oracle is restricted to tiny trees.
      - name: Verify U3-06 American stopping experiment
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 textbook/volumes/dream_thater/応用系/U/U3-06/assets/american_binomial.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s textbook/volumes/dream_thater/応用系/U/U3-06/assets/tests -v

      # U3-09: fraction-exact barrier oracle and monitoring-set regression suite.
      - name: Verify U3-09 barrier monitoring experiment
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 textbook/volumes/dream_thater/応用系/U/U3-09/assets/barrier_tree_check.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s textbook/volumes/dream_thater/応用系/U/U3-09/assets/tests -v

      # U3-11: independent backward-tree and moment-method comparison.
      - name: Verify U3-11 CRR and trinomial convergence experiment
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 textbook/volumes/dream_thater/応用系/U/U3-11/assets/lattice_pricing.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s textbook/volumes/dream_thater/応用系/U/U3-11/assets/tests -v

      # U3-14: exact-sampling oracle and statistical-error budget.
      - name: Verify U3-14 GBM distribution experiment
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 textbook/volumes/dream_thater/応用系/U/U3-14/assets/gbm_distribution.py
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s textbook/volumes/dream_thater/応用系/U/U3-14/assets/tests -v

      # Fast and full PRs must both check this inexpensive, site-blocking invariant.
      - name: Validate collapsible proof sections
        run: npm run validate:proof-folding

      - name: Block new prose-style formal definitions
        if: github.event_name != 'pull_request' || steps.scope.outputs.full == 'true'
        run: npm run validate:implicit-formals

      - name: Validate named theorem-like results
        if: github.event_name != 'pull_request' || steps.scope.outputs.full == 'true'
        run: npm run validate:named-formals

      - name: Validate formal theorem and definition references
        if: github.event_name != 'pull_request' || steps.scope.outputs.full == 'true'
        run: npm run validate:formal-references

      - name: Validate definition examples against their definitions
        if: github.event_name != 'pull_request' || steps.scope.outputs.full == 'true'
        run: npm run validate:definition-examples

      - name: Audit proof pedagogy
        if: github.event_name != 'pull_request' || steps.scope.outputs.full == 'true'
        run: npm run audit:proof-pedagogy

      - name: Audit formalism pedagogy
        if: github.event_name != 'pull_request' || steps.scope.outputs.full == 'true'
        run: npm run audit:formalism-pedagogy
