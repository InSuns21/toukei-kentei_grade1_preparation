name: Validate textbook

on:
  pull_request:
    paths:
      - 'textbook/**'
      - '.github/workflows/validate-textbook.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-textbook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Defer named ODE6 examples
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/ode6-series-frobenius'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('textbook/volumes/00_foundations/ODE6/index.md')
          text = path.read_text(encoding='utf-8')
          old = 'Bessel 方程式と Legendre 方程式は特殊関数の名前を増やすためではなく、本章で導く判定と係数漸化式がどのように働くかを手で確認する代表例として使います。'
          new = '本章の後半では二つの代表的な古典方程式を使い、ここで導く判定と係数漸化式がどのように働くかを手で確認します。'
          if old not in text:
              raise SystemExit('expected introductory sentence not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook/volumes/00_foundations/ODE6/index.md
          git commit -m 'Defer ODE6 named examples until introduction'
          git push origin HEAD:${{ github.head_ref }}
