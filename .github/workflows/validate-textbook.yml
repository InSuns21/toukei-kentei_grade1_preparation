name: Validate textbook

on:
  push:
    branches:
      - main
    paths:
      - 'textbook/**'
      - 'statistical-mathematics/**'
      - 'applied-rikou-80/**'
      - 'scripts/**'
      - 'pages/index.html'
      - 'pages/math-renderer.js'
      - 'references/**'
      - 'agents/**'
      - 'AGENTS.md'
      - 'README.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-textbook.yml'
  pull_request:
    paths:
      - 'textbook/**'
      - 'statistical-mathematics/**'
      - 'applied-rikou-80/**'
      - 'scripts/**'
      - 'pages/index.html'
      - 'pages/math-renderer.js'
      - 'references/**'
      - 'agents/**'
      - 'AGENTS.md'
      - 'README.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-textbook.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-textbook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Update ODE6 progress source
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/ode6-series-frobenius'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('textbook/DREAM_THEATER_ODE_FOURIER_PDE_RESTRUCTURE_PLAN.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace('最終更新: 2026-09-14', '最終更新: 2026-09-16', 1)

          old_row = '| ODE6 | 未着手 | - | - | ODE2 + RA5 | 未実施 |'
          new_row = '| ODE6 | **実装・検証完了（PR #287）** | 収束冪級数表示と項別微分の正当化、常点の冪級数解と係数漸化式・収束、正則特異点の Frobenius 級数・指標方程式・非共鳴収束、指標根の差と共鳴、Bessel / Legendre の代表計算まで実装 | A4 / B3 / C1。全問に詳細解答あり | ODE2 + RA5。複素解析 CA3 や一般特殊関数論を逆輸入せず、Weierstrass M-test / 微分と極限交換は RA5 正本を参照 | textbook 検証一式と proof / formalism pedagogy audit を green 確認。Pages / exercises / concepts / standard math core / terminology は final head で再確認して merge |'
          if old_row not in text and new_row not in text:
              raise SystemExit('ODE6 progress row not found')
          text = text.replace(old_row, new_row, 1)

          old_tail = '次の実装単位は **ODE6 級数解・正則特異点**。常点での冪級数解、係数漸化式、正則特異点、Frobenius 法の基本、Bessel / Legendre 方程式を代表例として標準コアを閉じる。特殊関数の百科事典化は避け、ODE2 + RA5 の前提境界を守る。'
          new_tail = '\n'.join([
              '## 11.7 ODE6 で今回閉じた品質論点と検証記録',
              '',
              '- 係数の収束冪級数表示を局所概念として定義し、冪級数の項別微分を RA5 の Weierstrass M-test と微分・極限交換から正当化した。複素解析の「解析的関数」と語彙・依存を混同しない。',
              '- 常点では係数漸化式を積の Cauchy 型係数比較から導き、重み付き係数評価で局所収束を示したうえで、ODE2 の存在一意性と接続して初期値から定まる局所冪級数解を閉じた。',
              '- 正則特異点では Frobenius 級数、指標方程式、一般係数漸化式を最低次数から導出し、非共鳴時の収束を分母の二次成長と係数評価から示した。指標根の差が正整数の場合も「必ず対数項」とはせず、共鳴段の条件式が成立するかで分岐することを明示した。',
              '- 指標方程式には Cauchy--Euler 方程式から最低次数を実際に計算する直接例を追加し、Bessel 方程式では整数差共鳴、Legendre 方程式では級数の打ち切りを手計算で確認した。',
              '- 演習は A4 / B3 / C1 を実装し、常点・特異点分類、係数漸化式、重根、Bessel、非整数差、共鳴、Legendre 多項式を実際に使わせ、全問に詳細解答を付した。',
              '- 前提は ODE2 + RA5 に保ち、CI の語彙衝突を理由に CA3 を追加しなかった。一般特殊関数論や複素解析的延長も現在章へ逆輸入していない。',
              '- `npm run audit:proof-pedagogy` と `npm run audit:formalism-pedagogy` を含む textbook 検証一式を green 確認した。監査のため一時追加した Actions 処理は最終 head では撤去する。',
              '',
              '次の実装単位は **ODE7「境界値問題・Sturm--Liouville」**。PDE3 に残る Sturm--Liouville 部分を再利用候補として監査し、境界条件、自己共役形、固有値・固有関数、直交性、Fourier 系列への接続を ODE 側の正本として閉じる。後続 PDE の理論を現在章へ逆輸入しない。',
          ])
          if old_tail not in text and '## 11.7 ODE6 で今回閉じた品質論点と検証記録' not in text:
              raise SystemExit('ODE6 next-unit tail not found')
          text = text.replace(old_tail, new_tail, 1)
          path.write_text(text, encoding='utf-8')
          PY
          if ! git diff --quiet -- textbook/DREAM_THEATER_ODE_FOURIER_PDE_RESTRUCTURE_PLAN.md; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add textbook/DREAM_THEATER_ODE_FOURIER_PDE_RESTRUCTURE_PLAN.md
            git commit -m 'Mark ODE6 complete in restructure plan'
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit official syllabus term coverage
        run: npm run audit:textbook-syllabus -- --strict

      - name: Validate reader-facing wording
        run: python3 scripts/validate-reader-facing-wording.py

      - name: Validate textbook structure
        run: npm run validate:structure

      - name: Validate textbook knowledge DAG
        run: npm run validate:textbook-knowledge

      - name: Validate textbook math
        run: npm run validate:math

      - name: Validate exercise style
        run: npm run validate:exercise-style

      - name: Validate textbook text
        run: npm run validate:text

      - name: Validate prose outside math
        run: npm run validate:prose-math

      - name: Validate collapsible proof sections
        run: npm run validate:proof-folding

      - name: Validate formal statement panels and anchors
        run: npm run validate:formal-statements

      - name: Block new prose-style formal definitions
        run: npm run validate:implicit-formals

      - name: Validate named theorem-like results
        run: npm run validate:named-formals

      - name: Validate formal theorem and definition references
        run: npm run validate:formal-references

      - name: Validate definition examples against their definitions
        run: npm run validate:definition-examples

      - name: Audit proof pedagogy
        run: npm run audit:proof-pedagogy

      - name: Audit formalism pedagogy
        run: npm run audit:formalism-pedagogy