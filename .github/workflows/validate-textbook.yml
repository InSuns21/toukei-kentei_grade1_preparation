name: Validate textbook

on:
  push:
    branches:
      - main
    paths:
      - 'textbook/**'
      - 'statistical-mathematics/**'
      - 'applied-rikou-80/**'
      - 'scripts/**'
      - 'pages/index.html'
      - 'pages/math-renderer.js'
      - 'references/**'
      - 'agents/**'
      - 'AGENTS.md'
      - 'README.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-textbook.yml'
  pull_request:
    paths:
      - 'textbook/**'
      - 'statistical-mathematics/**'
      - 'applied-rikou-80/**'
      - 'scripts/**'
      - 'pages/index.html'
      - 'pages/math-renderer.js'
      - 'references/**'
      - 'agents/**'
      - 'AGENTS.md'
      - 'README.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-textbook.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-textbook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Add ODE6 indicial-equation verification example
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/ode6-series-frobenius'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('textbook/volumes/00_foundations/ODE6/index.md')
          text = path.read_text(encoding='utf-8')
          marker = '<!-- definition-example-start: def-ode6-indicial-equation -->'
          if marker not in text:
              needle = '''> を指標方程式という。\n<!-- formal-statement-end -->\n\n指標方程式は暗記式ではありません。'''
              replacement = r'''> を指標方程式という。
<!-- formal-statement-end -->

<!-- definition-example-start: def-ode6-indicial-equation -->
**定義の確認**：Cauchy--Euler 方程式から指標方程式を作る

例えば

$$
x^2y''-2y=0
$$

を考えます。このとき $A(x)=0$, $B(x)=-2$ なので

$$
\alpha_0=0,\qquad \beta_0=-2.
$$

Frobenius 級数 $y=x^r(a_0+a_1x+\cdots)$, $a_0\ne0$ を代入すると、最低次数 $x^r$ の係数は

$$
\{r(r-1)-2\}a_0
$$

です。$a_0\ne0$ だから最低次数を消す条件は

$$
F(r)=r(r-1)-2=(r-2)(r+1)=0.
$$

したがって指標根は $r=2,-1$ です。これは定義式 $F(r)=r(r-1)+\alpha_0r+\beta_0$ へ $\alpha_0=0$, $\beta_0=-2$ を代入した結果と一致します。
<!-- definition-example-end -->

指標方程式は暗記式ではありません。'''
              if needle not in text:
                  raise SystemExit('could not locate indicial-equation insertion point')
              text = text.replace(needle, replacement, 1)
              path.write_text(text, encoding='utf-8')
          PY
          if ! git diff --quiet -- textbook/volumes/00_foundations/ODE6/index.md; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add textbook/volumes/00_foundations/ODE6/index.md
            git commit -m 'Add ODE6 indicial-equation verification example'
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit official syllabus term coverage
        run: npm run audit:textbook-syllabus -- --strict

      - name: Validate reader-facing wording
        run: python3 scripts/validate-reader-facing-wording.py

      - name: Validate textbook structure
        run: npm run validate:structure

      - name: Validate textbook knowledge DAG
        run: npm run validate:textbook-knowledge

      - name: Validate textbook math
        run: npm run validate:math

      - name: Validate exercise style
        run: npm run validate:exercise-style

      - name: Validate textbook text
        run: npm run validate:text

      - name: Validate prose outside math
        run: npm run validate:prose-math

      - name: Validate collapsible proof sections
        run: npm run validate:proof-folding

      - name: Validate formal statement panels and anchors
        run: npm run validate:formal-statements

      - name: Block new prose-style formal definitions
        run: npm run validate:implicit-formals

      - name: Validate named theorem-like results
        run: npm run validate:named-formals

      - name: Validate formal theorem and definition references
        run: npm run validate:formal-references

      - name: Validate definition examples against their definitions
        run: npm run validate:definition-examples

      - name: Audit proof pedagogy
        run: npm run audit:proof-pedagogy

      - name: Audit formalism pedagogy
        run: npm run audit:formalism-pedagogy