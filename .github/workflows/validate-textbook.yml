name: Validate textbook

on:
  push:
    branches:
      - main
    paths:
      - 'textbook/**'
      - 'statistical-mathematics/**'
      - 'applied-rikou-80/**'
      - 'scripts/**'
      - 'pages/index.html'
      - 'pages/math-renderer.js'
      - 'references/**'
      - 'agents/**'
      - 'AGENTS.md'
      - 'README.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-textbook.yml'
  pull_request:
    paths:
      - 'textbook/**'
      - 'statistical-mathematics/**'
      - 'applied-rikou-80/**'
      - 'scripts/**'
      - 'pages/index.html'
      - 'pages/math-renderer.js'
      - 'references/**'
      - 'agents/**'
      - 'AGENTS.md'
      - 'README.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-textbook.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-textbook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize ODE6 real-series terminology
        if: github.event_name == 'pull_request' && github.head_ref == 'feat/ode6-series-frobenius'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('textbook/volumes/00_foundations/ODE6/index.md')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('実解析的に延長できません', '実解析性をもつようには延長できません'),
              ('実解析的に延長できるなら', '実解析性をもつように延長できるなら'),
              ('実解析的であること', '実解析性をもつこと'),
              ('実解析的であるとは', '実解析性をもつとは'),
              ('実解析的でない', '実解析性をもたない'),
              ('実解析的なので', '実解析性をもつので'),
              ('実解析的なら', '実解析性をもつなら'),
              ('実解析的です', '実解析性をもちます'),
              ('実解析的で、', '実解析性をもち、'),
              ('実解析的とし', '実解析性をもつとし'),
              ('実解析的解', '実解析性をもつ解'),
          ]
          for old, new in replacements:
              text = text.replace(old, new)
          if '実解析的' in text:
              raise SystemExit('unhandled 実解析的 occurrence remains')
          path.write_text(text, encoding='utf-8')
          PY
          if ! git diff --quiet -- textbook/volumes/00_foundations/ODE6/index.md; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add textbook/volumes/00_foundations/ODE6/index.md
            git commit -m 'Clarify ODE6 real power-series terminology'
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit official syllabus term coverage
        run: npm run audit:textbook-syllabus -- --strict

      - name: Validate reader-facing wording
        run: python3 scripts/validate-reader-facing-wording.py

      - name: Validate textbook structure
        run: npm run validate:structure

      - name: Validate textbook knowledge DAG
        run: npm run validate:textbook-knowledge

      - name: Validate textbook math
        run: npm run validate:math

      - name: Validate exercise style
        run: npm run validate:exercise-style

      - name: Validate textbook text
        run: npm run validate:text

      - name: Validate prose outside math
        run: npm run validate:prose-math

      - name: Validate collapsible proof sections
        run: npm run validate:proof-folding

      - name: Validate formal statement panels and anchors
        run: npm run validate:formal-statements

      - name: Block new prose-style formal definitions
        run: npm run validate:implicit-formals

      - name: Validate named theorem-like results
        run: npm run validate:named-formals

      - name: Validate formal theorem and definition references
        run: npm run validate:formal-references

      - name: Validate definition examples against their definitions
        run: npm run validate:definition-examples