name: Validate textbook

on:
  push:
    branches:
      - main
    paths:
      - 'textbook/**'
      - 'statistical-mathematics/**'
      - 'applied-rikou-80/**'
      - 'scripts/**'
      - 'pages/index.html'
      - 'pages/math-renderer.js'
      - 'references/**'
      - 'agents/**'
      - 'AGENTS.md'
      - 'README.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-textbook.yml'
  pull_request:
    paths:
      - 'textbook/**'
      - 'statistical-mathematics/**'
      - 'applied-rikou-80/**'
      - 'scripts/**'
      - 'pages/index.html'
      - 'pages/math-renderer.js'
      - 'references/**'
      - 'agents/**'
      - 'AGENTS.md'
      - 'README.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-textbook.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-textbook:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Temporary repair inherited SDE1A formal theorem
        run: |
          p='textbook/volumes/00_foundations/F0_00SDE1A_Euler_Maruyama_weak_order_proof/index.md'
          python - <<'PY'
          from pathlib import Path
          p = Path('textbook/volumes/00_foundations/F0_00SDE1A_Euler_Maruyama_weak_order_proof/index.md')
          s = p.read_text()
          if 'thm-f0-00sde1a-weak-order-1' not in s:
              old = '''### 定理：Euler--Maruyama の weak order 1

SDE
'''
              new = '''<a id="thm-f0-00sde1a-weak-order-1"></a>

<!-- formal-statement-start -->
### 定理：Euler--Maruyama の weak order 1

SDE
'''
              if old not in s:
                  raise SystemExit('theorem heading block not found')
              s = s.replace(old, new, 1)
              old2 = '''が成り立つ。したがって Euler--Maruyama 法の weak convergence order は1である。

### 証明の5行
'''
              new2 = '''が成り立つ。したがって Euler--Maruyama 法の weak convergence order は1である。
<!-- formal-statement-end -->

### 証明の5行
'''
              if old2 not in s:
                  raise SystemExit('theorem closing block not found')
              p.write_text(s.replace(old2, new2, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$p"
          if git diff --cached --quiet; then
            echo 'SDE1A already repaired'
          else
            git commit -m 'Fix SDE1A formal theorem panel'
            git push origin HEAD:audit/syllabus-definition-density-batch2
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit official syllabus term coverage
        run: npm run audit:textbook-syllabus -- --strict

      - name: Validate textbook structure
        run: npm run validate:structure

      - name: Validate textbook math
        run: npm run validate:math

      - name: Validate exercise style
        run: npm run validate:exercise-style

      - name: Validate textbook text
        run: npm run validate:text

      - name: Validate prose outside math
        run: npm run validate:prose-math

      - name: Validate collapsible proof sections
        run: npm run validate:proof-folding

      - name: Validate formal statement panels and anchors
        run: npm run validate:formal-statements

      - name: Block new prose-style formal definitions
        run: npm run validate:implicit-formals

      - name: Validate named theorem-like results
        run: npm run validate:named-formals

      - name: Validate formal theorem and definition references
        run: npm run validate:formal-references

      - name: Validate definition examples against their definitions
        run: npm run validate:definition-examples
