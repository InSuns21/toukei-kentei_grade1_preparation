name: CA4 last text fix

on:
  push:
    branches:
      - codex/ca4-laurent-residue-rouche
    paths:
      - .github/workflows/ca4-last-text-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/ca4-laurent-residue-rouche
          fetch-depth: 0
      - name: Canonicalize final CA4 references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('textbook/volumes/00_foundations/CA4/index.md')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('[Rouché の定理](#thm-ca4-rouche)', '[Rouchéの定理](#thm-ca4-rouche)'),
              ('一方、留数の係数積分公式から', '一方、[留数の係数積分公式](#def-ca4-residue) から'),
          ]
          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected one occurrence of {old!r}, found {count}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          wf = Path('.github/workflows/ca4-last-text-fix.yml')
          if wf.exists():
              wf.unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Canonicalize final CA4 references"
          git push origin HEAD:codex/ca4-laurent-residue-rouche
