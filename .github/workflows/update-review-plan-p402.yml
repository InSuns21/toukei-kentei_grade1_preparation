name: Update P4-02 review plan

on:
  push:
    paths:
      - '.github/workflows/update-review-plan-p402.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update review plan
        run: python .github/scripts/update_review_plan_p402.py
      - name: Remove temporary files
        run: |
          rm .github/scripts/update_review_plan_p402.py
          rm .github/workflows/update-review-plan-p402.yml
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'textbook: mark P4-02 review complete'
          git push
