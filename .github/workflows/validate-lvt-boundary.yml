name: Validate LVT boundary
on:
  pull_request:
    paths:
      - 'textbook/volumes/dream_thater/計算系/LVT/LVT1-06/**'
      - '.github/workflows/validate-lvt-boundary.yml'
  push:
    branches: [main]
    paths:
      - 'textbook/volumes/dream_thater/計算系/LVT/LVT1-06/**'
      - '.github/workflows/validate-lvt-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-boundary:
    name: Lean pure reference and boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          lake-package-directory: 'textbook/volumes/dream_thater/計算系/LVT/LVT1-06/lab'
          auto-config: 'false'
          build: 'true'
          test: 'true'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - name: Verify version, exercises and external boundary
        working-directory: 'textbook/volumes/dream_thater/計算系/LVT/LVT1-06/lab'
        shell: bash
        run: |
          lean --version | grep -F 'version 4.35.0'
          lake env lean Inspect.lean
          lake exe lvtBoundaryDemo | grep -Fx 'LVT1-06 OK'
          lake env lean ExerciseSolutions.lean
          python3 check_boundary.py
