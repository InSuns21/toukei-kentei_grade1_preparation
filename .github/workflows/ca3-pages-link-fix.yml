name: CA3 Pages link syntax fix

on:
  push:
    branches:
      - codex/ca3-cauchy-taylor-liouville-maxmod
    paths:
      - .github/workflows/ca3-pages-link-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/ca3-cauchy-taylor-liouville-maxmod
          fetch-depth: 0
      - name: Avoid Markdown link parsing inside Taylor display
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('textbook/volumes/00_foundations/CA3/index.md')
          s = p.read_text(encoding='utf-8')
          old = r'\right](z-a)^n'
          new = r'\right]\,(z-a)^n'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one target, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add textbook/volumes/00_foundations/CA3/index.md
          git commit -m "Avoid false Pages link in CA3 Taylor proof"
          git push origin HEAD:codex/ca3-cauchy-taylor-liouville-maxmod
