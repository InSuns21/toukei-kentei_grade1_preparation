name: Apply final FOU5 concept fixes

on:
  push:
    branches:
      - dream-theater/fou5-probability-dft-sampling

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted text fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('textbook/volumes/00_foundations/FOU5/index.md')
          s = p.read_text()
          s = s.replace('> **補題（$1$ の $N$ 乗根の直交性）**', '> **補題（1のN乗根の直交性）**')
          s = s.replace('3. 逆変換して 1. と一致することを確認せよ。', '3. 反転公式で復元し、1. と一致することを確認せよ。')
          p.write_text(s)
          PY
          git rm .github/workflows/fou5-fix3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook/volumes/00_foundations/FOU5/index.md
          git commit -m 'fix: FOU5 の概念監査誤検出を解消'
          git push origin HEAD:dream-theater/fou5-probability-dft-sampling
