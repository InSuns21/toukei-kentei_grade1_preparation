name: Debug FOU2 validation

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/debug-fou2-validation.yml'
      - 'textbook/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    if: github.head_ref == 'dream-theater-fou2-fourier-convergence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Capture failing validators
        id: capture
        env:
          DREAM_THEATER_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set +e
          {
            echo '===== validate:math ====='
            npm run validate:math
            echo "exit=$?"
            echo
            echo '===== validate:dream-theater-concepts:changed ====='
            npm run validate:dream-theater-concepts:changed
            echo "exit=$?"
            echo
            echo '===== validate:pages ====='
            npm run validate:pages
            echo "exit=$?"
          } > /tmp/fou2-validation.log 2>&1
          cat /tmp/fou2-validation.log
      - name: Post diagnostic log
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = fs.readFileSync('/tmp/fou2-validation.log', 'utf8');
            if (body.length > 60000) body = body.slice(0, 60000) + '\n...[truncated]';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `<!-- fou2-validation-diagnostic -->\n### FOU2 validation diagnostic\n\n\`\`\`text\n${body}\n\`\`\``
            });
