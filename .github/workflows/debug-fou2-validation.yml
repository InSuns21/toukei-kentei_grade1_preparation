name: Fix and validate FOU2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/debug-fou2-validation.yml'
      - 'textbook/**'

permissions:
  contents: write

jobs:
  fix-and-validate:
    if: github.head_ref == 'dream-theater-fou2-fourier-convergence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Apply remaining FOU2 terminology fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('textbook/volumes/00_foundations/FOU2/index.md')
          s = p.read_text(encoding='utf-8')
          replacements = [
              (
                  '最後は Riemann--Lebesgue 型補題で高周波を消します。',
                  '最後は [高周波振動積分の消去補題](#thm-fou2-riemann-lebesgue) で高周波を消します。',
              ),
              (
                  'したがって Dirichlet 部分和のように $1$ を越える Gibbs 超過は起こりません。',
                  'したがって通常の Fourier有限和のように $1$ を越える Gibbs 超過は起こりません。',
              ),
              (
                  'さらに FOU1 の直交性計算から',
                  'さらに FOU1 の一周期積分消去則による計算から',
              ),
          ]
          changed = False
          for old, new in replacements:
              count = s.count(old)
              if count > 1:
                  raise SystemExit(f'expected at most one occurrence, found {count}: {old!r}')
              if count == 1:
                  s = s.replace(old, new)
                  changed = True
          p.write_text(s, encoding='utf-8')
          print('changed=', changed)
          PY

          if git diff --quiet; then
            echo 'No remaining deterministic fixes left to apply.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add textbook/volumes/00_foundations/FOU2/index.md
            git commit -m 'Resolve remaining FOU2 local terminology'
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Validate focused FOU2 checks
        env:
          DREAM_THEATER_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          npm run validate:math
          npm run validate:dream-theater-concepts:changed
          npm run validate:pages
