name: One-shot topology math delimiter repair

on:
  push:
    branches:
      - feature/dream-theater-topology-core

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/fix-topology-math-delimiters.mjs
