name: Temporary FA3 weak-star heading fix

on:
  push:
    branches:
      - codex/fa3-weak-weak-star-topology

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fa3-weak-weak-star-topology
      - name: Disambiguate weak-star theorem heading
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('textbook/volumes/00_foundations/FA3/index.md')
          s = p.read_text()
          old = '### 定理（弱*位相の連続双対の同定）'
          new = '### 定理（弱*連続線形汎関数は標準埋め込みの像）'
          if s.count(old) != 1:
              raise SystemExit(f'target count: {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook/volumes/00_foundations/FA3/index.md
          git rm .github/workflows/tmp-fa3-heading.yml
          git commit -m 'Disambiguate FA3 weak-star dual theorem heading'
          git push origin HEAD:codex/fa3-weak-weak-star-topology
