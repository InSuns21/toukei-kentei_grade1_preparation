name: Fix S1-02 completeness definition example label

on:
  push:
    branches:
      - feat/textbook-completeness-rao-blackwell-lehmann-scheffe
    paths:
      - .github/workflows/fix-s102-completeness-example-label.yml

permissions:
  contents: write

jobs:
  fix-label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/textbook-completeness-rao-blackwell-lehmann-scheffe
          fetch-depth: 0
      - name: Fix exact definition example label
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('textbook/volumes/03_inference/S1_02_統計量_十分性_分解定理/index.md')
          text = p.read_text(encoding='utf-8')
          old = '**定義の確認：ベルヌーイ標本の成功回数は完備統計量**'
          new = '**定義の確認**\n\nベルヌーイ標本の成功回数が完備統計量であることを確かめます。'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one match, got {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook
          git diff --cached --check
          git commit -m 'Fix completeness definition example label'
          git push origin HEAD:feat/textbook-completeness-rao-blackwell-lehmann-scheffe
