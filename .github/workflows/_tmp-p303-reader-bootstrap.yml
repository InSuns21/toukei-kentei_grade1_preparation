name: Temporary P3-03 reader rewrite bootstrap

on:
  push:
    paths:
      - '.github/workflows/_tmp-p303-reader-bootstrap.yml'

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Extract and run rewrite script
        run: |
          python - <<'PYBOOT'
          from pathlib import Path
          src = Path('.github/workflows/_tmp-p303-reader-rewrite.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = src.index(marker) + len(marker)
          end = src.index("\n          PY\n", start)
          body = src[start:end]
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines()) + '\n'
          Path('/tmp/p303_reader_rewrite.py').write_text(body)
          PYBOOT
          python /tmp/p303_reader_rewrite.py
      - name: Install dependencies
        run: npm ci
      - name: Validate rewritten textbook
        run: |
          npm run validate
          npm run audit:textbook-granularity
          npm run validate:pages
      - name: Commit rewritten P3-03
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook/volumes/02_distributions/P3_03_多変量分布_条件付き分布/index.md textbook/volumes/02_distributions/P3_03_多変量分布_条件付き分布/chapter.yaml textbook/volumes/02_distributions/P3_03_多変量分布_条件付き分布/glossary.yaml
          git diff --cached --check
          git commit -m 'rewrite P3-03 for textbook readers'
          git push
      - name: Remove temporary rewrite files
        run: |
          git pull --ff-only
          rm .github/workflows/_tmp-p303-reader-rewrite.yml .github/workflows/_tmp-p303-reader-bootstrap.yml
          git add .github/workflows/_tmp-p303-reader-rewrite.yml .github/workflows/_tmp-p303-reader-bootstrap.yml
          git commit -m 'remove temporary P3-03 reader rewrite workflows'
          git push
