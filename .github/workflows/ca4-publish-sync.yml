name: CA4 publish sync

on:
  push:
    branches:
      - codex/ca4-laurent-residue-rouche
    paths:
      - .github/workflows/ca4-publish-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/ca4-laurent-residue-rouche
          fetch-depth: 0
      - name: Publish CA4 wiring and remove temporary files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one target, found {count}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          core_old = "\n".join([
              "  - id: CA4",
              "    title: Laurent展開・孤立特異点・留数定理",
              "    area: complex-analysis",
              "    tier: core",
              "    status: planned",
              "    prerequisites: [CA3]",
              "  - id: CA5",
              "    title: 偏角原理・Rouché・解析接続",
              "    area: complex-analysis",
              "    tier: core-advanced-standard",
              "    status: planned",
              "    prerequisites: [CA4, TOP3]",
              "",
          ])
          core_new = "\n".join([
              "  - id: CA4",
              "    title: Laurent展開・孤立特異点・留数・偏角原理・Rouché",
              "    area: complex-analysis",
              "    tier: core",
              "    status: implemented",
              "    implemented_at: 2026-09-09",
              "    implementation_path: textbook/volumes/00_foundations/CA4/index.md",
              "    prerequisites: [CA3]",
              "  - id: CA5",
              "    title: winding number・解析接続・monodromy",
              "    area: complex-analysis",
              "    tier: core-advanced-standard",
              "    status: planned",
              "    prerequisites: [CA4, TOP3]",
              "",
          ])
          replace_once('textbook/dream-theater-standard-math-core.yaml', core_old, core_new)

          ca3_md = "3. [CA3 Cauchy積分公式・Taylor展開・Liouville・最大値原理](textbook/volumes/00_foundations/CA3/index.md)\n"
          replace_once(
              'textbook/dream-theater.md',
              ca3_md,
              ca3_md + "4. [CA4 Laurent展開・孤立特異点・留数・偏角原理・Rouché](textbook/volumes/00_foundations/CA4/index.md)\n",
          )

          ca3_json = '        "textbook/volumes/00_foundations/CA3/index.md",\n'
          replace_once(
              'textbook/dream-theater-index.json',
              ca3_json,
              ca3_json + '        "textbook/volumes/00_foundations/CA4/index.md",\n',
          )

          old_geometry = (
              "一般の区分的 $C^1$ 境界では、多角形版へ無断で置き換えない。境界の像はコンパクトであり、$f$ の正則領域の補集合から正の距離を持つ。十分細かい分割を取り、各曲線をその細分点を結ぶ多角形曲線へ置き換えると、元の曲線と多角形曲線の間は正則領域内の細い帯で結べる。[曲線の多角形化](../CA2/index.md#lem-ca2-polygonal-replacement) と [正則線積分のホモトピー不変性](../CA2/index.md#thm-ca2-homotopy-invariance) により各境界積分は変わらない。多角形化した境界について上の有限三角形化を適用すれば結論が元の境界へ戻る。$\\square$"
          )
          new_geometry = (
              "一般の区分的 $C^1$ 境界では、多角形版へ無断で置き換えない。まず有限個の境界成分は互いに素なコンパクト集合であり、各境界は $f$ の正則領域の補集合とも交わらない。従って、異なる境界成分どうしの距離と正則領域の補集合までの距離のうち正のものの最小値を $\\delta>0$ と取れる。各境界を幅 $\\delta/10$ より小さい互いに交わらない近傍の中で扱う。\n\n"
              "各境界曲線について [曲線の多角形化](../CA2/index.md#lem-ca2-polygonal-replacement) の分割をさらに細かくする。単純閉曲線の異なる離れたパラメータ区間の像はコンパクトで交わらないので正の距離を持ち、隣接する小弧はそれぞれ上の細い近傍内にある。この有限個の正の距離より小さく弦を取ることで、多角形近似は元の境界成分と同じ近傍内にあり、自己交差せず、異なる境界成分とも交わらないように選べる。各小弧と弦の直線補間も同じ局所円板内にあるため、境界ごとに積分値を保つホモトピーが得られる。\n\n"
              "こうして得た外側の単純多角形と互いに素な内側単純多角形については、まず各穴から外側境界へ互いに交わらない有限本の多角形の切れ目を入れる。切れ目の両側は最終的な境界和では逆向きに二度現れて相殺する。切った後は有限個の単純多角形領域へ分かれるので、それぞれを有限三角形分割し、三角形版 Cauchy–Goursat を足す。内部辺と切れ目が相殺した後に残るのは外側境界と逆向きの内側境界だけである。[正則線積分のホモトピー不変性](../CA2/index.md#thm-ca2-homotopy-invariance) で元の曲線へ戻せば結論を得る。$\\square$"
          )
          replace_once('textbook/volumes/00_foundations/CA4/index.md', old_geometry, new_geometry)

          for path in [
              'textbook/drafts/standard-math-core/CA4/chapter.yaml',
              'textbook/drafts/standard-math-core/CA4/index.md',
              '.github/workflows/ca4-publish-sync.yml',
          ]:
              p = Path(path)
              if p.exists():
                  p.unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish CA4 and strengthen boundary geometry"
          git push origin HEAD:codex/ca4-laurent-residue-rouche
