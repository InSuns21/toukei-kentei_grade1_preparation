name: Temporary FA1 alias-link fix

on:
  push:
    branches:
      - codex/fa1-quotient-uniform-boundedness

permissions:
  contents: write

jobs:
  fix-fa1-alias-link:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fa1-quotient-uniform-boundedness
      - name: Patch remaining FA1 theorem alias reference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('textbook/volumes/00_foundations/FA1/index.md')
          s = p.read_text()
          old = '。Banach–Steinhaus から $M:=\\sup_n\\|T_n\\|<\\infty$。'
          new = '。[Banach–Steinhaus](#thm-fa1-uniform-boundedness)から $M:=\\sup_n\\|T_n\\|<\\infty$。'
          if old not in s:
              raise SystemExit('remaining Banach–Steinhaus target not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook/volumes/00_foundations/FA1/index.md
          git commit -m 'Link remaining FA1 Banach-Steinhaus reference'
          git push origin HEAD:codex/fa1-quotient-uniform-boundedness
