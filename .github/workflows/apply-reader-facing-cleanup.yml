name: Apply reader-facing cleanup

on:
  push:
    branches:
      - cleanup/reader-facing-syllabus-wording
    paths:
      - '.github/workflows/apply-reader-facing-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/reader-facing-syllabus-wording
          fetch-depth: 0

      - name: Apply focused wording changes
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          pages = sorted(Path('textbook/volumes').glob('**/index.md'))
          prefix = '公式シラバス補完：'
          hits = 0
          for path in pages:
              text = path.read_text(encoding='utf-8')
              count = text.count(prefix)
              if count:
                  hits += count
                  path.write_text(text.replace(prefix, ''), encoding='utf-8')
          if hits != 11:
              raise SystemExit(f'expected 11 syllabus-prefix hits, found {hits}')

          i102 = Path('textbook/volumes/03_inference/I1_02_推定法と推定量の評価/index.md')
          text = i102.read_text(encoding='utf-8')
          old_heading = '## 3A. 推定量の相対効率と「その他の手法」'
          new_heading = '## 3A. 推定量の相対効率'
          old_para = '公式シラバスの **その他の手法** は、特定の固有名をもつ単一の推定法を指す項目ではありません。モーメント法、最小二乗法、最尤法だけに固定せず、推定量を構成したうえで不偏性・一致性・平均二乗誤差・相対効率などにより比較する問題を含む包括的な枠です。'
          new_para = '同じ母数に対して複数の推定量を構成できる場合があります。このとき、推定量は不偏性だけでなく、分散・平均二乗誤差・一致性・相対効率などを用いて比較します。'
          if text.count(old_heading) != 1 or text.count(old_para) != 1:
              raise SystemExit('I1-02 expected replacements were not found exactly once')
          i102.write_text(text.replace(old_heading, new_heading, 1).replace(old_para, new_para, 1), encoding='utf-8')

          p302 = Path('textbook/volumes/02_distributions/P3_02_主要な連続分布/index.md')
          text = p302.read_text(encoding='utf-8')
          old = '共通演習規約に従い、**確率密度関数・累積分布関数・生存関数などが計算の出発点として必要で、それ自体を導出させる問題でない場合は、問題文に具体式を与えます。**'
          new = '演習では、**確率密度関数・累積分布関数・生存関数などが計算の出発点として必要で、それ自体を導出させる問題でない場合は、問題文に具体式を与えます。**'
          if text.count(old) != 1:
              raise SystemExit('P3-02 expected policy wording not found exactly once')
          p302.write_text(text.replace(old, new, 1), encoding='utf-8')

          p303 = Path('textbook/volumes/02_distributions/P3_03_多変量分布_条件付き分布/index.md')
          text = p303.read_text(encoding='utf-8')
          old = '共通演習規約に従い、**初見の受験者が記号や分布公式を推測せず立式できること**を最低条件とします。'
          new = '演習では、**初見でも記号や分布公式を推測せず立式できるようにします。**'
          if text.count(old) != 1:
              raise SystemExit('P3-03 expected policy wording not found exactly once')
          p303.write_text(text.replace(old, new, 1), encoding='utf-8')

          subprocess.run(['python3', 'scripts/validate-reader-facing-wording.py'], check=True)
          Path('.github/workflows/apply-reader-facing-cleanup.yml').unlink()

      - name: Commit focused cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add textbook/volumes .github/workflows/apply-reader-facing-cleanup.yml
          git diff --cached --check
          git commit -m "Clean reader-facing syllabus meta wording"
          git push origin HEAD:cleanup/reader-facing-syllabus-wording

# retry after narrowing the permanent guard to syllabus leakage
