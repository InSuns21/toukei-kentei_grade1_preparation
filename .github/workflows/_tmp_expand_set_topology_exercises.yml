name: Temporary set/topology exercise expansion

on:
  push:
    branches:
      - audit/set-topology-exercises-20260912

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/set-topology-exercises-20260912
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Expand thin exercise sets
        run: |
          python scripts/_tmp_expand_set_topology_exercises_a.py
          python scripts/_tmp_expand_set_topology_exercises_bcd.py
      - name: Validate exercise counts
        run: |
          python - <<'PY'
          from pathlib import Path
          targets = {
              'F0_00A_集合_写像_上限下限': 5,
              'F0_00A1_上界_下界_supremum_infimum': 5,
              'F0_00A1B_実数の上限性質_Archimedes性': 5,
              'F0_00A1C_集合族_添字集合_べき集合': 5,
              'F0_00A1D_順序_全順序_最小最大_整列': 5,
              'F0_00A2_選択公理_Zorn_極大原理': 5,
              'F0_00A3_半順序_Zorn_極大延長': 5,
              'F0_00B0_点列_部分列_十分大きい添字': 5,
              'F0_00B1_位相空間_近傍_部分空間_収束': 6,
              'F0_00C_連続写像_コンパクト性_最大最小': 5,
              'F0_00C1_コンパクト性_点列コンパクト性_Heine_Borel': 5,
              'F0_00C2_コンパクト性の応用_最大最小_最近点': 5,
              'F0_00D_Cauchy列_完備性_無限次元': 5,
          }
          root = Path('textbook/volumes/00_foundations')
          for dirname, expected in targets.items():
              p = root / dirname / 'index.md'
              text = p.read_text(encoding='utf-8')
              count = text.count('- Level:')
              if count < expected:
                  raise SystemExit(f'{dirname}: exercise count {count} < {expected}')
              if text.count('<!-- exercise-density-supplement-20260912 -->') != 1:
                  raise SystemExit(f'{dirname}: supplement marker count is not 1')
              print(f'{dirname}: {count}')
          PY
      - name: Remove temporary automation
        run: |
          rm scripts/_tmp_expand_set_topology_exercises_a.py
          rm scripts/_tmp_expand_set_topology_exercises_bcd.py
          rm .github/workflows/_tmp_expand_set_topology_exercises.yml
      - name: Commit expanded exercises
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook/volumes/00_foundations scripts .github/workflows
          git commit -m 'Expand exercises in thin set topology completeness chapters'
          git push origin HEAD:audit/set-topology-exercises-20260912
