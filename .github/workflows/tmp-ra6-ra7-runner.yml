name: Temporary RA6 RA7 patch runner

on:
  push:
    branches:
      - audit/ra6-ra7-quality-20260912

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/ra6-ra7-quality-20260912
          fetch-depth: 0
      - name: Apply patch
        run: |
          python .github/tmp-ra6-ra7-patch.py
          git diff --check
          if ! git diff --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add textbook/volumes/00_foundations/F0_02C3_Frechet微分_線形作用素_随伴/index.md textbook/volumes/00_foundations/RA7/index.md
            git commit -m "[ra6-ra7-patch] strengthen proofs and exercise solutions"
            git push origin HEAD:audit/ra6-ra7-quality-20260912
          fi
