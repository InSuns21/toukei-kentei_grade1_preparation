name: Temporary RA4A final text fix
on:
  push:
    branches: [feat/ra4a-improper-integrals]
    paths: [.github/workflows/tmp-ra4a-final-text-fix.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ra4a-improper-integrals
          fetch-depth: 0
      - name: Normalize RA4A text
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('textbook/volumes/00_foundations/RA4A/index.md')
          s=p.read_text(encoding='utf-8')
          # Text validator treats tabs as control characters.
          s=s.replace('\t','    ')
          # Avoid explicit-dependency auditor treating ordinary anaphora as theorem names.
          s=s.replace('この不等式から', '以上の上下評価から')
          s=s.replace('この不等式を使えば', '以上の上下評価を使えば')
          s=s.replace('同じ三角不等式を使えばよいです', '同様に二つの極限との差を三角不等式で評価すればよいです')
          s=s.replace('同じ三角不等式', '同様の三角不等式による評価')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and clean temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-ra4a-final-text-fix.yml
          git add textbook/volumes/00_foundations/RA4A/index.md
          git commit -m "Normalize RA4A proof wording and whitespace"
          git push origin HEAD:feat/ra4a-improper-integrals
