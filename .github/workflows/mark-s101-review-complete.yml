name: Mark S1-01 review complete

on:
  push:
    paths:
      - '.github/workflows/mark-s101-review-complete.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update review plan
        run: python .github/scripts/mark_s101_review_complete.py
      - name: Remove temporary files
        run: |
          rm .github/scripts/mark_s101_review_complete.py
          rm .github/workflows/mark-s101-review-complete.yml
      - name: Commit review plan
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'textbook: mark S1-01 review complete'
          git push
