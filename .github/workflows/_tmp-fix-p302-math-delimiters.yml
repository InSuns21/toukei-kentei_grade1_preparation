name: Temporary P3-02 math delimiter fix

on:
  push:
    paths:
      - 'scripts/_tmp_fix_p302_math_delimiters.mjs'
      - '.github/workflows/_tmp-fix-p302-math-delimiters.yml'

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Repair display math delimiters
        run: node scripts/_tmp_fix_p302_math_delimiters.mjs
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook/volumes/02_distributions/P3_02_主要な連続分布/index.md
          git diff --cached --check
          git commit -m 'repair P3-02 display math delimiters'
          git push
