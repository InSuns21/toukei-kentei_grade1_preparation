name: Fix implicit auditor line mapping S18

on:
  push:
    branches:
      - audit/dream-theater-implicit-dependencies-s18
    paths:
      - '.github/workflows/fix-implicit-auditor-lines-s18.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: audit/dream-theater-implicit-dependencies-s18
          fetch-depth: 0

      - name: Preserve source line mapping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/audit-dream-theater-implicit-dependencies.mjs')
          text = path.read_text(encoding='utf-8')
          old = r'''function stripNonReaderContent(source) {
  return String(source)
    .replace(/<!-- solution-start -->[\s\S]*?<!-- solution-end -->/gu, '')
    .replace(/<!--[^]*?-->/gu, '');
}
'''
          new = r'''function stripNonReaderContent(source) {
  return String(source)
    .replace(/<!--[\s\S]*?-->/gu, preserveLines)
    .replace(/```[\s\S]*?```/gu, preserveLines)
    .replace(/`[^`\n]*`/gu, (value) => ' '.repeat(value.length));
}
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one stripNonReaderContent block, found {text.count(old)}')
          text = text.replace(old, new, 1)
          marker = "function normalizeLiteral(value) {\n"
          helper = "function preserveLines(value) {\n  return '\\n'.repeat((value.match(/\\n/g) ?? []).length);\n}\n\n"
          if text.count(marker) != 1:
              raise SystemExit(f'expected one normalizeLiteral marker, found {text.count(marker)}')
          text = text.replace(marker, helper + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY
          node --check scripts/audit-dream-theater-implicit-dependencies.mjs

      - name: Commit fix
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/audit-dream-theater-implicit-dependencies.mjs
          git commit -m 'Preserve source lines in implicit audit'
          git push
