name: One-off normalize reviewed textbook intros

on:
  push:
    paths:
      - '.github/workflows/oneoff-normalize-reviewed-textbook-intros.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize reviewed textbook chapters
        run: python scripts/oneoff_normalize_reviewed_textbook_intros.py
      - name: Remove one-off files and commit
        run: |
          rm scripts/oneoff_normalize_reviewed_textbook_intros.py
          rm .github/workflows/oneoff-normalize-reviewed-textbook-intros.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'textbook: standardize reviewed chapter introductions'
          git push
