name: Apply textbook concept DAG batch2 S1 wording fix

on:
  push:
    branches:
      - audit/textbook-concept-dag-batch2
    paths:
      - .github/workflows/apply-textbook-concept-dag-batch2-s1-wording.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/textbook-concept-dag-batch2
          fetch-depth: 0
      - name: Fix consistency cross-reference wording
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('textbook/volumes/03_inference/S1_02_統計量_十分性_分解定理/index.md')
          text = p.read_text(encoding='utf-8')
          old = '後続の I1-02 で正式に定義する**一致性**は、標本数を増やしたとき推定量が真値へ確率収束する性質です。'
          new = 'P4-02 で確率収束の言葉から導入し、I1-02 で推定量の評価基準として改めて扱う**一致性**は、標本数を増やしたとき推定量が真値へ確率収束する性質です。'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one match, got {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook
          git diff --cached --check
          git commit -m 'Align S1-02 consistency wording with P4-02 introduction'
          git push origin HEAD:audit/textbook-concept-dag-batch2
