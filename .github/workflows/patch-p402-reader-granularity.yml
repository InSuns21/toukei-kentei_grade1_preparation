name: Patch P4-02 reader granularity

on:
  push:
    paths:
      - '.github/workflows/patch-p402-reader-granularity.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch P4-02
        run: python .github/scripts/patch_p402_reader_granularity.py
      - name: Remove temporary files
        run: |
          rm .github/scripts/patch_p402_reader_granularity.py
          rm .github/workflows/patch-p402-reader-granularity.yml
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'textbook: align P4-02 with reader granularity rules'
          git push
