name: Temporary LA3 formal math style fix

on:
  push:
    branches:
      - audit/la3abcd-quality-20260912

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[formal-math-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/la3abcd-quality-20260912
          fetch-depth: 0
      - name: Apply formal math style patch
        run: python .github/tmp/fix_la3_formal_math.py
      - name: Remove temporary machinery
        run: |
          rm -f .github/tmp/fix_la3_formal_math.py
          rm -f .github/workflows/tmp-la3-formal-math.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add textbook/volumes/00_foundations/LA3A/index.md textbook/volumes/00_foundations/LA3C/index.md textbook/volumes/00_foundations/LA3D/index.md .github/tmp/fix_la3_formal_math.py .github/workflows/tmp-la3-formal-math.yml
          git commit -m "Align LA3 formal statements with math rendering style [formal-math-fixed]"
          git push origin HEAD:audit/la3abcd-quality-20260912
