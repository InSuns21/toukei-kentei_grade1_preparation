name: Temporary prerequisite-aware textbook review

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/_tmp-prerequisite-aware-review.yml"

jobs:
  revise:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Apply review policy updates
        run: python scripts/_tmp_prerequisite_aware_review.py

      - name: Install dependencies
        run: npm ci

      - name: Validate updated textbook
        run: |
          npm run validate
          npm run audit:textbook-granularity
          npm run validate:pages

      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md agents textbook statistical-mathematics/core/26_conditional_normal_partial_correlation.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "align textbook audits with prerequisite knowledge"
          git push
