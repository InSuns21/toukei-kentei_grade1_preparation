name: Temporary prerequisite-aware textbook review

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/_tmp-prerequisite-aware-review.yml"

jobs:
  revise:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Make LaTeX patch literals raw
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("scripts/_tmp_prerequisite_aware_review.py")
          lines = p.read_text(encoding="utf-8").splitlines(keepends=True)
          prefixes = (
              "new = '''正定値なら半正定値",
              "old = '''よって全ての固有値",
              "new = '''よって全ての固有値",
              "'''$p$変量でも考え方は同じで",
              "'''を使います。本章の通常演習では",
              "'''を使います。この通常の密度表示では",
              "'''> この行列 $",
          )
          out = []
          for line in lines:
              stripped = line.lstrip()
              if stripped.startswith(prefixes) and not stripped.startswith("r'''"):
                  indent = line[:len(line) - len(stripped)]
                  if stripped.startswith("new = '''") or stripped.startswith("old = '''"):
                      line = line.replace("= '''", "= r'''", 1)
                  else:
                      line = indent + "r" + stripped
              out.append(line)
          p.write_text("".join(out), encoding="utf-8")
          PY

      - name: Apply review policy updates
        run: python scripts/_tmp_prerequisite_aware_review.py

      - name: Normalize cross-section foundation reference
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("statistical-mathematics/core/26_conditional_normal_partial_correlation.md")
          text = p.read_text(encoding="utf-8")
          old = 'Schur補の定義は [F0-01「統計のための微積分・線形代数・答案記法」](../../textbook/volumes/00_foundations/F0_01_統計のための微積分_線形代数_答案記法/02_definitions.md) を共通正本とする。'
          new = 'Schur補の定義は通常教材 F0-01「統計のための微積分・線形代数・答案記法」を共通正本とする。'
          if old not in text:
              raise SystemExit("expected Core 08 foundation link not found")
          p.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Install dependencies
        run: npm ci

      - name: Validate updated textbook
        run: |
          npm run validate
          npm run audit:textbook-granularity
          npm run validate:pages

      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md agents textbook statistical-mathematics/core/26_conditional_normal_partial_correlation.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "align textbook audits with prerequisite knowledge"
          git push
