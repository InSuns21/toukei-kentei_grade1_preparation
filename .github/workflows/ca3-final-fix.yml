name: CA3 final patch

on:
  push:
    branches:
      - codex/ca3-cauchy-taylor-liouville-maxmod
    paths:
      - .ca3-final-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ca3-cauchy-taylor-liouville-maxmod
          fetch-depth: 0
      - name: Apply final CA3 wording patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('textbook/volumes/00_foundations/CA3/index.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('有限幾何級数の恒等式を使うと', '次の有限和の等式を分母を払って直接確かめると')
          old = 'なので零点がありません。\n\n[円板上の境界最大値評価]'
          new = 'なので零点がありません。さらに境界はコンパクトでこの下界は一様なので、境界の外側を含む十分小さい近傍まで分母の非消滅が保たれます。従って閉円板全体を含む開近傍で $h$ は正則です。\n\n[円板上の境界最大値評価]'
          if old not in s:
              raise SystemExit('open-image neighborhood insertion point not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add textbook/volumes/00_foundations/CA3/index.md
          git commit -m "Resolve CA3 final dependency wording"
          git push origin HEAD:codex/ca3-cauchy-taylor-liouville-maxmod
