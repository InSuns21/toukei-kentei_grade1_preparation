name: DREAM THEATER category migration inventory

on:
  pull_request:
    paths:
      - 'textbook/migrations/dream-theater-category-layout/**'
      - 'scripts/dream-theater-layout-inventory.mjs'
      - '.github/workflows/dream-theater-category-migration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Inventory source paths and infrastructure references
        run: |
          echo '== Files depending on the flat 00_foundations path =='
          git grep -l '00_foundations' -- scripts pages .github/workflows | sort || true
          echo '== Number of old-root references in tracked files =='
          git grep -l '00_foundations' -- ':!package-lock.json' | wc -l || true
      - name: Verify category mapping and chapter IDs
        run: node scripts/dream-theater-layout-inventory.mjs --strict
