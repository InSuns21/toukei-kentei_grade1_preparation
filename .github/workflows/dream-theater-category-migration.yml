name: DREAM THEATER category migration inventory

on:
  pull_request:
    paths:
      - 'textbook/migrations/dream-theater-category-layout/**'
      - 'scripts/dream-theater-layout-inventory.mjs'
      - '.github/workflows/dream-theater-category-migration.yml'
      - 'scripts/migrate-dream-theater-categories.mjs'
      - 'scripts/verify-dream-theater-category-relocation.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Inventory source paths and infrastructure references
        run: |
          echo '== Files depending on the flat 00_foundations path =='
          git grep -l '00_foundations' -- scripts pages .github/workflows | sort || true
          echo '== Number of old-root references in tracked files =='
          git grep -l '00_foundations' -- ':!package-lock.json' | wc -l || true
      - name: Verify category mapping and chapter IDs
        run: |
          if grep -q 'textbook/volumes/00_foundations/' textbook/dream-theater-index.json; then
            node scripts/dream-theater-layout-inventory.mjs --strict
          else
            node scripts/migrate-dream-theater-categories.mjs --check
          fi
      - name: Verify content preservation when category migration is proposed
        if: github.event_name == 'pull_request'
        run: |
          BASE="$(git merge-base origin/main HEAD)"
          if git show "$BASE:textbook/dream-theater-index.json" | grep -q 'textbook/volumes/00_foundations/'; then
            node scripts/verify-dream-theater-category-relocation.mjs --base "$BASE"
          else
            echo 'Migration already canonical in base; no bulk-relocation proof needed'
          fi
