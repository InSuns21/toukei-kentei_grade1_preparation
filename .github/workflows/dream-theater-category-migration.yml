name: DREAM THEATER category migration inventory

on:
  pull_request:
    paths:
      - 'textbook/migrations/dream-theater-category-layout/**'
      - 'scripts/dream-theater-layout-inventory.mjs'
      - '.github/workflows/dream-theater-category-migration.yml'
      - 'scripts/migrate-dream-theater-categories.mjs'
      - 'scripts/verify-dream-theater-category-relocation.mjs'
      - 'scripts/migrate-dream-theater-courses.mjs'
      - 'scripts/verify-dream-theater-course-relocation.mjs'
      - 'textbook/migrations/dream-theater-course-layer/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Inventory source paths and infrastructure references
        run: |
          echo '== Files depending on the flat 00_foundations path =='
          git grep -l '00_foundations' -- scripts pages .github/workflows | sort || true
          echo '== Number of old-root references in tracked files =='
          git grep -l '00_foundations' -- ':!package-lock.json' | wc -l || true
      # The 2026 category/course moves are complete. Keep a read-only current
      # layout check; historical migration scripts require their old commit.
      - name: Verify current chapter layout and public contents
        run: npm run validate:dream-theater-index
