name: Temporary FA2 CI fixes

on:
  push:
    branches:
      - codex/fa2-open-mapping-bounded-inverse-closed-graph

permissions:
  contents: write

jobs:
  fix-fa2:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fa2-open-mapping-bounded-inverse-closed-graph
      - name: Patch FA2 math and dependency issues
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re
          def dec(value):
              return base64.b64decode(value).decode()
          p = Path('textbook/volumes/00_foundations/FA2/index.md')
          s = p.read_text()
          s = re.sub(r'\n\\tag\{\d+\}', '', s)
          for old, new in [
              ('従って (1) から', '従ってこの球包含から'),
              ('以後の目標は (1) の形の球包含', '以後の目標はこの形の球包含'),
              ('を (2) に適用でき', 'をこの可算被覆に適用でき'),
              ('(3) より $y_+,y_-', 'この球包含より $y_+,y_-'),
              ('まだ (4) は閉包の主張にすぎません', 'まだここで得たのは閉包の主張にすぎません'),
              ('であり、(5) から', 'であり、上の拡大縮小した包含から'),
              ('(6) から $m>n$', 'このノルム評価から $m>n$'),
              ('一方 (7) の右辺', '一方この残差評価の右辺'),
              ('## 4. 主定理：全射有界線形作用素は開く', '## 4. 全射有界線形作用素の像は開く'),
              ('補正級数', '補正列の部分和'),
              ('逐次補正の級数', '逐次補正の部分和'),
          ]:
              s = s.replace(old, new)
          limit_link = '[極限の一意性](../F0_00B_距離空間_開集合_閉集合_収束/index.md#prop-f0-00b-01)'
          s = s.replace('極限の一意性', limit_link)
          bounded = dec('')
          s, n = re.subn(r'### 例：微分と積分が互いに有界になるノルム\n.*?\n---\n\n## 6\.', lambda m: bounded, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('bounded inverse example target not found')
          graph = dec('')
          s, n = re.subn(r'<!-- definition-example-start: def-fa2-graph-norm -->.*?<!-- definition-example-end -->', lambda m: graph, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('graph norm example target not found')
          diag = dec('')
          s, n = re.subn(r'### 10\.2 閉作用素でも定義域が全空間でなければ有界とは限らない\n.*?\n---\n\n## 11\.', lambda m: diag, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('closed operator counterexample target not found')
          exercise = dec('')
          s, n = re.subn(r'### FA2-C01 閉じているが有界でない微分作用素\n.*?\n<!-- solution-end -->\n\n---', lambda m: exercise, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('C01 derivative exercise target not found')
          p.write_text(s)
          p = Path('textbook/volumes/00_foundations/FA1/index.md')
          s = p.read_text()
          old = 'ここでは FA2 の開写像定理を使っていません。'
          new = 'ここでは FA2 の[開写像定理](../FA2/index.md#thm-fa2-open-mapping)を使っていません。'
          if old not in s:
              raise SystemExit('FA1 open mapping reference target not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook/volumes/00_foundations/FA1/index.md textbook/volumes/00_foundations/FA2/index.md
          git commit -m 'Fix FA2 math and dependency audits'
          git push origin HEAD:codex/fa2-open-mapping-bounded-inverse-closed-graph
