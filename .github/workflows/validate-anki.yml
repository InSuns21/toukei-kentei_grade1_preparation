name: Validate Anki

on:
  push:
    branches:
      - main
    paths:
      - 'anki/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-anki.yml'
  pull_request:
    paths:
      - 'anki/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-anki.yml'
  workflow_dispatch:

jobs:
  validate-anki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Anki
        run: npm run anki:validate
