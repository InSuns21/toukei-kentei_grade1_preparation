name: Finalize Fisher information terminology

on:
  push:
    branches:
      - fix/mathstat-rikou80-terminology-full-audit

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mathstat-rikou80-terminology-full-audit
          fetch-depth: 0
      - name: Normalize Fisher information wording and audit rule
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('statistical-mathematics/index.md')
          s = p.read_text()
          s = s.replace('フィッシャー情報・', 'フィッシャー情報量・')
          p.write_text(s)

          p = Path('scripts/audit_textbook_japanese_terminology.mjs')
          s = p.read_text()
          needle = "  always('Fisher情報量', 'フィッシャー情報量', /Fisher情報量/g),\n"
          rule = "  always('フィッシャー情報', 'フィッシャー情報量', /フィッシャー情報(?!量|行列)/g),\n"
          if rule not in s:
              s = s.replace(needle, needle + rule, 1)
          p.write_text(s)
          PY
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add statistical-mathematics/index.md scripts/audit_textbook_japanese_terminology.mjs
          if git diff --cached --quiet; then
            echo 'No fixes needed'
          else
            git commit -m 'fix: normalize Fisher information terminology'
            git push
          fi
