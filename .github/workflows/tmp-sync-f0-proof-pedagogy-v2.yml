name: Temporary sync F0 pedagogy batch v2

on:
  push:
    branches:
      - refactor/f0-proof-pedagogy-next-batch-v2
    paths:
      - '.github/workflows/tmp-sync-f0-proof-pedagogy-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/f0-proof-pedagogy-next-batch-v2
          fetch-depth: 0
      - name: Cherry-pick validated textbook commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin refactor/f0-proof-pedagogy-next-batch
          git cherry-pick 91404a8a4bfeec288d45ac241bf48dbfbeda6b75
          git cherry-pick 8283dcbcc6979e812223bcc12dcbd2c155f5dccd
          git cherry-pick 66498f24a451eb3147dadaa8dc0a196ed07c83f8
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Validate final rebased content
        run: |
          npm run validate
          npm run validate:pages
          npm run audit:proof-pedagogy
          npm run audit:formalism-pedagogy
      - name: Push synchronized branch
        run: git push origin HEAD:refactor/f0-proof-pedagogy-next-batch-v2
