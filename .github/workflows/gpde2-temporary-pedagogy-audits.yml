name: GPDE2 temporary pedagogy audits

on:
  push:
    branches:
      - gpde2-distribution-derivative-mollifier
  workflow_dispatch:

jobs:
  audit-gpde2-pedagogy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit proof pedagogy
        run: npm run audit:proof-pedagogy

      - name: Audit formalism pedagogy
        run: npm run audit:formalism-pedagogy
