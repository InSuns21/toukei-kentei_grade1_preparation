name: Migrate S1-01 one page

on:
  push:
    paths:
      - '.github/workflows/migrate-s101-onepage.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build one-page S1-01
        run: python .github/scripts/migrate_s101_onepage.py
      - name: Remove temporary migration files
        run: |
          rm .github/scripts/migrate_s101_onepage.py
          rm .github/workflows/migrate-s101-onepage.yml
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'textbook: migrate S1-01 to one-page reviewed format'
          git push
