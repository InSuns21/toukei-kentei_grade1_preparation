name: Temporary GPDE9 pedagogy audits

on:
  pull_request:
    branches: [main]

jobs:
  gpde9-pedagogy-audits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run proof pedagogy audit
        run: |
          npm run audit:proof-pedagogy | tee /tmp/proof-audit.txt
          grep 'GPDE9' /tmp/proof-audit.txt || true
      - name: Run formalism pedagogy audit
        run: |
          npm run audit:formalism-pedagogy | tee /tmp/formalism-audit.txt
          grep 'GPDE9' /tmp/formalism-audit.txt || true
