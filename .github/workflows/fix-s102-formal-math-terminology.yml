name: Fix S1-02 formal math and terminology

on:
  push:
    branches:
      - feat/textbook-completeness-rao-blackwell-lehmann-scheffe
    paths:
      - .github/workflows/fix-s102-formal-math-terminology.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/textbook-completeness-rao-blackwell-lehmann-scheffe
          fetch-depth: 0
      - name: Apply exact fixes
        run: python3 scripts/tmp_fix_s102_formal_math_terminology.py
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook
          git diff --cached --check
          git commit -m 'Fix S1-02 formal math rendering and terminology'
          git push origin HEAD:feat/textbook-completeness-rao-blackwell-lehmann-scheffe
