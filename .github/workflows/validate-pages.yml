name: Apply legacy heading revert

on:
  push:
    branches:
      - feature/dream-theater-topology-core
    paths:
      - '.github/workflows/validate-pages.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dream-theater-topology-core
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/revert-legacy-formal-headings.mjs
