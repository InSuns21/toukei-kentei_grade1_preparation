name: Validate Pages assembly

on:
  pull_request:
    paths:
      - 'pages/**'
      - 'textbook/**'
      - 'statistical-mathematics/**'
      - 'applied-rikou-80/**'
      - 'anki/**'
      - 'references/**'
      - 'agents/**'
      - 'scripts/**'
      - 'AGENTS.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/recover-pages-deploy.yml'
      - '.github/workflows/validate-pages.yml'
  workflow_dispatch:

concurrency:
  group: validate-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve PR merge-base parent for diff validation
        if: github.event_name == 'pull_request'
        run: echo "PR_COMPARISON_SHA=$(git rev-parse HEAD^1)" >> "$GITHUB_ENV"

      - name: Detect Pages validation scope
        id: scope
        env:
          TEXTBOOK_BASE_SHA: ${{ env.PR_COMPARISON_SHA }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/detect-textbook-validation-scope.mjs --github-output
          else
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual dispatch" >> "$GITHUB_OUTPUT"
          fi

      - name: Explain deferred content-only assembly
        if: steps.scope.outputs.full != 'true'
        run: |
          echo "Content-only PR: full Pages assembly is deferred to the main-branch deployment."

      - name: Validate DREAM THEATER index facade
        run: node scripts/validate-dream-theater-index.mjs --facade-only

      - name: Setup Node.js
        if: steps.scope.outputs.full == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        if: steps.scope.outputs.full == 'true'
        run: npm ci

      - name: Test bounded Pages deployment recovery
        if: steps.scope.outputs.full == 'true'
        run: node --test scripts/test-pages-deploy-recovery.mjs

      - name: Validate live smoke script syntax
        if: steps.scope.outputs.full == 'true'
        run: python3 -m py_compile scripts/smoke-pages-live.py

      - name: Validate CELEV8 Python Newton and variational kernels
        if: steps.scope.outputs.full == 'true'
        run: |
          node --check pages/simulation/celev8-python-worker.mjs
          node --check pages/simulation/celev8-app.mjs
          python3 scripts/test-celev8-kernel.py

      - name: Validate GEOD numerical kernels and no-WebGL interaction
        if: steps.scope.outputs.full == 'true'
        run: npm run validate:simulation-phase0

      - name: Validate SLT comparison models and numerical invariants
        if: steps.scope.outputs.full == 'true'
        run: node --test pages/simulation/slt-comparisons-model.test.mjs

      - name: Assemble and validate Pages site
        if: steps.scope.outputs.full == 'true'
        run: npm run validate:pages

      # Ubuntu's default headless Chrome environment lacks Japanese glyphs;
      # render artifacts must display the same CJK labels as learners see.
      - name: Install verified CJK font for ORI SVG screenshot review
        if: steps.scope.outputs.full == 'true'
        run: |
          if ! fc-list : family | grep -q 'Noto Sans CJK JP'; then
            noto_file="$RUNNER_TEMP/NotoSansCJKjp-Regular.otf"
            if curl --fail --location --retry 3 --retry-all-errors --connect-timeout 15 \
              --max-time 240 --silent --show-error --output "$noto_file" \
              'https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/OTF/Japanese/NotoSansCJKjp-Regular.otf'; then
              test "$(git hash-object "$noto_file")" = 'f56224957fb13a81b4c14bac34f2f058a017f9fb'
              sudo install -Dm644 "$noto_file" /usr/local/share/fonts/opentype/noto/NotoSansCJKjp-Regular.otf
              fc-cache -f
            else
              sudo apt-get update -qq
              sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk
            fi
          fi
          fc-list : family | grep -q 'Noto Sans CJK JP'

      - name: Validate all 15 ORI SVG films in real Chromium (Phase C and D)
        if: steps.scope.outputs.full == 'true'
        run: npm run validate:ori-svg-browser

      - name: Upload ORI SVG real-browser keyframe screenshots
        if: always() && steps.scope.outputs.full == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ori-svg-browser-review
          path: _ori_svg_render_review/
          if-no-files-found: warn
          retention-days: 14

      - name: Validate ML I/II completed plan inventory and lab routes
        if: steps.scope.outputs.full == 'true'
        run: node scripts/validate-ml-plan-completion.mjs

      - name: Smoke interactive simulation in Chromium
        if: steps.scope.outputs.full == 'true'
        run: |
          npm run validate:simulation-browser
          node scripts/validate-geod-browser.mjs
          node scripts/validate-celev8-browser.mjs
          node scripts/validate-ml-completion-browser.mjs
