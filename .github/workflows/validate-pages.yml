name: Validate Pages assembly

on:
  pull_request:
    paths:
      - 'pages/**'
      - 'textbook/**'
      - 'statistical-mathematics/**'
      - 'applied-rikou-80/**'
      - 'anki/**'
      - 'references/**'
      - 'agents/**'
      - 'scripts/**'
      - 'AGENTS.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-pages.yml'
  workflow_dispatch:

concurrency:
  group: validate-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve PR merge-base parent for diff validation
        if: github.event_name == 'pull_request'
        run: echo "PR_COMPARISON_SHA=$(git rev-parse HEAD^1)" >> "$GITHUB_ENV"

      - name: Detect Pages validation scope
        id: scope
        env:
          TEXTBOOK_BASE_SHA: ${{ env.PR_COMPARISON_SHA }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/detect-textbook-validation-scope.mjs --github-output
          else
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "reason=manual dispatch" >> "$GITHUB_OUTPUT"
          fi

      - name: Explain deferred content-only assembly
        if: steps.scope.outputs.full != 'true'
        run: |
          echo "Content-only PR: full Pages assembly is deferred to the main-branch deployment."

      - name: Validate DREAM THEATER index facade
        run: node scripts/validate-dream-theater-index.mjs --facade-only

      - name: Setup Node.js
        if: steps.scope.outputs.full == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        if: steps.scope.outputs.full == 'true'
        run: npm ci

      - name: Validate live smoke script syntax
        if: steps.scope.outputs.full == 'true'
        run: python3 -m py_compile scripts/smoke-pages-live.py

      - name: Assemble and validate Pages site
        if: steps.scope.outputs.full == 'true'
        run: npm run validate:pages
