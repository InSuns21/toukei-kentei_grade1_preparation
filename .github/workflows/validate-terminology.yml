name: Validate terminology

on:
  push:
    branches:
      - main
    paths:
      - 'statistical-mathematics/**'
      - 'applied-rikou-80/**'
      - 'textbook/**'
      - 'anki/**'
      - 'references/terminology-guide.md'
      - 'scripts/audit_terminology.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-terminology.yml'
  pull_request:
    paths:
      - 'statistical-mathematics/**'
      - 'applied-rikou-80/**'
      - 'textbook/**'
      - 'anki/**'
      - 'references/terminology-guide.md'
      - 'scripts/audit_terminology.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-terminology.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-terminology:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fix distribution names repo-wide
        run: node scripts/audit_terminology.mjs --fix-distribution-names

      - name: Verify distribution naming repo-wide
        run: |
          node scripts/audit_terminology.mjs | tee /tmp/terminology-audit.log
          if grep -Eq '^- (Cauchy分布|カウチー|Weibull|ウェイブル|レイブル|Pareto):' /tmp/terminology-audit.log; then
            echo '::error::分布名の表記揺れが残っています'
            exit 1
          fi

      - name: Commit one-time cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add statistical-mathematics applied-rikou-80 textbook/volumes anki/cards
          if ! git diff --cached --quiet; then
            git commit -m 'Normalize distribution terminology repo-wide'
            git push
          fi
