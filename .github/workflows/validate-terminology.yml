name: Validate terminology

on:
  push:
    branches:
      - main
    paths:
      - 'statistical-mathematics/**'
      - 'applied-rikou-80/**'
      - 'textbook/**'
      - 'anki/**'
      - 'references/terminology-guide.md'
      - 'references/house-style-terminology.md'
      - 'references/acronym-first-use-policy.md'
      - 'scripts/audit_terminology.mjs'
      - 'scripts/audit_acronym_first_use.mjs'
      - 'scripts/audit_textbook_japanese_terminology.mjs'
      - 'scripts/audit_textbook_term_spacing.mjs'
      - 'scripts/audit_house_style_terminology.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-terminology.yml'
  pull_request:
    paths:
      - 'statistical-mathematics/**'
      - 'applied-rikou-80/**'
      - 'textbook/**'
      - 'anki/**'
      - 'references/terminology-guide.md'
      - 'references/house-style-terminology.md'
      - 'references/acronym-first-use-policy.md'
      - 'scripts/audit_terminology.mjs'
      - 'scripts/audit_acronym_first_use.mjs'
      - 'scripts/audit_textbook_japanese_terminology.mjs'
      - 'scripts/audit_textbook_term_spacing.mjs'
      - 'scripts/audit_house_style_terminology.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-terminology.yml'
  workflow_dispatch:

concurrency:
  group: validate-terminology-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-terminology:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect pull-request validation scope
        if: github.event_name == 'pull_request'
        id: scope
        env:
          TEXTBOOK_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/detect-textbook-validation-scope.mjs --github-output

      - name: Validate syllabus terminology and changed prose
        env:
          TERMINOLOGY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run validate:terminology:changed

      - name: Validate acronym first use on changed pages
        env:
          TERMINOLOGY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run validate:acronym-first-use:changed

      - name: Validate all Grade 1 Japanese terminology
        if: github.event_name != 'pull_request' || steps.scope.outputs.full == 'true'
        run: node scripts/audit_textbook_japanese_terminology.mjs --strict

      - name: Validate Japanese terminology spacing
        if: github.event_name != 'pull_request' || steps.scope.outputs.full == 'true'
        run: node scripts/audit_textbook_term_spacing.mjs

      - name: Validate advanced-math house style
        if: github.event_name != 'pull_request' || steps.scope.outputs.full == 'true'
        run: node scripts/audit_house_style_terminology.mjs
