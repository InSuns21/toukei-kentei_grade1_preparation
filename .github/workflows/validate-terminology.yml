name: Validate terminology

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/validate-terminology.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revert-autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Revert unsafe autofix commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git revert --no-edit 4761af0c03ced1fa2a2aa485c827697659e37218
          git push
