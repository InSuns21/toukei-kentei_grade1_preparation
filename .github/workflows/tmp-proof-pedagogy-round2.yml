name: Temporary proof pedagogy round2

on:
  push:
    branches:
      - revise/f0-proof-pedagogy-round2
    paths:
      - 'scripts/tmp-proof-pedagogy-round2.py'
      - '.github/workflows/tmp-proof-pedagogy-round2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: revise/f0-proof-pedagogy-round2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply narrative revisions
        run: python3 scripts/tmp-proof-pedagogy-round2.py

      - name: Refresh proof pedagogy audit
        run: |
          node scripts/audit-proof-pedagogy.mjs --write textbook/f0-dream-theater-proof-pedagogy-audit.md > /tmp/proof-audit.txt
          sed -n '1,90p' /tmp/proof-audit.txt

      - name: Validate textbook and proof folding
        run: npm run validate

      - name: Validate Pages assembly
        run: npm run validate:pages

      - name: Commit revisions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            textbook/volumes/00_foundations/F0_00B_距離空間_開集合_閉集合_収束/index.md \
            textbook/volumes/00_foundations/F0_00C_連続写像_コンパクト性_最大最小/index.md \
            textbook/volumes/00_foundations/F0_00D2_測度_可測関数_Lebesgue積分_Lp/index.md \
            textbook/volumes/00_foundations/F0_00D2A_単関数_Lebesgue積分_構成/index.md \
            textbook/volumes/00_foundations/F0_00D2B_単調収束_Fatou_優収束/index.md \
            textbook/volumes/00_foundations/F0_00D2C_積測度_Tonelli_Fubini/index.md \
            textbook/volumes/00_foundations/F0_00D2E_L2完備性_Riesz_Fischer/index.md \
            textbook/volumes/00_foundations/F0_00P4_収束_Borel_Cantelli_一様可積分性/index.md \
            textbook/f0-dream-theater-proof-pedagogy-audit.md
          if git diff --cached --quiet; then
            echo 'No narrative changes to commit.'
          else
            git commit -m 'restore narrative around remaining proof-heavy foundations'
            git push
          fi
