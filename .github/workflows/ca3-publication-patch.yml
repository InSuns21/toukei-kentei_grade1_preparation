name: CA3 publication patch

on:
  push:
    branches:
      - codex/ca3-cauchy-taylor-liouville-maxmod
    paths:
      - .ca3-publication-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/ca3-cauchy-taylor-liouville-maxmod
          fetch-depth: 0
      - name: Patch CA3 publication files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          ca3 = Path("textbook/volumes/00_foundations/CA3/index.md")
          text = ca3.read_text(encoding="utf-8")
          text = text.replace(chr(8) + "igl", chr(92) + "bigl")
          text = text.replace(chr(12) + "rac", chr(92) + "frac")
          text = text.replace("任意の $z$ with $|z-a|<R$ に対して", "任意の $z$ で $|z-a|<R$ に対して")
          ca3.write_text(text, encoding="utf-8")

          core = Path("textbook/dream-theater-standard-math-core.yaml")
          text = core.read_text(encoding="utf-8")
          old = "\n".join([
              "  - id: CA3",
              "    title: Cauchy積分公式・Taylor展開・Liouville・最大値原理",
              "    area: complex-analysis",
              "    tier: core",
              "    status: planned",
              "    prerequisites: [CA2]",
              "",
          ])
          new = "\n".join([
              "  - id: CA3",
              "    title: Cauchy積分公式・Taylor展開・Liouville・最大値原理",
              "    area: complex-analysis",
              "    tier: core",
              "    status: implemented",
              "    implemented_at: 2026-09-09",
              "    implementation_path: textbook/volumes/00_foundations/CA3/index.md",
              "    prerequisites: [CA2]",
              "",
          ])
          if old not in text and new not in text:
              raise SystemExit("CA3 block not found in standard-math-core.yaml")
          if old in text:
              text = text.replace(old, new, 1)
          core.write_text(text, encoding="utf-8")

          manifest_path = Path("textbook/dream-theater-index.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          ca2_path = "textbook/volumes/00_foundations/CA2/index.md"
          ca3_path = "textbook/volumes/00_foundations/CA3/index.md"
          for section in manifest["sections"]:
              if section.get("name") == "DREAM THEATER 本編":
                  paths = section["paths"]
                  if ca3_path not in paths:
                      paths.insert(paths.index(ca2_path) + 1, ca3_path)
                  break
          else:
              raise SystemExit("DREAM THEATER 本編 section not found")
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          facade = Path("textbook/dream-theater.md")
          text = facade.read_text(encoding="utf-8")
          ca2_line = "2. [CA2 複素線積分・原始関数・Cauchy–Goursat](textbook/volumes/00_foundations/CA2/index.md)"
          ca3_line = "3. [CA3 Cauchy積分公式・Taylor展開・Liouville・最大値原理](textbook/volumes/00_foundations/CA3/index.md)"
          if ca3_line not in text:
              if ca2_line not in text:
                  raise SystemExit("CA2 facade line not found")
              text = text.replace(ca2_line, ca2_line + "\n" + ca3_line, 1)
          facade.write_text(text, encoding="utf-8")

          for draft in [
              Path("textbook/drafts/standard-math-core/CA3/chapter.yaml"),
              Path("textbook/drafts/standard-math-core/CA3/index.md"),
          ]:
              if draft.exists():
                  draft.unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add textbook/volumes/00_foundations/CA3/index.md \
                  textbook/dream-theater-standard-math-core.yaml \
                  textbook/dream-theater-index.json \
                  textbook/dream-theater.md \
                  textbook/drafts/standard-math-core/CA3/chapter.yaml \
                  textbook/drafts/standard-math-core/CA3/index.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Publish CA3 and fix math escapes"
          git push origin HEAD:codex/ca3-cauchy-taylor-liouville-maxmod
