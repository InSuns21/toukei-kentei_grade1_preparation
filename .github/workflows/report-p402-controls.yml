name: Clean P4-02 controls

on:
  push:
    paths:
      - '.github/workflows/report-p402-controls.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove control characters
        run: python .github/scripts/report_p402_controls.py
      - name: Remove temporary probe files
        run: |
          rm .github/scripts/report_p402_controls.py
          rm .github/workflows/report-p402-controls.yml
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'textbook: remove P4-02 control characters'
          git push
