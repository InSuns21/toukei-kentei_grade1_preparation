name: Temporary FA5 surgical fix

on:
  push:
    branches:
      - feat/fa5-spectrum-resolvent

permissions:
  contents: write

jobs:
  patch-fa5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/fa5-spectrum-resolvent
          fetch-depth: 0
      - name: Patch FA5 reader text and facade
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected one occurrence, got {n}: {old!r}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'textbook/volumes/00_foundations/FA5/index.md',
              'FA4 までで Banach 空間、双対空間、Hahn–Banach、弱位相・弱*位相とコンパクト性を準備しました。本章では一つの有界作用素 $T$ を固定し、',
              'これまでに Banach 空間、双対空間、Hahn–Banach と複素解析側の道具を準備しました。本章では一つの有界作用素 $T$ を固定し、'
          )
          replace_once(
              'textbook/volumes/00_foundations/FA5/index.md',
              '非対角化可能性は resolvent に二次の極として見えますが、spectrum の集合そのものは固有値2だけです。',
              '非対角化可能性は resolvent の $(\\lambda-2)^{-2}$ 項として見えますが、spectrum の集合そのものは固有値2だけです。'
          )
          replace_once(
              'textbook/dream-theater.md',
              '12. [FA4 Banach–Alaoglu・Goldstine・反射性](textbook/volumes/00_foundations/FA4/index.md)\n13. [F0-02C6A 分離定理・Minkowski・Farkas](textbook/volumes/00_foundations/F0_02C6A_分離定理_Minkowski_Farkas/index.md)',
              '12. [FA4 Banach–Alaoglu・Goldstine・反射性](textbook/volumes/00_foundations/FA4/index.md)\n13. [FA5 スペクトル・レゾルベント](textbook/volumes/00_foundations/FA5/index.md)\n14. [F0-02C6A 分離定理・Minkowski・Farkas](textbook/volumes/00_foundations/F0_02C6A_分離定理_Minkowski_Farkas/index.md)'
          )
          PY
          rm .github/workflows/tmp-fa5-surgical-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add textbook/volumes/00_foundations/FA5/index.md textbook/dream-theater.md .github/workflows/tmp-fa5-surgical-fix.yml
          git commit -m "fix(FA5): align reader dependencies and facade"
          git push origin HEAD:feat/fa5-spectrum-resolvent
