name: Temporary P4-03 CI repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp_fix_p403_ci.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Patch terminology regression
        run: python3 scripts/_tmp_fix_p403_ci.py
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add statistical-mathematics/core/87_monte_carlo_variance_comparison.md
          git diff --cached --quiet && exit 0
          git commit -m 'Fix i.i.d. terminology regression'
          git push origin main
