name: Temporary P4-03 CI repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp_fix_p403_ci.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Record P4-03 review completion
        run: python3 scripts/_tmp_fix_p403_ci.py
      - name: Commit review record
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook/REVIEW_PLAN.md
          git diff --cached --quiet && exit 0
          git commit -m 'textbook: record P4-03 review completion'
          git push origin main

# final review-plan pass
