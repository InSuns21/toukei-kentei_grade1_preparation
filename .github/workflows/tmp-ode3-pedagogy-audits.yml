name: Temporary ODE3 pedagogy audits

on:
  push:
    branches:
      - codex/dream-theater-ode3-linear-systems

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/dream-theater-ode3-linear-systems
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Audit proof pedagogy
        run: npm run audit:proof-pedagogy
      - name: Audit formalism pedagogy
        run: npm run audit:formalism-pedagogy
