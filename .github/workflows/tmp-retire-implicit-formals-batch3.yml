name: Temporary implicit formal retirement batch 3

on:
  push:
    branches:
      - refactor/retire-implicit-formals-batch3
    paths:
      - 'scripts/tmp-retire-implicit-formals-batch3.mjs'
      - '.github/workflows/tmp-retire-implicit-formals-batch3.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/retire-implicit-formals-batch3
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/tmp-retire-implicit-formals-batch3.mjs
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add textbook/volumes/00_foundations/F0_02C1_ノルム空間_Banach_Hilbert/index.md textbook/volumes/00_foundations/F0_02C2_線形汎関数_双対空間_Riesz/index.md textbook/volumes/00_foundations/F0_02C3_Frechet微分_線形作用素_随伴/index.md textbook/volumes/00_foundations/F0_02C3A_随伴作用素_Banach_Hilbert/index.md scripts/implicit-formal-baseline.txt
          git commit -m 'formalize core functional-analysis definitions'
          git push
      - run: npm ci
      - run: npm run validate
      - run: npm run validate:pages
