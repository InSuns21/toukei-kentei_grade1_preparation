name: Fix P4-02 self-contained exercises

on:
  push:
    paths:
      - '.github/workflows/fix-p402-self-contained.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('textbook/volumes/02_distributions/P4_02_確率変数の収束_大数則_中心極限定理/index.md')
          s = p.read_text(encoding='utf-8')

          def once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'missing target: {label}')
              s = s.replace(old, new, 1)

          once('# 11. 演習：問題の直後に解答', '# 11. 演習', 'heading')
          start = s.index('## 問題で使う分布\n\n')
          end = s.index('## Level A', start)
          s = s[:start] + s[end:]

          once('$X_n=1/n$とする。$X_n$が0へ確率収束、概収束、分布収束することを定義から示せ。',
               '同一の確率空間上で、各$n$について定数確率変数$X_n(\\omega)=1/n$とする。$X_n$が0へ確率収束、概収束、分布収束することを定義から示せ。', 'A01')

          once('独立な$X_1,\\ldots,X_n\\sim\\operatorname{Bernoulli}(p)$について$E[\\overline X_n]$と$\\operatorname{Var}(\\overline X_n)$を求めよ。',
               '''$0\\leq p\\leq1$とする。独立なベルヌーイ確率変数$X_1,\\ldots,X_n$が
$$
P(X_i=1)=p,\\qquad P(X_i=0)=1-p
$$
を満たすとする。標本平均を
$$
\\overline X_n=\\frac1n\\sum_{i=1}^nX_i
$$
と定義する。$E[\\overline X_n]$と$\\operatorname{Var}(\\overline X_n)$を求めよ。''', 'A02')

          once('独立な$X_1,\\ldots,X_n\\sim N(\\mu,\\sigma^2)$について$\\overline X_n$の分布を求めよ。',
               '''$\\mu\\in\\mathbb R$, $\\sigma^2>0$とする。独立な$X_1,\\ldots,X_n\\sim N(\\mu,\\sigma^2)$について
$$
\\overline X_n=\\frac1n\\sum_{i=1}^nX_i
$$
と定義する。$\\overline X_n$の分布を求めよ。''', 'A03')

          once('$\\lambda>0$を固定し、$n\\geq\\lceil\\lambda\\rceil$とする。$B_n\\sim\\operatorname{Bin}(n,\\lambda/n)$の平均と分散を求め、それぞれ$n\\to\\infty$でどうなるか述べよ。',
               '''$\\lambda>0$を固定し、$n\\geq\\lceil\\lambda\\rceil$とする。$B_n$は
$$
P(B_n=k)=\\binom nk\\left(\\frac\\lambda n\\right)^k\\left(1-\\frac\\lambda n\\right)^{n-k},\\qquad k=0,\\ldots,n
$$
で定まる二項分布に従うとする。二項分布$\\operatorname{Bin}(n,p)$の平均$np$、分散$np(1-p)$は用いてよい。$B_n$の平均と分散を求め、それぞれ$n\\to\\infty$でどうなるか述べよ。''', 'A04')

          once('$X_n\\xrightarrow{p}X$とする。定数$a,b\\in\\mathbb R$について$aX_n+b$の確率収束先を示せ。',
               '確率変数列$X_n$が確率変数$X$へ確率収束するとする。定数$a,b\\in\\mathbb R$について$aX_n+b$の確率収束先を示せ。', 'B01')

          once('$X_1,X_2,\\ldots$は独立同分布で$E|X_1|<\\infty$とする。$\\overline X_n$の収束を大数の法則で説明せよ。さらに$\\operatorname{Var}(X_1)=\\sigma^2<\\infty$ならチェビシェフの不等式から確率収束を直接示せ。',
               '''$X_1,X_2,\\ldots$は独立同分布で$E|X_1|<\\infty$とし、
$$
\\mu=E[X_1],\\qquad \\overline X_n=\\frac1n\\sum_{i=1}^nX_i
$$
と定義する。$\\overline X_n$の収束を大数の法則で説明せよ。さらに$\\operatorname{Var}(X_1)=\\sigma^2<\\infty$とし、チェビシェフの不等式
$$
P(|Y-E[Y]|>\\varepsilon)\\leq\\frac{\\operatorname{Var}(Y)}{\\varepsilon^2}
$$
を用いて$\\overline X_n$の確率収束を直接示せ。''', 'B02')

          once('$X_1,\\ldots,X_n$を独立な$\\operatorname{Poisson}(\\lambda)$とし、$\\varepsilon>0$とする。$P(|\\overline X_n-\\lambda|\\leq\\varepsilon)$を中心極限定理で近似せよ。',
               '''$\\lambda>0$とする。独立な確率変数$X_1,\\ldots,X_n$が
$$
P(X_i=k)=e^{-\\lambda}\\frac{\\lambda^k}{k!},\\qquad k=0,1,2,\\ldots
$$
で与えられるポアソン分布に従い、$E[X_i]=\\operatorname{Var}(X_i)=\\lambda$を用いてよいとする。標本平均を
$$
\\overline X_n=\\frac1n\\sum_{i=1}^nX_i
$$
と定義し、$\\varepsilon>0$とする。標準正規分布の累積分布関数を$\\Phi$とするとき、$P(|\\overline X_n-\\lambda|\\leq\\varepsilon)$を中心極限定理で近似せよ。''', 'B03')

          once('$B\\sim\\operatorname{Bin}(400,0.3)$とする。$P(B\\leq130)$を連続補正付き正規近似で表せ。',
               '$B\\sim\\operatorname{Bin}(400,0.3)$とする。二項分布$\\operatorname{Bin}(n,p)$の平均$np$、分散$np(1-p)$を用いてよい。標準正規分布の累積分布関数を$\\Phi$とするとき、$P(B\\leq130)$を連続補正付き正規近似で表せ。', 'B04')

          once('''独立な$X_1,\\ldots,X_n\\sim\\operatorname{Poisson}(\\lambda)$について$\\overline X_n$を考える。

1. $E[\\overline X_n]$と$\\operatorname{Var}(\\overline X_n)$を求めよ。''',
               '''$\\lambda>0$とする。独立な確率変数$X_1,\\ldots,X_n$が
$$
P(X_i=k)=e^{-\\lambda}\\frac{\\lambda^k}{k!},\\qquad k=0,1,2,\\ldots
$$
で与えられるポアソン分布に従い、$E[X_i]=\\operatorname{Var}(X_i)=\\lambda$を用いてよいとする。標本平均を
$$
\\overline X_n=\\frac1n\\sum_{i=1}^nX_i
$$
と定義する。標準正規分布の累積分布関数を$\\Phi$とする。

1. $E[\\overline X_n]$と$\\operatorname{Var}(\\overline X_n)$を求めよ。''', 'C01')

          once('$0<p<1$とし、独立な$X_1,\\ldots,X_n\\sim\\operatorname{Bernoulli}(p)$とする。$\\widehat p=\\overline X_n$と置く。',
               '''$0<p<1$とする。独立なベルヌーイ確率変数$X_1,\\ldots,X_n$が
$$
P(X_i=1)=p,\\qquad P(X_i=0)=1-p
$$
を満たすとする。標本比率を
$$
\\widehat p=\\overline X_n=\\frac1n\\sum_{i=1}^nX_i
$$
と定義する。''', 'C02')

          once('独立な$X_1,\\ldots,X_n\\sim\\operatorname{Poisson}(\\lambda)$、$\\lambda>0$とし、$T_n=\\sum_iX_i$とする。',
               '''$\\lambda>0$とする。独立な確率変数$X_1,\\ldots,X_n$が
$$
P(X_i=k)=e^{-\\lambda}\\frac{\\lambda^k}{k!},\\qquad k=0,1,2,\\ldots
$$
で与えられるポアソン分布に従うとし、
$$
T_n=\\sum_{i=1}^nX_i
$$
と定義する。標準正規分布の累積分布関数を$\\Phi$とする。''', 'C03')

          once('1. ある同じRademacher分布をもつ確率変数$X$への分布収束を示せ。',
               '1. $P(X=1)=P(X=-1)=1/2$を満たす確率変数$X$への分布収束を示せ。', 'C04')

          once('''$\\lambda>0$を固定し、$n\\geq\\lceil\\lambda\\rceil$、$B_n\\sim\\operatorname{Bin}(n,\\lambda/n)$とする。

1. 固定した$k\\in\\mathbb N_0$について$P(B_n=k)$の極限を因子ごとに示せ。''',
               '''$\\lambda>0$を固定し、$n\\geq\\lceil\\lambda\\rceil$とする。$B_n$は
$$
P(B_n=k)=\\binom nk\\left(\\frac\\lambda n\\right)^k\\left(1-\\frac\\lambda n\\right)^{n-k},\\qquad k=0,\\ldots,n
$$
で定まる二項分布に従うとする。また、平均$\\lambda$のポアソン分布の確率質量関数は
$$
q(k)=e^{-\\lambda}\\frac{\\lambda^k}{k!},\\qquad k=0,1,2,\\ldots
$$
である。

1. 固定した$k\\in\\mathbb N_0$について$P(B_n=k)$の極限を因子ごとに示せ。''', 'C05')

          once('独立な$X_1,\\ldots,X_n\\sim\\operatorname{Poisson}(\\lambda)$とし、$\\widehat\\lambda_n=\\overline X_n$、$g(x)=\\log(1+x)$とする。',
               '''$\\lambda>0$とする。独立な確率変数$X_1,\\ldots,X_n$が
$$
P(X_i=k)=e^{-\\lambda}\\frac{\\lambda^k}{k!},\\qquad k=0,1,2,\\ldots
$$
で与えられるポアソン分布に従い、$E[X_i]=\\operatorname{Var}(X_i)=\\lambda$を用いてよいとする。標本平均と変換を
$$
\\widehat\\lambda_n=\\overline X_n=\\frac1n\\sum_{i=1}^nX_i,\\qquad g(x)=\\log(1+x)
$$
と定義する。''', 'D01')

          once('''$B_n\\sim\\operatorname{Bin}(n,\\lambda/n)$、$\\lambda>0$、$n\\geq\\lceil\\lambda\\rceil$とする。

1. $E[B_n]$, $\\operatorname{Var}(B_n)$と極限を求めよ。（20点）''',
               '''$\\lambda>0$、$n\\geq\\lceil\\lambda\\rceil$とする。$B_n$は
$$
P(B_n=k)=\\binom nk\\left(\\frac\\lambda n\\right)^k\\left(1-\\frac\\lambda n\\right)^{n-k},\\qquad k=0,\\ldots,n
$$
で定まる二項分布に従うとする。また、平均$\\lambda$のポアソン分布の確率質量関数は
$$
q(k)=e^{-\\lambda}\\frac{\\lambda^k}{k!},\\qquad k=0,1,2,\\ldots
$$
である。

1. $E[B_n]$, $\\operatorname{Var}(B_n)$と極限を求めよ。（20点）''', 'drill')

          s = s.replace('P(B_n=k)o e^{-\\lambda}\\frac{\\lambda^k}{k!},', 'P(B_n=k)\\to e^{-\\lambda}\\frac{\\lambda^k}{k!},')
          s = s.replace('後続章でデルタ法として体系的に扱います。本章では「一次Taylor展開とSlutsky型の定理から出る」ことまで確認します。', 'この一次近似とSlutsky型の定理から得られる極限分布を、一次のデルタ法という。')

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook/volumes/02_distributions/P4_02_確率変数の収束_大数則_中心極限定理/index.md
          git diff --cached --quiet && exit 0
          git commit -m 'textbook: make P4-02 exercises self-contained'
          git push
