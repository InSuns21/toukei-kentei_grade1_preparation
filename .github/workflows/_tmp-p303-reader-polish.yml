name: Temporary P3-03 reader exposition polish

on:
  push:
    paths:
      - '.github/workflows/_tmp-p303-reader-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Polish reader-facing exposition
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('textbook/volumes/02_distributions/P3_03_多変量分布_条件付き分布/index.md')
          s = p.read_text()
          s = s.replace('2. P2-02: 分散和と共分散の双線形性を使う。', '2. P2-02: 分散の和と共分散の計算式を使う。')
          s = s.replace('4. P3-02: 一変量正規の標準化とモーメント母関数を使う。', '4. P3-02: 一変量正規分布の平均・分散・標準化を使う。')
          s = s.replace('となります。行列式は新しい公式というより、上の分散・共分散計算をまとめて書いたものです。', 'となります。この行列による表記は新しい考え方というより、上の分散・共分散計算をまとめて書いたものです。')
          s = s.replace('密度を直接使う問題では、$p$変量の場合\n$$', '密度を直接使う問題では、$p$変量の場合、$|\\Sigma|$を$\\Sigma$の行列式として\n$$')
          old = '''共分散を展開すると
$$
\\operatorname{Cov}(R_1,R_2)
=\\rho_{12}-\\rho_{13}\\rho_{23}.
$$
また
$$
\\operatorname{Var}(R_1)=1-\\rho_{13}^2,
\\qquad
\\operatorname{Var}(R_2)=1-\\rho_{23}^2.
$$'''
          new = '''共分散を1項ずつ展開すると
$$
\\begin{aligned}
\\operatorname{Cov}(R_1,R_2)
&=\\operatorname{Cov}(X_1-\\rho_{13}X_3,\,X_2-\\rho_{23}X_3)\\\\
&=\\rho_{12}-\\rho_{23}\\rho_{13}-\\rho_{13}\\rho_{23}
+\\rho_{13}\\rho_{23}\\operatorname{Var}(X_3)\\\\
&=\\rho_{12}-\\rho_{13}\\rho_{23},
\\end{aligned}
$$
です。ここでは標準化済みなので$\\operatorname{Var}(X_3)=1$を使いました。

同様に
$$
\\begin{aligned}
\\operatorname{Var}(R_1)
&=\\operatorname{Var}(X_1-\\rho_{13}X_3)\\\\
&=1+\\rho_{13}^2-2\\rho_{13}^2
=1-\\rho_{13}^2,
\\end{aligned}
$$
$$
\\operatorname{Var}(R_2)=1-\\rho_{23}^2.
$$'''
          if old not in s:
              raise SystemExit('partial-correlation derivation target missing')
          s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Validate polish
        run: |
          npm run validate
          npm run audit:textbook-granularity
          npm run validate:pages
      - name: Commit polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook/volumes/02_distributions/P3_03_多変量分布_条件付き分布/index.md
          git diff --cached --check
          git commit -m 'polish P3-03 reader exposition'
          git push
      - name: Remove temporary workflow
        run: |
          git pull --ff-only
          rm .github/workflows/_tmp-p303-reader-polish.yml
          git add .github/workflows/_tmp-p303-reader-polish.yml
          git commit -m 'remove temporary P3-03 reader polish workflow'
          git push
