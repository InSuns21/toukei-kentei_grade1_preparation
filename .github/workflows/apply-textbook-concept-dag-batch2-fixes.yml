name: Apply textbook concept DAG batch2 fixes

on:
  push:
    branches:
      - audit/textbook-concept-dag-batch2
    paths:
      - .github/workflows/apply-textbook-concept-dag-batch2-fixes.yml

permissions:
  contents: write

jobs:
  apply-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: audit/textbook-concept-dag-batch2
          fetch-depth: 0

      - name: Apply exact content fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1) P2-02 / P3-04: do not name consistency before it is introduced;
          #    the exercises themselves only ask for probability convergence.
          replace_once(
              'textbook/volumes/01_probability/P2_02_期待値_分散_共分散_母関数/index.md',
              '- 目標: 混合モデルのモーメントから推定量の不偏性・分散・一致性へ進む',
              '- 目標: 混合モデルのモーメントから推定量の不偏性・分散・確率収束へ進む',
          )
          replace_once(
              'textbook/volumes/02_distributions/P3_04_混合分布_潜在変数/index.md',
              '周辺化4点、モーメント4点、不偏性・一致性4点、事後予測5点、二母数の分離3点。',
              '周辺化4点、モーメント4点、不偏性・確率収束4点、事後予測5点、二母数の分離3点。',
          )

          # 2) P4-02 actually uses consistency as the estimator-language form of
          #    probability convergence. Make that introduction explicit and formal.
          p4 = 'textbook/volumes/02_distributions/P4_02_確率変数の収束_大数則_中心極限定理/index.md'
          needle = '''「ある$\\varepsilon$で確率が小さい」だけでは足りません。**全ての正の誤差幅**について確率が0へ行く必要があります。\n\n### 2.2 概収束'''
          insert = '''「ある$\\varepsilon$で確率が小さい」だけでは足りません。**全ての正の誤差幅**について確率が0へ行く必要があります。\n\n<a id="def-p4-02-consistency"></a>\n\n<!-- formal-statement-start -->\n> **定義（一致性・一致推定量）**  \n> 母数 $\\theta$ の推定量列 $T_n$ が\n\n$$\nT_n\\xrightarrow{p}\\theta\n$$\n\n> を満たすとき、$T_n$ は $\\theta$ に**一致する**といい、$T_n$ を $\\theta$ の**一致推定量**と呼びます。\n<!-- formal-statement-end -->\n\nつまり一致性は、新しい収束概念ではありません。**確率収束を「推定量が真の母数へ近づく」という統計の言葉に読み替えたもの**です。後続の I1-02 では、不偏性・MSE・効率性と並べて推定量の評価基準として改めて扱います。\n\n### 2.2 概収束'''
          replace_once(p4, needle, insert)

          # Keep chapter metadata synchronized with the new explicit definition.
          p4_yaml = 'textbook/volumes/02_distributions/P4_02_確率変数の収束_大数則_中心極限定理/chapter.yaml'
          replace_once(
              p4_yaml,
              '  - 確率収束・概収束・分布収束を量化記号を含めて定義し関係を説明できる\n',
              '  - 確率収束・概収束・分布収束を量化記号を含めて定義し関係を説明できる\n  - 一致性を「推定量が真の母数へ確率収束すること」として説明できる\n',
          )
          replace_once(
              p4_yaml,
              '  - {id: P4T-DEF-03, name: 確率Cauchy列}\n',
              '  - {id: P4T-DEF-03, name: 確率Cauchy列}\n  - {id: P4T-DEF-04, name: 一致性・一致推定量}\n',
          )

          # 3) Genuine previews: declare them as forward references rather than
          #    pretending the later concept is already a prerequisite.
          p3_yaml = 'textbook/volumes/02_distributions/P3_01_主要な離散分布/chapter.yaml'
          replace_once(
              p3_yaml,
              'prerequisites: [P2-02]\n',
              'prerequisites: [P2-02]\nforward_references:\n  - consistency\n',
          )

          s1_yaml = 'textbook/volumes/03_inference/S1_02_統計量_十分性_分解定理/chapter.yaml'
          replace_once(
              s1_yaml,
              '  - P2-02\nofficial_scope:',
              '  - P2-02\nforward_references:\n  - consistency\nofficial_scope:',
          )
          replace_once(
              'textbook/volumes/03_inference/S1_02_統計量_十分性_分解定理/index.md',
              '一致性は標本数を増やしたときの収束の性質です。',
              '後続の I1-02 で正式に定義する**一致性**は、標本数を増やしたとき推定量が真値へ確率収束する性質です。',
          )

          i101_yaml = 'textbook/volumes/03_inference/I1_01_尤度_最尤推定/chapter.yaml'
          replace_once(
              i101_yaml,
              '  - score-test\nofficial_scope:',
              '  - score-test\n  - consistency\n  - expectation-maximization\nofficial_scope:',
          )

          i102_yaml = 'textbook/volumes/03_inference/I1_02_推定法と推定量の評価/chapter.yaml'
          replace_once(
              i102_yaml,
              '  - P4-02\nofficial_scope:',
              '  - P4-02\nforward_references:\n  - mle-asymptotic-normality\nofficial_scope:',
          )

          i201_yaml = 'textbook/volumes/03_inference/I2_01_漸近推測_Delta法/chapter.yaml'
          p = Path(i201_yaml)
          text = p.read_text(encoding='utf-8')
          if 'forward_references:' in text:
              raise SystemExit(f'{i201_yaml}: forward_references already exists; inspect before editing')
          marker = 'official_scope:'
          if text.count(marker) != 1:
              raise SystemExit(f'{i201_yaml}: expected one official_scope marker')
          text = text.replace(marker, 'forward_references:\n  - wald-test\n' + marker, 1)
          p.write_text(text, encoding='utf-8')

          # 4) The first explicit introduction of consistency is now P4-02;
          #    I1-02 remains a second self-contained introduction in estimator evaluation.
          kd = 'textbook/knowledge-dag.yaml'
          replace_once(
              kd,
              '''  - id: consistency\n    name: 一致性\n    aliases:\n      - 一致推定量\n      - consistency\n      - consistent estimator\n    introduced_in: I1-02''',
              '''  - id: consistency\n    name: 一致性\n    aliases:\n      - 一致推定量\n      - consistency\n      - consistent estimator\n    introduced_in: [P4-02, I1-02]''',
          )
          PY

      - name: Commit generated fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook
          git diff --cached --check
          git commit -m 'Resolve concept DAG batch2 findings'
          git push origin HEAD:audit/textbook-concept-dag-batch2
