name: Temporary F0-00P6 bounded Lipschitz alias fix

on:
  push:
    branches:
      - fix/f0-00p6-bounded-lipschitz-definition

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/f0-00p6-bounded-lipschitz-definition
      - run: python scripts/tmp-f0p6-bl-alias-fix.py
      - name: Commit alias-safe wording
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook/volumes/00_foundations/F0_00P6_特性関数_中心極限定理/index.md
          git diff --cached --check
          git commit -m 'fix: avoid ambiguous Lipschitz condition alias'
          git push origin HEAD:fix/f0-00p6-bounded-lipschitz-definition
