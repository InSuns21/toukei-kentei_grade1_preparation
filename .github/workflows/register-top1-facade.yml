name: One-shot TOP1 facade registration

on:
  push:
    branches:
      - feature/dream-theater-topology-core

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/register-top1-facade.mjs
