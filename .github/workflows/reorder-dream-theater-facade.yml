name: Reorder DREAM THEATER facade

on:
  push:
    branches:
      - feat/f0-batch2-lebesgue-integration-foundations
    paths:
      - 'scripts/reorder-dream-theater-facade.mjs'
      - '.github/workflows/reorder-dream-theater-facade.yml'

permissions:
  contents: write

jobs:
  reorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/f0-batch2-lebesgue-integration-foundations
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/reorder-dream-theater-facade.mjs
      - name: Commit facade reorder
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook/dream-theater.md
          git diff --cached --quiet && exit 0
          git commit -m 'docs: keep DREAM THEATER table of contents first'
          git push
