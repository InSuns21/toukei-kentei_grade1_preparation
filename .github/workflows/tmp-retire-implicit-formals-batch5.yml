name: Temporary implicit formal retirement batch 5

on:
  push:
    branches:
      - refactor/retire-implicit-formals-batch5
    paths:
      - 'scripts/tmp-retire-implicit-formals-batch5.mjs'
      - '.github/workflows/tmp-retire-implicit-formals-batch5.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/retire-implicit-formals-batch5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/tmp-retire-implicit-formals-batch5.mjs
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/implicit-formal-baseline.txt textbook/volumes
          git commit -m 'formalize foundational and probability definitions'
          git push
      - run: npm ci
      - run: npm run validate
      - run: npm run validate:pages
