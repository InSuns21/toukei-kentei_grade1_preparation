name: Temporary complex analysis scaffold fix

on:
  push:
    branches: [codex/complex-analysis-core-scaffold]
    paths: ['.github/workflows/tmp-complex-analysis-scaffold-fix.yml']

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/complex-analysis-core-scaffold
      - name: Reuse scaffold generator
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/tmp-complex-analysis-scaffold.yml').read_text(encoding='utf-8')
          start = text.index("          python - <<'PY'\n") + len("          python - <<'PY'\n")
          end = text.index("\n          PY\n", start)
          lines = text[start:end].splitlines()
          src = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)
          exec(compile(src, '<scaffold-generator>', 'exec'))
          PY
      - name: Normalize curriculum YAML
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('textbook/dream-theater-standard-math-core.yaml')
          s = p.read_text(encoding='utf-8')
          ca = '''  - id: CA1
            title: 複素微分・Cauchy–Riemann・初等正則関数
            area: complex-analysis
            tier: core
            status: planned
            prerequisites: [RA3, RA5, LA1]
          - id: CA2
            title: 複素線積分・原始関数・Cauchy–Goursat
            area: complex-analysis
            tier: core
            status: planned
            prerequisites: [CA1, RA4, TOP3]
          - id: CA3
            title: Cauchy積分公式・Taylor展開・Liouville・最大値原理
            area: complex-analysis
            tier: core
            status: planned
            prerequisites: [CA2]
          - id: CA4
            title: Laurent展開・孤立特異点・留数定理
            area: complex-analysis
            tier: core
            status: planned
            prerequisites: [CA3]
          - id: CA5
            title: 偏角原理・Rouché・解析接続
            area: complex-analysis
            tier: core-advanced-standard
            status: planned
            prerequisites: [CA4, TOP3]
          - id: CA6
            title: Möbius変換・Schwarz補題・調和関数・Poisson核
            area: complex-analysis
            tier: advanced-standard-bridge
            status: planned
            prerequisites: [CA5]
          '''
          ca = '\n'.join(line[10:] if line.startswith('          ') else line for line in ca.splitlines()) + '\n'
          s, n = re.subn(r'(?ms)^- id: CA1\n.*?(?=^  - id: FA5\n)', ca, s, count=1)
          if n != 1:
              raise SystemExit('generated CA block not found')
          batches = '''  - order: 5
            id: functional-analysis-foundation
            nodes: [FA1, FA2, FA3, FA4]
          - order: 6
            id: complex-analysis-core
            nodes: [CA1, CA2, CA3, CA4, CA5, CA6]
          - order: 7
            id: functional-analysis-spectral
            nodes: [FA5, FA6, FA7]
          - order: 8
            id: real-analysis-multivariable-and-compactness
            nodes: [RA6, RA7, RA8]
          '''
          batches = '\n'.join(line[10:] if line.startswith('          ') else line for line in batches.splitlines())
          s, n = re.subn(r'(?ms)^  - order: 5\n.*?nodes: \[RA6, RA7, RA8\]', batches, s, count=1)
          if n != 1:
              raise SystemExit('generated batch block not found')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate scaffold
        run: |
          npm ci
          npm run validate:dream-theater-standard-math-core
      - name: Commit scaffold
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add textbook/dream-theater-standard-math-core.yaml textbook/dream-theater-standard-math-core.md textbook/volumes/00_foundations/CA1 textbook/volumes/00_foundations/CA2 textbook/volumes/00_foundations/CA3 textbook/volumes/00_foundations/CA4 textbook/volumes/00_foundations/CA5 textbook/volumes/00_foundations/CA6
          git diff --cached --quiet || git commit -m "feat: scaffold standard complex analysis core"
          git push
