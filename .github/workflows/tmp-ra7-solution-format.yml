name: Temporary RA7 solution format cleanup

on:
  push:
    branches:
      - cleanup/ra7-detailed-solutions-only-20260912

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[ra7-format-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/ra7-detailed-solutions-only-20260912
          fetch-depth: 0
      - name: Keep detailed solutions only
        run: |
          python .github/tmp-ra7-solution-format.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook/volumes/00_foundations/RA7/index.md
          git diff --cached --quiet && exit 0
          git commit -m '[ra7-format-cleanup] keep detailed solutions only'
          git push
