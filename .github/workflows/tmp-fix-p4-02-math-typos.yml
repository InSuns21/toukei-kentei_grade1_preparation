name: One-off P4-02 math typo sweep

on:
  push:
    branches:
      - fix/p4-02-residual-math-typos

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix residual convergence typo
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('textbook/volumes/02_distributions/P4_02_確率変数の収束_大数則_中心極限定理/index.md')
          text = path.read_text(encoding='utf-8')
          old = r'P(B_n=k)o e^{-\lambda}\frac{\lambda^k}{k!},'
          new = r'P(B_n=k)\to e^{-\lambda}\frac{\lambda^k}{k!},'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one target typo, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Scan page for similar lost-backslash residues
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('textbook/volumes/02_distributions/P4_02_確率変数の収束_大数則_中心極限定理/index.md')
          text = path.read_text(encoding='utf-8')

          # Extract display and inline math, then look for common LaTeX commands
          # accidentally left bare, plus the observed "\\to -> o" failure shape.
          math_parts = []
          for m in re.finditer(r'\$\$(.*?)\$\$|(?<!\$)\$(?!\$)(.*?)(?<!\\)\$', text, re.S):
              math_parts.append(m.group(1) if m.group(1) is not None else m.group(2))
          math = '\n'.join(math_parts)

          suspicious = []
          patterns = {
              'lost \\to prefix': re.compile(r'(?<![A-Za-z\\])o(?=(?:0|1|\s*e\^|\s*\\(?:lambda|mu|sigma|infty|operatorname)|\s*N\(|_[A-Za-z]))'),
              'bare LaTeX command': re.compile(r'(?<!\\)\b(?:to|frac|sqrt|lambda|sigma|varepsilon|approx|Phi|operatorname|binom|prod|sum|infty|xrightarrow)\b'),
              'truncated LaTeX command': re.compile(r'(?<![A-Za-z\\])(?:rac|qrt|ambda|igma|arepsilon|pprox|peratorname|inom|nfty)\b'),
          }
          for label, pat in patterns.items():
              for m in pat.finditer(math):
                  snippet = math[max(0, m.start()-35):m.end()+45].replace('\n', ' ')
                  suspicious.append((label, snippet))

          if suspicious:
              for label, snippet in suspicious:
                  print(f'{label}: {snippet}')
              raise SystemExit(f'suspicious math residues: {len(suspicious)}')
          print('No similar lost-backslash residues found in P4-02.')
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate textbook math
        run: npm run validate:math

      - name: Remove one-off workflow and commit fix
        shell: bash
        run: |
          rm .github/workflows/tmp-fix-p4-02-math-typos.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook/volumes/02_distributions/P4_02_確率変数の収束_大数則_中心極限定理/index.md .github/workflows/tmp-fix-p4-02-math-typos.yml
          git commit -m 'fix: P4-02 のポアソン極限の収束記号を修正'
          git push
