name: Temporary F0-00 reader review

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_tmp_review_f000.yml'

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply final F0-00 cleanup
        run: python3 scripts/_tmp_review_f000.py
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add textbook/volumes/00_foundations/F0_00_統計検定1級のための数学速習/index.md
          git add textbook/volumes/00_foundations/F0_00_統計検定1級のための数学速習/review/validation.md
          git diff --cached --quiet && exit 0
          git commit -m 'textbook: finish F0-00 reader review cleanup'
          git push origin main
