<svg xmlns="http://www.w3.org/2000/svg" width="820" height="390" viewBox="0 0 820 390" role="img" aria-labelledby="title desc">
  <title id="title">工程能力問題の規格と工程分布</title>
  <desc id="desc">規格下限95、工程平均101、規格上限105の位置関係を示す。正規型の工程分布は平均101を中心とし、上側規格限界の方が平均に近い。</desc>
  <rect width="820" height="390" fill="white"/>
  <text x="45" y="34" font-size="20" font-weight="bold">規格幅と工程分布の位置関係</text>
  <line x1="90" y1="300" x2="750" y2="300" stroke="#222" stroke-width="2"/>
  <line x1="185" y1="80" x2="185" y2="330" stroke="#555" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="650" y1="80" x2="650" y2="330" stroke="#555" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="510" y1="92" x2="510" y2="330" stroke="#777" stroke-width="1.5"/>
  <path d="M320 300 C365 300 405 135 510 135 C615 135 655 300 700 300" fill="none" stroke="#222" stroke-width="3"/>
  <text x="155" y="355" font-size="16">LSL=95</text>
  <text x="482" y="355" font-size="16">μ=101</text>
  <text x="620" y="355" font-size="16">USL=105</text>
  <line x1="510" y1="70" x2="650" y2="70" stroke="#222" stroke-width="2"/>
  <path d="M510 70 l11 -6 v12 z M650 70 l-11 -6 v12 z" fill="#222"/>
  <text x="535" y="58" font-size="15">近い側は上側規格</text>
  <text x="210" y="96" font-size="15">Cp は規格幅と 6σ の比較、Cpk は中心ずれも反映する</text>
</svg>