<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">回帰診断の概念図</title>
  <desc id="desc">回帰直線と通常観測、診断対象の点A、B、Cを示す。AとCには回帰直線までの鉛直距離を破線で示す。</desc>
  <rect x="0" y="0" width="760" height="430" fill="white"/>
  <line x1="75" y1="365" x2="710" y2="365" stroke="#222" stroke-width="2"/>
  <line x1="75" y1="365" x2="75" y2="45" stroke="#222" stroke-width="2"/>
  <text x="690" y="398" font-size="16">x</text>
  <text x="45" y="58" font-size="16">y</text>

  <line x1="105" y1="330" x2="690" y2="90" stroke="#222" stroke-width="2.5"/>
  <text x="490" y="125" font-size="15">回帰直線</text>

  <g fill="#444">
    <circle cx="150" cy="306" r="5"/><circle cx="190" cy="286" r="5"/>
    <circle cx="225" cy="280" r="5"/><circle cx="255" cy="255" r="5"/>
    <circle cx="285" cy="250" r="5"/><circle cx="320" cy="225" r="5"/>
    <circle cx="350" cy="232" r="5"/><circle cx="385" cy="208" r="5"/>
    <circle cx="420" cy="195" r="5"/><circle cx="455" cy="178" r="5"/>
  </g>

  <line x1="335" y1="236" x2="335" y2="92" stroke="#555" stroke-dasharray="6 5" stroke-width="1.5"/>
  <circle cx="335" cy="92" r="8" fill="white" stroke="#222" stroke-width="2.5"/>
  <text x="349" y="88" font-size="18" font-weight="bold">A</text>

  <circle cx="655" cy="104" r="8" fill="white" stroke="#222" stroke-width="2.5"/>
  <text x="669" y="101" font-size="18" font-weight="bold">B</text>

  <line x1="655" y1="104" x2="655" y2="292" stroke="#555" stroke-dasharray="6 5" stroke-width="1.5"/>
  <circle cx="655" cy="292" r="8" fill="white" stroke="#222" stroke-width="2.5"/>
  <text x="669" y="288" font-size="18" font-weight="bold">C</text>

  <text x="96" y="28" font-size="18" font-weight="bold">回帰診断：残差の大きさと説明変数空間での位置を分けて読む</text>
</svg>