<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">サポートベクターマシンの最大マージン概念図</title>
  <desc id="desc">二次元の二クラスデータ、決定境界、左右のマージン境界、マージン上のsupport vectorを示す。</desc>
  <rect x="0" y="0" width="760" height="430" fill="white"/>
  <line x1="70" y1="365" x2="710" y2="365" stroke="#222" stroke-width="2"/>
  <line x1="70" y1="365" x2="70" y2="45" stroke="#222" stroke-width="2"/>
  <text x="690" y="398" font-size="16">x1</text>
  <text x="42" y="58" font-size="16">x2</text>

  <line x1="380" y1="55" x2="380" y2="350" stroke="#222" stroke-width="3"/>
  <line x1="300" y1="55" x2="300" y2="350" stroke="#555" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="460" y1="55" x2="460" y2="350" stroke="#555" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="389" y="82" font-size="15">decision boundary</text>
  <text x="225" y="82" font-size="15">margin -1</text>
  <text x="470" y="82" font-size="15">margin +1</text>

  <g fill="white" stroke="#222" stroke-width="2.5">
    <circle cx="170" cy="150" r="8"/><circle cx="205" cy="235" r="8"/><circle cx="240" cy="305" r="8"/>
    <circle cx="300" cy="190" r="8"/>
  </g>
  <g stroke="#222" stroke-width="2.5">
    <line x1="155" y1="135" x2="185" y2="165"/><line x1="185" y1="135" x2="155" y2="165"/>
    <line x1="190" y1="220" x2="220" y2="250"/><line x1="220" y1="220" x2="190" y2="250"/>
    <line x1="225" y1="290" x2="255" y2="320"/><line x1="255" y1="290" x2="225" y2="320"/>
    <line x1="285" y1="175" x2="315" y2="205"/><line x1="315" y1="175" x2="285" y2="205"/>
  </g>

  <g fill="#222">
    <circle cx="520" cy="135" r="8"/><circle cx="555" cy="220" r="8"/><circle cx="605" cy="300" r="8"/><circle cx="460" cy="255" r="8"/>
  </g>

  <circle cx="300" cy="190" r="15" fill="none" stroke="#222" stroke-width="2"/>
  <circle cx="460" cy="255" r="15" fill="none" stroke="#222" stroke-width="2"/>
  <text x="245" y="215" font-size="14">support vector</text>
  <text x="470" y="280" font-size="14">support vector</text>

  <line x1="305" y1="335" x2="455" y2="335" stroke="#222" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
  </defs>
  <text x="345" y="327" font-size="14">margin width</text>
  <text x="95" y="28" font-size="18" font-weight="bold">Maximum-margin separation: nearest points determine the boundary</text>
</svg>