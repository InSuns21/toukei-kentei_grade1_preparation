<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470" role="img" aria-labelledby="title desc">
  <title id="title">Xbar-R管理図の新しい群の判定</title>
  <desc id="desc">上段のXbar管理図では新群の平均10.55が上方管理限界10.4616を超える。下段のR管理図では新群の範囲0.90が0から1.6912の管理限界内にある。</desc>
  <rect width="820" height="470" fill="white"/>
  <text x="45" y="34" font-size="20" font-weight="bold">新群は「ばらつきは管理内、平均は管理外」</text>
  <text x="55" y="80" font-size="17" font-weight="bold">X̄ 管理図</text>
  <line x1="155" y1="105" x2="720" y2="105" stroke="#555" stroke-width="2" stroke-dasharray="8 6"/><text x="725" y="110" font-size="14">UCL 10.4616</text>
  <line x1="155" y1="160" x2="720" y2="160" stroke="#222" stroke-width="2"/><text x="725" y="165" font-size="14">CL 10.0</text>
  <line x1="155" y1="215" x2="720" y2="215" stroke="#555" stroke-width="2" stroke-dasharray="8 6"/><text x="725" y="220" font-size="14">LCL 9.5384</text>
  <circle cx="585" cy="82" r="8" fill="#222"/><text x="500" y="70" font-size="15">新群 X̄=10.55</text>
  <text x="55" y="285" font-size="17" font-weight="bold">R 管理図</text>
  <line x1="155" y1="310" x2="720" y2="310" stroke="#555" stroke-width="2" stroke-dasharray="8 6"/><text x="725" y="315" font-size="14">UCL 1.6912</text>
  <line x1="155" y1="370" x2="720" y2="370" stroke="#222" stroke-width="2"/><text x="725" y="375" font-size="14">CL 0.8</text>
  <line x1="155" y1="430" x2="720" y2="430" stroke="#555" stroke-width="2" stroke-dasharray="8 6"/><text x="725" y="435" font-size="14">LCL 0</text>
  <circle cx="585" cy="363" r="8" fill="white" stroke="#222" stroke-width="2.5"/><text x="500" y="350" font-size="15">新群 R=0.90</text>
</svg>