<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="統計検定1級 統計数理・統計応用（理工学）の演習教材" />
  <title>統計検定1級 対策教材</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <style>
    :root { --theme-color: #2f6f9f; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif; }
    .markdown-section { max-width: 980px; }
    .markdown-section table { display: table; width: 100%; }
    .markdown-section pre { overflow-x: auto; }
    .katex-display { overflow-x: auto; overflow-y: hidden; padding: 0.25rem 0; }
    .toukei-math-display { display: block; }
    .sidebar-nav li { line-height: 1.45; }
  </style>
</head>
<body>
  <div id="app">教材を読み込んでいます...</div>
  <script src="math-renderer.js"></script>
  <script>
    // If an explicit cross-link forced a full reload, remove the temporary
    // query marker while preserving the destination hash before Docsify starts.
    if (new URLSearchParams(window.location.search).has('__docsify_route')) {
      window.history.replaceState(null, '', window.location.pathname + window.location.hash);
    }

    // A few explanatory cross-links are authored as complete `#/...` Docsify
    // routes. In some browsers Docsify's delegated click handler interprets
    // those as same-page anchors and the page does not change. For these links
    // only, bypass the SPA click path entirely and perform a one-shot full-page
    // navigation. A temporary query marker guarantees an actual document load;
    // it is removed immediately above on the destination page.
    function explicitHashRoutePlugin(hook) {
      hook.doneEach(function () {
        document.querySelectorAll('.markdown-section a[href^="#/"]').forEach(function (link) {
          const route = link.getAttribute('href');
          if (!route) return;

          link.setAttribute('data-no-router', '');
          link.addEventListener('click', function (event) {
            event.preventDefault();
            event.stopImmediatePropagation();

            const destination = new URL(window.location.pathname, window.location.origin);
            destination.searchParams.set('__docsify_route', route.slice(2));
            destination.hash = route;
            window.location.assign(destination.href);
          }, true);
        });
      });
    }

    window.$docsify = {
      name: '統計検定1級 対策教材',
      repo: 'InSuns21/toukei-kentei_grade1_preparation',
      homepage: 'home.md',
      loadSidebar: true,
      relativePath: false,
      auto2top: true,
      subMaxLevel: 2,
      search: {
        placeholder: '教材を検索',
        noData: '該当する教材が見つかりません',
        depth: 6
      },
      plugins: [window.ToukeiMathRenderer.docsifyPlugin, explicitHashRoutePlugin]
    };
  </script>
  <!--
    Protect TeX in raw Markdown before Docsify parses it, then render the
    protected placeholders with KaTeX after each route is mounted. This avoids
    Markdown consuming matrix row separators (\\) and other TeX backslashes.
  -->
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
</body>
</html>
