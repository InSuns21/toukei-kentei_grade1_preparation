<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="統計検定1級 統計数理・統計応用（理工学）の演習教材" />
  <title>統計検定1級 対策教材</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <style>
    :root { --theme-color: #2f6f9f; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif; }
    .markdown-section { max-width: 980px; }
    .markdown-section table { display: table; width: 100%; }
    .markdown-section pre { overflow-x: auto; }
    .katex-display { overflow-x: auto; overflow-y: hidden; padding: 0.25rem 0; }
    .toukei-math-display { display: block; }
    .sidebar-nav li { line-height: 1.45; }
    .solution-details { margin: 0.8rem 0 1.4rem; border: 1px solid #d8dee4; border-radius: 6px; padding: 0.15rem 0.8rem 0.7rem; }
    .solution-details summary { cursor: pointer; font-weight: 600; padding: 0.65rem 0; }
    .solution-details .solution-body > :first-child { margin-top: 0.4rem; }
  </style>
</head>
<body>
  <div id="app">教材を読み込んでいます...</div>
  <script src="math-renderer.js"></script>
  <script>
    function solutionDetailsPlugin(hook) {
      hook.afterEach(function (html) {
        return html.replace(
          /<!-- solution-start -->([\s\S]*?)<!-- solution-end -->/g,
          '<details class="solution-details"><summary>解答を表示</summary><div class="solution-body">$1</div></details>'
        );
      });
    }

    window.$docsify = {
      name: '統計検定1級 対策教材',
      repo: 'InSuns21/toukei-kentei_grade1_preparation',
      homepage: 'home.md',
      loadSidebar: true,
      relativePath: false,
      auto2top: true,
      subMaxLevel: 2,
      search: {
        placeholder: '教材を検索',
        noData: '該当する教材が見つかりません',
        depth: 6
      },
      plugins: [window.ToukeiMathRenderer.docsifyPlugin, solutionDetailsPlugin]
    };
  </script>
  <!--
    Protect TeX in raw Markdown before Docsify parses it, then render the
    protected placeholders with KaTeX after each route is mounted. This avoids
    Markdown consuming matrix row separators (\\) and other TeX backslashes.
  -->
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
</body>
</html>
