<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="統計検定1級 統計数理・統計応用（理工学）の演習教材" />
  <title>統計検定1級 対策教材</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <link rel="stylesheet" href="numerical-lab.css" />
  <style>
    :root { --theme-color: #2f6f9f; --formal-statement-rule: #2f6f9f; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif; }
    .markdown-section { max-width: 980px; }
    .markdown-section table { display: table; width: 100%; }
    .markdown-section pre { overflow-x: auto; }
    .katex-display { overflow-x: auto; overflow-y: hidden; padding: 0.25rem 0; }
    .toukei-math-display { display: block; }
    .formal-statement { margin: 1rem 0 1.4rem; border-left: 5px solid var(--formal-statement-rule); padding: 0.12rem 0 0.12rem 1.3rem; }
    .formal-statement > blockquote { margin: 0; padding: 0; border-left: 0; color: inherit; }
    .formal-statement > h2, .formal-statement > h3, .formal-statement > h4, .formal-statement > h5, .formal-statement > h6 { margin: 0.1rem 0 0.55rem; font-size: 1rem; line-height: 1.55; font-weight: 700; }
    .formal-statement > :first-child, .formal-statement > blockquote > :first-child { margin-top: 0; }
    .formal-statement > :last-child, .formal-statement > blockquote > :last-child { margin-bottom: 0; }
    .sidebar-nav li { line-height: 1.45; }
    .sidebar-nav a.route-pending-active { color: var(--theme-color); font-weight: 600; }
    body.navigation-pending:not(.dream-theater-route) .sidebar-nav a.active:not(.route-pending-active) { color: inherit; font-weight: 400; }
    .sidebar-nav li.sidebar-foldable { position: relative; }
    .sidebar-nav li.sidebar-foldable > ul { display: none; }
    .sidebar-nav li.sidebar-foldable.sidebar-fold-open > ul { display: block; }
    .sidebar-fold-toggle {
      position: absolute;
      top: 0.08rem;
      left: -1.15rem;
      width: 1rem;
      height: 1.45rem;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      line-height: 1.45rem;
      cursor: pointer;
      opacity: 0.72;
    }
    .sidebar-fold-toggle::before { content: '▸'; display: inline-block; transition: transform 0.12s ease; }
    .sidebar-foldable.sidebar-fold-open > .sidebar-fold-toggle::before { transform: rotate(90deg); }
    .sidebar-fold-toggle:hover, .sidebar-fold-toggle:focus-visible { opacity: 1; }
    .dream-theater-sidebar-nav { display: none; padding: 0 0.9rem 1.5rem; font-size: 14px; }
    body.dream-theater-route .sidebar-nav { display: none; }
    body.dream-theater-route .dream-theater-sidebar-nav { display: block; }
    .dream-theater-sidebar-brand { margin: 0.25rem 0 0.8rem; padding: 0 0.35rem 0.8rem; border-bottom: 1px solid #e5e7eb; }
    .dream-theater-sidebar-brand strong { display: block; margin: 0.15rem 0 0.55rem; letter-spacing: 0.08em; }
    .dream-theater-back-home { display: block; margin-bottom: 0.75rem; font-weight: 600; }
    .dream-theater-sidebar-nav a { color: inherit; text-decoration: none; }
    .dream-theater-sidebar-nav ul { list-style: none; margin: 0.25rem 0 0.55rem; padding-left: 0.9rem; }
    .dream-theater-sidebar-nav li { margin: 0.16rem 0; }
    .dream-theater-sidebar-nav a[data-dream-route] { display: block; padding: 0.13rem 0.35rem; border-left: 2px solid transparent; line-height: 1.42; }
    .dream-theater-sidebar-nav a[data-dream-route].active { color: var(--theme-color); border-left-color: var(--theme-color); font-weight: 700; }
    .dream-theater-sidebar-primary { padding-left: 0 !important; }
    .dream-theater-nav-section, .dream-theater-nav-subsection { margin: 0.35rem 0; }
    .dream-theater-nav-section > summary, .dream-theater-nav-subsection > summary { cursor: pointer; line-height: 1.45; }
    .dream-theater-nav-section > summary { font-weight: 700; }
    .dream-theater-nav-subsection > summary { padding-left: 0.35rem; font-weight: 600; }
    .solution-details { margin: 0.8rem 0 1.4rem; border: 1px solid #d8dee4; border-radius: 6px; padding: 0.15rem 0.8rem 0.7rem; }
    .solution-details summary { cursor: pointer; font-weight: 600; padding: 0.65rem 0; }
    .solution-details .solution-body > :first-child { margin-top: 0.4rem; }
    .offline-cache-card { margin: 1.25rem 0 1.5rem; padding: 1rem 1.1rem; border: 1px solid #d8dee4; border-radius: 8px; background: #f6f8fa; }
    .offline-cache-card p { margin: 0.45rem 0 0.8rem; }
    .offline-cache-meta { margin: 0.8rem 0 1rem; }
    .offline-cache-meta > div { display: grid; grid-template-columns: minmax(8.5rem, 11rem) 1fr; gap: 0.5rem; padding: 0.2rem 0; }
    .offline-cache-meta dt { font-weight: 600; }
    .offline-cache-meta dd { margin: 0; }
    .offline-cache-button { border: 0; border-radius: 6px; padding: 0.55rem 0.9rem; background: var(--theme-color); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    .offline-cache-button:disabled { opacity: 0.65; cursor: wait; }
    .offline-cache-status { display: inline-block; margin-left: 0.75rem; font-size: 0.95rem; }
    .offline-cache-freshness { margin-bottom: 0 !important; font-size: 0.92rem; }
    @media (max-width: 560px) {
      .offline-cache-meta > div { grid-template-columns: 1fr; gap: 0.05rem; }
      .offline-cache-status { display: block; margin: 0.6rem 0 0; }
    }
  </style>
</head>
<body>
  <div id="app">教材を読み込んでいます...</div>
  <script>
    var OFFLINE_CACHE_STATE_KEY = 'toukei-grade1-offline-cache-state-v1';
    var currentSiteMeta = null;

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./service-worker.js', {
          scope: './',
          // Check the worker and imported strategy config from the network.
          // Normal page/content freshness is handled by network-first caching.
          updateViaCache: 'none'
        }).catch(function (error) {
          console.warn('Service Worker registration failed:', error);
        });
      });
    }

    function readOfflineCacheState() {
      try {
        var raw = localStorage.getItem(OFFLINE_CACHE_STATE_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (error) {
        console.warn('Offline cache state could not be read:', error);
        return null;
      }
    }

    function writeOfflineCacheState(state) {
      try {
        localStorage.setItem(OFFLINE_CACHE_STATE_KEY, JSON.stringify(state));
        return true;
      } catch (error) {
        console.warn('Offline cache state could not be saved:', error);
        return false;
      }
    }

    function formatLocalDate(value) {
      if (!value) return '—';
      var date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      try {
        return new Intl.DateTimeFormat('ja-JP', {
          year: 'numeric', month: '2-digit', day: '2-digit',
          hour: '2-digit', minute: '2-digit', second: '2-digit'
        }).format(date);
      } catch {
        return date.toLocaleString('ja-JP');
      }
    }

    function shortRevision(value) {
      return value ? String(value).slice(0, 8) : '';
    }

    function setOfflineText(id, text) {
      var element = document.getElementById(id);
      if (element) element.textContent = text;
    }

    function sameSavedRevision(saved, siteMeta) {
      if (!saved || !siteMeta) return false;
      if (saved.siteRevision && siteMeta.revision) {
        return saved.siteRevision === siteMeta.revision;
      }
      return Boolean(saved.siteUpdatedAt && siteMeta.updatedAt && saved.siteUpdatedAt === siteMeta.updatedAt);
    }

    function renderOfflineCacheMetadata() {
      var saved = readOfflineCacheState();
      var siteUpdatedAt = currentSiteMeta && currentSiteMeta.updatedAt
        ? currentSiteMeta.updatedAt
        : saved && saved.siteUpdatedAt;
      var revision = currentSiteMeta && currentSiteMeta.revision
        ? currentSiteMeta.revision
        : saved && saved.siteRevision;
      var siteLabel = siteUpdatedAt ? formatLocalDate(siteUpdatedAt) : '確認できません';
      if (revision) siteLabel += '（' + shortRevision(revision) + '）';
      setOfflineText('site-updated-at', siteLabel);

      if (!saved || !saved.savedAt) {
        setOfflineText('offline-cache-state', '未保存');
        setOfflineText('offline-cache-saved-at', '—');
        setOfflineText('offline-cache-freshness', navigator.onLine
          ? '必要なときに「教材をオフライン保存」を実行してください。'
          : '現在オフラインです。事前にオンライン環境で教材を保存する必要があります。');
        var firstButton = document.getElementById('cache-all-materials');
        if (firstButton) firstButton.textContent = '教材をオフライン保存';
        return;
      }

      setOfflineText('offline-cache-saved-at', formatLocalDate(saved.savedAt));
      var button = document.getElementById('cache-all-materials');
      if (button) button.textContent = '教材を再保存（更新）';

      if (!navigator.onLine) {
        setOfflineText('offline-cache-state', '保存済み（オフライン）');
        setOfflineText('offline-cache-freshness', '現在はオフラインのため、新しい教材更新があるかは確認できません。オンライン復帰時に自動確認します。');
        return;
      }

      if (!currentSiteMeta) {
        setOfflineText('offline-cache-state', '保存済み（更新確認待ち）');
        setOfflineText('offline-cache-freshness', '教材サイトの現行版を確認できていません。接続状態を確認してください。');
        return;
      }

      if (sameSavedRevision(saved, currentSiteMeta)) {
        setOfflineText('offline-cache-state', '保存済み・最新');
        setOfflineText('offline-cache-freshness', '保存した教材は現在の教材サイトと同じ版です。');
      } else {
        setOfflineText('offline-cache-state', '保存済み・サイト更新あり');
        setOfflineText('offline-cache-freshness', 'オフライン保存後に教材サイトが更新されています。「教材を再保存（更新）」を推奨します。');
      }
    }

    function refreshSiteMeta() {
      return fetch('./site-meta.json', { cache: 'no-store' })
        .then(function (response) {
          if (!response.ok) throw new Error('HTTP ' + response.status);
          return response.json();
        })
        .then(function (meta) {
          currentSiteMeta = meta;
          renderOfflineCacheMetadata();
          return meta;
        })
        .catch(function (error) {
          console.warn('Site metadata could not be refreshed:', error);
          currentSiteMeta = null;
          renderOfflineCacheMetadata();
          return null;
        });
    }

    function updateOfflineCacheUi(text, disabled) {
      var status = document.getElementById('offline-cache-status');
      var button = document.getElementById('cache-all-materials');
      if (status) status.textContent = text || '';
      if (button && typeof disabled === 'boolean') button.disabled = disabled;
    }

    document.addEventListener('click', function (event) {
      var button = event.target.closest && event.target.closest('#cache-all-materials');
      if (!button) return;

      if (!('serviceWorker' in navigator)) {
        updateOfflineCacheUi('このブラウザではオフライン保存を利用できません。', false);
        return;
      }

      updateOfflineCacheUi('保存済み教材を確認しています…', true);
      navigator.serviceWorker.ready.then(function (registration) {
        var worker = navigator.serviceWorker.controller || registration.active || registration.waiting;
        if (!worker) throw new Error('active service worker not found');
        worker.postMessage({ type: 'CACHE_PUBLISHED_FILES' });
      }).catch(function (error) {
        console.warn('Offline cache request failed:', error);
        updateOfflineCacheUi('保存を開始できませんでした。オンライン接続を確認してください。', false);
      });
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('message', function (event) {
        var data = event.data || {};
        if (data.type === 'CACHE_CHECKING') {
          updateOfflineCacheUi(data.total
            ? data.completed + ' / ' + data.total + ' ファイルを確認中…'
            : '保存済み教材を確認しています…', true);
        } else if (data.type === 'CACHE_CHECK_PROGRESS') {
          updateOfflineCacheUi(data.completed + ' / ' + data.total + ' ファイルを確認中…', true);
        } else if (data.type === 'CACHE_STARTED') {
          if (data.total === 0) {
            updateOfflineCacheUi('変更されたファイルはありません。保存状態を確定しています…', true);
          } else {
            var unchangedSuffix = data.unchanged ? '（' + data.unchanged + ' 件は再取得不要）' : '';
            updateOfflineCacheUi('0 / ' + data.total + ' ファイルを更新中…' + unchangedSuffix, true);
          }
        } else if (data.type === 'CACHE_PROGRESS') {
          var suffix = data.failed ? '（失敗 ' + data.failed + '）' : '';
          if (data.completed === data.total && !data.failed) {
            updateOfflineCacheUi('ネットワーク取得完了。保存内容を確定しています…', true);
          } else {
            updateOfflineCacheUi(data.completed + ' / ' + data.total + ' ファイルを更新中…' + suffix, true);
          }
        } else if (data.type === 'CACHE_FINALIZING') {
          updateOfflineCacheUi(
            data.completed + ' / ' + data.total + ' ファイルの保存内容を確定中…',
            true
          );
        } else if (data.type === 'CACHE_CLEANUP') {
          updateOfflineCacheUi('保存内容を整理しています…', true);
        } else if (data.type === 'CACHE_COMPLETE') {
          if (data.failed) {
            updateOfflineCacheUi('保存完了：' + data.succeeded + ' 件成功、' + data.failed + ' 件失敗。前回の保存成功記録は維持します。', false);
          } else {
            var savedAt = new Date().toISOString();
            var stored = writeOfflineCacheState({
              schemaVersion: 1,
              savedAt: savedAt,
              siteRevision: data.siteRevision || null,
              siteUpdatedAt: data.siteUpdatedAt || null,
              fileCount: data.succeeded
            });
            if (data.siteRevision || data.siteUpdatedAt) {
              currentSiteMeta = {
                revision: data.siteRevision || null,
                updatedAt: data.siteUpdatedAt || null
              };
            }
            var updateSummary = typeof data.updated === 'number'
              ? '（全 ' + data.succeeded + ' 件、今回更新 ' + data.updated + ' 件）'
              : '（' + data.succeeded + ' 件）';
            updateOfflineCacheUi(stored
              ? '教材のオフライン保存が完了しました' + updateSummary + '。'
              : '教材は保存できましたが、保存日時をブラウザに記録できませんでした。', false);
            renderOfflineCacheMetadata();
          }
        } else if (data.type === 'CACHE_ERROR') {
          updateOfflineCacheUi(data.message || '教材を保存できませんでした。', false);
          renderOfflineCacheMetadata();
        } else if (data.type === 'CACHE_BUSY') {
          updateOfflineCacheUi('別の保存処理が進行中です。', false);
        }
      });
    }

    window.addEventListener('online', function () {
      refreshSiteMeta();
    });
    window.addEventListener('offline', function () {
      renderOfflineCacheMetadata();
    });
  </script>
  <script src="math-renderer.js"></script>
  <script src="numerical-lab-runtime.js"></script>
  <script src="dream-theater-navigation.js"></script>
  <script>
    function solutionDetailsPlugin(hook) {
      hook.afterEach(function (html) {
        return html.replace(
          /<!-- solution-start -->([\s\S]*?)<!-- solution-end -->/g,
          '<details class="solution-details"><summary>解答を表示</summary><div class="solution-body">$1</div></details>'
        );
      });
    }

    function offlineCacheStatusPlugin(hook) {
      hook.doneEach(function () {
        if (!document.getElementById('offline-cache-state')) return;
        renderOfflineCacheMetadata();
        refreshSiteMeta();
      });
    }

    var navigationObserver = null;
    var observedSidebar = null;
    var searchResultsObserver = null;
    var observedSearchPanel = null;
    var navigationListenersInstalled = false;
    var lastDreamRoute = null;
    var lastDreamNav = null;
    var lastStandardRoute = null;
    var lastStandardNav = null;
    var lastContentRoute = null;

    function canonicalNavigationRoute(value) {
      var route = String(value || '').replace(/^#\/?/, '').replace(/^\/+/, '');
      try {
        route = decodeURIComponent(route);
      } catch (error) {
        console.warn('Navigation route could not be decoded:', error);
      }
      return route
        .replace(/[?#].*$/, '')
        .replace(/\.md$/i, '')
        .replace(/\/index$/i, '')
        .replace(/\/+$/, '');
    }

    function isDreamTheaterRoute(currentRoute) {
      var config = window.DreamTheaterNavigation;
      return Boolean(
        config &&
        Array.isArray(config.routes) &&
        config.routes.indexOf(currentRoute) >= 0
      );
    }

    function decorateNavigationLabels(root) {
      if (!root) return;
      root.querySelectorAll('a, summary, strong').forEach(function (element) {
        var label = String(element.textContent || '').replace(/\s+/g, ' ').trim();
        if (!label) return;
        if (!element.getAttribute('title')) element.setAttribute('title', label);
        if (
          (element.tagName === 'A' || element.tagName === 'SUMMARY') &&
          !element.getAttribute('aria-label')
        ) {
          element.setAttribute('aria-label', label);
        }
      });
    }

    function syncDreamTheaterSidebar(currentRoute) {
      var config = window.DreamTheaterNavigation;
      var isDreamTheater = isDreamTheaterRoute(currentRoute);
      document.body.classList.toggle('dream-theater-route', isDreamTheater);

      var existing = document.querySelector('.dream-theater-sidebar-nav');
      if (!isDreamTheater) {
        if (existing) existing.remove();
        lastDreamRoute = null;
        lastDreamNav = null;
        return false;
      }

      var sidebar = document.querySelector('.sidebar');
      var standardNav = sidebar && sidebar.querySelector('.sidebar-nav');
      if (!sidebar || !standardNav || !config || !config.html) return true;

      var nav = existing;
      if (!nav) {
        nav = document.createElement('nav');
        nav.className = 'dream-theater-sidebar-nav';
        nav.setAttribute('aria-label', 'DREAM THEATER ナビゲーション');
        nav.innerHTML = config.html;
        standardNav.insertAdjacentElement('afterend', nav);
      }

      decorateNavigationLabels(nav);
      var routeChanged = nav !== lastDreamNav || currentRoute !== lastDreamRoute;
      if (routeChanged) {
        nav.querySelectorAll('details').forEach(function (details) {
          details.open = false;
        });
      }

      nav.querySelectorAll('a[data-dream-route]').forEach(function (link) {
        link.classList.toggle(
          'active',
          canonicalNavigationRoute(link.getAttribute('data-dream-route')) === currentRoute
        );
      });

      var active = nav.querySelector('a[data-dream-route].active');
      for (var node = active && active.parentElement; node && node !== nav; node = node.parentElement) {
        if (node.tagName === 'DETAILS') node.open = true;
      }

      lastDreamRoute = currentRoute;
      lastDreamNav = nav;
      return true;
    }

    function directChildByTag(parent, tagName) {
      for (var i = 0; i < parent.children.length; i += 1) {
        if (parent.children[i].tagName === tagName) return parent.children[i];
      }
      return null;
    }

    function setSidebarFoldOpen(item, open) {
      item.classList.toggle('sidebar-fold-open', open);
      var toggle = directChildByTag(item, 'BUTTON');
      if (toggle) toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    function prepareStandardSidebar(nav) {
      decorateNavigationLabels(nav);
      nav.querySelectorAll('li').forEach(function (item) {
        var childList = directChildByTag(item, 'UL');
        if (!childList) return;

        item.classList.add('sidebar-foldable');
        var toggle = directChildByTag(item, 'BUTTON');
        if (!toggle || !toggle.classList.contains('sidebar-fold-toggle')) {
          toggle = document.createElement('button');
          toggle.type = 'button';
          toggle.className = 'sidebar-fold-toggle';
          toggle.setAttribute('aria-label', 'この項目を開閉');
          toggle.setAttribute('title', 'この項目を開閉');
          toggle.addEventListener('click', function () {
            setSidebarFoldOpen(item, !item.classList.contains('sidebar-fold-open'));
          });
          item.insertBefore(toggle, item.firstChild);
          setSidebarFoldOpen(item, false);
        }
      });
    }

    function findStandardRouteLink(nav, currentRoute) {
      var fallback = null;
      var direct = null;

      nav.querySelectorAll('a[href]').forEach(function (link) {
        var href = link.getAttribute('href') || '';
        if (canonicalNavigationRoute(href) !== currentRoute) return;
        if (!fallback) fallback = link;
        if (href.indexOf('?id=') === -1 && href.indexOf('&id=') === -1 && !direct) {
          direct = link;
        }
      });

      return direct || fallback || nav.querySelector('a.active');
    }

    function syncStandardSidebar(currentRoute, pending) {
      if (isDreamTheaterRoute(currentRoute)) return;

      var nav = document.querySelector('.sidebar .sidebar-nav');
      if (!nav) return;

      prepareStandardSidebar(nav);
      var routeChanged = nav !== lastStandardNav || currentRoute !== lastStandardRoute;
      if (routeChanged) {
        nav.querySelectorAll('li.sidebar-foldable').forEach(function (item) {
          setSidebarFoldOpen(item, false);
        });
      }

      nav.querySelectorAll('a.route-pending-active').forEach(function (link) {
        link.classList.remove('route-pending-active');
      });

      var activeLink = findStandardRouteLink(nav, currentRoute);
      if (pending && activeLink) activeLink.classList.add('route-pending-active');

      for (var node = activeLink && activeLink.parentElement; node && node !== nav; node = node.parentElement) {
        if (node.tagName === 'LI' && node.classList.contains('sidebar-foldable')) {
          setSidebarFoldOpen(node, true);
        }
      }

      lastStandardRoute = currentRoute;
      lastStandardNav = nav;
    }

    function resetContentScrollForRoute(routeValue) {
      var currentRoute = canonicalNavigationRoute(routeValue);
      if (!currentRoute) {
        lastContentRoute = currentRoute;
        return;
      }
      if (lastContentRoute === null) {
        lastContentRoute = currentRoute;
        return;
      }
      if (currentRoute === lastContentRoute) return;

      lastContentRoute = currentRoute;
      var scrollingElement = document.scrollingElement || document.documentElement || document.body;
      if (scrollingElement) scrollingElement.scrollTop = 0;
      window.scrollTo(0, 0);

      var content = document.querySelector('.content');
      if (content && typeof content.scrollTop === 'number') content.scrollTop = 0;
    }

    function syncSearchScope(currentRoute) {
      var search = document.querySelector('.search');
      if (!search) return;

      var input = search.querySelector('input[type="search"]');
      var panel = search.querySelector('.results-panel');
      var dreamOnly = isDreamTheaterRoute(currentRoute);
      var placeholder = dreamOnly ? 'DREAM THEATERを検索' : '教材を検索';

      if (input) {
        input.setAttribute('placeholder', placeholder);
        input.setAttribute('aria-label', placeholder);
      }
      if (!panel) return;

      var config = window.DreamTheaterNavigation;
      var allowedRoutes = new Set(
        dreamOnly && config && Array.isArray(config.routes) ? config.routes : []
      );
      var visibleCount = 0;
      var posts = panel.querySelectorAll('.matching-post');

      posts.forEach(function (post) {
        var link = post.querySelector('a[href]');
        var allowed = !dreamOnly || Boolean(
          link && allowedRoutes.has(canonicalNavigationRoute(link.getAttribute('href')))
        );
        post.hidden = !allowed;
        if (allowed) visibleCount += 1;
      });

      var pluginEmpty = panel.querySelector('p.empty:not(.dream-theater-search-empty)');
      if (pluginEmpty) {
        var emptyText = dreamOnly
          ? '該当するDREAM THEATER教材が見つかりません'
          : '該当する教材が見つかりません';
        if (pluginEmpty.textContent !== emptyText) pluginEmpty.textContent = emptyText;
      }

      var scopedEmpty = panel.querySelector('.dream-theater-search-empty');
      var query = input ? input.value.trim() : '';
      var needsScopedEmpty = dreamOnly && query && posts.length > 0 && visibleCount === 0;

      if (needsScopedEmpty && !scopedEmpty) {
        scopedEmpty = document.createElement('p');
        scopedEmpty.className = 'empty dream-theater-search-empty';
        scopedEmpty.textContent = '該当するDREAM THEATER教材が見つかりません';
        panel.appendChild(scopedEmpty);
      } else if (!needsScopedEmpty && scopedEmpty) {
        scopedEmpty.remove();
      }
    }

    function syncNavigationState(routeValue, pending) {
      var currentRoute = canonicalNavigationRoute(routeValue);
      document.body.classList.toggle('navigation-pending', Boolean(pending));

      resetContentScrollForRoute(routeValue);
      syncSearchScope(currentRoute);
      if (syncDreamTheaterSidebar(currentRoute)) return;
      syncStandardSidebar(currentRoute, pending);
    }

    function navigationTargetFromLink(link) {
      if (!link || link.hasAttribute('data-no-router')) return null;
      var href = link.getAttribute('href') || '';
      if (!href || /^(?:https?:|mailto:|tel:)/i.test(href) || /^#[^/]/.test(href)) return null;
      return canonicalNavigationRoute(href);
    }

    function ensureNavigationObserver() {
      var sidebar = document.querySelector('.sidebar');
      if (!sidebar || typeof MutationObserver === 'undefined') return;
      if (navigationObserver && observedSidebar === sidebar) return;

      if (navigationObserver) navigationObserver.disconnect();
      observedSidebar = sidebar;
      navigationObserver = new MutationObserver(function (mutations) {
        var changed = mutations.some(function (mutation) {
          return mutation.type === 'childList' && (mutation.addedNodes.length || mutation.removedNodes.length);
        });
        if (!changed) return;

        window.requestAnimationFrame(function () {
          syncNavigationState(
            window.location.hash,
            document.body.classList.contains('navigation-pending')
          );
        });
      });
      navigationObserver.observe(sidebar, { childList: true, subtree: true });
    }

    function ensureSearchResultsObserver() {
      var panel = document.querySelector('.search .results-panel');
      if (!panel || typeof MutationObserver === 'undefined') return;
      if (searchResultsObserver && observedSearchPanel === panel) return;

      if (searchResultsObserver) searchResultsObserver.disconnect();
      observedSearchPanel = panel;
      searchResultsObserver = new MutationObserver(function () {
        syncSearchScope(canonicalNavigationRoute(window.location.hash));
      });
      searchResultsObserver.observe(panel, { childList: true, subtree: true });
    }

    function installNavigationListeners() {
      if (navigationListenersInstalled) return;
      navigationListenersInstalled = true;

      document.addEventListener('click', function (event) {
        var link = event.target.closest && event.target.closest('.sidebar a[href]');
        if (!link) return;
        var target = navigationTargetFromLink(link);
        if (target === null) return;
        syncNavigationState(
          target,
          target !== canonicalNavigationRoute(window.location.hash)
        );
      });

      document.addEventListener('input', function (event) {
        if (!event.target.matches || !event.target.matches('.search input[type="search"]')) return;
        window.requestAnimationFrame(function () {
          ensureSearchResultsObserver();
          syncSearchScope(canonicalNavigationRoute(window.location.hash));
        });
      });

      window.addEventListener('hashchange', function () {
        syncNavigationState(window.location.hash, true);
      });
    }

    function navigationStatePlugin(hook) {
      hook.doneEach(function () {
        installNavigationListeners();
        ensureNavigationObserver();
        ensureSearchResultsObserver();
        syncNavigationState(window.location.hash, false);
      });

      hook.ready(function () {
        installNavigationListeners();
        ensureNavigationObserver();
        ensureSearchResultsObserver();
        syncNavigationState(window.location.hash, false);
      });
    }

    window.$docsify = {
      name: '統計検定1級 対策教材',
      repo: 'InSuns21/toukei-kentei_grade1_preparation',
      homepage: 'home.md',
      loadSidebar: true,
      relativePath: false,
      auto2top: true,
      subMaxLevel: 2,
      search: {
        placeholder: '教材を検索',
        noData: '該当する教材が見つかりません',
        depth: 6
      },
      plugins: [window.ToukeiMathRenderer.docsifyPlugin, window.ToukeiNumericalLab.docsifyPlugin, solutionDetailsPlugin, offlineCacheStatusPlugin, navigationStatePlugin]
    };
  </script>
